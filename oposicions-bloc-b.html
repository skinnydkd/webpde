                <TheoryBlock title="4.3. Impostos: incidència fiscal i falca fiscal" color="green">
                    <p>
                        Quan l'Estat estableix un <strong>impost unitari</strong> (t € per unitat venuda) sobre un bé, es crea una <strong>falca fiscal</strong> entre el preu que paga el comprador (P<sub>c</sub>) i el preu que rep el venedor (P<sub>v</sub>): P<sub>c</sub> = P<sub>v</sub> + t.
                    </p>
                    <p>
                        <strong>Incidència fiscal:</strong> la qüestió clau no és qui paga legalment l'impost (incidència legal), sinó qui suporta realment la càrrega econòmica (incidència econòmica). La resposta depén de les <strong>elasticitats relatives</strong> d'oferta i demanda:
                    </p>
                    <p>
                        - Si la <strong>demanda és més inelàstica</strong> que l'oferta, els consumidors suporten la major part de l'impost (el preu puja quasi en la quantia de l'impost).
                    </p>
                    <p>
                        - Si l'<strong>oferta és més inelàstica</strong> que la demanda, els productors suporten la major part (el preu amb prou feines puja).
                    </p>
                    <p>
                        - <em>«El costat més inelàstic del mercat suporta la major part de la càrrega fiscal»</em>: regla fonamental de la incidència fiscal.
                    </p>
                    <p>
                        A més de l'efecte distributiu, l'impost genera una <strong>pèrdua irrecuperable d'eficiència</strong> (triangle de pes mort): es deixen de realitzar intercanvis que haurien sigut mútuament beneficiosos sense l'impost. La magnitud de la PIE depén de les elasticitats: com més elàstiques siguen l'oferta i la demanda, major és la distorsió.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Cuña fiscal: Pc = Pv + t    |    Carga del consumidor ∝ 1/|Ed|    |    Carga del productor ∝ 1/Es"
                    desc="El costat més inelàstic del mercat suporta la major part de la càrrega fiscal"
                />

                <TheoryBlock title="4.4. Subvencions: efectes simètrics als impostos" color="amber">
                    <p>
                        Una <strong>subvenció unitària</strong> (s € per unitat) té efectes <strong>simètrics</strong> als de l'impost: crea una falca fiscal «negativa» (P<sub>c</sub> = P<sub>v</sub> − s), de manera que el preu que paga el comprador és inferior al que rep el venedor.
                    </p>
                    <p>
                        La subvenció augmenta la quantitat intercanviada per damunt del nivell d'equilibri competitiu, la qual cosa genera una <strong>pèrdua d'eficiència</strong> (es produeixen unitats el cost marginal de les quals supera el seu valor per al consumidor). La distribució del benefici de la subvenció entre compradors i venedors segueix la mateixa lògica que l'impost: <em>el costat més inelàstic capta la major part del benefici</em>.
                    </p>
                    <p>
                        No obstant això, les subvencions poden estar justificades quan corregeixen <strong>externalitats positives</strong> (educació, sanitat, I+D, energies renovables): en subsidiar béns amb beneficis socials superiors als privats, s'acosta la producció a l'òptim social.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. Aranzels i quotes (breu referència)" color="violet">
                    <p>
                        Els <strong>aranzels</strong> (impostos a les importacions) i les <strong>quotes</strong> (límits quantitatius a les importacions) són formes d'intervenció en mercats oberts al comerç internacional. Els seus efectes poden analitzar-se amb les mateixes ferramentes d'oferta i demanda:
                    </p>
                    <p>
                        L'aranzel eleva el preu domèstic per damunt del preu mundial, protegeix els productors nacionals però perjudica els consumidors i genera una pèrdua irrecuperable d'eficiència. La quota té efectes similars, però a més crea <strong>rendes de quota</strong> per a aquells que posseeixen les llicències d'importació. Esta anàlisi es desenvolupa amb major profunditat en el <strong>Bloc D</strong> (Economia internacional).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.6. Justificació de les intervencions: fallades de mercat, equitat i béns de mèrit" color="cyan">
                    <p>
                        Les intervencions de l'Estat en el mercat es justifiquen fonamentalment per tres raons:
                    </p>
                    <p>
                        <strong>1. Eficiència (fallades de mercat):</strong> quan el mercat no condueix a un resultat eficient per la presència d'externalitats, béns públics, informació asimètrica o poder de mercat, la intervenció pot millorar l'assignació de recursos. Els impostos pigouvians (Pigou, 1920) corregeixen externalitats negatives; les subvencions corregeixen externalitats positives.
                    </p>
                    <p>
                        <strong>2. Equitat (justícia distributiva):</strong> fins i tot si el mercat fora eficient, el resultat podria considerar-se inequitatiu. Els preus màxims (habitatge assequible), els salaris mínims (protecció del treballador) i els impostos progressius busquen redistribuir la renda en favor dels col·lectius més vulnerables. El <strong>segon teorema del benestar</strong> (Arrow, 1951) assenyala que qualsevol assignació eficient pot aconseguir-se mitjançant transferències de suma fixa, sense necessitat de distorsionar els preus, encara que això és difícil en la pràctica.
                    </p>
                    <p>
                        <strong>3. Béns de mèrit i demèrit</strong> (Musgrave, 1959): béns el consum dels quals la societat desitja fomentar (educació, cultura, vacunació) o desincentivar (tabac, alcohol, joc), independentment de les preferències individuals, per consideracions d'interés general.
                    </p>
                </TheoryBlock>

                    <p>
                        En primer lloc, la <strong>formació de l'equilibri</strong> com a resultat de la intersecció d'oferta i demanda (Marshall, 1890), amb el mecanisme d'ajust a través d'excessos d'oferta i demanda, i la distinció entre estabilitat walrasiana (ajust per preus) i marshalliana (ajust per quantitats). També s'ha diferenciat l'equilibri parcial del general (Walras, Arrow-Debreu).

                    </p>
                    <p>

                    </p>
                    <p>
                        En quart lloc, les <strong>intervencions de l'Estat</strong>: preus màxims (escassetat, mercat negre, deteriorament de qualitat), preus mínims (excedents, desocupació), impostos (falca fiscal, incidència segons elasticitats) i subvencions (efectes simètrics). S'ha conclòs amb la justificació de les intervencions per raons d'eficiència (fallades de mercat), equitat (justícia distributiva) i mèrit (Musgrave).
                    </p>

                    </p>

                    </p>
                    <p>
                        <strong>Si P {'<'} CVMe:</strong> convé tancar, perquè els ingressos no cobreixen ni tan sols els costos variables. Produir augmenta les pèrdues respecte a tancar. El <strong>punt de tancament</strong> se situa en el mínim del CVMe.
                    </p>
                    <p>
                        <strong>Nota:</strong> «tancar» a curt termini (cessar temporalment la producció) no és el mateix que «abandonar el mercat» a llarg termini (liquidar i eixir de la indústria). A curt termini hi ha costos fixos que es paguen en qualsevol cas; a llarg termini, tots els costos són variables.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.6. La corba d'oferta de l'empresa competitiva" color="rose">
                    <p>
                        La <strong>corba d'oferta a curt termini de l'empresa competitiva</strong> és la seua <strong>corba de CMg per damunt del mínim del CVMe</strong>. Per davall d'eixe punt, l'empresa tanca i la seua oferta és zero.
                    </p>
                    <p>
                        La <strong>corba d'oferta del mercat</strong> a curt termini és la suma horitzontal de les corbes d'oferta individuals de totes les empreses del sector.
                    </p>
                    <p>
                        Esta derivació de la corba d'oferta a partir de la condició de maximització del benefici (P = CMg) és un dels resultats més elegants de la microeconomia: <em>la llei de l'oferta (relació positiva entre preu i quantitat oferida) no és un supòsit, sinó una conseqüència de la maximització del benefici amb costos marginals creixents</em>.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 4 ─────────────────────────────────────── */}
            <Card title="4. L'equilibri a llarg termini" icon="📘">
                <TheoryBlock title="4.1. El mecanisme d'entrada i eixida d'empreses" color="pink">
                    <p>
                        A llarg termini, el supòsit de <strong>lliure entrada i eixida</strong> té conseqüències crucials. Si les empreses existents obtenen <strong>beneficis extraordinaris</strong> (P {'>'} CMe), noves empreses entren en el mercat, atretes per eixos beneficis. L'entrada de noves empreses:
                    </p>
                    <p>
                        (1) Augmenta l'oferta del mercat (desplaçament cap a la dreta).
                    </p>
                    <p>
                        (2) Redueix el preu d'equilibri.
                    </p>
                    <p>
                        (3) Redueix els beneficis de totes les empreses.
                    </p>
                    <p>
                        El procés continua fins que els beneficis es redueixen a zero (benefici econòmic = 0). Simètricament, si les empreses pateixen <strong>pèrdues</strong> (P {'<'} CMe), algunes ixen del mercat, l'oferta disminueix, el preu puja i les pèrdues es redueixen fins a desaparéixer.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Benefici econòmic zero a llarg termini" color="blue">
                    <p>
                        En l'<strong>equilibri a llarg termini</strong> de competència perfecta, totes les empreses obtenen un <strong>benefici econòmic igual a zero</strong>:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="P = CMg = CMe mínimo (LP)  →  Beneficio económico = 0"
                    desc="En l'equilibri a llarg termini, el preu iguala el cost mitjà mínim a llarg termini"
                />

                <TheoryBlock color="blue">
                    <p>
                        Això no significa que les empreses no guanyen diners: obtenen un <strong>benefici comptable positiu</strong> que cobreix exactament el cost d'oportunitat del capital (la remuneració «normal» de l'empresari). El que desapareix és el <em>benefici extraordinari</em> (benefici per damunt del normal).
                    </p>
                    <p>
                        Totes les empreses produeixen en el <strong>punt d'escala òptima</strong>: el mínim de la corba de costos mitjans a llarg termini. No hi ha malbaratament ni ineficiència: cada empresa produeix al menor cost possible.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Eficiència assignativa i productiva" color="green">
                    <p>
                        L'equilibri a llarg termini de competència perfecta aconsegueix dos tipus d'eficiència:
                    </p>
                    <p>
                        <strong>Eficiència assignativa</strong> (P = CMg): el preu que paguen els consumidors reflecteix exactament el cost marginal de produir l'última unitat. Els recursos s'assignen de manera que la valoració dels consumidors (mesurada pel preu de demanda) coincideix amb el cost social de producció (mesurat pel CMg). No es produeix ni de més ni de menys: la quantitat és socialment òptima.
                    </p>
                    <p>
                        <strong>Eficiència productiva</strong> (P = CMe mínim): cada empresa produeix al menor cost mitjà possible, utilitzant la tecnologia més eficient i operant en l'escala òptima. No hi ha malbaratament de recursos en la producció.
                    </p>
                    <p>
                        La combinació d'ambdues eficiències implica que l'equilibri de competència perfecta maximitza el benestar social (excedent total). És el resultat del <strong>primer teorema fonamental del benestar</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. La mà invisible i el primer teorema del benestar" color="amber">
                    <p>
                        El resultat d'eficiència de la competència perfecta connecta directament amb la intuïció d'<strong>Adam Smith</strong> (1776) sobre la <strong>«mà invisible»</strong>: els individus, perseguint el seu propi interés egoista, són guiats «com per una mà invisible» a promoure el benestar social, sense pretendre-ho ni saber-ho.
                    </p>
                    <p>
                        La formalització rigorosa d'esta idea és el <strong>primer teorema fonamental del benestar</strong>, demostrat per <strong>Kenneth Arrow</strong> i <strong>Gérard Debreu</strong> (1954): davall les condicions de competència perfecta (i absència d'externalitats i béns públics), <em>tot equilibri competitiu és eficient en el sentit de Pareto</em>. És a dir, no és possible millorar la situació de cap agent sense empitjorar la d'almenys un altre.
                    </p>
                    <p>
                        Este teorema no diu que el resultat siga <em>just</em> (la distribució pot ser molt desigual), ni que siga l'únic possible (el <strong>segon teorema</strong> estableix que qualsevol assignació eficient pot aconseguir-se mitjançant una redistribució inicial adequada seguida de mercats competitius). Però sí estableix que els mercats competitius, quan funcionen correctament, no malbaraten recursos.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 5 ─────────────────────────────────────── */}
            <Card title="5. Valoració del model i rellevància curricular" icon="📘">
                <TheoryBlock title="5.1. Virtuts del model" color="pink">
                    <p>
                        <strong>Eficiència:</strong> la competència perfecta aconsegueix simultàniament l'eficiència assignativa (P = CMg) i la productiva (P = CMe mínim). Maximitza l'excedent total de la societat.
                    </p>
                    <p>
                        <strong>Benestar del consumidor:</strong> els consumidors paguen el preu més baix compatible amb els costos de producció. No hi ha marges de benefici extraordinaris ni poder de mercat que permeta preus abusius.
                    </p>
                    <p>
                        <strong>Innovació i dinamisme:</strong> la pressió competitiva obliga les empreses a buscar contínuament formes de reduir costos i millorar l'eficiència. Encara que este aspecte dinàmic és objecte de debat (Schumpeter va argumentar que cert poder de monopoli és necessari per a finançar la innovació).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Limitacions del model" color="blue">
                    <p>
                        <strong>Irrealisme dels supòsits:</strong> cap mercat real compleix tots els supòsits simultàniament. La informació mai és perfecta, els productes rarament són completament homogenis, les barreres d'entrada existeixen en major o menor grau i els agents no sempre actuen racionalment.
                    </p>
                    <p>
                        <strong>No contempla externalitats:</strong> el model assumeix que totes les conseqüències de la producció i el consum es reflecteixen en els preus. Quan hi ha externalitats (contaminació, educació, congestió), l'equilibri competitiu ja no és eficient.
                    </p>
                    <p>
                        <strong>No contempla béns públics:</strong> els béns públics (defensa, enllumenat) no poden ser proveïts eficientment per un mercat competitiu, perquè són no excloïbles i no rivals.
                    </p>
                    <p>
                        <strong>No garanteix equitat:</strong> l'eficiència no implica justícia. L'equilibri de competència perfecta pot ser eficient però extremadament desigual.
                    </p>
                    <p>
                        <strong>Crítica de Schumpeter:</strong> <strong>Joseph Schumpeter</strong> (1942) va argumentar en <em>Capitalisme, socialisme i democràcia</em> que la competència perfecta no és el motor del progrés econòmic. La verdadera força del capitalisme és la <strong>«destrucció creativa»</strong>: innovacions radicals impulsades per empreses amb cert poder de mercat que poden finançar la I+D. En esta visió, el monopoli temporal (protegit per patents) és el preu que paga la societat per la innovació.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Mercats aproximats a la competència perfecta" color="green">
                    <p>
                        Encara que cap mercat compleix tots els supòsits, alguns s'aproximen raonablement:
                    </p>
                    <p>
                        <strong>Productes agrícoles:</strong> molts agricultors, producte relativament homogeni (blat, arròs, dacsa), preus determinats en mercats organitzats. No obstant això, les subvencions agrícoles (PAC) distorsionen el mercat.
                    </p>
                    <p>
                        <strong>Matèries primeres:</strong> mercats de commodities (petroli, or, coure) negociats en borses organitzades amb alta transparència de preus.
                    </p>
                    <p>
                        <strong>Mercats financers:</strong> els mercats borsaris amb molts participants, informació àmpliament disponible (encara que la hipòtesi del mercat eficient d'<strong>Eugene Fama</strong>, 1970, és objecte de debat després de la crisi de 2008).
                    </p>
                    <p>
                        <strong>Comerç electrònic:</strong> en alguns segments, Internet ha reduït les barreres d'informació i ha augmentat la comparabilitat de preus, acostant els mercats a les condicions de competència perfecta.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Connexió curricular LOMLOE" color="amber">
                    <p>
                        Els continguts d'este tema s'integren en la matèria d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022, Bloc B — Funcionament del mercat): tipus de mercat, competència perfecta, poder de mercat, eficiència.
                    </p>
                    <p>
                        També connecta amb <strong>Empresa i Disseny de Models de Negoci de 2n de Batxillerat</strong> (anàlisi de l'entorn competitiu, tipus de mercat segons estructura) i amb <strong>Economia i Emprenedoria de 4t d'ESO</strong> (comprensió bàsica de la competència i el funcionament del mercat).
                    </p>
                    <p>
                        <strong>Competències clau:</strong> STEM (modelització gràfica i algebraica de l'equilibri de l'empresa), CC (valoració de l'eficiència i l'equitat del mercat), CE (comprensió de l'entorn competitiu com a condicionant de les decisions empresarials), CPSAA (reflexió sobre les conseqüències de la competència per al consumidor).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
            <Card title="Conclusió" icon="📌">

                    <p>
                        Al llarg d'este tema s'ha desenvolupat l'anàlisi completa del model de <strong>competència perfecta</strong>, l'estructura de mercat que serveix com a referència teòrica fonamental en microeconomia.
                    </p>
                    <p>
                        En primer lloc, s'ha presentat la <strong>panoràmica de les estructures de mercat</strong>, amb els criteris de classificació (nombre d'agents, diferenciació, barreres, informació, poder de mercat) i la importància del model de competència perfecta com a <em>benchmark</em> d'eficiència.
                    </p>
                    <p>
                        En segon lloc, s'han detallat els <strong>cinc supòsits</strong> del model (atomització, producte homogeni, informació perfecta, lliure entrada i eixida, mobilitat de factors) i la seua conseqüència fonamental: l'empresa és <strong>preu-acceptant</strong> (P = IMg = IMe).
                    </p>
                    <p>
                        En tercer lloc, s'ha analitzat l'<strong>equilibri a curt termini</strong>: la condició de maximització (P = CMg), els tres possibles resultats (beneficis extraordinaris, normals i pèrdues), la decisió de tancar (P {'<'} CVMe mínim) i la derivació de la corba d'oferta de l'empresa.
                    </p>
                    <p>
                        En quart lloc, l'<strong>equilibri a llarg termini</strong>: el mecanisme d'entrada i eixida que condueix a un benefici econòmic nul (P = CMg = CMe mínim), la doble eficiència (assignativa i productiva) i la seua connexió amb la mà invisible d'Adam Smith i el primer teorema del benestar (Arrow-Debreu, 1954).
                    </p>
                    <p>
                        Finalment, s'ha oferit una <strong>valoració equilibrada</strong> del model: les seues virtuts (eficiència, benestar del consumidor), les seues limitacions (irrealisme dels supòsits, absència d'externalitats i béns públics, no garantia d'equitat) i la crítica schumpeteriana (la competència perfecta no explica la innovació). Des de la perspectiva docent, la competència perfecta és el punt de partida imprescindible per a comprendre el funcionament dels mercats, avaluar les desviacions de la competència i fonamentar la regulació i les polítiques de competència.
                    </p>
                </div>
            </Card>

                    </p>
                    <p>
                        La teoria del monopoli és un pilar essencial de la microeconomia perquè il·lustra de forma nítida com l'absència de competència genera <strong>ineficiència assignativa</strong> (P {'>'} CMg), <strong>pèrdua irrecuperable de benestar</strong> (triangle de Harberger) i potencial <strong>cerca de rendes</strong> (Tullock, Krueger). Al mateix temps, obri el debat sobre si el monopoli pot, en determinades circumstàncies, afavorir la innovació (Schumpeter, 1942).
                    </p>
                    <p>
                        Des de la perspectiva curricular, este tema s'emmarca en els sabers bàsics del bloc «Funcionament del mercat» d'Economia de 1r de Batxillerat (Real Decreto 243/2022), connectant amb les competències específiques CE1 (funcionament del sistema econòmic), CE3 (anàlisi de les estructures de mercat) i CE6 (valoració de les fallades del mercat i la regulació). La LOMLOE subratlla la importància que l'alumnat comprenga les limitacions del mercat i la necessitat de la intervenció pública, desenvolupant les competències STEM (modelització), CC (equitat i benestar) i CE (entorn competitiu).
                    </p>
                    <p>
                        El tema s'estructura en sis epígrafs: concepte i fonts de poder de monopoli; decisió de producció del monopolista; efectes sobre el benestar; discriminació de preus; regulació del monopoli; i rellevància curricular.
                    </p>
                </div>
            </Card>

            {/* ── EPÍGRAFE 1 ─────────────────────────────────────── */}
            <Card title="1. Concepte i fonts de poder de monopoli" icon="📘">
                <TheoryBlock title="1.1. Definició de monopoli" color="purple">
                    <p>
                        Un <strong>monopoli</strong> és una estructura de mercat en la qual existeix un <strong>únic venedor</strong> que ofereix un bé o servei per al qual <strong>no existeixen substitutius propers</strong>. El monopolista posseeix, per tant, <strong>poder de fixació de preus</strong>: pot triar el preu o la quantitat que maximitza el seu benefici, però no ambdós simultàniament, ja que està subjecte a la restricció de la corba de demanda del mercat.
                    </p>
                    <p>
                        A diferència de l'empresa competitiva, que és preu-acceptant i s'enfronta a una demanda horitzontal, el monopolista s'enfronta a tota la <strong>corba de demanda del mercat</strong>, que té pendent negatiu. Per això, per a vendre una unitat addicional ha de reduir el preu no sols d'eixa unitat, sinó de <em>totes</em> les unitats que ven, la qual cosa fa que el seu ingrés marginal siga inferior al preu (IMg {'<'} P).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Barreres d'entrada" color="blue">
                    <p>
                        La condició necessària per a l'existència i el manteniment d'un monopoli és la presència de <strong>barreres d'entrada</strong> que impedeixen o dissuadeixen l'entrada de competidors potencials. Les principals categories són:
                    </p>
                    <p>
                        <strong>1. Barreres legals:</strong> patents (que atorguen exclusivitat temporal sobre una invenció), llicències i concessions administratives, franquícies estatals (com el monopoli postal en certs països) i drets d'autor. Estes barreres són creades deliberadament per l'Estat per a protegir la innovació o garantir un servei públic.
                    </p>
                    <p>
                        <strong>2. Barreres naturals:</strong> sorgeixen quan la tecnologia de producció presenta <strong>economies d'escala</strong> tan pronunciades que un sol productor pot abastir tot el mercat a un cost inferior al que tindrien dues o més empreses. Esta és la base del <strong>monopoli natural</strong>, caracteritzat per la <strong>subadditivitat de costos</strong>: C(Q) {'<'} C(Q₁) + C(Q₂) + … per a tota partició de la producció. Exemples: distribució d'aigua, gas, xarxa elèctrica, infraestructures ferroviàries.
                    </p>
                    <p>
                        <strong>3. Control de recursos essencials:</strong> quan una empresa posseeix o controla en exclusiva un recurs indispensable per a la producció. Exemple clàssic: De Beers i el mercat de diamants (històricament).
                    </p>
                    <p>
                        <strong>4. Barreres tecnològiques i estratègiques:</strong> avantatges derivats de la corba d'aprenentatge, inversions enfonsades (<em>sunk costs</em>), efectes de xarxa (com més usuaris, més valuós el servei: plataformes digitals), o comportament estratègic del monopolista (preus predatoris, excés de capacitat) per a dissuadir l'entrada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Tipus de monopoli" color="green">
                    <p>
                        <strong>Monopoli natural:</strong> una sola empresa produeix a menor cost que diverses. Subadditivitat de costos, costos mitjans decreixents en el rang rellevant de producció. Justifica la regulació pública en lloc de la fragmentació.
                    </p>
                    <p>
                        <strong>Monopoli legal:</strong> creat per normativa estatal. Patents (temporals, incentiven la innovació), concessions, monopolis fiscals (tabac, loteries en alguns països).
                    </p>
                    <p>
                        <strong>Monopoli de recurs:</strong> basat en el control exclusiu d'un factor de producció essencial.
                    </p>
                    <p>
                        <strong>Monopoli tecnològic:</strong> derivat d'una innovació disruptiva que situa l'empresa en posició dominant fins que sorgeixen imitadors o alternatives.
                    </p>
                    <p>
                        <strong>Monopoli bilateral:</strong> situació en la qual un únic venedor s'enfronta a un únic comprador (monopsoni). El resultat depén del poder de negociació relatiu.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 2 ─────────────────────────────────────── */}
            <Card title="2. La decisió de producció del monopolista" icon="📘">
                <TheoryBlock title="2.1. La demanda del monopolista" color="amber">
                    <p>
                        A diferència de l'empresa competitiva, el monopolista s'enfronta a la <strong>corba de demanda del mercat</strong> amb pendent negatiu. Això implica que, per a vendre una unitat més, ha de <strong>reduir el preu</strong> de totes les unitats venudes. Com a conseqüència directa, l'<strong>ingrés marginal</strong> (IMg) és sempre inferior al preu (IMg {'<'} P) excepte per a la primera unitat.
                    </p>
                    <p>
                        Gràficament, si la demanda és lineal (P = a − bQ), la corba d'IMg té la <strong>mateixa ordenada en l'origen</strong> però el <strong>doble de pendent</strong> (IMg = a − 2bQ), i talla l'eix de quantitats en la meitat del punt on ho fa la demanda.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Ingrés marginal i elasticitat" color="pink">
                    <p>
                        La relació entre ingrés marginal i elasticitat-preu de la demanda (Ep) ve donada per l'expressió fonamental:
                    </p>
                    <p>
                        <strong>IMg = P(1 + 1/Ep)</strong>
                    </p>
                    <p>
                        Atés que Ep {'<'} 0, l'IMg és sempre inferior al preu. A més, esta fórmula revela que el monopolista <strong>opera sempre en el tram elàstic</strong> de la demanda (|Ep| {'>'} 1), perquè en el tram inelàstic l'IMg seria negatiu, la qual cosa significaria que augmentar la producció reduiria l'ingrés total.
                    </p>
                    <p>
                        En el punt d'elasticitat unitària (|Ep| = 1), l'IMg = 0 i l'ingrés total aconsegueix el seu màxim. Per a demanda lineal, això ocorre exactament en el punt mitjà de la corba de demanda.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Maximització de beneficis" color="violet">
                    <p>
                        El monopolista maximitza beneficis on <strong>IMg = CMg</strong>, la mateixa condició general que per a qualsevol empresa. No obstant això, la diferència fonamental amb la competència perfecta és que <strong>P {'>'} IMg = CMg</strong>, és a dir, el monopolista cobra un preu superior al cost marginal.
                    </p>
                    <p>
                        El procés de determinació de l'equilibri del monopolista és: (1) trobar la quantitat Qm on IMg = CMg; (2) projectar Qm sobre la corba de demanda per a obtindre el preu Pm que els consumidors estan disposats a pagar per eixa quantitat; (3) el benefici per unitat és Pm − CMe(Qm) i el benefici total és [Pm − CMe(Qm)] × Qm.
                    </p>
                    <p>
                        Una diferència essencial: el monopolista <strong>no té corba d'oferta</strong> en el sentit convencional, perquè no hi ha una relació unívoca entre preu i quantitat oferida. Un mateix preu pot correspondre's amb diferents quantitats depenent de la forma de la corba de demanda.
                    </p>
                </TheoryBlock>

            {/* ── EPÍGRAFE 3 ─────────────────────────────────────── */}
            <Card title="3. Efectes sobre el benestar" icon="📘">
                <TheoryBlock title="3.1. Comparació amb competència perfecta" color="red">
                    <p>
                        La comparació de l'equilibri del monopoli amb el de competència perfecta revela tres resultats fonamentals:
                    </p>
                    <p>
                        <strong>1. Preu més alt:</strong> Pm {'>'} Pc. El monopolista cobra un preu superior al que prevaleria en competència perfecta (on P = CMg).
                    </p>
                    <p>
                        <strong>2. Quantitat menor:</strong> Qm {'<'} Qc. El monopolista restringeix la producció per davall del nivell socialment òptim per a elevar el preu.
                    </p>
                    <p>
                        <strong>3. Menor excedent total:</strong> encara que el monopolista captura part de l'excedent del consumidor (que es transforma en benefici del monopolista), hi ha una part de l'excedent que simplement es perd — la pèrdua irrecuperable d'eficiència.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Pèrdua irrecuperable d'eficiència" color="cyan">
                    <p>
                        El <strong>triangle de Harberger</strong> (1954) mesura la pèrdua neta de benestar social causada pel monopoli. Representa les transaccions mútuament beneficioses que no es realitzen perquè el monopolista restringeix la producció. És l'àrea del triangle format entre la corba de demanda, la corba de CMg i les quantitats Qm i Qc.
                    </p>
                    <p>
                        <strong>Ineficiència assignativa:</strong> P {'>'} CMg implica que la societat valora les unitats addicionals (entre Qm i Qc) més del que costa produir-les, però no es produeixen. No s'aconsegueix la quantitat socialment òptima.
                    </p>
                    <p>
                        <strong>Ineficiència productiva:</strong> en no enfrontar-se a la pressió competitiva, el monopolista pot no minimitzar costos. Leibenstein (1966) va denominar això <strong>ineficiència-X</strong>: l'empresa monopolista, en no tindre la disciplina del mercat, incorre en ineficiències organitzatives, excés de personal, falta d'incentius per a la reducció de costos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Cerca de rendes" color="emerald">
                    <p>
                        <strong>Tullock (1967)</strong> i <strong>Krueger (1974)</strong> van argumentar que la pèrdua social del monopoli és major que el triangle de Harberger, perquè les empreses dediquen recursos productius a <strong>obtindre i mantindre</strong> la seua posició monopolista: lobby, litigis, campanyes per a aconseguir llicències exclusives, influència regulatòria.
                    </p>
                    <p>
                        Estos recursos (<em>rent-seeking</em>) són un cost social pur perquè no creen valor: simplement redistribueixen renda a favor del monopolista. En el cas extrem, l'empresa pot gastar en <em>rent-seeking</em> fins a un import igual al benefici monopolístic esperat, la qual cosa converteix <em>tot</em> el benefici del monopoli en pèrdua social.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Monopoli i innovació" color="purple">
                    <p>
                        <strong>Schumpeter (1942)</strong> va defendre que les grans empreses amb poder de mercat són les que més innoven, perquè poden finançar la I+D amb els seus beneficis extraordinaris i tenen incentius per a mantindre el seu avantatge competitiu mitjançant la <strong>destrucció creativa</strong>: la innovació constant que fa obsolets els productes existents.
                    </p>
                    <p>
                        <strong>Arrow (1962)</strong> va contrargumentar que una empresa en competència té <em>més</em> incentius per a innovar que un monopolista, perquè obté més guany incremental en passar de benefici zero a benefici positiu que el monopolista en reemplaçar el seu propi producte (<em>efecte de reemplaçament</em>).
                    </p>
                    <p>
                        <strong>Baumol (1982)</strong> va introduir la teoria dels <strong>mercats contestables</strong> (<em>contestable markets</em>): fins i tot un monopolista es veu obligat a comportar-se de forma competitiva si l'entrada i l'eixida són lliures i sense costos enfonsats, ja que l'amenaça d'entrada de competidors (<em>hit-and-run entry</em>) disciplina el seu comportament. La contestabilitat depén de l'absència de costos enfonsats, no del nombre d'empreses.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="Índice de Lerner: L = (P − CMg) / P = −1/Ep" desc="Mesura el poder de mercat: L = 0 (comp. perfecta), L → 1 (màxim poder)" />
            </Card>

            {/* ── EPÍGRAFE 4 ─────────────────────────────────────── */}
            <Card title="4. Discriminació de preus" icon="📘">
                <TheoryBlock title="4.1. Concepte i condicions" color="blue">
                    <p>
                        La <strong>discriminació de preus</strong> consisteix a cobrar preus diferents a distints consumidors (o per distintes unitats) pel mateix bé, sense que la diferència de preu es justifique per diferències de cost. Perquè siga possible es requereixen tres condicions:
                    </p>
                    <p>
                        <strong>1. Poder de mercat:</strong> l'empresa ha de poder fixar preus (no ser preu-acceptant).
                    </p>
                    <p>
                        <strong>2. Capacitat de segmentació:</strong> l'empresa ha de poder identificar grups amb diferent elasticitat-preu de la demanda o, almenys, oferir versions diferenciades del producte.
                    </p>
                    <p>
                        <strong>3. Impossibilitat de revenda (no arbitratge):</strong> els consumidors que compren a preu baix no poden revendre a qui pagaria un preu alt. Això és més fàcil en serveis (tall de cabell, vols, electricitat) que en béns físics.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Tipus de discriminació" color="green">
                    <p>
                        <strong>Discriminació de primer grau (perfecta):</strong> el monopolista cobra a cada consumidor el seu <strong>preu de reserva</strong> (la màxima disposició a pagar). Captura <em>tot</em> l'excedent del consumidor. No hi ha pèrdua irrecuperable d'eficiència (es produeix la quantitat competitiva), però tot el guany va al productor. Teòrica: requereix informació perfecta sobre cada consumidor.
                    </p>
                    <p>
                        <strong>Discriminació de segon grau (per quantitat o autoselecció):</strong> el monopolista ofereix diferents paquets o versions i els consumidors s'autoseleccionen. Inclou: descomptes per volum, <strong>tarifes en dues parts</strong> (quota fixa + preu per unitat: parcs d'atraccions, telecomunicacions), versions del producte (primera classe / turista, versió premium / bàsica). No requereix identificar els consumidors, sinó dissenyar opcions que els separen.
                    </p>
                    <p>
                        <strong>Discriminació de tercer grau (per grups):</strong> la forma més comuna. El monopolista identifica grups amb diferent elasticitat-preu i cobra preus distints a cada grup. Regla òptima: <strong>Pm₁/Pm₂</strong> és inversament proporcional a les elasticitats. Exemples: descomptes a estudiants i gent gran, tarifes elèctriques per horari (vall/punta), preus diferents per país.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 5 ─────────────────────────────────────── */}
            <Card title="5. Regulació del monopoli" icon="📘">
                <TheoryBlock title="5.1. Política de defensa de la competència" color="amber">
                    <p>
                        La política <strong>antitrust</strong> té com a objectiu previndre la formació de monopolis i l'abús de posició dominant. Les fites legislatives fonamentals són:
                    </p>
                    <p>
                        <strong>Estats Units:</strong> Sherman Act (1890) — prohibeix monopolització i acords restrictius; Clayton Act (1914) — prohibeix fusions anticompetitives, discriminació de preus, contractes d'exclusivitat.
                    </p>
                    <p>
                        <strong>Unió Europea:</strong> article 101 del TFUE — prohibeix acords col·lusoris; article 102 — prohibeix l'abús de posició dominant. La Comissió Europea pot imposar multes de fins al 10 % de la facturació mundial i impedir fusions anticompetitives.
                    </p>
                    <p>
                        La lluita antitrust busca l'equilibri entre promoure la competència i no penalitzar el creixement legítim per eficiència.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Regulació del monopoli natural" color="pink">
                    <p>
                        Quan el monopoli és natural (per subadditivitat de costos), la fragmentació seria ineficient. Es recorre a la <strong>regulació de preus</strong>:
                    </p>
                    <p>
                        <strong>First-best (preu = CMg):</strong> maximitza el benestar social, però si hi ha economies d'escala i el CMe és decreixent, P = CMg implica P {'<'} CMe → pèrdues per a l'empresa. Requereix un <strong>subsidi públic</strong> per a cobrir la diferència, la qual cosa planteja problemes de finançament i incentius.
                    </p>
                    <p>
                        <strong>Second-best (preu = CMe):</strong> la regla de <strong>Ramsey</strong> — es fixa un preu que cobreix els costos mitjans (benefici zero), renunciant a l'eficiència plena però sense necessitat de subsidi. És la solució pràctica més habitual.
                    </p>
                    <p>
                        <strong>Price cap (RPI − X):</strong> regulació per incentius. Es permet al monopolista pujar preus com a màxim al ritme de la inflació (RPI) menys un factor d'eficiència (X). Incentiva la reducció de costos: si l'empresa redueix costos més ràpid que X, reté la diferència com a benefici. Introduït al Regne Unit (Littlechild, 1983) i àmpliament adoptat.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Organismes reguladors" color="violet">
                    <p>
                        <strong>Espanya:</strong> la <strong>CNMC</strong> (Comisión Nacional de los Mercados y la Competencia), creada el 2013, és l'organisme independent encarregat de garantir la competència efectiva en els mercats i la regulació de sectors amb monopoli natural (telecomunicacions, energia, transport).
                    </p>
                    <p>
                        <strong>Unió Europea:</strong> la <strong>Comissió Europea</strong> (DG Competència) aplica els articles 101 i 102 del TFUE, controla les concentracions empresarials i les ajudes d'Estat. Casos emblemàtics: Microsoft, Google, Apple (ajudes d'Estat a Irlanda).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 6 ─────────────────────────────────────── */}
            <Card title="6. Rellevància curricular" icon="📘">
                <TheoryBlock title="6.1. Enquadrament normatiu" color="emerald">
                    <p>
                        Els continguts d'este tema s'integren en la matèria d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022, Bloc B — Funcionament del mercat): tipus de mercat, monopoli, poder de mercat, barreres d'entrada, regulació.

            <Card title="1. L'oligopoli: concepte i característiques" icon="📘">

                    <p>
                        L'<strong>oligopoli</strong> és una estructura de mercat en la qual un <strong>nombre reduït d'empreses</strong> controla la major part de l'oferta d'un bé o servei. La característica definitòria de l'oligopoli és la <strong>interdependència estratègica</strong>: cada empresa, en prendre decisions sobre preu, producció, publicitat o inversió, ha de considerar les reaccions esperades dels seus competidors.
                    </p>
                    <p>
                        Aquesta interdependència distingeix l'oligopoli de totes les altres estructures de mercat. En competència perfecta i monopolística, cada empresa ignora l'efecte de les seues decisions sobre les altres; en monopoli, no hi ha competidors. En oligopoli, l'empresa pensa estratègicament: <em>«si jo baixe el preu, què faran els altres?»</em>. Això converteix la <strong>teoria de jocs</strong> en l'eina analítica natural de l'oligopoli.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Característiques" color="blue">
                    <p>
                        <strong>1. Barreres d'entrada significatives:</strong> economies d'escala, inversions enfonsades elevades, tecnologia, marques consolidades, control de distribució. No tan absolutes com en monopoli, però suficients per a limitar l'entrada.
                    </p>
                    <p>

                    </p>
                    <p>

                    </p>
                    <p>
                        <strong>4. Competència no basada en preus:</strong> publicitat, diferenciació, innovació, servei postvenda, programes de fidelització. La rivalitat es canalitza per vies diferents al preu.
                    </p>
                </TheoryBlock>

            {/* ── EPÍGRAF 2 ─────────────────────────────────────── */}
            <Card title="2. Models clàssics d'oligopoli" icon="📘">
                <TheoryBlock title="2.1. Model de Cournot (1838)" color="green">
                    <p>
                        <strong>Augustin Cournot</strong> va proposar el primer model formal d'oligopoli. Els supòsits fonamentals són: duopoli (dues empreses), producte homogeni, i cada empresa tria la seua <strong>quantitat de producció</strong> simultàniament, prenent com a donada la quantitat del rival.
                    </p>
                    <p>
                        Cada empresa té una <strong>funció de reacció</strong> (o millor resposta) que indica la quantitat òptima que produeix en funció de la quantitat que espera del rival. L'<strong>equilibri de Nash-Cournot</strong> s'aconsegueix en la intersecció d'ambdues funcions de reacció: cap empresa té incentiu per a canviar la seua producció donada la del rival.
                    </p>
                    <p>
                        En un duopoli simètric amb demanda lineal P = a − b(q₁ + q₂) i cost marginal constant c, la solució és: cada empresa produeix <strong>q* = (a − c) / 3b</strong>, la producció total és 2(a − c) / 3b (major que monopoli, menor que competència perfecta), i el preu és intermedi entre ambdós extrems.
                    </p>
                    <p>
                        Amb n empreses, la producció total s'acosta a la competitiva a mesura que n creix: Q = n(a − c) / (n + 1)b. En el límit, quan n → ∞, s'obté el resultat de competència perfecta.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Model de Bertrand (1883)" color="amber">
                    <p>
                        <strong>Joseph Bertrand</strong> va criticar el model de Cournot argumentant que les empreses competeixen en <strong>preus</strong>, no en quantitats. Amb producte homogeni, l'empresa que fixa el preu més baix captura tot el mercat. Això genera una cursa cap avall: cada empresa té incentiu per a retallar marginalment el preu del rival.
                    </p>
                    <p>
                        La <strong>paradoxa de Bertrand</strong>: amb només dues empreses, el resultat és el <strong>mateix que en competència perfecta</strong> (P₁ = P₂ = CMg, benefici zero). N'hi ha prou amb dos competidors per a eliminar tot el poder de mercat, un resultat sorprenent i intuïtivament insatisfactori.
                    </p>
                    <p>
                        Resolucions de la paradoxa: diferenciació de producte (Hotelling, 1929), restriccions de capacitat (Edgeworth, 1897; Kreps i Scheinkman, 1983 — amb restriccions de capacitat, Bertrand convergeix a Cournot), i jocs repetits (la competència a llarg termini facilita la col·lusió tàcita).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Model de Stackelberg (1934)" color="pink">
                    <p>
                        <strong>Heinrich von Stackelberg</strong> va introduir l'asimetria temporal: una empresa (<strong>líder</strong>) tria primer la seua quantitat; l'altra (<strong>seguidora</strong>) observa l'elecció del líder i optimitza en conseqüència. És un joc seqüencial que es resol per <strong>inducció cap enrere</strong>.
                    </p>
                    <p>
                        El líder té <strong>avantatge del primer moviment</strong>: produeix més que en Cournot, anticipant que el seguidor reduirà la seua producció. El líder obté major benefici que en Cournot; el seguidor, menor. La producció total és major i el preu menor que en Cournot.
                    </p>
                    <p>
                        L'avantatge del líder depén del compromís creïble: l'elecció del líder ha de ser irreversible (inversió en capacitat, contractes vinculants). Sense compromís creïble, el model col·lapsa a Cournot.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Corba de demanda trencada (Sweezy, 1939)" color="violet">
                    <p>
                        <strong>Paul Sweezy</strong> va proposar un model que explica la <strong>rigidesa de preus</strong> observada en oligopoli. La hipòtesi és que els competidors reaccionen de forma <strong>asimètrica</strong>: si una empresa puja el preu, les altres <strong>no la segueixen</strong> (perd clients); si baixa el preu, les altres <strong>sí la segueixen</strong> (no guanya quota).
                    </p>
                    <p>
                        Això genera una corba de demanda amb un «trencament» en el preu vigent: elàstica per damunt (les baixades de preu són igualades) i inelàstica per davall (les pujades no són seguides). Conseqüència: la corba d'IMg presenta una <strong>discontinuïtat vertical</strong> en el nivell de producció actual. El CMg pot variar dins d'eixe rang sense que canvie el preu ni la quantitat d'equilibri, explicant l'estabilitat de preus.
                    </p>
                    <p>
                        Limitació: el model no explica com es va fixar el preu inicial ni com canvia davant pertorbacions grans.
                    </p>
                </TheoryBlock>

            <Card title="3. Col·lusió i càrtels" icon="📘">
                <TheoryBlock title="3.1. Col·lusió explícita" color="red">
                    <p>
                        Un <strong>càrtel</strong> és un acord explícit entre empreses oligopolistes per a restringir la competència, típicament fixant preus, repartint mercats o limitant la producció. L'objectiu és comportar-se col·lectivament com un monopolista per a maximitzar els beneficis conjunts.
                    </p>
                    <p>
                        L'exemple més conegut és l'<strong>OPEP</strong> (Organització de Països Exportadors de Petroli), que coordina les quotes de producció de cru per a influir en el preu mundial. Altres exemples històrics: el càrtel del ciment, el càrtel de vitamines (descobert el 1999, multes de la CE), el càrtel dels camions (multa rècord de 2,9 mil milions d'euros per la CE el 2016).
                    </p>
                    <p>
                        Els càrtels són <strong>il·legals</strong> en la majoria de jurisdiccions (art. 101 TFUE, Sherman Act) i es persegueixen amb multes severes i, als EUA, amb penes de presó. Els programes de <strong>clemència</strong> (<em>leniency</em>) incentiven la delació: la primera empresa a denunciar el càrtel obté immunitat total.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Col·lusió tàcita" color="cyan">
                    <p>
                        La <strong>col·lusió tàcita</strong> es produeix sense acord explícit, quan les empreses coordinen el seu comportament a través de senyals de mercat:
                    </p>
                    <p>
                        <strong>Lideratge de preus:</strong> una empresa (la més gran, la de menor cost, o la més establida) fixa el preu i les altres la segueixen. No hi ha acord, però el resultat és similar al d'un càrtel.
                    </p>
                    <p>
                        <strong>Preus focals</strong> (Schelling, 1960): les empreses convergeixen cap a preus «naturals» o convencionals (nombres rodons, preus històrics) sense necessitat de comunicació directa. El punt focal serveix com a mecanisme de coordinació implícita.
                    </p>
                    <p>
                        La col·lusió tàcita és més difícil de detectar i perseguir que l'explícita, ja que no existeix evidència documental d'un acord.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Inestabilitat dels càrtels" color="emerald">
                    <p>
                        Els càrtels són <strong>inherentment inestables</strong> perquè cada membre té un fort incentiu individual per a <strong>desviar-se de l'acord</strong>: produir més de la seua quota (o vendre a un preu inferior al pactat) genera beneficis addicionals a curt termini a costa dels altres membres.
                    </p>
                    <p>
                        Aquesta tensió es formalitza mitjançant el <strong>dilema del presoner</strong>: l'estratègia dominant de cada empresa és <em>no cooperar</em> (produir més, baixar preus), però si totes fan el mateix, el resultat és pitjor per a totes que si totes cooperaren. L'<strong>equilibri de Nash</strong> (no cooperació mútua) és subòptim des de la perspectiva del càrtel.
                    </p>
                    <p>
                        Factors que afavoreixen l'estabilitat: pocs membres, producte homogeni, informació sobre les accions dels rivals, represàlies creïbles i ràpides, demanda estable, mercat tancat a l'entrada. Factors d'inestabilitat: molts membres, heterogeneïtat de costos, demanda volàtil, innovació disruptiva, entrada de nous competidors.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAF 4 ─────────────────────────────────────── */}
            <Card title="4. Teoria de jocs i comportament estratègic" icon="📘">
                <TheoryBlock title="4.1. Fonaments" color="purple">
                    <p>
                        La <strong>teoria de jocs</strong>, formalitzada per Von Neumann i Morgenstern (1944) i revolucionada per <strong>John Nash (1950)</strong>, és el marc analític natural per a l'oligopoli. Un joc es defineix per: jugadors (empreses), estratègies (accions possibles: preus, quantitats, publicitat) i pagaments (beneficis resultants de cada combinació d'estratègies).
                    </p>
                    <p>
                        <strong>Jocs simultanis:</strong> els jugadors trien les seues estratègies al mateix temps (o sense conéixer l'elecció del rival). Representació: matriu de pagaments. Concepte de solució: equilibri de Nash.
                    </p>
                    <p>
                        <strong>Jocs seqüencials:</strong> un jugador mou primer i l'altre observa abans de decidir. Representació: arbre de decisió. Concepte de solució: inducció cap enrere (equilibri de Nash perfecte en subjocs). Model de Stackelberg.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. El dilema del presoner" color="blue">
                    <p>
                        El <strong>dilema del presoner</strong> és el joc paradigmàtic que captura la tensió entre cooperació i interés individual en l'oligopoli. En la <strong>matriu de pagaments</strong> típica:
                    </p>
                    <p>
                        Dues empreses poden triar cooperar (mantindre preus alts / respectar quotes) o no cooperar (baixar preus / produir més). Si ambdues cooperen, obtenen un benefici elevat (però no màxim individualment). Si una defecciona i l'altra coopera, la que defecciona obté el màxim benefici i l'altra perd. Si ambdues defeccionen, obtenen un benefici baix.
                    </p>
                    <p>
                        L'<strong>estratègia dominant</strong> de cada jugador és no cooperar, cosa que condueix a l'<strong>equilibri de Nash</strong>: ambdues defeccionen, obtenint un resultat pitjor que la cooperació mútua. L'equilibri de Nash no és l'<strong>òptim social</strong> (ni tan sols l'òptim del càrtel), cosa que il·lustra la tensió fonamental de l'oligopoli.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Jocs repetits" color="green">
                    <p>
                        Quan el joc es repeteix indefinidament (o amb horitzó incert), la cooperació es fa possible: cada empresa pot <strong>castigar</strong> la defecció del rival en les rondes futures. Això canvia l'estructura d'incentius: el benefici a curt termini de desviar-se es pondera contra la pèrdua futura de la cooperació.
                    </p>
                    <p>
                        <strong>Estratègia tit-for-tat</strong> (Axelrod, 1984): cooperar en la primera ronda i després replicar l'acció del rival en la ronda anterior. Simple, transparent, retributiva però perdonadora. Guanyadora del torneig d'Axelrod sobre estratègies del dilema del presoner repetit.
                    </p>
                    <p>
                        El <strong>teorema folk</strong> de la teoria de jocs estableix que, amb descompte del futur suficientment baix (les empreses són suficientment pacients), <em>qualsevol</em> resultat mútuament beneficiós pot sostindre's com a equilibri en un joc repetit, inclosa la cooperació plena. Això fonamenta teòricament la col·lusió tàcita.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAF 5 ─────────────────────────────────────── */}
            <Card title="5. La competència monopolística" icon="📘">
                <TheoryBlock title="5.1. Concepte (Chamberlin 1933, Robinson 1933)" color="amber">
                    <p>
                        La <strong>competència monopolística</strong> va ser formalitzada simultàniament per <strong>Edward Chamberlin</strong> (<em>The Theory of Monopolistic Competition</em>, 1933) i <strong>Joan Robinson</strong> (<em>The Economics of Imperfect Competition</em>, 1933). Les seues característiques són:
                    </p>
                    <p>
                        <strong>1. Moltes empreses:</strong> un nombre gran d'empreses, cadascuna amb una quota de mercat xicoteta. A diferència de l'oligopoli, cada empresa ignora l'efecte de les seues decisions sobre les altres (no hi ha interdependència estratègica).
                    </p>
                    <p>
                        <strong>2. Producte diferenciat:</strong> cada empresa ofereix un producte que els consumidors perceben com a diferent dels dels seus competidors (marca, disseny, localització, qualitat, servei). Això atorga a cada empresa una <strong>corba de demanda amb pendent negatiu</strong> (cert poder de mercat), però amb molts substitutius propers.
                    </p>
                    <p>
                        <strong>3. Lliure entrada i eixida:</strong> no existeixen barreres significatives. Qualsevol empresa pot entrar o eixir del mercat sense costos prohibitius.
                    </p>
                    <p>
                        Exemples: restaurants, perruqueries, botigues de roba, fleques, serveis professionals, aplicacions mòbils.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Equilibri a curt termini" color="pink">
                    <p>
                        A curt termini, l'empresa en competència monopolística es comporta de forma similar a un <strong>monopolista</strong>: s'enfronta a una corba de demanda amb pendent negatiu (per la diferenciació) i maximitza beneficis on <strong>IMg = CMg</strong>.
                    </p>
                    <p>
                        Si el preu resultant és superior al CMe, l'empresa obté <strong>beneficis extraordinaris</strong>. Si P {'<'} CMe però P {'>'} CVMe, incorre en pèrdues però continua produint a curt termini. Si P {'<'} CVMe, tanca.
                    </p>
                    <p>
                        La diferència amb el monopoli pur és que la demanda de cada empresa és relativament elàstica (molts substitutius) i que aquesta situació és transitòria: l'existència de beneficis extraordinaris atraurà noves empreses.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Equilibri a llarg termini" color="violet">
                    <p>
                        Els beneficis extraordinaris atrauen l'entrada de noves empreses, que ofereixen productes diferenciats però substitutius propers. Això <strong>desplaça cap a l'esquerra</strong> la corba de demanda de cada empresa incumbent (perd quota de mercat) i la fa més elàstica (més opcions per als consumidors).
                    </p>
                    <p>
                        El procés continua fins que els beneficis econòmics es redueixen a <strong>zero</strong>: la corba de demanda de cada empresa és tangent a la seua corba de CMe. En equilibri de llarg termini: <strong>P = CMe</strong> (benefici zero), però <strong>P {'>'} CMg</strong> (ineficiència assignativa persistent).
                    </p>
                    <p>
                        <strong>Excés de capacitat:</strong> com que la demanda té pendent negatiu, la tangència P = CMe ocorre a l'esquerra del mínim del CMe. Cada empresa produeix <em>menys</em> del que minimitzaria els seus costos mitjans. Hi ha «massa empreses produint massa poc» — és el cost social de la varietat i la diferenciació.
                    </p>
                    <p>
                        Debat sobre l'excés de capacitat: alguns economistes argumenten que el cost és compensat pel <strong>guany de varietat</strong> que valoren els consumidors. El model de Dixit-Stiglitz (1977) formalitza aquesta idea: els consumidors prefereixen la varietat, i la competència monopolística pot generar una varietat socialment eficient.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Publicitat i diferenciació" color="red">
                    <p>
                        En competència monopolística, la <strong>publicitat</strong> i la <strong>diferenciació del producte</strong> són eines estratègiques fonamentals:
                    </p>
                    <p>
                        <strong>Publicitat informativa:</strong> redueix l'asimetria d'informació, facilita la comparació de preus i productes, i pot intensificar la competència (Stigler, 1961). Beneficiosa per al consumidor.
                    </p>
                    <p>
                        <strong>Publicitat persuasiva:</strong> crea fidelitat de marca artificial, desplaça la corba de demanda cap a la dreta i la fa menys elàstica (major poder de mercat). Pot ser socialment costosa si els recursos publicitaris no creen valor real.
                    </p>
                    <p>
                        <strong>Despesa en publicitat:</strong> la regla de Dorfman-Steiner (1954) estableix que la ràtio òptima publicitat/ingressos és igual a la ràtio entre l'elasticitat de la demanda respecte a la publicitat i l'elasticitat-preu de la demanda. Les empreses amb demanda inelàstica al preu gasten proporcionalment més en publicitat.
                    </p>
                    <p>
                        <strong>Marca:</strong> actua com a senyal de qualitat (funció informativa), com a barrera d'entrada (els incumbents tenen marques reconegudes) i com a actiu estratègic. La inversió en marca és un cost enfonsat que compromet l'empresa amb el mercat.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="LP competencia monopolística: P = CMe > CMg → Exceso de capacidad" desc="Equilibri amb benefici zero però ineficiència assignativa" />
            </Card>

            {/* ── EPÍGRAF 6 ─────────────────────────────────────── */}
            <Card title="6. Política de defensa de la competència" icon="📘">
                <TheoryBlock title="6.1. Marc regulatori" color="amber">
                    <p>
                        La <strong>política de defensa de la competència</strong> busca previndre les conductes anticompetitives (col·lusió, abús de posició dominant) i controlar les concentracions empresarials que puguen reduir significativament la competència.
                    </p>
                    <p>
                        L'article 101 del TFUE prohibeix els acords col·lusoris (càrtels, fixació de preus, repartiment de mercats); l'article 102 prohibeix l'abús de posició dominant (preus excessius, vendes lligades, discriminació). La Comissió Europea pot imposar multes de fins al 10 % de la facturació mundial i bloquejar fusions anticompetitives. Reglament de Concentracions (Reg. 139/2004).
                    </p>
                    <p>
                        <strong>Espanya:</strong> la <strong>CNMC</strong> (Comissió Nacional dels Mercats i la Competència), creada per la Llei 3/2013, integra les funcions de l'antiga CNC i els reguladors sectorials. Supervisa mercats, investiga pràctiques anticompetitives, controla concentracions i regula sectors amb monopoli natural.
                    </p>
                    <p>
                        <strong>Estats Units:</strong> Sherman Act (1890), Clayton Act (1914), FTC Act (1914). Tradició antitrust més antiga i agressiva. Casos emblemàtics: Standard Oil (1911), AT&T (1984), Microsoft (2001), Google (2020-actualitat).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
            <Card title="Conclusió" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        Al llarg d'aquest tema s'han analitzat les dues estructures de mercat intermèdies entre la competència perfecta i el monopoli: l'<strong>oligopoli</strong> i la <strong>competència monopolística</strong>.
                    </p>
                    <p>
                        Respecte a l'oligopoli, s'ha definit el seu tret essencial — la <strong>interdependència estratègica</strong> — i s'han presentat els models clàssics: <strong>Cournot</strong> (competència en quantitats, funcions de reacció, equilibri Nash-Cournot), <strong>Bertrand</strong> (competència en preus, paradoxa P = CMg), <strong>Stackelberg</strong> (líder-seguidor, avantatge del primer moviment) i <strong>Sweezy</strong> (demanda trencada, rigidesa de preus).
                    </p>
                    <p>
                        S'ha analitzat la <strong>col·lusió</strong> — explícita (càrtels, OPEP) i tàcita (lideratge de preus, punts focals de Schelling) — i la seua inestabilitat inherent, formalitzada mitjançant el <strong>dilema del presoner</strong> i la teoria de jocs de Nash. Els jocs repetits i l'estratègia tit-for-tat (Axelrod) expliquen com pot sostindre's la cooperació a llarg termini.
                    </p>
                    <p>
                        Respecte a la <strong>competència monopolística</strong> (Chamberlin, Robinson), s'ha detallat l'equilibri a curt termini (similar al monopoli) i a llarg termini (P = CMe, B = 0, excés de capacitat, P {'>'} CMg), juntament amb el paper de la publicitat i la diferenciació.
                    </p>
                    <p>
                        Finalment, s'ha presentat la <strong>política de defensa de la competència</strong> (CNMC, Comissió Europea, Sherman/Clayton Acts) com a resposta regulatòria a les distorsions de la competència imperfecta. Aquests continguts són essencials perquè l'alumnat comprenga el funcionament real dels mercats, més enllà dels models extrems de competència perfecta i monopoli.
                    </p>
                </div>
            </Card>

                    <p>

                    </p>
                    <p>
                        El concepte va ser desenvolupat per <strong>Alfred Marshall</strong> (economies externes, 1890) i formalitzat per <strong>Arthur Cecil Pigou (1920)</strong> en <em>The Economics of Welfare</em>, on va proposar la intervenció fiscal per a corregir aquestes divergències. Les externalitats impliquen l'absència d'un mercat per a l'efecte extern: no hi ha preu que internalitze l'impacte sobre tercers.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Externalitats negatives" color="red">

                    </ul>

                    </p>

                        <li><strong>Vacunació</strong>: immunitat de grup que protegeix els no vacunats.</li>

                    </ul>
                    <p>

                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Solucions a les externalitats" color="amber">
                    <p>La teoria econòmica proposa tres grans grups de solucions:</p>

                    </p>
                    <p>

                        <li><strong>Regulació command-and-control</strong>: obligació d'usar tecnologies específiques (filtres, catalitzadors).</li>
                    </ul>

                    </ul>
                </TheoryBlock>
