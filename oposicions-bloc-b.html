                <TheoryBlock title="3.2. Béns públics purs" color="blue">
                    <p>
                        Un <strong>bé públic pur</strong> compleix simultàniament les condicions de <strong>no rivalitat</strong> (el consum d'un no redueix el de l'altre) i <strong>no exclusió</strong> (no es pot impedir l'accés a ningú). Exemples clàssics: defensa nacional, enllumenat públic, senyals de ràdio, coneixement científic bàsic.
                    </p>
                    <p>
                        La provisió eficient d'un bé públic requereix que la <strong>suma vertical de les disposicions marginals a pagar</strong> de tots els individus iguale el <strong>cost marginal de provisió</strong> (condició de Samuelson). A diferència dels béns privats, les corbes de demanda se sumen verticalment, no horitzontalment.
                    </p>
                    <p>
                        El mercat tendeix a <strong>infraproveir</strong> béns públics perquè no pot capturar la disposició a pagar dels beneficiaris, cosa que justifica la seua provisió pública finançada mitjançant impostos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. El problema del free-rider (polissó)" color="pink">
                    <p>
                        El <strong>problema del free-rider</strong> (polissó) és la principal causa de la infraprovisió de béns públics pel mercat. Atés que no es pot excloure ningú del consum, cada individu té l'<strong>incentiu racional a no revelar la seua verdadera disposició a pagar</strong> i beneficiar-se gratuïtament de la provisió aliena.
                    </p>
                    <p>
                        Si tots els individus adopten aquesta estratègia, el bé no es produeix o es produeix en quantitat molt inferior a la socialment òptima. Aquest problema és especialment greu en grups grans, on la contribució individual té un impacte marginal xicotet (Olson, 1965: <em>The Logic of Collective Action</em>).
                    </p>
                    <p>
                        La <strong>provisió pública</strong> finançada mitjançant impostos obligatoris resol el problema del free-rider, encara que planteja el repte de determinar la quantitat òptima del bé públic sense poder observar les preferències verdaderes dels ciutadans.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Béns comuns i la tragèdia dels comuns" color="violet">
                    <p>
                        <strong>Garrett Hardin (1968)</strong> va popularitzar el concepte de la <strong>tragèdia dels comuns</strong>: quan un recurs és rival però no excloïble, cada usuari té incentius a sobreexplotar-lo, ja que rep tots els beneficis del seu ús però comparteix els costos de l'esgotament amb els altres. El resultat és la <strong>sobreexplotació i eventual destrucció del recurs</strong>.
                    </p>
                    <p>Exemples històrics i actuals:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Pesca</strong>: col·lapse de caladors per sobrepesca (bacallà de Terranova).</li>
                        <li><strong>Desforestació</strong>: tala excessiva de boscos comunals.</li>
                        <li><strong>Aqüífers</strong>: sobreexplotació d'aigües subterrànies (aqüífer 23, Mancha Occidental).</li>
                        <li><strong>Canvi climàtic</strong>: l'atmosfera com a bé comú global.</li>
                    </ul>
                    <p>Solucions proposades:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Privatització</strong>: assignació de drets de propietat individuals (Demsetz).</li>
                        <li><strong>Regulació estatal</strong>: quotes, vedes, llicències.</li>
                        <li><strong>Gestió comunitària</strong>: <strong>Elinor Ostrom (Premi Nobel 2009)</strong> va demostrar que les comunitats locals poden gestionar exitosament recursos comuns mitjançant regles autoorganitzades, sense necessitat de privatització ni regulació estatal, si es compleixen certs principis de disseny institucional.</li>
                    </ul>
                </TheoryBlock>
            </Card>

            {/* ── 4. INFORMACIÓN ASIMÉTRICA ──────────────────────── */}
            <Card title="4. Informació asimètrica" icon="📘">
                <TheoryBlock title="4.1. Selecció adversa" color="amber">
                    <p>
                        La <strong>selecció adversa</strong> és un problema d'informació asimètrica que es produeix <strong>abans de la transacció</strong> (<em>ex ante</em>): una de les parts posseeix informació rellevant que l'altra desconeix, cosa que distorsiona el funcionament del mercat.
                    </p>
                    <p>
                        <strong>George Akerlof (1970)</strong> va formalitzar aquest problema en el seu article seminal <em>«The Market for Lemons»</em>: en el mercat de cotxes usats, els venedors coneixen la qualitat del seu vehicle, però els compradors no poden distingir els bons («peaches») dels dolents («lemons»). Els compradors ofereixen un preu mitjà, cosa que expulsa del mercat els venedors de cotxes bons → <strong>només queden els «limones»</strong> → el mercat pot col·lapsar.
                    </p>
                    <p>Altres exemples de selecció adversa:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Assegurances mèdiques</strong>: qui més les demanden són els més malalts → primes elevades → els sans abandonen el mercat.</li>
                        <li><strong>Mercat de crèdit</strong>: els prestataris més arriscats són els més disposats a acceptar tipus alts (Stiglitz i Weiss, 1981: racionament de crèdit).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.2. Risc moral" color="green">
                    <p>
                        El <strong>risc moral</strong> (<em>moral hazard</em>) és un problema d'informació asimètrica que es produeix <strong>després de la transacció</strong> (<em>ex post</em>): una vegada signat el contracte, una de les parts modifica el seu comportament de forma perjudicial per a l'altra, aprofitant que les seues accions no són observables.
                    </p>
                    <p>Exemples fonamentals:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Assegurances</strong>: una persona assegurada contra robatori pot ser menys cuidadosa amb les seues pertinences.</li>
                        <li><strong>Rescats bancaris</strong>: si els bancs esperen ser rescatats (<em>too big to fail</em>), assumeixen riscos excessius.</li>
                        <li><strong>Relació agent-principal</strong>: el directiu (agent) pot no maximitzar el valor per als accionistes (principal) si els seus interessos divergeixen. Jensen i Meckling (1976) van formalitzar la <strong>teoria de l'agència</strong>.</li>
                    </ul>
                    <p>
                        Solucions: <strong>disseny de contractes amb incentius</strong> (participació en beneficis, stock options), <strong>monitorització</strong>, <strong>franquícies i copagaments</strong> en assegurances (perquè l'assegurat mantinga incentius de precaució).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Senyalització i filtratge" color="cyan">
                    <p>
                        Davant la informació asimètrica, els agents desenvolupen mecanismes per a transmetre o extraure informació:
                    </p>
                    <p>
                        <strong>Michael Spence (1973)</strong> va introduir el concepte de <strong>senyalització</strong> (<em>signaling</em>): la part informada realitza una acció costosa per a revelar el seu tipus. L'exemple clàssic és l'<strong>educació com a senyal</strong>: un títol universitari pot no augmentar la productivitat directament, però senyalitza capacitat i perseverança a l'ocupador. Altres exemples: garanties del producte (senyal de qualitat), dividends (senyal de solvència financera).
                    </p>
                    <p>
                        El <strong>filtratge</strong> (<em>screening</em>), proposat per <strong>Rothschild i Stiglitz (1976)</strong>, funciona a la inversa: la part no informada dissenya un menú d'opcions que indueix la part informada a autoseleccionar-se. Exemple: companyies d'assegurances que ofereixen pòlisses amb distints nivells de cobertura i franquícia.
                    </p>
                    <p>
                        Altres mecanismes: <strong>certificacions i auditories</strong> (ISO, AENOR), <strong>regulació d'informació</strong> (etiquetatge obligatori, transparència financera), <strong>reputació i marques</strong>.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── 5. EL PAPEL DEL ESTADO ─────────────────────────── */}
            <Card title="5. El paper de l'Estat davant les fallades del mercat" icon="📘">
                <TheoryBlock color="purple">
                    <p>
                        Les fallades del mercat proporcionen la <strong>justificació econòmica per a la intervenció de l'Estat</strong>, entesa com a <strong>correcció</strong> de les ineficiències del mercat, no com a substitució del mecanisme de preus. L'Estat intervé mitjançant:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Regulació</strong>: normativa mediambiental, de competència, d'informació al consumidor.</li>
                        <li><strong>Provisió directa</strong>: béns públics (defensa, justícia, infraestructures).</li>
                        <li><strong>Fiscalitat correctora</strong>: impostos pigouvians, subvencions.</li>
                        <li><strong>Disseny de mercats</strong>: permisos d'emissió, subhastes d'espectre radioelèctric.</li>
                    </ul>
                    <p>
                        No obstant això, la teoria de l'<strong>elecció pública</strong> (<em>Public Choice</em>) adverteix que la intervenció estatal també pot generar ineficiències: les <strong>fallades de l'Estat</strong> (Buchanan, Tullock, Niskanen). Els polítics i buròcrates tenen els seus propis incentius (reelecció, pressupost), la informació del regulador és imperfecta, i la intervenció pot generar cerca de rendes, captura regulatòria o ineficiència burocràtica.
                    </p>
                    <p>
                        El debat no és, per tant, «mercat vs Estat», sinó quina és la <strong>combinació òptima d'ambdós mecanismes</strong> en cada context, avaluant els costos i beneficis de la intervenció enfront dels costos de la fallada del mercat.
                    </p>
                    <p>
                        <strong>Rellevància curricular</strong>: aquest tema connecta amb les competències LOMLOE CC (sostenibilitat, béns públics), STEM (modelització d'externalitats), CE (fallades del mercat i regulació) i CPSAA (presa de decisions informada). Es vincula amb els ODS 13 (acció pel clima), 14 i 15 (vida submarina i ecosistemes terrestres).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓ ─────────────────────────────────────── */}
            <Card title="Conclusió" icon="📌">

                    </p>
                    <p>
                        En primer lloc, s'ha definit el concepte de <strong>fallada del mercat</strong> com a divergència entre el resultat del mercat i l'òptim de Pareto, i s'han classificat els seus principals tipus. En segon lloc, s'han estudiat les <strong>externalitats</strong> (negatives i positives) i les seues solucions: impostos pigouvians, teorema de Coase i regulació directa.
                    </p>
                    <p>
                        En tercer lloc, s'han analitzat els <strong>béns públics</strong> (no rivalitat, no exclusió, free-rider) i els <strong>béns comuns</strong> (tragèdia dels comuns, Ostrom). En quart lloc, la <strong>informació asimètrica</strong>: selecció adversa (Akerlof), risc moral i senyalització (Spence).
                    </p>
                    <p>
                        Finalment, s'ha reflexionat sobre el <strong>paper de l'Estat</strong> com a corrector de fallades del mercat, sense oblidar les fallades del propi Estat (Public Choice). El tema és de màxima rellevància docent: permet a l'alumnat comprendre per què els mercats necessiten regulació i desenvolupar un pensament crític sobre la intervenció pública.
                    </p>
                </div>
            </Card>

            <Card title="3. Causes de la desigualtat" icon="📘">

                        <li><strong>Diferències en capital humà</strong> (Becker, 1964): l'educació i la formació generen diferències de productivitat i, per tant, de salaris. La <strong>prima salarial</strong> per educació superior ha augmentat significativament des dels anys 1980.</li>
                        <li><strong>Canvi tecnològic esbiaixat</strong> (<em>skill-biased technological change</em>): la tecnologia digital complementa el treball qualificat i substitueix el no qualificat, ampliant la bretxa salarial (Autor, Katz i Krueger, 1998).</li>
                        <li><strong>Globalització</strong>: el teorema de Stolper-Samuelson prediu que el comerç internacional beneficia el factor abundant i perjudica l'escàs. En països desenvolupats, la globalització pressiona a la baixa els salaris del treball no qualificat.</li>
                        <li><strong>Poder de mercat</strong>: la concentració empresarial i la fixació de rendes monopolístiques beneficien els propietaris de capital enfront dels treballadors.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.2. Factors institucionals i socials" color="blue">
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Herència i riquesa</strong>: la transmissió intergeneracional de patrimoni perpetua la desigualtat. Piketty (2014) mostra que la riquesa heretada representa una proporció creixent de la riquesa total.</li>
                        <li><strong>Discriminació</strong>: diferències salarials per gènere, raça o origen que no s'expliquen per productivitat. La bretxa salarial de gènere a Espanya ≈ 12% (ajustada) segons l'INE.</li>
                        <li><strong>Accés a l'educació</strong>: les desigualtats en el sistema educatiu (segregació escolar, qualitat diferencial) reprodueixen i amplifiquen les desigualtats d'origen.</li>
                        <li><strong>Regulació laboral</strong>: salari mínim, negociació col·lectiva, protecció de l'ocupació. La dessindicalització des dels anys 1980 s'associa a l'augment de la desigualtat (OCDE).</li>
                    </ul>

                    </p>
                    <p>

                    </p>
                    <p>

                    </p>

            {/* ── 4. LA POBREZA ──────────────────────────────────── */}
            <Card title="4. La pobresa" icon="📘">
                <TheoryBlock title="4.1. Concepte i mesurament" color="red">
                    <p>La pobresa es pot mesurar des de tres perspectives complementàries:</p>
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Pobresa absoluta</strong>: incapacitat de satisfer les necessitats bàsiques. El <strong>Banc Mundial</strong> fixa la línia internacional en <strong>$2,15/dia PPP</strong> (2022, revisada). A nivell mundial, la pobresa extrema s'ha reduït del 36% (1990) al 9% (2019), encara que la pandèmia va revertir parcialment aquesta tendència.</li>
                        <li><strong>Pobresa relativa</strong>: situació de qui viu amb ingressos significativament inferiors a la mitjana o mediana de la seua societat. <strong>Eurostat</strong> defineix la línia de pobresa relativa en el <strong>60% de la mediana de la renda disponible equivalent</strong> del país.</li>
                        <li><strong>Pobresa multidimensional</strong>: l'<strong>Índex de Pobresa Multidimensional (IPM)</strong> del PNUD (metodologia <strong>Alkire-Foster</strong>) considera privacions en tres dimensions: salut, educació i nivell de vida, amb 10 indicadors. Captura mancances que la renda monetària no reflecteix.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.2. La pobresa a Espanya" color="amber">
                    <p>Indicadors clau (dades aproximades, INE/Eurostat 2022-2023):</p>
                    <ul className="list-disc pl-5 space-y-1">

                        <li><strong>Treballadors pobres</strong> (<em>in-work poverty</em>): ≈ 12%, reflex de la temporalitat, la parcialitat involuntària i els baixos salaris.</li>
                        <li><strong>Bretxa territorial</strong>: diferències significatives entre CCAA (Extremadura, Andalusia vs País Basc, Navarra).</li>
                        <li><strong>Privació material severa</strong>: ≈ 7%, inclou incapacitat per a afrontar despeses imprevistes, calefacció, proteïnes.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.3. Trampes de pobresa" color="cyan">
                    <p>
                        Les <strong>trampes de pobresa</strong> són situacions en les quals els individus, llars o països queden atrapats en un <strong>cercle viciós</strong> del qual és difícil escapar sense intervenció externa.
                    </p>
                    <p>
                        <strong>Ragnar Nurkse (1953)</strong> va formular el <strong>«cercle viciós de la pobresa»</strong>: baixa renda → baix estalvi → baixa inversió → baixa productivitat → baixa renda. Aquest model s'aplica tant a nivell individual com a nivell de països en desenvolupament.
                    </p>
                    <p>Mecanismes específics:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Trampa fiscal</strong>: tipus marginals efectius molt alts en passar de prestacions a ocupació desincentiven la cerca de treball.</li>
                        <li><strong>Trampa de capital humà</strong>: famílies pobres no poden invertir en educació → els seus fills obtenen ocupacions pitjor remunerades.</li>
                        <li><strong>Transmissió intergeneracional</strong>: la pobresa s'hereta a través de la nutrició, la salut, l'entorn educatiu i les xarxes socials.</li>
                    </ul>
                </TheoryBlock>

            {/* ── 5. POLÍTICAS REDISTRIBUTIVAS ───────────────────── */}
            <Card title="5. Polítiques redistributives" icon="📘">
                <TheoryBlock title="5.1. Política fiscal progressiva" color="purple">
                    <p>
                        El sistema fiscal és el principal instrument redistributiu. La <strong>progressivitat</strong> implica que qui més renda obté contribueix proporcionalment més:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>IRPF progressiu</strong>: tipus marginals creixents. A Espanya: 19%-47% (trams estatals, 2024). Mínims personals i familiars exempts.</li>
                        <li><strong>Impost sobre el patrimoni</strong>: grava la riquesa acumulada. Debat sobre la seua eficàcia (fuga de capitals, elusió) vs equitat.</li>
                        <li><strong>Impost sobre successions i donacions</strong>: grava la transmissió intergeneracional de riquesa. Molt desigual entre CCAA a Espanya.</li>
                    </ul>
                    <p>
                        Limitacions: l'evasió i elusió fiscal redueixen la capacitat redistributiva efectiva. Els impostos indirectes (IVA) són regressius, ja que pesen més sobre les rendes baixes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Transferències i despesa social" color="blue">
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Prestacions per atur</strong>: contributives (proporcionals al salari previ) i assistencials (subsidi, renda activa d'inserció).</li>
                        <li><strong>Pensions públiques</strong>: sistema de repartiment a Espanya. Principal partida de despesa social i principal instrument contra la pobresa en la vellesa.</li>
                        <li><strong>Ingrés Mínim Vital (IMV)</strong>: prestació no contributiva des de 2020 per a garantir un nivell mínim de renda a llars vulnerables.</li>
                        <li><strong>Beques i ajudes a l'educació</strong>: promouen la igualtat d'oportunitats reduint barreres econòmiques a l'accés educatiu.</li>
                        <li><strong>Ajudes a l'habitatge</strong>: bons lloguer, habitatge social, desgravacions fiscals.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="5.3. Polítiques d'igualtat d'oportunitats" color="green">
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Educació pública universal</strong>: iguala el punt de partida; la qualitat del sistema educatiu és clau per a la mobilitat social.</li>
                        <li><strong>Sanitat universal</strong>: accés igualitari a la salut, independent de la renda. La salut és un determinant fonamental de la productivitat.</li>
                        <li><strong>Polítiques actives d'ocupació</strong>: formació, intermediació, incentius a la contractació de col·lectius vulnerables.</li>
                        <li><strong>Polítiques d'igualtat de gènere</strong>: permisos de paternitat, quotes, transparència salarial.</li>
                        <li><strong>Atenció a la primera infància</strong>: educació 0-3 anys, factor clau per a trencar la transmissió intergeneracional de la pobresa (Heckman).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="5.4. El debat eficiència-equitat" color="amber">
                    <p>
                        <strong>Arthur Okun (1975)</strong> va formular la metàfora del <strong>«cubell amb fuites»</strong> (<em>leaky bucket</em>): redistribuir renda implica costos d'eficiència (desincentius al treball i a l'estalvi, costos administratius), de manera que una part de la renda es «perd» en la transferència. La qüestió és quanta «fuita» és acceptable per a reduir la desigualtat.
                    </p>
                    <p>Principals enfocaments filosòfics sobre justícia distributiva:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Utilitarisme</strong> (Bentham, Mill): maximitzar la utilitat total. Amb utilitat marginal decreixent, la redistribució augmenta el benestar agregat.</li>
                        <li><strong>Rawls (1971)</strong>: principi <strong>maximin</strong> — les desigualtats només es justifiquen si beneficien el membre més desfavorit de la societat (vel d'ignorància).</li>
                        <li><strong>Amartya Sen (1999)</strong>: enfocament de <strong>capacitats</strong> — la igualtat rellevant no és de renda sinó de llibertats i oportunitats reals per a viure una vida digna (Nobel 1998).</li>
                        <li><strong>Nozick (1974)</strong>: llibertarisme — la justícia està en el procediment (adquisició i transferència legítimes), no en el resultat distributiu.</li>
                    </ul>
                    <p>
                        El debat contemporani apunta que la relació eficiència-equitat no és necessàriament un trade-off simple: les polítiques que promouen la igualtat d'oportunitats (educació, salut) poden millorar simultàniament l'eficiència i l'equitat (FMI, 2014; OCDE).
                    </p>
                </TheoryBlock>

            {/* ── 1. CONCEPTO DE EMPRESA ────────────────────────────── */}
            <Card title="1. Concepte d'empresa" icon="📘">
                <TheoryBlock title="1.1. Definició econòmica" color="purple">
                    <p>
                        L'empresa és la <strong>unitat econòmica de producció</strong> que combina factors productius (treball, capital, recursos naturals, tecnologia i organització) per a obtindre béns i serveis destinats al mercat amb <strong>ànim de lucre</strong>. Esta definició distingeix l'empresa d'altres conceptes relacionats però no equivalents:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Negoci</strong>: activitat amb ànim de lucre que pot no requerir estructura organitzativa formal.</li>
                        <li><strong>Indústria</strong>: conjunt d'empreses que produeixen béns o serveis similars (sector automobilístic, sector farmacèutic).</li>
                        <li><strong>Sector</strong>: agrupació més àmplia d'activitats econòmiques (primari, secundari, terciari).</li>
                        <li><strong>Establiment/planta</strong>: unitat física de producció; una empresa pot tindre diversos establiments.</li>
                    </ul>
                    <p>
                        L'empresa crea valor en transformar inputs en outputs el valor de mercat dels quals supera el cost dels factors empleats. En este sentit, el <strong>benefici</strong> (ingressos − costos) actua com a senyal d'eficiència en l'assignació de recursos.
                    </p>

                        <li><strong>Organització</strong>: el disseny de l'estructura que coordina persones, recursos i processos per a assolir els objectius. L'organització és el «pegament» que integra la resta d'elements.</li>

            {/* ── 2. TEORIES DE L'EMPRESA ──────────────────────────── */}
            <Card title="2. Teories de l'empresa" icon="📘">
                <TheoryBlock title="2.1. Teoria neoclàssica" color="amber">
                    <p>
                        En l'enfocament neoclàssic (Marshall, Walras), l'empresa és una <strong>funció de producció</strong>: una «caixa negra» que transforma inputs en outputs. El seu únic objectiu és la <strong>maximització del benefici</strong> (π = IT − CT), i la decisió òptima s'assoleix quan l'ingrés marginal iguala el cost marginal (IMg = CMg).
                    </p>
                    <p>
                        Esta visió simplificada permet una anàlisi formal elegant, però ignora l'organització interna, els conflictes d'interessos entre propietaris i directius, i els costos de coordinació. Precisament estes limitacions van motivar el desenrotllament de teories alternatives.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Teoria dels costos de transacció" color="pink">
                    <p>
                        <strong>Ronald Coase</strong> (1937), en su artículo seminal <em>«The Nature of the Firm»</em>, va plantejar la pregunta fonamental: per què existeixen les empreses si el mercat és un mecanisme eficient d'assignació? La resposta: perquè utilitzar el mercat té <strong>costos de transacció</strong> (buscar informació, negociar contractes, vigilar el seu compliment). L'empresa sorgeix quan organitzar internament una activitat és més barat que contractar-la en el mercat.
                    </p>
                    <p>
                        <strong>Oliver Williamson</strong> (1975) va ampliar este enfocament identificant tres factors que eleven els costos de transacció: <strong>especificitat d'actius</strong> (inversions que perden valor fora de la relació), <strong>racionalitat limitada</strong> (impossibilitat de preveure totes les contingències contractuals) i <strong>oportunisme</strong> (risc de comportament estratègic deslleial). Com més grans són estos factors, més convenient és la integració vertical (internalitzar l'activitat en l'empresa).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Teoria de l'agència" color="violet">
                    <p>
                        <strong>Jensen y Meckling</strong> (1976) van analitzar l'empresa com un <strong>nexe de contractes</strong> entre agents amb interessos potencialment divergents. La relació d'agència sorgeix quan una part (el <strong>principal</strong>, típicament l'accionista) delega la presa de decisions en una altra (l'<strong>agent</strong>, el directiu).
                    </p>
                    <p>
                        Els <strong>problemes d'agència</strong> apareixen perquè: (a) existeix <strong>asimetria d'informació</strong> (el directiu sap més que l'accionista sobre la marxa real de l'empresa); (b) els interessos no estan alineats (el directiu pot preferir creixement, prestigi o seguretat laboral a maximitzar el valor per a l'accionista). Els <strong>mecanismes de control</strong> inclouen: el consell d'administració, l'auditoria externa, la retribució vinculada a resultats (<em>stock options</em>), i la disciplina del mercat de capitals (OPA hostils).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Teoria de recursos i capacitats" color="red">
                    <p>
                        <strong>Edith Penrose</strong> (1959) va concebre l'empresa com un conjunt de <strong>recursos productius</strong> la combinació única dels quals determina el seu potencial de creixement. <strong>Jay Barney</strong> (1991) va formalitzar esta idea amb el marc <strong>VRIN</strong>: una empresa obté avantatge competitiu sostenible quan posseeix recursos que són:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>V</strong>aluosos: permeten explotar oportunitats o neutralitzar amenaces.</li>
                        <li><strong>R</strong>ars: no estan disponibles per a molts competidors.</li>
                        <li><strong>I</strong>nimitables: són difícils de replicar (complexitat social, dependència històrica, ambigüitat causal).</li>
                        <li><strong>N</strong>o substituïbles: no existeixen equivalents estratègics.</li>
                    </ul>
                    <p>
                        Esta perspectiva desplaça el focus de l'estructura del sector (Porter) als <strong>actius interns</strong> de l'empresa com a font d'avantatge competitiu. Les <strong>capacitats dinàmiques</strong> (Teece, Pisano i Shuen, 1997) estenen el marc en explicar com les empreses renoven els seus recursos en entorns canviants.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Altres aportacions" color="cyan">
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Schumpeter</strong> (1942): l'empresari com a <strong>innovador</strong> que introdueix «noves combinacions» (nous productes, processos, mercats, fonts d'aprovisionament, formes d'organització). La innovació genera <strong>destrucció creativa</strong>: les empreses innovadores desplacen les obsoletes, impulsant el progrés econòmic.</li>
                        <li><strong>Frank Knight</strong> (1921): distingeix entre <strong>risc</strong> (probabilitat quantificable) i <strong>incertesa</strong> (no quantificable). L'empresari és qui assumeix la incertesa residual i, per això, rep el benefici com a recompensa.</li>
                        <li><strong>Enfoque evolucionista</strong> (Nelson y Winter, 1982): les empreses són repositoris de <strong>rutines organitzatives</strong> (habilitats, procediments, regles de decisió) que evolucionen per selecció, imitació i mutació, de forma anàloga a l'evolució biològica.</li>
                    </ul>
                </TheoryBlock>
            </Card>

            {/* ── 3. CLASSIFICACIÓ DE LES EMPRESES ─────────────────── */}
            <Card title="3. Classificació de les empreses" icon="📘">
                <TheoryBlock title="3.1. Segons l'activitat" color="purple">
                    <p>
                        La classificació sectorial clàssica (Fisher, 1935; Clark, 1940) distingeix:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Sector primari</strong>: activitats extractives i agrícoles (agricultura, ramaderia, pesca, mineria, silvicultura).</li>
                        <li><strong>Sector secundari</strong>: activitats de transformació (indústria manufacturera, construcció, energia).</li>
                        <li><strong>Sector terciari</strong>: serveis (comerç, transport, turisme, educació, sanitat, finances, telecomunicacions).</li>
                    </ul>
                    <p>
                        La <strong>terciarització</strong> de les economies desenrotllades ha portat que a Espanya més del 75% del PIB i l'ocupació corresponguen al sector serveis. Alguns autors parlen d'un sector quaternari (I+D, tecnologies de la informació) i quinari (serveis superiors de decisió).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Segons la dimensió" color="blue">
                    <p>
                        La Unió Europea (Recomanació 2003/361/CE) estableix els criteris de classificació:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Microempresa</strong>: {'<'} 10 treballadors, facturació ≤ 2 M€, balance ≤ 2 M€.</li>
                        <li><strong>Pequeña empresa</strong>: {'<'} 50 trabajadores, facturación ≤ 10 M€, balance ≤ 10 M€.</li>
                        <li><strong>Mediana empresa</strong>: {'<'} 250 trabajadores, facturación ≤ 50 M€, balance ≤ 43 M€.</li>
                        <li><strong>Gran empresa</strong>: ≥ 250 treballadors o supera els llindars anteriors.</li>
                    </ul>
                    <p>
                        Les <strong>PIME</strong> (micro + xicotetes + mitjanes) representen més del 99% del teixit empresarial espanyol i europeu. Són fonamentals per a l'ocupació, la innovació incremental i la cohesió territorial, encara que afronten desavantatges en economies d'escala, accés a finançament i capacitat exportadora.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Segons la propietat" color="green">
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Empresa privada</strong>: capital i gestió en mans de particulars. Objectiu principal: maximitzar beneficis.</li>
                        <li><strong>Empresa pública</strong>: capital total o majoritàriament estatal. Objectiu: interés general (serveis públics, sectors estratègics). Exemple: RENFE, Correus.</li>
                        <li><strong>Empresa mixta</strong>: participació conjunta de capital públic i privat.</li>
                        <li><strong>Cooperativa</strong>: propietat col·lectiva dels socis-treballadors, decisions democràtiques (un soci = un vot). Ex.: Mondragón.</li>
                        <li><strong>Economia social</strong>: cooperatives, mutualitats, fundacions, associacions, empreses d'inserció, centres especials d'ocupació. Principis: primacia de les persones, gestió democràtica, interés general.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.4. Segons la forma jurídica" color="amber">
                    <p>La forma jurídica determina la responsabilitat, el capital mínim i la fiscalitat:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Empresari individual (autònom)</strong>: responsabilitat il·limitada, sense capital mínim, IRPF.</li>
                        <li><strong>Societat Limitada (SL)</strong>: responsabilitat limitada al capital aportat, mínim 1 € (Llei Crea y Crece, 2022), Impost de Societats.</li>
                        <li><strong>Societat Anònima (SA)</strong>: responsabilitat limitada, capital mínim 60.000 €, accions transmissibles, obligació d'auditoria si supera certs llindars.</li>
                        <li><strong>Societat Cooperativa</strong>: socis treballadors, capital variable, gestió democràtica, règim fiscal favorable.</li>
                        <li>Altres: Societat Laboral, Societat Comanditària, Comunitat de Béns, Emprenedor de Responsabilitat Limitada (ERL).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.5. Segons l'àmbit geogràfic" color="pink">
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Local</strong>: opera en un municipi o comarca.</li>
                        <li><strong>Regional</strong>: abast autonòmic o pluriprovincial.</li>
                        <li><strong>Nacional</strong>: presència en tot el territori del país.</li>
                        <li><strong>Multinacional</strong>: opera en diversos països amb filials, mantenint la seu central al país d'origen. La inversió directa estrangera (IDE) és el seu vehicle d'expansió.</li>
                        <li><strong>Global/transnacional</strong>: xarxa integrada sense clara centralització nacional; cadenes globals de valor (Gereffi). Exemple: Apple, Inditex, Samsung.</li>
                    </ul>
                </TheoryBlock>
            </Card>

            {/* ── 4. L'EMPRESARI ─────────────────────────────────── */}
            <Card title="4. L'empresari" icon="📘">
                <TheoryBlock title="4.1. Evolució del concepte" color="purple">
                    <p>La figura de l'empresari ha evolucionat al llarg de la història del pensament econòmic:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Richard Cantillon</strong> (segle XVIII): primer teòric de l'empresari com a <strong>prenedor de risc</strong>. Compra a preus certs (costos) i ven a preus incerts (mercat).</li>
                        <li><strong>Jean-Baptiste Say</strong> (1803): l'empresari com a <strong>coordinador de factors productius</strong> que organitza la producció de forma eficient.</li>
                        <li><strong>Alfred Marshall</strong> (1890): eleva l'organització empresarial a <strong>quart factor productiu</strong>, junt amb terra, treball i capital.</li>
                        <li><strong>Joseph Schumpeter</strong> (1912, 1942): l'empresari com a <strong>innovador</strong> que introdueix «noves combinacions» i desencadena la <em>destrucció creativa</em>.</li>
                        <li><strong>Frank Knight</strong> (1921): l'empresari com a gestor de la <strong>incertesa</strong> (no del risc assegurable). El benefici és la recompensa per assumir l'imprevisible.</li>
                        <li><strong>Israel Kirzner</strong> (1973): l'empresari com a posseïdor d'<strong><em>alertness</em></strong> (capacitat de detectar oportunitats de benefici que altres no perceben), essencial per al procés de mercat.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.2. Funcions de l'empresari" color="blue">
                    <p>L'empresari exerceix funcions interrelacionades:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Planificació</strong>: fixa objectius, analitza l'entorn (DAFO/PESTEL) i dissenya estratègies.</li>
                        <li><strong>Organització</strong>: dissenya l'estructura, assigna recursos i estableix procediments.</li>
                        <li><strong>Direcció</strong>: lidera, motiva, comunica i gestiona equips humans.</li>
                        <li><strong>Control</strong>: mesura resultats, compara amb els objectius i aplica mesures correctores (cicle de Deming: PDCA).</li>
                        <li><strong>Presa de decisions davall incertesa</strong>: selecciona l'alternativa òptima amb informació incompleta.</li>
                        <li><strong>Innovació</strong>: introdueix millores contínues i ruptures tecnològiques.</li>
                        <li><strong>Assumpció de risc</strong>: compromet el seu patrimoni i reputació en un resultat incert.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.3. La figura de l'emprenedor" color="green">
                    <p>
                        L'<strong>emprenedoria</strong> (<em>entrepreneurship</em>) s'ha convertit en una prioritat educativa i de política econòmica. La LOMLOE inclou la <strong>competència emprenedora (CE)</strong> com una de les huit competències clau, i tant Economia d'1r com EDMN de 2n de Batxillerat integren sabers relacionats amb la iniciativa empresarial.
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Emprenedoria</strong>: creació de noves empreses, identificació d'oportunitats, assumpció de riscos calculats.</li>
                        <li><strong>Intraemprenedoria</strong> (<em>intrapreneurship</em>): innovació dins d'organitzacions existents (Pinchot, 1985).</li>
                        <li><strong>Ecosistema emprenedor</strong>: condicions institucionals, financeres, educatives i culturals que faciliten la creació d'empreses (Isenberg, 2011). Inclou: accés a finançament (capital risc, <em>business angels</em>, <em>crowdfunding</em>), marcs regulatoris àgils, formació emprenedora, xarxes de suport (incubadores, acceleradores).</li>
                    </ul>
                </TheoryBlock>
            </Card>

                    </p>
                    <p>
                        Des de la perspectiva curricular, este tema s'emmarca en els sabers bàsics del bloc «L'empresa i el seu entorn» i «Organització i gestió» d'Economia de l'Empresa de 2n de Batxillerat (Reial Decret 243/2022, LOMLOE), connectant amb les competències específiques CE1 (anàlisi organitzativa), CE3 (gestió d'àrees funcionals) i CE5 (responsabilitat social). La comprensió de l'estructura organitzativa, les àrees funcionals i els objectius empresarials és essencial per al desenrotllament de les competències STEM (modelització), CE (iniciativa emprenedora) i CC (ètica empresarial).
                    </p>
                    <p>
                        El tema s'estructura en quatre epígrafs: l'organització empresarial (principis i tipus); l'estructura organitzativa (Mintzberg, organigrames); les funcions o àrees funcionals; i els objectius de l'empresa (inclosa la RSC i el govern corporatiu).
                    </p>
                </div>
            </Card>

            {/* ── 1. L'ORGANITZACIÓ EMPRESARIAL ────────────────────── */}
            <Card title="1. L'organització empresarial" icon="📘">
                <TheoryBlock title="1.1. Concepte d'organització" color="purple">
                    <p>
                        L'<strong>organització</strong> és el procés mitjançant el qual es dissenya l'estructura interna de l'empresa per a assolir els seus objectius de forma eficient. Implica dues dimensions fonamentals:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Divisió del treball</strong>: descompondre l'activitat global en tasques especialitzades (Adam Smith, 1776: fàbrica d'agulles).</li>
                        <li><strong>Coordinació</strong>: integrar les tasques dividides perquè el resultat siga coherent i sinèrgic.</li>
                    </ul>
                    <p>
                        Organitzar, per tant, és decidir <em>qui fa què</em>, <em>com es relacionen les parts</em> i <em>qui decideix què</em>. L'estructura resultant defineix les relacions d'autoritat, comunicació i responsabilitat dins de l'empresa.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Principis organitzatius clàssics" color="blue">
                    <p>Els autors clàssics van establir principis que segueixen vigents (amb matisos):</p>
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Henri Fayol</strong> (1916): va formular <strong>14 principis d'administració</strong> (divisió del treball, autoritat-responsabilitat, disciplina, unitat de comandament, unitat de direcció, subordinació de l'interés particular al general, remuneració, centralització, cadena escalar, orde, equitat, estabilitat del personal, iniciativa, esperit d'equip). Va definir les cinc funcions de la direcció: preveure, organitzar, manar, coordinar i controlar.</li>
                        <li><strong>Frederick W. Taylor</strong> (1911): <strong>organització científica del treball</strong> (<em>scientific management</em>). Estudi de temps i moviments, selecció científica del treballador, incentius salarials per rendiment, separació planificació-execució. Va revolucionar la productivitat fabril però va ser criticat per deshumanitzar el treball.</li>
                        <li><strong>Max Weber</strong> (1922): model de <strong>burocràcia ideal</strong>: regles escrites, jerarquia clara, especialització funcional, impersonalitat, carrera professional basada en mèrits. Garanteix previsibilitat i equitat, però pot generar rigidesa i lentitud.</li>
                    </ul>
                    <p>Principis organitzatius clau: <strong>unitat de comandament</strong> (cada subordinat, un sol cap), <strong>jerarquia</strong> (cadena escalar d'autoritat), <strong>especialització</strong> (cada unitat es centra en una funció) i <strong><em>span of control</em></strong> (nombre de subordinats que un directiu pot supervisar eficaçment; determina si l'estructura és alta/estreta o plana/àmplia).</p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Organització formal i informal" color="green">
                    <p>
                        L'<strong>organització formal</strong> és l'estructura oficial, dissenyada deliberadament per la direcció: organigrames, manuals de funcions, procediments escrits. Defineix les relacions d'autoritat, responsabilitat i comunicació establides.
                    </p>
                    <p>
                        L'<strong>organització informal</strong> sorgeix espontàniament de les relacions personals, afinitats, hàbits i normes no escrites entre els membres. <strong>Elton Mayo</strong> (experimentos de Hawthorne, 1924-1932) va demostrar que els factors socials i psicològics influeixen en la productivitat tant o més que les condicions físiques del treball.
                    </p>
                    <p>
                        La direcció eficaç reconeix l'organització informal, la canalitza i l'aprofita. Ignorar-la genera conflictes; reprimir-la, resistència. Els líders informals poden ser aliats o adversaris del canvi organitzatiu.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── 2. ESTRUCTURA ORGANITZATIVA ─────────────────────────── */}
            <Card title="2. Estructura organitzativa" icon="📘">
                <TheoryBlock title="2.1. Concepte" color="amber">
                    <p>
                        <strong>Henry Mintzberg</strong> (1979) va definir l'estructura organitzativa com «el conjunt de formes en què es divideix el treball en tasques distintes i s'aconsegueix la coordinació entre elles». Va identificar <strong>cinc parts fonamentals</strong> de tota organització:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Àpex estratègic</strong>: alta direcció, responsable de l'estratègia global.</li>
                        <li><strong>Línia mitjana</strong>: directius intermedis que connecten l'àpex amb el nucli operatiu.</li>
                        <li><strong>Nucli d'operacions</strong>: treballadors que realitzen el treball bàsic de producció.</li>
                        <li><strong>Tecnoestructura</strong>: analistes que dissenyen sistemes, planifiquen i controlen (controllers, enginyers de processos).</li>
                        <li><strong>Staff de suport</strong>: unitats que presten serveis interns (assessoria jurídica, cafeteria, relacions públiques).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="2.2. Tipus d'estructura" color="pink">
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Estructura lineal/jeràrquica</strong>: autoritat directa del superior sobre el subordinat. Simple, clara, unitat de comandament. Adequada per a PIME. Limitació: sobrecàrrega del directiu, falta d'especialització.</li>
                        <li><strong>Estructura funcional</strong>: l'organització es divideix per funcions especialitzades (producció, màrqueting, finances, RRHH). Alta especialització però pot trencar la unitat de comandament (un treballador pot rebre ordes de diversos caps funcionals).</li>
                        <li><strong>Estructura divisional</strong>: l'empresa es divideix en unitats autònomes (divisions) per <strong>producte</strong>, <strong>mercat/client</strong> o <strong>zona geogràfica</strong>. Cada divisió funciona quasi com una empresa independent. Adequada per a empreses grans i diversificades. Risc: duplicació de recursos.</li>
                        <li><strong>Estructura matricial</strong>: combina l'organització funcional i la de projectes. Cada empleat té un cap funcional i un cap de projecte. Alta flexibilitat però doble autoritat pot generar conflictes.</li>
                        <li><strong>Estructura en xarxa/trèvol</strong> (Handy, 1989): nucli professional reduït + subcontractació + treball flexible + clients com a coproductors. Pròpia de l'era digital i l'economia del coneixement. Empresa-xarxa, organització virtual.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="2.3. Organigrames" color="violet">
                    <p>
                        L'<strong>organigrama</strong> és la representació gràfica de l'estructura organitzativa formal. Mostra les unitats, els nivells jeràrquics i les relacions d'autoritat.
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Vertical</strong>: la jerarquia es representa de dalt a baix. El més habitual.</li>
                        <li><strong>Horitzontal</strong>: d'esquerra a dreta. Útil per a estructures planes.</li>
                        <li><strong>Circular</strong>: la direcció al centre, les unitats en anells concèntrics. Menys jeràrquic visualment.</li>
                    </ul>
                    <p>
                        <strong>Utilitat</strong>: visió global de l'estructura, identificació de responsabilitats, ferramenta de comunicació interna i externa. <strong>Limitacions</strong>: no reflecteix l'organització informal, pot quedar obsolet ràpidament, simplifica relacions complexes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Centralització vs descentralització" color="red">
                    <p>
                        La <strong>centralització</strong> concentra la presa de decisions en l'alta direcció; la <strong>descentralització</strong> la delega a nivells inferiors o unitats perifèriques.
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Avantatges de la centralització</strong>: coherència, control, visió global, aprofitament de l'experiència directiva.</li>
                        <li><strong>Avantatges de la descentralització</strong>: rapidesa de resposta, motivació del personal, adaptació local, desenrotllament de directius.</li>
                        <li><strong>Factors que influeixen</strong>: grandària de l'empresa, dispersió geogràfica, complexitat de l'entorn, cultura organitzativa, capacitació dels comandaments intermedis.</li>
                    </ul>
                    <p>
                        La tendència actual en entorns dinàmics i complexos és cap a la <strong>descentralització</strong> (empowerment, equips autònoms, organitzacions àgils), mantenint un nucli estratègic centralitzat.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── 3. FUNCIONS / ÀREES FUNCIONALS ──────────────────── */}
            <Card title="3. Les funcions o àrees funcionals de l'empresa" icon="📘">
                <TheoryBlock title="3.1. Funció de producció/operacions" color="purple">
                    <p>Engloba totes les activitats de transformació d'inputs en outputs:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Planificació de la producció</strong>: decisions de capacitat, localització, distribució en planta, programació (MRP, ERP).</li>
                        <li><strong>Gestió d'inventaris</strong>: model de Wilson (lot econòmic), sistema <strong>just-in-time</strong> (JIT) desenrotllat per Toyota (Ohno, 1988): produir el necessari, quan és necessari, en la quantitat necessària. Eliminació de malbarataments (<em>muda</em>).</li>
                        <li><strong>Qualitat total</strong> (TQM): <strong>Deming</strong> (cicle PDCA, 14 punts), <strong>Juran</strong> (trilogia de la qualitat), <strong>Ishikawa</strong> (diagrama causa-efecte). La qualitat com a responsabilitat de tots, no sols del departament de control.</li>
                        <li><strong><em>Lean manufacturing</em></strong>: producció ajustada, eliminació sistemàtica de malbarataments, millora contínua (<em>kaizen</em>), herramientas 5S, kanban, poka-yoke.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.2. Funció comercial/màrqueting" color="blue">
                    <p>Connecta l'empresa amb el mercat i el consumidor:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Investigació de mercats</strong>: recollida i anàlisi d'informació sobre consumidors, competència i entorn. Mètodes: enquestes, panels, observació, <em>big data</em>.</li>
                        <li><strong>Marketing mix (4P)</strong> — McCarthy (1960):
                            <ul className="list-disc pl-5 mt-1 space-y-0.5">
                                <li><strong>Producte</strong>: disseny, marca, cicle de vida, cartera de productes.</li>
                                <li><strong>Preu</strong>: estratègies de fixació (costos, competència, valor percebut), discriminació de preus.</li>
                                <li><strong>Distribució (<em>Place</em>)</strong>: canals (directe, curt, llarg), logística, e-commerce.</li>
                                <li><strong>Comunicación (<em>Promotion</em>)</strong>: publicitat, promoció de vendes, relacions públiques, venda personal, màrqueting digital.</li>
                            </ul>
                        </li>
                        <li><strong>Màrqueting digital i CRM</strong>: xarxes socials, SEO/SEM, inbound marketing, gestió de la relació amb el client (<em>Customer Relationship Management</em>).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.3. Funció financera" color="green">
                    <p>Gestiona els fluxos monetaris de l'empresa:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Inversió</strong>: selecció de projectes (VAN, TIR, payback), pressupost de capital.</li>
                        <li><strong>Finançament</strong>: fonts pròpies (capital social, reserves, autofinançament) i alienes (préstecs, emprèstits, leasing, factoring, crèdit comercial). Cost de capital, estructura financera òptima (Modigliani-Miller, <em>trade-off theory</em>).</li>
                        <li><strong>Gestió de tresoreria</strong>: cash flow, fons de maniobra, gestió de cobraments i pagaments.</li>
                        <li><strong>Anàlisi financer</strong>: ràtios de liquiditat, solvència, rendibilitat (ROA, ROE), endeutament. Estats financers: balanç, compte de pèrdues i guanys, estat de fluxos d'efectiu.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.4. Funció de recursos humans" color="amber">
                    <p>Gestiona el factor humà, l'actiu més valuós:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Reclutament i selecció</strong>: atracció de candidats, procés de selecció (entrevistes, tests, assessment center).</li>
                        <li><strong>Formació i desenrotllament</strong>: plans de formació, gestió del talent, plans de carrera.</li>
                        <li><strong>Avaluació de l'exercici</strong>: sistemes d'avaluació, feedback 360°, gestió per objectius (Drucker).</li>
                        <li><strong>Motivación</strong>:
                            <ul className="list-disc pl-5 mt-1 space-y-0.5">
                                <li><strong>Maslow</strong> (1943): piràmide de necessitats (fisiològiques → seguretat → socials → estima → autorealització).</li>
                                <li><strong>Herzberg</strong> (1959): factors higiènics (eviten insatisfacció) vs motivadors (generen satisfacció).</li>
                                <li><strong>McGregor</strong> (1960): Teoria X (treballador passiu, necessita control) vs Teoria Y (treballador proactiu, busca responsabilitat).</li>
                                <li><strong>Vroom</strong> (1964): teoria de les expectatives (motivació = expectativa × instrumentalitat × valència).</li>
                            </ul>
                        </li>
                        <li><strong>Lideratge</strong>: estils autocràtic, democràtic i <em>laissez-faire</em> (Lewin). Lideratge transformacional vs transaccional (Burns, Bass).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.5. Funció d'I+D+i" color="pink">
                    <p>Motor de la competitivitat a llarg termini:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Investigació bàsica</strong>: generació de coneixement sense aplicació immediata.</li>
                        <li><strong>Investigació aplicada</strong>: orientada a resoldre problemes pràctics concrets.</li>
                        <li><strong>Desenrotllament tecnològic</strong>: transformació del coneixement en productes, processos o prototips.</li>
                        <li><strong>Innovación</strong> (Manual de Oslo, OCDE):
                            <ul className="list-disc pl-5 mt-1 space-y-0.5">
                                <li>De <strong>producto</strong>: béns o serveis nous o significativament millorats.</li>
                                <li>De <strong>proceso</strong>: millores en els mètodes de producció o distribució.</li>
                                <li><strong>Organizativa</strong>: noves pràctiques de gestió, organització del treball o relacions externes.</li>
                                <li>De <strong>marketing</strong>: canvis significatius en disseny, envàs, posicionament o preu.</li>
                            </ul>
                        </li>
                        <li>Espanya inverteix ≈ 1,4% del PIB en I+D (2023), per davall de la mitjana UE (≈ 2,2%) i lluny dels líders (Suècia ≈ 3,4%, Alemanya ≈ 3,1%).</li>
                    </ul>
                </TheoryBlock>
            </Card>

            {/* ── 4. OBJECTIUS DE L'EMPRESA ──────────────────────────── */}
            <Card title="4. Objectius de l'empresa" icon="📘">
                <TheoryBlock title="4.1. Maximització del benefici" color="purple">
                    <p>
                        L'enfocament <strong>clàssic/neoclàssic</strong> assumeix que l'objectiu de l'empresa és maximitzar el benefici (π = IT − CT). <strong>Milton Friedman</strong> (1970) va sostindre que «la responsabilitat social de l'empresa és incrementar els seus beneficis»: el directiu ha de maximitzar el valor per a l'accionista (<em>shareholder value</em>) dins del marc legal. Este enfocament segueix sent dominant en l'economia financera.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Altres objectius" color="blue">
                    <p>La realitat empresarial mostra una pluralitat d'objectius, sovint coexistents:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Crecimiento</strong> (Marris, 1964): els directius poden preferir el creixement de l'empresa (més poder, estatus, remuneració) al màxim benefici.</li>
                        <li><strong>Poder de mercat</strong>: augmentar la quota de mercat per a influir en preus i condicions.</li>
                        <li><strong>Supervivència</strong>: en entorns turbulents, la continuïtat pot ser l'objectiu prioritari.</li>
                        <li><strong>Satisfacción</strong> (Simon, 1955): <strong>racionalitat limitada</strong> → els agents no maximitzen sinó que busquen resultats «satisfactoris» (<em>satisficing</em>). Els directius persegueixen nivells acceptables de benefici, creixement i quota.</li>
                        <li><strong>Objectius socials</strong>: ocupació, desenrotllament local, sostenibilitat mediambiental, benestar dels treballadors.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.3. Responsabilitat Social Corporativa (RSC)" color="green">
                    <p>
                        La RSC implica que l'empresa integra voluntàriament preocupacions socials, mediambientals i ètiques en la seua estratègia i operacions, més enllà de les obligacions legals.
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Triple bottom line</strong> (Elkington, 1997): l'empresa ha de generar valor en tres dimensions — <strong>econòmica</strong> (beneficis), <strong>social</strong> (persones) i <strong>mediambiental</strong> (planeta). <em>People, Planet, Profit</em>.</li>
                        <li><strong>Stakeholders vs shareholders</strong>: <strong>Freeman</strong> (1984) va ampliar l'enfocament de Friedman: l'empresa ha de considerar els interessos de tots els <strong>grups d'interés</strong> (<em>stakeholders</em>): treballadors, clients, proveïdors, comunitat local, medi ambient, administracions públiques, no sols els accionistes (<em>shareholders</em>).</li>
                        <li><strong>ODS (Objectius de Desenrotllament Sostenible)</strong>: l'Agenda 2030 de Nacions Unides estableix 17 objectius que les empreses poden integrar en la seua estratègia.</li>
                        <li><strong>ESG</strong> (<em>Environmental, Social, Governance</em>): criteris d'inversió responsable que avaluen l'impacte mediambiental, social i de governança de les empreses.</li>
                        <li><strong>Economía del bien común</strong> (Felber, 2010): mesura l'èxit empresarial no sols pels beneficis financers, sinó per la contribució al bé comú (dignitat humana, solidaritat, sostenibilitat, participació democràtica).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.4. Govern corporatiu" color="amber">
                    <p>
                        El <strong>govern corporatiu</strong> és el conjunt de normes, principis i procediments que regulen l'estructura i el funcionament dels òrgans de govern de l'empresa, especialment en les societats cotitzades on la <strong>separació propietat-gestió</strong> és màxima.
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Consell d'administració</strong>: òrgan col·legiat que supervisa la gestió, nomena i controla els directius, aprova l'estratègia. Composició: consellers executius, dominicals i independents.</li>
                        <li><strong>Transparència</strong>: informació financera i no financera (informes de sostenibilitat, memòria de RSC), auditoria externa, comité d'auditoria.</li>
                        <li><strong>Codis de bon govern</strong> a Espanya: Informe Olivencia (1998), Informe Aldama (2003), Codi Unificat de Bon Govern (CNMV, 2006, actualitzat en 2015 i 2020). Principi «complir o explicar» (<em>comply or explain</em>).</li>
                    </ul>
                </TheoryBlock>
            </Card>

            {/* ── 5. RELEVANCIA CURRICULAR ─────────────────────────── */}

            {/* ── CONCLUSIÓ ───────────────────────────────────────── */}
            <Card title="Conclusió" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        Al llarg d'este tema s'ha analitzat l'empresa com a organització des de quatre perspectives complementàries. En primer lloc, l'<strong>organització empresarial</strong>: els principis clàssics (Fayol, Taylor, Weber), la dialèctica entre organització formal i informal (Mayo, Hawthorne) i els conceptes de divisió del treball i coordinació.
                    </p>
                    <p>
                        En segon lloc, l'<strong>estructura organitzativa</strong>: el model de Mintzberg (cinc parts), els tipus d'estructura (lineal, funcional, divisional, matricial, en xarxa) i les ferramentes de representació (organigrames). S'ha analitzat el continu centralització-descentralització i la tendència actual cap a organitzacions més planes i àgils.
                    </p>
                    <p>
                        En tercer lloc, les <strong>àrees funcionals</strong>: producció (JIT, qualitat total, <em>lean</em>), màrqueting (4P, CRM), finances (inversió, finançament, anàlisi), recursos humans (motivació: Maslow, Herzberg, McGregor, Vroom; lideratge) i I+D+i (innovació segons el Manual d'Oslo).
                    </p>
                    <p>
                        Finalment, els <strong>objectius de l'empresa</strong>: des de la maximització del benefici (Friedman) fins a la pluralitat de fins (creixement, supervivència, satisficing de Simon), la RSC (triple bottom line, stakeholders de Freeman, ODS, ESG, economia del bé comú) i el govern corporatiu (codis de bon govern). El tema tanca el Bloc B connectant la teoria econòmica amb la gestió empresarial, pilar de la formació en Economia de l'Empresa.
                    </p>
                </div>
            </Card>

                <p>- Coneix <strong>Mintzberg</strong> (5 parts de l'organització) i els <strong>5 tipus d'estructura</strong>: lineal, funcional, divisional, matricial, en xarxa/trèvol (Handy).</p>
                <p>- En <strong>RRHH</strong>: Maslow (piràmide), Herzberg (higiènics/motivadors), McGregor (X/Y), Vroom (expectatives). En <strong>producció</strong>: JIT, TQM, <em>lean</em>.</p>
                <p>- Diferencia <strong>maximització de benefici</strong> (Friedman) de <strong>RSC</strong> (triple bottom line, stakeholders de Freeman, ESG, ODS). Coneix <strong>govern corporatiu</strong> (codis CNMV).</p>
                <p>- Connecta amb LOMLOE (CE1, CE3, CE5), competència emprenedora, STEM, CC, i tanca Bloc B vinculant teoria econòmica amb gestió.</p>
