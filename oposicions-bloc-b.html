    const { useState, useMemo, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area, ReferenceLine, Legend, BarChart, Bar, ComposedChart, Scatter, PieChart, Pie, Cell, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar } = Recharts;

    function BlocBApp() {
        const [section, setSection] = useState('inicio');
        const [idioma, setIdioma] = useState(PdeLanguageStore.get());
        usePdeDeepLink(section, setSection);

        const pageTranslations = {
            'nav.oposicions-bloc-b': { val: 'Bloc B: Microeconomia', es: 'Bloque B: Microeconomía', en: 'Block B: Microeconomics' },
            'footer.appname': { val: "Bloc B — Oposicions d'Economia", es: "Bloque B — Oposiciones de Economía", en: 'Block B — Economics Exams' },
            'inicio.title': { val: 'Bloc B: Microeconomia', es: 'Bloque B: Microeconomía', en: 'Block B: Microeconomics' },
            'inicio.subtitle': { val: "Temes 11-19 de les oposicions d'Economia a Secundària. Demanda, utilitat, producció, costos, estructures de mercat, fallades del mercat i distribució de la renda.", es: 'Temas 11-19 de las oposiciones de Economía. Demanda, utilidad, producción, costes, estructuras de mercado, fallos del mercado y distribución.', en: 'Topics 11-19 of the Secondary Economics teaching exams. Demand, utility, production, costs, market structures, market failures and income distribution.' },
            'inicio.backOpo': { val: "← Tornar a Oposicions", es: '← Volver a Oposiciones', en: '← Back to Exams' },
            'inicio.disponible': { val: "Disponible", es: 'Disponible', en: 'Available' },
            'sec.inicio': { val: 'Inici', es: 'Inicio', en: 'Home' },
            'tab.complet': { val: 'Tema complet', es: 'Tema completo', en: 'Full topic' },
            'tab.resum': { val: 'Resum / Esquema', es: 'Resumen / Esquema', en: 'Summary / Outline' },
            'tema11.title': { val: "Teoria de la demanda i de la utilitat. Comportament consumidor. Efectes renda i substitució.", es: 'Teoría de la demanda y utilidad. Efectos renta y sustitución.', en: 'Demand and utility theory. Consumer behaviour.' },
            'tema12.title': { val: "La funció de producció. Isoquantes i isocostes. Funció homogènia. Rendiments decreixents.", es: 'Función de producción. Isocuantas e isocostes. Rendimientos decrecientes.', en: 'Production function. Isoquants and isocosts.' },
            'tema13.title': { val: "Costos de producció a CP i LP. Economies i deseconomies d'escala. Dimensió òptima.", es: 'Costes CP y LP. Economías de escala. Dimensión óptima.', en: 'Short and long-run costs. Economies of scale.' },
            'tema14.title': { val: "Supòsits de la competència perfecta. Formes de competència. Funcionament del mercat CP.", es: 'Supuestos de la competencia perfecta. Funcionamiento.', en: 'Perfect competition. Assumptions and functioning.' },
            'tema15.title': { val: "Competència imperfecta i concentració. El monopoli. Regulació del monopoli.", es: 'Competencia imperfecta. Monopolio. Regulación.', en: 'Imperfect competition. Monopoly and regulation.' },
            'tema16.title': { val: "L'oligopoli. Colusió i competència. Competència monopolística. Diferenciació i publicitat.", es: 'Oligopolio. Colusión y competencia. Competencia monopolística.', en: 'Oligopoly. Collusion. Monopolistic competition.' },
            'tema17.title': { val: "Desequilibris i limitacions del mercat. Béns públics. Externalitats. Òptims paretians.", es: 'Desequilibrios del mercado. Bienes públicos. Externalidades. Pareto.', en: 'Market failures. Public goods. Externalities. Pareto optima.' },
            'tema18.title': { val: "La intervenció de l'Estat: justificació i funcions. Medis i instruments.", es: 'La intervención del Estado: justificación y funciones.', en: 'State intervention: justification and tools.' },
            'tema19.title': { val: "La distribució de la renda. Teoria marginal de la distribució. Polítiques de distribució.", es: 'La distribución de la renta. Teoría marginal. Políticas.', en: 'Income distribution. Marginal theory. Distribution policies.' },
        };

        const t = createTranslator(pageTranslations, idioma);
        const lang = idioma;

        const Card = ({ children, className = "", title, icon }) => (<div className={`bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 hover:shadow-md transition-shadow ${className} animate-fade`}>{title && <div className="flex items-center gap-3 mb-5 pb-4 border-b border-slate-100"><span className="text-2xl">{icon}</span><h3 className="font-bold text-slate-800 text-lg">{title}</h3></div>}{children}</div>);
        const Tabs = ({ tabs, active, onChange }) => (<div className="flex flex-wrap gap-1 p-1.5 bg-slate-100 rounded-xl">{tabs.map(tab => (<button key={tab.id} onClick={() => onChange(tab.id)} className={`flex-1 min-w-fit py-2.5 px-4 rounded-lg text-sm font-semibold transition-all ${active === tab.id ? 'bg-white shadow-sm text-pink-600' : 'text-slate-600 hover:text-slate-800 hover:bg-white/50'}`}>{tab.label}</button>))}</div>);
        const TheoryBlock = ({ title, children, color = "slate" }) => { const colors = { slate: "border-slate-300 bg-slate-50", blue: "border-blue-300 bg-blue-50", teal: "border-teal-300 bg-teal-50", cyan: "border-cyan-300 bg-cyan-50", indigo: "border-indigo-300 bg-indigo-50", violet: "border-violet-300 bg-violet-50", green: "border-green-300 bg-green-50", emerald: "border-emerald-300 bg-emerald-50", amber: "border-amber-300 bg-amber-50", rose: "border-rose-300 bg-rose-50", red: "border-red-300 bg-red-50", orange: "border-orange-300 bg-orange-50", pink: "border-pink-300 bg-pink-50", fuchsia: "border-fuchsia-300 bg-fuchsia-50" }; return (<div className={`border-l-4 ${colors[color] || colors.slate} p-5 rounded-r-xl my-4`}>{title && <h4 className="font-bold text-slate-800 mb-3 text-base">{title}</h4>}<div className="text-slate-700 text-sm leading-relaxed space-y-2">{children}</div></div>); };
        const FormulaBox = ({ formula, desc }) => (<div className="my-4 p-5 bg-gradient-to-r from-pink-50 to-rose-50 rounded-xl border border-pink-100"><p className="text-center font-mono text-lg text-pink-800 font-semibold">{formula}</p>{desc && <p className="text-center text-sm text-pink-600 mt-2">{desc}</p>}</div>);
        const SectionTitle = ({ icon, title, subtitle }) => (<div className="mb-8"><div className="flex items-center gap-3 mb-2"><span className="text-3xl">{icon}</span><h1 className="text-3xl font-black text-slate-800">{title}</h1></div>{subtitle && <p className="text-slate-500 ml-12 text-sm">{subtitle}</p>}</div>);
        const BibliografiaBox = ({ items }) => (<div className="my-6 p-6 bg-gradient-to-r from-slate-50 to-gray-50 rounded-xl border border-slate-200"><h4 className="font-bold text-slate-800 mb-4 text-base flex items-center gap-2"><span>📚</span> Bibliografia</h4><ul className="space-y-2">{items.map((item, i) => <li key={i} className="text-sm text-slate-700 leading-relaxed pl-4 border-l-2 border-slate-200">{item}</li>)}</ul></div>);
        const ClauBox = ({ children }) => (<div className="my-4 p-5 bg-gradient-to-r from-amber-50 to-yellow-50 rounded-xl border border-amber-200"><div className="flex items-start gap-3"><span className="text-2xl">🔑</span><div><h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4><div className="text-sm text-amber-800 space-y-1">{children}</div></div></div></div>);

        // ==================== TEMA 11 — Demanda i utilitat ====================
        const Tema11Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>teoria del consumidor</strong> és el punt de partida de la microeconomia. Explica com les famílies assignen una renda limitada entre béns i serveis per maximitzar el benestar. La <strong>revolució marginalista</strong> de <strong>Jevons, Menger i Walras (1871-74)</strong> va substituir la teoria del valor-treball (Smith, Ricardo) per la teoria del valor-utilitat marginal.</p>
                    <p>Més tard, <strong>Pareto (1906)</strong> i <strong>Hicks-Allen (1934)</strong> van formalitzar l'enfocament ordinal basat en corbes d'indiferència, evitant el problema de mesurar cardinalment la utilitat. Aquest tema és central per a entendre la <strong>demanda del mercat</strong> (Tema 14) i la <strong>distribució de la renda</strong> (Tema 19).</p>
                    <p>En termes normatius, l'equilibri del consumidor fonamenta l'<strong>eficiència assignativa</strong> del mercat competitiu i constitueix la base per analitzar <strong>polítiques públiques</strong> (Tema 18) en matèria de consum, fiscalitat i benestar.</p>
                </div></Card>

                <Card title="1. Utilitat: cardinal i ordinal" icon="😊">
                    <TheoryBlock title="1.1. Utilitat cardinal (marginalistes 1871-74)" color="pink">
                        <p><strong>Jevons (1871)</strong>, <strong>Menger (1871)</strong> i <strong>Walras (1874)</strong> suposen que la utilitat és mesurable en útils (u). Es distingeix:</p>
                        <p>• <strong>Utilitat total (UT)</strong>: satisfacció total de consumir q unitats.</p>
                        <p>• <strong>Utilitat marginal (UMg)</strong>: ΔUT / Δq. <strong>Llei de Gossen (1854)</strong>: UMg decreixent.</p>
                        <p>• <strong>Paradoxa de l'aigua i el diamant</strong> (Smith): resolta per UMg, no per UT.</p>
                    </TheoryBlock>
                    <TheoryBlock title="1.2. Utilitat ordinal (Pareto, Hicks)" color="rose">
                        <p><strong>Pareto (1906)</strong> proposa que només cal ordenar cistelles (més preferida, igual, menys preferida). <strong>Hicks i Allen (1934)</strong> formalitzen les <strong>corbes d'indiferència</strong>: conjunt de cistelles (x, y) que reporten la mateixa satisfacció. Propietats: decreixents, convexes a l'origen, no es tallen, més altes = més preferides.</p>
                        <p>La <strong>Relació Marginal de Substitució (RMS)</strong> mesura quantes unitats de y s'està disposat a cedir per una unitat addicional de x, mantenint la utilitat. RMS decreixent = convexitat.</p>
                    </TheoryBlock>
                    <FormulaBox formula="RMSxy = -dy/dx = UMgx / UMgy" desc="Relació Marginal de Substitució" />
                </Card>

                <Card title="2. Restricció pressupostària i equilibri" icon="💳">
                    <TheoryBlock title="2.1. Recta de balanç" color="fuchsia">
                        <p>Donada una renda M i preus (Px, Py), el consumidor pot adquirir totes les combinacions que compleixen: <strong>Px·x + Py·y ≤ M</strong>. La frontera és una recta amb pendent -Px/Py (preus relatius).</p>
                        <p>Canvis: si varia M → desplaçament paral·lel; si varia un preu → gir al voltant de l'altre eix.</p>
                    </TheoryBlock>
                    <TheoryBlock title="2.2. Equilibri del consumidor" color="pink">
                        <p>El consumidor maximitza U(x,y) subjecte a la restricció pressupostària. La condició d'òptim: la corba d'indiferència és tangent a la recta de balanç.</p>
                        <p><strong>Condició d'equimarginalitat (Gossen 1854)</strong>: en l'òptim, la utilitat marginal per euro gastat s'iguala entre tots els béns.</p>
                    </TheoryBlock>
                    <FormulaBox formula="UMgx / Px = UMgy / Py = λ   ⇔   RMSxy = Px / Py" desc="Condició d'òptim del consumidor (Lagrange)" />

                    <div className="my-6 p-5 bg-gradient-to-br from-pink-50 to-rose-50 rounded-xl border border-pink-200">
                        <h4 className="font-bold text-pink-800 mb-3 text-sm text-center">Equilibri: corbes d'indiferència i restricció pressupostària</h4>
                        <svg viewBox="0 0 420 280" className="mx-auto" style={{maxWidth: '420px'}}>
                            <line x1="40" y1="240" x2="400" y2="240" stroke="#334155" strokeWidth="1.5"/>
                            <line x1="40" y1="240" x2="40" y2="20" stroke="#334155" strokeWidth="1.5"/>
                            <text x="395" y="258" fontSize="11" fill="#334155">x</text>
                            <text x="20" y="25" fontSize="11" fill="#334155">y</text>
                            <line x1="40" y1="40" x2="340" y2="240" stroke="#475569" strokeWidth="2"/>
                            <text x="310" y="60" fontSize="10" fill="#475569">M = Px·x + Py·y</text>
                            <path d="M 80 220 Q 130 150 220 125 Q 300 105 350 100" stroke="#ec4899" strokeWidth="2" fill="none"/>
                            <path d="M 60 230 Q 110 180 180 155 Q 260 135 320 130" stroke="#fda4af" strokeWidth="1.5" fill="none" strokeDasharray="4,3"/>
                            <path d="M 100 200 Q 160 140 240 110 Q 320 85 370 80" stroke="#be185d" strokeWidth="1.5" fill="none" strokeDasharray="4,3"/>
                            <circle cx="180" cy="155" r="5" fill="#e11d48"/>
                            <text x="188" y="150" fontSize="11" fill="#e11d48" fontWeight="bold">E</text>
                            <text x="195" y="168" fontSize="9" fill="#e11d48">òptim</text>
                            <text x="340" y="115" fontSize="9" fill="#ec4899">U₁</text>
                            <text x="360" y="95" fontSize="9" fill="#be185d">U₂</text>
                        </svg>
                        <p className="text-xs text-pink-700 text-center mt-2">Tangència entre la corba d'indiferència i la recta de balanç</p>
                    </div>
                </Card>

                <Card title="3. Demanda individual i efectes (Slutsky 1915)" icon="📉">
                    <TheoryBlock title="3.1. Llei de la demanda" color="rose">
                        <p>Variar Px provoca moviment al llarg de la corba d'indiferència i canvi de la recta pressupostària. Traçant l'òptim per a diferents preus → <strong>corba de demanda individual</strong> de Marshall. En general, decreixent (<strong>llei de la demanda</strong>).</p>
                    </TheoryBlock>
                    <TheoryBlock title="3.2. Efecte renda i efecte substitució (Slutsky 1915, Hicks 1939)" color="fuchsia">
                        <p>Una variació de Px descompondre's en dos efectes:</p>
                        <p>• <strong>Efecte substitució</strong>: canvi de consum mantenint la utilitat (bé relativament més car → consumir-ne menys). Sempre negatiu.</p>
                        <p>• <strong>Efecte renda</strong>: canvi per variació del poder adquisitiu real. Positiu si bé normal, negatiu si inferior.</p>
                        <p><strong>Béns Giffen</strong> (cas extrem): bé inferior on l'efecte renda supera l'efecte substitució → demanda ascendent. Exemple clàssic: patates a la Irlanda del XIX (Giffen, 1895).</p>
                        <p><strong>Béns Veblen</strong>: de luxe ostentós (Veblen 1899), demanda creixent amb el preu per senyalització.</p>
                    </TheoryBlock>
                    <FormulaBox formula="ΔDemanda total = Efecte substitució + Efecte renda" desc="Descomposició Slutsky-Hicks" />
                </Card>

                <Card title="4. Elasticitats de la demanda" icon="📏">
                    <TheoryBlock title="4.1. Elasticitat-preu" color="pink">
                        <p><strong>Ep = (ΔQ/Q) / (ΔP/P)</strong>. Classificació: |Ep|&gt;1 elàstica, =1 unitària, &lt;1 inelàstica, =0 perfectament inelàstica (insulina), =∞ perfectament elàstica.</p>
                        <p>Relació amb l'ingrés total: si demanda elàstica, pujar preu → baixa ingrés; si inelàstica, pujar preu → puja ingrés.</p>
                    </TheoryBlock>
                    <TheoryBlock title="4.2. Elasticitat-renda i creuada" color="rose">
                        <p>• <strong>Elasticitat-renda (Er)</strong>: Er&gt;0 bé normal, Er&lt;0 bé inferior, Er&gt;1 bé de luxe. <strong>Llei d'Engel (1857)</strong>: a més renda, menys proporció a alimentació.</p>
                        <p>• <strong>Elasticitat creuada (Ec)</strong>: Ec&gt;0 béns substitutius (te-cafè), Ec&lt;0 complementaris (cotxe-gasolina), Ec=0 independents.</p>
                    </TheoryBlock>
                    <FormulaBox formula="Ep = (∂Q/∂P)·(P/Q)     Er = (∂Q/∂M)·(M/Q)" desc="Fórmules d'elasticitat puntual" />
                </Card>

                <Card title="5. Excedent del consumidor i noves teories" icon="💡">
                    <TheoryBlock title="5.1. Excedent del consumidor (Marshall 1890)" color="pink">
                        <p>Diferència entre el que el consumidor està disposat a pagar (màxim) i el que realment paga (preu de mercat). Àrea sota la corba de demanda i sobre el preu. Mesura el benestar del consumidor.</p>
                    </TheoryBlock>
                    <TheoryBlock title="5.2. Teoria de la preferència revelada (Samuelson 1938)" color="rose">
                        <p><strong>Samuelson</strong> deriva la demanda des del comportament observat, sense necessitat d'assumir funcions d'utilitat inobservables. Fonament axiomàtic: WARP (Weak Axiom of Revealed Preference).</p>
                    </TheoryBlock>
                    <TheoryBlock title="5.3. Economia conductual (Kahneman-Tversky 1979)" color="fuchsia">
                        <p><strong>Kahneman i Tversky (Nobel 2002)</strong>: teoria de les perspectives. Els consumidors no són totalment racionals: aversió a les pèrdues, ancoratge, efecte marc. Crítica al homo economicus.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La teoria de la demanda, des de <strong>Jevons/Menger/Walras (1871-74)</strong> fins a l'economia conductual moderna, ofereix un marc rigorós per entendre el comportament del consumidor. Els efectes renda i substitució de <strong>Slutsky (1915)</strong> són eina central d'anàlisi de polítiques (impostos al sucre, subsidis, IVA reduït). L'integració amb l'economia conductual (<strong>Kahneman 2002</strong>, <strong>Thaler 2017</strong>) enriqueix el model en un context d'educació financera i consum sostenible.</p>
                </div></Card>

                <BibliografiaBox items={[
                    'JEVONS, W.S. (1871): The Theory of Political Economy, Macmillan.',
                    'MENGER, C. (1871): Grundsätze der Volkswirtschaftslehre.',
                    'WALRAS, L. (1874): Éléments d\'économie politique pure.',
                    'MARSHALL, A. (1890): Principles of Economics, Macmillan.',
                    'PARETO, V. (1906): Manuale di economia politica.',
                    'SLUTSKY, E. (1915): «Sulla teoria del bilancio del consumatore», Giornale degli Economisti.',
                    'HICKS, J.R. i ALLEN, R.G.D. (1934): «A Reconsideration of the Theory of Value», Economica.',
                    'SAMUELSON, P. (1938): «A Note on the Pure Theory of Consumer\'s Behaviour», Economica.',
                    'VARIAN, H.R. (2014): Intermediate Microeconomics, 9a ed., Norton.',
                    'KAHNEMAN, D. i TVERSKY, A. (1979): «Prospect Theory», Econometrica.',
                    'THALER, R. (2015): Misbehaving, Norton (Nobel 2017).',
                ]} />
            </div>
        );

        // ==================== TEMA 12 — Producció ====================
        const Tema12Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>teoria de la producció</strong> estudia com les empreses combinen factors productius (treball, capital, terra) per obtenir béns i serveis. Desenvolupada pels clàssics (<strong>Smith 1776</strong>, <strong>Ricardo 1817</strong>) i formalitzada pels neoclàssics (<strong>Clark 1899</strong>, <strong>Wicksell 1893</strong>), és la contrapartida objectiva de la teoria del consumidor.</p>
                    <p>La funció de producció <strong>Cobb-Douglas (1928)</strong> i les aportacions de <strong>Solow (1957, Nobel 1987)</strong> sobre la productivitat total dels factors han estat centrals. Al segle XXI, <strong>Acemoglu i Restrepo (2018)</strong> l'han estès per incorporar automatització i IA.</p>
                </div></Card>

                <Card title="1. Factors productius i funció de producció" icon="🏭">
                    <TheoryBlock title="1.1. Factors" color="pink">
                        <p>Classes tradicionals: <strong>treball (L)</strong>, <strong>capital (K)</strong>, <strong>terra/recursos (T)</strong>. Modernament s'afegeixen: <strong>capital humà</strong> (Becker 1964, Nobel 1992), <strong>tecnologia (A)</strong>, <strong>capital natural</strong> (sostenibilitat).</p>
                    </TheoryBlock>
                    <TheoryBlock title="1.2. Funció de producció" color="rose">
                        <p>Relació tècnica màxima entre factors i producte: <strong>Q = f(K, L, ...)</strong>. Horitzó temporal:</p>
                        <p>• <strong>Curt termini</strong>: almenys un factor fix (K). Variacions només a L.</p>
                        <p>• <strong>Llarg termini</strong>: tots els factors variables.</p>

                    <TheoryBlock title="2.1. Productivitat total, mitjana i marginal" color="fuchsia">
                        <p>• <strong>PT</strong>: Q total produïda.</p>
                        <p>• <strong>PMe (mitjana)</strong> = Q/L. Productivitat del treball.</p>
                        <p>• <strong>PMg (marginal)</strong> = ΔQ/ΔL. Producte de l'última unitat de L afegida.</p>
                        <p>Relacions: PMg&gt;PMe → PMe creix; PMg&lt;PMe → PMe decreix; PMg=PMe → màxim de PMe.</p>
                    </TheoryBlock>
                    <TheoryBlock title="2.2. Llei de rendiments marginals decreixents" color="pink">
                        <p>Formulada per <strong>Turgot (1767)</strong> i <strong>Ricardo (1817)</strong>: afegint unitats d'un factor variable a un factor fix, a partir d'un punt, la productivitat marginal decreix.</p>
                        <p>Etapes: (I) PMg creix; (II) PMg decreixent però PT creixent; (III) PMg&lt;0, PT decreix.</p>
                        <p>L'empresa racional produeix dins l'<strong>etapa II</strong>.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Producció a llarg termini: isoquantes i isocostos" icon="⚙️">
                    <TheoryBlock title="3.1. Isoquantes" color="rose">
                        <p>Corba que recull combinacions (K, L) que generen la mateixa quantitat Q. Propietats: decreixents, convexes, no es tallen, més altes = major producció.</p>
                        <p>La pendent és la <strong>Relació Marginal de Substitució Tècnica (RMST)</strong>: RMSTkl = PMgL/PMgK.</p>
                    </TheoryBlock>
                    <TheoryBlock title="3.2. Isocostos" color="fuchsia">
                        <p>Recta de combinacions (K, L) amb el mateix cost total: <strong>CT = r·K + w·L</strong>, on r és el preu del capital i w el salari. Pendent: -w/r.</p>
                    </TheoryBlock>
                    <TheoryBlock title="3.3. Equilibri del productor" color="pink">
                        <p>L'empresa minimitza cost per a un Q donat (o maximitza Q per a un CT donat): tangència entre isoquanta i isocost.</p>
                    </TheoryBlock>
                    <FormulaBox formula="PMgL / w = PMgK / r   ⇔   RMSTkl = w / r" desc="Condició d'òptim del productor" />

                    <div className="my-6 p-5 bg-gradient-to-br from-pink-50 to-rose-50 rounded-xl border border-pink-200">
                        <h4 className="font-bold text-pink-800 mb-3 text-sm text-center">Isoquantes i isocost: òptim del productor</h4>

                            <path d="M 120 230 Q 200 195 280 180 Q 360 175 395 170" stroke="#be185d" strokeWidth="1.5" fill="none" strokeDasharray="4,3"/>

                            <text x="210" y="150" fontSize="11" fill="#e11d48" fontWeight="bold">E*</text>

                        </svg>
                        <p className="text-xs text-pink-700 text-center mt-2">Òptim: tangència isoquanta-isocost</p>
                    </div>
                </Card>

                <Card title="4. Funcions homogènies i rendiments a escala" icon="📐">
                    <TheoryBlock title="4.1. Funció homogènia de grau n" color="rose">
                        <p>Una funció f(K, L) és homogènia de grau n si f(λK, λL) = λⁿ·f(K, L). Mesura els rendiments a escala:</p>
                        <p>• <strong>n = 1</strong>: rendiments constants.</p>
                        <p>• <strong>n &gt; 1</strong>: rendiments creixents (economies d'escala).</p>
                        <p>• <strong>n &lt; 1</strong>: rendiments decreixents (deseconomies d'escala).</p>
                        <p>Diferent de la llei de rendiments decreixents (que afecta un factor fix a CP).</p>
                    </TheoryBlock>
                    <TheoryBlock title="4.2. Funció Cobb-Douglas (1928)" color="pink">
                        <p>Publicada per <strong>Charles W. Cobb i Paul H. Douglas</strong> el 1928: <strong>Q = A · Kᵅ · Lᵝ</strong>.</p>
                        <p>• <strong>A</strong>: productivitat total dels factors (tecnologia).</p>
                        <p>• <strong>α, β</strong>: elasticitats parcials respecte K i L.</p>
                        <p>• <strong>α + β</strong>: rendiments a escala.</p>
                        <p>En competència perfecta, α i β són les participacions del capital i del treball a la renda nacional. Àmpliament usada en <strong>models de creixement</strong> (Solow 1956).</p>
                    </TheoryBlock>
                    <FormulaBox formula="Q = A · K^α · L^β      α + β : rendiments a escala" desc="Funció Cobb-Douglas (1928)" />
                </Card>

                <Card title="5. Progrés tècnic i camí d'expansió" icon="🚀">
                    <TheoryBlock title="5.1. Progrés tècnic" color="fuchsia">
                        <p>El progrés tècnic desplaça la funció de producció cap amunt: amb els mateixos factors, més Q. Classificació <strong>Hicks (1932)</strong>:</p>
                        <p>• <strong>Neutre</strong>: no altera la proporció K/L.</p>
                        <p>• <strong>Intensiu en capital</strong>: augmenta PMgK relativa.</p>
                        <p>• <strong>Intensiu en treball</strong>: augmenta PMgL relativa.</p>
                        <p><strong>Solow (1957)</strong>: residu que explica el creixement no atribuïble a factors → PTF o «residu de Solow».</p>
                    </TheoryBlock>
                    <TheoryBlock title="5.2. Camí d'expansió i elasticitat de substitució" color="rose">
                        <p>El <strong>camí d'expansió</strong> uneix els òptims de mínim cost a mesura que creix el pressupost (o la producció). L'<strong>elasticitat de substitució (σ)</strong> mesura la facilitat per substituir K per L mantenint Q.</p>
                        <p>• Cobb-Douglas: σ = 1.</p>
                        <p>• Leontief (proporcions fixes): σ = 0.</p>
                        <p>• Lineal (substituts perfectes): σ = ∞.</p>
                        <p>• <strong>CES (Arrow et al. 1961)</strong>: forma general.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La teoria de la producció, ancorada en la <strong>llei de rendiments decreixents (Ricardo 1817)</strong>, les <strong>funcions homogènies</strong> i la <strong>Cobb-Douglas (1928)</strong>, ha estat aplicada a <strong>creixement macro (Solow 1956)</strong>, decisions empresarials i anàlisi de productivitat. Els reptes actuals: intel·ligència artificial (<strong>Acemoglu-Restrepo 2018</strong>), robòtica, economia verda i productivitat d'Espanya comparada amb UE.</p>

        const Tema12 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="🏭" title="Tema 12" subtitle={t('tema12.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema12Complet />}{vista === 'resum' && <Tema12Resum />}</div>; };

        // ==================== TEMA 13 — Costos ====================
        const Tema13Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>L'<strong>anàlisi de costos</strong> tradueix la funció de producció en termes monetaris, base per a la decisió d'oferta de l'empresa. <strong>Alfred Marshall (1890)</strong> va distingir formalment entre <strong>curt termini (CP)</strong> i <strong>llarg termini (LP)</strong>. El concepte de <strong>cost d'oportunitat</strong> (Wieser 1914, Robbins 1932) és central: el valor de la millor alternativa renunciada.</p>
                    <p>Les <strong>economies d'escala</strong> expliquen per què moltes indústries tendeixen a la concentració, mentre que les <strong>deseconomies</strong> limiten la grandària òptima. Aquest tema enllaça producció (Tema 12) amb les estructures de mercat (Temes 14-16).</p>
                </div></Card>

                <Card title="1. Tipus de costos i cost d'oportunitat" icon="💰">
                    <TheoryBlock title="1.1. Cost comptable vs. cost econòmic" color="pink">
                        <p>• <strong>Cost explícit</strong>: pagament monetari efectiu.</p>
                        <p>• <strong>Cost implícit (d'oportunitat)</strong>: rendiments dels recursos propis renunciats.</p>
                        <p>• <strong>Cost econòmic</strong> = explícit + implícit. Per tant, <strong>benefici econòmic &lt; benefici comptable</strong>.</p>
                        <p>• <strong>Cost irrecuperable (sunk cost)</strong>: no afecta la decisió futura.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Costos a curt termini" icon="⏱️">
                    <TheoryBlock title="2.1. Costos fixos i variables" color="rose">
                        <p>• <strong>CF</strong>: no varien amb Q (lloguers, amortitzacions, assegurances).</p>
                        <p>• <strong>CV</strong>: varien amb Q (matèries primeres, energia, hores extres).</p>
                        <p>• <strong>CT</strong> = CF + CV.</p>
                    </TheoryBlock>
                    <TheoryBlock title="2.2. Costos mitjans i marginal" color="fuchsia">
                        <p>• <strong>CFMe</strong> = CF/Q (decreixent per dilució).</p>
                        <p>• <strong>CVMe</strong> = CV/Q (forma de U per la llei rendiments).</p>
                        <p>• <strong>CMe</strong> = CT/Q = CFMe + CVMe.</p>
                        <p>• <strong>CMg</strong> = ΔCT/ΔQ = ΔCV/ΔQ. Inclou només CV en el marge.</p>
                        <p><strong>Relacions clau</strong>:</p>
                        <p>• CMg talla CMe i CVMe en els seus mínims.</p>
                        <p>• CMg&lt;CMe → CMe decreix; CMg&gt;CMe → CMe creix.</p>

                    <div className="my-6 p-5 bg-gradient-to-br from-pink-50 to-rose-50 rounded-xl border border-pink-200">
                        <h4 className="font-bold text-pink-800 mb-3 text-sm text-center">Corbes de cost a curt termini</h4>

                <Card title="3. Costos a llarg termini: envelop" icon="📈">
                    <TheoryBlock title="3.1. Corba d'embolcall (envelop)" color="pink">
                        <p>A LP tots els factors són variables. La <strong>CMeLT</strong> és l'<strong>envelop</strong> (frontera inferior) de les infinites corbes CMeCT: per a cada Q, la CMeLT selecciona la mida d'empresa que minimitza cost.</p>
                        <p><strong>Viner (1931)</strong>: cada punt de la CMeLT és tangent a una corba CMeCT, però no necessàriament al seu mínim.</p>
                    </TheoryBlock>
                    <TheoryBlock title="3.2. Economies i deseconomies d'escala" color="rose">
                        <p>• <strong>Economies d'escala</strong> (CMeLT decreixent): especialització, divisió del treball (Smith 1776), indivisibilitats tècniques, descomptes massius, justificació del monopoli natural.</p>
                        <p>• <strong>Rendiments constants</strong> (CMeLT plana): dimensió òptima mínima (MES) mantinguda.</p>
                        <p>• <strong>Deseconomies d'escala</strong> (CMeLT creixent): costos burocràtics, pèrdua control, dificultats coordinació (Williamson 1975).</p>
                        <p>• <strong>Economies d'abast (scope)</strong> (Panzar-Willig 1981): reducció de costos produint conjuntament diversos productes.</p>
                    </TheoryBlock>
                    <FormulaBox formula="CMeLT = envelop { CMeCT₁, CMeCT₂, ..., CMeCTn }" desc="Corba d'embolcall de Viner (1931)" />
                </Card>

                <Card title="4. Dimensió òptima" icon="🎯">
                    <TheoryBlock title="4.1. Tram òptim" color="fuchsia">
                        <p>La <strong>dimensió òptima mínima (MES, Minimum Efficient Scale)</strong> és la Q més petita a la qual s'assoleix el mínim de CMeLT.</p>
                        <p>• Si MES és <strong>gran</strong> respecte al mercat → poques empreses (oligopoli o monopoli natural: telefonia, energia, ferrocarrils).</p>

                    </TheoryBlock>
                    <TheoryBlock title="4.2. Dimensió òptima i competència" color="pink">
                        <p>La dimensió òptima condiciona l'estructura de mercat. L'<strong>eficiència X</strong> (Leibenstein 1966): empreses monopolistes no minimitzen costos. La globalització expandeix el mercat i permet aprofitar economies d'escala (sectors exportadors).</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>L'estructura de costos determina les decisions d'oferta i, en agregat, el tipus de mercat que predomina a cada sector. <strong>Marshall (1890)</strong> va definir CP/LP; <strong>Viner (1931)</strong> l'envelop; <strong>Williamson (1975, Nobel 2009)</strong> els costos de transacció. Els reptes actuals: costos energètics (xoc gas 2022), costos ambientals (mercat CO₂), digitalització (costos marginals pràcticament zero en programari).</p>
                </div></Card>

                    <p>La <strong>competència perfecta</strong> és un model ideal de referència de la microeconomia. Encara que rarament es compleix estrictament, ofereix el <strong>benchmark d'eficiència</strong>: l'assignació resultant és òptima en el sentit de Pareto (<strong>primer teorema del benestar</strong>, Arrow-Debreu 1954).</p>
                    <p>Desenvolupat per <strong>Alfred Marshall (1890)</strong>, formalitzat per <strong>Léon Walras (1874)</strong> amb l'equilibri general i perfeccionat per <strong>Arrow i Debreu (1954)</strong>, és essencial per a avaluar les desviacions reals (monopoli, oligopoli) i justificar les polítiques de competència.</p>

        // ==================== TEMA 16 — Oligopoli i competència monopolística ====================
        const Tema16Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>L'<strong>oligopoli</strong> i la <strong>competència monopolística</strong> són les estructures <strong>intermèdies</strong> més realistes entre els dos extrems ideals. La gran majoria de mercats reals (automoció, banca, telecomunicacions, distribució) presenten alguna d'aquestes formes.</p>
                    <p>La <strong>teoria de jocs</strong> (Von Neumann-Morgenstern 1944, Nash 1950) ha revolucionat l'anàlisi de l'oligopoli. <strong>Chamberlin (1933)</strong> i <strong>Robinson (1933)</strong>, independentment, van formalitzar la competència monopolística: molts venedors amb productes diferenciats.</p>

                <Card title="1. Oligopoli: característiques i models clàssics" icon="🤝">

                        <p>Mesura de concentració: <strong>Índex Herfindahl-Hirschman (IHH)</strong> = Σ sᵢ². IHH&gt;2500 → alta concentració (DG Competition UE).</p>

                    <TheoryBlock title="1.2. Model de Cournot (1838)" color="rose">
                        <p>Les empreses competeixen en <strong>quantitats</strong>, prenent Q del rival com donat. Es construeixen <strong>funcions de reacció</strong>; el punt d'intersecció és l'<strong>equilibri de Nash-Cournot</strong>.</p>
                        <p>Amb n empreses idèntiques: P_cournot entre P_monopoli (n=1) i P_cp (n=∞). Per a n gran, l'oligopoli Cournot s'aproxima a competència perfecta.</p>

                    <TheoryBlock title="1.3. Model de Bertrand (1883)" color="fuchsia">

                    </TheoryBlock>
                    <TheoryBlock title="1.4. Model de Stackelberg (1934)" color="pink">
                        <p>Competència en quantitats seqüencial. Un <strong>líder</strong> decideix primer, un <strong>seguidor</strong> reacciona. Avantatge del primer: Q_líder &gt; Q_seguidor, P_Stackelberg &lt; P_Cournot.</p>

                <Card title="2. Colusió i cartels" icon="🕵️">

                        <p><strong>Jocs repetits</strong> (Folk theorem, Friedman 1971): la cooperació és sostenible si el joc es repeteix infinitament i els agents són pacients (tit-for-tat, Axelrod 1984).</p>

                    <div className="my-6 p-5 bg-gradient-to-br from-pink-50 to-rose-50 rounded-xl border border-pink-200">

                        <p>Resultat: <strong>corba de demanda trencada (kinked demand)</strong> amb salt al IMg. Els preus romanen estables malgrat variacions de costos dins un rang.</p>

                <Card title="4. Competència monopolística (Chamberlin-Robinson 1933)" icon="🏪">

                        <p>• <strong>Lliure entrada/sortida</strong> a LP.</p>
                        <p>• Cada empresa té una corba de demanda amb pendent negatiu (poder de mercat limitat).</p>
                    </TheoryBlock>
                    <TheoryBlock title="4.2. Equilibri" color="fuchsia">
                        <p>• <strong>Curt termini</strong>: similar al monopoli (IMg=CMg, possible benefici econòmic).</p>
                        <p>• <strong>Llarg termini</strong>: entrada d'empreses desplaça la demanda individual cap a l'esquerra fins a beneficis econòmics zero. L'empresa produeix al tram decreixent del CMeLT → <strong>excés de capacitat</strong>.</p>
                        <p>Ineficient en sentit tècnic però aporta <strong>varietat i diferenciació</strong> al consumidor.</p>
                    </TheoryBlock>
                    <TheoryBlock title="4.3. Publicitat, marques i diferenciació" color="pink">
                        <p>• <strong>Diferenciació</strong>: horitzontal (gustos) i vertical (qualitat).</p>
                        <p>• <strong>Marques</strong>: senyal de qualitat (Spence 1973), creació de fidelitat.</p>
                        <p>• <strong>Publicitat</strong>: informativa (beneficis clar) i persuasiva (discutida: <strong>Galbraith 1958</strong> crític).</p>
                        <p>• Inversió en I+D, disseny, presentació, canals distribució.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>L'oligopoli (<strong>Cournot 1838</strong>, <strong>Bertrand 1883</strong>, <strong>Nash 1950</strong>) i la competència monopolística (<strong>Chamberlin i Robinson, 1933</strong>) són les formes de mercat més freqüents. La teoria de jocs (<strong>Aumann-Schelling, Nobel 2005</strong>; <strong>Tirole, Nobel 2014</strong>) és l'eina central d'anàlisi. Les polítiques anticartel (CNMC, DG Competition) i la regulació de plataformes digitals (DMA 2022) són reptes actuals.</p>

        const Tema16Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-pink-50 rounded-xl border border-pink-200 mb-5"><p className="text-center font-bold text-pink-800 text-lg">Tema 16: Oligopoli i comp. monopolística</p><p className="text-center text-sm text-pink-600 mt-1">IHH = Σ sᵢ²</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Oligopoli</h4><ul className="list-disc pl-5 space-y-1"><li>Cournot (1838) quantitats, Bertrand (1883) preus, Stackelberg líder-seguidor.</li><li>IHH.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Colusió</h4><ul className="list-disc pl-5 space-y-1"><li>Cartels (OPEP); dilema presoner; Nash (1950, Nobel 1994).</li><li>Jocs repetits Axelrod (1984).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Sweezy (1939)</h4><ul className="list-disc pl-5 space-y-1"><li>Demanda trencada → rigidesa preus.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Comp. monopolística</h4><ul className="list-disc pl-5 space-y-1"><li>Chamberlin i Robinson (1933).</li><li>Productes diferenciats + lliure entrada; excés capacitat a LP.</li><li>Publicitat, marques, I+D.</li></ul></div></div><ClauBox><p>- <strong>Nash (1950)</strong> i teoria de jocs.</p><p>- <strong>Chamberlin i Robinson (1933)</strong> simultanis.</p><p>- Connexió amb CNMC, DMA 2022.</p></ClauBox></Card></div>);

        const Tema17Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>Els <strong>teoremes del benestar</strong> (<strong>Arrow-Debreu 1954</strong>) demostren que la competència perfecta és eficient en el sentit de Pareto, <em>però</em> sota condicions molt exigents. Quan no es compleixen, parlem de <strong>fallades del mercat</strong> (market failures): béns públics, externalitats, informació asimètrica, mercats incomplets i competència imperfecta.</p>
                    <p>Aquestes fallades justifiquen la <strong>intervenció de l'Estat</strong> (Tema 18). <strong>Pigou (1920)</strong> va obrir el camp, <strong>Samuelson (1954)</strong> va formalitzar els béns públics, <strong>Coase (1960)</strong> va proposar solució privada (drets de propietat), i <strong>Akerlof, Spence, Stiglitz (Nobel 2001)</strong> van fundar l'economia de la informació.</p>

                <Card title="1. Òptims paretians i teoremes del benestar" icon="✨">
                    <TheoryBlock title="1.1. Òptim de Pareto" color="pink">
                        <p>Una assignació és <strong>Pareto-òptima</strong> si no es pot millorar la situació d'un agent sense empitjorar la d'un altre. Concepte de <strong>Pareto (1906)</strong>.</p>
                        <p>• <strong>Eficiència en l'intercanvi</strong>: RMS iguals entre consumidors.</p>
                        <p>• <strong>Eficiència en la producció</strong>: RMST iguals entre empreses.</p>
                        <p>• <strong>Eficiència en el «producte-mix»</strong>: RMS = RMT.</p>
                    </TheoryBlock>
                    <TheoryBlock title="1.2. Teoremes del benestar (Arrow-Debreu 1954)" color="rose">
                        <p>• <strong>1r teorema</strong>: tot equilibri competitiu és Pareto-òptim.</p>
                        <p>• <strong>2n teorema</strong>: tot òptim de Pareto pot assolir-se com a equilibri competitiu amb una redistribució inicial adequada.</p>
                        <p>Conseqüència: separació entre <strong>eficiència</strong> (assolible pel mercat) i <strong>equitat</strong> (decisió política sobre dotacions inicials).</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Béns públics" icon="🏛️">
                    <TheoryBlock title="2.1. Definició (Samuelson 1954)" color="fuchsia">
                        <p>Un bé públic té dos trets:</p>
                        <p>• <strong>No rivalitat</strong>: el consum d'un no redueix la disponibilitat per als altres.</p>
                        <p>• <strong>No exclusió</strong>: no es pot impedir el consum a qui no paga.</p>
                        <p>Exemples: defensa nacional, enllumenat públic, coneixement bàsic, aire net, fars marítims.</p>
                    </TheoryBlock>
                    <TheoryBlock title="2.2. El problema del free rider" color="pink">
                        <p>Els consumidors no tenen incentiu a revelar la seva disposició a pagar → subproducció pel mercat. Solució: <strong>provisió pública finançada amb impostos</strong>, mecanismes de revelació (Clarke-Groves).</p>
                    </TheoryBlock>
                    <TheoryBlock title="2.3. Tipologia (Ostrom 1990, Nobel 2009)" color="rose">
                        <p>Classificació creuada rivalitat/excloibilitat:</p>
                        <p>• Bé privat (rival + excloent): pa.</p>
                        <p>• Bé públic pur (no rival + no excloent): defensa.</p>
                        <p>• Bé de club (no rival + excloent): Netflix, peatges.</p>
                        <p>• Bé comú o common-pool (rival + no excloent): pesqueries, aqüífers → tragèdia dels béns comunals (Hardin 1968), solucions comunitàries (<strong>Ostrom 1990</strong>).</p>
                    </TheoryBlock>

                        <p>• <strong>Negatives</strong>: contaminació, soroll, fum tabac, embussos.</p>
                        <p>• <strong>Positives</strong>: educació, vacunació, R+D, apicultura.</p>
                        <p>Resultat: mercat produeix massa externalitats negatives i massa poques positives.</p>
                    </TheoryBlock>
                    <TheoryBlock title="3.2. Solucions pigouvianes" color="pink">
                        <p>• <strong>Impost Pigou</strong>: sobre activitats amb externalitats negatives, equivalent al dany marginal. Fa que l'agent internalitzi el cost social. Exemples: impost CO₂, ETS-UE, impost begudes ensucrades.</p>
                        <p>• <strong>Subvencions</strong>: per externalitats positives (beques, R+D, vacunació).</p>
                        <p>• <strong>Regulació</strong>: límits d'emissions, estàndards tècnics.</p>
                    </TheoryBlock>

                        <p><strong>Ronald Coase (Nobel 1991)</strong>: si els drets de propietat estan ben definits i els costos de transacció són baixos, les parts negocien privadament l'òptim, independentment de qui tingui els drets.</p>
                        <p>Bases dels <strong>mercats de drets d'emissió</strong> (Emissions Trading System UE, 2005).</p>
                        <p>Limitacions: molts agents afectats, costos de transacció alts, problemes d'informació.</p>
                    </TheoryBlock>
                    <FormulaBox formula="Impost Pigou = CMg Social - CMg Privat   (dany marginal extern)" desc="Internalització de l'externalitat" />

                    <div className="my-6 p-5 bg-gradient-to-br from-pink-50 to-rose-50 rounded-xl border border-pink-200">

                            <line x1="60" y1="190" x2="380" y2="50" stroke="#be185d" strokeWidth="2"/>
                            <text x="365" y="45" fontSize="9" fill="#be185d">CMg social</text>

                            <text x="238" y="143" fontSize="9" fill="#f43f5e">E privat</text>
                            <circle cx="180" cy="130" r="4" fill="#831843"/>
                            <text x="125" y="125" fontSize="9" fill="#831843">E social</text>
                            <line x1="230" y1="145" x2="230" y2="115" stroke="#475569" strokeWidth="1" strokeDasharray="2,2"/>

                        </svg>

                </Card>

                <Card title="4. Informació asimètrica" icon="🔍">

                    <TheoryBlock title="Disjuntiva (Okun 1975)" color="fuchsia">
                        <p><strong>Arthur Okun</strong>: «Equality and Efficiency: The Big Tradeoff». La redistribució té un cost en eficiència (incentius, efecte cubell amb pèrdues). Però l'equitat té valor ètic intrínsec (<strong>Rawls 1971</strong>: vel d'ignorància) i instrumental (cohesió social, creixement inclusiu).</p>

                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>Les fallades del mercat són el fonament teòric de la política pública (Tema 18). Des de <strong>Pigou (1920)</strong> fins a <strong>Ostrom (Nobel 2009)</strong> i <strong>l'economia de la informació (Nobel 2001)</strong>, la microeconomia ha identificat múltiples vies d'ineficiència. El canvi climàtic és la major externalitat de la història (Stern Review 2006), i l'economia digital introdueix noves externalitats (xarxes, dades).</p>

                    <p>La teoria marginal de la distribució (<strong>Clark 1899</strong>) és el referent neoclàssic, però les crítiques (Marx, Robinson, Piketty, Sen) obren el debat sobre <strong>eficiència vs. equitat</strong>. Les polítiques distributives combinen fiscalitat, transferències, serveis públics i mercat laboral. A Espanya, els reptes són la pobresa infantil, el Gini persistent i la sostenibilitat del sistema de pensions. L'enfocament de capabilities (<strong>Sen 1985</strong>) i l'Agenda 2030 ODS aporten un marc més ampli.</p>
                </div></Card>

                    'RICARDO, D. (1817): Principles of Political Economy and Taxation.',
                    'MARX, K. (1867): Das Kapital, vol. I.',

        const Tema19Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-pink-50 rounded-xl border border-pink-200 mb-5"><p className="text-center font-bold text-pink-800 text-lg">Tema 19: Distribució de la renda</p><p className="text-center text-sm text-pink-600 mt-1">w = P · PMgL   |   Gini ∈ [0, 1]</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Teoria marginal</h4><ul className="list-disc pl-5 space-y-1"><li>Clark (1899), Wicksell, Wicksteed (1894).</li><li>Crítiques: Marx, Robinson (Cambridge), Piketty (r&gt;g).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Mercat treball</h4><ul className="list-disc pl-5 space-y-1"><li>Competència, monopsoni (Robinson 1933), SMI, Card-Krueger.</li><li>Capital humà Becker (1964).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Desigualtat</h4><ul className="list-disc pl-5 space-y-1"><li>Lorenz (1905), Gini (1912).</li><li>Atkinson (1970), Palma, AROPE.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Polítiques</h4><ul className="list-disc pl-5 space-y-1"><li>IRPF, IMV 2020, pensions, SMI 1.134€.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">5. Capabilities</h4><ul className="list-disc pl-5 space-y-1"><li>Sen (1985), IDH PNUD 1990.</li></ul></div></div><ClauBox><p>- <strong>Clark (1899)</strong> teoria marginal; <strong>Piketty 2013</strong> r&gt;g.</p><p>- <strong>Corba Lorenz</strong> i <strong>Gini</strong> són obligats.</p><p>- Enfoc capabilities de <strong>Sen (Nobel 1998)</strong>.</p></ClauBox></Card></div>);
        const Tema19 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="📊" title="Tema 19" subtitle={t('tema19.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema19Complet />}{vista === 'resum' && <Tema19Resum />}</div>; };
