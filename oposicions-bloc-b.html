            {/* ── EPÍGRAFE 1 ─────────────────────────────────────── */}
            <Card title="1. El equilibrio de mercado" icon="📘">
                <TheoryBlock title="1.1. Concepto de equilibrio (Marshall)" color="pink">
                    <p>
                        El <strong>equilibrio de mercado</strong> se define como aquella situación en la que la <strong>cantidad demandada y la cantidad ofrecida coinciden</strong> a un determinado precio, de modo que no existen presiones para que el precio varíe. En términos gráficos, el equilibrio se encuentra en el punto de <strong>intersección de las curvas de oferta y demanda</strong>.
                    </p>
                    <p>
                        <strong>Alfred Marshall</strong> (1890) formalizó esta idea con su famosa metáfora: «Podríamos discutir razonablemente sobre si es la hoja superior o la inferior de unas tijeras la que corta un trozo de papel, como sobre si el valor viene determinado por la utilidad o por el coste de producción. Es la interacción de ambas la que determina el precio». Esta concepción del equilibrio como resultado de la interacción simultánea de oferta y demanda es uno de los pilares de la economía moderna.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Precio y cantidad de equilibrio. Representación gráfica" color="blue">
                    <p>
                        El <strong>precio de equilibrio</strong> (P*) es aquel al que la cantidad que los consumidores desean comprar coincide exactamente con la cantidad que los productores desean vender. La <strong>cantidad de equilibrio</strong> (Q*) es la cantidad intercambiada a ese precio.
                    </p>
                    <p>
                        Matemáticamente, el equilibrio se obtiene igualando las funciones de oferta y demanda. Si la demanda es Q<sub>d</sub> = a − b·P y la oferta es Q<sub>s</sub> = c + d·P (con a, b, c, d {'>'} 0), el equilibrio se determina resolviendo:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Qd(P*) = Qs(P*)  →  a − b·P* = c + d·P*  →  P* = (a − c) / (b + d)"
                    desc="Condición de equilibrio: cantidad demandada = cantidad ofrecida"
                />

                <TheoryBlock title="1.3. El proceso de ajuste: excesos de oferta y demanda" color="green">
                    <p>
                        Cuando el mercado no se encuentra en equilibrio, se producen fuerzas que tienden a restaurarlo:
                    </p>
                    <p>
                        <strong>Exceso de oferta</strong> (superávit): si el precio es superior a P*, la cantidad ofrecida supera a la demandada (Q<sub>s</sub> {'>'} Q<sub>d</sub>). Los vendedores acumulan inventarios no deseados y, para deshacerse del excedente, compiten bajando precios. El precio desciende progresivamente hasta alcanzar P*.
                    </p>
                    <p>
                        <strong>Exceso de demanda</strong> (escasez): si el precio es inferior a P*, la cantidad demandada supera a la ofrecida (Q<sub>d</sub> {'>'} Q<sub>s</sub>). Los compradores compiten por el bien escaso, presionando al alza el precio. El precio sube progresivamente hasta alcanzar P*.
                    </p>
                    <p>
                        Este mecanismo de ajuste es automático y no requiere intervención externa: es lo que Adam Smith denominó la <strong>«mano invisible»</strong>. El precio actúa como señal y mecanismo de coordinación entre millones de agentes descentralizados.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. Estabilidad del equilibrio (Walras vs. Marshall)" color="amber">
                    <p>
                        No basta con que exista un equilibrio: es necesario que sea <strong>estable</strong>, es decir, que el mercado tienda a regresar a él tras una perturbación. Existen dos enfoques clásicos:
                    </p>
                    <p>
                        <strong>Estabilidad walrasiana</strong> (Léon Walras, 1874): el ajuste se produce a través de los <strong>precios</strong>. Si hay exceso de demanda, el precio sube; si hay exceso de oferta, el precio baja. El equilibrio es estable si la curva de demanda tiene mayor pendiente (en valor absoluto) que la de oferta en el punto de equilibrio. Este es el enfoque más habitual en la microeconomía moderna.
                    </p>
                    <p>
                        <strong>Estabilidad marshalliana</strong> (Alfred Marshall, 1890): el ajuste se produce a través de las <strong>cantidades</strong>. Si el precio de demanda (lo que los consumidores están dispuestos a pagar) supera al precio de oferta (lo que los productores exigen), la producción aumenta, y viceversa. Este enfoque es más adecuado para mercados con ajustes lentos de producción (p. ej., agrícolas).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.5. Equilibrio parcial vs. equilibrio general (Walras, Arrow-Debreu)" color="violet">
                    <p>
                        El análisis desarrollado hasta aquí corresponde al <strong>equilibrio parcial</strong> (Marshall), que estudia un solo mercado aislado, manteniendo <em>ceteris paribus</em> las condiciones en el resto de mercados. Este enfoque es enormemente útil y es el dominante en la enseñanza de la microeconomía básica.
                    </p>
                    <p>
                        Sin embargo, los mercados están interconectados: un cambio en el mercado de la gasolina afecta al mercado de automóviles, al de transporte público, al de neumáticos, etc. El <strong>equilibrio general</strong> (Léon Walras, 1874) estudia la determinación simultánea de precios y cantidades en <em>todos</em> los mercados de la economía. Kenneth <strong>Arrow</strong> y Gérard <strong>Debreu</strong> (1954) demostraron formalmente la existencia de un equilibrio general competitivo bajo condiciones muy generales, un resultado que constituye uno de los logros intelectuales más importantes de la ciencia económica (y que les valdría el Premio Nobel de Economía en 1972 y 1983, respectivamente).
                    </p>
                    <p>
                        Para las oposiciones, basta con conocer la distinción y saber que el análisis de equilibrio parcial es una simplificación que, no obstante, resulta extraordinariamente poderosa para comprender el funcionamiento de mercados individuales.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 2 ─────────────────────────────────────── */}
            <Card title="2. Variaciones del equilibrio" icon="📘">
                <TheoryBlock title="2.1. Desplazamientos de la demanda: efectos sobre P y Q" color="pink">
                    <p>
                        Cuando se produce un <strong>aumento de la demanda</strong> (desplazamiento de la curva de demanda hacia la derecha) —por ejemplo, por un aumento de la renta, un cambio de gustos favorable o un aumento de la población—, el resultado es un <strong>incremento tanto del precio de equilibrio como de la cantidad de equilibrio</strong>. Al nuevo precio más alto, la oferta se extiende (movimiento a lo largo de la curva de oferta).
                    </p>
                    <p>
                        Simétricamente, una <strong>disminución de la demanda</strong> (desplazamiento hacia la izquierda) provoca una <strong>reducción tanto del precio como de la cantidad de equilibrio</strong>.
                    </p>
                    <p>
                        Regla nemotécnica: <em>«Cuando la demanda se desplaza, precio y cantidad se mueven en la misma dirección que el desplazamiento»</em>. Si la demanda aumenta (→), P↑ y Q↑; si disminuye (←), P↓ y Q↓.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Desplazamientos de la oferta: efectos sobre P y Q" color="blue">
                    <p>
                        Un <strong>aumento de la oferta</strong> (desplazamiento hacia la derecha) —por ejemplo, por una mejora tecnológica, una reducción de los costes de producción o la entrada de nuevas empresas— produce un <strong>descenso del precio de equilibrio y un aumento de la cantidad de equilibrio</strong>. Al nuevo precio más bajo, la demanda se extiende.
                    </p>
                    <p>
                        Una <strong>disminución de la oferta</strong> (desplazamiento hacia la izquierda) —por ejemplo, por un aumento de los costes de las materias primas o una catástrofe natural— provoca un <strong>aumento del precio y una disminución de la cantidad de equilibrio</strong>.
                    </p>
                    <p>
                        Regla: <em>«Cuando la oferta se desplaza, precio y cantidad se mueven en direcciones opuestas»</em>. Si la oferta aumenta (→), P↓ y Q↑; si disminuye (←), P↑ y Q↓.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Desplazamientos simultáneos de oferta y demanda" color="green">
                    <p>
                        Cuando se desplazan <strong>simultáneamente ambas curvas</strong>, los efectos sobre el precio y la cantidad dependen de la magnitud relativa de los desplazamientos:
                    </p>
                    <p>
                        <strong>Caso 1:</strong> Aumentan ambas (demanda y oferta). La cantidad de equilibrio aumenta con certeza, pero el efecto sobre el precio es <strong>ambiguo</strong>: depende de cuál desplazamiento sea mayor. Si el aumento de la demanda domina, P sube; si domina la oferta, P baja.
                    </p>
                    <p>
                        <strong>Caso 2:</strong> Disminuyen ambas. La cantidad disminuye con certeza, pero el efecto sobre el precio es ambiguo.
                    </p>
                    <p>
                        <strong>Caso 3:</strong> La demanda aumenta y la oferta disminuye (o viceversa). El precio varía con certeza (sube si ambos empujan al alza, baja si empujan a la baja), pero el efecto sobre la cantidad es ambiguo.
                    </p>
                    <p>
                        Conclusión general: en desplazamientos simultáneos, <strong>siempre hay una variable (P o Q) cuyo efecto es ambiguo</strong> y depende de las magnitudes relativas. Este resultado es fundamental para la estática comparativa.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Estática comparativa: análisis antes/después" color="amber">
                    <p>
                        La <strong>estática comparativa</strong> es el método de análisis que compara dos situaciones de equilibrio: la inicial y la final, tras un cambio en algún determinante de la oferta o la demanda. No analiza el proceso de transición (dinámica), sino que compara las <strong>fotografías</strong> del antes y el después.
                    </p>
                    <p>
                        Los pasos del análisis de estática comparativa son: (1) identificar qué curva se desplaza (oferta, demanda o ambas); (2) determinar la dirección del desplazamiento; (3) comparar el nuevo equilibrio con el antiguo; (4) determinar los efectos sobre P* y Q*.
                    </p>
                    <p>
                        Este método, sistematizado por <strong>Paul Samuelson</strong> (1947) en sus <em>Fundamentos del análisis económico</em>, es la herramienta fundamental del análisis microeconómico aplicado y constituye una competencia esencial para el opositor: la capacidad de razonar de forma ordenada y rigurosa sobre los efectos de perturbaciones económicas.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 3 ─────────────────────────────────────── */}
            <Card title="3. El excedente del consumidor y del productor" icon="📘">
                <TheoryBlock title="3.1. Excedente del consumidor (Marshall, Dupuit)" color="pink">
                    <p>
                        El <strong>excedente del consumidor</strong> (EC) es la diferencia entre lo que los consumidores estarían <strong>dispuestos a pagar</strong> por un bien (medido por la curva de demanda) y lo que efectivamente pagan (el precio de mercado). Fue conceptualizado por el ingeniero francés <strong>Jules Dupuit</strong> (1844) y formalizado por <strong>Alfred Marshall</strong> (1890).
                    </p>
                    <p>
                        Gráficamente, el excedente del consumidor es el <strong>área del triángulo</strong> comprendido entre la curva de demanda, la línea del precio de equilibrio y el eje vertical:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="EC = ½ × (Pmáx − P*) × Q*"
                    desc="Donde Pmáx es el precio máximo que alguien estaría dispuesto a pagar (intercepto vertical de la demanda)"
                />

                <TheoryBlock title="3.2. Excedente del productor" color="blue">
                    <p>
                        El <strong>excedente del productor</strong> (EP) es la diferencia entre el precio de mercado que reciben los productores y el <strong>precio mínimo al que estarían dispuestos a vender</strong> (medido por la curva de oferta, que refleja los costes marginales). Es la ganancia adicional que obtienen por encima de lo estrictamente necesario para producir.
                    </p>
                    <p>
                        Gráficamente, es el <strong>área del triángulo</strong> entre la línea del precio de equilibrio, la curva de oferta y el eje vertical:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="EP = ½ × (P* − Pmín) × Q*"
                    desc="Donde Pmín es el precio mínimo de la oferta (intercepto de la curva de oferta con el eje de precios)"
                />

                <TheoryBlock title="3.3. Excedente total y eficiencia del mercado" color="green">
                    <p>
                        El <strong>excedente total</strong> (ET) es la suma del excedente del consumidor y del productor: ET = EC + EP. Mide el <strong>bienestar total</strong> que la sociedad obtiene de la existencia del mercado.
                    </p>
                    <p>
                        Un resultado fundamental de la microeconomía es que el <strong>equilibrio competitivo maximiza el excedente total</strong>. En el punto de equilibrio, se intercambian todas las unidades cuyo valor para los consumidores (medido por la curva de demanda) supera su coste de producción (medido por la curva de oferta), y ninguna unidad cuyo coste supere su valor. No es posible mejorar la situación de ningún agente sin empeorar la de otro: el resultado es <strong>eficiente en el sentido de Pareto</strong>.
                    </p>
                    <p>
                        Este resultado constituye la base del <strong>primer teorema fundamental del bienestar</strong> (Arrow y Debreu, 1954): todo equilibrio competitivo es eficiente en el sentido de Pareto.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. La pérdida irrecuperable de eficiencia (deadweight loss)" color="amber">
                    <p>
                        Cuando el mercado no opera en el punto de equilibrio competitivo —ya sea por intervención del Estado, poder de mercado u otras distorsiones—, se produce una <strong>pérdida irrecuperable de eficiencia</strong> (PIE), también llamada <em>deadweight loss</em> o «peso muerto». Es la <strong>reducción del excedente total</strong> respecto al máximo alcanzable en competencia perfecta.
                    </p>
                    <p>
                        Gráficamente, la PIE se representa como un <strong>triángulo</strong> entre las curvas de oferta y demanda, en la zona donde se han dejado de realizar intercambios mutuamente beneficiosos. Este concepto es crucial para evaluar el coste de las intervenciones públicas y de las imperfecciones del mercado.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 4 ─────────────────────────────────────── */}
            <Card title="4. Intervenciones del Estado en el mercado" icon="📘">
                <TheoryBlock title="4.1. Precios máximos: efectos, escasez y mercado negro" color="pink">
                    <p>
                        Un <strong>precio máximo</strong> (o techo de precio) es un límite legal por encima del cual no se puede vender un bien. Solo tiene efecto si se fija <strong>por debajo del precio de equilibrio</strong> (si se fijara por encima, el mercado simplemente operaría en equilibrio y el precio máximo sería irrelevante).
                    </p>
                    <p>
                        <strong>Efectos:</strong> a un precio inferior al de equilibrio, la cantidad demandada excede a la ofrecida, generando un <strong>exceso de demanda</strong> (escasez). Consecuencias: (1) necesidad de mecanismos de <strong>racionamiento</strong> no basados en precios (colas, cupones, favoritismos); (2) aparición de <strong>mercados negros</strong> donde el bien se vende a precios superiores al máximo legal; (3) <strong>pérdida irrecuperable de eficiencia</strong> (triángulo de peso muerto); (4) deterioro de la calidad del bien o servicio.
                    </p>
                    <p>
                        <strong>Ejemplo clásico:</strong> el <strong>control de alquileres</strong>. A corto plazo puede beneficiar a los inquilinos actuales, pero a largo plazo reduce la oferta de viviendas en alquiler, deteriora el mantenimiento de los inmuebles y crea listas de espera. <strong>Assar Lindbeck</strong> (1972) afirmó que «el control de alquileres es la forma más eficiente de destruir una ciudad, después del bombardeo». <strong>Paul Krugman</strong> (2000) lo utiliza como ejemplo paradigmático de los efectos no deseados de los precios máximos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Precios mínimos: efectos y excedentes" color="blue">
                    <p>
                        Un <strong>precio mínimo</strong> (o suelo de precio) es un límite legal por debajo del cual no se puede vender un bien. Solo tiene efecto si se fija <strong>por encima del precio de equilibrio</strong>.
                    </p>
                    <p>
                        <strong>Efectos:</strong> a un precio superior al de equilibrio, la cantidad ofrecida excede a la demandada, generando un <strong>exceso de oferta</strong> (excedentes). Consecuencias: (1) acumulación de stocks no vendidos; (2) posible necesidad de que el Estado compre los excedentes; (3) pérdida irrecuperable de eficiencia; (4) incentivo a producir más de lo socialmente óptimo.
                    </p>
                    <p>
                        <strong>Ejemplo 1: Salario mínimo.</strong> Analizado como precio mínimo del factor trabajo: si se fija por encima del salario de equilibrio, genera exceso de oferta de trabajo (desempleo). Sin embargo, el debate es más complejo: en mercados con poder de monopsonio (un solo demandante de trabajo), un salario mínimo moderado puede incluso <em>aumentar</em> el empleo (Card y Krueger, 1994). Este matiz es importante para demostrar sofisticación analítica.
                    </p>
                    <p>
                        <strong>Ejemplo 2: Política Agraria Común (PAC).</strong> La UE fijó históricamente precios mínimos garantizados para productos agrícolas (cereales, leche, mantequilla), lo que generó los famosos «lagos de leche» y «montañas de mantequilla» (excedentes almacenados). Las reformas sucesivas (MacSharry 1992, Agenda 2000, Fischer 2003) han ido sustituyendo los precios de intervención por pagos directos a los agricultores.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Impuestos: incidencia fiscal y cuña fiscal" color="green">
                    <p>
                        Cuando el Estado establece un <strong>impuesto unitario</strong> (t € por unidad vendida) sobre un bien, se crea una <strong>cuña fiscal</strong> entre el precio que paga el comprador (P<sub>c</sub>) y el precio que recibe el vendedor (P<sub>v</sub>): P<sub>c</sub> = P<sub>v</sub> + t.
                    </p>
                    <p>
                        <strong>Incidencia fiscal:</strong> la cuestión clave no es quién paga legalmente el impuesto (incidencia legal), sino quién soporta realmente la carga económica (incidencia económica). La respuesta depende de las <strong>elasticidades relativas</strong> de oferta y demanda:
                    </p>
                    <p>
                        - Si la <strong>demanda es más inelástica</strong> que la oferta, los consumidores soportan la mayor parte del impuesto (el precio sube casi en la cuantía del impuesto).
                    </p>
                    <p>
                        - Si la <strong>oferta es más inelástica</strong> que la demanda, los productores soportan la mayor parte (el precio apenas sube).
                    </p>
                    <p>
                        - <em>«El lado más inelástico del mercado soporta la mayor parte de la carga fiscal»</em>: regla fundamental de la incidencia fiscal.
                    </p>
                    <p>
                        Además del efecto distributivo, el impuesto genera una <strong>pérdida irrecuperable de eficiencia</strong> (triángulo de peso muerto): se dejan de realizar intercambios que habrían sido mutuamente beneficiosos sin el impuesto. La magnitud de la PIE depende de las elasticidades: cuanto más elásticas sean oferta y demanda, mayor es la distorsión.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Cuña fiscal: Pc = Pv + t    |    Carga del consumidor ∝ 1/|Ed|    |    Carga del productor ∝ 1/Es"
                    desc="El lado más inelástico del mercado soporta la mayor parte de la carga fiscal"
                />

                <TheoryBlock title="4.4. Subvenciones: efectos simétricos a los impuestos" color="amber">
                    <p>
                        Una <strong>subvención unitaria</strong> (s € por unidad) tiene efectos <strong>simétricos</strong> a los del impuesto: crea una cuña fiscal «negativa» (P<sub>c</sub> = P<sub>v</sub> − s), de modo que el precio que paga el comprador es inferior al que recibe el vendedor.
                    </p>
                    <p>
                        La subvención aumenta la cantidad intercambiada por encima del nivel de equilibrio competitivo, lo que genera una <strong>pérdida de eficiencia</strong> (se producen unidades cuyo coste marginal supera su valor para el consumidor). La distribución del beneficio de la subvención entre compradores y vendedores sigue la misma lógica que el impuesto: <em>el lado más inelástico capta la mayor parte del beneficio</em>.
                    </p>
                    <p>
                        Sin embargo, las subvenciones pueden estar justificadas cuando corrigen <strong>externalidades positivas</strong> (educación, sanidad, I+D, energías renovables): al subsidiar bienes con beneficios sociales superiores a los privados, se acerca la producción al óptimo social.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. Aranceles y cuotas (breve referencia)" color="violet">
                    <p>
                        Los <strong>aranceles</strong> (impuestos a las importaciones) y las <strong>cuotas</strong> (límites cuantitativos a las importaciones) son formas de intervención en mercados abiertos al comercio internacional. Sus efectos pueden analizarse con las mismas herramientas de oferta y demanda:
                    </p>
                    <p>
                        El arancel eleva el precio doméstico por encima del precio mundial, protege a los productores nacionales pero perjudica a los consumidores y genera una pérdida irrecuperable de eficiencia. La cuota tiene efectos similares, pero además crea <strong>rentas de cuota</strong> para quienes poseen las licencias de importación. Este análisis se desarrolla con mayor profundidad en el <strong>Bloc D</strong> (Economía internacional).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.6. Justificación de las intervenciones: fallos de mercado, equidad y bienes de mérito" color="cyan">
                    <p>
                        Las intervenciones del Estado en el mercado se justifican fundamentalmente por tres razones:
                    </p>
                    <p>
                        <strong>1. Eficiencia (fallos de mercado):</strong> cuando el mercado no conduce a un resultado eficiente por la presencia de externalidades, bienes públicos, información asimétrica o poder de mercado, la intervención puede mejorar la asignación de recursos. Los impuestos pigouvianos (Pigou, 1920) corrigen externalidades negativas; las subvenciones corrigen externalidades positivas.
                    </p>
                    <p>
                        <strong>2. Equidad (justicia distributiva):</strong> incluso si el mercado fuera eficiente, el resultado podría considerarse inequitativo. Los precios máximos (vivienda asequible), los salarios mínimos (protección del trabajador) y los impuestos progresivos buscan redistribuir la renta en favor de los colectivos más vulnerables. El <strong>segundo teorema del bienestar</strong> (Arrow, 1951) señala que cualquier asignación eficiente puede alcanzarse mediante transferencias de suma fija, sin necesidad de distorsionar los precios, aunque esto es difícil en la práctica.
                    </p>
                    <p>
                        <strong>3. Bienes de mérito y demérito</strong> (Musgrave, 1959): bienes cuyo consumo la sociedad desea fomentar (educación, cultura, vacunación) o desincentivar (tabaco, alcohol, juego), independientemente de las preferencias individuales, por consideraciones de interés general.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 5 ─────────────────────────────────────── */}
            <Card title="5. Relevancia curricular y didáctica" icon="📘">
                <TheoryBlock title="5.1. Conexión curricular" color="pink">
                    <p>
                        Los contenidos de este tema se integran plenamente en la materia de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022, Bloque B — Funcionamiento del mercado): el equilibrio de mercado, los desplazamientos de oferta y demanda, el excedente del consumidor y del productor, y las intervenciones del Estado (precios máximos y mínimos, impuestos).
                    </p>
                    <p>
                        También conecta con <strong>Empresa y Diseño de Modelos de Negocio de 2.º de Bachillerato</strong> (análisis del entorno competitivo de la empresa), con <strong>Economía y Emprendimiento de 4.º ESO</strong> (comprensión básica del funcionamiento del mercado) y con <strong>Fundamentos de Administración y Gestión</strong> (impacto de la fiscalidad sobre la empresa).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Competencias clave" color="blue">
                    <p>
                        <strong>STEM:</strong> representación gráfica del equilibrio, cálculo algebraico de precios y cantidades de equilibrio, determinación de excedentes (áreas de triángulos), análisis de la incidencia fiscal mediante elasticidades.
                    </p>
                    <p>
                        <strong>CC (Competencia ciudadana):</strong> evaluación crítica de las intervenciones del Estado en los mercados: ¿son eficaces los controles de precios? ¿A quién benefician y a quién perjudican los impuestos? ¿Cuándo está justificada la intervención pública?
                    </p>
                    <p>
                        <strong>CPSAA:</strong> reflexión sobre cómo las políticas de precios afectan a las decisiones cotidianas (vivienda, alimentación, transporte).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Propuestas didácticas" color="green">
                    <p>
                        <strong>1. Simulación de mercado en el aula:</strong> organizar un «mercado experimental» donde los alumnos son compradores y vendedores con valores y costes asignados. Observar cómo converge al equilibrio teórico. Luego introducir un impuesto o un precio máximo y analizar los efectos.
                    </p>
                    <p>
                        <strong>2. Análisis de noticias:</strong> buscar noticias sobre intervenciones reales (control de alquileres, subida del salario mínimo, impuestos sobre bebidas azucaradas) y analizarlas con el modelo de oferta y demanda: ¿qué curva se desplaza? ¿Cuál es el efecto esperado? ¿Coincide con lo observado?
                    </p>
                    <p>
                        <strong>3. Cálculo de excedentes:</strong> dados funciones lineales de oferta y demanda, calcular P*, Q*, EC, EP, y luego determinar el efecto de un impuesto o un precio máximo sobre los excedentes y la PIE.
                    </p>
                    <p>
                        <strong>4. Debate: ¿debe el gobierno controlar los precios de los alquileres?</strong> Asignar roles (inquilinos, propietarios, economistas, políticos) y debatir los argumentos a favor y en contra, usando los conceptos del tema.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Conclusión" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        A lo largo de este tema se ha desarrollado el análisis completo del <strong>equilibrio de mercado</strong>, articulado en cuatro bloques fundamentales.
                    </p>
                    <p>
                        En primer lugar, la <strong>formación del equilibrio</strong> como resultado de la intersección de oferta y demanda (Marshall, 1890), con el mecanismo de ajuste a través de excesos de oferta y demanda, y la distinción entre estabilidad walrasiana (ajuste por precios) y marshalliana (ajuste por cantidades). También se ha diferenciado el equilibrio parcial del general (Walras, Arrow-Debreu).
                    </p>
                    <p>
                        En segundo lugar, las <strong>variaciones del equilibrio</strong> mediante la estática comparativa (Samuelson, 1947): desplazamientos de la demanda, de la oferta y simultáneos, con la regla de que en desplazamientos simultáneos siempre hay una variable (P o Q) cuyo efecto es ambiguo.
                    </p>
                    <p>
                        En tercer lugar, el <strong>excedente del consumidor y del productor</strong> como medida del bienestar, con el resultado fundamental de que el equilibrio competitivo maximiza el excedente total (primer teorema del bienestar), y la pérdida irrecuperable de eficiencia como coste de las distorsiones.
                    </p>
                    <p>
                        En cuarto lugar, las <strong>intervenciones del Estado</strong>: precios máximos (escasez, mercado negro, deterioro de calidad), precios mínimos (excedentes, desempleo), impuestos (cuña fiscal, incidencia según elasticidades) y subvenciones (efectos simétricos). Se ha concluido con la justificación de las intervenciones por razones de eficiencia (fallos de mercado), equidad (justicia distributiva) y mérito (Musgrave).
                    </p>
                    <p>
                        Desde la perspectiva docente, el equilibrio de mercado y las intervenciones públicas ofrecen un terreno excepcionalmente rico para el desarrollo competencial: la modelización gráfica y algebraica (STEM), el debate sobre la conveniencia de las políticas públicas (CC), la reflexión sobre cómo afectan a nuestra vida cotidiana (CPSAA) y la conexión con el emprendimiento (CE, al comprender el entorno de precios en el que opera la empresa). Se trata, en definitiva, del corazón de la microeconomía y una de las herramientas más potentes del análisis económico.
                    </p>
                </div>
            </Card>

                    </p>

            {/* ── EPÍGRAFE 1 ─────────────────────────────────────── */}
            <Card title="1. Los modelos de mercado" icon="📘">
                <TheoryBlock title="1.1. Criterios de clasificación" color="pink">
                    <p>
                        Las <strong>estructuras de mercado</strong> se clasifican atendiendo a varios criterios fundamentales:
                    </p>
                    <p>
                        <strong>1. Número de oferentes y demandantes:</strong> desde un solo oferente (monopolio) hasta un número muy grande (competencia perfecta), pasando por pocos (oligopolio).
                    </p>
                    <p>
                        <strong>2. Grado de diferenciación del producto:</strong> producto homogéneo (competencia perfecta) frente a diferenciado (competencia monopolística, oligopolio diferenciado).
                    </p>
                    <p>
                        <strong>3. Existencia de barreras de entrada y salida:</strong> inexistentes (competencia perfecta), muy elevadas (monopolio), intermedias (oligopolio).
                    </p>
                    <p>
                        <strong>4. Grado de información:</strong> perfecta y simétrica (competencia perfecta) frente a imperfecta o asimétrica (mercados reales).
                    </p>
                    <p>
                        <strong>5. Poder de mercado:</strong> capacidad de un agente para influir sobre el precio. Nulo en competencia perfecta; máximo en monopolio.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Panorámica de las estructuras de mercado" color="blue">
                    <p>
                        Las cuatro grandes estructuras de mercado, ordenadas de mayor a menor competencia, son:
                    </p>
                    <p>
                        <strong>1. Competencia perfecta:</strong> muchas empresas, producto homogéneo, información perfecta, libre entrada y salida. La empresa es precio-aceptante. Ejemplo teórico: mercados agrícolas, materias primas estandarizadas.
                    </p>
                    <p>
                        <strong>2. Competencia monopolística</strong> (Chamberlin, 1933; Robinson, 1933): muchas empresas, pero con producto <em>diferenciado</em> (marca, diseño, localización). Cada empresa tiene cierto poder de mercado (curva de demanda con pendiente negativa), pero la libre entrada elimina los beneficios a largo plazo. Ejemplo: restaurantes, peluquerías, ropa.
                    </p>
                    <p>
                        <strong>3. Oligopolio:</strong> pocas empresas dominan el mercado. Producto homogéneo (oligopolio puro: acero, cemento) o diferenciado (automóviles, telefonía). Interdependencia estratégica: las decisiones de cada empresa dependen de las reacciones esperadas de las demás (teoría de juegos). Modelos: Cournot (1838), Bertrand (1883), Stackelberg (1934), cártel.
                    </p>
                    <p>
                        <strong>4. Monopolio:</strong> un solo oferente, producto sin sustitutivos cercanos, barreras de entrada insalvables. Poder de mercado máximo: el monopolista fija el precio (o la cantidad, pero no ambos). Ejemplo: monopolios legales, monopolios naturales (distribución de agua, red eléctrica).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Importancia del modelo de competencia perfecta como referencia" color="green">
                    <p>
                        Aunque ningún mercado real cumple todos los supuestos de la competencia perfecta, el modelo es fundamental por varias razones:
                    </p>
                    <p>
                        <strong>1. Benchmark de eficiencia:</strong> permite evaluar las desviaciones de la realidad respecto al ideal de eficiencia. Los «fallos de mercado» se definen precisamente como desviaciones de las condiciones de competencia perfecta.
                    </p>
                    <p>
                        <strong>2. Resultados normativos:</strong> el primer teorema del bienestar (Arrow-Debreu, 1954) establece que todo equilibrio de competencia perfecta es Pareto-eficiente. Esto proporciona un criterio para evaluar las políticas económicas.
                    </p>
                    <p>
                        <strong>3. Aproximación razonable:</strong> algunos mercados (productos agrícolas, materias primas en mercados organizados, algunos mercados financieros) se aproximan bastante a las condiciones de competencia perfecta, lo que confiere al modelo utilidad empírica.
                    </p>
                    <p>
                        <strong>4. Base pedagógica:</strong> al ser el modelo más sencillo, permite introducir los conceptos fundamentales (equilibrio de la empresa, maximización del beneficio, eficiencia) antes de abordar las complejidades de los mercados imperfectos.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 2 ─────────────────────────────────────── */}
            <Card title="2. Supuestos de la competencia perfecta" icon="📘">
                <TheoryBlock title="2.1. Gran número de compradores y vendedores (atomización)" color="pink">
                    <p>
                        El mercado está formado por un <strong>gran número</strong> de compradores y vendedores, cada uno de ellos tan pequeño en relación con el mercado total que sus decisiones individuales no tienen ningún efecto perceptible sobre el precio. Ningún agente individual puede influir en el precio de mercado: todos son <strong>precio-aceptantes</strong> (<em>price takers</em>).
                    </p>
                    <p>
                        Este supuesto se denomina <strong>atomización</strong>: cada agente es como un «átomo» en un vasto mercado. Es la condición fundamental que distingue la competencia perfecta de las demás estructuras de mercado.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Producto homogéneo" color="blue">
                    <p>
                        Todas las empresas venden un <strong>producto idéntico</strong> (homogéneo): el consumidor no puede distinguir el producto de un vendedor del de otro. No existe diferenciación por marca, calidad, diseño, embalaje ni localización. Una unidad de trigo es idéntica a otra unidad de trigo, independientemente de quién la haya producido.
                    </p>
                    <p>
                        Consecuencia: los compradores son completamente <strong>indiferentes</strong> respecto al vendedor, por lo que ninguna empresa puede cobrar un precio superior al de mercado (perdería todos sus clientes) ni tiene incentivo para cobrar menos (ya vende todo lo que desea al precio de mercado).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Información perfecta y simétrica" color="green">
                    <p>
                        Todos los agentes tienen <strong>información completa y perfecta</strong> sobre los precios, la calidad de los productos y las condiciones del mercado. No existen asimetrías informativas: los compradores conocen todos los precios disponibles y los vendedores conocen la tecnología y los precios de los demás. La información es gratuita y se difunde instantáneamente.
                    </p>
                    <p>
                        Este supuesto garantiza que no puede haber más de un precio en el mercado: si un vendedor intentara cobrar más, todos los compradores lo sabrían inmediatamente y acudirían a otro vendedor. Se cumple la <strong>ley del precio único</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Libre entrada y salida" color="amber">
                    <p>
                        No existen <strong>barreras de entrada ni de salida</strong>: cualquier empresa puede entrar en el mercado o abandonarlo sin coste alguno. No hay patentes, licencias, costes hundidos significativos ni regulaciones que impidan la entrada de nuevos competidores.
                    </p>
                    <p>
                        Este supuesto es crucial para el resultado de largo plazo: si las empresas existentes obtienen beneficios extraordinarios, nuevas empresas entrarán atraídas por esos beneficios, lo que desplazará la oferta a la derecha, presionará el precio a la baja y eliminará los beneficios extraordinarios. El proceso inverso ocurre con las pérdidas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Movilidad perfecta de factores" color="violet">
                    <p>
                        Los <strong>factores de producción</strong> (trabajo, capital, tierra) son perfectamente móviles entre empresas, industrias y localizaciones. Los trabajadores pueden cambiar de empleo sin coste, el capital puede reasignarse instantáneamente y no existen fricciones en el mercado de factores.
                    </p>
                    <p>
                        Este supuesto garantiza que los precios de los factores se igualan entre sectores y que las empresas pueden ajustar su producción sin restricciones, facilitando la entrada y salida del mercado.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.6. Consecuencia fundamental: la empresa es precio-aceptante" color="cyan">
                    <p>
                        La combinación de todos los supuestos anteriores tiene una consecuencia fundamental: la empresa competitiva es <strong>precio-aceptante</strong>. Toma el precio de mercado como un dato exógeno que no puede modificar. Su única decisión es <strong>cuánto producir</strong> (o si producir), no a qué precio vender.
                    </p>
                    <p>
                        Esto implica que la curva de demanda a la que se enfrenta cada empresa individual es <strong>perfectamente elástica</strong> (horizontal) al precio de mercado P:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="P = IMg = IMe = d (curva de demanda de la empresa)"
                    desc="La empresa puede vender cualquier cantidad al precio de mercado, pero nada a un precio superior"
                />
            </Card>

            {/* ── EPÍGRAFE 3 ─────────────────────────────────────── */}
            <Card title="3. El equilibrio de la empresa a corto plazo" icon="📘">
                <TheoryBlock title="3.1. La curva de demanda de la empresa competitiva" color="pink">
                    <p>
                        Es fundamental distinguir entre la <strong>curva de demanda del mercado</strong> (con pendiente negativa, como siempre) y la <strong>curva de demanda de la empresa individual</strong> en competencia perfecta (horizontal al precio P*).
                    </p>
                    <p>
                        La empresa puede vender cualquier cantidad que desee al precio de mercado P*, pero no puede vender una sola unidad a un precio superior (porque los consumidores, con información perfecta, se irían a los competidores que venden producto idéntico al precio P*). Tampoco tiene incentivo para vender a un precio inferior (ya puede vender todo lo que quiera a P*).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Ingresos de la empresa competitiva" color="blue">
                    <p>
                        Dado que la empresa vende cada unidad al mismo precio P, sus funciones de ingreso son:
                    </p>
                    <p>
                        <strong>Ingreso total:</strong> IT = P × Q (función lineal creciente).
                    </p>
                    <p>
                        <strong>Ingreso medio:</strong> IMe = IT/Q = P (constante e igual al precio).
                    </p>
                    <p>
                        <strong>Ingreso marginal:</strong> IMg = ΔIT/ΔQ = P (constante e igual al precio).
                    </p>
                    <p>
                        Esta igualdad P = IMg = IMe es exclusiva de la competencia perfecta. En cualquier mercado imperfecto, la empresa tiene una curva de demanda con pendiente negativa, lo que implica IMg {'<'} P.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="IT = P × Q    |    IMe = IT/Q = P    |    IMg = ΔIT/ΔQ = P"
                    desc="En competencia perfecta, ingreso marginal = ingreso medio = precio"
                />

                <TheoryBlock title="3.3. Maximización de beneficios: IMg = CMg" color="green">
                    <p>
                        La empresa maximiza su beneficio produciendo aquella cantidad para la que el <strong>ingreso marginal iguala al coste marginal</strong>: IMg = CMg. Esta es la regla universal de maximización del beneficio, válida en cualquier estructura de mercado.
                    </p>
                    <p>
                        En competencia perfecta, dado que IMg = P, la condición se simplifica a:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="P = CMg    (con CMg creciente en el punto óptimo)"
                    desc="Condición de maximización del beneficio en competencia perfecta"
                />

                <TheoryBlock color="green">
                    <p>
                        La <strong>segunda condición</strong> (condición de segundo orden) exige que el CMg sea <strong>creciente</strong> en el punto de equilibrio: la curva de CMg debe cortar a la línea de precio «desde abajo». Si el CMg fuera decreciente en el punto de corte, estaríamos en un mínimo de beneficios, no en un máximo.
                    </p>
                    <p>
                        <strong>Intuición económica:</strong> si IMg {'>'} CMg, producir una unidad más añade más ingreso que coste → conviene aumentar la producción. Si IMg {'<'} CMg, producir una unidad más cuesta más de lo que aporta → conviene reducir la producción. Solo cuando IMg = CMg no hay incentivo para cambiar: es el equilibrio.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Beneficios extraordinarios, normales y pérdidas" color="amber">
                    <p>
                        La <strong>cuantía del beneficio</strong> depende de la relación entre el precio y el coste medio total:
                    </p>
                    <p>
                        <strong>Beneficios extraordinarios</strong> (B {'>'} 0): cuando P {'>'} CMe en la cantidad óptima. El área del beneficio es el rectángulo (P − CMe) × Q. La empresa obtiene una rentabilidad superior a la normal del sector.
                    </p>
                    <p>
                        <strong>Beneficios normales</strong> (B = 0): cuando P = CMe. La empresa cubre exactamente todos sus costes, incluido el coste de oportunidad del capital del empresario. No hay incentivo para entrar ni para salir del mercado. Se dice que la empresa obtiene un <strong>beneficio económico nulo</strong> (pero un beneficio contable positivo, ya que los costes económicos incluyen el coste de oportunidad).
                    </p>
                    <p>
                        <strong>Pérdidas</strong> (B {'<'} 0): cuando P {'<'} CMe. La empresa no cubre todos sus costes. Pero esto no significa necesariamente que deba cerrar a corto plazo (véase el apartado siguiente).
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="B = (P − CMe) × Q    |    B > 0 si P > CMe    |    B = 0 si P = CMe    |    B < 0 si P < CMe"
                    desc="El beneficio económico depende de la relación entre precio y coste medio"
                />

                <TheoryBlock title="3.5. La decisión de cerrar: P < CVMe mínimo" color="red">
                    <p>
                        Cuando una empresa incurre en pérdidas (P {'<'} CMe), debe decidir entre <strong>seguir produciendo con pérdidas o cerrar</strong> temporalmente. La regla es:
                    </p>
                    <p>
                        <strong>Si P ≥ CVMe:</strong> conviene seguir produciendo, porque los ingresos cubren al menos los costes variables y contribuyen parcialmente a cubrir los costes fijos. Las pérdidas produciendo (IT − CT) son menores que las pérdidas cerrando (−CF).
                    </p>
                    <p>
                        <strong>Si P {'<'} CVMe:</strong> conviene cerrar, porque los ingresos no cubren ni siquiera los costes variables. Producir aumenta las pérdidas respecto a cerrar. El <strong>punto de cierre</strong> se sitúa en el mínimo del CVMe.
                    </p>
                    <p>
                        <strong>Nota:</strong> «cerrar» a corto plazo (cesar temporalmente la producción) no es lo mismo que «abandonar el mercado» a largo plazo (liquidar y salir de la industria). A corto plazo hay costes fijos que se pagan en cualquier caso; a largo plazo, todos los costes son variables.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.6. La curva de oferta de la empresa competitiva" color="rose">
                    <p>
                        La <strong>curva de oferta a corto plazo de la empresa competitiva</strong> es su <strong>curva de CMg por encima del mínimo del CVMe</strong>. Por debajo de ese punto, la empresa cierra y su oferta es cero.
                    </p>
                    <p>
                        La <strong>curva de oferta del mercado</strong> a corto plazo es la suma horizontal de las curvas de oferta individuales de todas las empresas del sector.
                    </p>
                    <p>
                        Esta derivación de la curva de oferta a partir de la condición de maximización del beneficio (P = CMg) es uno de los resultados más elegantes de la microeconomía: <em>la ley de la oferta (relación positiva entre precio y cantidad ofrecida) no es un supuesto, sino una consecuencia de la maximización del beneficio con costes marginales crecientes</em>.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 4 ─────────────────────────────────────── */}
            <Card title="4. El equilibrio a largo plazo" icon="📘">
                <TheoryBlock title="4.1. El mecanismo de entrada y salida de empresas" color="pink">
                    <p>
                        A largo plazo, el supuesto de <strong>libre entrada y salida</strong> tiene consecuencias cruciales. Si las empresas existentes obtienen <strong>beneficios extraordinarios</strong> (P {'>'} CMe), nuevas empresas entran en el mercado, atraídas por esos beneficios. La entrada de nuevas empresas:
                    </p>
                    <p>
                        (1) Aumenta la oferta del mercado (desplazamiento a la derecha).
                    </p>
                    <p>
                        (2) Reduce el precio de equilibrio.
                    </p>
                    <p>
                        (3) Reduce los beneficios de todas las empresas.
                    </p>
                    <p>
                        El proceso continúa hasta que los beneficios se reducen a cero (beneficio económico = 0). Simétricamente, si las empresas sufren <strong>pérdidas</strong> (P {'<'} CMe), algunas salen del mercado, la oferta disminuye, el precio sube y las pérdidas se reducen hasta desaparecer.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Beneficio económico cero en el largo plazo" color="blue">
                    <p>
                        En el <strong>equilibrio a largo plazo</strong> de competencia perfecta, todas las empresas obtienen un <strong>beneficio económico igual a cero</strong>:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="P = CMg = CMe mínimo (LP)  →  Beneficio económico = 0"
                    desc="En el equilibrio a largo plazo, el precio iguala al coste medio mínimo a largo plazo"
                />

                <TheoryBlock color="blue">
                    <p>
                        Esto no significa que las empresas no ganen dinero: obtienen un <strong>beneficio contable positivo</strong> que cubre exactamente el coste de oportunidad del capital (la remuneración «normal» del empresario). Lo que desaparece es el <em>beneficio extraordinario</em> (beneficio por encima de lo normal).
                    </p>
                    <p>
                        Todas las empresas producen en el <strong>punto de escala óptima</strong>: el mínimo de la curva de costes medios a largo plazo. No hay despilfarro ni ineficiencia: cada empresa produce al menor coste posible.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Eficiencia asignativa y productiva" color="green">
                    <p>
                        El equilibrio a largo plazo de competencia perfecta alcanza dos tipos de eficiencia:
                    </p>
                    <p>
                        <strong>Eficiencia asignativa</strong> (P = CMg): el precio que pagan los consumidores refleja exactamente el coste marginal de producir la última unidad. Los recursos se asignan de forma que la valoración de los consumidores (medida por el precio de demanda) coincide con el coste social de producción (medida por el CMg). No se produce ni de más ni de menos: la cantidad es socialmente óptima.
                    </p>
                    <p>
                        <strong>Eficiencia productiva</strong> (P = CMe mínimo): cada empresa produce al menor coste medio posible, utilizando la tecnología más eficiente y operando en la escala óptima. No hay despilfarro de recursos en la producción.
                    </p>
                    <p>
                        La combinación de ambas eficiencias implica que el equilibrio de competencia perfecta maximiza el bienestar social (excedente total). Es el resultado del <strong>primer teorema fundamental del bienestar</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. La mano invisible y el primer teorema del bienestar" color="amber">
                    <p>
                        El resultado de eficiencia de la competencia perfecta conecta directamente con la intuición de <strong>Adam Smith</strong> (1776) sobre la <strong>«mano invisible»</strong>: los individuos, persiguiendo su propio interés egoísta, son guiados «como por una mano invisible» a promover el bienestar social, sin pretenderlo ni saberlo.
                    </p>
                    <p>
                        La formalización rigurosa de esta idea es el <strong>primer teorema fundamental del bienestar</strong>, demostrado por <strong>Kenneth Arrow</strong> y <strong>Gérard Debreu</strong> (1954): bajo las condiciones de competencia perfecta (y ausencia de externalidades y bienes públicos), <em>todo equilibrio competitivo es eficiente en el sentido de Pareto</em>. Es decir, no es posible mejorar la situación de ningún agente sin empeorar la de al menos otro.
                    </p>
                    <p>
                        Este teorema no dice que el resultado sea <em>justo</em> (la distribución puede ser muy desigual), ni que sea el único posible (el <strong>segundo teorema</strong> establece que cualquier asignación eficiente puede alcanzarse mediante una redistribución inicial adecuada seguida de mercados competitivos). Pero sí establece que los mercados competitivos, cuando funcionan correctamente, no despilfarran recursos.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 5 ─────────────────────────────────────── */}
            <Card title="5. Valoración del modelo y relevancia curricular" icon="📘">
                <TheoryBlock title="5.1. Virtudes del modelo" color="pink">
                    <p>
                        <strong>Eficiencia:</strong> la competencia perfecta alcanza simultáneamente la eficiencia asignativa (P = CMg) y la productiva (P = CMe mínimo). Maximiza el excedente total de la sociedad.
                    </p>
                    <p>
                        <strong>Bienestar del consumidor:</strong> los consumidores pagan el precio más bajo compatible con los costes de producción. No hay márgenes de beneficio extraordinarios ni poder de mercado que permita precios abusivos.
                    </p>
                    <p>
                        <strong>Innovación y dinamismo:</strong> la presión competitiva obliga a las empresas a buscar continuamente formas de reducir costes y mejorar la eficiencia. Aunque este aspecto dinámico es objeto de debate (Schumpeter argumentó que cierto poder de monopolio es necesario para financiar la innovación).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Limitaciones del modelo" color="blue">
                    <p>
                        <strong>Irrealismo de los supuestos:</strong> ningún mercado real cumple todos los supuestos simultáneamente. La información nunca es perfecta, los productos raramente son completamente homogéneos, las barreras de entrada existen en mayor o menor grado y los agentes no siempre actúan racionalmente.
                    </p>
                    <p>
                        <strong>No contempla externalidades:</strong> el modelo asume que todas las consecuencias de la producción y el consumo se reflejan en los precios. Cuando hay externalidades (contaminación, educación, congestión), el equilibrio competitivo ya no es eficiente.
                    </p>
                    <p>
                        <strong>No contempla bienes públicos:</strong> los bienes públicos (defensa, alumbrado) no pueden ser provistos eficientemente por un mercado competitivo, porque son no excluibles y no rivales.
                    </p>
                    <p>
                        <strong>No garantiza equidad:</strong> la eficiencia no implica justicia. El equilibrio de competencia perfecta puede ser eficiente pero extremadamente desigual.
                    </p>
                    <p>
                        <strong>Crítica de Schumpeter:</strong> <strong>Joseph Schumpeter</strong> (1942) argumentó en <em>Capitalismo, socialismo y democracia</em> que la competencia perfecta no es el motor del progreso económico. La verdadera fuerza del capitalismo es la <strong>«destrucción creativa»</strong>: innovaciones radicales impulsadas por empresas con cierto poder de mercado que pueden financiar la I+D. En esta visión, el monopolio temporal (protegido por patentes) es el precio que paga la sociedad por la innovación.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Mercados aproximados a la competencia perfecta" color="green">
                    <p>
                        Aunque ningún mercado cumple todos los supuestos, algunos se aproximan razonablemente:
                    </p>
                    <p>
                        <strong>Productos agrícolas:</strong> muchos agricultores, producto relativamente homogéneo (trigo, arroz, maíz), precios determinados en mercados organizados. Sin embargo, las subvenciones agrícolas (PAC) distorsionan el mercado.
                    </p>
                    <p>
                        <strong>Materias primas:</strong> mercados de commodities (petróleo, oro, cobre) negociados en bolsas organizadas con alta transparencia de precios.
                    </p>
                    <p>
                        <strong>Mercados financieros:</strong> los mercados bursátiles con muchos participantes, información ampliamente disponible (aunque la hipótesis del mercado eficiente de <strong>Eugene Fama</strong>, 1970, es objeto de debate tras la crisis de 2008).
                    </p>
                    <p>
                        <strong>Comercio electrónico:</strong> en algunos segmentos, Internet ha reducido las barreras de información y ha aumentado la comparabilidad de precios, acercando los mercados a las condiciones de competencia perfecta.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Conexión curricular LOMLOE" color="amber">
                    <p>
                        Los contenidos de este tema se integran en la materia de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022, Bloque B — Funcionamiento del mercado): tipos de mercado, competencia perfecta, poder de mercado, eficiencia.
                    </p>
                    <p>
                        También conecta con <strong>Empresa y Diseño de Modelos de Negocio de 2.º de Bachillerato</strong> (análisis del entorno competitivo, tipos de mercado según estructura) y con <strong>Economía y Emprendimiento de 4.º ESO</strong> (comprensión básica de la competencia y el funcionamiento del mercado).
                    </p>
                    <p>
                        <strong>Competencias clave:</strong> STEM (modelización gráfica y algebraica del equilibrio de la empresa), CC (valoración de la eficiencia y la equidad del mercado), CE (comprensión del entorno competitivo como condicionante de las decisiones empresariales), CPSAA (reflexión sobre las consecuencias de la competencia para el consumidor).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
            <Card title="Conclusión" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        A lo largo de este tema se ha desarrollado el análisis completo del modelo de <strong>competencia perfecta</strong>, la estructura de mercado que sirve como referencia teórica fundamental en microeconomía.
                    </p>
                    <p>
                        En primer lugar, se ha presentado la <strong>panorámica de las estructuras de mercado</strong>, con los criterios de clasificación (número de agentes, diferenciación, barreras, información, poder de mercado) y la importancia del modelo de competencia perfecta como <em>benchmark</em> de eficiencia.
                    </p>
                    <p>
                        En segundo lugar, se han detallado los <strong>cinco supuestos</strong> del modelo (atomización, producto homogéneo, información perfecta, libre entrada y salida, movilidad de factores) y su consecuencia fundamental: la empresa es <strong>precio-aceptante</strong> (P = IMg = IMe).
                    </p>
                    <p>
                        En tercer lugar, se ha analizado el <strong>equilibrio a corto plazo</strong>: la condición de maximización (P = CMg), los tres posibles resultados (beneficios extraordinarios, normales y pérdidas), la decisión de cerrar (P {'<'} CVMe mínimo) y la derivación de la curva de oferta de la empresa.
                    </p>
                    <p>
                        En cuarto lugar, el <strong>equilibrio a largo plazo</strong>: el mecanismo de entrada y salida que conduce a un beneficio económico nulo (P = CMg = CMe mínimo), la doble eficiencia (asignativa y productiva) y su conexión con la mano invisible de Adam Smith y el primer teorema del bienestar (Arrow-Debreu, 1954).
                    </p>
                    <p>
                        Finalmente, se ha ofrecido una <strong>valoración equilibrada</strong> del modelo: sus virtudes (eficiencia, bienestar del consumidor), sus limitaciones (irrealismo de supuestos, ausencia de externalidades y bienes públicos, no garantía de equidad) y la crítica schumpeteriana (la competencia perfecta no explica la innovación). Desde la perspectiva docente, la competencia perfecta es el punto de partida imprescindible para comprender el funcionamiento de los mercados, evaluar las desviaciones de la competencia y fundamentar la regulación y las políticas de competencia.
                    </p>
                </div>
            </Card>

    const Tema14 = () => {
        const [vista, setVista] = useState('complet');
        return (
            <div className="space-y-6">
                <SectionTitle icon="📖" title="Tema 14" subtitle={t('tema14.title')} />
                <Tabs tabs={[
                    { id: 'complet', label: '📝 ' + t('tab.complet') },
                    { id: 'resum', label: '📋 ' + t('tab.resum') },
                ]} active={vista} onChange={setVista} />

                {vista === 'complet' && <Tema14Complet />}
                {vista === 'resum' && <Tema14Resum />}
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════════
    // TEMES 15-20 — Placeholders
    // ════════════════════════════════════════════════════════════════
    const TemaPlaceholder = ({ num }) => (
        <div className="animate-fade text-center py-20">
            <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gray-100 mb-6">
                <span className="text-4xl">🔒</span>
            </div>
            <h2 className="text-2xl font-black text-slate-800 mb-2">
                {lang === 'es' ? 'Próximamente' : lang === 'en' ? 'Coming soon' : 'Properament'} — Tema {num}
            </h2>
            <p className="text-slate-500 max-w-lg mx-auto">
                {t(`tema${num}.title`)}
            </p>
            <button
                onClick={() => { setSection('inicio'); pdeSetHashSection('inicio'); pdeScrollToTop(); }}
                className="mt-8 inline-flex items-center gap-2 px-5 py-2.5 bg-pink-100 text-pink-700 rounded-xl font-semibold text-sm hover:bg-pink-200 transition-colors"
            >
                ← {t('sec.inicio')}
            </button>
        </div>
    );

    // ════════════════════════════════════════════════════════════════
    // NAVIGATION AND RENDER
    // ════════════════════════════════════════════════════════════════
    const headerSections = [
        { id: 'inicio', label: t('sec.inicio'), emoji: '🏠' },
        { id: 'tema11', label: 'T11', emoji: '📖' },
        { id: 'tema12', label: 'T12', emoji: '📖' },
        { id: 'tema13', label: 'T13', emoji: '📖' },
        { id: 'tema14', label: 'T14', emoji: '📖' },
        { id: 'tema15', label: 'T15', emoji: '🔒' },
        { id: 'tema16', label: 'T16', emoji: '🔒' },
        { id: 'tema17', label: 'T17', emoji: '🔒' },
        { id: 'tema18', label: 'T18', emoji: '🔒' },
        { id: 'tema19', label: 'T19', emoji: '🔒' },
        { id: 'tema20', label: 'T20', emoji: '🔒' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}
                setIdioma={(lang) => { setIdioma(lang); PdeLanguageStore.set(lang); }}
                currentApp="oposicions-bloc-b"
                sections={headerSections}
                currentSection={section}
                setSection={setSection}
            />

            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}
                {section === 'tema11' && <Tema11 />}
                {section === 'tema12' && <Tema12 />}
                {section === 'tema13' && <Tema13 />}
                {section === 'tema14' && <Tema14 />}
                {section === 'tema15' && <TemaPlaceholder num={15} />}
                {section === 'tema16' && <TemaPlaceholder num={16} />}
                {section === 'tema17' && <TemaPlaceholder num={17} />}
                {section === 'tema18' && <TemaPlaceholder num={18} />}
                {section === 'tema19' && <TemaPlaceholder num={19} />}
                {section === 'tema20' && <TemaPlaceholder num={20} />}
            </main>

            <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
            <PdeFooter appEmoji="📖" appName={t('footer.appname')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<BlocBApp />, document.getElementById('root'));
    </script>
</body>
</html>
