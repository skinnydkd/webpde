    const Tema11Complet = () => (

            <Card title="Introducció" icon="📌">

                        La <strong>demanda</strong> és un dels pilars fonamentals de l'anàlisi microeconòmica. Juntament amb l'oferta, constitueix el mecanisme central a través del qual els mercats assignen recursos escassos entre usos alternatius. Comprendre com els consumidors prenen les seues decisions de consum, quins factors determinen la quantitat demandada d'un bé i com reacciona la demanda davant variacions en els preus és essencial per a entendre el funcionament de qualsevol sistema econòmic basat en el mercat.
                    </p>
                    <p>

                    </p>
                    <p>
                        El present tema s'estructura en quatre epígrafs: en primer lloc, s'analitza la demanda individual i de mercat, incloent-hi la llei de la demanda, els seus determinants i la distinció entre moviments i desplaçaments; en segon lloc, es desenvolupa la teoria de la utilitat, des de l'enfocament cardinal (utilitat marginal decreixent) fins a l'ordinal (corbes d'indiferència i restricció pressupostària); en tercer lloc, s'aborda l'elasticitat-preu de la demanda i altres elasticitats rellevants; i, finalment, es connecta amb la rellevància curricular i les possibilitats didàctiques. Es conclou amb una síntesi integradora i una bibliografia de referència.

                    </p>
                    <p>

                        <circle cx="230" cy="130" r="5" fill="#ec4899" />
                        <line x1="320" y1="260" x2="320" y2="177" stroke="#334155" strokeWidth="1" strokeDasharray="3,3" />
                        <line x1="60" y1="177" x2="320" y2="177" stroke="#334155" strokeWidth="1" strokeDasharray="3,3" />
                        <circle cx="320" cy="177" r="5" fill="#ec4899" />
                        <line x1="400" y1="260" x2="400" y2="219" stroke="#334155" strokeWidth="1" strokeDasharray="3,3" />
                        <line x1="60" y1="219" x2="400" y2="219" stroke="#334155" strokeWidth="1" strokeDasharray="3,3" />
                        <circle cx="400" cy="219" r="5" fill="#ec4899" />
                        {/* Curve label */}

                        <text x="160" y="240" fontSize="11" fill="#be185d" fontWeight="600">Pendent negativa: llei de la demanda</text>
                        <line x1="250" y1="225" x2="200" y2="175" stroke="#be185d" strokeWidth="1.5" markerEnd="url(#arrowPink1)" />

                            <marker id="arrowPink1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#be185d" /></marker>
                        </defs>
                    </svg>
                </div>

                <TheoryBlock title="1.2. La taula de demanda i la corba de demanda" color="blue">
                    <p>
                        La <strong>taula de demanda</strong> (o pla de demanda) és una representació numèrica que relaciona diferents nivells de preus amb les quantitats demandades corresponents. A partir de la taula de demanda es construeix la <strong>corba de demanda</strong>, que és la seua representació gràfica: es situa el preu (P) en l'eix d'ordenades i la quantitat demandada (Qd) en l'eix d'abscisses. La corba de demanda té pendent negatiu, reflectint la relació inversa entre preu i quantitat.
                    </p>
                    <p>
                        Convé assenyalar que la convenció de representar el preu en l'eix vertical i la quantitat en l'horitzontal va ser establida per <strong>Alfred Marshall</strong> (1890) en els seus <em>Principios de Economía</em>, i s'ha mantingut per tradició, encara que matemàticament la variable independent (preu) hauria de situar-se en l'eix horitzontal. Aquesta "inversió marshalliana" és una convenció que l'opositor ha de conéixer i dominar.
                    </p>
                    <p>
                        La forma funcional més habitual de la corba de demanda lineal és:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Qd = a − b·P    (con a, b > 0)"
                    desc="a = demanda autònoma (quantitat quan P = 0) | b = sensibilitat de la demanda al preu"
                />

                <TheoryBlock title="1.3. Desplaçaments vs. moviments al llarg de la corba" color="green">
                    <p>
                        És fonamental distingir entre dos tipus de canvis en la demanda:
                    </p>
                    <p>
                        Un <strong>moviment al llarg de la corba de demanda</strong> es produeix quan varia el preu del bé, mantenint-se constants tots els altres factors. En pujar el preu, ens movem cap amunt i a l'esquerra al llarg de la corba (menor quantitat demandada); en baixar el preu, ens movem cap avall i a la dreta (major quantitat demandada). Aquest moviment reflecteix un canvi en la <em>quantitat demandada</em>.
                    </p>
                    <p>
                        Un <strong>desplaçament de la corba de demanda</strong> es produeix quan varia algun dels factors distints del preu propi del bé: la renda del consumidor, els preus de béns relacionats, els gustos, les expectatives o la població. Quan algun d'aquests factors canvia, la corba es desplaça íntegrament cap a la dreta (augment de la demanda: es demanda més a cada preu) o cap a l'esquerra (disminució de la demanda: es demanda menys a cada preu). Aquest canvi reflecteix una variació en la <em>demanda</em> pròpiament dita.
                    </p>
                    <p>
                        Aquesta distinció és una de les fonts d'error més freqüents entre l'alumnat i, per tant, és un punt clau en l'avaluació. L'opositor ha de dominar-la amb precisió terminològica i gràfica.
                    </p>
                </TheoryBlock>

                <div className="my-6 flex justify-center">

                <TheoryBlock title="1.4. Factors determinants de la demanda" color="amber">
                    <p>
                        Els principals <strong>factors que determinen la demanda</strong> (i que provoquen desplaçaments de la corba) són:
                    </p>
                    <p>
                        <strong>1. La renda del consumidor:</strong> Un augment de la renda incrementa la demanda de <strong>béns normals</strong> (desplaçament a la dreta) però redueix la demanda de <strong>béns inferiors</strong> (desplaçament a l'esquerra). Aquesta relació va ser estudiada sistemàticament per <strong>Ernst Engel</strong> (1821-1896), qui va formular les <strong>lleis d'Engel</strong>: a mesura que la renda augmenta, la proporció de la despesa destinada a alimentació disminueix (Llei d'Engel), mentre que augmenta la proporció destinada a habitatge, vestit, sanitat, oci i estalvi.
                    </p>
                    <p>
                        <strong>2. Els preus dels béns relacionats:</strong> Si el bé X és <strong>substitutiu</strong> del bé Y (Coca-Cola i Pepsi, mantega i margarina), un augment del preu de X incrementa la demanda de Y (desplaçament a la dreta de la corba de demanda de Y). Si el bé X és <strong>complementari</strong> del bé Y (cotxe i gasolina, impressora i tinta), un augment del preu de X redueix la demanda de Y (desplaçament a l'esquerra).
                    </p>
                    <p>
                        <strong>3. Els gustos i preferències:</strong> Canvis en els gustos dels consumidors —per modes, publicitat, tendències socials, conscienciació ecològica— desplacen la corba de demanda. L'auge de l'alimentació ecològica o la mobilitat sostenible en són exemples actuals.
                    </p>
                    <p>
                        <strong>4. Les expectatives:</strong> Si els consumidors esperen que el preu d'un bé puge en el futur, anticipen les seues compres (augment de la demanda present). Si esperen un augment de la seua renda futura, poden augmentar el seu consum present. Les expectatives són un factor clau en mercats com l'immobiliari o el borsari.
                    </p>
                    <p>
                        <strong>5. La grandària del mercat (població):</strong> Un augment de la població o del nombre de consumidors potencials desplaça la demanda del mercat cap a la dreta. La immigració, l'envelliment demogràfic o la urbanització afecten la demanda agregada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.5. De la demanda individual a la demanda de mercat" color="rose">
                    <p>
                        La <strong>demanda individual</strong> reflecteix les decisions d'un únic consumidor. La <strong>demanda de mercat</strong> és la suma horitzontal de totes les demandes individuals dels consumidors que participen en un mercat determinat. Gràficament, per a cada nivell de preus, se sumen les quantitats demandades per tots els consumidors.
                    </p>
                    <p>
                        Si en un mercat hi ha <em>n</em> consumidors, la demanda de mercat és:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Qd_mercado(P) = Σᵢ₌₁ⁿ Qd_i(P)"
                    desc="Agregació horitzontal: se sumen les quantitats demandades per cada consumidor a cada preu"
                />
            </Card>

            {/* Epígraf 2 */}
            <Card title="2. La teoria de la utilitat" icon="📘">
                <TheoryBlock title="2.1. Concepte d'utilitat. Utilitat total i marginal" color="pink">
                    <p>
                        La <strong>utilitat</strong> és un concepte central de la teoria del consumidor. Es defineix com la <strong>satisfacció o benestar que un individu obté del consum d'un bé o servei</strong>. Encara que la utilitat és un concepte subjectiu i no directament observable, és el fonament teòric sobre el qual es construeix tota la teoria de la demanda.
                    </p>
                    <p>
                        La <strong>utilitat total (UT)</strong> és la satisfacció acumulada que obté un consumidor pel consum d'una determinada quantitat d'un bé. La <strong>utilitat marginal (UMg)</strong> és la satisfacció addicional que proporciona el consum d'una unitat més d'aquest bé:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="UMg = ΔUT / ΔQ = dUT / dQ"
                    desc="La utilitat marginal mesura la variació de la utilitat total en consumir una unitat addicional"
                />

                <TheoryBlock title="2.2. Llei de la utilitat marginal decreixent" color="blue">
                    <p>
                        La <strong>llei de la utilitat marginal decreixent</strong> (també coneguda com a primera llei de Gossen) estableix que, a mesura que un individu consumeix unitats successives d'un mateix bé, la utilitat marginal de cada unitat addicional tendeix a disminuir. El primer got d'aigua quan es té set proporciona una satisfacció enorme; el segon, una mica menys; el tercer, encara menys; i així successivament. Arriba un punt en què la utilitat marginal pot ser nul·la (sacietat) o fins i tot negativa (desutilitat).
                    </p>
                    <p>
                        Aquesta llei va ser formulada independentment per tres autors en l'anomenada <strong>revolució marginalista</strong> de la dècada de 1870: <strong>William Stanley Jevons</strong> (<em>The Theory of Political Economy</em>, 1871) a Anglaterra, <strong>Carl Menger</strong> (<em>Grundsätze der Volkswirtschaftslehre</em>, 1871) a Àustria, i <strong>Léon Walras</strong> (<em>Éléments d'économie politique pure</em>, 1874) a Suïssa. Aquesta triple convergència independent és un dels episodis més notables de la història del pensament econòmic.
                    </p>
                    <p>
                        La llei de la utilitat marginal decreixent proporciona una explicació teòrica de la llei de la demanda: si la satisfacció addicional que proporciona cada unitat consumida és cada vegada menor, el consumidor només estarà disposat a comprar més unitats si el preu disminueix. D'aquesta manera, la relació inversa entre preu i quantitat demandada es fonamenta en el comportament psicològic del consumidor.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. L'equilibri del consumidor: l'equimarginalitat" color="green">
                    <p>
                        Un consumidor racional que desitja maximitzar la seua utilitat total, donat el seu pressupost limitat, ha de distribuir la seua despesa entre els distints béns de manera que la <strong>utilitat marginal per unitat monetària gastada siga igual per a tots els béns</strong>. Aquest principi es coneix com a <strong>principi d'equimarginalitat</strong> o <strong>segona llei de Gossen</strong>:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="UMgₐ / Pₐ = UMgᵦ / Pᵦ = ... = UMgₙ / Pₙ"
                    desc="Equilibri del consumidor: la utilitat marginal per euro gastat ha de ser igual per a tots els béns"
                />

                <TheoryBlock color="green">
                    <p>
                        Si la utilitat marginal per euro gastat en un bé A fora major que la del bé B, el consumidor podria augmentar la seua utilitat total reassignant despesa del bé B al bé A. En consumir més d'A, la seua utilitat marginal disminueix (llei de UMg decreixent); en consumir menys de B, la seua utilitat marginal augmenta. El procés continua fins que s'igualen les ràtios UMg/P per a tots els béns.
                    </p>
                    <p>
                        Aquest resultat va ser formalitzat per <strong>Hermann Heinrich Gossen</strong> (1854) en la seua obra <em>Entwickelung der Gesetze des menschlichen Verkehrs</em>, encara que va passar desapercebuda en la seua època i va ser redescoberta per Jevons i Walras.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. La paradoxa del valor: aigua i diamants" color="amber">
                    <p>
                        Una de les qüestions més cèlebres de la història del pensament econòmic és la <strong>paradoxa del valor</strong> (o paradoxa de l'aigua i els diamants), plantejada per <strong>Adam Smith</strong> (1776): per què l'aigua, que és essencial per a la vida, té un preu tan baix, mentre que els diamants, que són superflus, tenen un preu tan elevat?
                    </p>
                    <p>
                        Els economistes clàssics (Smith, Ricardo) no van aconseguir resoldre satisfactòriament aquesta paradoxa perquè confonien el <strong>valor d'ús</strong> (utilitat total) amb el <strong>valor de canvi</strong> (preu). La solució va vindre de la mà dels marginalistes: el preu d'un bé no depén de la seua utilitat total, sinó de la seua <strong>utilitat marginal</strong>. L'aigua té una utilitat total enorme, però com que és abundant, la seua utilitat marginal (la satisfacció que proporciona un litre addicional) és molt baixa. Els diamants tenen una utilitat total menor, però com que són escassos, la seua utilitat marginal és molt alta. El preu reflecteix la utilitat marginal, no la utilitat total.
                    </p>
                    <p>
                        Aquesta resolució va ser una de les grans contribucions de la revolució marginalista i va demostrar la superioritat de l'anàlisi marginal sobre l'anàlisi basat en el valor-treball dels clàssics i de Marx.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. De la utilitat cardinal a l'ordinal: corbes d'indiferència" color="pink">
                    <p>
                        L'enfocament de la utilitat cardinal (Jevons, Menger, Walras, Marshall) assumeix que la utilitat és <strong>mesurable numèricament</strong> en unitats abstractes (<em>útils</em>). Aquest supòsit va ser criticat per ser excessivament restrictiu: en la pràctica, els consumidors no assignen valors numèrics a la seua satisfacció, sinó que <strong>ordenen</strong> les seues preferències (prefereixen A a B, o són indiferents entre C i D).
                    </p>
                    <p>
                        L'enfocament <strong>ordinal</strong>, desenvolupat per <strong>Francis Y. Edgeworth</strong> (1881) i perfeccionat per <strong>Vilfredo Pareto</strong> (1906) i <strong>John Hicks</strong> i <strong>Roy Allen</strong> (1934), introdueix l'instrument de les <strong>corbes d'indiferència</strong>: cada corba representa el conjunt de combinacions de dos béns que proporcionen al consumidor el mateix nivell de satisfacció. Les corbes d'indiferència tenen les propietats següents:
                    </p>
                    <p>
                        (a) Tenen <strong>pendent negatiu</strong>: per a mantindre la mateixa utilitat, en consumir més d'un bé cal consumir menys de l'altre. (b) Són <strong>convexes respecte a l'origen</strong>: reflecteixen la diversificació del consum (els consumidors prefereixen combinacions equilibrades). (c) <strong>No es tallen entre si</strong>: seria lògicament inconsistent. (d) Les corbes més allunyades de l'origen representen nivells d'utilitat <strong>més alts</strong>.
                    </p>
                    <p>
                        El pendent de la corba d'indiferència en cada punt s'anomena <strong>Relació Marginal de Substitució (RMS)</strong> i mesura la quantitat d'un bé que el consumidor està disposat a cedir per una unitat addicional de l'altre, mantenint constant el seu nivell d'utilitat:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="RMS = |ΔY / ΔX| = UMgₓ / UMgᵧ"
                    desc="RMS decreixent → corbes d'indiferència convexes (preferència per la diversificació)"
                />

                <TheoryBlock title="2.6. La restricció pressupostària i l'òptim del consumidor" color="blue">
                    <p>
                        El consumidor no pot situar-se en la corba d'indiferència més alta possible sense restriccions: la seua elecció està limitada per la seua <strong>restricció pressupostària</strong>, que expressa que la despesa total no pot superar la renda disponible:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Pₓ · X + Pᵧ · Y = M"
                    desc="M = renda | Pₓ, Pᵧ = preus dels béns X i Y"
                />

                <TheoryBlock color="blue">
                    <p>
                        La recta pressupostària té pendent −Pₓ/Pᵧ i es desplaça paral·lelament cap a fora si augmenta la renda, o rota si varia el preu relatiu d'un dels béns.
                    </p>
                    <p>
                        L'<strong>òptim del consumidor</strong> s'aconsegueix en el punt on la recta pressupostària és <strong>tangent</strong> a la corba d'indiferència més alta assolible. En aquest punt, el pendent de la corba d'indiferència (RMS) és igual al pendent de la recta pressupostària (ràtio de preus):
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="RMS = Pₓ / Pᵧ   →   UMgₓ / UMgᵧ = Pₓ / Pᵧ   →   UMgₓ / Pₓ = UMgᵧ / Pᵧ"
                    desc="L'òptim del consumidor: la condició de tangència reprodueix l'equimarginalitat"
                />

                <div className="my-6 flex justify-center">

                <TheoryBlock title="2.7. Efecte renda i efecte substitució" color="green">
                    <p>
                        Quan varia el preu d'un bé, la quantitat demandada canvia per dues raons que convé separar analíticament:
                    </p>
                    <p>
                        <strong>Efecte substitució:</strong> en baixar el preu del bé X (mantenint-se constant el del bé Y), X s'abarateix en termes relatius, la qual cosa incentiva el consumidor a substituir Y per X. Aquest efecte és sempre negatiu (més quantitat quan baixa el preu) i reforça la llei de la demanda.
                    </p>
                    <p>
                        <strong>Efecte renda:</strong> en baixar el preu de X, el poder adquisitiu real del consumidor augmenta (pot comprar més amb la mateixa renda monetària). Si X és un bé normal, aquest augment de poder adquisitiu porta a consumir més de X (efecte renda positiu), reforçant la llei de la demanda. Si X és un bé inferior, l'efecte renda és negatiu (en tindre més poder adquisitiu, es consumeix menys del bé inferior), però normalment no supera l'efecte substitució, per la qual cosa la llei de la demanda es manté.
                    </p>
                    <p>
                        La descomposició de l'efecte total en efecte substitució i efecte renda va ser formalitzada per <strong>Eugen Slutsky</strong> (1915) i posteriorment refinada per <strong>John Hicks</strong> (1939, Premi Nobel 1972). L'equació de Slutsky estableix que: Efecte total = Efecte substitució + Efecte renda.
                    </p>
                    <p>
                        Una excepció teòrica a la llei de la demanda són els <strong>béns Giffen</strong>: béns inferiors en els quals l'efecte renda negatiu supera l'efecte substitució, donant lloc a una corba de demanda amb pendent positiu (en pujar el preu, augmenta la quantitat demandada). L'exemple clàssic és el de les creïlles durant la fam irlandesa (1845-1849), encara que la seua existència empírica ha estat debatuda. <strong>Robert Jensen i Nolan Miller</strong> (2008) van documentar evidència de comportament Giffen en el consum d'arròs i fideus a la Xina.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 3 */}
            <Card title="3. L'elasticitat-preu de la demanda" icon="📘">
                <TheoryBlock title="3.1. Concepte i càlcul de l'elasticitat-preu" color="pink">
                    <p>
                        L'<strong>elasticitat-preu de la demanda (Ep)</strong> mesura la <strong>sensibilitat de la quantitat demandada davant variacions en el preu</strong>. Formalment, es defineix com el quocient entre la variació percentual de la quantitat demandada i la variació percentual del preu:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Ep = (ΔQ/Q) / (ΔP/P) = (ΔQ/ΔP) × (P/Q)"
                    desc="Ep és generalment negatiu (llei de la demanda). Se sol treballar amb |Ep| (valor absolut)"
                />

                <TheoryBlock color="pink">
                    <p>
                        Per a evitar el problema que l'elasticitat diferisca segons el sentit de la variació (augment o disminució del preu), s'utilitza freqüentment la <strong>fórmula del punt mitjà (o elasticitat arc)</strong>:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Ep = [(Q₂ − Q₁) / ((Q₂ + Q₁)/2)] / [(P₂ − P₁) / ((P₂ + P₁)/2)]"
                    desc="Fórmula del punt mitjà: utilitza les mitjanes de P i Q com a base"
                />

                <TheoryBlock title="3.2. Tipus d'elasticitat-preu" color="blue">
                    <p>
                        Segons el valor absolut de l'elasticitat, es distingeixen els casos següents:
                    </p>
                    <p>
                        <strong>Demanda elàstica (|Ep| &gt; 1):</strong> la quantitat demandada varia percentualment més que el preu. Exemple: béns de luxe, béns amb molts substitutius. Un augment del 10 % en el preu redueix la quantitat demandada en més d'un 10 %.
                    </p>
                    <p>
                        <strong>Demanda inelàstica (|Ep| &lt; 1):</strong> la quantitat demandada varia percentualment menys que el preu. Exemple: béns de primera necessitat (pa, llet, medicaments), béns sense substitutius propers (gasolina). Un augment del 10 % en el preu redueix la quantitat demandada en menys d'un 10 %.
                    </p>
                    <p>
                        <strong>Demanda unitària (|Ep| = 1):</strong> la quantitat demandada varia en la mateixa proporció que el preu.
                    </p>
                    <p>
                        <strong>Demanda perfectament elàstica (|Ep| → ∞):</strong> qualsevol variació mínima del preu provoca una variació infinita de la quantitat demandada. La corba de demanda és horitzontal. Es dona en mercats de competència perfecta des de la perspectiva de l'empresa individual.
                    </p>
                    <p>
                        <strong>Demanda perfectament inelàstica (|Ep| = 0):</strong> la quantitat demandada no varia davant canvis en el preu. La corba de demanda és vertical. Exemple teòric: la insulina per a un diabètic (dins de certs rangs de preu).
                    </p>
                </TheoryBlock>

                <div className="my-6 flex justify-center">
                    <svg viewBox="0 0 500 310" className="w-full max-w-lg" style={{fontFamily: 'Nunito, sans-serif'}}>
                        {/* Axes */}
                        <line x1="60" y1="20" x2="60" y2="260" stroke="#334155" strokeWidth="2" />
                        <line x1="60" y1="260" x2="470" y2="260" stroke="#334155" strokeWidth="2" />
                        <polygon points="60,20 55,30 65,30" fill="#334155" />
                        <polygon points="470,260 460,255 460,265" fill="#334155" />
                        <text x="35" y="25" fontSize="12" fill="#334155" fontWeight="600" textAnchor="middle">P</text>
                        <text x="460" y="280" fontSize="12" fill="#334155" fontWeight="600" textAnchor="end">Q</text>
                        {/* Perfectly elastic (horizontal) */}
                        <line x1="70" y1="220" x2="450" y2="220" stroke="#f9a8d4" strokeWidth="2" />
                        <text x="320" y="215" fontSize="9.5" fill="#f9a8d4" fontWeight="600">|Ep| = ∞ (perfectament elàstica)</text>
                        {/* Elastic (gentle slope) */}
                        <line x1="70" y1="100" x2="440" y2="180" stroke="#f472b6" strokeWidth="2" />
                        <text x="320" y="150" fontSize="9.5" fill="#f472b6" fontWeight="600">|Ep| {'>'} 1 (elàstica)</text>
                        {/* Unitary (45 degree) */}
                        <line x1="70" y1="50" x2="380" y2="250" stroke="#ec4899" strokeWidth="2.5" />
                        <text x="280" y="195" fontSize="9.5" fill="#ec4899" fontWeight="700">|Ep| = 1 (unitària)</text>
                        {/* Inelastic (steep) */}
                        <line x1="80" y1="35" x2="200" y2="250" stroke="#f43f5e" strokeWidth="2" />
                        <text x="130" y="100" fontSize="9.5" fill="#f43f5e" fontWeight="600">|Ep| {'<'} 1 (inelàstica)</text>
                        {/* Perfectly inelastic (vertical) */}
                        <line x1="120" y1="35" x2="120" y2="250" stroke="#be123c" strokeWidth="2" />
                        <text x="128" y="52" fontSize="9.5" fill="#be123c" fontWeight="600">|Ep| = 0 (perf. inelàstica)</text>
                        {/* Title */}
                        <text x="250" y="295" fontSize="12" fill="#334155" fontWeight="700" textAnchor="middle">Tipus d'elasticitat-preu de la demanda</text>
                    </svg>
                </div>

                <TheoryBlock title="3.3. Factors determinants de l'elasticitat" color="green">
                    <p>
                        Els principals factors que determinen el valor de l'elasticitat-preu de la demanda són:
                    </p>
                    <p>
                        <strong>1. Disponibilitat de béns substitutius:</strong> com més substitutius propers tinga un bé, més elàstica serà la seua demanda. Si puja el preu de la Coca-Cola, els consumidors poden passar-se fàcilment a la Pepsi. Si puja el preu de la gasolina, no hi ha un substitutiu immediat.
                    </p>
                    <p>
                        <strong>2. Caràcter del bé (necessitat vs. luxe):</strong> els béns de primera necessitat (pa, electricitat, aigua) tenen demanda inelàstica perquè no es pot prescindir fàcilment d'ells. Els béns de luxe (viatges, joies, cotxes esportius) tenen demanda més elàstica.
                    </p>
                    <p>
                        <strong>3. Horitzó temporal:</strong> la demanda tendeix a ser més elàstica a llarg termini que a curt termini, perquè els consumidors disposen de més temps per a ajustar el seu comportament, buscar alternatives i modificar els seus hàbits. A curt termini, un augment del preu del petroli amb prou faenes redueix la demanda; a llarg termini, incentiva la compra de cotxes elèctrics, l'ús del transport públic i la inversió en energies renovables.
                    </p>
                    <p>
                        <strong>4. Pes del bé en el pressupost del consumidor:</strong> els béns que representen una proporció significativa de la despesa total (habitatge, alimentació) tendeixen a tindre demanda més elàstica que els béns amb pes pressupostari reduït (sal, llumins, xiclets).
                    </p>
                    <p>
                        <strong>5. Definició del mercat:</strong> com més àmpliament es definisca el mercat, més inelàstica serà la demanda (la demanda d'aliments és inelàstica; la demanda de iogurts de maduixa d'una marca concreta és molt elàstica).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Elasticitat i ingrés total: relació fonamental" color="amber">
                    <p>
                        Una de les aplicacions més importants de l'elasticitat-preu és la seua relació amb l'<strong>ingrés total (IT = P × Q)</strong>. Aquesta relació és crucial per a les decisions empresarials sobre preus:
                    </p>
                    <p>
                        <strong>Si la demanda és elàstica (|Ep| &gt; 1):</strong> una reducció del preu augmenta l'ingrés total (l'augment percentual de la quantitat venuda supera la reducció percentual del preu). Inversament, un augment del preu redueix l'ingrés total. Exemple: una empresa d'oci que redueix el preu de les entrades i en ven moltes més.
                    </p>
                    <p>
                        <strong>Si la demanda és inelàstica (|Ep| &lt; 1):</strong> una reducció del preu redueix l'ingrés total (l'augment percentual de la quantitat venuda és inferior a la reducció percentual del preu). Inversament, un augment del preu augmenta l'ingrés total. Exemple: l'OPEP puja el preu del petroli i els seus ingressos creixen perquè la demanda amb prou faenes disminueix.
                    </p>
                    <p>
                        <strong>Si la demanda és unitària (|Ep| = 1):</strong> l'ingrés total no varia davant canvis en el preu.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="|Ep| > 1 → ↓P ⇒ ↑IT    |    |Ep| < 1 → ↓P ⇒ ↓IT    |    |Ep| = 1 → IT constante"
                    desc="Relació entre elasticitat i ingrés total: clau per a l'estratègia de preus"
                />

                <TheoryBlock title="3.5. Altres elasticitats: elasticitat-renda i elasticitat creuada" color="pink">
                    <p>
                        A més de l'elasticitat-preu, existeixen altres elasticitats rellevants per a l'anàlisi de la demanda:
                    </p>
                    <p>
                        <strong>Elasticitat-renda de la demanda (Ey):</strong> mesura la sensibilitat de la quantitat demandada davant variacions en la renda del consumidor:
                    </p>
                    <p>
                        <strong>Ey = (ΔQ/Q) / (ΔY/Y)</strong>, on Y = renda.
                    </p>
                    <p>
                        Si Ey &gt; 0: <strong>bé normal</strong> (la demanda creix amb la renda). Dins dels normals: si 0 &lt; Ey &lt; 1, és un <strong>bé de primera necessitat</strong> (la demanda creix menys que proporcionalment amb la renda); si Ey &gt; 1, és un <strong>bé de luxe</strong> o superior (la demanda creix més que proporcionalment). Si Ey &lt; 0: <strong>bé inferior</strong> (la demanda disminueix en augmentar la renda). La <strong>corba d'Engel</strong> relaciona la renda amb la quantitat demandada d'un bé.
                    </p>
                    <p>
                        <strong>Elasticitat creuada de la demanda (Exy):</strong> mesura la sensibilitat de la quantitat demandada d'un bé X davant variacions en el preu d'un altre bé Y:
                    </p>
                    <p>
                        <strong>Exy = (ΔQx/Qx) / (ΔPy/Py)</strong>
                    </p>
                    <p>
                        Si Exy &gt; 0: els béns són <strong>substitutius</strong> (en pujar el preu de Y, augmenta la demanda de X). Si Exy &lt; 0: els béns són <strong>complementaris</strong> (en pujar el preu de Y, disminueix la demanda de X). Si Exy ≈ 0: els béns són <strong>independents</strong>.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Conclusió" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        Al llarg d'aquest tema s'ha desenvolupat l'anàlisi completa de la demanda des de tres perspectives complementàries. En primer lloc, la perspectiva descriptiva: la llei de la demanda, la corba de demanda, els seus determinants i la distinció fonamental entre moviments al llarg de la corba i desplaçaments d'aquesta. En segon lloc, la perspectiva teòrica: la teoria de la utilitat, des de l'enfocament cardinal dels marginalistes (Jevons, Menger, Walras) fins a l'enfocament ordinal de les corbes d'indiferència (Edgeworth, Pareto, Hicks), passant per la resolució de la paradoxa del valor i la determinació de l'equilibri del consumidor. En tercer lloc, la perspectiva quantitativa: l'elasticitat-preu de la demanda com a instrument de mesurament de la sensibilitat del consumidor, juntament amb les seues aplicacions en l'estratègia de preus i la política econòmica.

                    </p>

                    </p>

                    <p>

                <TheoryBlock title="1.3. Factors determinants de l'oferta" color="green">

                    </p>
                    <p>
                        <strong>2. La tecnologia:</strong> Una millora tecnològica permet produir més amb els mateixos recursos (o el mateix amb menys recursos), la qual cosa desplaça la corba d'oferta cap a la dreta. La innovació tecnològica —des de la mecanització fins a la digitalització i la intel·ligència artificial— ha estat històricament el principal motor dels desplaçaments de l'oferta.
                    </p>
                    <p>
                        <strong>3. Els preus dels factors productius:</strong> Un augment del preu del treball (salaris), del capital (tipus d'interés), de la terra (lloguers) o de les matèries primeres incrementa els costos de producció i, per tant, redueix l'oferta. Les polítiques salarials, la regulació laboral i els preus de l'energia són factors determinants.

            {/* Epígraf 2 */}
            <Card title="2. La teoria de costos de producció" icon="📘">
                <TheoryBlock title="2.1. Costos a curt termini: fixos, variables i totals" color="pink">
                    <p>
                        En l'anàlisi econòmica, el <strong>curt termini</strong> es defineix com el període en el qual almenys un factor productiu és fix (generalment, el capital: instal·lacions, maquinària). En el <strong>llarg termini</strong>, tots els factors són variables. Aquesta distinció, deguda a <strong>Alfred Marshall</strong> (1890), és fonamental per a la teoria de costos.
                    </p>
                    <p>
                        A curt termini, els costos es classifiquen en:
                    </p>
                    <p>
                        <strong>Costos fixos (CF):</strong> són aquells que no depenen del nivell de producció. S'incorren encara que l'empresa no produïsca res: lloguer del local, assegurances, amortització de la maquinària, salaris de directius permanents, quotes de préstecs. CF = constant.
                    </p>
                    <p>
                        <strong>Costos variables (CV):</strong> són aquells que varien amb el nivell de producció: matèries primeres, energia consumida en la producció, mà d'obra directa, comissions de vendes. CV = CV(Q), amb CV(0) = 0 i CV creixent amb Q.
                    </p>
                    <p>
                        <strong>Costos totals (CT):</strong> són la suma dels costos fixos i els costos variables:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="CT = CF + CV(Q)"
                    desc="Els costos totals són la suma de costos fixos (constants) i costos variables (funció de Q)"
                />

                <TheoryBlock title="2.2. Costos mitjans i cost marginal" color="blue">
                    <p>
                        A partir dels costos totals es deriven els <strong>costos unitaris</strong> (per unitat produïda), que són fonamentals per a la presa de decisions:
                    </p>
                    <p>
                        <strong>Cost fix mitjà (CFMe):</strong> CFMe = CF / Q. És decreixent amb Q (els costos fixos es "reparteixen" entre més unitats). Aquest fenomen explica l'interés de les empreses per produir a gran escala.
                    </p>
                    <p>
                        <strong>Cost variable mitjà (CVMe):</strong> CVMe = CV / Q. Inicialment decreixent (per l'eficiència de l'especialització), després creixent (pels rendiments decreixents del factor variable).
                    </p>
                    <p>
                        <strong>Cost total mitjà (CMe o CTMe):</strong> CMe = CT / Q = CFMe + CVMe. Té forma d'<strong>U</strong>: inicialment decreixent (dominen els costos fixos que es dilueixen) i posteriorment creixent (dominen els rendiments decreixents). El punt mínim del CMe s'anomena <strong>escala eficient</strong> o <strong>dimensió òptima de producció a curt termini</strong>.
                    </p>
                    <p>
                        <strong>Cost marginal (CMg):</strong> és el cost addicional de produir una unitat més:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="CMg = ΔCT / ΔQ = dCT / dQ = dCV / dQ"
                    desc="El CMg no depén dels costos fixos (CF és constant → dCF/dQ = 0)"
                />

                <TheoryBlock title="2.3. Relació entre CMg i CMe" color="green">
                    <p>
                        La relació entre el cost marginal i el cost mitjà és una de les més importants de la teoria de costos i té una interpretació intuïtiva senzilla:
                    </p>
                    <p>
                        <strong>Quan CMg &lt; CMe:</strong> produir una unitat addicional costa menys que la mitjana, per la qual cosa el CMe descendeix. És com si un estudiant que té una mitjana de 7 traguera un 9 en el següent examen: la seua mitjana puja.
                    </p>
                    <p>
                        <strong>Quan CMg &gt; CMe:</strong> produir una unitat addicional costa més que la mitjana, per la qual cosa el CMe ascendeix.
                    </p>
                    <p>
                        <strong>Quan CMg = CMe:</strong> el CMe està en el seu punt mínim. La corba de CMg <strong>talla la corba de CMe pel seu punt mínim</strong>. Aquesta és una propietat matemàtica fonamental (relació entre marginal i mitjana) que es repeteix en altres contextos (CMg i CVMe, productivitat marginal i productivitat mitjana).
                    </p>
                    <p>
                        La mateixa relació s'aplica al CVMe: la corba de CMg talla també la corba de CVMe pel seu punt mínim, que se situa a un nivell de producció inferior al mínim del CMe.
                    </p>
                </TheoryBlock>

                <div className="my-6 flex justify-center">
                    <svg viewBox="0 0 500 320" className="w-full max-w-lg" style={{fontFamily: 'Nunito, sans-serif'}}>
                        {/* Axes */}
                        <line x1="60" y1="20" x2="60" y2="270" stroke="#334155" strokeWidth="2" />

                        {/* CVMe curve (U-shaped, dashed) */}

                    </svg>
                </div>

                <TheoryBlock title="2.4. Costos a llarg termini: tots els costos són variables" color="amber">
                    <p>
                        A <strong>llarg termini</strong>, l'empresa pot ajustar tots els seus factors productius, inclòs el capital. No existeixen costos fixos: tots els costos són variables. L'empresa pot triar la seua <strong>escala de producció</strong> (grandària de la planta) de forma òptima.
                    </p>
                    <p>
                        La <strong>corba de cost mitjà a llarg termini (CMeLT)</strong> és l'<strong>envolvent</strong> de totes les corbes de cost mitjà a curt termini corresponents als diferents grandàries de planta possibles. Cada punt de la CMeLT representa el cost mínim de produir cada nivell d'output, triant l'escala de planta òptima per a aquest nivell de producció.
                    </p>
                    <p>
                        La forma de la CMeLT depén dels <strong>rendiments a escala</strong>:
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Economies i deseconomies d'escala. Dimensió òptima" color="pink">
                    <p>
                        <strong>Economies d'escala</strong> (rendiments creixents a escala): en augmentar la producció, el CMe a llarg termini disminueix. Les causes inclouen: especialització del treball (Adam Smith, 1776), ús de tecnologia més eficient (maquinària de gran escala), poder de negociació amb proveïdors (descomptes per volum), repartiment de costos fixos indivisibles (I+D, publicitat, màrqueting), eficiències financeres (accés a finançament més barat).
                    </p>
                    <p>
                        <strong>Deseconomies d'escala</strong> (rendiments decreixents a escala): a partir de certa grandària, el CMe a llarg termini augmenta. Les causes inclouen: dificultats de coordinació i gestió (burocratització), problemes de comunicació interna, desmotivació dels treballadors, rigidesa organitzativa, pèrdua de flexibilitat davant canvis del mercat.
                    </p>
                    <p>
                        <strong>Rendiments constants a escala:</strong> el CMe a llarg termini roman constant en variar l'escala de producció.
                    </p>
                    <p>
                        La <strong>dimensió òptima</strong> (o escala mínima eficient, EME) és el nivell de producció a partir del qual l'empresa esgota les economies d'escala i aconsegueix el mínim de la seua CMeLT. L'EME varia enormement entre sectors: és molt gran en indústries com l'automoció, la siderúrgia o les telecomunicacions (la qual cosa explica la concentració empresarial en aquests sectors) i relativament xicoteta en l'hostaleria, el comerç minorista o els serveis professionals.
                    </p>
                </TheoryBlock>

                <div className="my-6 flex justify-center">

                <TheoryBlock title="2.6. La corba de costos totals a llarg termini (envolvent)" color="blue">
                    <p>
                        La <strong>corba de costos totals a llarg termini (CTLT)</strong> mostra el cost mínim total de produir cada nivell d'output quan l'empresa pot triar lliurement la seua escala de planta. La relació amb les corbes de curt termini és que la CTLT és tangent a cada corba de CTCT en exactament un punt, corresponent al nivell de producció per al qual aquesta escala de planta és l'òptima.
                    </p>
                    <p>
                        <strong>Jacob Viner</strong> (1931) va ser un dels primers a formalitzar la relació entre les corbes de costos a curt i llarg termini, encara que va cometre un cèlebre error en el seu primer article en demanar al seu dibuixant que la corba de CMeLT passara pels punts mínims de les corbes de CMeCT. En realitat, la CMeLT és tangent a les corbes de CMeCT, però només passa pel punt mínim de la corba de CMeCT que correspon a l'escala òptima a llarg termini (la que minimitza el CMeLT).
                    </p>
                    <p>
                        L'anàlisi de costos a llarg termini té implicacions directes per a la <strong>política de competència</strong>: en sectors amb economies d'escala molt importants (monopoli natural), una sola empresa pot produir a menor cost que diverses, la qual cosa planteja dilemes entre eficiència productiva i competència.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 3 */}
            <Card title="3. El benefici empresarial" icon="📘">
                <TheoryBlock title="3.1. Ingressos: ingrés total, mitjà i marginal" color="pink">
                    <p>
                        Per a analitzar el benefici empresarial cal comprendre primer l'estructura d'ingressos:
                    </p>
                    <p>
                        <strong>Ingrés total (IT):</strong> és l'import total que rep l'empresa per la venda de la seua producció. IT = P × Q, on P és el preu de venda i Q la quantitat venuda.
                    </p>
                    <p>
                        <strong>Ingrés mitjà (IMe):</strong> és l'ingrés per unitat venuda. IMe = IT / Q = P. L'ingrés mitjà coincideix amb el preu.
                    </p>
                    <p>
                        <strong>Ingrés marginal (IMg):</strong> és l'ingrés addicional que obté l'empresa per vendre una unitat més:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="IMg = ΔIT / ΔQ = dIT / dQ"
                    desc="En competència perfecta: IMg = P (constant). En monopoli: IMg < P (decreixent)"
                />

                <TheoryBlock title="3.2. Benefici: conceptes fonamentals" color="blue">
                    <p>
                        El <strong>benefici (B)</strong> es defineix com la diferència entre els ingressos totals i els costos totals:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="B = IT − CT = (P × Q) − CT = (P − CMe) × Q"
                    desc="Benefici total. També: B unitari = P − CMe"
                />

                <TheoryBlock color="blue">
                    <p>
                        Convé distingir dos conceptes de benefici:
                    </p>
                    <p>
                        <strong>Benefici comptable:</strong> IT − costos explícits (els que impliquen un desemborsament monetari: salaris, matèries primeres, lloguers).
                    </p>
                    <p>
                        <strong>Benefici econòmic:</strong> IT − costos explícits − costos implícits (el cost d'oportunitat dels recursos propis: el salari que l'empresari podria guanyar com a empleat, el rendiment que podria obtindre invertint el seu capital en una altra activitat). Quan el benefici econòmic és zero, l'empresa obté un <strong>benefici normal</strong>: cobreix tots els costos, incloent-hi el cost d'oportunitat, però no obté rendes extraordinàries. Un <strong>benefici econòmic positiu</strong> (benefici extraordinari o supranormal) indica que l'empresa obté rendiments superiors als que podria obtindre en la seua millor alternativa.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Condició de maximització del benefici: IMg = CMg" color="green">
                    <p>
                        La condició fonamental per a la <strong>maximització del benefici</strong> estableix que l'empresa ha de produir aquella quantitat en la qual l'ingrés marginal s'iguala al cost marginal:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="IMg = CMg"
                    desc="Condició de primer ordre per a la maximització del benefici"
                />

                <TheoryBlock color="green">
                    <p>
                        La intuïció és la següent: si IMg &gt; CMg, produir una unitat més genera més ingrés que cost, per la qual cosa el benefici augmenta; convé produir més. Si IMg &lt; CMg, produir una unitat més costa més del que genera; convé produir menys. El benefici es maximitza quan IMg = CMg. Com a condició de segon ordre, es requereix que la corba de CMg talle la d'IMg des de baix (CMg ha de ser creixent en el punt d'intersecció).
                    </p>
                    <p>
                        Aquesta regla és <strong>universal</strong>: s'aplica en totes les estructures de mercat (competència perfecta, monopoli, oligopoli, competència monopolística), encara que la forma de la corba d'IMg varia segons l'estructura. En competència perfecta, IMg = P (constant), per la qual cosa la condició es simplifica a P = CMg.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Llindar de rendibilitat / punt mort" color="amber">
                    <p>
                        El <strong>llindar de rendibilitat</strong> (o punt mort, o <em>break-even point</em>) és el nivell de producció a partir del qual l'empresa comença a obtindre beneficis. En el punt mort, els ingressos totals igualen els costos totals: IT = CT, i per tant B = 0.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Q* = CF / (P − CVu)"
                    desc="Q* = punt mort | CF = costos fixos | P = preu | CVu = cost variable unitari"
                />

                <TheoryBlock color="amber">
                    <p>
                        L'expressió (P − CVu) s'anomena <strong>marge de contribució unitari</strong>: és la part de cada euro de venda que contribueix a cobrir els costos fixos i generar benefici. Una vegada coberts els costos fixos (Q ≥ Q*), cada unitat addicional venuda aporta benefici en la quantia del marge de contribució.
                    </p>
                    <p>
                        L'anàlisi del punt mort és una ferramenta de gestió molt utilitzada en la pràctica empresarial per a avaluar la viabilitat de nous productes, calcular objectius de vendes i analitzar el palanquejament operatiu (grau en què l'estructura de costos fixos amplifica les variacions del benefici davant canvis en les vendes). És especialment rellevant en l'ensenyament d'Empresa i Disseny de Models de Negoci (2n Batxillerat).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. La decisió de produir o tancar a curt termini" color="pink">
                    <p>
                        A curt termini, una empresa que incorre en pèrdues (B &lt; 0) ha de decidir si continua produint o cessa temporalment la seua activitat. La regla de decisió és:
                    </p>
                    <p>
                        <strong>Si P ≥ CVMe (en el punt IMg = CMg):</strong> l'empresa ha de continuar produint, fins i tot amb pèrdues. La raó és que els ingressos cobreixen tots els costos variables i part dels costos fixos. Si tancara, les pèrdues serien majors (iguals als costos fixos totals). Produir minimitza les pèrdues.
                    </p>
                    <p>
                        <strong>Si P &lt; CVMe:</strong> l'empresa ha de tancar temporalment. No cobreix ni tan sols els costos variables, per la qual cosa cada unitat produïda incrementa les pèrdues. És preferible tancar i assumir les pèrdues derivades dels costos fixos (que s'incorren igualment).
                    </p>
                    <p>
                        <strong>El punt de tancament</strong> se situa en el mínim de la corba de CVMe: és el preu mínim al qual l'empresa està disposada a produir. La <strong>corba d'oferta a curt termini de l'empresa</strong> en competència perfecta coincideix amb la corba de CMg per damunt del mínim del CVMe.
                    </p>
                    <p>
                        A <strong>llarg termini</strong>, el criteri és més exigent: l'empresa només romandrà en el mercat si P ≥ CMe (cobreix tots els costos, inclosos els fixos convertits en variables). Si P &lt; CMe de forma persistent, l'empresa abandonarà el mercat.
                    </p>
                </TheoryBlock>
            </Card>

                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Competències clau" color="blue">
                    <p>
                        <strong>STEM:</strong> càlcul de costos, representació gràfica de corbes (CT, CMe, CMg), determinació algebraica del punt mort i la condició IMg = CMg. L'anàlisi de costos és un camp especialment adequat per a desenvolupar la competència matemàtica aplicada.
                    </p>
                    <p>
                        <strong>CE (Competència emprenedora):</strong> la comprensió de l'estructura de costos, el punt mort i les decisions de producció són ferramentes essencials per a l'emprenedoria. Permeten avaluar la viabilitat d'un projecte empresarial abans de llançar-lo.
                    </p>
                    <p>
                        <strong>CPSAA:</strong> la planificació financera, l'avaluació de riscos (què ocorre si les vendes no aconsegueixen el punt mort?) i la presa de decisions sota incertesa contribueixen al desenvolupament de l'autonomia i la responsabilitat personal.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Propostes didàctiques" color="green">
                    <p>
                        <strong>1. Simulació d'empresa:</strong> els alumnes creen una empresa fictícia, defineixen la seua estructura de costos (fixos i variables), calculen el punt mort i prenen decisions de producció a diferents preus de mercat.
                    </p>
                    <p>
                        <strong>2. Anàlisi de casos reals:</strong> estudiar l'estructura de costos d'empreses conegudes (una aerolínia low cost vs. una tradicional, un supermercat vs. una botiga gourmet) per a identificar economies d'escala, costos fixos i variables, i estratègies de preus.
                    </p>
                    <p>
                        <strong>3. Gràfiques interactives:</strong> utilitzar ferramentes digitals (GeoGebra, Desmos, Excel) per a representar les corbes de costos, moure paràmetres i observar com canvien el CMg, el CMe, el punt mort i el benefici.
                    </p>
                    <p>
                        <strong>4. Debat sobre la decisió de tancar:</strong> plantejar un escenari en el qual una empresa incorre en pèrdues i debatre si ha de continuar produint o tancar, aplicant el criteri P vs. CVMe. Connectar amb casos reals d'empreses en dificultats.
                    </p>
                </TheoryBlock>
            </Card>

                    </p>

                    </p>
                    <p>
                        Des de la perspectiva docent, els continguts d'aquest tema són essencials per a les matèries d'Economia i d'Empresa i Disseny de Models de Negoci, i permeten un tractament profundament competencial: el càlcul de costos i punts morts desenvolupa la competència STEM, la simulació de decisions empresarials fomenta la competència emprenedora, i el debat sobre la viabilitat i el tancament d'empreses contribueix a formar ciutadans amb criteri econòmic i capacitat de juí crític.

            {/* ── EPÍGRAF 1 ─────────────────────────────────────── */}
            <Card title="1. L'equilibri de mercat" icon="📘">
                <TheoryBlock title="1.1. Concepte d'equilibri (Marshall)" color="pink">
                    <p>
                        L'<strong>equilibri de mercat</strong> es defineix com aquella situació en la qual la <strong>quantitat demandada i la quantitat oferida coincideixen</strong> a un determinat preu, de manera que no existeixen pressions perquè el preu varie. En termes gràfics, l'equilibri es troba en el punt d'<strong>intersecció de les corbes d'oferta i demanda</strong>.
                    </p>
                    <p>
                        <strong>Alfred Marshall</strong> (1890) va formalitzar aquesta idea amb la seua famosa metàfora: «Podríem discutir raonadament sobre si és la fulla superior o la inferior d'unes tisores la que talla un tros de paper, com sobre si el valor ve determinat per la utilitat o pel cost de producció. És la interacció d'ambdues la que determina el preu». Aquesta concepció de l'equilibri com a resultat de la interacció simultània d'oferta i demanda és un dels pilars de l'economia moderna.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Preu i quantitat d'equilibri. Representació gràfica" color="blue">
                    <p>
                        El <strong>preu d'equilibri</strong> (P*) és aquell al qual la quantitat que els consumidors desitgen comprar coincideix exactament amb la quantitat que els productors desitgen vendre. La <strong>quantitat d'equilibri</strong> (Q*) és la quantitat intercanviada a aquest preu.
                    </p>
                    <p>
                        Matemàticament, l'equilibri s'obté igualant les funcions d'oferta i demanda. Si la demanda és Q<sub>d</sub> = a − b·P i l'oferta és Q<sub>s</sub> = c + d·P (amb a, b, c, d {'>'} 0), l'equilibri es determina resolent:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Qd(P*) = Qs(P*)  →  a − b·P* = c + d·P*  →  P* = (a − c) / (b + d)"
                    desc="Condició d'equilibri: quantitat demandada = quantitat oferida"
                />

                <TheoryBlock title="1.3. El procés d'ajust: excessos d'oferta i demanda" color="green">
                    <p>
                        Quan el mercat no es troba en equilibri, es produeixen forces que tendeixen a restaurar-lo:
                    </p>
                    <p>
                        <strong>Excés d'oferta</strong> (superàvit): si el preu és superior a P*, la quantitat oferida supera la demandada (Q<sub>s</sub> {'>'} Q<sub>d</sub>). Els venedors acumulen inventaris no desitjats i, per a desfer-se de l'excedent, competeixen baixant preus. El preu descendeix progressivament fins a aconseguir P*.
                    </p>
                    <p>
                        <strong>Excés de demanda</strong> (escassetat): si el preu és inferior a P*, la quantitat demandada supera l'oferida (Q<sub>d</sub> {'>'} Q<sub>s</sub>). Els compradors competeixen pel bé escàs, pressionant a l'alça el preu. El preu puja progressivament fins a aconseguir P*.
                    </p>
                    <p>
                        Aquest mecanisme d'ajust és automàtic i no requereix intervenció externa: és el que Adam Smith va denominar la <strong>«mà invisible»</strong>. El preu actua com a senyal i mecanisme de coordinació entre milions d'agents descentralitzats.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. Estabilitat de l'equilibri (Walras vs. Marshall)" color="amber">
                    <p>
                        No n'hi ha prou que existisca un equilibri: cal que siga <strong>estable</strong>, és a dir, que el mercat tendisca a tornar-hi després d'una pertorbació. Existeixen dos enfocaments clàssics:
                    </p>
                    <p>
                        <strong>Estabilitat walrasiana</strong> (Léon Walras, 1874): l'ajust es produeix a través dels <strong>preus</strong>. Si hi ha excés de demanda, el preu puja; si hi ha excés d'oferta, el preu baixa. L'equilibri és estable si la corba de demanda té major pendent (en valor absolut) que la d'oferta en el punt d'equilibri. Aquest és l'enfocament més habitual en la microeconomia moderna.
                    </p>
                    <p>
                        <strong>Estabilitat marshalliana</strong> (Alfred Marshall, 1890): l'ajust es produeix a través de les <strong>quantitats</strong>. Si el preu de demanda (el que els consumidors estan disposats a pagar) supera el preu d'oferta (el que els productors exigeixen), la producció augmenta, i viceversa. Aquest enfocament és més adequat per a mercats amb ajustos lents de producció (p. ex., agrícoles).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.5. Equilibri parcial vs. equilibri general (Walras, Arrow-Debreu)" color="violet">
                    <p>
                        L'anàlisi desenvolupada fins ací correspon a l'<strong>equilibri parcial</strong> (Marshall), que estudia un sol mercat aïllat, mantenint <em>ceteris paribus</em> les condicions en la resta de mercats. Aquest enfocament és enormement útil i és el dominant en l'ensenyament de la microeconomia bàsica.
                    </p>
                    <p>
                        No obstant això, els mercats estan interconnectats: un canvi en el mercat de la gasolina afecta el mercat d'automòbils, el de transport públic, el de pneumàtics, etc. L'<strong>equilibri general</strong> (Léon Walras, 1874) estudia la determinació simultània de preus i quantitats en <em>tots</em> els mercats de l'economia. Kenneth <strong>Arrow</strong> i Gérard <strong>Debreu</strong> (1954) van demostrar formalment l'existència d'un equilibri general competitiu sota condicions molt generals, un resultat que constitueix un dels assoliments intel·lectuals més importants de la ciència econòmica (i que els valdria el Premi Nobel d'Economia en 1972 i 1983, respectivament).
                    </p>
                    <p>
                        Per a les oposicions, n'hi ha prou amb conéixer la distinció i saber que l'anàlisi d'equilibri parcial és una simplificació que, no obstant això, resulta extraordinàriament poderosa per a comprendre el funcionament de mercats individuals.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAF 2 ─────────────────────────────────────── */}
            <Card title="2. Variacions de l'equilibri" icon="📘">
                <TheoryBlock title="2.1. Desplaçaments de la demanda: efectes sobre P i Q" color="pink">
                    <p>
                        Quan es produeix un <strong>augment de la demanda</strong> (desplaçament de la corba de demanda cap a la dreta) —per exemple, per un augment de la renda, un canvi de gustos favorable o un augment de la població—, el resultat és un <strong>increment tant del preu d'equilibri com de la quantitat d'equilibri</strong>. Al nou preu més alt, l'oferta s'estén (moviment al llarg de la corba d'oferta).
                    </p>
                    <p>
                        Simètricament, una <strong>disminució de la demanda</strong> (desplaçament cap a l'esquerra) provoca una <strong>reducció tant del preu com de la quantitat d'equilibri</strong>.
                    </p>
                    <p>
                        Regla mnemotècnica: <em>«Quan la demanda es desplaça, preu i quantitat es mouen en la mateixa direcció que el desplaçament»</em>. Si la demanda augmenta (→), P↑ i Q↑; si disminueix (←), P↓ i Q↓.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Desplaçaments de l'oferta: efectes sobre P i Q" color="blue">
                    <p>
                        Un <strong>augment de l'oferta</strong> (desplaçament cap a la dreta) —per exemple, per una millora tecnològica, una reducció dels costos de producció o l'entrada de noves empreses— produeix un <strong>descens del preu d'equilibri i un augment de la quantitat d'equilibri</strong>. Al nou preu més baix, la demanda s'estén.
                    </p>
                    <p>
                        Una <strong>disminució de l'oferta</strong> (desplaçament cap a l'esquerra) —per exemple, per un augment dels costos de les matèries primeres o una catàstrofe natural— provoca un <strong>augment del preu i una disminució de la quantitat d'equilibri</strong>.
                    </p>
                    <p>
                        Regla: <em>«Quan l'oferta es desplaça, preu i quantitat es mouen en direccions oposades»</em>. Si l'oferta augmenta (→), P↓ i Q↑; si disminueix (←), P↑ i Q↓.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Desplaçaments simultanis d'oferta i demanda" color="green">
                    <p>
                        Quan es desplacen <strong>simultàniament ambdues corbes</strong>, els efectes sobre el preu i la quantitat depenen de la magnitud relativa dels desplaçaments:
                    </p>
                    <p>
                        <strong>Cas 1:</strong> Augmenten ambdues (demanda i oferta). La quantitat d'equilibri augmenta amb certesa, però l'efecte sobre el preu és <strong>ambigu</strong>: depén de quin desplaçament siga major. Si l'augment de la demanda domina, P puja; si domina l'oferta, P baixa.
                    </p>
                    <p>
                        <strong>Cas 2:</strong> Disminueixen ambdues. La quantitat disminueix amb certesa, però l'efecte sobre el preu és ambigu.
                    </p>
                    <p>
                        <strong>Cas 3:</strong> La demanda augmenta i l'oferta disminueix (o viceversa). El preu varia amb certesa (puja si ambdós empenten a l'alça, baixa si empenten a la baixa), però l'efecte sobre la quantitat és ambigu.
                    </p>
                    <p>
                        Conclusió general: en desplaçaments simultanis, <strong>sempre hi ha una variable (P o Q) l'efecte de la qual és ambigu</strong> i depén de les magnituds relatives. Aquest resultat és fonamental per a l'estàtica comparativa.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Estàtica comparativa: anàlisi abans/després" color="amber">
                    <p>
                        L'<strong>estàtica comparativa</strong> és el mètode d'anàlisi que compara dues situacions d'equilibri: la inicial i la final, després d'un canvi en algun determinant de l'oferta o la demanda. No analitza el procés de transició (dinàmica), sinó que compara les <strong>fotografies</strong> de l'abans i el després.
                    </p>
                    <p>
                        Els passos de l'anàlisi d'estàtica comparativa són: (1) identificar quina corba es desplaça (oferta, demanda o ambdues); (2) determinar la direcció del desplaçament; (3) comparar el nou equilibri amb l'antic; (4) determinar els efectes sobre P* i Q*.
                    </p>
                    <p>
                        Aquest mètode, sistematitzat per <strong>Paul Samuelson</strong> (1947) en els seus <em>Fundamentos del análisis económico</em>, és la ferramenta fonamental de l'anàlisi microeconòmica aplicada i constitueix una competència essencial per a l'opositor: la capacitat de raonar de forma ordenada i rigorosa sobre els efectes de pertorbacions econòmiques.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAF 3 ─────────────────────────────────────── */}
            <Card title="3. L'excedent del consumidor i del productor" icon="📘">
                <TheoryBlock title="3.1. Excedent del consumidor (Marshall, Dupuit)" color="pink">
                    <p>
                        L'<strong>excedent del consumidor</strong> (EC) és la diferència entre el que els consumidors estarien <strong>disposats a pagar</strong> per un bé (mesurat per la corba de demanda) i el que efectivament paguen (el preu de mercat). Va ser conceptualitzat per l'enginyer francés <strong>Jules Dupuit</strong> (1844) i formalitzat per <strong>Alfred Marshall</strong> (1890).
                    </p>
                    <p>
                        Gràficament, l'excedent del consumidor és l'<strong>àrea del triangle</strong> comprés entre la corba de demanda, la línia del preu d'equilibri i l'eix vertical:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="EC = ½ × (Pmáx − P*) × Q*"
                    desc="On Pmàx és el preu màxim que algú estaria disposat a pagar (intercepte vertical de la demanda)"
                />

                <TheoryBlock title="3.2. Excedent del productor" color="blue">
                    <p>
                        L'<strong>excedent del productor</strong> (EP) és la diferència entre el preu de mercat que reben els productors i el <strong>preu mínim al qual estarien disposats a vendre</strong> (mesurat per la corba d'oferta, que reflecteix els costos marginals). És el guany addicional que obtenen per damunt de l'estrictament necessari per a produir.
                    </p>
                    <p>
                        Gràficament, és l'<strong>àrea del triangle</strong> entre la línia del preu d'equilibri, la corba d'oferta i l'eix vertical:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="EP = ½ × (P* − Pmín) × Q*"
                    desc="On Pmín és el preu mínim de l'oferta (intercepte de la corba d'oferta amb l'eix de preus)"
                />

                <div className="my-6 flex justify-center">
                    <svg viewBox="0 0 500 320" className="w-full max-w-lg" style={{fontFamily: 'Nunito, sans-serif'}}>
                        {/* Axes */}
                        <line x1="60" y1="20" x2="60" y2="280" stroke="#334155" strokeWidth="2" />
                        <line x1="60" y1="280" x2="470" y2="280" stroke="#334155" strokeWidth="2" />
                        <polygon points="60,20 55,30 65,30" fill="#334155" />
                        <polygon points="470,280 460,275 460,285" fill="#334155" />
                        <text x="35" y="25" fontSize="12" fill="#334155" fontWeight="600" textAnchor="middle">P</text>
                        <text x="460" y="300" fontSize="12" fill="#334155" fontWeight="600" textAnchor="end">Q</text>
                        {/* Consumer surplus triangle (upper) */}
                        <polygon points="60,40 60,150 300,150" fill="#fce7f3" opacity="0.6" />
                        {/* Producer surplus triangle (lower) */}
                        <polygon points="60,260 60,150 300,150" fill="#ffe4e6" opacity="0.6" />
                        {/* Demand curve (D) */}
                        <line x1="60" y1="40" x2="440" y2="260" stroke="#ec4899" strokeWidth="2.5" />
                        <text x="420" y="250" fontSize="13" fill="#ec4899" fontWeight="700">D</text>
                        {/* Supply curve (O) */}
                        <line x1="60" y1="260" x2="440" y2="40" stroke="#f43f5e" strokeWidth="2.5" />
                        <text x="420" y="50" fontSize="13" fill="#f43f5e" fontWeight="700">O</text>
                        {/* Equilibrium point E */}
                        <circle cx="300" cy="150" r="6" fill="#334155" stroke="white" strokeWidth="2" />
                        <text x="310" y="143" fontSize="13" fill="#334155" fontWeight="700">E</text>
                        {/* P* and Q* projections */}
                        <line x1="300" y1="150" x2="300" y2="280" stroke="#334155" strokeWidth="1" strokeDasharray="4,3" />
                        <line x1="300" y1="150" x2="60" y2="150" stroke="#334155" strokeWidth="1" strokeDasharray="4,3" />
                        <text x="300" y="296" fontSize="12" fill="#334155" fontWeight="700" textAnchor="middle">Q*</text>
                        <text x="48" y="154" fontSize="12" fill="#334155" fontWeight="700" textAnchor="end">P*</text>
                        {/* EC label */}
                        <text x="140" y="115" fontSize="13" fill="#be185d" fontWeight="700">EC</text>
                        <text x="120" y="132" fontSize="9.5" fill="#be185d" fontWeight="500">(Excedent del consumidor)</text>
                        {/* EP label */}
                        <text x="140" y="195" fontSize="13" fill="#e11d48" fontWeight="700">EP</text>
                        <text x="120" y="212" fontSize="9.5" fill="#e11d48" fontWeight="500">(Excedent del productor)</text>
                    </svg>
                </div>

                <TheoryBlock title="3.3. Excedent total i eficiència del mercat" color="green">
                    <p>
                        L'<strong>excedent total</strong> (ET) és la suma de l'excedent del consumidor i del productor: ET = EC + EP. Mesura el <strong>benestar total</strong> que la societat obté de l'existència del mercat.
                    </p>
                    <p>
                        Un resultat fonamental de la microeconomia és que l'<strong>equilibri competitiu maximitza l'excedent total</strong>. En el punt d'equilibri, s'intercanvien totes les unitats el valor de les quals per als consumidors (mesurat per la corba de demanda) supera el seu cost de producció (mesurat per la corba d'oferta), i cap unitat el cost de la qual supere el seu valor. No és possible millorar la situació de cap agent sense empitjorar la d'un altre: el resultat és <strong>eficient en el sentit de Pareto</strong>.
                    </p>
                    <p>
                        Aquest resultat constitueix la base del <strong>primer teorema fonamental del benestar</strong> (Arrow i Debreu, 1954): tot equilibri competitiu és eficient en el sentit de Pareto.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. La pèrdua irrecuperable d'eficiència (deadweight loss)" color="amber">
                    <p>
                        Quan el mercat no opera en el punt d'equilibri competitiu —ja siga per intervenció de l'Estat, poder de mercat o altres distorsions—, es produeix una <strong>pèrdua irrecuperable d'eficiència</strong> (PIE), també anomenada <em>deadweight loss</em> o «pes mort». És la <strong>reducció de l'excedent total</strong> respecte al màxim assolible en competència perfecta.
                    </p>
                    <p>
                        Gràficament, la PIE es representa com un <strong>triangle</strong> entre les corbes d'oferta i demanda, en la zona on s'han deixat de realitzar intercanvis mútuament beneficiosos. Aquest concepte és crucial per a avaluar el cost de les intervencions públiques i de les imperfeccions del mercat.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 4 ─────────────────────────────────────── */}
            <Card title="4. Intervencions de l'Estat en el mercat" icon="📘">
                <TheoryBlock title="4.1. Preus màxims: efectes, escassetat i mercat negre" color="pink">
                    <p>
                        Un <strong>preu màxim</strong> (o sostre de preu) és un límit legal per damunt del qual no es pot vendre un bé. Només té efecte si es fixa <strong>per davall del preu d'equilibri</strong> (si es fixara per damunt, el mercat simplement operaria en equilibri i el preu màxim seria irrellevant).
                    </p>
                    <p>
                        <strong>Efectes:</strong> a un preu inferior al d'equilibri, la quantitat demandada excedeix l'oferida, generant un <strong>excés de demanda</strong> (escassetat). Conseqüències: (1) necessitat de mecanismes de <strong>racionament</strong> no basats en preus (cues, cupons, favoritismes); (2) aparició de <strong>mercats negres</strong> on el bé es ven a preus superiors al màxim legal; (3) <strong>pèrdua irrecuperable d'eficiència</strong> (triangle de pes mort); (4) deteriorament de la qualitat del bé o servei.
                    </p>
                    <p>
                        <strong>Exemple clàssic:</strong> el <strong>control de lloguers</strong>. A curt termini pot beneficiar els inquilins actuals, però a llarg termini redueix l'oferta d'habitatges en lloguer, deteriora el manteniment dels immobles i crea llistes d'espera. <strong>Assar Lindbeck</strong> (1972) va afirmar que «el control de lloguers és la forma més eficient de destruir una ciutat, després del bombardeig». <strong>Paul Krugman</strong> (2000) l'utilitza com a exemple paradigmàtic dels efectes no desitjats dels preus màxims.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Preus mínims: efectes i excedents" color="blue">
                    <p>
                        Un <strong>preu mínim</strong> (o sòl de preu) és un límit legal per davall del qual no es pot vendre un bé. Només té efecte si es fixa <strong>per damunt del preu d'equilibri</strong>.
                    </p>
                    <p>
                        <strong>Efectes:</strong> a un preu superior al d'equilibri, la quantitat oferida excedeix la demandada, generant un <strong>excés d'oferta</strong> (excedents). Conseqüències: (1) acumulació d'estocs no venuts; (2) possible necessitat que l'Estat compre els excedents; (3) pèrdua irrecuperable d'eficiència; (4) incentiu a produir més del socialment òptim.
                    </p>
                    <p>
                        <strong>Exemple 1: Salari mínim.</strong> Analitzat com a preu mínim del factor treball: si es fixa per damunt del salari d'equilibri, genera excés d'oferta de treball (desocupació). No obstant això, el debat és més complex: en mercats amb poder de monopsoni (un sol demandant de treball), un salari mínim moderat pot fins i tot <em>augmentar</em> l'ocupació (Card i Krueger, 1994). Aquest matís és important per a demostrar sofisticació analítica.
                    </p>
                    <p>
                        <strong>Exemple 2: Política Agrària Comuna (PAC).</strong> La UE va fixar històricament preus mínims garantits per a productes agrícoles (cereals, llet, mantega), la qual cosa va generar els famosos «llacs de llet» i «muntanyes de mantega» (excedents emmagatzemats). Les reformes successives (MacSharry 1992, Agenda 2000, Fischer 2003) han anat substituint els preus d'intervenció per pagaments directes als agricultors.
                    </p>
