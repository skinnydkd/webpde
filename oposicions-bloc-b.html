            {/* ── 2. MEDICIÓN DE LA DESIGUALDAD ──────────────────── */}
            <Card title="2. Medición de la desigualdad" icon="📘">
                <TheoryBlock title="2.1. Curva de Lorenz" color="amber">
                    <p>
                        La <strong>curva de Lorenz (1905)</strong> es la representación gráfica fundamental de la desigualdad. En el eje horizontal se ordena a la población de menor a mayor renta (en porcentaje acumulado), y en el eje vertical se representa el porcentaje acumulado de renta que posee cada porcentaje de la población.
                    </p>
                    <p>
                        La <strong>diagonal de equidistribución</strong> (línea de 45°) representa la igualdad perfecta: cada X% de la población posee exactamente el X% de la renta. Cuanto más se aleja la curva de Lorenz de la diagonal, mayor es la desigualdad. Si toda la renta la concentra un solo individuo, la curva de Lorenz coincide con los ejes.
                    </p>
                    <p>
                        La curva de Lorenz permite <strong>comparar distribuciones</strong>: si la curva A está siempre más cerca de la diagonal que la curva B, la distribución A es inequívocamente más igualitaria (dominancia de Lorenz). Si las curvas se cruzan, la comparación requiere un índice de resumen.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Índice de Gini" color="pink">
                    <p>
                        El <strong>índice de Gini (1912)</strong> es el indicador de desigualdad más utilizado internacionalmente. Se calcula como la <strong>ratio entre el área A</strong> (entre la diagonal y la curva de Lorenz) y el <strong>área total del triángulo</strong> bajo la diagonal (A + B).
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Gini = 0</strong>: igualdad perfecta (todos tienen la misma renta).</li>
                        <li><strong>Gini = 1</strong>: desigualdad máxima (un individuo acapara toda la renta).</li>
                    </ul>
                    <p>
                        Valores de referencia: países nórdicos ≈ 0,25-0,28; España ≈ 0,33; EE.UU. ≈ 0,39; Brasil ≈ 0,48; Sudáfrica ≈ 0,63. El índice de Gini es sensible a cambios en la zona media de la distribución, pero menos sensible a los extremos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Otros indicadores de desigualdad" color="violet">
                    <p>Además del Gini, existen otros indicadores relevantes:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Ratio S80/S20</strong> (o P90/P10): cociente entre la renta del 20% (o 10%) más rico y el 20% (o 10%) más pobre. España ≈ 6,0 (2022, Eurostat). Intuitivo pero insensible a la distribución dentro de cada grupo.</li>
                        <li><strong>Índice de Palma</strong>: ratio entre la renta del 10% más rico y el 40% más pobre. Capta la concentración en los extremos mejor que el Gini.</li>
                        <li><strong>Índice de Atkinson</strong>: incorpora un parámetro de <strong>aversión a la desigualdad</strong> (ε), permitiendo ponderar más los cambios en la parte baja de la distribución.</li>
                        <li><strong>Participación del 1% superior</strong>: popularizado por <strong>Piketty y Saez</strong> mediante datos fiscales. Muestra la concentración extrema en la cúspide.</li>
                    </ul>
                </TheoryBlock>

                <FormulaBox formula="Gini = A / (A + B), donde A = área entre la curva de Lorenz y la diagonal" />
                <FormulaBox formula="Ratio S80/S20 = Renta del 20% más rico / Renta del 20% más pobre" />
            </Card>

            <Card title="3. Causas de la desigualdad" icon="📘">

                        <li><strong>Globalización</strong>: el teorema de Stolper-Samuelson predice que el comercio internacional beneficia al factor abundante y perjudica al escaso. En países desarrollados, la globalización presiona a la baja los salarios del trabajo no cualificado.</li>
                        <li><strong>Poder de mercado</strong>: la concentración empresarial y la fijación de rentas monopolísticas benefician a los propietarios de capital frente a los trabajadores.</li>

                        <li><strong>Discriminación</strong>: diferencias salariales por género, raza u origen que no se explican por productividad. La brecha salarial de género en España ≈ 12% (ajustada) según INE.</li>
                        <li><strong>Acceso a la educación</strong>: las desigualdades en el sistema educativo (segregación escolar, calidad diferencial) reproducen y amplifican las desigualdades de origen.</li>

                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.3. Tendencias recientes" color="green">
                    <p>
                        <strong>Thomas Piketty (2014)</strong>, en <em>El capital en el siglo XXI</em>, formula la <strong>ley fundamental r {'>'} g</strong>: cuando la tasa de rendimiento del capital (r) supera la tasa de crecimiento económico (g), la riqueza se concentra progresivamente, ya que los ricos acumulan patrimonio más rápido de lo que crece la economía. Propone un impuesto global sobre el patrimonio.
                    </p>
                    <p>
                        <strong>Branko Milanovic (2016)</strong> identifica la <strong>«curva del elefante»</strong> de la desigualdad global (1988-2008): los grandes ganadores de la globalización han sido las clases medias de Asia (especialmente China) y el 1% más rico del mundo; los grandes perdedores, las clases medias y trabajadoras de los países desarrollados.
                    </p>
                    <p>

                    </p>

            {/* ── 4. LA POBREZA ──────────────────────────────────── */}
            <Card title="4. La pobreza" icon="📘">
                <TheoryBlock title="4.1. Concepto y medición" color="red">
                    <p>La pobreza se puede medir desde tres perspectivas complementarias:</p>
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Pobreza absoluta</strong>: incapacidad de satisfacer las necesidades básicas. El <strong>Banco Mundial</strong> fija la línea internacional en <strong>$2,15/día PPP</strong> (2022, revisada). A nivel mundial, la pobreza extrema se ha reducido del 36% (1990) al 9% (2019), aunque la pandemia revirtió parcialmente esta tendencia.</li>
                        <li><strong>Pobreza relativa</strong>: situación de quienes viven con ingresos significativamente inferiores a la media o mediana de su sociedad. <strong>Eurostat</strong> define la línea de pobreza relativa en el <strong>60% de la mediana de la renta disponible equivalente</strong> del país.</li>
                        <li><strong>Pobreza multidimensional</strong>: el <strong>Índice de Pobreza Multidimensional (IPM)</strong> del PNUD (metodología <strong>Alkire-Foster</strong>) considera privaciones en tres dimensiones: salud, educación y nivel de vida, con 10 indicadores. Captura carencias que la renta monetaria no refleja.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.2. La pobreza en España" color="amber">
                    <p>Indicadores clave (datos aproximados, INE/Eurostat 2022-2023):</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Tasa AROPE</strong> (At Risk Of Poverty or Social Exclusion): ≈ 26%, una de las más altas de la UE.</li>
                        <li><strong>Pobreza infantil</strong>: ≈ 28%, especialmente grave y con efectos a largo plazo sobre el capital humano.</li>
                        <li><strong>Trabajadores pobres</strong> (<em>in-work poverty</em>): ≈ 12%, reflejo de la temporalidad, la parcialidad involuntaria y los bajos salarios.</li>
                        <li><strong>Brecha territorial</strong>: diferencias significativas entre CCAA (Extremadura, Andalucía vs País Vasco, Navarra).</li>
                        <li><strong>Privación material severa</strong>: ≈ 7%, incluye incapacidad para afrontar gastos imprevistos, calefacción, proteínas.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.3. Trampas de pobreza" color="cyan">
                    <p>
                        Las <strong>trampas de pobreza</strong> son situaciones en las que los individuos, hogares o países quedan atrapados en un <strong>círculo vicioso</strong> del que es difícil escapar sin intervención externa.
                    </p>
                    <p>
                        <strong>Ragnar Nurkse (1953)</strong> formuló el <strong>«círculo vicioso de la pobreza»</strong>: baja renta → bajo ahorro → baja inversión → baja productividad → baja renta. Este modelo se aplica tanto a nivel individual como a nivel de países en desarrollo.
                    </p>
                    <p>Mecanismos específicos:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Trampa fiscal</strong>: tipos marginales efectivos muy altos al pasar de prestaciones a empleo desincentivan la búsqueda de trabajo.</li>
                        <li><strong>Trampa de capital humano</strong>: familias pobres no pueden invertir en educación → sus hijos obtienen empleos peor remunerados.</li>
                        <li><strong>Transmisión intergeneracional</strong>: la pobreza se hereda a través de la nutrición, la salud, el entorno educativo y las redes sociales.</li>
                    </ul>
                </TheoryBlock>
            </Card>

            {/* ── 5. POLÍTICAS REDISTRIBUTIVAS ───────────────────── */}
            <Card title="5. Políticas redistributivas" icon="📘">
                <TheoryBlock title="5.1. Política fiscal progresiva" color="purple">
                    <p>
                        El sistema fiscal es el principal instrumento redistributivo. La <strong>progresividad</strong> implica que quienes más renta obtienen contribuyen proporcionalmente más:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>IRPF progresivo</strong>: tipos marginales crecientes. En España: 19%-47% (tramos estatales, 2024). Mínimos personales y familiares exentos.</li>
                        <li><strong>Impuesto sobre el patrimonio</strong>: grava la riqueza acumulada. Debate sobre su eficacia (fuga de capitales, elusión) vs equidad.</li>
                        <li><strong>Impuesto sobre sucesiones y donaciones</strong>: grava la transmisión intergeneracional de riqueza. Muy desigual entre CCAA en España.</li>
                    </ul>
                    <p>
                        Limitaciones: la evasión y elusión fiscal reducen la capacidad redistributiva efectiva. Los impuestos indirectos (IVA) son regresivos, ya que pesan más sobre las rentas bajas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Transferencias y gasto social" color="blue">
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Prestaciones por desempleo</strong>: contributivas (proporcionales al salario previo) y asistenciales (subsidio, renta activa de inserción).</li>
                        <li><strong>Pensiones públicas</strong>: sistema de reparto en España. Principal partida de gasto social y principal instrumento contra la pobreza en la vejez.</li>
                        <li><strong>Ingreso Mínimo Vital (IMV)</strong>: prestación no contributiva desde 2020 para garantizar un nivel mínimo de renta a hogares vulnerables.</li>
                        <li><strong>Becas y ayudas a la educación</strong>: promueven la igualdad de oportunidades reduciendo barreras económicas al acceso educativo.</li>
                        <li><strong>Ayudas a la vivienda</strong>: bonos alquiler, vivienda social, desgravaciones fiscales.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="5.3. Políticas de igualdad de oportunidades" color="green">
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Educación pública universal</strong>: iguala el punto de partida; la calidad del sistema educativo es clave para la movilidad social.</li>
                        <li><strong>Sanidad universal</strong>: acceso igualitario a la salud, independiente de la renta. La salud es un determinante fundamental de la productividad.</li>
                        <li><strong>Políticas activas de empleo</strong>: formación, intermediación, incentivos a la contratación de colectivos vulnerables.</li>
                        <li><strong>Políticas de igualdad de género</strong>: permisos de paternidad, cuotas, transparencia salarial.</li>
                        <li><strong>Atención a la primera infancia</strong>: educación 0-3 años, factor clave para romper la transmisión intergeneracional de la pobreza (Heckman).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="5.4. El debate eficiencia-equidad" color="amber">
                    <p>
                        <strong>Arthur Okun (1975)</strong> formuló la metáfora del <strong>«cubo con fugas»</strong> (<em>leaky bucket</em>): redistribuir renta implica costes de eficiencia (desincentivos al trabajo y al ahorro, costes administrativos), de modo que una parte de la renta se «pierde» en la transferencia. La cuestión es cuánta «fuga» es aceptable para reducir la desigualdad.
                    </p>
                    <p>Principales enfoques filosóficos sobre justicia distributiva:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Utilitarismo</strong> (Bentham, Mill): maximizar la utilidad total. Con utilidad marginal decreciente, la redistribución aumenta el bienestar agregado.</li>
                        <li><strong>Rawls (1971)</strong>: principio <strong>maximin</strong> — las desigualdades solo se justifican si benefician al miembro más desfavorecido de la sociedad (velo de ignorancia).</li>
                        <li><strong>Amartya Sen (1999)</strong>: enfoque de <strong>capacidades</strong> — la igualdad relevante no es de renta sino de libertades y oportunidades reales para vivir una vida digna (Nobel 1998).</li>
                        <li><strong>Nozick (1974)</strong>: libertarismo — la justicia está en el procedimiento (adquisición y transferencia legítimas), no en el resultado distributivo.</li>
                    </ul>
                    <p>
                        El debate contemporáneo apunta a que la relación eficiencia-equidad no es necesariamente un trade-off simple: las políticas que promueven la igualdad de oportunidades (educación, salud) pueden mejorar simultáneamente la eficiencia y la equidad (FMI, 2014; OCDE).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Relevancia curricular" icon="📘">

                    </ul>
                    <p>
                        El tema permite al alumnado desarrollar un <strong>pensamiento crítico</strong> sobre la distribución de los recursos, comprender las herramientas de medición de la desigualdad y evaluar las políticas redistributivas desde diferentes perspectivas éticas y económicas.

            {/* ── CONCLUSIÓN ─────────────────────────────────────── */}
            <Card title="Conclusión" icon="📌">

                    <p>
                        A lo largo de este tema se ha analizado una de las cuestiones más relevantes y debatidas de la ciencia económica: cómo se distribuye la renta, por qué existen desigualdades y qué puede hacerse para reducirlas.
                    </p>
                    <p>

                    </p>
                    <p>
                        Finalmente, se han evaluado las <strong>políticas redistributivas</strong> (fiscalidad progresiva, transferencias, igualdad de oportunidades) y el <strong>debate eficiencia-equidad</strong> (Okun, Rawls, Sen, Nozick). El tema es de máxima relevancia docente: conecta la teoría económica con los grandes debates sociales de nuestro tiempo.
                    </p>

                            <li>Otros: ratio S80/S20 (España ≈ 6,0), Palma, Atkinson, participación del 1% (Piketty).</li>
