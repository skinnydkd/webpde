    const Tema15Complet = () => (
        <div className="space-y-6 animate-fade">
            {/* ── INTRODUCCIÓN ────────────────────────────────────── */}
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        El <strong>monopolio</strong> constituye la estructura de mercado diametralmente opuesta a la competencia perfecta: frente a la atomización y la ausencia de poder de mercado, el monopolio presenta un <strong>único vendedor</strong> que controla toda la oferta de un bien sin sustitutivos cercanos. Este extremo del espectro competitivo permite analizar las consecuencias de la concentración máxima del poder de mercado sobre los precios, las cantidades, la eficiencia y el bienestar social.
                    </p>
                    <p>
                        La teoría del monopolio es un pilar esencial de la microeconomía porque ilustra de forma nítida cómo la ausencia de competencia genera <strong>ineficiencia asignativa</strong> (P {'>'} CMg), <strong>pérdida irrecuperable de bienestar</strong> (triángulo de Harberger) y potencial <strong>búsqueda de rentas</strong> (Tullock, Krueger). Al mismo tiempo, abre el debate sobre si el monopolio puede, en determinadas circunstancias, favorecer la innovación (Schumpeter, 1942).
                    </p>
                    <p>
                        Desde la perspectiva curricular, este tema se enmarca en los saberes básicos del bloque «Funcionamiento del mercado» de Economía de 1.º de Bachillerato (Real Decreto 243/2022), conectando con las competencias específicas CE1 (funcionamiento del sistema económico), CE3 (análisis de las estructuras de mercado) y CE6 (valoración de los fallos del mercado y la regulación). La LOMLOE subraya la importancia de que el alumnado comprenda las limitaciones del mercado y la necesidad de la intervención pública, desarrollando las competencias STEM (modelización), CC (equidad y bienestar) y CE (entorno competitivo).
                    </p>
                    <p>
                        El tema se estructura en seis epígrafes: concepto y fuentes de poder de monopolio; decisión de producción del monopolista; efectos sobre el bienestar; discriminación de precios; regulación del monopolio; y relevancia curricular.
                    </p>
                </div>
            </Card>

            {/* ── EPÍGRAFE 1 ─────────────────────────────────────── */}
            <Card title="1. Concepto y fuentes de poder de monopolio" icon="📘">
                <TheoryBlock title="1.1. Definición de monopolio" color="purple">
                    <p>
                        Un <strong>monopolio</strong> es una estructura de mercado en la que existe un <strong>único vendedor</strong> que ofrece un bien o servicio para el cual <strong>no existen sustitutivos cercanos</strong>. El monopolista posee, por tanto, <strong>poder de fijación de precios</strong>: puede elegir el precio o la cantidad que maximiza su beneficio, pero no ambos simultáneamente, ya que está sujeto a la restricción de la curva de demanda del mercado.
                    </p>
                    <p>
                        A diferencia de la empresa competitiva, que es precio-aceptante y se enfrenta a una demanda horizontal, el monopolista se enfrenta a toda la <strong>curva de demanda del mercado</strong>, que tiene pendiente negativa. Por ello, para vender una unidad adicional debe reducir el precio no solo de esa unidad, sino de <em>todas</em> las unidades que vende, lo que hace que su ingreso marginal sea inferior al precio (IMg {'<'} P).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Barreras de entrada" color="blue">
                    <p>
                        La condición necesaria para la existencia y el mantenimiento de un monopolio es la presencia de <strong>barreras de entrada</strong> que impiden o disuaden la entrada de competidores potenciales. Las principales categorías son:
                    </p>
                    <p>
                        <strong>1. Barreras legales:</strong> patentes (que otorgan exclusividad temporal sobre una invención), licencias y concesiones administrativas, franquicias estatales (como el monopolio postal en ciertos países) y derechos de autor. Estas barreras son creadas deliberadamente por el Estado para proteger la innovación o garantizar un servicio público.
                    </p>
                    <p>
                        <strong>2. Barreras naturales:</strong> surgen cuando la tecnología de producción presenta <strong>economías de escala</strong> tan pronunciadas que un solo productor puede abastecer a todo el mercado a un coste inferior al que tendrían dos o más empresas. Esta es la base del <strong>monopolio natural</strong>, caracterizado por la <strong>subaditividad de costes</strong>: C(Q) {'<'} C(Q₁) + C(Q₂) + … para toda partición de la producción. Ejemplos: distribución de agua, gas, red eléctrica, infraestructuras ferroviarias.
                    </p>
                    <p>
                        <strong>3. Control de recursos esenciales:</strong> cuando una empresa posee o controla en exclusiva un recurso indispensable para la producción. Ejemplo clásico: De Beers y el mercado de diamantes (históricamente).
                    </p>
                    <p>
                        <strong>4. Barreras tecnológicas y estratégicas:</strong> ventajas derivadas de la curva de aprendizaje, inversiones hundidas (<em>sunk costs</em>), efectos de red (cuantos más usuarios, más valioso el servicio: plataformas digitales), o comportamiento estratégico del monopolista (precios predatorios, exceso de capacidad) para disuadir la entrada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Tipos de monopolio" color="green">
                    <p>
                        <strong>Monopolio natural:</strong> una sola empresa produce a menor coste que varias. Subaditividad de costes, costes medios decrecientes en el rango relevante de producción. Justifica la regulación pública en lugar de la fragmentación.
                    </p>
                    <p>
                        <strong>Monopolio legal:</strong> creado por normativa estatal. Patentes (temporales, incentivan la innovación), concesiones, monopolios fiscales (tabaco, loterías en algunos países).
                    </p>
                    <p>
                        <strong>Monopolio de recurso:</strong> basado en el control exclusivo de un factor de producción esencial.
                    </p>
                    <p>
                        <strong>Monopolio tecnológico:</strong> derivado de una innovación disruptiva que sitúa a la empresa en posición dominante hasta que surgen imitadores o alternativas.
                    </p>
                    <p>
                        <strong>Monopolio bilateral:</strong> situación en la que un único vendedor se enfrenta a un único comprador (monopsonio). El resultado depende del poder de negociación relativo.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 2 ─────────────────────────────────────── */}
            <Card title="2. La decisión de producción del monopolista" icon="📘">
                <TheoryBlock title="2.1. La demanda del monopolista" color="amber">
                    <p>
                        A diferencia de la empresa competitiva, el monopolista se enfrenta a la <strong>curva de demanda del mercado</strong> con pendiente negativa. Esto implica que, para vender una unidad más, debe <strong>reducir el precio</strong> de todas las unidades vendidas. Como consecuencia directa, el <strong>ingreso marginal</strong> (IMg) es siempre inferior al precio (IMg {'<'} P) excepto para la primera unidad.
                    </p>
                    <p>
                        Gráficamente, si la demanda es lineal (P = a − bQ), la curva de IMg tiene la <strong>misma ordenada en el origen</strong> pero el <strong>doble de pendiente</strong> (IMg = a − 2bQ), y corta el eje de cantidades en la mitad del punto donde lo hace la demanda.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Ingreso marginal y elasticidad" color="pink">
                    <p>
                        La relación entre ingreso marginal y elasticidad-precio de la demanda (Ep) viene dada por la expresión fundamental:
                    </p>
                    <p>
                        <strong>IMg = P(1 + 1/Ep)</strong>
                    </p>
                    <p>
                        Dado que Ep {'<'} 0, el IMg es siempre inferior al precio. Además, esta fórmula revela que el monopolista <strong>opera siempre en el tramo elástico</strong> de la demanda (|Ep| {'>'} 1), porque en el tramo inelástico el IMg sería negativo, lo que significaría que aumentar la producción reduciría el ingreso total.
                    </p>
                    <p>
                        En el punto de elasticidad unitaria (|Ep| = 1), el IMg = 0 y el ingreso total alcanza su máximo. Para demanda lineal, esto ocurre exactamente en el punto medio de la curva de demanda.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Maximización de beneficios" color="violet">
                    <p>
                        El monopolista maximiza beneficios donde <strong>IMg = CMg</strong>, la misma condición general que para cualquier empresa. Sin embargo, la diferencia fundamental con la competencia perfecta es que <strong>P {'>'} IMg = CMg</strong>, es decir, el monopolista cobra un precio superior al coste marginal.
                    </p>
                    <p>
                        El proceso de determinación del equilibrio del monopolista es: (1) encontrar la cantidad Qm donde IMg = CMg; (2) proyectar Qm sobre la curva de demanda para obtener el precio Pm que los consumidores están dispuestos a pagar por esa cantidad; (3) el beneficio por unidad es Pm − CMe(Qm) y el beneficio total es [Pm − CMe(Qm)] × Qm.
                    </p>
                    <p>
                        Una diferencia esencial: el monopolista <strong>no tiene curva de oferta</strong> en el sentido convencional, porque no hay una relación unívoca entre precio y cantidad ofrecida. Un mismo precio puede corresponderse con diferentes cantidades dependiendo de la forma de la curva de demanda.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="IMg = P(1 + 1/Ep)" desc="Relación ingreso marginal-elasticidad" />
                <FormulaBox formula="Maximización: IMg = CMg → Qm, luego Pm sobre la curva de demanda" desc="Equilibrio del monopolista" />
            </Card>

            {/* ── EPÍGRAFE 3 ─────────────────────────────────────── */}
            <Card title="3. Efectos sobre el bienestar" icon="📘">
                <TheoryBlock title="3.1. Comparación con competencia perfecta" color="red">
                    <p>
                        La comparación del equilibrio del monopolio con el de competencia perfecta revela tres resultados fundamentales:
                    </p>
                    <p>
                        <strong>1. Precio más alto:</strong> Pm {'>'} Pc. El monopolista cobra un precio superior al que prevalecería en competencia perfecta (donde P = CMg).
                    </p>
                    <p>
                        <strong>2. Cantidad menor:</strong> Qm {'<'} Qc. El monopolista restringe la producción por debajo del nivel socialmente óptimo para elevar el precio.
                    </p>
                    <p>
                        <strong>3. Menor excedente total:</strong> aunque el monopolista captura parte del excedente del consumidor (que se transforma en beneficio del monopolista), hay una parte del excedente que simplemente se pierde — la pérdida irrecuperable de eficiencia.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Pérdida irrecuperable de eficiencia" color="cyan">
                    <p>
                        El <strong>triángulo de Harberger</strong> (1954) mide la pérdida neta de bienestar social causada por el monopolio. Representa las transacciones mutuamente beneficiosas que no se realizan porque el monopolista restringe la producción. Es el área del triángulo formado entre la curva de demanda, la curva de CMg y las cantidades Qm y Qc.
                    </p>
                    <p>
                        <strong>Ineficiencia asignativa:</strong> P {'>'} CMg implica que la sociedad valora las unidades adicionales (entre Qm y Qc) más de lo que cuesta producirlas, pero no se producen. No se alcanza la cantidad socialmente óptima.
                    </p>
                    <p>
                        <strong>Ineficiencia productiva:</strong> al no enfrentarse a la presión competitiva, el monopolista puede no minimizar costes. Leibenstein (1966) denominó a esto <strong>ineficiencia-X</strong>: la empresa monopolista, al carecer de la disciplina del mercado, incurre en ineficiencias organizativas, exceso de personal, falta de incentivos para la reducción de costes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Búsqueda de rentas" color="emerald">
                    <p>
                        <strong>Tullock (1967)</strong> y <strong>Krueger (1974)</strong> argumentaron que la pérdida social del monopolio es mayor que el triángulo de Harberger, porque las empresas dedican recursos productivos a <strong>obtener y mantener</strong> su posición monopolista: lobby, litigios, campañas para conseguir licencias exclusivas, influencia regulatoria.
                    </p>
                    <p>
                        Estos recursos (<em>rent-seeking</em>) son un coste social puro porque no crean valor: simplemente redistribuyen renta a favor del monopolista. En el caso extremo, la empresa puede gastar en <em>rent-seeking</em> hasta un monto igual al beneficio monopolístico esperado, lo que convierte <em>todo</em> el beneficio del monopolio en pérdida social.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Monopolio e innovación" color="purple">
                    <p>
                        <strong>Schumpeter (1942)</strong> defendió que las grandes empresas con poder de mercado son las que más innovan, porque pueden financiar la I+D con sus beneficios extraordinarios y tienen incentivos para mantener su ventaja competitiva mediante la <strong>destrucción creativa</strong>: la innovación constante que hace obsoletos los productos existentes.
                    </p>
                    <p>
                        <strong>Arrow (1962)</strong> contraargumentó que una empresa en competencia tiene <em>más</em> incentivos para innovar que un monopolista, porque obtiene más ganancia incremental al pasar de beneficio cero a beneficio positivo que el monopolista al reemplazar su propio producto (<em>efecto de reemplazo</em>).
                    </p>
                    <p>
                        <strong>Baumol (1982)</strong> introdujo la teoría de los <strong>mercados contestables</strong> (<em>contestable markets</em>): incluso un monopolista se ve obligado a comportarse de forma competitiva si la entrada y salida son libres y sin costes hundidos, ya que la amenaza de entrada de competidores (<em>hit-and-run entry</em>) disciplina su comportamiento. La contestabilidad depende de la ausencia de costes hundidos, no del número de empresas.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="Índice de Lerner: L = (P − CMg) / P = −1/Ep" desc="Mide el poder de mercado: L = 0 (comp. perfecta), L → 1 (máximo poder)" />
            </Card>

            {/* ── EPÍGRAFE 4 ─────────────────────────────────────── */}
            <Card title="4. Discriminación de precios" icon="📘">
                <TheoryBlock title="4.1. Concepto y condiciones" color="blue">
                    <p>
                        La <strong>discriminación de precios</strong> consiste en cobrar precios diferentes a distintos consumidores (o por distintas unidades) por el mismo bien, sin que la diferencia de precio se justifique por diferencias de coste. Para que sea posible se requieren tres condiciones:
                    </p>
                    <p>
                        <strong>1. Poder de mercado:</strong> la empresa debe poder fijar precios (no ser precio-aceptante).
                    </p>
                    <p>
                        <strong>2. Capacidad de segmentación:</strong> la empresa debe poder identificar grupos con diferente elasticidad-precio de la demanda o, al menos, ofrecer versiones diferenciadas del producto.
                    </p>
                    <p>
                        <strong>3. Imposibilidad de reventa (no arbitraje):</strong> los consumidores que compran a precio bajo no pueden revender a quienes pagarían un precio alto. Esto es más fácil en servicios (corte de pelo, vuelos, electricidad) que en bienes físicos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Tipos de discriminación" color="green">
                    <p>
                        <strong>Discriminación de primer grado (perfecta):</strong> el monopolista cobra a cada consumidor su <strong>precio de reserva</strong> (la máxima disposición a pagar). Captura <em>todo</em> el excedente del consumidor. No hay pérdida irrecuperable de eficiencia (se produce la cantidad competitiva), pero toda la ganancia va al productor. Teórica: requiere información perfecta sobre cada consumidor.
                    </p>
                    <p>
                        <strong>Discriminación de segundo grado (por cantidad o autoselección):</strong> el monopolista ofrece diferentes paquetes o versiones y los consumidores se autoseleccionan. Incluye: descuentos por volumen, <strong>tarifas en dos partes</strong> (cuota fija + precio por unidad: parques de atracciones, telecomunicaciones), versiones del producto (primera clase / turista, versión premium / básica). No requiere identificar a los consumidores, sino diseñar opciones que los separen.
                    </p>
                    <p>
                        <strong>Discriminación de tercer grado (por grupos):</strong> la forma más común. El monopolista identifica grupos con diferente elasticidad-precio y cobra precios distintos a cada grupo. Regla óptima: <strong>Pm₁/Pm₂</strong> es inversamente proporcional a las elasticidades. Ejemplos: descuentos a estudiantes y seniors, tarifas eléctricas por horario (valle/punta), precios diferentes por país.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 5 ─────────────────────────────────────── */}
            <Card title="5. Regulación del monopolio" icon="📘">
                <TheoryBlock title="5.1. Política de defensa de la competencia" color="amber">
                    <p>
                        La política <strong>antitrust</strong> tiene como objetivo prevenir la formación de monopolios y el abuso de posición dominante. Los hitos legislativos fundamentales son:
                    </p>
                    <p>
                        <strong>Estados Unidos:</strong> Sherman Act (1890) — prohíbe monopolización y acuerdos restrictivos; Clayton Act (1914) — prohíbe fusiones anticompetitivas, discriminación de precios, contratos de exclusividad.
                    </p>
                    <p>
                        <strong>Unión Europea:</strong> artículo 101 del TFUE — prohíbe acuerdos colusorios; artículo 102 — prohíbe el abuso de posición dominante. La Comisión Europea puede imponer multas de hasta el 10 % de la facturación mundial e impedir fusiones anticompetitivas.
                    </p>
                    <p>
                        La lucha antitrust busca el equilibrio entre promover la competencia y no penalizar el crecimiento legítimo por eficiencia.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Regulación del monopolio natural" color="pink">
                    <p>
                        Cuando el monopolio es natural (por subaditividad de costes), la fragmentación sería ineficiente. Se recurre a la <strong>regulación de precios</strong>:
                    </p>
                    <p>
                        <strong>First-best (precio = CMg):</strong> maximiza el bienestar social, pero si hay economías de escala y el CMe es decreciente, P = CMg implica P {'<'} CMe → pérdidas para la empresa. Requiere un <strong>subsidio público</strong> para cubrir la diferencia, lo que plantea problemas de financiación e incentivos.
                    </p>
                    <p>
                        <strong>Second-best (precio = CMe):</strong> la regla de <strong>Ramsey</strong> — se fija un precio que cubre los costes medios (beneficio cero), renunciando a la eficiencia plena pero sin necesidad de subsidio. Es la solución práctica más habitual.
                    </p>
                    <p>
                        <strong>Price cap (RPI − X):</strong> regulación por incentivos. Se permite al monopolista subir precios como máximo al ritmo de la inflación (RPI) menos un factor de eficiencia (X). Incentiva la reducción de costes: si la empresa reduce costes más rápido que X, retiene la diferencia como beneficio. Introducido en el Reino Unido (Littlechild, 1983) y ampliamente adoptado.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Organismos reguladores" color="violet">
                    <p>
                        <strong>España:</strong> la <strong>CNMC</strong> (Comisión Nacional de los Mercados y la Competencia), creada en 2013, es el organismo independiente encargado de garantizar la competencia efectiva en los mercados y la regulación de sectores con monopolio natural (telecomunicaciones, energía, transporte).
                    </p>
                    <p>
                        <strong>Unión Europea:</strong> la <strong>Comisión Europea</strong> (DG Competencia) aplica los artículos 101 y 102 del TFUE, controla las concentraciones empresariales y las ayudas de Estado. Casos emblemáticos: Microsoft, Google, Apple (ayudas de Estado en Irlanda).
                    </p>
                </TheoryBlock>
            </Card>

                    </p>

                        <strong>Competencias clave:</strong> STEM (modelización gráfica y algebraica del monopolio), CC (valoración de la equidad y la pérdida de bienestar), CE (comprensión de las barreras y la posición dominante), CPSAA (reflexión sobre las consecuencias del monopolio para el consumidor y la sociedad).

            <Card title="Conclusión" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        A lo largo de este tema se ha analizado el <strong>monopolio</strong> como estructura de mercado opuesta a la competencia perfecta, examinando sus causas, su funcionamiento y sus consecuencias.
                    </p>
                    <p>
                        En primer lugar, se ha definido el monopolio y se han clasificado las <strong>barreras de entrada</strong> (legales, naturales, de recurso, tecnológicas), distinguiendo los tipos de monopolio: natural, legal, de recurso, tecnológico y bilateral.
                    </p>
                    <p>
                        En segundo lugar, se ha analizado la <strong>decisión de producción</strong> del monopolista: la relación IMg {'<'} P, la fórmula IMg = P(1 + 1/Ep), la operación en el tramo elástico y la condición de maximización IMg = CMg, subrayando que el monopolista no tiene curva de oferta.
                    </p>
                    <p>
                        En tercer lugar, se han evaluado los <strong>efectos sobre el bienestar</strong>: precio más alto, cantidad menor, pérdida irrecuperable de eficiencia (Harberger), ineficiencia asignativa y productiva (Leibenstein), búsqueda de rentas (Tullock, Krueger) y el debate Schumpeter-Arrow sobre monopolio e innovación, junto con la teoría de los mercados contestables (Baumol).
                    </p>
                    <p>
                        En cuarto lugar, se ha estudiado la <strong>discriminación de precios</strong> en sus tres grados, y en quinto lugar, la <strong>regulación del monopolio</strong>: política antitrust, regulación del monopolio natural (first-best, second-best, price cap) y organismos reguladores (CNMC, Comisión Europea).
                    </p>
                    <p>
                        Finalmente, el monopolio es un tema de máxima relevancia docente: permite contrastar con la competencia perfecta, fundamentar la intervención pública y desarrollar el pensamiento crítico del alumnado sobre el funcionamiento real de los mercados.
                    </p>

            {/* ── EPÍGRAFE 1 ─────────────────────────────────────── */}
            <Card title="1. El oligopolio: concepto y características" icon="📘">
                <TheoryBlock title="1.1. Definición" color="purple">
                    <p>
                        El <strong>oligopolio</strong> es una estructura de mercado en la que un <strong>número reducido de empresas</strong> controla la mayor parte de la oferta de un bien o servicio. La característica definitoria del oligopolio es la <strong>interdependencia estratégica</strong>: cada empresa, al tomar decisiones sobre precio, producción, publicidad o inversión, debe considerar las reacciones esperadas de sus competidores.
                    </p>
                    <p>
                        Esta interdependencia distingue al oligopolio de todas las demás estructuras de mercado. En competencia perfecta y monopolística, cada empresa ignora el efecto de sus decisiones sobre las demás; en monopolio, no hay competidores. En oligopolio, la empresa piensa estratégicamente: <em>«si yo bajo el precio, ¿qué harán los demás?»</em>. Esto convierte la <strong>teoría de juegos</strong> en la herramienta analítica natural del oligopolio.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Características" color="blue">
                    <p>
                        <strong>1. Barreras de entrada significativas:</strong> economías de escala, inversiones hundidas elevadas, tecnología, marcas consolidadas, control de distribución. No tan absolutas como en monopolio, pero suficientes para limitar la entrada.
                    </p>
                    <p>
                        <strong>2. Producto homogéneo o diferenciado:</strong> oligopolio puro (acero, cemento, aluminio — producto homogéneo) frente a oligopolio diferenciado (automóviles, telefonía, aerolíneas — producto diferenciado con marca). El grado de diferenciación afecta a la competencia en precios y a la lealtad del consumidor.
                    </p>
                    <p>
                        <strong>3. Rigidez de precios:</strong> tendencia a la estabilidad de precios. Las empresas oligopolistas evitan guerras de precios porque son mutuamente destructivas. Los precios cambian infrecuentemente y, cuando lo hacen, suelen moverse de forma coordinada (liderazgo de precios).
                    </p>
                    <p>
                        <strong>4. Competencia no basada en precios:</strong> publicidad, diferenciación, innovación, servicio posventa, programas de fidelización. La rivalidad se canaliza por vías distintas al precio.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 2 ─────────────────────────────────────── */}
            <Card title="2. Modelos clásicos de oligopolio" icon="📘">
                <TheoryBlock title="2.1. Modelo de Cournot (1838)" color="green">
                    <p>
                        <strong>Augustin Cournot</strong> propuso el primer modelo formal de oligopolio. Los supuestos fundamentales son: duopolio (dos empresas), producto homogéneo, y cada empresa elige su <strong>cantidad de producción</strong> simultáneamente, tomando como dada la cantidad del rival.
                    </p>
                    <p>
                        Cada empresa tiene una <strong>función de reacción</strong> (o mejor respuesta) que indica la cantidad óptima que produce en función de la cantidad que espera del rival. El <strong>equilibrio de Nash-Cournot</strong> se alcanza en la intersección de ambas funciones de reacción: ninguna empresa tiene incentivo para cambiar su producción dada la del rival.
                    </p>
                    <p>
                        En un duopolio simétrico con demanda lineal P = a − b(q₁ + q₂) y coste marginal constante c, la solución es: cada empresa produce <strong>q* = (a − c) / 3b</strong>, la producción total es 2(a − c) / 3b (mayor que monopolio, menor que competencia perfecta), y el precio es intermedio entre ambos extremos.
                    </p>
                    <p>
                        Con n empresas, la producción total se acerca a la competitiva a medida que n crece: Q = n(a − c) / (n + 1)b. En el límite, cuando n → ∞, se obtiene el resultado de competencia perfecta.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Modelo de Bertrand (1883)" color="amber">
                    <p>
                        <strong>Joseph Bertrand</strong> criticó el modelo de Cournot argumentando que las empresas compiten en <strong>precios</strong>, no en cantidades. Con producto homogéneo, la empresa que fija el precio más bajo captura todo el mercado. Esto genera una carrera hacia abajo: cada empresa tiene incentivo para recortar marginalmente el precio del rival.
                    </p>
                    <p>
                        La <strong>paradoja de Bertrand</strong>: con solo dos empresas, el resultado es el <strong>mismo que en competencia perfecta</strong> (P₁ = P₂ = CMg, beneficio cero). Basta con dos competidores para eliminar todo el poder de mercado, un resultado sorprendente e intuitivamente insatisfactorio.
                    </p>
                    <p>
                        Resoluciones de la paradoja: diferenciación de producto (Hotelling, 1929), restricciones de capacidad (Edgeworth, 1897; Kreps y Scheinkman, 1983 — con restricciones de capacidad, Bertrand converge a Cournot), y juegos repetidos (la competencia a largo plazo facilita la colusión tácita).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Modelo de Stackelberg (1934)" color="pink">
                    <p>
                        <strong>Heinrich von Stackelberg</strong> introdujo la asimetría temporal: una empresa (<strong>líder</strong>) elige primero su cantidad; la otra (<strong>seguidora</strong>) observa la elección del líder y optimiza en consecuencia. Es un juego secuencial que se resuelve por <strong>inducción hacia atrás</strong>.
                    </p>
                    <p>
                        El líder tiene <strong>ventaja del primer movimiento</strong>: produce más que en Cournot, anticipando que el seguidor reducirá su producción. El líder obtiene mayor beneficio que en Cournot; el seguidor, menor. La producción total es mayor y el precio menor que en Cournot.
                    </p>
                    <p>
                        La ventaja del líder depende del compromiso creíble: la elección del líder debe ser irreversible (inversión en capacidad, contratos vinculantes). Sin compromiso creíble, el modelo colapsa a Cournot.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Curva de demanda quebrada (Sweezy, 1939)" color="violet">
                    <p>
                        <strong>Paul Sweezy</strong> propuso un modelo que explica la <strong>rigidez de precios</strong> observada en oligopolio. La hipótesis es que los competidores reaccionan de forma <strong>asimétrica</strong>: si una empresa sube el precio, las demás <strong>no la siguen</strong> (pierde clientes); si baja el precio, las demás <strong>sí la siguen</strong> (no gana cuota).
                    </p>
                    <p>
                        Esto genera una curva de demanda con un «quiebre» en el precio vigente: elástica por encima (las bajadas de precio son igualadas) e inelástica por debajo (las subidas no son seguidas). Consecuencia: la curva de IMg presenta una <strong>discontinuidad vertical</strong> en el nivel de producción actual. El CMg puede variar dentro de ese rango sin que cambie el precio ni la cantidad de equilibrio, explicando la estabilidad de precios.
                    </p>
                    <p>
                        Limitación: el modelo no explica cómo se fijó el precio inicial ni cómo cambia ante perturbaciones grandes.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="Cournot duopolio simétrico: q₁* = q₂* = (a − c) / 3b" desc="Cada empresa produce un tercio de la cantidad competitiva" />
                <FormulaBox formula="Bertrand: P₁ = P₂ = CMg (paradoja — resultado competitivo con solo 2 empresas)" desc="Competencia en precios con producto homogéneo" />
            </Card>

            {/* ── EPÍGRAFE 3 ─────────────────────────────────────── */}
            <Card title="3. Colusión y cárteles" icon="📘">
                <TheoryBlock title="3.1. Colusión explícita" color="red">
                    <p>
                        Un <strong>cártel</strong> es un acuerdo explícito entre empresas oligopolistas para restringir la competencia, típicamente fijando precios, repartiendo mercados o limitando la producción. El objetivo es comportarse colectivamente como un monopolista para maximizar los beneficios conjuntos.
                    </p>
                    <p>
                        El ejemplo más conocido es la <strong>OPEP</strong> (Organización de Países Exportadores de Petróleo), que coordina las cuotas de producción de crudo para influir en el precio mundial. Otros ejemplos históricos: el cártel del cemento, el cártel de vitaminas (descubierto en 1999, multas de la CE), el cártel de los camiones (multa récord de 2,9 mil millones de euros por la CE en 2016).
                    </p>
                    <p>
                        Los cárteles son <strong>ilegales</strong> en la mayoría de jurisdicciones (art. 101 TFUE, Sherman Act) y se persiguen con multas severas y, en EE.UU., con penas de prisión. Los programas de <strong>clemencia</strong> (<em>leniency</em>) incentivan la delación: la primera empresa en denunciar el cártel obtiene inmunidad total.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Colusión tácita" color="cyan">
                    <p>
                        La <strong>colusión tácita</strong> se produce sin acuerdo explícito, cuando las empresas coordinan su comportamiento a través de señales de mercado:
                    </p>
                    <p>
                        <strong>Liderazgo de precios:</strong> una empresa (la más grande, la de menor coste, o la más establecida) fija el precio y las demás la siguen. No hay acuerdo, pero el resultado es similar al de un cártel.
                    </p>
                    <p>
                        <strong>Precios focales</strong> (Schelling, 1960): las empresas convergen hacia precios «naturales» o convencionales (números redondos, precios históricos) sin necesidad de comunicación directa. El punto focal sirve como mecanismo de coordinación implícita.
                    </p>
                    <p>
                        La colusión tácita es más difícil de detectar y perseguir que la explícita, ya que no existe evidencia documental de un acuerdo.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Inestabilidad de los cárteles" color="emerald">
                    <p>
                        Los cárteles son <strong>inherentemente inestables</strong> porque cada miembro tiene un fuerte incentivo individual para <strong>desviarse del acuerdo</strong>: producir más de su cuota (o vender a un precio inferior al pactado) genera beneficios adicionales a corto plazo a costa de los demás miembros.
                    </p>
                    <p>
                        Esta tensión se formaliza mediante el <strong>dilema del prisionero</strong>: la estrategia dominante de cada empresa es <em>no cooperar</em> (producir más, bajar precios), pero si todas hacen lo mismo, el resultado es peor para todas que si todas cooperasen. El <strong>equilibrio de Nash</strong> (no cooperación mutua) es subóptimo desde la perspectiva del cártel.
                    </p>
                    <p>
                        Factores que favorecen la estabilidad: pocos miembros, producto homogéneo, información sobre las acciones de los rivales, represalias creíbles y rápidas, demanda estable, mercado cerrado a la entrada. Factores de inestabilidad: muchos miembros, heterogeneidad de costes, demanda volátil, innovación disruptiva, entrada de nuevos competidores.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 4 ─────────────────────────────────────── */}
            <Card title="4. Teoría de juegos y comportamiento estratégico" icon="📘">
                <TheoryBlock title="4.1. Fundamentos" color="purple">
                    <p>
                        La <strong>teoría de juegos</strong>, formalizada por Von Neumann y Morgenstern (1944) y revolucionada por <strong>John Nash (1950)</strong>, es el marco analítico natural para el oligopolio. Un juego se define por: jugadores (empresas), estrategias (acciones posibles: precios, cantidades, publicidad) y pagos (beneficios resultantes de cada combinación de estrategias).
                    </p>
                    <p>
                        <strong>Juegos simultáneos:</strong> los jugadores eligen sus estrategias al mismo tiempo (o sin conocer la elección del rival). Representación: matriz de pagos. Concepto de solución: equilibrio de Nash.
                    </p>
                    <p>
                        <strong>Juegos secuenciales:</strong> un jugador mueve primero y el otro observa antes de decidir. Representación: árbol de decisión. Concepto de solución: inducción hacia atrás (equilibrio de Nash perfecto en subjuegos). Modelo de Stackelberg.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. El dilema del prisionero" color="blue">
                    <p>
                        El <strong>dilema del prisionero</strong> es el juego paradigmático que captura la tensión entre cooperación e interés individual en el oligopolio. En la <strong>matriz de pagos</strong> típica:
                    </p>
                    <p>
                        Dos empresas pueden elegir cooperar (mantener precios altos / respetar cuotas) o no cooperar (bajar precios / producir más). Si ambas cooperan, obtienen un beneficio elevado (pero no máximo individualmente). Si una defecciona y la otra coopera, la que defecciona obtiene el máximo beneficio y la otra pierde. Si ambas defeccionan, obtienen un beneficio bajo.
                    </p>
                    <p>
                        La <strong>estrategia dominante</strong> de cada jugador es no cooperar, lo que conduce al <strong>equilibrio de Nash</strong>: ambas defeccionan, obteniendo un resultado peor que la cooperación mutua. El equilibrio de Nash no es el <strong>óptimo social</strong> (ni siquiera el óptimo del cártel), lo que ilustra la tensión fundamental del oligopolio.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Juegos repetidos" color="green">
                    <p>
                        Cuando el juego se repite indefinidamente (o con horizonte incierto), la cooperación se hace posible: cada empresa puede <strong>castigar</strong> la defección del rival en las rondas futuras. Esto cambia la estructura de incentivos: el beneficio a corto plazo de desviarse se pondera contra la pérdida futura de la cooperación.
                    </p>
                    <p>
                        <strong>Estrategia tit-for-tat</strong> (Axelrod, 1984): cooperar en la primera ronda y luego replicar la acción del rival en la ronda anterior. Simple, transparente, retributiva pero perdonadora. Ganadora del torneo de Axelrod sobre estrategias del dilema del prisionero repetido.
                    </p>
                    <p>
                        El <strong>teorema folk</strong> de la teoría de juegos establece que, con descuento del futuro suficientemente bajo (las empresas son suficientemente pacientes), <em>cualquier</em> resultado mutuamente beneficioso puede sostenerse como equilibrio en un juego repetido, incluida la cooperación plena. Esto fundamenta teóricamente la colusión tácita.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── EPÍGRAFE 5 ─────────────────────────────────────── */}
            <Card title="5. La competencia monopolística" icon="📘">
                <TheoryBlock title="5.1. Concepto (Chamberlin 1933, Robinson 1933)" color="amber">
                    <p>
                        La <strong>competencia monopolística</strong> fue formalizada simultáneamente por <strong>Edward Chamberlin</strong> (<em>The Theory of Monopolistic Competition</em>, 1933) y <strong>Joan Robinson</strong> (<em>The Economics of Imperfect Competition</em>, 1933). Sus características son:
                    </p>
                    <p>
                        <strong>1. Muchas empresas:</strong> un número grande de empresas, cada una con una cuota de mercado pequeña. A diferencia del oligopolio, cada empresa ignora el efecto de sus decisiones sobre las demás (no hay interdependencia estratégica).
                    </p>
                    <p>
                        <strong>2. Producto diferenciado:</strong> cada empresa ofrece un producto que los consumidores perciben como diferente de los de sus competidores (marca, diseño, localización, calidad, servicio). Esto otorga a cada empresa una <strong>curva de demanda con pendiente negativa</strong> (cierto poder de mercado), pero con muchos sustitutivos cercanos.
                    </p>
                    <p>
                        <strong>3. Libre entrada y salida:</strong> no existen barreras significativas. Cualquier empresa puede entrar o salir del mercado sin costes prohibitivos.
                    </p>
                    <p>
                        Ejemplos: restaurantes, peluquerías, tiendas de ropa, panaderías, servicios profesionales, aplicaciones móviles.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Equilibrio a corto plazo" color="pink">
                    <p>
                        A corto plazo, la empresa en competencia monopolística se comporta de forma similar a un <strong>monopolista</strong>: se enfrenta a una curva de demanda con pendiente negativa (por la diferenciación) y maximiza beneficios donde <strong>IMg = CMg</strong>.
                    </p>
                    <p>
                        Si el precio resultante es superior al CMe, la empresa obtiene <strong>beneficios extraordinarios</strong>. Si P {'<'} CMe pero P {'>'} CVMe, incurre en pérdidas pero sigue produciendo a corto plazo. Si P {'<'} CVMe, cierra.
                    </p>
                    <p>
                        La diferencia con el monopolio puro es que la demanda de cada empresa es relativamente elástica (muchos sustitutivos) y que esta situación es transitoria: la existencia de beneficios extraordinarios atraerá nuevas empresas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Equilibrio a largo plazo" color="violet">
                    <p>
                        Los beneficios extraordinarios atraen la entrada de nuevas empresas, que ofrecen productos diferenciados pero sustitutivos cercanos. Esto <strong>desplaza hacia la izquierda</strong> la curva de demanda de cada empresa incumbente (pierde cuota de mercado) y la hace más elástica (más opciones para los consumidores).
                    </p>
                    <p>
                        El proceso continúa hasta que los beneficios económicos se reducen a <strong>cero</strong>: la curva de demanda de cada empresa es tangente a su curva de CMe. En equilibrio de largo plazo: <strong>P = CMe</strong> (beneficio cero), pero <strong>P {'>'} CMg</strong> (ineficiencia asignativa persistente).
                    </p>
                    <p>
                        <strong>Exceso de capacidad:</strong> como la demanda tiene pendiente negativa, la tangencia P = CMe ocurre a la izquierda del mínimo del CMe. Cada empresa produce <em>menos</em> de lo que minimizaría sus costes medios. Hay «demasiadas empresas produciendo demasiado poco» — es el coste social de la variedad y la diferenciación.
                    </p>
                    <p>
                        Debate sobre el exceso de capacidad: algunos economistas argumentan que el coste es compensado por la <strong>ganancia de variedad</strong> que valoran los consumidores. El modelo de Dixit-Stiglitz (1977) formaliza esta idea: los consumidores prefieren la variedad, y la competencia monopolística puede generar una variedad socialmente eficiente.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Publicidad y diferenciación" color="red">
                    <p>
                        En competencia monopolística, la <strong>publicidad</strong> y la <strong>diferenciación del producto</strong> son herramientas estratégicas fundamentales:
                    </p>
                    <p>
                        <strong>Publicidad informativa:</strong> reduce la asimetría de información, facilita la comparación de precios y productos, y puede intensificar la competencia (Stigler, 1961). Beneficiosa para el consumidor.
                    </p>
                    <p>
                        <strong>Publicidad persuasiva:</strong> crea fidelidad de marca artificial, desplaza la curva de demanda hacia la derecha y la hace menos elástica (mayor poder de mercado). Puede ser socialmente costosa si los recursos publicitarios no crean valor real.
                    </p>
                    <p>
                        <strong>Gasto en publicidad:</strong> la regla de Dorfman-Steiner (1954) establece que la ratio óptima publicidad/ingresos es igual a la ratio entre la elasticidad de la demanda respecto a la publicidad y la elasticidad-precio de la demanda. Las empresas con demanda inelástica al precio gastan proporcionalmente más en publicidad.
                    </p>
                    <p>
                        <strong>Marca:</strong> actúa como señal de calidad (función informativa), como barrera de entrada (los incumbentes tienen marcas reconocidas) y como activo estratégico. La inversión en marca es un coste hundido que compromete a la empresa con el mercado.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="LP competencia monopolística: P = CMe > CMg → Exceso de capacidad" desc="Equilibrio con beneficio cero pero ineficiencia asignativa" />
            </Card>

            {/* ── EPÍGRAFE 6 ─────────────────────────────────────── */}
            <Card title="6. Política de defensa de la competencia" icon="📘">
                <TheoryBlock title="6.1. Marco regulatorio" color="amber">
                    <p>
                        La <strong>política de defensa de la competencia</strong> busca prevenir las conductas anticompetitivas (colusión, abuso de posición dominante) y controlar las concentraciones empresariales que puedan reducir significativamente la competencia.
                    </p>
                    <p>
                        <strong>Unión Europea:</strong> artículo 101 del TFUE prohíbe los acuerdos colusorios (cárteles, fijación de precios, reparto de mercados); artículo 102 prohíbe el abuso de posición dominante (precios excesivos, ventas atadas, discriminación). La Comisión Europea puede imponer multas de hasta el 10 % de la facturación mundial y bloquear fusiones anticompetitivas. Reglamento de Concentraciones (Reg. 139/2004).
                    </p>
                    <p>
                        <strong>España:</strong> la <strong>CNMC</strong> (Comisión Nacional de los Mercados y la Competencia), creada por la Ley 3/2013, integra las funciones de la antigua CNC y los reguladores sectoriales. Supervisa mercados, investiga prácticas anticompetitivas, controla concentraciones y regula sectores con monopolio natural.
                    </p>
                    <p>
                        <strong>Estados Unidos:</strong> Sherman Act (1890), Clayton Act (1914), FTC Act (1914). Tradición antitrust más antigua y agresiva. Casos emblemáticos: Standard Oil (1911), AT&T (1984), Microsoft (2001), Google (2020-actualidad).
                    </p>
                </TheoryBlock>
            </Card>

                    </p>
                    <p>
                        Respecto al oligopolio, se ha definido su rasgo esencial — la <strong>interdependencia estratégica</strong> — y se han presentado los modelos clásicos: <strong>Cournot</strong> (competencia en cantidades, funciones de reacción, equilibrio Nash-Cournot), <strong>Bertrand</strong> (competencia en precios, paradoja P = CMg), <strong>Stackelberg</strong> (líder-seguidor, ventaja del primer movimiento) y <strong>Sweezy</strong> (demanda quebrada, rigidez de precios).
                    </p>
                    <p>
                        Se ha analizado la <strong>colusión</strong> — explícita (cárteles, OPEP) y tácita (liderazgo de precios, puntos focales de Schelling) — y su inestabilidad inherente, formalizada mediante el <strong>dilema del prisionero</strong> y la teoría de juegos de Nash. Los juegos repetidos y la estrategia tit-for-tat (Axelrod) explican cómo puede sostenerse la cooperación a largo plazo.
                    </p>
                    <p>
                        Respecto a la <strong>competencia monopolística</strong> (Chamberlin, Robinson), se ha detallado el equilibrio a corto plazo (similar al monopolio) y a largo plazo (P = CMe, B = 0, exceso de capacidad, P {'>'} CMg), junto con el papel de la publicidad y la diferenciación.
                    </p>
                    <p>
                        Finalmente, se ha presentado la <strong>política de defensa de la competencia</strong> (CNMC, Comisión Europea, Sherman/Clayton Acts) como respuesta regulatoria a las distorsiones de la competencia imperfecta. Estos contenidos son esenciales para que el alumnado comprenda el funcionamiento real de los mercados, más allá de los modelos extremos de competencia perfecta y monopolio.
                    </p>

            {/* ── 1. LOS FALLOS DE MERCADO: CONCEPTO Y TIPOLOGÍA ── */}
            <Card title="1. Los fallos de mercado: concepto y tipología" icon="📘">

                    <p>
                        Un <strong>fallo de mercado</strong> se produce cuando el mecanismo de precios no conduce a una asignación de recursos que sea <strong>eficiente en el sentido de Pareto</strong>: es decir, cuando existe una reasignación posible que mejoraría el bienestar de al menos un individuo sin empeorar el de ningún otro.
                    </p>
                    <p>
                        En estas situaciones, el mercado genera una <strong>asignación subóptima</strong>: se produce demasiado de un bien (sobreproducción) o demasiado poco (infraproducción) respecto al nivel socialmente deseable. La brecha entre el resultado del mercado y el óptimo social justifica, desde la teoría económica, la posibilidad de intervención correctora.
                    </p>
                    <p>
                        El concepto se remonta a <strong>Pigou (1920)</strong>, quien identificó las divergencias entre costes privados y sociales, y fue sistematizado por <strong>Bator (1958)</strong> en su artículo seminal <em>«The Anatomy of Market Failure»</em>. Los teoremas fundamentales del bienestar establecen las condiciones bajo las cuales el mercado alcanza la eficiencia; los fallos de mercado son, precisamente, las violaciones de esas condiciones.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Tipología de los fallos de mercado" color="blue">
                    <p>La literatura económica identifica cuatro grandes categorías de fallos de mercado:</p>
                    <ul className="list-disc pl-5 space-y-2">
                        <li><strong>Externalidades</strong>: efectos sobre terceros no recogidos en los precios de mercado (positivas o negativas).</li>

                        <li><strong>Información asimétrica</strong>: distribución desigual de información entre las partes de una transacción (selección adversa, riesgo moral).</li>
                        <li><strong>Poder de mercado (monopolio)</strong>: capacidad de un agente para influir en los precios, generando ineficiencia asignativa (ya analizado en los Temas 15-16).</li>
                    </ul>
                    <p>
                        A estos se añaden los <strong>mercados incompletos</strong> (ausencia de mercados para ciertos bienes o riesgos, como seguros para catástrofes o mercados de futuros en economías en desarrollo), identificados por Stiglitz como una categoría adicional relevante.
                    </p>
                </TheoryBlock>

            {/* ── 2. EXTERNALIDADES ──────────────────────────────── */}
            <Card title="2. Externalidades" icon="📘">
                <TheoryBlock title="2.1. Concepto de externalidad" color="green">
                    <p>
                        Una <strong>externalidad</strong> se produce cuando la actividad de un agente económico (producción o consumo) afecta al bienestar de un tercero <strong>sin que este efecto se refleje en los precios de mercado</strong>. Existe, por tanto, una divergencia entre los costes (o beneficios) privados y los costes (o beneficios) sociales.
                    </p>
                    <p>
                        El concepto fue desarrollado por <strong>Alfred Marshall</strong> (economías externas, 1890) y formalizado por <strong>Arthur Cecil Pigou (1920)</strong> en <em>The Economics of Welfare</em>, donde propuso la intervención fiscal para corregir estas divergencias. Las externalidades implican la ausencia de un mercado para el efecto externo: no hay precio que internalice el impacto sobre terceros.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Externalidades negativas" color="red">
                    <p>
                        Se producen cuando la actividad de un agente impone <strong>costes sobre terceros</strong> que no son compensados. El <strong>coste social</strong> excede al <strong>coste privado</strong>, lo que conduce a una <strong>sobreproducción</strong> respecto al nivel socialmente óptimo.
                    </p>
                    <p>Ejemplos paradigmáticos:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Contaminación industrial</strong>: emisiones que dañan la salud y el medio ambiente.</li>
                        <li><strong>Ruido</strong>: aeropuertos, tráfico, obras que afectan a residentes cercanos.</li>
                        <li><strong>Congestión</strong>: cada conductor adicional incrementa el tiempo de viaje de los demás.</li>
                        <li><strong>Tabaquismo pasivo</strong>: costes de salud impuestos a no fumadores.</li>
                    </ul>
                    <p>
                        Gráficamente, la curva de <strong>coste marginal social (CMgS)</strong> se sitúa por encima de la curva de <strong>coste marginal privado (CMgP)</strong>. El mercado produce Q<sub>mercado</sub> {'>'} Q<sub>óptimo</sub>, generando una <strong>pérdida irrecuperable de bienestar</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Externalidades positivas" color="emerald">
                    <p>
                        Se producen cuando la actividad de un agente genera <strong>beneficios para terceros</strong> que no son remunerados. El <strong>beneficio social</strong> excede al <strong>beneficio privado</strong>, lo que conduce a una <strong>infraproducción</strong> respecto al nivel socialmente óptimo.
                    </p>
                    <p>Ejemplos relevantes:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Educación</strong>: genera capital humano, ciudadanía informada, menor criminalidad.</li>
                        <li><strong>Investigación y desarrollo (I+D)</strong>: spillovers tecnológicos que benefician a toda la sociedad.</li>
                        <li><strong>Vacunación</strong>: inmunidad de grupo que protege a no vacunados.</li>
                        <li><strong>Restauración de edificios históricos</strong>: mejora estética del entorno para los vecinos.</li>
                    </ul>
                    <p>
                        Gráficamente, la curva de <strong>beneficio marginal social (BMgS)</strong> se sitúa por encima de la curva de <strong>beneficio marginal privado (BMgP)</strong>. El mercado produce Q<sub>mercado</sub> {'<'} Q<sub>óptimo</sub>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Soluciones a las externalidades" color="amber">
                    <p>La teoría económica propone tres grandes grupos de soluciones:</p>

                    <p className="font-semibold mt-3">A) Soluciones pigouvianas (intervención fiscal)</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Impuestos pigouvianos</strong> (externalidad negativa): gravar al generador de la externalidad en una cuantía igual al <strong>coste marginal externo</strong>, de modo que el coste privado iguale al social. Ejemplo: impuesto sobre emisiones de CO₂.</li>
                        <li><strong>Subvenciones</strong> (externalidad positiva): subsidiar la actividad con beneficios externos para que el beneficio privado iguale al social. Ejemplo: becas de educación, subsidios a I+D.</li>
                    </ul>

                    <p className="font-semibold mt-3">B) Teorema de Coase (solución privada)</p>
                    <p>
                        <strong>Ronald Coase (1960)</strong> demostró que, si los <strong>derechos de propiedad están bien definidos</strong> y los <strong>costes de transacción son suficientemente bajos</strong>, las partes pueden negociar directamente para alcanzar una solución eficiente, <strong>independientemente de la asignación inicial de derechos</strong>. La negociación privada internaliza la externalidad sin necesidad de intervención estatal.
                    </p>
                    <p>
                        Limitaciones: en la práctica, los costes de transacción son elevados cuando hay muchos afectados (contaminación atmosférica), los derechos son difusos o la información es imperfecta.
                    </p>

                    <p className="font-semibold mt-3">C) Regulación directa</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Prohibiciones y estándares</strong>: límites de emisión, normativa medioambiental.</li>
                        <li><strong>Permisos de emisión negociables (cap-and-trade)</strong>: se fija un tope total de emisiones y se reparten permisos que se pueden intercambiar en un mercado. El Sistema Europeo de Comercio de Emisiones (EU ETS) es el principal ejemplo mundial.</li>
                        <li><strong>Regulación command-and-control</strong>: obligación de usar tecnologías específicas (filtros, catalizadores).</li>
                    </ul>
                </TheoryBlock>

                <FormulaBox formula="Coste social = Coste privado + Coste externo" />
                <FormulaBox formula="Impuesto pigouviano óptimo: t* = CMgE (coste marginal externo en Q*)" />
            </Card>

            {/* ── 3. BIENES PÚBLICOS ────────────────────────────── */}
            <Card title="3. Bienes públicos" icon="📘">
                <TheoryBlock title="3.1. Clasificación de los bienes según rivalidad y exclusión" color="purple">
                    <p>Los bienes se clasifican según dos propiedades fundamentales:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Rivalidad</strong>: el consumo por un individuo reduce la cantidad disponible para los demás.</li>
                        <li><strong>Exclusión</strong>: es posible impedir el acceso a quien no pague.</li>
                    </ul>
                    <p>Esta doble clasificación genera cuatro categorías (Samuelson, 1954; Buchanan, 1965):</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Bienes privados</strong> (rivales + excluibles): alimentos, ropa, vivienda.</li>
                        <li><strong>Bienes públicos puros</strong> (no rivales + no excluibles): defensa nacional, alumbrado público.</li>
                        <li><strong>Bienes comunes</strong> (rivales + no excluibles): bancos de pesca, bosques abiertos, acuíferos.</li>
                        <li><strong>Bienes de club</strong> (no rivales + excluibles): televisión por cable, autopistas de peaje, clubes deportivos. Concepto introducido por <strong>Buchanan (1965)</strong>.</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="3.2. Bienes públicos puros" color="blue">
                    <p>
                        Un <strong>bien público puro</strong> cumple simultáneamente las condiciones de <strong>no rivalidad</strong> (el consumo de uno no reduce el de otro) y <strong>no exclusión</strong> (no se puede impedir el acceso a nadie). Ejemplos clásicos: defensa nacional, alumbrado público, señales de radio, conocimiento científico básico.
                    </p>
                    <p>
                        La provisión eficiente de un bien público requiere que la <strong>suma vertical de las disposiciones marginales a pagar</strong> de todos los individuos iguale al <strong>coste marginal de provisión</strong> (condición de Samuelson). A diferencia de los bienes privados, las curvas de demanda se suman verticalmente, no horizontalmente.
                    </p>
                    <p>
                        El mercado tiende a <strong>infraprovisionar</strong> bienes públicos porque no puede capturar la disposición a pagar de los beneficiarios, lo que justifica su provisión pública financiada mediante impuestos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. El problema del free-rider (polizón)" color="pink">
                    <p>
                        El <strong>problema del free-rider</strong> (polizón o gorrón) es la principal causa de la infraprovisión de bienes públicos por el mercado. Dado que no se puede excluir a nadie del consumo, cada individuo tiene el <strong>incentivo racional a no revelar su verdadera disposición a pagar</strong> y beneficiarse gratuitamente de la provisión ajena.
                    </p>
                    <p>
                        Si todos los individuos adoptan esta estrategia, el bien no se produce o se produce en cantidad muy inferior a la socialmente óptima. Este problema es especialmente grave en grupos grandes, donde la contribución individual tiene un impacto marginal pequeño (Olson, 1965: <em>The Logic of Collective Action</em>).
                    </p>
                    <p>
                        La <strong>provisión pública</strong> financiada mediante impuestos obligatorios resuelve el problema del free-rider, aunque plantea el reto de determinar la cantidad óptima del bien público sin poder observar las preferencias verdaderas de los ciudadanos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Bienes comunes y la tragedia de los comunes" color="violet">
                    <p>
                        <strong>Garrett Hardin (1968)</strong> popularizó el concepto de la <strong>tragedia de los comunes</strong>: cuando un recurso es rival pero no excluible, cada usuario tiene incentivos a sobreexplotarlo, ya que recibe todos los beneficios de su uso pero comparte los costes del agotamiento con los demás. El resultado es la <strong>sobreexplotación y eventual destrucción del recurso</strong>.
                    </p>
                    <p>Ejemplos históricos y actuales:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Pesca</strong>: colapso de caladeros por sobrepesca (bacalao de Terranova).</li>
                        <li><strong>Deforestación</strong>: tala excesiva de bosques comunales.</li>
                        <li><strong>Acuíferos</strong>: sobreexplotación de aguas subterráneas (acuífero 23, Mancha Occidental).</li>
                        <li><strong>Cambio climático</strong>: la atmósfera como bien común global.</li>
                    </ul>
                    <p>Soluciones propuestas:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Privatización</strong>: asignación de derechos de propiedad individuales (Demsetz).</li>
                        <li><strong>Regulación estatal</strong>: cuotas, vedas, licencias.</li>
                        <li><strong>Gestión comunitaria</strong>: <strong>Elinor Ostrom (Premio Nobel 2009)</strong> demostró que las comunidades locales pueden gestionar exitosamente recursos comunes mediante reglas autoorganizadas, sin necesidad de privatización ni regulación estatal, si se cumplen ciertos principios de diseño institucional.</li>
                    </ul>
                </TheoryBlock>
            </Card>

            {/* ── 4. INFORMACIÓN ASIMÉTRICA ──────────────────────── */}
            <Card title="4. Información asimétrica" icon="📘">
                <TheoryBlock title="4.1. Selección adversa" color="amber">
                    <p>
                        La <strong>selección adversa</strong> es un problema de información asimétrica que se produce <strong>antes de la transacción</strong> (<em>ex ante</em>): una de las partes posee información relevante que la otra desconoce, lo que distorsiona el funcionamiento del mercado.
                    </p>
                    <p>
                        <strong>George Akerlof (1970)</strong> formalizó este problema en su artículo seminal <em>«The Market for Lemons»</em>: en el mercado de coches usados, los vendedores conocen la calidad de su vehículo, pero los compradores no pueden distinguir los buenos («peaches») de los malos («lemons»). Los compradores ofrecen un precio medio, lo que expulsa del mercado a los vendedores de coches buenos → <strong>solo quedan los «limones»</strong> → el mercado puede colapsar.
                    </p>
                    <p>Otros ejemplos de selección adversa:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Seguros médicos</strong>: quienes más los demandan son los más enfermos → primas elevadas → los sanos abandonan el mercado.</li>
                        <li><strong>Mercado de crédito</strong>: los prestatarios más arriesgados son los más dispuestos a aceptar tipos altos (Stiglitz y Weiss, 1981: racionamiento de crédito).</li>
                    </ul>
                </TheoryBlock>

                <TheoryBlock title="4.2. Riesgo moral" color="green">
                    <p>
                        El <strong>riesgo moral</strong> (<em>moral hazard</em>) es un problema de información asimétrica que se produce <strong>después de la transacción</strong> (<em>ex post</em>): una vez firmado el contrato, una de las partes modifica su comportamiento de forma perjudicial para la otra, aprovechando que sus acciones no son observables.
                    </p>
                    <p>Ejemplos fundamentales:</p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Seguros</strong>: una persona asegurada contra robo puede ser menos cuidadosa con sus pertenencias.</li>
                        <li><strong>Rescates bancarios</strong>: si los bancos esperan ser rescatados (<em>too big to fail</em>), asumen riesgos excesivos.</li>
                        <li><strong>Relación agente-principal</strong>: el directivo (agente) puede no maximizar el valor para los accionistas (principal) si sus intereses divergen. Jensen y Meckling (1976) formalizaron la <strong>teoría de la agencia</strong>.</li>
                    </ul>
                    <p>
                        Soluciones: <strong>diseño de contratos con incentivos</strong> (participación en beneficios, stock options), <strong>monitorización</strong>, <strong>franquicias y copagos</strong> en seguros (para que el asegurado mantenga incentivos de precaución).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Señalización y filtrado" color="cyan">
                    <p>
                        Ante la información asimétrica, los agentes desarrollan mecanismos para transmitir o extraer información:
                    </p>
                    <p>
                        <strong>Michael Spence (1973)</strong> introdujo el concepto de <strong>señalización</strong> (<em>signaling</em>): la parte informada realiza una acción costosa para revelar su tipo. El ejemplo clásico es la <strong>educación como señal</strong>: un título universitario puede no aumentar la productividad directamente, pero señala capacidad y perseverancia al empleador. Otros ejemplos: garantías del producto (señal de calidad), dividendos (señal de solvencia financiera).
                    </p>
                    <p>
                        El <strong>filtrado</strong> (<em>screening</em>), propuesto por <strong>Rothschild y Stiglitz (1976)</strong>, funciona a la inversa: la parte no informada diseña un menú de opciones que induce a la parte informada a autoseleccionarse. Ejemplo: compañías de seguros que ofrecen pólizas con distintos niveles de cobertura y franquicia.
                    </p>
                    <p>
                        Otros mecanismos: <strong>certificaciones y auditorías</strong> (ISO, AENOR), <strong>regulación de información</strong> (etiquetado obligatorio, transparencia financiera), <strong>reputación y marcas</strong>.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── 5. EL PAPEL DEL ESTADO ─────────────────────────── */}
            <Card title="5. El papel del Estado ante los fallos de mercado" icon="📘">
                <TheoryBlock color="purple">
                    <p>
                        Los fallos de mercado proporcionan la <strong>justificación económica para la intervención del Estado</strong>, entendida como <strong>corrección</strong> de las ineficiencias del mercado, no como sustitución del mecanismo de precios. El Estado interviene mediante:
                    </p>
                    <ul className="list-disc pl-5 space-y-1">
                        <li><strong>Regulación</strong>: normativa medioambiental, de competencia, de información al consumidor.</li>
                        <li><strong>Provisión directa</strong>: bienes públicos (defensa, justicia, infraestructuras).</li>
                        <li><strong>Fiscalidad correctora</strong>: impuestos pigouvianos, subvenciones.</li>
                        <li><strong>Diseño de mercados</strong>: permisos de emisión, subastas de espectro radioeléctrico.</li>
                    </ul>
                    <p>
                        Sin embargo, la teoría de la <strong>elección pública</strong> (<em>Public Choice</em>) advierte de que la intervención estatal también puede generar ineficiencias: los <strong>fallos del Estado</strong> (Buchanan, Tullock, Niskanen). Los políticos y burócratas tienen sus propios incentivos (reelección, presupuesto), la información del regulador es imperfecta, y la intervención puede generar búsqueda de rentas, captura regulatoria o ineficiencia burocrática.
                    </p>
                    <p>
                        El debate no es, por tanto, «mercado vs Estado», sino cuál es la <strong>combinación óptima de ambos mecanismos</strong> en cada contexto, evaluando los costes y beneficios de la intervención frente a los costes del fallo de mercado.
                    </p>
                    <p>
                        <strong>Relevancia curricular</strong>: este tema conecta con las competencias LOMLOE CC (sostenibilidad, bienes públicos), STEM (modelización de externalidades), CE (fallos del mercado y regulación) y CPSAA (toma de decisiones informada). Se vincula con los ODS 13 (acción por el clima), 14 y 15 (vida submarina y ecosistemas terrestres).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓN ─────────────────────────────────────── */}
            <Card title="Conclusión" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        A lo largo de este tema se han analizado las principales situaciones en las que el mercado libre no alcanza una asignación eficiente de los recursos, justificando la intervención correctora del Estado.
                    </p>
                    <p>
                        En primer lugar, se ha definido el concepto de <strong>fallo de mercado</strong> como divergencia entre el resultado del mercado y el óptimo de Pareto, y se han clasificado sus principales tipos. En segundo lugar, se han estudiado las <strong>externalidades</strong> (negativas y positivas) y sus soluciones: impuestos pigouvianos, teorema de Coase y regulación directa.
                    </p>
                    <p>
                        En tercer lugar, se han analizado los <strong>bienes públicos</strong> (no rivalidad, no exclusión, free-rider) y los <strong>bienes comunes</strong> (tragedia de los comunes, Ostrom). En cuarto lugar, la <strong>información asimétrica</strong>: selección adversa (Akerlof), riesgo moral y señalización (Spence).
                    </p>
                    <p>
                        Finalmente, se ha reflexionado sobre el <strong>papel del Estado</strong> como corrector de fallos de mercado, sin olvidar los fallos del propio Estado (Public Choice). El tema es de máxima relevancia docente: permite al alumnado comprender por qué los mercados necesitan regulación y desarrollar un pensamiento crítico sobre la intervención pública.
                    </p>
                </div>
            </Card>

                    </p>
                    <p>
                        La <strong>teoría neoclásica de la distribución</strong> (Clark, 1899; Wicksteed) establece que cada factor recibe una remuneración igual a su <strong>productividad marginal</strong>: w = PMgL (salario = producto marginal del trabajo), r = PMgK (interés = producto marginal del capital). Si la función de producción presenta rendimientos constantes a escala, el <strong>teorema de Euler</strong> garantiza que el producto se agota exactamente al pagar a cada factor su productividad marginal.
                    </p>
                    <p>
                        Tendencias recientes: <strong>Piketty (2014)</strong> documenta una caída sostenida de la <strong>participación del trabajo</strong> en la renta nacional desde los años 1980, con un aumento correlativo de la participación del capital, atribuido a la globalización, el cambio tecnológico y la menor sindicalización.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Distribución personal de la renta" color="blue">

                        La <strong>distribución personal</strong> analiza cómo se reparte la renta entre <strong>individuos u hogares</strong>, independientemente de la fuente (trabajo, capital, transferencias). Es la perspectiva más relevante para el análisis de la desigualdad y la pobreza.
                    </p>

                        <li><strong>Renta ajustada</strong>: renta disponible + servicios públicos en especie (sanidad, educación).</li>
                    </ul>
                    <p>
                        La distribución personal depende de factores como el capital humano, la herencia, la suerte, las instituciones y las políticas redistributivas.
                    </p>
                </TheoryBlock>

                        La <strong>distribución espacial</strong> analiza las diferencias de renta entre <strong>regiones y países</strong>. Es el objeto de la economía regional y del desarrollo.
