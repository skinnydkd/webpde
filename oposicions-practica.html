                            <FormulaBox formula="IMg = dIT/dQ = 100 − 4Q" />

                            <p>{lang === 'es' ? 'CT = q³ − 6q² + 15q + 10 → CV = q³ − 6q² + 15q, CF = 10' : lang === 'en' ? 'TC = q³ − 6q² + 15q + 10 → VC = q³ − 6q² + 15q, FC = 10' : 'CT = q³ − 6q² + 15q + 10 → CV = q³ − 6q² + 15q, CF = 10'}</p>

                            <FormulaBox formula="BAI = 100 + 5 − 25 = 80" desc={lang === 'es' ? 'Resultado antes de impuestos (EBT)' : lang === 'en' ? 'Earnings before tax (EBT)' : 'Resultat abans d\'impostos (EBT)'} />
                            <FormulaBox formula="BN = 80 × (1 − 0,25) = 60" desc={lang === 'es' ? 'Beneficio neto (Net Income)' : lang === 'en' ? 'Net income' : 'Benefici net (Net Income)'} />
                            <ResultBox><p>EBITDA = 130 | BAII = 100 | BAI = 80 | BN = 60</p></ResultBox>
                        </Step>

                        <Step label={`b) ${lang === 'es' ? 'Márgenes' : lang === 'en' ? 'Margins' : 'Marges'}`}>
                            <FormulaBox formula={`${lang === 'es' ? 'Margen bruto' : lang === 'en' ? 'Gross margin' : 'Marge brut'} = (500 − 200) / 500 = 60%`} />
                            <FormulaBox formula={`${lang === 'es' ? 'Margen operativo' : lang === 'en' ? 'Operating margin' : 'Marge operatiu'} = BAII / ${lang === 'es' ? 'Ventas' : lang === 'en' ? 'Sales' : 'Vendes'} = 100 / 500 = 20%`} />
                            <FormulaBox formula={`${lang === 'es' ? 'Margen neto' : lang === 'en' ? 'Net margin' : 'Marge net'} = BN / ${lang === 'es' ? 'Ventas' : lang === 'en' ? 'Sales' : 'Vendes'} = 60 / 500 = 12%`} />
                        </Step>

                        <Step label={`c) ${lang === 'es' ? 'Interpretación' : lang === 'en' ? 'Interpretation' : 'Interpretació'}`}>
                            <InterpretBox>
                                <p>{lang === 'es' ? 'La empresa genera un buen margen bruto (60%), lo que indica que controla bien el coste de sus aprovisionamientos. El margen operativo (20%) es sólido, mostrando eficiencia en la gestión operativa.' : lang === 'en' ? 'The firm generates a good gross margin (60%), indicating good control over supply costs. The operating margin (20%) is solid, showing operational efficiency.' : 'L\'empresa genera un bon marge brut (60%), la qual cosa indica que controla bé el cost dels seus aprovisionaments. El marge operatiu (20%) és sòlid, mostrant eficiència en la gestió operativa.'}</p>
                                <p className="mt-1">{lang === 'es' ? 'El margen neto (12%) se ve reducido significativamente por los gastos financieros (25 mil €), lo que sugiere un nivel de endeudamiento relevante. La diferencia entre EBITDA (130) y BN (60) señala el impacto del endeudamiento y la fiscalidad.' : lang === 'en' ? 'The net margin (12%) is significantly reduced by financial costs (€25k), suggesting a relevant level of debt. The gap between EBITDA (130) and Net Income (60) highlights the impact of debt and taxation.' : 'El marge net (12%) es veu reduït significativament per les despeses financeres (25 mil €), la qual cosa suggereix un nivell d\'endeutament rellevant. La diferència entre EBITDA (130) i BN (60) assenyala l\'impacte de l\'endeutament i la fiscalitat.'}</p>
                            </InterpretBox>
                        </Step>
                    </div>
                }
            />
        </div>
    );

    // ════════════════════════════════════════════════════════════════
    // NEW SECTIONS: COMERÇ INTERNACIONAL, MERCAT TREBALL, ORGANITZACIO
    // ════════════════════════════════════════════════════════════════

    const BlocComerc = () => (
        <div>
            <SectionTitle icon="🌐" title={t('bloc.comerc')} subtitle={t('bloc.comerc.desc')} />
            <Exercise num={26} origin={lang === 'es' ? 'Madrid' : 'Madrid'} difficulty={1} tema="Tema 25" statement={<div><p>{lang === 'es' ? 'Dos países (A i B) produeixen vi i drap. Productivitats (hores per unitat):' : lang === 'en' ? 'Two countries produce wine and cloth. Productivities (hours per unit):' : 'Dos països (A i B) produeixen vi i drap. Productivitats (hores per unitat):'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>A: Vi 4h/u · Drap 2h/u</p><p>B: Vi 6h/u · Drap 3h/u</p></div><p className="mt-2 font-semibold">{lang === 'es' ? 'Se pide:' : 'Es demana:'}</p><ol className="list-[lower-alpha] list-inside mt-1 space-y-1"><li>{lang === 'es' ? 'Ventaja absoluta.' : 'Avantatge absolut.'}</li><li>{lang === 'es' ? 'Ventaja comparativa (Ricardo).' : 'Avantatge comparatiu (Ricardo).'}</li><li>{lang === 'es' ? 'Especialización beneficiosa.' : 'Especialització beneficiosa.'}</li></ol></div>} solution={<div><Step label="a) Avantatge absolut"><p>A és més productiu en ambdós béns (menys hores). Té avantatge absolut en tots dos.</p></Step><Step label="b) Avantatge comparatiu"><FormulaBox formula="Cost oportunitat A: 1 vi = 2 draps | B: 1 vi = 2 draps" /><p>Relacions iguals → no hi ha especialització. Modifiquem: A: Vi 4h, Drap 2h | B: Vi 3h, Drap 2h.</p><FormulaBox formula="A: 1 vi = 2 draps | B: 1 vi = 1,5 draps" /><p>B renuncia a menys drap per vi → <strong>B té avantatge comparatiu en vi</strong>. A té avantatge comparatiu en drap.</p></Step><Step label="c) Especialització"><ResultBox><p>A especialitzat en drap, B en vi. Tots dos guanyen amb el comerç.</p></ResultBox></Step></div>} />
            <Exercise num={27} origin={lang === 'es' ? 'Estatal' : 'Estatal'} difficulty={2} tema="Tema 25" statement={<div><p>{lang === 'es' ? 'Un país importa 100.000 unidades de un producto. Precio mundial: 10€/u. Aplica aranzel de 2€/u.' : 'Un país importa 100.000 unitats. Preu mundial: 10€/u. Aplica aranzel 2€/u.'}</p><p className="mt-2 font-semibold">{lang === 'es' ? 'Se pide:' : 'Es demana:'}</p><ol className="list-[lower-alpha] list-inside mt-1 space-y-1"><li>{lang === 'es' ? 'Preu nacional post-aranzel.' : 'Preu nacional post-aranzel.'}</li><li>{lang === 'es' ? 'Recaptació aranzelària.' : 'Recaptació aranzelària.'}</li><li>{lang === 'es' ? 'Impacto consumidores/productores/Estado.' : 'Impacte consumidors/productors/Estat.'}</li></ol></div>} solution={<div><Step label="a) Preu nacional"><FormulaBox formula="P_nac = 10 + 2 = 12€/u" /></Step><Step label="b) Recaptació"><p>Assumim que amb aranzel importacions cauen de 100.000 a 70.000 u.</p><FormulaBox formula="Recaptació = 2€ · 70.000 = 140.000€" /></Step><Step label="c) Impacte"><InterpretBox><p>Consumidors perden excedent (preu ↑). Productors nacionals guanyen. Estat recapta. Balanç net: <strong>pèrdua de benestar</strong> pels triangles d'ineficiència (deadweight loss).</p></InterpretBox></Step></div>} />
            <Exercise num={28} origin={lang === 'es' ? 'Andalucía' : 'Andalusia'} difficulty={2} tema="Tema 25" statement={<div><p>{lang === 'es' ? 'Dades 2023 (milions €):' : 'Dades 2023 (milions €):'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>Exportacions béns: 390.000 | Importacions béns: 425.000</p><p>Exportacions serveis: 178.000 | Importacions serveis: 90.000</p><p>Rendes primàries rebudes: 65.000 | Pagades: 55.000</p><p>Transferències netes: +2.000</p><p>Compte capital net: +8.000</p></div><p className="mt-2 font-semibold">{lang === 'es' ? 'Es demana: saldos i valoració.' : 'Es demana: saldos i valoració.'}</p></div>} solution={<div><Step label="Balança comercial"><FormulaBox formula="BC = 390 − 425 = −35.000 (dèficit)" /></Step><Step label="Balança serveis"><FormulaBox formula="BS = 178 − 90 = +88.000 (superàvit)" /></Step><Step label="Compte corrent"><FormulaBox formula="SCC = −35 + 88 + 10 + 2 = +65.000" /></Step><Step label="Balança per compte capital + corrent"><FormulaBox formula="SCC + SCK = 65 + 8 = +73.000" /><ResultBox><p>Espanya presenta una capacitat de finançament neta de 73.000 M€ (superàvit exterior). Ha de compensar-se al compte financer.</p></ResultBox></Step></div>} />
            <Exercise num={29} origin={lang === 'es' ? 'Estatal' : 'Estatal'} difficulty={3} tema="Tema 26" statement={<div><p>{lang === 'es' ? 'Un iPhone costa 1.200€ a Espanya i 1.200$ als EUA. TC actual: 1,10 $/€.' : 'Un iPhone costa 1.200€ a Espanya i 1.200$ als EUA. TC actual: 1,10 $/€.'}</p><p className="mt-2 font-semibold">{lang === 'es' ? 'Es demana:' : 'Es demana:'}</p><ol className="list-[lower-alpha] list-inside mt-1 space-y-1"><li>{lang === 'es' ? 'Preu en $ a Espanya vs EUA.' : 'Preu en $ a Espanya vs EUA.'}</li><li>{lang === 'es' ? 'TC d\'equilibri segons PPP.' : 'TC d\'equilibri segons PPP.'}</li><li>{lang === 'es' ? '¿Euro sobrevalorat o infravalorat?' : 'Euro sobrevalorat o infravalorat?'}</li></ol></div>} solution={<div><Step label="a) Preu en $"><FormulaBox formula="Preu Espanya en $ = 1.200€ · 1,10 = 1.320$" /><p>Mateix producte surt més car a Espanya segons TC actual.</p></Step><Step label="b) TC d'equilibri PPP"><FormulaBox formula="TC_PPP = 1.200$/1.200€ = 1,00 $/€" /></Step><Step label="c) Valoració"><InterpretBox><p>TC actual (1,10) &gt; TC_PPP (1,00) → <strong>euro està sobrevalorat</strong> vs $ segons PPP. Esperem depreciació a LT perquè es compleixi PPP (teoria de Cassel 1918).</p></InterpretBox></Step></div>} />
        </div>
    );

    const BlocTreball = () => (
        <div>
            <SectionTitle icon="👥" title={t('bloc.treball')} subtitle={t('bloc.treball.desc')} />
            <Exercise num={30} origin={lang === 'es' ? 'Catalunya' : 'Catalunya'} difficulty={2} tema="Tema 31" statement={<div><p>{lang === 'es' ? 'Mercado laboral:' : 'Mercat laboral:'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>Q^d = 1000 − 50w | Q^o = −200 + 70w</p><p>SMI (salari mínim) = 12€/h</p></div><p className="mt-2 font-semibold">{lang === 'es' ? 'Es demana:' : 'Es demana:'}</p><ol className="list-[lower-alpha] list-inside mt-1 space-y-1"><li>{lang === 'es' ? 'Equilibrio sense SMI.' : 'Equilibri sense SMI.'}</li><li>{lang === 'es' ? 'Efecto del SMI.' : 'Efecte del SMI.'}</li></ol></div>} solution={<div><Step label="a) Equilibri"><FormulaBox formula="Q^d = Q^o: 1000 − 50w = −200 + 70w" /><FormulaBox formula="120w = 1200 → w* = 10€/h, Q* = 500" /></Step><Step label="b) Amb SMI = 12€"><FormulaBox formula="Q^d(12) = 1000 − 50(12) = 400" /><FormulaBox formula="Q^o(12) = −200 + 70(12) = 640" /><FormulaBox formula="Atur = 640 − 400 = 240 treballadors" /><InterpretBox><p>SMI per damunt de l'equilibri genera <strong>excés d'oferta (atur)</strong>. Debat: Card-Krueger (1995, Nobel 2021) relativitzen aquest efecte.</p></InterpretBox></Step></div>} />
            <Exercise num={31} origin={lang === 'es' ? 'Estatal' : 'Estatal'} difficulty={1} tema="Tema 31" statement={<div><p>{lang === 'es' ? 'Dades EPA 2024:' : 'Dades EPA 2024:'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>Població 16+: 40 milions | Actius: 23,5 M | Ocupats: 21 M | Aturats: 2,5 M</p></div><p className="mt-2 font-semibold">Calcula taxes d'activitat, atur i ocupació.</p></div>} solution={<div><Step label="Taxa activitat"><FormulaBox formula="TA = Actius / Pob 16+ = 23,5/40 = 58,75%" /></Step><Step label="Taxa atur"><FormulaBox formula="TU = Aturats / Actius = 2,5/23,5 = 10,64%" /></Step><Step label="Taxa ocupació"><FormulaBox formula="TO = Ocupats / Pob 16+ = 21/40 = 52,5%" /></Step><ResultBox><p>TA=58,75% · TU=10,64% · TO=52,5%. Valors coherents amb les dades reals espanyoles.</p></ResultBox></div>} />
            <Exercise num={32} origin={lang === 'es' ? 'Valencia' : 'València'} difficulty={2} tema="Tema 31" statement={<div><p>{lang === 'es' ? 'Sector A:' : 'Sector A:'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>Producció: 500M€ | Treballadors: 5000 | Cost salarial total: 120M€</p><p>{lang === 'es' ? 'Dos años después' : 'Dos anys després'}: Producció 600M€ | 5200 treb. | Cost 150M€</p></div><p className="mt-2 font-semibold">{lang === 'es' ? 'Calcula productivitat per treballador i Cost Laboral Unitari (CLU) ambdós períodes.' : 'Calcula productivitat per treballador i Cost Laboral Unitari (CLU) ambdós períodes.'}</p></div>} solution={<div><Step label="Productivitat"><FormulaBox formula="P₁ = 500/5000 = 100.000€/treb" /><FormulaBox formula="P₂ = 600/5200 = 115.385€/treb" /><p>Creixement +15,4%</p></Step><Step label="CLU"><FormulaBox formula="CLU = Cost laboral / Producció" /><FormulaBox formula="CLU₁ = 120/500 = 0,24 (24%)" /><FormulaBox formula="CLU₂ = 150/600 = 0,25 (25%)" /><InterpretBox><p>CLU puja (+4%), cosa que pot erosionar competitivitat. La productivitat hauria de créixer més ràpid que els salaris.</p></InterpretBox></Step></div>} />
            <Exercise num={33} origin={lang === 'es' ? 'Estatal' : 'Estatal'} difficulty={3} tema="Tema 30" statement={<div><p>{lang === 'es' ? 'Dades històriques:' : 'Dades històriques:'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>Any 1: atur 5%, inflació 2%</p><p>Any 2: atur 3%, inflació 5% (expansió)</p><p>Any 3: atur 6%, inflació 4% (política monetària contracíclica)</p><p>NAIRU estimat: 5%</p></div><p className="mt-2 font-semibold">Analitza la corba de Phillips i el paper del NAIRU.</p></div>} solution={<div><Step label="Phillips CP"><p>Any 1 → Any 2: baixada atur (5%→3%), puja inflació (2%→5%). Corba Phillips CP: relació inversa.</p></Step><Step label="NAIRU i Phillips LP"><InterpretBox><p>El NAIRU (5%) és la taxa d'atur consistent amb inflació estable. Any 2 (atur 3% &lt; NAIRU): pressió inflacionista. Any 3: atur torna per damunt del NAIRU, inflació desaccelera.</p><p className="mt-1">A LT la corba de Phillips és vertical al NAIRU (Friedman-Phelps 1967-68). Explicació d'expectatives racionals (Lucas 1976).</p></InterpretBox></Step></div>} />
        </div>
    );

    const BlocOrganitzacio = () => (
        <div>
            <SectionTitle icon="🧠" title={t('bloc.organitzacio')} subtitle={t('bloc.organitzacio.desc')} />
            <Exercise num={34} origin={lang === 'es' ? 'Estatal' : 'Estatal'} difficulty={2} tema="Tema 57" statement={<div><p>{lang === 'es' ? 'Matriz de decisión (benefici en milers €):' : 'Matriu de decisió (benefici en milers €):'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>Alternatives: A, B, C. Estats: Baix, Mitjà, Alt</p><p>A: 20, 30, 40 | B: 10, 50, 70 | C: −20, 60, 120</p></div><p className="mt-2 font-semibold">Aplica Laplace, Wald, Maximax i Hurwicz (α=0,6).</p></div>} solution={<div><Step label="Laplace (equiprobabilitat)"><FormulaBox formula="A=30 | B=43,3 | C=53,3 → escull C" /></Step><Step label="Wald (pessimista)"><FormulaBox formula="min A=20 | B=10 | C=−20 → escull A" /></Step><Step label="Maximax (optimista)"><FormulaBox formula="max A=40 | B=70 | C=120 → escull C" /></Step><Step label="Hurwicz α=0,6"><FormulaBox formula="H = 0,6·max + 0,4·min" /><FormulaBox formula="A: 0,6·40+0,4·20 = 32" /><FormulaBox formula="B: 0,6·70+0,4·10 = 46" /><FormulaBox formula="C: 0,6·120+0,4·(−20) = 64 → escull C" /></Step><ResultBox><p>Les estratègies òptimes depenen del criteri. Un decisor pessimista triarà A, optimista triarà C.</p></ResultBox></div>} />
            <Exercise num={35} origin={lang === 'es' ? 'Catalunya' : 'Catalunya'} difficulty={3} tema="Tema 57" statement={<div><p>{lang === 'es' ? 'Decisión: llançar un nou producte (inversió 100k€) o no.' : 'Decisió: llançar un nou producte (inversió 100k€) o no.'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>{lang === 'es' ? 'Probabilitats i retorns:' : 'Probabilitats i retorns:'}</p><p>Demanda alta (p=0,4): +400k | Mitja (p=0,4): +150k | Baixa (p=0,2): −80k</p></div><p className="mt-2 font-semibold">{lang === 'es' ? 'Calcula VME i decideix.' : 'Calcula VME i decideix.'}</p></div>} solution={<div><Step label="VME llançar"><FormulaBox formula="VME = −100 + 0,4·400 + 0,4·150 + 0,2·(−80)" /><FormulaBox formula="VME = −100 + 160 + 60 − 16 = +104k€" /></Step><Step label="VME no llançar"><FormulaBox formula="VME = 0" /></Step><Step label="Decisió"><ResultBox><p>Com VME llançar (+104) &gt; VME no llançar (0), <strong>llançar el producte</strong>. Seguint Raiffa (1968) — <em>backward induction</em>.</p></ResultBox></Step></div>} />
            <Exercise num={36} origin={lang === 'es' ? 'Valencia' : 'València'} difficulty={2} tema="Tema 44" statement={<div><p>{lang === 'es' ? 'Projecte amb activitats:' : 'Projecte amb activitats:'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>A: 2d (inici) | B: 4d (després A) | C: 3d (després A) | D: 2d (després B) | E: 1d (després C i D)</p></div><p className="mt-2 font-semibold">{lang === 'es' ? 'Identifica el camí crític i calcula folgances.' : 'Identifica el camí crític i calcula folgances.'}</p></div>} solution={<div><Step label="Camins possibles"><p>Camí 1: A → B → D → E = 2+4+2+1 = <strong>9 dies</strong></p><p>Camí 2: A → C → E = 2+3+1 = 6 dies</p></Step><Step label="Camí crític"><ResultBox><p>Camí crític: <strong>A-B-D-E (9 dies)</strong>. Durada mínima del projecte.</p></ResultBox></Step><Step label="Folgances"><FormulaBox formula="Folgança C = 9 − 6 = 3 dies" /><p>Activitats del camí crític (A, B, D, E) tenen folgança zero. Qualsevol retard en C fins a 3 dies no afecta el projecte.</p></Step></div>} />
            <Exercise num={37} origin={lang === 'es' ? 'Madrid' : 'Madrid'} difficulty={3} tema="Tema 58" statement={<div><p>{lang === 'es' ? 'Empresa de comerç online en expansió:' : 'Empresa de comerç online en expansió:'}</p><div className="mt-2 text-xs space-y-1 bg-slate-50 p-3 rounded-lg"><p>F: marca reconeguda, logística pròpia | D: dependència d'1 proveïdor | O: creixement e-commerce 15%/any | A: Amazon, Shein</p></div><p className="mt-2 font-semibold">Elabora DAFO i matriu CAME d'acció.</p></div>} solution={<div><Step label="DAFO"><div className="grid grid-cols-2 gap-2 text-xs"><div className="p-2 bg-green-50 rounded"><b>F</b>: marca, logística</div><div className="p-2 bg-red-50 rounded"><b>D</b>: dependència prov.</div><div className="p-2 bg-blue-50 rounded"><b>O</b>: creixement sector</div><div className="p-2 bg-amber-50 rounded"><b>A</b>: gegants digitals</div></div></Step><Step label="CAME"><InterpretBox><p><b>Corregir</b> debilitats: diversificar proveïdors.</p><p><b>Afrontar</b> amenaces: diferenciació, nínxol, qualitat.</p><p><b>Mantenir</b> fortaleses: invertir en logística.</p><p><b>Explotar</b> oportunitats: expansió geogràfica, canals socials.</p></InterpretBox></Step><Step label="Recomanació"><ResultBox><p>Estratègia de diferenciació i nínxol; aprofitar fortaleses operatives davant gegants, assegurar diversitat proveïdors.</p></ResultBox></Step></div>} />
        </div>
    );

    // ════════════════════════════════════════════════════════════════
    // NAVIGATION AND RENDER
    // ════════════════════════════════════════════════════════════════
    var headerSections = [
        { id: 'inicio', label: t('sec.inicio'), emoji: '🏠' },
        { id: 'micro', label: t('sec.micro'), emoji: '📊' },
        { id: 'macro', label: t('sec.macro'), emoji: '🌐' },
        { id: 'finances', label: t('sec.finances'), emoji: '🏦' },
        { id: 'empresa', label: t('sec.empresa'), emoji: '🏢' },
        { id: 'comptabilitat', label: t('sec.comptabilitat'), emoji: '📒' },
        { id: 'comerc', label: t('sec.comerc'), emoji: '🌍' },
        { id: 'treball', label: t('sec.treball'), emoji: '👥' },
        { id: 'organitzacio', label: t('sec.organitzacio'), emoji: '🧠' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}
                setIdioma={setIdioma}
                currentApp="oposicions-practica"
                sections={headerSections}
                currentSection={section}
                setSection={setSection}
            />

            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}
                {section === 'micro' && <BlocMicro />}
                {section === 'macro' && <BlocMacro />}
                {section === 'finances' && <BlocFinances />}
                {section === 'empresa' && <BlocEmpresa />}
                {section === 'comptabilitat' && <BlocComptabilitat />}
                {section === 'comerc' && <BlocComerc />}
                {section === 'treball' && <BlocTreball />}
                {section === 'organitzacio' && <BlocOrganitzacio />}
            </main>

            <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
            <PdeFooter appEmoji="🧮" appName={t('footer.appname')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<PracticaApp />, document.getElementById('root'));
    </script>
</body>
</html>
