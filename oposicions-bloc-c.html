                    </p>
                    <p>
                        <strong>d) Informació de preus:</strong> els mercats financers generen preus (tipus d'interés, cotitzacions borsàries, primes de risc) que transmeten <strong>informació</strong> sobre la valoració d'actius, la solvència d'emissors i les expectatives dels agents.
                    </p>
                    <p>
                        <strong>e) Sistema de pagaments:</strong> el sistema financer proporciona els mitjans i infraestructures per a realitzar transaccions (transferències, targetes, sistemes de compensació i liquidació).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Components del sistema financer" color="amber">
                    <p>
                        El sistema financer s'articula en quatre components principals: (1) <strong>intermediaris financers</strong> (institucions que canalitzen fons); (2) <strong>mercats financers</strong> (on es negocien els actius); (3) <strong>actius o instruments financers</strong> (títols que representen drets i obligacions); i (4) <strong>autoritats supervisores</strong> (institucions públiques que regulen i vigilen el correcte funcionament del sistema).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 2 */}
            <Card title="2. Els intermediaris financers" icon="📘">
                <TheoryBlock title="2.1. Intermediaris bancaris" color="blue">
                    <p>
                        Els <strong>intermediaris bancaris</strong> són entitats l'activitat principal de les quals consisteix a <strong>captar dipòsits del públic i concedir crèdits</strong>. Són els únics que poden crear diners bancaris (dipòsits a la vista). Inclouen:
                    </p>
                    <p>
                        <strong>Bancs comercials:</strong> societats anònimes amb ànim de lucre que constitueixen el nucli del sistema. Capten dipòsits (a la vista, d'estalvi, a termini), concedeixen préstecs (hipotecaris, al consum, a empreses) i ofereixen serveis financers (targetes, transferències, canvi de divises). A Espanya operen grans bancs sistèmics (Santander, BBVA, CaixaBank) i entitats mitjanes i xicotetes.
                    </p>
                    <p>
                        <strong>Caixes d'estalvis:</strong> històricament entitats de caràcter fundacional i vocació social, sotmeses a una profunda reestructuració després de la crisi de 2008-2012. La majoria es van transformar en bancs o van ser absorbides, subsistint únicament dues caixes (Caixa Ontinyent i Caixa Pollença) i les fundacions bancàries hereves de la seua obra social.
                    </p>
                    <p>
                        <strong>Cooperatives de crèdit:</strong> entitats de propietat cooperativa (un soci, un vot) que combinen activitat financera amb vinculació al sector agrari o professional (caixes rurals, caixes professionals). Exemple: Grupo Caja Rural, Cajamar.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Intermediaris no bancaris" color="green">
                    <p>
                        Els intermediaris financers no bancaris <strong>no capten dipòsits del públic</strong> però canalitzen estalvi cap a la inversió a través d'altres mecanismes:
                    </p>
                    <p>
                        <strong>Companyies d'assegurances:</strong> capten primes dels assegurats i les inverteixen, cobrint riscos (vida, salut, automòbil, responsabilitat civil). Mutualitzen el risc entre els assegurats (llei dels grans nombres).
                    </p>
                    <p>
                        <strong>Fons de pensions:</strong> vehicles d'estalvi a llarg termini per a la jubilació, gestionats per entitats gestores i controlats per comissions de control. Inverteixen en renda fixa, variable i immobiliària.
                    </p>
                    <p>
                        <strong>Fons d'inversió (IIC):</strong> patrimonis col·lectius constituïts per les aportacions de múltiples inversors (partícips), gestionats professionalment per societats gestores (SGIIC). Permeten la diversificació i l'accés a mercats a xicotets estalviadors.
                    </p>
                    <p>
                        <strong>Societats i agències de valors:</strong> intermediaris especialitzats en la compravenda de valors en els mercats financers (brókers i dílers).
                    </p>
                    <p>
                        <strong>Empreses de leasing i factoring:</strong> financen l'adquisició de béns d'equip (leasing = arrendament financer) i avancen el cobrament de factures (factoring).
                    </p>
                    <p>
                        <strong>Capital risc (venture capital / private equity):</strong> inversió en el capital d'empreses no cotitzades, generalment en fases inicials (venture capital) o de reestructuració (private equity), a canvi de participació accionarial.
                    </p>
                    <p>
                        <strong>Fintech:</strong> empreses tecnològiques que apliquen la innovació digital als serveis financers (pagaments mòbils, crowdfunding, roboadvisors, criptoactius, insurtech). Competeixen amb els intermediaris tradicionals i acceleren la transformació digital del sector.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Funcions de la intermediació" color="amber">
                    <p>
                        La intermediació financera genera valor econòmic en reduir els <strong>costos de transacció</strong> (economies d'escala en l'avaluació de riscos), <strong>transformar actius</strong> (terminis, imports, riscos), <strong>diversificar riscos</strong> (cartera àmplia de préstecs) i produir <strong>informació</strong> sobre la qualitat creditícia dels prestataris. Com va demostrar <strong>Diamond (1984)</strong> en el seu model d'intermediació delegada, els bancs actuen com a «monitors delegats» dels estalviadors, reduint el problema d'informació asimètrica entre prestadors i prestataris.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 3 */}
            <Card title="3. Els actius financers" icon="📘">
                <TheoryBlock title="3.1. Característiques" color="blue">
                    <p>
                        Els <strong>actius financers</strong> són títols o contractes que representen un <strong>dret</strong> per al seu titular (creditor o inversor) i una <strong>obligació</strong> per al seu emissor. Es caracteritzen per tres atributs fonamentals que configuren l'anomenat <strong>triangle financer</strong>:
                    </p>
                    <p>
                        <strong>Liquiditat:</strong> facilitat i rapidesa amb què un actiu pot convertir-se en diners sense pèrdua significativa de valor. L'efectiu té liquiditat màxima; un immoble, mínima.
                    </p>
                    <p>
                        <strong>Rendibilitat:</strong> rendiment que obté l'inversor, bé en forma d'interessos (renda fixa), dividends (accions) o plusvàlues (guany de capital per la venda a un preu superior al de compra).
                    </p>
                    <p>
                        <strong>Risc:</strong> probabilitat que el rendiment efectiu diferisca de l'esperat. Inclou risc de crèdit (impagament), risc de mercat (fluctuació de preus), risc de tipus d'interés i risc de liquiditat.
                    </p>
                    <p>
                        El <strong>principi fonamental</strong> és que no és possible maximitzar simultàniament les tres característiques: un actiu molt líquid i segur oferirà baixa rendibilitat (dipòsit bancari), mentre que un actiu rendible serà menys líquid o més arriscat (accions, capital risc).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Renda fixa" color="green">
                    <p>
                        Els actius de <strong>renda fixa</strong> representen préstecs de l'inversor a l'emissor, que es compromet a tornar el capital (valor nominal) en una data determinada (venciment) i a pagar periòdicament un interés (cupó). Principals instruments:
                    </p>
                    <p>
                        <strong>Lletres del Tresor:</strong> valors de deute públic a curt termini (3, 6, 9 o 12 mesos), emesos al descompte (es compren per sota del valor nominal i es cobra el nominal al venciment). Són els actius més segurs i líquids del mercat espanyol.
                    </p>
                    <p>
                        <strong>Bons de l'Estat:</strong> deute públic a mitjà termini (3 i 5 anys), amb cupó anual.
                    </p>
                    <p>
                        <strong>Obligacions de l'Estat:</strong> deute públic a llarg termini (10, 15, 30 i 50 anys), amb cupó anual.
                    </p>
                    <p>
                        <strong>Pagarés d'empresa:</strong> deute corporatiu a curt termini, emés al descompte.
                    </p>
                    <p>
                        Conceptes clau: <strong>valor nominal</strong> (import que es torna al venciment), <strong>cupó</strong> (interés periòdic), <strong>TIR</strong> (taxa interna de rendiment: rendibilitat efectiva que iguala el preu de mercat amb el valor present dels fluxos futurs). Existeix una <strong>relació inversa</strong> entre el preu d'un bo i el tipus d'interés de mercat.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Renda variable" color="amber">
                    <p>
                        Les <strong>accions</strong> representen una participació alíquota en el <strong>capital social</strong> d'una societat anònima. Els seus titulars (accionistes) tenen dret a: rebre <strong>dividends</strong> (part del benefici distribuït), obtindre <strong>plusvàlues</strong> (guany per venda a un preu superior al de compra), exercir el <strong>dret de vot</strong> en la junta general d'accionistes i participar en ampliacions de capital (dret de subscripció preferent).
                    </p>
                    <p>
                        Les accions comporten un <strong>risc major</strong> que la renda fixa: no garanteixen rendibilitat (els dividends depenen del benefici empresarial), el seu preu fluctua en el mercat i, en cas de liquidació, els accionistes cobren després de tots els creditors. A canvi, històricament ofereixen una <strong>rendibilitat superior</strong> a llarg termini (prima de risc de la renda variable).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Derivats financers" color="indigo">
                    <p>
                        Els <strong>derivats</strong> són instruments el valor dels quals depén («es deriva») del preu d'un altre actiu subjacent (acció, bo, índex, tipus d'interés, divisa, matèria primera). Principals tipus:
                    </p>
                    <p>
                        <strong>Futurs:</strong> contractes estandarditzats que obliguen a comprar o vendre l'actiu subjacent a un preu i data predeterminats. Es negocien en mercats organitzats (MEFF a Espanya).
                    </p>
                    <p>
                        <strong>Opcions:</strong> atorguen el <strong>dret</strong> (no l'obligació) de comprar (call) o vendre (put) el subjacent a un preu d'exercici (strike) abans de o en la data de venciment, a canvi d'una prima.
                    </p>
                    <p>
                        <strong>Swaps:</strong> acords per a intercanviar fluxos de caixa futurs (tipus d'interés fix per variable, divises, etc.).
                    </p>
                    <p>
                        Els derivats tenen dues funcions principals: <strong>cobertura (hedging)</strong>, per a protegir-se contra riscos de preu, tipus d'interés o tipus de canvi; i <strong>especulació</strong>, per a apostar sobre l'evolució futura dels preus amb un alt grau de palanquejament.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. Altres instruments" color="purple">
                    <p>
                        <strong>Fons d'inversió:</strong> permeten al xicotet estalviador accedir a carteres diversificades gestionades professionalment. Poden ser de renda fixa, renda variable, mixtos, garantits, etc.
                    </p>
                    <p>
                        <strong>ETFs (Exchange Traded Funds):</strong> fons cotitzats que repliquen un índex borsari i es negocien en borsa com a accions, combinant la diversificació d'un fons amb la liquiditat intradía.
                    </p>
                    <p>
                        <strong>Productes estructurats:</strong> combinacions d'actius de renda fixa i derivats que ofereixen perfils de rendibilitat-risc personalitzats, encara que amb complexitat i menor transparència.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 4 */}
            <Card title="4. Els mercats financers" icon="📘">
                <TheoryBlock title="4.1. Classificació" color="blue">
                    <p>
                        Els mercats financers es classifiquen segons distints criteris:
                    </p>
                    <p>
                        <strong>Per termini:</strong> mercats <strong>monetaris</strong> (actius a curt termini, generalment menys de 18 mesos: Lletres del Tresor, pagarés, interbancari) vs. mercats <strong>de capitals</strong> (actius a llarg termini: bons, obligacions, accions).
                    </p>
                    <p>
                        <strong>Per fase de negociació:</strong> mercats <strong>primaris</strong> o d'emissió (on es col·loquen els actius per primera vegada — OPV, subhastes del Tresor) vs. mercats <strong>secundaris</strong> o de negociació (on es compren i venen actius ja emesos — Borsa de Valors, mercat de deute públic anotat).
                    </p>
                    <p>
                        <strong>Per organització:</strong> mercats <strong>organitzats</strong> (amb regles, cambra de compensació, supervisió: borsa, MEFF) vs. mercats <strong>OTC</strong> (over-the-counter, no organitzats, acords bilaterals: swaps, forwards).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La Borsa de Valors" color="green">
                    <p>
                        La <strong>Borsa de Valors</strong> és el mercat secundari organitzat on es negocien accions de societats cotitzades i altres valors (drets de subscripció, warrants, ETFs). Les seues funcions principals són: proporcionar <strong>liquiditat</strong> als inversors (possibilitat de comprar i vendre en qualsevol moment), oferir una <strong>valoració</strong> objectiva i contínua de les empreses, <strong>canalitzar l'estalvi</strong> cap a la inversió productiva i servir com a <strong>baròmetre</strong> de l'economia.
                    </p>
                    <p>
                        Els principals <strong>índexs borsaris</strong> sintetitzen l'evolució del mercat: <strong>IBEX 35</strong> (35 valors més líquids de les borses espanyoles), <strong>Dow Jones Industrial Average</strong> (30 grans empreses dels EUA), <strong>S&amp;P 500</strong> (500 majors empreses dels EUA, ponderat per capitalització), <strong>EURO STOXX 50</strong> (50 principals empreses de l'eurozona), <strong>Nikkei 225</strong> (Japó) i <strong>FTSE 100</strong> (Regne Unit).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Mercat de deute públic" color="amber">
                    <p>
                        El <strong>mercat de deute públic</strong> és on l'Estat emet i negocia els seus títols de renda fixa (Lletres, Bons i Obligacions). A Espanya, el <strong>Tresor Públic</strong> realitza subhastes periòdiques en el mercat primari, mentre que el mercat secundari de deute públic anotat (gestionat pel Banc d'Espanya i Iberclear) permet la negociació contínua d'aquestos títols. La <strong>rendibilitat del bo a 10 anys</strong> és la referència fonamental del mercat de renda fixa i base per al càlcul de la prima de risc.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. Mercat interbancari" color="indigo">
                    <p>
                        El <strong>mercat interbancari</strong> és un mercat monetari majorista on les entitats de crèdit es presten diners entre si a molt curt termini (des d'un dia — overnight — fins a un any). El tipus d'interés de referència d'aquest mercat a l'eurozona és l'<strong>Euríbor</strong> (Euro Interbank Offered Rate), que serveix com a base per a la fixació dels tipus d'interés dels préstecs hipotecaris a tipus variable i altres productes financers. Des de 2019, el BCE promou l'€STR (Euro Short-Term Rate) com a tipus de referència alternatiu.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. Mercat de divises (Forex)" color="purple">
                    <p>
                        El <strong>mercat de divises (Foreign Exchange o Forex)</strong> és el mercat financer més gran del món per volum de negociació (més de 7 bilions de dòlars diaris). S'hi intercanvien monedes nacionals i es determinen els <strong>tipus de canvi</strong>. És un mercat global, descentralitzat, que opera les 24 hores del dia. Aquest mercat serà ampliat en el Bloc D (economia internacional), però convé assenyalar el seu paper com a component essencial del sistema financer global.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.6. Eficiència dels mercats" color="rose">
                    <p>
                        La <strong>hipòtesi dels mercats eficients</strong> (HME, Eugene Fama, 1970) sosté que els preus dels actius financers reflecteixen en tot moment tota la informació disponible. Fama distingeix tres formes d'eficiència: <strong>dèbil</strong> (els preus reflecteixen tota la informació històrica — l'anàlisi tècnica no genera rendiments superiors), <strong>semiforta</strong> (reflecteixen tota la informació pública — l'anàlisi fonamental tampoc no és sistemàticament útil) i <strong>forta</strong> (reflecteixen fins i tot la informació privada — l'insider trading no genera avantatge).
                    </p>
                    <p>
                        Les <strong>crítiques</strong> a la HME provenen de les <strong>finances conductuals</strong> (behavioral finance): <strong>Kahneman</strong> (Premi Nobel 2002) i <strong>Tversky</strong> van demostrar que els agents cometen biaixos cognitius sistemàtics (excés de confiança, aversió a les pèrdues, efecte ramat); <strong>Shiller</strong> (Premi Nobel 2013) va documentar l'existència de <strong>bombolles especulatives</strong> (excessiva volatilitat no explicable per fonamentals), com la bombolla punt-com (2000) i la bombolla immobiliària (2008).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 5 */}
            <Card title="5. Regulació i supervisió" icon="📘">
                <TheoryBlock title="5.1. Justificació" color="blue">
                    <p>
                        La regulació del sistema financer es justifica per: el <strong>risc sistèmic</strong> (la fallida d'una entitat pot contagiar el sistema sencer — efecte dominó, too big to fail), la <strong>protecció dels estalviadors</strong> (que confien els seus fons als intermediaris), l'<strong>estabilitat financera</strong> com a bé públic (les crisis financeres tenen costos macroeconòmics enormes) i l'existència d'<strong>informació asimètrica</strong> entre intermediaris i depositants (selecció adversa, risc moral).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Banc d'Espanya" color="green">
                    <p>
                        El <strong>Banc d'Espanya</strong> és el banc central nacional i el principal supervisor del sistema bancari espanyol. Les seues funcions inclouen: supervisió prudencial de les entitats de crèdit, gestió de les reserves de divises, promoció del bon funcionament del sistema de pagaments, elaboració d'estadístiques i assessorament al Govern. Des de 2014, comparteix la supervisió bancària amb el <strong>Mecanisme Únic de Supervisió (MUS o SSM)</strong> del BCE, que supervisa directament les entitats sistèmiques de l'eurozona.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. CNMV" color="amber">
                    <p>
                        La <strong>Comissió Nacional del Mercat de Valors (CNMV)</strong> és l'organisme encarregat de la supervisió i inspecció dels <strong>mercats de valors</strong> i de l'activitat de quantes persones físiques i jurídiques hi participen. Vetla per la transparència, la correcta formació de preus, la protecció dels inversors i la prevenció de l'ús d'informació privilegiada (insider trading) i la manipulació del mercat.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. DGSFP" color="indigo">
                    <p>
                        La <strong>Direcció General d'Assegurances i Fons de Pensions (DGSFP)</strong> supervisa les entitats asseguradores, reasseguradores, els fons de pensions i els mediadors d'assegurances, vetlant per la solvència de les entitats i la protecció dels assegurats i partícips.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.5. Regulació internacional: Basilea III" color="purple">
                    <p>
                        Els <strong>Acords de Basilea</strong> (Comité de Supervisió Bancària de Basilea, BIS) estableixen estàndards internacionals de regulació prudencial bancària. <strong>Basilea III</strong> (aprovat després de la crisi de 2008, implementació gradual fins a 2028) reforça tres pilars: <strong>capital</strong> (major quantitat i qualitat del capital regulatori — CET1 ≥ 4,5 %, amb coixins addicionals), <strong>liquiditat</strong> (LCR — ràtio de cobertura de liquiditat a 30 dies; NSFR — ràtio de finançament estable net) i <strong>palanquejament</strong> (ràtio de palanquejament ≥ 3 %).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.6. Unió Bancària europea" color="rose">
                    <p>
                        La <strong>Unió Bancària</strong> de la UE s'articula en tres pilars: (1) el <strong>Mecanisme Únic de Supervisió (MUS/SSM)</strong>, que atribueix al BCE la supervisió directa dels bancs sistèmics de l'eurozona; (2) el <strong>Mecanisme Únic de Resolució (MUR/SRB)</strong>, que gestiona la reestructuració o liquidació ordenada de bancs inviables, minimitzant el cost per als contribuents (bail-in vs. bail-out); i (3) el <strong>Sistema Europeu de Garantia de Dipòsits (SEGD/EDIS)</strong>, encara en fase de negociació, que garantiria els dipòsits dels ciutadans europeus fins a 100.000 € amb independència del país de l'eurozona.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Rellevància curricular" icon="📘">

                    <p>
                        El sistema financer s'emmarca en la matèria d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022) i connecta amb la creixent importància que la LOMLOE atorga a l'<strong>educació financera</strong>. Les competències específiques més directament vinculades són: <strong>CE1</strong> (funcionament del sistema econòmic), <strong>CE4</strong> (educació financera per a la presa de decisions responsables) i <strong>CE5</strong> (anàlisi del context econòmic).

                        Des de la perspectiva competencial, aquest tema contribueix a: <strong>STEM5</strong> (càlcul de rendibilitat, TIR, anàlisi de dades financeres); <strong>CC1-CC2</strong> (comprensió de les institucions reguladores i el seu paper en la protecció ciutadana); <strong>CPSAA5</strong> (presa de decisions informades sobre estalvi i inversió); <strong>CE1-CE2</strong> (esperit emprenedor, comprensió del finançament empresarial); i <strong>CD</strong> (fintech, banca digital). L'educació financera contribueix directament a formar ciutadans capaços de gestionar responsablement les seues finances personals, avaluar críticament els productes financers i comprendre els riscos de l'endeutament.

            {/* ── CONCLUSIÓ ──────────────────────────────────────── */}
            <Card title="Conclusió" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        El sistema financer és la <strong>infraestructura institucional</strong> que permet canalitzar l'estalvi cap a la inversió, transformant terminis, imports i riscos. Els seus tres components essencials —intermediaris, mercats i instruments— operen sota la supervisió d'autoritats reguladores l'objectiu de les quals és preservar l'<strong>estabilitat financera</strong> i protegir els estalviadors.
                    </p>
                    <p>
                        Els <strong>intermediaris bancaris</strong> (bancs, cooperatives) creen diners i constitueixen el nucli del sistema, mentre que els <strong>intermediaris no bancaris</strong> (asseguradores, fons, fintech) amplien i diversifiquen l'oferta de serveis financers. Els <strong>actius financers</strong> es caracteritzen pel triangle liquiditat-rendibilitat-risc, i abasten des de la renda fixa més segura (Lletres del Tresor) fins als derivats més complexos (opcions, swaps). Els <strong>mercats financers</strong> —monetaris i de capitals, primaris i secundaris— proporcionen liquiditat, valoració i informació de preus.
                    </p>
                    <p>

                    <p>
                        <strong>a) Emissió de bitllets i monedes:</strong> el Banc Central deté el <strong>monopoli legal</strong> d'emissió de moneda de curs legal. Aquesta prerrogativa li confereix el control sobre la base monetària (M0) i és la font última de liquiditat del sistema.
                    </p>

                    </p>
                    <p>

                    </p>
                    <p>

                    </p>
                    <p>

                    </p>
                    <p>

                <TheoryBlock title="3.5. Instruments no convencionals" color="pink">
                    <p>
                        Davant la crisi de 2008 i la proximitat al límit inferior zero (<em>zero lower bound</em>), els principals bancs centrals van desplegar instruments no convencionals:
                    </p>
                    <p>
                        <strong>a) Expansió quantitativa (QE — <em>Quantitative Easing</em>):</strong> compra massiva d'actius financers (deute públic i privat) per a injectar liquiditat, reduir els tipus a llarg termini i estimular l'economia. El BCE va implementar l'<strong>APP</strong> (<em>Asset Purchase Programme</em>, 2015) i el <strong>PEPP</strong> (<em>Pandemic Emergency Purchase Programme</em>, 2020), acumulant bilions d'euros en actius.
                    </p>
                    <p>
                        <strong>b) Tipus d'interés negatius:</strong> la facilitat de dipòsit del BCE es va situar en territori negatiu entre 2014 i 2022 (fins a −0,50 %), penalitzant els bancs per mantindre excedents de liquiditat ociosos.
                    </p>
                    <p>
                        <strong>c) TLTRO (<em>Targeted Longer-Term Refinancing Operations</em>):</strong> préstecs a llarg termini condicionats a la concessió de crèdit a empreses i llars, amb tipus potencialment inferiors al tipus oficial (fins i tot negatius), incentivant directament el canal creditici.
                    </p>
                </TheoryBlock>

            {/* Epígraf 4 */}
            <Card title="4. Mecanisme de transmissió de la política monetària" icon="📘">
                <TheoryBlock title="4.1. Canal del tipus d'interés" color="blue">
                    <p>
                        És el canal principal i més directe: el <strong>tipus oficial del BCE</strong> influeix en els <strong>tipus del mercat interbancari</strong> (Euríbor), que al seu torn determinen els <strong>tipus bancaris</strong> aplicats al crèdit i els dipòsits d'empreses i llars. Tipus més baixos → abarateix el crèdit → ↑consum (C) i ↑inversió (I) → ↑demanda agregada (DA) → ↑producció (Y) i possiblement ↑preus (P). La cadena inversa opera amb tipus més alts.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Canal del crèdit" color="green">
                    <p>
                        Més enllà del preu del crèdit (tipus d'interés), aquest canal opera a través de la <strong>disponibilitat i les condicions de finançament</strong>. Quan el Banc Central injecta liquiditat, els bancs disposen de més recursos per a prestar i relaxen les condicions (menors garanties, terminis més llargs). En sentit restrictiu, els bancs endureixen les condicions creditícies, racionant el crèdit a empreses i llars amb major risc. Bernanke i Gertler (1995) van destacar la importància de l'<strong>accelerador financer</strong>: les condicions creditícies amplifiquen els cicles econòmics.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Canal del tipus de canvi" color="amber">
                    <p>
                        Les variacions del tipus d'interés oficial afecten els <strong>fluxos internacionals de capital</strong>: tipus més alts atrauen capital estranger → ↑demanda de la moneda → <strong>apreciació</strong> → encariment de les exportacions i abaratiment de les importacions → ↓exportacions netes (XN). Inversament, tipus més baixos → depreciació → ↑competitivitat exterior → ↑XN. Aquest canal és especialment rellevant en economies obertes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. Canal d'expectatives i confiança" color="violet">
                    <p>
                        Les decisions i comunicacions del Banc Central configuren les <strong>expectatives d'inflació</strong> i d'activitat econòmica dels agents. Un Banc Central creïble que comunica fermament el seu compromís amb l'estabilitat de preus <strong>ancora les expectatives d'inflació</strong>, reduint la incertesa i facilitant la fixació de preus i salaris. La credibilitat del Banc Central és, per tant, un actiu institucional que potencia l'eficàcia de la política monetària.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. Canal de la riquesa" color="pink">
                    <p>
                        Les decisions de política monetària influeixen en els <strong>preus dels actius</strong> (accions, bons, habitatge). Tipus més baixos → ↑preus d'actius → les llars perceben un augment de la seua riquesa (<strong>efecte riquesa</strong>) → ↑consum. Aquest canal va ser especialment rellevant durant el QE, quan la compra massiva d'actius per part dels bancs centrals va impulsar les cotitzacions borsàries i els preus immobiliaris, encara que també va suscitar debats sobre l'augment de la <strong>desigualtat de riquesa</strong>.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 5 */}
            <Card title="5. Política monetària expansiva i restrictiva" icon="📘">
                <TheoryBlock title="5.1. Política monetària expansiva" color="blue">
                    <p>
                        S'aplica en contextos de <strong>recessió, atur elevat o risc deflacionari</strong>. El Banc Central <strong>↓tipus d'interés</strong> i/o <strong>↑liquiditat</strong> (compra d'actius, reducció de reserves obligatòries) → ↑crèdit disponible → ↑inversió empresarial (I) i ↑consum de les llars (C) → ↑demanda agregada (DA) → ↑producció (Y) i ↑ocupació. El cost potencial és un increment de la inflació (↑P) si l'economia s'acosta a la plena ocupació.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Política monetària restrictiva" color="green">
                    <p>
                        S'aplica en contextos d'<strong>inflació elevada o sobreescalfament econòmic</strong>. El Banc Central <strong>↑tipus d'interés</strong> i/o <strong>↓liquiditat</strong> (venda d'actius, augment de reserves obligatòries) → ↓crèdit → ↓inversió (I) i ↓consum (C) → ↓demanda agregada (DA) → ↓pressió inflacionària. El cost potencial és una desacceleració econòmica (↓Y) i un augment de l'atur a curt termini. El procés d'enduriment monetari del BCE en 2022-2023 (de 0 % a 4,50 % en el tipus de dipòsit) exemplifica aquesta política.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Trampa de la liquiditat" color="amber">
                    <p>
                        Concepte formulat per <strong>Keynes</strong>: quan els tipus d'interés se situen en nivells pròxims a zero (<em>zero lower bound</em>), la política monetària convencional perd eficàcia. Els agents prefereixen mantindre liquiditat en lloc d'invertir o prestar, perquè el cost d'oportunitat és nul i esperen que els tipus puguen pujar. En aquesta situació, la injecció de liquiditat addicional no es tradueix en crèdit ni en despesa: els diners queden «atrapats» en el sistema bancari. Això justifica el recurs a <strong>instruments no convencionals</strong> (QE, tipus negatius, TLTRO) i reforça el paper de la <strong>política fiscal</strong> com a estímul alternatiu.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. La regla de Taylor" color="violet">
                    <p>
                        <strong>John Taylor</strong> (1993) va proposar una regla normativa per a guiar la fixació del tipus d'interés oficial: <strong>i = r* + π + α(π − π*) + β(Y − Y*)</strong>, on <em>i</em> és el tipus d'interés nominal objectiu, <em>r*</em> és el tipus d'interés real d'equilibri, <em>π</em> és la inflació observada, <em>π*</em> és l'objectiu d'inflació, <em>Y</em> és la producció efectiva i <em>Y*</em> és la producció potencial. Amb els coeficients originals (α = β = 0,5), la regla prescriu pujar els tipus quan la inflació supera l'objectiu o quan la producció supera el seu potencial, i viceversa. Encara que cap banc central l'aplica mecànicament, la regla de Taylor serveix com a <strong>referència analítica</strong> àmpliament utilitzada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.5. Debat PM vs. PF: monetaristes i keynesians" color="pink">
                    <p>
                        Els <strong>monetaristes</strong> (<strong>Friedman</strong>) defensen la primacia de la política monetària: «la inflació és sempre i a tot arreu un fenomen monetari», i advoquen per regles monetàries estables enfront de la discrecionalitat. Els <strong>keynesians</strong> subratllen els límits de la PM (trampa de la liquiditat, retards, incertesa en la transmissió) i defensen el paper actiu de la <strong>política fiscal</strong> per a estabilitzar la demanda agregada, especialment en recessions profundes. En la pràctica, la <strong>coordinació</strong> entre ambdues polítiques (<em>policy mix</em>) és essencial: la crisi de 2008-2012 i la pandèmia de 2020 van demostrar que PM i PF han d'actuar conjuntament per a maximitzar la seua eficàcia.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 6 */}
            <Card title="6. Rellevància curricular" icon="📘">

                    </p>
                    <p>

                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓ ──────────────────────────────────────── */}
            <Card title="Conclusió" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        El Banc Central és l'<strong>autoritat monetària</strong> que garanteix l'estabilitat de preus i la solidesa del sistema financer. Les seues funcions —emissió monetària, política monetària, prestador d'última instància, banc de l'Estat, gestió de reserves i supervisió bancària— el converteixen en una peça institucional clau de qualsevol economia moderna.
                    </p>
                    <p>

                    </p>
                    <p>
                        El <strong>mecanisme de transmissió</strong> opera a través de múltiples canals —tipus d'interés, crèdit, tipus de canvi, expectatives i riquesa—, traslladant les decisions del BCE a l'economia real. La <strong>política monetària expansiva</strong> estimula la demanda però pot generar inflació, mentre que la <strong>restrictiva</strong> controla els preus però pot frenar el creixement. La <strong>regla de Taylor</strong> proporciona un marc analític de referència. El debat entre monetaristes i keynesians subratlla la necessitat d'un <em>policy mix</em> adequat, combinant PM i PF segons el context macroeconòmic.
                    </p>
                </div>
            </Card>

                <TheoryBlock title="2.3. Inflació monetària (monetarisme)" color="amber">
                    <p>
                        <strong>Milton Friedman</strong> va sintetitzar la posició monetarista amb la seua cèlebre afirmació: <em>«la inflació és sempre i a tot arreu un fenomen monetari»</em>. Segons l'<strong>equació quantitativa dels diners</strong> (Fisher): <strong>M · V = P · Y</strong>, on M és la quantitat de diners, V la velocitat de circulació, P el nivell de preus i Y la producció real. Si V és estable a llarg termini i Y tendeix a la plena ocupació, un augment de l'oferta monetària (ΔM) es tradueix proporcionalment en un augment dels preus (ΔP). La implicació de política és clara: controlar l'oferta monetària és condició necessària i suficient per a controlar la inflació.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Inflació estructural" color="violet">
                    <p>

                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Inflació importada" color="pink">

                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.6. Expectatives d'inflació" color="emerald">
                    <p>
                        Les <strong>expectatives d'inflació</strong> dels agents econòmics poden convertir-se en una <strong>profecia autocomplida</strong>: si treballadors, empreses i inversors esperen que els preus pugen, incorporen aqueixa expectativa a les seues decisions (demandes salarials, fixació de preus, tipus d'interés), generant efectivament la inflació esperada.
                    </p>
                    <p>
                        <strong>Friedman</strong> (1968) va formalitzar les <strong>expectatives adaptatives</strong>: els agents ajusten les seues expectatives en funció de la inflació passada recent. <strong>Lucas</strong> i <strong>Muth</strong> van proposar les <strong>expectatives racionals</strong>: els agents utilitzen tota la informació disponible (inclosa la política econòmica anunciada) per a formar les seues expectatives, la qual cosa limita la capacitat de la política monetària per a generar efectes reals sistemàtics (només les sorpreses monetàries afecten la producció).

                    </p>

                <TheoryBlock title="3.4. Pèrdua de competitivitat exterior" color="violet">

                </TheoryBlock>

                    </p>

                <TheoryBlock title="4.1. Phillips original (1958)" color="blue">
                    <p>
                        <strong>A.W. Phillips</strong> (1958) va documentar empíricament una <strong>relació inversa estable entre la taxa de variació dels salaris nominals i la taxa d'atur</strong> al Regne Unit durant el període 1861-1957. A menor atur, major pressió a l'alça sobre els salaris (major poder negociador dels treballadors), i viceversa.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Samuelson i Solow (1960)" color="green">
                    <p>
                        <strong>Samuelson i Solow</strong> van reinterpretar la relació de Phillips com un <strong><em>trade-off</em> entre inflació i atur</strong>: les autoritats podien triar entre menor atur a costa de major inflació, o menor inflació a costa de major atur. La corba de Phillips es va convertir així en un «menú d'opcions» per als <em>policy-makers</em>, suggerint que existia una relació explotable de forma permanent.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Crítica de Friedman i Phelps (1968)" color="amber">
                    <p>
                        <strong>Friedman</strong> (1967/68) i <strong>Phelps</strong> (1967) van qüestionar l'estabilitat del trade-off a llarg termini. Van introduir el concepte de <strong>taxa natural d'atur</strong> (<strong>NAIRU</strong> — <em>Non-Accelerating Inflation Rate of Unemployment</em>): el nivell d'atur compatible amb una inflació estable, determinat per factors estructurals del mercat laboral. Van formular la <strong>corba de Phillips augmentada per expectatives</strong>: a curt termini pot existir un trade-off si la inflació és inesperada, però a llarg termini els agents ajusten les seues expectatives i l'atur retorna a la seua taxa natural. La corba de Phillips a llarg termini és <strong>vertical</strong> en la NAIRU: no hi ha trade-off permanent entre inflació i atur.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. Lucas i la crítica de Lucas (1976)" color="violet">
                    <p>
                        <strong>Robert Lucas</strong> (1976) va radicalitzar la crítica amb el supòsit d'<strong>expectatives racionals</strong>: si els agents anticipen correctament la política monetària, fins i tot el trade-off a curt termini desapareix (només les <strong>sorpreses monetàries</strong> tenen efectes reals). La <strong>crítica de Lucas</strong> advertia que els models economètrics basats en relacions històriques (com la corba de Phillips original) no són vàlids per a avaluar canvis de política, perquè els paràmetres del model canvien quan canvia la regla de política.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. L'estanflació dels anys 70" color="pink">
                    <p>
                        Els <strong>shocks petroliers de 1973 i 1979</strong> van provocar simultàniament alta inflació i alt atur (<strong>estanflació</strong>), una combinació que la corba de Phillips original no podia explicar (preveia una relació inversa, no simultània). L'estanflació va constituir la <strong>refutació empírica</strong> del trade-off simple de Samuelson-Solow i va validar les prediccions de Friedman i Phelps: la inflació s'havia accelerat perquè les expectatives adaptatives havien desplaçat la corba de Phillips a curt termini cap amunt, mentre que l'atur es mantenia elevat pel shock d'oferta.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 5 */}
            <Card title="5. Polítiques antiinflacionàries" icon="📘">
                <TheoryBlock title="5.1. Política monetària restrictiva" color="blue">
                    <p>
                        L'instrument principal: el Banc Central <strong>↑tipus d'interés</strong> → ↓crèdit → ↓consum i inversió → ↓demanda agregada → ↓pressió sobre els preus. És la ferramenta més directa i eficaç contra la inflació de demanda, però comporta un <strong>cost a curt termini</strong> en termes de menor creixement i major atur (ràtio de sacrifici). L'enduriment del BCE en 2022-2023 (de 0 % a 4,50 %) i de la Fed (de 0,25 % a 5,50 %) exemplifiquen aquesta política davant el brot inflacionari postpandèmia.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Política fiscal restrictiva" color="green">
                    <p>
                        <strong>↓despesa pública (G)</strong> i/o <strong>↑impostos (T)</strong> redueixen la demanda agregada i contribueixen a moderar la inflació. La consolidació fiscal és especialment rellevant quan la inflació té un component de demanda alimentat per un dèficit públic excessiu. No obstant això, la política fiscal té <strong>retards més llargs</strong> (procés legislatiu) i està subjecta a pressions polítiques que dificulten l'adopció de mesures impopulars.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Polítiques de rendes" color="amber">
                    <p>
                        Consisteixen en el <strong>control directe de preus i salaris</strong> per part del govern: congelació de preus, topalls salarials, pactes socials entre govern, sindicats i patronal. Poden ser útils a <strong>curt termini</strong> per a trencar l'espiral salaris-preus i ancorar expectatives, però l'evidència històrica mostra que són <strong>poc eficaces a llarg termini</strong>: generen escassetat, mercats negres i distorsions en l'assignació de recursos quan els controls es mantenen massa temps.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Polítiques d'oferta" color="violet">
                    <p>
                        Aborden les causes estructurals de la inflació actuant sobre la capacitat productiva de l'economia: <strong>↑competència</strong> (desregulació, política antitrust), <strong>↑productivitat</strong> (inversió en I+D+i, formació, infraestructures), <strong>flexibilització de mercats</strong> (laboral, béns, serveis), reducció de traves burocràtiques. A diferència de les polítiques de demanda, les polítiques d'oferta permeten reduir la inflació <strong>sense sacrificar creixement</strong> (desplaçament de l'OA cap a la dreta), però els seus efectes es manifesten a <strong>mitjà i llarg termini</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.5. Inflation targeting" color="pink">
                    <p>
                        L'<strong><em>inflation targeting</em></strong> (fixació d'objectius explícits d'inflació) s'ha convertit en el marc dominant de política monetària des dels anys 90. El Banc Central anuncia públicament un <strong>objectiu numèric d'inflació</strong> (2 % el BCE, 2 % la Fed), es compromet a aconseguir-lo i rendeix comptes del seu compliment. La transparència i la credibilitat del compromís permeten <strong>ancorar les expectatives d'inflació</strong> dels agents, reduint la inèrcia inflacionària i els costos de desinflació. L'evidència empírica mostra que els països amb <em>inflation targeting</em> han aconseguit taxes d'inflació més baixes i estables que aquells sense un marc explícit.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 6 */}

                    </p>

                    </p>
                </TheoryBlock>

            {/* ── CONCLUSIÓ ──────────────────────────────────────── */}
            <Card title="Conclusió" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La inflació és un <strong>fenomen macroeconòmic complex</strong> amb múltiples causes (demanda, costos, monetària, estructural, importada, expectatives) i efectes significatius sobre el benestar econòmic: pèrdua de poder adquisitiu, redistribució arbitrària de renda, incertesa, pèrdua de competitivitat i distorsions fiscals. El seu mesurament mitjançant l'<strong>IPC</strong>, el <strong>deflactor del PIB</strong> i la <strong>inflació subjacent</strong> proporciona les ferramentes analítiques necessàries per al seu seguiment i diagnòstic.
                    </p>
                    <p>
                        La <strong>corba de Phillips</strong> resumeix l'evolució del pensament macroeconòmic: del trade-off simple (Samuelson-Solow) a la taxa natural d'atur (Friedman-Phelps, NAIRU) i les expectatives racionals (Lucas). L'estanflació dels anys 70 va demostrar que no existeix un trade-off permanent explotable per les autoritats.
                    </p>
                    <p>
                        Les <strong>polítiques antiinflacionàries</strong> inclouen la política monetària restrictiva (instrument principal), la política fiscal restrictiva, les polítiques de rendes (eficàcia limitada a LT) i les polítiques d'oferta (efectes a mitjà-llarg termini). El marc d'<strong><em>inflation targeting</em></strong> ha demostrat ser eficaç per a ancorar les expectatives i reduir la inflació amb menors costos en termes de producció i ocupació. La coordinació entre política monetària i fiscal (<em>policy mix</em>) resulta essencial per a gestionar episodis inflacionaris complexos com l'experimentat després de la pandèmia de 2020.
                    </p>
                </div>

            <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
            <PdeFooter appEmoji="📖" appName={t('footer.appname')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<BlocCApp />, document.getElementById('root'));
    </script>
</body>
</html>
