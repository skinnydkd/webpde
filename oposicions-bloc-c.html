            <Card title="1. El déficit público" icon="📘">
                <TheoryBlock title="1.1. Concepto" color="blue">
                    <p>
                        El <strong>déficit público</strong> se produce cuando los gastos públicos (G) superan los ingresos públicos (T) en un período determinado (normalmente un año fiscal): <strong>Déficit = G − T &gt; 0</strong>. El déficit implica una <strong>necesidad de financiación</strong> del sector público, que debe cubrirse mediante la emisión de deuda pública, aumento de impuestos o, históricamente, mediante la monetización (creación de dinero). El concepto opuesto es el <strong>superávit</strong> (T &gt; G), que implica capacidad de financiación.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Tipos de déficit" color="green">
                    <p>
                        Para un análisis riguroso, es necesario distinguir entre varios conceptos de déficit:
                    </p>
                    <p>
                        <strong>a) Déficit total (convencional):</strong> G − T, incluyendo todos los gastos e ingresos. Es el indicador más utilizado en las reglas fiscales (PEC: límite del 3 % del PIB).
                    </p>
                    <p>
                        <strong>b) Déficit primario:</strong> G − T − intereses de la deuda. Excluye los pagos de intereses, que reflejan decisiones del pasado y no la orientación fiscal actual. Es el indicador más relevante para evaluar la <strong>sostenibilidad</strong> de la deuda: si hay superávit primario, la deuda puede estabilizarse o reducirse.
                    </p>
                    <p>
                        <strong>c) Déficit estructural:</strong> el déficit ajustado por el ciclo económico. Elimina el efecto de los estabilizadores automáticos y mide la orientación fiscal «subyacente». Se calcula como: Déficit estructural = Déficit total − Déficit cíclico.
                    </p>
                    <p>
                        <strong>d) Déficit cíclico:</strong> la parte del déficit atribuible a la posición cíclica de la economía (output gap). En recesión, el déficit cíclico aumenta automáticamente (↓ingresos, ↑gasto social); en expansión, se reduce.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Causas del déficit" color="amber">
                    <p>
                        Las principales causas del déficit público son:
                    </p>
                    <p>
                        <strong>— Recesiones económicas:</strong> caída de ingresos tributarios y aumento automático del gasto social (estabilizadores automáticos). Es la principal fuente de déficit cíclico.
                    </p>
                    <p>
                        <strong>— Políticas fiscales expansivas discrecionales:</strong> aumentos de gasto o reducciones de impuestos decididos deliberadamente para estimular la economía. Generan déficit estructural.
                    </p>
                    <p>
                        <strong>— Gasto militar y conflictos:</strong> históricamente, las guerras han sido una fuente importante de endeudamiento público.
                    </p>
                    <p>
                        <strong>— Envejecimiento demográfico:</strong> aumento del gasto en pensiones y sanidad sin un incremento proporcional de ingresos. Es un factor estructural de largo plazo.
                    </p>
                    <p>
                        <strong>— Shocks exógenos:</strong> crisis financieras (rescates bancarios), pandemias (COVID-19), desastres naturales, crisis energéticas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. Financiación del déficit" color="indigo">
                    <p>
                        El déficit público puede financiarse mediante tres vías principales:
                    </p>
                    <p>
                        <strong>a) Emisión de deuda pública:</strong> el Tesoro Público emite títulos de deuda (Letras, Bonos, Obligaciones) que son adquiridos por inversores nacionales y extranjeros. Es el mecanismo habitual en las economías avanzadas. Ventaja: no genera inflación directamente. Inconveniente: genera una carga de intereses futura y posible efecto crowding out.
                    </p>
                    <p>
                        <strong>b) Monetización (impuesto inflacionario):</strong> el banco central compra directamente la deuda pública, creando dinero nuevo. Genera <strong>inflación</strong> (impuesto inflacionario que erosiona el valor real de la deuda y de los activos monetarios). Esta vía está <strong>prohibida</strong> en la zona euro (art. 123 TFUE prohíbe la financiación monetaria directa del BCE a los gobiernos), aunque los programas de compra de activos del BCE (QE) se acercan a ella de forma indirecta.
                    </p>
                    <p>
                        <strong>c) Aumento de impuestos:</strong> elevar la presión fiscal para cubrir el déficit. Limitaciones: posibles efectos negativos sobre la actividad económica (curva de Laffer) y resistencia política.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. La deuda pública" icon="📘">
                <TheoryBlock title="2.1. Concepto: stock vs. flujo" color="blue">
                    <p>
                        La <strong>deuda pública</strong> es el valor total de las obligaciones financieras pendientes del sector público en un momento dado. Es una variable <strong>stock</strong> (acumulación), a diferencia del déficit que es una variable <strong>flujo</strong> (por período). La deuda pública es la <strong>acumulación de todos los déficits pasados</strong> menos los superávits: Deuda(t) = Deuda(t−1) + Déficit(t). Cada año de déficit añade deuda; cada año de superávit la reduce.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Ratio deuda/PIB" color="green">
                    <p>
                        El indicador clave para evaluar la sostenibilidad de la deuda no es su valor absoluto sino la <strong>ratio deuda/PIB</strong>, que mide el peso de la deuda respecto a la capacidad económica del país para generar ingresos y, por tanto, para pagarla. Una deuda de 1 billón de euros es muy diferente para una economía con un PIB de 1,4 billones (España, ratio ~70-120 %) que para una de 4 billones (Alemania, ratio ~65 %). El límite del PEC es del <strong>60 % del PIB</strong>, aunque numerosos países lo superan ampliamente (Italia ~140 %, Grecia ~160 %, Japón ~260 %).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Tipos de deuda pública" color="amber">
                    <p>
                        La deuda pública se clasifica según varios criterios:
                    </p>
                    <p>
                        <strong>— Por el titular:</strong> deuda <em>interna</em> (en manos de residentes nacionales: la «nos la debemos a nosotros mismos», argumento de Lerner) vs. deuda <em>externa</em> (en manos de no residentes: implica transferencia de recursos al exterior).
                    </p>
                    <p>
                        <strong>— Por el plazo:</strong> <em>Letras del Tesoro</em> (3, 6, 9, 12 meses — corto plazo, emitidas al descuento), <em>Bonos del Estado</em> (3 y 5 años — medio plazo, con cupón periódico) y <em>Obligaciones del Estado</em> (10, 15, 30, 50 años — largo plazo, con cupón periódico). Cada instrumento tiene un perfil de riesgo-rendimiento diferente.
                    </p>
                    <p>
                        <strong>— Por la moneda:</strong> deuda en moneda nacional (menor riesgo de impago, el banco central puede actuar como prestamista de última instancia) vs. deuda en moneda extranjera (riesgo cambiario adicional). Los países de la zona euro emiten deuda en euros pero sin control individual sobre la política monetaria, lo que crea una situación intermedia.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. La prima de riesgo" color="indigo">
                    <p>
                        La <strong>prima de riesgo</strong> (risk premium o spread) es el diferencial de rentabilidad entre el bono soberano de un país y el bono alemán (Bund) a 10 años, considerado el activo más seguro de la zona euro:
                    </p>
                    <p>
                        <strong>Prima de riesgo = Rentabilidad bono nacional a 10 años − Rentabilidad Bund alemán a 10 años</strong>
                    </p>
                    <p>
                        La prima de riesgo refleja la percepción del mercado sobre la <strong>probabilidad de impago</strong> (default) o reestructuración de la deuda de un país. Una prima elevada indica desconfianza → encarece la financiación del Estado → puede generar una <strong>espiral negativa</strong> (self-fulfilling prophecy): ↑prima → ↑coste de la deuda → ↑déficit → ↑desconfianza → ↑prima. Durante la crisis de deuda soberana, la prima de riesgo española alcanzó los 649 puntos básicos (julio 2012), frente a valores habituales de 50-100 pb. La intervención del BCE («whatever it takes» de Draghi, julio 2012) fue decisiva para estabilizar las primas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Dinámica de la deuda" color="purple">
                    <p>
                        La evolución de la <strong>ratio deuda/PIB</strong> depende de tres factores fundamentales, resumidos en la ecuación de dinámica de la deuda:
                    </p>
                    <p>
                        <strong>Δ(Deuda/PIB) = (r − g) · (Deuda/PIB) + Déficit primario / PIB</strong>
                    </p>
                    <p>
                        Donde r es el tipo de interés real de la deuda y g es la tasa de crecimiento real del PIB. Si <strong>r &lt; g</strong> (el crecimiento supera al tipo de interés), la ratio deuda/PIB tiende a reducirse incluso con un déficit primario moderado: la economía «crece más rápido que la deuda». Si <strong>r &gt; g</strong>, se necesita un <strong>superávit primario</strong> para estabilizar la ratio. Esta condición es la clave de la <strong>sostenibilidad fiscal</strong>. En el período post-COVID, los tipos de interés históricamente bajos (r &lt; g) han facilitado la sostenibilidad, pero la normalización monetaria del BCE (2022-2024) ha elevado r, tensionando las finanzas públicas.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. Efectos económicos del déficit y la deuda" icon="📘">
                <TheoryBlock title="3.1. Efecto multiplicador a corto plazo (Keynes)" color="blue">
                    <p>
                        Desde la perspectiva <strong>keynesiana</strong>, el déficit público financiado con deuda tiene un <strong>efecto expansivo</strong> sobre la renta y el empleo a corto plazo, especialmente en recesiones cuando existe capacidad productiva ociosa. El multiplicador fiscal (k_G) amplifica el efecto inicial del gasto. Este efecto es mayor cuando: la economía está en recesión (multiplicadores más grandes), los tipos de interés están cerca de cero (trampa de la liquidez: crowding out mínimo), la propensión marginal al consumo es alta y la economía es relativamente cerrada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Efecto crowding out" color="green">
                    <p>
                        Como se analizó en el Tema 25, el <strong>efecto crowding out</strong> (desplazamiento) reduce la eficacia del déficit fiscal: ↑G financiado con deuda → ↑demanda de fondos prestables → ↑tipo de interés → ↓inversión privada → efecto neto sobre Y inferior al previsto por el multiplicador simple. La magnitud del crowding out depende de la elasticidad de la demanda de dinero al tipo de interés (mayor en el modelo clásico, menor en el keynesiano) y de la apertura de la economía (en economía abierta, el crowding out puede operar también a través del tipo de cambio: ↑i → ↑entrada de capitales → apreciación → ↓exportaciones netas).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Carga para generaciones futuras" color="amber">
                    <p>
                        El debate sobre si la deuda pública supone una <strong>carga para las generaciones futuras</strong> enfrenta dos posiciones clásicas:
                    </p>
                    <p>
                        <strong>— Buchanan (1958):</strong> sí hay carga intergeneracional. La generación presente disfruta del gasto financiado con deuda, pero las generaciones futuras soportan los impuestos para pagar los intereses y amortizar la deuda. Además, si la deuda financia consumo (no inversión productiva), las generaciones futuras heredan más deuda sin más capacidad productiva.
                    </p>
                    <p>
                        <strong>— Lerner (1948):</strong> la deuda interna «nos la debemos a nosotros mismos». Los pagos de intereses son transferencias entre ciudadanos del mismo país (de contribuyentes a tenedores de bonos). La carga real solo existe si la deuda es externa (transferencia de recursos al exterior) o si genera distorsiones (impuestos más altos para pagar intereses → desincentivos).
                    </p>
                    <p>
                        La <strong>posición actual</strong> reconoce que la deuda interna sí puede generar carga intergeneracional si: redistribuye renta de contribuyentes (generalmente más pobres) a tenedores de bonos (generalmente más ricos), o si los impuestos necesarios para pagar intereses generan ineficiencias (pérdida de eficiencia de los impuestos).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Riesgo de insostenibilidad: crisis de deuda soberana" color="indigo">
                    <p>
                        Cuando los mercados perciben que la deuda de un país puede ser <strong>insostenible</strong> (incapacidad de pagar intereses o amortizar principal), se desencadena una <strong>crisis de deuda soberana</strong>. El mecanismo es una espiral negativa: ↑desconfianza → ↑prima de riesgo → ↑coste de la deuda → ↑déficit → ↑deuda → ↑desconfianza. Casos emblemáticos: la <strong>crisis griega</strong> (2010-2015, con reestructuración de deuda en 2012), la <strong>crisis española</strong> (2012, con rescate bancario y prima de 649 pb), la crisis irlandesa y portuguesa (2010-2011). Estas crisis motivaron la creación del <strong>Mecanismo Europeo de Estabilidad (MEDE)</strong> y la Unión Bancaria, así como la intervención decisiva del BCE.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. Equivalencia ricardiana revisitada (Barro)" color="purple">
                    <p>
                        Como se analizó en el Tema 25, la <strong>equivalencia ricardiana</strong> (Barro, 1974) predice la <strong>neutralidad del déficit</strong>: los agentes racionales anticipan que el déficit de hoy implica impuestos futuros, por lo que aumentan su ahorro en la misma cuantía, anulando el efecto expansivo. En la práctica, esta equivalencia se cumple solo parcialmente: los agentes tienen <strong>horizonte finito</strong> (no altruismo intergeneracional perfecto), los <strong>mercados de capitales son imperfectos</strong> (restricciones de crédito) y los <strong>impuestos son distorsionantes</strong> (no de suma fija). La evidencia empírica sugiere que la equivalencia ricardiana es una aproximación más relevante a largo plazo que a corto plazo.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. Reglas fiscales y sostenibilidad" icon="📘">
                <TheoryBlock title="4.1. Pacto de Estabilidad y Crecimiento (PEC)" color="blue">
                    <p>
                        El <strong>PEC</strong> establece los dos límites numéricos fundamentales: <strong>déficit &lt; 3 % del PIB</strong> y <strong>deuda &lt; 60 % del PIB</strong>. El componente preventivo exige un objetivo a medio plazo (OMP) de saldo estructural próximo al equilibrio o en superávit. El componente correctivo activa el <strong>Procedimiento de Déficit Excesivo (PDE)</strong> cuando se superan los límites, con un calendario de corrección y posibles sanciones financieras. Las reglas del PEC han sido criticadas por su rigidez (procíclicas en recesiones), su complejidad (múltiples indicadores y excepciones) y su falta de aplicación efectiva (ningún país ha sido sancionado hasta la fecha).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Reforma del PEC (2024)" color="green">
                    <p>
                        La <strong>reforma del marco de gobernanza económica de la UE</strong> (abril 2024) introduce cambios sustanciales: se mantienen los límites del 3 % y 60 % como referencia, pero se sustituye el enfoque «one-size-fits-all» por <strong>trayectorias de ajuste individualizadas</strong> para cada país, basadas en un análisis de sostenibilidad de la deuda (DSA). Cada Estado miembro presenta un plan fiscal-estructural a medio plazo (4 años, extensible a 7 si incluye reformas e inversiones). El indicador de referencia pasa a ser el <strong>gasto primario neto</strong> (excluye intereses, gasto cíclico en desempleo e ingresos extraordinarios). Se introduce una <strong>salvaguarda de resiliencia de la deuda</strong> (la ratio deuda/PIB debe ser inferior al final del período de ajuste) y una <strong>salvaguarda de déficit</strong> (margen de 1,5 pp bajo el 3 %).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Regla de gasto" color="amber">
                    <p>
                        La <strong>regla de gasto</strong> limita el crecimiento del gasto público computable a la tasa de <strong>crecimiento potencial del PIB</strong> a medio plazo. Si el gasto crece al mismo ritmo que el PIB potencial, la ratio gasto/PIB se mantiene estable. La ventaja de la regla de gasto frente a los objetivos de déficit es que el gasto es más controlable por el gobierno (los ingresos dependen del ciclo), por lo que es <strong>menos procíclica</strong>. En la reforma del PEC de 2024, el gasto primario neto se convierte en el indicador operativo principal para evaluar el cumplimiento de las trayectorias de ajuste.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. España: estabilidad presupuestaria y AIReF" color="indigo">
                    <p>
                        En España, el marco fiscal nacional se articula en torno a la <strong>Ley Orgánica 2/2012 de Estabilidad Presupuestaria y Sostenibilidad Financiera</strong> (desarrollo del art. 135 CE), que establece el principio de estabilidad presupuestaria, la regla de gasto, el límite de deuda y la prioridad absoluta de pago de los intereses y el capital de la deuda pública. La <strong>AIReF</strong> (Autoridad Independiente de Responsabilidad Fiscal), creada por la Ley Orgánica 6/2013, supervisa el cumplimiento de las reglas fiscales, evalúa las previsiones macroeconómicas del gobierno y emite informes sobre la sostenibilidad de las finanzas públicas de todas las AAPP (Estado, CCAA, EELL, Seguridad Social).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. El debate austeridad vs. estímulo" color="purple">
                    <p>
                        La crisis de deuda soberana (2010-2014) generó un intenso debate académico y político sobre la respuesta óptima:
                    </p>
                    <p>
                        <strong>— Austeridad expansiva (Alesina, Ardagna):</strong> la consolidación fiscal basada en recortes de gasto puede ser expansiva si restaura la confianza, reduce las primas de riesgo y genera expectativas de menores impuestos futuros. La evidencia empírica es débil en contextos recesivos.
                    </p>
                    <p>
                        <strong>— Reinhart y Rogoff (2010):</strong> argumentaron que la deuda superior al 90 % del PIB reduce significativamente el crecimiento. Un error de cálculo en su estudio (descubierto por Herndon, Ash y Pollin, 2013) debilitó esta tesis, aunque la relación negativa entre deuda elevada y crecimiento persiste en la literatura.
                    </p>
                    <p>
                        <strong>— Estímulo fiscal (Krugman, Stiglitz, DeLong-Summers):</strong> en recesiones con trampa de la liquidez, los multiplicadores fiscales son elevados y la austeridad es contraproducente (self-defeating). DeLong y Summers (2012) demostraron que, con multiplicadores suficientemente grandes y tipos cerca de cero, el estímulo fiscal puede ser <strong>auto-financiable</strong> (el aumento de actividad genera suficientes ingresos para pagar la deuda adicional).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. Datos y contexto español" icon="📘">
                <TheoryBlock title="5.1. Evolución de la deuda/PIB en España" color="blue">
                    <p>
                        La <strong>ratio deuda/PIB de España</strong> ha experimentado fluctuaciones dramáticas: de menos del <strong>40 %</strong> antes de la crisis de 2008 (36 % en 2007, tras años de superávit presupuestario) a más del <strong>100 %</strong> tras la Gran Recesión y el rescate bancario (100,7 % en 2014), descendiendo gradualmente hasta el <strong>98 %</strong> en 2019, para dispararse al <strong>120 %</strong> en 2020 (pandemia) y reducirse progresivamente hasta aproximadamente el <strong>107 %</strong> en 2023. Esta evolución ilustra cómo las crisis económicas y financieras pueden transformar radicalmente la posición fiscal de un país en muy pocos años.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. El Tesoro Público" color="green">
                    <p>
                        El <strong>Tesoro Público</strong> (Dirección General del Tesoro y Política Financiera, dependiente del Ministerio de Economía) es el organismo responsable de la <strong>gestión de la deuda pública</strong> en España. Sus funciones incluyen: planificación de las emisiones de deuda (calendario de subastas), ejecución de subastas de Letras, Bonos y Obligaciones, gestión del perfil de vencimientos (alargar la vida media de la deuda reduce el riesgo de refinanciación), operaciones de canje y recompra, y relación con los inversores institucionales y las agencias de calificación. El Tesoro publica mensualmente datos sobre la deuda en circulación, el coste medio, la vida media y la distribución por tenedores.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Agencias de calificación" color="amber">
                    <p>
                        Las <strong>agencias de calificación crediticia</strong> (rating agencies) —principalmente <strong>Moody's, Standard &amp; Poor's y Fitch</strong>— emiten opiniones sobre la solvencia de los emisores de deuda, incluidos los Estados soberanos. La calificación (rating) va desde AAA (máxima solvencia) hasta D (impago). Una <strong>rebaja de rating</strong> puede encarecer significativamente la financiación de un país, al provocar ventas de bonos por parte de inversores institucionales que solo pueden mantener activos con grado de inversión (investment grade). España fue rebajada durante la crisis: de AAA (2009) a BBB− (2012, cerca de bono basura), recuperando progresivamente hasta A (S&amp;P, 2024). Las agencias han sido criticadas por su carácter <strong>procíclico</strong> (rebajan cuando la crisis ya es evidente, agravándola) y por posibles <strong>conflictos de interés</strong> (cobran del emisor evaluado).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. Relevancia curricular" icon="📘">
                <TheoryBlock title="6.1. Marco normativo y competencial" color="blue">
                    <p>
                        El déficit público y la deuda pública se integran en el currículo de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), dentro del bloque «La realidad económica», y constituyen un complemento natural del tema del presupuesto y la política fiscal. Las competencias específicas implicadas son: CE1 (explicar el funcionamiento del sistema económico, incluyendo el papel del sector público), CE5 (analizar las principales políticas económicas y sus efectos) y CE6 (comprender la coyuntura económica actual, incluyendo los debates sobre sostenibilidad fiscal). Se movilizan descriptores operativos de las competencias clave: STEM5 (análisis cuantitativo de la dinámica de la deuda), CC1 y CC2 (debate ciudadano sobre austeridad vs. estímulo), CPSAA5 (comprensión de las implicaciones de la deuda para el bienestar futuro) y CE1 (valoración del contexto fiscal para el emprendimiento).
                    </p>
                    <p>
                        La metodología didáctica puede incluir el <strong>análisis de la evolución de la deuda/PIB</strong> de España y otros países (series temporales), simulaciones de dinámica de la deuda (¿qué ocurre si r &gt; g durante 10 años?), debates sobre el debate austeridad vs. estímulo con argumentos de Alesina, Reinhart-Rogoff, Krugman y DeLong-Summers, y análisis de noticias sobre primas de riesgo y calificaciones crediticias.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
            <Card title="Conclusión" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        El <strong>déficit público</strong> y la <strong>deuda pública</strong> constituyen dos variables macroeconómicas inseparables: el déficit es el flujo que alimenta la deuda (stock), y la deuda genera intereses que, a su vez, contribuyen al déficit futuro. La distinción entre déficit total, primario, estructural y cíclico es esencial para un diagnóstico correcto de la situación fiscal y para diseñar políticas de consolidación adecuadas. La ecuación de dinámica de la deuda —Δ(Deuda/PIB) = (r − g)·(Deuda/PIB) + Déficit primario/PIB— revela que la sostenibilidad depende crucialmente de la relación entre el tipo de interés real y la tasa de crecimiento.
                    </p>
                    <p>
                        Los efectos económicos del déficit y la deuda son objeto de un debate teórico que sigue vivo: el efecto multiplicador keynesiano a corto plazo, el crowding out, la carga intergeneracional (Buchanan vs. Lerner) y la equivalencia ricardiana (Barro) ofrecen perspectivas complementarias. Las crisis de deuda soberana europeas (2010-2012) demostraron que la insostenibilidad fiscal puede desencadenar espirales destructivas, pero también que la austeridad excesiva puede ser contraproducente en contextos recesivos.
                    </p>
                    <p>
                        Las <strong>reglas fiscales</strong> —el PEC (reformado en 2024), la Ley de Estabilidad Presupuestaria y la supervisión de la AIReF— buscan equilibrar la necesidad de disciplina fiscal con la flexibilidad necesaria para responder a shocks. El caso español, con una deuda que pasó del 36 % al 120 % del PIB en apenas trece años, ilustra tanto los riesgos de la complacencia fiscal como la importancia de instituciones y reglas que garanticen la sostenibilidad a largo plazo. Desde la perspectiva docente, este tema permite al alumnado comprender las implicaciones del endeudamiento público para su futuro como contribuyentes y ciudadanos, fomentando un pensamiento crítico informado sobre las alternativas de política fiscal.
                    </p>
                </div>
            </Card>
