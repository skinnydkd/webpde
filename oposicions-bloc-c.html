 {/* ── INTRODUCCIÓ ────────────────────────────────────── */}
 <Card title="Introducció" icon="📌">
 <div className="text-sm text-slate-700 leading-relaxed space-y-3">
 <p>
 La <strong>macroeconomia</strong> és la branca de la ciència econòmica que estudia el comportament de l'economia <strong>en el seu conjunt</strong>. Enfront de la microeconomia —que analitza les decisions individuals de consumidors i empreses—, la macroeconomia s'ocupa dels <strong>agregats econòmics</strong>: la producció total, el nivell general de preus, l'ocupació, el creixement i les relacions econòmiques internacionals. El seu naixement com a disciplina diferènciada s'associa a l'obra de <strong>John Maynard Keynes</strong>, <em>Teoria general de l'ocupació, l'interés i el diner</em> (1936), encara que les seues arrels és remunten als fisiòcrates (Quesnay, <em>Tableau économique</em>, 1758) i als clàssics (Smith, Ricardo, Say).
 </p>
 <p>
 La necessitat de <strong>mesurar l'activitat econòmica agregada</strong> de forma sistemàtica va portar al desenvolupament de la <strong>comptabilitat nacional</strong>, els principals artífexs de la qual van ser <strong>Simon Kuznets</strong> (Premi Nobel 1971) i <strong>Richard Stone</strong> (Premi Nobel 1984). El <strong>Producte Interior Brut (PIB)</strong> s'ha convertit en l'indicador macroeconòmic de referència, si bé —com el propi Kuznets va advertir— presenta <strong>limitacions significatives</strong> com a mesura del benestar social. Junt amb el PIB, un conjunt de magnituds derivades (PNB, PIN, Renda Nacional, Renda Personal Disponible) i d'indicadors alternatius (IDH, IPM, PIB verd) completen el marc analític del qual disposa l'economista per a comprendre la realitat econòmica d'un país.
 </p>
 <p>
 Des de la perspectiva curricular, aquest tema s'emmarca en els sabers bàsics del bloc «La realitat econòmica. Ferramentes per a entendre el món amb una visió microeconòmica i macroeconòmica» de la matèria d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), així com en les competències específiques CE1 (comprensió del funcionament del sistema econòmic) i CE5 (anàlisi del context econòmic nacional i internacional). La LOMLOE (Llei Orgànica 3/2020) subratlla la importància que l'alumnat comprenga els indicadors macroeconòmics com a ferramenta per a la interpretació informada de la realitat socioeconòmica, contribuint especialment a les competències STEM (tractament de dades estadístiques), CC (reflexió sobre desigualtat i desenvolupament) i CPSAA (judici crític sobre la informació econòmica).
 </p>
 <p>

 <Card title="1. Macroeconomia: concepte i objectius" icon="📘">
 <TheoryBlock title="1.1. De la microeconomia a la macroeconomia" color="blue">
 <p>
 La <strong>microeconomia</strong> estudia les decisions individuals de llars i empreses i com interactuen en els mercats concrets de béns, serveis i factors. La <strong>macroeconomia</strong>, en canvi, analitza l'economia com un tot, utilitzant <strong>variables agregades</strong> que resumeixen el comportament conjunt de milions d'agents econòmics. En paraules de Mankiw (2020), «la macroeconomia és l'estudi dels fenòmens que afecten el conjunt de l'economia, inclosos la inflació, l'atur i el creixement econòmic».
 </p>
 <p>
 El naixement de la macroeconomia moderna es situa en 1936, amb la publicació de la <em>Teoria general</em> de <strong>Keynes</strong>. Davant la Gran Depressió (1929-33), Keynes va qüestionar la llei de Say («tota oferta crea la seua pròpia demanda») i va demostrar que l'economia podia romandre en equilibri amb atur massiu, justificant la intervenció de l'Estat mitjançant la política fiscal. Aquest gir intel·lectual va assentar les bases de la macroeconomia com a disciplina diferènciada de la microeconomia.
 </p>
 <p>
 Els principals <strong>agregats macroeconòmics</strong> són: el Producte Interior Brut (PIB), la taxa d'inflació, la taxa d'atur, el tipus d'interés, el tipus de canvi, la balança de pagaments i el deute públic. L'estudi de les relacions entre aquests agregats constitueix el nucli de la macroeconomia.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.2. Objectius macroeconòmics" color="indigo">
 <p>
 Els principals <strong>objectius</strong> de la política macroeconòmica, en la tradició de Musgrave (1959) i Tinbergen (1952), són:
 </p>
 <p>
 <strong>1. Creixement econòmic sostingut:</strong> augment del PIB real al llarg del temps, com a base per a la millora del nivell de vida. Es mesura habitualment a través de la taxa de variació del PIB real.
 </p>
 <p>
 <strong>2. Plena ocupació:</strong> aconseguir que tots els factors productius —especialment el treball— estiguen utilitzats al màxim de la seua capacitat, minimitzant l'atur involuntari. El concepte de <strong>taxa natural d'atur</strong> (Friedman, 1968) reconeix que un cert nivell d'atur (friccional i estructural) és inevitable.
 </p>
 <p>
 <strong>3. Estabilitat de preus:</strong> mantindre la inflació en nivells baixos i previsibles. La inflació elevada distorsiona els senyals de preus, redistribueix la renda de manera arbitrària i genera incertesa. L'objectiu del BCE és una inflació del 2 % a mitjà termini.
 </p>
 <p>
 <strong>4. Equilibri exterior:</strong> mantindre una posició sostenible de la balança de pagaments, evitant dèficits crònics per compte corrent que generen endeutament extern excessiu.
 </p>
 <p>
 <strong>5. Distribució equitativa de la renda:</strong> reduir les desigualtats de renda i riquesa per a afavorir la cohesió social, mitjançant el sistema impositiu progressiu i les transferències de l'Estat del benestar.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.3. Instruments de política macroeconòmica" color="green">
 <p>
 Per a assolir aquests objectius, els governs i bancs centrals disposen de quatre grans instruments:
 </p>
 <p>
 <strong>Política fiscal:</strong> ús de la despesa pública (G) i els impostos (T) per a influir en la demanda agregada. Expansiva (↑G o ↓T) per a estimular l'economia; restrictiva (↓G o ↑T) per a frenar la inflació. Responsabilitat del govern.
 </p>
 <p>
 <strong>Política monetària:</strong> control de l'oferta monetària (M) i els tipus d'interés (i) per part del banc central. Expansiva (↑M, ↓i) per a estimular el crèdit i la inversió; restrictiva (↓M, ↑i) per a contindre la inflació. A l'eurozona, responsabilitat del BCE.
 </p>
 <p>
 <strong>Política exterior (comercial i canviària):</strong> aranzels, quotes, acords comercials i gestió del tipus de canvi per a influir en les exportacions netes (X − M).
 </p>
 <p>
 <strong>Política de rendes:</strong> acords sobre salaris i preus (pactes socials) per a contindre la inflació de costos sense recórrer a polítiques restrictives que augmenten l'atur.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígraf 2 */}
 <Card title="2. El Producte Interior Brut (PIB)" icon="📘">
 <TheoryBlock title="2.1. Definició del PIB" color="blue">
 <p>
 El <strong>Producte Interior Brut (PIB)</strong> és defineix com el <strong>valor de mercat de tots els béns i serveis finals produïts a l'interior d'un país durant un període de temps determinat</strong> (generalment un any o un trimestre). Cada paraula d'aquesta definició és rellevant:
 </p>
 <p>
 <strong>Valor de mercat:</strong> és valoren els béns als seus preus de mercat, la qual cosa permet sumar productes heterogenis (quilos de blat i automòbils) en una unitat comuna (euros).
 </p>
 <p>
 <strong>Béns i serveis finals:</strong> s'exclouen els béns intermedis (matèries primeres utilitzades en la producció) per a evitar la <strong>doble comptabilització</strong>. Només és compten els béns que arriben a l'usuari final.
 </p>
 <p>
 <strong>Produïts:</strong> és mesura la producció corrent, no les transaccions de béns ja existents (per exemple, la venda d'un habitatge de segona mà no s'inclou, encara que sí la comissió de l'agent immobiliari).
 </p>
 <p>
 <strong>Interior:</strong> és comptabilitza tota la producció realitzada dins de les fronteres del país, independentment de la nacionalitat dels factors productius (criteri territorial).
 </p>
 <p>
 <strong>Brut:</strong> no és descompta la depreciació (consum de capital fix), a diferència del Producte Interior Net (PIN).
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.2. Les tres vies de càlcul del PIB" color="indigo">
 <p>
 El PIB pot calcular-se per tres vies equivalents, que han de donar el mateix resultat (identitat fonamental de la comptabilitat nacional):
 </p>
 <p>
 <strong>a) Via de la despesa (demanda):</strong> suma de totes les despeses en béns i serveis finals realitzades pels agents econòmics. És la via més utilitzada en els manuals de macroeconomia.
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="PIB = C + I + G + (X − M)"
 desc="C = Consum privat | I = Inversió (FBCF + Δ existències) | G = Despesa pública | X = Exportacions | M = Importacions"
 />

 <TheoryBlock color="indigo">
 <p>
 <strong>b) Via de la renda (ingressos):</strong> suma de totes les rendes generades en el procés productiu. La producció genera rendes que és distribueixen entre els factors de producció.
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="PIB = RA + EBE + T_ind − Subvencions"
 desc="RA = Remuneració d'assalariats | EBE = Excedent brut d'explotació | T_ind = Impostos indirectes nets"
 />

 <TheoryBlock color="indigo">
 <p>
 <strong>c) Via de la producció (oferta / valor afegit):</strong> suma del valor afegit brut (VAB) generat per tots els sectors productius. El valor afegit de cada empresa és la diferència entre el valor de la seua producció i el cost dels consums intermedis.
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="PIB = Σ VAB sectorial + Impostos netos sobre productes"
 desc="VAB = Producció − Consums intermedis"
 />

 <TheoryBlock title="2.3. PIB nominal vs. PIB real. El deflactor del PIB" color="green">
 <p>
 El <strong>PIB nominal</strong> (o PIB a preus corrents) valora la producció als preus vigents en cada any. El problema és que un augment del PIB nominal pot deure's a un augment de la producció real o simplement a un augment dels preus (inflació). Per a aïllar l'efecte dels canvis en els preus, és calcula el <strong>PIB real</strong> (o PIB a preus constants), que valora la producció de cada any als preus d'un <strong>any base</strong>.
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="PIB real = (PIB nominal / Deflactor del PIB) × 100"
 desc="Deflactor = (PIB nominal / PIB real) × 100 — mesura la variació del nivell general de preus"
 />

 <TheoryBlock color="green">
 <p>
 El <strong>deflactor del PIB</strong> és un índex de preus que recull la variació dels preus de tots els béns i serveis produïts en l'economia. A diferència de l'IPC, que només inclou una cistella de béns de consum, el deflactor abasta tota la producció (inclosa la inversió, la despesa pública i les exportacions netes). El deflactor de l'any base és, per definició, igual a 100.
 </p>
 <p>
 En la pràctica, l'INE publica el PIB real utilitzant el mètode d'<strong>índexs encadenats</strong>, que evita els biaixos derivats de fixar un any base llunyà i utilitza ponderacions que s'actualitzen anualment.
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.4. PIB per càpita com a indicador de nivell de vida" color="amber">
 <p>
 El <strong>PIB per càpita</strong> (PIBpc) s'obté dividint el PIB entre la població del país. És l'indicador més utilitzat per a aproximar el <strong>nivell de vida mitjà</strong> dels habitants d'un país i per a realitzar <strong>comparacions internacionals</strong> (ajustat per paritat de poder adquisitiu, PPA).
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="PIBpc = PIB / Població"
 desc="Per a comparacions internacionals, s'ajusta per Paritat de Poder Adquisitiu (PPA)"
 />

 <TheoryBlock title="2.5. Limitacions del PIB" color="red">
 <p>
 Malgrat la seua utilitat, el PIB presenta <strong>limitacions significatives</strong> com a indicador de benestar social, que l'opositor ha de conéixer i exposar críticament:
 </p>
 <p>
 <strong>1. Economia submergida:</strong> no recull les activitats econòmiques no declarades (treball en negre, activitats il·legals). A Espanya, l'economia submergida s'estima entre el 17 % i el 25 % del PIB (segons el mètode emprat).
 </p>
 <p>
 <strong>2. Treball domèstic i de cures no remunerat:</strong> el PIB no comptabilitza la producció de béns i serveis realitzada a la llar (neteja, cuina, cura de menors i dependents), que té un enorme valor econòmic i social. Aquesta omissió té una marcada <strong>dimensió de gènere</strong>, ja que aquest treball recau desproporcionadament en les dones.
 </p>
 <p>
 <strong>3. Externalitats negatives:</strong> el PIB no resta les externalitats negatives (contaminació, esgotament de recursos naturals). Un abocament tòxic pot fins i tot <em>augmentar</em> el PIB (per les despeses de neteja), malgrat reduir el benestar.
 </p>
 <p>
 <strong>4. Distribució de la renda:</strong> el PIB per càpita és una mitjana que oculta les desigualtats internes. Dos països amb el mateix PIBpc poden tindre nivells de benestar molt diferents si la distribució de la renda és distinta.
 </p>
 <p>
 <strong>5. Composició de la producció:</strong> el PIB no distingeix entre béns que augmenten el benestar (educació, sanitat) i béns que el redueixen (armament, reparació de danys). Tampoc valora l'oci ni la qualitat de vida.
 </p>
 <p>
 <strong>6. Sostenibilitat mediambiental:</strong> el PIB no té en compte l'esgotament dels recursos naturals ni la degradació mediambiental, la qual cosa pot donar una imatge enganyosa de prosperitat a costa del capital natural.
 </p>
 <p>
 Com va assenyalar el propi <strong>Simon Kuznets</strong> (1934): «el benestar d'una nació difícilment pot inferir-se d'una mesura de la renda nacional». Robert F. Kennedy (1968) ho va expressar de forma memorable: «El PIB mesura tot, excepte allò que fa que la vida pague la pena».
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígraf 3 */}
 <Card title="3. Altres magnituds macroeconòmiques" icon="📘">
 <TheoryBlock title="3.1. Producte Nacional Brut (PNB)" color="blue">
 <p>
 El <strong>PNB</strong> mesura el valor de la producció realitzada pels <strong>factors productius nacionals</strong>, independentment d'on és troben ubicats (criteri de nacionalitat, enfront del criteri territorial del PIB). La relació entre PIB i PNB és:
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="PNB = PIB + RFNe − RFNr"
 desc="RFNe = Rendes de factors nacionals obtingudes a l'exterior | RFNr = Rendes de factors estrangers obtingudes a l'interior"
 />

 <TheoryBlock color="blue">
 <p>
 Per a països amb forta inversió estrangera (com Irlanda), el PIB pot ser significativament major que el PNB, ja que gran part dels beneficis generats al país són repatriats per empreses multinacionals. Per a països amb molts emigrants que envien remeses, el PNB pot superar el PIB.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.2. Producte Interior Net (PIN)" color="indigo">
 <p>
 El <strong>PIN</strong> descompta del PIB la <strong>depreciació</strong> o <strong>consum de capital fix</strong> (CCF), és a dir, la pèrdua de valor dels béns de capital a causa del desgast, l'obsolescència i els danys accidentals. El PIN reflecteix millor la producció <em>neta</em> disponible per al consum i l'acumulació de capital nou.
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="PIN = PIB − Depreciació (CCF)"
 desc="CCF = Consum de capital fix (amortització de l'estoc de capital)"
 />

 <TheoryBlock title="3.3. Renda Nacional (RN)" color="green">
 <p>
 La <strong>Renda Nacional</strong> (RN) mesura el total de rendes percebudes pels factors productius nacionals (treball i capital) per la seua participació en la producció. S'obté a partir del Producte Nacional Net a cost dels factors (PNNcf), descomptant els impostos indirectes nets de subvencions:
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="RN = PNNcf = PIN − T_ind + Subvencions"
 desc="També: RN = PNB − CCF − T_ind + Subvencions"
 />

 <TheoryBlock color="green">
 <p>
 La Renda Nacional és descompon en: <strong>remuneració d'assalariats</strong> (salaris, cotitzacions socials), <strong>rendes de la propietat</strong> (lloguers), <strong>interessos</strong>, <strong>beneficis empresarials</strong> (dividends + beneficis no distribuïts) i <strong>rendes mixtes</strong> (d'autònoms i empreses sense assalariats).
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.4. Renda Personal (RP) i Renda Personal Disponible (RPD)" color="amber">
 <p>
 La <strong>Renda Personal (RP)</strong> és la renda que efectivament arriba a les llars. S'obté restant de la RN els beneficis no distribuïts, les cotitzacions a la Seguretat Social i els impostos sobre societats, i sumant les transferències de l'Estat (pensions, prestacions per atur, beques).
 </p>
 <p>
 La <strong>Renda Personal Disponible (RPD)</strong> és la renda que les llars poden dedicar al consum o a l'estalvi, després de pagar els impostos directes (IRPF i similars):
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="RPD = RP − Impostos directes"
 desc="RPD = Consum + Estalvi personal"
 />

 <TheoryBlock title="3.5. Relacions entre magnituds (cadena completa)" color="violet">
 <p>
 La cadena completa de magnituds macroeconòmiques pot resumir-se així:
 </p>
 <p>
 <strong>PIB</strong> (criterio territorial, bruto, a preus de mercat)
 → <strong>PNB</strong> = PIB + RFNe − RFNr (criterio nacional)
 → <strong>PNN</strong> = PNB − Depreciació (neto)
 → <strong>RN</strong> = PNN − T_ind + Sub (a cost dels factores)
 → <strong>RP</strong> = RN − Bnd − CSS − IS + TR (renda que llega a llars)
 → <strong>RPD</strong> = RP − T_directes (renda disponible per a consum i estalvi)
 </p>
 <p>
 El domini d'aquesta cadena i la capacitat de transitar entre magnituds amb fluïdesa és una de les habilitats que el tribunal valora especialment en l'exposició del tema.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígraf 4 */}
 <Card title="4. Indicadors alternatius al PIB" icon="📘">
 <TheoryBlock title="4.1. Índex de Desenvolupament Humà (IDH)" color="blue">
 <p>
 L'<strong>IDH</strong>, elaborat pel <strong>Programa de les Nacions Unides per al Desenvolupament (PNUD)</strong> des de 1990 (proposat per Amartya Sen i Mahbub ul Haq), combina tres dimensions del desenvolupament:
 </p>
 <p>
 <strong>1. Salut:</strong> esperança de vida en nàixer. <strong>2. Educació:</strong> anys esperats d'escolarització i anys mitjans d'escolarització. <strong>3. Nivell de vida:</strong> INB per càpita en PPA (dòlars internacionals).
 </p>
 <p>
 L'IDH pren valors entre 0 i 1. Els països és classifiquen en quatre categories: desenvolupament humà molt alt (≥0,800), alt (0,700-0,799), mitjà (0,550-0,699) i baix (&lt;0,550). Espanya es situa habitualment en el grup de desenvolupament humà molt alt (IDH ≈ 0,905 en 2023).
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.2. Índex de Pobresa Multidimensional (IPM)" color="indigo">
 <p>
 L'<strong>IPM</strong>, desenvolupat per Alkire i Foster (OPHI, Oxford), mesura la pobresa més enllà de l'ingrés, considerant <strong>deu indicadors</strong> agrupats en tres dimensions: salut (nutrició, mortalitat infantil), educació (anys d'escolarització, assistència escolar) i nivell de vida (electricitat, sanejament, aigua, habitatge, combustible, actius). Una persona és considerada multidimensionalment pobra si està privada en almenys un terç dels indicadors ponderats.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.3. Índex de Progrés Social (IPS)" color="green">
 <p>
 L'<strong>IPS</strong> (Social Progress Imperative) mesura el progrés social d'un país a través de tres dimensions: <strong>necessitats humanes bàsiques</strong> (nutrició, salut, habitatge, seguretat), <strong>fonaments del benestar</strong> (accés a educació, informació, salut, sostenibilitat ambiental) i <strong>oportunitats</strong> (drets personals, llibertat, inclusió, accés a educació superior). A diferència de l'IDH, exclou deliberadament les variables econòmiques per a mesurar el progrés social de forma independent del PIB.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.4. PIB verd / Estalvi Net Ajustat" color="emerald">
 <p>
 L'<strong>Estalvi Net Ajustat</strong> (Genuine Savings), calculat pel <strong>Banc Mundial</strong>, corregeix l'estalvi nacional net descomptant l'esgotament de recursos naturals (minerals, energia, boscos) i els danys per contaminació (CO₂), i sumant la inversió en capital humà (despesa en educació). Quan l'ANA és negatiu, el país està consumint la seua base de riquesa i el seu creixement és insostenible.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.5. Indicador de Progrés Genuí (GPI) / ISEW" color="amber">
 <p>
 El <strong>GPI</strong> (Genuine Progress Indicator) i el seu predecessor, l'<strong>ISEW</strong> (Index of Sustainable Economic Welfare, Daly i Cobb, 1989), parteixen del consum personal i li sumen beneficis no comptabilitzats pel PIB (treball domèstic, voluntariat) i li resten costos ignorats (contaminació, pèrdua d'oci, costos del crim, degradació de recursos). Diversos estudis mostren que, mentre el PIB per càpita ha crescut de forma sostinguda des dels anys 70, el GPI s'ha estancat o fins i tot ha retrocedit en molts països desenvolupats.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.6. Felicitat Nacional Bruta i la paradoxa de Easterlin" color="violet">
 <p>
 La <strong>Felicitat Nacional Bruta (FNB)</strong>, promoguda per Bhutan des de 1972, mesura el progrés a través de nou dominis: benestar psicològic, salut, educació, ús del temps, diversitat cultural, bon govern, vitalitat comunitària, diversitat ecològica i nivell de vida.
 </p>
 <p>
 La <strong>paradoxa de Easterlin</strong> (1974) assenyala que, superat un cert llindar de renda (aproximadament 75.000 $/any segons Kahneman i Deaton, 2010), els augments addicionals de renda no és tradueixen en augments significatius de la felicitat subjectiva. Aquesta paradoxa qüestiona l'assumpció que més PIB equival sempre a més benestar i reforça la necessitat d'indicadors multidimensionals.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígraf 5 */}
 <Card title="5. La comptabilitat nacional" icon="📘">
 <TheoryBlock title="5.1. El Sistema Europeu de Comptes (SEC)" color="blue">
 <p>
 La <strong>comptabilitat nacional</strong> és el marc estadístic que permet registrar, de forma sistemàtica i coherent, totes les transaccions econòmiques que tenen lloc en un país. A la Unió Europea, el marc de referència és el <strong>SEC-2010</strong> (Sistema Europeu de Comptes Nacionals i Regionals, Reglament UE 549/2013), que és l'adaptació europea del <strong>SCN-2008</strong> (Sistema de Comptes Nacionals de Nacions Unides).
 </p>
 <p>
 El SEC-2010 classifica l'economia en <strong>sectors institucionals</strong>: societats no financeres, societats financeres, administracions públiques, llars i institucions sense ànim de lucre al servei de les llars (ISFLSH), i la resta del món. Per a cada sector s'elaboren comptes de producció, explotació, renda, capital i financers.
 </p>
 </TheoryBlock>

 <TheoryBlock title="5.2. L'INE i la comptabilitat nacional d'Espanya" color="indigo">
 <p>
 A Espanya, l'<strong>Institut Nacional d'Estadística (INE)</strong> és l'organisme responsable d'elaborar la <strong>Comptabilitat Nacional d'Espanya (CNE)</strong>, seguint la metodologia del SEC-2010. L'INE publica les estimacions del PIB amb periodicitat trimestral (avanç als 30 dies, primera estimació als 60 dies) i anual. Les dades són revisades periòdicament per a incorporar nova informació estadística.
 </p>
 <p>
 L'INE també elabora la <strong>Comptabilitat Regional d'Espanya</strong>, que permet conéixer el PIB i la renda per comunitats autònomes, i la <strong>Comptabilitat Nacional Trimestral</strong>, fonamental per al seguiment conjuntural de l'economia.
 </p>
 </TheoryBlock>

 <TheoryBlock title="5.3. Les taules input-output" color="green">
 <p>
 Les <strong>taules input-output</strong> (o taules de consum-producte), desenvolupades per <strong>Wassily Leontief</strong> (Premi Nobel 1973), són una representació matricial de les relacions intersectorials d'una economia. Cada fila mostra com és distribueix la producció d'un sector entre els altres sectors (com a consum intermedi) i la demanda final (consum, inversió, exportacions). Cada columna mostra quins inputs necessita un sector dels altres sectors i quin valor afegit genera.
 </p>
 <p>
 Les taules input-output permeten analitzar els <strong>efectes multiplicadors</strong> d'una variació de la demanda final sobre la producció de tots els sectors (efectes directes i indirectes), calcular els <strong>coeficients tècnics</strong> i la <strong>matriu inversa de Leontief</strong>, i constitueixen una ferramenta fonamental per a la planificació econòmica i l'anàlisi d'impacte.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 6 */}
 <Card title="6. Rellevància curricular" icon="📘">
 <TheoryBlock title="6.1. Marc normatiu i curricular" color="blue">
 <p>
 L'estudi de les variables macroeconòmiques i la comptabilitat nacional s'emmarca en la <strong>LOMLOE</strong> (Llei Orgànica 3/2020) i en el <strong>Reial Decret 243/2022</strong> (currículum de Batxillerat). En la matèria d'<strong>Economia de 1r de Batxillerat</strong>, els sabers bàsics del bloc C («La realitat econòmica») inclouen explícitament: «principals magnituds macroeconòmiques», «el producte interior brut», «la renda nacional i la seua distribució», «indicadors econòmics i indicadors de qualitat de vida» i «limitacions de les variables macroeconòmiques com a indicadors de benestar».
 </p>
 <p>
 Les competències específiques implicades són: <strong>CE1</strong> (valorar el problema de l'escassetat i la necessitat d'elegir, comprenent les variables macroeconòmiques bàsiques), <strong>CE5</strong> (proposar iniciatives que contribuïsquen al creixement econòmic sostenible i inclusiu), i <strong>CE6</strong> (analitzar els problemes econòmics actuals mitjançant l'anàlisi de dades i indicadors econòmics).
 </p>
 </TheoryBlock>

 <TheoryBlock title="6.2. Contribució a les competències clau" color="indigo">
 <p>
 <strong>STEM:</strong> tractament de dades estadístiques, càlcul del PIB, interpretació de gràfics i taules macroeconòmiques, anàlisi quantitativa de l'evolució temporal de les magnituds.
 </p>
 <p>
 <strong>CC (Competència Ciutadana):</strong> reflexió crítica sobre les limitacions del PIB com a indicador de benestar, debat sobre la desigualtat, la sostenibilitat i els indicadors alternatius.
 </p>
 <p>
 <strong>CPSAA:</strong> desenvolupament del judici crític davant la informació econòmica que apareix en els mitjans de comunicació, comprensió dels indicadors que afecten la vida quotidiana.
 </p>
 <p>
 <strong>CD (Competència Digital):</strong> ús de fonts estadístiques (INE, Eurostat, Banc Mundial) per a l'obtenció i l'anàlisi de dades macroeconòmiques.
 </p>
 </TheoryBlock>
 </Card>

 {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
 <Card title="Conclusió" icon="📌">
 <div className="text-sm text-slate-700 leading-relaxed space-y-3">
 <p>
 Al llarg d'aquest tema s'ha desenvolupat el marc conceptual i quantitatiu que permet mesurar i comprendre l'activitat econòmica d'un país en el seu conjunt. El <strong>PIB</strong>, com a indicador central de la comptabilitat nacional, constitueix una ferramenta imprescindible per a avaluar l'acompliment econòmic, comparar països i orientar la política macroeconòmica. Les seues tres vies de càlcul (despesa, renda i producció) reflecteixen la identitat fonamental que allò que és produeix és converteix en renda que, al seu torn, és gasta.
 </p>
 <p>
 Tanmateix, el rigor acadèmic i l'honestedat intel·lectual exigeixen reconéixer les <strong>limitacions del PIB</strong>: no mesura l'economia submergida, el treball domèstic no remunerat, les externalitats negatives, la distribució de la renda ni la sostenibilitat mediambiental. Els <strong>indicadors alternatius</strong> —IDH, IPM, GPI, Estalvi Net Ajustat, FNB— enriqueixen l'anàlisi i ofereixen una visió més completa del desenvolupament i el benestar.
 </p>
 <p>
 La cadena de magnituds macroeconòmiques (PIB → PNB → PIN → RN → RP → RPD) i la comptabilitat nacional (SEC-2010, taules input-output) proporcionen el bastiment estadístic sense el qual la macroeconomia mancaria de base empírica. Des de la perspectiva docent, aquests continguts permeten desenvolupar el pensament crític de l'alumnat, convidant-lo a qüestionar què mesuren realment els indicadors econòmics i què queda fora de la mesura, connectant així amb les competències clau de la LOMLOE i amb els reptes del segle XXI: la desigualtat, la sostenibilitat i la cerca d'un desenvolupament veritablement humà.
 </p>
 </div>
 </Card>

 {/* ── DESARROLLO ──────────────────────────────────────── */}

 {/* Epígrafe 1 */}
 <Card title="1. La demanda agregada (DA)" icon="📘">
 <TheoryBlock title="1.1. Concepte de demanda agregada" color="blue">
 <p>
 La <strong>demanda agregada (DA)</strong> representa la <strong>quantitat total de béns i serveis que tots els agents econòmics (llars, empreses, sector públic i sector exterior) estan disposats a adquirir a cada nivell de preus</strong>, en un període determinado. A diferència de la demanda microeconòmica de un bé individual, la DA es refereix a la producció total de la economia i es relaciona amb el nivell general de preus (P).
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.2. Components de la demanda agregada" color="indigo">
 <p>
 Los componentes de la DA coincideixen amb els del PIB calculat per la vía de la despesa:
 </p>
 <p>
 <strong>Consum privado (C):</strong> despesa de les llars en béns i serveis (duraderos, no duraderos i serveis). Es el component més important (entorn del 55-60 % del PIB en España). Depén de la renda disponible, la riquesa, les expectatives i els tipus d'interés.
 </p>
 <p>
 <strong>Inversió (I):</strong> despesa de les empreses en béns de capital (maquinaria, equipos, construcció) i variació de existències. Es el component més volátil del PIB. Depén del tipus d'interés, les expectatives de benefici, la utilització de la capacitat productiva i la confianza empresarial.
 </p>
 <p>
 <strong>Despesa públic (G):</strong> despesa de les administracions públiques en béns i serveis (excloses les transferències, que no són despesa en producció). Inclou consum públic (funcionaris, material) e inversió pública (infraestructures).
 </p>
 <p>
 <strong>Exportacions netas (X − M):</strong> diferència entre exportacions (béns i serveis vendidos al exterior) e importacions (béns i serveis comprados del exterior). Dependen del tipus de canvi, la renda dla resta del mundo, la competitivitat i els preus relatius.
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="DA: Y = C + I + G + (X − M)"
 desc="Identitat fonamental de la demanda agregada"
 />

 <TheoryBlock title="1.3. La corba de DA: pendent negativa" color="green">
 <p>
 La corba de DA té <strong>pendent negativa</strong> en el plano (Y, P): quan el nivell general de preus puja, la quantitat total demandada de béns i serveis disminueix, i viceversa. Aquesta relació inversa s'explica por tres efectes:
 </p>
 <p>
 <strong>1. Efecte riquesa (Pigou):</strong> un augment del nivell de preus redueix el valor real de els actius financieros de les llars (dinero, bonos), la qual cosa disminueix la seua riquesa percibida y, per tant, el seu consum. Arthur Cecil Pigou (1943) va formalitzar aquest canal.
 </p>
 <p>
 <strong>2. Efecte tipus d'interés (Keynes):</strong> un augment de preus eleva la demanda de diner (para transaccions), la qual cosa pressiona al alza els tipus d'interés. Tipus d'interés més altos redueixen la inversió i el consum a crédito. Aquest és el mecanisme central en el model keynesiano.
 </p>
 <p>
 <strong>3. Efecte tipus de canvi (Mundell-Fleming):</strong> un augment del nivell de preus interno encareix els productes nacionals enfront dels extranjeros, la qual cosa redueix les exportacions (X) i augmenta les importacions (M), disminueixndo les exportacions netas (X − M). Robert Mundell (Nobel 1999) i Marcus Fleming van desenvolupar aquest canal en el contexto de economies abiertas.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.4. Desplaçaments de la corba de DA" color="amber">
 <p>
 La corba de DA se <strong>desplaza a la dreta</strong> (augment de la DA) quan, a cada nivell de preus, se demanda més producció total. Això pot ocurrir por:
 </p>
 <p>
 <strong>Canvis en C:</strong> augment de la confianza de els consumidors, reducció de impostos directes, augment de la riquesa (efecte riquesa positiu).
 </p>
 <p>
 <strong>Canvis en I:</strong> millora de les expectativas empresariales, avances tecnològics, reducció de tipus d'interés, incentius fiscales a la inversió.
 </p>
 <p>
 <strong>Canvis en G:</strong> augment de la despesa públic (política fiscal expansiva).
 </p>
 <p>
 <strong>Canvis en XN:</strong> creixement de la economia mundial, depreciació del tipus de canvi, millora de la competitivitat.
 </p>
 <p>
 <strong>Política fiscal expansiva</strong> (↑G o ↓T) i <strong>política monetària expansiva</strong> (↑M, ↓i) desplacen la DA a la dreta. Els seus contrapartides restrictives la desplacen a l'esquerra.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 2 */}
 <Card title="2. L'oferta agregada (OA)" icon="📘">
 <TheoryBlock title="2.1. Concepte d'oferta agregada" color="blue">
 <p>
 La <strong>oferta agregada (OA)</strong> representa la <strong>quantitat total de béns i serveis que les empreses de la economia estan disposades a produir i vendre a cada nivell de preus</strong>, dados els costos de producció, la tecnologia i els recursos disponibles. La forma de la corba d'OA és objecte de un dels debates més importants de la macroeconomia: el debate entre la visión <strong>clásica/neoclásica</strong> (OA vertical) i la visión <strong>keynesiana</strong> (OA amb pendent positiva o incluso horizontal).
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.2. Oferta agregada a curt termini (OACP)" color="indigo">
 <p>
 A <strong>corto termini</strong>, la corba d'OA té <strong>pendent positiva</strong>: un augment del nivell de preus indueix a les empreses a produir más. Existeixen tres models que explican aquesta pendent positiva:
 </p>
 <p>
 <strong>1. Model de salaris rígidos (keynesiano):</strong> els salaris nominales es fixen mitjançant contractes (convenios colectivos) i no s'ajusten immediatament a canvis en el nivell de preus. Si els preus pugen i els salaris romanen fijos, el salari real (W/P) disminueix, la qual cosa redueix els costos laborales reals de les empreses e incentiva la contractació i la producció.
 </p>
 <p>
 <strong>2. Model de informació imperfecta (Lucas):</strong> les empreses poden confondre un augment del nivell general de preus amb un augment del preu relatiu de el seu producte, la qual cosa les porta a augmentar la producció. Robert Lucas (Nobel 1995) va formalitzar aquest enfoque en la seua teoria de les <em>expectativas racionals</em>.
 </p>
 <p>
 <strong>3. Model de preus rígidos (neokeynesians):</strong> algunes empreses no s'ajusten els seus preus immediatament (costs de menú, contractes a llarg termini). Las que mantenen preus fijos ven augmentar les seues vendes quan la DA augmenta, la qual cosa eleva la producció total.
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.3. Oferta agregada a llarg termini (OALP)" color="green">
 <p>
 A <strong>largo termini</strong>, la corba d'OA és <strong>vertical</strong> al nivell del <strong>PIB potèncial</strong> (Y*), també anomenat producció de plena ocupació o producció natural. Això significa que, a llarg termini, la producció no depén del nivell de preus, sino de els <strong>factores reals de la economia</strong>: la quantitat i qualitat del treball, el estoc de capital, els recursos naturales i la tecnologia.
 </p>
 <p>
 A llarg termini, els salaris i els preus són <strong>perfectament flexibles</strong> i s'ajusten completament a qualsevol variació del nivell de preus, de modo que el salari real es manté en el seu nivelll de equilibri i la economia opera en la seua producció potèncial. Aquesta és la posició de la <strong>escola clàssica i neoclàssica</strong>: a llarg termini, la economia tendeix per si sola al plena ocupació.
 </p>
 <p>
 El PIB potèncial (Y*) creix al llarg del tiempo gracias al progrés tecnològic, la acumulació de capital i el creixement de la població activa. La <strong>taxa natural de desocupació</strong> (Friedman, 1968; Phelps, 1967) és compatible amb el plena ocupació en sentit econòmic: inclou el atur friccional i estructural, però no el atur cíclic.
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.4. Desplaçaments de la corba d'OA" color="amber">
 <p>
 La corba d'OA és desplaça quan cambian els <strong>costs de producció</strong> o la <strong>capacitat productiva</strong> de la economia:
 </p>
 <p>
 <strong>Desplaçament a la dreta (augment de OA):</strong> avances tecnològics, reducció de costs de matèries primeres, disminució de salaris reales, desregulació, millora del capital humano, descobriment de nous recursos.
 </p>
 <p>
 <strong>Desplaçament a l'esquerra (disminució de OA):</strong> augment del preu del petroli o matèries primeres (shock de oferta negatiu), increment de salaris, catástrofes naturales, regulacions més estrictes, augment de les expectativas de inflació dels treballadors (que negocian salaris més altos).
 </p>
 <p>
 Els <strong>shocks de oferta negatius</strong> són especialment problemàtics perquè provoquen simultàniament menor producció (recessió) i majors preus (inflació), una combinació coneguda com <strong>estanflació</strong> (concepte encunyat en els anys 70 tras les crisis del petroli de 1973 i 1979).
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 3 */}
 <Card title="3. L'equilibri macroeconòmic" icon="📘">
 <TheoryBlock title="3.1. Equilibri a curt termini" color="blue">
 <p>
 El <strong>equilibri macroeconòmic a curt termini</strong> és determina en la intersecció de la corba de <strong>DA</strong> i la corba de <strong>OACP</strong>. En el punt de equilibri, la quantitat total de béns i serveis que els agents desitgen comprar (DA) coincideix amb la quantitat que les empreses desitgen produir (OACP), determinant-se simultàniament el <strong>nivell de producció de equilibri (Y*)</strong> i el <strong>nivell general de preus de equilibri (P*)</strong>.
 </p>
 <p>
 Si el nivell de preus fora superior al de equilibri, hi hauria un excés de oferta agregada (las empreses producirían més del que es demanda), la qual cosa pressionaria els preus a la baja. Si el nivell de preus fora inferior al de equilibri, hi hauria un excés de demanda agregada, la qual cosa pressionaria els preus al alza. El mecanisme de ajuste tendeix a portar la economia cap a el equilibri.
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="Equilibrio CP: DA = OA_CP → (P*, Y*)"
 desc="Intersecció de demanda agregada i oferta agregada a curt termini"
 />

 <TheoryBlock title="3.2. Equilibri a llarg termini" color="indigo">
 <p>
 El <strong>equilibri macroeconòmic a llarg termini</strong> és produeix quan les tres corbes se intersecan en el mateix punto: <strong>DA = OACP = OALP</strong>. En aquest punto, la producció coincideix amb el <strong>PIB potèncial</strong> (Y*), no hi ha presiones inflacionistas ni deflacionistas, i la economia opera a la seua taxa natural de desocupació.
 </p>
 <p>
 En el equilibri a llarg termini, els preus i salaris s'han ajustat completament, les expectatives de inflació s'han cumplido i no hi ha incentius per a que les empreses modifiquen el seu nivelll de producció. Aquesta és la situació ideal, però la economia pot desviarse de ella durant períodes prolongados (cicle econòmic).
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.3. Bretxes de producció" color="green">
 <p>
 Quan la producció de equilibri a curt termini difiere del PIB potèncial, és produeix una <strong>brecha de producció</strong> (<em>output gap</em>):
 </p>
 <p>
 <strong>Brecha recesiva (Y &lt; Y*):</strong> la producció efectiva és inferior al PIB potèncial. Hi ha recursos ociosos, atur cíclic i pressió deflacionista. Se produce quan la DA és insuficient per a absorbir tota la producció potèncial (típico de les recesiones).
 </p>
 </TheoryBlock>

 <FormulaBox
 formula="Brecha recesiva: Y < Y_potèncial → atur cíclic"
 desc="La producció efectiva es situa per davall de la capacitat productiva"
 />

 <TheoryBlock color="green">
 <p>
 <strong>Brecha expansiva (Y &gt; Y*):</strong> la producció efectiva supera temporalment al PIB potèncial (por sobreutilització dels factores: horas extras, turnos adicionales, retraso del manteniment). Hi ha pressió inflacionista. Se produce quan la DA excede la capacitat productiva normal (típico dels booms).
 </p>
 <p>
 La mesura de la brecha de producció és fonamental per a la política econòmica: una bretxa recessiva justifica políticas expansives; una bretxa expansiva justifica políticas restrictives.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.4. Mecanisme d'ajust automàtic a llarg termini" color="violet">
 <p>
 Segons la <strong>visión clásica/neoclásica</strong>, la economia tendeix a autocorregirse a llarg termini sense necessitat de intervenció pública:
 </p>
 <p>
 <strong>Brecha recesiva:</strong> el atur cíclic pressiona els salaris a la baixa → els costos de producció disminueixen → la OACP és desplaça a la dreta → la producció augmenta fins a assolir Y* (con preus més bajos).
 </p>
 <p>
 <strong>Brecha expansiva:</strong> la sobreutilització de recursos pressiona els salaris al alza → els costos de producció augmenten → la OACP és desplaça a l'esquerra → la producció se redueix fins a Y* (con preus més altos).
 </p>
 <p>
 Els <strong>keynesians</strong> qüestionen aquest mecanisme de ajust automàtic argumentando que: (1) els salaris són <strong>rígidos a la baja</strong> (els treballadors i sindicats es resisteixen a recortes salariales); (2) el ajuste és <strong>lento i costós</strong> (puede tardar anys, durant els quals hi ha desocupació massiva); (3) com dijo Keynes: «a llarg termini, todos morts». Per tant, la intervenció de l'Estat mitjançant políticas de demanda és necessària i desitjable per a escurçar les recessions.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 4 */}
 <Card title="4. Pertorbacions i polítiques" icon="📘">
 <TheoryBlock title="4.1. Pertorbacions de demanda" color="blue">
 <p>
 Una <strong>pertorbació positiva de demanda</strong> (p. ej., un augment de la despesa pública, una reducció de impostos o un augment de la confianza de els consumidors) desplaça la corba de DA a la dreta. A curt termini, la producció (Y) i els preus (P) augmenten: el nou equilibri es situa en una posició amb major producció i preus més altos.
 </p>
 <p>
 Si la economia partía de una bretxa recessiva, la expansió de la DA pot acercar la producció al PIB potèncial (efecte desitjat). Si la economia estava ja en equilibri a llarg termini, la expansió genera una bretxa expansiva amb pressió inflacionista.
 </p>
 <p>
 Una <strong>pertorbació negativa de demanda</strong> (caída de la inversió, crisis financiera, austeritat fiscal) desplaça la DA a l'esquerra, reduciendo la producció i els preus a curt termini (recessió).
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.2. Pertorbacions d'oferta" color="indigo">
 <p>
 Un <strong>shock de oferta negatiu</strong> (p. ej., una subida brusca del preu del petroli, com en les crisis de 1973 i 1979, o una pandemia com la de 2020) desplaça la corba d'OACP a l'esquerra. El resultat és especialment problemàtic: la producció disminueix (recessió) i els preus augmenten (inflació) simultàniament. Aquesta combinació s'anomena <strong>estanflació</strong> (stagflation = stagnation + inflation).
 </p>
 <p>
 La estanflació plantea un <strong>dilema</strong> per a la política econòmica: si el govern aplica políticas expansives per a combatre la recessió, agreuja la inflació; si aplica políticas restrictives per a combatre la inflació, agreuja la recessió. Aquest dilema va ser especialment agudo durant les crisis del petroli i va contribuir al qüestionament del paradigma keynesià i al auge del monetarisme (Friedman).
 </p>
 <p>
 Un <strong>shock de oferta positiu</strong> (innovació tecnològica, caiguda del preu de la energia) desplaça la OACP a la dreta: la producció augmenta i els preus baixen (escenario ideal).
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.3. Polítiques de demanda" color="green">
 <p>
 Les <strong>políticas de demanda</strong> són aquelles que actuen sobre la demanda agregada per a estabilizar la economia:
 </p>
 <p>
 <strong>Política fiscal:</strong> el govern modifica el despesa públic (G) i els impostos (T). Una <strong>política fiscal expansiva</strong> (↑G o ↓T) desplaça la DA a la dreta, augmentando la producció i el ocupació (pero també els preus). Una <strong>política fiscal restrictiva</strong> (↓G o ↑T) desplaça la DA a l'esquerra. Es el instrument keynesià per excel·lència.
 </p>
 <p>
 <strong>Política monetaria:</strong> el banc central modifica la oferta monetaria (M) i els tipus d'interés (i). Una <strong>política monetària expansiva</strong> (↑M, ↓i) abarata el crédito, estimula la inversió i el consum, i desplaça la DA a la dreta. Una <strong>política monetària restrictiva</strong> (↓M, ↑i) encareix el crédito i desplaça la DA a l'esquerra. En la eurozona, és responsabilitat del BCE.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.4. Polítiques d'oferta" color="amber">
 <p>
 Les <strong>políticas de oferta</strong> busquen augmentar la capacitat productiva de la economia (desplazar la OALP i la OACP a la dreta), permitiendo un creixement no inflacionista a llarg termini:
 </p>
 <p>
 <strong>Reformas estructurales:</strong> millora del funcionament dels mercats (de treball, de productes, financieros), reducció de la burocràcia, millora del marc regulatorio.
 </p>
 <p>
 <strong>Inversió en I+D+i:</strong> fomento de la investigació, el desenvolupament i la innovació tecnològica per a augmentar la productivitat total dels factores.
 </p>
 <p>
 <strong>Inversió en capital humano:</strong> millora del sistema educatiu i de la formació profesional.
 </p>
 <p>
 <strong>Inversió en infraestructures:</strong> transportes, comunicacions, energia, que facilitan la activitat productiva.
 </p>
 <p>
 <strong>Desregulació i liberalització:</strong> reducció de barreras de entrada, fomento de la competencia.
 </p>
 <p>
 Las políticas de oferta són complementàries a les de demanda: mentre les polítiques de demanda actuen sobre el cicle econòmic a curt termini, les d'oferta milloren el potèncial de creixement a llarg termini.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.5. El debat clàssics vs. keynesians" color="violet">
 <p>
 El model OA-DA permet ilustrar una de les controversias més importants de la historia del pensament macroeconòmic:
 </p>
 <p>
 <strong>Visión clásica/neoclásica (y monetarista):</strong> la economia tendeix al plena ocupació per si sola, gracias a la flexibilitat de preus i salaris. La intervenció de l'Estat és innecesaria o contraproduent: la política fiscal sols genera inflació a llarg termini (crowding-out) i la política monetària sols afecta els preus, no a la producció real (neutralitat del diner a llarg termini). Las políticas de oferta són preferibles a les de demanda. Representantes: Adam Smith, Say, Marshall, Friedman, Lucas.
 </p>
 <p>
 <strong>Visión keynesiana:</strong> la economia pot permanecer en equilibri amb desocupació (trampa de la liquidez, rigideces). El ajust automàtic és lent, incert i costós. La intervenció de l'Estat mitjançant políticas de demanda (fiscal i monetaria) és necessària per a estabilizar la economia i escurçar les recessions. «A llarg termini, todos morts» (Keynes, 1923). Representantes: Keynes, Samuelson, Hicks, Stiglitz, Krugman.
 </p>
 <p>
 La <strong>síntesi neoclàssica</strong> (Hicks, Samuelson) intentó reconciliar ambas visiones: a curt termini, la economia funciona de forma keynesiana (rigideces, atur involuntari, eficàcia de les políticas de demanda); a llarg termini, tendeix al equilibri clàssic (flexibilitat de preus, neutralitat del diner). El model OA-DA reflecteix aquesta síntesi: la OACP té pendent positiva (visión keynesiana del curt termini) i la OALP és vertical (visión clàssica del llarg termini).
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 5 */}
 <Card title="5. Rellevància curricular" icon="📘">
 <TheoryBlock title="5.1. Marc normatiu i propostes didàctiques" color="blue">

 El model de oferta y demanda agregadas s'emmarca en la <strong>LOMLOE</strong> (Llei Orgànica 3/2020) i en el <strong>Reial Decret 243/2022</strong> (currículum de Batxillerat). En la matèria d'<strong>Economia de 1r de Batxillerat</strong>, els sabers bàsics incluyen: «funcionament del mercat», «papel de l'Estat en la economia», «políticas macroeconòmicas», «creixement econòmic i les seues límites». Las competències específiques implicades són CE1, CE5 i CE6.
 </p>
 <p>
 Desde la perspectiva didàctica, el model OA-DA es presta especialment al <strong>anàlisi gràfic</strong>, que permet al alumnado visualizar els efectes de les pertorbacions i les políticas econòmicas. Se proposen les següents activitats:
 </p>
 <p>
 <strong>1. Anàlisi gràfic de escenarios:</strong> dado un gràfic OA-DA, el alumno ha de identificar pertorbacions, desplaçaments i efectes sobre P e Y.
 </p>
 <p>
 <strong>2. Debate clàssics vs. keynesians:</strong> dividir la clase en dos grupos que defensen cada visión ante una crisis econòmica simulada.
 </p>
 <p>
 <strong>3. Estudio de caso:</strong> anàlisi de la crisis del petroli de 1973 o la Gran Recessió de 2008 mitjançant el model OA-DA.
 </p>
 <p>
 <strong>Competencias clave:</strong> STEM (modelització gràfica), CC (debate sobre intervenció pública), CPSAA (comprensió del entorn econòmic), CE (anàlisi de políticas).
 </p>
 </TheoryBlock>
 </Card>

 {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
 <Card title="Conclusió" icon="📌">
 <div className="text-sm text-slate-700 leading-relaxed space-y-3">
 <p>
 El model de <strong>oferta i demanda agregadas</strong> constitueix el marc analític fonamental de la macroeconomia, anàleg al model de oferta i demanda de mercat en microeconomia, però aplicat al conjunto de la economia. La <strong>demanda agregada</strong>, amb els seus quatre componentes (C, I, G, X−M) i la seua pendent negativa (explicada por els efectes riquesa, tipus d'interés i tipus de canvi), reflecteix el despesa total planificat a cada nivell de preus. La <strong>oferta agregada</strong> distingeix entre el curt termini (pendent positiva, rigideces de preus i salaris) i el llarg termini (vertical al PIB potèncial, flexibilitat completa).
 </p>
 <p>
 El <strong>equilibri macroeconòmic</strong> és determina en la intersecció de DA i OA, generándose brechas recesivas (Y &lt; Y*) o expansives (Y &gt; Y*) quan la producció difiere del potèncial. Les <strong>pertorbacions de demanda</strong> generen moviments correlatius en producció i preus, mentre que les <strong>pertorbacions de oferta</strong> poden generar estanflació (combinació perversa de recessió e inflació). Les <strong>políticas de demanda</strong> (fiscal i monetaria) busquen estabilizar el ciclo a curt termini; les <strong>políticas de oferta</strong> busquen augmentar el potèncial productiu a llarg termini.
 </p>
 <p>
 El <strong>debate clàssics-keynesians</strong>, lluny de ser un assumpte merament històric, continua vivo en l'actualitat: les respostes a la Gran Recessió (2008), la pandemia de COVID-19 (2020) i la crisis energètica (2022) han reavivar la discusión sobre el papel de l'Estat i la eficàcia de les políticas macroeconòmicas. La síntesi neoclàssica —keynesianismo a curt termini, classicisme a llarg termini— continua sent el marc de referència dominante, i el model OA-DA la seua ferramenta pedagògica més poderosa. Des de la perspectiva docent, dominar aquest model i ser capaç de aplicar-lo a situacions reals és una competència esencial del futuro profesor de Economia.
 </p>
 </div>

 const Tema23Complet = () => (
 <div className="space-y-6 animate-fade">
 {/* ── INTRODUCCIÓN ────────────────────────────────────── */}
 <Card title="Introducció" icon="📌">
 <div className="text-sm text-slate-700 leading-relaxed space-y-3">
 <p>
 El model de la <strong>creu keynesiana</strong> (model renda-despesa) constitueix una de les ferramentes analítiques més importants de la macroeconomia. Desenvolupat a partir de la <em>Teoria general</em> de John Maynard Keynes (1936), aquest model explica com és determina el <strong>nivell de renda de equilibri</strong> en una economia a través de la interacció entre el despesa agregada planificat i la producció. La seua aportació més cèlebre és el concepte de <strong>multiplicador</strong>: un increment de la despesa autònom genera un augment amplificat de la renda, a causa de les successives rondes de despesa que es desencadenen en la economia.
 </p>
 <p>
 Des de la perspectiva curricular, el model renda-despesa i el multiplicador connecten directament amb els sabers bàsics del bloc «La realitat econòmica» de la matèria d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022) i amb les competències específiques CE1 (funcionament del sistema econòmic), CE5 (anàlisi de la política econòmica) i CE6 (comprensió de la conjuntura). La LOMLOE subratlla la importància que l'alumnat comprenga els mecanismes de transmissió de les polítiques fiscals i la seua efecte amplificat sobre la activitat econòmica, contribuint a les competències STEM (resolució numèrica, modelització), CC (debate sobre la intervenció pública) i CPSAA (comprensió del entorn econòmic).
 </p>
 <p>
 El present tema s'estructura en cinc epígrafs: en primer lloc, se presenta el model renda-despesa simplificado (creu keynesiana); en segon lloc, és determina la renda de equilibri; en tercer lloc, és desenvolupa el concepte de multiplicador i les seues variantes; en quart lloc, se amplía el model incorporando el sector públic i el sector exterior; i en cinquè lloc, s'analitza la rellevància curricular. Es conclou amb una síntesi integradora i una bibliografia de referència.
 </p>
 </div>
 </Card>

 {/* ── DESARROLLO ──────────────────────────────────────── */}

 {/* Epígrafe 1 */}
 <Card title="1. El model renda-despesa (creu keynesiana)" icon="📘">
 <TheoryBlock title="1.1. Supòsits simplificadors" color="blue">
 <p>
 El model renda-despesa part de una sèrie de <strong>supòsits simplificadors</strong> que permeten aislar el mecanisme del multiplicador. En la seua versió més básica, s'assumeix una <strong>economia cerrada sense sector públic</strong> (sin govern ni comercio exterior), <strong>preus fijos</strong> (las empreses s'ajusten la producció, no els preus, ante canvis en la demanda) i <strong>capacitat ociosa</strong> (existeixen recursos productius aturats, de modo que la producció pot expandir-se sense presiones inflacionistas). Aquests supòsits situen el model en el <strong>corto termini keynesiano</strong>, on la oferta agregada és perfectament elástica i la producció està determinada exclusivament per la demanda.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.2. La funció de consum keynesiana" color="indigo">
 <p>
 La <strong>funció de consum keynesiana</strong> estableix que el consum agregat (C) depén linealment de la renda disponible (Y):
 </p>
 <p>
 <strong>C = C₀ + c·Y</strong>
 </p>
 <p>
 On <strong>C₀</strong> és el <strong>consum autònom</strong> (nivel mínim de consum independiente de la renda, finançat amb estalvis o endeutament) i <strong>c</strong> és la <strong>propensió marginal a consumir (PMC)</strong>, que indica la fracció de cada unitat addicional de renda que es destina al consum. Keynes postuló que 0 &lt; c &lt; 1, és a dir, que les familias consumen una part de cada euro addicional i ahorran el resto. La <strong>ley psicològica fonamental</strong> de Keynes afirma que, com norma general, els individus tendeixen a augmentar el seu consum quan augmenta la seua renda, però en una proporció menor al augment de la renda.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.3. La funció d'estalvi" color="green">
 <p>
 Dado que la renda es destina íntegrament a consum o estalvi (Y = C + S), la <strong>funció d'estalvi</strong> se deriva directament de la funció de consum:
 </p>
 <p>
 <strong>S = Y − C = Y − (C₀ + c·Y) = −C₀ + (1−c)·Y = −C₀ + s·Y</strong>
 </p>
 <p>
 On <strong>s = 1 − c</strong> és la <strong>propensió marginal al estalvi (PMA)</strong>. Si c = 0,8, aleshores s = 0,2: de cada euro addicional de renda, 80 céntimos se consumen i 20 se ahorran. El estalvi autònom és negatiu (−C₀), la qual cosa indica que a nivells molt bajos de renda les famílies desestalvian.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.4. La inversió autònoma" color="amber">
 <p>
 En el model simplificado, la <strong>inversió (I₀)</strong> se considera <strong>autónoma</strong>, és a dir, independiente del nivell de renda corriente. La inversió depén fonamentalment de les <strong>expectativas empresariales</strong> sobre la rendibilitat futura dels proyectos i del <strong>tipus d'interés</strong>. Keynes va introduir el concepte de <strong>eficiència marginal del capital</strong> (EMK): la taxa interna de rendiment esperada de un proyecto de inversió. Las empreses invertirán sempre que la EMK supere el tipus d'interés de mercat (EMK &gt; i). Aquesta dependència de les expectativas —lo que Keynes va denominar <em>animal spirits</em>— confereix a la inversió un carácter inherentment volátil e inestable.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.5. Despesa agregada planificada" color="purple">
 <p>
 Combinando les funcions de consum e inversió, obtenemos el <strong>despesa agregada planificat (GA)</strong>:
 </p>
 <p>
 <strong>GA = C + I = C₀ + c·Y + I₀ = (C₀ + I₀) + c·Y</strong>
 </p>
 <p>
 El despesa agregada és una funció lineal de la renda amb pendent c (la propensió marginal a consumir) i ordenada en el origen igual a la suma dels componentes autònoms (C₀ + I₀). Aquesta funció constitueix la <strong>línea de despesa agregada</strong> del model de la creu keynesiana.
 </p>
 </TheoryBlock>
 </Card>

 <FormulaBox
 formula="GA = C + I = C₀ + c·Y + I₀ = (C₀ + I₀) + c·Y"
 desc="Despesa agregada planificada en el model simplificat"
 />

 {/* Epígrafe 2 */}
 <Card title="2. La renda d'equilibri" icon="📘">
 <TheoryBlock title="2.1. Condició d'equilibri" color="blue">
 <p>
 El <strong>equilibri</strong> en el model renda-despesa s'assoleix quan la <strong>producció total (Y) és igual al despesa agregada planificat (GA)</strong>. És a dir, quan les empreses producen exactament la quantitat que els agents econòmics desitgen comprar, de modo que no hi ha acumulació ni desacumulació involuntària de existències:
 </p>
 <p>
 <strong>Y = GA → Y = C₀ + c·Y + I₀</strong>
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.2. Resolució algebraica" color="indigo">
 <p>
 Resolviendo la equació de equilibri per a Y:
 </p>
 <p>
 Y − c·Y = C₀ + I₀ → Y(1 − c) = C₀ + I₀
 </p>
 <p>
 <strong>Y* = (C₀ + I₀) / (1 − c) = (C₀ + I₀) / s</strong>
 </p>
 <p>
 La renda de equilibri és un múltiplo dels componentes autònoms de la despesa, on el factor de amplificació depén inversament de la propensió marginal al estalvi (s = 1 − c).
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.3. Enfocament alternatiu: S = I" color="green">
 <p>
 El equilibri també pot expresarse mitjançant la condició de que les <strong>injeccions sean iguales a les filtracions</strong>. En la economia simplificada (sin sector públic ni sector exterior), la única injecció és la inversió (I) i la única filtració és el estalvi (S). Así, en equilibri:
 </p>
 <p>
 <strong>S = I</strong> → −C₀ + s·Y = I₀ → Y* = (C₀ + I₀) / s
 </p>
 <p>
 Ambos enfoques (Y = GA i S = I) condueixen al mateix resultat, la qual cosa confirma la consistencia del model.
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.4. Representació gràfica: la creu keynesiana" color="amber">
 <p>
 Gràficament, la <strong>creu keynesiana</strong> se construeix en un diagrama amb la renda (Y) en el eje horizontal i el despesa agregada (GA) en el eje vertical. Se traza una <strong>línea de 45°</strong> que representa tots els punts on Y = GA (condició de equilibri) i la <strong>línea de despesa agregada</strong> (GA = (C₀ + I₀) + c·Y), que té pendent c &lt; 1. El equilibri es troba en la intersecció de ambas líneas. A la esquerra del equilibri, GA &gt; Y (excés de demanda → les empreses augmenten la producció). A la dreta, GA &lt; Y (excés d'oferta → les empreses redueixen la producció). Así, el equilibri és estable.
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.5. Paradoxa de la frugalitat" color="purple">
 <p>
 La <strong>paradoxa de la frugalitat</strong> (paradoxa de l'estalvi) és una de les ideas més contraintuïtives de Keynes: si <strong>todos les llars intentan ahorrar más</strong> (augment de s, disminució de c), el resultat agregat és una <strong>caída de la renda de equilibri</strong> (Y*), de modo que el <strong>estalvi total no augmenta finalment</strong> (o incluso disminueix). El mecanisme és el següent: un augment de s redueix el consum → disminueix el despesa agregada → cauen les vendes i la producció → se redueix la renda → cau el estalvi induït. En equilibri, S continua sent igual a I₀ (que és autònoma), però amb un nivell de renda més bajo. Aquesta paradoja subraya el papel central de la demanda en la determinació de la renda.
 </p>
 </TheoryBlock>
 </Card>

 <FormulaBox
 formula="Y* = (C₀ + I₀) / (1 − c) = (C₀ + I₀) / s"
 desc="Renda d'equilibri en el model simplificat"
 />

 {/* Epígrafe 3 */}
 <Card title="3. El multiplicador" icon="📘">
 <TheoryBlock title="3.1. Concepte" color="blue">
 <p>
 El <strong>multiplicador</strong> és el concepte més important del model renda-despesa. Mide el <strong>efecte amplificat</strong> que un cambio en el despesa autònom (inversió, consum autònom, despesa pública) produce sobre la renda de equilibri. Un increment de la despesa autònom genera un augment de la renda que és <strong>varias veces superior</strong> al increment inicial de la despesa. El multiplicador va ser originalment desenvolupat por Richard Kahn (1931) en el contexto dels programas de obras públiques, i Keynes lo va incorporar com peça central de la seua teoria.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.2. Derivació del multiplicador simple" color="indigo">
 <p>
 A partir de la expressió de la renda de equilibri Y* = (C₀ + I₀) / (1 − c), si és produeix un increment de la despesa autònom (per exemple, ΔI₀):
 </p>
 <p>
 <strong>ΔY = ΔI₀ / (1 − c) = ΔI₀ / s</strong>
 </p>
 <p>
 El <strong>multiplicador simple</strong> es:
 </p>
 <p>
 <strong>k = 1 / (1 − c) = 1 / s</strong>
 </p>
 <p>
 Cuanto major sea la propensió marginal a consumir (c), major será el multiplicador, perquè una major proporció de cada increment de renda es tradueix en nou despesa.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.3. Exemple numèric" color="green">
 <p>
 Supongamos que la propensió marginal a consumir és c = 0,8 (y per tant s = 0,2). El multiplicador será:
 </p>
 <p>
 k = 1 / (1 − 0,8) = 1 / 0,2 = <strong>5</strong>
 </p>
 <p>
 Si la inversió autònoma augmenta en ΔI₀ = 100 millones de euros:
 </p>
 <p>
 ΔY = k · ΔI₀ = 5 × 100 = <strong>500 millones de euros</strong>
 </p>
 <p>
 És a dir, un increment de la inversió de 100 genera un augment de la renda de equilibri de 500: el efecte final és cinc veces el impulso inicial.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.4. Procés de propagació" color="amber">
 <p>
 El efecte multiplicador s'explica por una <strong>cadena de despesas successius</strong>. El increment inicial de la despesa (ΔI₀ = 100) es converteix en renda per a els factors productius. De esos 100, se consumen c·100 = 80 i se ahorran 20. Esos 80 de consum es converteixn en renda per a altres agents, que consumen c·80 = 64 i ahorran 16. Y així successivament. La suma total és una <strong>sèrie geomètrica</strong>:
 </p>
 <p>
 ΔY = 100 + 100·c + 100·c² + 100·c³ + … = 100 · (1 / (1−c)) = 100 · 5 = 500
 </p>
 <p>
 El procés converge perquè 0 &lt; c &lt; 1, de modo que cada ronda successiva de despesa és menor que la anterior.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.5. El multiplicador amb sector públic" color="purple">
 <p>
 Quan se incorpora el <strong>sector públic</strong> amb impostos proporcionales a la renda (T = t·Y, on t és el tipus impositiu medio), la renda disponible passa a ser Yd = Y − T = Y(1−t), i la funció de consum es converteix en C = C₀ + c·Y(1−t). El multiplicador amb sector públic es:
 </p>
 <p>
 <strong>k = 1 / (1 − c(1−t))</strong>
 </p>
 <p>
 Aquest multiplicador és <strong>menor</strong> que el simple (1/(1−c)) perquè els impostos actuen com <strong>estabilitzador automàtic</strong>: part de cada increment de renda se drena vía impostos antes de convertirse en consum.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.6. El multiplicador amb sector exterior" color="rose">
 <p>
 Quan se incorporan les <strong>importacions</strong> com funció de la renda (M = M₀ + m·Y, on m és la <strong>propensió marginal a importar</strong>), part de cada increment de renda es destina a comprar béns extranjeros (fuga de demanda). El multiplicador amb sector públic i sector exterior es:
 </p>
 <p>
 <strong>k = 1 / (1 − c(1−t) + m)</strong>
 </p>
 <p>
 Aquest multiplicador és encara menor, ja que les importacions representan una filtració addicional del flujo circular de la renda. En economies molt abiertas (m alto), el multiplicador pot ser significativament reduït.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.7. El multiplicador del pressupost equilibrat (Haavelmo)" color="cyan">
 <p>
 El <strong>teorema de Haavelmo</strong> (1945) estableix que un augment simultáneo e igual de la despesa públic i dels impostos (ΔG = ΔT, pressupost equilibrat) té un efecte expansivo neto sobre la renda. El <strong>multiplicador del pressupost equilibrat és igual a 1</strong>: ΔY = ΔG = ΔT. Això es deu a que el multiplicador de la despesa públic (1/(1−c)) és major que el multiplicador dels impostos (−c/(1−c)), ja que ΔG es converteix íntegrament en demanda en la primera ronda, mentre que ΔT sols redueix el consum en c·ΔT (una fracció c de lo recaudado). Trygve Haavelmo va rebre el Premio Nobel de Economia en 1989.
 </p>
 </TheoryBlock>
 </Card>

 <FormulaBox formula="Multiplicador simple: k = 1/(1 − c) = 1/s" desc="Efecte amplificat de la despesa autònoma sobre la renda" />
 <FormulaBox formula="Multiplicador amb sector públic: k = 1/(1 − c(1−t))" desc="Els impostos redueixen el multiplicador (estabilitzador automàtic)" />

 {/* Epígrafe 4 */}
 <Card title="4. Ampliació del model" icon="📘">
 <TheoryBlock title="4.1. Incorporació del sector públic" color="blue">
 <p>
 Al incorporar el <strong>sector públic</strong>, el despesa agregada inclou el despesa públic (G) i la renda disponible es veu modificada pels impostos (T) i les transferències (TR). Si els impostos són proporcionales (T = t·Y) i les transferències són autònomas:
 </p>
 <p>
 GA = C₀ + c·(Y − t·Y + TR) + I₀ + G = (C₀ + c·TR + I₀ + G) + c(1−t)·Y
 </p>
 <p>
 La renda de equilibri amb sector públic es:
 </p>
 <p>
 <strong>Y* = (C₀ + I₀ + G + c·TR − c·T₀) / (1 − c(1−t))</strong>
 </p>
 <p>
 On T₀ són els impostos autònoms (de suma fija) i t el tipus impositiu proporcional. El despesa públic i les transferències tenen efecte expansivo; els impostos tenen efecte contractiu.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.2. Incorporació del sector exterior" color="indigo">
 <p>
 Al incorporar el <strong>sector exterior</strong>, se añaden les exportacions (X, autònomas, determinades per la renda dla resta del mundo i la competitivitat) i les importacions (M = M₀ + m·Y, que depenen de la renda nacional). Las exportacions netas són:
 </p>
 <p>
 XN = X − M₀ − m·Y
 </p>
 <p>
 La propensió marginal a importar (m) indica quina fracció de cada unitat addicional de renda es destina a comprar béns del exterior. Las importacions constitueixen una <strong>filtració</strong> (fuga de demanda interna cap a el exterior) que redueix el multiplicador.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.3. Model complet" color="green">
 <p>
 El model renda-despesa <strong>completo</strong> (con consum, inversió, sector públic i sector exterior) determina la renda de equilibri como:
 </p>
 <p>
 <strong>Y* = (C₀ + I₀ + G + X − M₀ − c·T₀ + c·TR) / (1 − c(1−t) + m)</strong>
 </p>
 <p>
 El denominador 1 − c(1−t) + m reflecteix les tres filtracions del flujo circular: el estalvi (1−c por unitat de renda disponible), els impostos (t por unitat de renda bruta) i les importacions (m por unitat de renda). Cuanto majors sean les filtracions, menor será el multiplicador i menor el efecte de les políticas de demanda.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.4. Limitacions del model keynesià simple" color="amber">
 <p>
 El model renda-despesa presenta varias <strong>limitacions</strong> que han de tenerse en cuenta: (1) <strong>preus fijos</strong>: el model ignora els ajustos de preus, la qual cosa és raonable sols a curt termini i amb capacitat ociosa; (2) <strong>tipus d'interés dado</strong>: no es modela la interacció amb el mercat monetario (para ello se requereix el model IS-LM); (3) <strong>oferta pasiva</strong>: s'assumeix que la oferta s'adapta automàticament a la demanda, sense restriccions de capacitat; (4) <strong>expectativas simplificadas</strong>: la inversió se trata com autònoma, sense modelar les expectatives de forma endógena. Estas limitacions van ser superadas por models posteriores (IS-LM, OA-DA), però el model renda-despesa continua sent fonamental com introducció pedagògica a la macroeconomia keynesiana.
 </p>
 </TheoryBlock>
 </Card>

 <FormulaBox formula="Y* = (C₀ + I₀ + G + X − M₀ − cT₀ + cTR) / (1 − c(1−t) + m)" desc="Renda d'equilibri del model complet" />

 {/* Epígrafe 5 */}
 <Card title="5. Rellevància curricular" icon="📘">
 <TheoryBlock title="5.1. Marc normatiu i competències" color="blue">
 <p>
 El model renda-despesa i el multiplicador s'emmarquen en els sabers bàsics del bloc «La realitat econòmica» de <strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), connectant amb les competències específiques CE1 (comprensió del funcionament del sistema econòmic), CE5 (anàlisi de la política econòmica) i CE6 (interpretació de la conjuntura). La resolució algebraica i numèrica del model desarrolla les competències <strong>STEM</strong> (modelització matemática, sèries geométricas, resolució de equacions). El anàlisi del multiplicador fiscal i el debate sobre la intervenció pública contribuyen a les competències <strong>CC</strong> (ciutadana) i <strong>CPSAA</strong> (comprensió del entorn socioeconòmic). La comparació de multiplicadores en distintos escenarios fomenta el pensament crítico i la capacitat de <strong>CE</strong> (emprenedora).
 </p>
 </TheoryBlock>
 </Card>

 {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
 <Card title="Conclusió" icon="📌">
 <div className="text-sm text-slate-700 leading-relaxed space-y-3">
 <p>
 El model de la <strong>creu keynesiana</strong> constitueix el punt de partida del anàlisi macroeconòmic de la determinació de la renda. La seua lógica és senzilla però poderosa: en una economia amb preus rígidos i capacitat ociosa, la <strong>producció s'ajusta a la demanda</strong>, i el despesa agregada planificat determina el nivell de renda de equilibri. La condició Y = GA (o equivalentment S = I) define el equilibri, que pot resoldre's algebraica i gràficament.
 </p>
 <p>
 El <strong>multiplicador</strong> és la aportació més influent del model: un increment de la despesa autònom genera un augment amplificat de la renda a través de successives rondes de consum induït. El multiplicador simple (k = 1/(1−c)) se redueix al incorporar impostos (estabilitzadors automàtics) i propensión a importar, la qual cosa explica per què les polítiques fiscales són menys eficaces en economies abiertas amb elevada pressió fiscal. La <strong>paradoxa de la frugalitat</strong> ilustra de forma brillant la diferència entre la racionalitat individual i els resultats agregats.
 </p>
 <p>
 La <strong>ampliació del model</strong> amb sector públic i sector exterior proporciona una visión més realista, encara que el model continua sent una simplificació que ignora els preus, els tipus d'interés i les expectativas endógenas. Des de la perspectiva docent, el model renda-despesa és una ferramenta pedagògica de primer ordre: permet introducir els conceptes de equilibri macroeconòmic, multiplicador, estabilitzadors automàtics i paradoxa de la frugalitat amb rigor i accessibilitat, preparando al alumnado per a models més complejos (IS-LM, OA-DA).
 </p>
 </div>
 </Card>

 <li>Con sector exterior: k = 1/(1−c(1−t)+m). Importacions redueixen el efecto.</li>
 <li>Pressupost equilibrado (Haavelmo): multiplicador = 1.</li>
 </ul>
 </div>

 {/* Epígrafe 1 */}
 <Card title="1. El consum" icon="📘">
 <TheoryBlock title="1.1. Funció de consum keynesiana" color="blue">
 <p>
 La <strong>funció de consum keynesiana</strong> estableix una relació lineal entre el consum agregat (C) i la renda disponible (Yd):
 </p>
 <p>
 <strong>C = C₀ + c·Yd</strong> (donde 0 &lt; c &lt; 1)
 </p>
 <p>
 On C₀ és el <strong>consum autònom</strong> (consum mínim independiente de la renda) i c és la <strong>propensió marginal al consum (PMC)</strong>, que indica quant augmenta el consum por cada unitat addicional de renda disponible. La <strong>propensión media al consum</strong> (C/Yd) disminueix a mesura que augmenta la renda, ja que el component autònom C₀/Yd perd peso relatiu. Aquesta relació va ser el punt de partida de Keynes en la seua <em>Teoria general</em> (1936).
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.2. Llei psicològica fonamental de Keynes" color="indigo">
 <p>
 Keynes va formular la <strong>ley psicològica fonamental</strong>: «como regla general i en promedio, els homes estan disposats a augmentar el seu consum a mesura que la seua renda creix, però no en la mateixa proporció en que creix la seua renda». Això implica que 0 &lt; c &lt; 1: el consum creix amb la renda, però <strong>menos que proporcionalment</strong>. En conseqüència, la <strong>propensión media al consum</strong> (C/Y) disminueix a mesura que augmenta la renda (los llars més ricos ahorran una proporció major de la seua renda). Aquesta predicció es compleix bé en els datos de secció creuada (comparando llars amb distinta renda en un moment dado), però no tan bé en els datos de sèries temporales (al llarg del tiempo, la propensión media al consum es manté relativament estable). Aquesta discrepància motivó les teories posteriores.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.3. Hipòtesi de la renda permanent (Friedman, 1957)" color="green">
 <p>
 Milton Friedman va proposar la <strong>hipòtesi de la renda permanent</strong> en la seua obra <em>A Theory of the Consumption Function</em> (1957). Segons aquesta teoria, el consum no depén de la renda corrent sino de la <strong>renda permanent</strong>: la renda media esperada al llarg de la vida. Los individus distinguen entre canvis <strong>permanentes</strong> de renda (que afecten al consum en proporció 1:1) i canvis <strong>transitorios</strong> (que se ahorran casi íntegrament). La renda corrent es descompon en: Y = Y_P + Y_T (permanente + transitoria), i el consum depén sols de la permanente: C = k·Y_P. Això explica per què la propensión media al consum és estable a llarg termini (quan Y_T → 0 en promedio).
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.4. Hipòtesi del cicle vital (Modigliani, 1954)" color="amber">
 <p>
 Franco Modigliani (Nobel 1985) i Richard Brumberg van desenvolupar la <strong>hipòtesi del cicle vital</strong>, que sosté que els individus planifican el seu consum al llarg de toda la seua vida per a <strong>mantindre un nivell de consum estable</strong>. Durant la <strong>juventud</strong> (formació), els ingressos són bajos i se endeudan; durant la <strong>vida activa</strong>, ahorran acumulando riquesa; durant la <strong>jubilació</strong>, desestalvian consumiendo lo acumulat. El consum depén de la riquesa total (financiera i humana) més que de la renda corriente: C = (1/T)·(W + R·Y_L), on W és la riquesa acumulada, Y_L els anys de vida laboral restantes i T els anys de vida restantes. Aquesta teoria explica els patrons de estalvi por grupos d'edat i la importancia de la demografía per a el estalvi nacional.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.5. Hipòtesi de la renda relativa (Duesenberry)" color="purple">
 <p>
 James Duesenberry va proposar la <strong>hipòtesi de la renda relativa</strong> (1949), que introduce dos ideas fonamentals: (1) el <strong>efecte demostració</strong>: el consum de un individuo depén no sols de la seua renda absoluta, sino de la seua <strong>posició relativa</strong> respecto a el seu grup de referència (los llars tendeixen a imitar els patrons de consum de les llars amb major renda); (2) el <strong>efecte trinquet</strong> (ratchet effect): els hàbits de consum són <strong>asimétricos</strong>, ja que és fácil augmentar el nivell de consum quan la renda puja, però resulta molt difícil reduirlo quan la renda baixa (rigidez a la baixa del consum). Aquesta teoria explica per què el consum no cau proporcionalment durant les recessions.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.6. Factors determinants del consum" color="rose">
 <p>
 Més allá de la renda disponible, els principals <strong>factores determinantes del consum</strong> són: (1) la <strong>riquesa</strong> (efecte riquesa: un augment en el valor de actius financers o inmobiliarios incentiva el consum); (2) el <strong>tipus d'interés</strong> (un augment del tipus d'interés encareix el crédito al consum i augmenta el rendiment de l'estalvi, però el efecte neto sobre el consum és ambiguo: efecte substitució vs. efecte renda); (3) les <strong>expectativas</strong> (sobre la renda futura, la inflació i la estabilitat laboral); (4) la <strong>distribució de la renda</strong> (los llars amb menor renda tenen major propensió marginal al consum, por la qual cosa políticas redistributivas poden augmentar el consum agregat); (5) les <strong>condicions crediticias</strong> (acceso al crédito, restriccions de liquidez).
 </p>
 </TheoryBlock>
