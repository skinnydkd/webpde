 {/* Epígrafe 2 */}
 <Card title="2. L'estalvi" icon="📘">
 <TheoryBlock title="2.1. Relació estalvi-consum" color="blue">
 <p>
 El <strong>estalvi (S)</strong> és la part de la renda disponible que no es consume: <strong>S = Yd − C</strong>. Sustituyendo la funció de consum keynesiana:
 </p>
 <p>
 <strong>S = Yd − (C₀ + c·Yd) = −C₀ + (1−c)·Yd = −C₀ + s·Yd</strong>
 </p>
 <p>
 On s = 1 − c és la <strong>propensió marginal al estalvi (PMA)</strong>. El estalvi és una funció creixent de la renda disponible: a major renda, major estalvi tanto en términos absolutos com relatius (mayor propensión media al estalvi). El estalvi autònom (−C₀) és negatiu, la qual cosa indica que a nivells molt bajos de renda les famílies desestalvian (consumen més del que ganan, recurriendo a estalvis previos o endeutament).
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.2. Motius de l'estalvi" color="indigo">
 <p>
 Keynes va identificar varios <strong>motius de l'estalvi</strong>: (1) <strong>precaució</strong>: reserva per a imprevistos (malaltia, desocupació); (2) <strong>inversió</strong>: acumulació de capital per a proyectos productius o financieros; (3) <strong>cicle vital</strong>: provisió per a la jubilació (Modigliani); (4) <strong>herencia</strong>: deseo de dejar patrimonio als descendientes (motiu altruista); (5) <strong>mejora</strong>: aspiració a augmentar el nivell de vida futuro; (6) <strong>independència</strong>: libertad per a emprender o tomar decisions sense presiones financieras; (7) <strong>avaricia</strong>: satisfacció intrínseca de acumular riquesa.
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.3. Estalvi i tipus d'interés" color="green">
 <p>
 La relació entre estalvi i tipus d'interés és <strong>ambigua</strong> en la teoria econòmica, ja que operen dos forças contraposades: (1) el <strong>efecte substitució</strong>: un augment del tipus d'interés fa més atractiu el estalvi (mayor rendiment), incentivando la substitució de consum presente por consum futuro; (2) el <strong>efecte renda</strong>: un augment del tipus d'interés significa que es necessita ahorrar menys per a assolir un determinat objectiu financiero futuro (la mateixa renda financiera se consigue amb menys estalvi). El <strong>efecte net</strong> depén de quin dels dos domine: la evidència empírica sugiere que la elasticitat-interés de l'estalvi és pequeña i positiva, però no sempre significativa.
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.4. L'estalvi nacional" color="amber">
 <p>
 El <strong>estalvi nacional (S_N)</strong> és la suma del <strong>estalvi privado</strong> i el <strong>estalvi público</strong>: S_N = S_privado + S_público. El estalvi privado inclou el estalvi de les familias (Yd − C) i el estalvi empresarial (beneficis no distribuidos). El <strong>estalvi público</strong> és la diferència entre els ingressos i els despesas del sector públic: S_público = T − G. Quan T &gt; G, hi ha superávit públic (estalvi públic positiu); quan T &lt; G, hi ha déficit públic (desestalvi público). El estalvi nacional és fonamental perquè financia la inversió: en una economia cerrada, S_N = I; en una economia abierta, S_N = I + XN (cuenta corrent).
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.5. Identitat estalvi-inversió" color="purple">
 <p>
 En una <strong>economia cerrada sense govern</strong>, la identitat contable fonamental és <strong>S = I</strong>: todo la qual cosa es ahorra financia la inversió, i toda inversió requereix estalvi previo o simultáneo. Aquesta identitat ex post (contable) sempre se cumple, però el mecanisme de ajuste difiere segons la escola econòmica: per a els <strong>clásicos</strong>, el tipus d'interés ajusta el estalvi a la inversió (en el mercat de fons prestables); per a els <strong>keynesians</strong>, és la renda la que s'ajusta (vía multiplicador) fins a que el estalvi generado iguala a la inversió autònoma.
 </p>
 </TheoryBlock>
 </Card>

 <FormulaBox
 formula="S = Yd − C = −C₀ + s·Yd"
 desc="Funció d'estalvi: la part de la renda disponible no consumida"
 />

 {/* Epígrafe 3 */}
 <Card title="3. La inversió" icon="📘">
 <TheoryBlock title="3.1. Concepte i tipus" color="blue">
 <p>
 La <strong>inversió</strong> en macroeconomia es refereix al despesa en <strong>béns de capital</strong> que augmenten la capacitat productiva futura de la economia. Se denomina <strong>formació bruta de capital</strong> e inclou tres componentes: (1) <strong>inversió en equipo</strong> (maquinaria, ferramentes, equipos informáticos, vehículos de producció); (2) <strong>inversió en construcció</strong> (edificios industriales, habitatges, infraestructures); (3) <strong>variació de existències</strong> (canvis en els inventarios de matèries primeres, productes en curso i productes terminados). Es fonamental distingir la inversió (variable flujo que añade capital nuevo) de la riquesa o patrimonio (variable stock).
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.2. Inversió bruta vs. neta" color="indigo">
 <p>
 La <strong>inversió bruta (IB)</strong> és el despesa total en béns de capital, incloent la reposició del capital desgastado. La <strong>inversió neta (IN)</strong> és la inversió bruta menys la <strong>depreciació (D)</strong> (consum de capital fijo):
 </p>
 <p>
 <strong>IB = IN + D</strong>
 </p>
 <p>
 La inversió neta mesura el <strong>augment real del estoc de capital</strong>: si IN &gt; 0, el estoc de capital creix i la capacitat productiva augmenta; si IN = 0, sols se repone el capital desgastado; si IN &lt; 0, el estoc de capital disminueix (descapitalització). El creixement econòmic a llarg termini requereix inversió neta positiva i sostenida.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.3. Determinants de la inversió" color="green">
 <p>
 Los principals <strong>determinantes de la inversió</strong> són: (1) el <strong>tipus d'interés</strong>: el cost de oportunitat de la inversió; un augment del tipus d'interés encareix la finançament i redueix la inversió (relació inversa). (2) Les <strong>expectativas empresariales</strong>: les perspectives sobre la demanda futura, els beneficis esperats i la confianza empresarial. Keynes va denominar <em>animal spirits</em> a aquest component irracional i volátil de les expectativas que impulsa les decisions de inversió. (3) El <strong>nivell de activitat econòmica</strong>: un major nivell de producció i vendes incentiva la inversió per a ampliar la capacitat (model del acelerador). (4) La <strong>política fiscal</strong>: incentius fiscales a la inversió (deduccions, amortització acelerada). (5) Els <strong>avances tecnològics</strong>: noves tecnologias crean oportunitats de inversió rendible.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.4. L'eficiència marginal del capital (Keynes)" color="amber">
 <p>
 Keynes va introduir el concepte de <strong>eficiència marginal del capital (EMK)</strong>: la <strong>tasa interna de rendiment (TIR)</strong> esperada del últim proyecto de inversió, és a dir, la taxa de descuento que iguala el cost del bé de capital amb el valor presente dels rendiments futuros esperats que generará al llarg de la seua vida útil. La regla de decisió de inversió es: <strong>invertir si EMK &gt; i</strong> (taxa de interés de mercat). Cuanto major sea la EMK respecto a i, més proyectos de inversió serán rendibles. La <strong>funció d'inversió</strong> relaciona inversament el volumen de inversió amb el tipus d'interés: a menor i, més proyectos superen el llindar de rendibilitat.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.5. La funció d'inversió" color="purple">
 <p>
 La <strong>funció d'inversió</strong> expressa la inversió com funció del tipus d'interés, les expectatives i el nivell de renda:
 </p>
 <p>
 <strong>I = I(i, expectativas, Y)</strong>
 </p>
 <p>
 La relació amb el <strong>tipus d'interés és inversa</strong>: gràficament, la corba de inversió té pendent negativa en el plano (I, i). Desplaçaments de la corba és produeixn por canvis en les expectativas (optimismo/pesimismo), innovacions tecnològicas, canvis en la política fiscal o variacions en la demanda esperada. La <strong>volatilitat de la inversió</strong> és una de les principals fonts de les fluctuacions del cicle econòmic.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.6. Model de l'accelerador" color="rose">
 <p>
 El <strong>model del acelerador</strong> (Clark, 1917) estableix que la inversió neta és proporcional al <strong>cambio en la producció</strong> (no al nivell de producció):
 </p>
 <p>
 <strong>I_neta = v · ΔY</strong>
 </p>
 <p>
 On v és la <strong>relació capital-producto</strong> (capital necessari por unitat de producció). Si ΔY &gt; 0 (la economia crece), se necessita inversió neta positiva per a ampliar la capacitat. Si ΔY = 0 (la economia se estanca), la inversió neta és cero (solo reposició). Si ΔY &lt; 0 (recessió), la inversió neta és negativa. El acelerador explica la <strong>amplificació de les fluctuacions</strong>: pequeñas variacions en la demanda generen grans variacions en la inversió, la qual cosa contribuye a la inestabilitat cíclica.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.7. La q de Tobin" color="cyan">
 <p>
 James Tobin (Nobel 1981) va proposar la <strong>q de Tobin</strong> com indicador de la decisió de inversió:
 </p>
 <p>
 <strong>q = Valor de mercat de la empresa / Coste de reposició del capital</strong>
 </p>
 <p>
 Si <strong>q &gt; 1</strong>: el mercat valora la empresa per damunt del cost de els seus actius → és rendible invertir (comprar capital nou és més barato que comprar una empresa existent). Si <strong>q &lt; 1</strong>: el mercat infravalora la empresa → no és rendible invertir (es més barato adquirir una empresa existent que construir capital nuevo). La q de Tobin integra les expectatives del mercat financiero amb les decisions de inversió real, proporcionando un pont entre la macroeconomia financiera i la real.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 4 */}
 <Card title="4. Estalvi, inversió i creixement" icon="📘">
 <TheoryBlock title="4.1. La identitat S = I en economia oberta" color="blue">
 <p>
 En una <strong>economia abierta</strong>, la identitat estalvi-inversió se amplía: <strong>S − I = XN</strong> (exportacions netas = cuenta corrent). Si un país ahorra més del que invierte (S &gt; I), exporta el excedente de estalvi a la resta del mundo (superávit per compte corrent). Si un país invierte més del que ahorra (I &gt; S), necessita finançament exterior (déficit per compte corrent). Aquesta identitat connecta les decisions internas de estalvi e inversió amb els desequilibris exteriores i els flujos internacionals de capital.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.2. El mercat de fons prestables" color="indigo">
 <p>
 El <strong>mercat de fons prestables</strong> és el model que explica com és determina el tipus d'interés real de equilibri en la economia. La <strong>oferta de fons prestables</strong> proviene de l'estalvi (nacional i exterior): a major tipus d'interés, major incentiu per a ahorrar (pendent positiva). La <strong>demanda de fons prestables</strong> proviene de la inversió: a major tipus d'interés, menor inversió rendible (pendent negativa). El <strong>tipus d'interés de equilibri</strong> és determina en la intersecció de ambas corbes, igualando la quantitat de fondos que els ahorradores desitgen prestar amb la que els inversores desitgen tomar prestada.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.3. Crowding out (efecte expulsió)" color="green">
 <p>
 El <strong>crowding out</strong> o <strong>efecte expulsió</strong> és produeix quan el <strong>déficit público</strong> (G &gt; T) redueix la inversió privada. El mecanisme és el següent: el govern financia el seu dèficit emetent deute pública → augmenta la demanda de fons prestables → puja el tipus d'interés → se encareix la finançament per a les empreses → cau la inversió privada. El efecte expulsió pot ser <strong>parcial</strong> (la inversió privada disminueix, però menys que el augment de la despesa pública) o <strong>total</strong> (la inversió privada cau en la mateixa quantia, anulando el efecte fiscal). Los keynesians argumentan que el crowding out és menor en situacions de recessió i capacitat ociosa; els clàssics consideran que és significatiu sempre.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.4. Estalvi i creixement: model de Solow" color="amber">
 <p>
 El <strong>model de creixement de Solow</strong> (Nobel 1987) estableix que la <strong>taxa de estalvi</strong> és un determinante fonamental del nivell de renda per cápita a llarg termini. Una major taxa de estalvi implica més inversió → major acumulació de capital → major producció per cápita en el estado estacionario. Tanmateix, el estalvi no afecta la <strong>taxa de creixement</strong> a llarg termini (que depén del progrés tecnològic), sino al <strong>nivel</strong> de renda. La <strong>regla de oro de la acumulació de capital</strong> (Phelps, 1961) identifica la taxa de estalvi òptima que maximiza el consum per cápita a llarg termini: aquella en la que el producto marginal del capital iguala la taxa de depreciació més la taxa de creixement de la població i la tecnologia (PMK = δ + n + g).
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 5 */}
 <Card title="5. Rellevància curricular" icon="📘">
 <TheoryBlock title="5.1. Marc normatiu i competències" color="blue">
 <p>
 El consum, el estalvi i la inversió s'emmarquen en els sabers bàsics del bloc «La realitat econòmica» de <strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), connectant amb les competències específiques CE1 (funcionament del sistema econòmic), CE4 (papel de l'estalvi i la inversió en el creixement), CE5 (anàlisi de la política econòmica) i CE6 (comprensió de la conjuntura). El estudio de les funcions de consum i estalvi desarrolla les competències <strong>STEM</strong> (anàlisi quantitatiu, funcions lineales, propensions marginales). Las teorias del consum (Keynes, Friedman, Modigliani) fomentan el <strong>pensament crítico</strong> i la comparació de models alternatius. La relació estalvi-inversió-creixement contribuye a les competències <strong>CC</strong> (debate sobre la política fiscal) i <strong>CPSAA</strong> (planificació financiera personal). La decisió de inversió empresarial connecta amb la competència <strong>CE</strong> (emprenedora).
 </p>
 </TheoryBlock>
 </Card>

 {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
 <Card title="Conclusió" icon="📌">
 <div className="text-sm text-slate-700 leading-relaxed space-y-3">
 <p>
 El <strong>consum, el estalvi i la inversió</strong> són les tres peces fonamentals del trencaclosques macroeconòmic. El consum, com component mayoritario del PIB, ha sigut objecte de una rica tradició teòrica: des de la funció lineal keynesiana fins a les sofisticadas hipòtesi de la renda permanent (Friedman) i del cicle vital (Modigliani), que incorporan la dimensió intertemporal i les expectativas. Cada teoria ilumina aspectes distintos del comportament del consumidor: la renda corrent, la renda esperada, la riquesa total i la posició relativa.
 </p>
 <p>
 El <strong>estalvi</strong>, com contrapartida del consum, és la font interna de finançament de la inversió. La identitat S = I (en economia cerrada) o S − I = XN (en economia abierta) connecta les decisions individuales de estalvi amb la inversió productiva i els desequilibris exteriores. La <strong>inversió</strong>, determinada pel tipus d'interés, les expectatives (animal spirits), el acelerador i la q de Tobin, és el motor del creixement econòmic però també la principal font de inestabilitat cíclica por la seua volatilitat inherente.
 </p>
 <p>
 La relació entre estalvi, inversió i creixement, formalitzada en el <strong>model de Solow</strong>, muestra que la taxa de estalvi determina el nivell de renda per cápita a llarg termini, mentre que el progrés tecnològic determina la taxa de creixement sostenido. El <strong>efecte crowding out</strong> recuerda que la política fiscal té límites: el déficit públic pot desplazar inversió privada, reduciendo el efecte neto sobre la activitat. Des de la perspectiva docent, aquest tema permet integrar microeconomia (decisions individuales), macroeconomia (equilibri agregat) i creixement econòmic, proporcionando una visión completa del funcionament de la economia.
 </p>
 </div>
 </Card>

 <Card title="1. El sector públic: justificació i funcions" icon="📘">
 <TheoryBlock title="1.1. Justificació de la intervenció pública" color="blue">
 <p>
 La intervenció del sector públic en la economia se justifica per la existència de <strong>fallades del mercat</strong> (ya analitzats en el Tema 17): externalitats, béns públics, informació asimètrica, competència imperfecta i mercats incomplets. A més, el mercat no garanteix per si sols una distribució de la renda socialment acceptable, la qual cosa justifica la funció redistributiva de l'Estat. El sector públic també intervé per a proveir <strong>béns preferentes</strong> (merit goods), com la educació i la sanitat, el qual consum la societat considera que ha de fomentar-se per damunt del que el mercat proporcionaria espontàniament. Finalment, la <strong>estabilització macroeconòmica</strong> —suavizar les fluctuacions del cicle econòmic, combatre el desocupació i controlar la inflació— constitueix altra justificació fonamental.
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.2. Les tres funcions de Musgrave" color="green">
 <p>
 Richard Musgrave, en la seua obra <em>The Theory of Public Finance</em> (1959), va sistematitzar les tres funcions econòmicas del sector públic:
 </p>
 <p>
 <strong>a) Funció de assignació (eficiència):</strong> corregir les fallades de mercat per a aconseguir una assignació eficiente de els recursos. Inclou la provisió de béns públics, la correcció de externalitats (impostos pigouvianos, subvencions), la regulació de monopolios i la provisió de béns preferentes.
 </p>
 <p>
 <strong>b) Funció de distribució (equitat):</strong> modificar la distribució de la renda i la riquesa que resulta del mercat per a aproximarla als criterios de justicia social que la societat considere desitjables. Instrumentos: impostos progresivos (IRPF), transferències (prestacions por desocupació, pensions), provisió gratuita de serveis públics (educació, sanitat).
 </p>
 <p>
 <strong>c) Funció de estabilització (macroeconomia):</strong> utilizar la política fiscal (y coordinarla amb la monetaria) per a mantindre un nivell de activitat econòmica estable, próximo al plena ocupació, amb estabilitat de preus i equilibri exterior. Aquesta funció adquirió relevancia a partir de Keynes (1936).
 </p>
 </TheoryBlock>

 <TheoryBlock title="1.3. Evolució històrica del sector públic" color="amber">
 <p>
 La concepció del papel de l'Estat ha variado substancialment al llarg de la historia del pensament econòmic. El <strong>Estado mínim</strong> de Adam Smith (1776) limitaba la intervenció pública a defensa, justicia e infraestructures básicas, confiant en la «mano invisible» del mercat. La <strong>revolució keynesiana</strong> (1936) justificó la intervenció activa de l'Estat per a combatre el desocupació mitjançant la política fiscal, establint les bases del <strong>Estado del benestar</strong> que es consolidó tras la Segona Guerra Mundial (informe Beveridge, 1942). La <strong>crisis dels anys 70</strong> (estanflació) va qüestionar la eficàcia de la política fiscal i va donar lloc a la contrarrevolució monetarista (Friedman) i a la escola de la <strong>Public Choice</strong> (Buchanan, Tullock), que analizó les fallades del govern (rent-seeking, burocràcia, cicles polític-pressupostaris). En la actualitat, el debate es centra en el <strong>grandària òptim del sector públic</strong>, la sostenibilitat fiscal i la eficiència de la despesa.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 2 */}
 <Card title="2. El pressupost de l'Estat" icon="📘">
 <TheoryBlock title="2.1. Concepte i característiques" color="blue">

 </p>
 </TheoryBlock>

 <TheoryBlock title="2.2. Ingressos públics" color="green">
 <p>
 Els <strong>ingressos públics</strong> es classifiquen en:
 </p>
 <p>
 <strong>a) Impostos:</strong> principal font de ingressos. Se divideixen en <em>directes</em> (gravan la renda o el patrimonio: IRPF, Impuesto sobre Sociedades —IS—, Impuesto sobre el Patrimonio) e <em>indirectes</em> (gravan el consum o les transaccions: IVA, Impostos Especials —IIEE—, Impuesto sobre Transmisiones Patrimoniales).
 </p>
 <p>
 <strong>b) Cotitzacions sociales:</strong> contribucions obligatòries de treballadors i empresarios per a financiar la Seguretat Social (pensions, desocupació, sanitat).
 </p>
 <p>
 <strong>c) Tasas i preus públics:</strong> contraprestacions por serveis públics específics (tasa judicial, taxa universitaria).
 </p>
 <p>
 <strong>d) Otros ingressos:</strong> transferències, ingressos patrimoniales, alienacions, operacions financieras i endeutament.
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.3. Classificació dels impostos" color="indigo">
 <p>
 A més de la distinció directes/indirectes, els impostos es classifiquen segons la seua <strong>progressivitat</strong>:
 </p>
 <p>
 <strong>— Progresivos:</strong> el tipus impositiu medio augmenta amb la base imponible (IRPF). Quien més renda té, paga proporcionalment más. Favorecen la redistribució.
 </p>
 <p>
 <strong>— Regresivos:</strong> el tipus mitjà disminueix amb la renda (IVA, al gravar el consum que suposa major proporció de la renda per a les llars de renda baja).
 </p>
 <p>
 <strong>— Proporcionales:</strong> el tipus mitjà és constante independentment de la base (IS al tipus general del 25 %).
 </p>
 <p>
 La <strong>capacitat recaudatoria</strong> depén del tipus impositiu, la base imponible, la elasticitat de la base ante canvis en el tipus i el grado de compliment fiscal (economia sumergida i fraude).
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.4. Despeses públiques" color="amber">
 <p>
 Els <strong>despesas públics</strong> se divideixen en:
 </p>
 <p>
 <strong>a) Despesas corrents:</strong> despesas de personal (sous de funcionaris), compres de béns i serveis corrents, transferències corrents (prestacions sociales, subvencions) e intereses de la deute pública.
 </p>
 <p>
 <strong>b) Despesas de capital:</strong> inversiones reals (infraestructures, equipament público) i transferències de capital (ajudes a empreses per a inversió).
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.5. Classificació de la despesa" color="purple">
 <p>
 El despesa públic es classifica segons tres criterios complementaris:
 </p>
 <p>
 <strong>— Classificació funcional (¿para qué?):</strong> por áreas de actuació (sanitat, educació, defensa, protecció social, serveis econòmics, deute pública). Permite evaluar les prioritats políticas.
 </p>
 <p>
 <strong>— Classificació orgánica (¿quién gasta?):</strong> por ministerio o centro gestor responsable de la despesa.
 </p>
 <p>
 <strong>— Classificació econòmica (¿en qué?):</strong> por naturaleza de la despesa (personal, béns corrents, inversiones, transferències, operacions financieras).
 </p>
 </TheoryBlock>

 <TheoryBlock title="2.6. Saldo pressupostari" color="rose">
 <p>
 El <strong>saldo pressupostari</strong> és la diferència entre ingressos i despeses públics:
 </p>
 <p>
 <strong>Saldo = T − G</strong> (donde T = ingressos totales, G = despesas totales)
 </p>
 <p>
 Si T &gt; G → <strong>superávit</strong> pressupostari (el sector públic ahorra). Si T &lt; G → <strong>déficit</strong> pressupostari (necessitat de finançament, normalment mitjançant emisión de deute). Si T = G → <strong>equilibri</strong> pressupostari. El saldo pressupostari és un indicador clave de la salud financiera del sector públic i de la orientació de la política fiscal (expansiva si hi ha déficit, restrictiva si hi ha superávit).
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 3 */}
 <Card title="3. La política fiscal" icon="📘">
 <TheoryBlock title="3.1. Concepte" color="blue">
 <p>
 La <strong>política fiscal</strong> és el conjunto de decisions del govern sobre el nivell i la composició del <strong>despesa públic (G)</strong> i de els <strong>impostos (T)</strong> amb el objectiu de influir en la activitat econòmica agregada. Junto amb la política monetària, constitueix el núcleo de la política macroeconòmica. En la zona euro, on la política monetària està centralizada en el BCE, la política fiscal és el principal instrument de estabilització a nivell nacional.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.2. Política fiscal expansiva" color="green">
 <p>
 La <strong>política fiscal expansiva</strong> consisteix en <strong>augmentar el despesa públic (↑G)</strong> i/o <strong>reduir els impostos (↓T)</strong> per a estimular la demanda agregada (DA). Efectes esperats: ↑DA → ↑producció (Y) → ↑ocupació. Efectes colaterales: posible ↑preus (inflació), ↑déficit público, ↑tipus d'interés (si se financia amb deute → efecte crowding out). Se aplica en fases <strong>recesivas</strong> del cicle econòmic, quan existeix capacitat productiva ociosa. Ejemplo històric: el <em>New Deal</em> de Roosevelt (1933) i els paquetes de estímulo fiscal durant la Gran Recessió (2008-2009) i la crisis del COVID-19 (2020-2021).
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.3. Política fiscal restrictiva (contractiva)" color="amber">
 <p>
 La <strong>política fiscal restrictiva</strong> consisteix en <strong>reduir el despesa públic (↓G)</strong> i/o <strong>augmentar els impostos (↑T)</strong> per a frenar la demanda agregada. Efectes esperats: ↓DA → ↓pressió inflacionista, millora del saldo pressupostari. Efectes colaterales: posible ↓producció, ↑desocupació a curt termini. Se aplica en fases <strong>expansives</strong> del ciclo per a evitar el sobreescalfament de la economia, o en situacions de insostenibilitat fiscal (consolidació fiscal). Ejemplo: els programes de austeritat en la periferia europea (2010-2014).
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.4. Els multiplicadors fiscals" color="indigo">
 <p>
 El <strong>multiplicador de la despesa pública</strong> mesura quant augmenta la renda de equilibri por cada unitat addicional de despesa pública:
 </p>
 <p>
 <strong>k_G = 1 / (1 − c(1 − t))</strong>
 </p>
 <p>
 On c és la propensió marginal al consum i t és el tipus impositiu. El <strong>multiplicador dels impostos</strong> (autónomos) es:
 </p>
 <p>
 <strong>k_T = −c / (1 − c(1 − t))</strong>
 </p>
 <p>
 Propietat fonamental: |k_G| &gt; |k_T|, la qual cosa implica que el despesa públic té un efecte multiplicador major que una reducció equivalent de impostos (perquè part de la reducció de T se ahorra). El multiplicador de transferències és similar al de impostos però amb signo positiu. El <strong>teorema del pressupost equilibrat</strong> (Haavelmo) estableix que un augment simultáneo e igual de G i T augmenta la renda en la mateixa quantia (multiplicador = 1).
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.5. Estabilitzadors automàtics" color="purple">
 <p>
 Els <strong>estabilitzadors automàtics</strong> són mecanismes fiscales incorporados al sistema que amortiguen les fluctuacions del cicle econòmic <strong>sin necessitat de decisions discrecionales</strong>:
 </p>
 <p>
 <strong>— Impostos progresivos (IRPF):</strong> en expansió, la renda creix → els contribuents passen a trams superiors → ↑recaptació → freno automático. En recessió, efecte contrari: ↓recaptació → sostén de la renda disponible.
 </p>
 <p>
 <strong>— Prestacions por desocupació:</strong> en recessió, ↑desocupació → ↑transferències automáticas → sostén del consum. En expansió, ↓desocupació → ↓transferències → freno automático.
 </p>
 <p>
 Los estabilitzadors automàtics són ràpids (sin retard de decisió), simètrics (actúan en ambas fases del ciclo) i no requereixen aprovació parlamentària, però el seu efecte és limitado i no pueden, per si sols, traure a una economia de una recessió profunda.
 </p>
 </TheoryBlock>

 <TheoryBlock title="3.6. Política fiscal discrecional vs. estabilitzadors automàtics" color="rose">
 <p>
 La <strong>política fiscal discrecional</strong> requereix decisions deliberadas del govern (planes de inversió, reformes tributàries, paquetes de estímulo). Els seus avantatges: pot ser més potent i adaptada a la situació específica. Els seus inconvenients: retards (legislatius, de implementació), riesgo de motivació política (cicle polític-pressupostari de Nordhaus), dificultad de revertir despesas una vez iniciados. Els <strong>estabilitzadors automàtics</strong> compensen aquestes debilidades amb rapidesa i automatismo, però no poden sustituir completament a la política discrecional en situacionsexcepcionals (crisis profundes, shocks asimètrics).
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 4 */}
 <Card title="4. Efectes i limitacions de la política fiscal" icon="📘">
 <TheoryBlock title="4.1. Retards de la política fiscal" color="blue">
 <p>
 La eficàcia de la política fiscal es veu limitada por diversos <strong>retardos</strong>: de <em>reconeixement</em> (tiempo per a identificar el problema), de <em>decisió</em> (tiempo legislatiu per a aprobar medidas), de <em>implementació</em> (tiempo per a ejecutar el despesa o aplicar el cambio impositiu) i de <em>efecto</em> (tiempo per a que la medida faça efecte sobre la economia real). Estos retards poden hacer que la política fiscal actúe <strong>procíclicament</strong> (estimulando quan la economia ja s'ha recuperat), agreujant les fluctuacions en lloc de suavizarlas. Friedman utilizó aquest argumento per a defender la superioritat de les reglas automáticas sobre la discrecionalitat.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.2. Efecte crowding out (expulsió)" color="green">
 <p>
 El <strong>efecte crowding out</strong> o efecte desplaçament és produeix quan un augment de la despesa públic finançat amb deute eleva el tipus d'interés, la qual cosa redueix la inversió privada y, parcialment, el consum privado. Mecanismo: ↑G → ↑demanda de fons prestables → ↑tipus d'interés (i) → ↓inversió privada (I). En el <strong>cas extrem clásico</strong> (trampa de la liquidez inexistente, demanda de diner poc sensible al tipus d'interés), el crowding out és total i la política fiscal és ineficaç. En el <strong>cas keynesià</strong> (trampa de la liquidez, demanda de diner molt elástica al tipus d'interés), el crowding out és mínim i la política fiscal és molt eficaç. El debate entre keynesians i monetaristes gira entorn de la magnitud de aquest efecto.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.3. Equivalència ricardiana (Barro, 1974)" color="amber">
 <p>
 La <strong>equivalència ricardiana</strong>, formalitzada por Robert Barro (1974) a partir de una intuïció de David Ricardo, sosté que, sota certs supòsits (agents racionals amb horizonte infinito, mercats de capitales perfectos, impostos de suma fija), <strong>financiar el despesa públic amb deute és equivalent a financiarlo amb impostos</strong>. La lógica: si el govern redueix impostos hoy i emite deute, els agents racionals anticipan que els impostos futuros augmentarán per a pagar la deute + intereses → ↑estalvi privado en la mateixa quantia que ↓T → efecte nulo sobre la demanda agregada. Encara que teòricament elegant, la equivalència ricardiana requereix supòsits molt restrictivos i la evidència empírica és mixta: en la práctica, la política fiscal sí té efectes reales.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.4. Corba de Laffer" color="indigo">
 <p>
 La <strong>corba de Laffer</strong> postula una relació en forma de U invertida entre el tipus impositiu i la recaptació fiscal. Amb un tipus del 0 %, la recaptació és cero; amb un tipus del 100 %, també sería cero (ningú treballaria o declararía ingressos). Existeix un <strong>tipus òptim (t*)</strong> que maximiza la recaptació. Si el tipus vigent està a la <em>derecha</em> de t*, una reducció de impostos podría <strong>augmentar</strong> la recaptació al estimular la activitat econòmica i reduir el fraude. Aquesta idea va ser influent en les reformes fiscales de Reagan (1981) i Thatcher, encara que la evidència empírica sobre la posició exacta de t* és controvertida i probablement varía segons el impost, el país i el període.
 </p>
 </TheoryBlock>

 <TheoryBlock title="4.5. Debat keynesians vs. monetaristes" color="purple">
 <p>
 El debate sobre la eficàcia de la política fiscal enfronta dos grans tradicions:
 </p>
 <p>
 <strong>— Keynesians:</strong> la política fiscal és eficaç, especialment en recesiones (trampa de la liquidez, multiplicadores elevados, crowding out mínim). El despesa públic pot compensar la insuficiència de demanda privada. Los multiplicadores són majors en recessió que en expansió.
 </p>
 <p>
 <strong>— Monetaristes (Friedman):</strong> la política fiscal és poc eficaç o contraproduent. El crowding out neutralitza gran part del efecto. Los retards la fan procíclica. La política monetària és superior. A més, la expansió fiscal tendeix a ser permanent (ratchet effect de la despesa pública). La escola de expectativas racionals (Lucas, Barro) reforça aquest escepticismo amb la equivalència ricardiana.
 </p>
 <p>
 La <strong>Nueva Síntesis Neokeynesiana</strong> reconeix la eficàcia de la política fiscal en situacions específiques (trampa de la liquidez, recesiones profundes) i la importancia dels estabilitzadors automàtics, però també accepta la necessitat de reglas fiscales i sostenibilitat a llarg termini.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 5 */}
 <Card title="5. La política fiscal a Espanya i la UE" icon="📘">
 <TheoryBlock title="5.1. Pacte d'Estabilitat i Creixement (PEC)" color="blue">
 <p>
 El <strong>Pacto de Estabilitat i Creixement</strong> (PEC), adoptat en 1997 com complement al Tractat de Maastricht, estableix els límits fiscales per a els països de la zona euro: <strong>déficit públic inferior al 3 % del PIB</strong> i <strong>deute públic inferior al 60 % del PIB</strong>. El PEC inclou un component preventiu (programas de estabilitat, objectiu a mitjà termini —OMP— de saldo estructural) i un component correctiu (procediment de déficit excessiu —PDE— amb possibles sancions). El PEC va ser reformat en 2005 (mayor flexibilitat), suspés temporalment en 2020-2023 (cláusula de escape por COVID-19) i profundament reformat en 2024 amb un nou marc de gobernanza econòmica.
 </p>
 </TheoryBlock>

 <TheoryBlock title="5.2. Regles fiscals a Espanya" color="green">
 <p>
 En España, la <strong>Ley Orgánica 2/2012 de Estabilitat Pressupostària i Sostenibilitat Financiera</strong> (desenvolupament del art. 135 CE, reformat en 2011) estableix el principio de estabilitat pressupostària per a totes les Administracions Públicas (Estado, CCAA, EELL, Seguretat Social). La ley fija límites de déficit estructural, una regla de despesa (el despesa computable no pot crecer per damunt de la taxa de creixement potèncial del PIB) i un límite de deute pública. La <strong>AIReF</strong> (Autoritat Independiente de Responsabilitat Fiscal), creada en 2013, supervisa el compliment de les reglas fiscals i emet opinions sobre les previsions macroeconòmicas y pressupostàries del govern.
 </p>
 </TheoryBlock>

 <TheoryBlock title="5.3. El Semestre Europeu" color="amber">
 <p>
 El <strong>Semestre Europeo</strong> és el ciclo anual de coordinació de les políticas econòmicas i fiscales en la UE. Se inicia en noviembre amb el Estudio Prospectiu Anual de Creixement de la Comisión, continua amb les recomanacions específiques por país (mayo-junio) i concluye amb la presentació dels pressupostos nacionals (octubre). El Semestre integra la supervisión fiscal (PEC), la supervisión macroeconòmica (Procediment de Desequilibris Macroeconòmics) i les reformes estructurales (Estrategia Europa). Amb la reforma del PEC de 2024, el Semestre s'adapta per a supervisar les noves <strong>trayectorias de ajuste individualizadas</strong> a quatre o set anys, basadas en la sostenibilitat de la deute de cada país.
 </p>
 </TheoryBlock>
 </Card>

 {/* Epígrafe 6 */}
 <Card title="6. Rellevància curricular" icon="📘">
 <TheoryBlock title="6.1. Marc normatiu i competencial" color="blue">
 <p>
 El pressupost de l'Estat i la política fiscal se integran en el currículum de <strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), dins del bloc «La realitat econòmica». Las competències específiques implicadas són: CE1 (explicar el funcionament del sistema econòmic), CE5 (analizar les principals políticas econòmicas) i CE6 (comprender la conjuntura econòmica). Se movilizan descriptores operativos de les competències clau: STEM5 (anàlisi quantitatiu del pressupost i els multiplicadores), CC1 i CC2 (participació ciutadana informada sobre impostos i despesa pública), CPSAA5 (planificació fiscal personal) i CE1 (valoració del emprenedoria en un marc fiscal determinado).
 </p>
 <p>
 La metodologia didàctica pot incluir el <strong>anàlisi dels PGE</strong> (Pressupostos Generals de l'Estat) de un any concreto, simulacions de política fiscal (¿qué ocorre si se baixa el IVA 2 puntos?), debates sobre austeritat vs. estímulo, i comparacions internacionals de pressió fiscal i despesa social.
 </p>
 </TheoryBlock>
 </Card>

 {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
 <Card title="Conclusió" icon="📌">
 <div className="text-sm text-slate-700 leading-relaxed space-y-3">
 <p>
 El <strong>pressupost de l'Estat</strong> i la <strong>política fiscal</strong> constitueixen ferramentes fonamentals per a la intervenció del sector públic en la economia. El pressupost, com documento legal que recoge ingressos i despeses, reflecteix les prioritats políticas i econòmicas de una societat. Los ingressos —fonamentalment impostos directes e indirectes— financian les despeses corrents i de capital que permeten a l'Estat cumplir les seues tres funcions clàssiques (Musgrave): assignació eficiente, distribució equitativa i estabilització macroeconòmica.
 </p>
 <p>
 La <strong>política fiscal</strong>, entesa com el maneig deliberat de G i T, opera a través dels multiplicadors fiscals (k_G &gt; |k_T|) i se complementa amb els estabilitzadors automàtics. Tanmateix, la seua eficàcia està subjecta a importants limitacions: retards temporales, efecte crowding out, equivalència ricardiana i la corba de Laffer. El debate entre keynesians i monetaristes sobre la eficàcia relativa de la política fiscal continua vigent, encara que la experiència de la Gran Recessió i la crisis del COVID-19 ha revitalizado el papel de la política fiscal activa.
 </p>
 <p>
 En el contexto europeo, la política fiscal nacional opera dins del marc del <strong>Pacto de Estabilitat i Creixement</strong> i el Semestre Europeo, que imponen límites de déficit i deute per a garantir la sostenibilitat fiscal. Des de la perspectiva docent, aquest tema permet al alumnado comprendre com les decisions pressupostàries afecten directament a la seua vida (impostos, serveis públics, beques, ocupació) i desenvolupar un pensament crítico informat sobre les alternatives de política econòmica.
 </p>
 </div>
 </Card>

                <TheoryBlock title="3.1. Efecte multiplicador a curt termini (Keynes)" color="blue">
                    <p>
                        Des de la perspectiva <strong>keynesiana</strong>, el dèficit públic finançat amb deute té un <strong>efecte expansiu</strong> sobre la renda i l'ocupació a curt termini, especialment en recessions quan existeix capacitat productiva ociosa. El multiplicador fiscal (k_G) amplifica l'efecte inicial de la despesa. Aquest efecte és major quan: l'economia està en recessió (multiplicadors més grans), els tipus d'interés estan prop de zero (trampa de la liquiditat: crowding out mínim), la propensió marginal al consum és alta i l'economia és relativament tancada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Efecte crowding out" color="green">
                    <p>
                        Com es va analitzar en el Tema 25, l'<strong>efecte crowding out</strong> (desplaçament) redueix l'eficàcia del dèficit fiscal: ↑G finançat amb deute → ↑demanda de fons prestables → ↑tipus d'interés → ↓inversió privada → efecte net sobre Y inferior al previst pel multiplicador simple. La magnitud del crowding out depén de l'elasticitat de la demanda de diners al tipus d'interés (major en el model clàssic, menor en el keynesià) i de l'obertura de l'economia (en economia oberta, el crowding out pot operar també a través del tipus de canvi: ↑i → ↑entrada de capitals → apreciació → ↓exportacions netes).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Càrrega per a generacions futures" color="amber">
                    <p>
                        El debat sobre si el deute públic suposa una <strong>càrrega per a les generacions futures</strong> enfronta dues posicions clàssiques:
                    </p>
                    <p>
                        <strong>— Buchanan (1958):</strong> sí que hi ha càrrega intergeneracional. La generació present gaudeix de la despesa finançada amb deute, però les generacions futures suporten els impostos per a pagar els interessos i amortitzar el deute. A més, si el deute finança consum (no inversió productiva), les generacions futures hereten més deute sense més capacitat productiva.
                    </p>
                    <p>
                        <strong>— Lerner (1948):</strong> el deute intern «ens el devem a nosaltres mateixos». Els pagaments d'interessos són transferències entre ciutadans del mateix país (de contribuents a tinents de bons). La càrrega real només existeix si el deute és extern (transferència de recursos a l'exterior) o si genera distorsions (impostos més alts per a pagar interessos → desincentius).
                    </p>
                    <p>
                        La <strong>posició actual</strong> reconeix que el deute intern sí que pot generar càrrega intergeneracional si: redistribueix renda de contribuents (generalment més pobres) a tinents de bons (generalment més rics), o si els impostos necessaris per a pagar interessos generen ineficiències (pèrdua d'eficiència dels impostos).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Risc d'insostenibilitat: crisi de deute sobirà" color="indigo">
                    <p>
                        Quan els mercats perceben que el deute d'un país pot ser <strong>insostenible</strong> (incapacitat de pagar interessos o amortitzar principal), es desencadena una <strong>crisi de deute sobirà</strong>. El mecanisme és una espiral negativa: ↑desconfiança → ↑prima de risc → ↑cost del deute → ↑dèficit → ↑deute → ↑desconfiança. Casos emblemàtics: la <strong>crisi grega</strong> (2010-2015, amb reestructuració de deute en 2012), la <strong>crisi espanyola</strong> (2012, amb rescat bancari i prima de 649 pb), la crisi irlandesa i portuguesa (2010-2011). Aqueixes crisis van motivar la creació del <strong>Mecanisme Europeu d'Estabilitat (MEDE)</strong> i la Unió Bancària, així com la intervenció decisiva del BCE.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. Equivalència ricardiana revisitada (Barro)" color="purple">
                    <p>
                        Com es va analitzar en el Tema 25, l'<strong>equivalència ricardiana</strong> (Barro, 1974) prediu la <strong>neutralitat del dèficit</strong>: els agents racionals anticipen que el dèficit d'avui implica impostos futurs, per la qual cosa augmenten el seu estalvi en la mateixa quantia, anul·lant l'efecte expansiu. En la pràctica, aquesta equivalència es compleix només parcialment: els agents tenen <strong>horitzó finit</strong> (no altruisme intergeneracional perfecte), els <strong>mercats de capitals són imperfectes</strong> (restriccions de crèdit) i els <strong>impostos són distorsionants</strong> (no de suma fixa). L'evidència empírica suggereix que l'equivalència ricardiana és una aproximació més rellevant a llarg termini que a curt termini.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 4 */}
            <Card title="4. Regles fiscals i sostenibilitat" icon="📘">
                <TheoryBlock title="4.1. Pacte d'Estabilitat i Creixement (PEC)" color="blue">
                    <p>
                        El <strong>PEC</strong> estableix els dos límits numèrics fonamentals: <strong>dèficit &lt; 3 % del PIB</strong> i <strong>deute &lt; 60 % del PIB</strong>. El component preventiu exigeix un objectiu a mitjà termini (OMP) de saldo estructural pròxim a l'equilibri o en superàvit. El component correctiu activa el <strong>Procediment de Dèficit Excessiu (PDE)</strong> quan se superen els límits, amb un calendari de correcció i possibles sancions financeres. Les regles del PEC han estat criticades per la seua rigidesa (procícliques en recessions), la seua complexitat (múltiples indicadors i excepcions) i la seua falta d'aplicació efectiva (cap país ha estat sancionat fins a la data).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Reforma del PEC (2024)" color="green">
                    <p>
                        La <strong>reforma del marc de governança econòmica de la UE</strong> (abril de 2024) introdueix canvis substancials: es mantenen els límits del 3 % i 60 % com a referència, però se substitueix l'enfocament «one-size-fits-all» per <strong>trajectòries d'ajust individualitzades</strong> per a cada país, basades en una anàlisi de sostenibilitat del deute (DSA). Cada Estat membre presenta un pla fiscal-estructural a mitjà termini (4 anys, extensible a 7 si inclou reformes i inversions). L'indicador de referència passa a ser la <strong>despesa primària neta</strong> (exclou interessos, despesa cíclica en atur i ingressos extraordinaris). S'introdueix una <strong>salvaguarda de resiliència del deute</strong> (la ràtio deute/PIB ha de ser inferior al final del període d'ajust) i una <strong>salvaguarda de dèficit</strong> (marge d'1,5 pp sota el 3 %).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Regla de despesa" color="amber">
                    <p>
                        La <strong>regla de despesa</strong> limita el creixement de la despesa pública computable a la taxa de <strong>creixement potencial del PIB</strong> a mitjà termini. Si la despesa creix al mateix ritme que el PIB potencial, la ràtio despesa/PIB es manté estable. L'avantatge de la regla de despesa enfront dels objectius de dèficit és que la despesa és més controlable pel govern (els ingressos depenen del cicle), per la qual cosa és <strong>menys procíclica</strong>. En la reforma del PEC de 2024, la despesa primària neta es converteix en l'indicador operatiu principal per a avaluar el compliment de les trajectòries d'ajust.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. Espanya: estabilitat pressupostària i AIReF" color="indigo">
                    <p>
                        A Espanya, el marc fiscal nacional s'articula al voltant de la <strong>Llei Orgànica 2/2012 d'Estabilitat Pressupostària i Sostenibilitat Financera</strong> (desenvolupament de l'art. 135 CE), que estableix el principi d'estabilitat pressupostària, la regla de despesa, el límit de deute i la prioritat absoluta de pagament dels interessos i el capital del deute públic. L'<strong>AIReF</strong> (Autoritat Independent de Responsabilitat Fiscal), creada per la Llei Orgànica 6/2013, supervisa el compliment de les regles fiscals, avalua les previsions macroeconòmiques del govern i emet informes sobre la sostenibilitat de les finances públiques de totes les AAPP (Estat, CCAA, EELL, Seguretat Social).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. El debat austeritat vs. estímul" color="purple">
                    <p>
                        La crisi de deute sobirà (2010-2014) va generar un intens debat acadèmic i polític sobre la resposta òptima:
                    </p>
                    <p>
                        <strong>— Austeritat expansiva (Alesina, Ardagna):</strong> la consolidació fiscal basada en retallades de despesa pot ser expansiva si restaura la confiança, redueix les primes de risc i genera expectatives de menors impostos futurs. L'evidència empírica és dèbil en contextos recessius.
                    </p>
                    <p>
                        <strong>— Reinhart i Rogoff (2010):</strong> van argumentar que el deute superior al 90 % del PIB redueix significativament el creixement. Un error de càlcul en el seu estudi (descobert per Herndon, Ash i Pollin, 2013) va debilitar aquesta tesi, encara que la relació negativa entre deute elevat i creixement persisteix en la literatura.
                    </p>
                    <p>
                        <strong>— Estímul fiscal (Krugman, Stiglitz, DeLong-Summers):</strong> en recessions amb trampa de la liquiditat, els multiplicadors fiscals són elevats i l'austeritat és contraproduent (self-defeating). DeLong i Summers (2012) van demostrar que, amb multiplicadors suficientment grans i tipus prop de zero, l'estímul fiscal pot ser <strong>autofinançable</strong> (l'augment d'activitat genera suficients ingressos per a pagar el deute addicional).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 5 */}
            <Card title="5. Dades i context espanyol" icon="📘">
                <TheoryBlock title="5.1. Evolució del deute/PIB a Espanya" color="blue">
                    <p>
                        La <strong>ràtio deute/PIB d'Espanya</strong> ha experimentat fluctuacions dramàtiques: de menys del <strong>40 %</strong> abans de la crisi de 2008 (36 % en 2007, després d'anys de superàvit pressupostari) a més del <strong>100 %</strong> després de la Gran Recessió i el rescat bancari (100,7 % en 2014), descendint gradualment fins al <strong>98 %</strong> en 2019, per a disparar-se al <strong>120 %</strong> en 2020 (pandèmia) i reduir-se progressivament fins a aproximadament el <strong>107 %</strong> en 2023. Aquesta evolució il·lustra com les crisis econòmiques i financeres poden transformar radicalment la posició fiscal d'un país en molt pocs anys.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. El Tresor Públic" color="green">
                    <p>
                        El <strong>Tresor Públic</strong> (Direcció General del Tresor i Política Financera, dependent del Ministeri d'Economia) és l'organisme responsable de la <strong>gestió del deute públic</strong> a Espanya. Les seues funcions inclouen: planificació de les emissions de deute (calendari de subhastes), execució de subhastes de Lletres, Bons i Obligacions, gestió del perfil de venciments (allargar la vida mitjana del deute redueix el risc de refinançament), operacions de bescanvi i recompra, i relació amb els inversors institucionals i les agències de qualificació. El Tresor publica mensualment dades sobre el deute en circulació, el cost mitjà, la vida mitjana i la distribució per tinents.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Agències de qualificació" color="amber">
                    <p>
                        Les <strong>agències de qualificació creditícia</strong> (rating agencies) —principalment <strong>Moody's, Standard &amp; Poor's i Fitch</strong>— emeten opinions sobre la solvència dels emissors de deute, inclosos els Estats sobirans. La qualificació (rating) va des d'AAA (màxima solvència) fins a D (impagament). Una <strong>rebaixa de rating</strong> pot encarir significativament el finançament d'un país, en provocar vendes de bons per part d'inversors institucionals que només poden mantindre actius amb grau d'inversió (investment grade). Espanya va ser rebaixada durant la crisi: d'AAA (2009) a BBB− (2012, prop de bo escombraria), recuperant progressivament fins a A (S&amp;P, 2024). Les agències han estat criticades pel seu caràcter <strong>procíclic</strong> (rebaixem quan la crisi ja és evident, agreujant-la) i per possibles <strong>conflictes d'interés</strong> (cobren de l'emissor avaluat).
                    </p>
                </TheoryBlock>
            </Card>

                    </p>
                    <p>
                        La metodologia didàctica pot incloure l'<strong>anàlisi de l'evolució del deute/PIB</strong> d'Espanya i altres països (sèries temporals), simulacions de dinàmica del deute (què passa si r &gt; g durant 10 anys?), debats sobre el debat austeritat vs. estímul amb arguments d'Alesina, Reinhart-Rogoff, Krugman i DeLong-Summers, i anàlisi de notícies sobre primes de risc i qualificacions creditícies.
                    </p>

            {/* ── CONCLUSIÓ ──────────────────────────────────────── */}
            <Card title="Conclusió" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        El <strong>dèficit públic</strong> i el <strong>deute públic</strong> constitueixen dues variables macroeconòmiques inseparables: el dèficit és el flux que alimenta el deute (estoc), i el deute genera interessos que, al seu torn, contribueixen al dèficit futur. La distinció entre dèficit total, primari, estructural i cíclic és essencial per a un diagnòstic correcte de la situació fiscal i per a dissenyar polítiques de consolidació adequades. L'equació de dinàmica del deute —Δ(Deute/PIB) = (r − g)·(Deute/PIB) + Dèficit primari/PIB— revela que la sostenibilitat depén crucialment de la relació entre el tipus d'interés real i la taxa de creixement.
                    </p>
                    <p>
                        Els efectes econòmics del dèficit i el deute són objecte d'un debat teòric que continua viu: l'efecte multiplicador keynesià a curt termini, el crowding out, la càrrega intergeneracional (Buchanan vs. Lerner) i l'equivalència ricardiana (Barro) ofereixen perspectives complementàries. Les crisis de deute sobirà europees (2010-2012) van demostrar que la insostenibilitat fiscal pot desencadenar espirals destructives, però també que l'austeritat excessiva pot ser contraproduent en contextos recessius.
                    </p>
                    <p>
                        Les <strong>regles fiscals</strong> —el PEC (reformat el 2024), la Llei d'Estabilitat Pressupostària i la supervisió de l'AIReF— busquen equilibrar la necessitat de disciplina fiscal amb la flexibilitat necessària per a respondre a xocs. El cas espanyol, amb un deute que va passar del 36 % al 120 % del PIB en apenas tretze anys, il·lustra tant els riscos de la complaença fiscal com la importància d'institucions i regles que garantisquen la sostenibilitat a llarg termini. Des de la perspectiva docent, aquest tema permet a l'alumnat comprendre les implicacions de l'endeutament públic per al seu futur com a contribuents i ciutadans, fomentant un pensament crític informat sobre les alternatives de política fiscal.
                    </p>
                </div>
            </Card>

                    </p>
                    <p>

                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Dels diners paper als diners fiduciaris" color="amber">

                    </p>

                        Gradualment, els bancs emissors van descobrir que no necessitaven mantindre reserves metàl·liques equivalents al 100 % dels bitllets emesos, ja que no tots els depositants reclamaven el seu or simultàniament. Així va nàixer la <strong>reserva fraccionària</strong>. Amb el temps, es va abandonar la convertibilitat i els diners van passar a ser <strong>fiduciaris</strong> (del llatí <em>fiducia</em>, confiança): el seu valor no descansa en un suport metàl·lic, sinó en la <strong>confiança</strong> dels agents que serà acceptat com a mitjà de pagament. Els diners fiduciaris moderns (<strong>diners fiat</strong>) són emesos pels bancs centrals i tenen <strong>curs legal</strong> obligatori.
                    </p>

                    </p>

                    </p>

                        <strong>m = (1 + e) / (r + e)</strong>
                    </p>
                    <p>

                    </p>
                </TheoryBlock>

                    </p>
                    <p>
                        <strong>BM = Efectiu en circulació + Reserves bancàries</strong>
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. M1: diners en sentit estricte" color="green">
                    <p>

                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. M2: diners intermedis" color="amber">
                    <p>
                        <strong>M2</strong> inclou M1 més els <strong>dipòsits a termini fins a 2 anys</strong> i els <strong>dipòsits amb preavís fins a 3 mesos</strong> (llibretes d'estalvi). Aquestos dipòsits són menys líquids que els inclosos en M1 —la seua retirada anticipada pot comportar penalitzacions—, però es consideren «quasi-diners» per la seua facilitat de conversió en mitjans de pagament.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. M3: agregat ampli de referència" color="indigo">
                    <p>
                        <strong>M3</strong> comprén M2 més les <strong>cessions temporals</strong> (repos), les <strong>participacions en fons del mercat monetari</strong> i els <strong>valors de deute emesos amb termini fins a 2 anys</strong>. M3 és l'<strong>agregat de referència del BCE</strong> per a l'anàlisi monetària, ja que ofereix la visió més àmplia de la liquiditat en l'economia. La taxa de creixement de M3 es monitoritza com a indicador avançat de pressions inflacionistes a mitjà termini (pilar monetari de l'estratègia del BCE).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. La velocitat de circulació i l'equació quantitativa" color="purple">
                    <p>
                        La <strong>velocitat de circulació dels diners</strong> (V) mesura el nombre de vegades que una unitat monetària canvia de mans durant un període determinat per a finançar transaccions. Es defineix com:
                    </p>
                    <p>
                        <strong>V = P·Y / M</strong>
                    </p>
                    <p>
                        On P és el nivell general de preus, Y és la producció real i M és l'oferta monetària. D'aquesta relació s'obté l'<strong>equació quantitativa dels diners</strong> (Irving Fisher, 1911):
                    </p>
                    <p>
                        <strong>M·V = P·Y</strong>
                    </p>
                    <p>
                        Aquesta identitat comptable es converteix en la <strong>teoria quantitativa dels diners</strong> quan s'assumeixen dues hipòtesis: (1) V és estable a curt termini (determinada per factors institucionals); i (2) Y està determinat per factors reals (plena ocupació). Sota aquestos supòsits, un augment de M es tradueix proporcionalment en un augment de P (inflació). La teoria quantitativa és la base del <strong>monetarisme</strong> (Friedman, 1956): «la inflació és sempre i a tot arreu un fenomen monetari».
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 5 */}
            <Card title="5. La demanda de diners" icon="📘">
                <TheoryBlock title="5.1. Motiu transacció" color="blue">
                    <p>
                        Els economistes <strong>clàssics</strong> i <strong>neoclàssics</strong> (Fisher, Marshall, Pigou) consideraven que la demanda de diners s'explicava fonamentalment pel <strong>motiu transacció</strong>: els agents econòmics mantenen diners per a finançar les seues compres habituals entre cobrament i cobrament. La quantitat demandada depén del <strong>nivell de renda nominal</strong> (P·Y): a major renda, majors transaccions i major necessitat de saldos monetaris. En la formulació de Cambridge (Marshall-Pigou): M<sup>d</sup> = k·P·Y, on k = 1/V.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Motiu precaució" color="green">
                    <p>
                        <strong>Keynes</strong> (1936) va afegir el <strong>motiu precaució</strong>: els agents mantenen saldos monetaris addicionals per a fer front a <strong>despeses imprevistes</strong> (una avaria, una malaltia, una oportunitat inesperada). La demanda per precaució depén positivament de la renda i del grau d'incertesa, i negativament del cost d'oportunitat de mantindre diners (tipus d'interés).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Motiu especulació" color="amber">
                    <p>
                        La principal innovació de Keynes va ser el <strong>motiu especulació</strong>: els agents trien entre mantindre la seua riquesa en forma de <strong>diners</strong> (actiu segur però sense rendiment) o en <strong>bons</strong> (actiu amb rendiment però amb risc de pèrdua de capital). Existeix una <strong>relació inversa</strong> entre la demanda especulativa de diners i el tipus d'interés: quan el tipus d'interés és alt, el cost d'oportunitat de mantindre diners és elevat i els agents prefereixen bons; quan és baix, prefereixen la seguretat dels diners.
                    </p>
                    <p>
                        En l'extrem, quan el tipus d'interés és molt baix, els agents esperen que puge (i que els preus dels bons caiguen) i prefereixen mantindre tota la seua riquesa en diners: és la <strong>trampa de la liquiditat</strong>. En aquesta situació, la política monetària expansiva és ineficaç (la corba LM és horitzontal) i només la política fiscal pot estimular l'economia.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Enfocament de Friedman" color="indigo">
                    <p>
                        <strong>Milton Friedman</strong> (1956) va reformular la demanda de diners en el marc de la <strong>teoria permanent de la renda</strong>: els diners són un <strong>actiu més en la cartera</strong> de l'agent econòmic, juntament amb bons, accions, béns reals i capital humà. La demanda de diners depén de la renda permanent (no de la corrent), dels rendiments relatius dels distints actius i de les preferències de l'agent. Per a Friedman, la demanda de diners és una <strong>funció estable</strong> de poques variables, la qual cosa permet predir els efectes dels canvis en l'oferta monetària sobre els preus.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.5. Equilibri al mercat de diners" color="purple">
                    <p>
                        L'<strong>equilibri al mercat de diners</strong> s'aconsegueix quan l'oferta monetària (M<sup>s</sup>), determinada pel banc central, iguala la demanda de diners (M<sup>d</sup>). El <strong>tipus d'interés d'equilibri</strong> és el preu que ajusta el mercat: si M<sup>s</sup> &gt; M<sup>d</sup>, els agents tenen excés de saldos monetaris i compren bons, elevant-ne el preu i reduint el tipus d'interés; si M<sup>s</sup> &lt; M<sup>d</sup>, venen bons, reduint-ne el preu i elevant el tipus d'interés. Aquest mecanisme d'ajust és la base del model IS-LM (Hicks, 1937; Hansen, 1953).
                    </p>
                </TheoryBlock>
            </Card>

                    </p>
