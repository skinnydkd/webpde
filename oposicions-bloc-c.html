<body class="bg-gradient-to-br from-blue-50 via-white to-sky-50 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area, ReferenceLine, Legend, BarChart, Bar, ComposedChart, Scatter, PieChart, Pie, Cell, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar } = Recharts;

    function BlocCApp() {
        const [section, setSection] = useState('inicio');
        const [idioma, setIdioma] = useState(PdeLanguageStore.get());
        usePdeDeepLink(section, setSection);

        const pageTranslations = {
            'nav.oposicions-bloc-c': { val: 'Bloc C: Macroeconomia', es: 'Bloque C: Macroeconomía', en: 'Block C: Macroeconomics' },
            'footer.appname': { val: "Bloc C — Oposicions d'Economia", es: "Bloque C — Oposiciones de Economía", en: 'Block C — Economics Exams' },
            'inicio.title': { val: 'Bloc C: Macroeconomia', es: 'Bloque C: Macroeconomía', en: 'Block C: Macroeconomics' },
            'inicio.subtitle': { val: "Temes 20-26: comptabilitat nacional, demanda i oferta agregada, sector públic, diner, BCE, comerç internacional i divises.", es: 'Temas 20-26 de Macroeconomía.', en: 'Topics 20-26 of Macroeconomics.' },
            'sec.inicio': { val: 'Inici', es: 'Inicio', en: 'Home' },
            'tab.complet': { val: 'Tema complet', es: 'Tema completo', en: 'Full topic' },
            'tab.resum': { val: 'Resum / Esquema', es: 'Resumen / Esquema', en: 'Summary / Outline' },
            'tema20.title': { val: "Fluxos de renda. Comptabilitat nacional. PIB, RN i magnituds.", es: 'Flujos de renta. Contabilidad nacional. PIB y magnitudes.', en: 'Income flows. National accounts. GDP and derived magnitudes.' },
            'tema21.title': { val: "Demanda agregada. Consum, estalvi, inversió. Multiplicador. Oferta agregada.", es: 'Demanda agregada. Consumo, ahorro, inversión. Multiplicador. Oferta agregada.', en: 'Aggregate demand. Consumption, saving, investment. Multiplier. Aggregate supply.' },
            'tema22.title': { val: "Sector públic i política fiscal. Ingressos, despeses, dèficit.", es: 'Sector público y política fiscal.', en: 'Public sector and fiscal policy.' },
            'tema23.title': { val: "Finançament de l'economia. Diner, bancs, intermediaris financers.", es: 'Financiación de la economía. Dinero, bancos.', en: 'Financing the economy. Money, banks.' },
            'tema24.title': { val: "Banc Central i política monetària. Instruments i transmissió.", es: 'Banco Central y política monetaria.', en: 'Central Bank and monetary policy.' },
            'tema25.title': { val: "Comerç internacional. Ventaja comparativa. Balança de pagaments.", es: 'Comercio internacional. Ventaja comparativa. Balanza de pagos.', en: 'International trade. Comparative advantage. Balance of payments.' },
            'tema26.title': { val: "Pagaments internacionals i mercat de divises. Tipus de canvi. SMI i SME.", es: 'Pagos internacionales y mercado de divisas.', en: 'International payments and FX market.' },
        };

        const t = createTranslator(pageTranslations, idioma);
        const lang = idioma;

        const Card = ({ children, className = "", title, icon }) => (<div className={`bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 hover:shadow-md transition-shadow ${className} animate-fade`}>{title && <div className="flex items-center gap-3 mb-5 pb-4 border-b border-slate-100"><span className="text-2xl">{icon}</span><h3 className="font-bold text-slate-800 text-lg">{title}</h3></div>}{children}</div>);
        const Tabs = ({ tabs, active, onChange }) => (<div className="flex flex-wrap gap-1 p-1.5 bg-slate-100 rounded-xl">{tabs.map(tab => (<button key={tab.id} onClick={() => onChange(tab.id)} className={`flex-1 min-w-fit py-2.5 px-4 rounded-lg text-sm font-semibold transition-all ${active === tab.id ? 'bg-white shadow-sm text-blue-600' : 'text-slate-600 hover:text-slate-800 hover:bg-white/50'}`}>{tab.label}</button>))}</div>);
        const TheoryBlock = ({ title, children, color = "slate" }) => { const colors = { slate: "border-slate-300 bg-slate-50", blue: "border-blue-300 bg-blue-50", teal: "border-teal-300 bg-teal-50", cyan: "border-cyan-300 bg-cyan-50", indigo: "border-indigo-300 bg-indigo-50", violet: "border-violet-300 bg-violet-50", green: "border-green-300 bg-green-50", emerald: "border-emerald-300 bg-emerald-50", amber: "border-amber-300 bg-amber-50", rose: "border-rose-300 bg-rose-50", red: "border-red-300 bg-red-50", orange: "border-orange-300 bg-orange-50" }; return (<div className={`border-l-4 ${colors[color] || colors.slate} p-5 rounded-r-xl my-4`}>{title && <h4 className="font-bold text-slate-800 mb-3 text-base">{title}</h4>}<div className="text-slate-700 text-sm leading-relaxed space-y-2">{children}</div></div>); };
        const FormulaBox = ({ formula, desc }) => (<div className="my-4 p-5 bg-gradient-to-r from-blue-50 to-sky-50 rounded-xl border border-blue-100"><p className="text-center font-mono text-lg text-blue-800 font-semibold">{formula}</p>{desc && <p className="text-center text-sm text-blue-600 mt-2">{desc}</p>}</div>);
        const SectionTitle = ({ icon, title, subtitle }) => (<div className="mb-8"><div className="flex items-center gap-3 mb-2"><span className="text-3xl">{icon}</span><h1 className="text-3xl font-black text-slate-800">{title}</h1></div>{subtitle && <p className="text-slate-500 ml-12 text-sm">{subtitle}</p>}</div>);
        const BibliografiaBox = ({ items }) => (<div className="my-6 p-6 bg-gradient-to-r from-slate-50 to-gray-50 rounded-xl border border-slate-200"><h4 className="font-bold text-slate-800 mb-4 text-base flex items-center gap-2"><span>📚</span> Bibliografia</h4><ul className="space-y-2">{items.map((item, i) => <li key={i} className="text-sm text-slate-700 leading-relaxed pl-4 border-l-2 border-slate-200">{item}</li>)}</ul></div>);
        const ClauBox = ({ children }) => (<div className="my-4 p-5 bg-gradient-to-r from-amber-50 to-yellow-50 rounded-xl border border-amber-200"><div className="flex items-start gap-3"><span className="text-2xl">🔑</span><div><h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4><div className="text-sm text-amber-800 space-y-1">{children}</div></div></div></div>);

        // TEMA 20 — Fluxos i comptabilitat nacional
        const Tema20Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La <strong>comptabilitat nacional</strong> és el sistema que registra sistemàticament l'activitat econòmica d'un país. El seu principal agregat, el <strong>PIB</strong>, ha esdevingut el termòmetre econòmic per excel·lència. <strong>Simon Kuznets</strong> (Nobel 1971), sota encàrrec del Congrés dels EUA, va desenvolupar els primers comptes nacionals als anys 30.</p></div></Card>
                <Card title="1. Flux circular de la renda" icon="🔄">
                    <TheoryBlock title="1.1. Model de dos sectors" color="blue"><p>Famílies ofereixen factors productius (treball, capital) a les empreses a canvi de rendes (salaris, interessos, beneficis). Les empreses produeixen béns i serveis que les famílies compren. Flux continu.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Model de quatre sectors" color="indigo"><p>Afegeix Sector Públic (impostos, despesa, transferències) i Sector Exterior (exportacions, importacions, rendes del capital).</p></TheoryBlock>
                </Card>
                <Card title="2. El Producte Interior Brut" icon="📊">
                    <TheoryBlock title="2.1. Definició i càlcul" color="emerald"><p><strong>PIB</strong>: valor monetari de tots els béns i serveis finals produïts a un país durant un període. 3 mètodes:</p><p>• <strong>Oferta/Producció</strong>: Σ VAB sectorials + impostos − subvencions.</p><p>• <strong>Demanda/Despesa</strong>: PIB = C + I + G + (X − M).</p><p>• <strong>Rendes/Ingressos</strong>: rendes del treball + excedent brut d'explotació + impostos nets producció.</p></TheoryBlock>
                    <FormulaBox formula="PIB = C + I + G + (X − M)" desc="Identitat fonamental del PIB pel costat de la despesa" />
                </Card>
                <Card title="3. Magnituds derivades" icon="📐">
                    <TheoryBlock title="Del PIB a la RN" color="violet"><p>• <strong>PNB</strong> = PIB + rendes exterior − rendes pagades exterior.</p><p>• <strong>PN</strong> = PNB − amortitzacions.</p><p>• <strong>RN</strong> = PN − impostos indirectes + subvencions.</p><p>• <strong>RPD</strong> = RN − impostos directes + transferències.</p><p>• <strong>PIB nominal vs. real</strong>: deflactor PIB = PIB nominal / PIB real · 100.</p></TheoryBlock>
                </Card>
                <Card title="4. Marc SEC 2010 i estadística" icon="📈">
                    <TheoryBlock title="Institucions" color="cyan"><p>A Espanya: INE elabora els comptes nacionals seguint el <strong>SEC 2010</strong> (Sistema Europeu de Comptes), normat pel Reg. UE 549/2013. Dades rellevants 2024: PIB ~1,46 bilions €, PIB per càpita ~30.500 €, creixement +2,7 %.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La comptabilitat nacional és el llenguatge estadístic de la macroeconomia. <strong>Kuznets (Nobel 1971)</strong> en va ser el pioner. Tot i les limitacions del PIB (Tema 37), continua sent l'indicador central. El SEC 2010 harmonitza mesurament a la UE.</p></div></Card>
                <BibliografiaBox items={['KUZNETS, S. (1934, 1941): National Income reports, NBER.', 'KEYNES, J.M. (1936): General Theory.', 'BLANCHARD, O. (2017): Macroeconomics, 7a ed., Pearson.', 'MANKIW, N.G. (2020): Macroeconomics, 11a ed.', 'Reg. UE 549/2013 (SEC 2010).', 'INE (2024): Contabilidad Nacional trimestral.']} />
            </div>
        );
        const Tema20Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-blue-50 rounded-xl border border-blue-200 mb-5"><p className="text-center font-bold text-blue-800 text-lg">Tema 20: Comptabilitat Nacional</p><p className="text-center text-sm text-blue-600 mt-1">PIB = C + I + G + (X − M)</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Flux circular</h4><ul className="list-disc pl-5 space-y-1"><li>2 sectors (famílies-empreses) i 4 sectors (+ SP + SE).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. PIB</h4><ul className="list-disc pl-5 space-y-1"><li>3 mètodes: producció (VAB), demanda (CIG+XN), rendes.</li><li>Kuznets (Nobel 1971) pioner.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Magnituds</h4><ul className="list-disc pl-5 space-y-1"><li>PNB, PN, RN, RPD; deflactor.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. SEC 2010</h4><ul className="list-disc pl-5 space-y-1"><li>INE, Reg. UE 549/2013.</li></ul></div></div><ClauBox><p>- Domina els <strong>3 mètodes de càlcul del PIB</strong>.</p><p>- Cita <strong>Kuznets Nobel 1971</strong> com a pioner.</p></ClauBox></Card></div>);
        const Tema20 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="📊" title="Tema 20" subtitle={t('tema20.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema20Complet />}{vista === 'resum' && <Tema20Resum />}</div>; };

        // TEMA 21 — Demanda i oferta agregades
        const Tema21Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El model <strong>DA-OA</strong> és el marc fonamental de la macroeconomia a curt termini, fill de la revolució keynesiana dels anys 30. Permet analitzar com xocs de demanda o oferta afecten el PIB i el nivell de preus.</p></div></Card>
                <Card title="1. Demanda agregada (DA)" icon="📉">
                    <TheoryBlock title="1.1. Components" color="blue"><p><strong>DA = C + I + G + (X − M)</strong>.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Consum i estalvi (Keynes 1936)" color="emerald"><p>Funció de consum: C = c₀ + c·Yd, on c és la PMC (0 &lt; c &lt; 1). Estalvi: S = Yd − C.</p><p><strong>Modigliani</strong>: cicle vital. <strong>Friedman (1957)</strong>: renda permanent.</p></TheoryBlock>
                    <TheoryBlock title="1.3. Inversió" color="violet"><p>I depèn de la TIR esperada vs. tipus d'interès, expectatives (<em>animal spirits</em>, Keynes), impostos, accelerador.</p></TheoryBlock>
                    <TheoryBlock title="1.4. Multiplicador" color="indigo"><p>Un canvi ΔG (o ΔI autònoma) genera una ampliació del PIB: ΔY = k · ΔG, on k = 1/(1−c).</p></TheoryBlock>
                    <FormulaBox formula="k = 1 / (1 − c)   (multiplicador keynesià simple)" desc="Si c=0.8 → k=5. ΔG=10 → ΔY=50" />
                </Card>
                <Card title="2. Oferta agregada (OA)" icon="📈">
                    <TheoryBlock title="2.1. Curt i llarg termini" color="amber"><p>• <strong>OA CP</strong>: pendent positiu (preus/salaris rígids).</p><p>• <strong>OA LP</strong>: vertical al PIB potencial (Y*) — preus flexibles.</p><p><strong>Escola clàssica</strong>: OA sempre vertical (Llei Say).</p><p><strong>Keynes</strong>: OA horitzontal a la DA.</p><p><strong>Nova síntesi</strong>: híbrida.</p></TheoryBlock>
                </Card>
                <Card title="3. Equilibri i xocs" icon="⚖️">
                    <TheoryBlock title="Xocs de demanda i d'oferta" color="rose"><p>• <strong>DA+</strong>: creix PIB i preus.</p><p>• <strong>DA−</strong>: recessió deflacionària.</p><p>• <strong>OA+</strong> (tec., baixa petroli): PIB creix, preus baixen.</p><p>• <strong>OA−</strong> (xoc petroli 1973, gas 2022): estagflació.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El model DA-OA (amb fonaments a <strong>Keynes 1936</strong>, formalitzat per <strong>Hicks 1937</strong> via IS-LM) és el pal de paller de la macroeconomia moderna. Permet comprendre cicles, política fiscal, monetària i xocs externs.</p></div></Card>
                <BibliografiaBox items={['KEYNES, J.M. (1936): General Theory.', 'HICKS, J.R. (1937): «Mr. Keynes and the Classics», Econometrica.', 'FRIEDMAN, M. (1957): A Theory of the Consumption Function.', 'MANKIW, N.G. (2020): Macroeconomics.', 'BLANCHARD, O. (2017): Macroeconomics.']} />
            </div>
        );
        const Tema21Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-blue-50 rounded-xl border border-blue-200 mb-5"><p className="text-center font-bold text-blue-800 text-lg">Tema 21: DA-OA</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. DA</h4><ul className="list-disc pl-5 space-y-1"><li>DA = C+I+G+(X−M).</li><li>Consum Keynes, Modigliani, Friedman 1957.</li><li>Multiplicador k=1/(1−c).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. OA</h4><ul className="list-disc pl-5 space-y-1"><li>CP positiva, LP vertical a Y*.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Xocs</h4><ul className="list-disc pl-5 space-y-1"><li>OA− = estagflació (73, 22).</li></ul></div></div><ClauBox><p>- <strong>Keynes 1936</strong>, <strong>Hicks 1937 IS-LM</strong>, <strong>Friedman 1957</strong>.</p></ClauBox></Card></div>);
        const Tema21 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="📈" title="Tema 21" subtitle={t('tema21.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema21Complet />}{vista === 'resum' && <Tema21Resum />}</div>; };

        // TEMA 22 — Sector públic i política fiscal
        const Tema22Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El <strong>sector públic</strong> representa ~47 % del PIB a Espanya (despesa pública). La <strong>política fiscal</strong> (despeses + impostos) és una palanca clau d'estabilització i redistribució.</p></div></Card>
                <Card title="1. Funcions (Musgrave 1959)" icon="🏛️">
                    <TheoryBlock title="3 funcions" color="blue"><p>• <strong>Assignativa</strong>: corregir fallides de mercat (béns públics, externalitats).</p><p>• <strong>Distributiva</strong>: equitat, Estat del benestar.</p><p>• <strong>Estabilitzadora</strong>: cicle, macroeconomia.</p></TheoryBlock>
                </Card>
                <Card title="2. Ingressos públics" icon="💰">
                    <TheoryBlock title="Impostos" color="emerald"><p>• <strong>Directes</strong> (IRPF, IS, Patrimoni, Successions).</p><p>• <strong>Indirectes</strong> (IVA, Especials, ITP).</p><p>• <strong>Taxes</strong>, <strong>contribucions especials</strong>.</p><p>• <strong>Cotitzacions</strong> Seg. Soc.</p><p>Pressió fiscal Espanya: ~39 % PIB (sota mitjana UE ~41 %).</p></TheoryBlock>
                </Card>
                <Card title="3. Despeses públiques" icon="💸">
                    <TheoryBlock title="Estructura" color="violet"><p>• <strong>Corrent</strong>: salaris, béns, prestacions.</p><p>• <strong>Capital</strong>: inversió.</p><p>• <strong>Transferències</strong>: pensions, atur, beques.</p><p>Pes principal: protecció social (~17 % PIB), sanitat (~7 %), educació (~4,8 %).</p></TheoryBlock>
                </Card>
                <Card title="4. Dèficit i deute" icon="⚠️">
                    <TheoryBlock title="Conceptes" color="rose"><p>• <strong>Dèficit</strong>: G − T &gt; 0. Espanya 2023: 3,6 % PIB.</p><p>• <strong>Deute</strong>: acumulat. Espanya: ~105 % PIB.</p><p>• <strong>Pacte Estab. UE</strong>: 3 % dèficit, 60 % deute.</p><p>• <strong>Regla fiscal UE</strong> (reformada 2024): sostenibilitat a mig termini.</p><p>• <strong>Crowding-out</strong>: el dèficit pot desplaçar inversió privada.</p></TheoryBlock>
                </Card>
                <Card title="5. Política fiscal discrecional vs. automàtica" icon="🎯">
                    <TheoryBlock title="Estabilitzadors" color="cyan"><p>• <strong>Automàtics</strong>: IRPF progressiu, prestació atur. Operen sense intervenció.</p><p>• <strong>Discrecional</strong>: plans estímul. Resposta a COVID (ERTE, avals ICO), NextGen EU.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La política fiscal, fonamentada per <strong>Musgrave (1959)</strong> i <strong>Keynes (1936)</strong>, combina estabilització, assignació i redistribució. Els reptes actuals a Espanya: sostenibilitat del deute, pensions amb envelliment, fiscalitat digital (BEPS, Pilar 2).</p></div></Card>

        const Inicio = () => (<div className="animate-fade"><a href="./oposicions" className="inline-flex items-center gap-2 text-sm text-blue-600 hover:text-blue-800 mb-6 transition-colors">← Tornar a Oposicions</a><div className="text-center mb-10"><div className="inline-flex items-center gap-2 px-4 py-1.5 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold mb-4"><span>🌐</span> Bloc C · BOE 20-26</div><h1 className="text-4xl font-black text-slate-800 mb-3">{t('inicio.title')}</h1><p className="text-slate-500 text-lg max-w-3xl mx-auto">{t('inicio.subtitle')}</p></div><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">{temes.map(tema => (<button key={tema.id} onClick={() => { if (tema.available) { setSection(tema.id); pdeSetHashSection(tema.id); pdeScrollToTop(); } }} className="text-left p-5 rounded-2xl border bg-white border-blue-200 hover:shadow-lg hover:border-blue-400 cursor-pointer transition-all"><div className="flex items-start gap-3"><span className="inline-flex items-center justify-center w-11 h-11 rounded-xl text-sm font-black text-white bg-gradient-to-br from-blue-500 to-sky-600">T{tema.num}</span><div className="flex-1 min-w-0"><p className="font-semibold text-slate-800 text-sm leading-snug mb-2">{t(`tema${tema.num}.title`)}</p><span className="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">✓ Disponible</span></div></div></button>))}</div></div>);

        const headerSections = [
            { id: 'inicio', label: 'Inici', emoji: '🏠' },
            { id: 'tema20', label: 'T20', emoji: '📊' },
            { id: 'tema21', label: 'T21', emoji: '📈' },
            { id: 'tema22', label: 'T22', emoji: '🏛️' },
            { id: 'tema23', label: 'T23', emoji: '💰' },
            { id: 'tema24', label: 'T24', emoji: '🏦' },
            { id: 'tema25', label: 'T25', emoji: '🌐' },
            { id: 'tema26', label: 'T26', emoji: '💱' },
        ];

        return (
            <div className="min-h-screen">
                <PdeHeader idioma={idioma} setIdioma={setIdioma} currentApp="oposicions-bloc-c" sections={headerSections} currentSection={section} setSection={setSection} />
                <main className="max-w-7xl mx-auto px-4 py-8">
                    {section === 'inicio' && <Inicio />}
                    {section === 'tema20' && <Tema20 />}
                    {section === 'tema21' && <Tema21 />}
                    {section === 'tema22' && <Tema22 />}
                    {section === 'tema23' && <Tema23 />}
                    {section === 'tema24' && <Tema24 />}
                    {section === 'tema25' && <Tema25 />}
                    {section === 'tema26' && <Tema26 />}
                </main>
                <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
                <PdeFooter appEmoji="🌐" appName={t('footer.appname')} idioma={idioma} />
                <PdeScrollToTop />
            </div>
        );
    }

    ReactDOM.render(<BlocCApp />, document.getElementById('root'));
    </script>
</body>
</html>
