            </Card>

            <Card title={t('diners.creacio')} icon="🏧">
                <TheoryBlock color="blue">
                    <p>{t('diners.creacio.text')}</p>
                </TheoryBlock>
                <FormulaBox formula="Multiplicador bancari = 1 / coeficient de reserva" desc={t('diners.multiplicador.desc')} />
            </Card>

            <Card title={t('diners.sistema')} icon="🏛️">
                <TheoryBlock color="green">
                    <p>{t('diners.sistema.desc')}</p>
                </TheoryBlock>
            </Card>

            <Card title={t('diners.bce')} icon="🇪🇺">
                <TheoryBlock color="violet">
                    <p>{t('diners.bce.desc')}</p>
                </TheoryBlock>
            </Card>
        </div>
    );

    // ========================================================================
    // UNIT 9: Politica fiscal i monetaria (INTERACTIVE SIMULATOR)
    // ========================================================================
    const Politica = () => {
        const [tab, setTab] = useState('teoria');
        const [pibInicial, setPibInicial] = useState(1400);
        const [impostos, setImpostos] = useState(400);
        const [despesa, setDespesa] = useState(420);
        const [interes, setInteres] = useState(4);

        const calc = useMemo(() => {
            const multiplicador = 2;
            const saldo = impostos - despesa;
            const efecteFiscal = (despesa - impostos) * multiplicador;
            const efecteMonetari = interes * 50;
            const pibResultant = pibInicial + efecteFiscal - efecteMonetari;
            const variacio = ((pibResultant - pibInicial) / pibInicial) * 100;

            let diagnostic;
            if (efecteFiscal > efecteMonetari + 10) diagnostic = 'expansiva';
            else if (efecteFiscal < efecteMonetari - 10) diagnostic = 'restrictiva';
            else diagnostic = 'neutra';

            return {
                saldo,
                pibResultant: Math.round(pibResultant),
                variacio: variacio.toFixed(2),
                diagnostic
            };
        }, [pibInicial, impostos, despesa, interes]);

        return (
            <div className="space-y-6">
                <SectionTitle icon="🏛️" title={t('politica.title')} subtitle={t('politica.subtitle')} />
                <WhyImportant>{t('politica.why')}</WhyImportant>

                <Tabs tabs={[
                    { id: 'teoria', label: t('politica.tab.teoria') },
                    { id: 'simulador', label: t('politica.tab.simulador') },
                ]} active={tab} onChange={setTab} />

                {tab === 'teoria' && (
                    <div className="space-y-6">
                        <Card title={t('politica.fiscal')} icon="📋">
                            <TheoryBlock color="blue">
                                <p>{t('politica.fiscal.desc')}</p>
                            </TheoryBlock>

                            <div className="grid md:grid-cols-2 gap-4 mt-4">
                                <div className="p-4 bg-green-50 rounded-xl border border-green-200">
                                    <h4 className="font-bold text-green-700 mb-2">💰 {t('politica.ingressos')}</h4>
                                    <div className="space-y-2 text-sm text-slate-700">
                                        <p>{t('politica.ingressos.directes')}</p>
                                        <p>{t('politica.ingressos.indirectes')}</p>
                                    </div>
                                </div>
                                <div className="p-4 bg-red-50 rounded-xl border border-red-200">
                                    <h4 className="font-bold text-red-700 mb-2">💸 {t('politica.despeses')}</h4>
                                    <div className="space-y-2 text-sm text-slate-700">
                                        <p>{t('politica.despeses.corrents')}</p>
                                        <p>{t('politica.despeses.capital')}</p>
                                    </div>
                                </div>
                            </div>
                        </Card>

                        <Card title="Politica fiscal: expansiva vs restrictiva" icon="⚖️">
                            <div className="grid md:grid-cols-2 gap-4">
                                <TheoryBlock color="green" title={"📈 " + t('politica.expansiva')}>
                                    <p>{t('politica.expansiva.desc')}</p>
                                </TheoryBlock>
                                <TheoryBlock color="red" title={"📉 " + t('politica.restrictiva')}>
                                    <p>{t('politica.restrictiva.desc')}</p>
                                </TheoryBlock>
                            </div>
                        </Card>

                        <Card title={t('politica.monetaria')} icon="🏦">
                            <TheoryBlock color="violet">
                                <p>{t('politica.monetaria.desc')}</p>
                            </TheoryBlock>
                            <div className="grid md:grid-cols-2 gap-4 mt-4">
                                <div className="p-4 bg-green-50 rounded-xl border border-green-200">
                                    <p className="text-sm text-slate-700">📈 {t('politica.monetaria.expansiva')}</p>
                                </div>
                                <div className="p-4 bg-red-50 rounded-xl border border-red-200">
                                    <p className="text-sm text-slate-700">📉 {t('politica.monetaria.restrictiva')}</p>
                                </div>
                            </div>
                        </Card>
                    </div>
                )}

                {tab === 'simulador' && (
                    <Card title={t('politica.tab.simulador')}>
                        <div className="grid lg:grid-cols-2 gap-8">
                            <div className="space-y-4">
                                <Slider label={t('politica.sim.pib')} value={pibInicial} onChange={setPibInicial} min={1000} max={2000} step={10} suffix=" milers MEUR" />
                                <Slider label={t('politica.sim.impostos')} value={impostos} onChange={setImpostos} min={200} max={600} step={10} suffix=" milers MEUR" />
                                <Slider label={t('politica.sim.despesa')} value={despesa} onChange={setDespesa} min={200} max={600} step={10} suffix=" milers MEUR" />
                                <Slider label={t('politica.sim.interes')} value={interes} onChange={setInteres} min={0} max={10} step={0.25} suffix="%" />
                            </div>
                            <div className="space-y-3">
                                <ResultCard
                                    title={t('politica.sim.saldo')}
                                    value={calc.saldo.toLocaleString() + " milers MEUR"}
                                    color={calc.saldo > 0 ? "green" : calc.saldo < 0 ? "red" : "gray"}
                                    subtitle={calc.saldo > 0 ? t('politica.sim.superavit') : calc.saldo < 0 ? t('politica.sim.deficit') : t('politica.sim.equilibrat')}
                                />
                                <ResultCard
                                    title={t('politica.sim.pibresultant')}
                                    value={calc.pibResultant.toLocaleString() + " milers MEUR"}
                                    color="blue"
                                />
                                <ResultCard
                                    title={t('politica.sim.variacio')}
                                    value={calc.variacio + "%"}
                                    color={parseFloat(calc.variacio) >= 0 ? "green" : "red"}
                                />
                                <ResultCard
                                    title={t('politica.sim.diagnostic')}
                                    value={t('politica.sim.' + calc.diagnostic)}
                                    color={calc.diagnostic === 'expansiva' ? "green" : calc.diagnostic === 'restrictiva' ? "red" : "amber"}
                                />
                            </div>
                        </div>
                    </Card>
                )}
            </div>
        );
    };

    // ========================================================================
    // UNIT 10: Comerc internacional i UE
    // ========================================================================
    const Comerc = () => (
        <div className="space-y-6">
            <SectionTitle icon="🌍" title={t('comerc.title')} subtitle={t('comerc.subtitle')} />
            <WhyImportant>{t('comerc.why')}</WhyImportant>

            <Card title={t('comerc.absolut')} icon="📐">
                <TheoryBlock color="blue">
                    <p>{t('comerc.absolut.desc')}</p>
                </TheoryBlock>
            </Card>

            <Card title={t('comerc.comparatiu')} icon="📊">
                <TheoryBlock color="green">
                    <p>{t('comerc.comparatiu.desc')}</p>
                </TheoryBlock>
            </Card>

            <Card title={t('comerc.exemple')} icon="🔢">
                <div className="overflow-x-auto">
                    <table className="w-full text-sm border-collapse mb-4">
                        <thead>
                            <tr className="bg-slate-100">
                                <th className="p-3 text-left border border-slate-200 font-bold">{t('comerc.exemple.pais')}</th>
                                <th className="p-3 text-center border border-slate-200 font-bold">🍷 {t('comerc.exemple.vi')}</th>
                                <th className="p-3 text-center border border-slate-200 font-bold">🧵 {t('comerc.exemple.teixit')}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td className="p-3 border border-slate-200 font-medium">🇪🇸 {t('comerc.exemple.espanya')}</td>
                                <td className="p-3 border border-slate-200 text-center font-bold text-green-600">2</td>
                                <td className="p-3 border border-slate-200 text-center">4</td>
                            </tr>
                            <tr>
                                <td className="p-3 border border-slate-200 font-medium">🇬🇧 {t('comerc.exemple.anglaterra')}</td>
                                <td className="p-3 border border-slate-200 text-center">6</td>
                                <td className="p-3 border border-slate-200 text-center font-bold text-green-600">3</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <TheoryBlock color="emerald">
                    <p className="font-semibold">{t('comerc.exemple.conclusio')}</p>
                </TheoryBlock>
            </Card>

            <Card title={t('comerc.barreres')} icon="🚧">
                <div className="space-y-3">
                    {[
                        { key: 'aranzels', emoji: '💰', color: 'bg-red-50 border-red-200' },
                        { key: 'contingents', emoji: '📦', color: 'bg-amber-50 border-amber-200' },
                        { key: 'subvencions', emoji: '🏛️', color: 'bg-blue-50 border-blue-200' },
                    ].map(item => (
                        <div key={item.key} className={`flex items-start gap-3 p-4 rounded-xl border ${item.color}`}>
                            <span className="text-xl">{item.emoji}</span>
                            <p className="text-sm text-slate-700">{t('comerc.' + item.key)}</p>
                        </div>
                    ))}
                </div>
            </Card>

            <Card title={t('comerc.balanca')} icon="⚖️">
                <TheoryBlock color="blue">
                    <p>{t('comerc.balanca.desc')}</p>
                </TheoryBlock>
                <div className="space-y-3 mt-4">
                    {[
                        { key: 'corrent', emoji: '🛒', color: 'bg-green-50 border-green-200' },
                        { key: 'capital', emoji: '🏗️', color: 'bg-amber-50 border-amber-200' },
                        { key: 'financer', emoji: '💹', color: 'bg-violet-50 border-violet-200' },
                    ].map(item => (
                        <div key={item.key} className={`flex items-start gap-3 p-4 rounded-xl border ${item.color}`}>
                            <span className="text-xl">{item.emoji}</span>
                            <p className="text-sm text-slate-700">{t('comerc.balanca.' + item.key)}</p>
                        </div>
                    ))}
                </div>
            </Card>

            <Card title={t('comerc.globalitzacio')} icon="🌐">
                <div className="space-y-3">
                    <TheoryBlock color="blue" title="📋 Causes">
                        <p>{t('comerc.global.causes')}</p>
                    </TheoryBlock>
                    <TheoryBlock color="green" title="✅ Avantatges">
                        <p>{t('comerc.global.avantatges')}</p>
                    </TheoryBlock>
                    <TheoryBlock color="red" title="⚠️ Desavantatges">
                        <p>{t('comerc.global.desavantatges')}</p>
                    </TheoryBlock>
                </div>
            </Card>

            <Card title={t('comerc.ue')} icon="🇪🇺">
                <TheoryBlock color="blue">
                    <p>{t('comerc.ue.desc')}</p>
                </TheoryBlock>
                <div className="space-y-3 mt-4">
                    {[
                        { key: 'mercat', emoji: '🏪' },
                        { key: 'euro', emoji: '💶' },
                        { key: 'institucions', emoji: '🏛️' },
                        { key: 'politiques', emoji: '📜' },
                    ].map(item => (
                        <div key={item.key} className="flex items-start gap-3 p-3 bg-blue-50 rounded-lg border border-blue-200">
                            <span className="text-lg">{item.emoji}</span>
                            <p className="text-sm text-slate-700">{t('comerc.ue.' + item.key)}</p>
                        </div>
                    ))}
                </div>
            </Card>
        </div>
    );

    // ========================================================================
    // NAVIGATION AND RENDER
    // ========================================================================
    const headerSections = [
        { id: 'escassetat', label: t('sec.escassetat'), emoji: '⚖️' },
        { id: 'agents', label: t('sec.agents'), emoji: '🔄' },
        { id: 'oferta-demanda', label: t('sec.oferta-demanda'), emoji: '📊' },
        { id: 'mercats', label: t('sec.mercats'), emoji: '🏪' },
        { id: 'empresa', label: t('sec.empresa'), emoji: '🏭' },
        { id: 'magnituds', label: t('sec.magnituds'), emoji: '📈' },
        { id: 'treball', label: t('sec.treball'), emoji: '👷' },
        { id: 'diners', label: t('sec.diners'), emoji: '💰' },
        { id: 'politica', label: t('sec.politica'), emoji: '🏛️' },
        { id: 'comerc', label: t('sec.comerc'), emoji: '🌍' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}
                setIdioma={setIdioma}
                currentApp="economia-1bach"
                sections={headerSections}
                currentSection={section}
                setSection={setSection}
            />

            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}
                {section === 'escassetat' && <Escassetat />}
                {section === 'agents' && <Agents />}
                {section === 'oferta-demanda' && <OfertaDemanda />}
                {section === 'mercats' && <Mercats />}
                {section === 'empresa' && <Empresa />}
                {section === 'magnituds' && <Magnituds />}
                {section === 'treball' && <Treball />}
                {section === 'diners' && <Diners />}
                {section === 'politica' && <Politica />}
                {section === 'comerc' && <Comerc />}
            </main>

            <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
            <PdeFooter appEmoji="📈" appName={t('footer.appname')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<Eco1bachApp />, document.getElementById('root'));
    </script>
</body>
</html>
