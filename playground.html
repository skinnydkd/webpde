            setShowConfetti(true);
            setTimeout(() => setShowConfetti(false), 3000);
        } else {
            setDia(d => d + 1);
            setHores({ menjar: 0, refugi: 0, eines: 0, explorar: 0 });
            setEventMsg(null);
            setDiaResultat(null);
            setFase('dia');
        }
    };

    // Activity config
    const activitats = [
        { key: 'menjar', icon: '🍌', nom: 'Menjar', rate: FOOD_PER_HOUR, color: 'bg-green-100', textColor: 'text-green-700' },
        { key: 'refugi', icon: '🛖', nom: 'Refugi', rate: SHELTER_PER_HOUR, color: 'bg-amber-100', textColor: 'text-amber-700' },
        { key: 'eines', icon: '🔨', nom: 'Eines', rate: null, color: 'bg-blue-100', textColor: 'text-blue-700' },
        { key: 'explorar', icon: '🗺️', nom: 'Explorar', rate: EXPLORE_PER_HOUR, color: 'bg-purple-100', textColor: 'text-purple-700' }
    ];

    // Resource bar component
    const ResourceBar = ({ label, icon, value, max, danger }) => {
        const pct = Math.max(0, Math.min(100, (value / max) * 100));
        const isDanger = value < 0;
        return (
            <div className="space-y-1">
                <div className="flex justify-between text-sm font-bold">
                    <span>{icon} {label}</span>
                    <span className={isDanger ? 'text-red-600' : ''}>{value}</span>
                </div>
                <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                    <div className={`h-full rounded-full transition-all ${isDanger ? 'bg-red-500' : value <= danger ? 'bg-orange-400' : 'bg-green-400'}`} style={{ width: `${pct}%` }} />
                </div>
                {value <= danger && value >= 0 && <p className="text-xs text-red-500 font-bold">⚠️ Zona de perill!</p>}
            </div>
        );
    };

    // Day progress circles
    const DayProgress = () => (
        <div className="flex justify-center gap-2">
            {[...Array(TOTAL_DIES)].map((_, i) => (
                <div key={i} className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-all ${
                    i + 1 < dia ? 'bg-green-400 text-white' :
                    i + 1 === dia ? 'bg-amber-400 text-white scale-110 ring-2 ring-amber-300' :
                    'bg-gray-200 text-gray-500'
                }`}>{i + 1}</div>
            ))}
        </div>
    );

    // INTRO
    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-amber-600">🏝️ L'Illa de l'Escassetat</h2>
            <Mascot mood="thinking" message={`${jugadors.j1}, has naufragat en una illa deserta! Sobreviu 6 dies i explora tot el que pugues.`} />
            <div className={`rounded-2xl p-5 space-y-3 ${isHard ? 'bg-red-100' : 'bg-amber-100'}`}>
                <p className="text-lg font-bold text-center">📜 Regles ({isHard ? '🔥 Difícil' : '🌱 Fàcil'}):</p>
                <div className="space-y-2 text-left">
                    <div className="bg-white rounded-xl p-3 flex items-center gap-3">
                        <span className="text-2xl">⏰</span>
                        <span>Tens <strong>{HORES_DIA} hores/dia</strong> durant <strong>{TOTAL_DIES} dies</strong></span>
                    </div>
                    <div className="bg-white rounded-xl p-3 space-y-1">
                        <p className="font-bold">4 activitats:</p>
                        <p>🍌 <strong>Menjar:</strong> {FOOD_PER_HOUR} unitats/hora (consums {CONSUM_DIARI}/dia)</p>
                        <p>🛖 <strong>Refugi:</strong> {SHELTER_PER_HOUR} unitats/hora (desgast {DESGAST_DIARI}/dia)</p>
                        <p>🔨 <strong>Eines:</strong> +{(TOOL_BOOST * 100).toFixed(0)}% productivitat per hora</p>
                        <p>🗺️ <strong>Explorar:</strong> {EXPLORE_PER_HOUR} punts/hora (OBJECTIU!)</p>
                    </div>
                    <div className="bg-white rounded-xl p-3">
                        <p className="text-red-600 font-bold">💀 Si menjar o refugi arriba a 0... mors!</p>
                    </div>
                    {isHard && <div className="bg-red-200 rounded-xl p-3">
                        <p className="text-red-700 font-bold text-sm">⚠️ Mode difícil: menys recursos, més desgast i EVENTS ALEATORIS!</p>
                    </div>}
                </div>
            </div>
            <BigButton color="orange" onClick={() => setFase('dia')}>🏝️ Sobreviure!</BigButton>
        </div></GameCard>
    );

    // DAY ALLOCATION
    if (fase === 'dia') return (
        <GameCard><div className="space-y-4">
            <DayProgress />
            <h3 className="text-xl font-black text-center text-amber-700">Dia {dia} — {jugadors.j1}</h3>

            {/* Resource status */}
            <div className="bg-white/80 rounded-2xl p-4 space-y-3">
                <ResourceBar label="Menjar" icon="🍌" value={acumulat.menjar} max={30} danger={CONSUM_DIARI} />
                <ResourceBar label="Refugi" icon="🛖" value={acumulat.refugi} max={20} danger={DESGAST_DIARI} />
                <div className="flex justify-between items-center">
                    <span className="text-sm font-bold">🗺️ Exploració</span>
                    <span className="text-purple-600 font-black text-lg">{acumulat.explorar} pts</span>
                </div>
                <div className="flex justify-between items-center">
                    <span className="text-sm font-bold">⚙️ Multiplicador</span>
                    <span className="bg-blue-100 text-blue-700 font-black px-3 py-1 rounded-full text-sm">x{multiplicador.toFixed(2)}</span>
                </div>
            </div>

            {/* Hours remaining */}
            <div className="text-center">
                <span className={`inline-block px-4 py-2 rounded-full font-black text-lg ${horesRestants === 0 ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                    ⏰ {horesRestants} hores restants
                </span>
            </div>

            {/* Activity rows */}
            <div className="space-y-2">
                {activitats.map(act => {
                    const preview = act.key === 'eines'
                        ? `+${((hores[act.key] * TOOL_BOOST) * 100).toFixed(0)}% boost`
                        : act.key === 'explorar'
                            ? `+${hores[act.key] * act.rate} pts`
                            : `+${Math.floor(hores[act.key] * act.rate * multiplicador)} unitats`;
                    return (
                        <div key={act.key} className={`${act.color} rounded-2xl p-3 flex items-center gap-3`}>
                            <span className="text-2xl w-8">{act.icon}</span>
                            <div className="flex-1">
                                <p className={`font-bold text-sm ${act.textColor}`}>{act.nom}</p>
                                <p className="text-xs text-gray-500">{preview}</p>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => ajustarHores(act.key, -1)} disabled={hores[act.key] <= 0}
                                    className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">−</button>
                                <span className="w-8 text-center text-xl font-black">{hores[act.key]}</span>
                                <button onClick={() => ajustarHores(act.key, 1)} disabled={horesRestants <= 0}
                                    className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">+</button>
                            </div>
                        </div>
                    );
                })}
            </div>

            <BigButton color="green" onClick={confirmarDia} disabled={horesRestants !== 0}>
                {horesRestants !== 0 ? `Assigna ${horesRestants} hores més!` : '✅ Confirmar Dia'}
            </BigButton>
        </div></GameCard>
    );

    // DAY RESULT
    if (fase === 'resultat_dia' && diaResultat) return (
        <GameCard><div className="text-center space-y-4">
            <DayProgress />
            <h3 className="text-xl font-black text-amber-700">Resultats del Dia {dia}</h3>

            <div className="space-y-2">
                <div className="bg-green-50 rounded-xl p-3 flex justify-between">
                    <span>🍌 Menjar produït</span>
                    <span className="font-bold text-green-600">+{diaResultat.prodMenjar}</span>
                </div>
                <div className="bg-red-50 rounded-xl p-3 flex justify-between">
                    <span>🍌 Consum diari</span>
                    <span className="font-bold text-red-600">-{CONSUM_DIARI}</span>
                </div>
                <div className="bg-amber-50 rounded-xl p-3 flex justify-between">
                    <span>🛖 Refugi construït</span>
                    <span className="font-bold text-green-600">+{diaResultat.prodRefugi}</span>
                </div>
                <div className="bg-red-50 rounded-xl p-3 flex justify-between">
                    <span>🛖 Desgast diari</span>
                    <span className="font-bold text-red-600">-{DESGAST_DIARI}</span>
                </div>
                {diaResultat.prodExplorar > 0 && <div className="bg-purple-50 rounded-xl p-3 flex justify-between">
                    <span>🗺️ Exploració</span>
                    <span className="font-bold text-purple-600">+{diaResultat.prodExplorar}</span>
                </div>}
                {diaResultat.boostNou > 0 && <div className="bg-blue-50 rounded-xl p-3 flex justify-between">
                    <span>⚙️ Nou multiplicador</span>
                    <span className="font-bold text-blue-600">x{diaResultat.nouMultiplicador.toFixed(2)}</span>
                </div>}
            </div>

            {eventMsg && <div className="bg-yellow-100 rounded-2xl p-4 animate-shake">
                <p className="text-lg font-black">{eventMsg}</p>
            </div>}

            {/* Net result summary */}
            <div className="bg-white rounded-2xl p-4 space-y-2">
                <p className="font-bold text-sm text-gray-500">Estat actual:</p>
                <div className="flex justify-around">
                    <div><span className="text-2xl">🍌</span><p className={`font-black ${acumulat.menjar <= CONSUM_DIARI ? 'text-orange-600' : 'text-green-600'}`}>{acumulat.menjar}</p></div>
                    <div><span className="text-2xl">🛖</span><p className={`font-black ${acumulat.refugi <= DESGAST_DIARI ? 'text-orange-600' : 'text-green-600'}`}>{acumulat.refugi}</p></div>
                    <div><span className="text-2xl">🗺️</span><p className="font-black text-purple-600">{acumulat.explorar}</p></div>
                    <div><span className="text-2xl">⚙️</span><p className="font-black text-blue-600">x{multiplicador.toFixed(2)}</p></div>
                </div>
            </div>

            <Mascot mood={acumulat.menjar <= CONSUM_DIARI || acumulat.refugi <= DESGAST_DIARI ? 'thinking' : 'happy'}
                message={acumulat.menjar <= CONSUM_DIARI || acumulat.refugi <= DESGAST_DIARI
                    ? 'Atenció! Els recursos estan baixos... Prioritza la supervivència!'
                    : dia >= 4 ? 'Últims dies! Hora d\'explorar al màxim!' : 'Bon treball! Recorda invertir en eines per al futur.'} />

            <BigButton color="orange" onClick={seguentDia}>
                {dia >= TOTAL_DIES ? '🏆 Resultats Finals' : `➡️ Dia ${dia + 1}`}
            </BigButton>
        </div></GameCard>
    );

    // DEATH
    if (fase === 'mort') return (
        <GameCard><div className="text-center space-y-5">
            <h3 className="text-3xl font-black text-red-600">💀 Game Over!</h3>
            <div className="text-6xl animate-shake">{mortCausa === 'fam' ? '🍌' : '🛖'}</div>
            <p className="text-xl font-bold text-gray-700">
                {mortCausa === 'fam' ? 'Has mort de fam!' : 'Has mort de fred!'}
            </p>
            <p className="text-gray-500">Dia {dia} de {TOTAL_DIES} — No has pogut sobreviure.</p>
            <div className="bg-red-50 rounded-2xl p-4">
                <p className="text-sm text-gray-500">Exploració acumulada:</p>
                <p className="text-3xl font-black text-red-400 line-through">{acumulat.explorar} pts</p>
                <p className="text-lg font-black text-red-600">Puntuació final: 0</p>
            </div>
            <LlicioEconomica
                concepte="Piràmide de Maslow i Cost d'Oportunitat"
                definicio="No pots explorar (autorrealització) si no sobrevius primer (necessitats bàsiques). El COST D'OPORTUNITAT de cada hora és allò que deixes de fer: explorar costa menjar, i menjar costa no explorar. Cada decisió implica una renúncia."
                autor="Abraham Maslow (1943) / Friedrich von Wieser (cost d'oportunitat, 1914)"
                exemple="Un estudiant que treballa moltes hores guanya diners però perd temps d'estudi. Un país que gasta tot en defensa militar no inverteix en educació ni sanitat. La Frontera de Possibilitats de Producció (FPP) mostra aquest compromís gràficament."
                reflexio="Has mort perquè has explorat massa aviat? O no has invertit prou en eines? La lliçó: primer assegura la base (menjar, refugi), després inverteix en capital (eines) per ser més productiu, i finalment explora."
            />
            <BigButton color="red" onClick={() => onEnd({ j1: 0 })}>🏠 Tornar</BigButton>
        </div></GameCard>
    );

    // FINAL
    if (fase === 'final') return (
        <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-5">
            <h3 className="text-3xl font-black text-green-600">🏝️ Has Sobreviscut!</h3>
            <div className="text-6xl animate-bounce-slow">🎉</div>
            <p className="text-lg text-gray-600">{jugadors.j1} ha explorat l'illa durant {TOTAL_DIES} dies!</p>

            <div className="bg-white rounded-2xl p-5 space-y-3">
                <div className="flex justify-around">
                    <div className="text-center">
                        <p className="text-3xl">🍌</p>
                        <p className="font-black text-green-600">{acumulat.menjar}</p>
                        <p className="text-xs text-gray-500">Menjar</p>
                    </div>
                    <div className="text-center">
                        <p className="text-3xl">🛖</p>
                        <p className="font-black text-amber-600">{acumulat.refugi}</p>
                        <p className="text-xs text-gray-500">Refugi</p>
                    </div>
                    <div className="text-center">
                        <p className="text-3xl">⚙️</p>
                        <p className="font-black text-blue-600">x{multiplicador.toFixed(2)}</p>
                        <p className="text-xs text-gray-500">Multiplicador</p>
                    </div>
                </div>
                <div className="border-t pt-3">
                    <p className="text-sm text-gray-500">Puntuació d'exploració</p>
                    <p className="text-4xl font-black text-purple-600">🗺️ {acumulat.explorar} pts</p>
                </div>
            </div>

            <LlicioEconomica
                concepte="Escassetat, FPP i Inversió en Capital"
                definicio="L'ESCASSETAT (temps limitat) ens obliga a TRIAR. La Frontera de Possibilitats de Producció (FPP) mostra les combinacions màximes que pots produir. Invertir en CAPITAL (eines) desplaça la FPP cap a fora: produeixes MÉS amb les mateixes hores."
                autor="Paul Samuelson, Nobel 1970 — pare de l'economia moderna"
                exemple="La Xina va invertir massivament en infraestructures (capital) durant dècades, sacrificant consum present. Resultat: la productivitat es va multiplicar per 10. Espanya, en canvi, va prioritzar consum (bombolla immobiliària) i va créixer menys a llarg termini."
                sabiesQue={`El teu multiplicador final ha sigut x${multiplicador.toFixed(2)}. Cada hora dedicada a eines va augmentar la teua productivitat un ${(TOOL_BOOST * 100).toFixed(0)}%. Això és exactament el que fan els països que inverteixen en educació i tecnologia: sacrifiquen el present per un futur més productiu.`}
                reflexio="Quantes hores has dedicat a eines? Si hagueres invertit més al principi, hauries explorat més al final. Això és el dilema entre CONSUM PRESENT i INVERSIÓ FUTURA: la base de tot el creixement econòmic."
            />
            <BigButton color="gold" onClick={() => onEnd({ j1: acumulat.explorar })}>🏆 Veure Puntuació</BigButton>
        </div></GameCard>
    );

    return null;
};

// ============== JOC 8: EL BANQUER ==============
const JocBanquer = ({ jugadors, onEnd, difficulty }) => {
    const TOTAL_RONDES = difficulty === 'hard' ? 8 : 5;
    const INTERES_ESTALVI = difficulty === 'hard' ? 0.05 : 0.10;
    const INTERES_PRESTEC = difficulty === 'hard' ? 0.20 : 0.15;
    const [fase, setFase] = useState('intro');
    const [ronda, setRonda] = useState(1);
    const [comptes, setComptes] = useState({ j1: { caixa: 20, estalvis: 0, deute: 0 }, j2: { caixa: 20, estalvis: 0, deute: 0 } });
    const [torn, setTorn] = useState('j1');
    const [showConfetti, setShowConfetti] = useState(false);

    const estalviar = (q) => { if (comptes[torn].caixa < q) return; playSound('coin'); setComptes(c => ({ ...c, [torn]: { ...c[torn], caixa: c[torn].caixa - q, estalvis: c[torn].estalvis + q } })); };
    const retirar = (q) => { const max = Math.min(q, comptes[torn].estalvis); if (max <= 0) return; playSound('click'); setComptes(c => ({ ...c, [torn]: { ...c[torn], caixa: c[torn].caixa + max, estalvis: c[torn].estalvis - max } })); };
    const demanarPrestec = (q) => { playSound('coin'); setComptes(c => ({ ...c, [torn]: { ...c[torn], caixa: c[torn].caixa + q, deute: c[torn].deute + q } })); };
    const pagarDeute = (q) => { const max = Math.min(q, comptes[torn].caixa, comptes[torn].deute); if (max <= 0) return; playSound('coin'); setComptes(c => ({ ...c, [torn]: { ...c[torn], caixa: c[torn].caixa - max, deute: c[torn].deute - max } })); };

    const passarTorn = () => {
        if (torn === 'j1') setTorn('j2');
        else {
            setComptes(c => ({
                j1: { caixa: c.j1.caixa + 5, estalvis: Math.floor(c.j1.estalvis * (1 + INTERES_ESTALVI)), deute: Math.ceil(c.j1.deute * (1 + INTERES_PRESTEC)) },
                j2: { caixa: c.j2.caixa + 5, estalvis: Math.floor(c.j2.estalvis * (1 + INTERES_ESTALVI)), deute: Math.ceil(c.j2.deute * (1 + INTERES_PRESTEC)) }
            }));
            if (ronda >= TOTAL_RONDES) { setFase('resultat'); playSound('win'); setShowConfetti(true); }
            else { setRonda(r => r + 1); setTorn('j1'); }
        }
    };

    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-emerald-600">🏦 El Banquer</h2>
            <Mascot mood="smart" message="Estalvia i guanya interessos!" />
            <div className={`rounded-2xl p-5 space-y-3 ${difficulty === 'hard' ? 'bg-red-100' : 'bg-emerald-100'}`}>
                <p className="text-lg font-bold text-center">📜 Regles:</p>
                <div className="space-y-2"><p>💰 <strong>Estalvis</strong>: +{Math.round(INTERES_ESTALVI * 100)}% cada ronda</p><p>💳 <strong>Préstecs</strong>: +{Math.round(INTERES_PRESTEC * 100)}% cada ronda!</p><p>📅 Cada ronda reps <strong>5 monedes</strong></p></div>
            </div>
            <BigButton color="green" onClick={() => setFase('joc')}>🎮 Començar!</BigButton>
        </div></GameCard>
    );

    if (fase === 'joc') {
        const esJ1 = torn === 'j1';
        const c = comptes[torn];
        return (
            <GameCard><div className="space-y-4">
                <div className="flex justify-between items-center">
                    <span className="font-bold">Ronda {ronda}/{TOTAL_RONDES}</span>
                    <span className="text-xs text-gray-500"><span className="text-green-600">+{Math.round(INTERES_ESTALVI * 100)}%</span> | <span className="text-red-600">+{Math.round(INTERES_PRESTEC * 100)}%</span></span>
                </div>
                <div className="flex justify-between">
                    <PlayerBadge name={jugadors.j1} score={comptes.j1.caixa + comptes.j1.estalvis - comptes.j1.deute} color="from-blue-400 to-blue-600" isActive={esJ1} emoji="🦊" />
                    <PlayerBadge name={jugadors.j2} score={comptes.j2.caixa + comptes.j2.estalvis - comptes.j2.deute} color="from-pink-400 to-pink-600" isActive={!esJ1} emoji="🐰" />
                </div>
                <div className={`p-4 rounded-2xl ${esJ1 ? 'bg-blue-50 ring-2 ring-blue-400' : 'bg-pink-50 ring-2 ring-pink-400'}`}>
                    <p className="font-bold mb-2">{jugadors[torn]} {esJ1 ? '🦊' : '🐰'}</p>
                    <div className="grid grid-cols-3 gap-2 mb-3 text-center">
                        <div className="bg-white rounded-lg p-2"><p className="text-xs text-gray-500">💵 Caixa</p><p className="font-black">{c.caixa}</p></div>
                        <div className="bg-green-100 rounded-lg p-2"><p className="text-xs text-gray-500">🏦 Estalvis</p><p className="font-black text-green-600">{c.estalvis}</p></div>
                        <div className="bg-red-100 rounded-lg p-2"><p className="text-xs text-gray-500">💳 Deute</p><p className="font-black text-red-600">{c.deute}</p></div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-1">
                            <p className="text-xs font-bold text-green-600">🏦 Estalviar</p>
                            <div className="flex gap-1">{[5, 10].map(q => <button key={q} onClick={() => estalviar(q)} disabled={c.caixa < q} className={`flex-1 px-2 py-1 rounded text-xs font-bold ${c.caixa >= q ? 'bg-green-500 text-white' : 'bg-gray-200'}`}>+{q}</button>)}</div>
                            <button onClick={() => retirar(10)} disabled={c.estalvis < 1} className={`w-full px-2 py-1 rounded text-xs font-bold ${c.estalvis > 0 ? 'bg-green-200' : 'bg-gray-200'}`}>Retirar</button>
                        </div>
                        <div className="space-y-1">
                            <p className="text-xs font-bold text-red-600">💳 Préstecs</p>
                            <div className="flex gap-1">{[10, 20].map(q => <button key={q} onClick={() => demanarPrestec(q)} className="flex-1 px-2 py-1 rounded text-xs font-bold bg-red-400 text-white">+{q}</button>)}</div>
                            <button onClick={() => pagarDeute(10)} disabled={c.caixa < 1 || c.deute < 1} className={`w-full px-2 py-1 rounded text-xs font-bold ${c.caixa > 0 && c.deute > 0 ? 'bg-red-200' : 'bg-gray-200'}`}>Pagar Deute</button>
                        </div>
                    </div>
                </div>
                <BigButton color={esJ1 ? 'blue' : 'pink'} onClick={passarTorn}>✅ Acabar Torn</BigButton>
            </div></GameCard>
        );
    }

    if (fase === 'resultat') {
        const valorJ1 = comptes.j1.caixa + comptes.j1.estalvis - comptes.j1.deute;
        const valorJ2 = comptes.j2.caixa + comptes.j2.estalvis - comptes.j2.deute;
        return (
            <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-5">
                <h3 className="text-2xl font-black">🏦 Balanç Final</h3>
                <div className="grid grid-cols-2 gap-4">
                    <div className={`rounded-2xl p-4 ${valorJ1 > valorJ2 ? 'bg-yellow-100 ring-4 ring-yellow-400' : 'bg-blue-100'}`}><p className="font-bold">{jugadors.j1} 🦊</p><div className="text-xs mt-2"><p>💵 {comptes.j1.caixa}</p><p className="text-green-600">🏦 +{comptes.j1.estalvis}</p><p className="text-red-600">💳 -{comptes.j1.deute}</p></div><p className={`text-3xl font-black mt-2 ${valorJ1 >= 0 ? 'text-green-600' : 'text-red-600'}`}>= {valorJ1}</p></div>
                    <div className={`rounded-2xl p-4 ${valorJ2 > valorJ1 ? 'bg-yellow-100 ring-4 ring-yellow-400' : 'bg-pink-100'}`}><p className="font-bold">{jugadors.j2} 🐰</p><div className="text-xs mt-2"><p>💵 {comptes.j2.caixa}</p><p className="text-green-600">🏦 +{comptes.j2.estalvis}</p><p className="text-red-600">💳 -{comptes.j2.deute}</p></div><p className={`text-3xl font-black mt-2 ${valorJ2 >= 0 ? 'text-green-600' : 'text-red-600'}`}>= {valorJ2}</p></div>
                </div>
                <LlicioEconomica
                    concepte="Interès Compost: a favor o en contra"
                    definicio={`Els estalvis creixen al ${Math.round(INTERES_ESTALVI * 100)}% (interès compost A FAVOR teu). El deute creix al ${Math.round(INTERES_PRESTEC * 100)}% (interès compost EN CONTRA teu). La diferència entre tots dos tipus és el MARGE BANCARI: el negoci dels bancs.`}
                    autor="Benjamin Franklin: 'Un cèntim estalviat és un cèntim guanyat'"
                    exemple="Una targeta de crèdit cobra entre 18-25% TAE. Un dipòsit bancari paga 2-3%. Si deus 1.000€ a la targeta i pagues el mínim, tardaràs 7 anys a pagar-la i hauràs pagat 2.200€ en total. El fons d'emergència (3-6 mesos de despeses) és la base de la salut financera."
                    sabiesQue="El 40% dels espanyols no té estalvis per cobrir una emergència de 1.000€. Les famílies espanyoles deuen de mitjana 25.000€ en hipoteques i crèdits. La Regla 50/30/20: destina el 50% a necessitats, 30% a desitjos i 20% a estalvi."
                    reflexio="Qui ha acabat amb més patrimoni? Qui estalviava o qui s'endeutava? Al joc, 5 monedes arriben cada ronda (el teu sou). Com les has gestionat? La disciplina d'estalviar 'primer paga't a tu mateix' és el secret de la riquesa a llarg termini."
                />
                <BigButton color="yellow" onClick={() => onEnd({ j1: Math.max(0, valorJ1), j2: Math.max(0, valorJ2) })}>🏆 Veure Guanyador</BigButton>
            </div></GameCard>
        );
    }
    return null;
};

// ============== JOC 9: RISC I RECOMPENSA ==============
const JocRiscRecompensa = ({ jugadors, onEnd, difficulty }) => {
    const TOTAL_RONDES = difficulty === 'hard' ? 6 : 4;
    const [fase, setFase] = useState('intro');
    const [ronda, setRonda] = useState(1);
    const [punts, setPunts] = useState({ j1: 0, j2: 0 });
    const [aposta, setAposta] = useState({ j1: null, j2: null });
    const [resultat, setResultat] = useState(null);
    const [showConfetti, setShowConfetti] = useState(false);
    const OPCIONS = difficulty === 'hard' ? [
        { id: 'segur', nom: '🛡️ Segur', prob: 1, guany: 3, perdua: 0 },
        { id: 'moderat', nom: '⚖️ Moderat', prob: 0.6, guany: 8, perdua: -2 },
        { id: 'arriscat', nom: '🎲 Arriscat', prob: 0.4, guany: 15, perdua: -5 },
        { id: 'extrem', nom: '💀 Extrem', prob: 0.2, guany: 30, perdua: -10 },
    ] : [
        { id: 'segur', nom: '🛡️ Segur', prob: 1, guany: 5, perdua: 0 },
        { id: 'moderat', nom: '⚖️ Moderat', prob: 0.7, guany: 10, perdua: 0 },
        { id: 'arriscat', nom: '🎲 Arriscat', prob: 0.5, guany: 20, perdua: -5 },
    ];

    const ferAposta = (jugador, opcioId) => {
        playSound('click');
        const noves = { ...aposta, [jugador]: opcioId };
        setAposta(noves);
        if (noves.j1 && noves.j2) {
            const calc = (id) => { const o = OPCIONS.find(x => x.id === id); const exit = Math.random() < o.prob; return { opcio: o, exit, punts: exit ? o.guany : o.perdua }; };
            const resJ1 = calc(noves.j1), resJ2 = calc(noves.j2);
            setPunts(p => ({ j1: p.j1 + resJ1.punts, j2: p.j2 + resJ2.punts }));
            setResultat({ j1: resJ1, j2: resJ2 }); setFase('resultatRonda');
            if (resJ1.exit || resJ2.exit) { playSound('win'); setShowConfetti(true); setTimeout(() => setShowConfetti(false), 2000); }
        }
    };

    const seguentRonda = () => {
        if (ronda >= TOTAL_RONDES) onEnd(punts);
        else { setRonda(r => r + 1); setAposta({ j1: null, j2: null }); setResultat(null); setFase('joc'); }
    };

    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-indigo-600">🎲 Risc i Recompensa</h2>
            <Mascot mood="thinking" message="Més risc = més recompensa... o pèrdua!" />
            <div className={`rounded-2xl p-5 space-y-3 ${difficulty === 'hard' ? 'bg-red-100' : 'bg-indigo-100'}`}>
                <p className="text-lg font-bold text-center">📜 Opcions:</p>
                <div className="space-y-2">{OPCIONS.map(o => <div key={o.id} className="bg-white rounded-xl p-2 flex items-center gap-2"><span className="text-xl">{o.nom.split(' ')[0]}</span><span className="text-sm flex-1">{Math.round(o.prob*100)}%: +{o.guany} / {o.perdua || '0'}</span></div>)}</div>
            </div>
            <BigButton color="purple" onClick={() => setFase('joc')}>🎮 Començar!</BigButton>
        </div></GameCard>
    );

    if (fase === 'joc') return (
        <GameCard><div className="space-y-4">
            <div className="flex justify-between items-center">
                <PlayerBadge name={jugadors.j1} score={punts.j1} color="from-blue-400 to-blue-600" isActive={!aposta.j1} emoji="🦊" />
                <span className="font-bold text-gray-500">Ronda {ronda}/{TOTAL_RONDES}</span>
                <PlayerBadge name={jugadors.j2} score={punts.j2} color="from-pink-400 to-pink-600" isActive={!aposta.j2} emoji="🐰" />
            </div>
            <h3 className="text-xl font-black text-center">Trieu estratègia!</h3>
            <div className="grid grid-cols-2 gap-4">
                {['j1', 'j2'].map(j => (
                    <div key={j} className={`p-3 rounded-2xl ${!aposta[j] ? (j === 'j1' ? 'bg-blue-50 ring-2 ring-blue-400' : 'bg-pink-50 ring-2 ring-pink-400') : 'bg-gray-100'}`}>
                        <p className="font-bold text-sm mb-2">{jugadors[j]} {j === 'j1' ? '🦊' : '🐰'}</p>
                        {!aposta[j] ? <div className="space-y-1">{OPCIONS.map(o => <button key={o.id} onClick={() => ferAposta(j, o.id)} className={`w-full px-2 py-2 ${j === 'j1' ? 'bg-blue-500' : 'bg-pink-500'} text-white rounded-lg text-xs font-bold`}>{o.nom}</button>)}</div> : <p className="text-center text-2xl">✅</p>}
                    </div>
                ))}
            </div>
        </div></GameCard>
    );

    if (fase === 'resultatRonda' && resultat) return (
        <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-4">
            <h3 className="text-2xl font-black">🎲 Resultats!</h3>
            <div className="grid grid-cols-2 gap-4">
                {['j1', 'j2'].map(j => (
                    <div key={j} className={`p-4 rounded-2xl ${resultat[j].exit ? 'bg-green-100' : 'bg-red-100'}`}>
                        <p className="font-bold">{jugadors[j]} {j === 'j1' ? '🦊' : '🐰'}</p>
                        <p className="text-sm">{resultat[j].opcio.nom}</p>
                        <p className="text-3xl my-2">{resultat[j].exit ? '✅' : '❌'}</p>
                        <p className={`text-2xl font-black ${resultat[j].punts >= 0 ? 'text-green-600' : 'text-red-600'}`}>{resultat[j].punts >= 0 ? '+' : ''}{resultat[j].punts}</p>
                    </div>
                ))}
            </div>
            <Mascot mood={resultat.j1.exit && resultat.j2.exit ? 'love' : 'thinking'} message="L'esperança matemàtica guanya a llarg termini!" />
            {ronda >= TOTAL_RONDES && (
                <LlicioEconomica
                    concepte="Valor Esperat i Gestió del Risc"
                    definicio="El VALOR ESPERAT = probabilitat × guany + (1-probabilitat) × pèrdua. Una inversió 'segura' amb baix rendiment pot ser MILLOR que una 'arriscada' si el seu valor esperat és superior. A llarg termini, l'atzar s'equilibra i el valor esperat domina (Llei dels Grans Nombres)."
                    autor="Daniel Bernoulli (1738) / Daniel Kahneman, Nobel 2002 (Prospect Theory)"
                    exemple="Les assegurances funcionen així: tu pagues 500€/any per evitar perdre 100.000€. Per a tu, el valor esperat és negatiu (probablement no tindràs sinistre), però la PAU MENTAL val la pena. Per a l'asseguradora, amb milions de clients, l'atzar s'equilibra i el negoci és rendible."
                    sabiesQue="Kahneman va descobrir que les pèrdues ens dolen el DOBLE que les equivalent en guanys (aversió a la pèrdua). Per això preferim l'opció 'segura' encara que el valor esperat siga menor. Warren Buffett diu: 'Regla 1: mai perdre diners. Regla 2: mai oblidar la regla 1.'"
                    reflexio="Quina estratègia ha funcionat millor? Calcula el valor esperat de cada opció del joc. L'opció 'segura' sempre dóna +5, però l'arriscada dóna 50%×20 + 50%×(-5) = +7.5 en promig. A llarg termini, arriscar POT ser millor... si aguantes les pèrdues!"
                />
            )}
            <BigButton color={ronda >= TOTAL_RONDES ? 'yellow' : 'purple'} onClick={seguentRonda}>{ronda >= TOTAL_RONDES ? '🏆 Resultats Finals' : '➡️ Següent'}</BigButton>
        </div></GameCard>
    );
    return null;
};

// ============== JOC: EL COMERÇ INTERNACIONAL (2 Players) ==============
const JocComers = ({ jugadors, onEnd, difficulty }) => {
    const isHard = difficulty === 'hard';
    const HORES = 10;
    const eficiencia = isHard
        ? { j1: { blat: 4, acer: 3 }, j2: { blat: 1, acer: 2 } }
        : { j1: { blat: 3, acer: 1 }, j2: { blat: 1, acer: 2 } };

    const [fase, setFase] = useState('intro');
    const [allocAut, setAllocAut] = useState({ j1: { blat: 5, acer: 5 }, j2: { blat: 5, acer: 5 } });
    const [allocCom, setAllocCom] = useState({ j1: { blat: 5, acer: 5 }, j2: { blat: 5, acer: 5 } });
    const [oferta, setOferta] = useState({ blatJ1aJ2: 0, acerJ2aJ1: 0 });
    const [showConfetti, setShowConfetti] = useState(false);
    const [tradeAccepted, setTradeAccepted] = useState(null);

    // Calculate production from allocation
    const calcProd = (alloc, jugador) => ({
        blat: alloc[jugador].blat * eficiencia[jugador].blat,
        acer: alloc[jugador].acer * eficiencia[jugador].acer
    });

    // Satisfaction formula
    const satisfaccio = (blat, acer) => Math.min(blat, acer) * 10 + Math.abs(blat - acer);

    // Adjust allocation for autarky or trade
    const ajustarAlloc = (target, jugador, delta) => {
        const setter = target === 'aut' ? setAllocAut : setAllocCom;
        setter(prev => {
            const nouBlat = prev[jugador].blat + delta;
            const nouAcer = HORES - nouBlat;
            if (nouBlat < 0 || nouBlat > HORES) return prev;
            playSound('pop');
            return { ...prev, [jugador]: { blat: nouBlat, acer: nouAcer } };
        });
    };

    // Adjust trade offer
    const ajustarOferta = (camp, delta) => {
        setOferta(prev => {
            const nou = prev[camp] + delta;
            if (nou < 0) return prev;
            // Can't give more than you produced
            const prodComJ1 = calcProd(allocCom, 'j1');
            const prodComJ2 = calcProd(allocCom, 'j2');
            if (camp === 'blatJ1aJ2' && nou > prodComJ1.blat) return prev;
            if (camp === 'acerJ2aJ1' && nou > prodComJ2.acer) return prev;
            playSound('pop');
            return { ...prev, [camp]: nou };
        });
    };

    // Finalize trade decision
    const resoldreComerc = (acceptat) => {
        setTradeAccepted(acceptat);
        if (acceptat) {
            playSound('win');
            setShowConfetti(true);
            setTimeout(() => setShowConfetti(false), 3000);
        } else {
            playSound('lose');
        }
        setFase('resultat');
    };

    // Efficiency table component
    const TaulaEficiencia = () => (
        <div className="bg-white rounded-2xl p-4 space-y-2">
            <p className="font-bold text-sm text-gray-500 text-center">Productivitat per hora</p>
            <div className="grid grid-cols-3 gap-2 text-center">
                <div></div>
                <div className="font-bold text-sm">🌾 Blat</div>
                <div className="font-bold text-sm">⚙️ Acer</div>
                <div className="font-bold text-sm text-blue-600">{jugadors.j1} 🦊</div>
                <div className="bg-blue-50 rounded-lg p-1 font-black">{eficiencia.j1.blat}/h</div>
                <div className="bg-blue-50 rounded-lg p-1 font-black">{eficiencia.j1.acer}/h</div>
                <div className="font-bold text-sm text-pink-600">{jugadors.j2} 🐰</div>
                <div className="bg-pink-50 rounded-lg p-1 font-black">{eficiencia.j2.blat}/h</div>
                <div className="bg-pink-50 rounded-lg p-1 font-black">{eficiencia.j2.acer}/h</div>
            </div>
        </div>
    );

    // Allocation UI component
    const AllocUI = ({ jugador, alloc, target, color, emoji }) => {
        const prod = calcProd(target === 'aut' ? allocAut : allocCom, jugador);
        const a = (target === 'aut' ? allocAut : allocCom)[jugador];
        return (
            <div className={`${color} rounded-2xl p-4 space-y-3`}>
                <p className="font-bold text-center">{jugadors[jugador]} {emoji} — {HORES} hores</p>

                {/* Visual hour bar */}
                <div className="flex rounded-full overflow-hidden h-6">
                    <div className="bg-amber-400 flex items-center justify-center text-xs font-bold text-white transition-all" style={{ width: `${(a.blat / HORES) * 100}%` }}>
                        {a.blat > 0 && `🌾${a.blat}h`}
                    </div>
                    <div className="bg-gray-500 flex items-center justify-center text-xs font-bold text-white transition-all" style={{ width: `${(a.acer / HORES) * 100}%` }}>
                        {a.acer > 0 && `⚙️${a.acer}h`}
                    </div>
                </div>

                {/* Controls */}
                <div className="flex items-center justify-center gap-3">
                    <span className="text-lg">🌾</span>
                    <button onClick={() => ajustarAlloc(target, jugador, -1)} disabled={a.blat <= 0}
                        className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">−</button>
                    <span className="w-8 text-center text-xl font-black">{a.blat}</span>
                    <button onClick={() => ajustarAlloc(target, jugador, 1)} disabled={a.blat >= HORES}
                        className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">+</button>
                    <span className="text-lg">⚙️</span>
                    <span className="text-xl font-black w-8 text-center">{a.acer}</span>
                </div>

                {/* Production preview */}
                <div className="flex justify-center gap-4">
                    <div className="bg-white/80 rounded-xl px-3 py-1">
                        <span className="font-bold">🌾 {prod.blat}</span>
                    </div>
                    <div className="bg-white/80 rounded-xl px-3 py-1">
                        <span className="font-bold">⚙️ {prod.acer}</span>
                    </div>
                </div>
            </div>
        );
    };

    // INTRO
    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-blue-600">🚢 El Comerç Internacional</h2>
            <Mascot mood="smart" message="Dos països, dos béns. Pot el comerç fer que TOTS dos guanyen?" />
            <TaulaEficiencia />
            <div className={`rounded-2xl p-5 space-y-3 ${isHard ? 'bg-red-100' : 'bg-blue-100'}`}>
                <p className="text-lg font-bold text-center">📜 Com funciona ({isHard ? '🔥 Difícil' : '🌱 Fàcil'}):</p>
                <div className="space-y-2 text-left text-sm">
                    <div className="bg-white rounded-xl p-3">
                        <p><strong>Fase 1 — Autarquia:</strong> Cada país reparteix {HORES} hores entre 🌾 Blat i ⚙️ Acer. Sense comerç!</p>
                    </div>
                    <div className="bg-white rounded-xl p-3">
                        <p><strong>Fase 2 — Comerç:</strong> Produïu de nou, però ara podeu COMERCIAR!</p>
                    </div>
                    <div className="bg-white rounded-xl p-3">
                        <p><strong>Puntuació:</strong> min(blat, acer) x 10 + excedent</p>
                    </div>
                    {isHard && <div className="bg-red-200 rounded-xl p-3">
                        <p className="text-red-700 font-bold">⚠️ {jugadors.j1} és millor en TOT! Però l'avantatge comparatiu encara funciona...</p>
                    </div>}
                </div>
            </div>
            <BigButton color="blue" onClick={() => setFase('autarquia_j1')}>🚢 Començar!</BigButton>
        </div></GameCard>
    );

    // AUTARKY J1
    if (fase === 'autarquia_j1') return (
        <GameCard><div className="space-y-4">
            <h3 className="text-xl font-black text-center text-gray-700">📦 Fase 1: Autarquia</h3>
            <p className="text-center text-sm text-gray-500">{jugadors.j2}, no miris! 🙈</p>
            <TaulaEficiencia />
            <AllocUI jugador="j1" alloc={allocAut} target="aut" color="bg-blue-50" emoji="🦊" />
            <BigButton color="blue" onClick={() => setFase('autarquia_j2')}>✅ Confirmar {jugadors.j1}</BigButton>
        </div></GameCard>
    );

    // AUTARKY J2
    if (fase === 'autarquia_j2') return (
        <GameCard><div className="space-y-4">
            <h3 className="text-xl font-black text-center text-gray-700">📦 Fase 1: Autarquia</h3>
            <p className="text-center text-sm text-gray-500">Ara li toca a {jugadors.j2}!</p>
            <TaulaEficiencia />
            <AllocUI jugador="j2" alloc={allocAut} target="aut" color="bg-pink-50" emoji="🐰" />
            <BigButton color="pink" onClick={() => setFase('autarquia_resultat')}>✅ Confirmar {jugadors.j2}</BigButton>
        </div></GameCard>
    );

    // AUTARKY RESULTS
    if (fase === 'autarquia_resultat') {
        const prodJ1 = calcProd(allocAut, 'j1');
        const prodJ2 = calcProd(allocAut, 'j2');
        const satJ1 = satisfaccio(prodJ1.blat, prodJ1.acer);
        const satJ2 = satisfaccio(prodJ2.blat, prodJ2.acer);
        return (
            <GameCard><div className="text-center space-y-4">
                <h3 className="text-xl font-black text-gray-700">📦 Resultat Autarquia</h3>
                <div className="grid grid-cols-2 gap-3">
                    <div className="bg-blue-50 rounded-2xl p-4">
                        <p className="font-bold">{jugadors.j1} 🦊</p>
                        <p className="text-lg">🌾 {prodJ1.blat} | ⚙️ {prodJ1.acer}</p>
                        <p className="text-2xl font-black text-blue-600">⭐ {satJ1}</p>
                    </div>
                    <div className="bg-pink-50 rounded-2xl p-4">
                        <p className="font-bold">{jugadors.j2} 🐰</p>
                        <p className="text-lg">🌾 {prodJ2.blat} | ⚙️ {prodJ2.acer}</p>
                        <p className="text-2xl font-black text-pink-600">⭐ {satJ2}</p>
                    </div>
                </div>
                <Mascot mood="thinking" message="Sense comerç, cada país ha de produir de tot... Però no és eficient! I si us especialitzàreu?" />
                <BigButton color="purple" onClick={() => setFase('comerc_j1')}>🚢 Fase 2: Comerç!</BigButton>
            </div></GameCard>
        );
    }

    // TRADE J1
    if (fase === 'comerc_j1') return (
        <GameCard><div className="space-y-4">
            <h3 className="text-xl font-black text-center text-purple-700">🚢 Fase 2: Producció per al Comerç</h3>
            <p className="text-center text-sm text-gray-500">Ara podreu comerciar! Especialitza't! {jugadors.j2}, no miris! 🙈</p>
            <TaulaEficiencia />
            <AllocUI jugador="j1" alloc={allocCom} target="com" color="bg-blue-50" emoji="🦊" />
            <BigButton color="blue" onClick={() => setFase('comerc_j2')}>✅ Confirmar {jugadors.j1}</BigButton>
        </div></GameCard>
    );

    // TRADE J2
    if (fase === 'comerc_j2') return (
        <GameCard><div className="space-y-4">
            <h3 className="text-xl font-black text-center text-purple-700">🚢 Fase 2: Producció per al Comerç</h3>
            <p className="text-center text-sm text-gray-500">Ara li toca a {jugadors.j2}!</p>
            <TaulaEficiencia />
            <AllocUI jugador="j2" alloc={allocCom} target="com" color="bg-pink-50" emoji="🐰" />
            <BigButton color="pink" onClick={() => setFase('negociacio')}>✅ Confirmar {jugadors.j2}</BigButton>
        </div></GameCard>
    );

    // NEGOTIATION
    if (fase === 'negociacio') {
        const prodJ1 = calcProd(allocCom, 'j1');
        const prodJ2 = calcProd(allocCom, 'j2');
        const postTradeJ1 = { blat: prodJ1.blat - oferta.blatJ1aJ2, acer: prodJ1.acer + oferta.acerJ2aJ1 };
        const postTradeJ2 = { blat: prodJ2.blat + oferta.blatJ1aJ2, acer: prodJ2.acer - oferta.acerJ2aJ1 };
        return (
            <GameCard><div className="space-y-4">
                <h3 className="text-xl font-black text-center text-purple-700">🤝 Negociació</h3>

                {/* Current production */}
                <div className="grid grid-cols-2 gap-3">
                    <div className="bg-blue-50 rounded-xl p-3 text-center">
                        <p className="font-bold text-sm">{jugadors.j1} 🦊 ha produït:</p>
                        <p className="font-black">🌾 {prodJ1.blat} | ⚙️ {prodJ1.acer}</p>
                    </div>
                    <div className="bg-pink-50 rounded-xl p-3 text-center">
                        <p className="font-bold text-sm">{jugadors.j2} 🐰 ha produït:</p>
                        <p className="font-black">🌾 {prodJ2.blat} | ⚙️ {prodJ2.acer}</p>
                    </div>
                </div>

                {/* Trade offer */}
                <div className="bg-purple-50 rounded-2xl p-4 space-y-3">
                    <p className="font-bold text-center text-purple-700">{jugadors.j1} proposa:</p>

                    <div className="flex items-center justify-center gap-3">
                        <span className="text-sm font-bold">{jugadors.j1} dóna 🌾</span>
                        <button onClick={() => ajustarOferta('blatJ1aJ2', -1)} disabled={oferta.blatJ1aJ2 <= 0}
                            className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">−</button>
                        <span className="w-10 text-center text-xl font-black text-amber-600">{oferta.blatJ1aJ2}</span>
                        <button onClick={() => ajustarOferta('blatJ1aJ2', 1)}
                            className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">+</button>
                    </div>

                    <div className="text-center text-2xl">🔄</div>

                    <div className="flex items-center justify-center gap-3">
                        <span className="text-sm font-bold">{jugadors.j2} dóna ⚙️</span>
                        <button onClick={() => ajustarOferta('acerJ2aJ1', -1)} disabled={oferta.acerJ2aJ1 <= 0}
                            className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">−</button>
                        <span className="w-10 text-center text-xl font-black text-gray-600">{oferta.acerJ2aJ1}</span>
                        <button onClick={() => ajustarOferta('acerJ2aJ1', 1)}
                            className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">+</button>
                    </div>
                </div>

                {/* Preview after trade */}
                <div className="bg-white rounded-2xl p-4 space-y-2">
                    <p className="font-bold text-sm text-center text-gray-500">Resultat si s'accepta:</p>
                    <div className="grid grid-cols-2 gap-3">
                        <div className="text-center">
                            <p className="font-bold text-sm text-blue-600">{jugadors.j1} 🦊</p>
                            <p className={`font-black ${postTradeJ1.blat < 0 ? 'text-red-600' : ''}`}>🌾 {postTradeJ1.blat}</p>
                            <p className="font-black">⚙️ {postTradeJ1.acer}</p>
                        </div>
                        <div className="text-center">
                            <p className="font-bold text-sm text-pink-600">{jugadors.j2} 🐰</p>
                            <p className="font-black">🌾 {postTradeJ2.blat}</p>
                            <p className={`font-black ${postTradeJ2.acer < 0 ? 'text-red-600' : ''}`}>⚙️ {postTradeJ2.acer}</p>
                        </div>
                    </div>
                </div>

                <p className="text-center font-bold text-gray-600">{jugadors.j2}, acceptes l'acord?</p>
                <div className="grid grid-cols-2 gap-3">
                    <BigButton color="green" onClick={() => resoldreComerc(true)}>✅ Acceptar</BigButton>
                    <BigButton color="red" onClick={() => resoldreComerc(false)}>❌ Rebutjar</BigButton>
                </div>
            </div></GameCard>
        );
    }

    // FINAL RESULTS
    if (fase === 'resultat') {
        const prodAutJ1 = calcProd(allocAut, 'j1');
        const prodAutJ2 = calcProd(allocAut, 'j2');
        const prodComJ1 = calcProd(allocCom, 'j1');
        const prodComJ2 = calcProd(allocCom, 'j2');

        const satAutJ1 = satisfaccio(prodAutJ1.blat, prodAutJ1.acer);
        const satAutJ2 = satisfaccio(prodAutJ2.blat, prodAutJ2.acer);

        let finalJ1, finalJ2, satComJ1, satComJ2;
        if (tradeAccepted) {
            finalJ1 = { blat: prodComJ1.blat - oferta.blatJ1aJ2, acer: prodComJ1.acer + oferta.acerJ2aJ1 };
            finalJ2 = { blat: prodComJ2.blat + oferta.blatJ1aJ2, acer: prodComJ2.acer - oferta.acerJ2aJ1 };
        } else {
            finalJ1 = prodComJ1;
            finalJ2 = prodComJ2;
        }
        satComJ1 = satisfaccio(Math.max(0, finalJ1.blat), Math.max(0, finalJ1.acer));
        satComJ2 = satisfaccio(Math.max(0, finalJ2.blat), Math.max(0, finalJ2.acer));

        const milloraJ1 = satComJ1 - satAutJ1;
        const milloraJ2 = satComJ2 - satAutJ2;

        return (
            <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-4">
                <h3 className="text-2xl font-black text-purple-700">📊 Comparació Final</h3>

                {/* Side by side comparison */}
                <div className="space-y-3">
                    {/* J1 */}
                    <div className="bg-blue-50 rounded-2xl p-4">
                        <p className="font-bold text-blue-600 mb-2">{jugadors.j1} 🦊</p>
                        <div className="grid grid-cols-2 gap-2 text-sm">
                            <div className="bg-white rounded-xl p-2">
                                <p className="text-gray-500 text-xs">Autarquia</p>
                                <p>🌾 {prodAutJ1.blat} | ⚙️ {prodAutJ1.acer}</p>
                                <p className="font-black">⭐ {satAutJ1}</p>
                            </div>
                            <div className="bg-white rounded-xl p-2">
                                <p className="text-gray-500 text-xs">Amb comerç</p>
                                <p>🌾 {finalJ1.blat} | ⚙️ {finalJ1.acer}</p>
                                <p className="font-black">⭐ {satComJ1}</p>
                            </div>
                        </div>
                        <p className={`font-black mt-1 ${milloraJ1 > 0 ? 'text-green-600' : milloraJ1 < 0 ? 'text-red-600' : 'text-gray-500'}`}>
                            {milloraJ1 > 0 ? `📈 +${milloraJ1} punts!` : milloraJ1 < 0 ? `📉 ${milloraJ1} punts` : '= Igual'}
                        </p>
                    </div>

                    {/* J2 */}
                    <div className="bg-pink-50 rounded-2xl p-4">
                        <p className="font-bold text-pink-600 mb-2">{jugadors.j2} 🐰</p>
                        <div className="grid grid-cols-2 gap-2 text-sm">
                            <div className="bg-white rounded-xl p-2">
                                <p className="text-gray-500 text-xs">Autarquia</p>
                                <p>🌾 {prodAutJ2.blat} | ⚙️ {prodAutJ2.acer}</p>
                                <p className="font-black">⭐ {satAutJ2}</p>
                            </div>
                            <div className="bg-white rounded-xl p-2">
                                <p className="text-gray-500 text-xs">Amb comerç</p>
                                <p>🌾 {finalJ2.blat} | ⚙️ {finalJ2.acer}</p>
                                <p className="font-black">⭐ {satComJ2}</p>
                            </div>
                        </div>
                        <p className={`font-black mt-1 ${milloraJ2 > 0 ? 'text-green-600' : milloraJ2 < 0 ? 'text-red-600' : 'text-gray-500'}`}>
                            {milloraJ2 > 0 ? `📈 +${milloraJ2} punts!` : milloraJ2 < 0 ? `📉 ${milloraJ2} punts` : '= Igual'}
                        </p>
                    </div>
                </div>

                <LlicioEconomica
                    concepte="Avantatge Comparatiu i Comerç Internacional"
                    definicio="Un país hauria d'especialitzar-se en produir allò en què té menor COST D'OPORTUNITAT (no necessàriament en què és millor). Fins i tot si un país és millor en TOT (avantatge absolut), el comerç beneficia TOTS DOS si cadascú s'especialitza en el seu avantatge comparatiu."
                    autor="David Ricardo, 'Principis d'Economia Política' (1817)"
                    exemple="Portugal era millor que Anglaterra produint vi I draps. Però Ricardo va demostrar que si Portugal s'especialitza en vi i Anglaterra en draps, i comercien, TOTS DOS acaben amb més. Avui: la Xina fabrica electrònica, Espanya exporta oli d'oliva i turisme. Cadascú s'especialitza en el seu avantatge comparatiu."
                    sabiesQue={tradeAccepted
                        ? `Amb comerç, ${jugadors.j1} ha millorat ${milloraJ1 > 0 ? '+' + milloraJ1 : milloraJ1} punts i ${jugadors.j2} ha millorat ${milloraJ2 > 0 ? '+' + milloraJ2 : milloraJ2} punts. Això demostra el principi de Ricardo: el comerç NO és un joc de suma zero — pot crear riquesa per a TOTS DOS!`
                        : "Sense acord comercial, cadascú ha hagut de produir de tot sol (autarquia). Històricament, els països que s'han tancat al comerç (Corea del Nord, Cuba) han crescut molt menys que els que l'han abraçat (Corea del Sud, Xina des de 1978)."
                    }
                    reflexio="T'has especialitzat en allò on eres més eficient? Has vist com el comerç pot fer que TOTS DOS acabeu amb més? Pensa en el teu dia a dia: si cuines millor i el teu company neteja millor, no és més eficient repartir-vos les tasques?"
                />

                <BigButton color="gold" onClick={() => onEnd({ j1: satComJ1, j2: satComJ2 })}>🏆 Veure Guanyador</BigButton>
            </div></GameCard>
        );
    }

    return null;
};

// ============== LEADERBOARD ==============
const Leaderboard = ({ onClose }) => {
    const leaderboard = ScoreManager.getLeaderboard();
    return (
        <GameCard><div className="space-y-4">
            <div className="flex justify-between items-center">
                <h2 className="text-2xl font-black text-yellow-600">🏆 Rànquing</h2>
                <button onClick={onClose} className="text-gray-500 hover:text-gray-600 text-2xl">✕</button>
            </div>
            {leaderboard.length === 0 ? <p className="text-center text-gray-500 py-8">Encara no hi ha puntuacions!</p> : (
                <div className="space-y-2">{leaderboard.map((player, i) => (
                    <div key={player.name} className={`flex items-center gap-3 p-3 rounded-xl ${i === 0 ? 'bg-yellow-100 ring-2 ring-yellow-400' : i === 1 ? 'bg-gray-100' : i === 2 ? 'bg-orange-50' : 'bg-white'}`}>
                        <span className="text-2xl">{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`}</span>
                        <div className="flex-1"><p className="font-bold">{player.name}</p><p className="text-xs text-gray-500">{Object.keys(player.games || {}).length} jocs</p></div>
                        <span className="text-xl font-black text-yellow-600">⭐ {player.total}</span>
                    </div>
                ))}</div>
            )}
        </div></GameCard>
    );
};

// ============== APP PRINCIPAL ==============
function PlaygroundApp() {
    const [pantalla, setPantalla] = useState('menu');
    const [jocActual, setJocActual] = useState(null);
    const [jugadors, setJugadors] = useState({ j1: '', j2: '' });
    const [puntuacions, setPuntuacions] = useState({ j1: 0, j2: 0 });
    const [resultat, setResultat] = useState(null);
    const [difficulty, setDifficulty] = useState('easy');
    const [showLeaderboard, setShowLeaderboard] = useState(false);
    const [modeJugadors, setModeJugadors] = useState(null); // 1 or 2, for '1-2' games

    const JOCS = [
        { id: 'compartir', nom: '🤝 Compartir o Robar', desc: 'Teoria de Jocs', color: 'from-purple-400 to-purple-600', players: 2 },
        { id: 'ous', nom: '🥚 Ous i Cistells', desc: 'Diversificació', color: 'from-orange-400 to-orange-600', players: 2 },
        { id: 'arbre', nom: '🌳 Arbre de Monedes', desc: 'Interès Compost', color: 'from-green-400 to-green-600', players: 2 },
        { id: 'subhasta', nom: '🎪 La Subhasta', desc: 'Valoració', color: 'from-pink-400 to-pink-600', players: 2 },
        { id: 'comuns', nom: '🐟 Tragèdia dels Comuns', desc: 'Recursos Comuns', color: 'from-teal-400 to-cyan-600', players: 2 },
        { id: 'bombolla', nom: '🌷 La Bombolla', desc: 'Bombolles Especulatives', color: 'from-rose-400 to-red-600', players: '1-2' },
        { id: 'illa', nom: '🏝️ Illa de l\'Escassetat', desc: 'Cost d\'Oportunitat', color: 'from-amber-400 to-orange-600', players: 1 },
        { id: 'banquer', nom: '🏦 El Banquer', desc: 'Estalvi i Deute', color: 'from-emerald-400 to-emerald-600', players: 2 },
        { id: 'risc', nom: '🎲 Risc i Recompensa', desc: 'Probabilitats', color: 'from-indigo-400 to-indigo-600', players: 2 },
        { id: 'comers', nom: '🚢 Comerç Internacional', desc: 'Avantatge Comparatiu', color: 'from-blue-400 to-indigo-600', players: 2 },
    ];

    const getJocPlayers = (id) => { const j = JOCS.find(x => x.id === id); return j ? j.players : 2; };

    const iniciarJoc = (id) => { setJocActual(id); setPantalla('joc'); };

    const acabarJoc = (punts) => {
        setResultat(punts);
        const p2 = punts.j2 != null ? punts.j2 : 0;
        setPuntuacions(p => ({ j1: p.j1 + punts.j1, j2: p.j2 + p2 }));
        const joc = JOCS.find(j => j.id === jocActual);
        if (jugadors.j1) ScoreManager.saveScore(jugadors.j1, punts.j1, joc?.nom || jocActual);
        if (jugadors.j2) ScoreManager.saveScore(jugadors.j2, p2, joc?.nom || jocActual);
        setPantalla('resultat');
    };

    if (showLeaderboard) return <div className="min-h-screen p-4 flex items-center justify-center"><div className="max-w-md w-full"><Leaderboard onClose={() => setShowLeaderboard(false)} /></div></div>;

    if (pantalla === 'menu') return (
        <div className="min-h-screen p-4 md:p-8">
            <div className="max-w-4xl mx-auto space-y-6">
                <div className="text-center">
                    <h1 className="text-5xl font-black text-white drop-shadow-lg">🎮 Playground</h1>
                    <p className="text-xl text-white/90 font-bold mt-2">Aprèn Economia Jugant!</p>
                </div>
                <div className="flex justify-center gap-4 flex-wrap">
                    <button onClick={() => setShowLeaderboard(true)} className="px-4 py-2 bg-yellow-400 text-yellow-900 rounded-xl font-bold hover:bg-yellow-300 flex items-center gap-2">🏆 Rànquing</button>
                    <DifficultySelector difficulty={difficulty} setDifficulty={setDifficulty} />
                </div>
                <Mascot mood={difficulty === 'hard' ? 'thinking' : 'happy'} message={difficulty === 'hard' ? "Mode difícil! Prepara't! 🧠" : "Hola! Tria un joc per aprendre!"} />
                {jugadors.j1 && <div className="flex justify-center gap-4"><PlayerBadge name={jugadors.j1} score={puntuacions.j1} color="from-blue-400 to-blue-600" emoji="🦊" /><PlayerBadge name={jugadors.j2} score={puntuacions.j2} color="from-pink-400 to-pink-600" emoji="🐰" /></div>}
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    {JOCS.map(joc => (
                        <button key={joc.id} onClick={() => { playSound('pop'); setJocActual(joc.id); const pl = joc.players; if (pl === 1) { if (!jugadors.j1) { setModeJugadors(1); setPantalla('noms'); } else iniciarJoc(joc.id); } else if (pl === '1-2') { setModeJugadors(null); setPantalla('noms'); } else { if (!jugadors.j1) { setModeJugadors(2); setPantalla('noms'); } else iniciarJoc(joc.id); } }} className={`btn-game p-4 rounded-2xl bg-gradient-to-br ${joc.color} text-white text-left relative`}>
                            {difficulty === 'hard' && <span className="absolute top-1 right-1 text-xs bg-red-500 px-1 rounded">🔥</span>}
                            <p className="text-lg font-black leading-tight">{joc.nom}</p>
                            <p className="text-xs bg-white/20 inline-block px-2 py-1 rounded-full mt-1">{joc.players === 1 ? '👤' : joc.players === '1-2' ? '👤/👥' : '👥'} {joc.desc}</p>
                        </button>
                    ))}
                </div>
                <a href="./" className="block text-center px-6 py-3 bg-white/20 text-white font-bold rounded-xl hover:bg-white/30">🏠 Tornar</a>
            </div>
        </div>
    );

    if (pantalla === 'noms') {
        const jocPlayers = getJocPlayers(jocActual);
        const effectiveMode = modeJugadors || (jocPlayers === '1-2' ? null : jocPlayers);
        const needs2P = effectiveMode === 2;
        const needs1P = effectiveMode === 1;
        const canStart = needs1P ? jugadors.j1.trim() : needs2P ? (jugadors.j1.trim() && jugadors.j2.trim()) : (modeJugadors && jugadors.j1.trim() && (modeJugadors === 1 || jugadors.j2.trim()));
        return (
            <div className="min-h-screen p-4 flex items-center justify-center">
                <GameCard className="max-w-md w-full"><div className="text-center space-y-5">
                    <h2 className="text-2xl font-black">👋 Qui juga?</h2>
                    {jocPlayers === '1-2' && !modeJugadors && (
                        <div className="flex gap-3 justify-center">
                            <button onClick={() => setModeJugadors(1)} className="px-5 py-3 rounded-xl font-bold bg-gradient-to-r from-blue-400 to-blue-600 text-white">👤 1 Jugador</button>
                            <button onClick={() => setModeJugadors(2)} className="px-5 py-3 rounded-xl font-bold bg-gradient-to-r from-pink-400 to-pink-600 text-white">👥 2 Jugadors</button>
                        </div>
                    )}
                    {modeJugadors && (<div className="space-y-3">
                        <div className="flex items-center gap-3"><span className="text-3xl">🦊</span><input type="text" placeholder={modeJugadors === 1 ? 'El teu nom' : 'Jugador 1'} value={jugadors.j1} onChange={e => setJugadors(j => ({ ...j, j1: e.target.value }))} className="flex-1 px-4 py-3 text-lg rounded-xl border-2 border-blue-300 focus:border-blue-500 focus:outline-none" /></div>
                        {modeJugadors === 2 && <div className="flex items-center gap-3"><span className="text-3xl">🐰</span><input type="text" placeholder="Jugador 2" value={jugadors.j2} onChange={e => setJugadors(j => ({ ...j, j2: e.target.value }))} className="flex-1 px-4 py-3 text-lg rounded-xl border-2 border-pink-300 focus:border-pink-500 focus:outline-none" /></div>}
                    </div>)}
                    {modeJugadors && <BigButton color="green" onClick={() => { if (modeJugadors === 1) setJugadors(j => ({ ...j, j2: '' })); iniciarJoc(jocActual); }} disabled={!canStart}>🎮 Jugar!</BigButton>}
                    <button onClick={() => { setPantalla('menu'); setModeJugadors(null); }} className="text-gray-500 hover:text-gray-700">← Tornar</button>
                </div></GameCard>
            </div>
        );
    }

    if (pantalla === 'joc') return (
        <div className="min-h-screen p-4 flex items-center justify-center">
            <div className="max-w-xl w-full">
                {jocActual === 'compartir' && <JocCompartirRobar jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
                {jocActual === 'ous' && <JocOusCistells jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
                {jocActual === 'arbre' && <JocArbreMonedes jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
                {jocActual === 'subhasta' && <JocSubhasta jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
                {jocActual === 'comuns' && <JocComuns jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
                {jocActual === 'bombolla' && <JocBombolla jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} mode={modeJugadors} />}
                {jocActual === 'illa' && <JocIlla jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
                {jocActual === 'banquer' && <JocBanquer jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
                {jocActual === 'risc' && <JocRiscRecompensa jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
                {jocActual === 'comers' && <JocComers jugadors={jugadors} onEnd={acabarJoc} difficulty={difficulty} />}
            </div>
        </div>
    );

    if (pantalla === 'resultat' && resultat) {
        const is1P = resultat.j2 == null || !jugadors.j2;
        const guanyador = is1P ? null : resultat.j1 > resultat.j2 ? 'j1' : resultat.j2 > resultat.j1 ? 'j2' : null;
        return (
            <div className="min-h-screen p-4 flex items-center justify-center">
                <GameCard className="max-w-md w-full"><Confetti show={true} /><div className="text-center space-y-5">
                    <h2 className="text-3xl font-black">🏆 Resultat!</h2>
                    {is1P ? (
                        <><div className="text-7xl animate-bounce-slow">🦊</div><p className="text-2xl font-black text-yellow-600">{jugadors.j1}</p>
                        <div className="bg-yellow-100 ring-4 ring-yellow-400 rounded-2xl p-5"><p className="text-4xl font-black text-yellow-600">⭐ {resultat.j1}</p><p className="text-sm text-gray-500 mt-1">punts</p></div></>
                    ) : (
                        <>{guanyador ? <><div className="text-7xl animate-bounce-slow">{guanyador === 'j1' ? '🦊' : '🐰'}</div><p className="text-2xl font-black text-yellow-600">{jugadors[guanyador]} guanya!</p></> : <><div className="text-5xl">🤝</div><p className="text-2xl font-black text-purple-600">Empat!</p></>}
                        <div className="grid grid-cols-2 gap-4">
                            <div className={`p-4 rounded-2xl ${guanyador === 'j1' ? 'bg-yellow-100 ring-4 ring-yellow-400' : 'bg-blue-100'}`}><p className="text-3xl">🦊</p><p className="font-bold">{jugadors.j1}</p><p className="text-2xl font-black text-yellow-600">⭐ {resultat.j1}</p></div>
                            <div className={`p-4 rounded-2xl ${guanyador === 'j2' ? 'bg-yellow-100 ring-4 ring-yellow-400' : 'bg-pink-100'}`}><p className="text-3xl">🐰</p><p className="font-bold">{jugadors.j2}</p><p className="text-2xl font-black text-yellow-600">⭐ {resultat.j2}</p></div>
                        </div></>
                    )}
                    <div className="bg-green-100 rounded-xl p-3 text-sm"><p className="text-green-700">✅ Puntuacions guardades!</p></div>
                    <BigButton color="purple" onClick={() => { setPantalla('menu'); setJocActual(null); setResultat(null); }}>🎮 Més Jocs</BigButton>
                </div></GameCard>
            </div>
        );
    }
    return null;
}

ReactDOM.render(<><PlaygroundApp /><PdeHomeButton idioma={PdeLanguageStore.get()} /><PdeScrollToTop /></>, document.getElementById('root'));
    </script>
</body>
</html>
