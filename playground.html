    <div id="root"></div>
    <script type="text/babel">
const { useState } = React;

// ============== UTILITATS ==============
const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sounds = { pop: [523, 659, 784], win: [523, 659, 784, 1047], lose: [392, 330, 262], click: [800], coin: [1200, 1400] };
        (sounds[type] || [440]).forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.2);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.2);
        });
    } catch(e) { console.warn('PDE: Audio playback failed:', e.message || e); }
};

const ScoreManager = {
    getScores: () => { try { return JSON.parse(localStorage.getItem('playground_scores') || '{}'); } catch { return {}; }},
    saveScore: (name, points, game) => {
        const scores = ScoreManager.getScores();
        if (!scores[name]) scores[name] = { total: 0, games: {} };
        scores[name].total += points;
        scores[name].games[game] = (scores[name].games[game] || 0) + points;
        localStorage.setItem('playground_scores', JSON.stringify(scores));
    },
    getLeaderboard: () => Object.entries(ScoreManager.getScores()).map(([name, data]) => ({ name, ...data })).sort((a, b) => b.total - a.total).slice(0, 10)
};

const Confetti = ({ show }) => show ? (
    <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
        {[...Array(40)].map((_, i) => <div key={i} className="absolute text-2xl" style={{ left: `${Math.random() * 100}%`, top: '-50px', animation: `fall ${2 + Math.random() * 2}s linear ${Math.random() * 0.5}s forwards` }}>{['⭐', '🌟', '✨', '🎉', '💫', '🏆'][Math.floor(Math.random() * 6)]}</div>)}
    </div>
) : null;

// ============== COMPONENTS COMUNS ==============
const GameCard = ({ children, className = '' }) => <div className={`card-game p-5 md:p-8 ${className}`}>{children}</div>;

const BigButton = ({ onClick, children, color = 'blue', disabled = false }) => {
    const colors = { blue: 'from-blue-400 to-blue-600', green: 'from-green-400 to-green-600', red: 'from-red-400 to-red-600', yellow: 'from-yellow-400 to-orange-500', purple: 'from-purple-400 to-purple-600', pink: 'from-pink-400 to-pink-600', orange: 'from-orange-400 to-orange-600', gold: 'from-yellow-500 to-amber-600' };
    return <button onClick={() => { if (!disabled) { playSound('click'); onClick?.(); }}} disabled={disabled} className={`btn-game w-full px-6 py-4 rounded-2xl text-white font-black text-xl bg-gradient-to-b ${colors[color]} ${disabled ? 'opacity-50 cursor-not-allowed' : 'hover:brightness-110'}`}>{children}</button>;
};

const PlayerBadge = ({ name, score, color, isActive, emoji = '🎮' }) => (
    <div className={`flex items-center gap-2 px-3 py-2 rounded-xl transition-all ${isActive ? `bg-gradient-to-r ${color} text-white scale-105 shadow-lg` : 'bg-white/60 text-gray-700'}`}>
        <span className="text-2xl">{emoji}</span>
        <div><p className="font-bold text-sm leading-tight">{name}</p><p className={`text-xs ${isActive ? 'text-white/80' : 'text-gray-500'}`}>⭐ {score}</p></div>
    </div>
);

const Mascot = ({ mood = 'happy', message }) => {
    const faces = { happy: '😊', excited: '🤩', thinking: '🤔', sad: '😢', surprised: '😲', love: '🥰', smart: '🧐' };
    return <div className="flex items-center gap-4 bg-white/80 backdrop-blur rounded-2xl p-4 shadow-lg"><div className="text-5xl animate-bounce-slow">{faces[mood]}</div>{message && <p className="text-base md:text-lg font-bold text-gray-700 flex-1">{message}</p>}</div>;
};

const LlicioEconomica = ({ concepte, definicio, exemple, sabiesQue, reflexio, autor }) => (
    <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-5 text-left space-y-3 border-2 border-amber-200 shadow-inner">
        <div className="flex items-center gap-2 border-b border-amber-200 pb-2">
            <span className="text-2xl">📚</span>
            <h4 className="text-lg font-black text-amber-800">Lliçó Econòmica</h4>
        </div>
        <div className="bg-white rounded-xl p-3 border-l-4 border-amber-400">
            <p className="font-black text-amber-700 text-sm">🔑 Concepte clau: {concepte}</p>
            <p className="text-sm text-gray-700 mt-1 leading-relaxed">{definicio}</p>
            {autor && <p className="text-xs text-amber-600 mt-1 italic">— {autor}</p>}
        </div>
        {exemple && (
            <div className="bg-blue-50 rounded-xl p-3">
                <p className="font-bold text-blue-700 text-sm">🌍 Al món real:</p>
                <p className="text-sm text-gray-700 mt-1 leading-relaxed">{exemple}</p>
            </div>
        )}
        {sabiesQue && (
            <div className="bg-purple-50 rounded-xl p-3">
                <p className="font-bold text-purple-700 text-sm">💡 Sabies que...?</p>
                <p className="text-sm text-gray-700 mt-1 leading-relaxed">{sabiesQue}</p>
            </div>
        )}
        {reflexio && (
            <div className="bg-green-50 rounded-xl p-3">
                <p className="font-bold text-green-700 text-sm">🤔 Per reflexionar:</p>
                <p className="text-sm text-gray-700 mt-1 leading-relaxed">{reflexio}</p>
            </div>
        )}
    </div>
);

const DifficultySelector = ({ difficulty, setDifficulty }) => (
    <div className="flex gap-2 justify-center">
        <button onClick={() => setDifficulty('easy')} className={`px-4 py-2 rounded-xl font-bold transition-all ${difficulty === 'easy' ? 'bg-gradient-to-r from-green-400 to-green-600 text-white scale-105' : 'bg-white/50 text-gray-600'}`}>🌱 Fàcil</button>
        <button onClick={() => setDifficulty('hard')} className={`px-4 py-2 rounded-xl font-bold transition-all ${difficulty === 'hard' ? 'bg-gradient-to-r from-red-400 to-red-600 text-white scale-105' : 'bg-white/50 text-gray-600'}`}>🔥 Difícil</button>
    </div>
);

// ============== JOC 1: COMPARTIR O ROBAR ==============
const JocCompartirRobar = ({ jugadors, onEnd, difficulty }) => {
    const [fase, setFase] = useState('intro');
    const [eleccions, setEleccions] = useState({ j1: null, j2: null });
    const [punts, setPunts] = useState({ j1: 0, j2: 0 });
    const [ronda, setRonda] = useState(1);
    const [showConfetti, setShowConfetti] = useState(false);
    const TOTAL_RONDES = difficulty === 'hard' ? 8 : 5;
    const MATRIU = difficulty === 'hard' ? { cc: { j1: 5, j2: 5 }, cr: { j1: -2, j2: 12 }, rc: { j1: 12, j2: -2 }, rr: { j1: 1, j2: 1 } } : { cc: { j1: 6, j2: 6 }, cr: { j1: 0, j2: 10 }, rc: { j1: 10, j2: 0 }, rr: { j1: 2, j2: 2 } };

    const calcularResultat = (e1, e2) => {
        const key = (e1 === 'compartir' ? 'c' : 'r') + (e2 === 'compartir' ? 'c' : 'r');
        const msgs = { cc: '🎉 Tots dos compartiu!', cr: `😱 ${jugadors.j1} comparteix però ${jugadors.j2} roba!`, rc: `😱 ${jugadors.j2} comparteix però ${jugadors.j1} roba!`, rr: '😅 Tots dos robeu!' };
        return { ...MATRIU[key], msg: msgs[key] };
    };

    const ferEleccio = (jugador, eleccio) => {
        playSound('pop');
        const noves = { ...eleccions, [jugador]: eleccio };
        setEleccions(noves);
        if (jugador === 'j1') setFase('player2');
        else {
            const res = calcularResultat(noves.j1, noves.j2);
            setPunts(p => ({ j1: p.j1 + res.j1, j2: p.j2 + res.j2 }));
            setFase('resultat');
            if (res.j1 >= 5 && res.j2 >= 5) { playSound('win'); setShowConfetti(true); setTimeout(() => setShowConfetti(false), 2000); }
        }
    };

    const seguentRonda = () => {
        if (ronda >= TOTAL_RONDES) onEnd(punts);
        else { setRonda(r => r + 1); setEleccions({ j1: null, j2: null }); setFase('player1'); }
    };

    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-purple-600">🤝 Compartir o Robar?</h2>
            <Mascot mood="thinking" message="Confiareu l'un en l'altre?" />
            <div className={`rounded-2xl p-5 space-y-3 ${difficulty === 'hard' ? 'bg-red-100' : 'bg-purple-100'}`}>
                <p className="text-lg font-bold text-center">📜 Regles ({difficulty === 'hard' ? '🔥 Difícil' : '🌱 Fàcil'}):</p>
                <div className="space-y-2">
                    <div className="bg-white rounded-xl p-3 flex items-center gap-3"><span className="text-2xl">🤝🤝</span><span>Tots dos compartiu = <strong className="text-green-600">+{MATRIU.cc.j1} cadascú</strong></span></div>
                    <div className="bg-white rounded-xl p-3 flex items-center gap-3"><span className="text-2xl">🤝😈</span><span>Un comparteix, l'altre roba = <strong className="text-red-600">{MATRIU.cr.j1} / +{MATRIU.cr.j2}</strong></span></div>
                    <div className="bg-white rounded-xl p-3 flex items-center gap-3"><span className="text-2xl">😈😈</span><span>Tots dos robeu = <strong className="text-orange-600">+{MATRIU.rr.j1} cadascú</strong></span></div>
                </div>
                {difficulty === 'hard' && <div className="bg-red-200 rounded-xl p-3"><p className="text-red-700 font-bold text-sm">⚠️ Pots perdre punts! {TOTAL_RONDES} rondes!</p></div>}
            </div>
            <BigButton color="purple" onClick={() => setFase('player1')}>🎮 Començar!</BigButton>
        </div></GameCard>
    );

    if (fase === 'player1' || fase === 'player2') {
        const jugadorActual = fase === 'player1' ? 'j1' : 'j2';
        const emoji = fase === 'player1' ? '🦊' : '🐰';
        return (
            <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-5">
                <div className="flex justify-between items-center">
                    <PlayerBadge name={jugadors.j1} score={punts.j1} color="from-blue-400 to-blue-600" isActive={fase === 'player1'} emoji="🦊" />
                    <span className="text-lg font-black text-gray-500">Ronda {ronda}/{TOTAL_RONDES}</span>
                    <PlayerBadge name={jugadors.j2} score={punts.j2} color="from-pink-400 to-pink-600" isActive={fase === 'player2'} emoji="🐰" />
                </div>
                <div className="py-4"><div className="text-6xl mb-2">{emoji}</div><h3 className="text-2xl font-black text-gray-800">{jugadors[jugadorActual]}, tria!</h3><p className="text-gray-500">{fase === 'player1' ? `${jugadors.j2}, no miris! 🙈` : 'És el teu torn!'}</p></div>
                <div className="grid grid-cols-2 gap-4">
                    <button onClick={() => ferEleccio(jugadorActual, 'compartir')} className="btn-game p-6 rounded-2xl bg-gradient-to-b from-green-400 to-green-600 text-white"><span className="text-5xl block mb-2">🤝</span><span className="text-xl font-black">COMPARTIR</span></button>
                    <button onClick={() => ferEleccio(jugadorActual, 'robar')} className="btn-game p-6 rounded-2xl bg-gradient-to-b from-red-400 to-red-600 text-white"><span className="text-5xl block mb-2">😈</span><span className="text-xl font-black">ROBAR</span></button>
                </div>
            </div></GameCard>
        );
    }

    if (fase === 'resultat') {
        const res = calcularResultat(eleccions.j1, eleccions.j2);
        return (
            <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-5">
                <div className="flex justify-between items-center">
                    <PlayerBadge name={jugadors.j1} score={punts.j1} color="from-blue-400 to-blue-600" emoji="🦊" />
                    <span className="text-lg font-black text-gray-500">Ronda {ronda}/{TOTAL_RONDES}</span>
                    <PlayerBadge name={jugadors.j2} score={punts.j2} color="from-pink-400 to-pink-600" emoji="🐰" />
                </div>
                <h3 className="text-2xl font-black text-gray-800">Resultat!</h3>
                <div className="grid grid-cols-2 gap-4">
                    <div className={`p-5 rounded-2xl ${eleccions.j1 === 'compartir' ? 'bg-green-100' : 'bg-red-100'}`}><p className="font-bold">{jugadors.j1}</p><p className="text-4xl my-2">{eleccions.j1 === 'compartir' ? '🤝' : '😈'}</p><p className={`text-2xl font-black ${res.j1 >= 0 ? 'text-green-600' : 'text-red-600'}`}>{res.j1 >= 0 ? '+' : ''}{res.j1}</p></div>
                    <div className={`p-5 rounded-2xl ${eleccions.j2 === 'compartir' ? 'bg-green-100' : 'bg-red-100'}`}><p className="font-bold">{jugadors.j2}</p><p className="text-4xl my-2">{eleccions.j2 === 'compartir' ? '🤝' : '😈'}</p><p className={`text-2xl font-black ${res.j2 >= 0 ? 'text-green-600' : 'text-red-600'}`}>{res.j2 >= 0 ? '+' : ''}{res.j2}</p></div>
                </div>
                <Mascot mood={res.j1 >= 5 && res.j2 >= 5 ? 'love' : 'surprised'} message={res.msg} />
                {ronda >= TOTAL_RONDES && (
                    <LlicioEconomica
                        concepte="Dilema del Presoner / Teoria de Jocs"
                        definicio="En situacions d'interacció estratègica, cada jugador tria la millor resposta segons el que espera de l'altre. L'equilibri de Nash pot ser INEFICIENT: tots dos robant guanyeu menys que si tots dos compartísseu."
                        autor="John Nash, Premi Nobel d'Economia 1994"
                        exemple="Les guerres de preus entre Coca-Cola i Pepsi, la cursa armamentista durant la Guerra Freda, i els acords climàtics internacionals són dilemes del presoner reals: la cooperació beneficia a tots, però la temptació de 'robar' és massa gran."
                        sabiesQue="John Nash va patir esquizofrènia durant dècades. La seua vida es va retratar a la pel·lícula 'Una ment meravellosa' (2001). La seua teoria explica per què els càrtels (OPEP, per exemple) són tan inestables: sempre hi ha incentius per fer trampa."
                        reflexio="Si poguéreu parlar abans de triar, canviaria el resultat? Per què els acords de cooperació són tan difícils de mantenir al món real? Pensa en el canvi climàtic: tots els països guanyen cooperant, però cadascú té incentius per contaminar."
                    />
                )}
                <BigButton color={ronda >= TOTAL_RONDES ? 'yellow' : 'purple'} onClick={seguentRonda}>{ronda >= TOTAL_RONDES ? '🏆 Resultats Finals' : '➡️ Següent Ronda'}</BigButton>
            </div></GameCard>
        );
    }
    return null;
};

// ============== JOC 2: ELS OUS I ELS CISTELLS ==============
const JocOusCistells = ({ jugadors, onEnd, difficulty }) => {
    const NUM_OUS = difficulty === 'hard' ? 12 : 9;
    const NUM_CISTELLS = difficulty === 'hard' ? 4 : 3;
    const CISTELLS_CAUEN = difficulty === 'hard' ? 2 : 1;
    const [fase, setFase] = useState('intro');
    const [torn, setTorn] = useState('j1');
    const [distribucions, setDistribucions] = useState({ j1: Array(NUM_CISTELLS).fill(0), j2: Array(NUM_CISTELLS).fill(0) });
    const [ousRestants, setOusRestants] = useState(NUM_OUS);
    const [resultats, setResultats] = useState(null);
    const [showConfetti, setShowConfetti] = useState(false);
    const CISTELLS = difficulty === 'hard' ? ['🧺 Vermell', '🧺 Blau', '🧺 Groc', '🧺 Verd'] : ['🧺 Vermell', '🧺 Blau', '🧺 Groc'];
    const COLORS = difficulty === 'hard' ? ['bg-red-200', 'bg-blue-200', 'bg-yellow-200', 'bg-green-200'] : ['bg-red-200', 'bg-blue-200', 'bg-yellow-200'];

    const afegirOu = (c) => { if (ousRestants <= 0) return; playSound('pop'); const n = { ...distribucions }; n[torn][c]++; setDistribucions(n); setOusRestants(o => o - 1); };
    const treureOu = (c) => { if (distribucions[torn][c] <= 0) return; playSound('click'); const n = { ...distribucions }; n[torn][c]--; setDistribucions(n); setOusRestants(o => o + 1); };

    const confirmarDistribucio = () => {
        if (ousRestants > 0) return;
        playSound('coin');
        if (torn === 'j1') { setTorn('j2'); setOusRestants(NUM_OUS); }
        else {
            const indices = [...Array(NUM_CISTELLS).keys()];
            const cistellsCaiguts = [];
            for (let i = 0; i < CISTELLS_CAUEN; i++) { const idx = Math.floor(Math.random() * indices.length); cistellsCaiguts.push(indices.splice(idx, 1)[0]); }
            const puntsJ1 = distribucions.j1.reduce((sum, ous, i) => sum + (cistellsCaiguts.includes(i) ? 0 : ous), 0);
            const puntsJ2 = distribucions.j2.reduce((sum, ous, i) => sum + (cistellsCaiguts.includes(i) ? 0 : ous), 0);
            setResultats({ cistellsCaiguts, j1: puntsJ1, j2: puntsJ2 }); setFase('resultat'); playSound('win'); setShowConfetti(true);
        }
    };

    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-orange-600">🥚 Els Ous i els Cistells</h2>
            <Mascot mood="thinking" message="No posis tots els ous al mateix lloc!" />
            <div className={`rounded-2xl p-5 space-y-3 ${difficulty === 'hard' ? 'bg-red-100' : 'bg-orange-100'}`}>
                <p className="text-lg font-bold text-center">📜 Regles:</p>
                <div className="space-y-2"><p>🥚 Tens <strong>{NUM_OUS} ous</strong></p><p>🧺 Hi ha <strong>{NUM_CISTELLS} cistells</strong></p><p>💥 <strong>{CISTELLS_CAUEN} cistell{CISTELLS_CAUEN > 1 ? 's' : ''}</strong> caurà{CISTELLS_CAUEN > 1 ? 'n' : ''}!</p></div>
                <div className="bg-white rounded-xl p-3"><p className="text-orange-600 font-bold">💡 Diversifica!</p></div>

            <BigButton color="orange" onClick={() => setFase('joc')}>🎮 Començar!</BigButton>

    if (fase === 'joc') {

        return (
            <GameCard><div className="text-center space-y-4">
                <div className="flex justify-between items-center">
                    <PlayerBadge name={jugadors.j1} score={`${distribucions.j1.reduce((a,b)=>a+b,0)}/${NUM_OUS}`} color="from-blue-400 to-blue-600" isActive={torn === 'j1'} emoji="🦊" />
                    <div className="text-3xl font-black">🥚 {ousRestants}</div>
                    <PlayerBadge name={jugadors.j2} score={`${distribucions.j2.reduce((a,b)=>a+b,0)}/${NUM_OUS}`} color="from-pink-400 to-pink-600" isActive={torn === 'j2'} emoji="🐰" />
                </div>
                <h3 className="text-xl font-black">{jugadors[torn]}, reparteix!</h3>
                <div className={`grid gap-2 ${NUM_CISTELLS === 4 ? 'grid-cols-2' : 'grid-cols-3'}`}>
                    {CISTELLS.map((nom, i) => (
                        <div key={i} className={`${COLORS[i]} rounded-2xl p-3 space-y-2`}>
                            <p className="font-bold text-sm">{nom}</p>
                            <div className="text-2xl min-h-[40px] flex items-center justify-center flex-wrap">{[...Array(distActual[i])].map((_, j) => <span key={j} className="animate-pop">🥚</span>)}</div>
                            <div className="flex justify-center gap-2">
                                <button onClick={() => treureOu(i)} disabled={distActual[i] <= 0} className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">−</button>
                                <span className="w-8 h-8 flex items-center justify-center text-lg font-black">{distActual[i]}</span>
                                <button onClick={() => afegirOu(i)} disabled={ousRestants <= 0} className="w-8 h-8 rounded-full bg-white shadow-lg text-lg font-bold disabled:opacity-30">+</button>
                            </div>
                        </div>
                    ))}
                </div>
                <BigButton color="green" onClick={confirmarDistribucio} disabled={ousRestants > 0}>{ousRestants > 0 ? `Tens ${ousRestants} ous!` : '✅ Confirmar'}</BigButton>
            </div></GameCard>
        );
    }

    if (fase === 'resultat' && resultats) return (
        <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-4">
            <h3 className="text-2xl font-black">💥 {resultats.cistellsCaiguts.length > 1 ? 'Cistells caiguts!' : 'Un cistell ha caigut!'}</h3>
            <div className={`grid gap-2 ${NUM_CISTELLS === 4 ? 'grid-cols-2' : 'grid-cols-3'}`}>
                {CISTELLS.map((nom, i) => <div key={i} className={`${COLORS[i]} rounded-2xl p-3 ${resultats.cistellsCaiguts.includes(i) ? 'animate-shake opacity-50' : ''}`}><p className="font-bold text-sm">{nom}</p><div className="text-3xl py-2">{resultats.cistellsCaiguts.includes(i) ? '💔' : '✅'}</div></div>)}
            </div>
            <div className="grid grid-cols-2 gap-4">
                <div className="bg-blue-100 rounded-2xl p-4"><p className="font-bold">{jugadors.j1} 🦊</p><p className="text-3xl font-black text-green-600">🥚 {resultats.j1}</p></div>
                <div className="bg-pink-100 rounded-2xl p-4"><p className="font-bold">{jugadors.j2} 🐰</p><p className="text-3xl font-black text-green-600">🥚 {resultats.j2}</p></div>
            </div>
            <LlicioEconomica
                concepte="Diversificació / Teoria Moderna de Carteres"
                definicio="Repartir les inversions entre actius diferents redueix el risc sense sacrificar rendibilitat. Si un cistell cau, no ho perds tot. El risc d'una cartera diversificada és MENOR que la mitjana dels riscos individuals."
                autor="Harry Markowitz, Premi Nobel d'Economia 1990"
                exemple="Un fons indexat de l'S&P 500 conté 500 empreses. Si Apple cau un 30%, l'impacte total és mínim. Per contra, qui va posar tots els estalvis en accions de Lehman Brothers el 2008 ho va perdre TOT."
                sabiesQue="Markowitz va publicar la Teoria Moderna de Carteres el 1952 amb només 25 anys. Va demostrar matemàticament que 'no posar tots els ous al mateix cistell' és la millor estratègia. La diversificació és l'únic 'dinar gratis' en finances!"
                reflexio="Quants cistells has usat? La distribució uniforme (igual a cada cistell) sol ser la millor estratègia. Pensa en la teua vida: estudiar només una assignatura és com posar tots els ous en un cistell. Diversifica els teus coneixements!"
            />
            <BigButton color="yellow" onClick={() => onEnd(resultats)}>🏆 Veure Guanyador</BigButton>
        </div></GameCard>

    return null;
};

// ============== JOC 3: L'ARBRE DE MONEDES ==============
const JocArbreMonedes = ({ jugadors, onEnd, difficulty }) => {
    const MONEDES_INICIALS = difficulty === 'hard' ? 3 : 5;
    const TOTAL_RONDES = difficulty === 'hard' ? 8 : 6;
    const CREIXEMENT = difficulty === 'hard' ? 1.3 : 1.5;
    const [fase, setFase] = useState('intro');
    const [torn, setTorn] = useState('j1');
    const [arbres, setArbres] = useState({ j1: [], j2: [] });
    const [monedes, setMonedes] = useState({ j1: MONEDES_INICIALS, j2: MONEDES_INICIALS });
    const [ronda, setRonda] = useState(1);
    const [showConfetti, setShowConfetti] = useState(false);

    const calcularValor = (torns) => Math.floor(Math.pow(CREIXEMENT, torns));
    const plantarArbre = () => { if (monedes[torn] <= 0) return; playSound('pop'); setArbres(a => ({ ...a, [torn]: [...a[torn], { torns: 0 }] })); setMonedes(m => ({ ...m, [torn]: m[torn] - 1 })); };
    const collirArbre = (index) => { const arbre = arbres[torn][index]; if (arbre.torns < 1) return; playSound('coin'); const valor = calcularValor(arbre.torns); setArbres(a => ({ ...a, [torn]: a[torn].filter((_, i) => i !== index) })); setMonedes(m => ({ ...m, [torn]: m[torn] + valor })); };

    const passarTorn = () => {
        if (torn === 'j1') setTorn('j2');
        else {
            const nous = { j1: arbres.j1.map(a => ({ ...a, torns: a.torns + 1 })), j2: arbres.j2.map(a => ({ ...a, torns: a.torns + 1 })) };
            setArbres(nous);
            if (ronda >= TOTAL_RONDES) {
                let finalJ1 = monedes.j1, finalJ2 = monedes.j2;
                nous.j1.forEach(a => { finalJ1 += calcularValor(a.torns); });
                nous.j2.forEach(a => { finalJ2 += calcularValor(a.torns); });
                setMonedes({ j1: finalJ1, j2: finalJ2 }); setArbres({ j1: [], j2: [] }); setFase('resultat'); playSound('win'); setShowConfetti(true);
            } else { setRonda(r => r + 1); setTorn('j1'); }
        }
    };

    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-green-600">🌳 L'Arbre de Monedes</h2>
            <Mascot mood="excited" message="Les monedes creixen si les plantes!" />
            <div className={`rounded-2xl p-5 space-y-3 ${difficulty === 'hard' ? 'bg-red-100' : 'bg-green-100'}`}>
                <p className="text-lg font-bold text-center">📜 Regles:</p>
                <div className="space-y-2"><p>🪙 Comences amb <strong>{MONEDES_INICIALS} monedes</strong></p><p>🌱 Plantar costa 1 moneda</p><p>📈 Cada torn creix x{CREIXEMENT}</p><p>🌳 Cull quan vulguis!</p></div>
                <div className="bg-white rounded-xl p-3"><p className="text-green-600 font-bold">💡 INTERÈS COMPOST!</p></div>
            </div>
            <BigButton color="green" onClick={() => setFase('joc')}>🎮 Començar!</BigButton>
        </div></GameCard>
    );

    if (fase === 'joc') {
        const esJ1 = torn === 'j1';
        const icones = ['🌱', '🪴', '🌳', '🌲', '🎄', '🌴'];
        return (
            <GameCard><div className="space-y-4">
                <div className="flex justify-between items-center">
                    <PlayerBadge name={jugadors.j1} score={monedes.j1} color="from-blue-400 to-blue-600" isActive={esJ1} emoji="🦊" />
                    <div className="text-center"><p className="text-xs text-gray-500">Ronda</p><p className="text-xl font-black">{ronda}/{TOTAL_RONDES}</p></div>
                    <PlayerBadge name={jugadors.j2} score={monedes.j2} color="from-pink-400 to-pink-600" isActive={!esJ1} emoji="🐰" />
                </div>
                <h3 className="text-xl font-black text-center">Torn de {jugadors[torn]}</h3>
                {['j1', 'j2'].map(j => (
                    <div key={j} className={`p-3 rounded-2xl ${(j === 'j1' ? esJ1 : !esJ1) ? (j === 'j1' ? 'bg-blue-50 ring-2 ring-blue-400' : 'bg-pink-50 ring-2 ring-pink-400') : 'bg-gray-50'}`}>
                        <p className="font-bold text-sm mb-2">{jugadors[j]} {j === 'j1' ? '🦊' : '🐰'} (🪙{monedes[j]})</p>
                        <div className="flex flex-wrap gap-2 min-h-[60px]">
                            {arbres[j].map((a, i) => (
                                <div key={i} onClick={() => torn === j && a.torns >= 1 && collirArbre(i)} className={`p-2 rounded-xl transition-all ${torn === j && a.torns >= 1 ? 'bg-green-100 cursor-pointer hover:bg-green-200' : 'bg-gray-100'}`}>
                                    <div className="text-3xl animate-float">{icones[Math.min(a.torns, 5)]}</div>
                                    <p className="text-sm font-bold text-yellow-600">🪙{calcularValor(a.torns)}</p>
                                </div>
                            ))}
                            {torn === j && monedes[j] > 0 && <button onClick={plantarArbre} className="p-2 rounded-xl bg-green-200 hover:bg-green-300"><span className="text-2xl">➕🌱</span></button>}
                        </div>
                    </div>
                ))}
                <BigButton color={esJ1 ? 'blue' : 'pink'} onClick={passarTorn}>✅ Acabar Torn</BigButton>
            </div></GameCard>
        );
    }

    if (fase === 'resultat') return (
        <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-5">
            <h3 className="text-2xl font-black">🌳 Collita Final!</h3>
            <div className="grid grid-cols-2 gap-4">
                <div className="bg-blue-100 rounded-2xl p-5"><p className="font-bold">{jugadors.j1} 🦊</p><p className="text-4xl font-black text-yellow-600 mt-2">🪙 {monedes.j1}</p></div>
                <div className="bg-pink-100 rounded-2xl p-5"><p className="font-bold">{jugadors.j2} 🐰</p><p className="text-4xl font-black text-yellow-600 mt-2">🪙 {monedes.j2}</p></div>
            </div>
            <LlicioEconomica
                concepte="Interès Compost i la Regla del 72"
                definicio="L'interès compost fa que els guanys generen nous guanys. Els arbres que has plantat aviat eren xicotets, però els que has deixat créixer s'han fet enormes. La REGLA DEL 72: divideix 72 entre el tipus d'interès i obtindràs els anys per duplicar el capital (72 ÷ 8% = 9 anys)."
                autor="Atribuït a Albert Einstein: 'L'interès compost és la força més poderosa de l'univers'"
                exemple="1.000€ al 7% anual: 2.000€ en 10 anys → 4.000€ en 20 → 8.000€ en 30 → 16.000€ en 40 anys. Qui comença a invertir als 20 amb 100€/mes tindrà 500.000€ als 65. Qui comença als 40 necessitarà invertir 400€/mes per aconseguir el mateix."
                sabiesQue="Warren Buffett, l'inversor més ric del món, va fer el 99% de la seua fortuna després dels 50 anys. El secret? Va començar a invertir als 11 anys i mai va parar. El temps és el millor amic de l'interès compost."
                reflexio="Què ha passat amb les monedes dels arbres que has collit massa aviat? I amb les que has deixat créixer? La paciència és una virtut financera. Quin és el cost de ESPERAR per començar a estalviar?"
            />
            <BigButton color="yellow" onClick={() => onEnd(monedes)}>🏆 Veure Guanyador</BigButton>
        </div></GameCard>
    );
    return null;
};

// ============== JOC 4: LA SUBHASTA ==============
const JocSubhasta = ({ jugadors, onEnd, difficulty }) => {
    const MONEDES_INICIALS = difficulty === 'hard' ? 15 : 20;
    const TOTAL_RONDES = difficulty === 'hard' ? 6 : 4;
    const [fase, setFase] = useState('intro');
    const [monedes, setMonedes] = useState({ j1: MONEDES_INICIALS, j2: MONEDES_INICIALS });
    const [oferta, setOferta] = useState(0);
    const [ultimOfertant, setUltimOfertant] = useState(null);
    const [premi, setPremi] = useState(null);
    const [ronda, setRonda] = useState(1);
    const [guanys, setGuanys] = useState({ j1: 0, j2: 0 });
    const [showConfetti, setShowConfetti] = useState(false);
    const PREMIS = [{ nom: 'Cofre', emoji: '🎁', valor: 8 }, { nom: 'Gelat', emoji: '🍦', valor: 5 }, { nom: 'Joguet', emoji: '🎮', valor: 12 }, { nom: 'Pilota', emoji: '⚽', valor: 10 }, { nom: 'Ou', emoji: '🥚', valor: 4 }, { nom: 'Corona', emoji: '👑', valor: 15 }];

    const iniciarRonda = () => { const p = { ...PREMIS[Math.floor(Math.random() * PREMIS.length)] }; if (difficulty === 'hard') p.valor = Math.floor(Math.random() * 12) + 3; setPremi(p); setOferta(0); setUltimOfertant(null); setFase('subhasta'); };
    const ferOferta = (jugador, quantitat) => { if (monedes[jugador] < quantitat) return; playSound('coin'); setOferta(quantitat); setUltimOfertant(jugador); };
    const passar = (jugador) => { if (!ultimOfertant || ultimOfertant === jugador) return; playSound('win'); setShowConfetti(true); setTimeout(() => setShowConfetti(false), 1500); setMonedes(m => ({ ...m, [ultimOfertant]: m[ultimOfertant] - oferta })); setGuanys(g => ({ ...g, [ultimOfertant]: g[ultimOfertant] + premi.valor })); setFase('resultatRonda'); };

    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-pink-600">🎪 La Subhasta!</h2>
            <Mascot mood="excited" message="Qui ofereix més?" />
            <div className={`rounded-2xl p-5 space-y-3 ${difficulty === 'hard' ? 'bg-red-100' : 'bg-pink-100'}`}>
                <p className="text-lg font-bold text-center">📜 Regles:</p>
                <div className="space-y-2"><p>🪙 Teniu <strong>{MONEDES_INICIALS} monedes</strong></p><p>🎁 Apareix un premi (valor {difficulty === 'hard' ? 'ALEATORI!' : 'secret!'})</p><p>💰 Feu ofertes!</p><p>✋ Si passes, l'altre guanya</p></div>
                <div className="bg-white rounded-xl p-3"><p className="text-pink-600 font-bold">⚠️ No paguis massa!</p></div>
            </div>
            <BigButton color="pink" onClick={iniciarRonda}>🎮 Començar!</BigButton>
        </div></GameCard>
    );

    if (fase === 'subhasta' && premi) return (
        <GameCard><Confetti show={showConfetti} /><div className="space-y-4">
            <div className="flex justify-between items-center">
                <PlayerBadge name={jugadors.j1} score={monedes.j1} color="from-blue-400 to-blue-600" isActive={true} emoji="🦊" />
                <span className="font-bold text-gray-500">{ronda}/{TOTAL_RONDES}</span>
                <PlayerBadge name={jugadors.j2} score={monedes.j2} color="from-pink-400 to-pink-600" isActive={true} emoji="🐰" />
            </div>
            <div className="text-center bg-gradient-to-r from-yellow-200 to-orange-200 rounded-2xl p-5">
                <p className="font-bold text-orange-800">🎁 A subhastar:</p>
                <div className="text-6xl my-3 animate-bounce-slow">{premi.emoji}</div>
                <p className="text-xl font-black">{premi.nom}</p><p className="text-sm text-orange-600">Valor: ???</p>
            </div>
            <div className="text-center"><p className="text-gray-600">Oferta:</p><p className="text-4xl font-black text-yellow-600">{oferta > 0 ? `🪙 ${oferta}` : '—'}</p>{ultimOfertant && <p className="text-sm">per {jugadors[ultimOfertant]}</p>}</div>
            {['j1', 'j2'].map(j => (
                <div key={j} className={`${j === 'j1' ? 'bg-blue-50' : 'bg-pink-50'} rounded-xl p-3`}>
                    <p className={`font-bold ${j === 'j1' ? 'text-blue-600' : 'text-pink-600'} text-sm mb-2`}>{jugadors[j]} {j === 'j1' ? '🦊' : '🐰'}</p>
                    <div className="flex flex-wrap gap-2 justify-center">
                        {[1, 2, 3, 5].map(o => <button key={o} onClick={() => ferOferta(j, oferta + o)} disabled={monedes[j] < oferta + o} className={`px-3 py-2 rounded-lg font-bold ${monedes[j] >= oferta + o ? (j === 'j1' ? 'bg-blue-500' : 'bg-pink-500') + ' text-white' : 'bg-gray-200'}`}>+{o}</button>)}
                        <button onClick={() => passar(j)} disabled={ultimOfertant === j} className={`px-3 py-2 rounded-lg font-bold ${ultimOfertant !== j ? 'bg-red-500 text-white' : 'bg-gray-200'}`}>Passar</button>
                    </div>
                </div>
            ))}
        </div></GameCard>
    );

    if (fase === 'resultatRonda' && premi) {
        const diferencia = premi.valor - oferta;
        return (
            <GameCard><div className="text-center space-y-4">
                <h3 className="text-2xl font-black">{jugadors[ultimOfertant]} guanya!</h3>
                <div className="text-5xl animate-pop">{premi.emoji}</div>
                <div className="bg-yellow-100 rounded-2xl p-4">
                    <p>Pagat: <strong className="text-red-600">🪙 {oferta}</strong></p>
                    <p>Valor real: <strong className="text-green-600">🪙 {premi.valor}</strong></p>
                    <p className={`text-xl font-black mt-2 ${diferencia >= 0 ? 'text-green-600' : 'text-red-600'}`}>{diferencia >= 0 ? `🎉 Bona compra! (+${diferencia})` : `😅 Massa car! (${diferencia})`}</p>
                </div>
                {ronda >= TOTAL_RONDES && (
                    <LlicioEconomica
                        concepte="La Maledicció del Guanyador (Winner's Curse)"
                        definicio="En una subhasta, el guanyador sovint és qui MÉS ha sobreestimat el valor real del bé. Guanyar la subhasta pot ser una 'victòria pírrica': has pagat més del que val. La clau és conéixer el VALOR INTRÍNSEC abans de pujar."
                        autor="Richard Thaler, Premi Nobel d'Economia 2017 (Economia del Comportament)"
                        exemple="El 2000, les telecom europees van pagar 100.000 milions € per llicències 3G en subhasta — moltes van quasi fer fallida. Al futbol, fitxatges com Coutinho (160M€) o Hazard (115M€) demostren que pagar massa per un 'premi' no garanteix resultats."
                        sabiesQue="eBay va revolucionar les subhastes online. Estudis demostren que en subhastes, la gent paga de mitjana un 20% més del valor real per l'emoció de guanyar. El govern espanyol recapta milers de milions subhastant deute públic cada setmana."
                        reflexio="Has pagat més del valor real en alguna ronda? Per què puges quan saps que pots perdre diners? L'emoció de 'guanyar' ens fa irracionals. Quan compres alguna cosa, pagues el valor real o el valor emocional?"
                    />
                )}
                <BigButton color={ronda >= TOTAL_RONDES ? 'yellow' : 'pink'} onClick={() => { if (ronda >= TOTAL_RONDES) onEnd({ j1: monedes.j1 + guanys.j1, j2: monedes.j2 + guanys.j2 }); else { setRonda(r => r + 1); iniciarRonda(); } }}>{ronda >= TOTAL_RONDES ? '🏆 Resultats' : '➡️ Següent'}</BigButton>
            </div></GameCard>
        );
    }
    return null;
};

// ============== JOC NOU: TRAGÈDIA DELS COMUNS ==============

                <div className="relative flex flex-wrap justify-center gap-1 items-center">
                    {[...Array(shown)].map((_, i) => (
                        <span key={i} className={`text-2xl ${animating ? 'animate-pop' : ''}`}
                              style={{ animation: `float ${2 + (i % 3) * 0.5}s ease-in-out ${i * 0.1}s infinite` }}>
                            🐟
                        </span>
                    ))}
                    {peixos === 0 && <span className="text-4xl">💀</span>}
                </div>
                {peixos > 20 && <p className="text-center text-white/80 text-sm font-bold mt-1">+{peixos - 20} més</p>}
            </div>
        );
    };

    // Health bar component
    const BarraSalut = () => (
        <div className="space-y-1">
            <div className="flex justify-between text-sm font-bold text-gray-600">
                <span>🐟 Llac: {llac} peixos</span>
                <span>{salutLlac}%</span>
            </div>
            <div className={`w-full h-4 ${colorSalutBg} rounded-full overflow-hidden`}>
                <div className={`h-full ${colorSalut} rounded-full transition-all duration-700`}
                     style={{ width: `${Math.max(salutLlac, 0)}%` }} />
            </div>
        </div>
    );

    // Boat selector component
    const SelectorBarques = ({ value, onChange }) => (
        <div className="space-y-2">
            <p className="text-lg font-bold text-gray-700">Quantes barques envies?</p>
            <div className="flex justify-center gap-2 flex-wrap">
                {[...Array(MAX_BARQUES)].map((_, i) => {
                    const num = i + 1;
                    return (
                        <button key={num} onClick={() => { playSound('pop'); onChange(num); }}
                                className={`w-14 h-14 rounded-2xl text-2xl font-black transition-all ${
                                    value === num
                                        ? 'bg-gradient-to-b from-blue-400 to-blue-600 text-white scale-110 shadow-lg ring-4 ring-blue-300'
                                        : 'bg-white shadow-md hover:scale-105'
                                }`}>
                            {num}
                        </button>
                    );
                })}
            </div>
            <div className="flex justify-center gap-1">
                {[...Array(value)].map((_, i) => <span key={i} className="text-2xl animate-pop">🚣</span>)}
            </div>
        </div>
    );

    // Process round results
    const processarRonda = () => {
        const j1boats = eleccioJ1;
        const j2boats = eleccioJ2;
        const totalBarques = j1boats + j2boats;

        // Calculate proportional catch
        let pescaJ1 = Math.min(j1boats, Math.floor(llac * j1boats / totalBarques));
        let pescaJ2 = Math.min(j2boats, Math.floor(llac * j2boats / totalBarques));

        // Total catch can't exceed lake
        if (pescaJ1 + pescaJ2 > llac) {
            const ratio = llac / (pescaJ1 + pescaJ2);
            pescaJ1 = Math.floor(pescaJ1 * ratio);
            pescaJ2 = Math.floor(pescaJ2 * ratio);
        }

        // Lake after fishing
        const remaining = llac - (pescaJ1 + pescaJ2);

        // Regeneration
        let nouLlac = remaining + Math.floor(remaining * REGENERACIO);

        // Hard mode storms
        let stormDmg = 0;
        if (difficulty === 'hard' && Math.random() < 0.2) {
            stormDmg = 2 + Math.floor(Math.random() * 3);
            nouLlac = Math.max(0, nouLlac - stormDmg);
        }

        // Update scores
        const newPesca = { j1: pescaTotal.j1 + pescaJ1, j2: pescaTotal.j2 + pescaJ2 };
        setPescaTotal(newPesca);
        setLlac(nouLlac);
        setHistorial(h => [...h, nouLlac]);
        setTempesta(stormDmg > 0 ? stormDmg : null);

        // Determine mascot reaction
        let mascotMood, mascotMsg;
        if (nouLlac < 3) {
            mascotMood = 'sad';
            mascotMsg = "TRAGÈDIA! El llac s'ha buidat! No queden peixos per a ningú! 😱";
            playSound('lose');
            setCollapsed(true);
        } else if (j1boats <= 2 && j2boats <= 2) {
            mascotMood = 'love';
            mascotMsg = 'Pesca sostenible! El llac es regenera! 🌿';
            playSound('win');
        } else if (j1boats >= 4 || j2boats >= 4) {
            mascotMood = 'surprised';
            mascotMsg = 'Algú pesca massa... El llac pateix! ⚠️';
            playSound('lose');
        } else {
            mascotMood = 'thinking';
            mascotMsg = `El llac aguanta... de moment. Queden ${nouLlac} peixos.`;
            playSound('coin');
        }

        setResultatRonda({
            j1boats, j2boats, pescaJ1, pescaJ2, remaining,
            nouLlac, stormDmg, mascotMood, mascotMsg
        });
        setFase('resultat_ronda');
    };

    // Handle next round or end game
    const seguentRonda = () => {
        if (collapsed || ronda >= TOTAL_RONDES) {
            playSound('win');
            setShowConfetti(true);
            setFase('final');
        } else {
            setRonda(r => r + 1);
            setEleccioJ1(1);
            setEleccioJ2(1);
            setConfirmatJ1(false);
            setTempesta(null);
            setResultatRonda(null);
            setFase('player1');
        }
    };

    // ===== INTRO =====
    if (fase === 'intro') return (
        <GameCard><div className="text-center space-y-5">
            <h2 className="text-3xl font-black text-blue-600">🐟 Tragèdia dels Comuns</h2>
            <Mascot mood="thinking" message="Pescareu de manera sostenible... o destruireu el llac?" />
            <div className={`rounded-2xl p-5 space-y-3 ${difficulty === 'hard' ? 'bg-red-100' : 'bg-blue-100'}`}>
                <p className="text-lg font-bold text-center">📜 Regles ({difficulty === 'hard' ? '🔥 Difícil' : '🌱 Fàcil'}):</p>
                <div className="space-y-2">
                    <div className="bg-white rounded-xl p-3 flex items-center gap-3">
                        <span className="text-2xl">🐟</span>
                        <span>El llac comença amb <strong className="text-blue-600">{PEIXOS_INICIALS} peixos</strong></span>
                    </div>
                    <div className="bg-white rounded-xl p-3 flex items-center gap-3">
                        <span className="text-2xl">🚣</span>
                        <span>Cada ronda tries de <strong>1 a {MAX_BARQUES} barques</strong> (en secret!)</span>
                    </div>
                    <div className="bg-white rounded-xl p-3 flex items-center gap-3">
                        <span className="text-2xl">🌿</span>
                        <span>El llac es regenera un <strong className="text-green-600">{REGENERACIO * 100}%</strong> dels peixos restants</span>
                    </div>
                    <div className="bg-white rounded-xl p-3 flex items-center gap-3">
                        <span className="text-2xl">⏱️</span>
                        <span><strong>{TOTAL_RONDES} rondes</strong> o fins que el llac col·lapse!</span>
                    </div>
                    {difficulty === 'hard' && (
                        <div className="bg-red-200 rounded-xl p-3 flex items-center gap-3">
                            <span className="text-2xl">⛈️</span>
                            <span className="text-red-700 font-bold">Tempestes aleatòries poden matar peixos!</span>
                        </div>
                    )}
                </div>
            </div>
            <BigButton color="blue" onClick={() => setFase('player1')}>🎮 Començar!</BigButton>
        </div></GameCard>
    );

    // ===== PLAYER 1 =====
    if (fase === 'player1') return (
        <GameCard><div className="text-center space-y-4">
            <div className="flex justify-between items-center">
                <PlayerBadge name={jugadors.j1} score={pescaTotal.j1} color="from-blue-400 to-blue-600" isActive={true} emoji="🦊" />
                <span className="text-lg font-black text-gray-500">Ronda {ronda}/{TOTAL_RONDES}</span>
                <PlayerBadge name={jugadors.j2} score={pescaTotal.j2} color="from-pink-400 to-pink-600" isActive={false} emoji="🐰" />
            </div>
            <BarraSalut />
            <Llac peixos={llac} />
            <div className="bg-yellow-100 rounded-2xl p-3">
                <p className="text-yellow-700 font-bold">🙈 {jugadors.j2}, no miris!</p>
            </div>
            <div className="py-2">
                <div className="text-5xl mb-2">🦊</div>
                <h3 className="text-2xl font-black text-gray-800">{jugadors.j1}, quantes barques?</h3>
            </div>
            <SelectorBarques value={eleccioJ1} onChange={setEleccioJ1} />
            <BigButton color="blue" onClick={() => { setConfirmatJ1(true); setFase('player2'); }}>
                ✅ Confirmar {eleccioJ1} {eleccioJ1 === 1 ? 'barca' : 'barques'}
            </BigButton>
        </div></GameCard>
    );

    // ===== PLAYER 2 =====
    if (fase === 'player2') return (
        <GameCard><div className="text-center space-y-4">
            <div className="flex justify-between items-center">
                <PlayerBadge name={jugadors.j1} score={pescaTotal.j1} color="from-blue-400 to-blue-600" isActive={false} emoji="🦊" />
                <span className="text-lg font-black text-gray-500">Ronda {ronda}/{TOTAL_RONDES}</span>
                <PlayerBadge name={jugadors.j2} score={pescaTotal.j2} color="from-pink-400 to-pink-600" isActive={true} emoji="🐰" />
            </div>
            <BarraSalut />
            <Llac peixos={llac} />
            <div className="bg-green-100 rounded-2xl p-3">
                <p className="text-green-700 font-bold">✅ {jugadors.j1} ja ha triat!</p>
            </div>
            <div className="py-2">
                <div className="text-5xl mb-2">🐰</div>
                <h3 className="text-2xl font-black text-gray-800">{jugadors.j2}, quantes barques?</h3>
            </div>
            <SelectorBarques value={eleccioJ2} onChange={setEleccioJ2} />
            <BigButton color="pink" onClick={processarRonda}>
                ✅ Confirmar {eleccioJ2} {eleccioJ2 === 1 ? 'barca' : 'barques'}
            </BigButton>
        </div></GameCard>
    );

    // ===== ROUND RESULT =====
    if (fase === 'resultat_ronda' && resultatRonda) {
        const r = resultatRonda;
        return (
            <GameCard><div className="text-center space-y-4">
                <div className="flex justify-between items-center">
                    <PlayerBadge name={jugadors.j1} score={pescaTotal.j1} color="from-blue-400 to-blue-600" emoji="🦊" />
                    <span className="text-lg font-black text-gray-500">Ronda {ronda}/{TOTAL_RONDES}</span>
                    <PlayerBadge name={jugadors.j2} score={pescaTotal.j2} color="from-pink-400 to-pink-600" emoji="🐰" />
                </div>
                <h3 className="text-2xl font-black text-gray-800">Resultat de la ronda!</h3>
                <div className="grid grid-cols-2 gap-4">
                    <div className="bg-blue-50 rounded-2xl p-4 animate-slide-in">
                        <p className="font-bold text-gray-700">{jugadors.j1} 🦊</p>
                        <div className="flex justify-center gap-1 my-2">
                            {[...Array(r.j1boats)].map((_, i) => <span key={i} className="text-2xl">🚣</span>)}
                        </div>
                        <p className="text-2xl font-black text-green-600">🐟 +{r.pescaJ1}</p>
                    </div>
                    <div className="bg-pink-50 rounded-2xl p-4 animate-slide-in">
                        <p className="font-bold text-gray-700">{jugadors.j2} 🐰</p>
                        <div className="flex justify-center gap-1 my-2">
                            {[...Array(r.j2boats)].map((_, i) => <span key={i} className="text-2xl">🚣</span>)}
                        </div>
                        <p className="text-2xl font-black text-green-600">🐟 +{r.pescaJ2}</p>
                    </div>
                </div>
                <BarraSalut />
                <Llac peixos={llac} animating={true} />
                {r.stormDmg > 0 && (
                    <div className="bg-purple-100 rounded-2xl p-3 animate-shake">
                        <p className="text-purple-700 font-black text-lg">⛈️ TEMPESTA! -{r.stormDmg} peixos!</p>
                    </div>
                )}
                {collapsed && (
                    <div className="bg-red-200 rounded-2xl p-4 animate-shake">
                        <p className="text-red-700 font-black text-xl">💀 COL·LAPSE! El llac s'ha buidat!</p>
                    </div>
                )}
                <Mascot mood={r.mascotMood} message={r.mascotMsg} />
                <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-xs font-bold text-gray-500 mb-1">📊 Historial del llac:</p>
                    <p className="text-sm text-gray-600 font-mono">
                        {historial.map((h, i) => (
                            <span key={i}>
                                {i > 0 && ' → '}
                                <span className={h < 5 ? 'text-red-600 font-bold' : h < 10 ? 'text-yellow-600' : 'text-green-600'}>
                                    {h}
                                </span>
                            </span>
                        ))}
                    </p>
                </div>
                <BigButton
                    color={collapsed || ronda >= TOTAL_RONDES ? 'yellow' : 'blue'}
                    onClick={seguentRonda}>
                    {collapsed || ronda >= TOTAL_RONDES ? '🏆 Resultats Finals' : '➡️ Següent Ronda'}
                </BigButton>
            </div></GameCard>
        );
    }

    // ===== FINAL RESULTS =====
    if (fase === 'final') {
        const guanyador = pescaTotal.j1 > pescaTotal.j2 ? 'j1' : pescaTotal.j2 > pescaTotal.j1 ? 'j2' : null;
        return (
            <GameCard><Confetti show={showConfetti} /><div className="text-center space-y-5">
                <h2 className="text-3xl font-black text-blue-600">🏆 Resultats Finals</h2>
                {collapsed && (
                    <div className="bg-red-100 rounded-2xl p-4">
                        <p className="text-red-600 font-black text-xl">💀 El llac ha col·lapsat a la ronda {ronda}!</p>
                    </div>
                )}
                <div className="grid grid-cols-2 gap-4">
                    <div className={`rounded-2xl p-5 ${guanyador === 'j1' ? 'bg-yellow-100 ring-4 ring-yellow-400' : 'bg-blue-50'}`}>
                        <p className="text-4xl mb-2">🦊</p>
                        <p className="font-bold text-lg">{jugadors.j1}</p>
                        {guanyador === 'j1' && <p className="text-2xl">👑</p>}
                        <p className="text-3xl font-black text-green-600 mt-2">🐟 {pescaTotal.j1}</p>
                    </div>
                    <div className={`rounded-2xl p-5 ${guanyador === 'j2' ? 'bg-yellow-100 ring-4 ring-yellow-400' : 'bg-pink-50'}`}>
                        <p className="text-4xl mb-2">🐰</p>
                        <p className="font-bold text-lg">{jugadors.j2}</p>
                        {guanyador === 'j2' && <p className="text-2xl">👑</p>}
                        <p className="text-3xl font-black text-green-600 mt-2">🐟 {pescaTotal.j2}</p>
                    </div>
                </div>
                {!guanyador && <p className="text-xl font-black text-purple-600">🤝 Empat!</p>}
                <div className="bg-gray-50 rounded-2xl p-4">
                    <p className="text-sm font-bold text-gray-500 mb-2">📊 Evolució del llac:</p>
                    <div className="flex items-end justify-center gap-1 h-24">
                        {historial.map((h, i) => {
                            const height = Math.max(4, (h / PEIXOS_INICIALS) * 100);
                            const color = h < 3 ? 'bg-red-400' : h < PEIXOS_INICIALS * 0.3 ? 'bg-yellow-400' : h < PEIXOS_INICIALS * 0.6 ? 'bg-blue-400' : 'bg-green-400';
                            return (
                                <div key={i} className="flex flex-col items-center gap-1">
                                    <span className="text-[10px] font-bold text-gray-500">{h}</span>
                                    <div className={`w-5 ${color} rounded-t-md transition-all`}
                                         style={{ height: `${height}%` }} />
                                    <span className="text-[9px] text-gray-500">{i}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
                <LlicioEconomica
                    concepte="Tragèdia dels Comuns"
                    definicio="Quan un recurs és compartit i sense regulació, cada individu té incentius per explotar-lo al màxim, destruint-lo per a tots. L'interès individual racional porta al desastre col·lectiu. La solució: regulació (quotes), privatització, o cooperació comunitària."
                    autor="Garrett Hardin, 'The Tragedy of the Commons' (1968) / Elinor Ostrom, Nobel 2009"
                    exemple="La sobrepesca ha col·lapsat el 90% dels estocs de peix globals. El bacallà de Terranova, que va alimentar Europa durant segles, va col·lapsar el 1992 i encara no s'ha recuperat. El canvi climàtic és la tragèdia dels comuns a escala planetària: cada país contamina perquè el cost es reparteix."
                    sabiesQue="Elinor Ostrom (primera dona Nobel d'Economia, 2009) va demostrar que les comunitats locals SÍ poden gestionar béns comuns sense govern ni privatització. Va estudiar comunitats de pescadors, regants i boscos compartits que funcionen des de fa segles amb regles autogestionades."
                    reflexio={`El llac ha sobreviscut o ha col·lapsat? Heu pescat ${pescaTotal.j1 + pescaTotal.j2} peixos en total. Si haguéreu cooperat limitant-vos a 2 barques, el llac s'hauria regenerat i hauríeu pescat MÉS a llarg termini. Pensa en l'aigua, l'aire, els oceans: són béns comuns. Qui els protegeix?`}
                />
                <BigButton color="yellow" onClick={() => onEnd(pescaTotal)}>🏆 Veure Guanyador</BigButton>
            </div></GameCard>
        );
    }

    return null;
};

// ============== JOC NOU: LA BOMBOLLA ==============
const JocBombolla = ({ jugadors, onEnd, difficulty, mode }) => {
    // State
    const [fase, setFase] = useState('intro');
    const [ronda, setRonda] = useState(1);
    const [preu, setPreu] = useState(10);
    const [historialPreus, setHistorialPreus] = useState([10]);
    const [probCrash, setProbCrash] = useState(0.05);
    const [cash, setCash] = useState({ j1: 50, j2: 50 });
    const [tulipes, setTulipes] = useState({ j1: 0, j2: 0 });
    const [torn, setTorn] = useState('j1');
    const [missatge, setMissatge] = useState('');
    const [mascotMood, setMascotMood] = useState('happy');
    const [showConfetti, setShowConfetti] = useState(false);
    const [crashPreu, setCrashPreu] = useState(null);
    const [fakeWarning, setFakeWarning] = useState(false);
    const [animCrash, setAnimCrash] = useState(false);

    const isHard = difficulty === 'hard';
    const is1P = mode === 1;
    const nomJ1 = jugadors.j1 || 'Jugador 1';
    const nomJ2 = is1P ? 'El Mercat' : (jugadors.j2 || 'Jugador 2');

    // Tulip scale based on price (grows with price)
    const tulipScale = Math.min(2.5, 1.0 + (preu - 10) / 80);

    // Danger bar color
    const dangerColor = (prob) => {
        if (prob < 0.2) return 'bg-green-400';
        if (prob < 0.4) return 'bg-yellow-400';
        if (prob < 0.6) return 'bg-orange-400';
        return 'bg-red-500';
    };

    // Apply an action to cash/tulipes and return new values (pure function)
    const aplicarAccio = (c, t, jugador, accio, preuActual) => {
        const nc = { ...c };
        const nt = { ...t };
        if (accio === 'comprar' && nc[jugador] >= preuActual) {
            nc[jugador] -= preuActual;
            nt[jugador] += 1;
        } else if (accio === 'vendre' && nt[jugador] > 0) {
            nc[jugador] += nt[jugador] * preuActual;
            nt[jugador] = 0;
        }
        return { cash: nc, tulipes: nt };
    };

    // AI strategy for single player mode
    const aiDecision = () => {
        if (ronda <= 3 && cash.j2 >= preu) return 'comprar';
        if (ronda >= 4 && ronda <= 6) return 'mantindre';
        const threshold = isHard ? 0.65 : 0.50;
        if (probCrash > threshold && tulipes.j2 > 0) return 'vendre';
        if (tulipes.j2 > 0) return 'mantindre';
        if (cash.j2 >= preu) return 'comprar';
        return 'mantindre';
    };

    // Advance round: update price, prob, check crash
    const advanceRound = (newCash, newTulipes) => {
        const crashed = Math.random() < probCrash;

        if (crashed) {
            const cp = Math.ceil(preu * 0.2);
            setCrashPreu(cp);
            // Force-sell at crash price
            setCash({
                j1: newCash.j1 + newTulipes.j1 * cp,
                j2: newCash.j2 + newTulipes.j2 * cp
            });
            setTulipes({ j1: 0, j2: 0 });
            playSound('lose');
            setAnimCrash(true);
            setFase('crash');
        } else {
            // Price increases
            const pujada = isHard
                ? 1 + Math.random() * 0.5 + 0.1
                : 1 + Math.random() * 0.3 + 0.2;
            const nouPreu = Math.ceil(preu * pujada);

            if (nouPreu >= preu * 2) {
                setMascotMood('excited');
                setMissatge('El preu es duplica! La febre de les tulipes! 🌷🔥');
            } else {
                setMascotMood('happy');
                setMissatge(`Ronda ${ronda} completada. El preu puja a ${nouPreu}!`);
            }

            // Increase crash probability
            let novaProbCrash = isHard
                ? probCrash + 0.08 + Math.random() * 0.05
                : probCrash + 0.05 + Math.random() * 0.03;
            novaProbCrash = Math.min(0.95, novaProbCrash);

            // Fake warnings in hard mode
            if (isHard && Math.random() < 0.25 && probCrash > 0.15) {
                setFakeWarning(true);
                setTimeout(() => setFakeWarning(false), 2000);
            }

            setCash(newCash);
            setTulipes(newTulipes);
            setPreu(nouPreu);
            setHistorialPreus(prev => [...prev, nouPreu]);
            setProbCrash(novaProbCrash);
            setRonda(r => r + 1);
            setTorn('j1');
            setFase('joc');
        }
    };

    // Handle player action
    const handleAccio = (accio) => {
        playSound('pop');

        if (torn === 'j1') {
            // Apply J1 action
            const after1 = aplicarAccio(cash, tulipes, 'j1', accio, preu);

            if (is1P) {
                // AI acts immediately after J1
                const aiAcc = aiDecision();
                const afterBoth = aplicarAccio(after1.cash, after1.tulipes, 'j2', aiAcc, preu);

                // Brief pause then resolve round
                setCash(afterBoth.cash);
                setTulipes(afterBoth.tulipes);
                setTorn('resolucio');

                // Show what AI did
                const aiLabel = aiAcc === 'comprar' ? '🌷 Compra' : aiAcc === 'vendre' ? '💰 Ven tot' : '✋ Manté';
                setMissatge(`El Mercat decideix: ${aiLabel}`);
                setMascotMood('thinking');

                setTimeout(() => advanceRound(afterBoth.cash, afterBoth.tulipes), 800);
            } else {
                // 2P: save J1 state, pass phone to J2
                setCash(after1.cash);
                setTulipes(after1.tulipes);
                setTorn('j2');
                setFase('passPhone');
            }
        } else if (torn === 'j2') {
            // Apply J2 action
            const after2 = aplicarAccio(cash, tulipes, 'j2', accio, preu);
            setCash(after2.cash);
            setTulipes(after2.tulipes);
            setTorn('resolucio');

            setTimeout(() => advanceRound(after2.cash, after2.tulipes), 800);
        }
    };

    // Mini bar chart component
    const MiniChart = ({ preus }) => {
        const last8 = preus.slice(-8);
        const maxPreu = Math.max(...last8);
        return (
            <div className="flex items-end gap-1 h-20 bg-white/50 rounded-xl p-2">
                {last8.map((p, i) => {
                    const height = (p / maxPreu) * 100;
                    const color = i === last8.length - 1 ? 'bg-rose-500' : 'bg-rose-300';
                    return (
                        <div key={i} className="flex-1 flex flex-col items-center justify-end">

                        </div>
                    );
                })}
            </div>
        );
    };

    // Danger meter component
    const DangerMeter = () => {
        const pct = Math.min(probCrash * 100, 95);
        const barColor = dangerColor(probCrash);
        return (
            <div className="space-y-1">
                <div className="flex justify-between items-center">
                    <span className="text-sm font-bold text-gray-600">⚠️ Risc:</span>

                <div className="h-4 bg-gray-200 rounded-full overflow-hidden">
                    <div className={`h-full ${barColor} rounded-full transition-all duration-500`} style={{ width: `${pct}%` }} />
                </div>
            </div>
        );
    };

    // Portfolio display
    const Portfolio = ({ jugador, nom, emoji, color }) => {
        const valor = cash[jugador] + tulipes[jugador] * preu;
        return (
            <div className={`rounded-2xl p-3 ${color}`}>
                <p className="font-bold text-sm">{emoji} {nom}</p>
                <div className="text-xs mt-1 space-y-0.5">
                    <p>💵 {cash[jugador]}</p>
                    <p>🌷 {tulipes[jugador]} × {preu} = {tulipes[jugador] * preu}</p>
                </div>
                <p className="text-lg font-black text-green-700 mt-1">= {valor}</p>
            </div>
        );
    };

    // ===== INTRO =====
    if (fase === 'intro') return (
        <GameCard>
            <div className="text-center space-y-5">
                <h2 className="text-3xl font-black text-rose-600">🌷 La Bombolla</h2>
                <div className="text-6xl animate-bounce-slow">🌷</div>
                <Mascot mood="thinking" message="Sabies que al segle XVII els holandesos van pagar el preu d'una casa per una sola tulipa?" />
                <div className={`rounded-2xl p-5 space-y-3 text-left ${isHard ? 'bg-red-100' : 'bg-rose-100'}`}>
                    <p className="font-bold text-lg">📜 Regles:</p>
                    <ul className="space-y-2 text-sm">
                        <li>🌷 El preu de les tulipes puja cada ronda... fins que la bombolla esclata!</li>
                        <li>💰 Comences amb <strong>50 monedes</strong> i cap tulipa</li>
                        <li>🎯 Cada ronda pots: <strong>Comprar</strong> (1 tulipa), <strong>Mantindre</strong> o <strong>Vendre tot</strong></li>
                        <li>💥 Quan la bombolla esclati, el preu caurà un 80%!</li>
                        <li>🧠 L'objectiu: vendre abans del crash i acabar amb més diners!</li>
                    </ul>
                    {isHard && (
                        <div className="bg-red-200 rounded-xl p-3 mt-2">
                            <p className="font-bold text-red-700 text-sm">🔥 Mode Difícil: No veuràs el percentatge de risc! I atenció als falsos avisos de perill...</p>
                        </div>
                    )}

                <div className="flex justify-center gap-4">
                    <PlayerBadge name={nomJ1} score={50} color="from-blue-400 to-blue-600" isActive={true} emoji="🦊" />

                </div>
                <BigButton color="red" onClick={() => { playSound('coin'); setFase('joc'); }}>🌷 Començar!</BigButton>
            </div>
        </GameCard>
    );

    // ===== PASS PHONE (2P only) =====
    if (fase === 'passPhone') return (
        <GameCard>
            <div className="text-center space-y-5">
                <h3 className="text-2xl font-black text-gray-700">📱 Passa el mòbil!</h3>
                <div className="text-6xl animate-bounce-slow">🐰</div>
                <p className="text-lg font-bold text-pink-600">{nomJ2}, és el teu torn!</p>
                <p className="text-gray-500">{nomJ1} ja ha triat. No miris! 🙈</p>
                <BigButton color="pink" onClick={() => setFase('joc')}>👀 Estic preparat/da!</BigButton>
            </div>
        </GameCard>
    );

    // ===== MAIN GAME =====
    if (fase === 'joc') {
        const jugadorActual = torn === 'j1' ? nomJ1 : nomJ2;
        const potComprar = torn === 'j1' ? cash.j1 >= preu : cash.j2 >= preu;
        const teTulipes = torn === 'j1' ? tulipes.j1 > 0 : tulipes.j2 > 0;

        return (
            <GameCard>
                <div className="space-y-4">
                    {/* Header */}
                    <div className="flex justify-between items-center">
                        <span className="bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-bold text-sm">Ronda {ronda}</span>
                        <div className="flex gap-2">
                            <PlayerBadge name={nomJ1} score={`💵${cash.j1}`} color="from-blue-400 to-blue-600" isActive={torn === 'j1'} emoji="🦊" />
                            <PlayerBadge name={nomJ2} score={`💵${cash.j2}`} color={is1P ? "from-rose-400 to-rose-600" : "from-pink-400 to-pink-600"} isActive={torn === 'j2'} emoji={is1P ? "📈" : "🐰"} />
                        </div>
                    </div>

                    {/* Fake warning (hard mode only) */}
                    {fakeWarning && (
                        <div className="bg-red-100 border-2 border-red-400 rounded-xl p-3 text-center animate-shake">
                            <span className="text-2xl">⚠️</span>
                            <p className="font-black text-red-600">PERILL!</p>
                        </div>
                    )}

                    {/* Tulip price display */}
                    <div className="text-center bg-gradient-to-br from-rose-50 to-amber-50 rounded-2xl p-4">
                        <div className="text-6xl mb-2" style={{ transform: `scale(${tulipScale})`, transition: 'transform 0.5s ease' }}>🌷</div>
                        <p className="text-sm text-gray-500 mt-2">Preu actual</p>
                        <p className="text-4xl font-black text-rose-600">{preu} 💰</p>
                    </div>

                    {/* Price history chart */}
                    <MiniChart preus={historialPreus} />

                    {/* Danger meter */}
                    <DangerMeter />

                    {/* Portfolios */}
                    <div className="grid grid-cols-2 gap-2">
                        <Portfolio jugador="j1" nom={nomJ1} emoji="🦊" color="bg-blue-50" />
                        <Portfolio jugador="j2" nom={nomJ2} emoji={is1P ? "📈" : "🐰"} color={is1P ? "bg-rose-50" : "bg-pink-50"} />
                    </div>

                    {/* Mascot message */}
                    {missatge && <Mascot mood={mascotMood} message={missatge} />}

                    {/* Current player turn */}
                    <div className="text-center">
                        <h3 className="text-xl font-black text-gray-800">{jugadorActual}, què fas?</h3>
                    </div>

                    {/* Action buttons */}
                    <div className="grid grid-cols-3 gap-2">
                        <BigButton color="green" onClick={() => handleAccio('comprar')} disabled={!potComprar || torn === 'resolucio'}>
                            🌷 Comprar
                        </BigButton>
                        <BigButton color="yellow" onClick={() => handleAccio('mantindre')} disabled={torn === 'resolucio'}>
                            ✋ Mantindre
                        </BigButton>
                        <BigButton color="red" onClick={() => handleAccio('vendre')} disabled={!teTulipes || torn === 'resolucio'}>
                            💰 Vendre Tot
                        </BigButton>
                    </div>

                    {!potComprar && torn !== 'resolucio' && <p className="text-center text-xs text-gray-500">No tens prou diners per comprar ({preu} 💰)</p>}
                </div>
            </GameCard>
        );
    }

    // ===== CRASH =====
    if (fase === 'crash') {
        const preuFinal = crashPreu || Math.ceil(preu * 0.2);
        // At this point tulipes are already 0 (force-sold in advanceRound)
        // We show the crash info using the pre-crash state via historialPreus
        const preuAnterior = historialPreus[historialPreus.length - 1];

        return (
            <GameCard>
                <div className="text-center space-y-5">
                    <div className={`text-6xl ${animCrash ? 'animate-shake' : ''}`}>💥</div>
                    <h2 className="text-3xl font-black text-red-600">CRASH!</h2>
                    <p className="text-xl font-bold text-red-500">La bombolla ha esclatat!</p>

                    <div className="bg-red-100 rounded-2xl p-4 space-y-2">
                        <div className="flex justify-center items-center gap-4">
                            <div className="text-center">
                                <p className="text-sm text-gray-500">Preu abans</p>
                                <p className="text-2xl font-black text-gray-500 line-through">{preuAnterior} 💰</p>
                            </div>
                            <span className="text-3xl">➡️</span>
                            <div className="text-center">
                                <p className="text-sm text-gray-500">Preu ara</p>
                                <p className="text-2xl font-black text-red-600">{preuFinal} 💰</p>
                            </div>
                        </div>
                        <p className="text-sm text-red-600 font-bold">📉 Caiguda del {Math.round((1 - preuFinal / preuAnterior) * 100)}%!</p>
                    </div>

                    <Mascot mood="sad" message="CRASH! La bombolla ha esclatat! 💥" />

                    <div className="bg-amber-50 rounded-2xl p-3 text-sm text-gray-600">
                        <p>Les tulipes que quedaven s'han venut al preu de crash ({preuFinal} 💰).</p>
                    </div>

                    <BigButton color="red" onClick={() => { playSound('click'); setShowConfetti(true); setFase('resultat'); }}>📊 Veure Resultats</BigButton>
                </div>
            </GameCard>
        );
    }

    // ===== RESULTS =====
    if (fase === 'resultat') {
        const finalJ1 = cash.j1;
        const finalJ2 = cash.j2;
        const guanyador = finalJ1 > finalJ2 ? 'j1' : finalJ2 > finalJ1 ? 'j2' : 'empat';

        return (
            <GameCard>
                <Confetti show={showConfetti} />
                <div className="text-center space-y-5">
                    <h2 className="text-3xl font-black text-rose-600">📊 Resultats Finals</h2>

                    <div className="grid grid-cols-2 gap-3">
                        <div className={`rounded-2xl p-4 ${guanyador === 'j1' ? 'bg-yellow-100 ring-4 ring-yellow-400' : 'bg-blue-50'}`}>
                            <p className="text-3xl">🦊</p>
                            <p className="font-bold">{nomJ1}</p>
                            <p className="text-xs text-gray-500">Inici: 50 💰</p>
                            <p className="text-3xl font-black text-green-600">{finalJ1} 💰</p>
                            <p className={`text-sm font-bold ${finalJ1 >= 50 ? 'text-green-500' : 'text-red-500'}`}>
                                {finalJ1 >= 50 ? '+' : ''}{finalJ1 - 50} benefici
                            </p>
                            {guanyador === 'j1' && <p className="text-yellow-600 font-black mt-1">🏆 Guanyador!</p>}
                        </div>
                        <div className={`rounded-2xl p-4 ${guanyador === 'j2' ? 'bg-yellow-100 ring-4 ring-yellow-400' : is1P ? 'bg-rose-50' : 'bg-pink-50'}`}>
                            <p className="text-3xl">{is1P ? '📈' : '🐰'}</p>
                            <p className="font-bold">{nomJ2}</p>
                            <p className="text-xs text-gray-500">Inici: 50 💰</p>
                            <p className="text-3xl font-black text-green-600">{finalJ2} 💰</p>
                            <p className={`text-sm font-bold ${finalJ2 >= 50 ? 'text-green-500' : 'text-red-500'}`}>
                                {finalJ2 >= 50 ? '+' : ''}{finalJ2 - 50} benefici
                            </p>
                            {guanyador === 'j2' && <p className="text-yellow-600 font-black mt-1">🏆 Guanyador!</p>}
                        </div>
                    </div>

                    {guanyador === 'empat' && (
                        <p className="text-xl font-black text-purple-600">🤝 Empat!</p>
                    )}

                    <LlicioEconomica
                        concepte="Bombolles Especulatives i Efecte Ramat"
                        definicio="Una bombolla es forma quan el preu d'un actiu puja molt per sobre del seu valor real, impulsat per l'especulació i l'efecte ramat ('si tots compren, jo també'). Les 5 fases de Kindleberger: Desplaçament → Boom → Eufòria → Presa de beneficis → Pànic."
                        autor="Charles Kindleberger, 'Manias, Panics and Crashes' (1978) / Hyman Minsky"
                        exemple="Tulipmania (1637): una tulipa valia més que una casa a Amsterdam. Les .com (2000): empreses sense ingressos valien milers de milions. La immobiliària (2008): els pisos 'mai baixen'. Bitcoin (2017): de 20.000$ a 3.000$ en un any. El patró sempre es repeteix: eufòria → pànic."
                        sabiesQue="Durant la Tulipmania, un sol bulb de tulipa 'Semper Augustus' es va vendre per 10.000 florins — equivalent al preu de la millor casa del canal d'Amsterdam. Isaac Newton va perdre 20.000 lliures (milions actuals) en la bombolla dels Mars del Sud (1720) i va dir: 'Puc calcular el moviment dels astres, però no la bogeria humana.'"
                        reflexio="Has venut a temps o t'has quedat amb tulipes durant el crash? L'avarícia i la por de 'perdre's l'oportunitat' (FOMO) són les emocions que alimenten les bombolles. Com pots distingir una inversió real d'una bombolla?"
                    />

                    <BigButton color="gold" onClick={() => {
                        if (is1P) {
                            onEnd({ j1: finalJ1 });
                        } else {
                            onEnd({ j1: finalJ1, j2: finalJ2 });
                        }
                    }}>🏆 Veure Guanyador</BigButton>
                </div>
            </GameCard>
        );
    }

    return null;
};

// ============== JOC: L'ILLA DE L'ESCASSETAT (1 Player) ==============
const JocIlla = ({ jugadors, onEnd, difficulty }) => {
    const isHard = difficulty === 'hard';
    const HORES_DIA = 10;
    const TOTAL_DIES = 6;
    const FOOD_PER_HOUR = isHard ? 2 : 3;
    const SHELTER_PER_HOUR = isHard ? 1 : 2;
    const EXPLORE_PER_HOUR = isHard ? 4 : 5;
    const CONSUM_DIARI = 8;
    const DESGAST_DIARI = isHard ? 4 : 3;
    const TOOL_BOOST = isHard ? 0.10 : 0.15;

    const [fase, setFase] = useState('intro');
    const [dia, setDia] = useState(1);
    const [hores, setHores] = useState({ menjar: 0, refugi: 0, eines: 0, explorar: 0 });
    const [acumulat, setAcumulat] = useState({ menjar: 10, refugi: 5, eines: 0, explorar: 0 });
    const [multiplicador, setMultiplicador] = useState(1.0);
    const [showConfetti, setShowConfetti] = useState(false);
    const [eventMsg, setEventMsg] = useState(null);
    const [diaResultat, setDiaResultat] = useState(null);
    const [mortCausa, setMortCausa] = useState(null);

    const horesRestants = HORES_DIA - hores.menjar - hores.refugi - hores.eines - hores.explorar;

    // Adjust hours for an activity
    const ajustarHores = (activitat, delta) => {
        const nouVal = hores[activitat] + delta;
        if (nouVal < 0) return;
        const totalSense = HORES_DIA - hores.menjar - hores.refugi - hores.eines - hores.explorar + hores[activitat];
        if (nouVal > totalSense) return;
        playSound('pop');
        setHores(h => ({ ...h, [activitat]: nouVal }));
    };

    // Confirm day allocation
    const confirmarDia = () => {
        if (horesRestants !== 0) return;
        playSound('coin');

        // Calculate production
        const prodMenjar = Math.floor(hores.menjar * FOOD_PER_HOUR * multiplicador);
        const prodRefugi = Math.floor(hores.refugi * SHELTER_PER_HOUR * multiplicador);
        const prodExplorar = hores.explorar * EXPLORE_PER_HOUR;
        const boostNou = hores.eines * TOOL_BOOST;

        let nouMenjar = acumulat.menjar + prodMenjar - CONSUM_DIARI;
        let nouRefugi = acumulat.refugi + prodRefugi - DESGAST_DIARI;
        const nouExplorar = acumulat.explorar + prodExplorar;
        const nouMultiplicador = multiplicador + boostNou;

        // Random event for hard mode
        let event = null;
        if (isHard && Math.random() < 0.25) {
            if (Math.random() < 0.5) {
                event = '🌪️ Tempesta! Refugi -3';
                nouRefugi -= 3;
            } else {
                event = '🍇 Temporada de fruites! Menjar +5';
                nouMenjar += 5;
            }
        }

        const resultat = {
            prodMenjar, prodRefugi, prodExplorar, boostNou,
            nouMenjar, nouRefugi, nouExplorar, nouMultiplicador, event
        };

        setDiaResultat(resultat);
        setEventMsg(event);

        // Check death
        if (nouMenjar < 0) {
            setMortCausa('fam');
            setAcumulat(a => ({ ...a, menjar: nouMenjar, refugi: nouRefugi, explorar: nouExplorar }));
            setMultiplicador(nouMultiplicador);
            setFase('mort');
            playSound('lose');
        } else if (nouRefugi < 0) {
            setMortCausa('fred');
            setAcumulat(a => ({ ...a, menjar: nouMenjar, refugi: nouRefugi, explorar: nouExplorar }));
            setMultiplicador(nouMultiplicador);
            setFase('mort');
            playSound('lose');
        } else {
            setAcumulat({ menjar: nouMenjar, refugi: nouRefugi, eines: acumulat.eines + hores.eines, explorar: nouExplorar });
            setMultiplicador(nouMultiplicador);
            setFase('resultat_dia');
        }
    };

    // Advance to next day or final
    const seguentDia = () => {
        if (dia >= TOTAL_DIES) {
            setFase('final');
            playSound('win');
