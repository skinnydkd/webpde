<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresa - Gestió Empresarial Completa | PDE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./pde-shared.js"></script>
    <script src="./pde-components.js" type="text/babel"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; scrollbar-width: thin; scrollbar-color: #ec4899 #fdf2f8; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fdf2f8; }
        ::-webkit-scrollbar-thumb { background-color: #ec4899; border-radius: 3px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        .dropdown-content { display: none; }
        .dropdown:hover .dropdown-content { display: block; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-blue-50 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
const { useState, useMemo, useEffect } = React;

function EmpresaApp() {
    const [section, setSection] = useState('inicio');
    const [idioma, setIdioma] = useState(PdeLanguageStore.get());

    const t = (val, es, en) => idioma === 'val' ? val : idioma === 'es' ? es : en;

    // Components reutilitzables
    const Card = ({ children, className = "", title, icon }) => (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 hover:shadow-md transition-shadow ${className} animate-fade`}>
            {title && <div className="flex items-center gap-3 mb-5 pb-4 border-b border-slate-100"><span className="text-2xl">{icon}</span><h3 className="font-bold text-slate-800 text-lg">{title}</h3></div>}
            {children}
        </div>
    );
    
    const Slider = ({ label, value, onChange, min, max, step = 1, suffix = "" }) => (
        <div className="space-y-2">
            <div className="flex justify-between text-sm"><span className="text-slate-600 font-medium">{label}</span><span className="font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{typeof value === 'number' ? value.toLocaleString() : value}{suffix}</span></div>
            <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-500" />
        </div>
    );
    
    const Tabs = ({ tabs, active, onChange }) => (
        <div className="flex flex-wrap gap-1 p-1.5 bg-slate-100 rounded-xl">
            {tabs.map(tab => (
                <button key={tab.id} onClick={() => onChange(tab.id)} className={`flex-1 min-w-fit py-2.5 px-4 rounded-lg text-sm font-semibold transition-all ${active === tab.id ? 'bg-white shadow-sm text-blue-600' : 'text-slate-600 hover:text-slate-800 hover:bg-white/50'}`}>
                    {tab.label}
                </button>
            ))}
        </div>
    );
    
    const FormulaBox = ({ formula, desc }) => (
        <div className="my-4 p-5 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl border border-blue-100">
            <p className="text-center font-mono text-lg text-blue-800 font-semibold">{formula}</p>
            {desc && <p className="text-center text-sm text-blue-600 mt-2">{desc}</p>}
        </div>
    );
    
    const TheoryBlock = ({ title, children, color = "slate" }) => {
        const colors = { slate: "border-slate-300 bg-slate-50", blue: "border-blue-300 bg-blue-50", green: "border-green-300 bg-green-50", amber: "border-amber-300 bg-amber-50", pink: "border-pink-300 bg-pink-50", violet: "border-violet-300 bg-violet-50", red: "border-red-300 bg-red-50", cyan: "border-cyan-300 bg-cyan-50", emerald: "border-emerald-300 bg-emerald-50" };
        return (
            <div className={`border-l-4 ${colors[color]} p-5 rounded-r-xl my-4`}>
                {title && <h4 className="font-bold text-slate-800 mb-3 text-base">{title}</h4>}
                <div className="text-slate-700 text-sm leading-relaxed space-y-2">{children}</div>
            </div>
        );
    };

    // 🎯 COMPONENT: Per què és important?
    const WhyImportant = ({ children }) => (
        <div className="my-4 p-4 bg-gradient-to-r from-amber-50 to-yellow-50 rounded-xl border border-amber-200">
            <div className="flex items-start gap-3">
                <span className="text-2xl">🎯</span>
                <div>
                    <h4 className="font-bold text-amber-700 mb-1">{t("Per què t'importa això?", "¿Por qué te importa esto?", "Why does this matter to you?")}</h4>
                    <p className="text-sm text-amber-800">{children}</p>
                </div>
            </div>
        </div>
    );
    
    const ResultCard = ({ title, value, color = "gray", subtitle }) => {
        const colorClasses = { green: 'bg-green-50 border-green-200 text-green-700', red: 'bg-red-50 border-red-200 text-red-700', blue: 'bg-blue-50 border-blue-200 text-blue-700', amber: 'bg-amber-50 border-amber-200 text-amber-700', violet: 'bg-violet-50 border-violet-200 text-violet-700', gray: 'bg-slate-50 border-slate-200 text-slate-700' };
        return (
            <div className={`p-4 rounded-xl text-center border ${colorClasses[color]}`}>
                <p className="text-xs text-slate-500 mb-1 font-medium">{title}</p>
                <p className="text-xl font-black">{value}</p>
                {subtitle && <p className="text-xs mt-1 opacity-75">{subtitle}</p>}
            </div>
        );
    };

    const SectionTitle = ({ icon, title, subtitle }) => (
        <div className="mb-8">
            <div className="flex items-center gap-3 mb-2"><span className="text-3xl">{icon}</span><h1 className="text-3xl font-black text-slate-800">{title}</h1></div>
            {subtitle && <p className="text-slate-500 ml-12">{subtitle}</p>}
        </div>
    );

    // SECCIÓ INICI
    const Inicio = () => {
        const sections = [
            { id: 'comptabilitat', name: t('Comptabilitat', 'Contabilidad', 'Accounting'), icon: '📒', color: 'from-blue-500 to-indigo-500', desc: t('Balanç, PiG, cicle comptable', 'Balance, PyG, ciclo contable', 'Balance, P&L, accounting cycle') },
            { id: 'analisi', name: t('Anàlisi Financera', 'Análisis Financiero', 'Financial Analysis'), icon: '📊', color: 'from-green-500 to-emerald-500', desc: t('Ràtios, fons maniobra', 'Ratios, fondo maniobra', 'Ratios, working capital') },
            { id: 'costos', name: t('Costos i Punt Mort', 'Costes y Umbral', 'Costs & Break-even'), icon: '💰', color: 'from-amber-500 to-orange-500', desc: t('CF, CV, gràfiques de costos', 'CF, CV, gráficas de costes', 'FC, VC, cost graphs') },
            { id: 'inversio', name: t('Inversió', 'Inversión', 'Investment'), icon: '📈', color: 'from-violet-500 to-purple-500', desc: 'VAN, TIR, Payback' },
            { id: 'fiscalitat', name: t('Fiscalitat', 'Fiscalidad', 'Taxation'), icon: '🏛️', color: 'from-red-500 to-rose-500', desc: 'IS, IVA, IRPF' },
            { id: 'produccio', name: t('Producció', 'Producción', 'Production'), icon: '🏭', color: 'from-cyan-500 to-teal-500', desc: t('Productivitat, JIT, Lean', 'Productividad, JIT, Lean', 'Productivity, JIT, Lean') },
            { id: 'rrhh', name: t('Recursos Humans', 'Recursos Humanos', 'Human Resources'), icon: '👥', color: 'from-indigo-500 to-blue-500', desc: t('Motivació, lideratge', 'Motivación, liderazgo', 'Motivation, leadership') },
            { id: 'marketing', name: 'Marketing', icon: '📣', color: 'from-fuchsia-500 to-pink-500', desc: t('4Ps, BCG, cicle vida', '4Ps, BCG, ciclo vida', '4Ps, BCG, life cycle') },
            { id: 'estrategia', name: t('Estratègia', 'Estrategia', 'Strategy'), icon: '🎯', color: 'from-slate-600 to-slate-700', desc: t('DAFO editable, Canvas editable, Porter', 'DAFO editable, Canvas editable, Porter', 'Editable SWOT, Canvas, Porter') },
            { id: 'formes', name: t('Formes Jurídiques', 'Formas Jurídicas', 'Legal Forms'), icon: '⚖️', color: 'from-emerald-500 to-green-600', desc: t('SL, SA, cooperatives', 'SL, SA, cooperativas', 'LLC, Corp, cooperatives') },
            { id: 'financament', name: t('Finançament', 'Financiación', 'Financing'), icon: '🏦', color: 'from-sky-500 to-blue-500', desc: t('Propi vs aliè, préstecs', 'Propio vs ajeno, préstamos', 'Own vs external, loans') },
            { id: 'emprenedoria', name: t('Emprenedoria', 'Emprendimiento', 'Entrepreneurship'), icon: '🚀', color: 'from-orange-500 to-red-500', desc: t('Guia completa pas a pas', 'Guía completa paso a paso', 'Complete step-by-step guide') },
        ];
        
        return (
            <div className="space-y-8">
                <div className="text-center py-8 animate-fade">
                    <h1 className="text-4xl md:text-5xl font-black text-slate-800 mb-4">🏢 {t('Economia de l\'Empresa', 'Economía de la Empresa', 'Business Economics')}</h1>
                    <p className="text-lg text-slate-500 max-w-2xl mx-auto">{t('Tot el que necessites per entendre com funcionen les empreses: des de la comptabilitat fins a l\'emprenedoria.', 'Todo lo que necesitas para entender cómo funcionan las empresas.', 'Everything you need to understand how businesses work.')}</p>
                </div>
                
                <WhyImportant>
                    {t("Vius envoltat d'empreses: la botiga on compres, l'hospital on et curen, Spotify, Netflix, el bar de la cantonada. Entendre com funcionen et permet prendre millors decisions: com a consumidor, com a treballador, com a futur emprenedor. Si alguna vegada vols crear el teu propi negoci, o simplement votar amb criteri sobre polítiques econòmiques, necessites saber això.",
                       "Vives rodeado de empresas: la tienda donde compras, el hospital, Spotify, Netflix, el bar de la esquina. Entender cómo funcionan te permite tomar mejores decisiones: como consumidor, como trabajador, como futuro emprendedor.",
                       "You live surrounded by businesses: the store where you shop, the hospital, Spotify, Netflix, the corner bar. Understanding how they work helps you make better decisions: as a consumer, worker, or future entrepreneur.")}
                </WhyImportant>
                
                <div className="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    {sections.map(sec => (
                        <button key={sec.id} onClick={() => setSection(sec.id)} className={`p-5 rounded-xl bg-gradient-to-br ${sec.color} text-white text-left hover:scale-105 transition-transform shadow-lg`}>
                            <span className="text-3xl">{sec.icon}</span>
                            <h3 className="font-bold mt-2">{sec.name}</h3>
                            <p className="text-sm opacity-90 mt-1">{sec.desc}</p>
                        </button>
                    ))}
                </div>
            </div>
        );
    };

    // SECCIÓ COMPTABILITAT
    const Comptabilitat = () => {
        const [tab, setTab] = useState('teoria');
        
        return (
            <div className="space-y-6">
                <SectionTitle icon="📒" title={t('Comptabilitat', 'Contabilidad', 'Accounting')} subtitle={t('El llenguatge dels negocis', 'El lenguaje de los negocios', 'The language of business')} />
                
                <WhyImportant>
                    {t("La comptabilitat és com l'historial mèdic d'una empresa. Sense ella, no sabries si l'empresa està sana o malalta. Quan demanes un préstec, el banc mira els comptes. Quan vols invertir en una empresa, mires els comptes. Quan vols saber si et pagaran el sou, mires... els comptes. És la base de TOTES les decisions financeres.",
                       "La contabilidad es como el historial médico de una empresa. Sin ella, no sabrías si la empresa está sana o enferma. Cuando pides un préstamo, el banco mira las cuentas. Es la base de TODAS las decisiones financieras.",
                       "Accounting is like a company's medical record. Without it, you wouldn't know if the business is healthy or sick. It's the foundation of ALL financial decisions.")}
                </WhyImportant>
                
                <Tabs tabs={[
                    { id: 'teoria', label: t('📚 Conceptes', '📚 Conceptos', '📚 Concepts') },
                    { id: 'balans', label: t('📋 Balanç', '📋 Balance', '📋 Balance Sheet') },
                    { id: 'pig', label: t('📈 PyG', '📈 PyG', '📈 P&L') },
                ]} active={tab} onChange={setTab} />
                
                {tab === 'teoria' && (
                    <div className="space-y-6">
                        <Card title={t("L'Equació Fonamental", "La Ecuación Fundamental", "The Fundamental Equation")} icon="⚖️">
                            <FormulaBox formula="ACTIU = PASSIU + PATRIMONI NET" desc={t("Sempre en equilibri!", "¡Siempre en equilibrio!", "Always in balance!")} />
                            
                            <div className="grid md:grid-cols-3 gap-4 mt-6">
                                <TheoryBlock title={t("ACTIU (el que té)", "ACTIVO (lo que tiene)", "ASSETS (what it has)")} color="green">
                                    <p>{t("Tot el que l'empresa posseeix i li deu diners:", "Todo lo que la empresa posee:", "Everything the company owns:")}</p>
                                    <ul className="mt-2 space-y-1">
                                        <li>• {t("Diners en banc", "Dinero en banco", "Cash in bank")}</li>
                                        <li>• {t("Maquinària, vehicles", "Maquinaria, vehículos", "Machinery, vehicles")}</li>
                                        <li>• {t("Estoc de productes", "Stock de productos", "Product inventory")}</li>
                                        <li>• {t("Clients que ens deuen", "Clientes que nos deben", "Customers who owe us")}</li>
                                    </ul>
                                </TheoryBlock>
                                
                                <TheoryBlock title={t("PASSIU (el que deu)", "PASIVO (lo que debe)", "LIABILITIES (what it owes)")} color="red">
                                    <p>{t("Tot el que l'empresa deu a tercers:", "Todo lo que la empresa debe a terceros:", "Everything owed to others:")}</p>
                                    <ul className="mt-2 space-y-1">
                                        <li>• {t("Préstecs bancaris", "Préstamos bancarios", "Bank loans")}</li>
                                        <li>• {t("Proveïdors pendents", "Proveedores pendientes", "Pending suppliers")}</li>
                                        <li>• {t("Impostos per pagar", "Impuestos por pagar", "Taxes to pay")}</li>
                                    </ul>
                                </TheoryBlock>
                                
                                <TheoryBlock title={t("PATRIMONI NET", "PATRIMONIO NETO", "EQUITY")} color="blue">
                                    <p>{t("El valor real dels propietaris:", "El valor real de los propietarios:", "The owners' real value:")}</p>
                                    <ul className="mt-2 space-y-1">
                                        <li>• {t("Capital aportat", "Capital aportado", "Contributed capital")}</li>
                                        <li>• {t("Beneficis acumulats", "Beneficios acumulados", "Retained earnings")}</li>
                                        <li>• {t("Reserves", "Reservas", "Reserves")}</li>
                                    </ul>
                                </TheoryBlock>
                            </div>
                        </Card>
                        
                        <Card title={t("Actiu Corrent vs No Corrent", "Activo Corriente vs No Corriente", "Current vs Non-Current Assets")} icon="📦">
                            <div className="grid md:grid-cols-2 gap-6">
                                <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                                    <h4 className="font-bold text-emerald-700 mb-2">🔄 {t("Actiu Corrent", "Activo Corriente", "Current Assets")}</h4>
                                    <p className="text-sm text-slate-600 mb-2">{t("Es converteix en diners en MENYS d'1 any", "Se convierte en dinero en MENOS de 1 año", "Converts to cash in LESS than 1 year")}</p>
                                    <ul className="text-sm text-emerald-600 space-y-1">
                                        <li>• {t("Existències (estoc)", "Existencias (stock)", "Inventory (stock)")}</li>
                                        <li>• {t("Clients (realitzable)", "Clientes (realizable)", "Accounts receivable")}</li>
                                        <li>• {t("Bancs i caixa (disponible)", "Bancos y caja (disponible)", "Cash and banks")}</li>
                                    </ul>
                                </div>
                                <div className="p-4 bg-violet-50 rounded-xl border border-violet-200">
                                    <h4 className="font-bold text-violet-700 mb-2">🏗️ {t("Actiu No Corrent", "Activo No Corriente", "Non-Current Assets")}</h4>
                                    <p className="text-sm text-slate-600 mb-2">{t("Es queda a l'empresa MÉS d'1 any", "Se queda en la empresa MÁS de 1 año", "Stays in the company MORE than 1 year")}</p>
                                    <ul className="text-sm text-violet-600 space-y-1">
                                        <li>• {t("Terrenys i edificis", "Terrenos y edificios", "Land and buildings")}</li>
                                        <li>• {t("Maquinària", "Maquinaria", "Machinery")}</li>
                                        <li>• {t("Patents, marques (intangible)", "Patentes, marcas (intangible)", "Patents, brands (intangible)")}</li>
                                    </ul>
                                </div>
                            </div>
                        </Card>
                    </div>
                )}
                
                {tab === 'balans' && (
                    <Card title={t("Estructura del Balanç", "Estructura del Balance", "Balance Sheet Structure")} icon="📋">
                        <div className="grid md:grid-cols-2 gap-4">
                            <div className="space-y-3">
                                <h4 className="font-bold text-green-700 text-center py-2 bg-green-100 rounded-lg">{t("ACTIU (Inversions)", "ACTIVO (Inversiones)", "ASSETS (Investments)")}</h4>
                                <div className="p-3 bg-violet-50 rounded-lg border-l-4 border-violet-400">
                                    <p className="font-semibold text-violet-700">{t("Actiu No Corrent", "Activo No Corriente", "Non-Current Assets")}</p>
                                    <p className="text-xs text-slate-500">{t("Immovilitzat material, intangible, financer", "Inmovilizado material, intangible, financiero", "Fixed assets, intangible, financial")}</p>
                                </div>
                                <div className="p-3 bg-emerald-50 rounded-lg border-l-4 border-emerald-400">
                                    <p className="font-semibold text-emerald-700">{t("Actiu Corrent", "Activo Corriente", "Current Assets")}</p>
                                    <p className="text-xs text-slate-500">{t("Existències + Realitzable + Disponible", "Existencias + Realizable + Disponible", "Inventory + Receivables + Cash")}</p>
                                </div>
                            </div>
                            <div className="space-y-3">
                                <h4 className="font-bold text-red-700 text-center py-2 bg-red-100 rounded-lg">{t("PASSIU + PN (Finançament)", "PASIVO + PN (Financiación)", "LIABILITIES + EQUITY")}</h4>
                                <div className="p-3 bg-blue-50 rounded-lg border-l-4 border-blue-400">
                                    <p className="font-semibold text-blue-700">{t("Patrimoni Net", "Patrimonio Neto", "Equity")}</p>
                                    <p className="text-xs text-slate-500">{t("Capital + Reserves + Resultat", "Capital + Reservas + Resultado", "Capital + Reserves + Result")}</p>
                                </div>
                                <div className="p-3 bg-amber-50 rounded-lg border-l-4 border-amber-400">
                                    <p className="font-semibold text-amber-700">{t("Passiu No Corrent", "Pasivo No Corriente", "Non-Current Liabilities")}</p>
                                    <p className="text-xs text-slate-500">{t("Deutes a llarg termini (>1 any)", "Deudas a largo plazo (>1 año)", "Long-term debts (>1 year)")}</p>
                                </div>
                                <div className="p-3 bg-red-50 rounded-lg border-l-4 border-red-400">
                                    <p className="font-semibold text-red-700">{t("Passiu Corrent", "Pasivo Corriente", "Current Liabilities")}</p>
                                    <p className="text-xs text-slate-500">{t("Deutes a curt termini (<1 any)", "Deudas a corto plazo (<1 año)", "Short-term debts (<1 year)")}</p>
                                </div>
                            </div>
                        </div>
                    </Card>
                )}
                
                {tab === 'pig' && (
                    <Card title={t("Compte de Pèrdues i Guanys (PyG)", "Cuenta de Pérdidas y Ganancias", "Profit & Loss Statement")} icon="📈">
                        <WhyImportant>
                            {t("El balanç et diu COM ESTÀ l'empresa en un moment. El PyG et diu COM LI HA ANAT durant un període. És com la diferència entre fer-te una foto (balanç) i gravar un vídeo (PyG).",
                               "El balance te dice CÓMO ESTÁ la empresa en un momento. El PyG te dice CÓMO LE HA IDO durante un período.",
                               "The balance sheet tells you how the company IS at a moment. The P&L tells you how it's BEEN DOING over a period.")}
                        </WhyImportant>
                        
                        <div className="space-y-3 mt-4">
                            <div className="flex items-center gap-3 p-3 bg-green-100 rounded-lg">
                                <span className="text-xl">💰</span>
                                <div className="flex-1"><p className="font-semibold text-green-700">{t("Ingressos d'explotació", "Ingresos de explotación", "Operating revenue")}</p></div>
                                <span className="font-bold text-green-700">+</span>
                            </div>
                            <div className="flex items-center gap-3 p-3 bg-red-100 rounded-lg">
                                <span className="text-xl">📦</span>
                                <div className="flex-1"><p className="font-semibold text-red-700">{t("Despeses d'explotació", "Gastos de explotación", "Operating expenses")}</p></div>
                                <span className="font-bold text-red-700">−</span>
                            </div>
                            <div className="flex items-center gap-3 p-3 bg-blue-100 rounded-lg border-2 border-blue-300">
                                <span className="text-xl">📊</span>
                                <div className="flex-1"><p className="font-bold text-blue-700">{t("= Resultat d'explotació (BAII)", "= Resultado de explotación (BAII)", "= Operating result (EBIT)")}</p></div>
                                <span className="font-bold text-blue-700">=</span>
                            </div>
                            <div className="flex items-center gap-3 p-3 bg-amber-100 rounded-lg">
                                <span className="text-xl">🏦</span>
                                <div className="flex-1"><p className="font-semibold text-amber-700">{t("Resultat financer (interessos)", "Resultado financiero (intereses)", "Financial result (interest)")}</p></div>
                                <span className="font-bold text-amber-700">±</span>
                            </div>
                            <div className="flex items-center gap-3 p-3 bg-violet-100 rounded-lg border-2 border-violet-300">
                                <span className="text-xl">📈</span>
                                <div className="flex-1"><p className="font-bold text-violet-700">{t("= Resultat abans d'impostos (BAI)", "= Resultado antes de impuestos (BAI)", "= Result before taxes (EBT)")}</p></div>
                                <span className="font-bold text-violet-700">=</span>
                            </div>
                            <div className="flex items-center gap-3 p-3 bg-red-100 rounded-lg">
                                <span className="text-xl">🏛️</span>
                                <div className="flex-1"><p className="font-semibold text-red-700">{t("Impost sobre societats (25%)", "Impuesto sobre sociedades (25%)", "Corporate tax (25%)")}</p></div>
                                <span className="font-bold text-red-700">−</span>
                            </div>
                            <div className="flex items-center gap-3 p-3 bg-gradient-to-r from-green-200 to-emerald-200 rounded-lg border-2 border-green-400">
                                <span className="text-xl">🎉</span>

    // SECCIÓ COSTOS I PUNT MORT AMB GRÀFIQUES
    const CostosPuntMort = () => {
        const [tab, setTab] = useState('teoria');
        const [cf, setCF] = useState(50000);
        const [cv, setCV] = useState(30);
        const [preu, setPreu] = useState(80);
        const [q, setQ] = useState(1500);
        
        const calc = useMemo(() => {
            const mc = preu - cv;
            const qEq = mc > 0 ? cf / mc : 0;
            const it = preu * q;
            const ct = cf + cv * q;
            const benefici = it - ct;
            const margeSeguretat = q > 0 && qEq > 0 ? (((q - qEq) / q) * 100) : 0;
            return { mc, qEq: Math.round(qEq), it, ct, benefici, margeSeguretat: margeSeguretat.toFixed(1) };
        }, [cf, cv, preu, q]);

        // Component gràfica SVG
        const CostGraph = () => {
            const width = 500;
            const height = 300;
            const padding = 50;
            const maxQ = Math.max(calc.qEq * 2, q * 1.5, 2000);
            const maxY = Math.max(cf + cv * maxQ, preu * maxQ, 150000);
            
            const scaleX = (val) => padding + (val / maxQ) * (width - padding * 2);
            const scaleY = (val) => height - padding - (val / maxY) * (height - padding * 2);
            
            const cfLine = `M ${scaleX(0)} ${scaleY(cf)} L ${scaleX(maxQ)} ${scaleY(cf)}`;
            const ctLine = `M ${scaleX(0)} ${scaleY(cf)} L ${scaleX(maxQ)} ${scaleY(cf + cv * maxQ)}`;
            const itLine = `M ${scaleX(0)} ${scaleY(0)} L ${scaleX(maxQ)} ${scaleY(preu * maxQ)}`;
            
            return (
                <svg viewBox={`0 0 ${width} ${height}`} className="w-full max-w-lg mx-auto">
                    {/* Eixos */}
                    <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="#94a3b8" strokeWidth="2" />
                    <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="#94a3b8" strokeWidth="2" />
                    
                    {/* Etiquetes eixos */}
                    <text x={width / 2} y={height - 10} textAnchor="middle" className="text-xs fill-slate-500">{t("Quantitat (Q)", "Cantidad (Q)", "Quantity (Q)")}</text>
                    <text x={15} y={height / 2} textAnchor="middle" transform={`rotate(-90, 15, ${height/2})`} className="text-xs fill-slate-500">€</text>
                    
                    {/* Línia CF (horitzontal) */}
                    <path d={cfLine} stroke="#f59e0b" strokeWidth="2" strokeDasharray="5,5" fill="none" />
                    <text x={width - padding + 5} y={scaleY(cf)} className="text-xs fill-amber-600">CF</text>
                    
                    {/* Línia CT (creixent) */}
                    <path d={ctLine} stroke="#ef4444" strokeWidth="3" fill="none" />
                    <text x={width - padding + 5} y={scaleY(cf + cv * maxQ) - 10} className="text-xs fill-red-600">CT</text>
                    
                    {/* Línia IT (creixent des de 0) */}
                    <path d={itLine} stroke="#22c55e" strokeWidth="3" fill="none" />
                    <text x={width - padding + 5} y={scaleY(preu * maxQ) + 15} className="text-xs fill-green-600">IT</text>
                    
                    {/* Punt d'equilibri */}
                    {calc.qEq > 0 && calc.qEq < maxQ && (
                        <>
                            <circle cx={scaleX(calc.qEq)} cy={scaleY(preu * calc.qEq)} r="8" fill="#3b82f6" />
                            <line x1={scaleX(calc.qEq)} y1={scaleY(preu * calc.qEq)} x2={scaleX(calc.qEq)} y2={height - padding} stroke="#3b82f6" strokeWidth="1" strokeDasharray="3,3" />
                            <text x={scaleX(calc.qEq)} y={height - padding + 15} textAnchor="middle" className="text-xs font-bold fill-blue-600">Q* = {calc.qEq}</text>
                        </>
                    )}
                    
                    {/* Posició actual */}
                    <circle cx={scaleX(q)} cy={scaleY(preu * q)} r="6" fill="#8b5cf6" />
                    <circle cx={scaleX(q)} cy={scaleY(calc.ct)} r="6" fill="#8b5cf6" />
                    
                    {/* Zona beneficis/pèrdues */}
                    {calc.qEq > 0 && (
                        <>
                            <text x={scaleX(calc.qEq / 2)} y={scaleY(cf / 2)} textAnchor="middle" className="text-sm font-bold fill-red-500">{t("PÈRDUES", "PÉRDIDAS", "LOSSES")}</text>
                            <text x={scaleX(calc.qEq * 1.5)} y={scaleY(preu * calc.qEq * 1.3)} textAnchor="middle" className="text-sm font-bold fill-green-500">{t("BENEFICIS", "BENEFICIOS", "PROFITS")}</text>
                        </>
                    )}
                    
                    {/* Llegenda */}
                    <rect x={padding} y={10} width="15" height="3" fill="#22c55e" />
                    <text x={padding + 20} y={15} className="text-xs fill-slate-600">{t("Ingressos Totals", "Ingresos Totales", "Total Revenue")}</text>

                    <text x={padding + 140} y={15} className="text-xs fill-slate-600">{t("Costos Totals", "Costes Totales", "Total Costs")}</text>
                    <rect x={padding + 240} y={10} width="15" height="3" fill="#f59e0b" strokeDasharray="5,5" />
                    <text x={padding + 260} y={15} className="text-xs fill-slate-600">{t("Costos Fixos", "Costes Fijos", "Fixed Costs")}</text>
                </svg>
            );
        };
        
        return (
            <div className="space-y-6">
                <SectionTitle icon="💰" title={t('Costos i Punt Mort', 'Costes y Umbral', 'Costs & Break-even')} subtitle={t("Quant has de vendre per no perdre diners?", 'Cuánto has de vender para no perder dinero?', 'How much do you need to sell to not lose money?')} />
                
                <WhyImportant>
                    {t("Imagina que obres una cafeteria. Pagues 2.000€/mes de lloguer tant si vens 1 cafè com si en vens 1.000. Això són costos FIXOS. Però cada cafè que prepares et costa 0,50€ de cafè, llet, got... Això són costos VARIABLES. El PUNT MORT et diu: 'Has de vendre X cafès al mes per pagar tots els costos'. Per sota, perds diners. Per sobre, guanyes. Tota empresa ha de saber on està aquest punt!",

                       "Imagine you open a coffee shop. You pay €2,000/month rent whether you sell 1 coffee or 1,000. That's FIXED costs. But each coffee costs you €0.50 in beans, milk, cup... That's VARIABLE costs. The BREAK-EVEN tells you how many coffees you need to sell to cover all costs.")}
                </WhyImportant>
                
                <Tabs tabs={[
                    { id: 'teoria', label: t('📚 Teoria', '📚 Teoría', '📚 Theory') },
                    { id: 'simulador', label: t('📈 Simulador', '📈 Simulador', '📈 Simulator') },
                ]} active={tab} onChange={setTab} />
                
                {tab === 'teoria' && (
                    <div className="space-y-6">
                        <Card title={t("Classificació dels Costos", "Clasificación de Costes", "Cost Classification")} icon="📋">
                            <div className="grid md:grid-cols-2 gap-6">
                                <TheoryBlock title={t("Costos Fixos (CF)", "Costes Fijos", "Fixed Costs")} color="amber">

                                </TheoryBlock>
                                <TheoryBlock title={t("Costos Variables (CV)", "Costes Variables", "Variable Costs")} color="blue">
                                    <p className="font-semibold">{t("SÍ varien amb la producció", "SÍ varían con la producción", "DO vary with production")}</p>
                                    <ul className="mt-3 space-y-2">
                                        <li>📦 {t("Matèries primeres", "Materias primas", "Raw materials")}</li>
                                        <li>👷 {t("Mà d'obra directa (per unitat)", "Mano de obra directa", "Direct labor")}</li>
                                        <li>⚡ {t("Energia de producció", "Energía de producción", "Production energy")}</li>
                                        <li>📦 {t("Embalatge", "Embalaje", "Packaging")}</li>
                                        <li>🚚 {t("Transport per unitat", "Transporte por unidad", "Transport per unit")}</li>
                                    </ul>
                                    <p className="mt-3 text-blue-700 font-medium">{t("💡 Si no produeixes, no els tens!", "💡 ¡Si no produces, no los tienes!", "💡 If you don't produce, you don't have them!")}</p>
                                </TheoryBlock>
                            </div>
                            <FormulaBox formula="CT = CF + CV = CF + CVu × Q" desc={t("Cost Total = Costos Fixos + Cost Variable unitari × Quantitat", "Coste Total = Costes Fijos + Coste Variable unitario × Cantidad", "Total Cost = Fixed Costs + Variable Cost per unit × Quantity")} />
                        </Card>
                        
                        <Card title={t("El Punt Mort (Umbral de Rendibilitat)", "El Punto Muerto", "The Break-even Point")} icon="⚖️">
                            <TheoryBlock color="green">
                                <p className="text-lg font-semibold">{t("El punt mort és la quantitat que has de vendre perquè Ingressos = Costos", "El punto muerto es la cantidad que debes vender para que Ingresos = Costes", "Break-even is the quantity you must sell so Revenue = Costs")}</p>
                                <p className="mt-2">{t("Per sota del punt mort → PÈRDUES. Per sobre → BENEFICIS.", "Por debajo del punto muerto → PÉRDIDAS. Por encima → BENEFICIOS.", "Below break-even → LOSSES. Above → PROFITS.")}</p>
                            </TheoryBlock>
                            
                            <div className="mt-6 p-6 bg-gradient-to-r from-blue-100 to-indigo-100 rounded-xl border-2 border-blue-300">
                                <p className="text-center text-lg font-bold text-blue-800 mb-2">{t("FÓRMULA DEL PUNT MORT", "FÓRMULA DEL PUNTO MUERTO", "BREAK-EVEN FORMULA")}</p>

    // SECCIÓ INVERSIÓ
    const Inversio = () => {
        const [tab, setTab] = useState('teoria');
        const [inv, setInv] = useState(100000);
        const [fc1, setFC1] = useState(30000);
        const [fc2, setFC2] = useState(35000);
        const [fc3, setFC3] = useState(40000);
        const [fc4, setFC4] = useState(45000);
        const [tasa, setTasa] = useState(10);
        
        const calc = useMemo(() => {
            const k = tasa / 100;
            const van = -inv + fc1/(1+k) + fc2/Math.pow(1+k,2) + fc3/Math.pow(1+k,3) + fc4/Math.pow(1+k,4);
            
            let tir = 0;
            for (let r = 0; r <= 100; r += 0.5) {
                const rDec = r / 100;
                const vanTest = -inv + fc1/(1+rDec) + fc2/Math.pow(1+rDec,2) + fc3/Math.pow(1+rDec,3) + fc4/Math.pow(1+rDec,4);
                if (vanTest < 0) { tir = r - 0.5; break; }
            }
            
            let payback = 0;
            let acum = 0;
            const flujos = [fc1, fc2, fc3, fc4];
            for (let i = 0; i < flujos.length; i++) {
                acum += flujos[i];
                if (acum >= inv) {
                    payback = i + 1 - (acum - inv) / flujos[i];
                    break;
                }
            }
            if (acum < inv) payback = -1;
            
            return { van: van.toFixed(0), tir: tir.toFixed(1), payback: payback > 0 ? payback.toFixed(2) : "No recupera" };
        }, [inv, fc1, fc2, fc3, fc4, tasa]);
        
        return (
            <div className="space-y-6">
                <SectionTitle icon="📈" title={t('Inversió', 'Inversión', 'Investment')} subtitle={t('Val la pena aquest projecte?', '¿Vale la pena este proyecto?', 'Is this project worth it?')} />
                
                <WhyImportant>
                    {t("Imagina que tens 100.000€ i dues opcions: obrir una botiga o comprar un pis per llogar. Com decideixes? No pots simplement sumar els diners que rebràs, perquè 10.000€ avui valen més que 10.000€ d'aquí a 10 anys (inflació, risc, oportunitat). El VAN i la TIR t'ajuden a comparar projectes d'inversió de forma justa, tenint en compte el VALOR DEL TEMPS.",
                       "Imagina que tienes 100.000€ y dos opciones: abrir una tienda o comprar un piso para alquilar. ¿Cómo decides? No puedes simplemente sumar el dinero que recibirás, porque 10.000€ hoy valen más que 10.000€ en 10 años. El VAN y la TIR te ayudan a comparar proyectos de forma justa.",
                       "Imagine you have €100,000 and two options: open a store or buy an apartment to rent. How do you decide? You can't simply add up the money you'll receive, because €10,000 today is worth more than €10,000 in 10 years. NPV and IRR help you compare projects fairly.")}
                </WhyImportant>
                
                <Tabs tabs={[
                    { id: 'teoria', label: t('📚 Teoria', '📚 Teoría', '📚 Theory') },
                    { id: 'simulador', label: t('🧮 Simulador', '🧮 Simulador', '🧮 Simulator') },
                ]} active={tab} onChange={setTab} />
                
                {tab === 'teoria' && (
                    <div className="space-y-6">
                        <Card title={t("Mètodes de Selecció d'Inversions", "Métodos de Selección de Inversiones", "Investment Selection Methods")} icon="📊">
                            <div className="grid md:grid-cols-3 gap-4">
                                <TheoryBlock title="VAN" color="green">
                                    <p className="font-bold text-lg">{t("Valor Actual Net", "Valor Actual Neto", "Net Present Value")}</p>
                                    <p className="mt-2">{t("Suma dels fluxos de caixa futurs actualitzats al present, menys la inversió inicial.", "Suma de los flujos de caja futuros actualizados al presente, menos la inversión inicial.", "Sum of future cash flows updated to present, minus initial investment.")}</p>
                                    <div className="mt-3 p-2 bg-green-100 rounded">
                                        <p className="text-sm">✅ VAN &gt; 0 → {t("Projecte RENDIBLE", "Proyecto RENTABLE", "PROFITABLE project")}</p>
                                        <p className="text-sm">❌ VAN &lt; 0 → {t("Projecte NO rendible", "Proyecto NO rentable", "NOT profitable project")}</p>
                                    </div>
                                </TheoryBlock>
                                <TheoryBlock title="TIR" color="blue">
                                    <p className="font-bold text-lg">{t("Taxa Interna de Retorn", "Tasa Interna de Retorno", "Internal Rate of Return")}</p>
                                    <p className="mt-2">{t("Taxa de descompte que fa el VAN = 0. És la 'rendibilitat' del projecte.", "Tasa de descuento que hace el VAN = 0. Es la 'rentabilidad' del proyecto.", "Discount rate that makes NPV = 0. It's the project's 'return'.")}</p>
                                    <div className="mt-3 p-2 bg-blue-100 rounded">
                                        <p className="text-sm">✅ TIR &gt; k → {t("Projecte RENDIBLE", "Proyecto RENTABLE", "PROFITABLE project")}</p>
                                        <p className="text-sm">❌ TIR &lt; k → {t("Projecte NO rendible", "Proyecto NO rentable", "NOT profitable project")}</p>
                                    </div>
                                </TheoryBlock>
                                <TheoryBlock title="Payback" color="amber">
                                    <p className="font-bold text-lg">{t("Termini de Recuperació", "Plazo de Recuperación", "Payback Period")}</p>
                                    <p className="mt-2">{t("Temps que tarda a recuperar-se la inversió inicial.", "Tiempo que tarda en recuperarse la inversión inicial.", "Time it takes to recover the initial investment.")}</p>
                                    <div className="mt-3 p-2 bg-amber-100 rounded">
                                        <p className="text-sm">⚠️ {t("No té en compte el valor del temps ni què passa després de recuperar", "No tiene en cuenta el valor del tiempo ni qué pasa después de recuperar", "Doesn't account for time value or what happens after recovery")}</p>
                                    </div>
                                </TheoryBlock>
                            </div>
                        </Card>
                        
                        <Card title={t("Fórmula del VAN", "Fórmula del VAN", "NPV Formula")} icon="📐">
                            <FormulaBox formula="VAN = -I₀ + FC₁/(1+k) + FC₂/(1+k)² + ... + FCₙ/(1+k)ⁿ" desc={t("On k = taxa de descompte (cost d'oportunitat)", "Donde k = tasa de descuento (coste de oportunidad)", "Where k = discount rate (opportunity cost)")} />
                        </Card>
                    </div>
                )}
                
                {tab === 'simulador' && (
                    <Card title={t("🧮 Simulador VAN/TIR", "🧮 Simulador VAN/TIR", "🧮 NPV/IRR Simulator")}>
                        <div className="grid lg:grid-cols-2 gap-6">
                            <div className="space-y-4">
                                <Slider label={t("Inversió inicial", "Inversión inicial", "Initial investment")} value={inv} onChange={setInv} min={10000} max={500000} step={10000} suffix="€" />
                                <Slider label={t("Flux Caixa Any 1", "Flujo Caja Año 1", "Cash Flow Year 1")} value={fc1} onChange={setFC1} min={0} max={200000} step={5000} suffix="€" />
                                <Slider label={t("Flux Caixa Any 2", "Flujo Caja Año 2", "Cash Flow Year 2")} value={fc2} onChange={setFC2} min={0} max={200000} step={5000} suffix="€" />
                                <Slider label={t("Flux Caixa Any 3", "Flujo Caja Año 3", "Cash Flow Year 3")} value={fc3} onChange={setFC3} min={0} max={200000} step={5000} suffix="€" />
                                <Slider label={t("Flux Caixa Any 4", "Flujo Caja Año 4", "Cash Flow Year 4")} value={fc4} onChange={setFC4} min={0} max={200000} step={5000} suffix="€" />
                                <Slider label={t("Taxa descompte (k)", "Tasa descuento (k)", "Discount rate (k)")} value={tasa} onChange={setTasa} min={1} max={25} step={0.5} suffix="%" />
                            </div>
                            <div className="space-y-4">
                                <ResultCard title="VAN" value={parseInt(calc.van).toLocaleString() + "€"} color={parseInt(calc.van) > 0 ? "green" : "red"} subtitle={parseInt(calc.van) > 0 ? t("✅ Projecte RENDIBLE", "✅ Proyecto RENTABLE", "✅ PROFITABLE") : t("❌ NO rendible", "❌ NO rentable", "❌ NOT profitable")} />
                                <ResultCard title="TIR" value={calc.tir + "%"} color={parseFloat(calc.tir) > tasa ? "green" : "red"} subtitle={parseFloat(calc.tir) > tasa ? `TIR > k (${tasa}%)` : `TIR < k (${tasa}%)`} />
                                <ResultCard title="Payback" value={typeof calc.payback === 'string' ? calc.payback : calc.payback + t(" anys", " años", " years")} color="amber" subtitle={t("Temps de recuperació", "Tiempo de recuperación", "Recovery time")} />
                            </div>
                        </div>
                    </Card>
                )}
            </div>
        );
    };

                <Card title={t("Quan crear una SL", "Cuándo crear una SL", "When to create an LLC")} icon="🏢">
                    <div className="space-y-2 text-sm">
                        <p className="text-green-600">✅ {t("Vols protegir el teu patrimoni personal", "Quieres proteger tu patrimonio personal", "You want to protect personal assets")}</p>
                        <p className="text-green-600">✅ {t("Beneficis alts (>40.000€/any)", "Beneficios altos (>40.000€/año)", "High profits (>€40,000/year)")}</p>
                        <p className="text-green-600">✅ {t("Vols entrar socis o inversors", "Quieres meter socios o inversores", "You want partners or investors")}</p>
                        <p className="text-green-600">✅ {t("Més credibilitat davant clients/bancs", "Más credibilidad ante clientes/bancos", "More credibility with clients/banks")}</p>
                    </div>
                </Card>
            </div>
        </div>
    );

    // SECCIÓ FINANÇAMENT
    const Financament = () => {
        const [capital, setCapital] = useState(100000);
        const [interes, setInteres] = useState(6);
        const [anys, setAnys] = useState(10);
        
        const prestec = useMemo(() => {
            const n = anys * 12;
            const r = interes / 100 / 12;
            const quota = capital * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            const totalPagar = quota * n;
            const interessos = totalPagar - capital;
            return { quota: quota.toFixed(2), totalPagar: totalPagar.toFixed(0), interessos: interessos.toFixed(0) };
        }, [capital, interes, anys]);
        
        return (
            <div className="space-y-6">
                <SectionTitle icon="🏦" title={t('Finançament', 'Financiación', 'Financing')} subtitle={t("D'on traure els diners per al negoci?", "¿De dónde sacar el dinero para el negocio?", "Where to get money for the business?")} />
                
                <WhyImportant>
                    {t("Sense diners no hi ha negoci. Però no tots els diners són iguals: els teus estalvis no tenen cost, un préstec sí (interessos). Entendre les fonts de finançament et permet triar la més barata i adequada per a cada situació. Una mala decisió de finançament pot ofegar una empresa encara que siga rendible!",
                       "Sin dinero no hay negocio. Pero no todo dinero es igual: tus ahorros no tienen coste, un préstamo sí (intereses). Entender las fuentes de financiación te permite elegir la más barata. ¡Una mala decisión de financiación puede ahogar una empresa aunque sea rentable!",
                       "No money, no business. But not all money is equal: your savings have no cost, a loan does (interest). Understanding financing sources lets you choose the cheapest. A bad financing decision can sink a profitable company!")}
                </WhyImportant>
                
                <Card title={t("Fonts de Finançament", "Fuentes de Financiación", "Financing Sources")} icon="💰">
                    <div className="grid md:grid-cols-2 gap-6">
                        <div>
                            <h4 className="font-bold text-green-700 mb-3 text-lg">🟢 {t("Finançament Propi", "Financiación Propia", "Own Financing")}</h4>
                            <p className="text-sm text-slate-600 mb-3">{t("No cal tornar-lo. És el més barat.", "No hay que devolverlo. Es el más barato.", "Doesn't need to be returned. It's the cheapest.")}</p>
                            <div className="space-y-2">
                                <div className="p-3 bg-green-50 rounded-lg"><p className="font-semibold text-green-700">{t("Capital dels socis", "Capital de los socios", "Partners' capital")}</p><p className="text-xs text-slate-500">{t("Diners que aporten els propietaris", "Dinero que aportan los propietarios", "Money contributed by owners")}</p></div>
                                <div className="p-3 bg-green-50 rounded-lg"><p className="font-semibold text-green-700">{t("Autofinançament (reserves)", "Autofinanciación (reservas)", "Self-financing (reserves)")}</p><p className="text-xs text-slate-500">{t("Beneficis retinguts de l'empresa", "Beneficios retenidos de la empresa", "Retained company profits")}</p></div>
                                <div className="p-3 bg-green-50 rounded-lg"><p className="font-semibold text-green-700">{t("Amortitzacions", "Amortizaciones", "Depreciation")}</p><p className="text-xs text-slate-500">{t("Fons per renovar actius", "Fondos para renovar activos", "Funds to renew assets")}</p></div>
                            </div>
                        </div>
                        <div>
                            <h4 className="font-bold text-blue-700 mb-3 text-lg">🔵 {t("Finançament Aliè", "Financiación Ajena", "External Financing")}</h4>
                            <p className="text-sm text-slate-600 mb-3">{t("Cal tornar-lo amb interessos.", "Hay que devolverlo con intereses.", "Must be returned with interest.")}</p>
                            <div className="space-y-2">
                                <div className="p-3 bg-blue-50 rounded-lg"><p className="font-semibold text-blue-700">{t("Préstecs bancaris", "Préstamos bancarios", "Bank loans")}</p><p className="text-xs text-slate-500">{t("Diners del banc, quotes fixes", "Dinero del banco, cuotas fijas", "Bank money, fixed payments")}</p></div>
                                <div className="p-3 bg-blue-50 rounded-lg"><p className="font-semibold text-blue-700">{t("Crèdit comercial (proveïdors)", "Crédito comercial (proveedores)", "Trade credit (suppliers)")}</p><p className="text-xs text-slate-500">{t("Pagar a 30-90 dies", "Pagar a 30-90 días", "Pay in 30-90 days")}</p></div>
                                <div className="p-3 bg-blue-50 rounded-lg"><p className="font-semibold text-blue-700">Leasing</p><p className="text-xs text-slate-500">{t("Lloguer amb opció de compra", "Alquiler con opción de compra", "Rent with purchase option")}</p></div>
                            </div>
                        </div>
                    </div>
                </Card>
                
                <Card title={t("Calculadora de Préstec", "Calculadora de Préstamo", "Loan Calculator")} icon="🧮">
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="space-y-4">
                            <Slider label={t("Capital sol·licitat", "Capital solicitado", "Loan amount")} value={capital} onChange={setCapital} min={10000} max={500000} step={10000} suffix="€" />
                            <Slider label={t("Tipus d'interès anual", "Tipo de interés anual", "Annual interest rate")} value={interes} onChange={setInteres} min={1} max={15} step={0.5} suffix="%" />
                            <Slider label={t("Termini (anys)", "Plazo (años)", "Term (years)")} value={anys} onChange={setAnys} min={1} max={30} />
                        </div>
                        <div className="grid grid-cols-1 gap-3">
                            <ResultCard title={t("Quota mensual", "Cuota mensual", "Monthly payment")} value={prestec.quota + "€"} color="blue" />
                            <ResultCard title={t("Total a pagar", "Total a pagar", "Total to pay")} value={parseInt(prestec.totalPagar).toLocaleString() + "€"} color="amber" />
                            <ResultCard title={t("Total interessos", "Total intereses", "Total interest")} value={parseInt(prestec.interessos).toLocaleString() + "€"} color="red" subtitle={t("Cost del préstec!", "¡Coste del préstamo!", "Loan cost!")} />
                        </div>
                    </div>
                </Card>
            </div>
        );
    };

    // NAVEGACIÓ I RENDER
    const headerSections = [
        { id: 'comptabilitat', label: t('Comptabilitat', 'Contabilidad', 'Accounting'), emoji: '📒' },
        { id: 'analisi', label: t('Anàlisi Financera', 'Análisis Financiero', 'Financial Analysis'), emoji: '📊' },
        { id: 'costos', label: t('Costos i Punt Mort', 'Costes y Umbral', 'Costs & Break-even'), emoji: '💰' },
        { id: 'inversio', label: t('Inversió', 'Inversión', 'Investment'), emoji: '📈' },
        { id: 'fiscalitat', label: t('Fiscalitat', 'Fiscalidad', 'Taxation'), emoji: '🏛️' },
        { id: 'produccio', label: t('Producció', 'Producción', 'Production'), emoji: '🏭' },
        { id: 'rrhh', label: t('Recursos Humans', 'Recursos Humanos', 'Human Resources'), emoji: '👥' },
        { id: 'marketing', label: 'Marketing', emoji: '📣' },
        { id: 'estrategia', label: t('Anàlisi Estratègica', 'Análisis Estratégico', 'Strategic Analysis'), emoji: '🎯' },
        { id: 'formes', label: t('Formes Jurídiques', 'Formas Jurídicas', 'Legal Forms'), emoji: '⚖️' },
        { id: 'financament', label: t('Finançament', 'Financiación', 'Financing'), emoji: '🏦' },
        { id: 'emprenedoria', label: t('Guia Emprenedoria', 'Guía Emprendimiento', 'Startup Guide'), emoji: '🚀' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}
                setIdioma={(lang) => { setIdioma(lang); PdeLanguageStore.set(lang); }}
                currentApp="empresa"
                sections={headerSections}
                currentSection={section}
                setSection={setSection}
            />

            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}
                {section === 'comptabilitat' && <Comptabilitat />}
                {section === 'analisi' && <AnalisiFinancera />}
                {section === 'costos' && <CostosPuntMort />}
                {section === 'inversio' && <Inversio />}
                {section === 'fiscalitat' && <Fiscalitat />}
                {section === 'produccio' && <Produccio />}
                {section === 'rrhh' && <RRHH />}
                {section === 'marketing' && <Marketing />}
                {section === 'estrategia' && <Estrategia />}
                {section === 'formes' && <FormesJuridiques />}
                {section === 'financament' && <Financament />}
                {section === 'emprenedoria' && <Emprenedoria />}
            </main>

            <PdeFooter appEmoji="🏢" appName={t('Empresa', 'Empresa', 'Business')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<EmpresaApp />, document.getElementById('root'));
    </script>
</body>
</html>
