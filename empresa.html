            const mc = preu - cv;

            const ct = cf + cv * q;
            const benefici = it - ct;
            const margeSeguretat = q > 0 && qEq > 0 ? (((q - qEq) / q) * 100) : 0;
            return { mc, qEq: Math.round(qEq), it, ct, benefici, margeSeguretat: margeSeguretat.toFixed(1) };
        }, [cf, cv, preu, q]);

        // Component gràfica SVG

            const cfLine = `M ${scaleX(0)} ${scaleY(cf)} L ${scaleX(maxQ)} ${scaleY(cf)}`;

            return (

                    {/* Línia CT (creixent) */}

                    <text x={width - padding + 5} y={scaleY(cf + cv * maxQ) - 10} className="text-xs fill-red-600">CT</text>
                    
                    {/* Línia IT (creixent des de 0) */}
                    <path d={itLine} stroke="#22c55e" strokeWidth="3" fill="none" />

                    {/* Punt d'equilibri */}
                    {calc.qEq > 0 && calc.qEq < maxQ && (

                            <line x1={scaleX(calc.qEq)} y1={scaleY(preu * calc.qEq)} x2={scaleX(calc.qEq)} y2={height - padding} stroke="#3b82f6" strokeWidth="1" strokeDasharray="3,3" />

                        </>

                    {/* Llegenda */}
                    <rect x={padding} y={10} width="15" height="3" fill="#22c55e" />
                    <text x={padding + 20} y={15} className="text-xs fill-slate-600">{t('costgraph.ingressos_totals')}</text>
                    <rect x={padding + 120} y={10} width="15" height="3" fill="#ef4444" />
                    <text x={padding + 140} y={15} className="text-xs fill-slate-600">{t('costgraph.costos_totals')}</text>
                    <rect x={padding + 240} y={10} width="15" height="3" fill="#f59e0b" strokeDasharray="5,5" />
                    <text x={padding + 260} y={15} className="text-xs fill-slate-600">{t('costgraph.costos_fixos')}</text>
                </svg>
            );
        };
        
        return (
            <div className="space-y-6">
                <SectionTitle icon="💰" title={t('inicio.costos_punt_mort')} subtitle={t('costgraph.quant_has_vendre_perdre')} />
                
                <WhyImportant>
                    {t('costgraph.imagina_obres_cafeteria_pagues')}
                </WhyImportant>
                
                <Tabs tabs={[
                    { id: 'teoria', label: t('costgraph.teoria') },
                    { id: 'simulador', label: t('costgraph.simulador') },
                ]} active={tab} onChange={setTab} />
                
                {tab === 'teoria' && (
                    <div className="space-y-6">
                        <Card title={t('costgraph.classificació_dels_costos')} icon="📋">
                            <div className="grid md:grid-cols-2 gap-6">
                                <TheoryBlock title={t('costgraph.costos_fixos_cf')} color="amber">
                                    <p className="font-semibold">{t('costgraph.varien_producció_curt_termini')}</p>
                                    <ul className="mt-3 space-y-2">
                                        <li>🏠 {t('costgraph.lloguer_local')}</li>
                                        <li>👔 {t('costgraph.sous_personal_fix')}</li>
                                        <li>🛡️ {t('costgraph.assegurances')}</li>
                                        <li>📉 {t('costgraph.amortitzacions')}</li>
                                        <li>💡 {t('costgraph.part_fixa_subministraments')}</li>
                                    </ul>
                                    <p className="mt-3 text-amber-700 font-medium">{t('costgraph.encara_venguis_res_has')}</p>
                                </TheoryBlock>
                                <TheoryBlock title={t('costgraph.costos_variables_cv')} color="blue">
                                    <p className="font-semibold">{t('costgraph.sí_varien_producció')}</p>
                                    <ul className="mt-3 space-y-2">
                                        <li>📦 {t('costgraph.matèries_primeres')}</li>
                                        <li>👷 {t('costgraph.mà_dobra_directa_unitat')}</li>
                                        <li>⚡ {t('costgraph.energia_producció')}</li>
                                        <li>📦 {t('costgraph.embalatge')}</li>
                                        <li>🚚 {t('costgraph.transport_unitat')}</li>
                                    </ul>
                                    <p className="mt-3 text-blue-700 font-medium">{t('costgraph.produeixes_tens')}</p>
                                </TheoryBlock>
                            </div>
                            <FormulaBox formula="CT = CF + CV = CF + CVu × Q" desc={t('costgraph.cost_total_costos_fixos')} />
                        </Card>
                        
                        <Card title={t('costgraph.punt_mort_umbral_rendibilitat')} icon="⚖️">
                            <TheoryBlock color="green">
                                <p className="text-lg font-semibold">{t('costgraph.punt_mort_quantitat_has')}</p>
                                <p className="mt-2">{t('costgraph.sota_punt_mort_pèrdues')}</p>
                            </TheoryBlock>
                            
                            <div className="mt-6 p-6 bg-gradient-to-r from-blue-100 to-indigo-100 rounded-xl border-2 border-blue-300">
                                <p className="text-center text-lg font-bold text-blue-800 mb-2">{t('costgraph.fórmula_punt_mort')}</p>
                                <p className="text-center font-mono text-2xl text-blue-900 font-black">Q* = CF / (P - CVu)</p>
                                <p className="text-center text-sm text-blue-700 mt-2">{t('costgraph.preu_venda_cvu_cost')}</p>
                            </div>
                            
                            <div className="grid md:grid-cols-2 gap-4 mt-6">
                                <div className="p-4 bg-pink-50 rounded-xl border border-pink-200">
                                    <h4 className="font-bold text-pink-700">{t('costgraph.marge_contribució_mc')}</h4>
                                    <FormulaBox formula="MC = P - CVu" />
                                    <p className="text-sm text-slate-600">{t('costgraph.quant_aporta_cada_unitat')}</p>
                                    <p className="text-xs text-pink-600 mt-2">{t('costgraph.ex_vens_80_costa')}</p>
                                </div>
                                <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                                    <h4 className="font-bold text-emerald-700">{t('costgraph.marge_seguretat')}</h4>
                                    <FormulaBox formula="MS = (Q - Q*) / Q × 100" />
                                    <p className="text-sm text-slate-600">{t('costgraph.poden_baixar_vendes_abans')}</p>
                                    <p className="text-xs text-emerald-600 mt-2">{t('costgraph.ms_20_vendes_poden')}</p>
                                </div>
                            </div>
                        </Card>
                    </div>
                )}
                
                {tab === 'simulador' && (
                    <div className="space-y-6">
                        <Card title={t('costgraph.simulador_punt_mort')}>
                            <div className="grid lg:grid-cols-2 gap-8">
                                <div className="space-y-4">
                                    <Slider label={t('costgraph.costos_fixos_cf_2')} value={cf} onChange={setCF} min={10000} max={200000} step={5000} suffix="€" />
                                    <Slider label={t('costgraph.cost_variable_unitari_cvu')} value={cv} onChange={setCV} min={5} max={100} step={1} suffix="€" />
                                    <Slider label={t('costgraph.preu_venda')} value={preu} onChange={setPreu} min={10} max={200} step={5} suffix="€" />
                                    <Slider label={t('costgraph.quantitat_produïda')} value={q} onChange={setQ} min={0} max={5000} step={50} suffix=" ut." />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <ResultCard title={t('costgraph.marge_contribució')} value={calc.mc + "€"} color={calc.mc > 0 ? "green" : "red"} subtitle="P - CVu" />
                                    <ResultCard title={t('costgraph.punt_mort')} value={calc.qEq + " ut."} color="blue" subtitle="CF / MC" />
                                    <ResultCard title={t('costgraph.ingressos_totals')} value={calc.it.toLocaleString() + "€"} color="green" subtitle="P × Q" />
                                    <ResultCard title={t('costgraph.costos_totals')} value={calc.ct.toLocaleString() + "€"} color="red" subtitle="CF + CVu×Q" />
                                    <ResultCard title={t('costgraph.resultat')} value={calc.benefici.toLocaleString() + "€"} color={calc.benefici >= 0 ? "green" : "red"} subtitle={calc.benefici >= 0 ? t('costgraph.benefici') : t('costgraph.pèrdua')} />

                        </Card>

                            <CostGraph />

                                    ) : (
                                        <span className="text-green-600 font-bold">✅ {t('costgraph.estàs_sobre_punt_mort')} {calc.mc}€ {t('costgraph.benefici_2')}</span>
                                    )}
                                </p>
                            </div>
                        </Card>
                    </div>
                )}
            </div>
        );
    };

    // SECCIÓ INVERSIÓ
    const Inversio = () => {
        const [tab, setTab] = useState('teoria');
        const [inv, setInv] = useState(100000);
        const [fc1, setFC1] = useState(30000);
        const [fc2, setFC2] = useState(35000);
        const [fc3, setFC3] = useState(40000);
        const [fc4, setFC4] = useState(45000);
        const [tasa, setTasa] = useState(10);
        
        const calc = useMemo(() => {
            const k = tasa / 100;
            const van = -inv + fc1/(1+k) + fc2/Math.pow(1+k,2) + fc3/Math.pow(1+k,3) + fc4/Math.pow(1+k,4);
            
            let tir = 0;
            for (let r = 0; r <= 100; r += 0.5) {
                const rDec = r / 100;
                const vanTest = -inv + fc1/(1+rDec) + fc2/Math.pow(1+rDec,2) + fc3/Math.pow(1+rDec,3) + fc4/Math.pow(1+rDec,4);
                if (vanTest < 0) { tir = r - 0.5; break; }
            }
            
            let payback = 0;
            let acum = 0;
            const flujos = [fc1, fc2, fc3, fc4];
            for (let i = 0; i < flujos.length; i++) {
                acum += flujos[i];
                if (acum >= inv) {
                    payback = i + 1 - (acum - inv) / flujos[i];
                    break;
                }
            }
            if (acum < inv) payback = -1;
            
            return { van: van.toFixed(0), tir: tir.toFixed(1), payback: payback > 0 ? payback.toFixed(2) : "No recupera" };
        }, [inv, fc1, fc2, fc3, fc4, tasa]);
        
        return (
            <div className="space-y-6">
                <SectionTitle icon="📈" title={t('inicio.inversió')} subtitle={t('inversio.val_pena_aquest_projecte')} />
                
                <WhyImportant>
                    {t('inversio.imagina_tens_100000_dues')}
                </WhyImportant>
                
                <Tabs tabs={[
                    { id: 'teoria', label: t('costgraph.teoria') },
                    { id: 'simulador', label: t('analisifinancera.simulador') },
                ]} active={tab} onChange={setTab} />
                
                {tab === 'teoria' && (
                    <div className="space-y-6">
                        <Card title={t('inversio.mètodes_selecció_dinversions')} icon="📊">
                            <div className="grid md:grid-cols-3 gap-4">
                                <TheoryBlock title="VAN" color="green">
                                    <p className="font-bold text-lg">{t('inversio.valor_actual_net')}</p>
                                    <p className="mt-2">{t('inversio.suma_dels_fluxos_caixa')}</p>
                                    <div className="mt-3 p-2 bg-green-100 rounded">
                                        <p className="text-sm">✅ VAN &gt; 0 → {t('inversio.projecte_rendible')}</p>
                                        <p className="text-sm">❌ VAN &lt; 0 → {t('inversio.projecte_rendible_2')}</p>
                                    </div>
                                </TheoryBlock>
                                <TheoryBlock title="TIR" color="blue">
                                    <p className="font-bold text-lg">{t('inversio.taxa_interna_retorn')}</p>
                                    <p className="mt-2">{t('inversio.taxa_descompte_fa_van')}</p>
                                    <div className="mt-3 p-2 bg-blue-100 rounded">
                                        <p className="text-sm">✅ TIR &gt; k → {t('inversio.projecte_rendible')}</p>
                                        <p className="text-sm">❌ TIR &lt; k → {t('inversio.projecte_rendible_2')}</p>
                                    </div>
                                </TheoryBlock>
                                <TheoryBlock title="Payback" color="amber">
                                    <p className="font-bold text-lg">{t('inversio.termini_recuperació')}</p>
                                    <p className="mt-2">{t('inversio.temps_tarda_recuperarse_inversió')}</p>
                                    <div className="mt-3 p-2 bg-amber-100 rounded">
                                        <p className="text-sm">⚠️ {t('inversio.té_compte_valor_temps')}</p>
                                    </div>
                                </TheoryBlock>
                            </div>
                        </Card>
                        
                        <Card title={t('inversio.fórmula_van')} icon="📐">
                            <FormulaBox formula="VAN = -I₀ + FC₁/(1+k) + FC₂/(1+k)² + ... + FCₙ/(1+k)ⁿ" desc={t('inversio.taxa_descompte_cost_doportunitat')} />
                        </Card>
                    </div>
                )}
                
                {tab === 'simulador' && (
                    <Card title={t('inversio.simulador_vantir')}>
                        <div className="grid lg:grid-cols-2 gap-6">
                            <div className="space-y-4">
                                <Slider label={t('inversio.inversió_inicial')} value={inv} onChange={setInv} min={10000} max={500000} step={10000} suffix="€" />
                                <Slider label={t('inversio.flux_caixa_any')} value={fc1} onChange={setFC1} min={0} max={200000} step={5000} suffix="€" />
                                <Slider label={t('inversio.flux_caixa_any_2')} value={fc2} onChange={setFC2} min={0} max={200000} step={5000} suffix="€" />
                                <Slider label={t('inversio.flux_caixa_any_3')} value={fc3} onChange={setFC3} min={0} max={200000} step={5000} suffix="€" />
                                <Slider label={t('inversio.flux_caixa_any_4')} value={fc4} onChange={setFC4} min={0} max={200000} step={5000} suffix="€" />
                                <Slider label={t('inversio.taxa_descompte')} value={tasa} onChange={setTasa} min={1} max={25} step={0.5} suffix="%" />
                            </div>
                            <div className="space-y-4">
                                <ResultCard title="VAN" value={parseInt(calc.van).toLocaleString() + "€"} color={parseInt(calc.van) > 0 ? "green" : "red"} subtitle={parseInt(calc.van) > 0 ? t('inversio.projecte_rendible_3') : t('inversio.rendible')} />
                                <ResultCard title="TIR" value={calc.tir + "%"} color={parseFloat(calc.tir) > tasa ? "green" : "red"} subtitle={parseFloat(calc.tir) > tasa ? `TIR > k (${tasa}%)` : `TIR < k (${tasa}%)`} />
                                <ResultCard title="Payback" value={typeof calc.payback === 'string' ? calc.payback : calc.payback + t('inversio.anys')} color="amber" subtitle={t('inversio.temps_recuperació')} />
                            </div>
                        </div>
                    </Card>
                )}
            </div>
        );
    };

    // SECCIÓ ESTRATÈGIA AMB DAFO I CANVAS EDITABLES
    const Estrategia = () => {
        const [tab, setTab] = useState('dafo');
        
        // DAFO Editable amb localStorage
        const [dafo, setDafo] = useState(() => {
            const saved = localStorage.getItem('pde_dafo');
            return saved ? JSON.parse(saved) : {
                fortaleses: ['', '', ''],
                debilitats: ['', '', ''],
                oportunitats: ['', '', ''],
                amenaces: ['', '', '']
            };
        });
        
        const updateDafo = (section, index, value) => {
            const newDafo = { ...dafo, [section]: [...dafo[section]] };
            newDafo[section][index] = value;
            setDafo(newDafo);
            localStorage.setItem('pde_dafo', JSON.stringify(newDafo));
        };
        
        const addDafoItem = (section) => {
            const newDafo = { ...dafo, [section]: [...dafo[section], ''] };

        const clearCanvas = () => {
            const empty = { socis: '', activitats: '', proposta: '', relacions: '', segments: '', recursos: '', canals: '', costos: '', ingressos: '' };

            localStorage.setItem('pde_canvas', JSON.stringify(empty));
        };
        
        const clearDafo = () => {
            const empty = { fortaleses: ['', '', ''], debilitats: ['', '', ''], oportunitats: ['', '', ''], amenaces: ['', '', ''] };

            localStorage.setItem('pde_dafo', JSON.stringify(empty));
        };
        
        return (
            <div className="space-y-6">

                <WhyImportant>
                    {t('estrategia.abans_llançarte_obrir_negoci')}
                </WhyImportant>
                
                <Tabs tabs={[
                    { id: 'dafo', label: '📊 DAFO ' + t('estrategia.editable') },
                    { id: 'canvas', label: '📋 Canvas ' + t('estrategia.editable') },
                    { id: 'porter', label: '🏭 Porter' },
                ]} active={tab} onChange={setTab} />
                
                {tab === 'dafo' && (
                    <div className="space-y-6">
                        <Card title={t('estrategia.anàlisi_dafoswot_editable')} icon="📊">
                            <TheoryBlock color="blue">
                                <p>{t('estrategia.escriu_directament_caselles_fer')}</p>
                            </TheoryBlock>
                            
                            <div className="grid md:grid-cols-2 gap-4 mt-6">
                                {/* Fortaleses */}
                                <div className="p-4 bg-green-50 rounded-xl border-2 border-green-300">
                                    <h4 className="font-bold text-green-700 mb-3 text-lg">💪 {t('estrategia.fortaleses')}</h4>
                                    <p className="text-xs text-green-600 mb-3">{t('estrategia.avantatges_interns_què_fem')}</p>
                                    {dafo.fortaleses.map((item, i) => (
                                        <input key={i} type="text" value={item} onChange={(e) => updateDafo('fortaleses', i, e.target.value)}
                                            placeholder={`${t('estrategia.fortalesa')} ${i + 1}...`}

                            <ResultCard title={t('financament.total_pagar')} value={parseInt(prestec.totalPagar).toLocaleString() + "€"} color="amber" />
                            <ResultCard title={t('financament.total_interessos')} value={parseInt(prestec.interessos).toLocaleString() + "€"} color="red" subtitle={t('financament.cost_préstec')} />
                        </div>
                    </div>
                </Card>
            </div>
        );
    };

    // NAVEGACIÓ I RENDER
    const headerSections = [
        { id: 'comptabilitat', label: t('inicio.comptabilitat'), emoji: '📒' },
        { id: 'analisi', label: t('inicio.anàlisi_financera'), emoji: '📊' },
        { id: 'costos', label: t('inicio.costos_punt_mort'), emoji: '💰' },
        { id: 'inversio', label: t('inicio.inversió'), emoji: '📈' },
        { id: 'fiscalitat', label: t('inicio.fiscalitat'), emoji: '🏛️' },
        { id: 'produccio', label: t('inicio.producció'), emoji: '🏭' },
        { id: 'rrhh', label: t('inicio.recursos_humans'), emoji: '👥' },
        { id: 'marketing', label: 'Marketing', emoji: '📣' },
        { id: 'estrategia', label: t('financament.anàlisi_estratègica'), emoji: '🎯' },
        { id: 'formes', label: t('inicio.formes_jurídiques'), emoji: '⚖️' },
        { id: 'financament', label: t('inicio.finançament'), emoji: '🏦' },
        { id: 'emprenedoria', label: t('financament.guia_emprenedoria'), emoji: '🚀' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}
                setIdioma={setIdioma}
                currentApp="empresa"
                sections={headerSections}
                currentSection={section}
                setSection={setSection}
            />

            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}
                {section === 'comptabilitat' && <Comptabilitat />}
                {section === 'analisi' && <AnalisiFinancera />}
                {section === 'costos' && <CostosPuntMort />}
                {section === 'inversio' && <Inversio />}
                {section === 'fiscalitat' && <Fiscalitat />}
                {section === 'produccio' && <Produccio />}
                {section === 'rrhh' && <RRHH />}
                {section === 'marketing' && <Marketing />}
                {section === 'estrategia' && <Estrategia />}
                {section === 'formes' && <FormesJuridiques />}
                {section === 'financament' && <Financament />}
                {section === 'emprenedoria' && <Emprenedoria />}
            </main>

            <PdeFooter appEmoji="🏢" appName={t('financament.empresa')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<EmpresaApp />, document.getElementById('root'));
    </script>
</body>
</html>
