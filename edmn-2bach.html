        // Unit 5: Lean Startup
        'lean.title': { val: "Lean Startup", es: "Lean Startup", en: "Lean Startup" },
        'lean.subtitle': { val: "Aprendre rapid, fallar barat", es: "Aprender rapido, fallar barato", en: "Learn fast, fail cheap" },
        'lean.why': { val: "El 90% de les startups fracassen. El metode Lean Startup, d'Eric Ries, proposa no gastar mesos construint un producte perfecte que ningu vol. En canvi, llança un producte minim (MVP), mesura el resultat i apren. Si no funciona, pivota.", es: "El 90% de las startups fracasan. El metodo Lean Startup, de Eric Ries, propone no gastar meses construyendo un producto perfecto que nadie quiere. En cambio, lanza un producto minimo (MVP), mide el resultado y aprende. Si no funciona, pivota.", en: "90% of startups fail. Eric Ries' Lean Startup method proposes not spending months building a perfect product nobody wants. Instead, launch a minimum product (MVP), measure the result and learn. If it doesn't work, pivot." },
        'lean.mvp': { val: "MVP (Producte Minim Viable)", es: "MVP (Producto Minimo Viable)", en: "MVP (Minimum Viable Product)" },
        'lean.mvp.text': { val: "La versio mes senzilla del producte que permet validar la hipotesi amb clients reals. No es un prototip: es un producte real, pero amb les funcionalitats minimes.", es: "La version mas sencilla del producto que permite validar la hipotesis con clientes reales. No es un prototipo: es un producto real, pero con las funcionalidades minimas.", en: "The simplest version of the product that allows you to validate the hypothesis with real customers. It's not a prototype: it's a real product, but with minimal features." },
        'lean.cicle': { val: "Cicle Build-Measure-Learn", es: "Ciclo Build-Measure-Learn", en: "Build-Measure-Learn Loop" },
        'lean.build': { val: "CONSTRUIR: Crea el MVP amb el minim esforc", es: "CONSTRUIR: Crea el MVP con el minimo esfuerzo", en: "BUILD: Create the MVP with minimum effort" },
        'lean.measure': { val: "MESURAR: Recull dades reals d'us i comportament", es: "MEDIR: Recoge datos reales de uso y comportamiento", en: "MEASURE: Collect real usage and behaviour data" },
        'lean.learn': { val: "APRENDRE: Analitza si la hipotesi es valida o no", es: "APRENDER: Analiza si la hipotesis es valida o no", en: "LEARN: Analyse whether the hypothesis is valid or not" },
        'lean.pivot': { val: "Pivot", es: "Pivote", en: "Pivot" },
        'lean.pivot.text': { val: "Un pivot es un canvi estrategic fonamental basat en l'aprenentatge validat. No es fracas: es aprenentatge. Instagram va ser primer Burbn (xarxa social de check-ins), Slack era un videojoc, YouTube era una web de cites.", es: "Un pivote es un cambio estrategico fundamental basado en el aprendizaje validado. No es fracaso: es aprendizaje. Instagram fue primero Burbn, Slack era un videojuego, YouTube era una web de citas.", en: "A pivot is a fundamental strategic change based on validated learning. It's not failure: it's learning. Instagram was first Burbn, Slack was a video game, YouTube was a dating site." },
        'lean.metriques': { val: "Metriques Pirata (AARRR)", es: "Metricas Pirata (AARRR)", en: "Pirate Metrics (AARRR)" },
        'lean.acquisition': { val: "Acquisition: Com arriben els usuaris?", es: "Acquisition: ¿Como llegan los usuarios?", en: "Acquisition: How do users arrive?" },
        'lean.activation': { val: "Activation: Tenen una primera bona experiencia?", es: "Activation: ¿Tienen una primera buena experiencia?", en: "Activation: Do they have a good first experience?" },
        'lean.retention': { val: "Retention: Tornen a usar-ho?", es: "Retention: ¿Vuelven a usarlo?", en: "Retention: Do they come back?" },
        'lean.revenue': { val: "Revenue: Paguen per aixo?", es: "Revenue: ¿Pagan por ello?", en: "Revenue: Do they pay for it?" },
        'lean.referral': { val: "Referral: Ho recomanen?", es: "Referral: ¿Lo recomiendan?", en: "Referral: Do they recommend it?" },

        // Unit 6: Pla d'Empresa
        'pla.title': { val: "El Pla d'Empresa", es: "El Plan de Empresa", en: "The Business Plan" },
        'pla.subtitle': { val: "El full de ruta per convertir una idea en realitat", es: "La hoja de ruta para convertir una idea en realidad", en: "The roadmap to turn an idea into reality" },
        'pla.why': { val: "El pla d'empresa es el document que demostra que la teua idea es viable. El necessites per demanar financament, convencer socis i, sobretot, per pensar a fons en cada aspecte del negoci abans de gastar-te els estalvis.", es: "El plan de empresa es el documento que demuestra que tu idea es viable. Lo necesitas para pedir financiacion, convencer socios y, sobre todo, para pensar a fondo en cada aspecto del negocio.", en: "The business plan is the document that proves your idea is viable. You need it to seek funding, convince partners, and above all, to think deeply about every aspect of the business." },

        'pla.s2': { val: "Analisi del Mercat", es: "Analisis del Mercado", en: "Market Analysis" },

        // Production theory
        'costos.produccio': { val: "Proces productiu", es: "Proceso productivo", en: "Production process" },
        'costos.produccio.desc': { val: "L'empresa combina factors de produccio (treball, capital, terra, tecnologia) per transformar-los en bens o serveis destinats al mercat.", es: "La empresa combina factores de produccion (trabajo, capital, tierra, tecnologia) para transformarlos en bienes o servicios destinados al mercado.", en: "The company combines factors of production (labour, capital, land, technology) to transform them into goods or services for the market." },
        'costos.eficiencia': { val: "Eficiencia tecnica vs economica", es: "Eficiencia tecnica vs economica", en: "Technical vs economic efficiency" },
        'costos.eficiencia.tecnica': { val: "Eficiencia tecnica: obtenir la maxima produccio amb els mateixos factors. Entre dues tecnologies amb els mateixos inputs, es tecnicament eficient la que produeix mes.", es: "Eficiencia tecnica: obtener la maxima produccion con los mismos factores. Entre dos tecnologias con los mismos inputs, es tecnicamente eficiente la que produce mas.", en: "Technical efficiency: maximum output with the same factors. Between two technologies with the same inputs, the one that produces more is technically efficient." },
        'costos.eficiencia.economica': { val: "Eficiencia economica: aconseguir la mateixa produccio amb el minim cost. De les opcions tecnicament eficients, es economicament eficient la mes barata.", es: "Eficiencia economica: conseguir la misma produccion con el minimo coste. De las opciones tecnicamente eficientes, es economicamente eficiente la mas barata.", en: "Economic efficiency: same output at minimum cost. Among technically efficient options, the cheapest is economically efficient." },
        'costos.productivitat': { val: "Productivitat", es: "Productividad", en: "Productivity" },
        'costos.productivitat.desc': { val: "Mesura l'eficiencia en l'us dels factors productius. Com mes alta, millor rendiment s'obte.", es: "Mide la eficiencia en el uso de los factores productivos. Cuanto mas alta, mejor rendimiento se obtiene.", en: "Measures efficiency in the use of productive factors. The higher, the better the yield." },
        'costos.pl': { val: "Productivitat del treball", es: "Productividad del trabajo", en: "Labour productivity" },
        'costos.pk': { val: "Productivitat del capital", es: "Productividad del capital", en: "Capital productivity" },
        'costos.cme': { val: "Cost mitja i marginal", es: "Coste medio y marginal", en: "Average and marginal cost" },
        'costos.cme.desc': { val: "El cost mitja (CMe) indica el cost per unitat produida. El cost marginal (CMg) indica quant augmenta el cost total en produir una unitat mes.", es: "El coste medio (CMe) indica el coste por unidad producida. El coste marginal (CMg) indica cuanto aumenta el coste total al producir una unidad mas.", en: "Average cost (AC) shows cost per unit produced. Marginal cost (MC) shows how much total cost increases when producing one more unit." },
        'costos.qbenefici': { val: "Quantitat per benefici concret", es: "Cantidad para beneficio concreto", en: "Quantity for target profit" },
        'costos.qbenefici.desc': { val: "Si vols obtenir un benefici (B) determinat, has de vendre aquesta quantitat:", es: "Si quieres obtener un beneficio (B) determinado, debes vender esta cantidad:", en: "If you want to earn a specific profit (B), you must sell this quantity:" },
        'costos.comprarvsproduir': { val: "Comprar vs Produir", es: "Comprar vs Producir", en: "Buy vs Produce" },
        'costos.comprarvsproduir.desc': { val: "Cost de compra (CC) = Preu compra x Q. Cost de produir (CP) = CF + CVu x Q. Es millor comprar si CC < CP, i produir si CP < CC. El punt d'equilibri es on CC = CP.", es: "Coste de compra (CC) = Precio compra x Q. Coste de producir (CP) = CF + CVu x Q. Es mejor comprar si CC < CP, y producir si CP < CC. El punto de equilibrio es donde CC = CP.", en: "Buying cost (BC) = Purchase price x Q. Production cost (PC) = FC + VCu x Q. Buy if BC < PC, produce if PC < BC. Equilibrium is where BC = PC." },
        'costos.inventaris': { val: "Valoracio d'inventaris: PMP vs FIFO", es: "Valoracion de inventarios: PMP vs FIFO", en: "Inventory valuation: WAC vs FIFO" },
        'costos.inventaris.pmp': { val: "PMP (Preu Mitja Ponderat): es calcula un cost mitja ponderat de totes les entrades d'existencies. Cada nova compra recalcula el preu mitja.", es: "PMP (Precio Medio Ponderado): se calcula un coste medio ponderado de todas las entradas de existencias. Cada nueva compra recalcula el precio medio.", en: "WAC (Weighted Average Cost): a weighted average cost of all inventory entries is calculated. Each new purchase recalculates the average price." },
        'costos.inventaris.fifo': { val: "FIFO (First In, First Out): les primeres unitats que entren son les primeres que surten. Les existencies finals es valoren al preu de les ultimes compres.", es: "FIFO (First In, First Out): las primeras unidades que entran son las primeras que salen. Las existencias finales se valoran al precio de las ultimas compras.", en: "FIFO (First In, First Out): first units in are first out. Ending inventory is valued at the most recent purchase prices." },

        // Financament expanded
        'financament.estructura': { val: "Estructura economica i financera", es: "Estructura economica y financiera", en: "Economic and financial structure" },
        'financament.estructura.desc': { val: "L'Actiu (bens i drets) es l'estructura economica: en que inverteix l'empresa. El Patrimoni Net + Passiu es l'estructura financera: d'on surten els diners per finançar eixes inversions. Sempre: Actiu = PN + Passiu.", es: "El Activo (bienes y derechos) es la estructura economica: en que invierte la empresa. El Patrimonio Neto + Pasivo es la estructura financiera: de donde salen los dineros para financiar esas inversiones. Siempre: Activo = PN + Pasivo.", en: "Assets (goods & rights) are the economic structure: what the company invests in. Equity + Liabilities are the financial structure: where the money comes from. Always: Assets = Equity + Liabilities." },
        'financament.autofinancament': { val: "Autofinançament", es: "Autofinanciacion", en: "Self-financing" },
        'financament.auto.enriquiment': { val: "Enriquiment: reserves (beneficis retinguts que augmenten el patrimoni net)", es: "Enriquecimiento: reservas (beneficios retenidos que aumentan el patrimonio neto)", en: "Enrichment: reserves (retained profits that increase equity)" },
        'financament.auto.manteniment': { val: "Manteniment: amortitzacions (fons per reposar actius desgastats) i provisions (fons per cobrir riscos futurs)", es: "Mantenimiento: amortizaciones (fondos para reponer activos desgastados) y provisiones (fondos para cubrir riesgos futuros)", en: "Maintenance: depreciation (funds to replace worn-out assets) and provisions (funds to cover future risks)" },
        'financament.auto.pros': { val: "Pros: independencia financera, sense cost financer, sense retorn obligat", es: "Pros: independencia financiera, sin coste financiero, sin retorno obligado", en: "Pros: financial independence, no financial cost, no obligatory return" },
        'financament.auto.contres': { val: "Contres: creixement lent, risc de perdre inversions rendibles, cost d'oportunitat", es: "Contras: crecimiento lento, riesgo de perder inversiones rentables, coste de oportunidad", en: "Cons: slow growth, risk of missing profitable investments, opportunity cost" },
        'financament.classificacio': { val: "Classificacio de fonts de financament", es: "Clasificacion de fuentes de financiacion", en: "Classification of funding sources" },
        'financament.criteri.titularitat': { val: "Per titularitat: Propia (capital, reserves) / Aliena (prestecs, credits)", es: "Por titularidad: Propia (capital, reservas) / Ajena (prestamos, creditos)", en: "By ownership: Own (capital, reserves) / External (loans, credits)" },
        'financament.criteri.origen': { val: "Per origen: Interna (autofinançament) / Externa (aportacions socis, deute)", es: "Por origen: Interna (autofinanciacion) / Externa (aportaciones socios, deuda)", en: "By origin: Internal (self-financing) / External (partner contributions, debt)" },
        'financament.criteri.durada': { val: "Per durada: Llarg termini (>1 any: prestecs, emprèstits) / Curt termini (<1 any: credit comercial, factoring)", es: "Por duracion: Largo plazo (>1 ano: prestamos, emprestitos) / Corto plazo (<1 ano: credito comercial, factoring)", en: "By duration: Long-term (>1 year: loans, bonds) / Short-term (<1 year: trade credit, factoring)" },
        'financament.emprestit': { val: "Emprèstits (bons i obligacions)", es: "Emprestitos (bonos y obligaciones)", en: "Bonds & debentures" },
        'financament.emprestit.desc': { val: "L'empresa emet titols de deute que compren els inversors. Rep diners ara i paga interessos (cupo) periodics + retorna el nominal al venciment. Nomes viable per a grans empreses.", es: "La empresa emite titulos de deuda que compran los inversores. Recibe dinero ahora y paga intereses (cupon) periodicos + retorna el nominal al vencimiento. Solo viable para grandes empresas.", en: "The company issues debt securities bought by investors. It receives money now and pays periodic interest (coupon) + returns the nominal at maturity. Only viable for large companies." },
        'financament.leasing.vs.renting': { val: "Leasing vs Renting", es: "Leasing vs Renting", en: "Leasing vs Renting" },
        'financament.leasing.det': { val: "Leasing: SI opcio de compra al final del contracte. NO inclou manteniment. L'actiu apareix al balanc. Ideal per adquirir maquinaria o vehicles.", es: "Leasing: SI opcion de compra al final del contrato. NO incluye mantenimiento. El activo aparece en el balance. Ideal para adquirir maquinaria o vehiculos.", en: "Leasing: YES purchase option at contract end. NO maintenance included. Asset appears on balance sheet. Ideal for acquiring machinery or vehicles." },
        'financament.renting.det': { val: "Renting: NO opcio de compra. SI inclou manteniment, assegurança i reparacions. No apareix al balanc (despesa). Ideal per a vehicles de flota o equips tecnologics.", es: "Renting: NO opcion de compra. SI incluye mantenimiento, seguro y reparaciones. No aparece en el balance (gasto). Ideal para vehiculos de flota o equipos tecnologicos.", en: "Renting: NO purchase option. YES includes maintenance, insurance and repairs. Not on balance sheet (expense). Ideal for fleet vehicles or tech equipment." },
        'financament.credit.vs.prestec': { val: "Credit bancari vs Prestec", es: "Credito bancario vs Prestamo", en: "Credit facility vs Loan" },
        'financament.credit.vs.prestec.desc': { val: "Prestec: reps tot el capital d'un cop i pagues interessos sobre el TOTAL. Credit (polissa): tens un limit i nomes pagues interessos sobre el que DISPOSES. El credit es mes flexible pero sol tenir comissions.", es: "Prestamo: recibes todo el capital de una vez y pagas intereses sobre el TOTAL. Credito (poliza): tienes un limite y solo pagas intereses sobre lo que DISPONES. El credito es mas flexible pero suele tener comisiones.", en: "Loan: receive all capital at once, pay interest on the TOTAL. Credit facility: you have a limit and only pay interest on what you DRAW. Credit is more flexible but usually has fees." },
        'financament.credit.comercial': { val: "Credit comercial: GRATUÏT", es: "Credito comercial: GRATUITO", en: "Trade credit: FREE" },
        'financament.credit.comercial.desc': { val: "Ajornament del pagament als proveïdors (30-90 dies). No te cost financer explicit — es l'unica font de financament gratis. Pero perdre descomptes per pagament immediat pot ser un cost ocult.", es: "Aplazamiento del pago a proveedores (30-90 dias). No tiene coste financiero explicito — es la unica fuente de financiacion gratis. Pero perder descuentos por pronto pago puede ser un coste oculto.", en: "Deferring supplier payments (30-90 days). No explicit financial cost — it's the only free funding source. But losing early payment discounts can be a hidden cost." },
        'financament.descompte': { val: "Descompte comercial i efectes", es: "Descuento comercial y efectos", en: "Bill discounting" },
        'financament.descompte.desc': { val: "Portar al banc lletres de canvi o pagares ABANS del venciment. El banc t'avanca els diners descomptant-ne un interes. Si el client no paga, tu respons.", es: "Llevar al banco letras de cambio o pagares ANTES del vencimiento. El banco te adelanta el dinero descontando un interes. Si el cliente no paga, tu respondes.", en: "Taking bills of exchange to the bank BEFORE maturity. The bank advances the money minus interest. If the client doesn't pay, you're liable." },
        'financament.factoring.det': { val: "Factoring: vens les factures pendents a una empresa de factoring. Cobres ja (menys una comissio). Pot ser sense recurs (el factor assumeix l'impagament) o amb recurs (tu respons).", es: "Factoring: vendes las facturas pendientes a una empresa de factoring. Cobras ya (menos una comision). Puede ser sin recurso (el factor asume el impago) o con recurso (tu respondes).", en: "Factoring: sell outstanding invoices to a factoring company. Get paid now (minus a fee). Can be non-recourse (factor bears default risk) or with recourse (you're liable)." },
        'financament.confirming.det': { val: "Confirming: el banc gestiona els pagaments als teus proveïdors i els ofereix cobrar abans del venciment. Tu pagues al banc al venciment. Millora la relacio amb proveïdors.", es: "Confirming: el banco gestiona los pagos a tus proveedores y les ofrece cobrar antes del vencimiento. Tu pagas al banco al vencimiento. Mejora la relacion con proveedores.", en: "Confirming: the bank manages payments to your suppliers and offers them early payment. You pay the bank at maturity. Improves supplier relationships." },
        'financament.alternatives': { val: "Fonts alternatives de financament", es: "Fuentes alternativas de financiacion", en: "Alternative funding sources" },
        'financament.alt.angels': { val: "Business angels: inversors privats que aporten capital + experiencia en fases inicials (seed). Solen demanar entre 5-25% del capital.", es: "Business angels: inversores privados que aportan capital + experiencia en fases iniciales (seed). Suelen pedir entre 5-25% del capital.", en: "Business angels: private investors providing capital + experience in early stages (seed). Usually ask for 5-25% equity." },
        'financament.alt.crowdfunding': { val: "Crowdfunding: financament col·lectiu. Recompensa (Kickstarter), donacio, equity (participacio), o immobiliari.", es: "Crowdfunding: financiacion colectiva. Recompensa (Kickstarter), donacion, equity (participacion), o inmobiliario.", en: "Crowdfunding: collective financing. Reward (Kickstarter), donation, equity, or real estate." },
        'financament.alt.crowdlending': { val: "Crowdlending: prestecs entre particulars (P2P) a traves de plataformes online. Tipus d'interes sol ser major que al banc.", es: "Crowdlending: prestamos entre particulares (P2P) a traves de plataformas online. El tipo de interes suele ser mayor que en el banco.", en: "Crowdlending: peer-to-peer (P2P) lending via online platforms. Interest rates are usually higher than banks." },
        'financament.alt.capitalrisc': { val: "Capital risc (Venture Capital): fons d'inversio especialitzats en startups amb alt potencial de creixement. Aporten grans sumes a canvi de participacio significativa.", es: "Capital riesgo (Venture Capital): fondos de inversion especializados en startups con alto potencial de crecimiento. Aportan grandes sumas a cambio de participacion significativa.", en: "Venture Capital: investment funds specialised in high-growth startups. They provide large sums in exchange for significant equity." },
        'financament.alt.acceleradores': { val: "Acceleradores i incubadores: programes que ofereixen mentoria, espai i financament inicial a canvi de participacio. Ex: Y Combinator, Lanzadera, SeedRocket.", es: "Aceleradoras e incubadoras: programas que ofrecen mentoria, espacio y financiacion inicial a cambio de participacion. Ej: Y Combinator, Lanzadera, SeedRocket.", en: "Accelerators & incubators: programmes offering mentoring, space and initial funding for equity. E.g.: Y Combinator, Lanzadera, SeedRocket." },

        // Unit 10: Inversio
        'inversio.title': { val: "Inversio", es: "Inversion", en: "Investment" },
        'inversio.subtitle': { val: "Val la pena aquest projecte?", es: "¿Vale la pena este proyecto?", en: "Is this project worth it?" },
        'inversio.why': { val: "Imagina que tens 100.000EUR i dues opcions d'inversio. Com decideixes? Amb eines matematiques: VAN, TIR i Payback. Son els tres criteris que utilitzen totes les empreses del mon per decidir si un projecte es rendible.", es: "Imagina que tienes 100.000EUR y dos opciones de inversion. ¿Como decides? Con herramientas matematicas: VAN, TIR y Payback. Son los tres criterios que usan todas las empresas del mundo.", en: "Imagine you have EUR100,000 and two investment options. How do you decide? With mathematical tools: NPV, IRR and Payback. These are the three criteria all companies worldwide use." },
        'inversio.tab.teoria': { val: "Teoria", es: "Teoria", en: "Theory" },

        // Inversio expanded
        'inversio.classificacio': { val: "Classificacio d'inversions", es: "Clasificacion de inversiones", en: "Investment classification" },
        'inversio.class.actius': { val: "Per actius: Reals (maquinaria, edificis) / Financeres (accions, bons)", es: "Por activos: Reales (maquinaria, edificios) / Financieras (acciones, bonos)", en: "By assets: Real (machinery, buildings) / Financial (shares, bonds)" },
        'inversio.class.temps': { val: "Per temps: Llarg termini (immobilitzat) / Curt termini (actiu corrent)", es: "Por tiempo: Largo plazo (inmovilizado) / Corto plazo (activo corriente)", en: "By time: Long-term (fixed assets) / Short-term (current assets)" },

        'inversio.class.relacio': { val: "Per relacio: Substitutives (una o l'altra) / Complementaries (millor juntes) / Independents", es: "Por relacion: Sustitutivas (una u otra) / Complementarias (mejor juntas) / Independientes", en: "By relationship: Substitute (one or the other) / Complementary (better together) / Independent" },

        'inversio.elem.a': { val: "A (desemborsament inicial): capital que es paga al principi per adquirir l'actiu", es: "A (desembolso inicial): capital que se paga al principio para adquirir el activo", en: "A (initial outlay): capital paid at the start to acquire the asset" },
        'inversio.elem.n': { val: "N (durada): nombre d'anys que dura la inversio", es: "N (duracion): numero de anos que dura la inversion", en: "N (duration): number of years the investment lasts" },
        'inversio.elem.fnc': { val: "Qn o FNC (fluxos nets de caixa): cobraments - pagaments de cada any. FNC = Ingressos - Despeses (de cada periode)", es: "Qn o FNC (flujos netos de caja): cobros - pagos de cada ano. FNC = Ingresos - Gastos (de cada periodo)", en: "Qn or NCF (net cash flows): collections - payments each year. NCF = Income - Expenses (per period)" },
        'inversio.elem.vr': { val: "VR (valor residual): valor de l'actiu al final de la seua vida util. S'afig a l'ultim flux de caixa.", es: "VR (valor residual): valor del activo al final de su vida util. Se anade al ultimo flujo de caja.", en: "RV (residual value): asset value at end of useful life. Added to the last cash flow." },
        'inversio.payback.detall': { val: "Payback detallat", es: "Payback detallado", en: "Detailed Payback" },
        'inversio.payback.detall.desc': { val: "S'acumulen els FNC any a any fins igualar el desemborsament inicial (A). Si no es recupera en un any exacte, es fa regla de 3 per calcular la fraccio d'any: anys complets + (quantitat pendent / FNC de l'any seguent).", es: "Se acumulan los FNC ano a ano hasta igualar el desembolso inicial (A). Si no se recupera en un ano exacto, se hace regla de 3 para calcular la fraccion de ano: anos completos + (cantidad pendiente / FNC del ano siguiente).", en: "Accumulate NCFs year by year until they equal the initial outlay (A). If not recovered in an exact year, use interpolation: full years + (remaining amount / next year's NCF)." },
        'inversio.cicles': { val: "Cicles de l'empresa", es: "Ciclos de la empresa", en: "Business cycles" },

        'inversio.cicle.curt': { val: "Cicle curt (d'explotacio): compra de materies primeres, produccio, venda i cobrament. Es repeteix continuament. Dura dies/mesos.", es: "Ciclo corto (de explotacion): compra de materias primas, produccion, venta y cobro. Se repite continuamente. Dura dias/meses.", en: "Short cycle (operating): purchase of raw materials, production, sale and collection. Repeats continuously. Lasts days/months." },

        'inversio.pmm.desc': { val: "Temps que tarda l'empresa a recuperar cada euro invertit en el cicle d'explotacio. Compta 5 subperiodes:", es: "Tiempo que tarda la empresa en recuperar cada euro invertido en el ciclo de explotacion. Cuenta 5 subperiodos:", en: "Time for the company to recover each euro invested in the operating cycle. It has 5 sub-periods:" },

            const mc = preu - cv;
            const qEq = mc > 0 ? cf / mc : 0;
            const it = preu * q;
            const ct = cf + cv * q;
            const benefici = it - ct;
            const margeSeguretat = q > 0 && qEq > 0 ? (((q - qEq) / q) * 100) : 0;
            return { mc, qEq: Math.round(qEq), it, ct, benefici, margeSeguretat: margeSeguretat.toFixed(1) };

        // SVG Graph component

            const width = 500;
            const height = 300;
            const padding = 50;
            const maxQ = Math.max(calc.qEq * 2, q * 1.5, 2000);
            const maxY = Math.max(cf + cv * maxQ, preu * maxQ, 150000);

            const scaleX = (val) => padding + (val / maxQ) * (width - padding * 2);
            const scaleY = (val) => height - padding - (val / maxY) * (height - padding * 2);

            const cfLine = `M ${scaleX(0)} ${scaleY(cf)} L ${scaleX(maxQ)} ${scaleY(cf)}`;
            const ctLine = `M ${scaleX(0)} ${scaleY(cf)} L ${scaleX(maxQ)} ${scaleY(cf + cv * maxQ)}`;
            const itLine = `M ${scaleX(0)} ${scaleY(0)} L ${scaleX(maxQ)} ${scaleY(preu * maxQ)}`;

            return (
                <svg viewBox={`0 0 ${width} ${height}`} className="w-full max-w-lg mx-auto">
                    {/* Axes */}
                    <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="#94a3b8" strokeWidth="2" />
                    <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="#94a3b8" strokeWidth="2" />

                    {/* Axis labels */}
                    <text x={width / 2} y={height - 10} textAnchor="middle" className="text-xs fill-slate-500">{t('costos.sim.quantitat.label')}</text>
                    <text x={15} y={height / 2} textAnchor="middle" transform={`rotate(-90, 15, ${height/2})`} className="text-xs fill-slate-500">EUR</text>

                    {/* CF line (horizontal) */}
                    <path d={cfLine} stroke="#f59e0b" strokeWidth="2" strokeDasharray="5,5" fill="none" />
                    <text x={width - padding + 5} y={scaleY(cf)} className="text-xs fill-amber-600">CF</text>

                    {/* CT line (rising) */}
                    <path d={ctLine} stroke="#ef4444" strokeWidth="3" fill="none" />
                    <text x={width - padding + 5} y={scaleY(cf + cv * maxQ) - 10} className="text-xs fill-red-600">CT</text>

                    {/* IT line (rising from 0) */}
                    <path d={itLine} stroke="#22c55e" strokeWidth="3" fill="none" />
                    <text x={width - padding + 5} y={scaleY(preu * maxQ) + 15} className="text-xs fill-green-600">IT</text>

                    {/* Break-even point */}
                    {calc.qEq > 0 && calc.qEq < maxQ && (
                        <>
                            <circle cx={scaleX(calc.qEq)} cy={scaleY(preu * calc.qEq)} r="8" fill="#3b82f6" />
                            <line x1={scaleX(calc.qEq)} y1={scaleY(preu * calc.qEq)} x2={scaleX(calc.qEq)} y2={height - padding} stroke="#3b82f6" strokeWidth="1" strokeDasharray="3,3" />
                            <text x={scaleX(calc.qEq)} y={height - padding + 15} textAnchor="middle" className="text-xs font-bold fill-blue-600">Q* = {calc.qEq}</text>
                        </>
                    )}

                    {/* Loss / profit zones */}
                    {calc.qEq > 0 && (
                        <>
                            <text x={scaleX(calc.qEq / 2)} y={scaleY(cf / 2)} textAnchor="middle" className="text-sm font-bold fill-red-500">{t('costos.sim.perdues')}</text>
                            <text x={scaleX(Math.min(calc.qEq * 1.5, maxQ * 0.8))} y={scaleY(preu * calc.qEq * 1.3)} textAnchor="middle" className="text-sm font-bold fill-green-500">{t('costos.sim.beneficis')}</text>
                        </>
                    )}

                    {/* Legend */}
                    <rect x={padding} y={10} width="15" height="3" fill="#22c55e" />
                    <text x={padding + 20} y={15} className="text-xs fill-slate-600">{t('costos.sim.it.label')}</text>
                    <rect x={padding + 120} y={10} width="15" height="3" fill="#ef4444" />
                    <text x={padding + 140} y={15} className="text-xs fill-slate-600">{t('costos.sim.ct.label')}</text>
                    <rect x={padding + 240} y={10} width="15" height="3" fill="#f59e0b" strokeDasharray="5,5" />
                    <text x={padding + 260} y={15} className="text-xs fill-slate-600">{t('costos.sim.cf.label')}</text>
                </svg>
            );
        };

                                    <ResultCard title={t('costos.sim.ct')} value={calc.ct.toLocaleString() + "EUR"} color="red" subtitle="CF + CVu x Q" />
                                    <ResultCard title={t('costos.sim.resultat')} value={calc.benefici.toLocaleString() + "EUR"} color={calc.benefici >= 0 ? "green" : "red"} subtitle={calc.benefici >= 0 ? t('costos.sim.benefici') : t('costos.sim.perdua')} />
                                    <ResultCard title={t('costos.sim.ms')} value={calc.margeSeguretat + "%"} color={parseFloat(calc.margeSeguretat) > 20 ? "green" : "amber"} />
                                </div>
                            </div>
                        </Card>

                        <Card title={t('costos.sim.grafica')} icon="📊">

                                <p className="text-sm text-slate-600">

                                </p>

        const [tab, setTab] = useState('teoria');
        const [inv, setInv] = useState(100000);
        const [fc, setFC] = useState(30000);
        const [anys, setAnys] = useState(5);
        const [taxa, setTaxa] = useState(10);

        const calc = useMemo(() => {
            const k = taxa / 100;

            // VAN = -I0 + sum of FC/(1+k)^n
            let van = -inv;
            for (let n = 1; n <= anys; n++) {
                van += fc / Math.pow(1 + k, n);
            }

            // TIR (Newton-Raphson approximation) - find rate where VAN=0
            let tir = 0;
            for (let r = 0; r <= 200; r += 0.25) {
                const rDec = r / 100;
                let vanTest = -inv;
                for (let n = 1; n <= anys; n++) {
                    vanTest += fc / Math.pow(1 + rDec, n);
                }
                if (vanTest < 0) {
                    tir = r - 0.25;
                    break;
                }
            }

            // Payback = I0 / FC (simple for constant annual flows)
            const payback = fc > 0 ? inv / fc : -1;

            return {
                van: van.toFixed(0),
                tir: tir.toFixed(1),
                payback: payback > 0 ? payback.toFixed(2) : -1
            };
        }, [inv, fc, anys, taxa]);

                                    <div className="grid grid-cols-3 gap-3">
                                        <ResultCard title={t('analisi.calc.liquiditat')} value={calc.liquiditat.toFixed(2)} color={getColor(calc.liquiditat, 1.5, 2)} subtitle="AC / PC" />
                                        <ResultCard title={t('analisi.calc.tresoreria')} value={calc.tresoreria.toFixed(2)} color={getColor(calc.tresoreria, 0.8, 1)} subtitle="(R+D) / PC" />
                                        <ResultCard title={t('analisi.calc.disponibilitat')} value={calc.disponibilitat.toFixed(2)} color={getColor(calc.disponibilitat, 0.1, 0.3)} subtitle="D / PC" />
                                    </div>
                                    <ResultCard title={t('analisi.calc.endeutament')} value={calc.endeutament.toFixed(2)} color={getColor(calc.endeutament, 0.4, 0.6)} subtitle="PT / (PN + PT)" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <ResultCard title={t('analisi.calc.re')} value={calc.re.toFixed(1) + "%"} color={calc.re > 5 ? "green" : "amber"} subtitle="BAII / AT x 100" />
                                        <ResultCard title={t('analisi.calc.rf')} value={calc.rf.toFixed(1) + "%"} color={calc.rf > 8 ? "green" : "amber"} subtitle="BN / PN x 100" />
                                    </div>
                                </div>
                            </div>
                        </Card>
                    </div>
                )}
            </div>
        );
    };

    // ========================================================================
    // UNIT 12: Marketing
    // ========================================================================
    const Marketing = () => {
        const [tab, setTab] = useState('investigacio');

        return (
            <div className="space-y-6">
                <SectionTitle icon="📣" title={t('marketing.title')} subtitle={t('marketing.subtitle')} />
                <WhyImportant>{t('marketing.why')}</WhyImportant>

                <Tabs tabs={[
                    { id: 'investigacio', label: t('marketing.tab.investigacio') },
                    { id: 'segmentacio', label: t('marketing.tab.segmentacio') },
                    { id: 'mix', label: t('marketing.tab.mix') },
                ]} active={tab} onChange={setTab} />

                {tab === 'investigacio' && (
                    <Card title={t('marketing.investigacio')} icon="🔍">
                        <TheoryBlock color="blue">
                            <p>{t('marketing.investigacio.desc')}</p>
                        </TheoryBlock>
                    </Card>
                )}

                {tab === 'segmentacio' && (
                    <div className="space-y-6">
                        <Card title={t('marketing.segmentacio.title')} icon="🎯">
                            <TheoryBlock color="green">
                                <p>{t('marketing.segmentacio.desc')}</p>
                            </TheoryBlock>
                            <div className="grid md:grid-cols-2 gap-3 mt-4">
                                {['demografic', 'geografic', 'psicografic', 'conductual'].map((s, i) => (
                                    <div key={s} className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                                        <span className="text-lg">{['👥', '🌍', '🧠', '🛒'][i]}</span>
                                        <p className="text-sm text-slate-700 mt-1">{t('marketing.seg.' + s)}</p>
                                    </div>
                                ))}
                            </div>
                        </Card>

                        <Card title={t('marketing.posicionament')} icon="📍">
                            <TheoryBlock color="violet">
                                <p>{t('marketing.posicionament.desc')}</p>
                            </TheoryBlock>
                        </Card>
                    </div>
                )}

                {tab === 'mix' && (
                    <Card title={t('marketing.4p')} icon="🔄">
                        <div className="grid md:grid-cols-2 gap-4">
                            {[
                                { key: 'producte', emoji: '📦', color: 'blue' },
                                { key: 'preu', emoji: '💰', color: 'green' },
                                { key: 'distribucio', emoji: '🚚', color: 'amber' },
                                { key: 'comunicacio', emoji: '📢', color: 'pink' },
                            ].map(item => (
                                <TheoryBlock key={item.key} title={item.emoji + ' ' + t('marketing.' + item.key)} color={item.color}>
                                    <p>{t('marketing.' + item.key + '.desc')}</p>
                                </TheoryBlock>
                            ))}
                        </div>
                    </Card>
                )}
            </div>
        );
    };

    // ========================================================================
    // NAVIGATION AND RENDER
    // ========================================================================
    const headerSections = [
        { id: 'emprenedor', label: t('sec.emprenedor'), emoji: '🚀' },
        { id: 'empresa', label: t('sec.empresa'), emoji: '🏢' },
        { id: 'entorn', label: t('sec.entorn'), emoji: '🌍' },
        { id: 'rsc', label: t('sec.rsc'), emoji: '🌱' },
        { id: 'creixement', label: t('sec.creixement'), emoji: '📈' },
        { id: 'canvas', label: 'Canvas', emoji: '📋' },
        { id: 'lean', label: 'Lean', emoji: '🚀' },
        { id: 'pla', label: t('sec.pla'), emoji: '📝' },
        { id: 'costos', label: t('sec.costos'), emoji: '💰' },
        { id: 'rrhh', label: t('sec.rrhh'), emoji: '👥' },
        { id: 'financament', label: t('sec.financament'), emoji: '🏦' },
        { id: 'inversio', label: t('sec.inversio'), emoji: '📈' },
        { id: 'comptabilitat', label: t('sec.comptabilitat'), emoji: '📒' },
        { id: 'analisi', label: t('sec.analisi'), emoji: '📊' },
        { id: 'marketing', label: t('sec.marketing'), emoji: '📣' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}
                setIdioma={setIdioma}
                currentApp="edmn-2bach"
                sections={headerSections}
                currentSection={section}
                setSection={setSection}
            />

            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}
                {section === 'emprenedor' && <Emprenedor />}
                {section === 'empresa' && <Empresa />}
                {section === 'entorn' && <Entorn />}
                {section === 'rsc' && <RSC />}
                {section === 'creixement' && <Creixement />}
                {section === 'canvas' && <Canvas />}
                {section === 'lean' && <Lean />}
                {section === 'pla' && <Pla />}
                {section === 'costos' && <Costos />}
                {section === 'rrhh' && <RRHH />}
                {section === 'financament' && <Financament />}
                {section === 'inversio' && <Inversio />}
                {section === 'comptabilitat' && <Comptabilitat />}
                {section === 'analisi' && <Analisi />}
                {section === 'marketing' && <Marketing />}
            </main>

            <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
            <PdeFooter appEmoji="💼" appName={t('footer.appname')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<EdmnApp />, document.getElementById('root'));
    </script>
</body>
</html>
