function StonksApp() {
    const [phase, setPhase] = useState('lobby'); // lobby, playing, results
    const [gameInfo, setGameInfo] = useState(null); // { roomCode, playerId, isHost, players }
    const [meta, setMeta] = useState({});
    const [players, setPlayers] = useState({});
    const [gameState, setGameState] = useState({});
    var [idioma, setIdioma] = useState(PdeLanguageStore.get());
    var t = function(key) { return STONKS_TRANSLATIONS[key]?.[idioma] || STONKS_TRANSLATIONS[key]?.val || key; };

    // Init Firebase
    useEffect(function() { if (PdeFirebase.isConfigured()) PdeFirebase.init(); }, []);

    // Subscribe to room data once game starts
    useEffect(function() {
        if (!gameInfo) return;
        var unsub1 = PdeRoomManager.onPlayersChange(gameInfo.roomCode, setPlayers);
        var unsub2 = PdeRoomManager.onGameStateChange(gameInfo.roomCode, setGameState);
        var unsub3 = PdeRoomManager.onMetaChange(gameInfo.roomCode, setMeta);
        return function() { unsub1(); unsub2(); unsub3(); };
    }, [gameInfo?.roomCode]);

    // Listen for game start (player side)
    useEffect(function() {
        if (meta.status === 'playing' && phase === 'lobby') {
            setPhase('playing');
        }
    }, [meta.status]);

    // Check if Firebase is configured (after all hooks)
    if (!PdeFirebase.isConfigured()) {
        return <PdeFirebaseError />;
    }

    var handleGameStart = function(info) {
        setGameInfo(info);
        setPhase('playing');

        // Host: initialize game state
        if (info.isHost) {
            var startYear = 2000;
            var totalRounds = 20;
            var incomePerRound = 3000;

            // Initialize each player's portfolio
            var playerUpdates = {};
            Object.keys(info.players).forEach(function(pid) {
                playerUpdates[pid] = {
                    ...info.players[pid],
                    data: {
                        cash: 5000,
                        portfolio: { savings: 0, deposit: 0, ibex35: 0, sp500: 0, bonds: 0, gold: 0, bitcoin: 0, realestate: 0 },
                        history: [{ year: startYear - 1, netWorth: 5000 }],
                        lifeEvent: null,
                        submitted: false,
                        allocation: null
                    }
                };
            });

            // Add AI opponent "El Mercat" (benchmark: DCA into index funds)
            playerUpdates['__ai_market__'] = {
                name: '📈 El Mercat (IA)',
                connected: true,
                isAI: true,
                score: 0,
                data: {
                    cash: 5000,
                    portfolio: { savings: 0, deposit: 0, ibex35: 0, sp500: 0, bonds: 0, gold: 0, bitcoin: 0, realestate: 0 },
                    history: [{ year: startYear - 1, netWorth: 5000 }],
                    lifeEvent: null,
                    submitted: true,
                    allocation: null
                }
            };

            PdeFirebase.ref('rooms/' + info.roomCode + '/players').set(playerUpdates);
            PdeRoomManager.setGameState(info.roomCode, {
                round: 0,
                totalRounds: totalRounds,
                phase: 'news', // news -> allocate -> results -> (repeat)
                currentYear: startYear,
                startYear: startYear,
                incomePerRound: incomePerRound,
                finished: false,
                unlockedAssets: ['savings', 'deposit'],
                newUnlocks: null
            });
        }
    };

    // ── Lobby phase ──
    if (phase === 'lobby') {
        return (
            <div>
                <div style={{position:'fixed',top:12,right:12,zIndex:9999,display:'flex',gap:4}}>
                    {['val','es','en'].map(function(l) {
                        return <button key={l} onClick={function(){setIdioma(l);PdeLanguageStore.set(l);}}
                            style={{padding:'4px 10px',borderRadius:8,fontSize:13,fontWeight:idioma===l?800:500,
                                background:idioma===l?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.2)',
                                color:idioma===l?'#1a1a2e':'white',border:'none',cursor:'pointer'}}>
                            {l.toUpperCase()}
                        </button>;
                    })}
                </div>
                <PdeGameLobby
                    gameType="stonks"
                    gameName="STONKS 📈"
                    gameEmoji="📈"
                    gameGradient="from-emerald-500 to-teal-600"
                    minPlayers={2}
                    maxPlayers={30}
                    onGameStart={handleGameStart}
                />
            </div>
        );
    }

    // ── Game phase ──
    if (phase === 'playing' && gameInfo) {
        if (gameInfo.isHost) {
            return <StonksHost roomCode={gameInfo.roomCode} playerId={gameInfo.playerId}
                players={players} gameState={gameState} idioma={idioma} />;
        } else {
            return <StonksPlayer roomCode={gameInfo.roomCode} playerId={gameInfo.playerId}
                players={players} gameState={gameState} idioma={idioma} />;
        }
    }

    return null;
}


// ═══════════════════════════════════════════════════════════════
// STONKS HOST VIEW (projected on classroom screen)
// ═══════════════════════════════════════════════════════════════
function StonksHost({ roomCode, playerId, players, gameState, idioma }) {
    var t = function(key) { return STONKS_TRANSLATIONS[key]?.[idioma] || STONKS_TRANSLATIONS[key]?.val || key; };
    var tAsset = function(key) { return STONKS_DATA.assetNames[key]?.[idioma] || STONKS_DATA.assetNames[key]?.val || key; };
    var tInfo = function(key) { return STONKS_DATA.assetInfo[key]?.[idioma] || STONKS_DATA.assetInfo[key]?.val || ''; };
    const [showConfetti, setShowConfetti] = useState(false);

    var gs = gameState || {};
    var year = gs.currentYear || 2000;
    var round = gs.round || 0;
    var totalRounds = gs.totalRounds || 20;
    var phase = gs.phase || 'news';
    var yearEvent = STONKS_DATA.events[year];
    var yearIndex = STONKS_DATA.years.indexOf(year);

    // Count submitted players (exclude AI from submission count)
    var playerList = Object.entries(players || {}).filter(function(e) { return e[1].connected !== false; });
    var humanPlayers = playerList.filter(function(e) { return e[0] !== '__ai_market__'; });
    var submittedCount = humanPlayers.filter(function(e) { return e[1].data?.submitted; }).length;

    // Calculate net worths for leaderboard
    var leaderboard = playerList.map(function(entry) {
        var p = entry[1];
        var d = p.data || {};
        var portfolioValue = 0;
        if (d.portfolio) {
            Object.entries(d.portfolio).forEach(function(pEntry) {
                portfolioValue += pEntry[1] || 0;
            });
        }
        return { id: entry[0], name: p.name, netWorth: (d.cash || 0) + portfolioValue };
    }).sort(function(a, b) { return b.netWorth - a.netWorth; });

    // Advance to next phase
    var advancePhase = function() {
        if (phase === 'news') {
            // Check for new asset unlocks
            var currentUnlocked = gs.unlockedAssets || ['savings', 'deposit'];
            var newUnlocks = [];
            Object.entries(STONKS_DATA.unlockSchedule).forEach(function(entry) {
                var unlockRound = parseInt(entry[0]);
                var assets = entry[1];
                if (round >= unlockRound) {
                    assets.forEach(function(a) {
                        if (currentUnlocked.indexOf(a) === -1) {
                            currentUnlocked.push(a);
                            newUnlocks.push(a);
                        }
                    });
                }
            });

            // Give income to all players
            var updates = {};
            playerList.forEach(function(entry) {
                var pid = entry[0];
                var d = entry[1].data || {};
                var newCash = (d.cash || 0) + (gs.incomePerRound || 3000);
                updates['players/' + pid + '/data/cash'] = newCash;
                updates['players/' + pid + '/data/submitted'] = pid === '__ai_market__'; // AI is always "submitted"
                updates['players/' + pid + '/data/allocation'] = null;
                updates['players/' + pid + '/data/lifeEvent'] = null;
            });

            // AI strategy: DCA into index funds (50% SP500, 30% IBEX35, 20% bonds — or best available)
            var aiAlloc = { cash: 0 };
            if (currentUnlocked.indexOf('sp500') !== -1) {
                aiAlloc = { cash: 5, savings: 0, deposit: 0, sp500: 50, ibex35: 25, bonds: 15, gold: 5 };
            } else if (currentUnlocked.indexOf('deposit') !== -1) {
                aiAlloc = { cash: 10, savings: 30, deposit: 60 };
            }
            // Ensure total is 100
            var aiTotal = Object.values(aiAlloc).reduce(function(s,v){return s+v;}, 0);
            if (aiTotal < 100) aiAlloc.cash = (aiAlloc.cash || 0) + (100 - aiTotal);
            updates['players/__ai_market__/data/allocation'] = aiAlloc;
            updates['players/__ai_market__/data/submitted'] = true;

            updates['gameState/phase'] = 'allocate';
            updates['gameState/unlockedAssets'] = currentUnlocked;
            updates['gameState/newUnlocks'] = newUnlocks.length > 0 ? newUnlocks : null;
            PdeFirebase.ref('rooms/' + roomCode).update(updates);
        } else if (phase === 'allocate') {
            // Apply returns for the year
            applyReturns();
        } else if (phase === 'results') {
            if (round >= totalRounds - 1) {
                // Game over
                PdeRoomManager.updateGameState(roomCode, { phase: 'finished', finished: true });
                setShowConfetti(true);
                PdeGameSounds.play('win');
            } else {
                // Next round
                var nextYear = STONKS_DATA.years[yearIndex + 1];
                PdeRoomManager.updateGameState(roomCode, {
                    round: round + 1,
                    currentYear: nextYear,
                    phase: 'news'
                });
            }
        }
    };

    var applyReturns = function() {
        var updates = {};

        playerList.forEach(function(entry) {
            var pid = entry[0];
            var d = entry[1].data || {};
            var portfolio = { ...(d.portfolio || {}) };
            var cash = d.cash || 0;

            // Apply allocation if submitted
            if (d.allocation) {
                // Reset portfolio and reallocate from cash + current portfolio total
                var totalValue = cash;
                Object.values(portfolio).forEach(function(v) { totalValue += v || 0; });

                Object.keys(portfolio).forEach(function(k) { portfolio[k] = 0; });
                cash = 0;

                Object.entries(d.allocation).forEach(function(allocEntry) {
                    var asset = allocEntry[0], pct = allocEntry[1];
                    if (asset === 'cash') {
                        cash = Math.round(totalValue * pct / 100);
                    } else {
                        portfolio[asset] = Math.round(totalValue * pct / 100);
                    }
                });
            }

            // Apply returns for the year
            Object.entries(portfolio).forEach(function(pEntry) {
                var asset = pEntry[0], value = pEntry[1];
                if (!value || value <= 0) return;
                var returnRate = STONKS_DATA.assets[asset]?.returns[yearIndex];
                if (returnRate == null) return; // null = asset doesn't exist yet (bitcoin)
                portfolio[asset] = Math.round(value * (1 + returnRate / 100));
                if (portfolio[asset] < 0) portfolio[asset] = 0;
            });

            // Random life event (30% chance)
            var lifeEvent = null;
            if (Math.random() < 0.3) {
                lifeEvent = STONKS_DATA.lifeEvents[Math.floor(Math.random() * STONKS_DATA.lifeEvents.length)];
                if (lifeEvent.cost) cash = Math.max(0, cash - lifeEvent.cost);
                if (lifeEvent.income) cash += lifeEvent.income;
            }

            // Calculate net worth
            var portfolioValue = 0;
            Object.values(portfolio).forEach(function(v) { portfolioValue += v || 0; });
            var netWorth = cash + portfolioValue;

            var history = d.history ? [...d.history] : [];
            history.push({ year: year, netWorth: netWorth });

            updates['players/' + pid + '/data'] = {
                cash: cash,
                portfolio: portfolio,
                history: history,
                lifeEvent: lifeEvent,
                submitted: false,
                allocation: null
            };
        });

        updates['gameState/phase'] = 'results';
        PdeFirebase.ref('rooms/' + roomCode).update(updates);
    };

    // ── FINISHED ──
    if (phase === 'finished' || gs.finished) {
        // Build chart data from top 5 players
        var top5 = leaderboard.slice(0, 5);
        var chartData = [];
        if (top5.length > 0 && top5[0].id && players[top5[0].id]?.data?.history) {
            var histLen = players[top5[0].id].data.history.length;
            for (var i = 0; i < histLen; i++) {
                var point = { year: players[top5[0].id].data.history[i].year };
                top5.forEach(function(p) {
                    var h = players[p.id]?.data?.history;
                    if (h && h[i]) point[p.name] = h[i].netWorth;
                });
                chartData.push(point);
            }
        }
        var colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6'];

        return (
            <PdeHostView title={t('final_results')} emoji="📈" gradient="from-emerald-900 to-teal-900">
                <PdeConfetti show={showConfetti} />

                {/* Winner */}
                {leaderboard[0] && (
                    <div className="text-center">
                        <div className="text-8xl mb-2">🏆</div>
                        <h2 className="text-4xl font-black text-yellow-400">{leaderboard[0].name}</h2>
                        <p className="text-2xl text-emerald-400 font-bold">{leaderboard[0].netWorth.toLocaleString()} €</p>
                    </div>
                )}

                {/* Evolution chart */}
                {chartData.length > 1 && (
                    <div className="card-stonks p-4">
                        <h3 className="text-lg font-black mb-3 text-center">📊 {t('portfolio_evolution')}</h3>
                        <ResponsiveContainer width="100%" height={300}>
                            <LineChart data={chartData}>
                                <XAxis dataKey="year" />
                                <YAxis tickFormatter={function(v) { return (v/1000).toFixed(0) + 'k'; }} />
                                <Tooltip formatter={function(v) { return v.toLocaleString() + ' €'; }} />
                                <Legend />
                                {top5.map(function(p, idx) {
                                    return <Line key={p.id} type="monotone" dataKey={p.name}
                                        stroke={colors[idx]} strokeWidth={2} dot={false} />;
                                })}
                            </LineChart>
                        </ResponsiveContainer>
                    </div>
                )}

                {/* Full leaderboard */}
                <div className="card-stonks p-4">
                    <PdeGameLeaderboard
                        players={Object.fromEntries(leaderboard.map(function(p) { return [p.id, { name: p.name, score: p.netWorth }]; }))}
                        sortBy="score"
                        title={'🏆 ' + t('final_ranking')}
                    />
                </div>

                {/* AI benchmark comparison */}
                {(function() {
                    var aiPlayer = players['__ai_market__'];
                    var aiWorth = 0;
                    if (aiPlayer?.data) {
                        aiWorth = (aiPlayer.data.cash || 0);
                        Object.values(aiPlayer.data.portfolio || {}).forEach(function(v) { aiWorth += v || 0; });
                    }
                    var winner = leaderboard[0];
                    var humanWinner = leaderboard.find(function(p) { return p.id !== '__ai_market__'; });
                    var beatMarket = humanWinner && humanWinner.netWorth > aiWorth;

                    return (
                        <div className="card-stonks p-5">
                            <h3 className="text-lg font-black text-center mb-3">🤖 {t('beat_market')}</h3>
                            <div className="grid grid-cols-2 gap-3">
                                <div className={'rounded-xl p-4 text-center ' + (beatMarket ? 'bg-green-50 ring-2 ring-green-400' : 'bg-gray-50')}>
                                    <p className="text-2xl">🏆</p>
                                    <p className="font-bold text-sm">{humanWinner?.name || '—'}</p>
                                    <p className="text-xl font-black text-green-600">{(humanWinner?.netWorth || 0).toLocaleString()} €</p>
                                </div>
                                <div className={'rounded-xl p-4 text-center ' + (!beatMarket ? 'bg-emerald-50 ring-2 ring-emerald-400' : 'bg-gray-50')}>
                                    <p className="text-2xl">📈</p>
                                    <p className="font-bold text-sm">{t('the_market_ai')}</p>
                                    <p className="text-xl font-black text-emerald-600">{aiWorth.toLocaleString()} €</p>
                                    <p className="text-xs text-gray-500">{t('strategy_dca')}</p>
                                </div>
                            </div>
                            <p className={'text-center font-black mt-3 text-lg ' + (beatMarket ? 'text-green-600' : 'text-amber-600')}>
                                {beatMarket ? '🎉 ' + t('beat_yes') : '📊 ' + t('beat_no')}
                            </p>
                        </div>
                    );
                })()}

                {/* Future projection */}
                {leaderboard[0] && (
                    <div className="card-stonks p-5 text-center">
                        <h3 className="text-lg font-black mb-2">🔮 {t('future_projection')}</h3>
                        <p className="text-sm text-gray-500 mb-3">{t('proj_text')}</p>
                        <div className="flex justify-center gap-6">
                            <div>
                                <p className="text-xs text-gray-500">{t('today')}</p>
                                <p className="text-xl font-black text-emerald-600">{leaderboard[0].netWorth.toLocaleString()} €</p>
                            </div>
                            <div className="text-3xl text-gray-300">→</div>
                            <div>
                                <p className="text-xs text-gray-500">{t('in_20_years')}</p>
                                <p className="text-xl font-black text-emerald-700">{Math.round(leaderboard[0].netWorth * Math.pow(1.06, 20)).toLocaleString()} €</p>
                            </div>
                        </div>
                        <p className="text-xs text-amber-600 mt-2 font-bold">💡 {t('rule_72')}</p>
                    </div>
                )}

                {/* Lesson */}
                <div className="card-stonks p-6 text-center">
                    <h3 className="text-xl font-black mb-2">📚 {t('what_learned')}</h3>
                    <div className="space-y-2 text-gray-700 text-left">
                        <p dangerouslySetInnerHTML={{__html: '📊 ' + t('lesson_1')}} />
                        <p dangerouslySetInnerHTML={{__html: '⏳ ' + t('lesson_2')}} />
                        <p dangerouslySetInnerHTML={{__html: '📈 ' + t('lesson_3')}} />
                        <p dangerouslySetInnerHTML={{__html: '🎲 ' + t('lesson_4')}} />
                        <p dangerouslySetInnerHTML={{__html: '🤖 ' + t('lesson_5')}} />
                        <p dangerouslySetInnerHTML={{__html: '💰 ' + t('lesson_6')}} />
                    </div>
                </div>

                <a href="./" className="block text-center py-3 bg-white/20 text-white font-bold rounded-xl hover:bg-white/30">🏠 {t('back')}</a>
            </PdeHostView>
        );
    }

    // ── NEWS phase ──
    if (phase === 'news') {
        return (
            <PdeHostView title="STONKS" emoji="📈" gradient="from-emerald-900 to-teal-900">
                <div className="text-center text-white">
                    <p className="text-lg text-emerald-400 font-bold">{t('round_x_of_y').replace('{x}', round + 1).replace('{y}', totalRounds)}</p>
                </div>

                <div className="card-stonks p-8 text-center space-y-4">
                    <p className="text-6xl font-black text-emerald-700">{year}</p>
                    {yearEvent && (
                        <div className="space-y-2">
                            <p className="text-5xl">{yearEvent.emoji}</p>
                            <h2 className="text-3xl font-black text-gray-800">{yearEvent.title}</h2>
                            <p className="text-lg text-gray-500">{yearEvent.effect}</p>
                        </div>
                    )}
                    {!yearEvent && <p className="text-xl text-gray-500">{t('quiet_year')}</p>}
                </div>

                {/* Previous year returns preview */}
                {yearIndex > 0 && (
                    <div className="card-stonks p-4">
                        <h3 className="text-lg font-black text-center mb-3">📊 {t('returns_of').replace('{x}', STONKS_DATA.years[yearIndex - 1])}</h3>
                        <div className="grid grid-cols-4 gap-2">
                            {Object.entries(STONKS_DATA.assets).map(function(entry) {
                                var key = entry[0], asset = entry[1];
                                var ret = asset.returns[yearIndex - 1];
                                if (ret == null) return null;
                                return (
                                    <div key={key} className="text-center p-2 rounded-xl bg-gray-50">
                                        <span className="text-2xl">{asset.emoji}</span>
                                        <p className={'text-sm font-black ' + (ret >= 0 ? 'text-green-600' : 'text-red-600')}>
                                            {ret >= 0 ? '+' : ''}{ret.toFixed(1)}%
                                        </p>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                )}

                <button onClick={advancePhase}
                    className="w-full py-5 rounded-2xl text-white font-black text-2xl shadow-lg bg-gradient-to-r from-emerald-500 to-teal-600 btn-stonks hover:brightness-110">
                    💰 {t('open_market')}
                </button>
            </PdeHostView>
        );
    }

    // ── ALLOCATE phase ──
    if (phase === 'allocate') {
        return (
            <PdeHostView title="STONKS" emoji="📈" gradient="from-emerald-900 to-teal-900">
                <div className="text-center text-white">
                    <p className="text-lg text-emerald-400 font-bold">{t('year_round').replace('{x}', year).replace('{r}', round + 1).replace('{t}', totalRounds)}</p>
                    <p className="text-3xl font-black mt-2">💰 {t('invest_now')}</p>
                </div>

                {/* Progress */}
                {/* New unlock notification */}
                {gs.newUnlocks && gs.newUnlocks.length > 0 && (
                    <div className="card-stonks p-5 text-center bg-gradient-to-r from-amber-50 to-yellow-50 border-2 border-amber-300">
                        <p className="text-2xl font-black text-amber-700 mb-2">🔓 {t('new_assets')}</p>
                        <div className="flex justify-center gap-4 flex-wrap">
                            {gs.newUnlocks.map(function(key) {
                                var asset = STONKS_DATA.assets[key];
                                return (
                                    <div key={key} className="bg-white rounded-xl p-3 shadow-md text-center min-w-[100px]">
                                        <span className="text-3xl">{asset?.emoji}</span>
                                        <p className="font-bold text-sm mt-1">{tAsset(key)}</p>
                                        <p className="text-xs text-gray-500">{t('risk')}: {asset?.risk}</p>
                                    </div>
                                );
                            })}
                        </div>
                        <p className="text-sm text-amber-600 mt-2 font-bold">{t('can_invest_now')}</p>
                    </div>
                )}

                <div className="card-stonks p-6 text-center">
                    <p className="text-lg font-bold text-gray-600 mb-3">
                        ✅ {submittedCount} / {humanPlayers.length} {t('players_ready')}
                    </p>
                    <div className="w-full bg-gray-200 rounded-full h-4">
                        <div className="bg-emerald-500 h-4 rounded-full transition-all"
                            style={{ width: (submittedCount / Math.max(playerList.length, 1) * 100) + '%' }} />
                    </div>
                </div>

                {/* Mini leaderboard */}
                <div className="card-stonks p-4">
                    <PdeGameLeaderboard
                        players={Object.fromEntries(leaderboard.map(function(p) { return [p.id, { name: p.name, score: p.netWorth }]; }))}
                        sortBy="score"
                        maxVisible={8}
                        title={'📊 ' + t('net_worth')}
                    />
                </div>

                <button onClick={advancePhase}
                    disabled={submittedCount < 1}
                    className={'w-full py-5 rounded-2xl text-white font-black text-2xl shadow-lg bg-gradient-to-r from-amber-500 to-orange-600 btn-stonks ' +
                        (submittedCount < 1 ? 'opacity-50 cursor-not-allowed' : 'hover:brightness-110')}>
                    {submittedCount >= humanPlayers.length ? '🔔 ' + t('close_market') : '⏳ ' + t('waiting_players')}
                </button>
            </PdeHostView>
        );
    }

    // ── RESULTS phase ──
    if (phase === 'results') {
        return (
            <PdeHostView title="STONKS" emoji="📈" gradient="from-emerald-900 to-teal-900">
                <div className="text-center text-white">
                    <p className="text-lg text-emerald-400 font-bold">{t('results_of').replace('{x}', year)}</p>
                </div>

                {/* Year returns */}
                <div className="card-stonks p-4">
                    <h3 className="text-lg font-black text-center mb-3">📊 {t('returns_of').replace('{x}', year)}</h3>
                    <div className="grid grid-cols-4 gap-2">
                        {Object.entries(STONKS_DATA.assets).map(function(entry) {
                            var key = entry[0], asset = entry[1];
                            var ret = asset.returns[yearIndex];
                            if (ret == null) return (
                                <div key={key} className="text-center p-2 rounded-xl bg-gray-100">
                                    <span className="text-2xl">{asset.emoji}</span>
                                    <p className="text-sm text-gray-500">N/A</p>
                                </div>
                            );
                            return (
                                <div key={key} className={'text-center p-3 rounded-xl ' + (ret >= 0 ? 'bg-green-50' : 'bg-red-50')}>
                                    <span className="text-3xl">{asset.emoji}</span>
                                    <p className={'text-lg font-black ' + (ret >= 0 ? 'text-green-600' : 'text-red-600')}>
                                        {ret >= 0 ? '+' : ''}{ret.toFixed(1)}%
                                    </p>
                                </div>
                            );
                        })}
                    </div>
                </div>

                {/* Updated leaderboard */}
                <div className="card-stonks p-4">
                    <PdeGameLeaderboard
                        players={Object.fromEntries(leaderboard.map(function(p) { return [p.id, { name: p.name, score: p.netWorth }]; }))}
                        sortBy="score"
                        title={'🏆 ' + t('ranking')}
                    />
                </div>

                <button onClick={advancePhase}
                    className="w-full py-5 rounded-2xl text-white font-black text-2xl shadow-lg bg-gradient-to-r from-emerald-500 to-teal-600 btn-stonks hover:brightness-110">
                    {round >= totalRounds - 1 ? '🏆 ' + t('see_final') : '➡️ ' + t('next_year')}
                </button>
            </PdeHostView>
        );
    }

    return null;
}


// ═══════════════════════════════════════════════════════════════
// STONKS PLAYER VIEW (on student's phone)
// ═══════════════════════════════════════════════════════════════
function StonksPlayer({ roomCode, playerId, players, gameState, idioma }) {
    var t = function(key) { return STONKS_TRANSLATIONS[key]?.[idioma] || STONKS_TRANSLATIONS[key]?.val || key; };
    var tAsset = function(key) { return STONKS_DATA.assetNames[key]?.[idioma] || STONKS_DATA.assetNames[key]?.val || key; };
    var tInfo = function(key) { return STONKS_DATA.assetInfo[key]?.[idioma] || STONKS_DATA.assetInfo[key]?.val || ''; };
    const [allocation, setAllocation] = useState({
        cash: 100, savings: 0, deposit: 0, ibex35: 0, sp500: 0, bonds: 0, gold: 0, bitcoin: 0, realestate: 0
    });

    var gs = gameState || {};
    var phase = gs.phase || 'news';
    var year = gs.currentYear || 2000;
    var yearIndex = STONKS_DATA.years.indexOf(year);
    var myData = players[playerId]?.data || {};
    var cash = myData.cash || 0;
    var portfolio = myData.portfolio || {};
    var submitted = myData.submitted || false;
    var lifeEvent = myData.lifeEvent;

    // Calculate total portfolio value
    var portfolioValue = 0;
    Object.values(portfolio).forEach(function(v) { portfolioValue += v || 0; });
    var totalWealth = cash + portfolioValue;

    // Available assets based on progressive unlock + data availability
    var unlockedAssets = gs.unlockedAssets || ['savings', 'deposit'];
    var availableAssets = Object.entries(STONKS_DATA.assets).filter(function(entry) {
        var key = entry[0];
        var returns = entry[1].returns;
        return unlockedAssets.indexOf(key) !== -1 && returns[yearIndex] != null;
    });

    // Info popup state
    const [showInfo, setShowInfo] = useState(null);

    // Adjust allocation for an asset
    var adjustAlloc = function(asset, delta) {
        if (submitted) return;
        setAllocation(function(prev) {
            var newVal = Math.max(0, Math.min(100, (prev[asset] || 0) + delta));
            var newAlloc = { ...prev, [asset]: newVal };
            // Calculate used percentage
            var totalUsed = Object.values(newAlloc).reduce(function(s, v) { return s + v; }, 0);
            // If over 100, reduce cash
            if (totalUsed > 100 && asset !== 'cash') {
                newAlloc.cash = Math.max(0, newAlloc.cash - (totalUsed - 100));
            }
            // Recalculate
            totalUsed = Object.values(newAlloc).reduce(function(s, v) { return s + v; }, 0);
            if (totalUsed > 100) {
                newAlloc[asset] = newVal - (totalUsed - 100);
            }
            return newAlloc;
        });
        PdeGameSounds.play('pop');
    };

    // Submit allocation
    var submitAllocation = function() {
        PdeRoomManager.updatePlayer(roomCode, playerId, {
            'data/allocation': allocation,
            'data/submitted': true
        });
        PdeGameSounds.play('coin');
    };

    var totalAllocated = Object.values(allocation).reduce(function(s, v) { return s + v; }, 0);

    // ── Waiting screens ──
    if (phase === 'news') {
        return (
            <PdePlayerView gradient="from-emerald-900 to-teal-900">
                <div className="card-stonks p-6 text-center space-y-4">
                    <p className="text-5xl">📈</p>
                    <h2 className="text-2xl font-black">{t('year_x').replace('{x}', year)}</h2>
                    <p className="text-gray-500">{t('look_screen')}</p>
                    <div className="bg-emerald-50 rounded-xl p-4">
                        <p className="text-sm text-gray-500">{t('your_wealth')}</p>
                        <p className="text-3xl font-black text-emerald-600">{totalWealth.toLocaleString()} €</p>
                    </div>
                </div>
            </PdePlayerView>
        );
    }

    if (phase === 'results') {
        var yearEvent = STONKS_DATA.events[year];
        return (
            <PdePlayerView gradient="from-emerald-900 to-teal-900">
                <div className="card-stonks p-6 space-y-4">
                    <h2 className="text-xl font-black text-center">📊 {t('results_year').replace('{x}', year)}</h2>

                    {/* Life event */}
                    {lifeEvent && (
                        <div className={`rounded-xl p-3 text-center ${lifeEvent.cost ? 'bg-red-50' : 'bg-green-50'}`}>
                            <p className="text-2xl">{lifeEvent.emoji}</p>
                            <p className="font-bold">{lifeEvent.name}</p>
                            <p className={'font-black ' + (lifeEvent.cost ? 'text-red-600' : 'text-green-600')}>
                                {lifeEvent.cost ? '-' + lifeEvent.cost.toLocaleString() : '+' + lifeEvent.income.toLocaleString()} €
                            </p>
                        </div>
                    )}

                    {/* Portfolio breakdown */}
                    <div className="space-y-2">
                        <div className="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2">
                            <span>💵 {t('cash')}</span>
                            <span className="font-black">{cash.toLocaleString()} €</span>
                        </div>
                        {Object.entries(portfolio).map(function(entry) {
                            var asset = entry[0], value = entry[1];
                            if (!value) return null;
                            var assetInfo = STONKS_DATA.assets[asset];
                            return (
                                <div key={asset} className="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2">
                                    <span>{assetInfo?.emoji} {tAsset(asset)}</span>
                                    <span className="font-black">{value.toLocaleString()} €</span>
                                </div>
                            );
                        })}
                    </div>

                    <div className="bg-emerald-50 rounded-xl p-4 text-center">
                        <p className="text-sm text-gray-500">{t('total_wealth')}</p>
                        <p className="text-3xl font-black text-emerald-600">{totalWealth.toLocaleString()} €</p>
                    </div>
                </div>
            </PdePlayerView>
        );
    }

    if (phase === 'finished') {
        return (
            <PdePlayerView gradient="from-emerald-900 to-teal-900">
                <div className="card-stonks p-6 text-center space-y-4">
                    <p className="text-6xl">🏆</p>
                    <h2 className="text-2xl font-black">{t('game_over')}</h2>
                    <div className="bg-emerald-50 rounded-xl p-4">
                        <p className="text-sm text-gray-500">{t('final_wealth')}</p>
                        <p className="text-4xl font-black text-emerald-600">{totalWealth.toLocaleString()} €</p>
                    </div>
                    <p className="text-gray-500">{t('see_ranking_screen')}</p>
                </div>
            </PdePlayerView>
        );
    }

    // ── ALLOCATE phase (main interaction) ──
    if (phase === 'allocate') {
        if (submitted) {
            return (
                <PdePlayerView gradient="from-emerald-900 to-teal-900">
                    <div className="card-stonks p-6 text-center space-y-4">
                        <p className="text-5xl">✅</p>
                        <h2 className="text-xl font-black">{t('investment_sent')}</h2>
                        <p className="text-gray-500">{t('waiting_others')}</p>
                        <div className="bg-emerald-50 rounded-xl p-3">
                            <p className="text-sm text-gray-500">{t('current_wealth')}</p>
                            <p className="text-2xl font-black text-emerald-600">{totalWealth.toLocaleString()} €</p>
                        </div>
                    </div>
                </PdePlayerView>
            );
        }

        return (
            <PdePlayerView gradient="from-emerald-900 to-teal-900">
                <div className="card-stonks p-5 space-y-3">
                    <div className="text-center">
                        <h2 className="text-lg font-black">💰 {t('distribute')}</h2>
                        <p className="text-emerald-600 font-bold text-xl">{totalWealth.toLocaleString()} €</p>
                        <p className="text-xs text-gray-500">{t('year_x').replace('{x}', year)} — {t('round_x_of_y').replace('{x}', (gs.round || 0) + 1).replace(' de {y}', '')}</p>
                    </div>

                    {/* Cash allocation */}
                    <div className="bg-gray-50 rounded-xl p-3">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <span className="text-xl">💵</span>
                                <span className="font-bold text-sm">{t('cash')}</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={function() { adjustAlloc('cash', -5); }}
                                    className="w-8 h-8 rounded-full bg-white shadow text-lg font-bold">−</button>
                                <span className="font-black w-12 text-center">{allocation.cash}%</span>
                                <button onClick={function() { adjustAlloc('cash', 5); }}
                                    className="w-8 h-8 rounded-full bg-white shadow text-lg font-bold">+</button>
                            </div>
                        </div>
                    </div>

                    {/* Asset allocations */}
                    {availableAssets.map(function(entry) {
                        var key = entry[0], asset = entry[1];
                        var riskColors = { low: 'bg-green-50', medium: 'bg-yellow-50', high: 'bg-orange-50', extreme: 'bg-red-50' };
                        var riskLabels = { low: '🟢', medium: '🟡', high: '🟠', extreme: '🔴' };
                        var isNew = (gs.newUnlocks || []).indexOf(key) !== -1;
                        return (
                            <div key={key} className={(riskColors[asset.risk] || 'bg-gray-50') + ' rounded-xl p-3' + (isNew ? ' ring-2 ring-amber-400 animate-pulse' : '')}>
                                {isNew && <p className="text-xs font-black text-amber-600 mb-1">🆕 {t('new_tag')}</p>}
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-2 flex-1 min-w-0">
                                        <span className="text-xl">{asset.emoji}</span>
                                        <div className="min-w-0">
                                            <p className="font-bold text-sm truncate">{tAsset(key)}</p>
                                            <p className="text-xs text-gray-500">{riskLabels[asset.risk]} {t('risk')} {asset.risk}</p>
                                        </div>
                                        <button onClick={function() { setShowInfo(showInfo === key ? null : key); }}
                                            className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 text-xs font-black flex-shrink-0">?</button>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button onClick={function() { adjustAlloc(key, -5); }}
                                            className="w-8 h-8 rounded-full bg-white shadow text-lg font-bold">−</button>
                                        <span className="font-black w-12 text-center">{allocation[key] || 0}%</span>
                                        <button onClick={function() { adjustAlloc(key, 5); }}
                                            className="w-8 h-8 rounded-full bg-white shadow text-lg font-bold">+</button>
                                    </div>
                                </div>
                                {showInfo === key && (
                                    <div className="mt-2 bg-white rounded-lg p-2 text-xs text-gray-600 border-l-3 border-blue-400">
                                        {tInfo(key)}
                                    </div>
                                )}
                            </div>
                        );
                    })}

                    {/* Total & Submit */}
                    <div className={'rounded-xl p-3 text-center ' + (totalAllocated === 100 ? 'bg-emerald-100' : 'bg-red-100')}>
                        <p className="font-bold">Total: <span className={'font-black text-xl ' + (totalAllocated === 100 ? 'text-emerald-600' : 'text-red-600')}>{totalAllocated}%</span></p>
                    </div>

                    <button onClick={submitAllocation} disabled={totalAllocated !== 100}
                        className={'w-full py-4 rounded-2xl text-white font-black text-lg shadow-lg bg-gradient-to-r from-emerald-500 to-teal-600 btn-stonks ' +
                            (totalAllocated !== 100 ? 'opacity-50 cursor-not-allowed' : 'hover:brightness-110')}>
                        {totalAllocated !== 100 ? '⚠️ ' + t('must_sum_100') : '✅ ' + t('confirm_invest')}
                    </button>
                </div>
            </PdePlayerView>
        );
    }

    return null;
}


// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
ReactDOM.render(<StonksApp />, document.getElementById('root'));
    </script>
</body>
