                    <p>{t('internacional.perQue.text')}</p>
                </TheoryBlock>
            </Card>

            <Card title={t('internacional.avantatge')} icon="📊">
                <TheoryBlock color="green">
                    <p>{t('internacional.avantatge.text')}</p>
                </TheoryBlock>

                {/* Trade example table */}
                <div className="mt-4 overflow-x-auto">
                    <table className="w-full text-sm border-collapse mb-4">
                        <thead>
                            <tr className="bg-slate-100">
                                <th className="p-3 text-left border border-slate-200 font-bold">{t('internacional.exemple.pais')}</th>
                                <th className="p-3 text-center border border-slate-200 font-bold">🍊 {t('internacional.exemple.taronges')}</th>
                                <th className="p-3 text-center border border-slate-200 font-bold">🧵 {t('internacional.exemple.tela')}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td className="p-3 border border-slate-200 font-medium">🇪🇸 Espanya</td>
                                <td className="p-3 border border-slate-200 text-center font-bold text-green-600">10</td>
                                <td className="p-3 border border-slate-200 text-center">5</td>
                            </tr>
                            <tr>
                                <td className="p-3 border border-slate-200 font-medium">🇩🇪 Alemanya</td>
                                <td className="p-3 border border-slate-200 text-center">4</td>
                                <td className="p-3 border border-slate-200 text-center font-bold text-green-600">8</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <TheoryBlock color="emerald">
                    <p className="font-semibold">{t('internacional.exemple.conclusio')}</p>
                </TheoryBlock>
            </Card>

            <Card title={t('internacional.exportacions')} icon="🚢">
                <TheoryBlock color="blue">
                    <p>{t('internacional.exportacions.text')}</p>
                </TheoryBlock>
                <FormulaBox formula="Balanca comercial = Exportacions - Importacions" />
            </Card>

            <Card title={t('internacional.globalitzacio')} icon="🌐">
                <TheoryBlock color="blue">
                    <p>{t('internacional.global.que')}</p>
                </TheoryBlock>

                {/* Advantages vs Disadvantages comparison */}
                <div className="grid md:grid-cols-2 gap-4 mt-4">
                    <div className="p-4 bg-green-50 rounded-xl border border-green-200">
                        <h4 className="font-bold text-green-700 mb-2">✅ {t('internacional.taula.avantatges')}</h4>
                        <p className="text-sm text-slate-700">{t('internacional.global.avantatges')}</p>
                    </div>
                    <div className="p-4 bg-red-50 rounded-xl border border-red-200">
                        <h4 className="font-bold text-red-700 mb-2">⚠️ {t('internacional.taula.desavantatges')}</h4>
                        <p className="text-sm text-slate-700">{t('internacional.global.desavantatges')}</p>
                    </div>
                </div>
            </Card>

            <Card title={t('internacional.organismes')} icon="🏛️">
                <div className="space-y-3">
                    {[
                        { key: 'onu', emoji: '🕊️', color: 'bg-blue-50 border-blue-200' },
                        { key: 'fmi', emoji: '💰', color: 'bg-green-50 border-green-200' },
                        { key: 'bm', emoji: '🏦', color: 'bg-amber-50 border-amber-200' },
                        { key: 'omc', emoji: '🔄', color: 'bg-violet-50 border-violet-200' },
                    ].map(item => (
                        <div key={item.key} className={`flex items-start gap-3 p-4 rounded-xl border ${item.color}`}>
                            <span className="text-xl">{item.emoji}</span>
                            <p className="text-sm text-slate-700">{t('internacional.' + item.key)}</p>
                        </div>
                    ))}
                </div>
            </Card>

            <Card title={t('internacional.ue')} icon="🇪🇺">
                <TheoryBlock color="blue">
                    <p>{t('internacional.ue.desc')}</p>
                </TheoryBlock>
                <div className="space-y-3 mt-4">
                    {[
                        { key: 'euro', emoji: '💶' },
                        { key: 'mercat', emoji: '🏪' },
                        { key: 'erasmus', emoji: '🎓' },
                    ].map(item => (
                        <div key={item.key} className="flex items-start gap-3 p-3 bg-blue-50 rounded-lg border border-blue-200">
                            <span className="text-lg">{item.emoji}</span>
                            <p className="text-sm text-slate-700">{t('internacional.ue.' + item.key)}</p>
                        </div>
                    ))}
                </div>
            </Card>
        </div>
    );

    // ========================================================================
    // UNIT 7: Reptes economics del futur (QUIZ)
    // ========================================================================
    const Reptes = () => {
        const [tab, setTab] = useState('teoria');
        const [quizState, setQuizState] = useState({ current: 0, answers: [], showResult: false });

        // Quiz questions with correct answer index
        const questions = [
            { key: 'q1', correct: 2 }, // c) 17
            { key: 'q2', correct: 1 }, // b) cost que pateix un tercer
            { key: 'q3', correct: 1 }, // b) CO2
            { key: 'q4', correct: 2 }, // c) reduir, reutilitzar, reciclar
            { key: 'q5', correct: 1 }, // b) BlaBlaCar
            { key: 'q6', correct: 1 }, // b) valor de tots els bens i serveis
            { key: 'q7', correct: 2 }, // c) OMC
            { key: 'q8', correct: 2 }, // c) desigualtat d'acces a tecnologia
            { key: 'q9', correct: 0 }, // a) sanitat i pensions
            { key: 'q10', correct: 1 }, // b) satisfer necessitats sense comprometre futur
        ];

        const handleAnswer = (answerIndex) => {
            const newAnswers = [...quizState.answers, answerIndex];
            if (quizState.current < questions.length - 1) {
                setQuizState({ ...quizState, current: quizState.current + 1, answers: newAnswers });
            } else {
                setQuizState({ ...quizState, answers: newAnswers, showResult: true });
            }
        };

        const resetQuiz = () => {
            setQuizState({ current: 0, answers: [], showResult: false });
        };

        const score = quizState.answers.reduce((acc, ans, i) => acc + (ans === questions[i].correct ? 1 : 0), 0);

        const getResultMessage = () => {
            if (score <= 3) return t('reptes.quiz.resultat0');
            if (score <= 6) return t('reptes.quiz.resultat1');
            if (score <= 9) return t('reptes.quiz.resultat2');
            return t('reptes.quiz.resultat3');
        };

        return (
            <div className="space-y-6">
                <SectionTitle icon="🚀" title={t('reptes.title')} subtitle={t('reptes.subtitle')} />
                <WhyImportant>{t('reptes.why')}</WhyImportant>

                <Tabs tabs={[
                    { id: 'teoria', label: t('reptes.tab.teoria') },
                    { id: 'quiz', label: t('reptes.tab.quiz') },
                ]} active={tab} onChange={setTab} />

                {tab === 'teoria' && (
                    <div className="space-y-6">
                        <Card title={t('reptes.creixement')} icon="📈">
                            <TheoryBlock color="blue">
                                <p>{t('reptes.creixement.text')}</p>
                            </TheoryBlock>
                        </Card>

                        <Card title={t('reptes.ods')} icon="🎯">
                            <TheoryBlock color="green">
                                <p>{t('reptes.ods.text')}</p>
                            </TheoryBlock>
                        </Card>

                        <Card title={t('reptes.clima')} icon="🌡️">
                            <TheoryBlock color="red">
                                <p>{t('reptes.clima.text')}</p>
                            </TheoryBlock>
                        </Card>

                        <Card title={t('reptes.pobresa')} icon="🤲">
                            <TheoryBlock color="amber">
                                <p>{t('reptes.pobresa.text')}</p>
                            </TheoryBlock>
                        </Card>

                        <Card title={t('reptes.digital')} icon="💻">
                            <TheoryBlock color="violet">
                                <p>{t('reptes.digital.text')}</p>
                            </TheoryBlock>
                        </Card>

                        <Card title={t('reptes.col·laborativa')} icon="🤝">
                            <TheoryBlock color="green">
                                <p>{t('reptes.col·laborativa.text')}</p>
                            </TheoryBlock>
                        </Card>

                        <Card title={t('reptes.demografia')} icon="👶👴">
                            <TheoryBlock color="blue">
                                <p>{t('reptes.demografia.text')}</p>
                            </TheoryBlock>
                        </Card>
                    </div>
                )}

                {tab === 'quiz' && (
                    <Card title={t('reptes.quiz.title')} icon="🧠">
                        {!quizState.showResult ? (
                            <div className="space-y-6">
                                {/* Progress */}
                                <div className="flex items-center gap-2">
                                    <span className="text-sm font-medium text-slate-600">{t('reptes.quiz.pregunta')} {quizState.current + 1}/10</span>
                                    <div className="flex-1 bg-slate-200 rounded-full h-2">
                                        <div className="bg-pink-500 h-full rounded-full transition-all" style={{width: `${((quizState.current + 1) / 10) * 100}%`}}></div>
                                    </div>
                                </div>

                                {/* Question */}
                                <div className="p-5 bg-slate-50 rounded-xl border border-slate-200">
                                    <h4 className="font-bold text-slate-800 text-lg mb-4">{t('reptes.' + questions[quizState.current].key)}</h4>
                                    <div className="space-y-3">
                                        {['a', 'b', 'c', 'd'].map((letter, idx) => (
                                            <button
                                                key={letter}
                                                onClick={() => handleAnswer(idx)}
                                                className="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-pink-400 hover:bg-pink-50 transition-all text-sm font-medium"
                                            >
                                                <span className="inline-block w-8 h-8 bg-pink-100 text-pink-600 rounded-full text-center leading-8 font-bold mr-3">{letter.toUpperCase()}</span>
                                                {t('reptes.' + questions[quizState.current].key + '.' + letter)}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                {/* Score */}
                                <div className="text-center py-8">
                                    <p className="text-6xl font-black text-pink-600">{score}/10</p>
                                    <p className="text-xl font-bold text-slate-700 mt-2">{t('reptes.quiz.puntuacio')}</p>
                                    <p className="text-lg text-slate-500 mt-4">{getResultMessage()}</p>
                                </div>

                                {/* Review answers */}
                                <div className="space-y-3">
                                    {questions.map((q, i) => {
                                        const isCorrect = quizState.answers[i] === q.correct;
                                        const letters = ['a', 'b', 'c', 'd'];
                                        return (
                                            <div key={i} className={`p-4 rounded-xl border ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                                <div className="flex items-start gap-3">
                                                    <span className="text-xl">{isCorrect ? '✅' : '❌'}</span>
                                                    <div>
                                                        <p className="font-medium text-sm text-slate-800">{t('reptes.' + q.key)}</p>
                                                        <p className="text-xs text-slate-500 mt-1">
                                                            {isCorrect ? t('reptes.quiz.correcta') : t('reptes.quiz.incorrecta') + ' — ' + t('reptes.' + q.key + '.' + letters[q.correct])}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <button onClick={resetQuiz} className="w-full py-3 bg-pink-500 text-white rounded-xl font-bold hover:bg-pink-600 transition-colors">
                                    🔄 {t('reptes.quiz.repetir')}
                                </button>
                            </div>
                        )}
                    </Card>
                )}
            </div>
        );
    };

    // ========================================================================
    // NAVIGATION AND RENDER
    // ========================================================================
    const headerSections = [
        { id: 'necessitat', label: t('sec.necessitat'), emoji: '💡' },
        { id: 'produccio', label: t('sec.produccio'), emoji: '🏭' },
        { id: 'mercat', label: t('sec.mercat'), emoji: '🛒' },
        { id: 'ciutadans', label: t('sec.ciutadans'), emoji: '👨‍👩‍👧‍👦' },
        { id: 'sector-public', label: t('sec.sector-public'), emoji: '🏛️' },
        { id: 'internacional', label: t('sec.internacional'), emoji: '🌍' },
        { id: 'reptes', label: t('sec.reptes'), emoji: '🚀' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}
                setIdioma={setIdioma}
                currentApp="economia-4eso"
                sections={headerSections}
                currentSection={section}
                setSection={setSection}
            />

            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}
                {section === 'necessitat' && <Necessitat />}
                {section === 'produccio' && <Produccio />}
                {section === 'mercat' && <Mercat />}
                {section === 'ciutadans' && <Ciutadans />}
                {section === 'sector-public' && <SectorPublic />}
                {section === 'internacional' && <Internacional />}
                {section === 'reptes' && <Reptes />}
            </main>

            <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
            <PdeFooter appEmoji="📊" appName={t('footer.appname')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<Eco4esoApp />, document.getElementById('root'));
    </script>
</body>
</html>
