    <script type="text/babel">
const { useState, useMemo, useEffect } = React;

function Eco4esoApp() {
    const [section, setSection] = useState('inicio');
    const [idioma, setIdioma] = useState(PdeLanguageStore.get());

    const pageTranslations = {
        // whyimportant
        'whyimportant.title': { val: "Per que t'importa aixo?", es: '¿Por que te importa esto?', en: 'Why does this matter to you?' },

        // inicio
        'inicio.title': { val: "Economia per a 4t d'ESO", es: "Economia para 4o de ESO", en: "Economics for Year 10" },
        'inicio.subtitle': { val: "Descobrix com funciona el mon economic amb exemples del dia a dia", es: "Descubre como funciona el mundo economico con ejemplos del dia a dia", en: "Discover how the economic world works with everyday examples" },
        'inicio.whyimportant': { val: "L'economia esta en tot: per que les coses costen el que costen, per que el govern puja o baixa impostos, per que existeix la pobresa... Entendre l'economia et fa mes lliure per prendre decisions sobre els teus diners, el teu futur i la teua vida.", es: "La economia esta en todo: por que las cosas cuestan lo que cuestan, por que el gobierno sube o baja impuestos, por que existe la pobreza... Entender la economia te hace mas libre para tomar decisiones sobre tu dinero, tu futuro y tu vida.", en: "Economics is in everything: why things cost what they cost, why the government raises or lowers taxes, why poverty exists... Understanding economics makes you freer to make decisions about your money, your future and your life." },

        // section names for inicio grid
        'sec.necessitat': { val: "L'economia i la seua necessitat", es: "La economia y su necesidad", en: "Economics and its necessity" },
        'sec.necessitat.desc': { val: "Escassetat, cost d'oportunitat, sistemes economics", es: "Escasez, coste de oportunidad, sistemas economicos", en: "Scarcity, opportunity cost, economic systems" },
        'sec.produccio': { val: "L'activitat productiva", es: "La actividad productiva", en: "Productive activity" },
        'sec.produccio.desc': { val: "Empresa, factors de produccio, sectors economics", es: "Empresa, factores de produccion, sectores economicos", en: "Firms, factors of production, economic sectors" },
        'sec.mercat': { val: "El mercat", es: "El mercado", en: "The market" },
        'sec.mercat.desc': { val: "Oferta i demanda, preus, consum responsable", es: "Oferta y demanda, precios, consumo responsable", en: "Supply and demand, prices, responsible consumption" },
        'sec.ciutadans': { val: "L'economia i els ciutadans", es: "La economia y los ciudadanos", en: "Economics and citizens" },
        'sec.ciutadans.desc': { val: "Renda, pressupost familiar, estalvi i consum", es: "Renta, presupuesto familiar, ahorro y consumo", en: "Income, family budget, savings and consumption" },
        'sec.sector-public': { val: "El sector public", es: "El sector publico", en: "The public sector" },
        'sec.sector-public.desc': { val: "Impostos, despesa publica, pressupostos", es: "Impuestos, gasto publico, presupuestos", en: "Taxes, public spending, budgets" },
        'sec.internacional': { val: "L'economia internacional", es: "La economia internacional", en: "International economics" },
        'sec.internacional.desc': { val: "Comerc, globalitzacio, Unio Europea", es: "Comercio, globalizacion, Union Europea", en: "Trade, globalisation, European Union" },
        'sec.reptes': { val: "Reptes economics del futur", es: "Retos economicos del futuro", en: "Future economic challenges" },
        'sec.reptes.desc': { val: "ODS, canvi climatic, economia digital", es: "ODS, cambio climatico, economia digital", en: "SDGs, climate change, digital economy" },

        // ========================================================================
        // Unit 1: L'economia i la seua necessitat
        // ========================================================================
        'necessitat.title': { val: "L'economia i la seua necessitat", es: "La economia y su necesidad", en: "Economics and its necessity" },
        'necessitat.subtitle': { val: "Per que existeix l'economia i per que la necessitem", es: "Por que existe la economia y por que la necesitamos", en: "Why economics exists and why we need it" },
        'necessitat.why': { val: "L'economia esta en tot: per que les coses costen el que costen, per que el govern puja o baixa impostos, per que existeix la pobresa... Cada vegada que decideixes gastar-te els diners en una cosa o en una altra, estas fent economia. Entendre-la et converteix en una persona mes informada.", es: "La economia esta en todo: por que las cosas cuestan lo que cuestan, por que el gobierno sube o baja impuestos, por que existe la pobreza... Cada vez que decides gastarte el dinero en una cosa u otra, estas haciendo economia.", en: "Economics is in everything: why things cost what they cost, why the government raises or lowers taxes, why poverty exists... Every time you decide to spend your money on one thing or another, you're doing economics." },
        'necessitat.queEs': { val: "Que es l'economia?", es: "¿Que es la economia?", en: "What is economics?" },
        'necessitat.queEs.text': { val: "L'economia es la ciencia que estudia com les persones i les societats utilitzen els recursos escassos per satisfer les seues necessitats. Com que no podem tindre tot el que volem, hem de triar. I ahi esta la clau de l'economia: l'eleccio.", es: "La economia es la ciencia que estudia como las personas y las sociedades utilizan los recursos escasos para satisfacer sus necesidades. Como no podemos tener todo lo que queremos, debemos elegir. Y ahi esta la clave de la economia: la eleccion.", en: "Economics is the science that studies how people and societies use scarce resources to satisfy their needs. Since we can't have everything we want, we must choose. And that's the key to economics: choice." },
        'necessitat.bens': { val: "Necessitats i bens", es: "Necesidades y bienes", en: "Needs and goods" },
        'necessitat.bens.lliures': { val: "Bens lliures: son il·limitats i gratuïts (aire, llum solar, aigua del mar). No requereixen esforc per obtindre'ls.", es: "Bienes libres: son ilimitados y gratuitos (aire, luz solar, agua del mar). No requieren esfuerzo para obtenerlos.", en: "Free goods: unlimited and free (air, sunlight, seawater). No effort required to obtain them." },
        'necessitat.bens.economics': { val: "Bens economics: son escassos i tenen un preu (menjar, roba, un mobil). Cal treballar o pagar per aconseguir-los.", es: "Bienes economicos: son escasos y tienen un precio (comida, ropa, un movil). Hay que trabajar o pagar para conseguirlos.", en: "Economic goods: scarce and have a price (food, clothing, a phone). You need to work or pay to get them." },
        'necessitat.escassetat': { val: "Escassetat i eleccio", es: "Escasez y eleccion", en: "Scarcity and choice" },
        'necessitat.escassetat.text': { val: "Les nostres necessitats son il·limitades (sempre volem mes), pero els recursos son limitats (no hi ha prou per a tot). Per aixo hem de triar: si et gastes 20EUR en un videojoc, no els pots gastar en anar al cinema. Aixo es l'escassetat, el problema basic de l'economia.", es: "Nuestras necesidades son ilimitadas (siempre queremos mas), pero los recursos son limitados (no hay suficiente para todo). Por eso debemos elegir: si te gastas 20EUR en un videojuego, no los puedes gastar en ir al cine. Eso es la escasez, el problema basico de la economia.", en: "Our needs are unlimited (we always want more), but resources are limited (there isn't enough for everything). That's why we must choose: if you spend EUR20 on a video game, you can't spend it on the cinema. That's scarcity, the basic problem of economics." },
        'necessitat.cost': { val: "Cost d'oportunitat", es: "Coste de oportunidad", en: "Opportunity cost" },
        'necessitat.cost.text': { val: "El cost d'oportunitat es allo a que renuncies quan tries. Si el dissabte decideixes estudiar, el cost d'oportunitat es el que podries haver fet: eixir amb amics, jugar, descansar... No es nomes diners, tambe es temps i experiencies!", es: "El coste de oportunidad es aquello a lo que renuncias cuando eliges. Si el sabado decides estudiar, el coste de oportunidad es lo que podrias haber hecho: salir con amigos, jugar, descansar... ¡No es solo dinero, tambien es tiempo y experiencias!", en: "Opportunity cost is what you give up when you choose. If on Saturday you decide to study, the opportunity cost is what you could have done instead: go out with friends, play, rest... It's not just money, it's also time and experiences!" },
        'necessitat.fpp': { val: "Frontera de Possibilitats de Produccio (FPP)", es: "Frontera de Posibilidades de Produccion (FPP)", en: "Production Possibilities Frontier (PPF)" },
        'necessitat.fpp.text': { val: "Es un grafic que mostra les combinacions maximes de dos productes que un pais pot fabricar amb els seus recursos. Si un pais dedica tots els recursos a fer cotxes, no pot fer menjar, i viceversa. La corba mostra les combinacions possibles. Punts sobre la corba = eficient. Punts dins = desaprofitem recursos. Punts fora = impossible amb els recursos actuals.", es: "Es un grafico que muestra las combinaciones maximas de dos productos que un pais puede fabricar con sus recursos. Si un pais dedica todos los recursos a hacer coches, no puede hacer comida, y viceversa. La curva muestra las combinaciones posibles.", en: "It's a graph showing the maximum combinations of two products a country can make with its resources. If a country uses all resources to make cars, it can't make food, and vice versa. The curve shows possible combinations." },
        'necessitat.agents': { val: "Agents economics", es: "Agentes economicos", en: "Economic agents" },
        'necessitat.agents.families': { val: "Families: consumeixen bens i serveis, i ofereixen el seu treball a les empreses. Reben salaris a canvi.", es: "Familias: consumen bienes y servicios, y ofrecen su trabajo a las empresas. Reciben salarios a cambio.", en: "Households: consume goods and services, and offer their labour to firms. They receive wages in return." },
        'necessitat.agents.empreses': { val: "Empreses: produeixen bens i serveis per vendre'ls. Contracten treballadors i compren materies primeres.", es: "Empresas: producen bienes y servicios para venderlos. Contratan trabajadores y compran materias primas.", en: "Firms: produce goods and services to sell. They hire workers and buy raw materials." },
        'necessitat.agents.estat': { val: "Estat: recapta impostos, ofereix serveis publics (educacio, sanitat) i regula l'economia per protegir als ciutadans.", es: "Estado: recauda impuestos, ofrece servicios publicos (educacion, sanidad) y regula la economia para proteger a los ciudadanos.", en: "State: collects taxes, provides public services (education, health) and regulates the economy to protect citizens." },
        'necessitat.sistemes': { val: "Sistemes economics", es: "Sistemas economicos", en: "Economic systems" },
        'necessitat.mercat': { val: "Economia de mercat", es: "Economia de mercado", en: "Market economy" },
        'necessitat.mercat.desc': { val: "Les persones i empreses decideixen lliurement que produir i que comprar. Els preus es fixen per oferta i demanda. Exemple: la majoria de botigues i empreses privades.", es: "Las personas y empresas deciden libremente que producir y que comprar. Los precios se fijan por oferta y demanda. Ejemplo: la mayoria de tiendas y empresas privadas.", en: "People and firms freely decide what to produce and buy. Prices are set by supply and demand. Example: most shops and private businesses." },
        'necessitat.planificada': { val: "Economia planificada", es: "Economia planificada", en: "Planned economy" },
        'necessitat.planificada.desc': { val: "L'Estat decideix tot: que es produeix, quant costa i qui ho rep. No hi ha llibertat d'empresa. Exemple historic: Unio Sovietica, Cuba.", es: "El Estado decide todo: que se produce, cuanto cuesta y quien lo recibe. No hay libertad de empresa. Ejemplo historico: Union Sovietica, Cuba.", en: "The State decides everything: what is produced, how much it costs and who gets it. No business freedom. Historical example: Soviet Union, Cuba." },
        'necessitat.mixta': { val: "Economia mixta", es: "Economia mixta", en: "Mixed economy" },
        'necessitat.mixta.desc': { val: "Combina mercat i intervencio de l'Estat. Les empreses son lliures, pero l'Estat regula, cobra impostos i ofereix serveis publics. Es el sistema d'Espanya i la majoria de paisos europeus.", es: "Combina mercado e intervencion del Estado. Las empresas son libres, pero el Estado regula, cobra impuestos y ofrece servicios publicos. Es el sistema de Espana y la mayoria de paises europeos.", en: "Combines market and State intervention. Firms are free, but the State regulates, collects taxes and provides public services. It's the system in Spain and most European countries." },
        'necessitat.flux': { val: "Flux circular de la renda", es: "Flujo circular de la renta", en: "Circular flow of income" },
        'necessitat.flux.text': { val: "L'economia funciona com un circuit: les families treballen per a les empreses i reben salaris. Amb eixos diners compren productes a les empreses. L'Estat recapta impostos de tots i ofereix serveis publics. Tot esta connectat!", es: "La economia funciona como un circuito: las familias trabajan para las empresas y reciben salarios. Con ese dinero compran productos a las empresas. El Estado recauda impuestos de todos y ofrece servicios publicos. ¡Todo esta conectado!", en: "The economy works like a circuit: households work for firms and receive wages. With that money they buy products from firms. The State collects taxes from everyone and provides public services. Everything is connected!" },
        'necessitat.taula.criteri': { val: "Criteri", es: "Criterio", en: "Criterion" },
        'necessitat.taula.qui': { val: "Qui decideix?", es: "¿Quien decide?", en: "Who decides?" },
        'necessitat.taula.propietat': { val: "Propietat", es: "Propiedad", en: "Ownership" },
        'necessitat.taula.exemple': { val: "Exemple", es: "Ejemplo", en: "Example" },
        'necessitat.taula.mercat.qui': { val: "Persones i empreses", es: "Personas y empresas", en: "People and firms" },
        'necessitat.taula.mercat.propietat': { val: "Privada", es: "Privada", en: "Private" },
        'necessitat.taula.mercat.exemple': { val: "EUA, Regne Unit", es: "EE.UU., Reino Unido", en: "USA, UK" },
        'necessitat.taula.planificada.qui': { val: "L'Estat", es: "El Estado", en: "The State" },
        'necessitat.taula.planificada.propietat': { val: "Publica", es: "Publica", en: "Public" },
        'necessitat.taula.planificada.exemple': { val: "Cuba, Corea del Nord", es: "Cuba, Corea del Norte", en: "Cuba, North Korea" },
        'necessitat.taula.mixta.qui': { val: "Mercat + Estat", es: "Mercado + Estado", en: "Market + State" },
        'necessitat.taula.mixta.propietat': { val: "Mixta", es: "Mixta", en: "Mixed" },
        'necessitat.taula.mixta.exemple': { val: "Espanya, Franca, Alemanya", es: "Espana, Francia, Alemania", en: "Spain, France, Germany" },

        // ========================================================================
        // Unit 2: L'activitat productiva
        // ========================================================================
        'produccio.title': { val: "L'activitat productiva", es: "La actividad productiva", en: "Productive activity" },
        'produccio.subtitle': { val: "Com es produeixen els bens i serveis que consumim", es: "Como se producen los bienes y servicios que consumimos", en: "How the goods and services we consume are produced" },
        'produccio.why': { val: "Tot el que fas servir cada dia — el teu mobil, la roba, el menjar — ha sigut produit per alguna empresa. Entendre com funcionen les empreses, quins costos tenen i com guanyen diners t'ajuda a comprendre el mon laboral on entraras molt prompte.", es: "Todo lo que usas cada dia — tu movil, la ropa, la comida — ha sido producido por alguna empresa. Entender como funcionan las empresas, que costes tienen y como ganan dinero te ayuda a comprender el mundo laboral donde entraras muy pronto.", en: "Everything you use every day — your phone, clothes, food — has been produced by a firm. Understanding how firms work, their costs and how they earn money helps you understand the working world you'll enter very soon." },
        'produccio.empresa': { val: "L'empresa i les seues funcions", es: "La empresa y sus funciones", en: "The firm and its functions" },
        'produccio.empresa.text': { val: "Una empresa es una organitzacio que combina recursos (treballadors, maquines, materies primeres) per produir bens o serveis i vendre'ls obtenint un benefici. Les empreses creen ocupacio, paguen impostos i mouen l'economia.", es: "Una empresa es una organizacion que combina recursos (trabajadores, maquinas, materias primas) para producir bienes o servicios y venderlos obteniendo un beneficio. Las empresas crean empleo, pagan impuestos y mueven la economia.", en: "A firm is an organisation that combines resources (workers, machines, raw materials) to produce goods or services and sell them for a profit. Firms create jobs, pay taxes and drive the economy." },
        'produccio.factors': { val: "Factors de produccio", es: "Factores de produccion", en: "Factors of production" },
        'produccio.factors.terra': { val: "Terra (recursos naturals): tot el que ve de la natura (aigua, minerals, terrenys, energia solar). Es limitat.", es: "Tierra (recursos naturales): todo lo que viene de la naturaleza (agua, minerales, terrenos, energia solar). Es limitado.", en: "Land (natural resources): everything from nature (water, minerals, land, solar energy). It is limited." },
        'produccio.factors.treball': { val: "Treball: l'esforc fisic i mental de les persones. El teu professor, un metge, un cambrer... tots aporten treball.", es: "Trabajo: el esfuerzo fisico y mental de las personas. Tu profesor, un medico, un camarero... todos aportan trabajo.", en: "Labour: the physical and mental effort of people. Your teacher, a doctor, a waiter... all contribute labour." },
        'produccio.factors.capital': { val: "Capital: les ferramentes, maquines i edificis que s'utilitzen per produir. Una fabrica, un ordinador, un forn de pa.", es: "Capital: las herramientas, maquinas y edificios que se utilizan para producir. Una fabrica, un ordenador, un horno de pan.", en: "Capital: the tools, machines and buildings used to produce. A factory, a computer, a bread oven." },
        'produccio.factors.iniciativa': { val: "Iniciativa empresarial: la capacitat de l'empresari per organitzar els altres factors, assumir riscos i innovar. Sense algú que s'arrisque, no hi ha empresa.", es: "Iniciativa empresarial: la capacidad del empresario para organizar los otros factores, asumir riesgos e innovar. Sin alguien que se arriesgue, no hay empresa.", en: "Entrepreneurship: the entrepreneur's ability to organise other factors, take risks and innovate. Without someone willing to take risks, there's no firm." },
        'produccio.sectors': { val: "Sectors economics", es: "Sectores economicos", en: "Economic sectors" },
        'produccio.sectors.primari': { val: "Sector primari: extreu recursos de la natura. Agricultura, pesca, ramaderia, mineria. Exemple: un agricultor que cultiva taronges a Valencia.", es: "Sector primario: extrae recursos de la naturaleza. Agricultura, pesca, ganaderia, mineria. Ejemplo: un agricultor que cultiva naranjas en Valencia.", en: "Primary sector: extracts resources from nature. Agriculture, fishing, livestock, mining. Example: a farmer growing oranges in Valencia." },
        'produccio.sectors.secundari': { val: "Sector secundari: transforma materies primeres en productes elaborats. Industria, construccio. Exemple: una fabrica que converteix taronges en suc.", es: "Sector secundario: transforma materias primas en productos elaborados. Industria, construccion. Ejemplo: una fabrica que convierte naranjas en zumo.", en: "Secondary sector: transforms raw materials into manufactured products. Industry, construction. Example: a factory turning oranges into juice." },
        'produccio.sectors.terciari': { val: "Sector terciari (serveis): no produeix bens fisics, sino serveis. Comerç, transport, educacio, sanitat, turisme. Es el sector mes gran a Espanya (mes del 70% del PIB).", es: "Sector terciario (servicios): no produce bienes fisicos, sino servicios. Comercio, transporte, educacion, sanidad, turismo. Es el sector mas grande en Espana (mas del 70% del PIB).", en: "Tertiary sector (services): doesn't produce physical goods, but services. Commerce, transport, education, health, tourism. It's the largest sector in Spain (over 70% of GDP)." },
        'produccio.costos': { val: "Costos, ingressos i beneficis", es: "Costes, ingresos y beneficios", en: "Costs, revenue and profits" },
        'produccio.costos.fixos': { val: "Costos fixos: no canvien encara que produisques mes o menys. Exemple: el lloguer del local, l'asseguranca.", es: "Costes fijos: no cambian aunque produzcas mas o menos. Ejemplo: el alquiler del local, el seguro.", en: "Fixed costs: don't change whether you produce more or less. Example: shop rent, insurance." },
        'produccio.costos.variables': { val: "Costos variables: augmenten quan produixes mes. Exemple: materies primeres, electricitat de les maquines.", es: "Costes variables: aumentan cuando produces mas. Ejemplo: materias primas, electricidad de las maquinas.", en: "Variable costs: increase when you produce more. Example: raw materials, machine electricity." },
        'produccio.benefici': { val: "Benefici = Ingressos - Costos", es: "Beneficio = Ingresos - Costes", en: "Profit = Revenue - Costs" },
        'produccio.benefici.text': { val: "Si una pastisseria ven 100 pastissos a 3EUR cadascun (ingressos = 300EUR) i els costos totals son 200EUR, el benefici es de 100EUR. Si els costos foren 350EUR, tindria perdues de 50EUR.", es: "Si una pasteleria vende 100 pasteles a 3EUR cada uno (ingresos = 300EUR) y los costes totales son 200EUR, el beneficio es de 100EUR. Si los costes fueran 350EUR, tendria perdidas de 50EUR.", en: "If a bakery sells 100 cakes at EUR3 each (revenue = EUR300) and total costs are EUR200, the profit is EUR100. If costs were EUR350, it would have EUR50 in losses." },
        'produccio.productivitat': { val: "Productivitat", es: "Productividad", en: "Productivity" },
        'produccio.productivitat.text': { val: "Es la relacio entre el que es produeix i els recursos utilitzats. Mes productivitat = produir mes amb menys. Exemple: si amb 10 treballadors fas 100 pastissos, la productivitat es 10 pastissos/treballador. Si millores la maquinaria i fas 150, la productivitat puja a 15.", es: "Es la relacion entre lo que se produce y los recursos utilizados. Mas productividad = producir mas con menos. Ejemplo: si con 10 trabajadores haces 100 pasteles, la productividad es 10 pasteles/trabajador.", en: "It's the relationship between output and resources used. More productivity = producing more with less. Example: if 10 workers make 100 cakes, productivity is 10 cakes/worker." },
        'produccio.sostenibilitat': { val: "Economia circular i sostenibilitat", es: "Economia circular y sostenibilidad", en: "Circular economy and sustainability" },
        'produccio.sostenibilitat.text': { val: "L'economia circular proposa que els productes es dissenyen per ser reutilitzats, reparats o reciclats, en lloc de llançar-los. En comptes de 'extraure, produir, usar i llançar' (lineal), es busca 'reduir, reutilitzar i reciclar' (circular). Exemples: roba de segona ma, reparar el mobil en lloc de comprar-ne un de nou.", es: "La economia circular propone que los productos se disenen para ser reutilizados, reparados o reciclados, en lugar de tirarlos. En vez de 'extraer, producir, usar y tirar' (lineal), se busca 'reducir, reutilizar y reciclar' (circular).", en: "The circular economy proposes that products are designed to be reused, repaired or recycled, instead of throwing them away. Instead of 'extract, produce, use and throw away' (linear), we seek 'reduce, reuse and recycle' (circular)." },
        'produccio.emprenedoria': { val: "Emprenedoria basica", es: "Emprendimiento basico", en: "Basic entrepreneurship" },
        'produccio.emprenedoria.text': { val: "Emprendre es crear un negoci propi. Necessites una idea, un pla i valentia per assumir riscos. Moltes de les empreses que coneixes (Instagram, Spotify, Mercadona) van comencar amb una persona amb una idea i ganes de treballar.", es: "Emprender es crear un negocio propio. Necesitas una idea, un plan y valentia para asumir riesgos. Muchas de las empresas que conoces (Instagram, Spotify, Mercadona) empezaron con una persona con una idea y ganas de trabajar.", en: "Entrepreneurship is creating your own business. You need an idea, a plan and courage to take risks. Many companies you know (Instagram, Spotify, Mercadona) started with one person with an idea and willingness to work." },

        // ========================================================================
        // Unit 3: El mercat (INTERACTIVE SIMULATOR)
        // ========================================================================
        'mercat.title': { val: "El mercat", es: "El mercado", en: "The market" },
        'mercat.subtitle': { val: "On es troben compradors i venedors", es: "Donde se encuentran compradores y vendedores", en: "Where buyers and sellers meet" },
        'mercat.why': { val: "Per que un gelat costa 2EUR i no 10EUR? Per que les sabatilles de moda son mes cares? Per que el preu de la fruita canvia amb les estacions? Tot s'explica amb oferta i demanda. Entendre-ho et converteix en un consumidor mes intel·ligent.", es: "¿Por que un helado cuesta 2EUR y no 10EUR? ¿Por que las zapatillas de moda son mas caras? ¿Por que el precio de la fruta cambia con las estaciones? Todo se explica con oferta y demanda. Entenderlo te convierte en un consumidor mas inteligente.", en: "Why does an ice cream cost EUR2 and not EUR10? Why are trendy trainers more expensive? Why do fruit prices change with seasons? It all comes down to supply and demand. Understanding it makes you a smarter consumer." },
        'mercat.tab.teoria': { val: "Teoria", es: "Teoria", en: "Theory" },
        'mercat.tab.simulador': { val: "Simulador", es: "Simulador", en: "Simulator" },
        'mercat.queEs': { val: "Que es el mercat?", es: "¿Que es el mercado?", en: "What is the market?" },
        'mercat.queEs.text': { val: "Un mercat es qualsevol lloc (fisic o virtual) on compradors i venedors es troben per intercanviar bens i serveis a canvi de diners. Pot ser un supermercat, una botiga online, o fins i tot Wallapop!", es: "Un mercado es cualquier lugar (fisico o virtual) donde compradores y vendedores se encuentran para intercambiar bienes y servicios a cambio de dinero. Puede ser un supermercado, una tienda online, ¡o incluso Wallapop!", en: "A market is any place (physical or virtual) where buyers and sellers meet to exchange goods and services for money. It can be a supermarket, an online shop, or even Wallapop!" },
        'mercat.demanda': { val: "La demanda", es: "La demanda", en: "Demand" },
        'mercat.demanda.text': { val: "La demanda es la quantitat d'un producte que els compradors volen comprar a cada preu. Llei basica: si el preu puja, la gent compra menys. Si el preu baixa, la gent compra mes. Exemple: si les creps costen 1EUR, en vols 3. Si costen 5EUR, nomes en vols 1.", es: "La demanda es la cantidad de un producto que los compradores quieren comprar a cada precio. Ley basica: si el precio sube, la gente compra menos. Si el precio baja, la gente compra mas.", en: "Demand is the quantity of a product that buyers want to buy at each price. Basic law: if the price goes up, people buy less. If the price goes down, people buy more." },
        'mercat.oferta': { val: "L'oferta", es: "La oferta", en: "Supply" },
        'mercat.oferta.text': { val: "L'oferta es la quantitat d'un producte que els venedors volen vendre a cada preu. Llei basica: si el preu puja, els venedors volen vendre mes (guanyen mes diners). Si el preu baixa, volen vendre menys (no els compensa).", es: "La oferta es la cantidad de un producto que los vendedores quieren vender a cada precio. Ley basica: si el precio sube, los vendedores quieren vender mas. Si el precio baja, quieren vender menos.", en: "Supply is the quantity of a product that sellers want to sell at each price. Basic law: if the price goes up, sellers want to sell more. If the price goes down, they want to sell less." },
        'mercat.equilibri': { val: "El preu d'equilibri", es: "El precio de equilibrio", en: "The equilibrium price" },
        'mercat.equilibri.text': { val: "El preu d'equilibri es aquell on la quantitat que els compradors volen comprar coincideix amb la que els venedors volen vendre. A eixe preu, tothom esta satisfet: no sobra ni falta producte.", es: "El precio de equilibrio es aquel donde la cantidad que los compradores quieren comprar coincide con la que los vendedores quieren vender. A ese precio, todos estan satisfechos: no sobra ni falta producto.", en: "The equilibrium price is where the quantity buyers want to buy matches what sellers want to sell. At that price, everyone is satisfied: there's no surplus or shortage." },
        'mercat.tipusMercats': { val: "Tipus de mercats", es: "Tipos de mercados", en: "Types of markets" },
        'mercat.competencia': { val: "Competencia: moltes empreses venen productes similars. Exemple: restaurants, botigues de roba.", es: "Competencia: muchas empresas venden productos similares. Ejemplo: restaurantes, tiendas de ropa.", en: "Competition: many firms sell similar products. Example: restaurants, clothing shops." },
        'mercat.monopoli': { val: "Monopoli: una sola empresa controla el mercat. Exemple: el servei d'aigua de la teua ciutat.", es: "Monopolio: una sola empresa controla el mercado. Ejemplo: el servicio de agua de tu ciudad.", en: "Monopoly: a single firm controls the market. Example: your city's water service." },
        'mercat.oligopoli': { val: "Oligopoli: unes poques empreses dominen el mercat. Exemple: Movistar, Vodafone, Orange (telefonia mobil).", es: "Oligopolio: unas pocas empresas dominan el mercado. Ejemplo: Movistar, Vodafone, Orange (telefonia movil).", en: "Oligopoly: a few firms dominate the market. Example: Movistar, Vodafone, Orange (mobile telecom)." },
        'mercat.publicitat': { val: "El paper de la publicitat", es: "El papel de la publicidad", en: "The role of advertising" },
        'mercat.publicitat.text': { val: "La publicitat intenta influir en les teues decisions de compra. Crea necessitats que potser no tenies i et fa creure que necessites coses que realment no necessites. Es important ser critic: pregunta't si de veritat necessites eixe producte o si es la publicitat la que t'ho fa creure.", es: "La publicidad intenta influir en tus decisiones de compra. Crea necesidades que quizas no tenias y te hace creer que necesitas cosas que realmente no necesitas. Es importante ser critico.", en: "Advertising tries to influence your buying decisions. It creates needs you might not have had and makes you believe you need things you don't really need. It's important to be critical." },
        'mercat.consum': { val: "Consum responsable", es: "Consumo responsable", en: "Responsible consumption" },
        'mercat.consum.text': { val: "Consumir responsablement vol dir pensar abans de comprar: necessito aixo de veritat? D'on ve? Com s'ha fabricat? Es sostenible? Tenim drets com a consumidors (garantia, devolucio, informacio clara) i tambe deures (no malgastar, reciclar, comprar de forma etica).", es: "Consumir responsablemente significa pensar antes de comprar: ¿necesito esto de verdad? ¿De donde viene? ¿Como se ha fabricado? ¿Es sostenible? Tenemos derechos como consumidores y tambien deberes.", en: "Responsible consumption means thinking before buying: do I really need this? Where does it come from? How was it made? Is it sustainable? We have rights as consumers and also duties." },
        // Simulator translations
        'mercat.sim.preu': { val: "Preu del producte", es: "Precio del producto", en: "Product price" },
        'mercat.sim.moda': { val: "Moda del producte", es: "Moda del producto", en: "Product trendiness" },
        'mercat.sim.cost': { val: "Cost de produccio", es: "Coste de produccion", en: "Production cost" },
        'mercat.sim.qd': { val: "Quantitat demandada (Qd)", es: "Cantidad demandada (Qd)", en: "Quantity demanded (Qd)" },
        'mercat.sim.qo': { val: "Quantitat ofertada (Qo)", es: "Cantidad ofertada (Qo)", en: "Quantity supplied (Qs)" },
        'mercat.sim.estat': { val: "Estat del mercat", es: "Estado del mercado", en: "Market status" },
        'mercat.sim.equilibri': { val: "Equilibri!", es: "¡Equilibrio!", en: "Equilibrium!" },
        'mercat.sim.excesOferta': { val: "Exces d'oferta (sobra producte)", es: "Exceso de oferta (sobra producto)", en: "Excess supply (surplus)" },
        'mercat.sim.excesDemanda': { val: "Exces de demanda (falta producte)", es: "Exceso de demanda (falta producto)", en: "Excess demand (shortage)" },
        'mercat.sim.explicacio': { val: "Que esta passant?", es: "¿Que esta pasando?", en: "What's happening?" },
        'mercat.sim.explicacio.equilibri': { val: "El mercat esta equilibrat: es ven tot el que es produeix. El preu es just!", es: "El mercado esta equilibrado: se vende todo lo que se produce. ¡El precio es justo!", en: "The market is balanced: everything produced is sold. The price is fair!" },
        'mercat.sim.explicacio.excesOferta': { val: "Es produeix mes del que la gent vol comprar. Les empreses hauran de baixar el preu o es quedaran amb producte sense vendre.", es: "Se produce mas de lo que la gente quiere comprar. Las empresas tendran que bajar el precio o se quedaran con producto sin vender.", en: "More is produced than people want to buy. Firms will have to lower the price or be left with unsold products." },
        'mercat.sim.explicacio.excesDemanda': { val: "La gent vol comprar mes del que es produeix. Hi ha cues i escassetat. Les empreses podrien pujar el preu.", es: "La gente quiere comprar mas de lo que se produce. Hay colas y escasez. Las empresas podrian subir el precio.", en: "People want to buy more than is produced. There are queues and shortages. Firms could raise the price." },
        'mercat.sim.grafic': { val: "Grafic Oferta-Demanda", es: "Grafico Oferta-Demanda", en: "Supply-Demand Graph" },

        // ========================================================================
        // Unit 4: L'economia i els ciutadans
        // ========================================================================
        'ciutadans.title': { val: "L'economia i els ciutadans", es: "La economia y los ciudadanos", en: "Economics and citizens" },
        'ciutadans.subtitle': { val: "Com afecta l'economia a la teua vida diaria", es: "Como afecta la economia a tu vida diaria", en: "How economics affects your daily life" },
        'ciutadans.why': { val: "Potser penses que l'economia no va amb tu perque encara ets jove, pero ja prens decisions economiques cada dia: com gastes la teua paga, si estalvies o no, que compres i per que. Aprendre a gestionar els diners ara et fara la vida molt mes facil en el futur.", es: "Quizas piensas que la economia no va contigo porque aun eres joven, pero ya tomas decisiones economicas cada dia: como gastas tu paga, si ahorras o no, que compras y por que. Aprender a gestionar el dinero ahora te hara la vida mucho mas facil en el futuro.", en: "You might think economics isn't relevant because you're young, but you already make economic decisions every day: how you spend your allowance, whether you save, what you buy and why. Learning to manage money now will make life much easier in the future." },
        'ciutadans.renda': { val: "La renda de les families", es: "La renta de las familias", en: "Household income" },
        'ciutadans.renda.text': { val: "Les families obtenen diners de diverses fonts: salari (treball), interessos (estalvis al banc), lloguers (si tenen propietats) i beneficis (si tenen un negoci). Amb eixos diners paguen les seues despeses i, si poden, estalvien.", es: "Las familias obtienen dinero de diversas fuentes: salario (trabajo), intereses (ahorros en el banco), alquileres (si tienen propiedades) y beneficios (si tienen un negocio). Con ese dinero pagan sus gastos y, si pueden, ahorran.", en: "Households get money from various sources: wages (work), interest (bank savings), rent (if they own property) and profits (if they have a business). With that money they pay expenses and, if possible, save." },
        'ciutadans.pressupost': { val: "El pressupost familiar", es: "El presupuesto familiar", en: "The family budget" },
        'ciutadans.pressupost.text': { val: "Un pressupost es un pla de com gastaras els teus diners. Regla basica: no gastes mes del que guanyes! Si ingressos > despeses = estalvi. Si ingressos < despeses = deute. Es important fer un pressupost per controlar els diners i evitar sorpreses.", es: "Un presupuesto es un plan de como gastaras tu dinero. Regla basica: ¡no gastes mas de lo que ganas! Si ingresos > gastos = ahorro. Si ingresos < gastos = deuda. Es importante hacer un presupuesto para controlar el dinero.", en: "A budget is a plan for how you'll spend your money. Basic rule: don't spend more than you earn! If income > expenses = savings. If income < expenses = debt. It's important to budget to control money." },
        'ciutadans.estalvi': { val: "L'estalvi i el deute", es: "El ahorro y la deuda", en: "Savings and debt" },
        'ciutadans.estalvi.text': { val: "Estalviar es guardar part dels diners per al futur. El deute es el contrari: gastar diners que no tens (prestecs, comprar a terminis). Un poc de deute pot ser util (hipoteca per a un pis), pero massa deute es perillós (no poder pagar les factures). Consell: intenta estalviar almenys un 10% del que reps.", es: "Ahorrar es guardar parte del dinero para el futuro. La deuda es lo contrario: gastar dinero que no tienes. Un poco de deuda puede ser util (hipoteca), pero demasiada deuda es peligrosa. Consejo: intenta ahorrar al menos un 10% de lo que recibes.", en: "Saving is setting aside money for the future. Debt is the opposite: spending money you don't have. Some debt can be useful (mortgage), but too much debt is dangerous. Tip: try to save at least 10% of what you receive." },
        'ciutadans.factors': { val: "Factors que influencien el consum", es: "Factores que influyen en el consumo", en: "Factors influencing consumption" },
        'ciutadans.factors.renda': { val: "Renda: com mes diners tens, mes consumeixes (i consumeixes coses diferents)", es: "Renta: cuanto mas dinero tienes, mas consumes (y consumes cosas diferentes)", en: "Income: the more money you have, the more you consume (and different things)" },
        'ciutadans.factors.preus': { val: "Preus: si un producte puja de preu, normalment en compres menys", es: "Precios: si un producto sube de precio, normalmente compras menos", en: "Prices: if a product's price rises, you usually buy less" },
        'ciutadans.factors.publicitat': { val: "Publicitat: les marques gasten milions per convencer-te que necessites els seus productes", es: "Publicidad: las marcas gastan millones para convencerte de que necesitas sus productos", en: "Advertising: brands spend millions to convince you that you need their products" },
        'ciutadans.factors.moda': { val: "Moda i tendencies: moltes compres es fan per pressio social, no per necessitat real", es: "Moda y tendencias: muchas compras se hacen por presion social, no por necesidad real", en: "Fashion and trends: many purchases are made due to social pressure, not real need" },
        'ciutadans.drets': { val: "Drets del consumidor", es: "Derechos del consumidor", en: "Consumer rights" },
        'ciutadans.drets.informacio': { val: "Dret a la informacio: saber que compres, ingredients, origen, preu real", es: "Derecho a la informacion: saber que compras, ingredientes, origen, precio real", en: "Right to information: know what you buy, ingredients, origin, real price" },
        'ciutadans.drets.garantia': { val: "Dret a la garantia: si un producte ix defectuos, te'l reparen, canvien o tornen els diners", es: "Derecho a la garantia: si un producto sale defectuoso, te lo reparan, cambian o devuelven el dinero", en: "Right to warranty: if a product is defective, they repair, replace or refund it" },
        'ciutadans.drets.reclamacio': { val: "Dret a reclamar: pots posar una reclamacio si t'enganyen o el servei es dolent", es: "Derecho a reclamar: puedes poner una reclamacion si te enganan o el servicio es malo", en: "Right to complain: you can file a complaint if you're deceived or the service is poor" },
        'ciutadans.desigualtat': { val: "Desigualtat i redistribucio", es: "Desigualdad y redistribucion", en: "Inequality and redistribution" },
        'ciutadans.desigualtat.text': { val: "No totes les families tenen els mateixos ingressos. La desigualtat economica vol dir que uns tenen molt i altres molt poc. Per reduir-la, l'Estat redistribueix: cobra mes impostos als que mes guanyen i ofereix ajudes (beques, sanitat gratuïta, pensions) als que menys tenen.", es: "No todas las familias tienen los mismos ingresos. La desigualdad economica significa que unos tienen mucho y otros muy poco. Para reducirla, el Estado redistribuye: cobra mas impuestos a los que mas ganan y ofrece ayudas a los que menos tienen.", en: "Not all households have the same income. Economic inequality means some have a lot and others very little. To reduce it, the State redistributes: charges more taxes to the highest earners and offers aid to the lowest." },
        'ciutadans.consells': { val: "Consells per a un adolescent", es: "Consejos para un adolescente", en: "Tips for a teenager" },
        'ciutadans.consell1': { val: "Fes un pressupost mensual, encara que siga senzill (paga + regalos - despeses)", es: "Haz un presupuesto mensual, aunque sea sencillo (paga + regalos - gastos)", en: "Make a monthly budget, even a simple one (allowance + gifts - expenses)" },
        'ciutadans.consell2': { val: "Abans de comprar, espera 24 hores: si dema encara ho vols, potser si que ho necessites", es: "Antes de comprar, espera 24 horas: si manana aun lo quieres, quizas si lo necesitas", en: "Before buying, wait 24 hours: if you still want it tomorrow, maybe you do need it" },
        'ciutadans.consell3': { val: "Compara preus abans de comprar (especialment online)", es: "Compara precios antes de comprar (especialmente online)", en: "Compare prices before buying (especially online)" },
        'ciutadans.consell4': { val: "Estalvia per a objectius concrets: un viatge, un gadget, un curs", es: "Ahorra para objetivos concretos: un viaje, un gadget, un curso", en: "Save for specific goals: a trip, a gadget, a course" },

        // ========================================================================
        // Unit 5: El sector public (INTERACTIVE SIMULATOR)
        // ========================================================================
        'sector-public.title': { val: "El sector public", es: "El sector publico", en: "The public sector" },
        'sector-public.subtitle': { val: "Que fa l'Estat amb els teus impostos", es: "Que hace el Estado con tus impuestos", en: "What the State does with your taxes" },
        'sector-public.why': { val: "Cada vegada que compres alguna cosa, pagues IVA (un impost). Els teus pares paguen IRPF del seu sou. Pero... on van eixos diners? Serveixen per pagar la teua educacio, la sanitat, les carreteres, les pensions dels iaios... Entendre el sector public et fa un ciutada mes conscient.", es: "Cada vez que compras algo, pagas IVA (un impuesto). Tus padres pagan IRPF de su sueldo. Pero... ¿donde va ese dinero? Sirve para pagar tu educacion, la sanidad, las carreteras, las pensiones de los abuelos... Entender el sector publico te hace un ciudadano mas consciente.", en: "Every time you buy something, you pay VAT (a tax). Your parents pay income tax from their salary. But... where does that money go? It pays for your education, healthcare, roads, grandparents' pensions... Understanding the public sector makes you a more aware citizen." },
        'sector-public.tab.teoria': { val: "Teoria", es: "Teoria", en: "Theory" },
        'sector-public.tab.simulador': { val: "Simulador", es: "Simulador", en: "Simulator" },
        'sector-public.funcions': { val: "Funcions del sector public", es: "Funciones del sector publico", en: "Functions of the public sector" },
        'sector-public.funcio.bens': { val: "Proveir bens publics: coses que el mercat no produiria per si sol (defensa, enllumenat public, parcs). Son per a tothom i no s'esgoten.", es: "Proveer bienes publicos: cosas que el mercado no produciria por si solo (defensa, alumbrado publico, parques). Son para todos y no se agotan.", en: "Provide public goods: things the market wouldn't produce on its own (defence, street lighting, parks). They're for everyone and don't run out." },
        'sector-public.funcio.redistribuir': { val: "Redistribuir la renda: cobrar mes als que mes tenen i ajudar als que menys tenen (beques, pensions, subsidis).", es: "Redistribuir la renta: cobrar mas a los que mas tienen y ayudar a los que menos tienen (becas, pensiones, subsidios).", en: "Redistribute income: charge more to the wealthy and help those with less (grants, pensions, subsidies)." },
        'sector-public.funcio.regular': { val: "Regular l'economia: posar normes perque les empreses no abusen (lleis de competencia, proteccio del consumidor, normativa laboral).", es: "Regular la economia: poner normas para que las empresas no abusen (leyes de competencia, proteccion del consumidor, normativa laboral).", en: "Regulate the economy: set rules so firms don't abuse (competition laws, consumer protection, labour regulations)." },
        'sector-public.funcio.estabilitzar': { val: "Estabilitzar l'economia: en epoques de crisi, l'Estat pot gastar mes per reactivar l'economia. En epoques de bonanca, pot estalviar.", es: "Estabilizar la economia: en epocas de crisis, el Estado puede gastar mas para reactivar la economia. En epocas de bonanza, puede ahorrar.", en: "Stabilise the economy: in times of crisis, the State can spend more to revive the economy. In good times, it can save." },
        'sector-public.ingressos': { val: "Ingressos publics: els impostos", es: "Ingresos publicos: los impuestos", en: "Public revenue: taxes" },
        'sector-public.directes': { val: "Impostos directes: es paguen sobre la renda o el patrimoni. L'IRPF el pagues sobre el teu sou. L'Impost de Societats el paguen les empreses sobre els seus beneficis. Pagues mes si guanyes mes (son progressius).", es: "Impuestos directos: se pagan sobre la renta o el patrimonio. El IRPF lo pagas sobre tu sueldo. El Impuesto de Sociedades lo pagan las empresas sobre sus beneficios. Pagas mas si ganas mas (son progresivos).", en: "Direct taxes: paid on income or wealth. Income tax is paid on your salary. Corporate tax is paid by firms on profits. You pay more if you earn more (they're progressive)." },
        'sector-public.indirectes': { val: "Impostos indirectes: es paguen sobre el consum. L'IVA es l'exemple principal: cada vegada que compres alguna cosa, pagues un 21% d'IVA (10% en aliments basics, 4% en pa, llet, llibres). Tothom paga el mateix percentatge, independentment del que guanye.", es: "Impuestos indirectos: se pagan sobre el consumo. El IVA es el ejemplo principal: cada vez que compras algo, pagas un 21% de IVA (10% en alimentos basicos, 4% en pan, leche, libros). Todos pagan el mismo porcentaje.", en: "Indirect taxes: paid on consumption. VAT is the main example: every time you buy something, you pay 21% VAT (10% on basic food, 4% on bread, milk, books). Everyone pays the same percentage." },
        'sector-public.despesa': { val: "Despesa publica", es: "Gasto publico", en: "Public spending" },
        'sector-public.despesa.sanitat': { val: "Sanitat: hospitals, centres de salut, medicaments subvencionats", es: "Sanidad: hospitales, centros de salud, medicamentos subvencionados", en: "Healthcare: hospitals, health centres, subsidised medicines" },
        'sector-public.despesa.educacio': { val: "Educacio: escoles, instituts, universitats publiques, beques", es: "Educacion: colegios, institutos, universidades publicas, becas", en: "Education: schools, high schools, public universities, grants" },
        'sector-public.despesa.pensions': { val: "Pensions: diners que reben els jubilats cada mes despres de tota una vida treballant", es: "Pensiones: dinero que reciben los jubilados cada mes despues de toda una vida trabajando", en: "Pensions: money retired people receive every month after a lifetime of work" },
        'sector-public.despesa.defensa': { val: "Defensa: exercit, policia, proteccio civil", es: "Defensa: ejercito, policia, proteccion civil", en: "Defence: army, police, civil protection" },
        'sector-public.despesa.altres': { val: "Altres: infraestructures (carreteres, trens), investigacio, medi ambient, cultura", es: "Otros: infraestructuras (carreteras, trenes), investigacion, medio ambiente, cultura", en: "Other: infrastructure (roads, trains), research, environment, culture" },
        'sector-public.pressupost': { val: "Pressupostos de l'Estat", es: "Presupuestos del Estado", en: "State budgets" },
        'sector-public.pressupost.text': { val: "Cada any el govern fa un pressupost: quant cobrara (impostos) i quant gastara (despesa publica). Si ingressos > despesa = superavit. Si ingressos < despesa = deficit. El deficit s'acumula com a deute public (el que l'Estat deu).", es: "Cada ano el gobierno hace un presupuesto: cuanto cobrara (impuestos) y cuanto gastara (gasto publico). Si ingresos > gasto = superavit. Si ingresos < gasto = deficit. El deficit se acumula como deuda publica.", en: "Every year the government makes a budget: how much it will collect (taxes) and spend (public spending). If revenue > spending = surplus. If revenue < spending = deficit. The deficit accumulates as public debt." },
        'sector-public.benestar': { val: "L'Estat del Benestar", es: "El Estado del Bienestar", en: "The Welfare State" },
        'sector-public.benestar.text': { val: "Es un model on l'Estat garanteix uns serveis basics a tots els ciutadans: sanitat gratuïta, educacio publica, pensions, prestacions per desocupacio. Existeix a la majoria de paisos europeus, inclosa Espanya. Es financa amb impostos.", es: "Es un modelo donde el Estado garantiza unos servicios basicos a todos los ciudadanos: sanidad gratuita, educacion publica, pensiones, prestaciones por desempleo. Existe en la mayoria de paises europeos, incluida Espana.", en: "It's a model where the State guarantees basic services to all citizens: free healthcare, public education, pensions, unemployment benefits. It exists in most European countries, including Spain." },

        'internacional.title': { val: "L'economia internacional", es: "La economia internacional", en: "International economics" },
        'internacional.subtitle': { val: "Per que els paisos comercien entre ells", es: "Por que los paises comercian entre ellos", en: "Why countries trade with each other" },
        'internacional.why': { val: "El teu mobil te components de Xina, Corea i EUA. La roba que portes pot vindre de Bangladesh. Les taronges de la teua terra s'exporten a tota Europa. Vivim en un mon connectat on tots els paisos depenen dels altres. Entendre el comerc internacional t'ajuda a entendre el mon.", es: "Tu movil tiene componentes de China, Corea y EE.UU. La ropa que llevas puede venir de Bangladesh. Las naranjas de tu tierra se exportan a toda Europa. Vivimos en un mundo conectado donde todos los paises dependen de los demas.", en: "Your phone has components from China, Korea and the USA. Your clothes may come from Bangladesh. Oranges from your region are exported all over Europe. We live in a connected world where all countries depend on each other." },
        'internacional.perQue': { val: "Per que comerciem?", es: "¿Por que comerciamos?", en: "Why do we trade?" },
        'internacional.perQue.text': { val: "Cap pais pot produir tot el que necessita de forma eficient. Espanya es bona fent taronges i oli d'oliva, pero no te petroli ni fa bons mobils. Per aixo exporta (ven a l'exterior) el que fa be i importa (compra de l'exterior) el que no pot fer o li costa massa.", es: "Ningun pais puede producir todo lo que necesita de forma eficiente. Espana es buena haciendo naranjas y aceite de oliva, pero no tiene petroleo ni hace buenos moviles. Por eso exporta lo que hace bien e importa lo que no puede hacer.", en: "No country can efficiently produce everything it needs. Spain is good at oranges and olive oil, but has no oil and doesn't make good phones. That's why it exports what it does well and imports what it can't do." },
        'internacional.avantatge': { val: "Avantatge absolut i comparatiu", es: "Ventaja absoluta y comparativa", en: "Absolute and comparative advantage" },
        'internacional.avantatge.text': { val: "Un pais te avantatge absolut si pot produir un be amb menys recursos que un altre. Pero fins i tot si un pais es millor en tot, li convé especialitzar-se en el que fa relativament millor (avantatge comparatiu) i comerciar la resta. Exemple senzill: imagina que Espanya pot fer 10 quilos de taronges o 5 metres de tela per hora, i Alemanya pot fer 4 quilos de taronges o 8 metres de tela per hora. A Espanya li convé especialitzar-se en taronges i a Alemanya en tela!", es: "Un pais tiene ventaja absoluta si puede producir un bien con menos recursos. Pero incluso si un pais es mejor en todo, le conviene especializarse en lo que hace relativamente mejor (ventaja comparativa).", en: "A country has absolute advantage if it can produce a good with fewer resources. But even if a country is better at everything, it benefits from specialising in what it does relatively better (comparative advantage)." },
        'internacional.exemple.pais': { val: "Pais", es: "Pais", en: "Country" },
        'internacional.exemple.taronges': { val: "Taronges (kg/hora)", es: "Naranjas (kg/hora)", en: "Oranges (kg/hour)" },
        'internacional.exemple.tela': { val: "Tela (metres/hora)", es: "Tela (metros/hora)", en: "Cloth (metres/hour)" },
        'internacional.exemple.conclusio': { val: "Espanya s'especialitza en taronges (10 vs 4) i Alemanya en tela (8 vs 5). Ambdos guanyen comerciant!", es: "Espana se especializa en naranjas (10 vs 4) y Alemania en tela (8 vs 5). ¡Ambos ganan comerciando!", en: "Spain specialises in oranges (10 vs 4) and Germany in cloth (8 vs 5). Both gain by trading!" },
        'internacional.exportacions': { val: "Exportacions i importacions", es: "Exportaciones e importaciones", en: "Exports and imports" },
        'internacional.exportacions.text': { val: "Exportacions: bens i serveis que venem a altres paisos (taronges, oli d'oliva, cotxes SEAT, turisme). Importacions: bens i serveis que comprem d'altres paisos (petroli, tecnologia, roba). Balanca comercial = Exportacions - Importacions. Si exportem mes del que importem, es positiva (superavit). Si importem mes, es negativa (deficit).", es: "Exportaciones: bienes y servicios que vendemos a otros paises. Importaciones: bienes y servicios que compramos de otros paises. Balanza comercial = Exportaciones - Importaciones.", en: "Exports: goods and services we sell to other countries. Imports: goods and services we buy from other countries. Trade balance = Exports - Imports." },
        'internacional.globalitzacio': { val: "Globalitzacio", es: "Globalizacion", en: "Globalisation" },
        'internacional.global.que': { val: "La globalitzacio es el proces pel qual els paisos del mon estan cada vegada mes connectats economicament, culturalment i politicament. Internet, el transport barat i els acords comercials l'han accelerat.", es: "La globalizacion es el proceso por el cual los paises del mundo estan cada vez mas conectados economica, cultural y politicamente. Internet, el transporte barato y los acuerdos comerciales la han acelerado.", en: "Globalisation is the process by which the world's countries are increasingly connected economically, culturally and politically. Internet, cheap transport and trade agreements have accelerated it." },
        'internacional.global.avantatges': { val: "Avantatges: mes varietat de productes, preus mes baixos (competencia internacional), acces a tecnologia de tot el mon, creixement economic", es: "Ventajas: mas variedad de productos, precios mas bajos, acceso a tecnologia de todo el mundo, crecimiento economico", en: "Advantages: more product variety, lower prices, access to worldwide technology, economic growth" },
        'internacional.global.desavantatges': { val: "Desavantatges: augment de la desigualtat entre paisos rics i pobres, fabriques que es traslladen a paisos amb salaris baixos (deslocalitzacio), contaminacio pel transport de mercaderies", es: "Desventajas: aumento de la desigualdad entre paises ricos y pobres, fabricas que se trasladan a paises con salarios bajos (deslocalizacion), contaminacion por transporte de mercancias", en: "Disadvantages: increased inequality between rich and poor countries, factories moving to low-wage countries (offshoring), pollution from transporting goods" },
        'internacional.organismes': { val: "Organismes internacionals", es: "Organismos internacionales", en: "International organisations" },
        'internacional.onu': { val: "ONU: Organitzacio de les Nacions Unides — busca la pau i la cooperacio entre paisos", es: "ONU: Organizacion de las Naciones Unidas — busca la paz y la cooperacion entre paises", en: "UN: United Nations — seeks peace and cooperation between countries" },
        'internacional.fmi': { val: "FMI: Fons Monetari Internacional — ajuda paisos amb problemes economics", es: "FMI: Fondo Monetario Internacional — ayuda a paises con problemas economicos", en: "IMF: International Monetary Fund — helps countries with economic problems" },
        'internacional.bm': { val: "Banc Mundial: financa projectes de desenvolupament en paisos pobres", es: "Banco Mundial: financia proyectos de desarrollo en paises pobres", en: "World Bank: finances development projects in poor countries" },
        'internacional.omc': { val: "OMC: Organitzacio Mundial del Comerc — regula el comerc entre paisos", es: "OMC: Organizacion Mundial del Comercio — regula el comercio entre paises", en: "WTO: World Trade Organisation — regulates trade between countries" },
        'internacional.ue': { val: "La Unio Europea", es: "La Union Europea", en: "The European Union" },
        'internacional.ue.desc': { val: "La UE es una unio de 27 paisos europeus. Espanya n'es membre des de 1986. Caracteristiques principals:", es: "La UE es una union de 27 paises europeos. Espana es miembro desde 1986. Caracteristicas principales:", en: "The EU is a union of 27 European countries. Spain has been a member since 1986. Main features:" },
        'internacional.ue.euro': { val: "L'euro: moneda unica compartida per 20 paisos. No cal canviar diners quan viatges per la zona euro!", es: "El euro: moneda unica compartida por 20 paises. ¡No hace falta cambiar dinero cuando viajas por la zona euro!", en: "The euro: single currency shared by 20 countries. No need to exchange money when travelling in the eurozone!" },
        'internacional.ue.mercat': { val: "Mercat unic: les mercaderies, els serveis, els diners i les persones circulen lliurement entre paisos de la UE", es: "Mercado unico: las mercancias, los servicios, el dinero y las personas circulan libremente entre paises de la UE", en: "Single market: goods, services, money and people move freely between EU countries" },
        'internacional.ue.erasmus': { val: "Lliure circulacio: pots estudiar (Erasmus), treballar i viure en qualsevol pais de la UE", es: "Libre circulacion: puedes estudiar (Erasmus), trabajar y vivir en cualquier pais de la UE", en: "Free movement: you can study (Erasmus), work and live in any EU country" },
        'internacional.taula.avantatges': { val: "Avantatges", es: "Ventajas", en: "Advantages" },
        'internacional.taula.desavantatges': { val: "Desavantatges", es: "Desventajas", en: "Disadvantages" },

        'reptes.title': { val: "Reptes economics del futur", es: "Retos economicos del futuro", en: "Future economic challenges" },
        'reptes.subtitle': { val: "Els grans desafiaments que afrontara la teua generacio", es: "Los grandes desafios que afrontara tu generacion", en: "The great challenges your generation will face" },
        'reptes.why': { val: "El mon esta canviant mes rapid que mai: canvi climatic, intel·ligencia artificial, envelliment de la poblacio... Estes son les qüestions que marcaran el teu futur. Entendre els reptes economics del futur et prepara per ser part de la solucio.", es: "El mundo esta cambiando mas rapido que nunca: cambio climatico, inteligencia artificial, envejecimiento de la poblacion... Estas son las cuestiones que marcaran tu futuro.", en: "The world is changing faster than ever: climate change, artificial intelligence, ageing population... These are the issues that will shape your future." },
        'reptes.tab.teoria': { val: "Teoria", es: "Teoria", en: "Theory" },
        'reptes.tab.quiz': { val: "Quiz: Reptes del futur", es: "Quiz: Retos del futuro", en: "Quiz: Future challenges" },
        'reptes.creixement': { val: "Creixement vs desenvolupament", es: "Crecimiento vs desarrollo", en: "Growth vs development" },
        'reptes.creixement.text': { val: "Creixement economic: que el PIB augmente (es produeix mes). Desenvolupament: que la vida de les persones millore (salut, educacio, igualtat, medi ambient). Un pais pot creixer sense desenvolupar-se (si nomes s'enriqueixen uns pocs). L'objectiu hauria de ser el desenvolupament, no nomes el creixement.", es: "Crecimiento economico: que el PIB aumente. Desarrollo: que la vida de las personas mejore (salud, educacion, igualdad, medio ambiente). Un pais puede crecer sin desarrollarse. El objetivo deberia ser el desarrollo, no solo el crecimiento.", en: "Economic growth: GDP increases. Development: people's lives improve (health, education, equality, environment). A country can grow without developing. The goal should be development, not just growth." },
        'reptes.ods': { val: "Objectius de Desenvolupament Sostenible (ODS)", es: "Objetivos de Desarrollo Sostenible (ODS)", en: "Sustainable Development Goals (SDGs)" },
        'reptes.ods.text': { val: "Son 17 objectius aprovats per l'ONU el 2015 per aconseguir un mon millor per al 2030. Inclouen: fi de la pobresa, fam zero, salut i benestar, educacio de qualitat, igualtat de genere, aigua neta, energia neta, treball decent, reduccio de desigualtats, accio climatica, entre altres. Tots estem cridats a contribuir!", es: "Son 17 objetivos aprobados por la ONU en 2015 para lograr un mundo mejor para 2030. Incluyen: fin de la pobreza, hambre cero, salud, educacion de calidad, igualdad de genero, agua limpia, energia limpia, trabajo decente, accion climatica, entre otros.", en: "They are 17 goals approved by the UN in 2015 to achieve a better world by 2030. They include: no poverty, zero hunger, health, quality education, gender equality, clean water, clean energy, decent work, climate action, among others." },
        'reptes.clima': { val: "Canvi climatic i economia", es: "Cambio climatico y economia", en: "Climate change and economics" },
        'reptes.clima.text': { val: "Les activitats economiques (fabriques, transport, energia) emeten gasos d'efecte hivernacle que escalfen el planeta. Externalitats negatives: costos que pateix tota la societat pero que les empreses no paguen (contaminacio). Solucions economiques: impostos verds (qui contamina, paga), subvencions a energies netes, economia circular (reutilitzar i reciclar).", es: "Las actividades economicas emiten gases de efecto invernadero que calientan el planeta. Externalidades negativas: costes que sufre toda la sociedad. Soluciones: impuestos verdes, subvenciones a energias limpias, economia circular.", en: "Economic activities emit greenhouse gases that warm the planet. Negative externalities: costs suffered by society but not paid by firms. Solutions: green taxes, clean energy subsidies, circular economy." },
        'reptes.pobresa': { val: "Pobresa i desigualtat", es: "Pobreza y desigualdad", en: "Poverty and inequality" },
        'reptes.pobresa.text': { val: "Mes de 700 milions de persones viuen en pobresa extrema al mon (menys de 2EUR al dia). La desigualtat entre paisos rics i pobres continua sent enorme. Tambe dins dels paisos: a Espanya, el 20% mes ric te 6 vegades mes que el 20% mes pobre.", es: "Mas de 700 millones de personas viven en pobreza extrema en el mundo. La desigualdad entre paises ricos y pobres sigue siendo enorme. Tambien dentro de los paises.", en: "Over 700 million people live in extreme poverty worldwide. Inequality between rich and poor countries remains huge. Also within countries." },
        'reptes.digital': { val: "La revolucio digital", es: "La revolucion digital", en: "The digital revolution" },
        'reptes.digital.text': { val: "La tecnologia esta canviant l'economia: economia de plataformes (Uber, Airbnb, Glovo), treball remot, intel·ligencia artificial (que pot substituir treballs rutinaris), comerc electronic (Amazon, Shein), criptomonedes. Oportunitats: nous treballs, mes eficiencia. Riscos: perdua de treballs tradicionals, bretxa digital (no tothom te acces).", es: "La tecnologia esta cambiando la economia: economia de plataformas, teletrabajo, inteligencia artificial, comercio electronico, criptomonedas. Oportunidades: nuevos trabajos, mas eficiencia. Riesgos: perdida de trabajos tradicionales, brecha digital.", en: "Technology is changing the economy: platform economy, remote work, AI, e-commerce, cryptocurrencies. Opportunities: new jobs, more efficiency. Risks: loss of traditional jobs, digital divide." },
        'reptes.col·laborativa': { val: "Economia col·laborativa", es: "Economia colaborativa", en: "Collaborative economy" },
        'reptes.col·laborativa.text': { val: "Compartir en lloc de posseir. Exemples: BlaBlaCar (compartir cotxe), Wallapop (compravenda de segona ma), coworking (compartir oficina). Avantatges: mes eficient, menys residus, mes barat. Inconvenients: pot precaritzar el treball (falsos autonoms).", es: "Compartir en lugar de poseer. Ejemplos: BlaBlaCar, Wallapop, coworking. Ventajas: mas eficiente, menos residuos, mas barato. Inconvenientes: puede precarizar el trabajo.", en: "Sharing instead of owning. Examples: BlaBlaCar, Wallapop, coworking. Advantages: more efficient, less waste, cheaper. Disadvantages: may lead to precarious work." },
        'reptes.demografia': { val: "Reptes demografics", es: "Retos demograficos", en: "Demographic challenges" },
        'reptes.demografia.text': { val: "Envelliment de la poblacio: cada vegada hi ha mes gent gran i menys joves. Aixo pressiona el sistema de pensions (menys treballadors pagant per mes jubilats). Migracions: persones que es mouen de paisos pobres a rics buscant una vida millor. Aporten ma d'obra i diversitat, pero tambe suposen reptes d'integracio.", es: "Envejecimiento de la poblacion: cada vez hay mas gente mayor y menos jovenes. Esto presiona el sistema de pensiones. Migraciones: personas que se mueven de paises pobres a ricos buscando una vida mejor.", en: "Ageing population: there are more elderly people and fewer young people. This puts pressure on the pension system. Migration: people moving from poor to rich countries seeking a better life." },

            return { qd, qo, diff, estat, explicacio };

                    {/* Demand line (red, negative slope) */}
                    <line x1={sX(0)} y1={sY(Math.min(dMaxP, maxP))} x2={sX(Math.min(dMaxQ, maxQ))} y2={sY(0)} stroke="#ef4444" strokeWidth="3" />

                    {/* Supply line (green, positive slope) */}
                    <line x1={sX(Math.max(sMinQ, 0))} y1={sY(0)} x2={sX(Math.min(sMaxQ, maxQ))} y2={sY(sMaxP)} stroke="#22c55e" strokeWidth="3" />
                    <text x={sX(Math.min(sMaxQ, maxQ)) + 5} y={sY(sMaxP) - 5} className="text-xs font-bold fill-green-500" style={{fontSize: '11px'}}>O</text>
