    (function() {

        var input = document.getElementById('numeric-input-field');
        var btn = document.getElementById('numeric-submit-btn');
        var isShowing = false;
        
        // Submit amb el botó
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            var value = input.value.trim();
            if (value && window.submitNumericAnswer) {
                window.submitNumericAnswer(value);
            }
        });
        
        // Submit amb Enter
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                var value = input.value.trim();
                if (value && window.submitNumericAnswer) {
                    window.submitNumericAnswer(value);
                }
            }
        });
        
        // API per controlar l'input
        window.numericInputAPI = {
            show: function(placeholder, lang) {
                input.value = '';
                container.classList.add('active');
                isShowing = true;
                input.focus();
            },
            hide: function() {
                if (isShowing) {
                    container.classList.remove('active');
                    isShowing = false;
                }
            },
            reset: function() {
                input.value = '';
                container.classList.remove('active');
                isShowing = false;
            }
        };
    })();

    <script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback, memo } = React;

// TIMER AMB DOM DIRECTE - NO CAUSA CAP RE-RENDER DEL PARE!
function TimerDirect({ timerKey, onTimeUp, isActive }) {
    const timeRef = useRef(60);
    const intervalRef = useRef(null);
    const barRef = useRef(null);
    const textRef = useRef(null);
    const onTimeUpRef = useRef(onTimeUp);
    
    // Actualitzar la referència del callback sense causar re-render
    useEffect(() => {
        onTimeUpRef.current = onTimeUp;
    }, [onTimeUp]);
    
    // Reset quan canvia timerKey (nova pregunta)
    useEffect(() => {
        timeRef.current = 60;
        if (textRef.current) {
            textRef.current.textContent = '60s';
            textRef.current.className = 'text-2xl font-black min-w-[50px] text-right text-white';
        }
        if (barRef.current) {
            barRef.current.style.width = '100%';
            barRef.current.className = 'h-full bg-green-500 transition-all duration-1000';
        }
    }, [timerKey]);
    
    // Gestionar interval - actualitza DOM directament
    useEffect(() => {
        if (intervalRef.current) {
            clearInterval(intervalRef.current);
            intervalRef.current = null;
        }
        
        if (!isActive) return;
        
        intervalRef.current = setInterval(() => {
            timeRef.current -= 1;
            const t = timeRef.current;
            
            // ACTUALITZAR DOM DIRECTAMENT - SENSE setState!
            if (textRef.current) {
                textRef.current.textContent = t + 's';
                textRef.current.className = t > 30 
                    ? 'text-2xl font-black min-w-[50px] text-right text-white'
                    : t > 10 
                        ? 'text-2xl font-black min-w-[50px] text-right text-amber-400'
                        : 'text-2xl font-black min-w-[50px] text-right text-red-400 animate-pulse';
            }
            if (barRef.current) {
                barRef.current.style.width = ((t / 60) * 100) + '%';
                barRef.current.className = t > 30 
                    ? 'h-full bg-green-500 transition-all duration-1000'
                    : t > 10 
                        ? 'h-full bg-amber-500 transition-all duration-1000'
                        : 'h-full bg-red-500 transition-all duration-1000';
            }
            
            if (t <= 0) {
                clearInterval(intervalRef.current);
                intervalRef.current = null;
                if (onTimeUpRef.current) onTimeUpRef.current();
            }
        }, 1000);
        
        return () => {
            if (intervalRef.current) {
                clearInterval(intervalRef.current);
                intervalRef.current = null;
            }
        };
    }, [isActive, timerKey]);
    
    // Exposar funció per afegir temps (per l'ajuda +60s)
    useEffect(() => {
        window.addTimerTime = (seconds) => {
            timeRef.current = Math.min(timeRef.current + seconds, 120);
            if (textRef.current) textRef.current.textContent = timeRef.current + 's';
            if (barRef.current) barRef.current.style.width = Math.min((timeRef.current / 60) * 100, 100) + '%';
        };
        return () => { delete window.addTimerTime; };
    }, []);
    
    return (
        <div className="flex items-center gap-3">
            <div className="flex-1 h-2 bg-white/20 rounded-full overflow-hidden">
                <div ref={barRef} className="h-full bg-green-500 transition-all duration-1000" style={{width: '100%'}}></div>
            </div>
            <span ref={textRef} className="text-2xl font-black min-w-[50px] text-right text-white">60s</span>
        </div>
    );
}

// Efecte confetti
const Confetti = ({ show }) => {
    if (!show) return null;
    const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#ef4444'];
    return (
        <>
            {[...Array(50)].map((_, i) => (
                <div key={i} className="confetti" style={{
                    left: `${Math.random() * 100}%`,
                    backgroundColor: colors[Math.floor(Math.random() * colors.length)],
                    animationDelay: `${Math.random() * 2}s`,
                    borderRadius: Math.random() > 0.5 ? '50%' : '0',
                }}></div>
            ))}
        </>
    );
};

// Toast notifications
const Toast = ({ message, type, show }) => {
    if (!show) return null;
    const bg = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
    return (
        <div className={`fixed top-4 right-4 ${bg} text-white px-6 py-3 rounded-xl font-bold shadow-lg animate-slideIn z-50`}>
            {message}
        </div>
    );
};

// Component per mostrar punts guanyats/perduts
const PointsPopup = ({ points, show }) => {
    if (!show) return null;
    const isPositive = points > 0;
    return (
        <div className={`fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-6xl font-black animate-popIn z-50 ${isPositive ? 'text-green-400' : 'text-red-400'}`}>
            {isPositive ? '+' : ''}{points}
        </div>
    );
};

// ─── CONCURS AULA (Kahoot-style classroom mode) ──────────────────────────
function ConcursAula({ idioma, t, bancPreguntes, obtenirPreguntes, onBack }) {
    const [phase, setPhase] = useState('lobby'); // lobby, hostGame, playerGame, leaderboard
    const [roomInfo, setRoomInfo] = useState(null); // { roomCode, playerId, isHost, players }
    const [gameState, setGameState] = useState({});
    const [players, setPlayers] = useState({});
    const [categoria, setCategoria] = useState('totes');
    const [numPreguntes, setNumPreguntes] = useState(10);

    // Host-only state
    const [questions, setQuestions] = useState([]);
    const [currentQ, setCurrentQ] = useState(0);
    const [showingResults, setShowingResults] = useState(false);
    const [questionStartTime, setQuestionStartTime] = useState(0);
    const [questionTimer, setQuestionTimer] = useState(30);
    const timerRef = useRef(null);
    const revealResultsRef = useRef(null);

    // Player-only state
    const [myAnswer, setMyAnswer] = useState(null);
    const [answered, setAnswered] = useState(false);
    const [lastResult, setLastResult] = useState(null);
    const [showConfetti, setShowConfetti] = useState(false);

    // Listen to game state changes once in a room
    useEffect(() => {
        if (!roomInfo) return;
        var unsub1 = PdeRoomManager.onGameStateChange(roomInfo.roomCode, function(gs) {
            setGameState(gs || {});
        });
        var unsub2 = PdeRoomManager.onPlayersChange(roomInfo.roomCode, function(p) {
            setPlayers(p || {});
        });
        return function() { unsub1(); unsub2(); };
    }, [roomInfo]);

    // Player: react to game state changes from host
    useEffect(() => {
        if (!roomInfo || roomInfo.isHost) return;
        if (gameState.phase === 'question') {
            setMyAnswer(null);
            setAnswered(false);
            setLastResult(null);
        }
        if (gameState.phase === 'finished') {
            setPhase('leaderboard');
        }
    }, [gameState.phase, gameState.questionIndex]);

    // Host: start timer countdown
    useEffect(() => {
        if (!roomInfo || !roomInfo.isHost) return;
        if (phase !== 'hostGame' || showingResults) return;
        if (!gameState.phase || gameState.phase !== 'question') return;

        setQuestionTimer(30);
        if (timerRef.current) clearInterval(timerRef.current);
        timerRef.current = setInterval(() => {
            setQuestionTimer(prev => {
                if (prev <= 1) {
                    clearInterval(timerRef.current);
                    timerRef.current = null;
                    // Auto-reveal results when time is up
                    if (revealResultsRef.current) revealResultsRef.current();
                    return 0;
                }
                return prev - 1;
            });
        }, 1000);
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
    }, [phase, gameState.phase, gameState.questionIndex, showingResults]);

    // When lobby says game starts (host presses start)
    var handleGameStart = function(info) {
        setRoomInfo(info);
        if (info.isHost) {
            // Host: generate questions and push first one
            var qs = obtenirPreguntes(categoria).slice(0, numPreguntes);
            // For classroom mode, only use multiple choice and true/false for simplicity
            qs = qs.filter(function(q) {
                return q.tipus === 'multiple' || q.tipus === 'truefalse' || q.tipus === 'identify' || q.tipus === 'formula';
            });
            if (qs.length < 5) {
                // Fallback: get all and filter
                var allPool = [...bancPreguntes.economia, ...bancPreguntes.finances, ...bancPreguntes.empresa];
                qs = allPool.filter(function(q) {
                    return q.tipus === 'multiple' || q.tipus === 'truefalse';
                }).sort(function() { return Math.random() - 0.5; }).slice(0, numPreguntes);
            }
            setQuestions(qs);
            setCurrentQ(0);
            setShowingResults(false);
            setPhase('hostGame');

            // Serialize question for players (without correct answer)
            var q = qs[0];
            var playerQuestion = {
                pregunta: q.pregunta,
                tipus: q.tipus,
                opcions: q.opcions || null,
                index: 0,
                total: qs.length
            };
            PdeRoomManager.setGameState(info.roomCode, {
                phase: 'question',
                questionIndex: 0,
                question: playerQuestion,
                startTime: Date.now(),
                totalQuestions: qs.length,
                answers: {}
            });
            setQuestionStartTime(Date.now());
        } else {
            setPhase('playerGame');
        }
    };

    // Player: detect when host starts the game (meta status changes to 'playing')
    // Since PdeGameLobby only fires onGameStart for hosts, players need to poll meta
    useEffect(() => {
        if (phase !== 'lobby') return;
        // Check localStorage for saved room info (set by PdeGameLobby when player joins)
        var checkInterval = setInterval(function() {
            var saved = PdeRoomManager.getSavedRoom();
            if (saved && !saved.isHost && saved.code) {
                // Player has joined a room, listen for meta change
                var metaRef = PdeFirebase.ref('rooms/' + saved.code + '/meta');
                metaRef.once('value').then(function(snap) {
                    var meta = snap.val();
                    if (meta && meta.status === 'playing') {
                        clearInterval(checkInterval);
                        setRoomInfo({ roomCode: saved.code, playerId: saved.playerId, isHost: false, players: {} });
                        setPhase('playerGame');
                    }
                });
            }
        }, 1000);
        return function() { clearInterval(checkInterval); };
    }, [phase]);

    // Player waiting in lobby also detects game started via gameState
    useEffect(() => {
        if (!roomInfo || roomInfo.isHost) return;
        if (gameState.phase === 'question' && phase === 'lobby') {
            setPhase('playerGame');
        }
    }, [gameState.phase]);

    // Host: reveal results for current question
    var handleRevealResults = function() {
        if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
        setShowingResults(true);
        var q = questions[currentQ];
        var correcta = q.correcta;

        // Calculate scores for each player who answered
        var answers = gameState.answers || {};
        var updates = {};
        Object.keys(answers).forEach(function(pid) {
            var ans = answers[pid];
            var isCorrect = false;
            if (q.tipus === 'truefalse') {
                isCorrect = ans.answer === correcta;
            } else {
                isCorrect = ans.answer === correcta;
            }
            var points = 0;
            if (isCorrect) {
                var speed = Math.max(0, 30 - Math.floor((ans.time - (gameState.startTime || 0)) / 1000));
                points = 100 + speed * 10; // 100 base + up to 300 speed bonus
            }
            var currentScore = (players[pid] && players[pid].score) || 0;
            updates['players/' + pid + '/score'] = currentScore + points;
        });
        if (Object.keys(updates).length > 0) {
            PdeFirebase.ref('rooms/' + roomInfo.roomCode).update(updates);
        }
        // Update game state to show results
        PdeRoomManager.updateGameState(roomInfo.roomCode, {
            phase: 'results',
            correctAnswer: correcta,
            questionIndex: currentQ
        });
        PdeGameSounds.play('ding');
    };
    revealResultsRef.current = handleRevealResults;

    // Host: next question
    var handleNextQuestion = function() {
        var next = currentQ + 1;
        if (next >= questions.length) {
            // Game over
            PdeRoomManager.updateGameState(roomInfo.roomCode, {
                phase: 'finished'
            });
            setPhase('leaderboard');
            PdeGameSounds.play('win');
            return;
        }
        setCurrentQ(next);
        setShowingResults(false);
        var q = questions[next];
        var playerQuestion = {
            pregunta: q.pregunta,
            tipus: q.tipus,
            opcions: q.opcions || null,
            index: next,
            total: questions.length
        };
        PdeRoomManager.setGameState(roomInfo.roomCode, {
            phase: 'question',
            questionIndex: next,
            question: playerQuestion,
            startTime: Date.now(),
            totalQuestions: questions.length,
            answers: {}
        });
        setQuestionStartTime(Date.now());
    };

    // Player: submit answer
    var handlePlayerAnswer = function(answer) {
        if (answered || !roomInfo) return;
        setMyAnswer(answer);
        setAnswered(true);
        PdeGameSounds.play('pop');
        // Write answer to Firebase
        var answerUpdate = {};
        answerUpdate['answers/' + roomInfo.playerId] = {
            answer: answer,
            time: Date.now()
        };
        PdeRoomManager.updateGameState(roomInfo.roomCode, answerUpdate);
    };

    // Player: check results
    useEffect(() => {
        if (!roomInfo || roomInfo.isHost) return;
        if (gameState.phase === 'results' && answered) {
            var isCorrect = myAnswer === gameState.correctAnswer;
            setLastResult(isCorrect);
            if (isCorrect) {
                setShowConfetti(true);
                PdeGameSounds.play('win');
                setTimeout(function() { setShowConfetti(false); }, 3000);
            } else {
                PdeGameSounds.play('lose');
            }
        }
    }, [gameState.phase, gameState.correctAnswer]);

    // Get sorted leaderboard
    var getSortedPlayers = function() {
        return Object.entries(players)
            .map(function(e) { return { id: e[0], ...e[1] }; })
            .filter(function(p) { return p.connected !== false; })
            .sort(function(a, b) { return (b.score || 0) - (a.score || 0); });
    };

    var answerColors = ['bg-red-500', 'bg-blue-500', 'bg-yellow-500', 'bg-green-500'];
    var answerShapes = ['▲', '◆', '●', '■'];
    var medals = ['🥇', '🥈', '🥉'];
    var answeredCount = gameState.answers ? Object.keys(gameState.answers).length : 0;
    var totalPlayers = Object.keys(players).filter(function(id) { return players[id].connected !== false; }).length;

    // ── LOBBY PHASE ──
    if (phase === 'lobby') {
        return (
            <div>
                <div className="mb-4">
                    <button onClick={onBack} className="text-purple-300 hover:text-white transition-colors font-bold">
                        ← Tornar al concurs individual
                    </button>
                </div>

                {/* Category and question count selector for host */}
                <div className="bg-white/10 backdrop-blur rounded-2xl p-4 mb-4 space-y-3">
                    <h3 className="text-white font-bold text-center">Configuració de la partida</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        {[
                            { id: 'economia', icon: '📈', label: 'Economia' },
                            { id: 'finances', icon: '💰', label: 'Finances' },
                            { id: 'empresa', icon: '🏢', label: 'Empresa' },
                            { id: 'totes', icon: '🎯', label: 'Totes' },
                        ].map(function(cat) {
                            return (
                                <button key={cat.id} onClick={function() { setCategoria(cat.id); }}
                                    className={'px-3 py-2 rounded-xl font-bold text-sm transition-all ' +
                                        (categoria === cat.id ? 'bg-yellow-400 text-slate-900' : 'bg-white/10 text-white hover:bg-white/20')}>
                                    {cat.icon} {cat.label}
                                </button>
                            );
                        })}
                    </div>
                    <div className="flex items-center gap-3 justify-center">
                        <span className="text-white text-sm font-bold">Preguntes:</span>
                        {[5, 10, 15, 20].map(function(n) {
                            return (
                                <button key={n} onClick={function() { setNumPreguntes(n); }}
                                    className={'px-3 py-1 rounded-lg font-bold text-sm ' +
                                        (numPreguntes === n ? 'bg-yellow-400 text-slate-900' : 'bg-white/10 text-white hover:bg-white/20')}>
                                    {n}
                                </button>
                            );
                        })}
                    </div>
                </div>

                <PdeGameLobby
                    gameType="concurs-aula"
                    gameName="Concurs PDE — Mode Aula"
                    gameEmoji="🏫"
                    gameGradient="from-emerald-500 to-teal-600"
                    minPlayers={2}
                    maxPlayers={40}
                    onGameStart={handleGameStart}
                />
            </div>
        );
    }

    // ── HOST GAME VIEW ──
    if (phase === 'hostGame' && roomInfo && roomInfo.isHost) {
        var q = questions[currentQ];
        if (!q) return null;

        return (
            <div className="max-w-5xl mx-auto animate-fade">
                <PdeConfetti show={showConfetti} />

                {/* Header bar */}
                <div className="flex items-center justify-between mb-4">
                    <div className="text-white">
                        <span className="font-black text-2xl">🏫 Mode Aula</span>
                        <span className="ml-3 text-purple-300 text-sm">Sala: {roomInfo.roomCode}</span>
                    </div>
                    <div className="text-white font-bold">
                        {currentQ + 1} / {questions.length}
                    </div>
                </div>

                {/* Timer bar */}
                {!showingResults && (
                    <div className="mb-4">
                        <div className="flex items-center gap-3">
                            <div className="flex-1 h-3 bg-white/20 rounded-full overflow-hidden">
                                <div className={'h-full rounded-full transition-all duration-1000 ' +
                                    (questionTimer > 20 ? 'bg-green-500' : questionTimer > 10 ? 'bg-yellow-500' : 'bg-red-500')}
                                    style={{width: ((questionTimer / 30) * 100) + '%'}}></div>
                            </div>
                            <span className={'text-3xl font-black ' +
                                (questionTimer > 20 ? 'text-green-400' : questionTimer > 10 ? 'text-yellow-400' : 'text-red-400 animate-pulse')}>
                                {questionTimer}s
                            </span>
                        </div>
                    </div>
                )}

                {/* Question */}
                <div className="bg-indigo-800/80 backdrop-blur rounded-3xl p-8 mb-6 text-center shadow-2xl border border-indigo-500/30">
                    <p className="text-sm text-indigo-300 mb-2 font-bold">
                        {q.tipus === 'truefalse' ? 'Vertader o Fals' : 'Tria la resposta correcta'}
                    </p>
                    <h2 className="text-2xl md:text-3xl font-black text-white leading-snug">
                        {q.pregunta}
                    </h2>
                </div>

                {/* Answer options (displayed on projector) */}
                {q.tipus === 'truefalse' ? (
                    <div className="grid grid-cols-2 gap-4 mb-6">
                        {[
                            { label: 'VERTADER', val: true, color: 'bg-green-500', shape: '●' },
                            { label: 'FALS', val: false, color: 'bg-red-500', shape: '▲' }
                        ].map(function(opt, i) {
                            var isCorrectAnswer = showingResults && opt.val === q.correcta;
                            var isWrongAnswer = showingResults && opt.val !== q.correcta;
                            return (
                                <div key={i} className={'rounded-2xl p-6 text-center text-white font-black text-2xl transition-all ' +
                                    opt.color +
                                    (isCorrectAnswer ? ' ring-4 ring-yellow-400 scale-105 shadow-xl shadow-yellow-400/30' : '') +
                                    (isWrongAnswer ? ' opacity-40' : '')}>
                                    <span className="text-4xl block mb-2">{opt.shape}</span>
                                    {opt.label}
                                    {isCorrectAnswer && <span className="block text-yellow-300 text-lg mt-1">✅ Correcta!</span>}
                                </div>
                            );
                        })}
                    </div>
                ) : (
                    <div className="grid grid-cols-2 gap-4 mb-6">
                        {(q.opcions || []).map(function(opt, i) {
                            var isCorrectAnswer = showingResults && i === q.correcta;
                            var isWrongAnswer = showingResults && i !== q.correcta;
                            return (
                                <div key={i} className={'rounded-2xl p-5 text-center text-white font-bold text-lg transition-all ' +
                                    answerColors[i % answerColors.length] +
                                    (isCorrectAnswer ? ' ring-4 ring-yellow-400 scale-105 shadow-xl shadow-yellow-400/30' : '') +
                                    (isWrongAnswer ? ' opacity-40' : '')}>
                                    <span className="text-2xl block mb-1">{answerShapes[i % answerShapes.length]}</span>
                                    {opt}
                                    {isCorrectAnswer && <span className="block text-yellow-300 text-sm mt-1">✅ Correcta!</span>}
                                </div>
                            );
                        })}
                    </div>
                )}

                {/* Answer count / action buttons */}
                <div className="flex items-center justify-between">
                    <div className="bg-white/10 backdrop-blur rounded-xl px-5 py-3 text-white">
                        <span className="font-black text-2xl">{answeredCount}</span>
                        <span className="text-purple-300 ml-1">/ {totalPlayers} respostes</span>
                    </div>
                    {!showingResults ? (
                        <button onClick={handleRevealResults}
                            className="px-8 py-3 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 font-black text-lg rounded-xl hover:brightness-110 shadow-lg">
                            📊 Mostrar Resultats
                        </button>
                    ) : (
                        <button onClick={handleNextQuestion}
                            className="px-8 py-3 bg-gradient-to-r from-emerald-400 to-green-500 text-slate-900 font-black text-lg rounded-xl hover:brightness-110 shadow-lg animate-pulse">
                            {currentQ + 1 >= questions.length ? '🏆 Resultats Finals' : '➡️ Següent Pregunta'}
                        </button>
                    )}
                </div>

                {/* Mini leaderboard when showing results */}
                {showingResults && (
                    <div className="mt-6 bg-white/10 backdrop-blur rounded-2xl p-4 animate-fade">
                        <h3 className="text-white font-black text-center text-lg mb-3">🏆 Classificació Parcial</h3>
                        <div className="space-y-2">
                            {getSortedPlayers().slice(0, 5).map(function(p, i) {
                                return (
                                    <div key={p.id} className={'flex items-center gap-3 px-4 py-2 rounded-xl ' +
                                        (i === 0 ? 'bg-yellow-400/20 text-yellow-300' : 'bg-white/5 text-white')}>
                                        <span className="text-xl w-8 text-center">{medals[i] || (i + 1)}</span>
                                        <span className="font-bold flex-1 truncate">{p.name}</span>
                                        <span className="font-black text-lg">{(p.score || 0).toLocaleString()} pts</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // ── PLAYER GAME VIEW ──
    if (phase === 'playerGame' && roomInfo && !roomInfo.isHost) {
        var gsPhase = gameState.phase;
        var gQuestion = gameState.question;
        var myScore = (players[roomInfo.playerId] && players[roomInfo.playerId].score) || 0;

        // Waiting for question
        if (!gQuestion || (gsPhase !== 'question' && gsPhase !== 'results')) {
            return (
                <div className="flex items-center justify-center min-h-[60vh]">
                    <div className="text-center text-white space-y-4 animate-fade">
                        <div className="text-6xl animate-bounce">🏫</div>
                        <h2 className="text-2xl font-black">Esperant la pregunta...</h2>
                        <p className="text-purple-300">Mira la pantalla del professor</p>
                        <div className="bg-white/10 rounded-xl px-4 py-2 inline-block">
                            <span className="text-yellow-400 font-black text-xl">{myScore} pts</span>
                        </div>
                    </div>
                </div>
            );
        }

        // Show results phase
        if (gsPhase === 'results') {
            return (
                <div className="flex items-center justify-center min-h-[60vh]">
                    <PdeConfetti show={showConfetti} />
                    <div className="text-center space-y-6 animate-fade w-full max-w-sm">
                        {lastResult === true ? (
                            <div className="space-y-3">
                                <div className="text-8xl">✅</div>
                                <h2 className="text-3xl font-black text-green-400">Correcte!</h2>
                            </div>
                        ) : lastResult === false ? (
                            <div className="space-y-3">
                                <div className="text-8xl">❌</div>
                                <h2 className="text-3xl font-black text-red-400">Incorrecte</h2>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                <div className="text-8xl">⏳</div>
                                <h2 className="text-3xl font-black text-gray-500">No has respost</h2>
                            </div>
                        )}
                        <div className="bg-white/10 backdrop-blur rounded-2xl p-4">
                            <p className="text-purple-300 text-sm">La teua puntuació</p>
                            <p className="text-yellow-400 font-black text-3xl">{myScore} pts</p>
                        </div>
                        <p className="text-purple-300 text-sm">Esperant la següent pregunta...</p>
                    </div>
                </div>
            );
        }

        // Active question - show answer buttons
        return (
            <div className="flex items-center justify-center min-h-[60vh]">
                <div className="w-full max-w-md space-y-4 animate-fade">
                    {/* Score + question number */}
                    <div className="flex items-center justify-between text-white mb-2">
                        <span className="bg-white/10 rounded-lg px-3 py-1 font-bold text-sm">
                            Pregunta {(gQuestion.index || 0) + 1} / {gQuestion.total || '?'}
                        </span>
                        <span className="bg-yellow-400/20 text-yellow-400 rounded-lg px-3 py-1 font-bold text-sm">
                            {myScore} pts
                        </span>
                    </div>

                    {answered ? (
                        <div className="text-center space-y-4 py-8">
                            <div className="text-6xl animate-bounce">✅</div>
                            <h2 className="text-2xl font-black text-white">Resposta enviada!</h2>
                            <p className="text-purple-300">Esperant els resultats...</p>
                        </div>
                    ) : gQuestion.tipus === 'truefalse' ? (
                        <div className="grid grid-cols-1 gap-4">
                            <button onClick={function() { handlePlayerAnswer(true); }}
                                className="py-8 bg-green-500 rounded-2xl text-white font-black text-2xl hover:brightness-110 active:scale-95 transition-all shadow-lg">
                                <span className="text-4xl block mb-1">●</span>
                                VERTADER
                            </button>
                            <button onClick={function() { handlePlayerAnswer(false); }}
                                className="py-8 bg-red-500 rounded-2xl text-white font-black text-2xl hover:brightness-110 active:scale-95 transition-all shadow-lg">
                                <span className="text-4xl block mb-1">▲</span>
                                FALS
                            </button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-2 gap-3">
                            {(gQuestion.opcions || []).map(function(opt, i) {
                                return (
                                    <button key={i} onClick={function() { handlePlayerAnswer(i); }}
                                        className={'py-6 rounded-2xl text-white font-bold text-base hover:brightness-110 active:scale-95 transition-all shadow-lg ' +
                                            answerColors[i % answerColors.length]}>
                                        <span className="text-3xl block mb-1">{answerShapes[i % answerShapes.length]}</span>
                                        {opt}
                                    </button>
                                );
                            })}
                        </div>
                    )}
                </div>
            </div>
        );
    }

    // ── LEADERBOARD (FINAL) ──
    if (phase === 'leaderboard') {
        var sorted = getSortedPlayers();
        return (
            <div className="max-w-2xl mx-auto text-center space-y-6 animate-fade">
                <PdeConfetti show={true} />
                <div className="text-6xl mb-2 animate-bounce">🏆</div>
                <h1 className="text-4xl font-black text-white">Resultats Finals!</h1>
                <p className="text-purple-300">Concurs PDE — Mode Aula</p>

                {/* Podium */}
                {sorted.length >= 1 && (
                    <div className="flex items-end justify-center gap-4 my-8">
                        {sorted.length >= 2 && (
                            <div className="text-center">
                                <div className="bg-gradient-to-t from-gray-300 to-gray-200 rounded-t-xl w-24 h-24 flex items-end justify-center pb-2">
                                    <span className="text-3xl">🥈</span>
                                </div>
                                <div className="bg-gray-200 p-2 rounded-b-xl">
                                    <p className="font-bold text-gray-800 text-sm truncate w-24">{sorted[1].name}</p>
                                    <p className="text-gray-600 font-black text-sm">{(sorted[1].score || 0).toLocaleString()}</p>
                                </div>
                            </div>
                        )}
                        <div className="text-center">
                            <div className="bg-gradient-to-t from-yellow-400 to-yellow-300 rounded-t-xl w-28 h-32 flex items-end justify-center pb-2">
                                <span className="text-4xl">🥇</span>
                            </div>
                            <div className="bg-yellow-300 p-2 rounded-b-xl">
                                <p className="font-bold text-gray-800 truncate w-28">{sorted[0].name}</p>
                                <p className="text-gray-800 font-black">{(sorted[0].score || 0).toLocaleString()}</p>
                            </div>
                        </div>
                        {sorted.length >= 3 && (
                            <div className="text-center">
                                <div className="bg-gradient-to-t from-amber-600 to-amber-500 rounded-t-xl w-24 h-20 flex items-end justify-center pb-2">
                                    <span className="text-3xl">🥉</span>
                                </div>
                                <div className="bg-amber-500 p-2 rounded-b-xl">
                                    <p className="font-bold text-white text-sm truncate w-24">{sorted[2].name}</p>
                                    <p className="text-white font-black text-sm">{(sorted[2].score || 0).toLocaleString()}</p>
                                </div>
                            </div>
                        )}
                    </div>
                )}

                {/* Full ranking */}
                <div className="bg-white/10 backdrop-blur rounded-2xl p-4 space-y-2">
                    {sorted.map(function(p, i) {
                        return (
                            <div key={p.id} className={'flex items-center gap-3 px-4 py-3 rounded-xl transition-all ' +
                                (i === 0 ? 'bg-yellow-400/20 text-yellow-300 scale-105' : i < 3 ? 'bg-white/10 text-white' : 'bg-white/5 text-purple-200')}>
                                <span className="text-xl w-8 text-center font-black">{medals[i] || (i + 1)}</span>
                                <span className="font-bold flex-1 truncate">{p.name}</span>
                                <span className="font-black text-lg">{(p.score || 0).toLocaleString()} pts</span>
                            </div>
                        );
                    })}
                </div>

                <div className="flex gap-3 justify-center">
                    <button onClick={function() {
                        PdeRoomManager.deleteRoom(roomInfo.roomCode);
                        PdeRoomManager.clearSavedRoom();
                        setRoomInfo(null);
                        setPhase('lobby');
                        setGameState({});
                        setPlayers({});
                        setQuestions([]);
                        setCurrentQ(0);
                    }} className="px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold rounded-xl hover:brightness-110">
                        🔄 Nova Partida
                    </button>
                    <button onClick={onBack} className="px-6 py-3 bg-white/10 text-white font-bold rounded-xl hover:bg-white/20">
                        🏠 Tornar
                    </button>
                </div>
            </div>
        );
    }

    return null;
}

    const guardarAlRanking = async (entry) => {
        if (!window.storage) {
            // Fallback a localStorage si no hi ha storage compartit
            const saved = localStorage.getItem('pde_concurs_ranking_v4') || '[]';
            const all = JSON.parse(saved);
            all.push(entry);
            localStorage.setItem('pde_concurs_ranking_v4', JSON.stringify(all));
            return;
        }
        
        try {
            const key = `ranking:${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            await window.storage.set(key, JSON.stringify(entry), true); // shared: true
        } catch (e) {
            console.error('Error guardant ranking:', e);
        }
    };
    
    const carregarRanking = async (filtreTemps, filtreCategoria) => {
        setRankingLoading(true);
        let entries = [];
        
        if (!window.storage) {
            // Fallback a localStorage
            const saved = localStorage.getItem('pde_concurs_ranking_v4') || '[]';
            entries = JSON.parse(saved);
        } else {
            try {
                const result = await window.storage.list('ranking:', true); // shared: true
                if (result && result.keys) {
                    for (const key of result.keys) {
                        try {
                            const data = await window.storage.get(key, true);
                            if (data && data.value) {
                                entries.push(JSON.parse(data.value));
                            }
                        } catch (e) {
                            // Ignorar entrades corruptes
                        }
                    }
                }
            } catch (e) {
                console.error('Error carregant ranking:', e);
                // Fallback a localStorage
                const saved = localStorage.getItem('pde_concurs_ranking_v4') || '[]';
                entries = JSON.parse(saved);
            }
        }
        
        // Filtrar per temps (etern o mensual)
        const ara = new Date();
        const mesActual = `${ara.getFullYear()}-${String(ara.getMonth() + 1).padStart(2, '0')}`;
        
        if (filtreTemps === 'mensual') {
            entries = entries.filter(e => e.mes === mesActual);
        }
        
        // Filtrar per categoria
        if (filtreCategoria !== 'general') {
            entries = entries.filter(e => e.categoria === filtreCategoria);
        }
        
        // Ordenar per punts (descendent)
        entries.sort((a, b) => b.punts - a.punts);
        
        // Limitar a màxim 3 entrades per nom
        const comptador = {};
        entries = entries.filter(e => {
            const nom = e.nom.toLowerCase();
            comptador[nom] = (comptador[nom] || 0) + 1;
            return comptador[nom] <= 3;
        });
        
        // Top 10
        entries = entries.slice(0, 10);
        
        setRanking(entries);
        setRankingLoading(false);
    };

        if (!soundEnabled) return;
        try {
            const sounds = {
                correct: [523.25, 659.25, 783.99], // Do-Mi-Sol
                wrong: [311.13, 293.66], // Mi♭-Re
                tick: [800],
                bonus: [523.25, 659.25, 783.99, 1046.50], // Do-Mi-Sol-Do'
            };
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = sounds[type] || [440];
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3);
                osc.start(ctx.currentTime + i * 0.1);
                osc.stop(ctx.currentTime + i * 0.1 + 0.3);
            });
        } catch(e) { console.warn('PDE: Audio playback failed:', e.message || e); }
    }, [soundEnabled]);

    // Inicialitzar estats segons el tipus de pregunta
    useEffect(() => {
        if (fase !== 'jugant' || !preguntesPartida[preguntaActual]) return;
        const p = preguntesPartida[preguntaActual];
        
        if (p.tipus === 'order' || p.tipus === 'match_risk') {
            const elements = p.elements;
            setOrdreUsuari(elements.map((_, i) => i).sort(() => Math.random() - 0.5));
        }
        if (p.tipus === 'allocate') {
            // Inicialitzar amb distribució igual
            const n = p.assets.length;
            const equalShare = Math.floor(100 / n);
            const remainder = 100 - (equalShare * n);
            setAllocations(p.assets.map((_, i) => i === 0 ? equalShare + remainder : equalShare));
        }
        if (p.tipus === 'slider_value') {
            setSliderValue(Math.floor((p.min + p.max) / 2));
        }
        if (p.tipus === 'scenario') {
            setSelectedOptions([]);
        }
        if (p.tipus === 'click_chart') {
            setClickedPoint(null);
        }
    }, [preguntaActual, fase, preguntesPartida]);
    
    const obtenirPreguntes = (cat) => {
        let pool = cat === 'totes' 
            ? [...bancPreguntes.economia, ...bancPreguntes.finances, ...bancPreguntes.empresa]
            : [...bancPreguntes[cat]];
        return pool.sort(() => Math.random() - 0.5).slice(0, 20);
    };

    const iniciarPartida = () => {
        // Llegir el nom del ref (input no controlat)
        const nom = nomInputRef.current ? nomInputRef.current.value.trim() : nomJugador.trim();
        if (!nom) { showToast(t('concursapp.introdueix_teu_nom'), 'error'); return; }
        setNomJugador(nom); // Guardar el nom al state per usar-lo després
        setPreguntesPartida(obtenirPreguntes(categoria));
        setPreguntaActual(0); setPuntuacio(0); setRespostes([]); setRatxa(0); setMaxRatxa(0);
        setRespostaUsuari(null); setMostrarResultat(false);
        setOrdreUsuari([]); setTimerKey(k => k + 1); setTimerActive(true);
        setAjudes({ cinquanta: 1, temps: 1, saltar: 1 }); setOpcionsEliminades([]);
        // Resetejar nous estats
        setClickedPoint(null); setAllocations([]); setSliderValue(25); setSelectedOptions([]);
        setFase('jugant');
        playSound('bonus');
    };

    const calcularPunts = (correcta, tempsUsed, dificultat, ratxaActual) => {
        if (!correcta) return -25;
        let base = dificultat === 'facil' ? 100 : dificultat === 'mitjana' ? 150 : 200;
        const tempsRestant = 60 - tempsUsed;
        const bonusVelocitat = tempsRestant > 40 ? Math.floor((tempsRestant - 40) * 3) : 0;
        let mult = ratxaActual >= 7 ? 3 : ratxaActual >= 5 ? 2.5 : ratxaActual >= 3 ? 2 : ratxaActual >= 1 ? 1.5 : 1;
        return Math.floor((base + bonusVelocitat) * mult);
    };

    const handleResposta = useCallback((resposta) => {
        setTimerActive(false);
        const p = preguntesPartida[preguntaActual];
        let ok = false;
        
        // Tipus tradicionals
        if (p.tipus === 'multiple' || p.tipus === 'identify' || p.tipus === 'formula') ok = resposta === p.correcta;
        else if (p.tipus === 'truefalse') ok = resposta === p.correcta;
        else if (p.tipus === 'numeric') ok = Math.abs(parseFloat(resposta) - p.correcta) <= (p.tolerancia || 0);
        else if (p.tipus === 'order' || p.tipus === 'match_risk') ok = JSON.stringify(ordreUsuari) === JSON.stringify(p.ordreCorrecte);
        
        // Nous tipus interactius
        else if (p.tipus === 'click_chart') {
            ok = resposta >= p.correctZone.min && resposta <= p.correctZone.max;
        }
        else if (p.tipus === 'allocate') {
            // Validar que cada assignació està dins del rang correcte
            ok = allocations.every((val, i) => {
                const range = p.correctRanges[i];
                return val >= range[0] && val <= range[1];
            }) && allocations.reduce((a, b) => a + b, 0) === 100;
        }
        else if (p.tipus === 'scenario') {
            // Validar opcions seleccionades
            const correctes = p.opcions.map((o, i) => o.correcta ? i : -1).filter(i => i >= 0);
            if (p.multipleCorrect) {
                ok = selectedOptions.length > 0 && selectedOptions.every(i => correctes.includes(i));
            } else {
                ok = selectedOptions.length === 1 && correctes.includes(selectedOptions[0]);
            }
        }
        else if (p.tipus === 'slider_value') {
            ok = Math.abs(sliderValue - p.correcta) <= (p.tolerancia || 0);
        }
        
        const tempsUsed = 60 - (document.querySelector('.timer-display')?.textContent?.replace('s','') || 30);
        const novaRatxa = ok ? ratxa + 1 : 0;
        const punts = calcularPunts(ok, tempsUsed, p.dificultat, ratxa);
        
        if (ok) {
            playSound('correct');
            vibrate([100]);
            if (novaRatxa >= 3) showToast(`🔥 ${t('concursapp.ratxa')} x${novaRatxa}!`, 'success');
        } else {
            playSound('wrong');
            vibrate([100, 50, 100]);
        }
        
        setPointsPopup({ show: true, points: punts });
        setTimeout(() => setPointsPopup({ show: false, points: 0 }), 1000);
        
        setRespostaUsuari(resposta); setMostrarResultat(true); setRatxa(novaRatxa);
        if (novaRatxa > maxRatxa) setMaxRatxa(novaRatxa);
        setPuntuacio(s => Math.max(0, s + punts));
        setRespostes(r => [...r, { pregunta: p.id, correcta: ok, punts, temps: tempsUsed }]);
    }, [preguntesPartida, preguntaActual, ordreUsuari, allocations, selectedOptions, sliderValue, ratxa, maxRatxa, playSound, vibrate, showToast, t]);

    // COMPONENT RANKING PREVIEW PER A LA PANTALLA D'INICI
    const RankingPreview = () => {
        const [previewRanking, setPreviewRanking] = useState([]);
        const [loading, setLoading] = useState(true);
        
        useEffect(() => {
            const carregarPreview = async () => {
                setLoading(true);
                let entries = [];
                
                if (!window.storage) {
                    const saved = localStorage.getItem('pde_concurs_ranking_v4') || '[]';
                    entries = JSON.parse(saved);
                } else {
                    try {
                        const result = await window.storage.list('ranking:', true);
                        if (result && result.keys) {
                            for (const key of result.keys.slice(0, 50)) { // Limitar per rendiment
                                try {
                                    const data = await window.storage.get(key, true);
                                    if (data && data.value) {
                                        entries.push(JSON.parse(data.value));
                                    }
                                } catch (e) { console.warn('PDE: Failed to parse ranking entry:', e.message || e); }
                            }
                        }
                    } catch (e) {
                        const saved = localStorage.getItem('pde_concurs_ranking_v4') || '[]';
                        entries = JSON.parse(saved);
                    }
                }
                
                // Ordenar i agafar top 3
                entries.sort((a, b) => b.punts - a.punts);
                const comptador = {};
                entries = entries.filter(e => {
                    const nom = e.nom.toLowerCase();
                    comptador[nom] = (comptador[nom] || 0) + 1;
                    return comptador[nom] <= 3;
                }).slice(0, 3);
                
                setPreviewRanking(entries);
                setLoading(false);
            };
            
            carregarPreview();
        }, []);
        
        if (loading) {
            return (
                <div className="flex justify-center items-center py-4">
                    <span className="text-2xl animate-spin">⏳</span>
                </div>
            );
        }
        
        if (previewRanking.length === 0) {
            return (
                <div className="text-center py-4 text-yellow-200/70">
                    <span className="text-3xl block mb-2">🎮</span>
                    <p className="text-sm">{t('rankingpreview.encara_hi_campions')}</p>
                    <p className="text-xs">{t('rankingpreview.sigues_primer')}</p>
                </div>
            );
        }
        
        return (
            <div className="flex justify-center items-end gap-3 py-2">
                {/* 2n lloc */}
                {previewRanking[1] && (
                    <div className="flex flex-col items-center">
                        <span className="text-2xl">🥈</span>

                        </div>
                    </div>

                {previewRanking[0] && (
                    <div className="flex flex-col items-center -mt-4">
                        <span className="text-3xl animate-bounce">👑</span>
                        <div className="w-20 h-20 gold-gradient rounded-lg flex flex-col items-center justify-center animate-glow">
                            <p className="text-xs font-bold text-slate-800 truncate max-w-18">{previewRanking[0].nom}</p>
                            <p className="text-lg font-black text-slate-900">{previewRanking[0].punts}</p>
                        </div>
                    </div>
                )}
                
                {/* 3r lloc */}
                {previewRanking[2] && (
                    <div className="flex flex-col items-center">

                            <p className="text-xs font-bold text-orange-900 truncate max-w-14">{previewRanking[2].nom}</p>

                    <div className="p-3 bg-green-500/20 rounded-xl border border-green-400/50"><span className="text-2xl block mb-1">⏱️</span><span className="text-xs text-green-300">+60s</span></div>
                    <div className="p-3 bg-amber-500/20 rounded-xl border border-amber-400/50"><span className="text-2xl block mb-1">⏭️</span><span className="text-xs text-amber-300">{t('pantallainici.saltar')}</span></div>

    // PANTALLA JOC
    const PantallaJoc = () => {
        const p = preguntesPartida[preguntaActual];
        if (!p) return null;
        const progressPct = ((preguntaActual + 1) / preguntesPartida.length) * 100;
        const tipusIcons = { 
            numeric: '🧮', order: '🔢', formula: '📝', identify: '📊', truefalse: '✓✗', multiple: '🔘',
            click_chart: '📈', allocate: '💼', scenario: '🎭', slider_value: '🎚️', match_risk: '🎯'
        };
        
        return (
            <div className="max-w-3xl mx-auto space-y-4 animate-fade">
                {/* Header */}
                <div className="flex items-center justify-between bg-white/10 backdrop-blur rounded-xl p-3 border border-white/20">

                        <span className="font-bold text-white bg-white/20 px-3 py-1 rounded-lg">{preguntaActual + 1}/{preguntesPartida.length}</span>
                        <div className="flex items-center gap-1 bg-yellow-400/20 text-yellow-400 px-3 py-1 rounded-lg">
                            <span>🏆</span><span className="font-bold">{puntuacio}</span>
                        </div>
                        {ratxa >= 1 && (
                            <div className={`flex items-center gap-1 px-3 py-1 rounded-lg ${ratxa >= 5 ? 'bg-red-500/30 text-red-400 streak-fire' : ratxa >= 3 ? 'bg-orange-400/30 text-orange-400' : 'bg-amber-400/20 text-amber-400'}`}>
                                <span>{ratxa >= 5 ? '🔥🔥' : ratxa >= 3 ? '🔥' : '✨'}</span>
                                <span className="font-bold">x{ratxa >= 7 ? '3' : ratxa >= 5 ? '2.5' : ratxa >= 3 ? '2' : '1.5'}</span>
                            </div>
                        )}
                    </div>
                </div>
                
                {/* Timer i Progrés */}
                <div className="space-y-2">
                    <div className="h-2 bg-white/20 rounded-full overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-300" style={{ width: `${progressPct}%` }}></div>
                    </div>
                    <TimerDirect timerKey={timerKey} onTimeUp={handleTimeUp} isActive={timerActive && !mostrarResultat} />
                </div>
                
                {/* Ajudes */}

                        </button>
                        <button onClick={usarAjudaSaltar} disabled={ajudes.saltar <= 0} className={`px-4 py-2 rounded-lg font-bold text-sm transition-all ${ajudes.saltar > 0 ? 'bg-amber-500/30 text-amber-300 hover:bg-amber-500/50' : 'bg-white/10 text-white/30 cursor-not-allowed'}`}>
                            ⏭️ ({ajudes.saltar})
                        </button>
                    </div>
                )}
                
                {/* Pregunta */}
                <Card className={mostrarResultat ? (respostes[respostes.length - 1]?.correcta ? 'animate-correct' : 'animate-wrong') : ''}>
                    <div className="flex items-center gap-2 mb-4">
                        <span className={`px-3 py-1 rounded-lg text-xs font-bold ${p.dificultat === 'facil' ? 'bg-green-400/30 text-green-300' : p.dificultat === 'mitjana' ? 'bg-amber-400/30 text-amber-300' : 'bg-red-400/30 text-red-300'}`}>
                            {p.dificultat === 'facil' ? '⭐' : p.dificultat === 'mitjana' ? '⭐⭐' : '⭐⭐⭐'}

                        <span className="text-lg">{tipusIcons[p.tipus]}</span>
                    </div>
                    
                    <h3 className="text-xl md:text-2xl font-bold text-white mb-6">{p.pregunta}</h3>
                    
                    {p.imatge && renderGrafic(p.imatge)}

                    {/* Vertader/Fals */}

                                    <p className="text-lg">{t('pantallajoc.escriu_resposta_baix')}</p>
                                </div>
                            ) : (
                                <div className="text-center py-4">
                                    <p className="text-lg text-white">{t('pantallajoc.resposta')} <strong className="text-green-400 text-2xl">{p.correcta}</strong></p>

                                </div>
                            )}
                        </div>
                    )}
                    
                    {/* Ordenar */}
                    {p.tipus === 'order' && (
                        <div className="space-y-4">
                            <div className="space-y-2">
                                {ordreUsuari.map((elemIdx, pos) => (
                                    <div key={pos} className={`flex items-center gap-3 p-4 rounded-xl border-2 transition-all ${mostrarResultat ? pos === p.ordreCorrecte.indexOf(elemIdx) ? 'border-green-400 bg-green-400/20' : 'border-red-400 bg-red-400/20' : 'border-white/30 bg-white/5'}`}>
                                        <span className="font-bold text-purple-300 w-8 text-lg">{pos + 1}.</span>
                                        <span className="flex-1 font-medium text-white">{p.elements[elemIdx]}</span>
                                        {!mostrarResultat && (
                                            <div className="flex gap-2">
                                                <button onClick={() => moureElement(pos, -1)} disabled={pos === 0} className="w-12 h-12 rounded-lg bg-white/20 hover:bg-white/30 disabled:opacity-30 text-white font-bold text-xl active:scale-90">▲</button>
                                                <button onClick={() => moureElement(pos, 1)} disabled={pos === ordreUsuari.length - 1} className="w-12 h-12 rounded-lg bg-white/20 hover:bg-white/30 disabled:opacity-30 text-white font-bold text-xl active:scale-90">▼</button>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                            {!mostrarResultat && <button onClick={() => handleResposta('order')} className="w-full py-4 bg-gradient-to-r from-blue-500 to-purple-500 text-white font-bold rounded-xl hover:opacity-90 active:scale-95">{t('pantallajoc.confirmar')}</button>}
                        </div>
                    )}
                    
                    {/* CLICK_CHART - Gràfic clicable */}
                    {p.tipus === 'click_chart' && (
                        <div className="space-y-4">
                            <div className="bg-white/5 rounded-xl p-4 border border-white/20">
                                <div className="relative h-48">

                                    <div className="absolute left-0 top-0 bottom-8 w-8 flex flex-col justify-between text-xs text-purple-300">
                                        <span>{Math.max(...p.chartData)}</span>
                                        <span>{Math.min(...p.chartData)}</span>
                                    </div>
                                    {/* Gràfic */}
                                    <div className="ml-10 h-40 flex items-end gap-1">
                                        {p.chartData.map((val, i) => {
                                            const height = ((val - Math.min(...p.chartData)) / (Math.max(...p.chartData) - Math.min(...p.chartData))) * 100;
                                            const isClicked = clickedPoint === i;
                                            const isCorrect = i >= p.correctZone.min && i <= p.correctZone.max;
                                            return (
                                                <button key={i} onClick={() => !mostrarResultat && setClickedPoint(i)} disabled={mostrarResultat}
                                                    className={`flex-1 rounded-t-lg transition-all relative group ${
                                                        mostrarResultat 
                                                            ? isCorrect ? 'bg-green-500' : isClicked ? 'bg-red-500' : 'bg-blue-500/50'
                                                            : isClicked ? 'bg-yellow-400 ring-2 ring-yellow-300' : 'bg-blue-500 hover:bg-blue-400'
                                                    }`}
                                                    style={{ height: `${Math.max(height, 10)}%` }}>
                                                    {isClicked && !mostrarResultat && <span className="absolute -top-6 left-1/2 -translate-x-1/2 text-yellow-400">📍</span>}
                                                    <span className="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] text-purple-300 opacity-0 group-hover:opacity-100">{val}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                            {!mostrarResultat && clickedPoint !== null && (
                                <button onClick={() => handleResposta(clickedPoint)} className="w-full py-4 bg-gradient-to-r from-blue-500 to-purple-500 text-white font-bold rounded-xl hover:opacity-90 active:scale-95">
                                    {t('pantallajoc.confirmar_selecció')}
                                </button>
                            )}
                            {mostrarResultat && p.pista && <p className="text-sm text-purple-300 text-center">💡 {p.pista}</p>}
                        </div>
                    )}
                    
                    {/* ALLOCATE - Distribuir cartera */}
                    {p.tipus === 'allocate' && (
                        <div className="space-y-4">
                            {p.assets.map((asset, i) => {
                                const canDecrease = allocations[i] >= 5;
                                const canIncrease = allocations.some((val, j) => j !== i && val >= 5);
                                
                                return (
                                    <div key={i} className={`p-4 rounded-xl border-2 transition-all ${
                                        mostrarResultat 
                                            ? (allocations[i] >= p.correctRanges[i][0] && allocations[i] <= p.correctRanges[i][1]) 
                                                ? 'border-green-400 bg-green-400/20' 
                                                : 'border-red-400 bg-red-400/20'
                                            : 'border-white/30 bg-white/5'
                                    }`}>
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-lg">
                                                <span className="mr-2">{asset.icon}</span>
                                                <span className="text-white font-medium">{asset.nom}</span>
                                            </span>
                                            <div className="flex items-center gap-2">
                                                {!mostrarResultat && (
                                                    <button 
                                                        onClick={() => {
                                                            if (!canDecrease) return;
                                                            const newAllocs = [...allocations];
                                                            newAllocs[i] -= 5;
                                                            // Afegir 5 al següent que tingui menys de 100
                                                            for (let j = 0; j < newAllocs.length; j++) {
                                                                if (j !== i) {
                                                                    newAllocs[j] += 5;
                                                                    break;
                                                                }
                                                            }
                                                            setAllocations(newAllocs);
                                                        }}

                                                    </button>
                                                )}

                                                {!mostrarResultat && (
                                                    <button 
                                                        onClick={() => {
                                                            if (!canIncrease) return;
                                                            const newAllocs = [...allocations];
                                                            newAllocs[i] += 5;
                                                            // Treure 5 del primer que tingui >=5
                                                            for (let j = 0; j < newAllocs.length; j++) {
                                                                if (j !== i && newAllocs[j] >= 5) {
                                                                    newAllocs[j] -= 5;
                                                                    break;
                                                                }
                                                            }
                                                            setAllocations(newAllocs);
                                                        }}
                                                        disabled={!canIncrease}
                                                        className={`w-10 h-10 rounded-lg font-bold text-xl active:scale-90 transition-all ${canIncrease ? 'bg-green-500/30 text-green-300 hover:bg-green-500/50' : 'bg-white/10 text-white/30 cursor-not-allowed'}`}>

                                        </div>

                                        <div className="h-4 bg-white/10 rounded-full overflow-hidden">

                                        )}
                                    </div>

                            })}

                                <button onClick={() => handleResposta('allocate')} className="w-full py-4 bg-gradient-to-r from-blue-500 to-purple-500 text-white font-bold rounded-xl hover:opacity-90 active:scale-95">
                                    {t('pantallajoc.confirmar')}
                                </button>
                            )}
                            {mostrarResultat && p.pista && <p className="text-sm text-purple-300 text-center">💡 {p.pista}</p>}
                        </div>
                    )}
                    
                    {/* SCENARIO - Escenaris de decisió */}
                    {p.tipus === 'scenario' && (
                        <div className="space-y-3">
                            {p.multipleCorrect && !mostrarResultat && (
                                <p className="text-sm text-amber-300 text-center">⚠️ {t('pantallajoc.pots_seleccionar_múltiples_opcions')}</p>
                            )}
                            {p.opcions.map((op, i) => {
                                const isSelected = selectedOptions.includes(i);
                                const isCorrect = op.correcta;
                                return (
                                    <button key={i} 
                                        onClick={() => {
                                            if (mostrarResultat) return;
                                            if (p.multipleCorrect) {
                                                setSelectedOptions(isSelected ? selectedOptions.filter(x => x !== i) : [...selectedOptions, i]);
                                            } else {
                                                setSelectedOptions([i]);
                                            }
                                            playSound('tick');
                                        }}
                                        disabled={mostrarResultat}
                                        className={`w-full p-4 text-left rounded-xl border-2 transition-all ${
                                            mostrarResultat 
                                                ? isCorrect ? 'border-green-400 bg-green-400/30' : isSelected ? 'border-red-400 bg-red-400/30' : 'border-white/20 opacity-40'
                                                : isSelected ? 'border-yellow-400 bg-yellow-400/20' : 'border-white/30 hover:border-white/50'
                                        }`}>
                                        <span className="text-2xl mr-3">{op.icon}</span>
                                        <span className="text-white font-medium">{op.text}</span>
                                        {isSelected && !mostrarResultat && <span className="float-right text-yellow-400">✓</span>}
                                        {mostrarResultat && isCorrect && <span className="float-right text-green-400">✓</span>}
                                        {mostrarResultat && isSelected && !isCorrect && <span className="float-right text-red-400">✗</span>}
                                    </button>
                                );
                            })}
                            {!mostrarResultat && selectedOptions.length > 0 && (
                                <button onClick={() => handleResposta('scenario')} className="w-full py-4 bg-gradient-to-r from-blue-500 to-purple-500 text-white font-bold rounded-xl hover:opacity-90 active:scale-95">
                                    {t('pantallajoc.confirmar')}
                                </button>
                            )}
                            {mostrarResultat && p.pista && <p className="text-sm text-purple-300 text-center mt-4">💡 {p.pista}</p>}
                        </div>
                    )}
                    
                    {/* SLIDER_VALUE - Ajusta el valor */}
                    {p.tipus === 'slider_value' && (
                        <div className="space-y-6">
                            <div className="bg-white/5 rounded-xl p-6 border border-white/20">
                                <div className="text-center mb-4">
                                    <span className={`text-6xl font-black ${mostrarResultat ? (Math.abs(sliderValue - p.correcta) <= (p.tolerancia || 0) ? 'text-green-400' : 'text-red-400') : 'text-yellow-400'}`}>
                                        {sliderValue}
                                    </span>
                                </div>
                                {!mostrarResultat ? (
                                    <input type="range" min={p.min} max={p.max} value={sliderValue}
                                        onChange={(e) => setSliderValue(parseInt(e.target.value))}
                                        className="w-full h-4 bg-white/20 rounded-lg appearance-none cursor-pointer accent-yellow-400" />
                                ) : (
                                    <div className="text-center text-lg text-purple-300">
                                        {t('pantallajoc.resposta_correcta')} <strong className="text-green-400">{p.correcta}</strong>
                                    </div>
                                )}
                                <div className="flex justify-between text-sm text-purple-300 mt-2">
                                    <span>{p.labels?.left || p.min}</span>
                                    <span>{p.labels?.right || p.max}</span>
                                </div>
                            </div>
                            {!mostrarResultat && (
                                <button onClick={() => handleResposta(sliderValue)} className="w-full py-4 bg-gradient-to-r from-blue-500 to-purple-500 text-white font-bold rounded-xl hover:opacity-90 active:scale-95">
                                    {t('pantallajoc.confirmar')}
                                </button>
                            )}
                            {mostrarResultat && p.pista && <p className="text-sm text-purple-300 text-center">💡 {p.pista}</p>}
                        </div>
                    )}
                    
                    {/* MATCH_RISK - Ordenar per risc (reutilitza ordre) */}
                    {p.tipus === 'match_risk' && (
                        <div className="space-y-4">
                            <div className="flex justify-between text-sm text-purple-300 px-2">
                                <span>🛡️ {t('concursapp.menys_risc')}</span>
                                <span>{t('pantallajoc.més_risc')} 🎢</span>
                            </div>
                            <div className="space-y-2">
                                {ordreUsuari.map((elemIdx, pos) => (
                                    <div key={pos} className={`flex items-center gap-3 p-4 rounded-xl border-2 transition-all ${
                                        mostrarResultat 
                                            ? p.ordreCorrecte[pos] === elemIdx ? 'border-green-400 bg-green-400/20' : 'border-red-400 bg-red-400/20' 
                                            : 'border-white/30 bg-white/5'
                                    }`}>
                                        <span className="text-2xl">{p.elements[elemIdx].icon}</span>
                                        <span className="flex-1 font-medium text-white">{p.elements[elemIdx].nom}</span>
                                        <span className={`text-sm px-2 py-1 rounded ${pos < 2 ? 'bg-green-500/30 text-green-300' : pos < 4 ? 'bg-yellow-500/30 text-yellow-300' : 'bg-red-500/30 text-red-300'}`}>
                                            {pos + 1}

                                        {!mostrarResultat && (
                                            <div className="flex gap-1">
                                                <button onClick={() => moureElement(pos, -1)} disabled={pos === 0} className="w-10 h-10 rounded-lg bg-white/20 hover:bg-white/30 disabled:opacity-30 text-white font-bold active:scale-90">▲</button>
                                                <button onClick={() => moureElement(pos, 1)} disabled={pos === ordreUsuari.length - 1} className="w-10 h-10 rounded-lg bg-white/20 hover:bg-white/30 disabled:opacity-30 text-white font-bold active:scale-90">▼</button>
                                            </div>

                                    </div>

                    {/* Botó següent */}
                    {mostrarResultat && (
