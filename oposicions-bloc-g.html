                <Card title="3. Dimensions culturals nacionals: Hofstede (1980)" icon="🌍">
                    <TheoryBlock title="3.1. El projecte IBM de Hofstede" color="indigo">
                        <p><strong>Geert Hofstede</strong> (1928-2020), al seu llibre seminal <em>Culture's Consequences</em> (1980), va analitzar enquestes de 116.000 empleats d'IBM a 50 països. Va identificar inicialment <strong>4 dimensions</strong> culturals nacionals (ampliades posteriorment a 6):</p>
                        <p>(1) <strong>Distància jeràrquica</strong> (<em>Power Distance Index</em>): grau d'acceptació de desigualtats de poder.</p>
                        <p>(2) <strong>Individualisme vs. col·lectivisme</strong>: prioritat al jo vs. al grup.</p>
                        <p>(3) <strong>Masculinitat vs. feminitat</strong>: competitivitat i assoliment vs. qualitat de vida i cooperació.</p>
                        <p>(4) <strong>Evitació de la incertesa</strong>: tolerància a l'ambigüitat.</p>
                        <p>(5) <strong>Orientació a llarg/curt termini</strong> (afegida 1991, inspirada en el confucionisme): perseverança, estalvi.</p>
                        <p>(6) <strong>Indulgència vs. contenció</strong> (afegida 2010): gratificació de desitjos vs. autocontrol.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Resultats i aplicacions" color="violet">
                        <p>Espanya es caracteritza per: distància jeràrquica mitjana-alta, col·lectivisme moderat (més que EUA), feminitat (més que Japó), alta evitació de la incertesa, orientació curt termini i indulgència moderada. La comparació amb Japó (col·lectivista, masculí, orientat a llarg termini) o els Països Nòrdics (feminins, baixa distància jeràrquica) ajuda a entendre diferències en estils directius, negociació i disseny organitzatiu.</p>
                        <p>Aplicacions: direcció d'equips multiculturals, expansió internacional (Inditex ajusta formats de botiga segons mercat), fusions i adquisicions transfrontereres.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Crítiques i alternatives" color="rose">
                        <p>El model ha rebut crítiques: representativitat (una única empresa, IBM), dades dels 70, homogeneïtzació dels països. Alternatives: projecte <strong>GLOBE</strong> (House et al., 2004) amb 9 dimensions i 62 societats; model de <strong>Trompenaars</strong> (7 dimensions).</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Estil Z, identitat i imatge corporativa" icon="🎨">
                    <TheoryBlock title="4.1. L'estil Z d'Ouchi (1981)" color="green">
                        <p>Ja presentat al Tema 59. <strong>William Ouchi</strong> va comparar empreses americanes (tipus A) i japoneses (tipus J) i va proposar un model híbrid per a Occident (tipus Z), caracteritzat per: ocupació de llarga durada, decisió consensuada, responsabilitat col·lectiva, carreres lentes i no especialitzades, control implícit informal però intensiu, holisme en l'atenció al treballador. Casos: <em>Hewlett-Packard</em>, <em>IBM</em> tradicional, i en Espanya, <em>Mercadona</em> (amb el seu «model del client com a cap»).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Identitat vs. imatge corporativa" color="indigo">
                        <p>Cal distingir:</p>
                        <p>• <strong>Identitat corporativa</strong>: el que l'empresa <em>és</em> (personalitat, valors, cultura real, visió interna).</p>
                        <p>• <strong>Identitat visual corporativa</strong>: els signes gràfics (logotip, tipografia, colors, manual d'identitat).</p>
                        <p>• <strong>Imatge corporativa</strong>: la percepció que tenen els públics externs (clients, societat, mitjans).</p>
                        <p>• <strong>Reputació corporativa</strong>: el reconeixement sostingut i agregat de l'empresa (<em>Merco Ranking</em> mesura la reputació de les empreses espanyoles anualment).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Tècniques d'investigació cultural" color="cyan">
                        <p>La cultura pot analitzar-se mitjançant: enquestes quantitatives d'engagement / clima laboral (Great Place to Work, Top Employers), entrevistes en profunditat, grups focals, observació etnogràfica, anàlisi documental (intranet, correus, memòries), estudi d'artefactes. Consultores especialitzades com Korn Ferry o el mateix <em>Hofstede Insights</em> ofereixen diagnòstics culturals professionals.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Ètica empresarial i Responsabilitat Social Corporativa" icon="⚖️">
                    <TheoryBlock title="5.1. L'ètica empresarial" color="rose">
                        <p>L'<strong>ètica empresarial</strong> és la reflexió sistemàtica sobre el que està bé o malament en el context empresarial. Autors de referència: <strong>Milton Friedman</strong> (<em>«The Social Responsibility of Business is to Increase its Profits»</em>, NYT Magazine, 1970), defensor que la responsabilitat única de l'empresa és maximitzar beneficis dins la llei; en oposició, <strong>Edward Freeman</strong> (<em>Strategic Management: A Stakeholder Approach</em>, 1984) que defensa la teoria dels <em>stakeholders</em>: l'empresa ha de respondre davant de tots els grups d'interès.</p>
                        <p>Instruments ètics pràctics: <strong>codis ètics</strong> (codi de conducta de <em>Inditex</em>, 2001), <strong>canals de denúncies</strong> (Directiva Whistleblowing 2019/1937, Llei 2/2023 espanyola), <strong>comités ètics</strong>, <strong>formacions en compliance</strong>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. La piràmide de la RSC (Carroll, 1991)" color="violet">
                        <p><strong>Archie Carroll</strong> va proposar la piràmide de 4 responsabilitats de l'empresa:</p>
                        <p>(1) <strong>Econòmica</strong> (base): ser rendible i crear valor.</p>
                        <p>(2) <strong>Legal</strong>: complir les lleis.</p>
                        <p>(3) <strong>Ètica</strong>: fer el correcte, més enllà del legal.</p>
                        <p>(4) <strong>Filantròpica</strong>: contribuir al benestar social.</p>
                        <p>Models posteriors (Elkington, 1997) han reformulat la RSC com a <strong>triple bottom line</strong>: persones, planeta i beneficis (3P). <strong>Porter i Kramer</strong> (2011) han popularitzat el <strong>Valor Compartit</strong> (Creating Shared Value, CSV).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Marc normatiu actual" color="emerald">
                        <p><strong>• ODS</strong> (Agenda 2030): 17 Objectius de Desenvolupament Sostenible.</p>
                        <p><strong>• Pacte Mundial de l'ONU</strong>: 10 principis en drets humans, treball, medi ambient i anticorrupció.</p>
                        <p><strong>• Global Reporting Initiative (GRI)</strong>: estàndards per a informes de sostenibilitat.</p>
                        <p><strong>• ISO 26000</strong>: guia de responsabilitat social (2010).</p>
                        <p><strong>• Directiva UE CSRD</strong> (2022/2464): informes de sostenibilitat obligatoris (en vigor des de 2024-2025 per a grans empreses).</p>
                        <p><strong>• Taxonomia europea verda</strong> (Reg. 2020/852): classificació d'activitats sostenibles.</p>
                        <p>Exemples: <em>Iberdrola</em> publica informe integrat anual; <em>Mercadona</em> té Model de Qualitat Total; <em>Ferrovial</em> ha emès <em>green bonds</em> per valor de 1.300 M€ (2023).</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La cultura és a l'empresa el que la personalitat és a l'individu: determina comportaments, reaccions i decisions de manera silenciosa però decisiva. El model de tres nivells de <strong>Schein (1985)</strong>, les tipologies de <strong>Handy</strong> i <strong>Cameron-Quinn</strong>, i les dimensions nacionals de <strong>Hofstede (1980)</strong> ofereixen lents complementàries per diagnosticar-la.</p>
                        <p>En un entorn on la confiança és un actiu escàs i la reputació un diferencial competitiu, la cultura ja no és un tema d'<em>soft management</em> sinó una palanca estratègica de primer ordre. L'exigència d'<strong>ètica empresarial</strong> i <strong>RSC</strong> —articulada per Carroll (1991), Freeman (1984), Elkington (1997) i Porter-Kramer (2011)— s'ha traduït en marcs normatius obligatoris (CSRD, Pacte Mundial, GRI) que professionalitzen la gestió de la sostenibilitat. El docent ha de transmetre aquestes idees amb rigor i amb exemples locals (<em>Mercadona</em>, <em>Iberdrola</em>, <em>Inditex</em>) que facen tangible l'aprenentatge.</p>
                    </div>
                </Card>

        // TEMA 63 — La comunicació a l'empresa
        // ════════════════════════════════════════════════════════════════
        const Tema63Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La <strong>comunicació</strong> és el sistema nerviós de l'empresa: l'activitat directiva més freqüent (segons <strong>Henry Mintzberg</strong>, els directius dediquen prop del <strong>80 % del seu temps</strong> a comunicar) i la més decisiva per a la coordinació, la motivació i el canvi. Sense comunicació, l'estructura més perfecta és un esquelet inert; sense comunicació, el lideratge més carismàtic no traspassa la paret del despatx.</p>
                        <p>La digitalització, el treball híbrid i la sobreabundància d'informació han transformat radicalment les pràctiques comunicatives. Slack, Microsoft Teams, Zoom i les plataformes de col·laboració s'han convertit en infraestructura bàsica. Al mateix temps, les xarxes socials han difuminat les fronteres entre comunicació interna i externa: un <em>tweet</em> d'un empleat pot esdevenir una crisi reputacional en hores.</p>
                        <p>El tema aborda: (1) concepte i elements de la comunicació; (2) funcions i barreres; (3) xarxes i estructures comunicatives; (4) comunicació interna (ascendent, descendent, horitzontal, diagonal); (5) comunicació externa i corporativa; (6) estratègia i pla de comunicació.</p>
                    </div>
                </Card>

                <Card title="1. Concepte, elements i funcions" icon="💬">
                    <TheoryBlock title="1.1. Definició i model de Shannon-Weaver (1948)" color="indigo">
                        <p>La <strong>comunicació</strong> és el procés mitjançant el qual s'intercanvia informació entre un <em>emissor</em> i un <em>receptor</em>. El model clàssic de <strong>Claude Shannon i Warren Weaver</strong> (<em>The Mathematical Theory of Communication</em>, 1948), d'origen tècnic, va ser aviat adaptat a les ciències socials. Els seus elements són: <strong>emissor</strong>, <strong>codificació</strong>, <strong>missatge</strong>, <strong>canal</strong>, <strong>decodificació</strong>, <strong>receptor</strong>, <strong>retroalimentació</strong> (<em>feedback</em>) i <strong>soroll</strong>.</p>
                        <p>L'aportació de <strong>Wilbur Schramm</strong> (1954) va ser introduir el <strong>camp d'experiència compartit</strong>: la comunicació eficaç requereix que emissor i receptor comparteixen codis i referències. Aquesta és la raó per la qual un directiu espanyol pot fracassar negociant a Tòquio si ignora els codis culturals japonesos (Tema 62).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Funcions de la comunicació (Robbins, 1991)" color="violet">
                        <p>(1) <strong>Control</strong>: verifica l'execució d'instruccions.</p>
                        <p>(2) <strong>Motivació</strong>: clarifica què s'espera, com millorar, reconeix l'esforç.</p>
                        <p>(3) <strong>Expressió emocional</strong>: vehicula la satisfacció o frustració.</p>
                        <p>(4) <strong>Informació</strong>: proporciona dades per decidir.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Barreres comunicatives" color="rose">
                        <p><strong>Tècniques</strong>: soroll, canal inadequat, saturació d'informació (<em>information overload</em>).</p>
                        <p><strong>Semàntiques</strong>: llenguatge especialitzat, diferències culturals, polisèmia.</p>
                        <p><strong>Psicològiques</strong>: percepció selectiva, estereotips, efecte halo, biaixos cognitius (Kahneman).</p>
                        <p><strong>Organitzatives</strong>: filtratge jeràrquic, distància física, estructures rígides, cultures tancades.</p>
                        <p>Gestió de barreres: escolta activa (Rogers), <em>feedback</em> estructurat, canals múltiples, simplificació del llenguatge.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Xarxes i estructures de comunicació" icon="🕸️">
                    <TheoryBlock title="2.1. Xarxes formals (Bavelas, 1950; Leavitt, 1951)" color="emerald">
                        <p>Els experiments pioners d'<strong>Alex Bavelas i Harold Leavitt</strong> sobre 5 persones resolent tasques van identificar 5 xarxes:</p>
                        <p><strong>• Cadena</strong>: A–B–C–D–E. Comunicació lineal (típica de la burocràcia).</p>
                        <p><strong>• Y</strong>: variant de la cadena amb bifurcació.</p>
                        <p><strong>• Roda</strong>: un node central connectat amb 4 perifèrics. Centralització màxima.</p>
                        <p><strong>• Cercle</strong>: tots connectats amb els dos veïns. Circular.</p>
                        <p><strong>• Tots els canals</strong> (<em>all-channel</em>): tots amb tots. Descentralitzada.</p>
                        <p>Resultats: la <em>roda</em> és la més eficient per a tasques simples, però genera baixa satisfacció als perifèrics; la xarxa <em>all-channel</em> és la més lenta però genera millor satisfacció i és òptima per a tasques complexes i creatives.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Xarxes informals: la grapevine (Davis, 1953)" color="amber">
                        <p><strong>Keith Davis</strong> va estudiar la <em>grapevine</em> (literalment, «parra»: la xarxa informal de rumors). Les seues tipologies: <em>straight line</em> (A→B→C→D), <em>gossip chain</em> (A explica a tots els altres), <em>probability chain</em> (aleatòria), <em>cluster chain</em> (selectiva, basada en afinitats). Les seues troballes: el 75 % de la informació circula amb precisió, però la negativa s'exagera. L'informal no és patològic: és inevitable i, ben gestionat, funcional.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Direcció dels fluxos comunicatius" icon="⬆️">
                    <TheoryBlock title="3.1. Comunicació descendent" color="blue">
                        <p>Flueix de dalt cap avall. Funcions: donar instruccions, fixar objectius, retroalimentar el rendiment, explicar polítiques, socialitzar. Mitjans típics: correu electrònic, intranet, reunions d'equip, circulars, butlletins interns. Risc: excés d'informació des de dalt que no s'adapta al receptor.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Comunicació ascendent" color="green">
                        <p>Flueix de baix cap a dalt. Aporta informació sobre processos, detecta problemes, capta propostes. Mitjans: bústies de suggeriments, enquestes de clima, reunions <em>skip-level</em>, <em>whistleblowing channels</em> (Llei 2/2023), entrevistes de sortida. Crítica: sovint és la més feble i s'ofeguen missatges crítics (efecte <em>shoot-the-messenger</em>).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Comunicació horitzontal i diagonal" color="violet">
                        <p><strong>Horitzontal</strong>: entre iguals jeràrquics (coordinació entre departaments).</p>
                        <p><strong>Diagonal</strong>: entre diferents nivells jeràrquics i àrees (típica de projectes matricials).</p>
                        <p>Tendència actual: les organitzacions <em>flat</em> i les metodologies àgils (Scrum) privilegien la comunicació horitzontal i diagonal.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Comunicació externa i corporativa" icon="📣">
                    <TheoryBlock title="4.1. Públics externs i canals" color="indigo">
                        <p>La comunicació externa es dirigeix a: <strong>clients</strong> (publicitat, social media, servei d'atenció), <strong>proveïdors</strong> (EDI, portals B2B), <strong>accionistes i inversors</strong> (informes anuals, <em>investor relations</em>), <strong>mitjans de comunicació</strong> (notes de premsa, rodes de premsa), <strong>administració pública</strong> (relacions institucionals), <strong>societat</strong> (RSC, ONG). És responsabilitat de departaments de màrqueting, comunicació corporativa, relacions públiques i <em>investor relations</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Comunicació corporativa integrada" color="cyan">
                        <p>Des de <strong>Van Riel</strong> (<em>Principles of Corporate Communication</em>, 1995), s'ha imposat la idea de <strong>comunicació integrada</strong>: alineament coherent de tots els missatges i canals al voltant d'una identitat corporativa. Evita contradiccions i reforça la marca. Pilars: identitat + imatge + reputació (Tema 62).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Gestió de crisi comunicativa" color="rose">
                        <p>Manual clàssic de <strong>Timothy Coombs</strong> (<em>Ongoing Crisis Communication</em>, 2007). Fases: preparació (protocols, portaveus formats), resposta (immediatesa, transparència, coherència), recuperació (anàlisi, aprenentatge). Casos docents: Germanwings 2015, Volkswagen <em>Dieselgate</em> 2015, col·lapse del Rana Plaza 2013 (impacte sobre Inditex i altres). La regla d'or: <em>«golden hour»</em> — en crisi digital, les primeres hores són crítiques.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Estratègia i pla de comunicació" icon="📋">
                    <TheoryBlock title="5.1. El pla de comunicació" color="indigo">
                        <p>Document formal que integra tota l'activitat comunicativa. Etapes: (1) anàlisi de situació (DAFO comunicatiu); (2) definició d'objectius SMART; (3) identificació de públics (segmentació); (4) missatges clau; (5) selecció de canals i mitjans; (6) calendari; (7) pressupost; (8) indicadors de seguiment (KPIs).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Mètriques i avaluació" color="emerald">
                        <p>Indicadors clau: <em>reach</em> i <em>engagement</em> a xarxes, NPS (<em>Net Promoter Score</em>), puntuació de <em>employee engagement</em> (enquestes Gallup Q12), freqüència i qualitat de comunicacions internes, volum i sentiment de mencions en premsa i xarxes (<em>media monitoring</em>).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Tendències actuals" color="violet">
                        <p><strong>• Comunicació digital i social</strong>: LinkedIn com a canal corporatiu, TikTok per a públics joves, podcasts corporatius (<em>BBVA Aprendemos Juntos</em>).</p>
                        <p><strong>• Storytelling i <em>content marketing</em></strong>: narrativa emocional (Inditex, Campofrío).</p>
                        <p><strong>• Comunicació inclusiva i no sexista</strong>: Guia ONU, RAE.</p>
                        <p><strong>• Employer Branding</strong>: atracció de talent mitjançant comunicació de marca com a ocupador.</p>
                        <p><strong>• IA generativa</strong> (ChatGPT, etc.): redacció automatitzada, traducció, personalització massiva.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La comunicació, lluny de ser un <em>soft skill</em> perifèric, és la funció directiva per excel·lència i el teixit connectiu de qualsevol organització. Des del model pioner de <strong>Shannon-Weaver (1948)</strong> i les xarxes de <strong>Bavelas-Leavitt</strong>, la recerca ha aprofundit en les barreres cognitives, les dinàmiques informals i l'impacte dels canals digitals. La direcció dels fluxos (descendent, ascendent, horitzontal, diagonal) determina la qualitat de la coordinació interna, mentre que la comunicació corporativa integrada (Van Riel, 1995) i la gestió de crisi (Coombs) configuren la reputació davant els públics externs. En l'empresa actual, la comunicació és un actiu estratègic, subjecte a planificació, mesurament i millora contínua, i indissociablement lligat a la cultura (Tema 62), el lideratge (Tema 61) i la motivació (Tema 64).</p>
                    </div>

        const Tema64Complet = () => (

                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Comprendre què mou les persones a treballar —i a fer-ho bé— constitueix un dels problemes centrals del <em>management</em> modern. La <strong>motivació laboral</strong> no és un tema perifèric de recursos humans, sinó una palanca estratègica: afecta la productivitat, la innovació, la retenció del talent, l'absentisme i fins i tot la salut mental dels treballadors. Segons l'<strong>Informe Gallup State of the Global Workplace 2024</strong>, només el 21 % dels treballadors al món declaren estar «<em>engaged</em>», amb un cost per a l'economia global estimat en 8,8 bilions de dòlars anuals en productivitat perduda.</p>
                        <p>En paral·lel, el <strong>clima organitzatiu</strong> —la percepció col·lectiva de l'ambient de treball— modula directament l'experiència motivacional individual. El clima és la manifestació visible de la cultura (Tema 62) i el resultat de la interacció entre lideratge (Tema 61), comunicació (Tema 63) i estructura (Tema 60). A Espanya, les enquestes anuals de <em>Great Place to Work</em> o el rànquing <em>Top Employers</em> documenten les empreses amb millor clima laboral: <em>Cisco</em>, <em>Mapfre</em>, <em>ING</em>, <em>Mahou-San Miguel</em>, entre altres.</p>
                        <p>El tema s'estructura en 5 blocs: (1) concepte i tipologia de motivacions; (2) teories de contingut (Maslow, Herzberg, McClelland, Alderfer); (3) teories de procés (Vroom, Adams, Locke); (4) aplicacions i tècniques motivacionals; (5) clima organitzatiu i satisfacció laboral.</p>

                <Card title="1. Concepte i tipologia de motivacions" icon="⚡">
                    <TheoryBlock title="1.1. Definició de motivació" color="indigo">
                        <p>La <strong>motivació</strong> és el conjunt de forces internes i externes que activen, dirigeixen i mantenen la conducta d'un individu cap a un objectiu. Segons <strong>Robbins</strong> (2013), és «el procés responsable de la intensitat, direcció i persistència de l'esforç d'una persona per a la consecució d'una meta». Tres dimensions clau: <em>intensitat</em>, <em>direcció</em> i <em>persistència</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Motivació intrínseca vs. extrínseca (Deci i Ryan, 1985)" color="violet">
                        <p><strong>Edward Deci i Richard Ryan</strong>, a <em>Intrinsic Motivation and Self-Determination in Human Behavior</em> (1985), van distingir:</p>
                        <p>• <strong>Motivació intrínseca</strong>: el treball és gratificant per si mateix (satisfacció, aprenentatge, sentit).</p>
                        <p>• <strong>Motivació extrínseca</strong>: la recompensa és externa al treball (salari, reconeixement, evitar càstig).</p>
                        <p>La seua <strong>Self-Determination Theory</strong> identifica 3 necessitats psicològiques bàsiques innates: <em>autonomia</em> (control), <em>competència</em> (mestria) i <em>relació</em> (vincles). Les recompenses extrínseques mal dissenyades poden <strong>erosionar</strong> la motivació intrínseca (<em>crowding-out effect</em>).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Tipologia de motivacions" color="cyan">
                        <p><strong>Segons l'origen</strong>: primàries (fisiològiques) vs. secundàries (apreses).</p>
                        <p><strong>Segons el sentit</strong>: d'aproximació (obtindre) vs. d'evitació (no perdre).</p>
                        <p><strong>Segons el contingut</strong>: econòmiques, de poder, d'afiliació, d'assoliment, de seguretat, de trascendència.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Teories de contingut: QUÈ motiva" icon="🧗">
                    <TheoryBlock title="2.1. Piràmide de Maslow (1943)" color="rose">
                        <p><strong>Abraham Maslow</strong>, a <em>A Theory of Human Motivation</em> (<em>Psychological Review</em>, 1943), va proposar 5 nivells jeràrquics de necessitats:</p>
                        <p>(1) <strong>Fisiològiques</strong> (menjar, beure, dormir) → salari bàsic.</p>
                        <p>(2) <strong>Seguretat</strong> (estabilitat, salut) → contracte fix, prevenció riscos.</p>
                        <p>(3) <strong>Socials</strong> (pertinença, afecte) → treball en equip, clima.</p>
                        <p>(4) <strong>Estima</strong> (reconeixement, estatus) → promoció, elogi públic.</p>
                        <p>(5) <strong>Autorealització</strong> (creixement personal) → projectes reptadors, formació.</p>
                        <p>Principi: un nivell es converteix en motivador només quan l'inferior està satisfet. Crítica: la seqüència rígida no es verifica empíricament; l'ordre depèn de cultura i individu. Malgrat això, continua sent el marc divulgatiu més conegut.</p>
                    </TheoryBlock>

                    {/* SVG Piràmide Maslow */}

                    <TheoryBlock title="2.2. Teoria dels dos factors (Herzberg, 1959)" color="amber">
                        <p><strong>Frederick Herzberg</strong>, a <em>The Motivation to Work</em> (1959), va estudiar 200 enginyers i comptables a Pittsburgh. Va identificar que els factors que causen <strong>satisfacció</strong> són diferents dels que causen <strong>insatisfacció</strong>:</p>
                        <p>• <strong>Factors higiènics</strong> (extrínsecs): salari, condicions físiques, supervisió, relacions, polítiques. La seua absència causa insatisfacció, però la seua presència no motiva; només evita el descontent.</p>
                        <p>• <strong>Factors motivadors</strong> (intrínsecs): assoliment, reconeixement, responsabilitat, treball interessant, creixement. La seua presència motiva i genera satisfacció.</p>
                        <p>Aplicació pràctica: l'<strong>enriquiment del lloc</strong> (<em>job enrichment</em>) augmenta els factors motivadors; l'<em>ampliació</em> (<em>job enlargement</em>) només amplia tasques del mateix nivell.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Teoria ERG (Alderfer, 1969)" color="green">
                        <p><strong>Clayton Alderfer</strong> va reformular Maslow en 3 grups: <strong>E</strong>xistència (fisiològiques + seguretat), <strong>R</strong>elació (socials + part d'estima), <strong>G</strong>rowth/Creixement (part d'estima + autorealització). Diferència clau: admet la <strong>regressió per frustració</strong> (si no s'assoleix el creixement, es pot intensificar la demanda de relació o existència).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.4. Teoria de les necessitats apreses (McClelland, 1961)" color="blue">
                        <p><strong>David McClelland</strong>, a <em>The Achieving Society</em> (1961), va identificar 3 necessitats socialment apreses:</p>
                        <p>• <strong>Necessitat d'assoliment (nAch)</strong>: voluntat d'excel·lir, de complir desafiaments. Típica d'emprenedors.</p>
                        <p>• <strong>Necessitat de poder (nPow)</strong>: influir en altres. Útil per a directius.</p>
                        <p>• <strong>Necessitat d'afiliació (nAff)</strong>: relacions interpersonals. Útil per a rols de servei al client.</p>
                        <p>El perfil motivacional es pot mesurar amb el <em>Thematic Apperception Test</em> (TAT). Les tres necessitats tenen proporcions òptimes segons el rol.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Teories de procés: COM es motiva" icon="🧮">
                    <TheoryBlock title="3.1. Teoria de les expectatives (Vroom, 1964)" color="indigo">
                        <p><strong>Victor Vroom</strong>, a <em>Work and Motivation</em> (1964), va formular la teoria més influent sobre el procés motivacional. La motivació és producte de 3 factors (model <strong>VIE</strong>):</p>
                        <p>• <strong>Expectativa</strong> (E): ¿si m'esforce, rendiré? (probabilitat que l'esforç produïsca rendiment).</p>
                        <p>• <strong>Instrumentalitat</strong> (I): ¿si rendisc, obtindré la recompensa? (probabilitat que el rendiment porte a la recompensa).</p>
                        <p>• <strong>València</strong> (V): ¿vull aqueixa recompensa? (valor que li atribueix l'individu).</p>
                    </TheoryBlock>

                    <FormulaBox formula="Motivació = Expectativa × Instrumentalitat × València" desc="Vroom (1964). Si qualsevol factor és 0, la motivació és 0." />

                    <TheoryBlock title="3.2. Teoria de l'equitat (Adams, 1965)" color="rose">
                        <p><strong>J. Stacy Adams</strong> va proposar que els treballadors comparen la seua <strong>ràtio aportacions/compensacions</strong> amb la d'altres de referència. Si perceben desigualtat, aplicaran estratègies de restauració: reduir esforç, demanar pujada, canviar de referent, o bé abandonar. La percepció d'equitat és clau per al clima i la motivació sostinguda. Les decisions salarials opaques són font freqüent d'inequitat percebuda.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Teoria de fixació d'objectius (Locke i Latham, 1968)" color="emerald">
                        <p><strong>Edwin Locke</strong> i <strong>Gary Latham</strong> van demostrar empíricament que els <strong>objectius específics i desafiadors</strong>, acceptats per l'individu i amb <em>feedback</em>, generen millor rendiment que objectius vagues o fàcils. Base científica dels objectius <strong>SMART</strong> i de l'<strong>MBO</strong> de Drucker (Tema 58).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.4. Teoria del reforçament (Skinner, 1938-1953)" color="amber">
                        <p><strong>B.F. Skinner</strong> va aplicar el condicionament operant al món laboral: la conducta és funció de les seues conseqüències (reforç positiu, negatiu, càstig, extinció). Fonament dels sistemes d'incentius per peces, comissions i <em>gamification</em> moderna.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Aplicacions i tècniques motivacionals" icon="🧰">
                    <TheoryBlock title="4.1. Disseny del lloc de treball" color="cyan">

                    </TheoryBlock>

                    <TheoryBlock title="4.2. Sistemes de retribució" color="violet">
                        <p><strong>• Retribució fixa</strong>: salari base contractual.</p>
                        <p><strong>• Retribució variable</strong>: bonus, comissions, <em>stock options</em>, participació en beneficis.</p>
                        <p><strong>• Retribució en espècie</strong>: xec menjador, guarderia, assegurança, cotxe empresa (tractament fiscal IRPF).</p>
                        <p><strong>• Retribució flexible</strong>: l'empleat tria el mix entre retribució monetària i en espècie (beneficis fiscals).</p>
                        <p>Tendència: <strong>salaris emocionals</strong> (conciliació, teletreball, dies personals) tenen pes creixent especialment entre millennials i Z. La Llei 10/2021 de treball a distància ha regulat el teletreball a Espanya.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Reconeixement i cultura del feedback" color="rose">

                    </TheoryBlock>

                <Card title="5. Clima organitzatiu i satisfacció laboral" icon="🌤️">
                    <TheoryBlock title="5.1. Concepte de clima" color="indigo">
                        <p>El <strong>clima organitzatiu</strong> és la percepció compartida pels membres d'una organització sobre l'ambient psicològic de treball. <strong>Litwin i Stringer</strong> (1968) van identificar 9 dimensions: estructura, responsabilitat, recompensa, risc, cordialitat, suport, estàndards, conflicte, identitat. Cal distingir-lo de la cultura (més profunda, de canvi lent) i de la satisfacció (individual, afectiva).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Satisfacció laboral" color="violet">
                        <p>Estat afectiu positiu cap al treball. Determinants: característiques del treball, supervisió, col·legues, retribució, oportunitats. Té conseqüències sobre productivitat, absentisme, rotació, salut mental. Mesurament: Job Descriptive Index (JDI), Minnesota Satisfaction Questionnaire (MSQ), enquestes Great Place to Work.</p>
                        <p>La <strong>Llei 31/1995 de Prevenció de Riscos Laborals</strong> inclou riscos psicosocials (estrès, burnout) el tractament dels quals ha guanyat rellevància després de la pandèmia (OMS, 2019: reconeixement oficial del <em>burnout</em> com a fenomen laboral).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Engagement i employee experience" color="cyan">
                        <p><strong>Engagement</strong> (Schaufeli, 2002): implicació emocional, vigor i absorció en el treball. Mesurable amb la UWES. <strong>Employee Experience</strong>: visió holística de tot el cicle del treballador (<em>onboarding</em>, desenvolupament, <em>offboarding</em>). Ha desplaçat progressivament el concepte tradicional de «clima».</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La motivació laboral és un dels camps més fèrtils i mixturats de la psicologia organitzativa. Les teories de contingut (<strong>Maslow 1943, Herzberg 1959, Alderfer 1969, McClelland 1961</strong>) pregunten què motiva; les de procés (<strong>Vroom 1964, Adams 1965, Locke 1968, Skinner</strong>) com es produeix motivacionalment. Cap teoria és completa per si sola: les aportacions són complementàries i cal aplicar-les segons el context.</p>
                        <p>Les pràctiques contemporànies —retribució flexible, teletreball, <em>engagement</em>, <em>employee experience</em>— reflecteixen una concepció holística del treballador com a persona completa, coherent amb la <strong>Self-Determination Theory</strong> (Deci-Ryan). El clima organitzatiu i la satisfacció laboral, mesurats amb rigor, permeten detectar palanques d'acció. En un context on la generació Z exigeix sentit, flexibilitat i impacte, les empreses espanyoles que invertiran sistemàticament en motivació i clima estaran millor posicionades per a atraure i retenir talent.</p>

                        <p className="text-center text-sm text-indigo-600 mt-1"><em>Motivació = E × I × V</em> — Vroom (1964)</p>

        const Tema65Complet = () => (

                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>En l'empresa tradicional del capitalisme industrial, <strong>propietat i control</strong> anaven plegats: el propietari era també el gestor. L'emergència de la gran corporació moderna (<em>modern corporation</em>), la dispersió accionarial i la creixent complexitat dels negocis van fracturar aquesta unitat. L'empresa contemporània és el resultat d'un llarg procés de separació entre qui posseeix els actius (els accionistes) i qui pren les decisions (els directius), amb profundes implicacions econòmiques, organitzatives i socials.</p>
                        <p>Aquest tema connecta directament amb la teoria contractual (Tema 59: Coase, Williamson, Jensen-Meckling), la cultura i ètica empresarial (Tema 62: RSC, <em>stakeholders</em>) i la presa de decisions estratègiques (Tema 57). És també el marc conceptual del <strong>govern corporatiu</strong>, un dels àmbits més dinàmics del <em>management</em> contemporani, amb intenses reformes després dels escàndols de <em>Enron</em> (2001), <em>Lehman Brothers</em> (2008), <em>Wirecard</em> (2020) o el cas <em>Abengoa</em> (2015) a Espanya.</p>
                        <p>El tema s'estructura en 5 blocs: (1) Berle i Means i la tesi de la separació; (2) la tecnoestructura de Galbraith; (3) teoria de l'agència i problema principal-agent; (4) govern corporatiu i mecanismes de control; (5) tendències actuals i empresa integrada.</p>

                <Card title="1. Berle i Means (1932): la separació propietat-control" icon="🏛️">
                    <TheoryBlock title="1.1. L'obra seminal" color="indigo">
                        <p><strong>Adolf Berle</strong> (jurista) i <strong>Gardiner Means</strong> (economista), a <em>The Modern Corporation and Private Property</em> (1932), van documentar un fenomen que marcaria el segle XX: en les 200 majors corporacions dels Estats Units a 1929, la propietat accionarial estava tan fragmentada que cap accionista individual disposava del control efectiu, que havia passat a mans dels directius professionals. Aquest és l'origen del <strong>capitalisme gerencial</strong> o <em>managerial capitalism</em>.</p>
                        <p>Les seues conclusions: (a) la propietat legal i el control real s'han dissociat; (b) els directius operen amb una autonomia considerable respecte dels accionistes; (c) els interessos dels uns i els altres poden divergir, qüestionant la presumpció clàssica que «l'empresa maximitza els beneficis».</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Tipologia d'empreses segons Berle-Means" color="violet">
                        <p>Classificació segons el grau de control accionarial:</p>
                        <p>(1) <strong>Control privat gairebé total</strong> (propietari únic, control directe).</p>
                        <p>(2) <strong>Control majoritari</strong> (&gt;50 %).</p>
                        <p>(3) <strong>Control per mitjà de dispositius legals</strong> (accions sense vot, piràmides societàries).</p>
                        <p>(4) <strong>Control minoritari efectiu</strong> (participació suficient per a controlar davant accionariat dispers).</p>
                        <p>(5) <strong>Control gerencial</strong> (dispersió extrema, directius amb control de facto).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Implicacions i crítiques" color="rose">
                        <p>La tesi de Berle-Means va inspirar corrents posteriors crítics del capitalisme corporatiu (Chandler, Galbraith). Ha estat matisada per recerca recent (La Porta, López-de-Silanes, Shleifer, 1999) que mostra que la dispersió accionarial pura és típica d'EUA i Regne Unit, però que en Europa continental, Àsia i Amèrica Llatina predominen estructures de control concentrat (famílies, bancs, holdings). A Espanya, <em>Inditex</em> (família Ortega ~59 %) o <em>Mercadona</em> (família Roig) són paradigmes d'empreses cotitzades o no cotitzades amb propietat familiar dominant.</p>

                <Card title="2. La tecnoestructura (Galbraith, 1967)" icon="⚙️">
                    <TheoryBlock title="2.1. El nou estat industrial" color="cyan">
                        <p><strong>John Kenneth Galbraith</strong>, a <em>The New Industrial State</em> (1967), va popularitzar el concepte de <strong>tecnoestructura</strong>: el conjunt de professionals especialitzats (enginyers, científics, gestors, analistes) que, col·lectivament, pren les decisions empresarials en la gran empresa moderna. La complexitat tecnològica i l'escala temporal llargues (inversions a llarg termini) requereixen expertesa col·lectiva, no pas decisions individuals.</p>
                        <p>Trets de la tecnoestructura: (a) <em>toma de decisions col·lectiva</em> per comités; (b) <strong>planificació a llarg termini</strong>; (c) <em>recerca activa del creixement</em> més que maximització de beneficis a curt (vs. neoclàssics); (d) <em>autonomia davant l'accionariat</em> (reinversió de beneficis en lloc de dividends elevats).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Objectius de la tecnoestructura" color="amber">
                        <p>Galbraith formula que els objectius dels directius-tecnòcrates són:</p>
                        <p>(1) <strong>Supervivència de l'empresa</strong> (condició necessària per conservar les seues posicions).</p>
                        <p>(2) <strong>Creixement</strong> (augmenta prestigi, salaris, oportunitats).</p>
                        <p>(3) <strong>Autonomia decisòria</strong> respecte d'accionistes i tribunals.</p>
                        <p>(4) <strong>Benefici raonable</strong> (per contentar accionistes, no maximitzat).</p>
                        <p>Connectar amb <strong>teoria del benefici satisfactori</strong> (Simon), <strong>teoria del creixement empresarial</strong> (Penrose, 1959; Marris, 1964) i <strong>maximització de vendes subjecta a mínim benefici</strong> (Baumol, 1959).</p>
                    </TheoryBlock>

                <Card title="3. Teoria de l'agència: principals i agents" icon="🔗">
                    <TheoryBlock title="3.1. El problema agent-principal" color="indigo">
                        <p>La <strong>teoria de l'agència</strong> (<em>agency theory</em>) formalitza el problema de la separació propietat-control. <strong>Michael Jensen i William Meckling</strong>, a «Theory of the Firm: Managerial Behavior, Agency Costs and Ownership Structure» (<em>Journal of Financial Economics</em>, 1976), defineixen la <strong>relació d'agència</strong> com un contracte on un <em>principal</em> delega en un <em>agent</em> la presa de decisions en el seu nom.</p>
                        <p>Exemple paradigmàtic: accionistes (principals) contracten directius (agents) per gestionar l'empresa. Però els interessos divergeixen: els accionistes busquen maximitzar el valor de l'acció; els directius poden buscar salaris elevats, beneficis propis, perks, seguretat laboral, projectes prestigiosos encara que no rendibles (construcció d'imperis, «<em>empire building</em>»).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Causes del problema" color="rose">
                        <p>(1) <strong>Asimetria d'informació</strong>: l'agent sap més sobre la seua conducta i esforç que el principal.</p>
                        <p>(2) <strong>Risc moral</strong> (<em>moral hazard</em>): l'agent pot comportar-se de forma oportunista un cop signat el contracte.</p>
                        <p>(3) <strong>Selecció adversa</strong>: abans del contracte, l'agent pot amagar informació sobre la seua capacitat.</p>
                        <p>(4) <strong>Diferència d'horitzons</strong>: els directius sovint tenen horitzons més curts (fins a la jubilació) que l'empresa.</p>
                        <p>(5) <strong>Aversió al risc asimètrica</strong>: els directius, més aversos (no poden diversificar el seu capital humà), tendeixen a prendre decisions més conservadores que les òptimes per a accionistes diversificats.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Costos d'agència" color="amber">
                        <p>Jensen i Meckling classifiquen els <strong>costos d'agència</strong> en:</p>
                        <p>• <strong>Costos de monitoratge</strong> (pel principal): auditories, consells, informes.</p>
                        <p>• <strong>Costos de <em>bonding</em></strong> (per l'agent): mecanismes voluntaris de compromís (<em>stock options</em>, <em>deferred pay</em>).</p>
                        <p>• <strong>Pèrdua residual</strong>: la pèrdua de valor no eliminada pels dos anteriors.</p>
                        <p>L'objectiu del govern corporatiu és minimitzar aquests costos alineant interessos de principal i agent.</p>
                    </TheoryBlock>

                    <FormulaBox formula="Costos d'agència = Monitoratge + Bonding + Pèrdua residual" desc="Jensen-Meckling (1976)" />

                <Card title="4. Govern corporatiu: mecanismes i marc normatiu" icon="⚖️">
                    <TheoryBlock title="4.1. Concepte de govern corporatiu" color="indigo">
                        <p>El <strong>govern corporatiu</strong> (<em>corporate governance</em>) és «el sistema mitjançant el qual les empreses són dirigides i controlades» (<strong>Cadbury Report</strong>, 1992, Regne Unit, pioner). Regula les relacions entre accionistes, consell d'administració, direcció i <em>stakeholders</em>. El seu objectiu: minimitzar els costos d'agència i assegurar la creació sostenible de valor.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Mecanismes interns" color="violet">
                        <p>(1) <strong>Consell d'administració</strong>: organ central, supervisa direcció. Idealment, amb suficients <strong>consellers independents</strong> (no executius, sense lligams amb l'empresa). Comités especialitzats: auditoria, nomenaments, retribucions, riscos.</p>
                        <p>(2) <strong>Política de retribucions</strong>: plans de <em>stock options</em>, accions restringides (RSUs), bonus lligats a resultats pluriennals, <em>clawback</em> (recuperació en cas de frau).</p>
                        <p>(3) <strong>Junta General d'Accionistes</strong>: vota els comptes, el consell i aprova acords fonamentals.</p>
                        <p>(4) <strong>Auditoria interna i externa</strong>: control de procediments i comptes (Big Four: PwC, EY, Deloitte, KPMG).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Mecanismes externs" color="emerald">
                        <p>(1) <strong>Mercat de control corporatiu</strong>: amenaça de <em>takeover</em> hostil si la gestió és deficient.</p>
                        <p>(2) <strong>Mercat de treball directiu</strong>: reputació professional.</p>
                        <p>(3) <strong>Regulació i supervisió</strong>: CNMV a Espanya, SEC als EUA, ESMA a la UE.</p>
                        <p>(4) <strong>Activisme accionarial i inversors institucionals</strong>: fons de pensions, fons ESG (<em>BlackRock</em>, <em>Vanguard</em>) que pressionen per millorar la gestió.</p>
                        <p>(5) <strong>Transparència informativa</strong>: informes anuals, informació no financera (Llei 11/2018, CSRD).</p>

                    </TheoryBlock>

                    <TheoryBlock title="5.2. Empresa B-Corp i models alternatius" color="emerald">

            { id: 'tema62', num: 62, emoji: '🎭', available: true },
            { id: 'tema63', num: 63, emoji: '💬', available: true },
            { id: 'tema64', num: 64, emoji: '⚡', available: true },
            { id: 'tema65', num: 65, emoji: '⚖️', available: true },
        ];

        const Inicio = () => (
            <div className="animate-fade">
                <a href="./oposicions" className="inline-flex items-center gap-2 text-sm text-indigo-600 hover:text-indigo-800 mb-6 transition-colors">{t('inicio.backOpo')}</a>
                <div className="text-center mb-10">
                    <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-indigo-100 text-indigo-700 rounded-full text-sm font-semibold mb-4"><span>🏛️</span> Bloc G · BOE 57-65</div>
                    <h1 className="text-4xl font-black text-slate-800 mb-3">{t('inicio.title')}</h1>
                    <p className="text-slate-500 text-lg max-w-3xl mx-auto">{t('inicio.subtitle')}</p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {temes.map(tema => (
                        <button key={tema.id} onClick={() => { if (tema.available) { setSection(tema.id); pdeSetHashSection(tema.id); pdeScrollToTop(); } }} className={`text-left p-5 rounded-2xl border transition-all ${tema.available ? 'bg-white border-indigo-200 hover:shadow-lg hover:border-indigo-400 cursor-pointer' : 'bg-gray-50 border-gray-200 opacity-70 cursor-not-allowed'}`}>
                            <div className="flex items-start gap-3">
                                <span className={`inline-flex items-center justify-center w-11 h-11 rounded-xl text-sm font-black text-white ${tema.available ? 'bg-gradient-to-br from-indigo-500 to-violet-600' : 'bg-gray-400'}`}>T{tema.num}</span>
                                <div className="flex-1 min-w-0">
                                    <p className="font-semibold text-slate-800 text-sm leading-snug mb-2">{t(`tema${tema.num}.title`)}</p>
                                    <span className={`inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full ${tema.available ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-500'}`}>{tema.available ? '✓ ' + t('inicio.disponible') : '🔒 ' + t('inicio.properament')}</span>
                                </div>
                            </div>
                        </button>
                    ))}
                </div>
            </div>
        );

        const headerSections = [
            { id: 'inicio', label: t('sec.inicio'), emoji: '🏠' },
            { id: 'tema57', label: 'T57', emoji: '🎯' },
            { id: 'tema58', label: 'T58', emoji: '📋' },
            { id: 'tema59', label: 'T59', emoji: '🏛️' },
            { id: 'tema60', label: 'T60', emoji: '🗂️' },
            { id: 'tema61', label: 'T61', emoji: '👑' },
            { id: 'tema62', label: 'T62', emoji: '🎭' },
            { id: 'tema63', label: 'T63', emoji: '💬' },
            { id: 'tema64', label: 'T64', emoji: '⚡' },
            { id: 'tema65', label: 'T65', emoji: '⚖️' },
        ];

        return (
            <div className="min-h-screen">
                <PdeHeader idioma={idioma} setIdioma={setIdioma} currentApp="oposicions-bloc-g" sections={headerSections} currentSection={section} setSection={setSection} />
                <main className="max-w-7xl mx-auto px-4 py-8">
                    {section === 'inicio' && <Inicio />}
                    {section === 'tema57' && <Tema57 />}
                    {section === 'tema58' && <Tema58 />}
                    {section === 'tema59' && <Tema59 />}
                    {section === 'tema60' && <Tema60 />}
                    {section === 'tema61' && <Tema61 />}
                    {section === 'tema62' && <Tema62 />}
                    {section === 'tema63' && <Tema63 />}
                    {section === 'tema64' && <Tema64 />}
                    {section === 'tema65' && <Tema65 />}
                </main>
                <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
                <PdeFooter appEmoji="🎯" appName={t('footer.appname')} idioma={idioma} />
                <PdeScrollToTop />
            </div>
        );
    }

    ReactDOM.render(<BlocGApp />, document.getElementById('root'));
    </script>
</body>
</html>
