        return (<div className={`border-l-4 ${colors[color] || colors.slate} p-5 rounded-r-xl my-4`}>{title && <h4 className="font-bold text-slate-800 mb-3 text-base">{title}</h4>}<div className="text-slate-700 text-sm leading-relaxed space-y-2">{children}</div></div>);
    };
    const SectionTitle = ({ icon, title, subtitle }) => (<div className="mb-8"><div className="flex items-center gap-3 mb-2"><span className="text-3xl">{icon}</span><h1 className="text-3xl font-black text-slate-800">{title}</h1></div>{subtitle && <p className="text-slate-500 ml-12">{subtitle}</p>}</div>);
    const BibliografiaBox = ({ items }) => (<div className="my-6 p-6 bg-gradient-to-r from-slate-50 to-gray-50 rounded-xl border border-slate-200"><h4 className="font-bold text-slate-800 mb-4 text-base flex items-center gap-2"><span>📚</span> Bibliografía</h4><ul className="space-y-2">{items.map((item, i) => (<li key={i} className="text-sm text-slate-700 leading-relaxed pl-4 border-l-2 border-slate-200">{item}</li>))}</ul></div>);
    const ClauBox = ({ children }) => (<div className="my-4 p-5 bg-gradient-to-r from-amber-50 to-yellow-50 rounded-xl border border-amber-200"><div className="flex items-start gap-3"><span className="text-2xl">🔑</span><div><h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4><div className="text-sm text-amber-800 space-y-1">{children}</div></div></div></div>);

    // ════════════════════════════════════════════════════════════════
    // THEME DATA
    // ════════════════════════════════════════════════════════════════
    const temes = [
        { num: 61, id: 'tema61', available: true },
        { num: 62, id: 'tema62', available: true },
        { num: 63, id: 'tema63', available: true },

    const Inicio = () => (

                <h1 className="text-4xl font-black text-slate-800 mb-3">{t('inicio.title')}</h1>
                <p className="text-slate-500 text-lg max-w-2xl mx-auto">{t('inicio.subtitle')}</p>
            </div>

    // ════════════════════════════════════════════════════════════════
    // TEMA 61 — Actius financers. Renda fixa i variable.
    // ════════════════════════════════════════════════════════════════
    const Tema61Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>Els <strong>actius financers</strong> són títols o contractes que representen un dret per al seu titular (l'inversor) i una obligació per a l'emissor. Constitueixen el mecanisme fonamental a través del qual el sistema financer canalitza l'estalvi cap a la inversió. La distinció entre <strong>renda fixa</strong> (deute) i <strong>renda variable</strong> (accions) és essencial per a comprendre els mercats financers, la gestió de carteres i l'educació financera del ciutadà.</p>
                    <p>Aquest tema s'emmarca en els continguts d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022) sobre el sistema financer i els mercats, i en els continguts transversals d'educació financera. S'estructura en: concepte i característiques, renda fixa, renda variable, fons d'inversió i relació rendibilitat-risc.</p>
                </div>
            </Card>
            <Card title="1. Concepte i característiques dels actius financers" icon="📘">
                <TheoryBlock title="1.1. Definició" color="teal"><p>Un <strong>actiu financer</strong> és un títol emés per una unitat econòmica deficitària (empresa, Estat) que representa un deute (renda fixa) o una participació en la propietat (renda variable) i que atorga al seu titular el dret a rebre fluxos de caixa futurs (interessos, dividends, reemborsament del principal).</p></TheoryBlock>
                <TheoryBlock title="1.2. Tres característiques fonamentals" color="cyan"><p><strong>1. Rendibilitat:</strong> rendiment que proporciona l'actiu (interessos, dividends, plusvàlues). Pot ser fixa (coneguda per endavant — bons) o variable (incerta — accions).<br/><strong>2. Risc:</strong> probabilitat que el rendiment real diferisca de l'esperat. Inclou: risc de crèdit (impagament de l'emissor), risc de mercat (fluctuacions de preu), risc de tipus d'interès, risc de liquiditat, risc de tipus de canvi.<br/><strong>3. Liquiditat:</strong> facilitat per a convertir l'actiu en diners sense pèrdua significativa de valor. Els diners són l'actiu més líquid; un immoble, el menys.</p><p><strong>Relació fonamental:</strong> a major rendibilitat esperada, major risc. A major liquiditat, menor rendibilitat. No existeix la inversió d'alta rendibilitat, baix risc i alta liquiditat simultàniament (triangle impossible).</p></TheoryBlock>
                <FormulaBox formula="Rentabilitat ↑ ↔ Risc ↑ | Liquiditat ↑ ↔ Rentabilitat ↓" desc="El triangle impossible: no es pot tindre tot alhora" />
            </Card>
            <Card title="2. Renda fixa" icon="📘">
                <TheoryBlock title="2.1. Concepte" color="teal"><p>Els actius de <strong>renda fixa</strong> representen un <strong>préstec</strong> de l'inversor a l'emissor: l'inversor presta diners i rep a canvi interessos periòdics (cupó) i la devolució del principal al venciment. El rendiment és predictible (d'ací «fixa»), encara que el preu de mercat pot fluctuar si es ven abans del venciment.</p></TheoryBlock>
                <TheoryBlock title="2.2. Tipus de renda fixa" color="cyan">
                    <p><strong>Deute públic:</strong><br/>— <em>Lletres del Tresor:</em> CP (3, 6, 12 mesos). Emeses al descompte (es compra per davall del nominal i es cobra el nominal al venciment). Risc molt baix.<br/>— <em>Bons de l'Estat:</em> MP (2-5 anys). Cupó anual.<br/>— <em>Obligacions de l'Estat:</em> LP (10, 15, 30, 50 anys). Cupó anual.</p>
                    <p><strong>Renda fixa privada (corporativa):</strong><br/>— <em>Pagarés d'empresa:</em> CP. Similars a les lletres.<br/>— <em>Bons i obligacions corporatives:</em> emesos per empreses. Major risc (i major rendibilitat) que el deute públic. Les <em>agències de rating</em> (Moody's, S&P, Fitch) qualifiquen la solvència de l'emissor: investment grade (BBB o superior) vs. high yield/bo escombraria (BB o inferior).</p>
                </TheoryBlock>
                <TheoryBlock title="2.3. Preu i tipus d'interès" color="teal"><p>El preu d'un bo en el mercat secundari té una <strong>relació inversa</strong> amb el tipus d'interès: quan els tipus pugen, el preu dels bons baixa (perquè els bons existents amb cupons més baixos són menys atractius), i viceversa. Aquesta és la font principal de risc de mercat de la renda fixa.</p></TheoryBlock>

                {/* SVG 1: Tipus d'Actius Financers */}
                <div className="my-6 flex justify-center">
                    <svg viewBox="0 0 560 400" className="w-full max-w-xl mx-auto" style={{fontFamily: 'Plus Jakarta Sans, sans-serif'}}>
                        <text x="280" y="28" textAnchor="middle" fontSize="16" fontWeight="bold" fill="#1e293b">Tipus d'Actius Financers</text>
                        <text x="280" y="48" textAnchor="middle" fontSize="12" fill="#64748b">Classificació per rendibilitat i risc</text>

                        {/* Renda Fixa box */}
                        <rect x="30" y="75" width="230" height="200" rx="12" fill="#f0fdfa" stroke="#0d9488" strokeWidth="2"/>
                        <rect x="30" y="75" width="230" height="40" rx="12" fill="#0d9488"/>
                        <rect x="30" y="95" width="230" height="20" fill="#0d9488"/>
                        <text x="145" y="100" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#ffffff">RENDA FIXA</text>
                        <text x="145" y="118" textAnchor="middle" fontSize="11" fill="#ffffff">Préstec → cupó + devolució</text>

                        <rect x="50" y="140" width="190" height="28" rx="6" fill="#ccfbf1" stroke="#14b8a6" strokeWidth="1"/>
                        <text x="145" y="159" textAnchor="middle" fontSize="11" fontWeight="600" fill="#0f766e">Lletres del Tresor (CP)</text>
                        <rect x="50" y="175" width="190" height="28" rx="6" fill="#ccfbf1" stroke="#14b8a6" strokeWidth="1"/>
                        <text x="145" y="194" textAnchor="middle" fontSize="11" fontWeight="600" fill="#0f766e">Bons de l'Estat (MP)</text>
                        <rect x="50" y="210" width="190" height="28" rx="6" fill="#ccfbf1" stroke="#14b8a6" strokeWidth="1"/>
                        <text x="145" y="229" textAnchor="middle" fontSize="11" fontWeight="600" fill="#0f766e">Obligacions (LP)</text>
                        <rect x="50" y="245" width="190" height="28" rx="6" fill="#e0f2fe" stroke="#0ea5e9" strokeWidth="1"/>
                        <text x="145" y="264" textAnchor="middle" fontSize="11" fontWeight="600" fill="#0369a1">Bons corporatius / Pagarés</text>

                        <rect x="300" y="75" width="230" height="40" rx="12" fill="#f97316"/>
                        <rect x="300" y="95" width="230" height="20" fill="#f97316"/>
                        <text x="415" y="100" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#ffffff">RENDA VARIABLE</text>
                        <text x="415" y="118" textAnchor="middle" fontSize="11" fill="#ffffff">Propietat → dividends + plusvàlues</text>

                        <rect x="320" y="140" width="190" height="28" rx="6" fill="#ffedd5" stroke="#fb923c" strokeWidth="1"/>
                        <text x="415" y="159" textAnchor="middle" fontSize="11" fontWeight="600" fill="#c2410c">Accions (SA cotitzades)</text>
                        <rect x="320" y="175" width="190" height="28" rx="6" fill="#ffedd5" stroke="#fb923c" strokeWidth="1"/>
                        <text x="415" y="194" textAnchor="middle" fontSize="11" fontWeight="600" fill="#c2410c">ETFs (fons cotitzats)</text>
                        <rect x="320" y="210" width="190" height="28" rx="6" fill="#ffedd5" stroke="#fb923c" strokeWidth="1"/>
                        <text x="415" y="229" textAnchor="middle" fontSize="11" fontWeight="600" fill="#c2410c">Derivats (futur, opcions)</text>
                        <rect x="320" y="245" width="190" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" strokeWidth="1"/>
                        <text x="415" y="264" textAnchor="middle" fontSize="11" fontWeight="600" fill="#92400e">Criptoactius (Bitcoin...)</text>

                        {/* Risk/Return arrow */}
                        <defs>
                            <linearGradient id="riskGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#0d9488"/>
                                <stop offset="100%" stopColor="#f97316"/>
                            </linearGradient>
                            <marker id="arrowRisk1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                                <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
                            </marker>
                        </defs>
                        <rect x="30" y="300" width="500" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="1"/>

                    </svg>
                </div>
            </Card>
            <Card title="3. Renda variable" icon="📘">
                <TheoryBlock title="3.1. Les accions" color="teal"><p>Les <strong>accions</strong> representen una participació en la <strong>propietat</strong> d'una societat anònima. L'accionista és copropietari i té drets: <strong>econòmics</strong> (dividends, participació en el patrimoni en cas de liquidació, subscripció preferent en ampliacions) i <strong>polítics</strong> (vot en la Junta General d'Accionistes, informació). La rendibilitat prové de: <strong>dividends</strong> (part del benefici distribuïda) + <strong>plusvàlues</strong> (guany per venda a preu superior al de compra).</p></TheoryBlock>
                <TheoryBlock title="3.2. Valoració d'accions" color="cyan"><p><strong>Valor nominal:</strong> valor que figura en els estatuts (capital social / n.º accions).<br/><strong>Valor comptable (teòric):</strong> patrimoni net / n.º accions.<br/><strong>Valor de mercat (cotització):</strong> preu al qual es compra/ven en Borsa. Determinat per oferta i demanda, expectatives de beneficis, tipus d'interès, sentiment del mercat.<br/><strong>PER (Price Earnings Ratio):</strong> Cotització / BPA (Benefici Per Acció). Indica quants anys de beneficis es paguen per l'acció. PER alt → acció «cara» (o expectatives altes); PER baix → acció «barata» (o expectatives baixes).</p></TheoryBlock>
                <FormulaBox formula="PER = Cotització / BPA | Rendibilitat acció = (Dividends + Plusvàlua) / Preu compra" desc="PER alt → cara o expectatives altes. PER baix → barata o expectatives baixes." />
            </Card>
            <Card title="4. Fons d'inversió i altres vehicles" icon="📘">
                <TheoryBlock title="4.1. Fons d'inversió" color="teal"><p>Un <strong>fons d'inversió</strong> és un patrimoni col·lectiu format per les aportacions de múltiples inversors (partícips), gestionat per una <strong>societat gestora</strong> professional i custodiat per una <strong>entitat depositària</strong>. La diversificació redueix el risc. Tipus: fons de renda fixa, renda variable, mixtos, garantits, indexats (repliquen un índex), temàtics (tecnologia, ESG), monetaris. A Espanya, més de 350.000 M€ de patrimoni gestionat.</p></TheoryBlock>
                <TheoryBlock title="4.2. ETFs, plans de pensions i altres" color="cyan"><p><strong>ETF (Exchange-Traded Fund):</strong> fons cotitzat en Borsa com una acció. Comissions baixes, liquiditat alta. Repliquen índexs (IBEX 35, S&P 500).<br/><strong>Plans de pensions:</strong> estalvi a llarg termini per a la jubilació. Avantatges fiscals (aportacions deduïbles en IRPF, amb límit d'1.500 €/any). Il·líquids (només rescatables en jubilació, incapacitat, atur LP o als 10 anys).<br/><strong>Criptoactius:</strong> Bitcoin, Ethereum. Actius digitals descentralitzats, alta volatilitat, regulació en desenvolupament (MiCA a la UE).<br/><strong>Derivats:</strong> futurs, opcions, swaps. Instruments el valor dels quals depén d'un actiu subjacent. Ús: cobertura de riscos i especulació.</p></TheoryBlock>
            </Card>
            <Card title="5. La relació rendibilitat-risc i la diversificació" icon="📘">
                <TheoryBlock color="teal"><p><strong>Harry Markowitz</strong> (1952, Teoria Moderna de Carteres) va demostrar que la <strong>diversificació</strong> —combinar actius amb correlacions baixes o negatives— redueix el risc d'una cartera sense reduir proporcionalment la rendibilitat esperada. El <strong>risc diversificable</strong> (específic d'una empresa) s'elimina; el <strong>risc sistemàtic</strong> (de mercat) no. El model <strong>CAPM</strong> (Sharpe, 1964) estableix que la rendibilitat esperada d'un actiu depén de la seua beta (sensibilitat al mercat): E(Ri) = Rf + βi × (E(Rm) − Rf).</p></TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="teal"><p>Els actius financers es caracteritzen per rendibilitat, risc i liquiditat (triangle impossible). La renda fixa (lletres, bons, obligacions) representa un préstec: cupó + devolució; preu invers a tipus. La renda variable (accions) representa propietat: dividends + plusvàlues; valoració per PER. Els fons d'inversió diversifiquen (350.000 M€ a Espanya); els ETFs cotitzen com accions. Plans de pensions: estalvi jubilació amb avantatge fiscal. Markowitz: la diversificació redueix el risc diversificable. CAPM: rendibilitat esperada funció de beta.</p></TheoryBlock>
            </Card>

    const Tema63Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>L'<strong>assegurança</strong> és un contracte pel qual l'assegurador s'obliga, a canvi d'una <strong>prima</strong>, a indemnitzar l'assegurat pels danys derivats d'un <strong>sinistre</strong> (event incert). És el mecanisme fonamental de transferència i mutualització del risc en les economies modernes. El sector assegurador espanyol mou més de 60.000 milions d'euros anuals en primes.</p><p>Aquest tema connecta amb els continguts d'educació financera i sistema financer d'<strong>Economia de 1r de Batxillerat</strong>. S'estructura en: principis de l'assegurança, elements del contracte, modalitats i el sector assegurador espanyol.</p></div>
            </Card>
            <Card title="1. Principis de l'assegurança" icon="📘">
                <TheoryBlock title="1.1. Concepte i base tècnica" color="teal"><p>L'assegurança es basa en la <strong>llei dels grans nombres</strong>: encara que el sinistre individual és aleatori, en una massa gran d'assegurats les pèrdues totals són predictibles estadísticament. L'assegurador calcula la <strong>prima pura</strong> (esperança matemàtica de la pèrdua: probabilitat × quantia del sinistre) i hi afig recàrrecs (despeses de gestió, benefici, marge de seguretat) per a obtindre la <strong>prima comercial</strong>.</p></TheoryBlock>
                <TheoryBlock title="1.2. Principis fonamentals" color="cyan"><p><strong>Bona fe:</strong> ambdues parts han d'actuar amb honestedat; l'assegurat ha de declarar fidelment el risc.<br/><strong>Interès assegurable:</strong> l'assegurat ha de tindre un interès legítim en la cosa assegurada (no es pot assegurar el que no és teu).<br/><strong>Indemnització:</strong> l'assegurança compensa el dany però no enriqueix l'assegurat (principi indemnitzatori); la indemnització no pot superar el valor del dany real.<br/><strong>Subrogació:</strong> l'assegurador, després de pagar la indemnització, es subroga en els drets de l'assegurat contra el causant del dany.<br/><strong>Contribució i repartiment:</strong> si hi ha diverses assegurances sobre el mateix risc, cada assegurador contribueix proporcionalment.</p></TheoryBlock>
            </Card>
            <Card title="2. Elements del contracte d'assegurança" icon="📘">
                <TheoryBlock title="2.1. Elements personals" color="teal"><p><strong>Assegurador:</strong> la companyia d'assegurances (ha de ser una SA, mútua o cooperativa autoritzada per la DGSFP).<br/><strong>Prenedor:</strong> qui contracta i paga la prima.<br/><strong>Assegurat:</strong> titular de l'interès assegurat (pot coincidir amb el prenedor).<br/><strong>Beneficiari:</strong> qui rep la indemnització (en assegurances de vida pot ser un tercer).<br/><strong>Mediadors:</strong> agents d'assegurances (vinculats a una companyia) i corredors (independents, assessoren el client).</p></TheoryBlock>
                <TheoryBlock title="2.2. Elements formals i reals" color="cyan"><p><strong>Pòlissa:</strong> document del contracte. Conté: dades de l'assegurat, risc cobert, capital assegurat, prima, durada, franquícia, exclusions.<br/><strong>Prima:</strong> preu de l'assegurança. Pot ser única o periòdica (anual).<br/><strong>Sinistre:</strong> materialització del risc cobert.<br/><strong>Capital assegurat:</strong> quantitat màxima que pagarà l'assegurador.<br/><strong>Franquícia:</strong> quantitat que l'assegurat assumeix en cada sinistre abans que l'assegurador pague (redueix la prima i el risc moral).</p></TheoryBlock>
            </Card>
            <Card title="3. Modalitats d'assegurança" icon="📘">
                <TheoryBlock title="3.1. Assegurances personals" color="teal"><p><strong>Assegurança de vida:</strong> en cas de defunció (vida-risc: paga als beneficiaris) o supervivència (vida-estalvi: l'assegurat cobra al venciment). Mixtes: combinen ambdues. Unit-linked: lligades a fons d'inversió.<br/><strong>Assegurança d'accidents:</strong> cobreix lesions corporals per accident.<br/><strong>Assegurança de salut (malaltia):</strong> cobreix despeses mèdiques, hospitalització, proves diagnòstiques. Complementa la sanitat pública. Principals: Adeslas, Sanitas, DKV, Asisa.</p></TheoryBlock>
                <TheoryBlock title="3.2. Assegurances patrimonials (de danys)" color="cyan"><p><strong>Assegurança d'incendi i danys materials:</strong> cobreix danys al patrimoni per incendi, explosió, catàstrofes naturals.<br/><strong>Assegurança de la llar:</strong> multirisc que cobreix continent (edifici) + contingut (mobles, objectes) + responsabilitat civil.<br/><strong>Assegurança d'automòbil:</strong> obligatòria (assegurança a tercers: cobreix danys a tercers per accident) o voluntària (tot risc: inclou danys propis, robatori, llunes). La més contractada a Espanya.<br/><strong>Assegurança de responsabilitat civil:</strong> cobreix les indemnitzacions que l'assegurat haja de pagar a tercers per danys causats.<br/><strong>Altres:</strong> assegurança de transport (marítim, terrestre, aeri), assegurança de crèdit (impagament de clients), assegurança agrària (pèrdua de collites — Agroseguro), assegurança de caució.</p></TheoryBlock>
                <TheoryBlock title="3.3. Assegurances de prestació de serveis" color="teal"><p><strong>Assistència en viatge:</strong> cobertura mèdica, repatriació, pèrdua d'equipatge en viatges.<br/><strong>Defensa jurídica:</strong> cobertura de despeses legals.<br/><strong>Decessos:</strong> cobertura de les despeses del sepeli. Molt estesa a Espanya (més de 20 milions d'assegurats).</p></TheoryBlock>
            </Card>
            <Card title="4. El sector assegurador espanyol" icon="📘">
                <TheoryBlock color="teal"><p>El sector assegurador espanyol genera més de <strong>60.000 milions d'euros en primes anuals</strong> i dona faena a més de 50.000 persones. Les principals companyies: <strong>Mapfre</strong> (la major espanyola, amb presència global), <strong>Mutua Madrileña</strong>, <strong>Línea Directa</strong>, <strong>Santalucía</strong>, <strong>Pelayo</strong>, <strong>Catalana Occidente</strong>, <strong>Zurich</strong>, <strong>Allianz</strong>, <strong>AXA</strong>, <strong>Generali</strong>. El <strong>Consorci de Compensació d'Assegurances</strong> (CCS) és una entitat pública que cobreix riscos extraordinaris (terratrèmols, inundacions, terrorisme) i actua com a fons de garantia quan l'assegurador és insolvent. La supervisió correspon a la <strong>DGSFP</strong> i a la normativa europea <strong>Solvència II</strong>.</p></TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="teal"><p>L'assegurança transfereix risc de l'assegurat a l'assegurador a canvi d'una prima, basant-se en la llei dels grans nombres. Els principis són: bona fe, interès assegurable, indemnització (no enriquiment), subrogació. El contracte (pòlissa) inclou: parts, prima, capital, franquícia. Les modalitats són: personals (vida, accidents, salut), patrimonials (llar, auto —obligatori—, RC, crèdit, agrari) i de serveis (viatge, decessos). El sector espanyol: 60.000 M€ en primes. Mapfre líder. CCS per a riscos extraordinaris. Supervisió: DGSFP + Solvència II.</p></TheoryBlock>
            </Card>

    const Tema64Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La <strong>planificació financera personal</strong> és el procés de gestionar els ingressos, despeses, estalvi, inversió, endeutament, assegurances i fiscalitat d'una persona o família per a assolir els seus objectius vitals (comprar un habitatge, finançar estudis, preparar la jubilació, crear un fons d'emergència). L'<strong>educació financera</strong> —entendre conceptes com interès compost, inflació, diversificació, endeutament responsable— és essencial per a l'autonomia i el benestar dels ciutadans.</p><p>Aquest tema és transversal en el currículum LOMLOE (educació financera com a competència clau) i es connecta amb els continguts d'Economia de 1r de Batxillerat. S'estructura en: pressupost personal, estalvi, inversió, endeutament responsable i planificació de la jubilació.</p></div>
            </Card>
            <Card title="1. El pressupost personal" icon="📘">
                <TheoryBlock title="1.1. Ingressos, despeses i estalvi" color="teal"><p><strong>Pressupost:</strong> pla que detalla els ingressos i despeses previstes per a un període (mensual, anual). Permet controlar les finances, detectar despeses innecessàries i generar estalvi.<br/><strong>Regla 50/30/20</strong> (Elizabeth Warren): 50 % de l'ingrés net a necessitats (habitatge, alimentació, transport), 30 % a desitjos (oci, viatges, roba), 20 % a estalvi i inversió.<br/><strong>Fons d'emergència:</strong> estalvi líquid equivalent a 3-6 mesos de despeses fixes, per a imprevistos (pèrdua de treball, avaria, malaltia). És la primera prioritat d'estalvi.</p></TheoryBlock>
            </Card>
            <Card title="2. L'estalvi" icon="📘">
                <TheoryBlock title="2.1. Productes d'estalvi" color="teal"><p><strong>Comptes d'estalvi / dipòsits a la vista:</strong> liquiditat total, rendibilitat molt baixa (però coberts pel FGD fins a 100.000 €).<br/><strong>Dipòsits a termini fix:</strong> major rendibilitat a canvi de menor liquiditat (penalització per cancel·lació anticipada).<br/><strong>Lletres del Tresor:</strong> deute públic a CP (3, 6, 12 mesos). Molt segures, rendibilitat moderada.<br/><strong>Comptes remunerats:</strong> comptes corrents amb interès (oferits per neobancs i fintech).</p></TheoryBlock>
                <TheoryBlock title="2.2. L'interès compost" color="cyan"><p>L'<strong>interès compost</strong> és la «huitena meravella del món» (atribuït a Einstein): els interessos generats es reinverteixen i generen al seu torn nous interessos. La fórmula: <strong>Cf = Ci × (1 + i)ⁿ</strong>, on Ci = capital inicial, i = tipus d'interès per període, n = nombre de períodes, Cf = capital final.<br/><strong>Exemple:</strong> 10.000 € al 5 % anual durant 30 anys = 10.000 × 1,05³⁰ = <strong>43.219 €</strong> (més del quàdruple). La clau és començar prompte i ser constant.</p></TheoryBlock>
                <FormulaBox formula="Cf = Ci × (1 + i)ⁿ | 10.000€ al 5% durant 30 anys = 43.219€" desc="Interès compost: el temps és el millor aliat de l'estalviador" />
            </Card>
            <Card title="3. La inversió" icon="📘">
                <TheoryBlock title="3.1. Perfil inversor" color="teal"><p>Abans d'invertir, l'inversor ha de definir el seu <strong>perfil</strong>: <strong>horitzó temporal</strong> (CP, MP, LP), <strong>tolerància al risc</strong> (conservador, moderat, agressiu), <strong>objectius</strong> (complement jubilació, compra habitatge, educació fills) i <strong>situació financera</strong> (ingressos, despeses, deutes, patrimoni). Els tests de conveniència/idoneïtat (MiFID II) ajuden a determinar el perfil.</p></TheoryBlock>
                <TheoryBlock title="3.2. Productes d'inversió" color="cyan"><p><strong>Fons d'inversió:</strong> diversificació professional. Tipus: renda fixa, variable, mixtos, indexats, garantits. Comissions: gestió, depòsit, subscripció, reemborsament. Fiscalitat: tributen en realitzar la plusvàlua (19-28 % sobre guanys).<br/><strong>ETFs:</strong> fons cotitzats, comissions baixes, rèplica d'índexs.<br/><strong>Accions:</strong> inversió directa en empreses cotitzades. Major risc i potencial de rendibilitat.<br/><strong>Immobles:</strong> inversió tradicional a Espanya. Lloguer + revaloració. Il·líquid, concentració de risc.<br/><strong>Plans de pensions:</strong> estalvi finalista per a la jubilació. Avantatge fiscal: aportacions deduïbles en IRPF (màx. 1.500 €/any). Il·líquids fins a jubilació/contingències. Tributen com a rendiment del treball en el rescat (tipus marginal IRPF).<br/><strong>Roboadvisors:</strong> plataformes d'inversió automatitzada basades en algoritmes (Indexa Capital, Finizens, MyInvestor). Carteres diversificades de fons indexats amb comissions baixes.</p></TheoryBlock>

                </div>
            </Card>
            <Card title="4. Endeutament responsable" icon="📘">
                <TheoryBlock title="4.1. Tipus de deute" color="teal"><p><strong>Deute bo:</strong> finança actius que generen valor o es revaloritzen (hipoteca per a habitatge habitual, préstec per a formació). Tipus d'interès baix, termini llarg.<br/><strong>Deute dolent:</strong> finança consum que es deprecia (préstecs al consum per a vacances, electrònica, targetes de crèdit revolving). Tipus d'interès alt, termini curt.<br/><strong>Regla del 35 %:</strong> la quota total de deutes (hipoteca + altres préstecs) no hauria de superar el 35 % dels ingressos nets mensuals.<br/><strong>TAE (Taxa Anual Equivalent):</strong> indicador que inclou el tipus d'interès nominal + comissions + despeses, permetent comparar ofertes. Obligatori informar (Banc d'Espanya).</p></TheoryBlock>
            </Card>
            <Card title="5. Planificació de la jubilació" icon="📘">
                <TheoryBlock color="teal"><p>El sistema públic de pensions (repartiment) pot no ser suficient per a mantindre el nivell de vida. La <strong>taxa de substitució</strong> (pensió / últim salari) és ~80 % a Espanya (la més alta de l'OCDE), però tendirà a reduir-se per l'envelliment. És recomanable complementar amb estalvi privat: plans de pensions, fons d'inversió, immobles, PIAS (Plans Individuals d'Estalvi Sistemàtic). <strong>Començar prompte</strong> és clau: gràcies a l'interès compost, estalviar 200 €/mes des dels 25 anys genera molt més que estalviar 400 €/mes des dels 45.</p></TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">

    const Tema66Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>L'<strong>IRPF</strong> (Impost sobre la Renda de les Persones Físiques) i l'<strong>IVA</strong> (Impost sobre el Valor Afegit) són els dos pilars del sistema tributari espanyol: junts representen més del 60 % de la recaptació total. L'IRPF és el principal impost directe (progressiu, grava la renda) i l'IVA és el principal impost indirecte (proporcional, grava el consum). La seua comprensió és essencial tant per a la formació del futur ciutadà com per a la preparació d'oposicions.</p><p>Aquest tema s'emmarca en CE3 d'<strong>Economia de 1r de Batxillerat</strong> i en els continguts transversals d'educació financera i ciutadania fiscal.</p></div>
            </Card>
            <Card title="1. L'IRPF" icon="📘">
                <TheoryBlock title="1.1. Característiques" color="teal"><p>Impost <strong>directe, personal, subjectiu, progressiu i periòdic</strong> (període impositiu: any natural). Grava la <strong>renda</strong> obtinguda per les persones físiques residents a Espanya. És l'impost que més recapta (~90.000 M€, ~8,5 % del PIB). És <strong>compartit</strong> (50 % Estat, 50 % CCAA, que tenen capacitat normativa sobre tipus i deduccions).</p></TheoryBlock>
                <TheoryBlock title="1.2. Base imposable: tipus de renda" color="cyan"><p><strong>Rendiments del treball:</strong> salaris, pensions, prestacions per desocupació. La gran majoria de la base imposable.<br/><strong>Rendiments del capital:</strong> immobiliari (lloguers) i mobiliari (interessos, dividends).<br/><strong>Rendiments d'activitats econòmiques:</strong> beneficis d'autònoms i professionals (estimació directa o per mòduls).<br/><strong>Guanys i pèrdues patrimonials:</strong> plusvàlues per venda d'immobles, accions, fons d'inversió.<br/><strong>Imputacions de renda:</strong> immobles urbans no llogats (imputació de renda immobiliària).</p></TheoryBlock>
                <TheoryBlock title="1.3. Liquidació simplificada" color="teal"><p><strong>Base imposable general</strong> (treball, activitats, capital immobiliari) → reduccions (aportacions a plans de pensions, pensions compensatòries, mínims personal i familiar) → <strong>Base liquidable general</strong> → s'aplica la <strong>tarifa progressiva per trams</strong> (estatal + autonòmica):</p><p>0 − 12.450 €: 19 % | 12.450 − 20.200 €: 24 % | 20.200 − 35.200 €: 30 % | 35.200 − 60.000 €: 37 % | 60.000 − 300.000 €: 45 % | &gt;300.000 €: 47 % (tipus orientatius 2024, varien segons CCAA).</p><p><strong>Base imposable de l'estalvi</strong> (interessos, dividends, plusvàlues) → tarifa de l'estalvi: 19 % (fins a 6.000 €), 21 % (6.000-50.000), 23 % (50.000-200.000), 27 % (200.000-300.000), 28 % (&gt;300.000).</p><p>Quota íntegra − deduccions (habitatge habitual anterior a 2013, donatius, maternitat, etc.) = <strong>Quota líquida</strong> − Retencions practicades = <strong>Quota diferencial</strong> (a pagar o a tornar).</p></TheoryBlock>
                <FormulaBox formula="IRPF: Tarifa progressiva per trams (19% → 47%)" desc="Més renda → tipus marginal més alt. El més recaptador (~90.000 M€)" />
            </Card>
            <Card title="2. L'IVA" icon="📘">
                <TheoryBlock title="2.1. Característiques" color="teal"><p>Impost <strong>indirecte, real, objectiu, proporcional i instantani</strong>. Grava el <strong>consum</strong>: s'aplica en cada fase de la cadena de producció-distribució sobre el <strong>valor afegit</strong> en eixa fase. El consumidor final suporta tot l'IVA; les empreses intermèdies són mers recaptadors (dedueixen l'IVA suportat en les seues compres de l'IVA repercutit en les seues vendes i liquiden la diferència a Hisenda). Harmonitzat a nivell de la UE (Directiva IVA 2006/112/CE). No s'aplica a Canàries (IGIC), Ceuta i Melilla (IPSI).</p></TheoryBlock>
                <TheoryBlock title="2.2. Tipus impositius" color="cyan"><p><strong>Tipus general: 21 %</strong> — s'aplica a la majoria de béns i serveis.<br/><strong>Tipus reduït: 10 %</strong> — aliments (excepte els superreduïts), aigua, medicaments d'ús animal, transport de viatgers, hostaleria, habitatge nou, espectacles culturals i esportius.<br/><strong>Tipus superreduït: 4 %</strong> — pa, llet, ous, fruites, verdures, cereals, formatges, llibres, periòdics, medicaments d'ús humà, cadires de rodes, habitatge de protecció oficial.<br/><strong>Tipus 0 % (exempt amb dret a deducció):</strong> exportacions, lliuraments intracomunitaris.</p></TheoryBlock>
                <TheoryBlock title="2.3. Mecànica de liquidació" color="teal"><p>Cada empresa en la cadena: <strong>IVA repercutit</strong> (cobrat a clients) − <strong>IVA suportat</strong> (pagat a proveïdors) = <strong>Liquidació a Hisenda</strong> (positiva: ingressa; negativa: sol·licita devolució o compensa).<br/><strong>Exemple:</strong> un fabricant ven un producte per 1.000 € + 21 % IVA = 1.210 €. Ha comprat matèries primeres per 600 € + 21 % IVA = 726 €. Liquidació: 210 € (repercutit) − 126 € (suportat) = <strong>84 € a ingressar</strong>.</p></TheoryBlock>
                <FormulaBox formula="IVA a ingressar = IVA repercutit − IVA suportat" desc="21% general | 10% reduït | 4% superreduït. El consumidor final suporta tot." />
            </Card>
            <Card title="3. Comparació IRPF vs. IVA" icon="📘">
                <TheoryBlock color="teal"><p><strong>IRPF:</strong> directe, personal, progressiu (qui més guanya, més paga proporcionalment). Més equitatiu (s'adapta a la capacitat econòmica del contribuent), però més complex i susceptible d'elusió/evasió.<br/><strong>IVA:</strong> indirecte, real, proporcional (el mateix tipus per a tots). Més eficient en la recaptació (difícil d'evadir — cadascú vigila que l'anterior pague), però <strong>regressiu</strong> en termes relatius (les famílies de renda baixa destinen una proporció major dels seus ingressos al consum, i per tant paguen proporcionalment més IVA). Els tipus reduïts i superreduïts intenten mitigar aquesta regressivitat en béns bàsics.</p></TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="teal"><p>L'IRPF és el principal impost directe: progressiu per trams (19-47%), grava la renda (treball, capital, activitats, plusvàlues), recapta ~90.000 M€. L'IVA és el principal indirecte: proporcional (21/10/4%), grava el consum en cada fase (valor afegit), el consumidor final suporta tot. L'IRPF és més equitatiu (s'adapta a la capacitat econòmica) però complex; l'IVA és més eficient però regressiu (les rendes baixes paguen proporcionalment més). Junts representen &gt;60% de la recaptació total. La comprensió d'ambdós és essencial per a la ciutadania fiscal.</p></TheoryBlock>
