    const SectionTitle = ({ icon, title, subtitle }) => (<div className="mb-8"><div className="flex items-center gap-3 mb-2"><span className="text-3xl">{icon}</span><h1 className="text-3xl font-black text-slate-800">{title}</h1></div>{subtitle && <p className="text-slate-500 ml-12">{subtitle}</p>}</div>);

    // ════════════════════════════════════════════════════════════════
    // TEMA 61 — Activos financieros. Renta fija y variable.
    // ════════════════════════════════════════════════════════════════
    const Tema61Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>Los <strong>activos financieros</strong> son títulos o contratos que representan un derecho para su titular (el inversor) y una obligación para el emisor. Constituyen el mecanismo fundamental a través del cual el sistema financiero canaliza el ahorro hacia la inversión. La distinción entre <strong>renta fija</strong> (deuda) y <strong>renta variable</strong> (acciones) es esencial para comprender los mercados financieros, la gestión de carteras y la educación financiera del ciudadano.</p>
                    <p>Este tema se enmarca en los contenidos de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022) sobre el sistema financiero y los mercados, y en los contenidos transversales de educación financiera. Se estructura en: concepto y características, renta fija, renta variable, fondos de inversión y relación rentabilidad-riesgo.</p>
                </div>
            </Card>
            <Card title="1. Concepto y características de los activos financieros" icon="📘">
                <TheoryBlock title="1.1. Definición" color="teal"><p>Un <strong>activo financiero</strong> es un título emitido por una unidad económica deficitaria (empresa, Estado) que representa una deuda (renta fija) o una participación en la propiedad (renta variable) y que otorga a su titular el derecho a recibir flujos de caja futuros (intereses, dividendos, reembolso del principal).</p></TheoryBlock>
                <TheoryBlock title="1.2. Tres características fundamentales" color="cyan"><p><strong>1. Rentabilidad:</strong> rendimiento que proporciona el activo (intereses, dividendos, plusvalías). Puede ser fija (conocida de antemano — bonos) o variable (incierta — acciones).<br/><strong>2. Riesgo:</strong> probabilidad de que el rendimiento real difiera del esperado. Incluye: riesgo de crédito (impago del emisor), riesgo de mercado (fluctuaciones de precio), riesgo de tipo de interés, riesgo de liquidez, riesgo de tipo de cambio.<br/><strong>3. Liquidez:</strong> facilidad para convertir el activo en dinero sin pérdida significativa de valor. El dinero es el activo más líquido; un inmueble, el menos.</p><p><strong>Relación fundamental:</strong> a mayor rentabilidad esperada, mayor riesgo. A mayor liquidez, menor rentabilidad. No existe la inversión de alta rentabilidad, bajo riesgo y alta liquidez simultáneamente (triángulo imposible).</p></TheoryBlock>
                <FormulaBox formula="Rentabilitat ↑ ↔ Risc ↑ | Liquiditat ↑ ↔ Rentabilitat ↓" desc="El triangle impossible: no es pot tindre tot alhora" />
            </Card>
            <Card title="2. Renta fija" icon="📘">
                <TheoryBlock title="2.1. Concepto" color="teal"><p>Los activos de <strong>renta fija</strong> representan un <strong>préstamo</strong> del inversor al emisor: el inversor presta dinero y recibe a cambio intereses periódicos (cupón) y la devolución del principal al vencimiento. El rendimiento es predecible (de ahí «fija»), aunque el precio de mercado puede fluctuar si se vende antes del vencimiento.</p></TheoryBlock>
                <TheoryBlock title="2.2. Tipos de renta fija" color="cyan">
                    <p><strong>Deuda pública:</strong><br/>— <em>Letras del Tesoro:</em> CP (3, 6, 12 meses). Emitidas al descuento (se compra por debajo del nominal y se cobra el nominal al vencimiento). Riesgo muy bajo.<br/>— <em>Bonos del Estado:</em> MP (2-5 años). Cupón anual.<br/>— <em>Obligaciones del Estado:</em> LP (10, 15, 30, 50 años). Cupón anual.</p>
                    <p><strong>Renta fija privada (corporativa):</strong><br/>— <em>Pagarés de empresa:</em> CP. Similares a las letras.<br/>— <em>Bonos y obligaciones corporativas:</em> emitidos por empresas. Mayor riesgo (y mayor rentabilidad) que la deuda pública. Las <em>agencias de rating</em> (Moody's, S&P, Fitch) califican la solvencia del emisor: investment grade (BBB o superior) vs. high yield/bono basura (BB o inferior).</p>
                </TheoryBlock>
                <TheoryBlock title="2.3. Precio y tipo de interés" color="teal"><p>El precio de un bono en el mercado secundario tiene una <strong>relación inversa</strong> con el tipo de interés: cuando los tipos suben, el precio de los bonos baja (porque los bonos existentes con cupones más bajos son menos atractivos), y viceversa. Esta es la fuente principal de riesgo de mercado de la renta fija.</p></TheoryBlock>
            </Card>
            <Card title="3. Renta variable" icon="📘">
                <TheoryBlock title="3.1. Las acciones" color="teal"><p>Las <strong>acciones</strong> representan una participación en la <strong>propiedad</strong> de una sociedad anónima. El accionista es copropietario y tiene derechos: <strong>económicos</strong> (dividendos, participación en el patrimonio en caso de liquidación, suscripción preferente en ampliaciones) y <strong>políticos</strong> (voto en la Junta General de Accionistas, información). La rentabilidad proviene de: <strong>dividendos</strong> (parte del beneficio distribuida) + <strong>plusvalías</strong> (ganancia por venta a precio superior al de compra).</p></TheoryBlock>
                <TheoryBlock title="3.2. Valoración de acciones" color="cyan"><p><strong>Valor nominal:</strong> valor que figura en los estatutos (capital social / n.º acciones).<br/><strong>Valor contable (teórico):</strong> patrimonio neto / n.º acciones.<br/><strong>Valor de mercado (cotización):</strong> precio al que se compra/vende en Bolsa. Determinado por oferta y demanda, expectativas de beneficios, tipos de interés, sentimiento del mercado.<br/><strong>PER (Price Earnings Ratio):</strong> Cotización / BPA (Beneficio Por Acción). Indica cuántos años de beneficios se pagan por la acción. PER alto → acción «cara» (o expectativas altas); PER bajo → acción «barata» (o expectativas bajas).</p></TheoryBlock>
                <FormulaBox formula="PER = Cotització / BPA | Rendibilitat acció = (Dividends + Plusvàlua) / Preu compra" desc="PER alt → cara o expectatives altes. PER baix → barata o expectatives baixes." />
            </Card>
            <Card title="4. Fondos de inversión y otros vehículos" icon="📘">
                <TheoryBlock title="4.1. Fondos de inversión" color="teal"><p>Un <strong>fondo de inversión</strong> es un patrimonio colectivo formado por las aportaciones de múltiples inversores (partícipes), gestionado por una <strong>sociedad gestora</strong> profesional y custodiado por una <strong>entidad depositaria</strong>. La diversificación reduce el riesgo. Tipos: fondos de renta fija, renta variable, mixtos, garantizados, indexados (replican un índice), temáticos (tecnología, ESG), monetarios. En España, más de 350.000 M€ de patrimonio gestionado.</p></TheoryBlock>
                <TheoryBlock title="4.2. ETFs, planes de pensiones y otros" color="cyan"><p><strong>ETF (Exchange-Traded Fund):</strong> fondo cotizado en Bolsa como una acción. Comisiones bajas, liquidez alta. Replican índices (IBEX 35, S&P 500).<br/><strong>Planes de pensiones:</strong> ahorro a largo plazo para la jubilación. Ventajas fiscales (aportaciones deducibles en IRPF, con límite de 1.500 €/año). Ilíquidos (solo rescatables en jubilación, incapacidad, paro LP o a los 10 años).<br/><strong>Criptoactivos:</strong> Bitcoin, Ethereum. Activos digitales descentralizados, alta volatilidad, regulación en desarrollo (MiCA en la UE).<br/><strong>Derivados:</strong> futuros, opciones, swaps. Instrumentos cuyo valor depende de un activo subyacente. Uso: cobertura de riesgos y especulación.</p></TheoryBlock>
            </Card>
            <Card title="5. La relación rentabilidad-riesgo y la diversificación" icon="📘">
                <TheoryBlock color="teal"><p><strong>Harry Markowitz</strong> (1952, Teoría Moderna de Carteras) demostró que la <strong>diversificación</strong> —combinar activos con correlaciones bajas o negativas— reduce el riesgo de una cartera sin reducir proporcionalmente la rentabilidad esperada. El <strong>riesgo diversificable</strong> (específico de una empresa) se elimina; el <strong>riesgo sistemático</strong> (de mercado) no. El modelo <strong>CAPM</strong> (Sharpe, 1964) establece que la rentabilidad esperada de un activo depende de su beta (sensibilidad al mercado): E(Ri) = Rf + βi × (E(Rm) − Rf).</p></TheoryBlock>
            </Card>
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="teal"><p>Los activos financieros se caracterizan por rentabilidad, riesgo y liquidez (triángulo imposible). La renta fija (letras, bonos, obligaciones) representa un préstamo: cupón + devolución; precio inverso a tipos. La renta variable (acciones) representa propiedad: dividendos + plusvalías; valoración por PER. Los fondos de inversión diversifican (350.000 M€ en España); los ETFs cotizan como acciones. Planes de pensiones: ahorro jubilación con ventaja fiscal. Markowitz: la diversificación reduce el riesgo diversificable. CAPM: rentabilidad esperada función de beta.</p></TheoryBlock>
            </Card>
            <BibliografiaBox items={["Brealey, R., Myers, S. & Allen, F. (2020). Principios de Finanzas Corporativas. McGraw-Hill.","Markowitz, H. (1952). Portfolio Selection. Journal of Finance.","Sharpe, W. (1964). Capital Asset Prices. Journal of Finance.","CNMV. Guía de productos financieros para inversores. www.cnmv.es","Banco de España. Portal del Cliente Bancario. www.bde.es","Tesoro Público. Valores del Tesoro. www.tesoro.es","Inverco. Estadísticas de fondos de inversión. www.inverco.es","Malkiel, B. (2019). A Random Walk Down Wall Street, 12.ª ed. Norton.","Bodie, Z., Kane, A. & Marcus, A. (2021). Investments, 12.ª ed. McGraw-Hill.","Reglamento MiCA (UE) 2023/1114 sobre mercados de criptoactivos."]} />
        </div>
    );
    const Tema61Resum = () => (
        <div className="space-y-5 animate-fade"><Card>
            <div className="p-4 bg-teal-50 rounded-xl border border-teal-200 mb-5"><p className="text-center font-bold text-teal-800 text-lg">Tema 61: Actius financers. Renda fixa i variable.</p><p className="text-center text-sm text-teal-600 mt-1"><em>"Rentabilitat ↔ Risc ↔ Liquiditat: el triangle impossible"</em></p></div>
            <div className="space-y-4 text-sm text-slate-700">
                <div><h4 className="font-bold text-slate-800 mb-1">1. Característiques</h4><ul className="list-disc pl-5 space-y-1"><li>Rentabilitat, risc, liquiditat. Triangle impossible: no es pot maximitzar tot.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">2. Renda fixa</h4><ul className="list-disc pl-5 space-y-1"><li>Préstec al emissor. Cupó + devolució principal. Preu invers a tipus interès.</li><li>Pública: lletres (CP), bons (MP), obligacions (LP). Privada: pagarés, bons corporatius. Rating: S&P, Moody's.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">3. Renda variable</h4><ul className="list-disc pl-5 space-y-1"><li>Accions = propietat. Dividends + plusvàlues. Drets econòmics i polítics.</li><li>Valor nominal, comptable, de mercat. PER = Cotització/BPA.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">4. Fons i altres</h4><ul className="list-disc pl-5 space-y-1"><li>Fons inversió: patrimoni col·lectiu, gestora, diversificació. 350.000 M€ Espanya.</li><li>ETF (fons cotitzat), plans pensions (1.500€/any deduïble), criptoactius (MiCA), derivats.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">5. Diversificació</h4><ul className="list-disc pl-5 space-y-1"><li>Markowitz: diversificar redueix risc diversificable. CAPM (Sharpe): E(Ri) = Rf + β(Rm−Rf).</li></ul></div>
            </div>
            <ClauBox><p>- Explica el <strong>triangle impossible</strong> (rentabilitat-risc-liquiditat).</p><p>- Diferencia <strong>renda fixa vs. variable</strong> amb instruments concrets.</p><p>- Inclou <strong>fons, ETFs, plans pensions, criptoactius</strong>.</p><p>- Connecta amb <strong>Markowitz i CAPM</strong> (diversificació, beta).</p></ClauBox>
        </Card></div>

    // ════════════════════════════════════════════════════════════════
    // TEMA 62 — La Bolsa de Valores. Funcionamiento e índices.
    // ════════════════════════════════════════════════════════════════
    const Tema62Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>Bolsa de Valores</strong> es el mercado organizado donde se compran y venden activos financieros, principalmente acciones y bonos. Cumple funciones esenciales: canaliza el ahorro hacia la inversión productiva, proporciona liquidez a los inversores, valora las empresas cotizadas y facilita la transparencia informativa. La Bolsa es, además, un barómetro de la confianza económica y un mecanismo de asignación eficiente de recursos.</p>
                    <p>Este tema se enmarca en los contenidos de <strong>Economía de 1.º de Bachillerato</strong> y de educación financiera. Se estructura en: concepto y funciones, mercado primario y secundario, la Bolsa española (BME), los índices bursátiles y la regulación.</p>
                </div>
            </Card>
            <Card title="1. Concepto y funciones de la Bolsa" icon="📘">
                <TheoryBlock title="1.1. Funciones" color="teal">
                    <p><strong>1. Canalización del ahorro:</strong> permite a las empresas obtener financiación emitiendo acciones (ampliaciones de capital) u obligaciones.<br/><strong>2. Liquidez:</strong> los inversores pueden vender sus títulos en cualquier momento al precio de mercado.<br/><strong>3. Valoración:</strong> la cotización refleja (en teoría) el valor de la empresa según las expectativas del mercado.<br/><strong>4. Información y transparencia:</strong> las empresas cotizadas deben publicar información financiera periódica (hechos relevantes, cuentas anuales, informes trimestrales).<br/><strong>5. Protección del inversor:</strong> regulación (CNMV), normas de conducta, prohibición de información privilegiada y manipulación de mercado.</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Mercado primario y secundario" icon="📘">
                <TheoryBlock title="2.1. Mercado primario (de emisión)" color="teal"><p>Donde se emiten y colocan por primera vez los títulos: <strong>OPV</strong> (Oferta Pública de Venta: la empresa sale a Bolsa vendiendo acciones al público), <strong>OPS</strong> (Oferta Pública de Suscripción: ampliación de capital con nuevas acciones), emisión de bonos y obligaciones. Participan: la empresa emisora, los bancos de inversión (colocadores) y los inversores.</p></TheoryBlock>
                <TheoryBlock title="2.2. Mercado secundario (de negociación)" color="cyan"><p>Donde se compran y venden los títulos ya emitidos entre inversores. La Bolsa propiamente dicha es un mercado secundario. <strong>No aporta financiación directa a la empresa</strong> (el dinero va de un inversor a otro), pero proporciona liquidez y valoración. Sin un mercado secundario eficiente, nadie compraría en el primario (no podría vender después).</p></TheoryBlock>
            </Card>
            <Card title="3. La Bolsa española: BME" icon="📘">
                <TheoryBlock title="3.1. Estructura" color="teal"><p><strong>BME (Bolsas y Mercados Españoles)</strong>, adquirida por el grupo suizo <strong>SIX</strong> en 2020, opera: las cuatro bolsas históricas (Madrid, Barcelona, Bilbao, Valencia) integradas en el <strong>SIBE</strong> (Sistema de Interconexión Bursátil), el mercado de renta fija (AIAF), el mercado de derivados (<strong>MEFF</strong> — futuros y opciones sobre IBEX y acciones), el mercado alternativo bursátil (<strong>BME Growth</strong>, para pymes y empresas en crecimiento) y la entidad de contrapartida central (<strong>BME Clearing</strong>).</p></TheoryBlock>
                <TheoryBlock title="3.2. Funcionamiento de la contratación" color="cyan"><p>El SIBE funciona como un mercado electrónico continuo: las órdenes de compra y venta se cruzan automáticamente por precio y prioridad temporal. <strong>Horario:</strong> subasta de apertura (8:30-9:00), mercado abierto (9:00-17:30), subasta de cierre (17:30-17:35). Tipos de órdenes: a mercado, limitada, por lo mejor, stop-loss.</p></TheoryBlock>
            </Card>
            <Card title="4. Los índices bursátiles" icon="📘">
                <TheoryBlock title="4.1. Concepto" color="teal"><p>Un <strong>índice bursátil</strong> es un indicador estadístico que refleja la evolución del precio de un conjunto de acciones representativas de un mercado o sector. Se utiliza como referencia (benchmark) para medir el rendimiento de carteras de inversión.</p></TheoryBlock>
                <TheoryBlock title="4.2. Principales índices" color="cyan">
                    <p><strong>IBEX 35:</strong> índice de referencia de la Bolsa española. Incluye las 35 empresas con mayor liquidez y capitalización: Inditex, Santander, BBVA, Iberdrola, Telefónica, Amadeus, Ferrovial, CaixaBank, Repsol, Cellnex, etc. Ponderado por capitalización bursátil ajustada por free float. Base 3.000 (30/12/1989).<br/><strong>S&P 500 (EE. UU.):</strong> 500 mayores empresas de EE. UU. El índice de referencia mundial.<br/><strong>Dow Jones Industrial Average:</strong> 30 grandes empresas industriales de EE. UU. Histórico (1896) pero ponderado por precio (menos representativo).<br/><strong>NASDAQ Composite:</strong> empresas tecnológicas (Apple, Microsoft, Amazon, Google, Meta, Tesla).<br/><strong>Euro Stoxx 50:</strong> 50 mayores empresas de la zona euro.<br/><strong>FTSE 100 (Londres), DAX 40 (Fráncfort), CAC 40 (París), Nikkei 225 (Tokio).</strong></p>
                </TheoryBlock>
                <FormulaBox formula="IBEX 35: 35 empreses amb major liquiditat i capitalització de la Borsa espanyola" desc="Base 3.000 (30/12/1989). Ponderat per capitalització ajustada per free float." />
            </Card>
            <Card title="5. Regulación y protección del inversor" icon="📘">
                <TheoryBlock color="teal"><p>La <strong>CNMV</strong> supervisa los mercados de valores españoles: autoriza la admisión a cotización, vigila la transparencia informativa, investiga y sanciona el uso de <strong>información privilegiada</strong> (insider trading) y la <strong>manipulación de mercado</strong>. La regulación europea (MiFID II, Reglamento de Abuso de Mercado) armoniza las normas a nivel de la UE. La <strong>protección del inversor minorista</strong> incluye: test de conveniencia/idoneidad, información previa obligatoria (KID), restricciones a productos complejos, fondo de garantía de inversiones (100.000 € por titular).</p></TheoryBlock>
            </Card>
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="teal"><p>La Bolsa canaliza ahorro, proporciona liquidez, valora empresas y exige transparencia. Se distingue mercado primario (emisión: OPV, OPS) y secundario (negociación entre inversores). BME/SIX opera el SIBE (contratación electrónica), MEFF (derivados), BME Growth (pymes) y AIAF (renta fija). El IBEX 35 (35 empresas, base 3.000 en 1989) es el índice de referencia español; el S&P 500 es la referencia mundial. La CNMV supervisa, con regulación europea armonizada (MiFID II). La protección del inversor incluye fondo de garantía (100.000 €) y restricciones a productos complejos.</p></TheoryBlock>
            </Card>
            <BibliografiaBox items={["CNMV. Guía del inversor. www.cnmv.es","BME/SIX. Estadísticas del mercado. www.bolsasymercados.es","Ley del Mercado de Valores (texto refundido, RDL 4/2015).","Directiva MiFID II (2014/65/UE).","Malkiel, B. (2019). A Random Walk Down Wall Street. Norton.","Brealey, R. et al. (2020). Principios de Finanzas Corporativas. McGraw-Hill.","Bodie, Z., Kane, A. & Marcus, A. (2021). Investments. McGraw-Hill.","Banco de España. Informe de Estabilidad Financiera.","Fama, E. (1970). Efficient Capital Markets. Journal of Finance.","Bloomberg / Reuters. Datos de mercado en tiempo real."]} />
        </div>
    );
    const Tema62Resum = () => (

            <div className="space-y-4 text-sm text-slate-700">

                <div><h4 className="font-bold text-slate-800 mb-1">3. BME/SIX</h4><ul className="list-disc pl-5 space-y-1"><li>SIBE (contratació electrònica, 9-17:30), MEFF (derivats), BME Growth (pimes), AIAF (renda fixa).</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">4. Índexs</h4><ul className="list-disc pl-5 space-y-1"><li>IBEX 35 (Espanya), S&P 500 (EUA, referència mundial), NASDAQ (tech), Euro Stoxx 50, DAX, CAC, Nikkei.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">5. Regulació</h4><ul className="list-disc pl-5 space-y-1"><li>CNMV. MiFID II. Insider trading prohibit. Fons garantia inversions: 100.000€.</li></ul></div>

        </Card></div>
    );
