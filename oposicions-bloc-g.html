        const BibliografiaBox = ({ items }) => (

            </div>

        const ClauBox = ({ children }) => (

                        <h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4>

        // ════════════════════════════════════════════════════════════════
        // TEMA 57 — La presa de decisions a l'empresa
        // ════════════════════════════════════════════════════════════════
        const Tema57Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La <strong>presa de decisions</strong> constitueix l'essència mateixa de la direcció empresarial. Com va afirmar <strong>Herbert A. Simon</strong> (Premi Nobel d'Economia 1978), «dirigir és, fonamentalment, decidir». Tota organització, des d'un autònom fins a una multinacional com <em>Inditex</em> o <em>Telefónica</em>, s'estructura al voltant d'un flux continu de decisions que configuren la seua estratègia, els seus resultats i la seua supervivència.</p>
                        <p>En un entorn cada vegada més volàtil, incert, complex i ambigu —el conegut acrònim <strong>VUCA</strong>—, la capacitat de prendre decisions racionals, oportunes i ètiques esdevé un avantatge competitiu de primera magnitud. Els xocs recents (crisi financera de 2008, pandèmia de la COVID-19, guerra a Ucraïna, tensions inflacionistes 2022-2024) han posat a prova la capacitat decisòria de les empreses espanyoles i europees.</p>
                        <p>Aquest tema, en connexió directa amb el Tema 58 (Planificació), el Tema 59 (Teories de l'organització) i el Tema 61 (Lideratge), aborda: (1) el concepte i característiques de la decisió empresarial; (2) la tipologia de decisions; (3) els entorns de decisió (certesa, risc, incertesa); (4) els models de decisió (racional, racionalitat limitada, polític, <em>garbage can</em>); (5) les tècniques quantitatives (arbres de decisió, matrius, valor esperat); i (6) la seua aplicació en sistemes oberts amb l'enfocament sistèmic.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i naturalesa de la decisió empresarial" icon="🎯">
                    <TheoryBlock title="1.1. Definició de decisió" color="indigo">
                        <p>La <strong>decisió</strong> és el <strong>procés cognitiu de selecció, entre dues o més alternatives possibles, d'aquella que es considera més idònia per assolir un determinat objectiu</strong>, donades unes restriccions i un context específic. No hi ha decisió sense: (a) un <em>agent decisor</em>, (b) un <em>objectiu</em>, (c) un conjunt d'<em>alternatives</em>, (d) un <em>entorn</em> amb estats de la naturalesa i (e) un <em>criteri</em> d'elecció.</p>
                        <p><strong>Herbert Simon</strong> (1947), en <em>Administrative Behavior</em>, va redefinir el <em>management</em> com a «<strong>ciència de la decisió</strong>»: els directius són essencialment decisors que processen informació i trien cursos d'acció. Aquesta visió va revolucionar l'enfocament clàssic (Taylor, Fayol), centrat en funcions administratives estàtiques, i va obrir les portes a la teoria del comportament organitzatiu.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Característiques de les decisions empresarials" color="violet">
                        <p><strong>a) Orientació a objectius</strong>: tota decisió ha de contribuir a la consecució d'un objectiu (benefici, quota, sostenibilitat).</p>
                        <p><strong>b) Informació asimètrica i incompleta</strong>: rarament es disposa de tota la informació rellevant (Stiglitz i Akerlof, Nobel 2001).</p>
                        <p><strong>c) Irreversibilitat parcial</strong>: moltes decisions generen costos enfonsats (<em>sunk costs</em>).</p>
                        <p><strong>d) Impacte sobre <em>stakeholders</em> múltiples</strong>: treballadors, accionistes, clients, proveïdors, administració, societat.</p>
                        <p><strong>e) Dimensió temporal</strong>: efectes a curt, mitjà i llarg termini, no sempre alineats.</p>
                        <p><strong>f) Dimensió ètica</strong>: tota decisió econòmica incorpora judicis de valor (Amartya Sen, Nobel 1998).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Elements del problema de decisió (Luce i Raiffa, 1957)" color="blue">
                        <p>Tot problema de decisió es pot representar com una <strong>matriu</strong> amb:</p>
                        <p>• <strong>Estratègies (E₁, E₂, ..., Eₘ)</strong>: accions entre les quals pot elegir el decisor.</p>
                        <p>• <strong>Estats de la naturalesa (N₁, ..., Nₙ)</strong>: situacions externes fora del seu control.</p>
                        <p>• <strong>Resultats (Rᵢⱼ)</strong>: conseqüència d'adoptar Eᵢ davall Nⱼ.</p>
                        <p>• <strong>Probabilitats (pⱼ)</strong>: verosimilitud de cada estat (en entorns de risc).</p>
                    </TheoryBlock>

                    <FormulaBox formula="Matriu R[m×n]  |  Σ pⱼ = 1" desc="Representació formal del problema de decisió (Luce i Raiffa, 1957)" />
                </Card>

                <Card title="2. Tipus de decisions empresarials" icon="🗂️">
                    <TheoryBlock title="2.1. Classificació d'Ansoff (1965) — segons nivell jeràrquic" color="indigo">
                        <p><strong>Igor Ansoff</strong>, en <em>Corporate Strategy</em> (1965), va proposar la classificació més influent:</p>
                        <p><strong>a) Decisions estratègiques</strong>: afecten l'organització globalment, a llarg termini (3-10 anys), alta incertesa, irreversibles. Exemple: entrada d'<em>Inditex</em> al mercat xinés (2006) o llançament de <em>Zara Home</em> (2003).</p>
                        <p><strong>b) Decisions tàctiques</strong>: d'abast departamental, mitjà termini (1-3 anys). Exemple: campanya publicitària estacional, obertura d'un punt de venda.</p>
                        <p><strong>c) Decisions operatives</strong>: diàries, repetitives, programables, curt termini. Exemple: quota de producció setmanal, assignació de torns.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Classificació de Simon (1977) — segons estructuració" color="violet">
                        <p><strong>a) Programades (estructurades)</strong>: repetitives, rutinàries, amb procediments estandarditzats (<em>SOP</em>). Poden automatitzar-se. Exemple: sistema de reposició automàtica d'estoc a <em>Mercadona</em>.</p>
                        <p><strong>b) No programades (no estructurades)</strong>: noves, úniques, amb alts nivells d'incertesa; exigeixen creativitat i judici directiu. Exemple: entrada d'<em>Iberdrola</em> al mercat eòlic marí (2007).</p>
                        <p><strong>c) Semiestructurades</strong>: combinen elements d'ambdues (concessió de crèdit bancari, assignació de pressupostos).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Altres classificacions" color="blue">
                        <p><strong>Segons el nombre d'agents</strong>: individuals vs. grupals (consell d'administració, comités). Les grupals eviten biaixos individuals però pateixen <em>groupthink</em> (Janis, 1972) i polarització.</p>
                        <p><strong>Segons reversibilitat</strong>: reversibles vs. irreversibles (fusió, liquidació).</p>
                        <p><strong>Segons temporalitat</strong>: immediates, curt, mitjà i llarg termini.</p>
                        <p><strong>Segons dependència</strong>: autònomes vs. seqüencials (cada decisió condiciona les següents, cas dels arbres de decisió).</p>
                    </TheoryBlock>

                    {/* SVG: Piràmide de decisions */}
                    <div className="my-6 flex justify-center">
                        <svg viewBox="0 0 560 360" className="w-full max-w-2xl mx-auto" style={{fontFamily: 'Plus Jakarta Sans, sans-serif'}}>
                            <text x="280" y="24" textAnchor="middle" fontSize="15" fontWeight="bold" fill="#1e293b">Piràmide jeràrquica de decisions (Ansoff, 1965)</text>
                            <polygon points="220,50 340,50 380,120 180,120" fill="#c7d2fe" stroke="#4f46e5" strokeWidth="2"/>
                            <text x="280" y="85" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#312e81">ESTRATÈGIQUES</text>
                            <text x="280" y="103" textAnchor="middle" fontSize="10" fill="#4338ca">Alta direcció · 3-10 anys</text>
                            <polygon points="180,120 380,120 430,210 130,210" fill="#ddd6fe" stroke="#7c3aed" strokeWidth="2"/>
                            <text x="280" y="160" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#5b21b6">TÀCTIQUES</text>
                            <text x="280" y="178" textAnchor="middle" fontSize="10" fill="#6d28d9">Direcció mitjana · 1-3 anys</text>
                            <polygon points="130,210 430,210 500,320 60,320" fill="#e9d5ff" stroke="#a855f7" strokeWidth="2"/>
                            <text x="280" y="255" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#6b21a8">OPERATIVES</text>
                            <text x="280" y="275" textAnchor="middle" fontSize="10" fill="#7e22ce">Supervisió · diàries / setmanals</text>
                            <defs><marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><polygon points="0 6, 4 0, 8 6" fill="#64748b"/></marker></defs>
                            <line x1="30" y1="320" x2="30" y2="60" stroke="#64748b" strokeWidth="1.5" markerEnd="url(#arrUp)"/>
                            <text x="20" y="200" textAnchor="middle" fontSize="10" fontWeight="600" fill="#475569" transform="rotate(-90,20,200)">Incertesa ↑ · Impacte ↑</text>
                            <text x="530" y="85" fontSize="11" fill="#312e81">Poques / grans</text>
                            <text x="530" y="325" fontSize="11" fill="#6b21a8">Moltes / petites</text>
                        </svg>
                    </div>
                </Card>

                <Card title="3. Entorns de decisió: certesa, risc i incertesa" icon="🎲">
                    <TheoryBlock title="3.1. Decisions en certesa" color="green">
                        <p>En entorns de <strong>certesa</strong>, el decisor coneix amb exactitud l'estat de la naturalesa; hi ha una única conseqüència per a cada alternativa. Són situacions hipotètiques, poc freqüents. L'elecció és directa: la millor alternativa per resultat.</p>
                        <p>Exemples: pagar una factura amb venciment determinat, triar entre dipòsits bancaris amb TAE coneguda i mateixa durada i garantia.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Decisions en risc" color="amber">
                        <p>En entorns de <strong>risc</strong>, el decisor coneix (o pot estimar) les <strong>probabilitats objectives o subjectives</strong> dels estats. El criteri més usat és el <strong>valor monetari esperat (VME)</strong>. Per avaluar el risc s'usen la variància, la desviació típica i el coeficient de variació. El <strong>Teorema de Bayes</strong> permet actualitzar probabilitats davant nova informació.</p>
                    </TheoryBlock>

                    <FormulaBox formula="VME(Eᵢ) = Σⱼ pⱼ · Rᵢⱼ" desc="Valor Monetari Esperat: suma ponderada dels resultats per les probabilitats dels estats" />

                    <TheoryBlock title="3.3. Decisions en incertesa" color="red">
                        <p><strong>Frank Knight</strong> (1921) va distingir formalment <em>risc</em> (probabilitats conegudes) d'<em>incertesa</em> (desconegudes). Els criteris no probabilístics principals són:</p>
                        <p><strong>• Laplace</strong> (raó insuficient): assumir equiprobabilitat. Mitjana aritmètica dels resultats.</p>
                        <p><strong>• Wald o <em>maximin</em></strong>: pessimista. Triar l'alternativa la pitjor conseqüència de la qual siga la millor entre les pitjors.</p>
                        <p><strong>• <em>Maximax</em></strong>: optimista. Triar l'alternativa amb el millor resultat possible.</p>
                        <p><strong>• Hurwicz</strong> (1951): combinació ponderada del millor i pitjor resultat mitjançant un coeficient α (optimisme).</p>
                        <p><strong>• Savage (mínim penediment)</strong>: minimitzar la màxima pèrdua d'oportunitat. Matriu de penediments.</p>
                    </TheoryBlock>

                    <FormulaBox formula="H(Eᵢ) = α · max(Rᵢⱼ) + (1−α) · min(Rᵢⱼ)" desc="Criteri d'Hurwicz, α ∈ [0,1] reflecteix el grau d'optimisme" />

                <Card title="4. Models de decisió" icon="🧠">
                    <TheoryBlock title="4.1. Model racional (Von Neumann-Morgenstern, 1944)" color="indigo">
                        <p>El <strong>model racional pur</strong>, formalitzat per <strong>Von Neumann i Morgenstern</strong> en <em>Theory of Games and Economic Behavior</em> (1944), assumeix que el decisor: (1) té informació completa, (2) coneix totes les alternatives, (3) té preferències transitives i consistents, (4) maximitza una funció d'utilitat esperada. Etapes: identificació → objectius → generació d'alternatives → avaluació → elecció → implementació → control.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Racionalitat limitada (Simon, 1947)" color="violet">
                        <p><strong>Simon</strong> va formular la crítica definitiva: els decisors humans tenen <strong>racionalitat limitada</strong> (<em>bounded rationality</em>) per (a) capacitat cognitiva finita, (b) informació incompleta, (c) temps limitat. No <em>maximitzen</em>, sinó que <strong>satisfan</strong> (<em>satisficing</em>): accepten la primera alternativa que compleix uns mínims aspiracionals.</p>
                        <p>Desenvolupat per l'<strong>economia conductual</strong> de <strong>Kahneman i Tversky</strong> (Nobel 2002) i <strong>Thaler</strong> (Nobel 2017), que documenten biaixos sistemàtics: aversió a la pèrdua, efecte d'ancoratge, disponibilitat, <em>status quo</em>, sobreconfiança.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Models polític i garbage can" color="rose">
                        <p>El <strong>model polític</strong> (Allison, 1971; Pfeffer, 1981) concep l'organització com una coalició de grups d'interès amb objectius divergents. Les decisions són resultat de negociacions, aliances i exercici de poder.</p>
                        <p>El <strong>model del «paper de fem»</strong> (<em>garbage can</em>), de <strong>Cohen, March i Olsen</strong> (1972), descriu organitzacions anàrquiques on problemes, solucions, participants i ocasions es troben aleatòriament. Les solucions sovint precedeixen els problemes.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. L'arbre de decisió: tècnica fonamental" icon="🌳">
                    <TheoryBlock title="5.1. Concepte i utilitat" color="emerald">
                        <p>L'<strong>arbre de decisió</strong> és una representació gràfica seqüencial d'un problema amb: <strong>nodes de decisió</strong> (quadrats ▪), <strong>nodes d'atzar</strong> (cercles ●) i <strong>resultats terminals</strong> (triangles ▲). Formalitzat per <strong>Howard Raiffa</strong> (1968) a <em>Decision Analysis</em>.</p>
                        <p>Especialment útil per a decisions seqüencials multietapa: llançament de producte amb fase pilot, plans d'inversió per fases, litigi vs. negociació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Algorisme — backward induction" color="blue">
                        <p>Resolució per <strong>inducció cap endarrere</strong>: (1) avaluar els nodes terminals; (2) als nodes d'atzar, calcular VME; (3) als nodes de decisió, triar el major VME (beneficis) o menor (costos); (4) recórrer l'arbre fins al node inicial.</p>
                    </TheoryBlock>

                <Card title="6. Decisions en sistemes oberts i enfocament sistèmic" icon="🔄">
                    <TheoryBlock title="6.1. Teoria general de sistemes (Bertalanffy, 1968)" color="cyan">
                        <p><strong>Ludwig von Bertalanffy</strong> va formular que les organitzacions són <strong>sistemes oberts</strong> que interaccionen amb l'entorn mitjançant <em>inputs</em> (recursos, informació) i <em>outputs</em> (productes, residus). Característiques: totalitat, sinergia, equifinalitat, retroalimentació (<em>feedback</em>) i homeòstasi.</p>
                        <p>Les decisions, en un sistema obert, no són aïllables: generen <em>feedback</em> i interaccions. Cal un <strong>enfocament holístic</strong> que consideri externalitats i <em>stakeholders</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="6.2. Decisions en entorns VUCA" color="rose">
                        <p><strong>• Anàlisi d'escenaris</strong> (Shell, 1970): construir 3-4 futurs plausibles i avaluar robustesa.</p>
                        <p><strong>• Real options</strong> (Myers, 1977; Dixit i Pindyck, 1994): tractar decisions com opcions financeres que incorporen flexibilitat.</p>
                        <p><strong>• Simulació Monte Carlo</strong>: generar milers de trajectòries aleatòries per estimar distribucions de resultats.</p>
                        <p><strong>• IA i <em>big data</em></strong>: algorismes de <em>machine learning</em> aplicats a decisions comercials i logístiques (<em>Inditex</em> usa IA per predir demanda a les 5.800 botigues <em>Zara</em>).</p>
                    </TheoryBlock>

                    <FormulaBox formula="Sistema obert: Inputs → Transformació → Outputs + Feedback" desc="Bertalanffy, 1968. Les decisions han de considerar retroalimentacions i externalitats" />
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Al llarg del tema s'ha presentat la <strong>presa de decisions</strong> com l'activitat central de la direcció empresarial, en la línia de <strong>Simon (1947)</strong>. La sistematització del problema (alternatives, estats, resultats, probabilitats) permet aplicar tècniques rigoroses: matrius, criteris en incertesa (Laplace, Wald, Hurwicz, Savage) i arbres de decisió seqüencials (Raiffa, 1968).</p>
                        <p>La tipologia d'Ansoff i la classificació de Simon ofereixen mapes jeràrquics útils a l'aula. Els models alternatius —racionalitat limitada, polític, <em>garbage can</em>— corregeixen les limitacions del model racional i connecten amb l'<strong>economia conductual</strong>. L'enfocament sistèmic de Bertalanffy obliga a concebre l'empresa com un sistema obert davant un entorn VUCA. Els reptes actuals —transició ecològica, digitalització, IA— exigeixen decisions robustes, flexibles i ètiques.</p>
                    </div>

            { id: 'tema63', num: 63, emoji: '💬', available: true },
            { id: 'tema64', num: 64, emoji: '⚡', available: true },
            { id: 'tema65', num: 65, emoji: '⚖️', available: true },
        ];

        const Inicio = () => (
            <div className="animate-fade">
                <a href="./oposicions" className="inline-flex items-center gap-2 text-sm text-indigo-600 hover:text-indigo-800 mb-6 transition-colors">{t('inicio.backOpo')}</a>
                <div className="text-center mb-10">
                    <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-indigo-100 text-indigo-700 rounded-full text-sm font-semibold mb-4"><span>🏛️</span> Bloc G · BOE 57-65</div>
                    <h1 className="text-4xl font-black text-slate-800 mb-3">{t('inicio.title')}</h1>
                    <p className="text-slate-500 text-lg max-w-3xl mx-auto">{t('inicio.subtitle')}</p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {temes.map(tema => (
                        <button key={tema.id} onClick={() => { if (tema.available) { setSection(tema.id); pdeSetHashSection(tema.id); pdeScrollToTop(); } }} className={`text-left p-5 rounded-2xl border transition-all ${tema.available ? 'bg-white border-indigo-200 hover:shadow-lg hover:border-indigo-400 cursor-pointer' : 'bg-gray-50 border-gray-200 opacity-70 cursor-not-allowed'}`}>
                            <div className="flex items-start gap-3">
                                <span className={`inline-flex items-center justify-center w-11 h-11 rounded-xl text-sm font-black text-white ${tema.available ? 'bg-gradient-to-br from-indigo-500 to-violet-600' : 'bg-gray-400'}`}>T{tema.num}</span>
                                <div className="flex-1 min-w-0">
                                    <p className="font-semibold text-slate-800 text-sm leading-snug mb-2">{t(`tema${tema.num}.title`)}</p>
                                    <span className={`inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full ${tema.available ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-500'}`}>{tema.available ? '✓ ' + t('inicio.disponible') : '🔒 ' + t('inicio.properament')}</span>
                                </div>
                            </div>
                        </button>
                    ))}
                </div>
            </div>
        );

        const headerSections = [
            { id: 'inicio', label: t('sec.inicio'), emoji: '🏠' },
            { id: 'tema57', label: 'T57', emoji: '🎯' },
            { id: 'tema58', label: 'T58', emoji: '📋' },
            { id: 'tema59', label: 'T59', emoji: '🏛️' },
            { id: 'tema60', label: 'T60', emoji: '🗂️' },
            { id: 'tema61', label: 'T61', emoji: '👑' },
            { id: 'tema62', label: 'T62', emoji: '🎭' },
            { id: 'tema63', label: 'T63', emoji: '💬' },
            { id: 'tema64', label: 'T64', emoji: '⚡' },
            { id: 'tema65', label: 'T65', emoji: '⚖️' },
        ];

        return (
            <div className="min-h-screen">
                <PdeHeader idioma={idioma} setIdioma={setIdioma} currentApp="oposicions-bloc-g" sections={headerSections} currentSection={section} setSection={setSection} />
                <main className="max-w-7xl mx-auto px-4 py-8">
                    {section === 'inicio' && <Inicio />}
                    {section === 'tema57' && <Tema57 />}
                    {section === 'tema58' && <Tema58 />}
                    {section === 'tema59' && <Tema59 />}
                    {section === 'tema60' && <Tema60 />}
                    {section === 'tema61' && <Tema61 />}
                    {section === 'tema62' && <Tema62 />}
                    {section === 'tema63' && <Tema63 />}
                    {section === 'tema64' && <Tema64 />}
                    {section === 'tema65' && <Tema65 />}
                </main>
                <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
                <PdeFooter appEmoji="🎯" appName={t('footer.appname')} idioma={idioma} />
                <PdeScrollToTop />
            </div>
        );
    }

    ReactDOM.render(<BlocGApp />, document.getElementById('root'));
    </script>
</body>
</html>
