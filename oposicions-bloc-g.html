        const BibliografiaBox = ({ items }) => (

            </div>

        const ClauBox = ({ children }) => (

                        <h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4>

        // ════════════════════════════════════════════════════════════════
        // TEMA 57 — La presa de decisions a l'empresa
        // ════════════════════════════════════════════════════════════════
        const Tema57Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La <strong>presa de decisions</strong> constitueix l'essència mateixa de la direcció empresarial. Com va afirmar <strong>Herbert A. Simon</strong> (Premi Nobel d'Economia 1978), «dirigir és, fonamentalment, decidir». Tota organització, des d'un autònom fins a una multinacional com <em>Inditex</em> o <em>Telefónica</em>, s'estructura al voltant d'un flux continu de decisions que configuren la seua estratègia, els seus resultats i la seua supervivència.</p>
                        <p>En un entorn cada vegada més volàtil, incert, complex i ambigu —el conegut acrònim <strong>VUCA</strong>—, la capacitat de prendre decisions racionals, oportunes i ètiques esdevé un avantatge competitiu de primera magnitud. Els xocs recents (crisi financera de 2008, pandèmia de la COVID-19, guerra a Ucraïna, tensions inflacionistes 2022-2024) han posat a prova la capacitat decisòria de les empreses espanyoles i europees.</p>
                        <p>Aquest tema, en connexió directa amb el Tema 58 (Planificació), el Tema 59 (Teories de l'organització) i el Tema 61 (Lideratge), aborda: (1) el concepte i característiques de la decisió empresarial; (2) la tipologia de decisions; (3) els entorns de decisió (certesa, risc, incertesa); (4) els models de decisió (racional, racionalitat limitada, polític, <em>garbage can</em>); (5) les tècniques quantitatives (arbres de decisió, matrius, valor esperat); i (6) la seua aplicació en sistemes oberts amb l'enfocament sistèmic.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i naturalesa de la decisió empresarial" icon="🎯">
                    <TheoryBlock title="1.1. Definició de decisió" color="indigo">
                        <p>La <strong>decisió</strong> és el <strong>procés cognitiu de selecció, entre dues o més alternatives possibles, d'aquella que es considera més idònia per assolir un determinat objectiu</strong>, donades unes restriccions i un context específic. No hi ha decisió sense: (a) un <em>agent decisor</em>, (b) un <em>objectiu</em>, (c) un conjunt d'<em>alternatives</em>, (d) un <em>entorn</em> amb estats de la naturalesa i (e) un <em>criteri</em> d'elecció.</p>
                        <p><strong>Herbert Simon</strong> (1947), en <em>Administrative Behavior</em>, va redefinir el <em>management</em> com a «<strong>ciència de la decisió</strong>»: els directius són essencialment decisors que processen informació i trien cursos d'acció. Aquesta visió va revolucionar l'enfocament clàssic (Taylor, Fayol), centrat en funcions administratives estàtiques, i va obrir les portes a la teoria del comportament organitzatiu.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Característiques de les decisions empresarials" color="violet">
                        <p><strong>a) Orientació a objectius</strong>: tota decisió ha de contribuir a la consecució d'un objectiu (benefici, quota, sostenibilitat).</p>
                        <p><strong>b) Informació asimètrica i incompleta</strong>: rarament es disposa de tota la informació rellevant (Stiglitz i Akerlof, Nobel 2001).</p>
                        <p><strong>c) Irreversibilitat parcial</strong>: moltes decisions generen costos enfonsats (<em>sunk costs</em>).</p>
                        <p><strong>d) Impacte sobre <em>stakeholders</em> múltiples</strong>: treballadors, accionistes, clients, proveïdors, administració, societat.</p>
                        <p><strong>e) Dimensió temporal</strong>: efectes a curt, mitjà i llarg termini, no sempre alineats.</p>
                        <p><strong>f) Dimensió ètica</strong>: tota decisió econòmica incorpora judicis de valor (Amartya Sen, Nobel 1998).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Elements del problema de decisió (Luce i Raiffa, 1957)" color="blue">
                        <p>Tot problema de decisió es pot representar com una <strong>matriu</strong> amb:</p>
                        <p>• <strong>Estratègies (E₁, E₂, ..., Eₘ)</strong>: accions entre les quals pot elegir el decisor.</p>
                        <p>• <strong>Estats de la naturalesa (N₁, ..., Nₙ)</strong>: situacions externes fora del seu control.</p>
                        <p>• <strong>Resultats (Rᵢⱼ)</strong>: conseqüència d'adoptar Eᵢ davall Nⱼ.</p>
                        <p>• <strong>Probabilitats (pⱼ)</strong>: verosimilitud de cada estat (en entorns de risc).</p>
                    </TheoryBlock>

                    <FormulaBox formula="Matriu R[m×n]  |  Σ pⱼ = 1" desc="Representació formal del problema de decisió (Luce i Raiffa, 1957)" />
                </Card>

                <Card title="2. Tipus de decisions empresarials" icon="🗂️">
                    <TheoryBlock title="2.1. Classificació d'Ansoff (1965) — segons nivell jeràrquic" color="indigo">
                        <p><strong>Igor Ansoff</strong>, en <em>Corporate Strategy</em> (1965), va proposar la classificació més influent:</p>
                        <p><strong>a) Decisions estratègiques</strong>: afecten l'organització globalment, a llarg termini (3-10 anys), alta incertesa, irreversibles. Exemple: entrada d'<em>Inditex</em> al mercat xinés (2006) o llançament de <em>Zara Home</em> (2003).</p>
                        <p><strong>b) Decisions tàctiques</strong>: d'abast departamental, mitjà termini (1-3 anys). Exemple: campanya publicitària estacional, obertura d'un punt de venda.</p>
                        <p><strong>c) Decisions operatives</strong>: diàries, repetitives, programables, curt termini. Exemple: quota de producció setmanal, assignació de torns.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Classificació de Simon (1977) — segons estructuració" color="violet">
                        <p><strong>a) Programades (estructurades)</strong>: repetitives, rutinàries, amb procediments estandarditzats (<em>SOP</em>). Poden automatitzar-se. Exemple: sistema de reposició automàtica d'estoc a <em>Mercadona</em>.</p>
                        <p><strong>b) No programades (no estructurades)</strong>: noves, úniques, amb alts nivells d'incertesa; exigeixen creativitat i judici directiu. Exemple: entrada d'<em>Iberdrola</em> al mercat eòlic marí (2007).</p>
                        <p><strong>c) Semiestructurades</strong>: combinen elements d'ambdues (concessió de crèdit bancari, assignació de pressupostos).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Altres classificacions" color="blue">
                        <p><strong>Segons el nombre d'agents</strong>: individuals vs. grupals (consell d'administració, comités). Les grupals eviten biaixos individuals però pateixen <em>groupthink</em> (Janis, 1972) i polarització.</p>
                        <p><strong>Segons reversibilitat</strong>: reversibles vs. irreversibles (fusió, liquidació).</p>
                        <p><strong>Segons temporalitat</strong>: immediates, curt, mitjà i llarg termini.</p>
                        <p><strong>Segons dependència</strong>: autònomes vs. seqüencials (cada decisió condiciona les següents, cas dels arbres de decisió).</p>
                    </TheoryBlock>

                    {/* SVG: Piràmide de decisions */}
                    <div className="my-6 flex justify-center">
                        <svg viewBox="0 0 560 360" className="w-full max-w-2xl mx-auto" style={{fontFamily: 'Plus Jakarta Sans, sans-serif'}}>
                            <text x="280" y="24" textAnchor="middle" fontSize="15" fontWeight="bold" fill="#1e293b">Piràmide jeràrquica de decisions (Ansoff, 1965)</text>
                            <polygon points="220,50 340,50 380,120 180,120" fill="#c7d2fe" stroke="#4f46e5" strokeWidth="2"/>
                            <text x="280" y="85" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#312e81">ESTRATÈGIQUES</text>
                            <text x="280" y="103" textAnchor="middle" fontSize="10" fill="#4338ca">Alta direcció · 3-10 anys</text>
                            <polygon points="180,120 380,120 430,210 130,210" fill="#ddd6fe" stroke="#7c3aed" strokeWidth="2"/>
                            <text x="280" y="160" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#5b21b6">TÀCTIQUES</text>
                            <text x="280" y="178" textAnchor="middle" fontSize="10" fill="#6d28d9">Direcció mitjana · 1-3 anys</text>
                            <polygon points="130,210 430,210 500,320 60,320" fill="#e9d5ff" stroke="#a855f7" strokeWidth="2"/>
                            <text x="280" y="255" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#6b21a8">OPERATIVES</text>
                            <text x="280" y="275" textAnchor="middle" fontSize="10" fill="#7e22ce">Supervisió · diàries / setmanals</text>
                            <defs><marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><polygon points="0 6, 4 0, 8 6" fill="#64748b"/></marker></defs>
                            <line x1="30" y1="320" x2="30" y2="60" stroke="#64748b" strokeWidth="1.5" markerEnd="url(#arrUp)"/>
                            <text x="20" y="200" textAnchor="middle" fontSize="10" fontWeight="600" fill="#475569" transform="rotate(-90,20,200)">Incertesa ↑ · Impacte ↑</text>
                            <text x="530" y="85" fontSize="11" fill="#312e81">Poques / grans</text>
                            <text x="530" y="325" fontSize="11" fill="#6b21a8">Moltes / petites</text>
                        </svg>
                    </div>
                </Card>

                <Card title="3. Entorns de decisió: certesa, risc i incertesa" icon="🎲">
                    <TheoryBlock title="3.1. Decisions en certesa" color="green">
                        <p>En entorns de <strong>certesa</strong>, el decisor coneix amb exactitud l'estat de la naturalesa; hi ha una única conseqüència per a cada alternativa. Són situacions hipotètiques, poc freqüents. L'elecció és directa: la millor alternativa per resultat.</p>
                        <p>Exemples: pagar una factura amb venciment determinat, triar entre dipòsits bancaris amb TAE coneguda i mateixa durada i garantia.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Decisions en risc" color="amber">
                        <p>En entorns de <strong>risc</strong>, el decisor coneix (o pot estimar) les <strong>probabilitats objectives o subjectives</strong> dels estats. El criteri més usat és el <strong>valor monetari esperat (VME)</strong>. Per avaluar el risc s'usen la variància, la desviació típica i el coeficient de variació. El <strong>Teorema de Bayes</strong> permet actualitzar probabilitats davant nova informació.</p>
                    </TheoryBlock>

                    <FormulaBox formula="VME(Eᵢ) = Σⱼ pⱼ · Rᵢⱼ" desc="Valor Monetari Esperat: suma ponderada dels resultats per les probabilitats dels estats" />

                    <TheoryBlock title="3.3. Decisions en incertesa" color="red">
                        <p><strong>Frank Knight</strong> (1921) va distingir formalment <em>risc</em> (probabilitats conegudes) d'<em>incertesa</em> (desconegudes). Els criteris no probabilístics principals són:</p>
                        <p><strong>• Laplace</strong> (raó insuficient): assumir equiprobabilitat. Mitjana aritmètica dels resultats.</p>
                        <p><strong>• Wald o <em>maximin</em></strong>: pessimista. Triar l'alternativa la pitjor conseqüència de la qual siga la millor entre les pitjors.</p>
                        <p><strong>• <em>Maximax</em></strong>: optimista. Triar l'alternativa amb el millor resultat possible.</p>
                        <p><strong>• Hurwicz</strong> (1951): combinació ponderada del millor i pitjor resultat mitjançant un coeficient α (optimisme).</p>
                        <p><strong>• Savage (mínim penediment)</strong>: minimitzar la màxima pèrdua d'oportunitat. Matriu de penediments.</p>
                    </TheoryBlock>

                    <FormulaBox formula="H(Eᵢ) = α · max(Rᵢⱼ) + (1−α) · min(Rᵢⱼ)" desc="Criteri d'Hurwicz, α ∈ [0,1] reflecteix el grau d'optimisme" />

                <Card title="4. Models de decisió" icon="🧠">
                    <TheoryBlock title="4.1. Model racional (Von Neumann-Morgenstern, 1944)" color="indigo">
                        <p>El <strong>model racional pur</strong>, formalitzat per <strong>Von Neumann i Morgenstern</strong> en <em>Theory of Games and Economic Behavior</em> (1944), assumeix que el decisor: (1) té informació completa, (2) coneix totes les alternatives, (3) té preferències transitives i consistents, (4) maximitza una funció d'utilitat esperada. Etapes: identificació → objectius → generació d'alternatives → avaluació → elecció → implementació → control.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Racionalitat limitada (Simon, 1947)" color="violet">
                        <p><strong>Simon</strong> va formular la crítica definitiva: els decisors humans tenen <strong>racionalitat limitada</strong> (<em>bounded rationality</em>) per (a) capacitat cognitiva finita, (b) informació incompleta, (c) temps limitat. No <em>maximitzen</em>, sinó que <strong>satisfan</strong> (<em>satisficing</em>): accepten la primera alternativa que compleix uns mínims aspiracionals.</p>
                        <p>Desenvolupat per l'<strong>economia conductual</strong> de <strong>Kahneman i Tversky</strong> (Nobel 2002) i <strong>Thaler</strong> (Nobel 2017), que documenten biaixos sistemàtics: aversió a la pèrdua, efecte d'ancoratge, disponibilitat, <em>status quo</em>, sobreconfiança.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Models polític i garbage can" color="rose">
                        <p>El <strong>model polític</strong> (Allison, 1971; Pfeffer, 1981) concep l'organització com una coalició de grups d'interès amb objectius divergents. Les decisions són resultat de negociacions, aliances i exercici de poder.</p>
                        <p>El <strong>model del «paper de fem»</strong> (<em>garbage can</em>), de <strong>Cohen, March i Olsen</strong> (1972), descriu organitzacions anàrquiques on problemes, solucions, participants i ocasions es troben aleatòriament. Les solucions sovint precedeixen els problemes.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. L'arbre de decisió: tècnica fonamental" icon="🌳">
                    <TheoryBlock title="5.1. Concepte i utilitat" color="emerald">
                        <p>L'<strong>arbre de decisió</strong> és una representació gràfica seqüencial d'un problema amb: <strong>nodes de decisió</strong> (quadrats ▪), <strong>nodes d'atzar</strong> (cercles ●) i <strong>resultats terminals</strong> (triangles ▲). Formalitzat per <strong>Howard Raiffa</strong> (1968) a <em>Decision Analysis</em>.</p>
                        <p>Especialment útil per a decisions seqüencials multietapa: llançament de producte amb fase pilot, plans d'inversió per fases, litigi vs. negociació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Algorisme — backward induction" color="blue">
                        <p>Resolució per <strong>inducció cap endarrere</strong>: (1) avaluar els nodes terminals; (2) als nodes d'atzar, calcular VME; (3) als nodes de decisió, triar el major VME (beneficis) o menor (costos); (4) recórrer l'arbre fins al node inicial.</p>
                    </TheoryBlock>

                <Card title="6. Decisions en sistemes oberts i enfocament sistèmic" icon="🔄">
                    <TheoryBlock title="6.1. Teoria general de sistemes (Bertalanffy, 1968)" color="cyan">
                        <p><strong>Ludwig von Bertalanffy</strong> va formular que les organitzacions són <strong>sistemes oberts</strong> que interaccionen amb l'entorn mitjançant <em>inputs</em> (recursos, informació) i <em>outputs</em> (productes, residus). Característiques: totalitat, sinergia, equifinalitat, retroalimentació (<em>feedback</em>) i homeòstasi.</p>
                        <p>Les decisions, en un sistema obert, no són aïllables: generen <em>feedback</em> i interaccions. Cal un <strong>enfocament holístic</strong> que consideri externalitats i <em>stakeholders</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="6.2. Decisions en entorns VUCA" color="rose">
                        <p><strong>• Anàlisi d'escenaris</strong> (Shell, 1970): construir 3-4 futurs plausibles i avaluar robustesa.</p>
                        <p><strong>• Real options</strong> (Myers, 1977; Dixit i Pindyck, 1994): tractar decisions com opcions financeres que incorporen flexibilitat.</p>
                        <p><strong>• Simulació Monte Carlo</strong>: generar milers de trajectòries aleatòries per estimar distribucions de resultats.</p>
                        <p><strong>• IA i <em>big data</em></strong>: algorismes de <em>machine learning</em> aplicats a decisions comercials i logístiques (<em>Inditex</em> usa IA per predir demanda a les 5.800 botigues <em>Zara</em>).</p>
                    </TheoryBlock>

                    <FormulaBox formula="Sistema obert: Inputs → Transformació → Outputs + Feedback" desc="Bertalanffy, 1968. Les decisions han de considerar retroalimentacions i externalitats" />
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Al llarg del tema s'ha presentat la <strong>presa de decisions</strong> com l'activitat central de la direcció empresarial, en la línia de <strong>Simon (1947)</strong>. La sistematització del problema (alternatives, estats, resultats, probabilitats) permet aplicar tècniques rigoroses: matrius, criteris en incertesa (Laplace, Wald, Hurwicz, Savage) i arbres de decisió seqüencials (Raiffa, 1968).</p>
                        <p>La tipologia d'Ansoff i la classificació de Simon ofereixen mapes jeràrquics útils a l'aula. Els models alternatius —racionalitat limitada, polític, <em>garbage can</em>— corregeixen les limitacions del model racional i connecten amb l'<strong>economia conductual</strong>. L'enfocament sistèmic de Bertalanffy obliga a concebre l'empresa com un sistema obert davant un entorn VUCA. Els reptes actuals —transició ecològica, digitalització, IA— exigeixen decisions robustes, flexibles i ètiques.</p>
                    </div>

                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Si, com va subratllar <strong>Simon (1947)</strong> al Tema 57, dirigir és decidir, <strong>planificar</strong> és <em>decidir avui què volem que passe demà</em>. La planificació és la funció directiva més genuïnament projectiva: mira cap endavant, anticipa escenaris, selecciona objectius i dissenya els mitjans per assolir-los. Juntament amb l'organització (Tema 60), la direcció (Tema 61) i el control, constitueix la seqüència clàssica del <em>management</em> formulada per <strong>Henri Fayol</strong> el 1916 i encara vigent, amb matisos, en qualsevol manual contemporani de direcció.</p>
                        <p>En un entorn postpandèmic, marcat per la digitalització accelerada, la transició energètica (Llei 7/2021 de canvi climàtic i transició energètica) i els fons europeus <em>Next Generation EU</em> (2021-2026), les empreses espanyoles s'enfronten a la necessitat de redissenyar els seus plans estratègics amb horitzons de 5-10 anys. Casos paradigmàtics són el <em>Plan Estratégico 2024-2026</em> de <em>Telefónica</em> o el <em>Plan Horizonte 2030</em> d'<em>Iberdrola</em> centrat en renovables.</p>
                        <p>Aquest tema aborda: (1) el concepte, naturalesa i necessitat de la planificació; (2) els seus elements i etapes; (3) els nivells i tipus de plans; (4) les tècniques d'anàlisi externa (PESTEL, 5 forces de Porter) i interna (cadena de valor, DAFO); (5) el concepte i etapes del control; (6) les tècniques de control (pressupostos, <em>benchmarking</em>, <em>Balanced Scorecard</em>); i (7) els sistemes integrats de planificació i control.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i naturalesa de la planificació" icon="🎯">
                    <TheoryBlock title="1.1. Definició i característiques" color="indigo">
                        <p>La <strong>planificació</strong> es pot definir com el <strong>procés formal mitjançant el qual l'empresa determina els seus objectius, les estratègies per assolir-los i els recursos necessaris</strong>, anticipant-se als canvis de l'entorn. Segons <strong>George Steiner</strong> (<em>Strategic Planning</em>, 1979), «planificar és decidir anticipadament què fer, com fer-ho, quan fer-ho i qui ho ha de fer».</p>
                        <p>Les seues característiques essencials són: (a) <strong>prospectiva</strong> — projecta l'empresa cap al futur; (b) <strong>sistèmica</strong> — integra totes les àrees funcionals; (c) <strong>instrumental</strong> — és un mitjà, no una finalitat; (d) <strong>iterativa</strong> — es revisa i adapta constantment; (e) <strong>jeràrquica</strong> — es despleguen objectius en cascada; i (f) <strong>quantitativa i qualitativa</strong> — combina indicadors numèrics amb criteris estratègics.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Necessitat i avantatges" color="violet">
                        <p>Les raons que justifiquen la planificació són, seguint <strong>Koontz i Weihrich</strong> (1998):</p>
                        <p><strong>• Minimitzar la incertesa</strong> anticipant canvis de l'entorn.</p>
                        <p><strong>• Centrar l'atenció</strong> sobre els objectius i evitar la dispersió d'esforços.</p>
                        <p><strong>• Facilitar el control</strong>: sense pla no hi ha referent per comparar els resultats.</p>
                        <p><strong>• Optimitzar la coordinació</strong> entre àrees i jerarquies.</p>
                        <p><strong>• Millorar l'eficiència</strong> en l'ús de recursos escassos.</p>
                        <p><strong>• Impulsar la innovació</strong> obligant a repensar el model de negoci.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Limitacions i crítiques" color="amber">
                        <p><strong>Henry Mintzberg</strong>, en <em>The Rise and Fall of Strategic Planning</em> (1994), va formular la crítica més influent a la planificació estratègica formal: la planificació analítica no substitueix la <strong>intuïció</strong> i la <strong>síntesi</strong>; sovint es converteix en un ritual burocràtic; i rigideix l'organització davant els canvis ràpids. Mintzberg proposa parlar de <em>strategic thinking</em> més que de <em>strategic planning</em>, i reconeix el pes de les estratègies <em>emergents</em> (no premeditades) enfront de les <em>deliberades</em>.</p>
                        <p>Tanmateix, la literatura actual (Grant, 2019) defensa que, lluny d'haver mort, la planificació ha evolucionat cap a formes més àgils: <em>scenario planning</em>, OKR (Objectives and Key Results) popularitzats per <em>Google</em> i <em>Intel</em>, i metodologies àgils que combinen planificació de mig termini amb iteracions curtes (<em>sprints</em>).</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Elements i etapes del procés de planificació" icon="🧩">
                    <TheoryBlock title="2.1. Elements de tot pla" color="indigo">
                        <p>Tot pla contindrà, amb més o menys grau de detall:</p>
                        <p><strong>• Objectius</strong>: resultats específics, mesurables, assolibles, rellevants i temporitzats (criteri <strong>SMART</strong> de Doran, 1981).</p>
                        <p><strong>• Polítiques</strong>: guies generals de comportament que orienten les decisions.</p>
                        <p><strong>• Procediments</strong>: seqüències d'accions detallades per executar tasques.</p>
                        <p><strong>• Regles</strong>: prescripcions rígides (sí / no) sense marge d'interpretació.</p>
                        <p><strong>• Programes</strong>: conjunts d'activitats amb calendari i recursos assignats.</p>
                        <p><strong>• Pressupostos</strong>: expressió quantitativa i financera del pla.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Etapes del procés planificador" color="violet">
                        <p>El procés clàssic té 7 etapes (Koontz i O'Donnell):</p>
                        <p><strong>1. Anàlisi de la situació</strong> — diagnòstic extern i intern (DAFO, PESTEL, 5 forces de Porter).</p>
                        <p><strong>2. Formulació d'objectius</strong> — definició de fins i metes (criteri SMART).</p>
                        <p><strong>3. Identificació d'alternatives</strong> — generació d'estratègies possibles (matriu Ansoff, matriu BCG).</p>
                        <p><strong>4. Avaluació d'alternatives</strong> — anàlisi de viabilitat econòmica, tècnica i organitzativa.</p>
                        <p><strong>5. Elecció</strong> — selecció del curs d'acció (Tema 57).</p>
                        <p><strong>6. Formulació de plans derivats</strong> — desplegament en plans funcionals (màrqueting, producció, RR.HH., finances).</p>
                        <p><strong>7. Pressupost</strong> — quantificació financera.</p>
                    </TheoryBlock>

                    <FormulaBox formula="Objectius SMART = Specific · Measurable · Achievable · Relevant · Time-bound" desc="Criteris de Doran (1981) per a la formulació d'objectius empresarials" />
                </Card>

                <Card title="3. Nivells i tipus de planificació" icon="📐">
                    <TheoryBlock title="3.1. Planificació estratègica" color="indigo">
                        <p>És la d'abast més ampli i llarg termini (3-10 anys), realitzada per l'alta direcció. Defineix la <strong>missió</strong>, la <strong>visió</strong>, els <strong>valors</strong> i els <strong>objectius corporatius</strong>. Inclou les decisions fonamentals: mercats on competir, com competir, amb quins recursos. Segons <strong>Michael Porter</strong> (1980), l'estratègia competitiva descansa en tres posicionaments genèrics: <em>lideratge en costos</em>, <em>diferenciació</em> i <em>enfocament o segmentació</em>.</p>
                        <p>Exemples: el viratge estratègic de <em>Telefónica</em> cap als serveis digitals i els <em>data centers</em> (2023); la reorientació de <em>BBVA</em> cap a la banca totalment digital.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Planificació tàctica" color="violet">
                        <p>D'abast funcional i horitzó mitjà (1-3 anys). La realitza la direcció intermèdia. Desplega l'estratègia en plans funcionals: pla de màrqueting, pla de producció, pla financer, pla de RR.HH. És el pont entre el nivell estratègic i l'operatiu.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Planificació operativa" color="blue">
                        <p>Diària, setmanal o mensual. Detalla programes d'activitats, pressupostos operatius i procediments. Exemples: pla setmanal de producció a una fàbrica de <em>SEAT</em>, programa diari de rutes d'una flota logística de <em>DHL</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.4. Tipologia segons temporalitat i abast" color="emerald">
                        <p><strong>Segons el termini</strong>: curt (menys d'1 any), mitjà (1-3 anys), llarg (3-10 anys o més).</p>
                        <p><strong>Segons la freqüència</strong>: únics (per a un projecte específic, com l'entrada de <em>Lidl</em> a un nou país) vs. permanents (polítiques de RR.HH.).</p>
                        <p><strong>Segons l'àrea funcional</strong>: comercial, productiva, financera, recursos humans, I+D+i.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Anàlisi de l'entorn i diagnòstic estratègic" icon="🔍">
                    <TheoryBlock title="4.1. Anàlisi externa: PESTEL" color="cyan">
                        <p>L'anàlisi <strong>PESTEL</strong> (Aguilar, 1967; ampliat en les dècades posteriors) examina els factors de l'entorn general que afecten l'empresa:</p>
                        <p><strong>P</strong>olítics · <strong>E</strong>conòmics · <strong>S</strong>ocials · <strong>T</strong>ecnològics · <strong>E</strong>cològics · <strong>L</strong>egals.</p>
                        <p>Exemple aplicat al sector energètic espanyol 2024: polítics (pla PNIEC 2021-2030), econòmics (inflació, preu del gas), socials (conscienciació ambiental), tecnològics (hidrogen verd, emmagatzematge), ecològics (Llei 7/2021), legals (Directiva europea de renovables).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Anàlisi del sector: 5 forces de Porter (1980)" color="rose">
                        <p><strong>Michael Porter</strong>, a <em>Competitive Strategy</em> (1980), va formalitzar l'anàlisi del sector mitjançant cinc forces competitives: (1) <strong>rivalitat</strong> entre competidors actuals; (2) <strong>amenaça d'entrants</strong> potencials; (3) <strong>amenaça de substitutius</strong>; (4) <strong>poder de negociació dels proveïdors</strong>; (5) <strong>poder de negociació dels clients</strong>. L'atractiu del sector disminueix amb la intensitat d'aquestes forces.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Anàlisi interna: cadena de valor (Porter, 1985)" color="violet">
                        <p>La <strong>cadena de valor</strong> descompon l'empresa en <strong>activitats primàries</strong> (logística d'entrada, operacions, logística de sortida, màrqueting i vendes, servei postvenda) i <strong>activitats de suport</strong> (infraestructura, RR.HH., I+D, aprovisionament). Cada activitat pot ser font d'avantatge competitiu.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.4. Diagnòstic DAFO (SWOT)" color="amber">
                        <p>La matriu <strong>DAFO</strong> (Debilitats, Amenaces, Fortaleses, Oportunitats), desenvolupada per <strong>Albert Humphrey</strong> a la Stanford Research Institute els anys 60, sintetitza en quatre quadrants l'anàlisi interna (F+D) i externa (O+A). Variants posteriors: <em>CAME</em> (Corregir, Afrontar, Mantenir, Explotar) com a pla d'acció derivat del DAFO.</p>
                    </TheoryBlock>

                <Card title="5. El control: concepte, fases i tècniques" icon="📊">
                    <TheoryBlock title="5.1. Concepte i funcions del control" color="indigo">
                        <p>El <strong>control</strong> és el procés de <strong>verificació i correcció</strong> mitjançant el qual l'empresa s'assegura que l'execució real s'ajusta als plans. Tanca el cicle directiu: sense control, la planificació és mera declaració d'intencions. <strong>Fayol</strong> (1916) ja incloïa el control com a una de les 5 funcions administratives; <strong>Drucker</strong> (1954) va desenvolupar-lo amb la <em>Dirección per Objectius</em> (DPO) o <em>Management by Objectives</em> (MBO).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Tipus de control" color="violet">
                        <p><strong>Segons el moment</strong>:</p>
                        <p><strong>• Preventiu</strong> (<em>feed-forward</em>): abans de l'execució; exemple, auditoria d'inversió abans d'autoritzar-la.</p>
                        <p><strong>• Concurrent</strong> (<em>in-process</em>): durant l'execució; exemple, supervisió en línia de producció.</p>
                        <p><strong>• Correctiu</strong> (<em>feedback</em>): després de l'execució; exemple, anàlisi de desviacions pressupostàries.</p>
                        <p><strong>Segons l'àmbit</strong>: control estratègic (revisa la missió i estratègia), de gestió (assegura eficiència operativa) i operatiu (tasques concretes).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Etapes del control" color="blue">
                        <p>El procés de control s'estructura en 4 etapes seqüencials: <strong>(1) establir estàndards</strong> (quantitatius, qualitatius, de temps, de cost); <strong>(2) mesurar el rendiment real</strong>; <strong>(3) comparar</strong> resultats amb estàndards i identificar desviacions significatives; <strong>(4) aplicar accions correctives</strong>, si escau, alimentant el cicle de planificació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.4. Tècniques de control" color="emerald">
                        <p><strong>• Pressupostos</strong>: planificació quantitativa d'ingressos i despeses. Anàlisi de desviacions (quantitat, preu, mix).</p>
                        <p><strong>• Comptabilitat analítica</strong>: càlcul i control de costos per departament, producte o centre de responsabilitat.</p>
                        <p><strong>• Ràtios financers</strong> (Tema 68): liquiditat, solvència, rendibilitat, endeutament.</p>
                        <p><strong>• Auditoria</strong> interna i externa.</p>
                        <p><strong>• <em>Benchmarking</em></strong>: comparació amb empreses excel·lents del sector (introduït per <em>Xerox</em> els anys 80).</p>
                        <p><strong>• Quadre de comandament integral (<em>Balanced Scorecard</em>, Kaplan i Norton, 1992)</strong>: quatre perspectives equilibrades —financera, client, processos interns, aprenentatge i creixement.</p>
                        <p><strong>• OKR</strong> (<em>Objectives and Key Results</em>): metodologia de John Doerr / Andy Grove a <em>Intel</em>, adoptada per <em>Google</em>, amb objectius ambiciosos i resultats mesurables trimestrals.</p>
                    </TheoryBlock>

                <Card title="6. Sistemes integrats de planificació i control" icon="🔗">
                    <TheoryBlock title="6.1. La DPO / MBO de Drucker (1954)" color="indigo">
                        <p>La <strong>Dirección per Objectius</strong> (DPO o MBO), formulada per <strong>Peter Drucker</strong> en <em>The Practice of Management</em> (1954), integra planificació i control articulant l'organització al voltant d'objectius consensuats entre superior i subordinat. Les seues etapes són: (1) definició d'objectius organitzatius; (2) desplegament en cascada a cada unitat i persona; (3) seguiment periòdic; (4) avaluació del rendiment; (5) retroalimentació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="6.2. El Balanced Scorecard (Kaplan i Norton, 1992)" color="violet">
                        <p>El <strong>Quadre de Comandament Integral</strong> transcendeix l'exclusivitat d'indicadors financers i equilibra quatre perspectives: (1) <strong>financera</strong> (ROE, ROI, EBITDA); (2) <strong>client</strong> (satisfacció, quota, NPS); (3) <strong>processos interns</strong> (temps de cicle, qualitat, innovació); (4) <strong>aprenentatge i creixement</strong> (formació, clima laboral, retenció del talent). Tradueix la visió estratègica en objectius operatius mesurables.</p>
                    </TheoryBlock>

                    <TheoryBlock title="6.3. Sistemes ERP i digitalització" color="cyan">
                        <p>Els <strong>sistemes ERP</strong> (Enterprise Resource Planning) —<em>SAP</em>, <em>Oracle</em>, <em>Microsoft Dynamics</em>— integren en una única plataforma la planificació i el control de totes les àrees funcionals, amb informació en temps real i quadres de comandament automatitzats. La digitalització impulsada per <em>Kit Digital</em> (Pla PRTR Espanya, 2021-2026) està accelerant la incorporació d'aquestes eines a les PIMES espanyoles.</p>
                    </TheoryBlock>
                </Card>

                        <p>La planificació, iniciada formalment amb <strong>Fayol (1916)</strong> i consolidada per <strong>Steiner (1979)</strong>, és la funció directiva que decideix avui què volem que passe demà. El procés en 7 etapes (Koontz i O'Donnell) articula un diagnòstic rigorós (PESTEL, 5 forces de Porter, cadena de valor, DAFO), una formulació d'objectius SMART (Doran, 1981), una selecció d'estratègies (Porter, 1980) i un desplegament en plans funcionals.</p>
                        <p>El control, quarta funció administrativa clàssica, tanca el cicle amb estàndards, mesurament, comparació i correcció. Tècniques com els pressupostos, el <em>benchmarking</em>, el Balanced Scorecard (Kaplan i Norton, 1992) i els OKR (Grove, Doerr) permeten integrar planificació i control en sistemes coherents. La crítica de <strong>Mintzberg (1994)</strong> a la planificació formal ha conduït a models híbrids —estratègies deliberades + emergents, <em>scenario planning</em>, agilitat iterativa— que reconeixen els entorns VUCA i la necessitat d'adaptació contínua. En la pràctica docent, l'alumnat pot treballar la DAFO sobre empreses reals, els OKR en projectes de classe o el BSC com a síntesi visual de l'empresa com a sistema.</p>

                        <p>L'empresa moderna és, alhora, una <strong>organització</strong> (conjunt humà estructurat per assolir uns fins) i una <strong>institució</strong> (realitat social amb valors, normes i pautes pròpies). Comprendre la seua naturalesa requereix recórrer l'evolució del pensament organitzatiu des dels pioners del <em>scientific management</em> a principis del segle XX fins a les teories contractuals més recents, passant per l'humanisme de Mayo i el pragmatisme de la contingència.</p>

                        <p>Més enllà de l'organització formal, l'empresa és una <strong>institució</strong> social: vehicula valors, regula conductes, genera identitats i contribueix al teixit social. <strong>Philip Selznick</strong> (<em>Leadership in Administration</em>, 1957) va subratllar que «institucionalitzar és infundre valor més enllà de les exigències tècniques de la tasca». L'<strong>economia institucional</strong> (Veblen, Commons, North — Nobel 1993) estudia les institucions com a conjunt de regles formals i informals que estructuren l'activitat econòmica.</p>
                        <p>En el cas espanyol, empreses com <em>Inditex</em>, <em>Mercadona</em> o la <em>ONCE</em> són autèntiques institucions socials amb identitat, valors i influència que superen el seu paper econòmic estricte.</p>

                <Card title="2. Escola clàssica: Taylor, Fayol i Weber" icon="⚙️">
                    <TheoryBlock title="2.1. Frederick W. Taylor (1856-1915): la direcció científica" color="rose">
                        <p><strong>Taylor</strong>, enginyer nord-americà, va publicar el 1911 <em>The Principles of Scientific Management</em>, obra fundacional del <em>management</em> modern. La seua proposta parteix de la constatació que la producció industrial pateix «<em>soldiering</em>» (reducció deliberada del ritme per part dels treballadors) i proposa substituir la intuïció per la <strong>ciència</strong>: estudiar cada tasca amb cronòmetre, descompondre-la en moviments elementals (<em>time-and-motion study</em>), seleccionar científicament el treballador idoni i pagar per rendiment (remuneració per peces).</p>
                        <p>Els seus <strong>4 principis</strong>: (1) substituir la improvisació per l'estudi científic del treball; (2) seleccionar i formar científicament els treballadors; (3) cooperar entre direcció i treballadors; (4) separar rigorosament concepció (direcció) i execució (obrers). <em>Henry Ford</em>, adaptant Taylor amb la cadena de muntatge mòbil (Detroit, 1913), va democratitzar el cotxe i va marcar el segle XX amb el <em>fordisme</em>.</p>
                        <p><strong>Crítica</strong>: l'alienació del treballador reduït a apèndix de la màquina (Chaplin, <em>Temps Moderns</em>, 1936); la despersonalització; l'absència de motivació intrínseca. Les seues intuïcions, tanmateix, continuen vives en el <em>lean manufacturing</em> i en l'estandardització d'operacions.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Henri Fayol (1841-1925): la teoria administrativa" color="indigo">
                        <p><strong>Fayol</strong>, enginyer de mines francés i director d'una gran empresa carbonífera, va publicar el 1916 <em>Administration Industrielle et Générale</em>. Si Taylor mirava la fàbrica des del taller, Fayol la mira des del despatx: proposa una teoria general de l'administració aplicable a tota organització.</p>
                        <p>Va identificar <strong>6 funcions empresarials</strong> (tècnica, comercial, financera, de seguretat, comptable i administrativa), essent l'administrativa la més important en els nivells superiors. Les <strong>5 funcions administratives</strong> són: <em>preveure</em>, <em>organitzar</em>, <em>dirigir</em>, <em>coordinar</em> i <em>controlar</em> (POCCC). També va formular <strong>14 principis administratius</strong>: divisió del treball, autoritat-responsabilitat, disciplina, unitat de comandament, unitat de direcció, subordinació de l'interès individual al general, remuneració, centralització, jerarquia, ordre, equitat, estabilitat del personal, iniciativa, unió del personal.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Max Weber (1864-1920): la burocràcia" color="slate">
                        <p><strong>Max Weber</strong>, sociòleg alemany, va estudiar l'empresa com a part de la racionalització creixent d'Occident. En <em>Economia i societat</em> (pòstum, 1922) va formular el <strong>tipus ideal de burocràcia</strong>, organització racional-legal caracteritzada per: (1) divisió del treball amb competències definides; (2) jerarquia d'autoritat clara; (3) normes escrites i procediments formals; (4) impersonalitat (no favoritismes); (5) professionalitat dels funcionaris; (6) registre documental exhaustiu.</p>
                        <p>La burocràcia, per a Weber, és la forma organitzativa més eficient tècnicament, però també la «gàbia d'acer» que amenaça la llibertat individual. La seua crítica anticipa les patologies burocràtiques (formalisme, rigidesa, desplaçament de fins per mitjans) que <em>Merton</em> sistematitzarà més tard (1949).</p>
                    </TheoryBlock>

                <Card title="3. Escola de relacions humanes" icon="🤝">
                    <TheoryBlock title="3.1. Elton Mayo (1880-1949) i els experiments de Hawthorne" color="emerald">
                        <p>Entre 1924 i 1932, l'equip d'<strong>Elton Mayo</strong> a Harvard va realitzar a la planta de <em>Hawthorne</em> (Western Electric, Chicago) una sèrie d'experiments que havien de mesurar l'efecte de la il·luminació sobre la productivitat. Els resultats van ser sorprenents: la productivitat millorava <strong>independentment</strong> dels canvis objectius en il·luminació, pauses o horaris. La simple atenció rebuda (<strong>efecte Hawthorne</strong>) elevava el rendiment.</p>
                        <p>Aquesta troballa va capgirar la concepció tayloriana del treballador com a <em>homo economicus</em>. Les conclusions de Mayo i <strong>Fritz Roethlisberger</strong> (<em>Management and the Worker</em>, 1939) són: (a) la motivació no és només econòmica, sinó social; (b) els grups informals condicionen la conducta individual; (c) el lideratge i la comunicació afecten el rendiment; (d) la satisfacció laboral està vinculada a necessitats psicosocials.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Aportacions complementàries" color="violet">
                        <p><strong>Mary Parker Follett</strong> (1868-1933), pionera precoç del pensament organitzatiu humanista, va defensar la gestió participativa, la integració de conflictes i el poder «amb» (no «sobre») els treballadors.</p>
                        <p><strong>Chester Barnard</strong> (1938) va integrar ciència administrativa i comportament humà: l'autoritat no prové del càrrec sinó de l'acceptació del subordinat («teoria de l'acceptació»).</p>
                        <p><strong>Abraham Maslow</strong> (1943), amb la <em>piràmide de necessitats</em> (Tema 64), i <strong>Douglas McGregor</strong> (1960), amb les teories <em>X</em> i <em>Y</em>, van consolidar la visió humanista. La teoria <em>X</em> (pessimista, assimilable al taylorisme) considera el treballador com a peresós; la <em>Y</em> (optimista) com a creatiu i proactiu si se'l motiva adequadament.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Enfocaments posteriors" icon="📚">
                    <TheoryBlock title="4.1. Enfocament quantitatiu / Investigació Operativa" color="cyan">
                        <p>Nascut durant la II Guerra Mundial, aplica tècniques matemàtiques (programació lineal, teoria de cues, simulació, PERT/CPM) a problemes de direcció. Lligat a noms com <strong>George Dantzig</strong> (algorisme simplex, 1947) i <strong>Kantoróvich</strong> (Nobel 1975).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Enfocament conductual i Simon" color="indigo">
                        <p><strong>Herbert Simon</strong> (<em>Administrative Behavior</em>, 1947) i <strong>James March</strong> van fundar l'anàlisi del comportament organitzatiu: racionalitat limitada (Tema 57), teoria de l'acceptació de l'autoritat, organització com a xarxa de decisions.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Enfocament sistèmic" color="blue">
                        <p><strong>Bertalanffy</strong> (1968) i <strong>Katz i Kahn</strong> (<em>The Social Psychology of Organizations</em>, 1966) conceben l'empresa com a sistema obert amb <em>inputs</em>, transformació, <em>outputs</em> i retroalimentació. L'enfocament sistèmic supera la dicotomia clàssica / humana integrant ambdós vessants.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Teoria de la contingència" icon="🌐">
                    <TheoryBlock title="5.1. «It depends» — no hi ha una forma òptima universal" color="amber">
                        <p>Els estudis de <strong>Joan Woodward</strong> (1965) a 100 empreses britàniques, de <strong>Burns i Stalker</strong> (<em>The Management of Innovation</em>, 1961) i de <strong>Lawrence i Lorsch</strong> (<em>Organization and Environment</em>, 1967) van demostrar que <strong>no existeix una estructura universalment òptima</strong>: la millor organització depèn de les <em>contingències</em> (variables de l'entorn i interiors). Burns i Stalker van distingir entre organitzacions <strong>mecanicistes</strong> (adequades a entorns estables) i <strong>orgàniques</strong> (adequades a entorns dinàmics).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Variables contingents" color="rose">
                        <p><strong>• Entorn</strong> (estable vs. turbulent).</p>
                        <p><strong>• Tecnologia</strong> (unitari, massiu, continu — Woodward).</p>
                        <p><strong>• Mida</strong> (petita, mitjana, gran empresa).</p>
                        <p><strong>• Estratègia</strong> (Chandler, 1962: «structure follows strategy»).</p>
                        <p><strong>• Cultura</strong> (Hofstede, 1980, Tema 62).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. La teoria Z (Ouchi, 1981)" color="green">
                        <p><strong>William Ouchi</strong>, en <em>Theory Z</em> (1981), va estudiar el «miracle japonés» i va sintetitzar un model combinant elements occidentals (teoria Y de McGregor) amb els japonesos: ocupació de llarga durada, decisió consensuada, responsabilitat col·lectiva, carreres no especialitzades, control implícit, holisme. El model ha influït en pràctiques com el <em>kaizen</em> i el <em>lean management</em> aplicats a Occident (Tema 62).</p>
                    </TheoryBlock>
                </Card>

                <Card title="6. Teoria contractual / Nova Economia Institucional" icon="📝">
                    <TheoryBlock title="6.1. Coase (1937) i la naturalesa de l'empresa" color="indigo">
                        <p><strong>Ronald Coase</strong> (Nobel 1991), a «The Nature of the Firm» (<em>Economica</em>, 1937), va plantejar una pregunta fonamental: si el mercat assigna eficientment els recursos, <strong>per què existeixen les empreses</strong>? La seua resposta: l'empresa sorgeix quan els <strong>costos de transacció</strong> del mercat (buscar, negociar, contractar, vigilar) superen els costos d'organitzar internament. L'empresa és, doncs, una resposta eficient als costos de transacció.</p>
                    </TheoryBlock>

                    <TheoryBlock title="6.2. Williamson (1985): costos de transacció" color="violet">
                        <p><strong>Oliver Williamson</strong> (Nobel 2009), a <em>The Economic Institutions of Capitalism</em> (1985), va desenvolupar la teoria. Els costos de transacció depenen de: <em>especificitat dels actius</em>, <em>incertesa</em> i <em>freqüència</em> de les operacions. A major especificitat i incertesa, major tendència a <strong>internalitzar</strong> (integrar verticalment) i menor dependència del mercat.</p>
                    </TheoryBlock>

                    <TheoryBlock title="6.3. Teoria de l'agència (Jensen i Meckling, 1976)" color="rose">
                        <p>L'empresa es concep com un <strong>«feix de contractes»</strong> (<em>nexus of contracts</em>) entre principals (propietaris) i agents (directius, treballadors). Els <strong>problemes d'agència</strong> (asimetria d'informació, risc moral, selecció adversa) generen <strong>costos d'agència</strong>: monitoratge, <em>bonding</em> i pèrdua residual. El govern corporatiu (Tema 65) pretén alinear els interessos de principals i agents.</p>
                    </TheoryBlock>

                    <FormulaBox formula="Empresa = f(costos transacció mercat − costos organitzatius interns)" desc="Principi de Coase (1937): quan CTᴹ > CTᴼ, internalitzar" />
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>L'evolució del pensament organitzatiu —de Taylor a Williamson, un segle de teoria— no és una seqüència lineal de paradigmes que se superen, sinó una <strong>sedimentació</strong>: cada escola ha aportat visions que continuen vives. <strong>Taylor</strong> sobreviu en l'estandardització <em>lean</em>; <strong>Fayol</strong> en el cicle PODC; <strong>Weber</strong> en les burocràcies públiques i privades; <strong>Mayo</strong> en la gestió de persones; la <strong>contingència</strong> (Burns-Stalker, Lawrence-Lorsch) en el disseny organitzatiu adaptatiu; la <strong>teoria contractual</strong> (Coase, Williamson, Jensen-Meckling) en el govern corporatiu.</p>
                        <p>Comprendre aquesta genealogia és indispensable per al docent: permet desarmar lectures ingènues («Taylor és pura explotació») o anacròniques («tot es resol amb <em>teambuilding</em>»), i ofereix un marc per analitzar empreses reals. El <em>Toyota Production System</em>, per exemple, combina precisió tayloriana, respecte humanista, adaptabilitat contingent i integració contractual amb proveïdors, en una síntesi que encara inspira la manufactura global.</p>
                    </div>

                        <p>Tota organització, per reduïda que siga, s'estructura. Des del moment en què dues persones han de col·laborar per assolir un objectiu comú, emergeix el problema de <strong>dividir</strong> el treball i <strong>coordinar</strong>-lo. Aquesta doble exigència —divisió i coordinació— és l'essència de l'<strong>estructura organitzativa</strong>. Però al costat de l'estructura formal, dissenyada conscientment, sempre floreix una <strong>estructura informal</strong> de xarxes, grups i relacions que pot reforçar-la o minar-la.</p>
                        <p>Com va demostrar <strong>Alfred Chandler</strong> (<em>Strategy and Structure</em>, 1962) a partir de casos com <em>DuPont</em>, <em>General Motors</em> o <em>Sears</em>, l'estructura segueix l'estratègia (<em>«structure follows strategy»</em>): canvis en l'entorn i en l'estratègia empresarial forcen adaptacions estructurals. Les empreses espanyoles contemporànies il·lustren bé aquesta dinàmica: la reorganització d'<em>Iberdrola</em> en divisions per països (2015-2020), el gir matricial de <em>Telefónica</em> o la creació de <em>Inditex-tech</em> (2023) com a branca tecnològica independent.</p>

                        <p>L'<strong>estructura organitzativa</strong> és la <strong>configuració formal de relacions entre òrgans i persones d'una empresa</strong>, que defineix la divisió del treball, la jerarquia, els canals de comunicació i els mecanismes de coordinació. Segons <strong>Henry Mintzberg</strong> (<em>The Structuring of Organizations</em>, 1979), l'estructura és «la suma total de les formes en què l'organització divideix el treball i aconsegueix la coordinació entre les seues tasques».</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Principis de disseny organitzatiu" color="violet">
                        <p>Des de Fayol (Tema 59), la literatura ha identificat principis clàssics: <strong>divisió del treball</strong>, <strong>autoritat-responsabilitat</strong>, <strong>unitat de comandament</strong>, <strong>unitat de direcció</strong>, <strong>cadena escalar</strong>, <strong>angle de control</strong> (<em>span of control</em>: nombre de subordinats per superior), <strong>delegació</strong>, <strong>centralització/descentralització</strong>, <strong>departamentalització</strong> i <strong>coordinació</strong>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Elements estructurals (Mintzberg, 1979)" color="cyan">
                        <p>Mintzberg va identificar <strong>cinc parts bàsiques</strong> de tota organització:</p>
                        <p>1. <strong>Nucli d'operacions</strong>: treballadors que produeixen béns/serveis (obrers, venedors).</p>
                        <p>2. <strong>Àpex estratègic</strong>: alta direcció (CEO, consell d'administració).</p>
                        <p>3. <strong>Línia intermèdia</strong>: mànagers que connecten àpex i nucli.</p>
                        <p>4. <strong>Tecnoestructura</strong>: analistes que estandarditzen el treball (I+D, control de qualitat).</p>
                        <p>5. <strong>Staff de suport</strong>: unitats de suport (cafeteria, jurídic, relacions públiques).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Altres formes contemporànies" color="amber">
                        <p><strong>• Estructura per projectes</strong>: temporal, orientada a un projecte específic (construcció, aeroespacial).</p>
                        <p><strong>• Estructura en xarxa</strong> (<em>network organization</em>): nucli central + xarxa d'aliances externes (<em>Nike</em> subcontracta producció).</p>
                        <p><strong>• Organitzacions virtuals</strong>: equips geogràficament dispersos, coordinats per TIC (<em>Automattic</em>, empresa de WordPress amb 1.900+ treballadors 100 % remot).</p>
                        <p><strong>• Holacràcia</strong> (Robertson, 2007): cercles auto-organitzats sense jerarquia tradicional (<em>Zappos</em>, 2014).</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Les cinc configuracions de Mintzberg (1979)" icon="🎨">
                    <TheoryBlock title="Sinopsi de les configuracions estructurals" color="indigo">
                        <p><strong>1. Estructura simple</strong>: petita empresa, àpex estratègic centralitzat, supervisió directa. Entorn dinàmic. Exemple: startup inicial.</p>
                        <p><strong>2. Burocràcia maquinal</strong>: grans empreses industrials, tecnoestructura potent, estandardització de processos. Entorn estable. Exemple: fàbrica d'automòbils tradicional.</p>
                        <p><strong>3. Burocràcia professional</strong>: predomina el nucli d'operacions amb alta qualificació, estandardització d'habilitats. Exemple: hospitals, universitats, bufets d'advocats.</p>
                        <p><strong>4. Estructura divisional</strong>: múltiples divisions autònomes, línia intermèdia potent, estandardització d'outputs. Exemple: multinacionals diversificades (<em>Unilever</em>, <em>Siemens</em>).</p>
                        <p><strong>5. Adhocràcia</strong>: equips multidisciplinaris per a innovació, adaptació mútua, staff de suport potent. Exemple: estudis de Pixar, agències de publicitat, laboratoris I+D.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. L'estructura informal i la dinàmica de grups" icon="🔗">
                    <TheoryBlock title="4.1. L'organització informal" color="emerald">
                        <p>Al costat de l'organigrama existeix una <strong>xarxa informal</strong> de relacions no previstes. Barnard (1938) i els estudis de Hawthorne (Tema 59) ja la van identificar. Es materialitza en: (a) grups d'amistat; (b) xarxes d'informació (<em>grapevine</em>); (c) líders informals (persones influents sense càrrec); (d) normes no escrites; (e) canals alternatius de comunicació.</p>
                        <p>La relació entre formal i informal pot ser <strong>complementària</strong> (xarxa informal reforça la coordinació) o <strong>conflictiva</strong> (contra-cultura que sabotea). L'anàlisi de xarxes socials (ARS) mitjançant <em>sociogrames</em> (Moreno, 1934) permet mapejar-la.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Dinàmica de grups" color="violet">
                        <p><strong>Kurt Lewin</strong> (1947) va fundar la <em>dinàmica de grups</em>. Identifica forces impulsores i restrictives. <strong>Bruce Tuckman</strong> (1965) va formular les 5 fases de desenvolupament d'un equip: <strong>forming</strong> (formació), <strong>storming</strong> (confrontació), <strong>norming</strong> (normalització), <strong>performing</strong> (execució), <strong>adjourning</strong> (dissolució, afegida el 1977).</p>
                        <p>Patologies de grup: <strong>groupthink</strong> (Janis, 1972), <strong>polarització</strong>, <strong>social loafing</strong> (gandulisme social, Ringelmann, 1913).</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Conflicte, canvi i desenvolupament organitzatiu" icon="⚡">
                    <TheoryBlock title="5.1. El conflicte organitzatiu" color="rose">
                        <p>El conflicte és <strong>inherent</strong> a tota organització. La perspectiva clàssica el considerava disfuncional; la moderna (Robbins, 1991) distingeix conflicte <strong>funcional</strong> (estimulant, constructiu) i <strong>disfuncional</strong> (destructiu). Fonts: escassetat de recursos, ambigüitat de rols, interdependència, diferències d'objectius.</p>
                        <p>Estratègies de gestió (Thomas-Kilmann, 1974): competir, col·laborar, comprometre's, evitar, acomodar. Variables: assertivitat vs. cooperació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Canvi organitzatiu (Lewin, 1947)" color="cyan">
                        <p>El model clàssic de <strong>Kurt Lewin</strong> té 3 fases: <strong>descongelar</strong> (obrir-se al canvi), <strong>canviar</strong> (implementar) i <strong>recongelar</strong> (consolidar). <strong>Kotter</strong> (1996), en <em>Leading Change</em>, proposa 8 passos: crear urgència, formar coalició guia, visió, comunicar, empoderar, guanys a curt, consolidar, ancorar en la cultura.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Desenvolupament organitzatiu (DO)" color="indigo">
                        <p>El <strong>Desenvolupament Organitzatiu</strong> (<em>Organizational Development</em>) és un camp aplicat que utilitza ciències del comportament per millorar l'eficàcia i la salut organitzatives. Tècniques: <em>team building</em>, <em>survey feedback</em>, intervencions estructurals, <em>coaching</em> directiu. Autors de referència: <strong>French i Bell</strong> (1973), <strong>Argyris</strong> (aprenentatge organitzatiu), <strong>Senge</strong> (<em>The Fifth Discipline</em>, 1990).</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>L'estructura organitzativa és la resposta al doble repte de <strong>dividir</strong> el treball i <strong>coordinar</strong>-lo. La síntesi de <strong>Mintzberg (1979)</strong> —5 parts bàsiques, 6 mecanismes de coordinació, 5 configuracions— continua sent el marc d'anàlisi més potent i versàtil. Els quatre tipus clàssics (lineal, funcional, divisional, matricial) i les formes contemporànies (xarxa, virtual, holàcràtica) reflecteixen l'adaptació a estratègies i entorns canviants, confirmant el dictum de Chandler (1962).</p>
                        <p>Tota estructura formal conviu amb una <strong>xarxa informal</strong> que pot reforçar-la o contradir-la; la dinàmica de grups (Lewin, Tuckman) ofereix eines per comprendre-la. El conflicte, lluny de ser un mal, pot ser motor de canvi quan es gestiona adequadament, i els models de gestió del canvi (Lewin, Kotter) són indispensables per a qualsevol transformació organitzativa contemporània (digitalització, sostenibilitat, diversitat).</p>
                    </div>
                </Card>
