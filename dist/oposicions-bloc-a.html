nvolupament (AOD)",color:"green"},React.createElement("p",null,"L'",React.createElement("strong",null,"Ajuda Oficial al Desenvolupament (AOD)")," comprén els fluxos financers dels governs dels països desenvolupats cap als països en desenvolupament, amb l'objectiu de promoure el desenvolupament econòmic i social. L'ONU va fixar com a objectiu que els països desenvolupats destinaren el ",React.createElement("strong",null,"0,7 % de la seua RNB")," a AOD, però sols uns pocs (Suècia, Noruega, Luxemburg, Dinamarca, Alemanya) aconsegueixen esta xifra; Espanya se situa al voltant del 0,2-0,3 %."),React.createElement("p",null,"L'eficàcia de l'ajuda és objecte d'un intens debat. ",React.createElement("strong",null,"Jeffrey Sachs"),' defén que una ajuda massiva i ben dirigida pot trencar el parany de la pobresa (el "Big Push"). ',React.createElement("strong",null,"William Easterly")," (",React.createElement("em",null,"The White Man's Burden"),", 2006) argumenta que l'ajuda sol ser ineficaç perquè no té en compte les realitats locals, genera dependència, alimenta la corrupció i substitueix la iniciativa local. ",React.createElement("strong",null,"Dambisa Moyo")," (",React.createElement("em",null,"Dead Aid"),", 2009) va més lluny en afirmar que l'ajuda ha sigut contraproduent per a Àfrica.")),React.createElement(TheoryBlock,{title:"6.4. Microcrèdits i els ODS",color:"amber"},React.createElement("p",null,"Els ",React.createElement("strong",null,"microcrèdits")," —xicotets préstecs concedits a persones pobres que no tenen accés al sistema bancari convencional— van ser popularitzats per ",React.createElement("strong",null,"Muhammad Yunus")," i el ",React.createElement("strong",null,"Grameen Bank")," (Bangla Desh), fundat en 1983. Yunus va rebre el Premi Nobel de la Pau en 2006. Els microcrèdits permeten als més pobres iniciar xicotetes activitats econòmiques (un lloc de venda, una màquina de cosir, bestiar), generar ingressos i millorar les seues condicions de vida. No obstant això, el seu impacte a gran escala ha sigut qüestionat per alguns estudis que assenyalen taxes d'interés elevades i un impacte limitat en la reducció de la pobresa agregada."),React.createElement("p",null,"Els ",React.createElement("strong",null,"Objectius de Desenvolupament Sostenible (ODS)"),", adoptats per l'Assemblea General de l'ONU en 2015 com a part de l'",React.createElement("strong",null,"Agenda 2030"),", constitueixen el marc de referència actual per a les polítiques de desenvolupament. Els 17 ODS aborden els principals desafiaments globals: ",React.createElement("strong",null,"ODS 1")," (fi de la pobresa), ",React.createElement("strong",null,"ODS 2")," (fam zero), ",React.createElement("strong",null,"ODS 3")," (salut i benestar), ",React.createElement("strong",null,"ODS 4")," (educació de qualitat), ",React.createElement("strong",null,"ODS 8")," (treball decent i creixement econòmic), ",React.createElement("strong",null,"ODS 10")," (reducció de les desigualtats), entre altres.")),React.createElement(TheoryBlock,{title:"6.5. Consens de Washington vs. Post-Consens",color:"violet"},React.createElement("p",null,"El ",React.createElement("strong",null,"Consens de Washington")," (terme encunyat per John Williamson en 1989) designa el conjunt de polítiques econòmiques recomanades pel FMI i el Banc Mundial als països en desenvolupament en els anys 80 i 90: disciplina fiscal, liberalització comercial, privatització d'empreses públiques, desregulació, obertura a la inversió estrangera i protecció de la propietat privada. Estes polítiques, d'orientació neoliberal, van ser criticades per ",React.createElement("strong",null,"Joseph Stiglitz")," (Premi Nobel 2001) i altres economistes per la seua rigidesa, la seua insensibilitat a les condicions locals i els seus efectes negatius sobre la desigualtat i els serveis públics."),React.createElement("p",null,"El ",React.createElement("strong",null,"Post-Consens de Washington")," (Stiglitz, 1998) i els enfocaments més recents emfatitzen la importància de les ",React.createElement("strong",null,"institucions"),", la ",React.createElement("strong",null,"inversió en capital humà"),", la ",React.createElement("strong",null,"protecció social"),", la ",React.createElement("strong",null,"lluita contra la desigualtat")," i la ",React.createElement("strong",null,"sostenibilitat ambiental")," com a complements necessaris de l'estabilitat macroeconòmica i l'obertura comercial."))),React.createElement(Card,{title:"7. El debat creixement vs. sostenibilitat",icon:"🌿"},React.createElement(TheoryBlock,{title:"7.1. Els límits del creixement",color:"green"},React.createElement("p",null,"L'informe ",React.createElement("em",null,"Els límits del creixement")," (",React.createElement("strong",null,"Club de Roma"),", 1972), elaborat per ",React.createElement("strong",null,"Donella i Dennis Meadows")," i un equip del MIT, va utilitzar models informàtics per a simular la interacció entre creixement econòmic, creixement demogràfic, producció d'aliments, industrialització i contaminació. La seua conclusió va ser alarmant: si les tendències de creixement exponencial continuaven sense canvis, els límits del planeta s'aconseguirien en algun moment del segle XXI, provocant un col·lapse econòmic i demogràfic."),React.createElement("p",null,"Encara que les prediccions més catastrofistes no s'han complit (el progrés tecnològic, l'eficiència energètica i la transició demogràfica han atenuat els escenaris més pessimistes), el missatge fonamental de l'informe conserva plena vigència: un creixement material exponencial i il·limitat és ",React.createElement("strong",null,"físicament impossible")," en un planeta amb recursos finits i capacitat limitada d'absorció de residus.")),React.createElement(TheoryBlock,{title:"7.2. Decreixement i economia ecològica",color:"emerald"},React.createElement("p",null,"El moviment del ",React.createElement("strong",null,"decreixement")," (décroissance), liderat per pensadors com ",React.createElement("strong",null,"Serge Latouche")," i amb arrels en l'obra de ",React.createElement("strong",null,"Nicholas Georgescu-Roegen")," (",React.createElement("em",null,"The Entropy Law and the Economic Process"),", 1971), proposa una reducció planificada i democràtica de la producció i el consum material en els països rics, per a reduir la petjada ecològica a nivells compatibles amb els límits planetaris. El decreixement no significa recessió (una contracció involuntària i desordenada), sinó una ",React.createElement("strong",null,"reorganització conscient")," de l'economia cap a la suficiència, la qualitat de vida, l'equitat i la sostenibilitat."),React.createElement("p",null,React.createElement("strong",null,"Herman Daly"),", un dels fundadors de l'",React.createElement("strong",null,"economia ecològica"),", proposa el concepte d'",React.createElement("strong",null,"economia d'estat estacionari")," (",React.createElement("em",null,"steady-state economy"),"): una economia que manté un nivell de producció i consum constant (compatible amb la capacitat de regeneració dels ecosistemes) però que continua millorant qualitativament (millor tecnologia, millor distribució, major benestar). La clau no és ",React.createElement("em",null,"més"),", sinó ",React.createElement("em",null,"millor"),".")),React.createElement(TheoryBlock,{title:"7.3. L'economia dònut i el creixement verd",color:"amber"},React.createElement("p",null,React.createElement("strong",null,"Kate Raworth")," (",React.createElement("em",null,"Economía rosquilla"),", 2017) proposa un model visual poderós: la humanitat ha d'operar dins d'un espai segur i just delimitat per dos fronteres. El ",React.createElement("strong",null,"sòl social")," (la rosquilla interior) representa les necessitats bàsiques que han de satisfer-se per a tots (alimentació, salut, educació, habitatge, igualtat, participació política, etc., basades en els ODS). El ",React.createElement("strong",null,"sostre ecològic")," (la rosquilla exterior) representa els límits planetaris que no han de sobrepassar-se (canvi climàtic, acidificació oceànica, pèrdua de biodiversitat, ús del sòl, etc., basats en el marc de Johan Rockström). L'objectiu del desenvolupament no és el creixement indefinit del PIB, sinó ",React.createElement("strong",null,"operar dins de la rosquilla"),": satisfer les necessitats de tots sense sobrepassar els límits del planeta."),React.createElement("p",null,"El concepte de ",React.createElement("strong",null,"creixement verd")," i d'",React.createElement("strong",null,"economia circular")," busca compatibilitzar el creixement econòmic amb la sostenibilitat ambiental: produir més amb menys recursos, reduir residus, reciclar, reutilitzar i dissenyar productes per a la durabilitat i la reparabilitat. La UE ha adoptat el ",React.createElement("strong",null,"Pacte Verd Europeu")," (2019) amb l'objectiu d'aconseguir la neutralitat climàtica en 2050.")),React.createElement(TheoryBlock,{title:"7.4. Aplicació docent i curricular",color:"blue"},React.createElement("p",null,"Els continguts d'este tema es connecten directament amb els ",React.createElement("strong",null,"ODS"),", especialment: ",React.createElement("strong",null,"ODS 1")," (fi de la pobresa), ",React.createElement("strong",null,"ODS 8")," (treball decent i creixement econòmic), ",React.createElement("strong",null,"ODS 10")," (reducció de les desigualtats), ",React.createElement("strong",null,"ODS 12")," (producció i consum responsables) i ",React.createElement("strong",null,"ODS 13")," (acció pel clima). La LOMLOE inclou explícitament el desenvolupament sostenible com a eix transversal del currículum."),React.createElement("p",null,React.createElement("strong",null,"Activitats proposades:")," (1) Comparar el PIB per càpita i l'IDH de diversos països (dades del Banc Mundial i PNUD) i analitzar les discrepàncies. (2) Calcular la taxa de creixement del PIB real d'Espanya en els últims 20 anys i identificar les fases del cicle econòmic. (3) Debat: és possible un creixement econòmic il·limitat en un planeta finit? Arguments del creixement verd vs. decreixement. (4) Estudi de cas: els \"tigres asiàtics\" com a model de desenvolupament. (5) Anàlisi del cercle viciós de la pobresa de Nurkse amb un diagrama. (6) Reflexió sobre l'economia rosquilla de Raworth: Espanya està dins de la rosquilla?"))),React.createElement(Card,{title:"Conclusió",icon:"✅"},React.createElement("div",{className:"text-sm text-slate-700 leading-relaxed space-y-3"},React.createElement("p",null,"El creixement econòmic ha sigut el motor de la transformació més profunda de la història de la humanitat: en a penes dos segles, la producció mundial s'ha multiplicat exponencialment, l'esperança de vida s'ha més que duplicat, la pobresa extrema s'ha reduït dràsticament i l'accés a l'educació, la salut i la tecnologia s'ha estés a una proporció sense precedents de la població mundial."),React.createElement("p",null,"No obstant això, este creixement ha sigut profundament desigual. La distinció entre creixement (quantitatiu) i desenvolupament (qualitatiu, multidimensional) és essencial per a comprendre per què alguns països han aconseguit traduir el creixement en benestar generalitzat i altres no. Les causes del subdesenvolupament són complexes i multicausals: factors històrics (colonialisme, dependència), econòmics (parany de la pobresa, deteriorament dels termes d'intercanvi), geogràfics (clima, recursos), institucionals (extractivitat, corrupció) i de governança es combinen per a perpetuar la pobresa en moltes regions del món."),React.createElement("p",null,"Les teories del creixement —des del model clàssic de Smith i Ricardo, passant per Harrod-Domar i Solow, fins al creixement endogen de Romer i Lucas— proporcionen un marc analític cada vegada més sofisticat per a entendre les fonts del creixement i dissenyar polítiques eficaces. Les estratègies de desenvolupament han evolucionat des de la ISI fins a la promoció d'exportacions, passant pel Consens de Washington i arribant als enfocaments actuals que emfatitzen les institucions, el capital humà, la sostenibilitat i els ODS."),React.createElement("p",null,"El gran desafiament del segle XXI és compatibilitzar el creixement econòmic necessari per a erradicar la pobresa i millorar la vida de milers de milions de persones amb els ",React.createElement("strong",null,"límits ecològics del planeta"),". L'economia rosquilla de Kate Raworth ofereix una metàfora poderosa: l'objectiu no és créixer sense límit, sinó operar dins de l'espai segur i just entre el sòl social i el sostre ecològic. El futur docent d'Economia té la responsabilitat de transmetre estos conceptes amb rigor, esperit crític i compromís amb la justícia i la sostenibilitat."))),React.createElement(BibliografiaBox,{items:['SOLOW, R. (1956): "A Contribution to the Theory of Economic Growth", Quarterly Journal of Economics, 70(1), pp. 65-94.','ROMER, P. (1986): "Increasing Returns and Long-Run Growth", Journal of Political Economy, 94(5), pp. 1002-1037.','LUCAS, R. (1988): "On the Mechanics of Economic Development", Journal of Monetary Economics, 22(1), pp. 3-42.',"SEN, A. (1999): Desarrollo como libertad, Planeta.","SACHS, J. (2005): El fin de la pobreza, Debate.","ACEMOGLU, D. y ROBINSON, J. (2012): Por qué fracasan los países, Deusto.","NURKSE, R. (1953): Problems of Capital Formation in Underdeveloped Countries, Oxford University Press.","RAWORTH, K. (2017): Economía rosquilla, Paidós.","LATOUCHE, S. (2009): Pequeño tratado del decrecimiento sereno, Icaria.","MEADOWS, D. et al. (1972): Los límites del crecimiento, Informe al Club de Roma.","DIAMOND, J. (1997): Armas, gérmenes y acero, Debate.","PIKETTY, T. (2013): El capital en el siglo XXI, FCE.","MANKIW, N.G. (2020): Principios de Economía, 8.ª ed., Cengage Learning.","HARROD, R. (1939) y DOMAR, E. (1946): modelos de crecimiento (artículos originales en Economic Journal y Econometrica).","PNUD: Informe sobre Desarrollo Humano (ediciones a )"),", que a Espanya comprén totes les persones de ",React.createElement("strong",null,"16 anys o més")," (l'edat mínima legal per a treballar). La PET es divideix en dos grans grups:"),React.createElement("p",null,React.createElement("strong",null,"Població activa:")," totes les persones en edat de treballar que o bé tenen una ocupació (",React.createElement("strong",null,"ocupats"),") o bé la busquen activament (",React.createElement("strong",null,"aturats"),"). La població activa = ocupats + aturats."),React.createElement("p",null,React.createElement("strong",null,"Població inactiva:")," totes les persones en edat de treballar que ni tenen ocupació ni la busquen activament. Inclou ",React.createElement("strong",null,"estudiants")," a temps complet, ",React.createElement("strong",null,"jubilats i pensionistes"),", persones dedicades a ",React.createElement("strong",null,"labors de la llar"),", persones amb ",React.createElement("strong",null,"incapacitat permanent"),", persones que han desistit de buscar ocupació (",React.createElement("strong",null,"desanimats"),") i altres col·lectius (rendistes, voluntaris, etc.).")),React.createElement(TheoryBlock,{title:"2.2. Taxes fonamentals",color:"blue"},React.createElement("p",null,"Les tres taxes fonamentals que descriuen la situació del mercat de treball són:"),React.createElement("p",null,React.createElement("strong",null,"Taxa d'activitat:")," mesura la proporció de la PET que participa activament en el mercat de treball (ja siga treballant o buscant ocupació). Taxa d'activitat = (Població activa / PET) × 100."),React.createElement("p",null,React.createElement("strong",null,"Taxa d'ocupació:")," mesura la proporció de la PET que efectivament té una ocupació. Taxa d'ocupació = (Població ocupada / PET) × 100."),React.createElement("p",null,React.createElement("strong",null,"Taxa d'atur (o taxa de desocupació):")," mesura la proporció de la població activa que, desitjant treballar i buscant activament ocupació, no la tr ng",null,"valor de la productivitat marginal")," (PMgL × P, on P és el preu del producte) iguala el salari (W). És a dir, la condició d'equilibri és: ",React.createElement("strong",null,"W = PMgL × P"),". Si el salari és inferior al valor de la productivitat marginal, l'empresa obté beneficis contractant un treballador addicional; si és superior, perd diners i redueix la plantilla. La corba de demanda de treball és la pròpia corba de productivitat marginal del treball, que té ",React.createElement("strong",null,"pendent negatiu")," per la llei de rendiments decreixents: cada treballador addicional aporta menys que l'anterior (mantenint els altres factors constants).")),React.createElement(FormulaBox,{formula:"W = PMgL × P",desc:"En equilibri competitiu, el salari iguala el valor de la productivitat marginal del treball."}),React.createElement(TheoryBlock,{title:"3.3. Salari d'equilibri",color:"green"},React.createElement("p",null,"En el ",React.createElement("strong",null,"model competitiu"),", el salari d'equilibri es determina per la intersecció de l'oferta i la demanda de treball. A eixe salari, la quantitat de treball oferida iguala la quantitat demandada i no existeix desocupació involuntària (excepte la friccional). Si el salari està per damunt de l'equilibri, hi ha excés d'oferta de treball (desocupació); si està per davall, hi ha excés de demanda (escassetat de treballadors)."),React.createElement("div",{className:"my-6"},React.createElement("svg",{viewBox:"0 0 550 400",className:"w-full max-w-xl mx-auto",style:{fontFamily:"Plus Jakarta Sans, sans-serif"}},React.createElement("rect",{x:"0",y:"0",width:"550",height:"400",rx:"16",fill:"#faf5ff",stroke:"#c084fc",strokeWidth:"1.5"}),React.createElement("text",{x:"275",y:"30",textAnchor:"middle",fontSize:"15",fontWeight:"bold",fill:"#6b21a8"},"Equilibri al mercat de treball"),React.createElement("line",{x1:"80",y1:"50",x2:"80",y2:"340",stroke:"#374151",strokeWidth:"1.5"}),React.createElement("text",{x:"35",y:"195 , podent fixar salaris per damunt del nivell competitiu. Això pot augmentar la renda dels treballadors sindicats però generar desocupació entre els no sindicats (model d'insiders-outsiders de Lindbeck i Snower, 1988)."),React.createElement("p",null,React.createElement("strong",null,"Monopsoni (un sol demandant de treball):")," quan una empresa és l'únic o principal ocupador d'una zona (ex.: una gran fàbrica en un poble), té poder de mercat per a fixar salaris per davall del nivell competitiu. El monopsonista maximitza beneficis contractant menys treballadors a un salari menor que el competitiu."),React.createElement("p",null,React.createElement("strong",null,"Salari mínim:")," l'establiment d'un salari mínim interprofessional (SMI) per damunt del salari d'equilibri genera un debat central en economia laboral. La teoria neoclàssica prediu que genera desocupació (excés d'oferta). No obstant això, estudis empírics com el de ",React.createElement("strong",null,"Card i Krueger (1994)")," —que van analitzar l'efecte de l'augment del salari mínim en restaurants de menjar ràpid a Nova Jersey— van trobar que un augment moderat del salari mínim no necessàriament redueix l'ocupació, especialment en mercats amb poder de monopsoni. Este debat continua obert i és un dels més actius de l'economia laboral contemporània."))),React.createElement(Card,{title:"4. La desocupació: tipus i causes",icon:"📊"},React.createElement(TheoryBlock,{title:"4.1. Desocupació friccional",color:"purple"},React.createElement("p",null,"La ",React.createElement("strong",null,"desocupació friccional")," és la que es produeix durant el procés de cerca d'ocupació entre un treball i un altre. És inevitable en qualsevol economia dinàmica: sempre hi ha persones que deixen una ocupació voluntàriament per a buscar-ne una altra millor, joves que accedeixen per primera vegada al mercat de treball, persones que es reincorporen després d'un període d'inactivitat, etc. La desocupació friccional és generalment de ",React.createElement("strong",null,"curta duració")," i reflecteix el temps necessari perquè treballadors i ocupadors es troben (problemes d'informació, mobilitat geogràfica, procés de selecció). És compatible amb una economia saludable i eficient.")),React.createElement(TheoryBlock,{title:"4.2. Desocupació estructural",color:"blue"},React.createElement("p",null,"La ",React.createElement("strong",null,"desocupació estructural")," sorgeix quan existeix un ",React.createElement("strong",null,"desajust")," entre les qualificacions que posseeixen els treballadors i les que demanden les empreses (mismatch d'habilitats), entre la localització geogràfica dels treballadors i la dels llocs vacants, o quan el canvi tecnològic destrueix ocupacions més ràpid del que en crea en altres sectors. La desocupació estructural és de ",React.createElement("strong",null,"llarga duració")," i més difícil de resoldre: requereix polítiques de formació, reciclatge professional, mobilitat geogràfica i inversió en nous sectors. Exemples: miners desplaçats per la transició energètica, treballadors de la indústria tèxtil desplaçats per la deslocalització, empleats de banca desplaçats per la digitalització.")),React.createElement(TheoryBlock,{title:"4.3. Desocupació cíclica",color:"green"},React.createElement("p",null,"La ",React.createElement("strong",null,"desocupació cíclica")," (o keynesiana) és la que es produeix com a conseqüència de les recessions econòmiques: quan la demanda agregada cau, les empreses redueixen la producció i acomiaden treballadors. És el component més volàtil de la desocupació i el que justifica les polítiques macroeconòmiques anticícliques (fiscal i monetària expansiva en recessió). A Espanya, la desocupació cíclica va ser especialment severa durant la Gran Recessió de 2008-2013, quan la taxa d'atur va passar del 8% al 27%.")),React.createElement(TheoryBlock,{title:"4.4. Desocupació estacional",color:"amber"},React.createElement("p",null,"La ",React.createElement("strong",null,"desocupació estacional")," es produeix per les fluctuacions regulars de l'activitat econòmica lligades a les estacions de l'any o a períodes específics. És especialment rellevant en sectors com el ",React.createElement("strong",null,"turisme")," (estiu i festius), l'",React.createElement("strong",null,"agricultura")," (sembra i collita), el ",React.createElement("strong",null,"comerç")," (rebaixes, Nadal) i la ",React.createElement("strong",null,"construcció")," (clima). Per a eliminar este component de l'anàlisi, les estadístiques oficials publiquen dades ",React.createElement("strong",null,"desestacionalitzades"),".")),React.createElement(TheoryBlock,{title:"4.5. Taxa natural de desocupació i NAIRU",color:"pink"},React.createElement("p",null,React.createElement("strong",null,"Milton Friedman")," (1968) va introduir el concepte de ",React.createElement("strong",null,"taxa natural de desocupació"),": el nivell de desocupació que existeix quan l'economia està en el seu nivell de producció potencial, és a dir, quan sols existeix desocupació friccional i estructural (no hi ha desocupació cíclica). La taxa natural no és \"natural\" en el sentit d'immutable: depén de les institucions del mercat de treball (regulació, prestacions, formació), l'eficiència de l'emparellament entre treballadors i ocupacions, i l'estructura productiva de l'economia."),React.createElement("p",null,"Un concepte relacionat és la ",React.createElement("strong",null,"NAIRU")," (Non-Accelerating Inflation Rate of Unemployment): la taxa de desocupació per davall de la qual la inflació tendeix a accelerar-se. Si la desocupació cau per davall de la NAIRU, els treballadors guanyen poder de negociació, els salaris pugen per damunt de la productivitat, els costos es traslladen a preus i la inflació s'accelera. Este concepte és central per a la política monetària dels bancs centrals.")),React.createElement(TheoryBlock,{title:"4.6. La corba de Phillips",color:"violet"},React.createElement("p",null,"En 1958, ",React.createElement("strong",null,"A.W. Phillips")," va publicar un estudi empíric que mostrava una ",React.createElement("strong",null,"relació inversa entre la taxa de desocupació i la taxa de variació dels salaris nominals")," al Regne Unit (1861-1957). Posteriorment, ",React.createElement("strong",null,"Samuelson i Solow (1960)")," van reformular esta relació com un trade-off entre desocupació i inflació: ",React.createElement("em",null,"menys desocupació → més inflació, i viceversa"),"."),React.createElement("p",null,"Esta relació va ser qüestionada en els anys 70 per l'",React.createElement("strong",null,"estanflació")," (alta inflació + alta desocupació simultàniament). ",React.createElement("strong",null,"Friedman")," i ",React.createElement("strong",null,"Phelps")," van argumentar que la corba de Phillips sols funciona a ",React.createElement("strong",null,"curt termini")," (quan les expectatives d'inflació no s'han ajustat). A ",React.createElement("strong",null,"llarg termini"),", la corba de Phillips és vertical en la taxa natural de desocupació: no hi ha trade-off permanent entre desocupació i inflació. Els ",React.createElement("strong",null,"nous keynesians")," han desenvolupat versions més sofisticades de la corba de Phillips que incorporen expectatives, rigideses nominals i costos d'ajust."))),React.createElement(Card,{title:"5. Polítiques d'ocupació",icon:"🏛️"},React.createElement(TheoryBlock,{title:"5.1. Polítiques actives d'ocupació",color:"purple"},React.createElement("p",null,"Les ",React.createElement("strong",null,"polítiques actives d'ocupació")," són aquelles que busquen millorar el funcionament del mercat de treball, facilitar la inserció laboral i reduir la desocupació estructural. Inclouen:"),React.createElement("p",null,React.createElement("strong",null,"Formació professional i reciclatge:")," programes de capacitació per a actualitzar les competències dels treballadors desocupats o en risc d'exclusió (formació professional per a l'ocupació, programes de requalificació digital, certificats de professionalitat). ",React.createElement("strong",null,"Programes d'ocupació:")," plans d'ocupació pública temporal, programes d'ocupació juvenil (com el Sistema Nacional de Garantia Juvenil a Espanya), incentius a la contractació de col·lectius vulnerables (joves, majors de 45 anys, persones amb discapacitat, aturats de llarga duració). ",React.createElement("strong",null,"Incentius a l'emprenedoria:")," subvencions a la creació d'empreses, tarifa plana d'autònoms, vivers d'empreses, assessorament empresarial. ",React.createElement("strong",null,"Serveis públics d'ocupació:")," intermediació laboral, orientació professional, borses d'ocupació, portals d'ocupació (SEPE, serveis autonòmics).")),React.createElement(TheoryBlock,{title:"5.2. Polítiques passives d'ocupació",color:"blue"},React.createElement("p",null,"Les ",React.createElement("strong",null,"polítiques passives d'ocupació")," proporcionen protecció econòmica a les persones desocupades mentre busquen una nova ocupació. Les principals són:"),React.createElement("p",null,React.createElement("strong",null,"Prestacions per desocupació (contributives):")," el treballador que ha cotitzat un període mínim té dret a una prestació proporcional al seu salari anterior durant un temps limitat (a Espanya, entre 4 i 24 mesos segons la cotització acumulada). ",React.createElement("strong",null,"Subsidis per desocupació (assistencials):")," ajudes per a persones que han esgotat la prestació contributiva o no tenen dret a ella. ",React.createElement("strong",null,"Rendes mínimes d'inserció:")," prestacions de caràcter assistencial per a persones en situació de pobresa i exclusió social. A Espanya, l'",React.createElement("strong",null,"Ingrés Mínim Vital (IMV)"),", creat en 2020, garanteix un nivell mínim de renda a les llars en situació de vulnerabilitat."),React.createElement("p",null,"El disseny de les polítiques passives planteja un dilema: prestacions massa generoses o prolongades poden crear ",React.createElement("strong",null,"desincentius a la cerca d'ocupació")," (parany de la pobresa, moral hazard), mentre que prestacions insuficients poden provocar ",React.createElement("strong",null,"pobresa, exclusió social i deteriorament del capital humà")," dels desocupats.")),React.createElement(TheoryBlock,{title:"5.3. Flexibilitat vs. seguretat: el debat de la flexiseguretat",color:"green"},React.createElement("p",null,"El concepte de ",React.createElement("strong",null,"flexiseguretat")," (flexicurity), inspirat en el ",React.createElement("strong",null,"model danés"),", proposa combinar tres elements: ",React.createElement("strong",null,"flexibilitat")," en el mercat de treball (facilitat de contractació i acomiadament, adaptabilitat de les condicions laborals), ",React.createElement("strong",null,"generoses prestacions per desocupació")," (protecció durant les transicions) i ",React.createElement("strong",null,"polítiques actives d'ocupació intensives")," (formació, reciclatge, intermediació). La idea és que la seguretat no es proporciona protegint el lloc de treball concret (com en el model mediterrani), sinó protegint el ",React.createElement("strong",null,"treballador")," en les seues transicions entre ocupacions.")),React.createElement(TheoryBlock,{title:"5.4. Reformes laborals a Espanya",color:"amber"},React.createElement("p",null,"Espanya ha experimentat múltiples reformes laborals en les últimes dècades. La ",React.createElement("strong",null,"reforma de 2012")," (Reial Decret-llei 3/2012) va introduir: abaratiment de l'acomiadament improcedent (de 45 a 33 dies per any), prioritat del conveni d'empresa sobre el sectorial, facilitació de la flexibilitat interna (modificació de condicions de treball), ampliació del període de prova. La ",React.createElement("strong",null,"reforma de 2021")," (Reial Decret-llei 32/2021) va introduir canvis en sentit contrari: restricció de la contractació temporal (el contracte indefinit passa a ser la norma), recuperació de la ultraactivitat dels convenis col·lectius, limitació de la subcontractació i regulació del contracte fix-discontinu. L'impacte d'esta reforma ha sigut una notable caiguda de la taxa de temporalitat.")),React.createElement(TheoryBlock,{title:"5.5. Tipus de contracte i negociació col·lectiva",color:"pink"},React.createElement("p",null,"Els principals tipus de contracte de treball a Espanya són: ",React.createElement("strong",null,"contracte indefinit")," (ordinari, fix-discontinu), ",React.createElement("strong",null,"contracte temporal")," (per circumstàncies de la producció, per substitució) i ",React.createElement("strong",null,"contracte formatiu")," (en alternança, per a l'obtenció de la pràctica professional). Després de la reforma de 2021, es van eliminar la majoria de modalitats de contracte temporal i es va impulsar la contractació indefinida."),React.createElement("p",null,"La ",React.createElement("strong",null,"negociació col·lectiva")," és el procés mitjançant el qual sindicats i patronal acorden les condicions laborals (salaris, jornada, vacances, classificació professional) a través de ",React.createElement("strong",null,"convenis col·lectius"),". A Espanya, la negociació col·lectiva té una cobertura àmplia (més del 80% dels assalariats estan coberts per un conveni) i s'articula en diversos nivells: conveni d'empresa, conveni sectorial provincial, conveni sectorial estatal."))),React.createElement(Card,{title:"6. El mercat de treball a Espanya",icon:"🇪🇸"},React.createElement(TheoryBlock,{title:"6.1. Característiques estructurals",color:"purple"},React.createElement("p",null,"El mercat de treball espanyol presenta una sèrie de ",React.createElement("strong",null,"característiques estructurals")," que el diferencien d'altres mercats europeus: ",React.createElement("strong",null,"Alta taxa de desocupació estructural:")," històricament, Espanya ha tingut una taxa d'atur sistemàticament superior a la mitjana de la UE, fins i tot en períodes de creixement econòmic. Les causes són múltiples: rigidesa del mercat, desajust formatiu, model productiu intensiu en ocupació poc qualificada (construcció, turisme, hostaleria). ",React.createElement("strong",null,"Elevada temporalitat:")," fins a la reforma de 2021, més del 25% dels assalariats tenien contracte temporal (enfront del 14% de mitjana a la UE), generant precarietat, rotació, baixa productivitat i escassa inversió en formació per part de les empreses."),React.createElement("p",null,React.createElement("strong",null,"Dualitat del mercat (insiders/outsiders):")," el mercat de treball espanyol ha estat marcat per una forta dualitat entre treballadors amb contracte indefinit i alta protecció (insiders) i treballadors temporals amb escassa protecció i alta rotació (outsiders). Esta dualitat té efectes negatius sobre la productivitat, la formació i la desigualtat. ",React.createElement("strong",null,"Desocupació juvenil:")," la taxa d'atur juvenil (16-24 anys) a Espanya és estructuralment molt elevada, havent superat el 55% durant la crisi de 2012-2013. ",React.createElement("strong",null,"Bretxa de gènere:")," encara que la participació femenina ha crescut notablement, persisteixen diferències significatives en taxes d'activitat, ocupació, temporalitat, parcialitat involuntària i salaris entre homes i dones.")),React.createElement(TheoryBlock,{title:"6.2. Evolució recent",color:"blue"},React.createElement("p",null,"L'evolució del mercat de treball espanyol en les últimes dècades pot resumir-se en diverses fases: ",React.createElement("strong",null,"2000-2007 (expansió):")," forta creació d'ocupació, impulsada per la bombolla immobiliària i el sector de la construcció. La taxa d'atur va baixar fins al 8% en 2007. ",React.createElement("strong",null,"2008-2013 (Gran Recessió):")," destrucció massiva d'ocupació, especialment en construcció. La taxa d'atur va aconseguir el 26,9% en el primer trimestre de 2013 (més de 6 milions d'aturats). ",React.createElement("strong",null,"2014-2019 (recuperació):")," lenta recuperació de l'ocupació, amb alta temporalitat i precarietat. ",React.createElement("strong",null,"2020 (COVID-19):")," caiguda abrupta de l'ocupació, amortida pels ERTO (Expedients de Regulació Temporal d'Ocupació). ",React.createElement("strong",null,"2021-present:")," recuperació de l'ocupació, reforma laboral de 2021, caiguda de la temporalitat, debat sobre la qualitat de l'ocupació.")),React.createElement(TheoryBlock,{title:"6.3. Salari Mínim Interprofessional (SMI)",color:"green"},React.createElement("p",null,"El ",React.createElement("strong",null,"Salari Mínim Interprofessional (SMI)")," és la retribució mínima que ha de percebre un treballador per una jornada legal completa. A Espanya, l'SMI ha experimentat pujades significatives en els últims anys: de 735,90 €/mes en 2018 a 1.134 €/mes en 14 pagues en 2024, un augment superior al 50% en sis anys. El debat sobre l'SMI enfronta dos posicions: els qui argumenten que redueix la pobresa laboral, la desigualtat salarial i estimula el consum, i els qui adverteixen que un SMI excessivament alt pot destruir ocupació, especialment entre els col·lectius més vulnerables (joves, poc qualificats, zones de baix cost de vida). L'evidència empírica suggereix que pujades moderades de l'SMI tenen efectes limitats sobre l'ocupació però significatius sobre la reducció de la desigualtat salarial.")),React.createElement(TheoryBlock,{title:"6.4. Bretxa salarial de gènere",color:"amber"},React.createElement("p",null,"La ",React.createElement("strong",null,"bretxa salarial de gènere")," —la diferència entre el salari mitjà d'homes i dones— és un fenomen persistent a Espanya i en la majoria de països del món. Segons dades d'Eurostat, la bretxa salarial a Espanya se situa al voltant del 9-12% (bretxa ajustada) i és major si es consideren les diferències en jornada, sectors i ocupacions (bretxa no ajustada, superior al 20%). Les causes són múltiples: ",React.createElement("strong",null,"segregació horitzontal")," (les dones es concentren en sectors pitjor remunerats: sanitat, educació, cures), ",React.createElement("strong",null,"segregació vertical")," (sostre de vidre: menor presència femenina en llocs directius), ",React.createElement("strong",null,"parcialitat involuntària")," (les dones treballen a temps parcial en major proporció, sovint per responsabilitats de cura), ",React.createElement("strong",null,"penalització per maternitat")," i ",React.createElement("strong",null,"discriminació directa"),". Les mesures per a reduir la bretxa inclouen: plans d'igualtat en empreses, transparència salarial, permisos de paternitat igualitaris (com les 16 setmanes establides a Espanya des de 2021), polítiques de conciliació i corresponsabilitat."))),React.createElement(Card,{title:"7. Desafiaments futurs del mercat laboral",icon:"🔮"},React.createElement(TheoryBlock,{title:"7.1. Automatització i intel·ligència artificial",color:"purple"},React.createElement("p",null,"L'avanç de l'",React.createElement("strong",null,"automatització"),", la ",React.createElement("strong",null,"robòtica")," i la ",React.createElement("strong",null,"intel·ligència artificial (IA)")," està transformant profundament el mercat de treball. L'estudi de ",React.createElement("strong",null,"Frey i Osborne (2013)"),", de la Universitat d'Oxford, va estimar que el ",React.createElement("strong",null,"47% de les ocupacions")," als Estats Units estaven en alt risc de ser automatitzades en les pròximes dues dècades. Estudis posteriors (OCDE, McKinsey Global Institute) han matisat esta xifra, assenyalant que el que s'automatitza són ",React.createElement("strong",null,"tasques"),", no ocupacions completes, i que l'automatització també ",React.createElement("strong",null,"crea")," noves ocupacions (en disseny, manteniment, supervisió, programació, anàlisi de dades, etc.) i ",React.createElement("strong",null,"transforma")," les existents."),React.createElement("p",null,"La IA generativa (com els models de llenguatge de gran escala) representa un salt qualitatiu: per primera vegada, l'automatització afecta no sols tasques rutinàries i manuals, sinó també tasques cognitives complexes (redacció, anàlisi, programació, disseny, atenció al client). Això genera incertesa sobre el futur de professions tradicionalment considerades \"segures\" davant l'automatització (advocats, comptables, periodistes, traductors, programadors)."),React.createElement("p",null,"L'impacte net sobre l'ocupació dependrà de la velocitat de la innovació tecnològica, de la capacitat d'adaptació dels treballadors (formació contínua, reciclatge), de les polítiques públiques (regulació, fiscalitat dels robots, inversió en educació) i de la creació de nous sectors i ocupacions que hui no existeixen.")),React.createElement(TheoryBlock,{title:"7.2. Economia de plataformes (gig economy)",color:"blue"},React.createElement("p",null,"L'",React.createElement("strong",null,"economia de plataformes")," o ",React.createElement("strong",null,"gig economy"),' es refereix al model de treball intermediat per plataformes digitals (Uber, Deliveroo, Glovo, Amazon Mechanical Turk, Upwork, etc.), en el qual els treballadors realitzen tasques puntuals o "gigs" a demanda, generalment com a treballadors autònoms. Este model planteja desafiaments regulatoris fonamentals: són estos treballadors ',React.createElement("strong",null,"autònoms")," (amb llibertat i flexibilitat però sense protecció social) o ",React.createElement("strong",null,"assalariats encoberts")," (falsos autònoms)?"),React.createElement("p",null,"A Espanya, la ",React.createElement("strong",null,"Llei Rider")," (Reial Decret-llei 9/2021) va establir la presumpció de laboralitat per als repartidors de plataformes digitals, convertint-los en assalariats amb drets laborals plens. A nivell europeu, la proposta de Directiva sobre treball en plataformes digitals busca establir criteris comuns per a la classificació d'estos treballadors.")),React.createElement(TheoryBlock,{title:"7.3. Teletreball post-COVID",color:"green"},React.createElement("p",null,"La pandèmia de COVID-19 va accelerar dràsticament l'adopció del ",React.createElement("strong",null,"teletreball"),": milions de treballadors van passar del treball presencial al remot de forma abrupta. Esta experiència ha transformat les expectatives de treballadors i empreses. A Espanya, la ",React.createElement("strong",null,"Llei 10/2021 de treball a distància")," regula el teletreball, establint el dret a la compensació de despeses, la voluntarietat, la reversibilitat, la desconnexió digital i la igualtat de drets entre treballadors presencials i remots."),React.createElement("p",null,"El teletreball presenta avantatges (flexibilitat, conciliació, reducció de desplaçaments, accés a talent global) i inconvenients (aïllament social, dificultat de desconnexió, desigualtat entre treballadors que poden i no poden teletreballar, risc de presentisme digital, efectes sobre el desenvolupament professional). El model ",React.createElement("strong",null,"híbrid")," (combinació de presencial i remot) s'ha consolidat com l'opció predominant en moltes empreses i sectors.")),React.createElement(TheoryBlock,{title:"7.4. Renda bàsica universal",color:"amber"},React.createElement("p",null,"La ",React.createElement("strong",null,"renda bàsica universal (RBU)")," és una proposta que planteja garantir a tot ciutadà una renda periòdica suficient per a cobrir les necessitats bàsiques, de forma ",React.createElement("strong",null,"incondicional")," (sense requisits de renda, situació laboral o disposició a treballar), ",React.createElement("strong",null,"universal")," (per a tots els ciutadans) i ",React.createElement("strong",null,"individual")," (no basada en la llar). Els seus defensors (",React.createElement("strong",null,"Philippe Van Parijs"),", ",React.createElement("strong",null,"Guy Standing"),", ",React.createElement("strong",null,"Thomas Piketty"),") argumenten que: (1) simplifica el sistema de protecció social (eliminant la burocràcia i l'estigma de les prestacions condicionades), (2) elimina el parany de la pobresa (no desincentiva el treball, ja que no es perd en trobar ocupació), (3) proporciona seguretat econòmica davant l'automatització i la inestabilitat laboral, (4) empodera els treballadors (poden rebutjar ocupacions precàries), (5) reconeix el treball no remunerat (domèstic, voluntari, de cures)."),React.createElement("p",null,"Els seus detractors argumenten que: (1) el cost fiscal és enorme (multiplicar una renda bàsica per tota la població adulta llança xifres de desenes o centenars de milers de milions), (2) pot desincentivat el treball (encara que l'evidència dels experiments pilot —Finlàndia, Kenya, Stockton als EUA— no confirma este temor), (3) és políticament difícil d'implementar. El debat sobre la RBU ha cobrat força amb la pandèmia de COVID-19 i l'avanç de la IA.")),React.createElement(TheoryBlock,{title:"7.5. Formació contínua i reciclatge professional",color:"pink"},React.createElement("p",null,"En un mercat laboral en transformació accelerada, la ",React.createElement("strong",null,"formació contínua")," (lifelong learning) es converteix en una necessitat estructural. L'OCDE estima que el 14% de les ocupacions actuals són altament automatitzables i un altre 32% patirà canvis significatius, la qual cosa exigirà ",React.createElement("strong",null,"reciclatge professional (reskilling)")," i ",React.createElement("strong",null,"millora de competències (upskilling)")," a escala massiva. Les competències més demandades combinen habilitats tècniques (digitals, STEM, programació, anàlisi de dades) amb habilitats transversals (creativitat, pensament crític, resolució de problemes complexos, intel·ligència emocional, comunicació, treball en equip).")),React.createElement(TheoryBlock,{title:"7.6. ODS 8 i connexió curricular",color:"violet"},React.createElement("p",null,"L'",React.createElement("strong",null,"ODS 8")," (Treball decent i creixement econòmic) estableix com a meta promoure el creixement econòmic sostingut, inclusiu i sostenible, l'ocupació plena i productiva i el treball decent per a tots. El concepte de ",React.createElement("strong",null,'"treball decent"')," (decent work), encunyat per l'",React.createElement("strong",null,"OIT"),", inclou quatre pilars: ocupació productiva i lliurement triada, drets laborals (llibertat sindical, negociació col·lectiva, eliminació del treball forçós i infantil, no discriminació), protecció social i diàleg social."),React.createElement("p",null,React.createElement("strong",null,"Aplicació docent:")," (1) Analitzar la piràmide de població d'Espanya (dades de l'INE) i comparar-la amb la d'un país en desenvolupament. (2) Calcular les taxes d'activitat, ocupació i atur amb dades reals de l'EPA. (3) Debat: és el salari mínim una ferramenta eficaç contra la pobresa? Arguments a favor i en contra. (4) Estudi de cas: la Llei Rider i la regulació de les plataformes digitals. (5) Simulació de negociació col·lectiva entre \"sindicat\" i \"patronal\". (6) Reflexió sobre el futur del treball: quines ocupacions existiran en 2040? (7) Anàlisi de la bretxa salarial de gènere amb dades d'Eurostat."))),React.createElement(Card,{title:"Conclusió",icon:"✅"},React.createElement("div",{className:"text-sm text-slate-700 leading-relaxed space-y-3"},React.createElement("p",null,"La població i el mercat de treball constitueixen dos dimensions fonamentals i interrelacionades de la realitat econòmica. La dinàmica demogràfica —amb fenòmens com l'envelliment, la caiguda de la fecunditat, les migracions i la despoblació rural— condiciona de forma decisiva l'oferta de treball, les necessitats de despesa pública, el sistema de pensions i la capacitat de creixement de les economies. Espanya, amb una piràmide de població cada vegada més regressiva i una dependència creixent de la immigració com a font de creixement demogràfic, afronta desafiaments estructurals de primer ordre."),React.createElement("p",null,"El mercat de treball, per la seua part, s'ha revelat com un dels àmbits més complexos i controvertits de la política econòmica. La teoria econòmica ofereix marcs analítics potents —des del model competitiu d'oferta i demanda de treball fins als models de salaris d'eficiència, insiders-outsiders i negociació—, però la realitat del mercat laboral està profundament condicionada per les institucions, la regulació, la negociació col·lectiva, la cultura empresarial i les polítiques públiques. La desocupació, en les seues diferents variants (friccional, estructural, cíclica), continua sent el gran problema irresolt de moltes economies, amb conseqüències devastadores sobre el benestar individual i la cohesió social."),React.createElement("p",null,"El mercat de treball espanyol presenta característiques estructurals preocupants —alta taxa d'atur, dualitat, temporalitat, desocupació juvenil, bretxa de gènere— que les successives reformes laborals han intentat abordar amb resultats desiguals. La reforma de 2021 ha aconseguit una reducció notable de la temporalitat, però queden pendents desafiaments de fons: la millora de la productivitat, la reducció de la desocupació estructural, la integració dels joves, l'adaptació a la revolució tecnològica i la transició cap a un model productiu més sostenible i basat en el coneixement."),React.createElement("p",null,"El futur del treball està marcat per la incertesa: l'automatització, la intel·ligència artificial, l'economia de plataformes, el teletreball i els canvis demogràfics estan transformant radicalment el panorama laboral. La formació contínua, la flexiseguretat, la negociació col·lectiva adaptativa i el debat sobre la renda bàsica universal seran elements centrals del mercat de treball del segle XXI. El futur docent d'Economia té la responsabilitat de transmetre estos continguts amb rigor analític, sensibilitat social i esperit crític, preparant l'alumnat per a comprendre i navegar un món laboral en constant transformació."))),React.createElement(BibliografiaBox,{items:['FRIEDMAN, M. (1968): "The Role of Monetary Policy", American Economic Review, 58(1), pp. 1-17.','PHILLIPS, A.W. (1958): "The Relation between Unemployment and the Rate of Change of Money Wage Rates in the United Kingdom, 1861-1957", Economica, 25(100), pp. 283-299.','CARD, D. y KRUEGER, A. (1994): "Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania", American Economic Review, 84(4), pp. 772-793.','FREY, C. y OSBORNE, M. (2013): "The Future of Employment: How Susceptible Are Jobs to Computerisation?", Oxford Martin School Working Paper.',"VAN PARIJS, P. y VANDERBORGHT, Y. (2017): Ingreso básico: una propuesta radical para una sociedad libre, Grano de Sal.","MANKIW, N.G. (2020): Principios de Economía, 8.ª ed., Cengage Learning.","BLANCHARD, O. (2017): Macroeconomía, 7.ª ed., Pearson.","LINDBECK, A. y SNOWER, D. (1988): The Insider-Outsider Theory of Employment and Unemployment, MIT Press.","INE: Encuesta de Población Activa (EPA). Publicación trimestral.","SEPE: Estadísticas de paro registrado y contratos. Publicación mensual.","EUROSTAT: Labour Force Survey. European Labour Market Statistics.","OIT: Informe Mundial sobre el Empleo y las Perspectivas Sociales (ediciones anuales).","OCDE (2019): The Future of Work. OECD Employment Outlook.","Ley Orgánica 3/2020, de 29 de diciembre (LOMLOE). Real Decreto 243/2022, de 5 de abril.","Real Decreto-ley 32/2021, de 28 de diciembre (reforma laboral). Real Decreto-ley 9/2021 (Ley Rider).","ONU (2015): Agenda 2030 para el Desarrollo Sostenible. ODS 8: Trabajo decente y crecimiento económico."]})),Tema9Resum=()=>React.createElement("div",{className:"space-y-5 animate-fade"},React.createElement(Card,null,React.createElement("div",{className:"p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"},React.createElement("p",{className:"text-center font-bo di ambient ha passat de ser una qüestió marginal a convertir-se en el desafiament central de la ciència econòmica i de la política pública del segle XXI. Durant massa temps, el model econòmic dominant va tractar la naturalesa com un mer proveïdor de recursos barats i un abocador gratuït de residus, ignorant els costos ambientals i socials de l'activitat econòmica. Les externalitats ambientals —contaminació, canvi climàtic, pèrdua de biodiversitat, esgotament de recursos— representen una fallada del mercat de proporcions globals que exigeix la intervenció decidida dels poders públics i la transformació profunda del model productiu i de consum."),React.createElement("p",null,"La teoria econòmica ofereix instruments potents per a abordar estos problemes: els impostos pigouvians, els mercats de drets d'emissió, el teorema de Coase, la regulació directa i l'avaluació d'impacte ambiental constitueixen un arsenal de ferramentes que, ben dissenyades i implementades, poden alinear els incentius econòmics amb els objectius ambientals. El desafiament no és tècnic sinó polític: la transició ecològica exigeix voluntat política, cooperació internacional, inversió pública i privada a gran escala i una distribució justa dels costos i beneficis."),React.createElement("p",null,"El desenvolupament sostenible —en la seua triple dimensió econòmica, social i ambiental— s'ha consolidat com el paradigma rector del segle XXI. L'Agenda 2030, amb els seus 17 ODS, proporciona un marc universal de referència. Els nous paradigmes econòmics —economia ecològica, decreixement, economia rosquilla, economia del bé comú, economia circular— enriqueixen el debat i ofereixen alternatives al creixement il·limitat del PIB com a indicador de progrés."),React.createElement("p",null,"El canvi climàtic, com la major amenaça global del nostre temps, exigeix una resposta urgent i coordinada. L'Acord de París, el Pacte Verd Europeu i els mecanismes de mercat per a la reducció d'emissions representen avanços significatius, però insuficients davant la magnitud del desafiament. La justícia climàtica —la idea que els països rics, principals responsables històrics del canvi climàtic, han d'assumir una responsabilitat proporcional— és un imperatiu ètic i econòmic."),React.createElement("p",null,"El futur docent d'Economia té la responsabilitat i el privilegi de formar les noves generacions en la comprensió d'estos desafiaments i en el compromís amb un model de desenvolupament que siga simultàniament pròsper, just i sostenible. La LOMLOE, amb el seu èmfasi en els ODS i l'educació per al desenvolupament sostenible, proporciona el marc normatiu; la ciència econòmica, les ferramentes analítiques; i la vocació docent, la motivació per a transformar el món des de les aules."))),React.createElement(BibliografiaBox,{items:["PIGOU, A.C. (1920): The Economics of Welfare, Macmillan.",'COASE, R. (1960): "The Problem of Social Cost", Journal of Law and Economics, 3, pp. 1-44.','HARDIN, G. (1968): "The Tragedy of the Commons", Science, 162(3859), pp. 1243-1248.',"STERN, N. (2006): The Economics of Climate Change: The Stern Review, Cambridge University Press.","GEORGESCU-ROEGEN, N. (1971): The Entropy Law and the Economic Process, Harvard University Press.","DALY, H. (1996): Beyond Growth: The Economics of Sustainable Development, Beacon Press.","RAWORTH, K. (2017): Doughnut Economics: Seven Ways to Think Like a 21st-Century Economist, Random House.","LATOUCHE, S. (2009): Pequeño tratado del decrecimiento sereno, Icaria.","FELBER, C. (2012): La economía del bien común, Deusto.","McDONOUGH, W. y BRAUNGART, M. (2002): Cradle to Cradle: Remaking the Way We Make Things, North Point Press.","MEADOWS, D. et al. (1972): Los límites del crecimiento, Informe al Club de Roma.","OSTROM, E. (1990): Governing the Commons, Cambridge University Press.","ONU (2015): Agenda 2030 para el Desarrollo Sostenible. 17 Objetivos de Desarrollo Sostenible.","IPCC (2021-2023): Sexto Informe de Evaluación. Cambio Climátic
