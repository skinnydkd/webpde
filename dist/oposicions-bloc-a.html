 estalviar, en què treballar— fins als grans debats sobre política fiscal, desigualtat o sostenibilitat, la ciència econòmica ofereix un marc analític rigorós per a entendre com les societats organitzen la producció, distribució i consum de béns i serveis. En un context globalitzat, marcat per la incertesa i la complexitat, la formació econòmica resulta indispensable per a l'exercici d'una ciutadania informada i responsable."),React.createElement("p",null,"Des de la perspectiva educativa, l'Economia ocupa un lloc destacat en el currículum d'Educació Secundària i Batxillerat. La Llei Orgànica 3/2020, de 29 de desembre, per la qual es modifica la Llei Orgànica 2/2006 (LOMLOE), reconeix la importància de l'alfabetització econòmica i financera com a part essencial de la formació integral de l'alumnat. Les matèries d'Economia i Emprenedoria (4t ESO), Economia (1r Batxillerat) i Empresa i Disseny de Models de Negoci (2n Batxillerat) contribueixen directament al desenvolupament de les competències clau, en especial la competència emprenedora (CE) i la competència ciutadana (CC), així com la competència matemàtica i en ciència, tecnologia i enginyeria (STEM)."),React.createElement("p",null,"El present tema aborda, en primer lloc, la definició i delimitació conceptual de l'Economia com a ciència; en segon lloc, el problema econòmic fonamental de l'escassetat i la necessitat d'elegir; en tercer lloc, l'objecte d'estudi de la disciplina, distingint entre Microeconomia i Macroeconomia; i, finalment, el mètode científic aplicat a l'anàlisi econòmica, incloent-hi els instruments quantitatius i qualitatius que empra. Tot això es connecta amb la seua rellevància curricular i la seua aplicació en la pràctica docent."))),React.createElement(Card,{title:"1. Concepte d'Economia",icon:"📘"},React.createElement(TheoryBlock,{title:"1.1. Definicions clàssiques i modernes",color:"purple"},React.createElement("p",null,"La definició més influent i citada d'Economia és la proposada per ",React.createElement("strong",null,"Lionel Robbins")," en la seua obra ",React.createElement("em",null,"An Essay on the Nature and Significance of Economic Science")," (1932): ",React.createElement("em",null,'"L\'Economia és la ciència que estudia la conducta humana com una relació entre fins i mitjans escassos que tenen usos alternatius"'),". Aquesta definició va suposar un punt d'inflexió, ja que va desplaçar el focus des de la riquesa material (com defensaven els clàssics) cap al problema de l'",React.createElement("strong",null,"elecció racional")," davant l'escassetat."),React.createElement("p",null,"Per la seua banda, ",React.createElement("strong",null,"Paul Samuelson"),", en el seu cèlebre manual ",React.createElement("em",null,"Economía")," (la primera edició del qual data de 1948 i que ha aconseguit més de dinou edicions), defineix l'Economia com ",React.createElement("em",null,'"l\'estudi de com les societats utilitzen recursos escassos per a produir mercaderies valuoses i distribuir-les entre els diferents individus"'),". Aquesta definició posa l'accent en tres dimensions: la producció, la distribució i el consum."),React.createElement("p",null,"Altres definicions rellevants inclouen la d'",React.createElement("strong",null,"Alfred Marshall")," (1890), qui en els seus ",React.createElement("em",null,"Principios de Economía")," la va descriure com ",React.createElement("em",null,'"l\'estudi de la humanitat en els assumptes ordinaris de la vida"'),", subratllant la proximitat de la disciplina a l'experiència quotidiana. Més recentment, ",React.createElement("strong",null,"N. Gregory Mankiw")," (2020) sintetitza: ",React.createElement("em",null,"\"L'Economia és l'estudi de la manera en què la societat gestiona els seus recursos escassos\""),".")),React.createElement(TheoryBlock,{title:"1.2. L'Economia com a ciència social",color:"blue"},React.createElement("p",null,"L'Economia s'inscriu en l'àmbit de les ",React.createElement("strong",null,"ciències socials"),", és a dir, aquelles disciplines que estudien el comportament humà en societat. A diferència de les ciències naturals (física, química, biologia), les ciències socials s'enfronten a la dificultat que el seu objecte d'estudi —les persones i les seues interaccions— és inherentment complex, canviant i no susceptible d'experimentació controlada en laboratori. No obstant això, l'Economia comparteix amb les ciències naturals l'aspiració al rigor metodològic, la formulació d'hipòtesis contrastables i la construcció de models explicatius i predictius."),React.createElement("p",null,"L'Economia manté estretes relacions amb altres disciplines: la ",React.createElement("strong",null,"Sociologia")," (estudi de les estructures socials), la ",React.createElement("strong",null,"Psicologia")," (especialment a través de l'Economia conductual), la ",React.createElement("strong",null,"Ciència Política")," (anàlisi de les polítiques públiques), el ",React.createElement("strong",null,"Dret")," (regulació de l'activitat econòmica), la ",React.createElement("strong",null,"Història")," (evolució dels sistemes econòmics) i les ",React.createElement("strong",null,"Matemàtiques i l'Estadística")," (eines de formalització i contrastació).")),React.createElement(TheoryBlock,{title:"1.3. Economia positiva i Economia normativa",color:"green"},React.createElement("p",null,"Una distinció fonamental en la disciplina és la que separa l'",React.createElement("strong",null,"Economia positiva")," de l'",React.createElement("strong",null,"Economia normativa"),". L'Economia positiva descriu i explica els fenòmens econòmics tal com són, formulant proposicions contrastables empíricament. Per exemple: ",React.createElement("em",null,'"Un augment del salari mínim redueix l\'ocupació en determinats sectors"')," és una afirmació positiva, susceptible de verificació estadística."),React.createElement("p",null,"L'Economia normativa, en canvi, formula judicis de valor sobre com haurien de ser les coses. Per exemple: ,"Alfred Marshall")," (1842-1924), creador del concepte d'",React.createElement("strong",null,"equilibri parcial"),' i de les cèlebres corbes d\'oferta i demanda (les "tisores de Marshall"); ',React.createElement("strong",null,"León Walras")," (1834-1910), que va formular la teoria de l'",React.createElement("strong",null,"equilibri general"),", demostrant que tots els mercats d'una economia estan interconnectats i poden aconseguir un equilibri simultani; i ",React.createElement("strong",null,"Vilfredo Pareto")," (1848-1923), que va desenvolupar el concepte d'",React.createElement("strong",null,"òptim de Pareto"),", una situació en la qual no es pot millorar el benestar d'un individu sense empitjorar el d'un altre."),React.createElement("p",null,"Els temes centrals de la Microeconomia inclouen: la teoria del consumidor (utilitat, corbes d'indiferència, restricció pressupostària), la teoria de l'empresa (funció de producció, costs, maximització del benefici), les estructures de mercat (competència perfecta, monopoli, oligopoli, competència monopolística), la teoria de jocs, les externalitats, els béns públics i les fallades de mercat.")),React.createElement(TheoryBlock,{title:"4.2. Macroeconomia",color:"blue"},React.createElement("p",null,"La ",React.createElement("strong",null,"Macroeconomia")," estudia l'economia en el seu conjunt, analitzant les variables agregades: el Producte Interior Brut (PIB), la taxa d'inflació, la taxa de desocupació, el tipus d'interés, el tipus de canvi, la balança de pagaments i el creixement econòmic. Se centra en preguntes com: Per què creixen unes economies més que altres? Què causa la inflació? Com pot el govern reduir la desocupació?"),React.createElement("p",null,"El pare indiscutible de la Macroeconomia moderna és ",React.createElement("strong",null,"John Maynard Keynes")," (1883-1946), l'obra del qual ",React.createElement("em",null,"Teoría general de la ocupación, el interés y el dinero")," (1936), publicada en plena Gran Depres  de mercats, competència, regulació sectorial), l'Economia Ambiental (externalitats, canvi climàtic, desenvolupament sostenible) i l'Economia Conductual (biaixos cognitius, presa de decisions reals)."))),React.createElement(Card,{title:"5. El mètode científic en Economia",icon:"🔬"},React.createElement(TheoryBlock,{title:"5.1. Característiques del mètode científic",color:"purple"},React.createElement("p",null,"El ",React.createElement("strong",null,"mètode científic")," és el procediment sistemàtic que utilitzen les ciències per a adquirir coneixement. Les seues fases fonamentals són: (1) ",React.createElement("strong",null,"observació")," de la realitat i detecció de regularitats, (2) ",React.createElement("strong",null,"formulació d'hipòtesis")," explicatives, (3) ",React.createElement("strong",null,"deducció")," d'implicacions contrastables a partir de les hipòtesis, (4) ",React.createElement("strong",null,"verificació empírica")," (contrastació amb dades) i (5) ",React.createElement("strong",null,"reformulació o acceptació provisional")," de la hipòtesi."),React.createElement("p",null,"En Economia, el mètode científic s'aplica amb certes particularitats derivades de la naturalesa del seu objecte d'estudi. A diferència d'un físic, un economista no pot aïllar variables en un laboratori (excepte en l'Economia experimental, un camp en creixement). A més, els fenòmens econòmics són influïts per expectatives, institucions, cultura i política, la qual cosa afig complexitat a l'anàlisi. Com va assenyalar ",React.createElement("strong",null,"Karl Popper"),", les teories científiques no es poden ",React.createElement("em",null,"verificar")," definitivament, només ",React.createElement("em",null,"falsar"),": una teoria es manté vàlida mentre no siga refutada per l'evidència.")),React.createElement(TheoryBlock,{title:"5.2. Mètode inductiu i mètode deductiu",color:"blue"},React.createElement("p",null,"El ",React.createElement("strong",null,"mètode inductiu")," parteix de l'observació de fets particulars per a arribar a lleis o principis generals. El procés és: observació de casos concrets → detecció de regularitats → formulació d'una llei general. Per exemple, observar que en nombrosos mercats un augment de preu redueix la quantitat demandada permet formular la ",React.createElement("strong",null,"llei de la demanda"),"."),React.createElement("p",null,"El ",React.createElement("strong",null,"mètode deductiu")," segueix el camí invers: parteix d'axiomes, postulats o principis generals acceptats i, mitjançant raonament lògic, deriva conclusions particulars que han de ser contrastades amb la realitat. Per exemple, a partir del supòsit que els consumidors maximitzen la seua utilitat, es dedueix que un augment del preu d'un bé reduirà la seua demanda (efecte substitució)."),React.createElement("p",null,"En la pràctica, l'Economia utilitza ambdós mètodes de forma complementària. El mètode ",React.createElement("strong",null,"hipotètic-deductiu")," (formulació d'hipòtesis → deducció d'implicacions → contrastació empírica) és el més estés en la investigació econòmica contemporània. L'Economia empírica actual, potenciada pel big data i la intel·ligència artificial, ha reforçat el vessant inductiu de la disciplina.")),React.createElement(TheoryBlock,{title:"5.3. Els models econòmics",color:"green"},React.createElement("p",null,"Un ",React.createElement("strong",null,"model econòmic")," és una representació simplificada de la realitat que selecciona les variables rellevants i les relacions causals entre elles, ometent els detalls secundaris. Els models permeten comprendre, explicar i predir fenòmens econòmics. Com va dir ",React.createElement("strong",null,"Joan Robinson"),', "un model que incloguera tota la realitat seria tan inútil com un mapa a escala 1:1".'),React.createElement("p",null,"Els models poden ser ",React.createElement("strong",null,"verbals")," (descripcions lògiques), ",React.createElement("strong",null,"gràfics")," (com la FPP, les corbes d'oferta i demanda, o el model IS-LM) o ",React.createElement("strong",null,"matemàtics")," (equacions i sistemes d'equacions). La FPP, estudiada en l'epígraf anterior, és un exemple paradigmàtic de model gràfic."),React.createElement("p",null,"Una eina fonamental en la construcció de models és el supòsit ",React.createElement("strong",null,React.createElement("em",null,"ceteris paribus"))," (\"mantenint-se tot el demés constant\"). Aquest supòsit permet aïllar l'efecte d'una variable sobre una altra, controlant les restants. Per exemple, en estudiar com afecta un augment del preu d'un bé a la seua quantitat demandada, s'assumeix ",React.createElement("em",null,"ceteris paribus")," que la renda del consumidor, els preus dels altres béns i les preferències romanen constants."),React.createElement("p",null,"Els models també distingeixen entre ",React.createElement("strong",null,"variables endògenes")," (les que el model pretén explicar, com el preu d'equilibri) i ",React.createElement("strong",null,"variables exògenes")," (les que es prenen com a donades, com un canvi en la política fiscal). La qualitat d'un model es jutja per la seua capacitat explicativa i predictiva, no pel seu realisme absolut.")),React.createElement(TheoryBlock,{title:"5.4. El problema de l'experimentació",color:"amber"},React.createElement("p",null,"Una de les principals limitacions del mètode científic en Economia és la ",React.createElement("strong",null,"dificultat d'experimentació"),". No és possible (ni ètic) crear recessions o hiperinflacions en un laboratori per a observar-ne els efectes. Aquesta limitació se supleix de diverses maneres:"),React.createElement("p",null,"(a) ",React.createElement("strong",null,"Anàlisi economètrica"),": ús de tècniques estadístiques avançades per a estimar relacions causals a partir de dades històriques (sèries temporals, dades de tall transversal, dades de panell)."),React.createElement("p",null,"(b) ",React.createElement("strong",null,"Experiments naturals"),": situacions en les quals un canvi exogen (una reforma legislativa, un desastre natural) permet aproximar un experiment controlat. ",React.createElement("strong",null,"David Card")," i ",React.createElement("strong",null,"Joshua Angrist")," (Premis Nobel 2021) han sigut pioners en aquesta metodologia."),React.createElement("p",null,"(c) ",React.createElement("strong",null,"Economia experimental"),": realització d'experiments controlats en laboratori amb participants humans, seguint l'enfocament desenvolupat per ",React.createElement("strong",null,"Vernon Smith")," (Premi Nobel 2002). Els jocs d'ultimàtum, els mercats experimentals i les subhastes són exemples típics."),React.createElement("p",null,"(d) ",React.createElement("strong",null,"Assajos controlats aleatoritzats (RCT)"),": especialment en Economia del Desenvolupament, com els desenvolupats per ",React.createElement("strong",null,"Esther Duflo"),", ",React.createElement("strong",null,"Abhijit Banerjee")," i ",React.createElement("strong",null,"Michael Kremer")," (Premis Nobel 2019)."))),React.createElement(Card,{title:"6. Instruments de l'anàlisi econòmica",icon:"📊"},React.createElement(TheoryBlock,{title:"6.1. Anàlisi gràfica i matemàtica",color:"purple"},React.createElement("p",null,"L'",React.createElement("strong",null,"anàlisi gràfica")," és una eina fonamental en Economia. Els gràfics permeten representar visualment relacions entre variables: corbes d'oferta i demanda, la FPP, funcions de producció, corbes de costs, el model IS-LM, etc. Les relacions poden ser ",React.createElement("strong",null,"directes")," (positives: quan una variable augmenta, l'altra també, com renda i consum) o ",React.createElement("strong",null,"inverses")," (negatives: quan una variable augmenta, l'altra disminueix, com preu i quantitat demandada)."),React.createElement("p",null,"L'",React.createElement("strong",null,"anàlisi matemàtica")," permet formalitzar les relacions econòmiques mitjançant funcions, equacions i sistemes d'equacions. Les funcions de demanda, oferta, producció, costs, utilitat i benefici són expressions algebraiques que permeten calcular òptims (màxims i mínims) mitjançant tècniques de derivació i integració. Els ",React.createElement("strong",null,"models d'optimització")," —maximització d'utilitat subjecta a una restricció pressupostària, minimització de costs subjecta a un nivell de producció— són el nucli de l'anàlisi microeconòmica.")),React.createElement(TheoryBlock,{title:"6.2. Anàlisi estadística i econometria",color:"blue"},React.createElement("p",null,"L'",React.createElement("strong",null,"anàlisi estadística")," proporciona les eines per a descriure, resumir i analitzar dades econòmiques. S'utilitzen distints tipus de dades: ",React.createElement("strong",null,"sèries temporals")," (observacions d'una variable al llarg del temps: PIB trimestral, inflació mensual), ",React.createElement("strong",null,"dades de tall transversal")," (observacions de múltiples unitats en un moment donat: renda per capita dels països de la UE en 2024) i ",React.createElement("strong",null,"dades de panell")," (combinació d'ambdós: PIB per capita de 27 països durant 20 anys)."),React.createElement("p",null,"L'",React.createElement("strong",null,"Econometria")," és la branca de l'Economia que aplica mètodes estadístics i matemàtics per a ",React.createElement("strong",null,"contrastar empíricament")," les teories econòmiques i estimar les relacions entre variables. L'eina bàsica és l'",React.createElement("strong",null,"anàlisi de regressió"),", que permet estimar la relació entre una variable dependent i una o més variables explicatives. L'Econometria moderna inclou tècniques com variables instrumentals, diferències en diferències, regressió discontínua i mètodes de machine learning.")),React.createElement(TheoryBlock,{title:"6.3. El pensament marginal i l'homo economicus",color:"green"},React.createElement("p",null,"El ",React.createElement("strong",null,"pensament marginal")," (o anàlisi marginal) és un dels principis més importants de l'Economia. Consisteix a avaluar les decisions en funció del benefici i el cost d'una unitat addicional (\"en el marge\"). Els conceptes clau són: la ",React.createElement("strong",null,"utilitat marginal")," (satisfacció addicional per consumir una unitat més d'un bé), el ",React.createElement("strong",null,"cost marginal")," (cost addicional de produir una unitat més), l'",React.createElement("strong",null,"ingrés marginal")," (ingrés addicional per vendre una unitat més) i la ",React.createElement("strong",null,"productivitat marginal")," (producció addicional per emprar una unitat més d'un factor)."),React.createElement("p",null,"La regla de decisió òptima estableix que una activitat ha de continuar mentre el ",React.createElement("strong",null,"benefici marginal supere el cost marginal"),", i detindre's quan ambdós s'igualen. Aquesta revolució marginalista, impulsada simultàniament per ",React.createElement("strong",null,"William Stanley Jevons")," (1871), ",React.createElement("strong",null,"Carl Menger")," (1871) i ",React.createElement("strong",null,"León Walras")," (1874), va transformar l'Economia."),React.createElement("p",null,"El model tradicional d'agent econòmic és l'",React.createElement("strong",null,React.createElement("em",null,"homo economicus")),": un individu perfectament racional, egoista, amb informació completa, que maximitza la seua utilitat (si és consumidor) o el seu benefici (si és empresa). Aquest supòsit ha sigut profundament qüestionat per l'",React.createElement("strong",null,"Economia conductual")," (",React.createElement("em",null,"behavioral economics"),"), especialment per ",React.createElement("strong",null,"Daniel Kahneman")," (Premi Nobel 2002), l'obra del qual ",React.createElement("em",null,"Pensar rápido, pensar despacio")," (2011) documenta els biaixos cognitius sistemàtics que allunyen les decisions reals de les prediccions del model racional, i per ",React.createElement("strong",null,"Richard Thaler")," (Premi Nobel 2017), autor de ",React.createElement("em",null,"Nudge")," (2008), que mostra com xicotets \"empentetes\" en el disseny d'opcions poden millorar les decisions sense restringir la llibertat d'elecció."))),React.createElement(Card,{title:"7. Rellevància actual i aplicació docent",icon:"🎓"},React.createElement(TheoryBlock,{title:"7.1. L'Economia en la vida quotidiana",color:"purple"},React.createElement("p",null,"L'Economia impregna tots els aspectes de la vida quotidiana. Cada dia, les persones prenen decisions econòmiques: què comprar amb un pressupost limitat, quant estalviar per a la jubilació, si acceptar o rebutjar una ocupació, com finançar la compra d'un habitatge o quina tarifa energètica contractar. A nivell social, els debats sobre pensions, salaris mínims, tipus impositius, preus de l'habitatge, sostenibilitat ambiental o desigualtat són, en essència, debats econòmics."),React.createElement("p",null,"L'",React.createElement("strong",null,"alfabetització econòmica")," —la capacitat de comprendre conceptes econòmics bàsics i aplicar-los en la presa de decisions— és, per tant, una necessitat ciutadana de primer ordre. Estudis com els d'",React.createElement("strong",null,"Annamaria Lusardi")," i ",React.createElement("strong",null,"Olivia Mitchell")," (2014) demostren que les persones amb major formació econòmica i financera prenen millors decisions d'estalvi, inversió i endeutament, i són menys vulnerables al frau financer.")),React.createElement(TheoryBlock,{title:"7.2. L'Economia en el currículum LOMLOE",color:"blue"},React.createElement("p",null,"La LOMLOE (Llei Orgànica 3/2020) i els seus desenvolupaments curriculars (Reial Decret 217/2022 per a ESO i Reial Decret 243/2022 per a Batxillerat) atorguen a l'Economia un paper rellevant en la formació de l'alumnat. Les matèries específiques inclouen:"),React.createElement("p",null,"- ",React.createElement("strong",null,"Economia i Emprenedoria")," (4t ESO, optativa): introdueix l'alumnat en els conceptes econòmics bàsics i en la cultura emprenedora.",React.createElement("br",null),"- ",React.createElement("strong",null,"Economia")," (1r Batxillerat, modalitat d'Humanitats i Ciències Socials): desenvolupa l'anàlisi micro i macroeconòmica.",React.createElement("br",null),"- ",React.createElement("strong",null,"Empresa i Disseny de Models de Negoci")," (2n Batxillerat): aprofundeix en l'organització empresarial i la innovació.",React.createElement("br",null),"- ",React.createElement("strong",null,"Fonaments d'Administració i Gestió")," (2n Batxillerat, optativa): complement pràctic sobre gestió empresarial."),React.createElement("p",null,"Aquestes matèries contribueixen especialment a les ",React.createElement("strong",null,"competències específiques")," relacionades amb: comprendre el funcionament del sistema econòmic (CE1), analitzar el paper dels agents econòmics (CE2), valorar l'impacte de la globalització (CE3), desenvolupar l'esperit emprenedor (CE4) i fomentar el consum responsable i la sostenibilitat (CE5).")),React.createElement(TheoryBlock,{title:"7.3. Relació amb els ODS i l'Economia conductual",color:"green"},React.createElement("p",null,"L'ensenyament de l'Economia es vincula directament amb els ",React.createElement("strong",null,"Objectius de Desenvolupament Sostenible (ODS)")," de l'Agenda 2030 de Nacions Unides. El Tema 1, en particular, es relaciona amb: l'ODS 1 (Fi de la pobresa), en comprendre l'escassetat com a problema universal; l'ODS 4 (Educació de qualitat), en defensar l'alfabetització econòmica; l'ODS 8 (Treball decent i creixement econòmic), en estudiar els conceptes de producció i productivitat; i l'ODS 10 (Reducció de les desigualtats), en analitzar la distribució de recursos."),React.createElement("p",null,"L'",React.createElement("strong",null,"Economia conductual")," ofereix aplicacions docents especialment motivadores. Els ",React.createElement("em",null,"nudges")," (empentetes) de Thaler i Sunstein, els experiments mentals sobre biaixos cognitius (efecte àncora, aversió a la pèrdua, biaix de confirmació) i els jocs de simulació econòmica permeten connectar la teoria amb l'experiència personal de l'alumnat, fent la matèria més atractiva i significativa. La inclusió d'aquestes perspectives a l'aula contribueix a desenvolupar el ",React.createElement("strong",null,"pensament crític")," i la capacitat de qüestionar les pròpies decisions econòmiques."))),React.createElement(Card,{title:"Conclusió",icon:"✅"},React.createElement("div",{className:"text-sm text-slate-700 leading-relaxed space-y-3"},React.createElement("p",null,"Al llarg d'aquest tema s'ha presentat l'Economia com una ciència social rigorosa l'objecte d'estudi de la qual és l'assignació de recursos escassos entre fins alternatius. La definició de Robbins (1932) continua sent la referència fonamental, complementada per les aportacions de Samuelson, Marshall i Mankiw. El problema econòmic central —l'escassetat— obliga a elegir, i tota elecció implica un cost d'oportunitat que la FPP permet representar gràficament."),React.createElement("p",null,"La distinció entre Microeconomia (comportament individual) i Macroeconomia (variables agregades) estructura el camp d'estudi, amb figures clau com Marshall, Walras i Keynes. El mètode científic en Economia, combinant inducció i deducció, es recolza en models simplificats de la realitat, el supòsit ",React.createElement("em",null,"ceteris paribus")," i un arsenal d'instruments quantitatius (gràfics, estadístiques, econometria) que doten la disciplina de capacitat explicativa i predictiva."),React.createElement("p",null,"L'Economia ha evolucionat significativament en les últimes dècades. La incorporació de l'Economia conductual (Kahneman, Thaler) ha enriquit el model de l'",React.createElement("em",null,"homo economicus")," amb una visió més realista del comportament humà. L'Economia ecològica ha ampliat l'horitzó de la disciplina cap a la sostenibilitat ambiental. I la revolució de les dades (big data, intel·ligència artificial) ha potenciat el vessant empíric de la investigació."),React.createElement("p",null,"Des de la perspectiva docent, el domini d'aquests continguts és essencial per a transmetre a l'alumnat la rellevància de l'Economia en la seua vida diària, formar ciutadans amb criteri econòmic i contribuir al desenvolupament de les competències clau previstes en la LOMLOE. L'Economia, lluny de ser una disciplina abstracta, és una eina indispensable per a comprendre i transformar el món."))),React.createElement(BibliografiaBox,{items:["MANKIW, N.G. (2020): Principios de Economía, 8.ª ed., Cengage Learning.","SAMUELSON, P. y NORDHAUS, W. (2019): Economía, 19.ª ed., McGraw-Hill.","KRUGMAN, P. y WELLS, R. (2020): Introducción a la Economía, 4.ª ed., Reverté.","ROBBINS, L. (1932): An Essay on the Nature and Significance of Economic Science, Macmillan.","MOCHÓN, F. (2021): Economía. Teoría y Política, 7.ª ed., McGraw-Hill.","TORRES LÓPEZ, J. (2020): Economía Política, 6.ª ed., Pirámide.","STIGLITZ, J.E. y WALSH, C.E. (2009): Microeconomía, 4.ª ed., Ariel.","BLANCHARD, O. (2017): Macroeconomía, 7.ª ed., Pearson.","KAHNEMAN, D. (2011): Pensar rápido, pensar despacio, Debate.","THALER, R. y SUNSTEIN, C. (2008): Nudge: Un pequeño empujón, Taurus.","Ley Orgánica 3/2020, de 29 de diciembre (LOMLOE).","Real Decreto 217/2022, de 29 de marzo (currículo ESO).","Real Decreto 243/2022, de 5 de abril (currículo Bachillerato).","INE (Instituto Nacional de Estadística): www.ine.es","Banco de España: Informes económicos, www.bde.es"]})),Tema1Resum=()=>React.createElement("div",{className:"space-y-5 animate-fade"},React.createElement(Card,null,React.createElement("div",{className:"p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"},React.createElement("p",{className:"text-center font-bold text-purple-800 text-lg"},"Tema 1: Economia: ciència de l'escassetat. Objecte i mètode."),React.createElement("p" ,"És fonamental comprendre que l'escassetat econòmica és un concepte ",React.createElement("strong",null,"relatiu"),", no absolut. No significa que un recurs siga rar o inexistent en termes físics, sinó que la seua quantitat disponible és insuficient en relació amb les necessitats que es pretenen satisfer amb ell. L'aigua, per exemple, és abundant al planeta, però és escassa en tant que la demanda d'aigua potable, per a reg, per a indústria i per a ús domèstic supera àmpliament l'oferta disponible en moltes regions. De la mateixa manera, el temps és un recurs absolutament escàs: cada persona disposa de 24 hores al dia, i ha de decidir com distribuir-les entre treball, oci, formació, descans i relacions socials.")),React.createElement(TheoryBlock,{title:"1.2. Escassetat vs. pobresa",color:"blue"},React.createElement("p",null,"Un error conceptual freqüent, especialment entre l'alumnat, és confondre ",React.createElement("strong",null,"escassetat amb pobresa"),". La pobresa és una situació de mancança material que afecta determinats individus o col·lectius; l'escassetat, en canvi, és un fet ",React.createElement("strong",null,"universal")," que afecta totes les societats, incloses les més riques. Un milionari s'enfronta a l'escassetat: la seua fortuna, per gran que siga, és finita, i ha d'elegir com distribuir-la. Un govern amb recursos abundants també s'enfronta a l'escassetat: el pressupost públic és limitat i hi ha més necessitats que recursos per a cobrir-les."),React.createElement("p",null,"Com assenyalava ",React.createElement("strong",null,"Thomas Sowell")," en la seua obra ",React.createElement("em",null,"Economía básica")," (2007): ",React.createElement("em",null,"\"La primera lliçó de l'Economia és l'escassetat: mai no hi ha prou de res per a satisfer completament tots els que ho desitgen. La primera lliçó de la Política és ignorar la primera lliçó de l'Economia.\"")," Aquesta cita il·lustra amb claredat la tensió entre el realisme econòmic i el voluntarisme polític.")),React.createElement(TheoryBlock,{title:"1.3. L'escassetat en perspectiva històrica",color:"green"},React.createElement("p",null,"L'escassetat ha acompanyat la humanitat al llarg de tota la seua història. En les ",React.createElement("strong",null,"societats primitives"),", l'escassetat es manifestava de forma directa: la supervivència depenia de la caça, la recol·lecció i les condicions climàtiques. La ",React.createElement("strong",null,"revolució neolítica")," (cap al 10.000 a.C.) va suposar un primer gran avanç en permetre l'agricultura i la ramaderia, generant excedents alimentaris que van possibilitar l'especialització del treball i el naixement de les primeres civilitzacions."),React.createElement("p",null,"La ",React.createElement("strong",null,"Revolució Industrial")," (segles XVIII-XIX) va multiplicar la capacitat productiva de forma exponencial, però no va eliminar l'escassetat: simplement va transformar la seua naturalesa. Les noves tecnologies van generar necessitats abans inexistents (transport, comunicacions, energia) i van ampliar la bretxa entre el que la humanitat desitjava i el que podia produir. En el segle XXI, la ",React.createElement("strong",null,"revolució digital")," i la ",React.createElement("strong",null,"intel·ligència artificial")," estan generant una nova ona de transformació productiva, però l'escassetat persisteix: els recursos naturals, el temps, l'atenció i el capital humà qualificat continuen sent limitats."),React.createElement("p",null,"Resulta rellevant assenyalar que el concepte d'escassetat també s'aplica a béns immaterials en l'era digital. Encara que el cost marginal de reproduir un arxiu digital és pràcticament zero, l'",React.createElement("strong",null,"atenció humana")," és un recurs escàs (com ha analitzat ",React.createElement("strong",null,"Herbert Simon"),", Premi Nobel 1978): en un món d'informació abundant, l'escassetat es desplaça cap a la capacitat de processar-la."))),React.createElement(Card,{title:"2. Les necessitats humanes i els recursos",icon:"🧩"},React.createElement(TheoryBlock,{title:"2.1. Les necessitats: concepte i evolució",color:"purple"},React.createElement("p",null,"Les ",React.createElement("strong",null,"necessitats humanes")," són el motor de tota activitat econòmica. Es defineixen com la sensació de mancança unida al desig de satisfer-la. Les seues característiques fonamentals ja es van enumerar en el Tema 1: són il·limitades, jerarquitzables, complementàries, recurrents i culturalment condicionades."),React.createElement("p",null,"Les necessitats evolucionen històricament. En les societats preindustrials, les necessitats dominants eren de subsistència (alimentació, vestit, refugi). Amb el desenvolupament econòmic, han sorgit necessitats cada vegada més sofisticades: educació superior, connectivitat digital, viatges internacionals, serveis de salut mental, entreteniment, identitat de marca. L'economista ",React.createElement("strong",null,"John Kenneth Galbraith"),", en ",React.createElement("em",null,"La sociedad opulenta")," (1958), va alertar sobre el fenomen de les ",React.createElement("strong",null,"necessitats creades"),": en les economies avançades, bona part de les necessitats són induïdes per la publicitat i el sistema productiu, la qual cosa qüestiona la idea que la demanda és sobirana i autònoma.")),React.createElement(TheoryBlock,{title:"2.2. Classificació de les necessitats",color:"blue"},React.createElement("p",null,"Les principals classificacions de les necessitats són:"),React.createElement("p",null,React.createElement("strong",null,"Segons la seua naturalesa:")," primàries o bàsiques (imprescindibles per a la supervivència: alimentació, vestit, habitatge, salut) i secundàries o de civilització (milloren la qualitat de vida: oci, cultura, viatges, tecnologia)."),React.createElement("p",null,React.createElement("strong",null,"Segons el subjecte:")," individuals (menjar, vestir-se, dormir) i col·lectives (transport públic, seguretat ciutadana, justícia, defensa nacional)."),React.createElement("p",null,React.createElement("strong",null,"Segons l'horitzó temporal:")," presents (satisfacció immediata: menjar quan es té fam) i futures (estalvi per a la jubilació, inversió en educació)."),React.createElement("p",null,"La classificació més influent continua sent la ",React.createElement("strong",null,"piràmide de Maslow")," (1943), ja descrita en el Tema 1. No obstant això, convé assenyalar les seues ",React.createElement("strong",null,"limitacions"),": la jerarquia no és rígida (un artista pot sacrificar necessitats fisiològiques per l'autorealització), presenta un biaix individualista occidental (en cultures col·lectivistes, les necessitats socials poden precedir les d'estima) i ha sigut parcialment revisada pel propi camp de la psicologia motivacional (vegeu la teoria de l'autodeterminació de ",React.createElement("strong",null,"Deci i Ryan"),", 1985).")),React.createElement(TheoryBlock,{title:"2.3. Els recursos productius (factors de producció)",color:"green"},React.createElement("p",null,"Els ",React.createElement("strong",null,"recursos productius")," o ",React.createElement("strong",null,"factors de producció")," són els inputs que s'utilitzen per a produir béns i serveis. La classificació clàssica distingeix quatre factors:"),React.createElement("p",null,React.createElement("strong",null,"1. Terra (o recursos naturals):")," comprén tots els recursos proporcionats per la naturalesa: sòl agrícola, jaciments minerals, aigua, boscos, energia solar, etc. La seua retribució és la ",React.createElement("strong",null,"renda"),". Els fisiòcrates (segle XVIII), liderats per François Quesnay, consideraven la terra com l'única font de riquesa."),React.createElement("p",null,React.createElement("strong",null,"2. Treball:")," és l'aportació física i intel·lectual de les persones al procés productiu. La seua retribució és el ",React.createElement("strong",null,"salari"),". El factor treball no és homogeni: varia en qualificació, experiència, creativitat i motivació."),React.createElement("p",null,React.createElement("strong",null,"3. Capital:")," comprén els béns produïts que s'utilitzen per a produir altres béns: maquinària, eines, fàbriques, infraestructures de transport, programari. La seua retribució és l'",React.createElement("strong",null,"interés")," (o benefici del capital). No s'ha de confondre el capital físic (béns de producció) amb el capital financer (diners disponibles per a invertir)."),React.createElement("p",null,React.createElement("strong",null,"4. Iniciativa empresarial (o factor empresarial):")," és la capacitat d'organitzar i coordinar els altres factors de producció, assumint riscos i buscant oportunitats de negoci. La seua retribució és el ",React.createElement("strong",null,"benefici"),". ",React.createElement("strong",null,"Joseph Schumpeter"),' (1942) va destacar el paper de l\'empresari innovador com a motor de la "destrucció creativa" i del progrés econòmic.')),React.createElement(TheoryBlock,{title:"2.4. La tecnologia i el capital humà",color:"amber"},React.createElement("p",null,"La ",React.createElement("strong",null,"tecnologia")," actua com un multiplicador dels recursos productius. Una millora tecnològica permet obtindre més producció amb la mateixa quantitat de factors (o la mateixa producció amb menys factors). La tecnologia no és un factor de producció en sentit estricte, sinó un element que ",React.createElement("strong",null,"potencia l'eficiència")," de tots els altres factors. La Revolució Industrial, l'electrificació, la informatització i l'actual revolució de la intel·ligència artificial són exemples històrics d'onades tecnològiques que han transformat radicalment la capacitat productiva."),React.createElement("p",null,"El concepte de ",React.createElement("strong",null,"capital humà"),", desenvolupat per ",React.createElement("strong",null,"Gary Becker")," (1930-2014) en la seua obra ",React.createElement("em",null,"Human Capital")," (1964, 3a ed. 1993), es refereix al conjunt de coneixements, habilitats, experiència i capacitats que posseeixen les persones i que augmenten la seua productivitat. La inversió en capital humà —a través de l'educació, la formació professional, la sanitat i l'experiència laboral— és un dels principals motors del creixement econòmic a llarg termini, com va demostrar ",React.createElement("strong",null,"Robert Solow"),' (Premi Nobel 1987) en el seu model de creixement neoclàssic (1956), on el "residu de Solow" (progrés tècnic) explica la major part del creixement no atribuïble a l\'acumulació de capital físic.'),React.createElement("p",null,React.createElement("strong",null,"Theodore Schultz")," (Premi Nobel 1979), contemporani de Becker, va ser pioner a considerar l'educació com una inversió i no com una despesa, amb rendiments tant privats (majors salaris) com socials (major productivitat, menor delinqüència, millor salut pública). Aquesta perspectiva és especialment rellevant per a la pràctica docent: el professor d'Economia contribueix directament a la formació de capital humà."))),React.createElement(Card,{title:"3. L'elecció econòmica",icon:"🤔"},React.createElement(TheoryBlock,{title:"3.1. Les tres preguntes fonamentals",color:"purple"},React.createElement("p",null,"Davant l'escassetat, tota societat ha de respondre a ",React.createElement("strong",null,"tres preguntes fonamentals"),":"),React.createElement("p",null,React.createElement("strong",null,"Què produir?")," És a dir, quins béns i serveis s'han de produir i en quines quantitats. Més sanitat o més defensa? Més cotxes o més bicicletes? Més habitatge o més investigació? Aquesta decisió implica elegir i, per tant, renunciar."),React.createElement("p",null,React.createElement("strong",null,"Com produir?")," Amb quina combinació de factors productius i amb quina tecnologia. Producció intensiva en treball (més ocupació) o intensiva en capital (més maquinària)? Agricultura ecològica o convencion anisme de les economies capitalistes. ",React.createElement("strong",null,"Adam Smith")," (1776) va descriure aquest procés com la ",React.createElement("em",null,'"mà invisible"'),": cada individu, en perseguir el seu interés propi, contribueix inconscientment al benestar col·lectiu.")),React.createElement(TheoryBlock,{title:"3.3. Racionalitat econòmica i les seues crítiques",color:"green"},React.createElement("p",null,"El model econòmic estàndard assumeix que els agents actuen amb ",React.createElement("strong",null,"racionalitat econòmica"),": els consumidors maximitzen la seua utilitat i les empreses maximitzen el seu benefici, ambdós sobre la base d'informació completa i preferències estables. L'",React.createElement("strong",null,"anàlisi marginal")," és l'eina fonamental de la racionalitat econòmica: un agent racional continua una activitat mentre el benefici marginal supere el cost marginal."),React.createElement("p",null,"No obstant això, el supòsit de racionalitat perfecta ha sigut profundament qüestionat:"),React.createElement("p",null,React.createElement("strong",null,"Herbert Simon")," (Premi Nobel 1978) va proposar el concepte de ",React.createElement("strong",null,"racionalitat limitada")," (",React.createElement("em",null,"bounded rationality"),'): els agents no optimitzen sinó que busquen solucions "prou bones" (',React.createElement("em",null,"satisficing"),"), perquè la seua capacitat cognitiva, el seu temps i la seua informació són limitats."),React.createElement("p",null,React.createElement("strong",null,"Daniel Kahneman")," i ",React.createElement("strong",null,"Amos Tversky")," (1979) van demostrar l'existència de ",React.createElement("strong",null,"biaixos cognitius")," sistemàtics que allunyen les decisions reals de les prediccions del model racional: l'aversió a la pèrdua (les pèrdues pesen més que els guanys equivalents), l'efecte àncora (les primeres xifres rebudes condicionen la valoració), el biaix de disponibilitat (se sobreestimen el reen"},React.createElement("p",null,"El ",React.createElement("strong",null,"pendent de la FPP")," en cada punt mesura el cost d'oportunitat de produir una unitat addicional d'un bé en termes de l'altre. Aquest pendent es denomina ",React.createElement("strong",null,"Relació Marginal de Transformació (RMT)")," i s'expressa com:")),React.createElement(FormulaBox,{formula:"RMT = |ΔY / ΔX| = Coste de oportunidad de una unidad adicional de X en términos de Y",desc:"La RMT mesura quantes unitats de Y cal sacrificar per a obtindre una unitat més de X"}),React.createElement(TheoryBlock,{title:"5.4. Concavitat de la FPP: costs d'oportunitat creixents",color:"amber"},React.createElement("p",null,"La FPP presenta normalment una forma ",React.createElement("strong",null,"còncava respecte a l'origen")," (convexa vista des de fora), la qual cosa reflecteix la ",React.createElement("strong",null,"llei de costs d'oportunitat creixents"),": a mesura que es produeix més d'un bé, el cost d'oportunitat de cada unitat addicional d'aqueix bé és creixent. Això es deu al fet que els factors de producció ",React.createElement("strong",null,"no són igualment aptes")," per a la producció d'ambdós béns."),React.createElement("p",null,"Per exemple, si una economia produeix aliments i ordinadors: els primers recursos que es reassignen d'aliments a ordinadors seran els més aptes per a la indústria tecnològica (enginyers, fàbriques de components), per la qual cosa el cost d'oportunitat inicial és baix. Però a mesura que es destinen més recursos a ordinadors, caldrà emprar recursos cada vegada menys aptes (agricultors, terres de conreu reconvertides), amb la qual cosa el cost d'oportunitat serà cada vegada major. Aquesta és una manifestació de la ",React.createElement("strong",null,"llei de rendiments decreixents"),"."),React.createElement("p",null,"En el cas particular que els recursos foren ",React.createElement("strong",null,"perfectament substituïbles")," (igualment aptes per a ambdós béns), l rong",null,"William Petty"),"."),React.createElement("p",null,"La tesi central del mercantilisme era que la ",React.createElement("strong",null,"riquesa d'una nació es mesura per l'acumulació de metalls preciosos")," (or i plata). En conseqüència, la política econòmica havia d'orientar-se a aconseguir una ",React.createElement("strong",null,"balança comercial favorable"),": exportar més que importar, perquè la diferència es compensara amb una entrada neta de metalls. Esta doctrina justificava el proteccionisme aranzelari, el foment de les manufactures nacionals, l'establiment de companyies comercials amb monopoli i l'explotació de les colònies com a fonts de matèries primeres i mercats captius."),React.createElement("p",null,"El mercantilisme també defensava una ",React.createElement("strong",null,"intervenció activa de l'Estat")," en l'economia, regulant preus, salaris, moviments de metalls i comerç exterior. Des de la perspectiva moderna, el mercantilisme patia d'una confusió entre diners i riquesa (l'anomenada ",React.createElement("em",null,"fal·làcia mercantilista"),", criticada posteriorment per Hume i Smith) i d'una visió de l'economia com a joc de suma zero: el que una nació guanyava, una altra ho perdia. No obstant això, alguns dels seus instruments —protecció d'indústries naixents, política industrial activa— han sigut reivindicats per economistes com ",React.createElement("strong",null,"Friedrich List")," (segle XIX) i, més recentment, per ",React.createElement("strong",null,"Ha-Joon Chang")," i l'escola estructuralista llatinoamericana.")),React.createElement(TheoryBlock,{title:"1.2. La fisiocràcia (segle XVIII)",color:"green"},React.createElement("p",null,"La ",React.createElement("strong",null,"fisiocràcia")," (del grec ",React.createElement("em",null,"physis"),", naturalesa, i ",React.createElement("em",null,"kratos"),', govern: "govern de la naturalesa") és considerada la primera escola pròpiament econòmica. Va sorgir a França a mitjan segle XVIII co ,React.createElement("strong",null,"treball socialment necessari")," per a produir-les. Tanmateix, el treballador rep com a salari sols una part del valor que produeix: la diferència —el ",React.createElement("strong",null,"plusvalor")," o ",React.createElement("em",null,"plusvàlua")," (",React.createElement("em",null,"Mehrwert"),")— és apropiada pel capitalista, i constitueix la font del benefici."),React.createElement("p",null,"El ",React.createElement("strong",null,"materialisme històric")," és la filosofia de la història que sustenta l'anàlisi de Marx. Segons esta concepció, l'",React.createElement("strong",null,"estructura econòmica")," (les relacions de producció: qui posseeix els mitjans de producció i qui treballa) determina la ",React.createElement("strong",null,"superestructura")," (les institucions polítiques, jurídiques, culturals i ideològiques). La història avança a través de la ",React.createElement("strong",null,"lluita de classes"),": esclavistes enfront d'esclaus, senyors feudals enfront de serfs, burgesos (capitalistes) enfront de proletaris (treballadors). Cada mode de producció conté en el seu interior les ",React.createElement("strong",null,"contradiccions")," que condueixen a la seua transformació.")),React.createElement(TheoryBlock,{title:"3.2. Les prediccions de Marx i el seu llegat",color:"pink"},React.createElement("p",null,"Marx va predir que el capitalisme es destruiria a si mateix a través d'una sèrie de ",React.createElement("strong",null,"crisis recurrents"),", causades per la ",React.createElement("strong",null,"tendència decreixent de la taxa de guany")," (a mesura que els capitalistes substitueixen treball per maquinària, la font de plusvàlua es redueix), la ",React.createElement("strong",null,"concentració del capital")," (els grans capitals absorbeixen els xicotets) i la ",React.createElement("strong",null,"pauperització del proletariat")," (els salaris tendeixen a la mera subsistència). La revolució proletària donaria pas al soc rminants de la productivitat")," són: el ",React.createElement("strong",null,"capital humà")," (nivell educatiu i formació dels treballadors, Becker/Schultz); la ",React.createElement("strong",null,"inversió en capital físic")," (maquinària, infraestructures, tecnologia); la ",React.createElement("strong",null,"innovació tecnològica")," (I+D+i, patents, digitalització); la ",React.createElement("strong",null,"qualitat institucional")," (Estat de dret, protecció de la propietat, regulació eficient, North/Acemoglu); les ",React.createElement("strong",null,"economies d'escala")," (reducció de costos en augmentar la producció); el ",React.createElement("strong",null,"comerç internacional")," (accés a mercats, competència, difusió tecnològica); i l'",React.createElement("strong",null,"eficiència del mercat de treball")," (flexibilitat, mobilitat, formació contínua).")),React.createElement(TheoryBlock,{title:"6.3. El cost laboral unitari (CLU) i la productivitat a Espanya",color:"amber"},React.createElement("p",null,"El ",React.createElement("strong",null,"cost laboral unitari (CLU)")," mesura el cost del treball per unitat de producció i és un indicador clau de la competitivitat:")),React.createElement(FormulaBox,{formula:"CLU = Cost laboral per treballador / Productivitat del treball = (W/L) / (Q/L) = W/Q",desc:"On: W = cost laboral total, L = nombre de treballadors, Q = producció"}),React.createElement(TheoryBlock,{color:"amber"},React.createElement("p",null,"Si els salaris creixen més ràpidament que la productivitat, el CLU augmenta i l'economia perd competitivitat. Si la productivitat creix més que els salaris, el CLU disminueix i la competitivitat millora. La ",React.createElement("strong",null,"productivitat del treball a Espanya")," ha crescut de forma modesta en les últimes dècades, per davall de la mitjana de la UE i molt lluny dels països líders (Alemanya, França, Països Baixos). Les principals causes d'este baix creixement són: l'elevada proporció d'empreses xicotetes (menys productives que les grans), la temporalitat de l'ocupació (que desincentiva la inversió en formació), la insuficient inversió en I+D+i, el pes del sector de la construcció (baixa productivitat) i les debilitats del sistema educatiu.")),React.createElement(TheoryBlock,{title:"6.4. El model de creixement de Solow",color:"purple"},React.createElement("p",null,"El ",React.createElement("strong",null,"model de Solow")," (",React.createElement("em",null,"A Contribution to the Theory of Economic Growth"),", 1956, Premi Nobel 1987) és el model de referència per a l'anàlisi del creixement econòmic. La seua equació fonamental és:")),React.createElement(FormulaBox,{formula:"Y = A · f(K, L)",desc:"On: Y = producció, A = productivitat total dels factors (PTF), K = capital, L = treball"}),React.createElement(TheoryBlock,{color:"purple"},React.createElement("p",null,"Solow va demostrar que l'acumulació de capital físic té ",React.createElement("strong",null,"rendiments decreixents"),": a mesura que s'acumula més capital per treballador, cada unitat addicional de capital aporta menys producció. En conseqüència, l'acumulació de capital no pot sostindre el creixement indefinidament; a llarg termini, l'economia convergeix cap a un ",React.createElement("strong",null,"estat estacionari")," en el qual el creixement per càpita depén exclusivament del ",React.createElement("strong",null,"progrés tecnològic")," (la PTF, el paràmetre A). Este resultat fonamental explica per què la inversió en I+D+i i en capital humà és la clau del creixement sostingut."))),React.createElement(Card,{title:"7. Eficiència tècnica i eficiència econòmica",icon:"⚖️"},React.createElement(TheoryBlock,{title:"7.1. Definicions i distinció",color:"cyan"},React.createElement("p",null,"L'",React.createElement("strong",null,"eficiència tècnica")," es refereix a la capacitat d'obtindre la màxima producció possible a partir d'una combinació donada de factors (o, equivalentment, d'utilitzar la mínima quantitat de factors per a assolir un nivell de producció donat). Una empresa és tècnicament eficient si opera ",React.createElement("strong",null,"sobre")," la funció de producció, és a dir, si no malbarata recursos. Una empresa que opera ",React.createElement("strong",null,"per davall")," de la funció de producció és tècnicament ineficient."),React.createElement("p",null,"L'",React.createElement("strong",null,"eficiència econòmica")," incorpora, a més, els ",React.createElement("strong",null,"preus dels factors"),". Entre totes les combinacions tècnicament eficients (és a dir, que estan sobre la funció de producció), l'econòmicament eficient és aquella que minimitza el cost total. Una tècnica pot ser tècnicament eficient però no econòmicament eficient si existeix una altra combinació de factors que produeix el mateix a menor cost. L'elecció depén dels ",React.createElement("strong",null,"preus relatius")," dels factors: en un país amb treball abundant i barat (com l'Índia o Bangladesh), serà econòmicament eficient utilitzar tècniques intensives en treball; en un país amb capital abundant i treball car (com Alemanya o el Japó), serà més eficient utilitzar tècniques intensives en capital.")),React.createElement(TheoryBlock,{title:"7.2. La Frontera de Possibilitats de Producció (FPP) com a expressió de l'eficiència",color:"green"},React.createElement("p",null,"La ",React.createElement("strong",null,"Frontera de Possibilitats de Producció (FPP)"),", estudiada al Tema 2, és una expressió macroeconòmica de l'eficiència: els punts sobre la FPP són tècnicament eficients (s'utilitzen tots els recursos disponibles), mentre que els punts interiors són ineficients (hi ha recursos desocupats o mal assignats). El creixement econòmic —representat per un desplaçament cap a fora de la FPP— requereix un augment dels factors productius (més treball, més capital) o un increment de la productivitat (progrés tecnològic, millor capital humà, millors institucions).")),React.createElement(TheoryBlock,{title:"7.3. Aplicació docent i connexió amb el Tema 7",color:"amber"},React.createElement("p",null,"La distinció entre eficiència tècnica i econòmica és fonamental per a l'ensenyament de l'economia empresarial. A l'aula, esta distinció pot il·lustrar-se amb exemples senzills: què és més eficient per a construir una carretera, utilitzar molts treballadors amb ferramentes manuals o pocs treballadors amb maquinària pesant? La resposta depén dels preus relatius del treball i del capital en cada país. Este tipus d'anàlisi connecta directament amb el Tema 7 (economies d'escala i productivitat) i amb els continguts d'Empresa i Disseny de Models de Negoci (2n de Batxillerat)."),React.createElement("p",null,"Les activitats didàctiques poden incloure: càlcul de PT, PMe i PMg a partir de taules numèriques; representació gràfica de les tres fases de la producció; comparació de la productivitat de distints països (dades OCDE, Eurostat, Banc Mundial); i debats sobre els factors que expliquen les diferències de productivitat entre Espanya i els països líders de la UE."))),React.createElement(Card,{title:"Conclusió",icon:"✅"},React.createElement("div",{className:"text-sm text-slate-700 leading-relaxed space-y-3"},React.createElement("p",null,"Els factors productius —terra, treball, capital, capital humà, tecnologia i iniciativa empresarial— constitueixen la base de tota activitat econòmica. La seua anàlisi rigorosa permet comprendre com es genera la producció, com es retribueixen els factors, quines són les fonts del creixement econòmic i per què uns països són més rics que altres."),React.createElement("p",null,"La funció de producció, com a relació tècnica entre inputs i outputs, proporciona el marc analític per a estudiar la productivitat marginal, els rendiments decreixents a curt termini i els rendiments a escala a llarg termini. La funció Cobb-Douglas, la llei de rendiments decreixents i el model de Solow són ferramentes fonamentals de l'anàlisi econòmica que el futur e d'unitats venudes."),React.createElement("p",null,React.createElement("strong",null,"Administratives:")," la ",React.createElement("strong",null,"divisió del treball gerencial")," permet que els directius s'especialitzen en àrees funcionals (finances, màrqueting, producció, recursos humans), cosa que augmenta l'eficiència de la gestió. Les empreses xicotetes, en canvi, solen concentrar múltiples funcions en unes poques persones."),React.createElement("p",null,React.createElement("strong",null,"De risc:")," les grans empreses poden ",React.createElement("strong",null,"diversificar")," les seues activitats (productes, mercats, àrees geogràfiques), cosa que redueix l'impacte d'una caiguda en un mercat específic. La diversificació permet compensar pèrdues en unes àrees amb beneficis en altres.")),React.createElement(TheoryBlock,{title:"5.3. Economies d'escala externes",color:"green"},React.createElement("p",null,"Les economies d'escala ",React.createElement("strong",null,"externes")," són aquelles que beneficien les empreses com a conseqüència del ",React.createElement("strong",null,"creixement del sector o de la zona geogràfica")," en què operen, i no de la dimensió individual de cada empresa."),React.createElement("p",null,React.createElement("strong",null,"Alfred Marshall")," (1890) va identificar tres fonts principals d'economies externes en els ",React.createElement("strong",null,"districtes industrials"),":"),React.createElement("p",null,React.createElement("strong",null,"Aglomeració:")," la concentració d'empreses del mateix sector en una zona geogràfica genera una ",React.createElement("strong",null,"borsa de treballadors especialitzats")," que beneficia totes les empreses (facilitat de contractació, menors costos de cerca, major mobilitat laboral)."),React.createElement("p",null,React.createElement("strong",null,"Proveïdors especialitzats:")," la concentració d'empreses atrau ",React.createElement("strong",null,"proveïdors especialitzats")," d'inputs, components, serveis auxiliars (manteniment, logística, consultoria) i equipament, cosa que redueix costos i millora la qualitat per a totes les empreses del districte."),React.createElement("p",null,React.createElement("strong",null,"Difusió del coneixement (",React.createElement("em",null,"knowledge spillovers"),"):")," la proximitat geogràfica facilita la ",React.createElement("strong",null,"transmissió informal d'idees"),", coneixements tècnics i innovacions entre empreses, treballadors i investigadors. Com va escriure Marshall: ",React.createElement("em",null,"\"Els misteris de l'ofici deixen de ser misteris; estan, per dir-ho així, en l'aire\""),"."),React.createElement("p",null,"Exemples actuals de districtes industrials amb economies externes són ",React.createElement("strong",null,"Silicon Valley")," (tecnologia), la ",React.createElement("strong",null,"City de Londres")," (finances), la ",React.createElement("strong",null,"comarca del Vinalopó")," (calçat a Alacant), ",React.createElement("strong",null,"Igualada")," (adobats a Barcelona) i la ",React.createElement("strong",null,"Foia de Castalla")," (joguet a Alacant)."))),React.createElement(Card,{title:"6. Deseconomies d'escala i dimensió òptima",icon:"📉"},React.createElement(TheoryBlock,{title:"6.1. Deseconomies d'escala",color:"red"},React.createElement("p",null,"Les ",React.createElement("strong",null,"deseconomies d'escala")," es produeixen quan el cost mitjà ",React.createElement("strong",null,"augmenta")," a mesura que l'empresa creix més enllà d'una certa dimensió. A partir d'un determinat volum de producció, els costos de coordinació, comunicació i gestió superen els avantatges de la major dimensió:"),React.createElement("p",null,React.createElement("strong",null,"Burocràcia:")," les organitzacions molt grans desenvolupen estructures jeràrquiques complexes, amb múltiples nivells de direcció, que alenteixen la presa de decisions, generen ineficiències i augmenten els costos administratius."),React.createElement("p",null,React.createElement("strong",null,"Problemes de coordinació:")," a mesura que l'empresa creix, resulta més difícil coordinar les activitats de milers de treballadors, departaments i filials. Els costos de comunicació interna, supervisió i control de qualitat augmenten de forma més que proporcional."),React.createElement("p",null,React.createElement("strong",null,"Desmotivació:")," en les grans organitzacions, els treballadors poden sentir-se com a ",React.createElement("em",null,"peces anònimes")," d'un engranatge, cosa que redueix la seua implicació, la seua iniciativa i la seua productivitat. Els problemes d'",React.createElement("strong",null,"agència")," (divergència d'interessos entre propietaris i gestors, o entre directius i empleats) s'agreugen amb la dimensió."),React.createElement("p",null,React.createElement("strong",null,"Rigidesa:")," les grans empreses tendeixen a ser menys àgils per a adaptar-se als canvis del mercat, a les noves tecnologies o a les preferències canviants dels consumidors.")),React.createElement(TheoryBlock,{title:"6.2. La corba de cost mitjà a llarg termini i la dimensió mínima eficient",color:"blue"},React.createElement("p",null,"La ",React.createElement("strong",null,"corba de cost mitjà a llarg termini (CMeLT)")," té forma d'",React.createElement("strong",null,"U"),": descendeix mentre actuen les economies d'escala, arriba a un mínim i ascendeix quan predominen les deseconomies. El punt mínim de la corba CMeLT correspon a la ",React.createElement("strong",null,"dimensió mínima eficient (DME)"),": el nivell de producció a partir del qual l'empresa ha esgotat les economies d'escala i opera al menor cost mitjà possible."),React.createElement("p",null,"La ",React.createElement("strong",null,"DME")," té implicacions fonamentals per a l'",React.createElement("strong",null,"estructura de mercat"),":"),React.createElement("p",null,"Si la DME és ",React.createElement("strong",null,"gran")," en relació amb la dimensió del mercat, només caben poques empreses eficients → tendència a l'",React.createElement("strong",null,"oligopoli")," o fins i tot al ",React.createElement("strong",null,"monopoli natural")," (distribució d'aigua, xarxa elèctrica, ferrocarril). En aquests casos, és més eficient que una sola empresa servisca tot el mercat que tindre'n diverses competint."),React.createElement("p",null,"Si la DME és ",React.createElement("strong",null,"xicoteta")," en relació amb la dimensió del mercat, caben moltes empreses eficients → tendència a la ",React.createElement("strong",null,"competència")," (restaurants, perruqueries, comerç minorista).")),React.createElement(TheoryBlock,{title:"6.3. PIMES vs. grans empreses",color:"green"},React.createElement("p",null,"El debat entre els avantatges de les ",React.createElement("strong",null,"PIMES")," (xicotetes i mitjanes empreses) i les ",React.createElement("strong",null,"grans empreses")," és recurrent en l'economia espanyola, on les PIMES representen més del 99 % del teixit empresarial i generen aproximadament el 65 % de l'ocupació."),React.createElement("p",null,"Les ",React.createElement("strong",null,"grans empreses")," gaudeixen d'economies d'escala (menors costos unitaris), major capacitat d'I+D+i, accés a mercats internacionals, poder de negociació amb proveïdors i finançadors, i capacitat d'atraure talent. Les ",React.createElement("strong",null,"PIMES"),", per la seua banda, són més ",React.createElement("strong",null,"flexibles"),", més ",React.createElement("strong",null,"àgils")," per a adaptar-se als canvis, generen major ",React.createElement("strong",null,"proximitat")," amb el client, tenen menors problemes burocràtics i de coordinació, i solen ser el brou de cultiu de la ",React.createElement("strong",null,"innovació disruptiva"),"."),React.createElement("p",null,"En la pràctica, la dimensió òptima depèn del ",React.createElement("strong",null,"sector"),": en la indústria de l'automòbil, la siderúrgia o les telecomunicacions, les economies d'escala són enormes i la DME exigeix grans corporacions. En l'hostaleria, l'artesania, el comerç de proximitat o els serveis professionals, la DME és xicoteta i les PIMES són perfectament competitives. La política econòmica ha d'evitar, per tant, un enfocament únic i adaptar els instruments de suport a les característiques de cada sector."))),React.createElement(Card,{title:"7. Relevancia actual y aplicación docente",icon:"🎓"},React.createElement(TheoryBlock,{title:"7.1. La productivitat com a repte de l'economia espanyola",color:"purple"},React.createElement("p",null,"La ",React.createElement("strong",null,"productivitat")," és, sense dubte, el ",React.createElement("strong",null,"principal repte")," de l'economia espanyola. Mentre que l'economia espanyola ha demostrat capacitat per a crear ocupació en les fases expansives del cicle, la productivitat per hora treballada ha crescut a un ritme inferior al dels principals socis europeus. Aquesta bretxa s'explica per una combinació de factors: inversió insuficient en I+D+i, pes excessiu de sectors de baixa productivitat (construcció, hostaleria), reduïda dimensió mitjana de les empreses (predomini de microempreses amb baixa productivitat), dèficits de capital humà (desajust entre formació i necessitats del mercat) i marge de millora en la qualitat institucional.")),React.createElement(TheoryBlock,{title:"7.2. Indústria 4.0, automatització i teletreball",color:"blue"},React.createElement("p",null,"La ",React.createElement("strong",null,"Indústria 4.0")," —la quarta revolució industrial, basada en la digitalització, la intel·ligència artificial, la robòtica, l'Internet de les Coses (IoT) i l'anàlisi de big data— està transformant radicalment els processos productius i la productivitat. L'automatització de tasques rutinàries (tant manuals com cognitives) permet enormes guanys d'eficiència, però planteja desafiaments per a l'ocupació: les tasques més susceptibles d'automatització són les repetitives i codificables, mentre que les tasques creatives, d'interacció social complexa i de resolució de problemes ambigus són més difícils d'automatitzar (",React.createElement("strong",null,"David Autor"),", 2015)."),React.createElement("p",null,"El ",React.createElement("strong",null,"teletreball"),", accelerat per la pandèmia de COVID-19, ha demostrat que, en molts sectors de serveis, és possible mantindre o fins i tot augmentar la productivitat sense la presència física a l'oficina. No obstant això, els efectes són heterogenis: el teletreball pot millorar la conciliació i reduir els desplaçaments, però també pot generar aïllament, dificultats de coordinació i dilució de la cultura organitzativa.")),React.createElement(TheoryBlock,{title:"7.3. Economia digital: economies d'escala extremes",color:"green"},React.createElement("p",null,"L'",React.createElement("strong",null,"economia digital")," presenta ",React.createElement("strong",null,"economies d'escala extremes"),": els costos fixos de desenvolupament d'un programari, una plataforma o un contingut digital són elevats, però els ",React.createElement("strong",null,"costos marginals de reproducció i distribució són propers a zero"),". ",React.createElement("strong",null,"Jeremy Rifkin")," (",React.createElement("em",null,"La societat de cost marginal zero"),", 2014) argumenta que aquesta dinàmica està transformant l'estructura de l'economia: les plataformes digitals (Google, Amazon, Netflix, Spotify) poden servir milers de milions d'usuaris sense costos addicionals significatius, cosa que genera tendències naturals al monopoli o a l'oligopoli."),React.createElement("p",null,"Les ",React.createElement("strong",null,"economies de xarxa")," (també anomenades ",React.createElement("strong",null,"externalitats de xarxa"),") reforcen aquestes economies d'escala: el valor d'una plataforma per a cada usuari augmenta amb el nombre total d'usuaris (WhatsApp, Facebook, LinkedIn). Aquestes dinàmiques plantegen desafiaments regulatoris ,React.createElement("p",null,"La productivitat —mesurada com la relació entre producció i factors emprats— és la variable clau que determina el nivell de vida d'un país a llarg termini. Els seus determinants fonamentals (capital físic, capital humà, progrés tecnològic, qualitat institucional) marquen l'agenda de política econòmica de qualsevol govern que aspire a millorar el benestar dels seus ciutadans. El model de Solow demostra que, a llarg termini, només el progrés tecnològic pot sostindre el creixement, cosa que atorga a la inversió en I+D+i, educació i innovació un caràcter estratègic."),React.createElement("p",null,"Les economies d'escala expliquen per què determinats sectors tendeixen a la concentració empresarial i per què les grans empreses coexisteixen amb les PIMES en una economia diversa. La dimensió mínima eficient, les deseconomies d'escala i la distinció entre economies internes i externes proporcionen un marc analític rigorós per a comprendre l'estructura empresarial i de mercat."),React.createElement("p",null,"Al segle XXI, la revolució digital, la intel·ligència artificial i les economies d'escala extremes de les plataformes estan redefinint els conceptes clàssics de productivitat i escala. El futur docent d'Economia ha de dominar aquests conceptes fonamentals, connectar-los amb la realitat econòmica actual i transmetre'ls amb rigor i claredat a l'alumnat, contribuint així al desenvolupament de ciutadans informats, crítics i competents."))),React.createElement(BibliografiaBox,{items:["SMITH, A. (1776): Investigación sobre la naturaleza y causas de la riqueza de las naciones (ed. moderna, Alianza Editorial).","RICARDO, D. (1817): Principios de economía política y tributación (ed. moderna, FCE).","MARSHALL, A. (1890): Principios de Economía (ed. moderna, Síntesis).",'SOLOW, R. (1956): "A Contribution to the Theory of Economic Growth", Quarterly Journal of Economics, 70(1), pp. 65-94.',"BECKER, G. (1964): Human Capital, University of Chicago Press."
