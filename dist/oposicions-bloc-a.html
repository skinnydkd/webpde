ateElement("strong",null,"Alta taxa de desocupaci\xF3 estructural:")," hist\xF2ricament, Espanya ha tingut una taxa d'atur sistem\xE0ticament superior a la mitjana de la UE, fins i tot en per\xEDodes de creixement econ\xF2mic. Les causes s\xF3n m\xFAltiples: rigidesa del mercat, desajust formatiu, model productiu intensiu en ocupaci\xF3 poc qualificada (construcci\xF3, turisme, hostaleria). ",/*#__PURE__*/React.createElement("strong",null,"Elevada temporalitat:")," fins a la reforma de 2021, m\xE9s del 25% dels assalariats tenien contracte temporal (enfront del 14% de mitjana a la UE), generant precarietat, rotaci\xF3, baixa productivitat i escassa inversi\xF3 en formaci\xF3 per part de les empreses."),/*#__PURE__*/React.createElement("p",null,/*#__PURE__*/React.createElement("strong",null,"Dualitat del mercat (insiders/outsiders):")," el mercat de treball espanyol ha estat marcat per una forta dualitat entre treballadors amb contracte indefinit i alta protecci\xF3 (insiders) i treballadors temporals amb escassa protecci\xF3 i alta rotaci\xF3 (outsiders). Esta dualitat t\xE9 efectes negatius sobre la productivitat, la formaci\xF3 i la desigualtat. ",/*#__PURE__*/React.createElement("strong",null,"Desocupaci\xF3 juvenil:")," la taxa d'atur juvenil (16-24 anys) a Espanya \xE9s estructuralment molt elevada, havent superat el 55% durant la crisi de 2012-2013. ",/*#__PURE__*/React.createElement("strong",null,"Bretxa de g\xE8nere:")," encara que la participaci\xF3 femenina ha crescut notablement, persisteixen difer\xE8ncies significatives en taxes d'activitat, ocupaci\xF3, temporalitat, parcialitat involunt\xE0ria i salaris entre homes i dones.")),/*#__PURE__*/React.createElement(TheoryBlock,{title:"6.2. Evoluci\xF3 recent",color:"blue"},/*#__PURE__*/React.createElement("p",null,"L'evoluci\xF3 del mercat de treball espanyol en les \xFAltimes d\xE8cades pot resumir-se en diverses fases: ",/*#__PURE__*/React.createElement("strong",null,"2000-2007 (expansi\xF3):")," forta cr __*/React.createElement(TheoryBlock,{title:"6.4. Bretxa salarial de g\xE8nere",color:"amber"},/*#__PURE__*/React.createElement("p",null,"La ",/*#__PURE__*/React.createElement("strong",null,"bretxa salarial de g\xE8nere")," \u2014la difer\xE8ncia entre el salari mitj\xE0 d'homes i dones\u2014 \xE9s un fenomen persistent a Espanya i en la majoria de pa\xEFsos del m\xF3n. Segons dades d'Eurostat, la bretxa salarial a Espanya se situa al voltant del 9-12% (bretxa ajustada) i \xE9s major si es consideren les difer\xE8ncies en jornada, sectors i ocupacions (bretxa no ajustada, superior al 20%). Les causes s\xF3n m\xFAltiples: ",/*#__PURE__*/React.createElement("strong",null,"segregaci\xF3 horitzontal")," (les dones es concentren en sectors pitjor remunerats: sanitat, educaci\xF3, cures), ",/*#__PURE__*/React.createElement("strong",null,"segregaci\xF3 vertical")," (sostre de vidre: menor pres\xE8ncia femenina en llocs directius), ",/*#__PURE__*/React.createElement("strong",null,"parcialitat involunt\xE0ria")," (les dones treballen a temps parcial en major proporci\xF3, sovint per responsabilitats de cura), ",/*#__PURE__*/React.createElement("strong",null,"penalitzaci\xF3 per maternitat")," i ",/*#__PURE__*/React.createElement("strong",null,"discriminaci\xF3 directa"),". Les mesures per a reduir la bretxa inclouen: plans d'igualtat en empreses, transpar\xE8ncia salarial, permisos de paternitat igualitaris (com les 16 setmanes establides a Espanya des de 2021), pol\xEDtiques de conciliaci\xF3 i corresponsabilitat."))),/*#__PURE__*/React.createElement(Card,{title:"7. Desafiaments futurs del mercat laboral",icon:"\uD83D\uDD2E"},/*#__PURE__*/React.createElement(TheoryBlock,{title:"7.1. Automatitzaci\xF3 i intel\xB7lig\xE8ncia artificial",color:"purple"},/*#__PURE__*/React.createElement("p",null,"L'avan\xE7 de l'",/*#__PURE__*/React.createElement("strong",null,"automatitzaci\xF3"),", la ",/*#__PURE__*/React.createElement("strong",null,"rob\xF2tica")," i la ",/*#__PURE__*/React.c p",null,"L'",/*#__PURE__*/React.createElement("strong",null,"economia de plataformes")," o ",/*#__PURE__*/React.createElement("strong",null,"gig economy")," es refereix al model de treball intermediat per plataformes digitals (Uber, Deliveroo, Glovo, Amazon Mechanical Turk, Upwork, etc.), en el qual els treballadors realitzen tasques puntuals o \"gigs\" a demanda, generalment com a treballadors aut\xF2noms. Este model planteja desafiaments regulatoris fonamentals: s\xF3n estos treballadors ",/*#__PURE__*/React.createElement("strong",null,"aut\xF2noms")," (amb llibertat i flexibilitat per\xF2 sense protecci\xF3 social) o ",/*#__PURE__*/React.createElement("strong",null,"assalariats encoberts")," (falsos aut\xF2noms)?"),/*#__PURE__*/React.createElement("p",null,"A Espanya, la ",/*#__PURE__*/React.createElement("strong",null,"Llei Rider")," (Reial Decret-llei 9/2021) va establir la presumpci\xF3 de laboralitat per als repartidors de plataformes digitals, convertint-los en assalariats amb drets laborals plens. A nivell europeu, la proposta de Directiva sobre treball en plataformes digitals busca establir criteris comuns per a la classificaci\xF3 d'estos treballadors.")),/*#__PURE__*/React.createElement(TheoryBlock,{title:"7.3. Teletreball post-COVID",color:"green"},/*#__PURE__*/React.createElement("p",null,"La pand\xE8mia de COVID-19 va accelerar dr\xE0sticament l'adopci\xF3 del ",/*#__PURE__*/React.createElement("strong",null,"teletreball"),": milions de treballadors van passar del treball presencial al remot de forma abrupta. Esta experi\xE8ncia ha transformat les expectatives de treballadors i empreses. A Espanya, la ",/*#__PURE__*/React.createElement("strong",null,"Llei 10/2021 de treball a dist\xE0ncia")," regula el teletreball, establint el dret a la compensaci\xF3 de despeses, la voluntarietat, la reversibilitat, la desconnexi\xF3 digital i la igualtat de drets entre treballadors presencials i remots."),/*#__PURE__*/React.createElement("p",null,"El teletreball presenta avantatges (flexibilitat, conciliaci\xF3, reducci\xF3 de despla\xE7aments, acc\xE9s a talent global) i inconvenients (a\xEFllament social, dificultat de desconnexi\xF3, desigualtat entre treballadors que poden i no poden teletreballar, risc de presentisme digital, efectes sobre el desenvolupament professional). El model ",/*#__PURE__*/React.createElement("strong",null,"h\xEDbrid")," (combinaci\xF3 de presencial i remot) s'ha consolidat com l'opci\xF3 predominant en moltes empreses i sectors.")),/*#__PURE__*/React.createElement(TheoryBlock,{title:"7.4. Renda b\xE0sica universal",color:"amber"},/*#__PURE__*/React.createElement("p",null,"La ",/*#__PURE__*/React.createElement("strong",null,"renda b\xE0sica universal (RBU)")," \xE9s una proposta que planteja garantir a tot ciutad\xE0 una renda peri\xF2dica suficient per a cobrir les necessitats b\xE0siques, de forma ",/*#__PURE__*/React.createElement("strong",null,"incondicional")," (sense requisits de renda, situaci\xF3 laboral o disposici\xF3 a treballar), ",/*#__PURE__*/React.createElement("strong",null,"universal")," (per a tots els ciutadans) i ",/*#__PURE__*/React.createElement("strong",null,"individual")," (no basada en la llar). Els seus defensors (",/*#__PURE__*/React.createElement("strong",null,"Philippe Van Parijs"),", ",/*#__PURE__*/React.createElement("strong",null,"Guy Standing"),", ",/*#__PURE__*/React.createElement("strong",null,"Thomas Piketty"),") argumenten que: (1) simplifica el sistema de protecci\xF3 social (eliminant la burocr\xE0cia i l'estigma de les prestacions condicionades), (2) elimina el parany de la pobresa (no desincentiva el treball, ja que no es perd en trobar ocupaci\xF3), (3) proporciona seguretat econ\xF2mica davant l'automatitzaci\xF3 i la inestabilitat laboral, (4) empodera els treballadors (poden rebutjar ocupacions prec\xE0ries), (5) reconeix el treball no remunerat (dom\xE8stic, voluntari, de cures)."),/*#__PURE__*/React.createElement("p",null,"Els seus detractors argumenten que: (1) el cost fiscal \xE9s enorme (multiplicar una renda b\xE0sica per tota la poblaci\xF3 adulta llan\xE7a xifres de desenes o centenars de milers de milions), (2) pot desincentivat el treball (encara que l'evid\xE8ncia dels experiments pilot \u2014Finl\xE0ndia, Kenya, Stockton als EUA\u2014 no confirma este temor), (3) \xE9s pol\xEDticament dif\xEDcil d'implementar. El debat sobre la RBU ha cobrat for\xE7a amb la pand\xE8mia de COVID-19 i l'avan\xE7 de la IA.")),/*#__PURE__*/React.createElement(TheoryBlock,{title:"7.5. Formaci\xF3 cont\xEDnua i reciclatge professional",color:"pink"},/*#__PURE__*/React.createElement("p",null,"En un mercat laboral en transformaci\xF3 accelerada, la ",/*#__PURE__*/React.createElement("strong",null,"formaci\xF3 cont\xEDnua")," (lifelong learning) es converteix en una necessitat estructural. L'OCDE estima que el 14% de les ocupacions actuals s\xF3n altament automatitzables i un altre 32% patir\xE0 canvis significatius, la qual cosa exigir\xE0 ",/*#__PURE__*/React.createElement("strong",null,"reciclatge professional (reskilling)")," i ",/*#__PURE__*/React.createElement("strong",null,"millora de compet\xE8ncies (upskilling)")," a escala massiva. Les compet\xE8ncies m\xE9s demandades combinen habilitats t\xE8cniques (digitals, STEM, programaci\xF3, an\xE0lisi de dades) amb habilitats transversals (creativitat, pensament cr\xEDtic, resoluci\xF3 de problemes complexos, intel\xB7lig\xE8ncia emocional, comunicaci\xF3, treball en equip).")),/*#__PURE__*/React.createElement(TheoryBlock,{title:"7.6. ODS 8 i connexi\xF3 curricular",color:"violet"},/*#__PURE__*/React.createElement("p",null,"L'",/*#__PURE__*/React.createElement("strong",null,"ODS 8")," (Treball decent i creixement econ\xF2mic) estableix com a meta promoure el creixement econ\xF2mic sostingut, inclusiu i sostenible, l'ocupaci\xF3 plena i productiva i el treball decent per a tots. El concepte de ",/*#__PURE__*/React.createElement("strong",null,"\"treball decent\"")," (decent wo at de treball, per la seua part, s'ha revelat com un dels \xE0mbits m\xE9s complexos i controvertits de la pol\xEDtica econ\xF2mica. La teoria econ\xF2mica ofereix marcs anal\xEDtics potents \u2014des del model competitiu d'oferta i demanda de treball fins als models de salaris d'efici\xE8ncia, insiders-outsiders i negociaci\xF3\u2014, per\xF2 la realitat del mercat laboral est\xE0 profundament condicionada per les institucions, la regulaci\xF3, la negociaci\xF3 col\xB7lectiva, la cultura empresarial i les pol\xEDtiques p\xFAbliques. La desocupaci\xF3, en les seues diferents variants (friccional, estructural, c\xEDclica), continua sent el gran problema irresolt de moltes economies, amb conseq\xFC\xE8ncies devastadores sobre el benestar individual i la cohesi\xF3 social."),/*#__PURE__*/React.createElement("p",null,"El mercat de treball espanyol presenta caracter\xEDstiques estructurals preocupants \u2014alta taxa d'atur, dualitat, temporalitat, desocupaci\xF3 juvenil, bretxa de g\xE8nere\u2014 que les successives reformes laborals han intentat abordar amb resultats desiguals. La reforma de 2021 ha aconseguit una reducci\xF3 notable de la temporalitat, per\xF2 queden pendents desafiaments de fons: la millora de la productivitat, la reducci\xF3 de la desocupaci\xF3 estructural, la integraci\xF3 dels joves, l'adaptaci\xF3 a la revoluci\xF3 tecnol\xF2gica i la transici\xF3 cap a un model productiu m\xE9s sostenible i basat en el coneixement."),/*#__PURE__*/React.createElement("p",null,"El futur del treball est\xE0 marcat per la incertesa: l'automatitzaci\xF3, la intel\xB7lig\xE8ncia artificial, l'economia de plataformes, el teletreball i els canvis demogr\xE0fics estan transformant radicalment el panorama laboral. La formaci\xF3 cont\xEDnua, la flexiseguretat, la negociaci\xF3 col\xB7lectiva adaptativa i el debat sobre la renda b\xE0sica universal seran elements centrals del mercat de treball del segle XXI. El futur docent d'Economia t\xE9 la responsabilitat de transmetr
