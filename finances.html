            'bitcoin.quan_tens_1000_banc': { val: "Quan tens 1.000€ al banc, no hi ha un sobre amb bitllets amb el teu nom. El banc simplement té una LLIBRETA (base de dades) que diu: 'Maria: 1.000€'. Quan pagues 50€ a Joan, el banc edita:", es: "Cuando tienes 1.000€ en el banco, no hay un sobre con billetes con tu nombre. El banco simplemente tiene una LIBRETA (base de datos) que dice: 'María: 1.000€'. Cuando pagas 50€ a Juan, el banco edita:", en: "When you have €1,000 in the bank, there's no envelope with bills with your name. The bank just has a LEDGER (database) saying: 'Maria: €1,000'. When you pay €50 to John, the bank edits:" },
            'bitcoin.problema_has_confiar_banc': { val: "Problema: HAS DE CONFIAR en el banc (que no et robi, que no falli, que el govern no congeli els teus diners...)", es: "Problema: DEBES CONFIAR en el banco (que no te robe, que no falle, que el gobierno no congele tu dinero...)", en: "Problem: YOU MUST TRUST the bank (not to steal, not to fail, government not to freeze your money...)" },
            'bitcoin.bitcoin_és_exactament_mateix': { val: "Bitcoin és exactament el mateix concepte: una LLIBRETA que diu qui té quant. Però amb una diferència revolucionària:", es: "Bitcoin es exactamente el mismo concepto: una LIBRETA que dice quién tiene cuánto. Pero con una diferencia revolucionaria:", en: "Bitcoin is exactly the same concept: a LEDGER saying who has what. But with a revolutionary difference:" },
            'bitcoin.llibreta_controla_ningú': { val: "La llibreta NO la controla ningú", es: "La libreta NO la controla nadie", en: "The ledger is NOT controlled by anyone" },
            'bitcoin.tenen_milers_dordinadors_món': { val: "La tenen milers d'ordinadors al món simultàniament. Tots han de concordar. Ningú pot editar-la sol.", es: "La tienen miles de ordenadores en el mundo simultáneamente. Todos deben concordar. Nadie puede editarla solo.", en: "Thousands of computers worldwide have it simultaneously. All must agree. No one can edit it alone." },
            'bitcoin.necessites_confiar_cap_entitat': { val: "No necessites confiar en cap entitat. El sistema és matemàtic i transparent.", es: "No necesitas confiar en ninguna entidad. El sistema es matemático y transparente.", en: "You don't need to trust any entity. The system is mathematical and transparent." },
            'bitcoin.definició_tècnica_simple': { val: "Definició tècnica simple", es: "Definición técnica simple", en: "Simple technical definition" },
            'bitcoin.és_base_dades_distribuïda': { val: "és una base de dades distribuïda (blockchain) que registra qui posseeix quantes unitats d'una moneda digital escassa (màxim 21 milions de BTC), sense necessitat de cap autoritat central que la gestioni.", es: "es una base de datos distribuida (blockchain) que registra quién posee cuántas unidades de una moneda digital escasa (máximo 21 millones de BTC), sin necesidad de ninguna autoridad central que la gestione.", en: "is a distributed database (blockchain) that records who owns how many units of a scarce digital currency (max 21 million BTC), without needing any central authority to manage it." },

            'bitcoin.només_existiran_21_milions': { val: "Només existiran 21 milions de BTC. Mai més. Això està escrit en el codi i és immutable.", es: "Solo existirán 21 millones de BTC. Nunca más. Esto está escrito en el código y es inmutable.", en: "Only 21 million BTC will ever exist. Never more. This is written in the code and is immutable." },

            'bitcoin.criptografia_militar_15_anys': { val: "Criptografia militar. En 15 anys, mai s'ha hackejat el protocol Bitcoin (sí exchanges, però no Bitcoin en si).", es: "Criptografía militar. En 15 años, nunca se ha hackeado el protocolo Bitcoin (sí exchanges, pero no Bitcoin en sí).", en: "Military-grade cryptography. In 15 years, the Bitcoin protocol has never been hacked (exchanges yes, but not Bitcoin itself)." },

            'bitcoin.governs_poden_imprimir_diners': { val: "Els governs poden imprimir diners il·limitadament. Des de 1971 (fi del patró or), l'euro/dòlar han perdut +85% del seu poder adquisitiu. 100€ del 2000 compren avui el que 60€ compraven llavors.", es: "Los gobiernos pueden imprimir dinero ilimitadamente. Desde 1971 (fin del patrón oro), el euro/dólar han perdido +85% de su poder adquisitivo. 100€ del 2000 compran hoy lo que 60€ compraban entonces.", en: "Governments can print unlimited money. Since 1971 (end of gold standard), euro/dollar have lost +85% of their purchasing power. €100 from 2000 buys today what €60 bought then." },
            'bitcoin.proposta_bitcoin': { val: "La proposta de Bitcoin", es: "La propuesta de Bitcoin", en: "Bitcoin's proposal" },
            'bitcoin.diner_ningú_pot_devaluar': { val: "Un diner que NINGÚ pot devaluar imprimint més. Oferta fixa, transparent i verificable per qualsevol. 'Ser el teu propi banc' sense dependre de tercers.", es: "Un dinero que NADIE puede devaluar imprimiendo más. Oferta fija, transparente y verificable por cualquiera. 'Ser tu propio banco' sin depender de terceros.", en: "Money that NOBODY can devalue by printing more. Fixed, transparent supply verifiable by anyone. 'Be your own bank' without depending on third parties." },
            'bitcoin.pseudònim_creador_creadors_bitcoin': { val: "Pseudònim del creador (o creadors) de Bitcoin. La seva identitat real és desconeguda. Va publicar el white paper el 31 d'octubre de 2008 i va desaparèixer el 2011, deixant ~1 milió de BTC intocats (mai s'han mogut).", es: "Pseudónimo del creador (o creadores) de Bitcoin. Su identidad real es desconocida. Publicó el white paper el 31 de octubre de 2008 y desapareció en 2011, dejando ~1 millón de BTC intocados (nunca se han movido).", en: "Pseudonym of Bitcoin's creator(s). Real identity unknown. Published the white paper on October 31, 2008 and disappeared in 2011, leaving ~1 million BTC untouched (never moved)." },
            'bitcoin.context_històric_què_va': { val: "Context històric: Per què va nàixer Bitcoin?", es: "Contexto histórico: ¿Por qué nació Bitcoin?", en: "Historical context: Why was Bitcoin born?" },
            'bitcoin.crisi_financera_global': { val: "Crisi Financera Global", es: "Crisis Financiera Global", en: "Global Financial Crisis" },
            'bitcoin.lehman_brothers_cau_bancs': { val: "Lehman Brothers cau. Els bancs havien estat jugant amb els diners de tothom. Els governs els rescaten amb diners públics (rescats bancaris). La gent perd cases, estalvis i feines mentre els banquers cobren bonus.", es: "Lehman Brothers cae. Los bancos habían estado jugando con el dinero de todos. Los gobiernos los rescatan con dinero público. La gente pierde casas, ahorros y trabajos mientras los banqueros cobran bonus.", en: "Lehman Brothers falls. Banks had been gambling with everyone's money. Governments bail them out with public money. People lose homes, savings and jobs while bankers collect bonuses." },
            'bitcoin.satoshi_publica_document_pàgines': { val: "Satoshi publica un document de 9 pàgines descrivint un sistema de diner electrònic que no necessita bancs ni governs. El primer bloc (Genesis Block) conté el missatge: 'The Times 03/Jan/2009 Chancellor on brink of second bailout for banks'.", es: "Satoshi publica un documento de 9 páginas describiendo un sistema de dinero electrónico que no necesita bancos ni gobiernos. El primer bloque (Genesis Block) contiene el mensaje: 'The Times 03/Jan/2009 Chancellor on brink of second bailout for banks'.", en: "Satoshi publishes a 9-page document describing an electronic money system that doesn't need banks or governments. The first block (Genesis Block) contains the message: 'The Times 03/Jan/2009 Chancellor on brink of second bailout for banks'." },
            'bitcoin.neix_xarxa_bitcoin': { val: "Neix la xarxa Bitcoin", es: "Nace la red Bitcoin", en: "Bitcoin network is born" },
            'bitcoin.mina_primer_bloc_bloc': { val: "Es mina el primer bloc (bloc #0 o Genesis Block). El primer bitcoin es transfereix el 12 de gener de 2009. El 22 de maig de 2010, es fa la primera compra real: 2 pizzes per 10.000 BTC (~700 milions $ avui).", es: "Se mina el primer bloque (bloque #0 o Genesis Block). El primer bitcoin se transfiere el 12 de enero de 2009. El 22 de mayo de 2010, se hace la primera compra real: 2 pizzas por 10.000 BTC (~700 millones $ hoy).", en: "The first block is mined (block #0 or Genesis Block). First bitcoin transferred January 12, 2009. On May 22, 2010, first real purchase: 2 pizzas for 10,000 BTC (~$700 million today)." },

            'bitcoin.tens_adreça_pública_iban': { val: "Tens una 'adreça' pública (com un IBAN) on rebre BTC, i una clau privada secreta (com un PIN) per gastar-los. Qui té la clau privada, controla els bitcoins.", es: "Tienes una 'dirección' pública (como un IBAN) donde recibir BTC, y una clave privada secreta (como un PIN) para gastarlos. Quien tiene la clave privada, controla los bitcoins.", en: "You have a public 'address' (like an IBAN) to receive BTC, and a secret private key (like a PIN) to spend them. Whoever has the private key controls the bitcoins." },
            'bitcoin.llibre_comptable_públic_sapunten': { val: "Un llibre comptable públic on s'apunten TOTES les transaccions des de 2009. És immutable: una vegada apuntada, una transacció no es pot esborrar ni modificar.", es: "Un libro contable público donde se apuntan TODAS las transacciones desde 2009. Es inmutable: una vez apuntada, una transacción no se puede borrar ni modificar.", en: "A public ledger where ALL transactions since 2009 are recorded. It's immutable: once recorded, a transaction cannot be deleted or modified." },

            'bitcoin.ordinadors_competeixen_validar_transaccions': { val: "Ordinadors competeixen per validar transaccions resolent problemes matemàtics (Proof of Work). El guanyador afegeix un bloc i rep BTC nous com a recompensa.", es: "Ordenadores compiten por validar transacciones resolviendo problemas matemáticos (Proof of Work). El ganador añade un bloque y recibe BTC nuevos como recompensa.", en: "Computers compete to validate transactions by solving math problems (Proof of Work). The winner adds a block and receives new BTC as reward." },

            'bitcoin.maximalistes_bitcoin_argumenten_btc': { val: "Els 'maximalistes' de Bitcoin argumenten que BTC és l'única criptomoneda que realment compleix les promeses de descentralització, escassetat i seguretat. Les altres (altcoins) tenen problemes fonamentals:", es: "Los 'maximalistas' de Bitcoin argumentan que BTC es la única criptomoneda que realmente cumple las promesas de descentralización, escasez y seguridad. Las otras (altcoins) tienen problemas fundamentales:", en: "Bitcoin 'maximalists' argue that BTC is the only cryptocurrency that truly delivers on promises of decentralization, scarcity and security. Others (altcoins) have fundamental problems:" },

            'bitcoin.ethereum_va_fer_hard': { val: "Ethereum va fer un 'hard fork' el 2016 per revertir un hack (The DAO). Això demostra que hi ha algú que POT canviar les regles quan vol. Bitcoin mai ha revertit cap transacció.", es: "Ethereum hizo un 'hard fork' en 2016 para revertir un hack (The DAO). Esto demuestra que hay alguien que PUEDE cambiar las reglas cuando quiere. Bitcoin nunca ha revertido ninguna transacción.", en: "Ethereum did a 'hard fork' in 2016 to reverse a hack (The DAO). This shows someone CAN change the rules when they want. Bitcoin has never reversed any transaction." },

            'bitcoin.maximalisme_és_culte_és': { val: "El maximalisme no és un culte: és el reconeixement que crear 'diners durs' descentralitzats és un problema que només es resol UNA vegada. Bitcoin va resoldre'l. Les altcoins són experiments interessants, però no compleixen la funció de 'diner sòlid' perquè depenen de tercers de confiança (els seus creadors/fundacions).", es: "El maximalismo no es un culto: es el reconocimiento de que crear 'dinero duro' descentralizado es un problema que solo se resuelve UNA vez. Bitcoin lo resolvió. Las altcoins son experimentos interesantes, pero no cumplen la función de 'dinero sólido' porque dependen de terceros de confianza (sus creadores/fundaciones).", en: "Maximalism isn't a cult: it's recognizing that creating decentralized 'hard money' is a problem solved only ONCE. Bitcoin solved it. Altcoins are interesting experiments, but don't fulfill 'sound money' because they depend on trusted third parties (their creators/foundations)." },

                try {
                    if (key) {
                        // Nested: t('category', 'key')
                        return translations[categoryOrKey][key][idioma] || translations[categoryOrKey][key]['val'];
                    }
                    // Flat key: t('flat.key') — check if it has val/es/en directly
                    const entry = translations[categoryOrKey];
                    if (entry && entry.val !== undefined) {
                        return entry[idioma] || entry['val'];
                    }
                    // Nested single: t('category') where category has val/es/en
                    return entry?.[idioma] || entry?.['val'] || categoryOrKey;
                } catch { return key || categoryOrKey; }
            };

                            <div className="p-4 bg-emerald-50 rounded-xl">
                                <p className="font-bold text-emerald-700 mb-2">🎫 {t('derivats.opcions')}</p>
                                <p className="text-sm text-emerald-600">{t('derivats.dret_obligació_comprar_call')}</p>
                                <p className="text-xs text-emerald-500 mt-2">{t('derivats.ex_assegurança_pagues_prima')}</p>
                            </div>
                            <div className="p-4 bg-amber-50 rounded-xl">
                                <p className="font-bold text-amber-700 mb-2">🔄 Swaps</p>
                                <p className="text-sm text-amber-600">{t('derivats.intercanvi_fluxos_financers_entre')}</p>
                            </div>
                            <div className="p-4 bg-red-50 rounded-xl border border-red-200">
                                <p className="font-bold text-red-700 mb-2">⚠️ CFDs</p>
                                <p className="text-sm text-red-600">{t('derivats.contracte_diferència_apostes_sobre')}</p>
                                <p className="text-xs text-red-500 mt-2 font-bold">{t('derivats.76_dinversors_minoristes_perden')}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-xl p-6 border border-gray-200">
                        <h3 className="font-bold text-gray-800 mb-4">⚡ {t('derivats.perill_lapalancament')}</h3>
                        <p className="text-sm text-gray-600 mb-4">{t('derivats.lapalancament_et_permet_controlar')}</p>
                        <div className="grid md:grid-cols-2 gap-4">
                            <div className="p-4 bg-emerald-50 rounded-xl">
                                <p className="font-bold text-emerald-700">{t('derivats.preu_puja')}</p>
                                <p className="text-sm text-emerald-600">{t('derivats.sense_apalancar_guanyes_100')}</p>
                                <p className="text-sm text-emerald-600">{t('derivats.101_guanyes_50_50')}</p>
                            </div>
                            <div className="p-4 bg-red-50 rounded-xl border border-red-200">
                                <p className="font-bold text-red-700">{t('derivats.preu_baixa_10')}</p>
                                <p className="text-sm text-red-600">{t('derivats.sense_apalancar_perds_10')}</p>
                                <p className="text-sm text-red-600 font-bold">{t('derivats.101_perds_100_tot')}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div className="bg-violet-50 rounded-xl p-6 border border-violet-200">
                        <h3 className="font-bold text-violet-700 mb-4">🎯 {t('derivats.usos_legítims_dels_derivats')}</h3>
                        <div className="space-y-2 text-sm">
                            <p className="text-violet-600">✅ <strong>{t('derivats.cobertura')}</strong> {t('derivats.agricultor_assegura_preu_seva')}</p>
                            <p className="text-violet-600">✅ <strong>{t('derivats.cobertura_divises')}</strong> {t('derivats.empresa_protegeix_contra_fluctuacions')}</p>
                            <p className="text-violet-600">✅ <strong>{t('derivats.gestió_professional')}</strong> {t('derivats.fons_institucionals_estratègies_sofisticades')}</p>
                        </div>
                        <div className="mt-4 p-3 bg-white rounded-lg">
                            <p className="text-sm text-violet-700">{t('derivats.són_especular_sense_coneixement')}</p>
                        </div>
                    </div>
                </div>
            );

            const GlosarioModal = () => (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowGlosario(false)}>
                    <div className="bg-gradient-to-br from-amber-50 via-white to-pink-50 rounded-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden border border-gray-200" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b border-gray-200 flex items-center justify-between"><h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><BookOpen className="text-pink-500" /> Glosario financiero</h3><button onClick={() => setShowGlosario(false)} className="p-2 hover:bg-white rounded-lg"><X className="text-gray-500" /></button></div>
                        <div className="p-4 border-b border-gray-200"><div className="relative"><Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} /><input type="text" placeholder="Buscar término..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-500" /></div></div>
                        <div className="overflow-y-auto max-h-[50vh] p-4 space-y-2">{filteredGlosario.map((item, i) => (<div key={i} className="p-4 bg-white rounded-xl"><p className="font-bold text-pink-500">{item.term}</p><p className="text-sm text-gray-600 mt-1">{item.def}</p></div>))}</div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 via-white to-pink-50 text-gray-800">
                    <div className="fixed inset-0 overflow-hidden pointer-events-none"><div className="absolute top-0 left-1/4 w-96 h-96 bg-pink-200/30 rounded-full blur-3xl" /><div className="absolute bottom-0 right-1/4 w-96 h-96 bg-amber-200/30 rounded-full blur-3xl" /></div>
                    
                    <PdeHeader
                        idioma={idioma}
                        setIdioma={(lang) => { setIdioma(lang); PdeLanguageStore.set(lang); }}
                        currentApp="finances"
                        sections={[
                            { id: 'inicio', emoji: '🏠', label: t('nav', 'inicio') },
                            { id: 'gestion', emoji: '👛', label: t('nav', 'gestion') },
                            { id: 'activos', emoji: '📊', label: t('nav', 'activos') },
                            { id: 'calc', emoji: '🧮', label: t('nav', 'calc') },
                            { id: 'cartera', emoji: '🥧', label: t('nav', 'cartera') },
                            { id: 'estrategias', emoji: '🎯', label: t('nav', 'estrategias') },
                            { id: 'psicologia', emoji: '🧠', label: t('nav', 'psicologia') },
                            { id: 'brokers', emoji: '🏢', label: t('nav', 'brokers') },
                            { id: 'bitcoin', emoji: '₿', label: t('nav', 'bitcoin') },
                            { id: 'fiscalitat', emoji: '🧾', label: t('nav', 'fiscalitat') },
                            { id: 'analisi', emoji: '📈', label: t('nav', 'analisi') },
                            { id: 'derivats', emoji: '⚖️', label: t('nav', 'derivats') },
                            { id: 'quiz', emoji: '🎓', label: t('nav', 'quiz') },
                            { id: 'test', emoji: '🏆', label: t('nav', 'test') },
                        ]}
                        currentSection={section}
                        setSection={setSection}
                    />
                    
                    {/* Main */}
                    <main className="max-w-7xl mx-auto px-4 py-8">
                        {section === 'inicio' && <Inicio />}
                        {section === 'gestion' && <Gestion />}
                        {section === 'activos' && <Activos />}
                        {section === 'calc' && <Calculadora />}
                        {section === 'cartera' && <Cartera />}
                        {section === 'estrategias' && <Estrategias />}
                        {section === 'psicologia' && <Psicologia />}
                        {section === 'brokers' && <Brokers />}
                        {section === 'bitcoin' && <Bitcoin />}
                        {section === 'fiscalitat' && <Fiscalitat />}
                        {section === 'analisi' && <Analisi />}
                        {section === 'derivats' && <Derivats />}
                        {section === 'quiz' && <Quiz />}
                        {section === 'test' && <Test />}
                    </main>
                    <button onClick={() => window.open(`https://wa.me/?text=${encodeURIComponent('📊 ' + (t('glosariomodal.guia_completa_finances_personals')) + '\n\n✅ ' + t('nav', 'calc') + '\n✅ ' + t('nav', 'cartera') + '\n✅ ' + t('nav', 'test') + '\n✅ ' + t('nav', 'quiz') + '\n✅ ' + t('nav', 'brokers') + '\n\n🚀 ' + (t('glosariomodal.tot_interactiu')))}`, '_blank')} className="fixed bottom-6 right-6 p-4 bg-gradient-to-r from-emerald-500 to-emerald-600 rounded-full shadow-lg shadow-emerald-500/25 hover:scale-110 transition-all z-50"><Smartphone size={24} /></button>
                    <button onClick={() => setShowGlosario(true)} className="fixed bottom-6 left-6 p-4 bg-white rounded-full shadow-lg hover:scale-110 transition-all z-50 border border-gray-200"><BookOpen size={24} /></button>
                    {showGlosario && <GlosarioModal />}

                    <PdeFooter appEmoji="👛" appName={t('title') || 'Finances'} idioma={idioma} />
                    <PdeScrollToTop />
                </div>
            );
        }

        ReactDOM.render(<FinanzasApp />, document.getElementById('root'));
    </script>
</body>
</html>
