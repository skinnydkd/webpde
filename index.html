                                <p className="text-gray-500 max-w-xl mx-auto">{t('opoSubtitle')}</p>
                            </div>

                            <div className="grid md:grid-cols-3 gap-6 mb-10">
                                {opoSections.map(section => (
                                    <a key={section.id} href={'./oposicions#' + section.id} className="group bg-white rounded-2xl overflow-hidden border border-purple-200 hover:shadow-xl hover:border-purple-400 transition-all duration-300 flex flex-col relative cursor-pointer">
                                        <div className={`h-3 bg-gradient-to-r ${section.gradient}`}></div>
                                        <div className="p-6 flex-1">
                                            <div className={`inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-r ${section.gradient} text-white text-2xl mb-4`}>
                                                {section.emoji}
                                            </div>
                                            <h3 className="text-xl font-bold text-gray-800 mb-2">{section.nom}</h3>
                                            <p className="text-gray-500 text-sm mb-4">{section.desc}</p>

                                            <div className="flex items-center gap-2">
                                                <section.icon size={16} className="text-purple-500" />
                                                <span className="px-3 py-1.5 bg-purple-50 text-purple-600 rounded-lg text-sm font-medium">{section.stat}</span>
                                            </div>
                                        </div>
                                        <div className="px-6 py-4 border-t border-gray-100 bg-purple-50/50">
                                            <span className="font-medium text-sm flex items-center gap-1 group-hover:gap-2 transition-all text-purple-600">
                                                {t('openApp')} <ChevronRight size={16} />
                                            </span>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        </div>
                    </section>
                    )}

                    {/* ==================== FEATURES + CTA (per tab) ==================== */}
                    <section className="py-16">
                        <div className="max-w-6xl mx-auto px-4">
                            <div className="grid md:grid-cols-2 gap-8 items-center">
                                <div>
                                    <h2 className="text-3xl font-black text-gray-800 mb-6">{t('featuresTitle')}</h2>
                                    <div className="space-y-4">
                                        {(tabFeatures[activeTab] || tabFeatures.general).map((item, i) => (
                                            <div key={i} className="flex gap-4 p-4 bg-white rounded-xl border border-gray-100">
                                                <div className={`p-2 ${tc.bgLight} rounded-lg h-fit`}><item.icon className={tc.text} size={20} /></div>
                                                <div>
                                                    <h3 className="font-bold text-gray-800">{item.title}</h3>
                                                    <p className="text-sm text-gray-500">{item.desc}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className={`bg-gradient-to-br ${activeTab === 'general' ? 'from-pink-100 to-amber-100' : activeTab === 'alumnat' ? 'from-blue-100 to-indigo-100' : activeTab === 'professorat' ? 'from-green-100 to-emerald-100' : 'from-purple-100 to-violet-100'} rounded-3xl p-8 text-center`}>
                                    <div className="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-lg mb-6">
                                        <Rocket className={tc.text} size={40} />
                                    </div>
                                    <h3 className="text-2xl font-black text-gray-800 mb-2">{t('freeTitle')}</h3>
                                    <p className="text-gray-600 mb-6">{activeTab === 'general' ? t('freeDesc') : activeTab === 'alumnat' ? t('freeAlumnat') : activeTab === 'professorat' ? t('freeProf') : t('freeOpo')}</p>
                                    <div className="flex justify-center gap-2">
                                        <Heart className={tc.text} size={20} />
                                        <span className="text-sm text-gray-500">{t('madeWith')}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section className={`py-16 bg-gradient-to-r ${tc.gradient}`}>
                        <div className="max-w-4xl mx-auto px-4 text-center text-white">
                            <h2 className="text-3xl md:text-4xl font-black mb-4">{activeTab === 'general' ? t('ctaTitle') : activeTab === 'alumnat' ? t('ctaAlumnatTitle') : activeTab === 'professorat' ? t('ctaProfTitle') : t('ctaOpoTitle')}</h2>
                            <p className="text-white/80 mb-8 max-w-xl mx-auto">{activeTab === 'general' ? t('ctaDesc') : activeTab === 'alumnat' ? t('ctaAlumnatDesc') : activeTab === 'professorat' ? t('ctaProfDesc') : t('ctaOpoDesc')}</p>
                            <div className="flex flex-wrap justify-center gap-4">
                                {activeTab === 'general' && apps.filter(app => !app.esGran).map(app => (
                                    <a key={app.id} href={app.href} className="px-6 py-3 bg-white text-gray-800 rounded-xl font-bold hover:bg-gray-100 transition-all flex items-center gap-2">
                                        <app.icon size={18} />{app.nom}
                                    </a>
                                ))}
                                {activeTab === 'alumnat' && courses.map(course => (
                                    <button key={course.id} className="px-6 py-3 bg-white/20 text-white rounded-xl font-bold hover:bg-white/30 transition-all flex items-center gap-2 cursor-default">
                                        <span>{course.emoji}</span>{course.nom}
                                    </button>
                                ))}
                                {activeTab === 'professorat' && courses.map(course => (
                                    <button key={course.id} className="px-6 py-3 bg-white/20 text-white rounded-xl font-bold hover:bg-white/30 transition-all flex items-center gap-2 cursor-default">
                                        <span>{course.emoji}</span>{course.nom}
                                    </button>
                                ))}
                                {activeTab === 'opositor' && opoSections.map(section => (
                                    <button key={section.id} className="px-6 py-3 bg-white/20 text-white rounded-xl font-bold hover:bg-white/30 transition-all flex items-center gap-2 cursor-default">
                                        <span>{section.emoji}</span>{section.nom}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </section>

                    <PdeScrollToTop />

                    <footer className="py-8 bg-gray-50 border-t border-gray-100">
                        <div className="max-w-6xl mx-auto px-4">
                            <div className="flex flex-col md:flex-row items-center justify-between gap-4">
                                <div className="flex items-center gap-2">
                                    <GraduationCap className="text-pink-500" size={20} />
                                    <span className="font-bold text-gray-700">PDE</span>
                                    <span className="text-gray-400">·</span>
                                    <span className="text-sm text-gray-500">{t('platform')}</span>
                                </div>
                                <div className="flex items-center gap-6 text-sm text-gray-500">
                                    <span>{t('batxillerat')} · {t('fp')} · {t('universitat')}</span>
                                    <span className="text-gray-300">|</span>
                                    <span>2025</span>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<HomePage />, document.getElementById('root'));
    </script>
</body>
</html>
