    // TEMA 39 — La economía española: características y estructura productiva.
    // ════════════════════════════════════════════════════════════════
    const Tema39Complet = () => (
        <div className="space-y-6 animate-fade">
            {/* ── INTRODUCCIÓN ────────────────────────────────────── */}
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La <strong>economía española</strong> constituye uno de los casos más interesantes de transformación económica contemporánea. España pasó de ser una economía agraria, autárquica y relativamente atrasada a mediados del siglo XX a convertirse en la <strong>cuarta economía de la zona euro</strong> y la decimotercera del mundo por PIB nominal (FMI, 2024). Esta transformación no fue lineal: estuvo marcada por etapas de fuerte crecimiento (el «milagro económico» de los años 60, el boom posterior a la adhesión a la CEE en 1986, la expansión inmobiliaria de 1997-2007) y por crisis profundas (la crisis del petróleo de 1973, la reconversión industrial de los 80, la Gran Recesión de 2008-2013 y el impacto de la pandemia COVID-19 en 2020).
                    </p>
                    <p>
                        El estudio de la economía española es esencial para comprender la realidad económica en la que se desenvuelve el alumnado y para conectar los conceptos teóricos de la ciencia económica con datos, instituciones y políticas concretas. Desde la perspectiva curricular, este tema se enmarca en los saberes básicos del bloque «La economía española e internacional» de la materia de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022) y en las competencias específicas CE1 (funcionamiento del sistema económico), CE3 (papel del sector público) y CE4 (contexto económico nacional e internacional). La LOMLOE (Ley Orgánica 3/2020) enfatiza la necesidad de que el alumnado comprenda las características estructurales de la economía española, contribuyendo a las competencias CC (ciudadanía activa), STEM (análisis cuantitativo de datos macroeconómicos) y CE (comprensión de la iniciativa económica).
                    </p>
                    <p>
                        El presente tema se estructura en cinco epígrafes: en primer lugar, se aborda la evolución histórica de la economía española; en segundo lugar, se analizan sus características estructurales; en tercer lugar, se examina la estructura productiva por sectores; en cuarto lugar, se estudia la inserción exterior de la economía española; y en quinto lugar, se identifican los principales retos y desafíos actuales.
                    </p>
                </div>
            </Card>

            {/* ── DESARROLLO ──────────────────────────────────────── */}

            {/* Epígrafe 1 */}
            <Card title="1. Evolución histórica de la economía española" icon="📘">
                <TheoryBlock title="1.1. La autarquía y el primer franquismo (1939-1959)" color="amber">
                    <p>
                        Tras la Guerra Civil (1936-1939), el régimen franquista impuso un modelo de <strong>autarquía económica</strong> inspirado en los fascismos europeos: intervención estatal masiva, sustitución de importaciones, racionamiento, control de precios y restricción del comercio exterior. El resultado fue una economía estancada: en 1959, el PIB per cápita español apenas superaba el 60 % del promedio europeo occidental. El aislamiento internacional (exclusión de las Naciones Unidas hasta 1955, del Plan Marshall) agravó la situación.
                    </p>
                    <p>
                        La autarquía generó un <strong>mercado negro</strong> (estraperlo), escasez crónica de bienes de consumo, inflación reprimida, atraso tecnológico y una agricultura de subsistencia que mantenía a más del 40 % de la población activa en el sector primario.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. El Plan de Estabilización y el desarrollismo (1959-1973)" color="orange">
                    <p>
                        El <strong>Plan de Estabilización de 1959</strong>, impulsado por los tecnócratas del Opus Dei (López Rodó, Ullastres, Navarro Rubio) con el apoyo del FMI y la OCDE, marcó el giro hacia la liberalización: devaluación de la peseta, apertura comercial parcial, disciplina fiscal, atracción de inversión extranjera y eliminación de controles de precios. A partir de 1960, España experimentó el llamado <strong>«milagro económico español»</strong>: el PIB creció a una media del 7 % anual entre 1960 y 1973, la tasa más alta de Europa occidental junto con Italia y Japón.
                    </p>
                    <p>
                        Los <strong>Planes de Desarrollo</strong> (I: 1964-1967; II: 1968-1971; III: 1972-1975), de carácter indicativo (no vinculante para el sector privado), canalizaron la inversión pública hacia los <strong>polos de desarrollo</strong> (Vigo, Valladolid, Zaragoza, Sevilla, etc.) para fomentar la industrialización regional. Los motores del crecimiento fueron: la <strong>industrialización</strong> (especialmente automoción, siderurgia, química), las <strong>remesas de emigrantes</strong> (más de un millón de españoles emigraron a Alemania, Francia y Suiza), el <strong>turismo</strong> (España se convirtió en el primer destino turístico de masas de Europa) y la <strong>inversión extranjera directa</strong>.
                    </p>
                    <p>
                        Este periodo transformó radicalmente la estructura productiva: el sector primario pasó del 40 % al 20 % del empleo, mientras la industria y los servicios crecieron aceleradamente. Sin embargo, el crecimiento fue desequilibrado: elevada inflación, déficits exteriores recurrentes, desigualdad regional persistente y ausencia de libertades políticas y sindicales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. La crisis y la Transición (1973-1985)" color="amber">
                    <p>
                        La <strong>crisis del petróleo de 1973</strong> golpeó duramente a una economía altamente dependiente de las importaciones energéticas. La tardía reacción del régimen franquista (que subsidió los precios del petróleo para evitar conflictos sociales) agravó los desequilibrios. La muerte de Franco (1975) y la Transición democrática añadieron incertidumbre política.
                    </p>
                    <p>
                        Los <strong>Pactos de la Moncloa</strong> (1977), firmados por el gobierno de Suárez y los principales partidos políticos (incluido el PCE de Carrillo), constituyeron un hito: combinaron <strong>ajuste macroeconómico</strong> (contención salarial, devaluación, restricción monetaria) con <strong>reformas estructurales</strong> (reforma fiscal, Estatuto de los Trabajadores, reconocimiento del derecho de huelga).
                    </p>
                    <p>
                        La <strong>reconversión industrial</strong> de los años 80 (siderurgia, construcción naval, minería, textil) fue dolorosa pero necesaria: sectores obsoletos y sobredimensionados se reestructuraron con elevados costes sociales (desempleo, conflictividad laboral). El paro alcanzó el 21 % en 1985.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. La integración europea y la modernización (1986-2007)" color="orange">
                    <p>
                        La <strong>adhesión a la Comunidad Económica Europea</strong> (1 de enero de 1986) fue el hito más transformador de la economía española contemporánea. Supuso: <strong>apertura comercial plena</strong> (eliminación de aranceles intracomunitarios), acceso a los <strong>fondos estructurales y de cohesión</strong> (España fue el principal beneficiario neto hasta la ampliación de 2004, recibiendo más de 150.000 millones de euros entre 1986 y 2013), modernización de infraestructuras (AVE, autopistas, aeropuertos), convergencia regulatoria y normativa, y atracción de inversión extranjera.
                    </p>
                    <p>
                        La entrada en el <strong>Sistema Monetario Europeo</strong> (1989) y la posterior adopción del <strong>euro</strong> (1999, circulación en 2002) eliminaron el riesgo cambiario y redujeron drásticamente los tipos de interés, pero también privaron a España del instrumento de la devaluación competitiva.
                    </p>
                    <p>
                        Entre 1997 y 2007 España vivió una <strong>expansión extraordinaria</strong> impulsada por los bajos tipos de interés (convergencia hacia la zona euro), la inmigración masiva (la población extranjera pasó de 500.000 a 5,5 millones), el boom inmobiliario y de la construcción (que llegó a representar el 12 % del PIB y el 13 % del empleo), y el consumo financiado con crédito. El PIB per cápita español alcanzó el 105 % de la media de la UE-27 en 2007. Sin embargo, este modelo de crecimiento acumuló graves desequilibrios: burbuja inmobiliaria, endeudamiento privado excesivo (las familias y empresas españolas debían más del 200 % del PIB), déficit por cuenta corriente del 10 % del PIB y baja productividad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.5. La Gran Recesión y la recuperación (2008-2019)" color="amber">
                    <p>
                        El estallido de la burbuja inmobiliaria y la crisis financiera global (2008) provocaron la recesión más profunda desde la Guerra Civil. El PIB cayó un 9 % acumulado entre 2008 y 2013, el desempleo se disparó al <strong>26,9 %</strong> (2013, récord histórico), el sistema bancario requirió un <strong>rescate europeo</strong> de hasta 100.000 millones de euros (2012, a través del MEDE, del que se utilizaron 41.300 millones), la prima de riesgo alcanzó los 649 puntos básicos (julio 2012) y el déficit público superó el 11 % del PIB en 2009.
                    </p>
                    <p>
                        Las respuestas incluyeron: <strong>austeridad fiscal</strong> (recortes de gasto, subidas de impuestos, reforma del artículo 135 de la Constitución para incluir la estabilidad presupuestaria), <strong>reforma laboral</strong> (2012, flexibilización del despido y de la negociación colectiva), <strong>reestructuración bancaria</strong> (creación de la SAREB, fusiones de cajas de ahorro) y <strong>devaluación interna</strong> (moderación salarial para recuperar competitividad).
                    </p>
                    <p>
                        A partir de 2014 se inició una <strong>recuperación robusta</strong>: el PIB creció por encima del 3 % anual entre 2015 y 2017, impulsado por las exportaciones (que ganaron cuota de mercado mundial), el turismo (España se convirtió en el segundo destino turístico mundial por número de visitantes), los bajos precios del petróleo y la política monetaria expansiva del BCE (tipos de interés al 0 %, programa de compra de activos). El empleo creció hasta recuperar niveles precrisis a finales de 2019, aunque con mayor temporalidad y parcialidad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.6. La pandemia y el contexto actual (2020-presente)" color="orange">
                    <p>
                        La <strong>pandemia COVID-19</strong> (2020) provocó una caída del PIB del 11,2 %, la mayor entre las grandes economías europeas, debido a la elevada dependencia del turismo y la hostelería. La respuesta incluyó los <strong>ERTE</strong> (Expedientes de Regulación Temporal de Empleo, que llegaron a cubrir 3,4 millones de trabajadores), el <strong>Ingreso Mínimo Vital</strong>, las líneas de avales del ICO y, a nivel europeo, el programa <strong>Next Generation EU</strong> (España es el segundo mayor beneficiario con 163.000 millones de euros en transferencias y préstamos).
                    </p>
                    <p>
                        La recuperación posterior (2021-2024) fue progresiva: el PIB prepandemia se recuperó en el segundo trimestre de 2023. Sin embargo, la crisis energética derivada de la guerra de Ucrania (2022), la inflación (que alcanzó el 10,8 % en julio de 2022), las subidas de tipos del BCE y las tensiones geopolíticas han añadido nuevos desafíos. En 2024, el PIB per cápita español se sitúa en torno al 88 % de la media de la UE-27.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. Características estructurales de la economía española" icon="📘">
                <TheoryBlock title="2.1. Terciarización y desindustrialización" color="amber">
                    <p>
                        La economía española ha experimentado una profunda <strong>terciarización</strong>: el sector servicios representa actualmente alrededor del <strong>74 % del PIB</strong> y el <strong>77 % del empleo</strong>. La industria (incluida la energía) aporta aproximadamente el 16 % del PIB (frente al 20 % de la media de la UE), la construcción en torno al 6 % y el sector primario menos del 3 %. Esta estructura refleja la convergencia hacia el patrón de las economías avanzadas, pero con una participación industrial inferior a la de Alemania (24 %), Italia (19 %) o Francia (17 %), lo que constituye un debate recurrente sobre la necesidad de <strong>reindustrialización</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Dualidad del mercado laboral" color="orange">
                    <p>
                        El mercado de trabajo español presenta una <strong>dualidad estructural</strong> entre trabajadores con contratos indefinidos (elevada protección) y trabajadores con contratos temporales (alta rotación). Históricamente, la tasa de temporalidad española fue la más alta de la UE (superior al 30 %), aunque la <strong>reforma laboral de 2021</strong> la ha reducido significativamente (por debajo del 18 % en 2024). Otras características: elevado desempleo estructural (la tasa de paro raramente baja del 10-12 %, incluso en fases expansivas), desempleo juvenil muy elevado (superior al 25 %), brecha de género persistente y peso significativo de la economía sumergida (estimada entre el 17 % y el 22 % del PIB según diversos estudios).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Desequilibrios territoriales" color="amber">
                    <p>
                        España presenta una <strong>acusada desigualdad territorial</strong>. Las comunidades autónomas con mayor PIB per cápita (País Vasco, Madrid, Navarra, Cataluña) superan ampliamente a las de menor nivel (Extremadura, Andalucía, Castilla-La Mancha). El PIB per cápita del País Vasco es aproximadamente el doble que el de Extremadura. La «<strong>España vaciada</strong>» refleja el despoblamiento rural del interior (Castilla y León, Aragón, Extremadura), con densidades inferiores a 12 hab/km², frente a la concentración en las áreas metropolitanas costeras y Madrid.
                    </p>
                    <p>
                        Los mecanismos de corrección incluyen el <strong>sistema de financiación autonómica</strong> (Fondo de Garantía de Servicios Públicos Fundamentales), los fondos europeos de cohesión y las políticas de reto demográfico.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Déficit de productividad e innovación" color="orange">
                    <p>
                        La <strong>productividad total de los factores</strong> (PTF) española ha crecido menos que la media europea desde los años 90. España invierte en I+D+i aproximadamente el <strong>1,4 % del PIB</strong> (2023), muy por debajo de la media de la UE (2,2 %) y del objetivo del 3 % fijado por la Estrategia Europa 2020. El tejido empresarial está dominado por <strong>microempresas y pymes</strong> (el 99,8 % de las empresas tiene menos de 250 trabajadores; el 95 % tiene menos de 10), que invierten menos en I+D, internacionalización y digitalización. El <strong>nivel educativo</strong> ha mejorado, pero persisten tasas de abandono escolar temprano superiores a la media europea (13,6 % frente al 9,6 % de la UE en 2023).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Dependencia energética" color="amber">
                    <p>
                        España importa aproximadamente el <strong>70 % de la energía</strong> que consume (petróleo, gas natural), una dependencia superior a la media europea (~55 %). La <strong>transición energética</strong> está avanzando significativamente: en 2023, las energías renovables (eólica, solar fotovoltaica, hidráulica) generaron más del 50 % de la electricidad, convirtiendo a España en uno de los líderes europeos en energía solar. Sin embargo, la dependencia de combustibles fósiles para el transporte y la industria sigue siendo elevada.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. La estructura productiva: los tres sectores" icon="📘">
                <TheoryBlock title="3.1. El sector primario" color="amber">
                    <p>
                        El sector primario (agricultura, ganadería, silvicultura y pesca) aporta menos del <strong>3 % del PIB</strong> y emplea alrededor del <strong>4 % de la población activa</strong>. A pesar de su reducido peso, España es una <strong>potencia agroalimentaria</strong>: primer productor mundial de aceite de oliva, primer exportador de frutas y hortalizas de la UE, con una industria agroalimentaria que representa el primer sector industrial manufacturero del país. La <strong>Política Agrícola Común (PAC)</strong> es determinante: España recibe aproximadamente 7.000 millones de euros anuales en ayudas directas y desarrollo rural. (Este sector se desarrolla en profundidad en el Tema 40.)
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. El sector secundario" color="orange">
                    <p>
                        La industria manufacturera y la energía representan alrededor del <strong>16 % del PIB</strong>. Los subsectores más relevantes son: <strong>automoción</strong> (España es el segundo fabricante de vehículos de la UE y el octavo del mundo), <strong>agroalimentario</strong>, <strong>químico y farmacéutico</strong>, <strong>metalúrgico</strong>, <strong>cerámico</strong> (Castellón es líder mundial) y <strong>textil-moda</strong> (Inditex). La geografía industrial se concentra en Cataluña, País Vasco, Comunidad Valenciana, Madrid y Aragón.
                    </p>
                    <p>
                        La <strong>construcción</strong>, tradicionalmente un sector clave (llegó a representar el 12 % del PIB en 2006-2007), se contrajo drásticamente tras la crisis de 2008 y actualmente aporta en torno al 6 % del PIB, con una recuperación gradual vinculada a la rehabilitación energética de edificios y las inversiones del Plan de Recuperación.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. El sector terciario" color="amber">
                    <p>
                        Los servicios representan aproximadamente el <strong>74 % del PIB</strong> y el <strong>77 % del empleo</strong>. Los subsectores principales son:
                    </p>
                    <p>
                        <strong>Turismo:</strong> España es la segunda potencia turística mundial por número de visitantes internacionales (85 millones en 2023) y la segunda por ingresos. El turismo contribuye directa e indirectamente alrededor del <strong>12,8 % del PIB</strong> y emplea a más de 2,6 millones de personas. (Se desarrolla en el Tema 42.)
                    </p>
                    <p>
                        <strong>Comercio:</strong> tanto minorista como mayorista, es uno de los principales empleadores. La distribución comercial ha experimentado una transformación con la expansión de las grandes superficies, el comercio electrónico y la logística.
                    </p>
                    <p>
                        <strong>Servicios financieros, inmobiliarios y profesionales:</strong> aportan conjuntamente más del 20 % del PIB. El sector bancario español, tras la profunda reestructuración de 2008-2015, está dominado por cinco grandes entidades (Santander, BBVA, CaixaBank, Sabadell, Bankinter).
                    </p>
                    <p>
                        <strong>Administración pública, sanidad y educación:</strong> los servicios públicos representan alrededor del 18 % del PIB, reflejando el modelo de Estado del bienestar español.
                    </p>
                    <p>
                        <strong>Transporte y logística:</strong> España cuenta con una de las mejores redes de infraestructuras de Europa (segunda red de AVE del mundo por kilómetros, tras China), puertos estratégicos (Algeciras, Valencia, Barcelona) y una posición geográfica privilegiada como puente entre Europa y África/América Latina.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="PIB España (2024) ≈ 1,46 billones € | PIBpc ≈ 30.400 €"
                    desc="Cuarta economía de la zona euro (tras Alemania, Francia e Italia)"
                />
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. La inserción exterior de la economía española" icon="📘">
                <TheoryBlock title="4.1. Comercio exterior de bienes y servicios" color="amber">
                    <p>
                        La economía española ha experimentado una <strong>apertura comercial creciente</strong>: la suma de exportaciones e importaciones de bienes y servicios supera el 70 % del PIB. Las <strong>exportaciones de bienes</strong> alcanzaron 371.000 millones de euros en 2023, con un crecimiento sostenido que ha llevado a España a ganar cuota de mercado mundial (del 1,6 % al 1,8 % entre 2010 y 2023). Los principales productos exportados son: automóviles y componentes, productos agroalimentarios (frutas, hortalizas, aceite, vino, carne de cerdo), productos químicos y farmacéuticos, maquinaria y bienes de equipo.
                    </p>
                    <p>
                        El <strong>destino principal</strong> de las exportaciones es la UE (aproximadamente el 65 %), siendo Francia, Alemania, Italia y Portugal los principales socios. Fuera de la UE destacan Reino Unido, Estados Unidos, Marruecos y China.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La balanza por cuenta corriente" color="orange">
                    <p>
                        Históricamente, España tuvo una <strong>balanza por cuenta corriente deficitaria</strong>, que alcanzó un déficit récord del 10 % del PIB en 2007 (indicador del sobrecalentamiento de la economía). Uno de los cambios estructurales más significativos derivados de la crisis de 2008 fue la <strong>corrección del déficit exterior</strong>: la balanza por cuenta corriente ha registrado superávit desde 2013, gracias al crecimiento de las exportaciones, la contención de las importaciones, el superávit turístico y la moderación salarial. En 2023, la balanza por cuenta corriente registró un superávit del 2,6 % del PIB.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Inversión extranjera directa (IED)" color="amber">
                    <p>
                        España es un receptor significativo de <strong>IED</strong> (stock acumulado superior a 500.000 millones de euros) y simultáneamente un inversor importante en el exterior (las grandes empresas españolas — Santander, Telefónica, Iberdrola, Ferrovial, Inditex — tienen una presencia global significativa, especialmente en América Latina, Europa y EE. UU.). La internacionalización de la empresa española es uno de los cambios estructurales más positivos de las últimas décadas.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. Retos y desafíos actuales de la economía española" icon="📘">
                <TheoryBlock title="5.1. Retos económicos" color="amber">
                    <p>
                        <strong>Productividad y digitalización:</strong> elevar la productividad mediante la inversión en I+D+i (acercarse al 3 % del PIB), la digitalización del tejido empresarial (especialmente pymes), la formación continua y la atracción de talento.<br/>
                        <strong>Sostenibilidad del sistema de pensiones:</strong> el envejecimiento demográfico (la tasa de dependencia de mayores de 65 años pasará del 30 % al 50 % en 2050) presiona el sistema de reparto. Las reformas de 2021-2023 (revalorización con el IPC, MEI —Mecanismo de Equidad Intergeneracional—, incentivos a la jubilación demorada) buscan garantizar la sostenibilidad.<br/>
                        <strong>Deuda pública:</strong> la ratio deuda/PIB alcanzó el 120 % tras la pandemia y se sitúa en torno al 107 % en 2024, por encima del límite del 60 % del Pacto de Estabilidad.<br/>
                        <strong>Acceso a la vivienda:</strong> los precios de la vivienda y los alquileres han crecido por encima de los salarios, especialmente en las grandes ciudades, generando un problema de accesibilidad para los jóvenes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Retos sociales y demográficos" color="orange">
                    <p>
                        <strong>Envejecimiento demográfico:</strong> España tiene una de las tasas de fecundidad más bajas del mundo (1,16 hijos por mujer en 2023), y la inmigración se ha convertido en el principal factor de crecimiento poblacional.<br/>
                        <strong>Desigualdad:</strong> el coeficiente de Gini español (33,0 en 2023) es superior a la media de la UE (29,6), con una desigualdad que se concentra en el acceso a la vivienda, la precariedad laboral y la brecha territorial.<br/>
                        <strong>Transición ecológica:</strong> descarbonización de la economía, cumplimiento de los compromisos del Acuerdo de París y del Pacto Verde Europeo (reducción del 55 % de las emisiones para 2030), transición justa para las comarcas dependientes de actividades contaminantes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Los fondos Next Generation EU" color="amber">
                    <p>
                        El <strong>Plan de Recuperación, Transformación y Resiliencia</strong> (PRTR), financiado con fondos Next Generation EU, es el mayor programa de inversión pública de la historia reciente de España: 163.000 millones de euros (80.000 en transferencias directas y 83.000 en préstamos). Se articula en cuatro ejes: <strong>transición ecológica</strong> (39 % del total), <strong>transformación digital</strong> (28 %), <strong>cohesión social y territorial</strong>, y <strong>igualdad de género</strong>. El PRTR incluye reformas estructurales asociadas (mercado laboral, pensiones, vivienda, formación profesional, fiscalidad) y su ejecución se extiende hasta 2026.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Este tema es transversal en el currículo de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), conectando con CE1 (funcionamiento del sistema económico), CE3 (papel del sector público), CE4 (contexto económico nacional e internacional) y CE5 (formación de una ciudadanía económicamente responsable). Contribuye de forma destacada a las competencias <strong>CC</strong> (ciudadanía activa, comprensión de la realidad española), <strong>STEM</strong> (análisis de datos del INE, Eurostat, Banco de España), <strong>CE</strong> (iniciativa económica en el contexto español) y <strong>CCL</strong> (lectura de informes económicos). La conexión con la realidad próxima del alumnado (empleo, vivienda, precios, desigualdad) facilita un aprendizaje significativo y fomenta el juicio crítico.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="amber">
                    <p>
                        La economía española ha protagonizado una transformación extraordinaria desde la autarquía franquista hasta convertirse en la cuarta economía de la zona euro. Los hitos clave fueron el Plan de Estabilización (1959), el «milagro económico» de los 60, los Pactos de la Moncloa (1977), la adhesión a la CEE (1986), la adopción del euro (1999) y la recuperación tras la Gran Recesión. La estructura productiva refleja una economía terciarizada (servicios 74 % del PIB) con fortalezas en turismo, agroalimentario y automoción, pero con debilidades en productividad, inversión en I+D y desigualdad territorial. La corrección del déficit exterior, la internacionalización empresarial y la transición energética son logros recientes. Los retos actuales incluyen el envejecimiento demográfico, la sostenibilidad de las pensiones, la deuda pública, el acceso a la vivienda, la brecha de productividad y la transición ecológica, en un contexto marcado por los fondos Next Generation EU.
                    </p>
                </TheoryBlock>
            </Card>

                            <li>Terciarització: del 40% ocupació (1960) al 4% actual. Éxode rural massiu als anys 60.</li>
                            <li>SAU: 17,1 M ha. Regadiu: 3,8 M ha (22%) → 65% producció. Aigua = factor limitant clau.</li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">2. Principals produccions</h4>
                        <ul className="list-disc pl-5 space-y-1">
                            <li>Oli d'oliva: 1r productor mundial (50%). Andalusia 80%. DO i exportació.</li>
                            <li>Vinya: major superfície del món (~950.000 ha). 3r productor vi (Rioja, Ribera del Duero, Cava).</li>
                            <li>Fruites i hortalisses: 1r exportador UE. Cítrics (C. Valenciana), maduixes (Huelva), hivernacles (Almeria).</li>
                            <li>Cereals: 1r productor ordi UE. Ramaderia: porc (1r exportador UE, 34 M caps), boví, oví, aqüicultura.</li>
                            <li>Indústria agroalimentària: 1r sector manufacturer. Vendes &gt;140.000 M€. Exportacions: 68.000 M€ (2023).</li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">3. Estructures agràries</h4>
                        <ul className="list-disc pl-5 space-y-1">
                            <li>Latifundi (Andalusia, Extremadura) vs. minifundi (Galícia, cornisa cantàbrica).</li>
                            <li>Concentració: de 2,5 M explotacions (1960) a &lt;900.000 (2020). Mida mitjana: 20 ha (França: 63 ha).</li>
                            <li>Envelliment: &gt;40% titulars &gt;65 anys. Relleu generacional insuficient.</li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">4. PAC i Espanya</h4>
                        <ul className="list-disc pl-5 space-y-1">
                            <li>2n receptor UE (després de França). PAC 2023-27: ~48.000 M€ (~7.000 M€/any).</li>
                            <li>Reforma Fischler (2003): desacoblament, condicionalitat. Nova PAC: eco-esquemes, arquitectura verda.</li>
                            <li>Crítica: 20% perceptors reben 80% ajudes. Distribució desigual.</li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">5. Pesca i aqüicultura</h4>
                        <ul className="list-disc pl-5 space-y-1">
                            <li>1r país pesquer UE. Major consum peix pc d'Europa (42 kg/any). 7.880 km costa.</li>
                            <li>Flota reduïda: de 20.000 a &lt;9.000 vaixells. PPC: quotes, RMS, eliminació descarts.</li>
                            <li>Aqüicultura: 1r productor UE (340.000 t). Musclo (Galícia), daurada, llobarro, truita.</li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">6. Reptes actuals</h4>
                        <ul className="list-disc pl-5 space-y-1">
                            <li>Canvi climàtic: sequera, desertificació (74% territori en risc). Gestió aigua: reg per goteig, dessalinització.</li>
                            <li>«Espanya buidada»: despoblament rural (Sòria, Terol &lt;10 hab/km²).</li>
                            <li>Agricultura ecològica: 1r UE en superfície (2,6 M ha). Digitalització: agricultura de precisió (drons, IoT, IA).</li>
                        </ul>
                    </div>
                </div>

                <FormulaBox formula="SAU ≈ 17,1 M ha | Regadiu: 3,8 M ha → 65% producció" desc="L'aigua és el factor limitant fonamental" />

                <ClauBox>
                    <p>- Destaca Espanya com a <strong>potència agroalimentària</strong>: 1r oli d'oliva, 1r exportador fruites UE, 1r pesquer UE.</p>
                    <p>- Diferencia <strong>pes directe</strong> (&lt;3% PIB) del <strong>complex agroalimentari ampliat</strong> (~10-11%).</p>
                    <p>- Explica la <strong>PAC</strong> i la seua distribució desigual (20/80).</p>
                    <p>- Connecta amb <strong>canvi climàtic, gestió de l'aigua i despoblament rural</strong>.</p>
                    <p>- Inclou <strong>aqüicultura</strong> com a subsector amb major potencial de creixement.</p>
                </ClauBox>
            </Card>
        </div>
    );

    const Tema40 = () => {
        const [vista, setVista] = useState('complet');
        return (
            <div className="space-y-6">
                <SectionTitle icon="🌾" title="Tema 40" subtitle={t('tema40.title')} />
                <Tabs tabs={[
                    { id: 'complet', label: '📝 ' + t('tab.complet') },
                    { id: 'resum', label: '📋 ' + t('tab.resum') },
                ]} active={vista} onChange={setVista} />
                {vista === 'complet' && <Tema40Complet />}
                {vista === 'resum' && <Tema40Resum />}
            </div>
        );
    };

    // ════════════════════════════════════════════════════════════════
    // PLACEHOLDER — Temes 41-48
    // ════════════════════════════════════════════════════════════════
    const Placeholder = ({ num }) => (
        <div className="space-y-6 animate-fade">
            <SectionTitle icon="🇪🇸" title={`Tema ${num}`} subtitle={t(`tema${num}.title`)} />
            <Card>
                <div className="text-center py-16">
                    <span className="text-6xl mb-4 block">🚧</span>
                    <p className="text-lg font-semibold text-slate-600 mb-2">{t('placeholder.msg')}</p>
                </div>
            </Card>
        </div>
    );

    // ════════════════════════════════════════════════════════════════
    // NAVIGATION AND RENDER
    // ════════════════════════════════════════════════════════════════
    const headerSections = [
        { id: 'inicio', label: t('sec.inicio'), emoji: '🏠' },
        { id: 'tema39', label: 'T39', emoji: '🇪🇸' },
        { id: 'tema40', label: 'T40', emoji: '🌾' },
        { id: 'tema41', label: 'T41', emoji: '🇪🇸' },
        { id: 'tema42', label: 'T42', emoji: '🇪🇸' },
        { id: 'tema43', label: 'T43', emoji: '🇪🇸' },
        { id: 'tema44', label: 'T44', emoji: '🇪🇸' },
        { id: 'tema45', label: 'T45', emoji: '🇪🇸' },
        { id: 'tema46', label: 'T46', emoji: '🇪🇸' },
        { id: 'tema47', label: 'T47', emoji: '🇪🇸' },
        { id: 'tema48', label: 'T48', emoji: '🇪🇸' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}
                setIdioma={(lang) => { setIdioma(lang); PdeLanguageStore.set(lang); }}
                currentApp="oposicions-bloc-e"
                sections={headerSections}
                currentSection={section}
                setSection={setSection}
            />

            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}
                {section === 'tema39' && <Tema39 />}
                {section === 'tema40' && <Tema40 />}
                {section === 'tema41' && <Placeholder num={41} />}
                {section === 'tema42' && <Placeholder num={42} />}
                {section === 'tema43' && <Placeholder num={43} />}
                {section === 'tema44' && <Placeholder num={44} />}
                {section === 'tema45' && <Placeholder num={45} />}
                {section === 'tema46' && <Placeholder num={46} />}
                {section === 'tema47' && <Placeholder num={47} />}
                {section === 'tema48' && <Placeholder num={48} />}
            </main>

            <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
            <PdeFooter appEmoji="🇪🇸" appName={t('footer.appname')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<BlocEApp />, document.getElementById('root'));
    </script>
</body>
</html>
