    // TEMA 39 — La economía española: características y estructura productiva.
    // ════════════════════════════════════════════════════════════════
    const Tema39Complet = () => (
        <div className="space-y-6 animate-fade">
            {/* ── INTRODUCCIÓN ────────────────────────────────────── */}
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La <strong>economía española</strong> constituye uno de los casos más interesantes de transformación económica contemporánea. España pasó de ser una economía agraria, autárquica y relativamente atrasada a mediados del siglo XX a convertirse en la <strong>cuarta economía de la zona euro</strong> y la decimotercera del mundo por PIB nominal (FMI, 2024). Esta transformación no fue lineal: estuvo marcada por etapas de fuerte crecimiento (el «milagro económico» de los años 60, el boom posterior a la adhesión a la CEE en 1986, la expansión inmobiliaria de 1997-2007) y por crisis profundas (la crisis del petróleo de 1973, la reconversión industrial de los 80, la Gran Recesión de 2008-2013 y el impacto de la pandemia COVID-19 en 2020).
                    </p>
                    <p>
                        El estudio de la economía española es esencial para comprender la realidad económica en la que se desenvuelve el alumnado y para conectar los conceptos teóricos de la ciencia económica con datos, instituciones y políticas concretas. Desde la perspectiva curricular, este tema se enmarca en los saberes básicos del bloque «La economía española e internacional» de la materia de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022) y en las competencias específicas CE1 (funcionamiento del sistema económico), CE3 (papel del sector público) y CE4 (contexto económico nacional e internacional). La LOMLOE (Ley Orgánica 3/2020) enfatiza la necesidad de que el alumnado comprenda las características estructurales de la economía española, contribuyendo a las competencias CC (ciudadanía activa), STEM (análisis cuantitativo de datos macroeconómicos) y CE (comprensión de la iniciativa económica).
                    </p>
                    <p>
                        El presente tema se estructura en cinco epígrafes: en primer lugar, se aborda la evolución histórica de la economía española; en segundo lugar, se analizan sus características estructurales; en tercer lugar, se examina la estructura productiva por sectores; en cuarto lugar, se estudia la inserción exterior de la economía española; y en quinto lugar, se identifican los principales retos y desafíos actuales.
                    </p>
                </div>
            </Card>

            {/* ── DESARROLLO ──────────────────────────────────────── */}

            {/* Epígrafe 1 */}
            <Card title="1. Evolución histórica de la economía española" icon="📘">
                <TheoryBlock title="1.1. La autarquía y el primer franquismo (1939-1959)" color="amber">
                    <p>
                        Tras la Guerra Civil (1936-1939), el régimen franquista impuso un modelo de <strong>autarquía económica</strong> inspirado en los fascismos europeos: intervención estatal masiva, sustitución de importaciones, racionamiento, control de precios y restricción del comercio exterior. El resultado fue una economía estancada: en 1959, el PIB per cápita español apenas superaba el 60 % del promedio europeo occidental. El aislamiento internacional (exclusión de las Naciones Unidas hasta 1955, del Plan Marshall) agravó la situación.
                    </p>
                    <p>
                        La autarquía generó un <strong>mercado negro</strong> (estraperlo), escasez crónica de bienes de consumo, inflación reprimida, atraso tecnológico y una agricultura de subsistencia que mantenía a más del 40 % de la población activa en el sector primario.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. El Plan de Estabilización y el desarrollismo (1959-1973)" color="orange">
                    <p>
                        El <strong>Plan de Estabilización de 1959</strong>, impulsado por los tecnócratas del Opus Dei (López Rodó, Ullastres, Navarro Rubio) con el apoyo del FMI y la OCDE, marcó el giro hacia la liberalización: devaluación de la peseta, apertura comercial parcial, disciplina fiscal, atracción de inversión extranjera y eliminación de controles de precios. A partir de 1960, España experimentó el llamado <strong>«milagro económico español»</strong>: el PIB creció a una media del 7 % anual entre 1960 y 1973, la tasa más alta de Europa occidental junto con Italia y Japón.
                    </p>
                    <p>
                        Los <strong>Planes de Desarrollo</strong> (I: 1964-1967; II: 1968-1971; III: 1972-1975), de carácter indicativo (no vinculante para el sector privado), canalizaron la inversión pública hacia los <strong>polos de desarrollo</strong> (Vigo, Valladolid, Zaragoza, Sevilla, etc.) para fomentar la industrialización regional. Los motores del crecimiento fueron: la <strong>industrialización</strong> (especialmente automoción, siderurgia, química), las <strong>remesas de emigrantes</strong> (más de un millón de españoles emigraron a Alemania, Francia y Suiza), el <strong>turismo</strong> (España se convirtió en el primer destino turístico de masas de Europa) y la <strong>inversión extranjera directa</strong>.
                    </p>
                    <p>
                        Este periodo transformó radicalmente la estructura productiva: el sector primario pasó del 40 % al 20 % del empleo, mientras la industria y los servicios crecieron aceleradamente. Sin embargo, el crecimiento fue desequilibrado: elevada inflación, déficits exteriores recurrentes, desigualdad regional persistente y ausencia de libertades políticas y sindicales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. La crisis y la Transición (1973-1985)" color="amber">
                    <p>
                        La <strong>crisis del petróleo de 1973</strong> golpeó duramente a una economía altamente dependiente de las importaciones energéticas. La tardía reacción del régimen franquista (que subsidió los precios del petróleo para evitar conflictos sociales) agravó los desequilibrios. La muerte de Franco (1975) y la Transición democrática añadieron incertidumbre política.
                    </p>
                    <p>
                        Los <strong>Pactos de la Moncloa</strong> (1977), firmados por el gobierno de Suárez y los principales partidos políticos (incluido el PCE de Carrillo), constituyeron un hito: combinaron <strong>ajuste macroeconómico</strong> (contención salarial, devaluación, restricción monetaria) con <strong>reformas estructurales</strong> (reforma fiscal, Estatuto de los Trabajadores, reconocimiento del derecho de huelga).
                    </p>
                    <p>
                        La <strong>reconversión industrial</strong> de los años 80 (siderurgia, construcción naval, minería, textil) fue dolorosa pero necesaria: sectores obsoletos y sobredimensionados se reestructuraron con elevados costes sociales (desempleo, conflictividad laboral). El paro alcanzó el 21 % en 1985.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. La integración europea y la modernización (1986-2007)" color="orange">
                    <p>
                        La <strong>adhesión a la Comunidad Económica Europea</strong> (1 de enero de 1986) fue el hito más transformador de la economía española contemporánea. Supuso: <strong>apertura comercial plena</strong> (eliminación de aranceles intracomunitarios), acceso a los <strong>fondos estructurales y de cohesión</strong> (España fue el principal beneficiario neto hasta la ampliación de 2004, recibiendo más de 150.000 millones de euros entre 1986 y 2013), modernización de infraestructuras (AVE, autopistas, aeropuertos), convergencia regulatoria y normativa, y atracción de inversión extranjera.
                    </p>
                    <p>
                        La entrada en el <strong>Sistema Monetario Europeo</strong> (1989) y la posterior adopción del <strong>euro</strong> (1999, circulación en 2002) eliminaron el riesgo cambiario y redujeron drásticamente los tipos de interés, pero también privaron a España del instrumento de la devaluación competitiva.
                    </p>
                    <p>
                        Entre 1997 y 2007 España vivió una <strong>expansión extraordinaria</strong> impulsada por los bajos tipos de interés (convergencia hacia la zona euro), la inmigración masiva (la población extranjera pasó de 500.000 a 5,5 millones), el boom inmobiliario y de la construcción (que llegó a representar el 12 % del PIB y el 13 % del empleo), y el consumo financiado con crédito. El PIB per cápita español alcanzó el 105 % de la media de la UE-27 en 2007. Sin embargo, este modelo de crecimiento acumuló graves desequilibrios: burbuja inmobiliaria, endeudamiento privado excesivo (las familias y empresas españolas debían más del 200 % del PIB), déficit por cuenta corriente del 10 % del PIB y baja productividad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.5. La Gran Recesión y la recuperación (2008-2019)" color="amber">
                    <p>
                        El estallido de la burbuja inmobiliaria y la crisis financiera global (2008) provocaron la recesión más profunda desde la Guerra Civil. El PIB cayó un 9 % acumulado entre 2008 y 2013, el desempleo se disparó al <strong>26,9 %</strong> (2013, récord histórico), el sistema bancario requirió un <strong>rescate europeo</strong> de hasta 100.000 millones de euros (2012, a través del MEDE, del que se utilizaron 41.300 millones), la prima de riesgo alcanzó los 649 puntos básicos (julio 2012) y el déficit público superó el 11 % del PIB en 2009.
                    </p>
                    <p>
                        Las respuestas incluyeron: <strong>austeridad fiscal</strong> (recortes de gasto, subidas de impuestos, reforma del artículo 135 de la Constitución para incluir la estabilidad presupuestaria), <strong>reforma laboral</strong> (2012, flexibilización del despido y de la negociación colectiva), <strong>reestructuración bancaria</strong> (creación de la SAREB, fusiones de cajas de ahorro) y <strong>devaluación interna</strong> (moderación salarial para recuperar competitividad).
                    </p>
                    <p>
                        A partir de 2014 se inició una <strong>recuperación robusta</strong>: el PIB creció por encima del 3 % anual entre 2015 y 2017, impulsado por las exportaciones (que ganaron cuota de mercado mundial), el turismo (España se convirtió en el segundo destino turístico mundial por número de visitantes), los bajos precios del petróleo y la política monetaria expansiva del BCE (tipos de interés al 0 %, programa de compra de activos). El empleo creció hasta recuperar niveles precrisis a finales de 2019, aunque con mayor temporalidad y parcialidad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.6. La pandemia y el contexto actual (2020-presente)" color="orange">
                    <p>
                        La <strong>pandemia COVID-19</strong> (2020) provocó una caída del PIB del 11,2 %, la mayor entre las grandes economías europeas, debido a la elevada dependencia del turismo y la hostelería. La respuesta incluyó los <strong>ERTE</strong> (Expedientes de Regulación Temporal de Empleo, que llegaron a cubrir 3,4 millones de trabajadores), el <strong>Ingreso Mínimo Vital</strong>, las líneas de avales del ICO y, a nivel europeo, el programa <strong>Next Generation EU</strong> (España es el segundo mayor beneficiario con 163.000 millones de euros en transferencias y préstamos).
                    </p>
                    <p>
                        La recuperación posterior (2021-2024) fue progresiva: el PIB prepandemia se recuperó en el segundo trimestre de 2023. Sin embargo, la crisis energética derivada de la guerra de Ucrania (2022), la inflación (que alcanzó el 10,8 % en julio de 2022), las subidas de tipos del BCE y las tensiones geopolíticas han añadido nuevos desafíos. En 2024, el PIB per cápita español se sitúa en torno al 88 % de la media de la UE-27.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. Características estructurales de la economía española" icon="📘">
                <TheoryBlock title="2.1. Terciarización y desindustrialización" color="amber">
                    <p>
                        La economía española ha experimentado una profunda <strong>terciarización</strong>: el sector servicios representa actualmente alrededor del <strong>74 % del PIB</strong> y el <strong>77 % del empleo</strong>. La industria (incluida la energía) aporta aproximadamente el 16 % del PIB (frente al 20 % de la media de la UE), la construcción en torno al 6 % y el sector primario menos del 3 %. Esta estructura refleja la convergencia hacia el patrón de las economías avanzadas, pero con una participación industrial inferior a la de Alemania (24 %), Italia (19 %) o Francia (17 %), lo que constituye un debate recurrente sobre la necesidad de <strong>reindustrialización</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Dualidad del mercado laboral" color="orange">
                    <p>
                        El mercado de trabajo español presenta una <strong>dualidad estructural</strong> entre trabajadores con contratos indefinidos (elevada protección) y trabajadores con contratos temporales (alta rotación). Históricamente, la tasa de temporalidad española fue la más alta de la UE (superior al 30 %), aunque la <strong>reforma laboral de 2021</strong> la ha reducido significativamente (por debajo del 18 % en 2024). Otras características: elevado desempleo estructural (la tasa de paro raramente baja del 10-12 %, incluso en fases expansivas), desempleo juvenil muy elevado (superior al 25 %), brecha de género persistente y peso significativo de la economía sumergida (estimada entre el 17 % y el 22 % del PIB según diversos estudios).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Desequilibrios territoriales" color="amber">
                    <p>
                        España presenta una <strong>acusada desigualdad territorial</strong>. Las comunidades autónomas con mayor PIB per cápita (País Vasco, Madrid, Navarra, Cataluña) superan ampliamente a las de menor nivel (Extremadura, Andalucía, Castilla-La Mancha). El PIB per cápita del País Vasco es aproximadamente el doble que el de Extremadura. La «<strong>España vaciada</strong>» refleja el despoblamiento rural del interior (Castilla y León, Aragón, Extremadura), con densidades inferiores a 12 hab/km², frente a la concentración en las áreas metropolitanas costeras y Madrid.
                    </p>
                    <p>
                        Los mecanismos de corrección incluyen el <strong>sistema de financiación autonómica</strong> (Fondo de Garantía de Servicios Públicos Fundamentales), los fondos europeos de cohesión y las políticas de reto demográfico.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Déficit de productividad e innovación" color="orange">
                    <p>
                        La <strong>productividad total de los factores</strong> (PTF) española ha crecido menos que la media europea desde los años 90. España invierte en I+D+i aproximadamente el <strong>1,4 % del PIB</strong> (2023), muy por debajo de la media de la UE (2,2 %) y del objetivo del 3 % fijado por la Estrategia Europa 2020. El tejido empresarial está dominado por <strong>microempresas y pymes</strong> (el 99,8 % de las empresas tiene menos de 250 trabajadores; el 95 % tiene menos de 10), que invierten menos en I+D, internacionalización y digitalización. El <strong>nivel educativo</strong> ha mejorado, pero persisten tasas de abandono escolar temprano superiores a la media europea (13,6 % frente al 9,6 % de la UE en 2023).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Dependencia energética" color="amber">
                    <p>
                        España importa aproximadamente el <strong>70 % de la energía</strong> que consume (petróleo, gas natural), una dependencia superior a la media europea (~55 %). La <strong>transición energética</strong> está avanzando significativamente: en 2023, las energías renovables (eólica, solar fotovoltaica, hidráulica) generaron más del 50 % de la electricidad, convirtiendo a España en uno de los líderes europeos en energía solar. Sin embargo, la dependencia de combustibles fósiles para el transporte y la industria sigue siendo elevada.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. La estructura productiva: los tres sectores" icon="📘">
                <TheoryBlock title="3.1. El sector primario" color="amber">
                    <p>
                        El sector primario (agricultura, ganadería, silvicultura y pesca) aporta menos del <strong>3 % del PIB</strong> y emplea alrededor del <strong>4 % de la población activa</strong>. A pesar de su reducido peso, España es una <strong>potencia agroalimentaria</strong>: primer productor mundial de aceite de oliva, primer exportador de frutas y hortalizas de la UE, con una industria agroalimentaria que representa el primer sector industrial manufacturero del país. La <strong>Política Agrícola Común (PAC)</strong> es determinante: España recibe aproximadamente 7.000 millones de euros anuales en ayudas directas y desarrollo rural. (Este sector se desarrolla en profundidad en el Tema 40.)
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. El sector secundario" color="orange">
                    <p>
                        La industria manufacturera y la energía representan alrededor del <strong>16 % del PIB</strong>. Los subsectores más relevantes son: <strong>automoción</strong> (España es el segundo fabricante de vehículos de la UE y el octavo del mundo), <strong>agroalimentario</strong>, <strong>químico y farmacéutico</strong>, <strong>metalúrgico</strong>, <strong>cerámico</strong> (Castellón es líder mundial) y <strong>textil-moda</strong> (Inditex). La geografía industrial se concentra en Cataluña, País Vasco, Comunidad Valenciana, Madrid y Aragón.
                    </p>
                    <p>
                        La <strong>construcción</strong>, tradicionalmente un sector clave (llegó a representar el 12 % del PIB en 2006-2007), se contrajo drásticamente tras la crisis de 2008 y actualmente aporta en torno al 6 % del PIB, con una recuperación gradual vinculada a la rehabilitación energética de edificios y las inversiones del Plan de Recuperación.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. El sector terciario" color="amber">
                    <p>
                        Los servicios representan aproximadamente el <strong>74 % del PIB</strong> y el <strong>77 % del empleo</strong>. Los subsectores principales son:
                    </p>
                    <p>
                        <strong>Turismo:</strong> España es la segunda potencia turística mundial por número de visitantes internacionales (85 millones en 2023) y la segunda por ingresos. El turismo contribuye directa e indirectamente alrededor del <strong>12,8 % del PIB</strong> y emplea a más de 2,6 millones de personas. (Se desarrolla en el Tema 42.)
                    </p>
                    <p>
                        <strong>Comercio:</strong> tanto minorista como mayorista, es uno de los principales empleadores. La distribución comercial ha experimentado una transformación con la expansión de las grandes superficies, el comercio electrónico y la logística.
                    </p>
                    <p>
                        <strong>Servicios financieros, inmobiliarios y profesionales:</strong> aportan conjuntamente más del 20 % del PIB. El sector bancario español, tras la profunda reestructuración de 2008-2015, está dominado por cinco grandes entidades (Santander, BBVA, CaixaBank, Sabadell, Bankinter).
                    </p>
                    <p>
                        <strong>Administración pública, sanidad y educación:</strong> los servicios públicos representan alrededor del 18 % del PIB, reflejando el modelo de Estado del bienestar español.
                    </p>
                    <p>
                        <strong>Transporte y logística:</strong> España cuenta con una de las mejores redes de infraestructuras de Europa (segunda red de AVE del mundo por kilómetros, tras China), puertos estratégicos (Algeciras, Valencia, Barcelona) y una posición geográfica privilegiada como puente entre Europa y África/América Latina.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="PIB España (2024) ≈ 1,46 billones € | PIBpc ≈ 30.400 €"
                    desc="Cuarta economía de la zona euro (tras Alemania, Francia e Italia)"
                />
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. La inserción exterior de la economía española" icon="📘">
                <TheoryBlock title="4.1. Comercio exterior de bienes y servicios" color="amber">
                    <p>
                        La economía española ha experimentado una <strong>apertura comercial creciente</strong>: la suma de exportaciones e importaciones de bienes y servicios supera el 70 % del PIB. Las <strong>exportaciones de bienes</strong> alcanzaron 371.000 millones de euros en 2023, con un crecimiento sostenido que ha llevado a España a ganar cuota de mercado mundial (del 1,6 % al 1,8 % entre 2010 y 2023). Los principales productos exportados son: automóviles y componentes, productos agroalimentarios (frutas, hortalizas, aceite, vino, carne de cerdo), productos químicos y farmacéuticos, maquinaria y bienes de equipo.
                    </p>
                    <p>
                        El <strong>destino principal</strong> de las exportaciones es la UE (aproximadamente el 65 %), siendo Francia, Alemania, Italia y Portugal los principales socios. Fuera de la UE destacan Reino Unido, Estados Unidos, Marruecos y China.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La balanza por cuenta corriente" color="orange">
                    <p>
                        Históricamente, España tuvo una <strong>balanza por cuenta corriente deficitaria</strong>, que alcanzó un déficit récord del 10 % del PIB en 2007 (indicador del sobrecalentamiento de la economía). Uno de los cambios estructurales más significativos derivados de la crisis de 2008 fue la <strong>corrección del déficit exterior</strong>: la balanza por cuenta corriente ha registrado superávit desde 2013, gracias al crecimiento de las exportaciones, la contención de las importaciones, el superávit turístico y la moderación salarial. En 2023, la balanza por cuenta corriente registró un superávit del 2,6 % del PIB.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Inversión extranjera directa (IED)" color="amber">
                    <p>
                        España es un receptor significativo de <strong>IED</strong> (stock acumulado superior a 500.000 millones de euros) y simultáneamente un inversor importante en el exterior (las grandes empresas españolas — Santander, Telefónica, Iberdrola, Ferrovial, Inditex — tienen una presencia global significativa, especialmente en América Latina, Europa y EE. UU.). La internacionalización de la empresa española es uno de los cambios estructurales más positivos de las últimas décadas.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. Retos y desafíos actuales de la economía española" icon="📘">
                <TheoryBlock title="5.1. Retos económicos" color="amber">
                    <p>
                        <strong>Productividad y digitalización:</strong> elevar la productividad mediante la inversión en I+D+i (acercarse al 3 % del PIB), la digitalización del tejido empresarial (especialmente pymes), la formación continua y la atracción de talento.<br/>
                        <strong>Sostenibilidad del sistema de pensiones:</strong> el envejecimiento demográfico (la tasa de dependencia de mayores de 65 años pasará del 30 % al 50 % en 2050) presiona el sistema de reparto. Las reformas de 2021-2023 (revalorización con el IPC, MEI —Mecanismo de Equidad Intergeneracional—, incentivos a la jubilación demorada) buscan garantizar la sostenibilidad.<br/>
                        <strong>Deuda pública:</strong> la ratio deuda/PIB alcanzó el 120 % tras la pandemia y se sitúa en torno al 107 % en 2024, por encima del límite del 60 % del Pacto de Estabilidad.<br/>
                        <strong>Acceso a la vivienda:</strong> los precios de la vivienda y los alquileres han crecido por encima de los salarios, especialmente en las grandes ciudades, generando un problema de accesibilidad para los jóvenes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Retos sociales y demográficos" color="orange">
                    <p>
                        <strong>Envejecimiento demográfico:</strong> España tiene una de las tasas de fecundidad más bajas del mundo (1,16 hijos por mujer en 2023), y la inmigración se ha convertido en el principal factor de crecimiento poblacional.<br/>
                        <strong>Desigualdad:</strong> el coeficiente de Gini español (33,0 en 2023) es superior a la media de la UE (29,6), con una desigualdad que se concentra en el acceso a la vivienda, la precariedad laboral y la brecha territorial.<br/>
                        <strong>Transición ecológica:</strong> descarbonización de la economía, cumplimiento de los compromisos del Acuerdo de París y del Pacto Verde Europeo (reducción del 55 % de las emisiones para 2030), transición justa para las comarcas dependientes de actividades contaminantes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Los fondos Next Generation EU" color="amber">
                    <p>
                        El <strong>Plan de Recuperación, Transformación y Resiliencia</strong> (PRTR), financiado con fondos Next Generation EU, es el mayor programa de inversión pública de la historia reciente de España: 163.000 millones de euros (80.000 en transferencias directas y 83.000 en préstamos). Se articula en cuatro ejes: <strong>transición ecológica</strong> (39 % del total), <strong>transformación digital</strong> (28 %), <strong>cohesión social y territorial</strong>, y <strong>igualdad de género</strong>. El PRTR incluye reformas estructurales asociadas (mercado laboral, pensiones, vivienda, formación profesional, fiscalidad) y su ejecución se extiende hasta 2026.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Este tema es transversal en el currículo de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), conectando con CE1 (funcionamiento del sistema económico), CE3 (papel del sector público), CE4 (contexto económico nacional e internacional) y CE5 (formación de una ciudadanía económicamente responsable). Contribuye de forma destacada a las competencias <strong>CC</strong> (ciudadanía activa, comprensión de la realidad española), <strong>STEM</strong> (análisis de datos del INE, Eurostat, Banco de España), <strong>CE</strong> (iniciativa económica en el contexto español) y <strong>CCL</strong> (lectura de informes económicos). La conexión con la realidad próxima del alumnado (empleo, vivienda, precios, desigualdad) facilita un aprendizaje significativo y fomenta el juicio crítico.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="amber">
                    <p>
                        La economía española ha protagonizado una transformación extraordinaria desde la autarquía franquista hasta convertirse en la cuarta economía de la zona euro. Los hitos clave fueron el Plan de Estabilización (1959), el «milagro económico» de los 60, los Pactos de la Moncloa (1977), la adhesión a la CEE (1986), la adopción del euro (1999) y la recuperación tras la Gran Recesión. La estructura productiva refleja una economía terciarizada (servicios 74 % del PIB) con fortalezas en turismo, agroalimentario y automoción, pero con debilidades en productividad, inversión en I+D y desigualdad territorial. La corrección del déficit exterior, la internacionalización empresarial y la transición energética son logros recientes. Los retos actuales incluyen el envejecimiento demográfico, la sostenibilidad de las pensiones, la deuda pública, el acceso a la vivienda, la brecha de productividad y la transición ecológica, en un contexto marcado por los fondos Next Generation EU.
                    </p>
                </TheoryBlock>
            </Card>

    const Tema43Complet = () => (

            <Card title="1. Funciones del sector público en la economía" icon="📘">
                <TheoryBlock title="1.1. Las funciones de Musgrave" color="amber">
                    <p>
                        Según la clasificación clásica de <strong>Richard Musgrave</strong> (1959), el sector público cumple tres funciones económicas fundamentales:
                    </p>
                    <p>
                        <strong>1. Función asignativa (eficiencia):</strong> corregir las falladas de mercado —bienes públicos (defensa, alumbrado), externalidades (contaminación, educación), monopolios naturales, información asimétrica— y proveer bienes y servicios que el mercado no suministra eficientemente.<br/>
                        <strong>2. Función redistributiva (equidad):</strong> reducir las desigualdades de renta y riqueza mediante impuestos progresivos, transferencias sociales (pensiones, prestaciones por desempleo, ayudas a familias) y servicios públicos universales (sanidad, educación).<br/>
                        <strong>3. Función estabilizadora:</strong> suavizar los ciclos económicos mediante la política fiscal (aumento del gasto y reducción de impuestos en recesiones, consolidación en expansiones) y los estabilizadores automáticos (impuesto sobre la renta progresivo, prestaciones por desempleo).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. El Estado del bienestar español" color="orange">
                    <p>
                        El <strong>Estado del bienestar</strong> español se desarrolló tardíamente respecto al norte de Europa: los pilares fundamentales se construyeron en la Transición y la consolidación democrática (1978-1992): <strong>Sistema Nacional de Salud</strong> (Ley General de Sanidad, 1986: cobertura universal), <strong>educación pública</strong> (LODE 1985, LOGSE 1990), <strong>sistema de pensiones</strong> contributivas (Pacto de Toledo, 1995) y <strong>protección por desempleo</strong>.
                    </p>
                    <p>
                        El gasto social español (sanidad, educación, pensiones, protección social) representa aproximadamente el <strong>26 % del PIB</strong>, por debajo de la media de la UE (~28 %) y significativamente inferior al de Francia (~34 %) o los países nórdicos (~30 %). Este menor nivel de gasto social explica en parte que España tenga indicadores de desigualdad y pobreza superiores a la media europea.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Estructura de las Administraciones Públicas" icon="📘">
                <TheoryBlock title="2.1. Los tres niveles de gobierno" color="amber">
                    <p>
                        La Constitución de 1978 (Título VIII) estableció un modelo de organización territorial profundamente descentralizado:
                    </p>
                    <p>
                        <strong>Administración General del Estado (AGE):</strong> competencias exclusivas en defensa, relaciones exteriores, justicia, inmigración, legislación básica, Seguridad Social (pensiones y prestaciones). Representa aproximadamente el 21 % del gasto público total (excluida la Seguridad Social).<br/>
                        <strong>Comunidades Autónomas (17 CCAA + 2 ciudades autónomas):</strong> competencias en sanidad, educación, servicios sociales, vivienda, agricultura, medio ambiente, empleo, comercio interior, cultura. Gestionan aproximadamente el <strong>36 % del gasto público</strong> y son el nivel de gobierno con mayor impacto en la vida cotidiana de los ciudadanos.<br/>
                        <strong>Entidades Locales (8.131 municipios, provincias, cabildos/consejos insulares):</strong> competencias en urbanismo, agua, residuos, alumbrado, transporte urbano, policía local, servicios sociales de proximidad. Representan aproximadamente el 13 % del gasto público.<br/>
                        <strong>Seguridad Social:</strong> gestiona las pensiones contributivas, las prestaciones por desempleo, la incapacidad temporal, las prestaciones por maternidad/paternidad, etc. Representa aproximadamente el 30 % del gasto público total.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. La financiación autonómica" color="orange">
                    <p>
                        Coexisten dos modelos de financiación: el <strong>régimen común</strong> (15 CCAA) y el <strong>régimen foral</strong> (País Vasco y Navarra).
                    </p>
                    <p>
                        <strong>Régimen común:</strong> las CCAA reciben una cesta de tributos (50 % del IRPF, 50 % del IVA, 58 % de los Impuestos Especiales, impuestos propios) más transferencias del Estado (Fondo de Garantía de Servicios Públicos Fundamentales, Fondo de Suficiencia, Fondo de Competitividad, Fondo de Cooperación). El sistema busca garantizar un nivel mínimo de servicios públicos en todo el territorio.<br/>
                        <strong>Régimen foral (concierto/convenio):</strong> País Vasco y Navarra recaudan todos los impuestos en su territorio y pagan un «cupo» o «aportación» al Estado por los servicios que éste presta (defensa, Exterior, etc.).
                    </p>
                    <p>
                        La <strong>reforma de la financiación autonómica</strong> es uno de los debates políticos más candentes: el sistema vigente (2009) está caducado, con diferencias significativas de financiación per cápita entre CCAA y tensiones sobre la nivelación, la corresponsabilidad fiscal y la solidaridad interterritorial.
                    </p>

            <Card title="3. Los Presupuestos Generales del Estado" icon="📘">
                <TheoryBlock title="3.1. Concepto y elaboración" color="amber">
                    <p>

                    </p>
                    <p>
                        <strong>Ciclo presupuestario:</strong> elaboración (Ministerio de Hacienda, negociación con ministerios), aprobación parlamentaria, ejecución (gestión del gasto), control (Intervención General, Tribunal de Cuentas).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Estructura de ingresos" color="orange">
                    <p>

                    </p>
                    <p>
                        <strong>IRPF:</strong> ~8,5 % del PIB. Impuesto progresivo con tipos del 19 % al 47 % (más tramo autonómico). Principal fuente de ingresos.<br/>

                        <strong>Impuesto sobre Sociedades:</strong> ~2,5 % del PIB. Tipo general 25 % (15 % para pymes de nueva creación).<br/>
                        <strong>Cotizaciones sociales:</strong> ~12 % del PIB. Financian las pensiones y prestaciones de la Seguridad Social.<br/>
                        <strong>Impuestos Especiales:</strong> hidrocarburos, tabaco, alcohol, electricidad.<br/>
                        <strong>Otros:</strong> tasas, precios públicos, ingresos patrimoniales, transferencias de la UE.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Estructura de gastos" color="amber">
                    <p>
                        El gasto público total es de aproximadamente el <strong>47 % del PIB</strong>. Las principales partidas:
                    </p>

                        <strong>Educación:</strong> ~4,5 % del PIB. Competencia autonómica.<br/>
                        <strong>Prestaciones por desempleo:</strong> ~1,5-2 % del PIB (varía con el ciclo).<br/>

                        <strong>Inversión pública:</strong> ~2 % del PIB (infraestructuras, I+D, equipamiento).<br/>

            <Card title="4. El sistema tributario español" icon="📘">
                <TheoryBlock title="4.1. Principios constitucionales" color="amber">
                    <p>
                        El artículo 31.1 de la Constitución establece los principios del sistema tributario: <strong>capacidad económica</strong> (quien más tiene, más paga), <strong>igualdad</strong>, <strong>progresividad</strong> (tipos marginales crecientes), <strong>no confiscatoriedad</strong> y <strong>justicia</strong>. Estos principios informan la estructura de los principales impuestos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Impuestos directos e indirectos" color="orange">
                    <p>
                        <strong>Impuestos directos</strong> (gravan la renta y el patrimonio): IRPF (principal impuesto, progresivo), Impuesto sobre Sociedades (IS), Impuesto sobre el Patrimonio, Impuesto sobre Sucesiones y Donaciones (competencia autonómica, con grandes diferencias entre CCAA).<br/>
                        <strong>Impuestos indirectos</strong> (gravan el consumo): IVA (principal impuesto indirecto), Impuestos Especiales (hidrocarburos, tabaco, alcohol, electricidad), Impuesto sobre Transmisiones Patrimoniales y Actos Jurídicos Documentados.
                    </p>
                    <p>
                        España tiene una <strong>brecha fiscal</strong> respecto a la UE de aproximadamente 3 puntos de PIB, atribuida a: menor recaudación efectiva del IVA (tipos reducidos generosos, economía sumergida), Impuesto de Sociedades con base imponible erosionada (deducciones, exenciones, planificación fiscal), menor presión sobre el patrimonio y la herencia, y mayor economía sumergida (~18-22 % del PIB).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. La Agencia Tributaria (AEAT)" color="amber">
                    <p>
                        La <strong>Agencia Estatal de Administración Tributaria (AEAT)</strong>, creada en 1992, es el órgano encargado de la gestión, inspección y recaudación de los tributos estatales. España ha sido pionera en la administración tributaria electrónica: la declaración telemática del IRPF, el sistema SII (Suministro Inmediato de Información del IVA) y el uso de big data para la detección del fraude son referentes internacionales. La lucha contra el <strong>fraude fiscal</strong> y la economía sumergida sigue siendo una prioridad.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Retos actuales de la hacienda pública española" icon="📘">
                <TheoryBlock title="5.1. Sostenibilidad fiscal y deuda pública" color="amber">
                    <p>
                        La <strong>deuda pública</strong> española alcanzó el 120,3 % del PIB en 2020 (pandemia) y se sitúa en torno al <strong>107 % del PIB</strong> en 2024 (~1,56 billones de euros), muy por encima del límite del 60 % del Pacto de Estabilidad y Crecimiento. El <strong>déficit público</strong> se mantiene en torno al 3-4 % del PIB. Las nuevas reglas fiscales europeas (2024) exigen planes de ajuste a medio plazo para reconducir la deuda.
                    </p>
                    <p>
                        El coste de los intereses de la deuda (~35.000 millones €/año) limita la capacidad de inversión pública. La <strong>sostenibilidad fiscal a largo plazo</strong> depende de: el crecimiento económico (que aumenta la base fiscal), la contención del gasto en pensiones y sanidad (presionado por el envejecimiento), la mejora de la recaudación (cierre de la brecha fiscal con la UE) y la disciplina presupuestaria.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. La reforma del sistema de pensiones" color="orange">
                    <p>
                        El sistema de pensiones español es de <strong>reparto</strong> (las cotizaciones actuales financian las pensiones actuales), con una <strong>tasa de sustitución</strong> elevada (~80 % del último salario, la más alta de la OCDE). El envejecimiento demográfico (baby boomers jubilándose desde 2024, tasa de fecundidad de 1,16) incrementará el gasto en pensiones del 13 % actual a un estimado 15-17 % del PIB en 2050.
                    </p>
                    <p>
                        Las <strong>reformas de 2021-2023</strong> (bajo el marco Next Generation EU): revalorización de pensiones con el IPC (garantiza poder adquisitivo), <strong>MEI</strong> (Mecanismo de Equidad Intergeneracional: cotización adicional del 0,6 % hasta 2050 para crear un fondo de reserva), incremento de la base máxima de cotización, incentivos a la jubilación demorada, penalización de la jubilación anticipada. El <strong>Pacto de Toledo</strong> (comisión parlamentaria creada en 1995) sigue siendo el marco de consenso para las reformas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. La financiación autonómica" color="amber">
                    <p>
                        El modelo de financiación autonómica vigente (Ley 22/2009) está caducado y genera controversia: las diferencias de financiación per cápita entre CCAA de régimen común superan el 25 %, con CCAA como la Comunidad Valenciana o Murcia sistemáticamente infrafinanciadas. La reforma debe equilibrar: <strong>corresponsabilidad fiscal</strong> (que las CCAA asuman las consecuencias de sus decisiones de gasto), <strong>solidaridad interterritorial</strong> (nivelación para garantizar servicios mínimos) y <strong>suficiencia</strong> (financiación adecuada para las competencias transferidas).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. La eficiencia del gasto público" color="orange">
                    <p>
                        España se enfrenta al reto de <strong>hacer más con menos</strong>: mejorar la eficiencia de la sanidad pública (listas de espera, integración de niveles asistenciales), la educación (reducir el abandono escolar, mejorar resultados PISA), la justicia (lentitud procesal) y la Administración (digitalización, simplificación burocrática, evaluación de políticas públicas). La <strong>AIReF</strong> (Autoridad Independiente de Responsabilidad Fiscal, creada en 2013) evalúa las previsiones presupuestarias y la eficiencia del gasto (spending reviews).
                    </p>
                </TheoryBlock>
            </Card>

                        <strong>Desajuste educativo (skills mismatch):</strong> España tiene simultáneamente una de las tasas más altas de sobrecualificación (30 % de los universitarios trabajan en puestos que no requieren titulación superior) y de infracualificación (abandono escolar temprano del 13,6 %). La FP ha sido históricamente infravalorada.<br/>
                        <strong>Estructura productiva:</strong> el peso excesivo de sectores intensivos en empleo de baja cualificación y alta estacionalidad (construcción, turismo, hostelería) amplifica los ciclos de empleo y destrucción.

                    </p>

                        El mercado laboral español se caracteriza por un desempleo estructural elevado (~11 % en 2024, el más alto de la UE tras Grecia), un desempleo juvenil del 28 %, una temporalidad en descenso (del 30+ % al 16-17 % tras la reforma de 2021), brecha de género y economía sumergida (17-22 % del PIB). Las causas son estructurales (dualidad contractual histórica, desajuste educativo, estructura productiva) y cíclicas (alta elasticidad empleo-PIB). La reforma laboral de 2021 (eliminación del contrato de obra, prevalencia del convenio sectorial, ERTE permanentes) ha mejorado la calidad del empleo. El SMI ha subido un 54 % hasta 1.134 €/mes. Los retos: digitalización y automatización (22 % de empleos en riesgo alto), envejecimiento (necesidad de inmigración), reducción de jornada, formación continua y mejora de las políticas activas de empleo.

                    </p>

                        <strong>1.</strong> Incrementar la productividad agrícola mediante el progreso técnico y el uso óptimo de los factores de producción.<br/>
                        <strong>2.</strong> Garantizar un nivel de vida equitativo a la población agraria.<br/>
                        <strong>3.</strong> Estabilizar los mercados agrarios.<br/>
                        <strong>4.</strong> Garantizar la seguridad del abastecimiento alimentario.<br/>
                        <strong>5.</strong> Asegurar precios razonables a los consumidores.
                    </p>
                    <p>
                        A estos objetivos se han añadido con el tiempo: la protección del <strong>medio ambiente</strong>, la lucha contra el <strong>cambio climático</strong>, la preservación del <strong>medio rural</strong> (multifuncionalidad) y la garantía de la <strong>seguridad alimentaria</strong> (calidad, trazabilidad, bienestar animal).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Evolución y grandes reformas de la PAC" icon="📘">
                <TheoryBlock title="2.1. La PAC clásica (1962-1992): precios de garantía" color="amber">
                    <p>
                        El instrumento central de la PAC original fue el sistema de <strong>precios de garantía</strong> (precios de intervención): la Comunidad garantizaba a los agricultores un precio mínimo por sus productos. Si el precio de mercado caía por debajo del precio de intervención, los organismos públicos compraban los excedentes y los almacenaban. Simultáneamente, se aplicaban <strong>aranceles variables</strong> (prélèvements) a las importaciones y <strong>restituciones a la exportación</strong> (subvenciones para vender los excedentes en el mercado mundial a precios inferiores).
                    </p>
                    <p>
                        <strong>Resultados:</strong> la PAC logró sus objetivos de productividad y autoabastecimiento, pero generó graves efectos perversos: <strong>excedentes crónicos</strong> («lagos de leche», «montañas de mantequilla»), coste presupuestario creciente (70 % del presupuesto comunitario), distorsión del comercio mundial (dumping de exportaciones subvencionadas, denunciado por EE. UU. y los países en desarrollo en el GATT/OMC), daño ambiental (intensificación, contaminación por nitratos, pérdida de biodiversidad) y distribución desigual (los grandes productores del norte de Europa recibían la mayoría de las ayudas).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Reforma MacSharry (1992)" color="orange">
                    <p>
                        Primera gran reforma, impulsada por la presión de la <strong>Ronda Uruguay del GATT</strong> y la necesidad de reducir excedentes. <strong>Medidas:</strong> reducción de los precios de intervención (cereales: −29 %, carne de vacuno: −15 %) compensada con <strong>pagos directos por hectárea o cabeza de ganado</strong> (acoplados a la producción). Introducción de medidas <strong>agroambientales</strong> y de <strong>retirada de tierras</strong> (set-aside) obligatoria.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Agenda 2000 y reforma Fischler (2003)" color="amber">
                    <p>
                        La <strong>Agenda 2000</strong> profundizó la reducción de precios de intervención y creó el <strong>segundo pilar</strong> de la PAC: el <strong>desarrollo rural</strong> (diversificación, agroturismo, medio ambiente, infraestructuras rurales), diferenciado del primer pilar (pagos directos y mercados).
                    </p>
                    <p>
                        La <strong>reforma Fischler (2003)</strong> fue la más radical: introdujo el <strong>desacoplamiento</strong> (pago único por explotación, desvinculado de lo que se produce: el agricultor cobra la ayuda sin obligación de producir un bien concreto), la <strong>condicionalidad</strong> (cumplimiento de requisitos de medio ambiente, seguridad alimentaria, bienestar animal y buenas prácticas agrarias como condición para recibir la ayuda) y la <strong>modulación</strong> (transferencia de fondos del primer pilar al segundo pilar).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. La PAC 2023-2027: arquitectura verde" color="orange">
                    <p>
                        La última reforma (reglamentos aprobados en 2021, aplicación desde enero de 2023) introduce cambios significativos:
                    </p>
                    <p>
                        <strong>Planes Estratégicos Nacionales:</strong> cada Estado miembro elabora un plan que adapta la PAC a sus circunstancias (mayor subsidiariedad).<br/>
                        <strong>Arquitectura verde reforzada:</strong> <strong>condicionalidad reforzada</strong> (BCAM — Buenas Condiciones Agrarias y Medioambientales: rotación de cultivos, mantenimiento de pastos permanentes, zonas no productivas para biodiversidad) + <strong>eco-esquemas</strong> (pagos voluntarios por prácticas agrícolas beneficiosas para el clima y el medio ambiente: agricultura ecológica, cubiertas vegetales, pastoreo extensivo, siega sostenible).<br/>
                        <strong>Redistribución:</strong> pago redistributivo obligatorio (transferencia de ayudas de las grandes explotaciones a las pequeñas y medianas), techo a los pagos directos.<br/>
                        <strong>Jóvenes agricultores:</strong> al menos 3 % del presupuesto del primer pilar para facilitar la incorporación de jóvenes al campo.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Instrumentos actuales de la PAC" icon="📘">
                <TheoryBlock title="3.1. Primer pilar: pagos directos y mercados" color="amber">
                    <p>
                        <strong>Pagos directos</strong> (FEAGA — Fondo Europeo Agrícola de Garantía): constituyen la parte principal del presupuesto PAC. Incluyen: pago básico por hectárea (desacoplado), pago redistributivo (complemento para las primeras hectáreas), pago por jóvenes agricultores, eco-esquemas y ayudas asociadas a la producción (acopladas, para sectores vulnerables: ganadería extensiva, proteaginosas, arroz, algodón, tomate).
                    </p>
                    <p>
                        <strong>Organización común de mercados (OCM):</strong> red de seguridad (intervención pública, almacenamiento privado), normas de comercialización, protección exterior (aranceles, contingentes), promoción de productos europeos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Segundo pilar: desarrollo rural" color="orange">
                    <p>
                        <strong>Desarrollo rural</strong> (FEADER — Fondo Europeo Agrícola de Desarrollo Rural): cofinanciado por los Estados miembros. Incluye: inversiones en explotaciones (modernización, regadío), agroambiente y clima (pagos por prácticas ambientales), agricultura ecológica, zonas con limitaciones naturales (montaña, zonas desfavorecidas), instalación de jóvenes agricultores, diversificación económica (turismo rural, artesanía), programa LEADER (desarrollo local participativo).
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="PAC 2023-27: ~387.000 M€ = FEAGA (270.000 M€) + FEADER (87.000 M€) + transferencias"
                    desc="~31% del presupuesto de la UE. España: ~48.000 M€ (2.º receptor)"
                />
            </Card>

            <Card title="4. Impacto de la PAC en España" icon="📘">
                <TheoryBlock title="4.1. España como beneficiaria" color="amber">
                    <p>
                        España es el <strong>segundo mayor receptor</strong> de fondos PAC (tras Francia), con aproximadamente <strong>48.000 millones de euros</strong> para 2023-2027 (~7.000 M€/año). La distribución: el primer pilar (pagos directos) absorbe aproximadamente el 75 % y el segundo pilar (desarrollo rural) el 25 %.
                    </p>
                    <p>
                        <strong>Principales cultivos y sectores beneficiarios:</strong> olivar (Andalucía), cereales (Castilla y León, Castilla-La Mancha, Aragón), viñedo, frutas y hortalizas (a través de las Organizaciones de Productores), ganadería extensiva (vacuno, ovino), arroz, algodón, tomate.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Distribución desigual" color="orange">
                    <p>
                        La principal crítica a la PAC en España es la <strong>distribución desigual</strong> de los pagos directos: el 20 % de los perceptores recibe aproximadamente el 80 % de las ayudas. Los grandes terratenientes y empresas agroindustriales (explotaciones de más de 500 ha en Andalucía, Castilla-La Mancha, Extremadura) cobran sumas elevadas, mientras los pequeños agricultores y ganaderos de zonas de montaña o minifundio reciben cantidades modestas. El pago redistributivo y los eco-esquemas intentan corregir parcialmente esta desigualdad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. El Plan Estratégico PAC de España 2023-2027" color="amber">
                    <p>
                        El <strong>PEPAC</strong> (Plan Estratégico de la PAC de España) establece las prioridades: apoyo a la renta agraria, mejora de la competitividad, incorporación de jóvenes, transición ecológica (los eco-esquemas representan el 23 % de los pagos directos), gestión sostenible del agua, lucha contra la despoblación rural, mejora de la cadena alimentaria y bienestar animal. España ha diseñado 7 eco-esquemas: pastoreo extensivo, siega sostenible, rotación de cultivos con leguminosas, cubiertas vegetales, agricultura de precisión, espacios de biodiversidad y agricultura ecológica.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Retos y debate sobre el futuro de la PAC" icon="📘">
                <TheoryBlock title="5.1. Sostenibilidad ambiental" color="amber">
                    <p>
                        La PAC es criticada por ambientalistas por no ir lo bastante lejos en la transición ecológica: la intensificación agrícola ha contribuido a la pérdida de biodiversidad (un tercio de las aves agrarias europeas han desaparecido desde 1980), la contaminación por nitratos, la degradación de suelos y las emisiones de GEI (la agricultura representa el 10 % de las emisiones de la UE). El debate sobre la «<strong>PAC verde</strong>» enfrenta a quienes piden más ambición ambiental (organizaciones ecologistas, parte del Parlamento Europeo) con quienes priorizan la renta agraria y la producción (sindicatos agrarios, algunos Estados miembros).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Seguridad alimentaria vs. soberanía alimentaria" color="orange">
                    <p>
                        La guerra de Ucrania (2022) reabrió el debate sobre la <strong>seguridad alimentaria</strong>: la UE es importadora neta de piensos (soja), fertilizantes y energía para la agricultura. La tensión entre producir más (seguridad) y producir mejor (sostenibilidad) define el debate actual. El concepto de <strong>soberanía alimentaria</strong> (capacidad de decidir autónomamente las políticas alimentarias) gana peso político.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Protestas agrarias" color="amber">
                    <p>
                        Las <strong>protestas de los agricultores europeos</strong> (2023-2024, con tractoradas masivas en Francia, Alemania, España, Bélgica, Polonia) reflejaron el malestar del sector: precios bajos en origen (el agricultor recibe una fracción cada vez menor del precio final), incremento de costes (energía, fertilizantes, semillas), burocracia excesiva (condicionalidad verde percibida como onerosa), competencia de importaciones de terceros países con menores estándares y envejecimiento demográfico. La Comisión Europea respondió con flexibilizaciones de la condicionalidad (2024).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Este tema conecta con los saberes básicos de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022) sobre integración europea, política económica y sostenibilidad, y con los contenidos transversales de educación ambiental y ciudadanía europea. Contribuye a las competencias <strong>CC</strong> (ciudadanía europea, debates sobre la PAC), <strong>STEM</strong> (datos del MAPA, Eurostat, FEGA), <strong>CPSAA</strong> (juicio crítico sobre subvenciones, sostenibilidad, distribución) y <strong>CE</strong> (emprendimiento agrario).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="amber">
                    <p>
                        La PAC, nacida en 1962 para garantizar la seguridad alimentaria y sostener las rentas agrarias, ha evolucionado radicalmente: del sistema de precios de garantía (excedentes, dumping) a los pagos directos desacoplados (Fischler 2003) y la arquitectura verde actual (eco-esquemas, condicionalidad reforzada). Se estructura en dos pilares: pagos directos/mercados (FEAGA) y desarrollo rural (FEADER), con un presupuesto de 387.000 M€ para 2023-2027 (31 % del presupuesto UE). España es el 2.º receptor (~48.000 M€), pero la distribución es muy desigual (20/80). El PEPAC español incluye 7 eco-esquemas. Los retos: mayor ambición ambiental (biodiversidad, nitratos, emisiones), seguridad alimentaria post-Ucrania, respuesta a las protestas agrarias (precios, burocracia, competencia exterior) y transición hacia una agricultura más sostenible, justa y viable.
                    </p>
                </TheoryBlock>
            </Card>

                        <strong>Mecanismo Conectar Europa (CEF):</strong> infraestructuras de transporte, energía y telecomunicaciones transeuropeas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Categorías de regiones" color="amber">
                    <p>
                        Las regiones NUTS-2 se clasifican en tres categorías según su PIBpc respecto a la media de la UE:
                    </p>
                    <p>
                        <strong>Menos desarrolladas:</strong> PIBpc &lt;75 % de la media UE. Mayor intensidad de ayuda (cofinanciación UE hasta 85 %). En España (2021-27): Extremadura, Andalucía, Castilla-La Mancha, Melilla.<br/>
                        <strong>En transición:</strong> PIBpc 75-100 % de la media UE. Cofinanciación ~60 %. En España: Murcia, C. Valenciana, Canarias, Castilla y León, Galicia, Asturias, Ceuta.<br/>
                        <strong>Más desarrolladas:</strong> PIBpc &gt;100 % de la media UE. Cofinanciación ~40 %. En España: Madrid, País Vasco, Navarra, Cataluña, Aragón, Baleares, La Rioja, Cantabria.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Política cohesió 2021-27: ~392.000 M€ = FEDER + FSE+ + FC + JTF + INTERREG"
                    desc="~1/3 del pressupost UE. Principal política d'inversió"
                />
            </Card>

            <Card title="3. Aplicación en España" icon="📘">
                <TheoryBlock title="3.1. España como beneficiaria histórica" color="amber">
                    <p>
                        España ha sido uno de los mayores beneficiarios de la política de cohesión: entre 1986 y 2013 recibió más de <strong>150.000 millones de euros</strong> en fondos estructurales y de cohesión. Estos fondos financiaron:
                    </p>
                    <p>
                        <strong>Infraestructuras:</strong> autopistas (la red de autopistas se multiplicó por cuatro), AVE (España tiene la segunda red de AVE del mundo), aeropuertos, redes de saneamiento y depuración de aguas, redes de gas natural.<br/>
                        <strong>Capital humano:</strong> universidades, centros de formación profesional, programas de empleo y formación.<br/>
                        <strong>Investigación e innovación:</strong> parques tecnológicos, centros de I+D, apoyo a la innovación empresarial.<br/>
                        <strong>Desarrollo rural y medio ambiente:</strong> modernización de regadíos, reforestación, tratamiento de residuos, red Natura 2000.
                    </p>
                    <p>
                        El <strong>impacto</strong> ha sido significativo: la convergencia de España con la media de la UE pasó del 72 % del PIBpc medio en 1986 al 95 % en 2007 (la crisis la redujo al 88 % en 2024). Sin los fondos de cohesión, el PIB español sería entre un 3 % y un 5 % inferior al actual (estimaciones del Banco de España y la Comisión Europea).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. La programación 2021-2027 en España" color="orange">
                    <p>
                        Para 2021-2027, España recibirá aproximadamente <strong>36.000 millones de euros</strong> de los fondos de cohesión (FEDER + FSE+), cantidad inferior a la de periodos anteriores (España ya no recibe Fondo de Cohesión). Las prioridades: transición ecológica y digital, innovación, empleo y formación, inclusión social, desarrollo territorial integrado.
                    </p>
                    <p>
                        Las CCAA con mayor asignación son las clasificadas como «menos desarrolladas» (Extremadura, Andalucía, Castilla-La Mancha) y «en transición» (C. Valenciana, Murcia, Canarias, Galicia).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Evaluación de la política de cohesión" icon="📘">
                <TheoryBlock title="4.1. Logros" color="amber">
                    <p>
                        <strong>Convergencia real:</strong> el PIBpc de las regiones menos desarrolladas ha crecido significativamente. Los países de la cohesión (España, Portugal, Grecia, Irlanda, y los nuevos Estados miembros del Este) han convergido hacia la media de la UE. Irlanda pasó de ser uno de los países más pobres de la CEE en 1973 al segundo más rico per cápita en 2024. Polonia ha duplicado su PIBpc relativo desde su adhesión en 2004.<br/>
                        <strong>Infraestructuras:</strong> los fondos han financiado miles de kilómetros de autopistas, líneas de AVE, redes de telecomunicaciones, estaciones depuradoras y centros de investigación.<br/>
                        <strong>Capital humano:</strong> millones de personas han participado en programas de formación cofinanciados por el FSE.<br/>
                        <strong>Innovación:</strong> los fondos han contribuido a crear ecosistemas de innovación en regiones que carecían de ellos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Críticas y limitaciones" color="orange">
                    <p>
                        <strong>Efecto de absorción desigual:</strong> no todas las regiones han sabido utilizar eficientemente los fondos. La capacidad administrativa, la calidad institucional y la gobernanza local determinan el éxito.<br/>
                        <strong>Infraestructuras infrautilizadas:</strong> en España y otros países, algunos proyectos financiados con fondos europeos resultaron sobredimensionados o poco rentables (aeropuertos sin tráfico, autopistas de peaje rescatadas).<br/>
                        <strong>Dependencia:</strong> algunas regiones han desarrollado una dependencia de los fondos europeos sin generar dinámicas endógenas de crecimiento.<br/>
                        <strong>Persistencia de disparidades:</strong> a pesar de décadas de política de cohesión, las disparidades regionales dentro de muchos países (incluida España) se han reducido menos de lo esperado. La «trampa de las rentas medias» afecta a regiones que han convergido parcialmente pero no logran cerrar la brecha.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Retos y futuro de la política de cohesión" icon="📘">
                <TheoryBlock title="5.1. Nuevas prioridades" color="amber">
                    <p>
                        La política de cohesión evoluciona desde la inversión en infraestructuras «duras» (carreteras, redes) hacia inversiones en capital humano, innovación, digitalización y transición ecológica. Los cinco objetivos políticos 2021-2027 reflejan esta evolución: <strong>Europa más inteligente</strong> (I+D, digitalización, pymes), <strong>más verde</strong> (economía circular, renovables, adaptación climática), <strong>más conectada</strong> (transporte sostenible, digitalización), <strong>más social</strong> (empleo, educación, inclusión) y <strong>más cercana</strong> (desarrollo territorial, estrategias locales).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Ampliación y presupuesto" color="orange">
                    <p>
                        La posible <strong>ampliación a Ucrania y los Balcanes</strong> planteará un reto financiero enorme: estos países tienen un PIBpc muy inferior a la media de la UE y requerirán transferencias masivas de cohesión. El debate sobre la financiación del presupuesto de la UE (nuevos recursos propios: tasa digital, impuesto sobre transacciones financieras, ampliación del ETS) es clave para garantizar una política de cohesión ambiciosa post-2027.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Condicionalidad y Estado de Derecho" color="amber">
                    <p>
                        El <strong>Reglamento de condicionalidad</strong> (2020) permite suspender los fondos europeos a Estados miembros que vulneren el Estado de Derecho (independencia judicial, lucha contra la corrupción, libertad de prensa). Ha sido aplicado a Hungría (congelación parcial de fondos). Este vínculo entre fondos y valores democráticos refuerza la dimensión política de la cohesión.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Este tema cierra el Bloc E conectando integración europea, solidaridad territorial y desarrollo económico. Se enmarca en <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), CE4 (contexto económico internacional), CE5 (ciudadanía europea) y los contenidos transversales de cohesión y sostenibilidad. Contribuye a las competencias <strong>CC</strong> (solidaridad, ciudadanía europea, debates sobre redistribución territorial), <strong>STEM</strong> (análisis de datos regionales: Eurostat, PIBpc por NUTS-2), <strong>CPSAA</strong> (juicio crítico sobre la eficacia de las políticas públicas) y <strong>CCL</strong> (lectura de informes de la Comisión Europea sobre cohesión).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="amber">
                    <p>
                        La política de cohesión es la principal política de inversión de la UE (~392.000 M€ para 2021-27, 1/3 del presupuesto). Sus instrumentos son el FEDER (infraestructuras, innovación, pymes: 226.000 M€), el FSE+ (empleo, formación, inclusión: 99.000 M€), el Fondo de Cohesión (transporte, medio ambiente: 48.000 M€ para los países con RNBpc &lt;90 %), el JTF (transición justa) e INTERREG (cooperación territorial). Las regiones se clasifican en tres categorías según su PIBpc (menos desarrolladas, en transición, más desarrolladas). España ha sido gran beneficiaria histórica (&gt;150.000 M€, 1986-2013), lo que financió autopistas, AVE, universidades, saneamiento. Para 2021-27 recibe ~36.000 M€. La convergencia ha sido significativa (72 %→95 % del PIBpc UE) pero incompleta y desigual. Los retos: nuevas prioridades (digital, verde, social), ampliación (Ucrania, Balcanes), financiación post-2027 y condicionalidad democrática.
                    </p>
                </TheoryBlock>
            </Card>
