    // TEMA 39 — L'economia espanyola: característiques i estructura productiva.
    // ════════════════════════════════════════════════════════════════
    const Tema39Complet = () => (
        <div className="space-y-6 animate-fade">
            {/* ── INTRODUCCIÓ ────────────────────────────────────── */}
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        L'<strong>economia espanyola</strong> constitueix un dels casos més interessants de transformació econòmica contemporània. Espanya va passar de ser una economia agrària, autàrquica i relativament endarrerida a mitjan segle XX a convertir-se en la <strong>quarta economia de la zona euro</strong> i la tretzena del món per PIB nominal (FMI, 2024). Aquesta transformació no va ser lineal: va estar marcada per etapes de fort creixement (el «miracle econòmic» dels anys 60, el boom posterior a l'adhesió a la CEE el 1986, l'expansió immobiliària de 1997-2007) i per crisis profundes (la crisi del petroli de 1973, la reconversió industrial dels 80, la Gran Recessió de 2008-2013 i l'impacte de la pandèmia COVID-19 el 2020).
                    </p>
                    <p>
                        L'estudi de l'economia espanyola és essencial per a comprendre la realitat econòmica en la qual es desenvolupa l'alumnat i per a connectar els conceptes teòrics de la ciència econòmica amb dades, institucions i polítiques concretes. Des de la perspectiva curricular, aquest tema s'emmarca en els sabers bàsics del bloc «L'economia espanyola i internacional» de la matèria d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022) i en les competències específiques CE1 (funcionament del sistema econòmic), CE3 (paper del sector públic) i CE4 (context econòmic nacional i internacional). La LOMLOE (Llei Orgànica 3/2020) emfatitza la necessitat que l'alumnat comprenga les característiques estructurals de l'economia espanyola, contribuint a les competències CC (ciutadania activa), STEM (anàlisi quantitativa de dades macroeconòmiques) i CE (comprensió de la iniciativa econòmica).
                    </p>
                    <p>
                        El present tema s'estructura en cinc epígrafs: en primer lloc, s'aborda l'evolució històrica de l'economia espanyola; en segon lloc, s'analitzen les seues característiques estructurals; en tercer lloc, s'examina l'estructura productiva per sectors; en quart lloc, s'estudia la inserció exterior de l'economia espanyola; i en cinquè lloc, s'identifiquen els principals reptes i desafiaments actuals.
                    </p>
                </div>
            </Card>

            {/* ── DESARROLLO ──────────────────────────────────────── */}

            {/* Epígraf 1 */}
            <Card title="1. Evolució històrica de l'economia espanyola" icon="📘">
                <TheoryBlock title="1.1. L'autarquia i el primer franquisme (1939-1959)" color="amber">
                    <p>
                        Després de la Guerra Civil (1936-1939), el règim franquista va imposar un model d'<strong>autarquia econòmica</strong> inspirat en els feixismes europeus: intervenció estatal massiva, substitució d'importacions, racionament, control de preus i restricció del comerç exterior. El resultat va ser una economia estancada: el 1959, el PIB per càpita espanyol amb prou feines superava el 60 % de la mitjana europea occidental. L'aïllament internacional (exclusió de les Nacions Unides fins al 1955, del Pla Marshall) va agreujar la situació.
                    </p>
                    <p>
                        L'autarquia va generar un <strong>mercat negre</strong> (estraperlo), escassetat crònica de béns de consum, inflació reprimida, endarreriment tecnològic i una agricultura de subsistència que mantenia més del 40 % de la població activa en el sector primari.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. El Pla d'Estabilització i el desenvolupisme (1959-1973)" color="orange">
                    <p>
                        El <strong>Pla d'Estabilització de 1959</strong>, impulsat pels tecnòcrates de l'Opus Dei (López Rodó, Ullastres, Navarro Rubio) amb el suport del FMI i l'OCDE, va marcar el gir cap a la liberalització: devaluació de la pesseta, obertura comercial parcial, disciplina fiscal, atracció d'inversió estrangera i eliminació de controls de preus. A partir de 1960, Espanya va experimentar l'anomenat <strong>«miracle econòmic espanyol»</strong>: el PIB va créixer a una mitjana del 7 % anual entre 1960 i 1973, la taxa més alta d'Europa occidental juntament amb Itàlia i el Japó.
                    </p>
                    <p>
                        Els <strong>Plans de Desenvolupament</strong> (I: 1964-1967; II: 1968-1971; III: 1972-1975), de caràcter indicatiu (no vinculant per al sector privat), van canalitzar la inversió pública cap als <strong>pols de desenvolupament</strong> (Vigo, Valladolid, Saragossa, Sevilla, etc.) per a fomentar la industrialització regional. Els motors del creixement van ser: la <strong>industrialització</strong> (especialment automoció, siderúrgia, química), les <strong>remeses d'emigrants</strong> (més d'un milió d'espanyols van emigrar a Alemanya, França i Suïssa), el <strong>turisme</strong> (Espanya es va convertir en el primer destí turístic de masses d'Europa) i la <strong>inversió estrangera directa</strong>.
                    </p>
                    <p>
                        Aquest període va transformar radicalment l'estructura productiva: el sector primari va passar del 40 % al 20 % de l'ocupació, mentre que la indústria i els serveis van créixer acceleradament. Tanmateix, el creixement va ser desequilibrat: inflació elevada, dèficits exteriors recurrents, desigualtat regional persistent i absència de llibertats polítiques i sindicals.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. La crisi i la Transició (1973-1985)" color="amber">
                    <p>
                        La <strong>crisi del petroli de 1973</strong> va colpejar durament una economia altament dependent de les importacions energètiques. La tardana reacció del règim franquista (que va subsidiar els preus del petroli per a evitar conflictes socials) va agreujar els desequilibris. La mort de Franco (1975) i la Transició democràtica van afegir incertesa política.
                    </p>
                    <p>
                        Els <strong>Pactes de la Moncloa</strong> (1977), signats pel govern de Suárez i els principals partits polítics (inclòs el PCE de Carrillo), van constituir una fita: van combinar <strong>ajust macroeconòmic</strong> (contenció salarial, devaluació, restricció monetària) amb <strong>reformes estructurals</strong> (reforma fiscal, Estatut dels Treballadors, reconeixement del dret de vaga).
                    </p>
                    <p>
                        La <strong>reconversió industrial</strong> dels anys 80 (siderúrgia, construcció naval, mineria, tèxtil) va ser dolorosa però necessària: sectors obsolets i sobredimensionats es van reestructurar amb elevats costos socials (desocupació, conflictivitat laboral). L'atur va assolir el 21 % el 1985.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. La integració europea i la modernització (1986-2007)" color="orange">
                    <p>
                        L'<strong>adhesió a la Comunitat Econòmica Europea</strong> (1 de gener de 1986) va ser la fita més transformadora de l'economia espanyola contemporània. Va suposar: <strong>obertura comercial plena</strong> (eliminació d'aranzels intracomunitaris), accés als <strong>fons estructurals i de cohesió</strong> (Espanya va ser el principal beneficiari net fins a l'ampliació de 2004, rebent més de 150.000 milions d'euros entre 1986 i 2013), modernització d'infraestructures (AVE, autopistes, aeroports), convergència regulatòria i normativa, i atracció d'inversió estrangera.
                    </p>
                    <p>
                        L'entrada en el <strong>Sistema Monetari Europeu</strong> (1989) i la posterior adopció de l'<strong>euro</strong> (1999, circulació el 2002) van eliminar el risc canviari i van reduir dràsticament els tipus d'interés, però també van privar Espanya de l'instrument de la devaluació competitiva.
                    </p>
                    <p>
                        Entre 1997 i 2007 Espanya va viure una <strong>expansió extraordinària</strong> impulsada pels baixos tipus d'interés (convergència cap a la zona euro), la immigració massiva (la població estrangera va passar de 500.000 a 5,5 milions), el boom immobiliari i de la construcció (que va arribar a representar el 12 % del PIB i el 13 % de l'ocupació), i el consum finançat amb crèdit. El PIB per càpita espanyol va assolir el 105 % de la mitjana de la UE-27 el 2007. Tanmateix, aquest model de creixement va acumular greus desequilibris: bombolla immobiliària, endeutament privat excessiu (les famílies i empreses espanyoles devien més del 200 % del PIB), dèficit per compte corrent del 10 % del PIB i baixa productivitat.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.5. La Gran Recessió i la recuperació (2008-2019)" color="amber">
                    <p>
                        L'esclat de la bombolla immobiliària i la crisi financera global (2008) van provocar la recessió més profunda des de la Guerra Civil. El PIB va caure un 9 % acumulat entre 2008 i 2013, la desocupació es va disparar al <strong>26,9 %</strong> (2013, rècord històric), el sistema bancari va requerir un <strong>rescat europeu</strong> de fins a 100.000 milions d'euros (2012, a través del MEDE, del qual es van utilitzar 41.300 milions), la prima de risc va assolir els 649 punts bàsics (juliol de 2012) i el dèficit públic va superar l'11 % del PIB el 2009.
                    </p>
                    <p>
                        Les respostes van incloure: <strong>austeritat fiscal</strong> (retallades de despesa, pujades d'impostos, reforma de l'article 135 de la Constitució per a incloure l'estabilitat pressupostària), <strong>reforma laboral</strong> (2012, flexibilització de l'acomiadament i de la negociació col·lectiva), <strong>reestructuració bancària</strong> (creació de la SAREB, fusions de caixes d'estalvi) i <strong>devaluació interna</strong> (moderació salarial per a recuperar competitivitat).
                    </p>
                    <p>
                        A partir de 2014 es va iniciar una <strong>recuperació robusta</strong>: el PIB va créixer per damunt del 3 % anual entre 2015 i 2017, impulsat per les exportacions (que van guanyar quota de mercat mundial), el turisme (Espanya es va convertir en el segon destí turístic mundial per nombre de visitants), els baixos preus del petroli i la política monetària expansiva del BCE (tipus d'interés al 0 %, programa de compra d'actius). L'ocupació va créixer fins a recuperar nivells precrisi a finals de 2019, encara que amb major temporalitat i parcialitat.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.6. La pandèmia i el context actual (2020-present)" color="orange">
                    <p>
                        La <strong>pandèmia COVID-19</strong> (2020) va provocar una caiguda del PIB de l'11,2 %, la major entre les grans economies europees, a causa de l'elevada dependència del turisme i l'hostaleria. La resposta va incloure els <strong>ERTO</strong> (Expedients de Regulació Temporal d'Ocupació, que van arribar a cobrir 3,4 milions de treballadors), l'<strong>Ingrés Mínim Vital</strong>, les línies d'avals de l'ICO i, a nivell europeu, el programa <strong>Next Generation EU</strong> (Espanya és el segon major beneficiari amb 163.000 milions d'euros en transferències i préstecs).
                    </p>
                    <p>
                        La recuperació posterior (2021-2024) va ser progressiva: el PIB prepandèmia es va recuperar en el segon trimestre de 2023. Tanmateix, la crisi energètica derivada de la guerra d'Ucraïna (2022), la inflació (que va assolir el 10,8 % el juliol de 2022), les pujades de tipus del BCE i les tensions geopolítiques han afegit nous desafiaments. El 2024, el PIB per càpita espanyol se situa al voltant del 88 % de la mitjana de la UE-27.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 2 */}
            <Card title="2. Característiques estructurals de l'economia espanyola" icon="📘">
                <TheoryBlock title="2.1. Terciarització i desindustrialització" color="amber">
                    <p>
                        L'economia espanyola ha experimentat una profunda <strong>terciarització</strong>: el sector serveis representa actualment al voltant del <strong>74 % del PIB</strong> i el <strong>77 % de l'ocupació</strong>. La indústria (inclosa l'energia) aporta aproximadament el 16 % del PIB (enfront del 20 % de la mitjana de la UE), la construcció al voltant del 6 % i el sector primari menys del 3 %. Aquesta estructura reflecteix la convergència cap al patró de les economies avançades, però amb una participació industrial inferior a la d'Alemanya (24 %), Itàlia (19 %) o França (17 %), la qual cosa constitueix un debat recurrent sobre la necessitat de <strong>reindustrialització</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Dualitat del mercat laboral" color="orange">
                    <p>
                        El mercat de treball espanyol presenta una <strong>dualitat estructural</strong> entre treballadors amb contractes indefinits (elevada protecció) i treballadors amb contractes temporals (alta rotació). Històricament, la taxa de temporalitat espanyola va ser la més alta de la UE (superior al 30 %), encara que la <strong>reforma laboral de 2021</strong> l'ha reduïda significativament (per davall del 18 % el 2024). Altres característiques: elevada desocupació estructural (la taxa d'atur rarament baixa del 10-12 %, fins i tot en fases expansives), desocupació juvenil molt elevada (superior al 25 %), bretxa de gènere persistent i pes significatiu de l'economia submergida (estimada entre el 17 % i el 22 % del PIB segons diversos estudis).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Desequilibris territorials" color="amber">
                    <p>
                        Espanya presenta una <strong>acusada desigualtat territorial</strong>. Les comunitats autònomes amb major PIB per càpita (País Basc, Madrid, Navarra, Catalunya) superen àmpliament les de menor nivell (Extremadura, Andalusia, Castella-la Manxa). El PIB per càpita del País Basc és aproximadament el doble que el d'Extremadura. L'«<strong>Espanya buidada</strong>» reflecteix el despoblament rural de l'interior (Castella i Lleó, Aragó, Extremadura), amb densitats inferiors a 12 hab/km², enfront de la concentració en les àrees metropolitanes costaneres i Madrid.
                    </p>
                    <p>
                        Els mecanismes de correcció inclouen el <strong>sistema de finançament autonòmic</strong> (Fons de Garantia de Serveis Públics Fonamentals), els fons europeus de cohesió i les polítiques de repte demogràfic.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Dèficit de productivitat i innovació" color="orange">
                    <p>
                        La <strong>productivitat total dels factors</strong> (PTF) espanyola ha crescut menys que la mitjana europea des dels anys 90. Espanya inverteix en I+D+i aproximadament l'<strong>1,4 % del PIB</strong> (2023), molt per davall de la mitjana de la UE (2,2 %) i de l'objectiu del 3 % fixat per l'Estratègia Europa 2020. El teixit empresarial està dominat per <strong>microempreses i pimes</strong> (el 99,8 % de les empreses té menys de 250 treballadors; el 95 % en té menys de 10), que inverteixen menys en I+D, internacionalització i digitalització. El <strong>nivell educatiu</strong> ha millorat, però persisteixen taxes d'abandonament escolar primerenc superiors a la mitjana europea (13,6 % enfront del 9,6 % de la UE el 2023).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Dependència energètica" color="amber">
                    <p>
                        Espanya importa aproximadament el <strong>70 % de l'energia</strong> que consumeix (petroli, gas natural), una dependència superior a la mitjana europea (~55 %). La <strong>transició energètica</strong> està avançant significativament: el 2023, les energies renovables (eòlica, solar fotovoltaica, hidràulica) van generar més del 50 % de l'electricitat, convertint Espanya en un dels líders europeus en energia solar. Tanmateix, la dependència de combustibles fòssils per al transport i la indústria continua sent elevada.
                    </p>

                    </p>
                    <p>
                        <strong>Serveis financers, immobiliaris i professionals:</strong> aporten conjuntament més del 20 % del PIB. El sector bancari espanyol, després de la profunda reestructuració de 2008-2015, està dominat per cinc grans entitats (Santander, BBVA, CaixaBank, Sabadell, Bankinter).
                    </p>
                    <p>
                        <strong>Administració pública, sanitat i educació:</strong> els serveis públics representen al voltant del 18 % del PIB, reflectint el model d'Estat del benestar espanyol.
                    </p>
                    <p>

            <Card title="4. La inserció exterior de l'economia espanyola" icon="📘">
                <TheoryBlock title="4.1. Comerç exterior de béns i serveis" color="amber">
                    <p>
                        L'economia espanyola ha experimentat una <strong>obertura comercial creixent</strong>: la suma d'exportacions i importacions de béns i serveis supera el 70 % del PIB. Les <strong>exportacions de béns</strong> van assolir 371.000 milions d'euros el 2023, amb un creixement sostingut que ha portat Espanya a guanyar quota de mercat mundial (de l'1,6 % a l'1,8 % entre 2010 i 2023). Els principals productes exportats són: automòbils i components, productes agroalimentaris (fruites, hortalisses, oli, vi, carn de porc), productes químics i farmacèutics, maquinària i béns d'equip.
                    </p>
                    <p>
                        La <strong>destinació principal</strong> de les exportacions és la UE (aproximadament el 65 %), sent França, Alemanya, Itàlia i Portugal els principals socis. Fora de la UE destaquen el Regne Unit, els Estats Units, el Marroc i la Xina.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La balança per compte corrent" color="orange">
                    <p>

                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Inversió estrangera directa (IED)" color="amber">

                        <strong>Deute públic:</strong> la ràtio deute/PIB va assolir el 120 % després de la pandèmia i se situa al voltant del 107 % el 2024, per damunt del límit del 60 % del Pacte d'Estabilitat.<br/>
                        <strong>Accés a l'habitatge:</strong> els preus de l'habitatge i els lloguers han crescut per damunt dels salaris, especialment a les grans ciutats, generant un problema d'accessibilitat per als joves.

                        <strong>Desigualtat:</strong> el coeficient de Gini espanyol (33,0 el 2023) és superior a la mitjana de la UE (29,6), amb una desigualtat que es concentra en l'accés a l'habitatge, la precarietat laboral i la bretxa territorial.<br/>
                        <strong>Transició ecològica:</strong> descarbonització de l'economia, compliment dels compromisos de l'Acord de París i del Pacte Verd Europeu (reducció del 55 % de les emissions per al 2030), transició justa per a les comarques dependents d'activitats contaminants.

                <TheoryBlock title="2.1. Comerç" color="amber">

                    </p>
                    <p>
                        <strong>Mercadona</strong>, amb seu a València, és la cadena de supermercats líder a Espanya (més del 27 % de quota de mercat) i un exemple de model empresarial exitós (marca blanca —Hacendado—, relació estable amb proveïdors —interproveïdors—, inversió en logística).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Transport i logística" color="orange">
                    <p>
                        Espanya compta amb unes <strong>infraestructures de transport</strong> de primer nivell: la segona xarxa d'alta velocitat ferroviària del món per quilòmetres (després de la Xina), més de 17.000 km d'autopistes i autovies, 46 aeroports (AENA), ports estratègics al Mediterrani (València, Algesires, Barcelona) i l'Atlàntic (Bilbao, Vigo). La posició geogràfica d'Espanya com a <strong>pont entre Europa, Àfrica i Amèrica Llatina</strong> li confereix un avantatge logístic natural.
                    </p>
                    <p>
                        El sector del transport i emmagatzematge ocupa més d'1 milió de persones i aporta aproximadament el 5 % del PIB. La <strong>logística</strong> és un sector en fort creixement, impulsat pel comerç electrònic (centres logístics d'Amazon, Inditex, Mercadona).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Serveis financers" color="amber">
                    <p>
                        El <strong>sistema financer espanyol</strong>, després de la profunda reestructuració derivada de la crisi de 2008-2012 (rescat bancari, desaparició de les caixes d'estalvi, fusions), està dominat per cinc grans bancs: <strong>Santander</strong> (el major banc de la zona euro per capitalització), <strong>BBVA</strong>, <strong>CaixaBank</strong> (resultat de la fusió amb Bankia el 2021), <strong>Sabadell</strong> i <strong>Bankinter</strong>. El sector aporta al voltant del 4 % del PIB i ocupa 175.000 persones (xifra en descens per la digitalització i el tancament d'oficines). (Aquest tema es desenvolupa en profunditat en el Tema 45.)
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Tecnologies de la informació i comunicacions (TIC)" color="orange">

                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Administració Pública" color="amber">

                    </p>
                </TheoryBlock>

            <Card title="3. El turisme a Espanya: evolució i magnituds" icon="📘">
                <TheoryBlock title="3.1. Evolució històrica del turisme" color="amber">
                    <p>
                        El turisme de masses va nàixer a Espanya als anys 60, quan milions d'europeus del nord van descobrir el sol i platja mediterrani a preus accessibles. Els factors impulsors van ser: la <strong>proximitat geogràfica</strong> als principals mercats emissors (Alemanya, Regne Unit, França), el <strong>clima</strong> (més de 3.000 hores de sol anuals a la costa mediterrània), els <strong>baixos preus</strong> relatius, la millora de les infraestructures de transport (aeroports, autopistes) i l'estabilitat política del període 1960-1975 (malgrat la dictadura).
                    </p>
                    <p>
                        Des dels anys 60 fins a l'actualitat, el nombre de turistes internacionals ha crescut exponencialment: de 6 milions (1960) a 14 milions (1970), 34 milions (1990), 58 milions (2007), 83 milions (2019) i <strong>85 milions</strong> (2023, rècord històric). Espanya ha passat del model inicial de «sol i platja» barat a una oferta diversificada que inclou turisme cultural, gastronòmic, de natura, esportiu, de congressos (MICE), rural i de salut.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Magnituds actuals" color="orange">
                    <p>
                        <strong>Visitants internacionals:</strong> 85 milions (2023), segon destí mundial després de França (~100 M).<br/>
                        <strong>Ingressos per turisme internacional:</strong> 92.000 milions d'euros (2023), segon del món després dels EUA.<br/>
                        <strong>Aportació al PIB:</strong> el turisme contribueix directament i indirectament al <strong>12,8 % del PIB</strong> (més de 186.000 milions d'euros).<br/>
                        <strong>Ocupació:</strong> més de <strong>2,6 milions de persones</strong> ocupades en activitats turístiques (hostaleria, transport, agències, oci), aproximadament el 13 % de l'ocupació total.<br/>
                        <strong>Despesa mitjana per turista:</strong> aproximadament 1.080 € per viatge (en augment, reflectint un turisme de major valor afegit).
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="85 M turistes (2023) | 92.000 M€ ingressos | 12,8% PIB | 2,6 M ocupats"
                    desc="Espanya: 2n destí mundial (visitants) i 2n per ingressos (després dels EUA)"
                />

                <TheoryBlock title="3.3. Principals mercats emissors" color="amber">
                    <p>
                        Els principals mercats emissors de turistes cap a Espanya són: <strong>Regne Unit</strong> (~18 milions), <strong>França</strong> (~12 milions), <strong>Alemanya</strong> (~11 milions), <strong>Països Nòrdics</strong> (~5 milions), <strong>Itàlia</strong> (~4 milions), <strong>Països Baixos</strong>, <strong>Portugal</strong> i, en creixement, <strong>EUA</strong> (que ha experimentat un auge notable gràcies a la fortalesa del dòlar i la connectivitat aèria directa). El turisme nacional (turisme interior) genera aproximadament 160 milions de viatges anuals.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Principals destins i tipologies" color="orange">
                    <p>
                        <strong>Destins de sol i platja:</strong> Balears (Mallorca, Eivissa), Canàries (Tenerife, Gran Canària, Lanzarote, Fuerteventura), Costa del Sol (Màlaga), Costa Blanca (Alacant), Costa Brava (Girona), Costa Daurada (Tarragona).<br/>
                        <strong>Turisme urbà i cultural:</strong> Barcelona, Madrid, Sevilla, Granada (Alhambra), València, Bilbao (Guggenheim), Santiago de Compostel·la.<br/>
                        <strong>Turisme gastronòmic:</strong> Espanya compta amb més de 200 estrelles Michelin; Sant Sebastià i Barcelona són referents mundials.<br/>
                        <strong>Turisme rural i de natura:</strong> Camí de Santiago, parcs nacionals (Doñana, Picos de Europa, Teide), ecoturisme.<br/>
                        <strong>Turisme de congressos i esdeveniments (MICE):</strong> Barcelona i Madrid es troben entre les 10 primeres ciutats del món per nombre de congressos internacionals.
                    </p>
                </TheoryBlock>

            <Card title="4. Impacte econòmic del turisme" icon="📘">
                <TheoryBlock title="4.1. Efectes positius" color="amber">
                    <p>
                        <strong>Equilibri exterior:</strong> el turisme genera un superàvit en la balança de serveis que compensa parcialment el dèficit comercial de béns. El 2023, el superàvit turístic va ser d'aproximadament 55.000 milions d'euros, el major de la història.<br/>
                        <strong>Creació d'ocupació:</strong> el turisme és el major ocupador del sector serveis, especialment per a joves, dones i immigrants, i té un efecte multiplicador significatiu sobre sectors auxiliars (comerç, transport, construcció, agroalimentari).<br/>
                        <strong>Vertebració territorial:</strong> el turisme ha impulsat el desenvolupament de zones costaneres i insulars que, altrament, estarien econòmicament deprimides.<br/>
                        <strong>Ingressos fiscals:</strong> IVA sobre consum turístic, taxes aeroportuàries, impostos hotelers (a Balears i Catalunya).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Efectes negatius i externalitats" color="orange">
                    <p>
                        <strong>Estacionalitat:</strong> el turisme de sol i platja es concentra en els mesos d'estiu (juny-setembre), generant ocupació temporal i infrautilització d'infraestructures la resta de l'any. Canàries és l'excepció (turisme d'hivern).<br/>
                        <strong>Concentració geogràfica:</strong> el 70 % dels turistes es dirigeix a sis destins (Balears, Canàries, Catalunya, Andalusia, C. Valenciana, Madrid).<br/>
                        <strong>Pressió sobre el territori i el medi ambient:</strong> urbanització costanera massiva (especialment entre 1960-2007), consum d'aigua (camps de golf, piscines), generació de residus, contaminació de zones marines, pressió sobre espais naturals protegits.<br/>
                        <strong>Massificació turística (<em>overtourism</em>):</strong> Barcelona, Balears, Canàries i altres zones experimenten una pressió turística que genera conflictes amb els residents (encariment de l'habitatge, saturació de l'espai públic, pèrdua d'identitat local). Les respostes inclouen: taxes turístiques, limitació de llicències d'habitatges turístics, regulació de creuers.<br/>
                        <strong>Precarietat laboral:</strong> el sector turístic es caracteritza per salaris relativament baixos, alta temporalitat, jornades extenses i dificultats per a retindre talent.
                    </p>
                </TheoryBlock>
            </Card>

                    </p>

                <TheoryBlock title="5.2. Sostenibilitat turística" color="orange">

                    </p>

                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Productivitat als serveis" color="orange">
                    <p>

                    </p>
                </TheoryBlock>
            </Card>

                    </p>

                        L'estudi del sector públic espanyol és rellevant tant per la seua dimensió quantitativa com pels debats que el travessen: la sostenibilitat fiscal (deute públic superior al 100 % del PIB), l'eficiència de la despesa, l'estructura del sistema tributari, la reforma de les pensions i el finançament autonòmic. Des de la perspectiva curricular, aquest tema s'emmarca en els sabers bàsics del bloc «El paper de l'Estat en l'economia» d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), connectant amb CE3 (paper del sector públic), CE1 (funcionament del sistema econòmic) i els continguts transversals de ciutadania democràtica.
                    </p>
                    <p>
                        El present tema s'estructura en cinc epígrafs: funcions del sector públic, estructura de les Administracions Públiques, els Pressupostos Generals de l'Estat, el sistema tributari i els reptes actuals de la hisenda pública espanyola.
                    </p>
                </div>

            <Card title="1. Funcions del sector públic en l'economia" icon="📘">

                    </p>
                    <p>
                        <strong>1. Funció assignativa (eficiència):</strong> corregir les fallades de mercat —béns públics (defensa, enllumenat), externalitats (contaminació, educació), monopolis naturals, informació asimètrica— i proveir béns i serveis que el mercat no subministra eficientment.<br/>
                        <strong>2. Funció redistributiva (equitat):</strong> reduir les desigualtats de renda i riquesa mitjançant impostos progressius, transferències socials (pensions, prestacions per desocupació, ajudes a famílies) i serveis públics universals (sanitat, educació).<br/>
                        <strong>3. Funció estabilitzadora:</strong> suavitzar els cicles econòmics mitjançant la política fiscal (augment de la despesa i reducció d'impostos en recessions, consolidació en expansions) i els estabilitzadors automàtics (impost sobre la renda progressiu, prestacions per desocupació).
                    </p>

                <TheoryBlock title="1.2. L'Estat del benestar espanyol" color="orange">
                    <p>
                        L'<strong>Estat del benestar</strong> espanyol es va desenvolupar tardanament respecte al nord d'Europa: els pilars fonamentals es van construir en la Transició i la consolidació democràtica (1978-1992): <strong>Sistema Nacional de Salut</strong> (Llei General de Sanitat, 1986: cobertura universal), <strong>educació pública</strong> (LODE 1985, LOGSE 1990), <strong>sistema de pensions</strong> contributives (Pacte de Toledo, 1995) i <strong>protecció per desocupació</strong>.
                    </p>
                    <p>
                        La despesa social espanyola (sanitat, educació, pensions, protecció social) representa aproximadament el <strong>26 % del PIB</strong>, per davall de la mitjana de la UE (~28 %) i significativament inferior a la de França (~34 %) o els països nòrdics (~30 %). Aquest menor nivell de despesa social explica en part que Espanya tinga indicadors de desigualtat i pobresa superiors a la mitjana europea.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Estructura de les Administracions Públiques" icon="📘">
                <TheoryBlock title="2.1. Els tres nivells de govern" color="amber">
                    <p>
                        La Constitució de 1978 (Títol VIII) va establir un model d'organització territorial profundament descentralitzat:
                    </p>
                    <p>
                        <strong>Administració General de l'Estat (AGE):</strong> competències exclusives en defensa, relacions exteriors, justícia, immigració, legislació bàsica, Seguretat Social (pensions i prestacions). Representa aproximadament el 21 % de la despesa pública total (exclosa la Seguretat Social).<br/>
                        <strong>Comunitats Autònomes (17 CCAA + 2 ciutats autònomes):</strong> competències en sanitat, educació, serveis socials, habitatge, agricultura, medi ambient, ocupació, comerç interior, cultura. Gestionen aproximadament el <strong>36 % de la despesa pública</strong> i són el nivell de govern amb major impacte en la vida quotidiana dels ciutadans.<br/>
                        <strong>Entitats Locals (8.131 municipis, províncies, cabildos/consells insulars):</strong> competències en urbanisme, aigua, residus, enllumenat, transport urbà, policia local, serveis socials de proximitat. Representen aproximadament el 13 % de la despesa pública.<br/>
                        <strong>Seguretat Social:</strong> gestiona les pensions contributives, les prestacions per desocupació, la incapacitat temporal, les prestacions per maternitat/paternitat, etc. Representa aproximadament el 30 % de la despesa pública total.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. El finançament autonòmic" color="orange">
                    <p>
                        Coexisteixen dos models de finançament: el <strong>règim comú</strong> (15 CCAA) i el <strong>règim foral</strong> (País Basc i Navarra).
                    </p>
                    <p>
                        <strong>Règim comú:</strong> les CCAA reben una cistella de tributs (50 % de l'IRPF, 50 % de l'IVA, 58 % dels Impostos Especials, impostos propis) més transferències de l'Estat (Fons de Garantia de Serveis Públics Fonamentals, Fons de Suficiència, Fons de Competitivitat, Fons de Cooperació). El sistema busca garantir un nivell mínim de serveis públics en tot el territori.<br/>
                        <strong>Règim foral (concert/conveni):</strong> el País Basc i Navarra recapten tots els impostos en el seu territori i paguen un «cup» o «aportació» a l'Estat pels serveis que aquest presta (defensa, Exterior, etc.).
                    </p>
                    <p>
                        La <strong>reforma del finançament autonòmic</strong> és un dels debats polítics més candents: el sistema vigent (2009) està caducat, amb diferències significatives de finançament per càpita entre CCAA i tensions sobre l'anivellament, la corresponsabilitat fiscal i la solidaritat interterritorial.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Els Pressupostos Generals de l'Estat" icon="📘">
                <TheoryBlock title="3.1. Concepte i elaboració" color="amber">
                    <p>
                        Els <strong>Pressupostos Generals de l'Estat (PGE)</strong> són l'expressió comptable i jurídica de la política econòmica del Govern: recullen la totalitat dels ingressos i despeses del sector públic estatal per a un exercici anual. La seua elaboració correspon al Govern (Ministeri d'Hisenda) i la seua aprovació a les Corts Generals (art. 134 CE). Són la ferramenta fonamental de la <strong>política fiscal</strong>.
                    </p>
                    <p>
                        <strong>Cicle pressupostari:</strong> elaboració (Ministeri d'Hisenda, negociació amb ministeris), aprovació parlamentària, execució (gestió de la despesa), control (Intervenció General, Tribunal de Comptes).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Estructura d'ingressos" color="orange">
                    <p>
                        Els ingressos públics totals (Estat + CCAA + EELL + SS) representen aproximadament el <strong>38 % del PIB</strong> (2024), per davall de la mitjana de la UE (~41 %) i molt lluny dels països nòrdics (~45-50 %). Les principals fonts:
                    </p>
                    <p>
                        <strong>IRPF:</strong> ~8,5 % del PIB. Impost progressiu amb tipus del 19 % al 47 % (més tram autonòmic). Principal font d'ingressos.<br/>
                        <strong>IVA:</strong> ~6,5 % del PIB. Tipus general 21 %, reduït 10 %, superreduït 4 %.<br/>
                        <strong>Impost sobre Societats:</strong> ~2,5 % del PIB. Tipus general 25 % (15 % per a pimes de nova creació).<br/>
                        <strong>Cotitzacions socials:</strong> ~12 % del PIB. Financen les pensions i prestacions de la Seguretat Social.<br/>
                        <strong>Impostos Especials:</strong> hidrocarburs, tabac, alcohol, electricitat.<br/>
                        <strong>Altres:</strong> taxes, preus públics, ingressos patrimonials, transferències de la UE.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Estructura de despeses" color="amber">
                    <p>
                        La despesa pública total és d'aproximadament el <strong>47 % del PIB</strong>. Les principals partides:
                    </p>
                    <p>
                        <strong>Pensions:</strong> ~13 % del PIB (~190.000 milions €). La partida més gran i de creixement més ràpid per l'envelliment demogràfic.<br/>
                        <strong>Sanitat:</strong> ~7 % del PIB. Competència autonòmica. Sistema Nacional de Salut universal.<br/>
                        <strong>Educació:</strong> ~4,5 % del PIB. Competència autonòmica.<br/>
                        <strong>Prestacions per desocupació:</strong> ~1,5-2 % del PIB (varia amb el cicle).<br/>
                        <strong>Interessos del deute:</strong> ~2,5 % del PIB (~35.000 milions €).<br/>
                        <strong>Inversió pública:</strong> ~2 % del PIB (infraestructures, I+D, equipament).<br/>
                        <strong>Defensa:</strong> ~1,2 % del PIB (en augment cap a l'objectiu OTAN del 2 %).<br/>
                        <strong>Altres:</strong> protecció social, serveis públics generals, ordre públic.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Ingressos ≈ 38% PIB | Despeses ≈ 47% PIB | Dèficit ≈ 3-4% PIB"
                    desc="Bretxa fiscal estructural: la pressió fiscal espanyola és inferior a la mitjana de la UE"
                />
            </Card>

            <Card title="4. El sistema tributari espanyol" icon="📘">
                <TheoryBlock title="4.1. Principis constitucionals" color="amber">
                    <p>
                        L'article 31.1 de la Constitució estableix els principis del sistema tributari: <strong>capacitat econòmica</strong> (qui més té, més paga), <strong>igualtat</strong>, <strong>progressivitat</strong> (tipus marginals creixents), <strong>no confiscatorietat</strong> i <strong>justícia</strong>. Aquests principis informen l'estructura dels principals impostos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Impostos directes i indirectes" color="orange">
                    <p>
                        <strong>Impostos directes</strong> (graven la renda i el patrimoni): IRPF (principal impost, progressiu), Impost sobre Societats (IS), Impost sobre el Patrimoni, Impost sobre Successions i Donacions (competència autonòmica, amb grans diferències entre CCAA).<br/>
                        <strong>Impostos indirectes</strong> (graven el consum): IVA (principal impost indirecte), Impostos Especials (hidrocarburs, tabac, alcohol, electricitat), Impost sobre Transmissions Patrimonials i Actes Jurídics Documentats.
                    </p>
                    <p>
                        Espanya té una <strong>bretxa fiscal</strong> respecte a la UE d'aproximadament 3 punts de PIB, atribuïda a: menor recaptació efectiva de l'IVA (tipus reduïts generosos, economia submergida), Impost de Societats amb base imposable erosionada (deduccions, exempcions, planificació fiscal), menor pressió sobre el patrimoni i l'herència, i major economia submergida (~18-22 % del PIB).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. L'Agència Tributària (AEAT)" color="amber">
                    <p>
                        L'<strong>Agència Estatal d'Administració Tributària (AEAT)</strong>, creada el 1992, és l'òrgan encarregat de la gestió, inspecció i recaptació dels tributs estatals. Espanya ha sigut pionera en l'administració tributària electrònica: la declaració telemàtica de l'IRPF, el sistema SII (Subministrament Immediat d'Informació de l'IVA) i l'ús de big data per a la detecció del frau són referents internacionals. La lluita contra el <strong>frau fiscal</strong> i l'economia submergida continua sent una prioritat.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Reptes actuals de la hisenda pública espanyola" icon="📘">
                <TheoryBlock title="5.1. Sostenibilitat fiscal i deute públic" color="amber">
                    <p>
                        El <strong>deute públic</strong> espanyol va assolir el 120,3 % del PIB el 2020 (pandèmia) i se situa al voltant del <strong>107 % del PIB</strong> el 2024 (~1,56 bilions d'euros), molt per damunt del límit del 60 % del Pacte d'Estabilitat i Creixement. El <strong>dèficit públic</strong> es manté al voltant del 3-4 % del PIB. Les noves regles fiscals europees (2024) exigeixen plans d'ajust a mitjà termini per a reconduir el deute.
                    </p>
                    <p>
                        El cost dels interessos del deute (~35.000 milions €/any) limita la capacitat d'inversió pública. La <strong>sostenibilitat fiscal a llarg termini</strong> depén de: el creixement econòmic (que augmenta la base fiscal), la contenció de la despesa en pensions i sanitat (pressionada per l'envelliment), la millora de la recaptació (tancament de la bretxa fiscal amb la UE) i la disciplina pressupostària.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. La reforma del sistema de pensions" color="orange">
                    <p>
                        El sistema de pensions espanyol és de <strong>repartiment</strong> (les cotitzacions actuals financen les pensions actuals), amb una <strong>taxa de substitució</strong> elevada (~80 % de l'últim salari, la més alta de l'OCDE). L'envelliment demogràfic (baby boomers jubilant-se des de 2024, taxa de fecunditat d'1,16) incrementarà la despesa en pensions del 13 % actual a un estimat 15-17 % del PIB el 2050.
                    </p>
                    <p>
                        Les <strong>reformes de 2021-2023</strong> (sota el marc Next Generation EU): revaloració de pensions amb l'IPC (garanteix poder adquisitiu), <strong>MEI</strong> (Mecanisme d'Equitat Intergeneracional: cotització addicional del 0,6 % fins al 2050 per a crear un fons de reserva), increment de la base màxima de cotització, incentius a la jubilació demorada, penalització de la jubilació anticipada. El <strong>Pacte de Toledo</strong> (comissió parlamentària creada el 1995) continua sent el marc de consens per a les reformes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. El finançament autonòmic" color="amber">
                    <p>
                        El model de finançament autonòmic vigent (Llei 22/2009) està caducat i genera controvèrsia: les diferències de finançament per càpita entre CCAA de règim comú superen el 25 %, amb CCAA com la Comunitat Valenciana o Múrcia sistemàticament infrafinançades. La reforma ha d'equilibrar: <strong>corresponsabilitat fiscal</strong> (que les CCAA assumisquen les conseqüències de les seues decisions de despesa), <strong>solidaritat interterritorial</strong> (anivellament per a garantir serveis mínims) i <strong>suficiència</strong> (finançament adequat per a les competències transferides).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. L'eficiència de la despesa pública" color="orange">
                    <p>
                        Espanya s'enfronta al repte de <strong>fer més amb menys</strong>: millorar l'eficiència de la sanitat pública (llistes d'espera, integració de nivells assistencials), l'educació (reduir l'abandonament escolar, millorar resultats PISA), la justícia (lentitud processal) i l'Administració (digitalització, simplificació burocràtica, avaluació de polítiques públiques). L'<strong>AIReF</strong> (Autoritat Independent de Responsabilitat Fiscal, creada el 2013) avalua les previsions pressupostàries i l'eficiència de la despesa (spending reviews).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Aquest tema és central en el currículum d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), connectant directament amb CE3 (paper del sector públic en l'economia: impostos, despesa, pressupost, redistribució) i CE1 (funcionament del sistema econòmic). Contribueix a les competències <strong>CC</strong> (ciutadania fiscal, drets i obligacions tributàries, deliberació democràtica sobre prioritats de despesa), <strong>STEM</strong> (anàlisi quantitativa de dades pressupostàries, gràfics d'ingressos i despeses), <strong>CPSAA</strong> (judici crític sobre la redistribució, l'equitat i la sostenibilitat fiscal) i <strong>CCL</strong> (lectura dels PGE i documents fiscals). La connexió amb debats quotidians (impostos, sanitat, pensions, beques) facilita un aprenentatge significatiu i motivador.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="amber">
                    <p>
                        El sector públic espanyol representa una despesa del 47 % del PIB amb ingressos del 38 % (bretxa fiscal de ~3 pp amb la UE). S'organitza en tres nivells (AGE, CCAA, EELL) més la Seguretat Social, amb un alt grau de descentralització (les CCAA gestionen sanitat, educació i serveis socials). Les pensions són la major partida de despesa (13 % del PIB) i el principal repte per l'envelliment (reformes 2021-2023: IPC, MEI). El sistema tributari es recolza en IRPF, IVA i cotitzacions socials, amb una pressió fiscal inferior a la mitjana europea. Els reptes clau són la sostenibilitat del deute (107 % del PIB), la reforma del finançament autonòmic (sistema caducat des de 2009, infrafinançament de diverses CCAA), l'eficiència de la despesa pública i el tancament de la bretxa fiscal mitjançant la lluita contra el frau i l'ampliació de bases imposables.
                    </p>
                </TheoryBlock>
            </Card>

                        <strong>Estructura productiva:</strong> el pes excessiu de sectors intensius en ocupació de baixa qualificació i alta estacionalitat (construcció, turisme, hostaleria) amplifica els cicles d'ocupació i destrucció.

                </TheoryBlock>

                    <p>
                        <strong>Efecte d'absorció desigual:</strong> no totes les regions han sabut utilitzar eficientment els fons. La capacitat administrativa, la qualitat institucional i la governança local determinen l'èxit.<br/>
                        <strong>Infraestructures infrautilitzades:</strong> a Espanya i altres països, alguns projectes finançats amb fons europeus van resultar sobredimensionats o poc rendibles (aeroports sense trànsit, autopistes de peatge rescatades).<br/>
                        <strong>Dependència:</strong> algunes regions han desenvolupat una dependència dels fons europeus sense generar dinàmiques endògenes de creixement.<br/>
                        <strong>Persistència de disparitats:</strong> malgrat dècades de política de cohesió, les disparitats regionals dins de molts països (inclosa Espanya) s'han reduït menys del que s'esperava. La «trampa de les rendes mitjanes» afecta regions que han convergit parcialment però no aconsegueixen tancar la bretxa.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Reptes i futur de la política de cohesió" icon="📘">
                <TheoryBlock title="5.1. Noves prioritats" color="amber">
                    <p>
                        La política de cohesió evoluciona des de la inversió en infraestructures «dures» (carreteres, xarxes) cap a inversions en capital humà, innovació, digitalització i transició ecològica. Els cinc objectius polítics 2021-2027 reflecteixen aquesta evolució: <strong>Europa més intel·ligent</strong> (I+D, digitalització, pimes), <strong>més verda</strong> (economia circular, renovables, adaptació climàtica), <strong>més connectada</strong> (transport sostenible, digitalització), <strong>més social</strong> (ocupació, educació, inclusió) i <strong>més propera</strong> (desenvolupament territorial, estratègies locals).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Ampliació i pressupost" color="orange">
                    <p>
                        La possible <strong>ampliació a Ucraïna i els Balcans</strong> plantejarà un repte financer enorme: aquests països tenen un PIBpc molt inferior a la mitjana de la UE i requeriran transferències massives de cohesió. El debat sobre el finançament del pressupost de la UE (nous recursos propis: taxa digital, impost sobre transaccions financeres, ampliació de l'ETS) és clau per a garantir una política de cohesió ambiciosa post-2027.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Condicionalitat i Estat de Dret" color="amber">
                    <p>
                        El <strong>Reglament de condicionalitat</strong> (2020) permet suspendre els fons europeus a estats membres que vulneren l'Estat de Dret (independència judicial, lluita contra la corrupció, llibertat de premsa). Ha sigut aplicat a Hongria (congelació parcial de fons). Aquest vincle entre fons i valors democràtics reforça la dimensió política de la cohesió.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Aquest tema tanca el Bloc E connectant integració europea, solidaritat territorial i desenvolupament econòmic. S'emmarca en <strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), CE4 (context econòmic internacional), CE5 (ciutadania europea) i els continguts transversals de cohesió i sostenibilitat. Contribueix a les competències <strong>CC</strong> (solidaritat, ciutadania europea, debats sobre redistribució territorial), <strong>STEM</strong> (anàlisi de dades regionals: Eurostat, PIBpc per NUTS-2), <strong>CPSAA</strong> (juí crític sobre l'eficàcia de les polítiques públiques) i <strong>CCL</strong> (lectura d'informes de la Comissió Europea sobre cohesió).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesi" icon="📝">

                        La política de cohesió és la principal política d'inversió de la UE (~392.000 M€ per a 2021-27, 1/3 del pressupost). Els seus instruments són el FEDER (infraestructures, innovació, pimes: 226.000 M€), el FSE+ (ocupació, formació, inclusió: 99.000 M€), el Fons de Cohesió (transport, medi ambient: 48.000 M€ per als països amb RNBpc &lt;90 %), el JTF (transició justa) i INTERREG (cooperació territorial). Les regions es classifiquen en tres categories segons el seu PIBpc (menys desenvolupades, en transició, més desenvolupades). Espanya n'ha sigut gran beneficiària històrica (&gt;150.000 M€, 1986-2013), la qual cosa va finançar autopistes, AVE, universitats, sanejament. Per a 2021-27 rep ~36.000 M€. La convergència ha sigut significativa (72 %→95 % del PIBpc UE) però incompleta i desigual. Els reptes: noves prioritats (digital, verda, social), ampliació (Ucraïna, Balcans), finançament post-2027 i condicionalitat democràtica.
                    </p>
                </TheoryBlock>
            </Card>
