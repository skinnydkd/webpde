        // ════════════════════════════════════════════════════════════════
        // TEMA 38 — Evolució dels conceptes d'empresa i empresari
        // ════════════════════════════════════════════════════════════════
        const Tema38Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>L'<strong>empresa</strong> és la institució econòmica per excel·lència del capitalisme modern i l'unitat bàsica del teixit productiu. A Espanya, segons el DIRCE 2024 de l'INE, existeixen més de <strong>3,3 milions d'empreses actives</strong>, de les quals el 55,6 % són autònoms sense assalariats, el 40 % microempreses (1-9 treballadors), el 3,9 % petites (10-49), el 0,45 % mitjanes (50-249) i només el 0,17 % grans empreses (≥250). Aquesta estructura empresarial condiciona el creixement, la productivitat i la capacitat d'innovació del país.</p>
                        <p>Comprendre l'empresa exigeix tractar tres preguntes fonamentals: <strong>què és</strong> una empresa (definició), <strong>qui la dirigeix</strong> (empresari) i <strong>per a què</strong> existeix (objectius i funcions). La resposta ha evolucionat al llarg de la història econòmica: del mercader artesà preindustrial al CEO tecnològic del segle XXI, passant pel capitalista industrial de la Revolució Industrial, el directiu professional de Berle-Means i Chandler, i l'emprenedor schumpeterià.</p>
                        <p>Aquest tema, que obri el Bloc E, estableix el marc conceptual que servirà de base per als temes 39-65. Connecta directament amb el Tema 59 (Teories de l'organització), el Tema 65 (Propietat-control) i els temes d'estratègia i màrqueting que seguiran.</p>
                        <p>S'estructura en 6 blocs: (1) evolució del concepte d'empresa i d'empresari; (2) funcions de l'empresa; (3) objectius empresarials; (4) classes d'empresa; (5) l'enfocament sistèmic; (6) els subsistemes empresarials.</p>
                    </div>
                </Card>

                <Card title="1. Evolució del concepte d'empresa i d'empresari" icon="📜">
                    <TheoryBlock title="1.1. Etapa preindustrial: l'artesà i el mercader" color="orange">
                        <p>Abans de la Revolució Industrial, la producció s'organitzava en tres formes principals: (a) <strong>producció domèstica</strong> per a l'autoconsum; (b) <strong>tallers artesanals</strong> organitzats en gremis regulats (segles XI-XVIII); (c) <strong>capitalisme comercial</strong> (putting-out system), en què un mercader proporcionava matèries primeres a artesans domiciliaris i recollia la producció. La figura rellevant és el <strong>mercader</strong>, més que l'empresari modern.</p>
                        <p><strong>Richard Cantillon</strong> (1680-1734), a l'<em>Essai sur la nature du commerce en général</em> (1755, pòstum), va formular la primera teoria de l'empresari com a <strong>agent que assumeix risc</strong>: compra a un preu cert i ven a un preu incert, i és retribuït precisament per aqueixa incertesa.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Revolució Industrial: el capitalista propietari" color="red">
                        <p>Amb la Revolució Industrial (1760-1840 a Gran Bretanya; més tardana a la resta d'Europa i Espanya), la fàbrica substitueix el taller. L'empresari clàssic de l'<em>economia clàssica</em> (Smith, Ricardo, Say) és el <strong>capitalista propietari</strong>: aporta el capital, organitza la producció, assumeix el risc i obté el benefici. <strong>Jean-Baptiste Say</strong> (1803) va ser dels primers a distingir entre el capitalista (que aporta capital) i l'empresari (que coordina factors de producció i aporta la visió organitzativa).</p>
                        <p><strong>Alfred Marshall</strong>, a <em>Principles of Economics</em> (1890), va afegir el factor <strong>organització</strong> com a quart factor productiu, destacant el rol directiu de l'empresari.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Schumpeter: l'empresari innovador (1911, 1942)" color="violet">
                        <p><strong>Joseph A. Schumpeter</strong> (1883-1950) és probablement el teòric més influent de l'empresari. A <em>Theorie der wirtschaftlichen Entwicklung</em> (1911, trad. <em>The Theory of Economic Development</em>) i a <em>Capitalism, Socialism and Democracy</em> (1942), va formular la tesi central: l'empresari autèntic no és el simple propietari, sinó l'<strong>innovador</strong>. La seua funció essencial és la <strong>destrucció creativa</strong> (<em>schöpferische Zerstörung</em>): introduir novetats que trenquen equilibris anteriors i generen beneficis extraordinaris.</p>
                        <p>Schumpeter identifica cinc tipus d'innovació: (1) nou producte; (2) nou mètode de producció; (3) nou mercat; (4) nova font d'aprovisionament; (5) nova estructura de mercat. Exemples actuals: <em>Inditex</em> i el seu model de moda ràpida (nou mètode); <em>Tesla</em> i el cotxe elèctric de gran autonomia (nou producte); <em>Amazon</em> amb el comerç electrònic (nou mercat); <em>Airbnb</em> amb la llar compartida (nou mercat i estructura).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.4. Separació propietat-control: el directiu professional" color="indigo">
                        <p><strong>Berle i Means</strong> (1932) i <strong>Chandler</strong> (<em>The Visible Hand</em>, 1977) van documentar l'emergència de la <strong>gran corporació gerencial</strong>, on els directius professionals substitueixen els propietaris en la presa de decisions quotidiana (vegeu Tema 65). L'empresari modern de la gran empresa no és el propietari, sinó l'equip directiu que respon davant els accionistes.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.5. Emprenedor i intraemprenedor contemporanis" color="emerald">
                        <p><strong>Peter Drucker</strong> (<em>Innovation and Entrepreneurship</em>, 1985) va popularitzar l'emprenedoria com a disciplina gestionable. <strong>Gifford Pinchot</strong> (1985) va encunyar el terme <strong>intrapreneur</strong>: l'empleat que actua com a emprenedor dins una gran empresa (cas paradigmàtic: el grup <em>3M</em>, que reserva el 15 % del temps dels seus enginyers a projectes lliures). El <strong>Global Entrepreneurship Monitor</strong> (GEM) mesura anualment la taxa d'activitat emprenedora (TEA) a més de 50 països; Espanya se situa sobre el 7 % (2023), per davall de la mitjana europea.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.6. Definició jurídica i econòmica actual" color="cyan">
                        <p>El <strong>Codi de Comerç</strong> espanyol no defineix «empresa» explícitament, però l'equipara a l'activitat mercantil del comerciant (art. 1). L'article 38 CE consagra la <strong>llibertat d'empresa</strong> en el marc de l'economia de mercat. Des del punt de vista econòmic, l'empresa és la <strong>unitat econòmica de producció</strong> que combina factors productius per obtenir béns i serveis destinats al mercat, persegueix objectius diversos (benefici, supervivència, responsabilitat social) i assumeix riscos.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Funcions de l'empresa" icon="⚙️">
                    <TheoryBlock title="2.1. Funcions econòmiques" color="orange">
                        <p>(1) <strong>Coordina factors productius</strong> (Coase, 1937, Tema 59): internalitza transaccions que, via mercat, serien més costoses.</p>
                        <p>(2) <strong>Crea utilitat</strong>: transforma inputs en outputs, generant utilitat de forma (transformació física), de lloc (distribució), de temps (emmagatzematge) i de possessió (venda).</p>
                        <p>(3) <strong>Assumeix risc</strong>: inverteix abans de vendre, amb incertesa sobre la demanda i els costos.</p>
                        <p>(4) <strong>Genera valor afegit</strong>: la diferència entre els ingressos per vendes i els consums intermedis. El VAB empresarial espanyol supera els 1,2 bilions d'euros anuals (2023, INE).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Funcions socials" color="violet">
                        <p>(1) <strong>Generadora d'ocupació</strong>: a Espanya, les empreses ocupen 14,5 milions de treballadors assalariats (EPA, 2024).</p>
                        <p>(2) <strong>Retribució de factors</strong>: salaris, interessos, rendes, beneficis.</p>
                        <p>(3) <strong>Motor d'innovació</strong>: R+D empresarial representa el 57 % de la inversió total en R+D a Espanya (1,44 % del PIB el 2023).</p>
                        <p>(4) <strong>Integració social</strong>: espai de socialització, formació, identitat professional.</p>
                        <p>(5) <strong>Responsabilitat social (RSC)</strong>: contribució al bé comú (vegeu Tema 62).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Funcions administratives (Fayol, 1916)" color="blue">
                        <p>Com ja es va exposar al Tema 59, <strong>Henri Fayol</strong> va identificar sis funcions empresarials: <strong>tècnica</strong> (producció), <strong>comercial</strong> (compra-venda), <strong>financera</strong> (captació de capital), <strong>de seguretat</strong> (protecció), <strong>comptable</strong> (registre) i <strong>administrativa</strong> (planificar, organitzar, dirigir, coordinar, controlar — POCCC).</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Objectius de l'empresa" icon="🎯">
                    <TheoryBlock title="3.1. El debat clàssic: benefici o altres?" color="amber">
                        <p>L'economia neoclàssica ha postulat tradicionalment la <strong>maximització del benefici</strong> (π = IT − CT) com a objectiu únic, el màxim del qual es dona quan l'ingrés marginal iguala el cost marginal (IMg = CMg). Tanmateix, les teories alternatives han qüestionat aquest supòsit:</p>
                        <p><strong>• Maximització de vendes subjecta a benefici mínim</strong> (<strong>Baumol</strong>, 1959): els directius prefereixen créixer en vendes, sempre que s'assegure un benefici mínim acceptable per a accionistes.</p>
                        <p><strong>• Maximització del creixement</strong> (<strong>Marris</strong>, 1964): el creixement ofereix prestigi, salaris i estabilitat als directius.</p>
                        <p><strong>• Maximització de la utilitat directiva</strong> (<strong>Williamson</strong>, 1964): els directius maximitzen una funció d'utilitat que inclou salari, staff, inversions discrecionals.</p>
                        <p><strong>• Benefici satisfactori</strong> (<strong>Simon</strong>, 1947): racionalitat limitada → els directius busquen una rendibilitat <em>satisfactòria</em>, no màxima.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Objectius múltiples i jeràrquics" color="emerald">
                        <p>La realitat empresarial és més complexa. <strong>Ansoff</strong> (1965) i <strong>Cyert-March</strong> (1963) proposen que l'empresa persegueix una <strong>jerarquia d'objectius</strong>: (1) <strong>supervivència</strong> (condició prèvia); (2) <strong>creixement</strong>; (3) <strong>rendibilitat</strong>; (4) <strong>poder de mercat</strong>; (5) <strong>responsabilitat social</strong>; (6) <strong>satisfacció dels <em>stakeholders</em></strong>.</p>
                        <p>Els objectius es desglossen en criteris <strong>SMART</strong> (Doran, 1981; vegeu Tema 58): específics, mesurables, assolibles, rellevants i temporalitzats.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Shareholder value vs. stakeholder value" color="rose">
                        <p>La tensió entre la visió de <strong>Friedman</strong> (1970, <em>The Social Responsibility of Business is to Increase its Profits</em>) i la de <strong>Freeman</strong> (1984, <em>Strategic Management: A Stakeholder Approach</em>) continua sent viva. La declaració del <em>Business Roundtable</em> (2019) i la regulació europea (CSRD, 2022; ODS) apunten clarament cap al model de valor compartit i sostenible. A Espanya, empreses com <em>Iberdrola</em> o <em>Ferrovial</em> han integrat ODS i criteris ESG en la seua estratègia.</p>
                    </TheoryBlock>

                    <FormulaBox formula="π = IT − CT  |  max π ⇒ IMg = CMg" desc="Condició neoclàssica de maximització del benefici" />
                </Card>

                <Card title="4. Classes d'empresa" icon="🗂️">
                    <TheoryBlock title="4.1. Segons la forma jurídica" color="indigo">
                        <p><strong>• Empresari individual (autònom)</strong>: persona física, responsabilitat il·limitada. A Espanya: règim especial RETA de la Seguretat Social.</p>
                        <p><strong>• Comunitat de béns i Societat civil</strong>: formes associatives sense personalitat jurídica plena.</p>
                        <p><strong>• Societats mercantils</strong>:</p>
                        <p>&nbsp;&nbsp;— <strong>Societat Col·lectiva</strong> (responsabilitat il·limitada).</p>
                        <p>&nbsp;&nbsp;— <strong>Societat Comanditària</strong> (simple o per accions).</p>
                        <p>&nbsp;&nbsp;— <strong>Societat Limitada (SL)</strong>: capital mínim 3.000 €, responsabilitat limitada. Forma més estesa a Espanya (84,4 % de les societats, INE 2023).</p>
                        <p>&nbsp;&nbsp;— <strong>Societat Anònima (SA)</strong>: capital mínim 60.000 €, accions transmissibles. Pròpia de grans empreses.</p>
                        <p><strong>• Cooperatives</strong>: regulades per Llei 27/1999 estatal i normes autonòmiques. Principi: «un soci, un vot». Exemple: Grup <em>Mondragón</em>, Caixa <em>Popular</em>.</p>
                        <p><strong>• Societats laborals</strong> (SLL, SAL, Llei 44/2015): capital majoritari en mans dels treballadors.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Segons la dimensió" color="violet">
                        <p>La Recomanació 2003/361/CE defineix (criteri UE):</p>
                        <p><strong>• Microempresa</strong>: &lt;10 treballadors, &lt;2 M€ facturació/actiu.</p>
                        <p><strong>• Petita empresa</strong>: 10-49 trab., &lt;10 M€.</p>
                        <p><strong>• Mitjana empresa</strong>: 50-249 trab., &lt;50 M€ facturació o &lt;43 M€ actiu.</p>
                        <p><strong>• Gran empresa</strong>: ≥250 trab.</p>
                        <p>El Pla General de Comptabilitat distingeix les <em>PyMES</em> (PGC de PYMES, RD 1515/2007) amb comptes simplificats.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Altres classificacions" color="cyan">
                        <p><strong>Segons el sector</strong>: primari, secundari, terciari, quaternari (coneixement).</p>
                        <p><strong>Segons la titularitat</strong>: privada, pública (SEPI, RENFE, CORREOS), mixta.</p>
                        <p><strong>Segons l'àmbit geogràfic</strong>: local, regional, nacional, multinacional (MNE).</p>
                        <p><strong>Segons la innovació</strong>: empreses tradicionals, empreses de base tecnològica (EBT), startups, spin-offs.</p>
                        <p><strong>Formes especials</strong>: franquícia (<em>McDonald's</em>, <em>Cerveceria 100 Montaditos</em>), joint-venture, UTE (unió temporal d'empreses), holding, grup d'empreses.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. L'empresa com a sistema obert" icon="🌐">
                    <TheoryBlock title="5.1. Enfocament sistèmic (Bertalanffy, 1968)" color="indigo">
                        <p>Com es va exposar al Tema 57, l'<strong>enfocament sistèmic</strong> formulat per <strong>Ludwig von Bertalanffy</strong> (1968) concep l'empresa com un <strong>sistema obert</strong> que intercanvia matèria, energia i informació amb l'entorn. <strong>Katz i Kahn</strong> (<em>The Social Psychology of Organizations</em>, 1966) van adaptar l'enfocament sistèmic a les organitzacions, formulant les característiques: totalitat, sinergia, equifinalitat, retroalimentació (<em>feedback</em>), homeòstasi, diferenciació, integració, entropia negativa.</p>
                        <p>L'esquema bàsic: <em>inputs</em> (recursos, informació, demanda) → <em>procés de transformació</em> (producció, gestió) → <em>outputs</em> (béns, serveis, residus, informació). El cicle es tanca amb feedback extern (client, administració) i intern (control de gestió).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Entorn específic i general" color="amber">
                        <p>L'<strong>entorn general</strong> (macroentorn) comprén factors econòmics, polítics, socials, tecnològics, ecològics, legals (marc PESTEL, vegeu Tema 58).</p>
                        <p>L'<strong>entorn específic</strong> (microentorn) comprén competidors, clients, proveïdors, intermediaris, entitats financeres, administracions reguladores directes. S'analitza amb les 5 forces de Porter (Tema 58).</p>
                    </TheoryBlock>
                </Card>

                <Card title="6. Subsistemes empresarials" icon="🧩">
                    <TheoryBlock title="6.1. Criteris de divisió" color="orange">
                        <p>L'empresa, com a sistema complex, es pot analitzar descomposant-la en <strong>subsistemes</strong>. <strong>Bueno Campos</strong> (2007) proposa una divisió en quatre subsistemes funcionals:</p>
                        <p>(1) <strong>Subsistema real o de producció</strong>: gestiona la transformació física. Inclou producció, qualitat, logística.</p>
                        <p>(2) <strong>Subsistema financer</strong>: capta recursos financers (passiu) i els inverteix en actius. Gestió de tresoreria, pressupost, captació de capital.</p>
                        <p>(3) <strong>Subsistema comercial</strong>: màrqueting, vendes, atenció al client. Fa l'interfície amb el mercat.</p>
                        <p>(4) <strong>Subsistema directiu</strong>: planifica, organitza, dirigeix i controla els anteriors (Fayol, Drucker). Inclou recursos humans i sistemes d'informació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="6.2. Criteris alternatius de subdivisió" color="violet">
                        <p>Altres autors proposen divisions segons criteris diferents:</p>
                        <p><strong>• Mintzberg (1979)</strong>: 5 parts de l'organització (Tema 60): nucli operatiu, àpex estratègic, línia intermèdia, tecnoestructura, staff de suport.</p>
                        <p><strong>• Porter (1985)</strong>: cadena de valor: 5 activitats primàries + 4 de suport.</p>
                        <p><strong>• Cuervo Garcia</strong>: subsistema humà, material, financer, informatiu i directiu.</p>
                    </TheoryBlock>

                    <TheoryBlock title="6.3. Relacions intersubsistemes" color="emerald">
                        <p>Els subsistemes no són estancs: s'interrelacionen contínuament. El <em>subsistema comercial</em> detecta necessitats i informa el <em>real</em> per adaptar la producció; el <em>directiu</em> capta la informació de tots ells i pren decisions; el <em>financer</em> assigna recursos entre els altres. El fracàs empresarial sovint prové de <strong>desequilibris entre subsistemes</strong>: excel·lència productiva amb dèbil màrqueting (error freqüent de moltes PyMES innovadores), o hipertrofia financera respecte a la producció (cas <em>Enron</em>, 2001).</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>El concepte d'empresa i d'empresari ha evolucionat sensiblement des del mercader de Cantillon (1755), passant pel capitalista propietari de l'economia clàssica, l'empresari innovador de <strong>Schumpeter (1911)</strong>, el directiu professional documentat per Berle-Means i Chandler, fins a l'emprenedor / intraemprenedor contemporani de Drucker i Pinchot. Cada etapa reflecteix el capitalisme del seu temps.</p>
                        <p>L'empresa compleix funcions econòmiques i socials rellevants, persegueix objectius múltiples més enllà del simple benefici (segons Baumol, Marris, Williamson, Simon), i adopta formes jurídiques i dimensionals diverses, adaptades a cada activitat i context. L'<strong>enfocament sistèmic</strong> la presenta com un sistema obert en interrelació amb l'entorn, descomposable en subsistemes (real, financer, comercial, directiu) les interaccions dels quals determinen el seu èxit. Aquest marc conceptual, establert amb rigor, servirà com a fonament dels temes següents d'empresa (39-65) d'aquest i el bloc següent d'oposicions.</p>

                        <p>Definir els <strong>objectius</strong> d'una empresa és una tasca aparentment senzilla però profundament problemàtica. La resposta fàcil —«maximitzar el benefici»— esdevé insostenible a la llum de la realitat empresarial: les empreses reals equilibren beneficis a curt amb inversió a llarg, servei al client amb eficiència, accionistes amb treballadors, creixement amb sostenibilitat. Com va dir <strong>Peter Drucker</strong> (1954), «l'única definició vàlida del propòsit empresarial és crear un client». La tesi provocativa de Drucker no nega el benefici; el situa com a <em>conseqüència</em>, no com a <em>fi</em>.</p>
                        <p>El tema connecta directament amb el Tema 38 (fonaments d'empresa), el Tema 57 (presa de decisions), el Tema 58 (planificació) i el Tema 65 (govern corporatiu). A la realitat espanyola, la tensió entre objectius (maximització a curt termini exigida pels mercats financers vs. sostenibilitat a llarg termini) s'ha manifestat en casos com les reestructuracions d'<em>Abengoa</em> (2015) o els debats sobre la política de dividends d'<em>Iberdrola</em> i <em>Naturgy</em>.</p>
                        <p>Aquest tema s'estructura en 5 blocs: (1) concepte i característiques dels objectius; (2) diferents concepcions sobre la funció-objectiu; (3) el procés de fixació; (4) la jerarquia i desplegament d'objectius; (5) la direcció per objectius (MBO).</p>

                <Card title="1. Concepte i característiques dels objectius" icon="🎯">
                    <TheoryBlock title="1.1. Definició" color="orange">
                        <p>Un <strong>objectiu empresarial</strong> és un <strong>resultat o estat desitjat que l'empresa pretén assolir</strong> en un horitzó temporal definit. Es distingeix dels <em>fins</em> (més generals i abstractes, com la missió o visió) i de les <em>metes</em> (traducció quantitativa i concreta dels objectius).</p>
                        <p>L'arquitectura habitual és: <strong>missió</strong> (raó de ser) → <strong>visió</strong> (aspiració a llarg termini) → <strong>valors</strong> (principis) → <strong>objectius estratègics</strong> (3-5 anys) → <strong>objectius tàctics</strong> (1-3 anys) → <strong>objectius operatius/metes</strong> (&lt;1 any).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Característiques SMART (Doran, 1981)" color="violet">
                        <p><strong>George Doran</strong>, a l'article «There's a S.M.A.R.T. way to write management goals and objectives» (<em>Management Review</em>, 1981), va proposar que tot objectiu ha de complir:</p>
                        <p>• <strong>S</strong>pecific (específic): concret, clar, sense ambigüitat.</p>
                        <p>• <strong>M</strong>easurable (mesurable): amb indicadors quantitatius.</p>
                        <p>• <strong>A</strong>chievable (assolible): ambiciós però realista.</p>
                        <p>• <strong>R</strong>elevant (rellevant): alineat amb l'estratègia.</p>
                        <p>• <strong>T</strong>ime-bound (temporitzat): amb data límit.</p>
                        <p>Extensions posteriors afegeixen E (avaluable) i R (revisable), convertint-lo en SMARTER. Crítica: objectius massa SMART poden inhibir la creativitat i l'ambició; els <em>BHAGs</em> (Big Hairy Audacious Goals, Collins i Porras, 1994) defensen objectius ambiciosos i inspiradors.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Funcions dels objectius" color="blue">
                        <p>(1) <strong>Orientació</strong>: indiquen la direcció a seguir.</p>
                        <p>(2) <strong>Motivació</strong>: donen sentit a l'esforç (Locke-Latham, Tema 64).</p>
                        <p>(3) <strong>Coordinació</strong>: alineen els departaments.</p>
                        <p>(4) <strong>Avaluació i control</strong>: permeten comparar resultats vs. previst.</p>
                        <p>(5) <strong>Legitimació</strong>: justifiquen decisions davant els <em>stakeholders</em>.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Concepcions sobre la funció-objectiu" icon="🧭">
                    <TheoryBlock title="2.1. Visió neoclàssica: maximització del benefici" color="red">
                        <p>L'economia neoclàssica (Marshall, Walras, Pigou) postula com a objectiu únic la <strong>maximització del benefici</strong>. Condició de primer ordre: <em>IMg = CMg</em>. Suposa: (a) racionalitat perfecta; (b) informació completa; (c) propietari-gestor únic. Aquests supòsits són problemàtics a l'empresa moderna.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Crítiques gerencialistes" color="amber">
                        <p>En la gran corporació gerencial (Berle-Means, 1932), els directius no són els propietaris i poden perseguir objectius propis:</p>
                        <p><strong>• Baumol (1959)</strong>: <em>maximització de les vendes</em> subjecta a un benefici mínim (min π) que assegure els accionistes. Els directius prefereixen empreses grans (més salari, prestigi, opcions de carrera).</p>
                        <p><strong>• Marris (1964)</strong>: <em>maximització de la taxa de creixement sostenible</em> de les vendes.</p>
                        <p><strong>• Williamson (1964)</strong>: model d'<em>expense preference</em>: els directius maximitzen una funció d'utilitat amb staff (S), perks (M), inversions discrecionals (D) i benefici reportat (πᵣ). Formalment: U = f(S, M, D, πᵣ).</p>
                        <p><strong>• Simon (1947)</strong>: <em>satisfacció</em> (<em>satisficing</em>): racionalitat limitada → objectius «satisfactoris», no òptims. Els individus fixen nivells d'aspiració i hi cerquen arribar, no sobrepassar-los.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Teoria conductual (Cyert i March, 1963)" color="emerald">
                        <p><strong>Richard Cyert i James March</strong>, a <em>A Behavioral Theory of the Firm</em> (1963), conceben l'empresa com una <strong>coalició d'agents</strong> amb objectius divergents (accionistes volen dividends, treballadors volen salaris, directius volen creixement, clients volen preu baix i qualitat). Els objectius de l'empresa són el resultat de <strong>negociacions</strong> entre aquests grups, no una maximització abstracta.</p>
                        <p>Conceptes clau: <em>slack organitzatiu</em> (excedent que amorteix conflictes), <em>racionalitat local</em> (cada departament optimitza el seu), <em>aprenentatge adaptatiu</em> (els objectius evolucionen).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.4. Teoria dels stakeholders (Freeman, 1984)" color="rose">
                        <p>Com es va exposar al Tema 62, <strong>R. Edward Freeman</strong> (<em>Strategic Management: A Stakeholder Approach</em>, 1984) defensa que l'empresa ha de respondre davant de tots els grups d'interès: accionistes, treballadors, clients, proveïdors, comunitat, medi ambient. L'objectiu de l'empresa és crear valor per als <em>stakeholders</em>, del qual el benefici és conseqüència.</p>
                        <p>Aquest enfocament, llargament minoritari davant el <em>shareholder value</em> (Friedman, 1970), ha guanyat centralitat amb la declaració del Business Roundtable (2019), la Directiva CSRD (2022/2464) i l'auge de la inversió ESG.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. El procés de fixació d'objectius" icon="🧩">
                    <TheoryBlock title="3.1. Metodologia" color="indigo">
                        <p>El procés racional de fixació d'objectius segueix les fases:</p>
                        <p>(1) <strong>Anàlisi externa</strong> (PESTEL, 5 forces de Porter, oportunitats i amenaces).</p>
                        <p>(2) <strong>Anàlisi interna</strong> (cadena de valor, fortaleses i debilitats, capacitats nuclears).</p>
                        <p>(3) <strong>Definició de la missió i visió</strong>.</p>
                        <p>(4) <strong>Identificació d'<em>stakeholders</em></strong> i dels seus interessos.</p>
                        <p>(5) <strong>Formulació d'objectius estratègics</strong> SMART, desglossats per funcions.</p>
                        <p>(6) <strong>Priorització</strong> i resolució de conflictes entre objectius.</p>
                        <p>(7) <strong>Comunicació</strong> a tota l'organització.</p>
                        <p>(8) <strong>Revisió periòdica</strong>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Conflictes entre objectius" color="amber">
                        <p>És habitual la tensió entre objectius:</p>
                        <p><strong>• Curt vs. llarg termini</strong>: reduir R+D puja el benefici immediat però erosiona la competitivitat futura.</p>
                        <p><strong>• Creixement vs. rendibilitat</strong>: créixer ràpidament sol sacrificar marges.</p>
                        <p><strong>• Risc vs. rendiment</strong>: més rendiment exigeix més risc.</p>
                        <p><strong>• Accionistes vs. treballadors</strong>: més dividends vs. més salaris.</p>
                        <p><strong>• Eficiència vs. qualitat / sostenibilitat</strong>: costos baixos vs. impacte ambiental/social.</p>
                        <p>Resolució: priorització jeràrquica, negociació, criteris multicriteri (AHP de Saaty, 1980), quadre de comandament (BSC, Kaplan-Norton 1992, que equilibra 4 perspectives).</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Jerarquia i desplegament d'objectius" icon="📐">
                    <TheoryBlock title="4.1. Arbre d'objectius (Ansoff, 1965)" color="violet">
                        <p><strong>Igor Ansoff</strong> proposa organitzar els objectius en un <strong>arbre jeràrquic</strong> que va del general (supervivència, creixement, rendibilitat) a l'específic (quota de mercat en un segment, reducció de costos en un procés). Cada objectiu d'un nivell es desglossa en objectius del nivell inferior.</p>
                        <p>Exemple: objectiu estratègic «augmentar la rendibilitat del capital (ROE) al 15 % en 3 anys» → objectius tàctics (augmentar vendes 20 %, reduir costos 5 %, optimitzar estructura de capital) → objectius operatius (llançar 3 nous productes, reduir costos logístics 8 %, emetre bons per 100 M€).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. OKR (Objectives and Key Results)" color="emerald">
                        <p>Metodologia popularitzada per <strong>Andy Grove</strong> a <em>Intel</em> (anys 70) i difosa globalment per <strong>John Doerr</strong> (<em>Measure What Matters</em>, 2018) a partir de la seua aplicació a <em>Google</em>. Estructura:</p>
                        <p>• <strong>Objective (O)</strong>: qualitatiu, ambiciós, motivador. Resposta a «què volem assolir?».</p>
                        <p>• <strong>Key Results (KR)</strong>: 3-5 resultats mesurables. Resposta a «com sabrem que ho hem assolit?».</p>
                        <p>Cicle trimestral, revisats setmanalment. S'esperen assoliments del 60-70 % (més alt = objectius massa fàcils). Aplicat ja per LinkedIn, Twitter, Airbnb, Santander (2019).</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Direcció per objectius (MBO / DPO)" icon="🎯">
                    <TheoryBlock title="5.1. Drucker i la DPO (1954)" color="indigo">
                        <p><strong>Peter F. Drucker</strong>, en <em>The Practice of Management</em> (1954), va formular la <strong>Direcció per Objectius</strong> (DPO o MBO: Management by Objectives). Principis: (1) objectius consensuats entre superior i subordinat; (2) participació en la formulació; (3) avaluació per resultats, no per activitats; (4) autoretroalimentació. La DPO pressuposa la teoria Y de McGregor (treballador motivat i responsable).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Procés MBO" color="violet">
                        <p>(1) <strong>Formulació d'objectius corporatius</strong> per l'alta direcció.</p>
                        <p>(2) <strong>Desplegament en cascada</strong>: cada nivell fixa els seus objectius alineats amb els superiors.</p>
                        <p>(3) <strong>Acord individual</strong> entre cap i subordinat.</p>
                        <p>(4) <strong>Execució i autoseguiment</strong>.</p>
                        <p>(5) <strong>Avaluació final</strong>: compliment quantitatiu i qualitatiu.</p>
                        <p>(6) <strong>Retroalimentació</strong>: revisió de sistema i nous objectius.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Aportacions i crítiques" color="amber">
                        <p><strong>Aportacions</strong>: alinea comportaments, motiva, clarifica responsabilitats, facilita avaluació objectiva.</p>
                        <p><strong>Crítiques</strong> (Deming, 1986): pot incentivar la manipulació d'objectius fàcils, premiar el curt termini, erosionar la cooperació, reduir la creativitat. Deming va denunciar la DPO tradicional com a forma d'«<em>management by fear</em>» i va proposar el control estadístic de processos.</p>
                        <p><strong>Evolució moderna</strong>: la DPO ha evolucionat cap a variants com el BSC (Kaplan-Norton, 1992), els OKR (Grove-Doerr), l'<em>agile performance management</em> (check-ins continus), la gestió 360° (Edwards & Ewen, 1996) i la revisió per iguals.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Els objectius són el nord de tota organització; formular-los bé és una tasca tècnica i política alhora. El debat entre <strong>shareholder</strong> i <strong>stakeholder value</strong>, entre <strong>maximització</strong> i <strong>satisfacció</strong>, entre <strong>curt</strong> i <strong>llarg termini</strong> travessa la teoria i la pràctica empresarial dels darrers 100 anys. Les contribucions de <strong>Drucker (1954)</strong>, <strong>Simon (1947)</strong>, <strong>Cyert-March (1963)</strong>, <strong>Ansoff (1965)</strong>, <strong>Williamson (1964)</strong> i <strong>Freeman (1984)</strong> ofereixen lents complementàries.</p>
                        <p>El procés racional (anàlisi, formulació SMART, desplegament jeràrquic, revisió) conviu amb metodologies àgils com els <strong>OKR</strong> i amb el marc integrador del <strong>Balanced Scorecard</strong>. En un context de pressió creixent per la sostenibilitat i la transparència (CSRD, ODS), els objectius empresarials s'eixamplen més enllà del compte de resultats. El docent ha d'ajudar l'alumnat a veure que darrere de cada decisió empresarial hi ha una jerarquia implícita d'objectius, i que fer-la explícita és el primer pas d'una gestió ètica i eficaç.</p>
                    </div>
                </Card>

        const Tema40Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La <strong>localització</strong> empresarial —on situar una fàbrica, un magatzem, una oficina o un punt de venda— és una decisió estratègica de gran calat: implica inversions elevades, té efectes a llarg termini, condiciona costos operatius i accessibilitat, i és difícilment reversible. En un món cada vegada més globalitzat, la decisió de localització ha adquirit una dimensió internacional: les empreses avaluen llocs al món sencer (<em>offshoring</em>, <em>nearshoring</em>, <em>reshoring</em>).</p>
                        <p>Decisions recents il·lustratives: la inversió d'<em>Stellantis</em> (Vigo/Saragossa, ~1.300 M€ el 2023) per fabricar vehicles elèctrics; la Gigafactory de <em>Volkswagen</em> i <em>Navantia</em> a Sagunt (2.700 M€, 3.000 llocs de treball); la localització de centres logístics d'<em>Amazon</em> a Madrid, Barcelona i Sevilla; el <em>reshoring</em> parcial postpandèmia després del col·lapse de cadenes de subministrament xineses.</p>
                        <p>El tema s'estructura en 5 blocs: (1) concepte i importància; (2) factors de localització; (3) models clàssics (Weber, Hotelling); (4) models moderns (economies d'aglomeració, IA de localització); (5) localització i globalització.</p>

                <Card title="1. Concepte i importància" icon="📍">
                    <TheoryBlock title="1.1. Definició i tipus de decisió" color="orange">
                        <p>La <strong>decisió de localització</strong> és l'elecció del lloc geogràfic on ubicar les instal·lacions de l'empresa: plantes productives, magatzems, centres logístics, oficines, punts de venda. Pot comportar: (a) <strong>primera localització</strong> (nova empresa o activitat); (b) <strong>relocalització</strong> (trasllat, relacionat amb canvis de mercat o costos); (c) <strong>deslocalització</strong> (<em>offshoring</em>: trasllat a països amb menors costos).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Característiques estratègiques" color="violet">
                        <p>(1) <strong>Irreversibilitat parcial</strong>: els costos enfonsats (<em>sunk costs</em>) en instal·lacions són molt elevats.</p>
                        <p>(2) <strong>Efectes a llarg termini</strong>: condiciona la competitivitat durant dècades.</p>
                        <p>(3) <strong>Interacció amb altres decisions</strong>: influeix en producció, logística, màrqueting.</p>
                        <p>(4) <strong>Multiplicitat de criteris</strong>: costos, mercat, talent, regulació, sostenibilitat.</p>
                        <p>(5) <strong>Incertesa i canvis estructurals</strong>: globalització, transicions energètica i digital, geopolítica, pandèmies.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Factors de localització" icon="🗺️">
                    <TheoryBlock title="2.1. Factors del costat de l'oferta" color="amber">
                        <p><strong>• Proximitat a matèries primeres</strong>: si el producte perd pes en la transformació (siderúrgia, ciment), interessa proximitat a la mina.</p>
                        <p><strong>• Cost i disponibilitat del treball</strong>: salaris, qualificació, conflictivitat laboral. Motiu del <em>offshoring</em> cap a Àsia i Europa de l'Est.</p>
                        <p><strong>• Infraestructures</strong>: transport (port, aeroport, ferrocarril, autopistes), energia, telecomunicacions, aigua.</p>
                        <p><strong>• Sòl</strong>: preu, disponibilitat, qualificació urbanística (ús industrial, terciari).</p>
                        <p><strong>• Incentius fiscals i ajudes</strong>: zones especials (Canàries ZEC, Ceuta-Melilla), incentius regionals (Llei 50/1985), ajudes de minimis UE, fons Next Generation.</p>
                        <p><strong>• Proveïdors i serveis auxiliars</strong>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Factors del costat de la demanda" color="emerald">
                        <p><strong>• Proximitat al mercat</strong>: si el producte guanya pes o perd valor en transport (begudes, pa fresc), cal estar prop del consumidor.</p>
                        <p><strong>• Mida del mercat</strong>: poblacions grans per a establiments majoristes/comercials.</p>
                        <p><strong>• Nivell de renda</strong>: productes de luxe requereixen poblacions d'alt poder adquisitiu.</p>
                        <p><strong>• Competència local</strong>: millor allunyar-se (Launhardt) o concentrar-se (Hotelling) segons el producte.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Factors institucionals i socials" color="cyan">
                        <p><strong>• Marc legal i tributari</strong>: normativa laboral, fiscal, ambiental.</p>

                <Card title="3. Models clàssics de localització" icon="🧮">
                    <TheoryBlock title="3.1. Model de Weber (1909)" color="indigo">
                        <p>L'economista alemany <strong>Alfred Weber</strong>, en <em>Über den Standort der Industrien</em> (1909, trad. <em>Theory of the Location of Industries</em>), va formular el primer model formal de localització industrial. El principi: l'empresa s'ubica al <strong>punt que minimitza els costos totals de transport</strong>, tenint en compte el pes i la distància dels <em>inputs</em> i <em>outputs</em>.</p>
                        <p>Weber introdueix el concepte d'<strong>índex material</strong>: ratio entre pes dels inputs locals i pes del producte final. Si IM &gt; 1, l'empresa és <em>orientada a les matèries primeres</em> (ex. siderúrgia); si IM &lt; 1, és <em>orientada al mercat</em> (ex. embotellament de begudes).</p>
                        <p>Factors complementaris: costos laborals (<em>índex laboral</em>) i economies d'aglomeració (veure secció següent).</p>
                    </TheoryBlock>

                    <FormulaBox formula="Índex material = Pes dels inputs locals / Pes del producte final" desc="Weber (1909): si IM > 1, la localització s'orienta a les matèries primeres" />

                    <TheoryBlock title="3.2. Model de Hotelling (1929) — la gelateria de la platja" color="rose">
                        <p><strong>Harold Hotelling</strong>, a «Stability in Competition» (<em>Economic Journal</em>, 1929), va plantejar un problema clàssic: dues gelateries competeixen a una platja. Quines són les seues ubicacions d'equilibri? Hotelling demostra que, en competència per preu uniforme, ambdues tendeixen a ubicar-se <strong>al centre</strong> de la platja (tocant-se), perquè cadascuna busca capturar la meitat més propera del mercat.</p>
                        <p>Implicació: explica per què els partits polítics convergeixen al centre, per què les cadenes de comerç (McDonald's-Burger King) s'agrupen, per què els concessionaris d'automòbils de vàries marques s'alien en polígons comercials. Amb preus flexibles, els resultats poden ser diferents (<em>principi de mínima diferenciació</em>).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Model de von Thünen (1826) — cercles agrícoles" color="green">
                        <p>El pioner alemany <strong>Johann Heinrich von Thünen</strong>, a <em>Der isolierte Staat</em> (1826), va formular el primer model econòmic-espacial rigorós, explicant la distribució dels cultius al voltant d'una ciutat. Els productes peribles (llet, verdures) s'ubiquen prop; els durables (cereals) més lluny. Principi: <strong>la renda del sòl disminueix amb la distància al mercat</strong>. Aquest esquema (cercles concèntrics) és l'antecessor de la geografia econòmica moderna (Krugman, 1991).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.4. Mètode del centre de gravetat" color="violet">
                        <p>Tècnica quantitativa per a ubicar un centre logístic davant múltiples clients o proveïdors:</p>
                        <p>Coordenades del centre òptim: Cx = Σ(xᵢ · Wᵢ) / Σ Wᵢ ; Cy = Σ(yᵢ · Wᵢ) / Σ Wᵢ</p>
                        <p>On (xᵢ, yᵢ) són les coordenades dels destinataris i Wᵢ els pesos/volums transportats. Minimitza el cost de transport ponderat. Variacions: distància euclidiana vs. rectilínia (Manhattan), itinerari real.</p>
                    </TheoryBlock>

                    <FormulaBox formula="Cx = Σ(xᵢ · Wᵢ) / Σ Wᵢ  |  Cy = Σ(yᵢ · Wᵢ) / Σ Wᵢ" desc="Centre de gravetat ponderat per volums de transport" />
                </Card>

                <Card title="4. Economies d'aglomeració i clústers" icon="🏭">
                    <TheoryBlock title="4.1. Economies d'aglomeració (Marshall, 1890)" color="cyan">
                        <p><strong>Alfred Marshall</strong> (1890) va identificar els avantatges de la concentració geogràfica d'empreses del mateix sector, coneguts com a <strong>economies d'aglomeració</strong>:</p>
                        <p>(1) <strong>Pool de treball especialitzat</strong>: mercat laboral dens i qualificat.</p>
                        <p>(2) <strong>Compartició d'inputs i proveïdors</strong>: xarxa de proveïdors especialitzats.</p>
                        <p>(3) <strong>Spillovers de coneixement</strong> (<em>«knowledge in the air»</em>): difusió informal d'idees, innovacions, millors pràctiques.</p>
                        <p>Es distingeixen <strong>economies de localització</strong> (empreses del mateix sector) i <strong>economies d'urbanització</strong> (beneficis generals de les ciutats grans).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Clústers (Porter, 1990, 1998)" color="indigo">
                        <p><strong>Michael Porter</strong>, a <em>The Competitive Advantage of Nations</em> (1990) i <em>On Competition</em> (1998), va popularitzar el concepte de <strong>clúster</strong>: concentració geogràfica d'empreses i institucions interconnectades d'un mateix sector. Exemples paradigmàtics: Silicon Valley (tecnologia), Hollywood (cinema), City de Londres (finances), clúster de l'automoció a Wolfsburg, districte industrial de Prato (tèxtil).</p>
                        <p>A Espanya: clúster tèxtil de Galícia (<em>Inditex</em>, <em>Mango</em>), automoció Catalunya (SEAT), ceràmica de Castelló, calçat del Vinalopó, moble de València (l'Horta, Vall d'Albaida), agroalimentari de Múrcia i València.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Nova Geografia Econòmica (Krugman, 1991)" color="amber">
                        <p><strong>Paul Krugman</strong> (Nobel 2008), a «Increasing Returns and Economic Geography» (<em>JPE</em>, 1991), va formalitzar per què les activitats econòmiques es concentren geogràficament, malgrat la globalització. La resposta: <strong>rendiments creixents</strong> a escala + <strong>costos de transport no negligibles</strong> generen dinàmiques d'autorefortament (més empreses = mercat més gran = més empreses). El seu model «centre-perifèria» explica la persistència de divergències regionals.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.4. Contra-force: deseconomies d'aglomeració" color="red">
                        <p>La concentració també genera costos: congestió de trànsit, pol·lució, preus del sòl i habitatge, escassetat de talent, saturació ambiental. Exemples a Espanya: preu desorbitat de l'habitatge a Madrid i Barcelona ha induït el <em>teletreball</em> postpandèmia i la sortida d'empreses cap a ciutats mitjanes (Saragossa, València, Sevilla).</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Globalització i tendències actuals" icon="🌍">
                    <TheoryBlock title="5.1. Offshoring, nearshoring, reshoring" color="violet">
                        <p><strong>Offshoring</strong> (des dels 80): trasllat d'activitats a països amb menors costos. Xina, Vietnam, Mèxic van rebre grans inversions.</p>
                        <p><strong>Nearshoring</strong>: trasllat a països propers però més barats (Europa de l'Est per a empreses alemanyes; Mèxic per a empreses nord-americanes).</p>
                        <p><strong>Reshoring</strong>: tornada a la localització original, especialment després de la pandèmia (2020-2022), la guerra a Ucraïna i les tensions USA-Xina. La Llei de Chips (EU Chips Act, 2023, 43.000 M€) i l'Inflation Reduction Act als EUA (IRA, 2022) incentiven el <em>reshoring</em> industrial.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Tendències 2020-2025" color="emerald">
                        <p>• <strong>Sostenibilitat ambiental</strong>: criteris ESG en decisions de localització.</p>
                        <p>• <strong>Digitalització i remot-first</strong>: reducció de la rellevància de la localització per a activitats de servei.</p>
                        <p>• <strong>Geopolítica i friendshoring</strong>: diversificació cap a «aliats» (polítiques del G7).</p>
                        <p>• <strong>Incentius fiscals autonòmics</strong> a Espanya: Madrid (IRPF, Successions), Andalusia (IS reduït per a noves inversions).</p>
                        <p>• <strong>Intel·ligència artificial</strong> per a decisió de localització (GIS, <em>big data</em>, algorismes de <em>site selection</em>).</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La localització empresarial és una decisió estratègica que combina factors de l'oferta (costos, recursos) i de la demanda (mercat, competència). Els models clàssics de <strong>Weber (1909)</strong>, <strong>Hotelling (1929)</strong> i <strong>von Thünen (1826)</strong> proporcionen l'estructura analítica; les <strong>economies d'aglomeració</strong> (Marshall, 1890) i els <strong>clústers</strong> (Porter, 1990) expliquen per què les empreses es concentren; la <strong>Nova Geografia Econòmica</strong> (Krugman, 1991) ofereix un marc unificador.</p>
                        <p>En l'era actual, la globalització i la digitalització han reconfigurat radicalment el problema: <em>offshoring</em>, <em>nearshoring</em>, <em>reshoring</em> i <em>friendshoring</em> descriuen onades successives. Els fons Next Generation EU (més de 160.000 M€ per a Espanya), l'EU Chips Act o l'IRA nord-americà il·lustren com la localització és ara objecte d'<strong>estratègia industrial pública</strong>. El docent ha d'ajudar l'alumnat a comprendre que darrere d'una simple pregunta —«on instal·lar la fàbrica?»— hi ha segles de teoria econòmica i algunes de les qüestions geopolítiques més rellevants del nostre temps.</p>
                    </div>
                </Card>

                        <p>La <strong>dimensió òptima</strong> d'una empresa és aquella en què el cost mitjà unitari de producció és mínim a llarg termini. Es determina per la intersecció entre <strong>economies d'escala</strong> (reducció de costos mitjans amb l'augment de producció) i <strong>deseconomies d'escala</strong> (augment de costos amb mides excessives).</p>

                <Card title="4. Creixement empresarial" icon="📈">
                    <TheoryBlock title="4.1. Modalitats de creixement" color="indigo">
                        <p><strong>Creixement intern (orgànic)</strong>: augmentar capacitat pròpia. Construir nova planta, obrir nous punts de venda. Avantatges: control, cultura coherent. Inconvenients: lent, limitat per recursos interns.</p>
                        <p><strong>Creixement extern (inorgànic)</strong>: adquirir o fusionar-se amb altres empreses. Avantatges: velocitat, accés a actius estratègics (marques, patents, xarxes). Inconvenients: risc d'integració, sobrepagament (<em>winner's curse</em>).</p>
                        <p>Cas paradigmàtic espanyol: <em>Telefónica</em> va créixer externament els anys 90-2000 (compra d'operadores a Amèrica Llatina, GVT, O2); actualment està desapalancant-se amb vendes d'actius.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Matriu d'Ansoff (1957)" color="violet">
                        <p><strong>Igor Ansoff</strong> va formular la matriu que classifica les estratègies de creixement segons producte i mercat:</p>
                        <p>• <strong>Penetració de mercat</strong> (producte actual / mercat actual): augmentar quota. Baix risc.</p>
                        <p>• <strong>Desenvolupament de producte</strong> (nou / actual): innovar. Risc mitjà.</p>
                        <p>• <strong>Desenvolupament de mercat</strong> (actual / nou): expansió geogràfica, nous segments. Risc mitjà.</p>
                        <p>• <strong>Diversificació</strong> (nou / nou): relacionada o no. Risc alt.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Integració i diversificació" color="emerald">
                        <p><strong>Integració vertical</strong>: cap amunt (cap a proveïdors) o cap avall (cap a clients). Cas: <em>Inditex</em> integra disseny, producció i venda. Motivacions: reducció de costos de transacció (Williamson), seguretat de subministrament, control de qualitat.</p>
                        <p><strong>Integració horitzontal</strong>: adquisició de competidors del mateix mercat. Augmenta quota. Subjecte a control antitrust (CNMC, DG Comp).</p>
                        <p><strong>Diversificació relacionada</strong>: nou producte amb sinergies (Google → Android, Gmail).</p>
                        <p><strong>Diversificació no relacionada (conglomerat)</strong>: negocis aliens (LVMH: luxe + hotels + vins). Risc de disperses directives.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.4. Internacionalització" color="amber">

                        <p>(2) <strong>Contractuals</strong>: llicències, franquícies, joint-ventures.</p>
                        <p>(3) <strong>Inversió directa</strong> (IED): filial, adquisició.</p>
                        <p>La <strong>teoria eclèctica de Dunning</strong> (OLI, 1977) explica per què les empreses internacionalitzen: avantatges d'<strong>O</strong>wnership, <strong>L</strong>ocation, <strong>I</strong>nternalization. Espanya té empreses multinacionals líders al seu sector: <em>Inditex</em> (213 mercats), <em>ACS</em>, <em>Ferrovial</em>, <em>Meliá</em>, <em>Grifols</em>.</p>
                    </TheoryBlock>

                        <p>La <strong>bretxa de productivitat</strong> respecte a la UE s'explica en gran part per la petita dimensió empresarial mitjana. Polítiques de foment del creixement (Enisa, ICEX, Cre100do, Next Tech) busquen reduir aquesta bretxa.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Dimensió i ocupació" color="violet">
                        <p>Les <strong>microempreses i PyMES</strong> concentren el 66 % de l'ocupació privada a Espanya; les <strong>grans empreses</strong>, el 34 %. Tot i que les PyMES generen més volum d'ocupació, les grans empreses paguen salaris mitjans superiors (~50 % més) i ofereixen més estabilitat contractual.</p>
                        <p>Les <strong>polítiques públiques</strong> cerquen: (a) foment de l'emprenedoria (Llei 14/2013), (b) suport al creixement (Enisa, ICO), (c) reducció de llindar fiscal per a PIMES (IS reduït al 15 % primers 2 anys), (d) simplificació administrativa (Llei 25/2013 de factura electrònica).</p>

                        <p>Les estratègies de creixement (intern/extern, segons matriu d'Ansoff, integració vertical/horitzontal, diversificació, internacionalització Dunning OLI) exigeixen decisions complexes. El teixit empresarial espanyol, dominat per PyMES, presenta una oportunitat estratègica: fomentar el creixement de les empreses mitjanes podria reduir significativament la bretxa de productivitat amb les economies més avançades. En un context de transformació digital, transició energètica i fragmentació geopolítica, la dimensió òptima esdevé cada cop més contextual: en alguns sectors (microxips, aeroespacial) es necessiten gegants globals; en altres (moda, tecnologia), la flexibilitat d'empreses mitjanes altament especialitzades pot ser l'avantatge competitiu decisiu.</p>

                        <p>La <strong>producció</strong> és l'activitat econòmica fonamental: transforma <em>inputs</em> (matèries primeres, treball, capital, energia, coneixement) en <em>outputs</em> (béns i serveis) que satisfan necessitats humanes. La gestió de la producció —també anomenada direcció d'operacions— ha evolucionat des del taller artesanal fins a les fàbriques 4.0 dotades d'intel·ligència artificial i robòtica col·laborativa.</p>

                        <p>El tema s'estructura en 5 blocs: (1) sistema de producció i enfocament modern; (2) tipus de processos productius; (3) productivitat: concepte i mesura; (4) millora de la productivitat: lean, Six Sigma, Indústria 4.0; (5) qualitat i sostenibilitat.</p>

                <Card title="1. Sistema de producció" icon="⚙️">
                    <TheoryBlock title="1.1. Concepte d'operacions" color="orange">
                        <p>La <strong>direcció d'operacions</strong> (<em>Operations Management</em>) gestiona el sistema transformador de l'empresa. Segons <strong>Chase, Aquilano i Jacobs</strong> (<em>Operations Management for Competitive Advantage</em>, 2005), el sistema productiu és «el conjunt d'activitats que produeixen valor en forma de béns i serveis transformant inputs en outputs».</p>
                        <p>Objectius clàssics de la direcció d'operacions (<em>operations objectives</em>): cost, qualitat, flexibilitat, termini de lliurament, servei, sostenibilitat. La <strong>matriu de Porter</strong> del Tema 58 mostra que cap empresa pot excel·lir en tots simultàniament: ha de triar una estratègia (cost vs. diferenciació vs. enfocament).</p>

                    <TheoryBlock title="1.2. Funció de producció" color="violet">
                        <p>La <strong>funció de producció</strong> expressa la relació tècnica entre inputs i output: Q = f(K, L, T) on K és capital, L treball, T tecnologia. Tipus habituals:</p>
                        <p>• <strong>Cobb-Douglas</strong>: Q = A · K^α · L^β. Rendiments constants si α + β = 1, creixents si &gt; 1, decreixents si &lt; 1.</p>
                        <p>• <strong>Lineal</strong>: Q = aK + bL (substituts perfectes).</p>
                        <p>• <strong>Leontief</strong>: Q = min(K/a, L/b) (complementaris perfectes, proporcions fixes).</p>
                        <p>• <strong>CES</strong> (Constant Elasticity of Substitution, Arrow et al., 1961).</p>

                <Card title="2. Tipus de processos productius" icon="🏭">
                    <TheoryBlock title="2.1. Segons el flux productiu (Woodward, 1965)" color="indigo">
                        <p><strong>Joan Woodward</strong> (<em>Industrial Organization</em>, 1965) va classificar els processos segons la seua complexitat tècnica:</p>
                        <p><strong>a) Producció unitària o per projecte</strong>: productes únics a mida. Exemples: vaixells, edificis, bodes. Alta flexibilitat, baixa estandardització. Mà d'obra molt qualificada.</p>
                        <p><strong>b) Producció per lots (batch)</strong>: volums intermedis de productes diferenciats. Exemples: panaderia industrial, laboratoris farmacèutics.</p>
                        <p><strong>c) Producció massiva (en sèrie)</strong>: volums alts de producte homogeni. Exemples: automòbils (Ford), electrodomèstics. Alta estandardització, economies d'escala, rigidesa.</p>
                        <p><strong>d) Producció contínua (flux)</strong>: producció 24×7 sense interrupcions. Exemples: refineries, paperes, ciment. Alts costos fixos, molt capital intensiu.</p>

                        <p><strong>Segons el layout</strong>: producció en cadena (<em>línia</em>), per funció (<em>tallers</em> o <em>job shop</em>), fixa (<em>project shop</em>), cel·lular (agrupació per famílies de producte).</p>
                        <p><strong>Segons la seqüència</strong>: seqüencial, paral·lela, híbrida.</p>

                        <p>El <strong>Toyota Production System (TPS)</strong>, desenvolupat per <strong>Taiichi Ohno</strong> i <strong>Shigeo Shingo</strong> als anys 50-70, i popularitzat per <strong>Womack i Jones</strong> (<em>The Machine That Changed the World</em>, 1990; <em>Lean Thinking</em>, 1996), és la filosofia manufacturera més influent de la segona meitat del segle XX.</p>
                        <p>Principis: identificar <strong>valor</strong>, mapar la <strong>cadena de valor</strong>, crear <strong>flux continu</strong>, estirar des del client (<em>pull</em>), buscar la <strong>perfecció</strong> mitjançant millora contínua (<em>kaizen</em>).</p>

                        <p>Metodologia <strong>DMAIC</strong>: <strong>D</strong>efine, <strong>M</strong>easure, <strong>A</strong>nalyze, <strong>I</strong>mprove, <strong>C</strong>ontrol.</p>
                        <p>Organització: <em>black belts</em>, <em>green belts</em>, <em>yellow belts</em>. La síntesi amb Lean ha donat lloc al <strong>Lean Six Sigma</strong>, adopció típica de grans empreses industrials i de serveis.</p>

                        <p>• <strong>Intel·ligència artificial</strong> i <em>machine learning</em>.</p>
                        <p>• <strong>Fabricació additiva</strong> (impressió 3D).</p>

                        <p>A Espanya, la Indústria 4.0 s'impulsa mitjançant el programa <em>Industria Conectada 4.0</em> (2015) i el PERTE d'automoció (fons Next Gen EU, &gt;4.300 M€).</p>

                        <p>(1) <strong>Inspecció</strong> (1900s): detecció de defectes al final.</p>
                        <p>(2) <strong>Control estadístic</strong> (Shewhart, 1931): cartes de control, límits de variabilitat.</p>
                        <p>(3) <strong>Aseguració de la qualitat</strong> (Juran, 1950s): enfocament processos, trilogia de la qualitat (planificació, control, millora).</p>
                        <p>(4) <strong>Gestió de la Qualitat Total</strong> (TQM, anys 80): Deming 14 punts, cultura organitzativa.</p>
                        <p>(5) <strong>Excel·lència</strong>: EFQM, Malcolm Baldrige, ISO 9001:2015.</p>
                    </TheoryBlock>

                        <p><strong>W. Edwards Deming</strong>, pioner de la qualitat total, va influir decisivament en la recuperació industrial japonesa. Els seus <em>14 punts per a la direcció</em> (<em>Out of the Crisis</em>, 1986) inclouen: constància del propòsit, adopció d'una nova filosofia, evitar la inspecció massiva, evitar el menor preu com a criteri únic, millora contínua, formació en el lloc, lideratge, evitar la por, trencar barreres departamentals, eliminar eslògans, eliminar quotes numèriques, donar dignitat al treballador, educació i millora, compromís de tothom.</p>
                    </TheoryBlock>

                        <p>La <strong>producció sostenible</strong> integra criteris ambientals i socials: reducció d'emissions, economia circular, eficiència energètica, logística verda, comerç just. Normatives: <strong>ISO 14001</strong> (ambiental), <strong>ISO 50001</strong> (energia), <strong>Llei 7/2022</strong> de residus i sòls contaminats, <strong>Pla PERTE d'economia circular</strong>.</p>
                        <p>Concepte rellevant: <em>cradle-to-cradle</em> (Braungart-McDonough, 2002) enfront del <em>cradle-to-grave</em> tradicional. Casos: <em>Patagonia</em>, <em>Interface</em>, <em>Ecoalf</em> (Espanya).</p>
                    </TheoryBlock>

                        <p>El sistema de producció ha sigut un dels camps més dinàmics del <em>management</em>. Des de <strong>Taylor (1911)</strong> i <strong>Ford (1913)</strong> fins al <strong>Toyota Production System</strong>, passant per la <strong>Theory of Constraints</strong> (Goldratt, 1984), el <strong>Six Sigma</strong> (Motorola, 1986) i la <strong>Indústria 4.0</strong>, cada generació ha aportat millores substancials a l'eficiència. La <strong>productivitat</strong> —multifactorial, a la Solow (1957)— és el motor del creixement econòmic a llarg termini.</p>
                        <p>En l'actualitat, la convergència entre <em>lean thinking</em>, qualitat total i transformació digital configura la fàbrica del futur: flexible, àgil, sostenible i intel·ligent. Espanya té una oportunitat històrica amb els fons Next Gen EU i els PERTE per tancar la bretxa de productivitat. El docent ha de transmetre que la producció no és un tema «tècnic» reservat als enginyers, sinó el cor mateix de la competitivitat empresarial i de la prosperitat social.</p>

        // TEMA 43 — Els costos a l'empresa

        const Tema43Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>El <strong>cost</strong> és una de les variables més rellevants de la gestió empresarial: condiciona la fixació de preus, la rendibilitat, la competitivitat, la decisió de produir internament o externament, i els criteris d'assignació de recursos. Una empresa que no coneix els seus costos, no coneix el seu negoci. La <strong>comptabilitat analítica</strong> o de costos és l'eina rigorosa per gestionar-los.</p>
                        <p>Aquest tema connecta directament amb el Tema 41 (dimensió i economies d'escala), el Tema 42 (producció), el Tema 48 (fixació de preus), els Temes 66-68 (comptabilitat) i el Tema 13 de microeconomia (costos a curt i llarg termini). A la pràctica, la gestió de costos és una palanca competitiva essencial: la reducció sostenible de costos ha sigut el nucli estratègic de <em>Mercadona</em> (model SPB: Sempre Preus Baixos), <em>Ryanair</em> (lideratge en costos) i <em>Aldi/Lidl</em>.</p>
                        <p>El tema s'estructura en 5 blocs: (1) concepte i classificació de costos; (2) costos a curt i llarg termini; (3) anàlisi del punt mort; (4) sistemes de costos; (5) formació del cost i gestió estratègica.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i classificacions" icon="💰">
                    <TheoryBlock title="1.1. Concepte de cost" color="orange">
                        <p>El <strong>cost</strong> és la <strong>valoració monetària del consum de factors productius necessaris per obtenir un producte o servei</strong>. Cal distingir-lo de: (a) <em>despesa</em> (adquisició d'un factor, comptabilitzat en la comptabilitat financera); (b) <em>pagament</em> (moviment de tresoreria); (c) <em>inversió</em> (despesa en actius de llarga durada). El <strong>cost d'oportunitat</strong> (Tema 2) és el valor de la millor alternativa rebutjada.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Costos fixos i costos variables" color="violet">
                        <p>Classificació fonamental segons la relació amb el nivell d'activitat:</p>
                        <p><strong>• Costos fixos (CF)</strong>: no varien amb el volum de producció (a curt termini). Ex.: lloguer, amortització de maquinària, salaris fixos, assegurances. Gràficament, una recta horitzontal.</p>
                        <p><strong>• Costos variables (CV)</strong>: varien amb el volum. Ex.: matèries primeres, energia elèctrica, comissions, subministraments variables.</p>
                        <p><strong>• Costos semivariables o mixtos</strong>: tenen component fix i variable (ex.: factura telefònica amb quota + consum).</p>
                        <p>Important: la distinció només és vàlida <strong>a curt termini</strong>. A llarg termini, tots els costos són variables (es poden modificar: tancar plantes, canviar tecnologia).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Altres classificacions" color="blue">
                        <p><strong>• Directes vs. indirectes</strong>: imputables a un producte concret vs. compartits entre diversos.</p>
                        <p><strong>• Incorporables / no incorporables</strong>: inclosos o no en el càlcul del cost del producte.</p>
                        <p><strong>• Monetaris vs. implícits</strong>: pagats vs. cost d'oportunitat (ús de capital propi, dedicació personal de l'empresari).</p>
                        <p><strong>• Econòmic vs. comptable</strong>: el cost econòmic inclou el cost d'oportunitat (benefici econòmic ≤ benefici comptable).</p>
                        <p><strong>• Relevants vs. irrellevants</strong>: aquells que canvien segons la decisió vs. els costos enfonsats (<em>sunk costs</em>, no rellevants per a decisions futures).</p>
                        <p><strong>• Controlables vs. no controlables</strong> per un responsable.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Els costos a curt i llarg termini" icon="📉">
                    <TheoryBlock title="2.1. Costos a curt termini" color="indigo">
                        <p>A <strong>curt termini</strong> almenys un factor productiu és fix (generalment el capital: plantes, maquinària). Les funcions de cost es defineixen:</p>
                        <p>• <strong>Cost Total (CT)</strong>: CT = CF + CV.</p>
                        <p>• <strong>Cost Mitjà (CMe)</strong>: CMe = CT/Q = CF/Q + CV/Q = CFMe + CVMe.</p>
                        <p>• <strong>Cost Marginal (CMg)</strong>: CMg = ΔCT/ΔQ = dCT/dQ. És l'increment de cost en produir una unitat addicional.</p>
                        <p>La <strong>corba de CMe</strong> té forma de U (primer decreix per les economies, després creix per la llei de rendiments decreixents). El CMg talla el CMe pel seu mínim (resultat matemàtic clàssic).</p>
                    </TheoryBlock>

                    <FormulaBox formula="CT = CF + CV  |  CMe = CT/Q  |  CMg = dCT/dQ" desc="Funcions bàsiques de cost a curt termini" />

                    <TheoryBlock title="2.2. Costos a llarg termini" color="violet">
                        <p>A <strong>llarg termini</strong> tots els factors són variables. La corba de <strong>CMeLT</strong> és l'envolvent de les corbes a CT per a diferents dimensions. Mostra economies d'escala (descendent), dimensió òptima (mínim) i deseconomies (ascendent), com s'ha vist al Tema 41.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Anàlisi del punt mort (break-even)" icon="🎯">
                    <TheoryBlock title="3.1. Concepte" color="emerald">
                        <p>El <strong>punt mort</strong>, <strong>punt d'equilibri</strong>, <strong>llindar de rendibilitat</strong> o <em>break-even point</em> és el <strong>nivell d'activitat per al qual els ingressos totals igualen els costos totals</strong>, és a dir, l'empresa no té ni beneficis ni pèrdues. Per davall, perd; per damunt, guanya.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Càlcul" color="indigo">
                        <p>Partint de: IT = P · Q ; CT = CF + CVu · Q (on CVu és cost variable unitari). L'equació IT = CT ens dona:</p>
                        <p>P · Q = CF + CVu · Q → Q*(P − CVu) = CF → <strong>Q* = CF / (P − CVu)</strong>.</p>
                        <p>El factor (P − CVu) es diu <strong>marge de contribució unitari</strong> (<em>contribution margin</em>). És la part de cada unitat venuda que contribueix a cobrir els CF i, superat el punt mort, a generar benefici.</p>
                    </TheoryBlock>

                    <FormulaBox formula="Q* = CF / (P − CVu)" desc="Punt mort: quantitat que cobreix tots els costos" />

                    <TheoryBlock title="3.3. Exemple numèric" color="amber">
                        <p>Empresa amb CF = 60.000 €/any, CVu = 12 €, P = 20 €.</p>
                        <p>Marge unitari: 20 − 12 = 8 €.</p>
                        <p>Q* = 60.000 / 8 = <strong>7.500 unitats</strong>.</p>
                        <p>Comprovació: IT = 20 · 7.500 = 150.000 €; CT = 60.000 + 12·7.500 = 150.000 €. ✓</p>
                        <p>Si vol un benefici objectiu Bo = 20.000 €: Q'= (CF + Bo)/(P − CVu) = 80.000/8 = 10.000 unitats.</p>
                    </TheoryBlock>

                    {/* SVG Punt mort */}

                            <text x="265" y="320" textAnchor="middle" fontSize="10" fontWeight="bold" fill="#dc2626">Punt mort</text>

                            {/* formula box */}
                            <rect x="320" y="240" width="170" height="55" fill="#fff7ed" stroke="#ea580c" rx="6"/>
                            <text x="405" y="260" textAnchor="middle" fontSize="11" fontWeight="bold" fill="#9a3412">Q* = CF / (P − CVu)</text>
                            <text x="405" y="278" textAnchor="middle" fontSize="9" fill="#9a3412">Marge contribució unitari</text>
                            <text x="405" y="290" textAnchor="middle" fontSize="9" fill="#9a3412">= P − CVu</text>
                        </svg>
                    </div>

                    <TheoryBlock title="3.4. Limitacions i extensions" color="rose">
                        <p>El model assumeix: (a) preus i CVu constants; (b) funcions lineals; (c) un sol producte; (d) CF ben identificables. La realitat és més complexa.</p>
                        <p><strong>Extensions</strong>: punt mort <em>multiproducte</em> (mitjana ponderada per mix), <em>palanquejament operatiu</em> (L = Q(P−CVu)/[Q(P−CVu)−CF]) que mesura la sensibilitat del benefici davant variacions en les vendes, anàlisi cost-volum-benefici (CVP) amb escenaris.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Sistemes de costos" icon="🗂️">
                    <TheoryBlock title="4.1. Costos segons tècnica de càlcul" color="indigo">
                        <p><strong>a) Full costing</strong>: assigna tots els costos (fixos i variables, directes i indirectes) al producte. Resultat: cost complet. Útil per a preus a llarg termini.</p>
                        <p><strong>b) Direct costing o cost variable</strong>: només imputa costos variables al producte; els fixos van directament al compte de resultats. Útil per a decisions de curt termini (subcontractar?, acceptar comanda addicional?).</p>
                        <p><strong>c) Costos estàndard</strong>: cost predeterminat com a referència. Desviacions: tècniques (quantitat) vs. econòmiques (preu).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Sistemes per procés i per ordres" color="violet">
                        <p><strong>• Sistema per ordres de treball (<em>job costing</em>)</strong>: producció heterogènia, cada ordre és un objecte de cost. Típic de projectes, construcció, consultoria.</p>
                        <p><strong>• Sistema per processos</strong>: producció homogènia i contínua, el cost es calcula per departament/procés i s'assigna al producte per unitats equivalents. Típic de química, tèxtil.</p>
                        <p><strong>• Costos conjunts</strong>: productes que s'obtenen simultàniament d'un procés comú (petroli en refineria → gasolina + gasoil + plàstics).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. ABC — Activity Based Costing (Kaplan-Cooper, 1988)" color="emerald">
                        <p><strong>Robert Kaplan</strong> i <strong>Robin Cooper</strong>, a partir de 1988, van proposar el <strong>Cost Basat en Activitats</strong> (ABC). Crítica al <em>full costing</em> tradicional: imputa costos indirectes (mà d'obra indirecta, amortitzacions) proporcionalment a mà d'obra directa o hores màquina, distorsió quan els productes tenen estructures molt diferents.</p>
                        <p>L'ABC identifica <strong>activitats</strong> (preparar una comanda, fer una inspecció de qualitat, processar una factura) i assigna costos segons el consum real d'activitats per producte. Permet una comprensió més fina del cost real, especialment en empreses amb gran diversitat productiva.</p>
                        <p>L'evolució ABM (<em>Activity Based Management</em>) aplica l'anàlisi ABC a la presa de decisions.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Procés de formació del cost i gestió estratègica" icon="📈">
                    <TheoryBlock title="5.1. Formació del cost: classe, secció, portador" color="violet">
                        <p>El procés tradicional (<strong>models orgànics</strong>): els costos per <strong>classe</strong> (tipologia: materials, salaris, amortitzacions) s'agrupen en <strong>seccions</strong> (centres: aprovisionament, transformació, vendes, administració) i d'aquí s'imputen als <strong>portadors</strong> (productes o serveis finals). És el sistema habitual del PGC en sectors industrials.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Target costing (japonés)" color="amber">
                        <p>El <strong>cost objectiu</strong> o <em>target costing</em> (desenvolupat a Toyota, Nissan als 60-70) inverteix la lògica: en lloc de calcular el cost i fixar el preu, es parteix del <strong>preu de mercat</strong> (determinat pel client), es resta el <strong>marge objectiu</strong> i s'obté el <strong>cost màxim</strong> que l'empresa s'ha de permetre: <em>Cost màxim = Preu − Marge</em>. Tot el procés de disseny i producció s'orienta a aconseguir aquest cost.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Gestió estratègica de costos" color="indigo">
                        <p><strong>Shank i Govindarajan</strong> (<em>Strategic Cost Management</em>, 1993) proposen integrar l'anàlisi de costos en la gestió estratègica: (1) <strong>anàlisi de la cadena de valor</strong> (Porter); (2) <strong>anàlisi dels <em>cost drivers</em></strong> estratègics (escala, experiència, tecnologia); (3) <strong>anàlisi del posicionament</strong> (lideratge en costos vs. diferenciació).</p>
                        <p>Eines complementàries: <em>value analysis</em> (anàlisi de valor, GE els 40s), <em>benchmarking</em> de costos, <em>cost kaizen</em> (millora contínua de costos, 3-5 % anual), <em>economia circular</em> per reduir costos de residus.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.4. Costos ocults i costos de no-qualitat" color="rose">
                        <p>Conceptes rellevants:</p>
                        <p>• <strong>Costos ocults</strong>: absentisme, rotació, accidents, conflictes (Savall, model ISEOR).</p>

        const Tema44Complet = () => (
