                        <p>La <strong>planificació i programació de la producció</strong> respon a quatre preguntes clau: <em>què</em> produir, <em>quant</em> produir, <em>quan</em> produir i <em>amb quins recursos</em>. En un entorn on les cadenes de subministrament globals són vulnerables (crisi semiconductors 2021-2022, col·lapse del Canal de Suez 2021, guerra d'Ucraïna 2022), una bona planificació productiva és més que mai un factor competitiu. Les empreses que van aguantar millor la pandèmia foren les que tenien sistemes àgils capaços de reaccionar ràpidament a canvis de demanda.</p>

                        <p>El tema s'estructura en 5 blocs: (1) nivells i horitzons de planificació productiva; (2) planificació agregada i pla mestre; (3) MRP i gestió d'inventaris; (4) PERT/CPM i Gantt; (5) noves metodologies (Kanban, APS, agilitat).</p>

                <Card title="1. Nivells i horitzons de la planificació productiva" icon="📐">
                    <TheoryBlock title="1.1. Jerarquia de la planificació" color="indigo">

                <Card title="2. Planificació agregada i pla mestre" icon="📊">
                    <TheoryBlock title="2.1. Planificació agregada" color="cyan">
                        <p>La <strong>planificació agregada</strong> (<em>Aggregate Planning</em>) equilibra oferta i demanda a mig termini per famílies de productes. Estratègies bàsiques:</p>
                        <p>• <strong>Chase strategy</strong> (seguiment de la demanda): ajust de producció a la demanda variable mitjançant contractacions, acomiadaments, subcontractació. Adequada per a sectors amb estacionalitat marcada.</p>
                        <p>• <strong>Level strategy</strong> (nivellament): producció constant, absorbint oscil·lacions amb inventaris o llista d'espera. Estabilitat laboral, però alts costos d'estoc.</p>
                        <p>• <strong>Estratègia mixta</strong>: combina ambdues, usual a la pràctica.</p>
                        <p>Mètodes: tantejament, programació lineal, models heurístics, simulació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Pla mestre de producció (MPS)" color="amber">
                        <p>El <strong>Master Production Schedule (MPS)</strong> desglossa la planificació agregada en <strong>productes finals concrets i setmanes</strong>. Indica quantes unitats de cada producte es fabricaran i quan, respectant capacitats i compromisos amb clients. Serveix de punt de partida per a la següent etapa (MRP).</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. MRP — Material Requirements Planning" icon="📦">
                    <TheoryBlock title="3.1. MRP I (Orlicky, 1975)" color="indigo">
                        <p>L'<strong>MRP</strong> (<em>Material Requirements Planning</em>), desenvolupat per <strong>Joseph Orlicky</strong> a <em>IBM</em> i formalitzat al llibre <em>Material Requirements Planning</em> (1975), va ser la primera aplicació informàtica rellevant del management. Respon a les preguntes: <em>què</em> comprar / fabricar, <em>quant</em>, <em>quan</em>.</p>
                        <p><strong>Inputs</strong> necessaris:</p>
                        <p>(1) <strong>Pla mestre (MPS)</strong>: necessitats de productes finals.</p>
                        <p>(2) <strong>Llista de materials</strong> (<em>Bill of Materials, BOM</em>): estructura del producte, nivells 0, 1, 2... amb quantitats.</p>
                        <p>(3) <strong>Registre d'inventaris</strong>: existències actuals, comandes pendents, terminis de lliurament (<em>lead times</em>).</p>
                        <p><strong>Output</strong>: ordres de compra i de fabricació amb quantitats i dates.</p>
                        <p>Lògica: càlcul de necessitats brutes (explosió de la BOM) → restar existències → netes → ajustar pels terminis.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. MRP II i ERP" color="violet">
                        <p><strong>MRP II</strong> (<em>Manufacturing Resource Planning</em>, Wight 1984): amplia l'MRP I integrant capacitat productiva (CRP, <em>Capacity Requirements Planning</em>) i aspectes financers.</p>
                        <p><strong>ERP</strong> (<em>Enterprise Resource Planning</em>): evolució natural que integra tots els processos de l'empresa (producció, finances, RRHH, comercial, logística). Sistemes principals: <strong>SAP</strong> (líder mundial), <strong>Oracle</strong>, <strong>Microsoft Dynamics</strong>, <strong>Sage</strong>. A Espanya, SAP és present a gran empresa; <em>Sage</em> i <em>Holded</em> a PIME.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Gestió d'inventaris: el model EOQ" color="emerald">
                        <p>Un complement essencial del MRP és la <strong>gestió d'inventaris</strong>. El model clàssic és el <strong>Economic Order Quantity</strong> (EOQ), desenvolupat per <strong>Ford W. Harris</strong> el 1913:</p>
                        <p>EOQ = √(2·D·S / H), on D = demanda anual, S = cost de llançar una comanda, H = cost unitari d'emmagatzematge anual.</p>
                        <p>El model es basa en equilibrar costos de comanda (decreixents amb la quantitat) i costos d'emmagatzematge (creixents).</p>
                        <p>Altres models: <strong>ROP</strong> (Reorder Point), <strong>ABC</strong> d'inventaris (regla 80/20 de Pareto), <strong>Wilson</strong> amb descomptes per volum.</p>
                    </TheoryBlock>

                    <FormulaBox formula="EOQ = √(2·D·S / H)" desc="Quantitat Econòmica de Comanda (Harris, 1913)" />
                </Card>

                <Card title="4. Gestió de projectes: PERT/CPM i Gantt" icon="🗓️">
                    <TheoryBlock title="4.1. Diagrama de Gantt (1917)" color="rose">
                        <p><strong>Henry Gantt</strong>, deixeble de Taylor, va desenvolupar cap al 1910 el <strong>diagrama de barres</strong> que porta el seu nom. Representa visualment les activitats d'un projecte al llarg del temps. És la tècnica més simple i encara àmpliament utilitzada (Microsoft Project, Asana, Trello, Gantt Chart d'Excel).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. PERT (1958) i CPM (1957)" color="indigo">
                        <p><strong>PERT</strong> (<em>Program Evaluation and Review Technique</em>) va ser desenvolupat per la <em>US Navy</em> el 1958 per gestionar el programa del míssil Polaris (60.000 contractes, 23 mesos). <strong>CPM</strong> (<em>Critical Path Method</em>) va ser desenvolupat simultàniament per <em>DuPont</em> (1957). Ambdues tècniques són similars i s'han unificat en la pràctica.</p>
                        <p><strong>Procediment</strong>:</p>
                        <p>(1) <strong>Identificar activitats</strong> (llista WBS, <em>Work Breakdown Structure</em>).</p>
                        <p>(2) <strong>Establir precedents</strong>: quines activitats han de completar-se abans d'altres.</p>
                        <p>(3) <strong>Estimar durades</strong> (PERT usa 3 estimacions: optimista <em>a</em>, probable <em>m</em>, pessimista <em>b</em>; durada esperada: <em>t_e = (a + 4m + b) / 6</em>).</p>
                        <p>(4) <strong>Construir el graf</strong> de xarxa (AON o AOA).</p>
                        <p>(5) <strong>Calcular temps early / late</strong> de cada node.</p>
                        <p>(6) <strong>Identificar camí crític</strong>: seqüència d'activitats amb folgança zero; determina la durada total del projecte.</p>
                        <p>(7) <strong>Calcular folgances</strong>: total, lliure.</p>
                    </TheoryBlock>

                    <FormulaBox formula="t_e = (a + 4m + b) / 6   |   σ² = ((b − a) / 6)²" desc="Durada esperada i variància (PERT, distribució beta)" />

                    <TheoryBlock title="4.3. Exemple simplificat" color="amber">
                        <p>Projecte de 5 activitats amb les durades i precedents següents:</p>
                        <p>A (inici): 2 dies · B (després A): 4 · C (després A): 3 · D (després B): 2 · E (després C,D): 1.</p>
                        <p>Camins possibles:</p>
                        <p>• A-B-D-E: 2+4+2+1 = 9 dies</p>
                        <p>• A-C-E: 2+3+1 = 6 dies</p>
                        <p>Camí crític: A-B-D-E (9 dies). Folgança total en C: 9 − 6 = 3 dies.</p>
                    </TheoryBlock>

                        <p>Com s'ha exposat al Tema 42, el <strong>JIT</strong> (<em>Just-In-Time</em>) i el <strong>Kanban</strong> (Ohno, Toyota, 1950-70s) implementen la lògica <em>pull</em>: només es produeix el que la següent estació (o el client) demana. La senyal <em>kanban</em> (targeta) autoritza la producció. Avantatges: reducció d'inventaris, detecció ràpida de defectes, flexibilitat.</p>
                        <p>Requisits: demanda estable, proveïdors fiables, treballadors polivalents, cultura de qualitat. La seua aplicació al software (<em>software Kanban</em>, David Anderson, 2010) ha impulsat el seu ús fora de la manufactura.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. APS (Advanced Planning & Scheduling)" color="violet">

                        <p>L'<strong>Industry 4.0</strong> (Tema 42) combina MRP, Kanban, APS i IA per aconseguir <strong>fàbriques intel·ligents</strong>: autoconfiguració, manteniment predictiu, simulació digital twin, optimització en temps real.</p>
                    </TheoryBlock>

                    </TheoryBlock>

                        <p>Les disrupcions recents (pandèmia COVID-19, xocs geopolítics) han redefinit prioritats: de l'optimització extrema basada en costos cap a cadenes més <strong>resilients i flexibles</strong>. Les <strong>PERTE</strong> del Pla de Recuperació (automoció, semiconductors, agroalimentari) i la inversió en <strong>digitalització</strong> i <strong>economia circular</strong> busquen precisament enfortir aquesta capacitat. El domini d'aquestes tècniques per l'alumnat de Batxillerat és essencial per entendre el funcionament intern de l'empresa moderna.</p>

                        <p><strong>• Communication</strong> (en lloc de Promotion).</p>

                        <p>(4) <strong>Diferenciable</strong>: clarament distingit d'altres.</p>
                        <p>(5) <strong>Accionable</strong>: capacitat d'operar-hi.</p>
                    </TheoryBlock>

                        <p>• <strong>Màrqueting concentrat (nínxol)</strong>: un sol segment. Ferrari, Rolls-Royce, Patek Philippe.</p>

                <Card title="1. El producte: concepte i dimensions" icon="📦">
                    <TheoryBlock title="1.1. Concepte ampliat de producte (Kotler)" color="orange">
                        <p>Segons <strong>Kotler</strong>, el <strong>producte</strong> és «qualsevol cosa que es pot oferir al mercat per a captar atenció, adquisició, ús o consum i que podria satisfer una necessitat o desig». Inclou: béns tangibles, serveis, experiències, esdeveniments, persones (artistes, esportistes), llocs (turisme), propietats (immobles, accions), organitzacions (ONGs), informació i idees.</p>
                        <p>Els <strong>tres nivells de producte</strong>:</p>
                        <p>(1) <strong>Producte bàsic</strong>: la necessitat fonamental que satisfà (un cotxe satisfà la mobilitat).</p>
                        <p>(2) <strong>Producte real o tangible</strong>: marca, qualitat, disseny, envàs, característiques, etiquetatge.</p>
                        <p>(3) <strong>Producte augmentat</strong>: garanties, servei postvenda, finançament, lliurament.</p>
                        <p><strong>Levitt</strong> va afegir un quart nivell: <strong>producte potencial</strong> (totes les augmentacions i transformacions futures).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Classificació de productes" color="violet">
                        <p><strong>Segons la durabilitat i tangibilitat</strong>:</p>
                        <p>• <strong>Béns no duradors</strong> (<em>convenience goods</em>): consum ràpid, baix preu.</p>
                        <p>• <strong>Béns duradors</strong>: cotxes, electrodomèstics.</p>
                        <p>• <strong>Serveis</strong>.</p>
                        <p><strong>Segons el tipus de comprador</strong>:</p>
                        <p>• <strong>Béns de consum</strong> (<em>convenience</em>, <em>shopping</em>, <em>specialty</em>, <em>unsought</em>).</p>
                        <p>• <strong>Béns industrials</strong> (materials i peces, instal·lacions, subministraments).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. La marca" color="emerald">
                        <p>La <strong>marca</strong> (<em>brand</em>) és un nom, terme, signe, símbol o disseny, o una combinació d'aquests, que identifica productes d'un venedor i els diferencia de la competència.</p>
                        <p><strong>Funcions</strong>: identificació, garantia, posicionament, diferenciació, personalització, promesa.</p>
                        <p><strong>Tipus</strong>: marca del fabricant (Nestlé), marca del distribuïdor (Hacendado de Mercadona), marca blanca (<em>private label</em>).</p>
                        <p><strong>Estratègies</strong>: marca única, marques individuals, marca paraigua, co-branding, extensió de marca.</p>
                        <p><strong>Valor de marca (brand equity)</strong>: actiu intangible. <em>Apple</em>, <em>Google</em>, <em>Microsoft</em> encapçalen els rànquings (Interbrand, Brand Finance) amb valoracions superiors a 300.000 M$. A Espanya: <em>Zara</em>, <em>Movistar</em>, <em>Santander</em>.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Cicle de vida del producte" icon="📈">
                    <TheoryBlock title="2.1. Model clàssic (Levitt, 1965)" color="indigo">
                        <p><strong>Theodore Levitt</strong>, a «Exploit the Product Life Cycle» (<em>HBR</em>, 1965), va popularitzar el <strong>cicle de vida del producte</strong>: 4 fases amb característiques diferents de vendes, beneficis, competència i estratègies de màrqueting:</p>
                        <p><strong>1. Introducció</strong>: vendes baixes, alts costos, sense beneficis. Estratègia: conèixer, educar el mercat, sense rivals.</p>
                        <p><strong>2. Creixement</strong>: acceleració de vendes, entrada de competidors, economies d'escala. Estratègia: diferenciació, expansió del mercat.</p>
                        <p><strong>3. Maduresa</strong>: estabilització, saturació, competència intensa. Estratègia: modificar producte/mercat/mix. És la fase més llarga.</p>
                        <p><strong>4. Declivi</strong>: caiguda, obsolescència. Estratègies: collita (cosa), relligament, retirada.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Matriu BCG (Boston Consulting Group, 1970)" color="violet">
                        <p>Per gestionar una <strong>cartera de productes</strong> amb cicles de vida diferents, el <em>Boston Consulting Group</em> va desenvolupar la <strong>matriu creixement/quota</strong>. Dos eixos: creixement del mercat i quota relativa de mercat (x la del primer competidor). Quatre quadrants:</p>
                        <p>• <strong>Estrelles</strong> (alt creixement, alta quota): inverteix! Futur.</p>
                        <p>• <strong>Vaques lleteres</strong> (baix creixement, alta quota): ordenya! Genera caixa.</p>
                        <p>• <strong>Interrogants</strong> (alt creixement, baixa quota): decideix: invertir o desinvertir.</p>
                        <p>• <strong>Gossos</strong> (baix creixement, baixa quota): retira o manté per nínxol.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Matriu McKinsey/GE (General Electric, 1970s)" color="amber">
                        <p>Més sofisticada que la BCG: 9 cel·les (3×3) basades en <strong>atractiu del sector</strong> × <strong>posició competitiva</strong>. Facilita decisions d'inversió estratègica a unitats de negoci (SBU).</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Decisions sobre producte" icon="🔧">
                    <TheoryBlock title="3.1. Desenvolupament de nous productes" color="emerald">
                        <p>Etapes del desenvolupament de nous productes (<em>New Product Development, NPD</em>) — procés d'embut:</p>
                        <p>(1) <strong>Generació d'idees</strong>: fonts internes (R+D, empleats) i externes (clients, competidors, proveïdors).</p>
                        <p>(2) <strong>Triatge d'idees</strong>: selecció per viabilitat.</p>
                        <p>(3) <strong>Desenvolupament i test del concepte</strong>.</p>
                        <p>(4) <strong>Estratègia de màrqueting</strong>.</p>
                        <p>(5) <strong>Anàlisi de negoci</strong>: vendes estimades, costos, beneficis, ROI.</p>
                        <p>(6) <strong>Desenvolupament del producte</strong> (prototipatge).</p>
                        <p>(7) <strong>Mercat test</strong>.</p>
                        <p>(8) <strong>Comercialització</strong> (<em>launch</em>).</p>
                        <p><strong>Taxa de fracàs</strong>: segons estudis empírics (Nielsen), el 70-85 % dels nous productes fracassen els primers 2 anys. Mètodes moderns (Lean Startup de Ries 2011, Design Thinking, MVP) busquen reduir el risc.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Eliminació de productes" color="rose">
                        <p>L'eliminació o <em>descontinuació</em> d'un producte és una decisió difícil però necessària. Criteris: contribució econòmica, posició competitiva, perspectives del cicle, sinergies amb altres productes de la cartera. Estratègies: retirada immediata, <em>harvesting</em>, transferència a un altre mercat, relligament.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Distribució: concepte i canals" icon="🚚">
                    <TheoryBlock title="4.1. Funcions de la distribució" color="indigo">
                        <p>La <strong>distribució</strong> (<em>place</em> en les 4 P) és l'activitat de fer arribar el producte al consumidor. Les seues funcions principals:</p>
                        <p>(1) <strong>Transport</strong> i <strong>emmagatzematge</strong>: funcions físiques.</p>
                        <p>(2) <strong>Adaptació</strong>: fraccionament, preparació de lots.</p>
                        <p>(3) <strong>Assortiment</strong>: oferir varietat al client final.</p>
                        <p>(4) <strong>Informació</strong>: recollir info del mercat, comunicar al fabricant.</p>
                        <p>(5) <strong>Promoció</strong>: venda personal, visual merchandising.</p>
                        <p>(6) <strong>Finançament</strong>: crèdit a clients.</p>
                        <p>(7) <strong>Assumpció de risc</strong>: inventaris, crèdit impagat.</p>
                        <p>(8) <strong>Servei postvenda</strong>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Canals de distribució" color="violet">
                        <p>El <strong>canal</strong> és la ruta que segueix el producte des del fabricant fins al consumidor final. Tipus:</p>
                        <p><strong>• Canal directe</strong> (fabricant → consumidor): factory outlets, venda online pròpia (D2C: <em>Direct to Consumer</em>).</p>
                        <p><strong>• Canal curt</strong> (fabricant → detallista → consumidor): mercats, franquícies.</p>
                        <p><strong>• Canal llarg</strong> (fabricant → majorista → detallista → consumidor): béns de gran consum (FMCG).</p>
                        <p><strong>• Canal extra-llarg</strong>: més d'un majorista, agents.</p>
                        <p>Segons la <strong>intensitat</strong>:</p>
                        <p>• <strong>Intensiva</strong>: màxim nombre de punts de venda (Coca-Cola).</p>
                        <p>• <strong>Selectiva</strong>: intermediaris seleccionats (roba de marca mitjana).</p>
                        <p>• <strong>Exclusiva</strong>: pocs punts, lideratge del fabricant (Rolex, concessionaris oficials).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Selecció del canal" color="amber">
                        <p>Criteris per triar canal (Stern-El-Ansary, <em>Marketing Channels</em>):</p>
                        <p>• <strong>Cost</strong>: fix (estructura del canal) i variable (comissions).</p>
                        <p>• <strong>Control</strong>: canals directes donen més control, els llargs menys.</p>
                        <p>• <strong>Cobertura del mercat</strong>: accessibilitat al client objectiu.</p>
                        <p>• <strong>Característiques del producte</strong>: peribles, de gran valor, complexos exigeixen canals específics.</p>
                        <p>• <strong>Característiques del client</strong>: hàbits de compra.</p>
                        <p>• <strong>Recursos propis</strong>: una PIME rarament pot distribuir directament.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.4. Franquícia" color="green">
                        <p>La <strong>franquícia</strong> és un sistema de distribució on el franquiciador cedeix al franquiciat el dret d'explotar una marca, know-how i sistema operatiu a canvi d'un cànon inicial i royalties. Regulada per la <strong>Llei 7/1996 d'ordenació del comerç minorista</strong> (art. 62) i el Reglament CE 330/2010. A Espanya operen més de 1.300 xarxes de franquícies amb més de 80.000 establiments (Asociación Española de Franquiciadores, 2023). Exemples: <em>100 Montaditos</em>, <em>Ale-Hop</em>, <em>Mango</em>.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Logística i comerç electrònic" icon="🛒">
                    <TheoryBlock title="5.1. Logística i SCM" color="cyan">
                        <p>La <strong>logística</strong> (Council of Supply Chain Management Professionals) és «la part de la cadena de subministrament que planifica, implementa i controla el flux i emmagatzematge eficients i efectius de béns, serveis i informació des del punt d'origen fins al punt de consum». Inclou aprovisionament, emmagatzematge, gestió d'inventaris, transport, distribució, logística inversa (devolucions, reciclatge).</p>
                        <p>Tendències: <em>smart warehousing</em> (robotització), IoT, predicció IA, <em>last-mile</em> logística (el 40 % del cost total), lliurament sostenible.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Comerç electrònic" color="violet">
                        <p>L'<strong>e-commerce</strong> ha transformat la distribució. Modalitats: B2C (<em>Amazon</em>), B2B (<em>Alibaba</em>), C2C (<em>Wallapop</em>, <em>Vinted</em>), C2B (<em>influencers</em>). Models: botiga pròpia (<em>Zalando</em>), marketplace (<em>Amazon</em>, <em>Miravia</em>), subscripció (<em>Netflix</em>), <em>freemium</em> (<em>Spotify</em>), <em>drop-shipping</em>.</p>
                        <p>Tendències actuals:</p>
                        <p>• <strong>Social commerce</strong>: TikTok Shop, Instagram Shopping.</p>
                        <p>• <strong>Live shopping</strong> (Xina: més del 12 % de l'e-commerce).</p>
                        <p>• <strong>Quick commerce</strong>: lliurament en &lt;30 min (Glovo, Getir, Gorillas).</p>
                        <p>• <strong>Voice commerce</strong>: Alexa, Google Home.</p>
                        <p>Marc regulatori espanyol: Llei 34/2002 LSSI, Llei 22/2007 (comerç a distància), RGPD 2016/679, Llei 7/2017 (resolució extrajudicial).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Omni-channel" color="emerald">
                        <p>La <strong>omnicanalitat</strong> integra tots els canals (botiga física, web, mòbil, social, call center) en una experiència coherent i contínua per al client. El client comença la compra en un canal i la continua en un altre. Inditex ha sigut pionera a Espanya (integrant Zara.com amb les botigues: comprar online i recollir en botiga, devolucions, estoc compartit en temps real).</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La política de producte —amb la seua arquitectura de tres nivells (Kotler), el cicle de vida (<strong>Levitt, 1965</strong>), la gestió de cartera (BCG, McKinsey) i els processos de desenvolupament/eliminació— constitueix el nucli estratègic del màrqueting. La distribució, amb la seua elecció de canal, la logística i els nous models digitals, completa el circuit que connecta l'oferta amb la demanda.</p>
                        <p>Els canvis accelerats de les dues últimes dècades —<strong>e-commerce</strong>, <em>omnichannel</em>, <em>direct-to-consumer</em>, logística <em>last-mile</em>— han redefinit un camp que fins al segle XX es considerava «estable». Els casos d'<em>Inditex</em>, <em>Mercadona</em>, <em>Amazon</em> o <em>Zalando</em> il·lustren com el domini integrat de producte i distribució genera avantatges competitius sostenibles. Per al docent, és fonamental transmetre a l'alumnat aquesta doble dimensió estratègica i tàctica, amb exemples concrets i eines pràctiques.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i procés de comunicació comercial" icon="📣">
                    <TheoryBlock title="1.1. Concepte" color="orange">
                        <p>La <strong>comunicació comercial</strong> (o <em>marketing communications</em>) és «el conjunt d'activitats i eines que utilitza l'empresa per informar, persuadir i recordar als mercats sobre productes, serveis i la pròpia empresa» (Kotler-Armstrong). Els seus objectius tradicionals són els del model <strong>AIDA</strong> (Lewis, 1898): <strong>A</strong>ttention, <strong>I</strong>nterest, <strong>D</strong>esire, <strong>A</strong>ction.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Model del procés comunicatiu (Lasswell-Shannon)" color="violet">
                        <p>Adaptat al màrqueting: <strong>emissor</strong> (empresa) → <strong>codificació</strong> (creativitat) → <strong>missatge</strong> → <strong>canal</strong> (mitjà) → <strong>decodificació</strong> → <strong>receptor</strong> (audiència) → <strong>resposta/feedback</strong>. Sotmès a <strong>sorolls</strong> (saturació publicitària, missatges de la competència).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Models jeràrquics de resposta" color="blue">
                        <p>Els models jeràrquics descriuen el pas progressiu de l'audiència:</p>
                        <p>• <strong>AIDA</strong> (Lewis, 1898): Attention → Interest → Desire → Action.</p>
                        <p>• <strong>DAGMAR</strong> (Colley, 1961): Awareness → Comprehension → Conviction → Action.</p>
                        <p>• <strong>Jerarquia d'efectes</strong> (Lavidge-Steiner, 1961): consciència → coneixement → agradar → preferència → convicció → compra.</p>
                        <p>Models digitals recents: <strong>5A Kotler</strong> (2017): Aware → Appeal → Ask → Act → Advocate (el boca-orella digital i la fidelització són centrals).</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Mix de comunicació o promoció" icon="🧩">
                    <TheoryBlock title="2.1. Els 5 instruments clàssics" color="indigo">
                        <p>Segons <strong>Kotler-Armstrong</strong>, el <strong>promotion mix</strong> té 5 instruments fonamentals:</p>
                        <p><strong>(1) Publicitat</strong>: comunicació massiva i impersonal, pagada, identificada, controlada. Mitjans: TV, internet, ràdio, exterior, premsa.</p>
                        <p><strong>(2) Venda personal</strong>: interacció directa amb el client. Típica de béns complexos i de B2B.</p>
                        <p><strong>(3) Promoció de vendes</strong>: incentius temporals (descomptes, 2×1, regals, sortejos).</p>
                        <p><strong>(4) Relacions públiques i publicity</strong>: construcció d'imatge, comunicació institucional, gestió de mitjans no pagats.</p>
                        <p><strong>(5) Màrqueting directe i digital</strong>: email, SMS, xarxes socials, <em>push notifications</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Estratègies push vs. pull" color="rose">
                        <p><strong>Estratègia push</strong> (d'empènyer): el fabricant incentiva distribuïdors i detallistes perquè empengin el producte al consumidor. Eines: promoció de vendes, venda personal. Típica de B2B i de productes de baixa implicació.</p>
                        <p><strong>Estratègia pull</strong> (d'atreure): el fabricant s'adreça directament al consumidor final per generar demanda que «estira» del canal. Eines: publicitat massiva, màrqueting digital. Típica de gran consum.</p>
                        <p>Les estratègies sovint es combinen (<em>push-pull</em>).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Integració: IMC" color="emerald">
                        <p>La <strong>Comunicació de Màrqueting Integrada</strong> (<em>Integrated Marketing Communications, IMC</em>; Schultz-Tannenbaum-Lauterborn, 1993) coordina tots els missatges i canals per a oferir una veu única i coherent. Principi: «<em>One voice, one look</em>». Supera la fragmentació tradicional entre publicitat, PR i màrqueting directe.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. La publicitat" icon="📺">
                    <TheoryBlock title="3.1. Concepte, objectius i funcions" color="indigo">
                        <p>La <strong>publicitat</strong> és «qualsevol forma pagada i impersonal de presentació i promoció d'idees, béns o serveis per un patrocinador identificat» (AMA).</p>
                        <p><strong>Objectius</strong>:</p>
                        <p>• <strong>Informativa</strong>: llançament de nou producte, educar el mercat.</p>
                        <p>• <strong>Persuasiva</strong>: competitiva, comparativa.</p>
                        <p>• <strong>Recordatòria</strong>: marques madures.</p>
                        <p>• <strong>Reforçament</strong>: assegurança post-compra.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Tipus de publicitat" color="violet">
                        <p><strong>Segons cobertura</strong>: nacional, regional, local, internacional.</p>
                        <p><strong>Segons emissor</strong>: comercial (empresa), institucional (governs), corporativa (imatge marca), cooperativa.</p>
                        <p><strong>Segons audiència</strong>: consumidor, professionals, industrial.</p>
                        <p><strong>Segons format</strong>: <em>above the line</em> (ATL: massiva, TV/premsa) vs. <em>below the line</em> (BTL: específica, directa) vs. <em>through the line</em> (TTL: integrada).</p>
                        <p><strong>Segons mitjà</strong>: display, social ads, video ads, SEM (search engine marketing), native ads, programmatic.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Creativitat publicitària: copy strategy" color="amber">
                        <p>Els documents creatius clàssics que estructuren una campanya:</p>
                        <p>• <strong>Copy strategy</strong> (Procter & Gamble, 1931): públic objectiu, benefici clau, suport del benefici, to i estil.</p>
                        <p>• <strong>USP</strong> (<em>Unique Selling Proposition</em>, Rosser Reeves 1961): proposta única de venda, claim diferenciat.</p>
                        <p>• <strong>Brand character/essence</strong>: personalitat de la marca (Aaker, 1997: les 5 dimensions).</p>
                        <p>• <strong>Brief creatiu</strong>: input de l'empresa a l'agència.</p>
                        <p>Exemples memorables: «Just do it» (Nike), «Think different» (Apple), «Porque tú lo vales» (L'Oréal), «Frescura ibérica» (Campofrío), «¿A qué vienes?» (IKEA Espanya).</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Mitjans publicitaris i pla de mitjans" icon="📻">
                    <TheoryBlock title="4.1. Els mitjans convencionals i no convencionals" color="cyan">
                        <p><strong>Mitjans convencionals (ATL)</strong>:</p>
                        <p>• <strong>Televisió</strong>: cobertura massiva, alt cost. Espanya 2024: ~20 % de la inversió publicitària.</p>
                        <p>• <strong>Internet</strong>: ja el &gt;50 %. Display, social, vídeo, search.</p>
                        <p>• <strong>Exterior</strong> (OOH, <em>out-of-home</em>): tanques, mobiliari urbà, mupis.</p>
                        <p>• <strong>Ràdio</strong>: local i segmentada per franges.</p>
                        <p>• <strong>Premsa</strong> (diaris, suplements) i <strong>revistes</strong>: en retrocés.</p>
                        <p>• <strong>Cinema</strong>: audiència captiva, petita.</p>
                        <p><strong>Mitjans no convencionals (BTL)</strong>: màrqueting directe, correus (mailing), PLV (publicitat al lloc de venda), patrocini, <em>product placement</em>, esdeveniments, fires, <em>merchandising</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. El pla de mitjans" color="violet">
                        <p>El <strong>pla de mitjans</strong> (<em>media plan</em>) és el document que concreta on, quan i com es farà publicitat. Etapes:</p>
                        <p>(1) <strong>Briefing</strong>: objectius, target, pressupost, calendari.</p>
                        <p>(2) <strong>Anàlisi</strong>: audiències, consums mediàtics del target (EGM, Kantar Media, AIMC).</p>
                        <p>(3) <strong>Selecció de mitjans i suports</strong>: cobertura, freqüència, afinitat, cost.</p>
                        <p>(4) <strong>Distribució temporal</strong>: continua, polsant (flights), concentrada.</p>
                        <p>(5) <strong>Pressupostació</strong>.</p>
                        <p>(6) <strong>Execució i compra d'espais</strong> (o programmàtic, si digital).</p>
                        <p>(7) <strong>Mesurament</strong>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Mètriques publicitàries" color="emerald">
                        <p>Tradicionals:</p>
                        <p>• <strong>Audiència</strong>: nombre de persones exposades a un mitjà.</p>
                        <p>• <strong>Cobertura</strong> (<em>reach</em>): % del target impactat.</p>
                        <p>• <strong>Freqüència</strong>: impactes per persona.</p>
                        <p>• <strong>GRP</strong> (<em>Gross Rating Point</em>) = Cobertura × Freqüència. Indicador agregat.</p>
                        <p>• <strong>CPM</strong> (cost per mil impressions).</p>
                        <p>• <strong>CPC</strong> (cost per clic).</p>
                        <p>• <strong>CTR</strong> (click-through rate).</p>
                        <p>• <strong>Affinity</strong>: solapament audiència-target.</p>
                        <p>Digitals: <strong>CPA</strong> (cost per acció), <strong>ROAS</strong> (return on ad spend), <strong>engagement rate</strong>, <strong>share of voice</strong>.</p>
                    </TheoryBlock>

                    <FormulaBox formula="GRP = Cobertura (%) × Freqüència  |  CPM = (Cost / Impressions) × 1000" desc="Mètriques publicitàries fonamentals" />
                </Card>

                <Card title="5. Tendències digitals i regulació" icon="🌐">
                    <TheoryBlock title="5.1. Màrqueting digital i social media" color="rose">
                        <p>Les plataformes digitals han democratitzat la publicitat i permès un nivell inèdit de <strong>segmentació i mesurament</strong>:</p>
                        <p>• <strong>SEM</strong> (Search Engine Marketing): Google Ads (antic AdWords), licitació en temps real per paraules clau.</p>
                        <p>• <strong>SEO</strong>: posicionament orgànic.</p>
                        <p>• <strong>Social ads</strong>: Meta (Facebook-Instagram), TikTok Ads, LinkedIn, X (Twitter).</p>
                        <p>• <strong>Display publicitari programmàtic</strong> (RTB, <em>Real-Time Bidding</em>).</p>
                        <p>• <strong>Influencer marketing</strong>: mercat espanyol ~150 M€ anuals. Regulat per IAB Spain i AEA.</p>
                        <p>• <strong>Content marketing</strong>: blogs, podcasts, vídeo (<em>BBVA Aprendemos Juntos</em>, <em>Ikea Magazine</em>).</p>
                        <p>• <strong>Email marketing</strong>: ROI mitjà alt, regulat per RGPD.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Marc regulatori" color="indigo">
                        <p><strong>• Llei General de Publicitat</strong> (Llei 34/1988, vigent): defineix publicitat, subjectes, publicitat il·lícita (enganyosa, deslleial, subliminal, prohibida per col·lectius especials).</p>
                        <p><strong>• Llei 13/2022 General de la Comunicació Audiovisual</strong>: regula publicitat en ràdio/TV, límits horaris, protecció del menor.</p>
                        <p><strong>• Reglament UE DSA</strong> (Digital Services Act, 2022/2065): transparència en publicitat online, prohibicions (menors, dades sensibles).</p>
                        <p><strong>• Reglament UE DMA</strong> (Digital Markets Act, 2022/1925): limita pràctiques de grans plataformes.</p>
                        <p><strong>• RGPD</strong> (Reg. 2016/679): consentiment per a tracking, cookies.</p>
                        <p><strong>• Autocontrol</strong> (associació d'autoregulació publicitària) resol queixes extrajudicialment.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Ètica publicitària i sostenibilitat" color="green">
                        <p><strong>Problemes ètics</strong>: estereotips (sexistes, racials, edat), publicitat a menors, <em>greenwashing</em>, <em>fake news</em>, missatges addictius. <strong>Iniciatives</strong>: codis ètics sectorials (Autocontrol, IAB), <em>dark patterns</em> prohibits per DSA, exigència de missatges en publicitat sobre alcohol, joc i productes financers.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La comunicació comercial ha passat de ser una activitat bàsicament unidireccional (publicitat tradicional a mitjans massius) a una conversa multidireccional entre marques, consumidors i comunitats, mediatitzada per algorismes i plataformes digitals. Els models clàssics (<strong>AIDA, DAGMAR</strong>, jerarquia d'efectes) han evolucionat cap als <strong>5A de Kotler</strong> que incorporen <em>advocacy</em> i virality. Els cinc instruments del <em>promotion mix</em> (publicitat, venda personal, promocions, PR, màrqueting directe/digital) es coordinen en una estratègia IMC coherent.</p>
                        <p>La <strong>publicitat</strong>, amb els seus objectius i tipus, i el <strong>pla de mitjans</strong> (amb mètriques com GRP, CPM, CPC, CTR, ROAS) configuren el nucli tàctic. L'era digital —SEM, social ads, programmàtic, influencers— exigeix ​​noves competències i suscita noves qüestions ètiques i regulatòries (DSA, DMA, RGPD). El docent ha de preparar l'alumnat per comprendre i exercir una comunicació comercial eficaç, ètica i jurídicament responsable.</p>
                    </div>
                </Card>

        // ════════════════════════════════════════════════════════════════
        // TEMA 48 — La política de preus i estratègia de màrqueting
        // ════════════════════════════════════════════════════════════════
        const Tema48Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>El <strong>preu</strong> és l'única de les 4 P que <strong>genera ingressos</strong>: les altres (producte, distribució, comunicació) generen costos. És també l'element més flexible del mix (es pot modificar ràpidament) i el que més influeix a curt termini en vendes i rendibilitat. <em>Warren Buffett</em> va dir: «El test més important de la qualitat d'un negoci és la capacitat de pujar els preus sense perdre clients».</p>
                        <p>En un entorn inflacionari com el 2022-2024, amb pics d'IPC del 10,8 % (juliol 2022) i estabilització al voltant del 3 % el 2024, la gestió dels preus ha adquirit una importància estratègica excepcional. Les empreses han hagut de decidir entre absorbir costos, traslladar-los (<em>pricing power</em>) o ajustar mix de productes. Casos com les pujades de <em>Mercadona</em>, les estratègies de marca blanca d'<em>Aldi/Lidl</em> o la política de <em>Ryanair</em> il·lustren respostes diferents.</p>
                        <p>Aquest tema, l'últim del Bloc E, s'estructura en 5 blocs: (1) concepte i factors que condicionen el preu; (2) mètodes de fixació de preus; (3) estratègies de preu; (4) discriminació de preus i altres tècniques avançades; (5) planificació, organització i control de l'estratègia de màrqueting.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i factors condicionants del preu" icon="💶">
                    <TheoryBlock title="1.1. Concepte" color="orange">
                        <p>El <strong>preu</strong> és la <strong>quantitat de diner (o altres recursos) que un client lliura a canvi d'un producte o servei</strong>. Des de la perspectiva del client, és el sacrifici; des de l'empresa, l'ingrés unitari. Expressa l'intercanvi del valor creat per l'empresa.</p>
                        <p>El preu té una <strong>dimensió múltiple</strong>: preu facial, preu net (amb descomptes), preu percebut pel client, preu psicològic, preu de referència (el que el client creu habitual), preu màxim disposat a pagar (<em>reservation price</em>).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Factors interns" color="violet">
                        <p>(1) <strong>Costos</strong>: el preu ha de cobrir els costos a llarg termini. El punt mort (Tema 43) és una referència clau.</p>
                        <p>(2) <strong>Objectius empresarials</strong>: maximització del benefici, quota de mercat, supervivència, prestigi (estratègies diferents).</p>
                        <p>(3) <strong>Cicle de vida del producte</strong>: preus alts en introducció (<em>skimming</em>) o baixos (<em>penetració</em>), ajust en maduresa.</p>
                        <p>(4) <strong>Estratègia global del mix</strong>: coherència amb producte, canal i comunicació (un perfum de luxe a 3€ no té sentit).</p>
                        <p>(5) <strong>Capacitat productiva</strong>: si la demanda supera la capacitat, preus alts.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Factors externs" color="cyan">
                        <p>(1) <strong>Demanda</strong>: elasticitat-preu (Tema 11), sensibilitat del consumidor.</p>
                        <p>(2) <strong>Competència</strong>: estructura del mercat (competència perfecta, monopoli, oligopoli), nivell de preus del mercat.</p>
                        <p>(3) <strong>Regulació</strong>: preus regulats (energia, tarifes públiques, productes farmacèutics amb recepta), prohibicions (venda a pèrdua, Llei 7/1996).</p>
                        <p>(4) <strong>Entorn econòmic</strong>: inflació, tipus d'interès, tipus de canvi.</p>
                        <p>(5) <strong>Percepció i imatge de marca</strong>: preu com a senyal de qualitat (efecte Veblen per a béns de luxe).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.4. Elasticitat-preu de la demanda" color="emerald">
                        <p>Concepte fonamental (Tema 11, Microeconomia): mesura la variació percentual de la quantitat demandada davant una variació percentual del preu.</p>
                        <p>E_p = (ΔQ/Q)/(ΔP/P). Si |E_p| &gt; 1 → demanda elàstica (un augment de preu redueix ingressos). Si |E_p| &lt; 1 → demanda inelàstica (un augment augmenta ingressos). La majoria de béns de primera necessitat són inelàstics; els béns de luxe o amb substituts, elàstics.</p>
                        <p>Factors de l'elasticitat: disponibilitat de substituts, proporció de la renda, temps d'adaptació, caràcter essencial o discrecional.</p>
                    </TheoryBlock>

                    <FormulaBox formula="E_p = (ΔQ/Q) / (ΔP/P)   |   IT = P · Q" desc="Elasticitat-preu: si |E_p|>1, baixar preu augmenta IT; si <1, pujar preu augmenta IT" />
                </Card>

                <Card title="2. Mètodes de fixació de preus" icon="🧮">
                    <TheoryBlock title="2.1. Mètodes basats en costos (cost-plus)" color="indigo">
                        <p>Més simples i habituals. Parteixen del cost i hi afegeixen un marge:</p>
                        <p><strong>a) Preu de cost + marge</strong>: P = CT unitari × (1 + m), on m és el percentatge de marge.</p>
                        <p><strong>b) Preu de retorn d'inversió (ROI)</strong>: P = CT unitari + (ROI desitjat × Capital invertit) / Vendes estimades.</p>
                        <p><strong>c) Preu objectiu de benefici</strong>: P = (CF + B_objectiu) / Q + CVu.</p>
                        <p><strong>Avantatges</strong>: simplicitat, justícia percebuda, garanteix rendibilitat.</p>
                        <p><strong>Inconvenients</strong>: ignora la demanda i la competència.</p>
                    </TheoryBlock>

                    <FormulaBox formula="P = CT_unitari · (1 + m)   |   P objectiu = (CF + B_obj)/Q + CVu" desc="Fixació de preus basada en costos" />

                    <TheoryBlock title="2.2. Mètodes basats en la competència" color="violet">
                        <p><strong>a) Preu respecte a la competència</strong>: preu igual (paritat), sobre o sota. Típic en mercats madurs.</p>
                        <p><strong>b) Preu de licitació</strong>: subhastes, concursos públics (llei de contractes del sector públic 9/2017). Predir el preu del competidor és clau.</p>
                        <p><strong>c) Preu de mercat</strong>: acceptar el preu vigent (price taker en competència).</p>
                        <p>Les empreses que segueixen el líder utilitzen una <em>estratègia seguidora</em>; les que reten el líder, <em>estratègia agressiva</em>; les de nínxol, <em>estratègia especialista</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Mètodes basats en el valor" color="emerald">
                        <p>Es parteix del <strong>valor percebut pel client</strong>, no del cost. P = Valor percebut − Marge percebut del client. Exigeix investigació en profunditat.</p>
                        <p>Tècniques:</p>
                        <p>• <strong>Preu EDLP</strong> (Every Day Low Price, Walmart, Mercadona): preus estables baixos.</p>
                        <p>• <strong>Value pricing</strong>: oferir alta qualitat a preu moderat.</p>
                        <p>• <strong>Target pricing</strong> japonés (Tema 43): es parteix del preu que el client accepta i es dissenya per complir-ne el cost.</p>
                        <p>• <strong>Pricing dinàmic</strong>: algoritmes que ajusten preu en temps real (aerolínies, Uber surge pricing).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.4. Mètode òptim microeconòmic" color="rose">
                        <p>En competència perfecta: P = CMg (preu igual al cost marginal). En monopoli i altres formes no competitives, la condició de maximització del benefici és <strong>IMg = CMg</strong>, amb el preu resultant al tram elàstic de la corba de demanda.</p>
                        <p>Fórmula de Lerner: (P − CMg) / P = 1 / |E_p|. Mostra que el marge sobre el CMg depèn inversament de l'elasticitat.</p>
                    </TheoryBlock>

                    <FormulaBox formula="(P − CMg)/P = 1 / |E_p|" desc="Condició de Lerner: marge òptim inversament proporcional a l'elasticitat" />
                </Card>

                <Card title="3. Estratègies de preu" icon="🎯">
                    <TheoryBlock title="3.1. Estratègies de llançament" color="amber">
                        <p><strong>a) Descremat (skimming)</strong>: preu inicial alt, per capturar els clients amb major disposició a pagar. Es redueix gradualment. Requereix: producte innovador, demanda inelàstica al principi, protecció davant copiadors. Exemple clàssic: Apple amb iPhones nous.</p>
                        <p><strong>b) Penetració</strong>: preu inicial baix per conquerir ràpidament quota. Requereix: demanda elàstica, economies d'escala, dissuasió de competidors. Exemple: Spotify entrant a Espanya (2008).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Estratègies de línia de producte" color="violet">
                        <p><strong>a) Preus captius</strong>: producte principal barat, complements cars (màquines d'afaitar + fulles; Nespresso + càpsules; impressores + tinta).</p>
                        <p><strong>b) Bundle pricing</strong> (preu del paquet): packs amb preu inferior a la suma individual (menú vs. plats solts, Office 365).</p>
                        <p><strong>c) Preus per línies</strong>: gamma amb preus diferenciats (iPhone SE, iPhone estàndard, iPhone Pro).</p>
                        <p><strong>d) Preus de dos parts</strong>: quota fixa + preu per ús (Gym, parc d'atraccions, operadores mòbils).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Estratègies psicològiques" color="rose">
                        <p><strong>a) Preus psicològics</strong> (<em>odd-pricing</em>): 9,99 € en lloc de 10 €. Aprofita biaixos cognitius.</p>
                        <p><strong>b) Preu de prestigi</strong>: preus alts per senyalar qualitat (efecte Veblen). Patek Philippe, Ferrari.</p>
                        <p><strong>c) Preu de referència</strong>: mostrar preu tatxat (abans 100 €, ara 59 €).</p>
                        <p><strong>d) Decoy pricing</strong>: introduir una opció dominada per fer més atractiva una altra (classic Economist subscription trick).</p>
                        <p><strong>e) Anchoring</strong>: posar un preu alt abans per fer semblar baix un altre.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.4. Estratègies promocionals" color="emerald">
                        <p>Descomptes (quantitatius, estacionals, de caixa), <em>loss leaders</em> (productes ganxo a preu molt baix que atreuen trànsit), ofertes 2×1 i 3×2, cupons, preus introductoris, promocions flash (Black Friday, Cyber Monday, Rebajas).</p>
                        <p>Limitacions legals: <strong>venda a pèrdua</strong> prohibida a detallistes en condicions generals (Llei 7/1996), excepte productes peribles, saldos i liquidacions.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Discriminació de preus i tècniques avançades" icon="🔬">
                    <TheoryBlock title="4.1. Discriminació de preus (Pigou, 1920)" color="indigo">
                        <p><strong>Arthur Pigou</strong>, a <em>The Economics of Welfare</em> (1920), va classificar la <strong>discriminació de preus</strong> en 3 graus:</p>
                        <p><strong>• 1r grau (perfecta)</strong>: cobrar a cada client el seu preu màxim (<em>reservation price</em>). Hipotètica, captura tot l'excedent del consumidor.</p>
                        <p><strong>• 2n grau</strong>: preus diferents segons quantitat o versió (<em>versioning</em>, <em>quantity discounts</em>). Spotify Free vs. Premium, aerolínies (classe turista/business).</p>
                        <p><strong>• 3r grau</strong>: preus diferents per a segments identificables amb diferent elasticitat. Descomptes d'estudiant/jubilat, preus internacionals diferents, preus per zona geogràfica.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Condicions per a la discriminació" color="violet">
                        <p>Per a aplicar-la eficaçment cal:</p>
                        <p>(1) <strong>Poder de mercat</strong> (no és possible en competència perfecta).</p>
                        <p>(2) <strong>Segmentació clara</strong> amb elasticitats diferents.</p>
                        <p>(3) <strong>No-arbitratge</strong>: impedir revenda entre segments.</p>
                        <p>Exemples controvertits: <em>dynamic pricing</em> d'Uber, preus d'avió per IP geogràfica, <em>personalitzat pricing</em> amb IA.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Tècniques avançades" color="cyan">
                        <p><strong>• Revenue Management / Yield Management</strong>: optimitzar ingressos amb capacitat fixa i demanda variable. Originat a les aerolínies (American Airlines, 1985). S'aplica a hotels, trens, lloguer de cotxes, esdeveniments.</p>
                        <p><strong>• Subscription economy</strong>: Netflix, Spotify, SaaS (Microsoft 365, Adobe Creative Cloud). El client paga regular, ingressos més estables.</p>
                        <p><strong>• Freemium</strong>: gratuït bàsic + premium de pagament (Spotify, Duolingo).</p>
                        <p><strong>• Pay-what-you-want</strong>: el client decideix (Humble Bundle, alguns museus).</p>
                        <p><strong>• AI pricing</strong>: algoritmes d'aprenentatge automàtic optimitzen preus en temps real segons stock, demanda, perfil client.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Planificació, organització i control de l'estratègia de màrqueting" icon="📊">
                    <TheoryBlock title="5.1. El pla de màrqueting" color="orange">
                        <p>El <strong>pla de màrqueting</strong> és el document que sistematitza l'estratègia i les accions comercials. Estructura habitual:</p>
                        <p>(1) <strong>Resum executiu</strong>.</p>
                        <p>(2) <strong>Anàlisi de situació</strong>: PESTEL, 5 forces de Porter, DAFO.</p>
                        <p>(3) <strong>Objectius</strong>: SMART.</p>
                        <p>(4) <strong>Estratègia</strong>: segmentació, targeting, posicionament (STP).</p>
                        <p>(5) <strong>Màrqueting mix</strong>: 4 P concretes.</p>
                        <p>(6) <strong>Pressupost</strong>: ingressos, costos, compte de resultats previsional.</p>
                        <p>(7) <strong>Calendari</strong> d'accions.</p>
                        <p>(8) <strong>Indicadors de control</strong>: KPIs.</p>
                        <p>(9) <strong>Contingències</strong>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Organització del departament de màrqueting" color="violet">
                        <p>Estructures organitzatives típiques:</p>
                        <p>• <strong>Funcional</strong>: producte, preus, distribució, comunicació, investigació.</p>
                        <p>• <strong>Per productes</strong> (<em>Product Manager</em>): un responsable per línia o marca (P&G històric).</p>
                        <p>• <strong>Per mercats</strong>: un responsable per segment/geografia.</p>
                        <p>• <strong>Matricial</strong>: combinació producte-mercat.</p>
                        <p>Tendència actual: <em>growth teams</em> multidisciplinaris, <em>agile marketing</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Control del màrqueting" color="emerald">
                        <p>El <strong>control</strong> del màrqueting (Kotler-Armstrong) té 4 nivells:</p>
                        <p>(1) <strong>Control del pla anual</strong>: anàlisi de vendes vs. objectius, quota, ratio vendes/despeses.</p>
                        <p>(2) <strong>Control de rendibilitat</strong>: per producte, territori, client, canal.</p>
                        <p>(3) <strong>Control d'eficiència</strong>: productivitat de la força de vendes, de la publicitat, del màrqueting digital.</p>
                        <p>(4) <strong>Control estratègic</strong>: auditoria de màrqueting, revisió del pla estratègic.</p>
                        <p><strong>KPIs</strong> típics: <em>market share</em>, <em>customer acquisition cost</em> (CAC), <em>customer lifetime value</em> (CLV o LTV), <em>churn rate</em>, <em>NPS</em> (Net Promoter Score), <em>ROMI</em> (return on marketing investment).</p>
                    </TheoryBlock>

                    <FormulaBox formula="CLV = Marge/client × Vida útil − CAC   |   ROMI = (B_atribuible − Inv. Mkt) / Inv. Mkt" desc="Indicadors clau d'eficiència del màrqueting" />
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>El preu, única P del mix que genera ingressos, exigeix una gestió subtil que combina factors interns (costos, objectius, cicle del producte), externs (demanda, competència, regulació) i psicològics. Els tres enfocaments fonamentals —<strong>costos, competència i valor</strong>— es complementen; la condició òptima microeconòmica (IMg = CMg, Lerner) marca la referència analítica.</p>
                        <p>Les estratègies de preu (descremat, penetració, captius, psicològics, <em>odd-pricing</em>), la discriminació de preus en els seus 3 graus (<strong>Pigou, 1920</strong>) i les tècniques contemporànies (<em>revenue management</em>, <em>subscription</em>, <em>freemium</em>, <em>AI pricing</em>) ofereixen un arsenal ric de recursos. Tot plegat s'integra en el <strong>pla de màrqueting</strong>, que especifica objectius, estratègia STP, mix de 4 P, pressupost i control mitjançant KPIs (CAC, CLV, NPS, ROMI).</p>
                        <p>Aquest tema tanca el Bloc E i constitueix la frontera amb el Bloc F (Inversió i Finançament). L'alumnat ha d'assimilar que la gestió empresarial és un sistema integrat on cada decisió (producte, preu, distribució, comunicació) condiciona les altres i totes alhora configuren la proposta de valor que l'empresa ofereix al client i a la societat.</p>
                    </div>
                </Card>

                <BibliografiaBox items={[
                    'PIGOU, A.C. (1920): The Economics of Welfare, Macmillan.',

            </div>
