    const Storage = {
        get: (key, defaultValue) => {
            try {
                const v = localStorage.getItem(key);
                return v ? JSON.parse(v) : defaultValue;
            } catch (e) { return defaultValue; }
        },
        set: (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
        },
    };

    // SM-2 Algorithm (spaced repetition)
    function sm2Review(card, quality) {
        // quality: 0-5 (0=total fail, 5=perfect). We use 0 (again), 3 (hard), 4 (good), 5 (easy)
        let { repetitions = 0, easeFactor = 2.5, interval = 0 } = card;
        if (quality < 3) {
            repetitions = 0;
            interval = 1;
        } else {
            if (repetitions === 0) interval = 1;
            else if (repetitions === 1) interval = 6;
            else interval = Math.round(interval * easeFactor);
            repetitions += 1;
            easeFactor = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
            if (easeFactor < 1.3) easeFactor = 1.3;
        }
        const nextReview = new Date();
        nextReview.setDate(nextReview.getDate() + interval);
        return { ...card, repetitions, easeFactor, interval, nextReview: nextReview.toISOString(), lastQuality: quality, lastReview: new Date().toISOString() };
    }

                                <p className="font-bold text-indigo-800 text-sm">{lang === 'es' ? 'Simulacro' : 'Simulacre'}</p>
                                <p className="text-xs text-indigo-600">{lang === 'es' ? 'Tema aleatorio' : 'Tema aleatori'}</p>
                            </button>
                            <button onClick={() => { setSection('planner'); pdeSetHashSection('planner'); }} className="p-4 rounded-xl bg-pink-50 hover:bg-pink-100 border border-pink-200 transition-colors text-left">
                                <div className="text-2xl mb-1">📅</div>
                                <p className="font-bold text-pink-800 text-sm">{lang === 'es' ? 'Planificador' : 'Planificador'}</p>
                                <p className="text-xs text-pink-600">{lang === 'es' ? 'Organiza tu estudio' : 'Organitza el teu estudi'}</p>

        // ════════════════════════════════════════════════════════════
        // PLANNER
        // ════════════════════════════════════════════════════════════
        const Planner = () => {
            const [examDate, setExamDate] = useState(plan.examDate);

                setPlan({ examDate, minutesPerDay: minutes });

                <div className="space-y-6 animate-fade max-w-3xl">
                    <div>

                        <p className="text-slate-500">{lang === 'es' ? 'Organiza tu estudio amb objetius realistes.' : 'Organitza el teu estudi amb objectius realistes.'}</p>
                    </div>

                    <Card>
                        <div className="space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2">{lang === 'es' ? 'Fecha del examen' : 'Data de l\'examen'}</label>
                                <input type="date" value={examDate} onChange={e => setExamDate(e.target.value)} className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:border-violet-400 focus:outline-none" />

                                <label className="block text-sm font-bold text-slate-700 mb-2">{lang === 'es' ? 'Minutos de estudio al día' : 'Minuts d\'estudi al dia'}</label>

                            </div>
                            <button onClick={saveP} className="w-full py-3 px-5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold">{lang === 'es' ? 'Guardar plan' : 'Guardar pla'}</button>
                        </div>
                    </Card>

                    {/* Sugerencia de distribución */}
                    {examDate && (
                        <Card>
                            <h3 className="font-bold text-slate-800 mb-3">💡 {lang === 'es' ? 'Sugerencia de distribución' : 'Suggeriment de distribució'}</h3>
                            {(() => {
                                const days = Math.ceil((new Date(examDate) - new Date()) / (1000*60*60*24));
                                if (days <= 0) return <p className="text-red-600">{lang === 'es' ? 'La fecha del examen ya ha pasado.' : 'La data ja ha passat.'}</p>;
                                const totalHours = days * minutes / 60;
                                const hoursPerTema = Math.round(totalHours / 71 * 10) / 10;
                                return (
                                    <div className="space-y-2 text-sm">
                                        <p>⏱️ <strong>{days}</strong> {lang === 'es' ? 'días restantes' : 'dies restants'}</p>

                                        <p>📚 <strong>~{hoursPerTema}h</strong> {lang === 'es' ? 'por tema (71 temas)' : 'per tema (71 temes)'}</p>
                                        <div className="mt-3 p-4 bg-violet-50 rounded-lg border border-violet-200">
                                            <p className="font-bold text-violet-800 mb-1">{lang === 'es' ? 'Recomendación' : 'Recomanació'}:</p>
                                            <p className="text-violet-700 text-xs">{hoursPerTema < 2 ? (lang === 'es' ? 'Poco tiempo. Prioritza temas A-B-C que son fundamentales.' : 'Poc temps. Prioritza temes A-B-C fonamentals.') : hoursPerTema > 6 ? (lang === 'es' ? 'Tiempo amplio. Puedes aprofundir i fer molts simulacres.' : 'Temps ampli. Pots aprofundir i fer molts simulacres.') : (lang === 'es' ? 'Tiempo razonable. Alterna temari + flashcards + simulacros.' : 'Temps raonable. Alterna temari + flashcards + simulacres.')}</p>
                                        </div>
                                    </div>
                                );
                            })()}
                        </Card>
                    )}
                </div>
            );
        };

        // ════════════════════════════════════════════════════════════
        // FLASHCARDS
        // ════════════════════════════════════════════════════════════
        const FlashcardsView = () => {
            const [filter, setFilter] = useState('due');
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);

            const now = new Date();
            const pool = useMemo(() => {
                if (filter === 'due') return FLASHCARDS.filter(fc => {
                    const st = flashState[fc.id];
                    if (!st) return true;
                    return new Date(st.nextReview) <= now;
                });
                if (filter === 'all') return FLASHCARDS;
                return FLASHCARDS.filter(fc => fc.bloc === filter);
            }, [filter, flashState]);

            const current = pool[idx];

            const answer = (quality) => {
                if (!current) return;
                const prev = flashState[current.id] || {};
                const updated = sm2Review(prev, quality);
                setFlashState({ ...flashState, [current.id]: updated });
                setFlipped(false);
                setIdx(i => i + 1 >= pool.length ? 0 : i + 1);
            };

            if (!current) {
                return (
                    <div className="max-w-2xl mx-auto animate-fade">
                        <h2 className="text-3xl font-black text-slate-800 mb-4">🃏 Flashcards</h2>
                        <Card><div className="text-center py-12"><p className="text-4xl mb-4">🎉</p><p className="text-lg font-bold text-slate-700">{lang === 'es' ? '¡Todo repasado!' : 'Tot repassat!'}</p><p className="text-slate-500 text-sm mt-2">{lang === 'es' ? 'No hay cards pendientes. Vuelve más tarde.' : 'No hi ha cards pendents. Torna més tard.'}</p></div></Card>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto animate-fade space-y-4">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <h2 className="text-3xl font-black text-slate-800">🃏 Flashcards</h2>
                        <select value={filter} onChange={e => { setFilter(e.target.value); setIdx(0); }} className="px-4 py-2 rounded-xl border border-slate-200 text-sm font-semibold">
                            <option value="due">{lang === 'es' ? 'Por repasar' : 'Per repassar'}</option>
                            <option value="all">{lang === 'es' ? 'Todas' : 'Totes'}</option>
                            {BLOCS.map(b => <option key={b.id} value={b.id}>Bloc {b.id}</option>)}
                        </select>
                    </div>

                    <p className="text-center text-sm text-slate-500">Card {idx + 1} / {pool.length} · Bloc {current.bloc} · Tema {current.tema}</p>

                    <div className="relative h-72 cursor-pointer" onClick={() => setFlipped(!flipped)}>
                        <div className={`card-flip ${flipped ? 'flipped' : ''} h-full relative`}>
                            {/* Front */}
                            <div className="card-face w-full h-full bg-gradient-to-br from-violet-500 to-purple-600 rounded-2xl shadow-xl p-8 flex items-center justify-center text-center">
                                <div>
                                    <p className="text-white/70 text-xs uppercase mb-3 font-semibold">{lang === 'es' ? 'Pregunta' : 'Pregunta'}</p>
                                    <p className="text-white text-xl font-bold leading-snug">{current.front}</p>
                                    <p className="text-white/50 text-xs mt-6">{lang === 'es' ? 'Click per veure resposta' : 'Clica per veure resposta'}</p>
                                </div>
                            </div>
                            {/* Back */}
                            <div className="card-face card-back w-full h-full bg-white border-2 border-violet-200 rounded-2xl shadow-xl p-8 flex items-center justify-center text-center">
                                <div>
                                    <p className="text-violet-600 text-xs uppercase mb-3 font-semibold">{lang === 'es' ? 'Respuesta' : 'Resposta'}</p>
                                    <p className="text-slate-800 text-base leading-relaxed" dangerouslySetInnerHTML={{__html: current.back}}></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {flipped && (
                        <div className="grid grid-cols-4 gap-2 animate-fade">
                            <button onClick={() => answer(0)} className="py-3 px-2 rounded-xl bg-red-100 hover:bg-red-200 text-red-700 font-bold text-sm">❌ {lang === 'es' ? 'Fallo' : 'Fall'}</button>
                            <button onClick={() => answer(3)} className="py-3 px-2 rounded-xl bg-orange-100 hover:bg-orange-200 text-orange-700 font-bold text-sm">🤔 {lang === 'es' ? 'Difícil' : 'Difícil'}</button>
                            <button onClick={() => answer(4)} className="py-3 px-2 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold text-sm">✓ {lang === 'es' ? 'Bien' : 'Bé'}</button>
                            <button onClick={() => answer(5)} className="py-3 px-2 rounded-xl bg-green-100 hover:bg-green-200 text-green-700 font-bold text-sm">🎯 {lang === 'es' ? 'Fàcil' : 'Fàcil'}</button>
                        </div>
                    )}
                    {!flipped && (
                        <button onClick={() => setFlipped(true)} className="w-full py-3 px-5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold">{lang === 'es' ? 'Mostrar respuesta' : 'Mostrar resposta'}</button>
                    )}
                </div>
            );
        };

        // ════════════════════════════════════════════════════════════
        // QUIZ
        // ════════════════════════════════════════════════════════════
        const QuizView = () => {
            const [started, setStarted] = useState(false);
            const [numQs, setNumQs] = useState(10);
            const [idx, setIdx] = useState(0);
            const [answers, setAnswers] = useState([]);
            const [selected, setSelected] = useState(null);
            const [showFeedback, setShowFeedback] = useState(false);
            const [questions, setQuestions] = useState([]);
            const [finished, setFinished] = useState(false);

            const start = () => {
                const shuffled = [...QUIZ].sort(() => Math.random() - 0.5).slice(0, numQs);
                setQuestions(shuffled);
                setIdx(0);
                setAnswers([]);
                setStarted(true);
                setFinished(false);
                setSelected(null);
                setShowFeedback(false);
            };

            const submitAnswer = () => {
                if (selected === null) return;
                const q = questions[idx];
                const isCorrect = selected === q.correct;
                setAnswers([...answers, { qid: q.id, correct: isCorrect, chosen: selected }]);
                setShowFeedback(true);
                setTimeout(() => {
                    setShowFeedback(false);
                    setSelected(null);
                    if (idx + 1 >= questions.length) {
                        const score = Math.round([...answers, { qid: q.id, correct: isCorrect }].filter(a => a.correct).length / questions.length * 100);
                        setQuizHistory([...quizHistory, { date: new Date().toISOString(), score, total: questions.length }]);
                        setFinished(true);
                    } else {
                        setIdx(i => i + 1);
                    }
                }, 1500);
            };

            if (!started) {
                return (
                    <div className="max-w-2xl mx-auto animate-fade space-y-4">
                        <h2 className="text-3xl font-black text-slate-800">🎯 Quiz</h2>
                        <Card>
                            <p className="text-sm text-slate-700 mb-4">{lang === 'es' ? 'Prueba tus conocimientos con preguntes tipus test.' : 'Posa a prova els teus coneixements amb preguntes tipus test.'}</p>
                            <div className="mb-4">
                                <label className="block text-sm font-bold text-slate-700 mb-2">{lang === 'es' ? 'Número de preguntas' : 'Nombre de preguntes'}</label>
                                <div className="flex gap-2">
                                    {[5, 10, 20, 30].map(n => (
                                        <button key={n} onClick={() => setNumQs(n)} className={`flex-1 py-2 rounded-xl font-bold text-sm ${numQs === n ? 'bg-violet-600 text-white' : 'bg-slate-100 text-slate-700'}`}>{n}</button>
                                    ))}
                                </div>
                            </div>
                            <button onClick={start} className="w-full py-3 px-5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold">🚀 {lang === 'es' ? 'Empezar' : 'Començar'}</button>
                        </Card>

                        {quizHistory.length > 0 && (
                            <Card>
                                <h3 className="font-bold text-slate-800 mb-3">📊 {lang === 'es' ? 'Últimos quizzes' : 'Últims quizzes'}</h3>
                                <div className="space-y-2 text-sm">
                                    {quizHistory.slice(-5).reverse().map((h, i) => (
                                        <div key={i} className="flex items-center justify-between p-2 rounded-lg bg-slate-50">
                                            <span className="text-slate-600 text-xs">{new Date(h.date).toLocaleDateString()}</span>
                                            <span className={`font-bold ${h.score >= 70 ? 'text-green-600' : h.score >= 50 ? 'text-orange-600' : 'text-red-600'}`}>{h.score}%</span>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        )}
                    </div>
                );
            }

            if (finished) {
                const correctCount = answers.filter(a => a.correct).length;
                const score = Math.round(correctCount / questions.length * 100);
                return (
                    <div className="max-w-2xl mx-auto animate-fade">
                        <Card>
                            <div className="text-center py-6">
                                <p className="text-6xl mb-4">{score >= 80 ? '🏆' : score >= 60 ? '😊' : '💪'}</p>
                                <h3 className="text-3xl font-black text-slate-800 mb-2">{score}%</h3>
                                <p className="text-slate-600 mb-4">{correctCount} / {questions.length} {lang === 'es' ? 'correctes' : 'correctes'}</p>
                                <button onClick={() => { setStarted(false); setFinished(false); }} className="py-3 px-6 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold">{lang === 'es' ? '↻ Nou quiz' : '↻ Nou quiz'}</button>
                            </div>
                        </Card>
                    </div>
                );
            }

            const q = questions[idx];
            return (
                <div className="max-w-2xl mx-auto animate-fade space-y-4">
                    <div className="flex items-center justify-between">
                        <h2 className="text-xl font-bold text-slate-800">🎯 Quiz</h2>
                        <span className="text-sm text-slate-500">{idx + 1} / {questions.length}</span>
                    </div>
                    <div className="w-full bg-slate-100 rounded-full h-2">
                        <div className="bg-violet-500 h-2 rounded-full transition-all" style={{width: `${(idx + 1) / questions.length * 100}%`}}></div>
                    </div>

                    <Card>
                        <p className="text-xs text-slate-500 mb-2">Bloc {q.bloc} · Tema {q.tema}</p>
                        <p className="text-lg font-bold text-slate-800 mb-5">{q.q}</p>
                        <div className="space-y-2">
                            {q.opts.map((opt, i) => (
                                <button
                                    key={i}
                                    onClick={() => !showFeedback && setSelected(i)}
                                    disabled={showFeedback}
                                    className={`w-full text-left p-3 rounded-xl border-2 transition-all ${
                                        showFeedback
                                            ? i === q.correct ? 'bg-green-50 border-green-400 text-green-800' : i === selected ? 'bg-red-50 border-red-400 text-red-800' : 'bg-slate-50 border-slate-200 text-slate-600'
                                            : selected === i ? 'bg-violet-50 border-violet-400 text-violet-800' : 'bg-white border-slate-200 hover:border-violet-300'
                                    }`}
                                >
                                    <span className="font-semibold">{String.fromCharCode(65 + i)}.</span> <span dangerouslySetInnerHTML={{__html: opt}}></span>
                                    {showFeedback && i === q.correct && <span className="ml-2">✓</span>}
                                    {showFeedback && i === selected && i !== q.correct && <span className="ml-2">✗</span>}
                                </button>
                            ))}
                        </div>
                        {!showFeedback && (
                            <button onClick={submitAnswer} disabled={selected === null} className={`w-full mt-4 py-3 px-5 rounded-xl font-bold ${selected === null ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-violet-600 hover:bg-violet-700 text-white'}`}>{lang === 'es' ? 'Respondre' : 'Respondre'}</button>
                        )}
                    </Card>
                </div>
            );
        };

        // ════════════════════════════════════════════════════════════
        // SIMULACRE
        // ════════════════════════════════════════════════════════════
        const Simulacre = () => {
            const [phase, setPhase] = useState('setup'); // setup | running | done
            const [blocFilter, setBlocFilter] = useState('all');
            const [duration, setDuration] = useState(90); // min
            const [currentTema, setCurrentTema] = useState(null);
            const [timeLeft, setTimeLeft] = useState(0);
            const [rating, setRating] = useState(null);
            const [notes, setNotes] = useState('');
            const intervalRef = useRef(null);

            useEffect(() => {
                if (phase === 'running') {
                    intervalRef.current = setInterval(() => {
                        setTimeLeft(t => {
                            if (t <= 1) {
                                clearInterval(intervalRef.current);
                                setPhase('selfassess');
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(intervalRef.current);
            }, [phase]);

            const start = () => {
                const pool = blocFilter === 'all' ? TEMARI : TEMARI.filter(t => t.bloc === blocFilter);
                const random = pool[Math.floor(Math.random() * pool.length)];
                setCurrentTema(random);
                setTimeLeft(duration * 60);
                setPhase('running');
            };

            const saveSim = () => {
                setSimHistory([...simHistory, {
                    date: new Date().toISOString(),
                    tema: currentTema.num,
                    blocId: currentTema.bloc,
                    duration,
                    rating,
                    notes,
                }]);
                if (rating >= 3) {
                    setProgress({ ...progress, [currentTema.num]: { status: rating >= 4 ? 'mastered' : 'done', date: new Date().toISOString() } });
                }
                setPhase('setup');
                setCurrentTema(null);
                setRating(null);
                setNotes('');
            };

            const formatTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

            if (phase === 'setup') {
                return (
                    <div className="max-w-2xl mx-auto animate-fade space-y-4">
                        <h2 className="text-3xl font-black text-slate-800">⏱️ {lang === 'es' ? 'Simulacro' : 'Simulacre'}</h2>
                        <Card>
                            <p className="text-sm text-slate-700 mb-4">{lang === 'es' ? 'Simulació d\'examen: tema aleatori + cronòmetre. Després autoavalua\'t.' : 'Simulació d\'examen: tema aleatori + cronòmetre. Després autoavalua\'t.'}</p>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">Bloc</label>
                                    <select value={blocFilter} onChange={e => setBlocFilter(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200">
                                        <option value="all">{lang === 'es' ? 'Cualquier bloque' : 'Qualsevol bloc'}</option>
                                        {BLOCS.map(b => <option key={b.id} value={b.id}>Bloc {b.id} · {b.title}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">{lang === 'es' ? 'Durada' : 'Durada'}</label>
                                    <div className="flex gap-2">
                                        {[30, 60, 90, 120].map(d => (
                                            <button key={d} onClick={() => setDuration(d)} className={`flex-1 py-2 rounded-xl font-bold text-sm ${duration === d ? 'bg-violet-600 text-white' : 'bg-slate-100 text-slate-700'}`}>{d} min</button>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={start} className="w-full py-3 px-5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold">🎲 {lang === 'es' ? 'Començar' : 'Començar'}</button>
                            </div>
                        </Card>

                        {simHistory.length > 0 && (
                            <Card>
                                <h3 className="font-bold text-slate-800 mb-3">📋 {lang === 'es' ? 'Simulacres previs' : 'Simulacres previs'}</h3>
                                <div className="space-y-2 text-sm">
                                    {simHistory.slice(-5).reverse().map((s, i) => (
                                        <div key={i} className="flex items-center justify-between p-2 rounded-lg bg-slate-50">
                                            <span className="text-slate-600">T{s.tema} · Bloc {s.blocId}</span>
                                            <span className="text-slate-500 text-xs">{new Date(s.date).toLocaleDateString()}</span>
                                            <span className="font-bold text-violet-600">{'⭐'.repeat(s.rating || 0)}</span>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        )}
                    </div>
                );
            }

            if (phase === 'running') {
                return (
                    <div className="max-w-2xl mx-auto animate-fade space-y-4">
                        <Card>
                            <p className="text-xs text-slate-500 uppercase mb-1">{lang === 'es' ? 'Tema asignado' : 'Tema assignat'}</p>
                            <h2 className="text-2xl font-black text-slate-800 mb-4">Tema {currentTema.num}: {currentTema.title}</h2>
                            <div className="bg-violet-50 p-5 rounded-xl border border-violet-200 mb-4">
                                <p className="text-xs font-semibold text-violet-700 mb-1">Bloc {currentTema.bloc}</p>
                                <p className="text-xs text-violet-600">Paraules clau: {currentTema.keywords.join(', ')}</p>
                            </div>
                            <div className="text-center my-6">
                                <p className="text-xs text-slate-500 uppercase mb-1">{lang === 'es' ? 'Temps restant' : 'Temps restant'}</p>
                                <p className={`text-7xl font-black ${timeLeft < 600 ? 'text-red-600' : 'text-violet-600'}`}>{formatTime(timeLeft)}</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setPhase('selfassess')} className="flex-1 py-3 px-5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold">{lang === 'es' ? 'Acabar' : 'Acabar'}</button>
                                <button onClick={() => { clearInterval(intervalRef.current); setPhase('setup'); setCurrentTema(null); }} className="px-5 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">{lang === 'es' ? 'Cancelar' : 'Cancel·lar'}</button>
                            </div>
                        </Card>
                    </div>
                );
            }

            // Selfassess
            return (
                <div className="max-w-2xl mx-auto animate-fade space-y-4">
                    <Card>
                        <h3 className="text-xl font-bold text-slate-800 mb-4">📊 {lang === 'es' ? 'Autoevaluació' : 'Autoavaluació'}</h3>
                        <p className="text-sm text-slate-600 mb-4">{lang === 'es' ? 'Tema' : 'Tema'}: <strong>{currentTema.num} · {currentTema.title}</strong></p>
                        <div className="mb-4">
                            <p className="text-sm font-bold text-slate-700 mb-2">{lang === 'es' ? '¿Cómo ha ido?' : 'Com ha anat?'}</p>
                            <div className="flex gap-2">
                                {[1, 2, 3, 4, 5].map(r => (
                                    <button key={r} onClick={() => setRating(r)} className={`flex-1 py-3 rounded-xl font-bold ${rating === r ? 'bg-violet-600 text-white' : 'bg-slate-100 text-slate-700'}`}>{r} ⭐</button>
                                ))}
                            </div>
                            <p className="text-xs text-slate-500 mt-2">{lang === 'es' ? '1=Molt malament · 3=OK · 5=Excel·lent' : '1=Molt malament · 3=OK · 5=Excel·lent'}</p>
                        </div>
                        <div className="mb-4">
                            <label className="block text-sm font-bold text-slate-700 mb-2">{lang === 'es' ? 'Notes' : 'Notes'}</label>
                            <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder={lang === 'es' ? 'Què has fet bé, què has de millorar...' : 'Què has fet bé, què has de millorar...'} className="w-full p-3 border border-slate-200 rounded-xl text-sm" rows={4} />
                        </div>
                        <button onClick={saveSim} disabled={rating === null} className={`w-full py-3 px-5 rounded-xl font-bold ${rating === null ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-violet-600 hover:bg-violet-700 text-white'}`}>{lang === 'es' ? 'Guardar' : 'Guardar'}</button>
                    </Card>
                </div>
            );
        };

        // ════════════════════════════════════════════════════════════
        // PROGRES (temari per bloc amb status)
        // ════════════════════════════════════════════════════════════
        const ProgresView = () => {
            const updateStatus = (num, status) => {
                setProgress({ ...progress, [num]: { status, date: new Date().toISOString() } });
            };

            return (
                <div className="space-y-4 animate-fade">
                    <h2 className="text-3xl font-black text-slate-800">📈 {lang === 'es' ? 'Progreso' : 'Progrés'}</h2>
                    <p className="text-sm text-slate-600">{lang === 'es' ? 'Marca cada tema según tu dominio.' : 'Marca cada tema segons el teu domini.'}</p>

                    {BLOCS.map(bloc => {
                        const temesBloc = TEMARI.filter(t => t.bloc === bloc.id);
                        return (
                            <Card key={bloc.id}>
                                <h3 className="font-bold text-slate-800 mb-3 flex items-center gap-2"><span>{bloc.emoji}</span> Bloc {bloc.id} · {bloc.title} <a href={`./${bloc.href}`} className="text-xs font-normal text-violet-600 hover:underline">↗ {lang === 'es' ? 'Ver temas' : 'Veure temes'}</a></h3>
                                <div className="space-y-2">
                                    {temesBloc.map(tema => {
                                        const st = progress[tema.num]?.status || 'pending';
                                        return (
                                            <div key={tema.num} className="flex items-center gap-2 p-2 rounded-lg bg-slate-50 hover:bg-slate-100 transition-colors">
                                                <span className="font-bold text-xs w-8 text-slate-700">T{tema.num}</span>
                                                <span className="flex-1 text-xs text-slate-700 truncate">{tema.title}</span>
                                                <div className="flex gap-1">
                                                    <button onClick={() => updateStatus(tema.num, 'pending')} title="Pendent" className={`w-8 h-8 rounded-lg text-sm font-bold ${st === 'pending' ? 'bg-slate-400 text-white' : 'bg-slate-200 text-slate-600'}`}>·</button>
                                                    <button onClick={() => updateStatus(tema.num, 'studying')} title="Estudiant" className={`w-8 h-8 rounded-lg text-sm font-bold ${st === 'studying' ? 'bg-orange-500 text-white' : 'bg-orange-100 text-orange-600'}`}>📖</button>
                                                    <button onClick={() => updateStatus(tema.num, 'done')} title="Estudiat" className={`w-8 h-8 rounded-lg text-sm font-bold ${st === 'done' ? 'bg-violet-500 text-white' : 'bg-violet-100 text-violet-600'}`}>✓</button>
                                                    <button onClick={() => updateStatus(tema.num, 'mastered')} title="Dominat" className={`w-8 h-8 rounded-lg text-sm font-bold ${st === 'mastered' ? 'bg-green-500 text-white' : 'bg-green-100 text-green-600'}`}>⭐</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </Card>
                        );
                    })}
                </div>
            );
        };

        // ════════════════════════════════════════════════════════════
        // NAV / RENDER
        // ════════════════════════════════════════════════════════════
        const headerSections = [
            { id: 'dashboard', label: t('sec.dashboard'), emoji: '🏠' },
            { id: 'planner', label: t('sec.planner'), emoji: '📅' },
            { id: 'flashcards', label: t('sec.flashcards'), emoji: '🃏' },
            { id: 'quiz', label: t('sec.quiz'), emoji: '🎯' },
            { id: 'simulacre', label: t('sec.simulacre'), emoji: '⏱️' },
            { id: 'progres', label: t('sec.progres'), emoji: '📈' },
        ];

        return (
            <div className="min-h-screen">
                <PdeHeader idioma={idioma} setIdioma={setIdioma} currentApp="oposicions-estudiar" sections={headerSections} currentSection={section} setSection={setSection} />
                <main className="max-w-6xl mx-auto px-4 py-8">
                    <a href="./oposicions" className="inline-flex items-center gap-2 text-sm text-violet-600 hover:text-violet-800 mb-4 transition-colors">{t('inicio.backOpo')}</a>
                    {section === 'dashboard' && <Dashboard />}
                    {section === 'planner' && <Planner />}
                    {section === 'flashcards' && <FlashcardsView />}
                    {section === 'quiz' && <QuizView />}
                    {section === 'simulacre' && <Simulacre />}
                    {section === 'progres' && <ProgresView />}
                </main>
                <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
                <PdeFooter appEmoji="🎓" appName={t('footer.appname')} idioma={idioma} />
                <PdeScrollToTop />
            </div>
        );
    }

    ReactDOM.render(<EstudiarApp />, document.getElementById('root'));
    </script>
</body>
</html>
