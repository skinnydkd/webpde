    // ─── Temes component ───────────────────────────────────────────
    function Temes() {
        const [activeBloc, setActiveBloc] = useState('all');

        const filteredTemes = activeBloc === 'all'
            ? temes
            : temes.filter(function(tema) { return tema.bloc === activeBloc; });

        const getBlocData = function(blocId) {
            return blocs.find(function(b) { return b.id === blocId; });
        };

        return (
            <div className="animate-fade">
                {/* Bloc filter buttons */}
                <div className="flex flex-wrap gap-2 mb-6">
                    <button
                        onClick={function() { setActiveBloc('all'); }}
                        className={'px-4 py-2 rounded-xl text-sm font-semibold transition-all ' +
                            (activeBloc === 'all'
                                ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/30'
                                : 'bg-white text-gray-600 border border-gray-200 hover:border-purple-300 hover:text-purple-600'
                            )}
                    >
                        {t('filter.all')} (71)
                    </button>
                    {blocs.map(function(bloc) {
                        var count = temes.filter(function(tema) { return tema.bloc === bloc.id; }).length;
                        return (
                            <button
                                key={bloc.id}
                                onClick={function() { setActiveBloc(bloc.id); }}
                                className={'px-4 py-2 rounded-xl text-sm font-semibold transition-all ' +
                                    (activeBloc === bloc.id
                                        ? 'bg-gradient-to-r ' + bloc.color + ' text-white shadow-lg'
                                        : 'bg-white text-gray-600 border border-gray-200 hover:border-purple-300 hover:text-purple-600'
                                    )}
                            >
                                {t('filter.bloc')} {bloc.label} ({count})
                            </button>
                        );
                    })}
                </div>

                {/* Bloc title when filtered */}
                {activeBloc !== 'all' && (
                    <div className="mb-4">
                        <h3 className="text-lg font-bold text-gray-800">
                            {t('filter.bloc')} {getBlocData(activeBloc).label}: {getBlocData(activeBloc).name}
                        </h3>
                    </div>
                )}

                {/* Theme cards grid */}
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {filteredTemes.map(function(tema) {
                        var blocData = getBlocData(tema.bloc);
                        return (
                            <div key={tema.num} className="bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md transition-all">
                                <div className="flex items-start gap-3">
                                    <span className={'text-xs font-black text-white px-2 py-1 rounded-lg bg-gradient-to-r flex-shrink-0 ' + blocData.color}>
                                        {tema.num}
                                    </span>
                                    <div>
                                        <p className="text-sm font-medium text-gray-800">{tema.title[idioma] || tema.title.val}</p>
                                        <span className="text-xs text-gray-400">{t('filter.bloc')} {blocData.label}: {blocData.name}</span>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>
        );

                                            </span>
                                        </div>
                                    </div>
                                </div>

    // ─── Tab buttons ───────────────────────────────────────────────
    const tabs = [
