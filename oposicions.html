                es: "Gestión del Ministerio de Educación (MEFP). Normativa estatal directa. Muy pocas plazas. Consultar BOE.",
                en: "Ministry of Education (MEFP) managed. Direct state regulations. Very few positions. Check BOE."
            }
        }
    };

    // ─── Temes component ───────────────────────────────────────────
    function Temes() {
        const [activeBloc, setActiveBloc] = useState('all');
        const [boles, setBoles] = useState(2);
        const [estudiats, setEstudiats] = useState(25);

        const comb = function(n, k) {
            if (k > n || k < 0) return 0;
            if (k === 0 || k === n) return 1;
            var result = 1;
            for (var i = 0; i < k; i++) {
                result = result * (n - i) / (i + 1);
            }
            return Math.round(result);
        };

        const prob = Math.round((1 - comb(71 - estudiats, boles) / comb(71, boles)) * 10000) / 100;

        const getInterpretation = function() {
            if (prob > 90) return { text: t('calc.excellent'), color: 'text-green-600', bg: 'bg-green-50' };
            if (prob > 70) return { text: t('calc.good'), color: 'text-amber-600', bg: 'bg-amber-50' };
            if (prob > 50) return { text: t('calc.moderate'), color: 'text-orange-600', bg: 'bg-orange-50' };
            return { text: t('calc.low'), color: 'text-red-600', bg: 'bg-red-50' };
        };
        const interp = getInterpretation();

        const filteredTemes = activeBloc === 'all'
            ? temes
            : temes.filter(function(tema) { return tema.bloc === activeBloc; });

        const getBlocData = function(blocId) {
            return blocs.find(function(b) { return b.id === blocId; });
        };

        return (
            <div className="animate-fade">
                {/* Probability calculator */}
                <div className="bg-white rounded-2xl border border-gray-200 p-6 mb-8 shadow-sm">
                    <div className="flex items-center gap-3 mb-2">
                        <span className="text-2xl">{'\u{1F3B2}'}</span>
                        <h3 className="text-lg font-bold text-gray-800">{t('calc.title')}</h3>
                    </div>
                    <p className="text-sm text-slate-600 mb-5">{t('calc.desc')}</p>

                    <div className="grid md:grid-cols-2 gap-6">
                        {/* Sliders */}
                        <div className="space-y-5">
                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <label className="text-sm font-semibold text-gray-700">{t('calc.balls')}</label>
                                    <span className="text-sm font-bold text-purple-600 bg-purple-50 px-2.5 py-0.5 rounded-lg">{boles}</span>
                                </div>
                                <input
                                    type="range" min="1" max="5" value={boles}
                                    onChange={function(e) { setBoles(parseInt(e.target.value)); }}
                                    className="w-full h-2 bg-purple-200 rounded-lg appearance-none cursor-pointer accent-purple-600"
                                />
                                <div className="flex justify-between text-xs text-gray-400 mt-1">
                                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                                </div>
                            </div>
                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <label className="text-sm font-semibold text-gray-700">{t('calc.studied')}</label>
                                    <span className="text-sm font-bold text-purple-600 bg-purple-50 px-2.5 py-0.5 rounded-lg">{estudiats} / 71</span>
                                </div>
                                <input
                                    type="range" min="1" max="71" value={estudiats}
                                    onChange={function(e) { setEstudiats(parseInt(e.target.value)); }}
                                    className="w-full h-2 bg-purple-200 rounded-lg appearance-none cursor-pointer accent-purple-600"
                                />
                                <div className="flex justify-between text-xs text-gray-400 mt-1">
                                    <span>1</span><span>18</span><span>36</span><span>53</span><span>71</span>
                                </div>
                            </div>
                        </div>

                        {/* Results */}
                        <div className="space-y-3">
                            <div className={'rounded-xl p-4 border ' + (prob > 80 ? 'bg-green-50 border-green-200' : prob > 50 ? 'bg-amber-50 border-amber-200' : 'bg-red-50 border-red-200')}>
                                <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">{t('calc.probability')}</p>
                                <p className={'text-3xl font-black ' + (prob > 80 ? 'text-green-600' : prob > 50 ? 'text-amber-600' : 'text-red-600')}>{prob}%</p>
                            </div>
                            <div className="rounded-xl p-4 border bg-gray-50 border-gray-200">
                                <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">{t('calc.complement')}</p>
                                <p className="text-2xl font-black text-gray-400">{Math.round((100 - prob) * 100) / 100}%</p>
                                <p className="text-xs text-gray-400 mt-1">{t('calc.noLuck')}</p>
                            </div>
                        </div>
                    </div>

                    {/* Interpretation */}
                    <div className={'mt-4 rounded-xl p-3 ' + interp.bg}>
                        <p className={'text-sm font-medium ' + interp.color}>{interp.text}</p>
                    </div>
                </div>

                {/* Bloc filter buttons */}
                <div className="flex flex-wrap gap-2 mb-6">
                    <button
                        onClick={function() { setActiveBloc('all'); }}
                        className={'px-4 py-2 rounded-xl text-sm font-semibold transition-all ' +
                            (activeBloc === 'all'
                                ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/30'
                                : 'bg-white text-gray-600 border border-gray-200 hover:border-purple-300 hover:text-purple-600'
                            )}
                    >
                        {t('filter.all')} (71)
                    </button>
                    {blocs.map(function(bloc) {
                        var count = temes.filter(function(tema) { return tema.bloc === bloc.id; }).length;
                        return (
                            <button
                                key={bloc.id}
                                onClick={function() { setActiveBloc(bloc.id); }}
                                className={'px-4 py-2 rounded-xl text-sm font-semibold transition-all ' +
                                    (activeBloc === bloc.id
                                        ? 'bg-gradient-to-r ' + bloc.color + ' text-white shadow-lg'
                                        : 'bg-white text-gray-600 border border-gray-200 hover:border-purple-300 hover:text-purple-600'
                                    )}
                            >
                                {t('filter.bloc')} {bloc.label} ({count})
                            </button>
                        );
                    })}
                </div>

                {/* Bloc title when filtered */}
                {activeBloc !== 'all' && (
                    <div className="mb-4">
                        <h3 className="text-lg font-bold text-gray-800">
                            {t('filter.bloc')} {getBlocData(activeBloc).label}: {getBlocData(activeBloc).name}
                        </h3>
                    </div>
                )}

                {/* Theme cards grid */}
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {filteredTemes.map(function(tema) {
                        var blocData = getBlocData(tema.bloc);
                        return (
                            <a key={tema.num} href={'./oposicions-bloc-' + tema.bloc + '#tema' + tema.num} className="bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md hover:border-purple-200 transition-all block">
                                <div className="flex items-start gap-3">
                                    <span className={'text-xs font-black text-white px-2 py-1 rounded-lg bg-gradient-to-r flex-shrink-0 ' + blocData.color}>
                                        {tema.num}
                                    </span>
                                    <div>
                                        <p className="text-sm font-medium text-gray-800">{tema.title[idioma] || tema.title.val}</p>
                                        <span className="text-xs text-gray-400">{t('filter.bloc')} {blocData.label}: {blocData.name}</span>
                                    </div>
                                </div>
                            </a>
                        );
                    })}
                </div>
            </div>
        );
    }

    // ─── Suposits component ────────────────────────────────────────
    function Suposits() {
        return (

                <div className="text-center mb-8">
                    <h2 className="text-2xl font-bold text-gray-800">{t('sup.title')}</h2>

                {/* Link to full practice page */}
                <a href="./oposicions-practica" className="block mb-8 p-6 bg-gradient-to-r from-teal-500 to-cyan-500 rounded-2xl text-white hover:from-teal-600 hover:to-cyan-600 transition-all shadow-lg hover:shadow-xl">
                    <div className="flex items-center justify-between">
                        <div>
                            <h3 className="text-xl font-bold">📝 {t('sup.title')}</h3>
                            <p className="text-teal-100 mt-1">{idioma === 'es' ? '25 ejercicios interactivos con solución paso a paso' : idioma === 'en' ? '25 interactive exercises with step-by-step solutions' : '25 exercicis interactius amb solució pas a pas'}</p>

                        </div>

                {/* Category cards */}
                <div className="grid md:grid-cols-2 gap-4 mb-8">
                    {supositsCategories.map(function(cat) {
                        return (
                            <a key={cat.id} href={'./oposicions-practica#' + cat.id} className={'rounded-2xl border p-6 ' + cat.bgLight + ' ' + cat.border + ' relative overflow-hidden block hover:shadow-md transition-shadow'}>
                                <div className="flex items-start gap-4">
                                    <span className="text-4xl">{cat.icon}</span>

                                        <div className="flex items-center gap-2">
                                            <h3 className="text-lg font-bold text-gray-800">{t('sup.' + cat.id)}</h3>
                                            <span className="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-semibold">
                                                5 {idioma === 'es' ? 'ejercicios' : idioma === 'en' ? 'exercises' : 'exercicis'}

                                        </div>

                {/* CV Orientation section */}
                <div className="bg-gradient-to-br from-purple-50 to-violet-50 rounded-2xl border border-purple-200 p-6">
                    <div className="flex items-center gap-3 mb-4">
                        <span className="text-2xl">{'\u{1F3DB}'}</span>
                        <h3 className="text-lg font-bold text-purple-800">{t('cv.title')}</h3>
                    </div>
                    <ul className="space-y-3">
                        <li className="flex items-start gap-3">
                            <span className="w-2 h-2 rounded-full bg-purple-400 mt-2 flex-shrink-0"></span>
                            <span className="text-sm text-gray-700">{t('cv.tribunal')}</span>
                        </li>
                        <li className="flex items-start gap-3">
                            <span className="w-2 h-2 rounded-full bg-purple-400 mt-2 flex-shrink-0"></span>
                            <span className="text-sm text-gray-700">{t('cv.tipus')}</span>
                        </li>
                        <li className="flex items-start gap-3">
                            <span className="w-2 h-2 rounded-full bg-purple-400 mt-2 flex-shrink-0"></span>
                            <span className="text-sm text-gray-700">{t('cv.consells')}</span>
                        </li>
                    </ul>
                </div>

                {/* SA Design section */}
                <div className="bg-gradient-to-br from-violet-50 to-purple-50 rounded-2xl border border-violet-200 p-6 mt-6">
                    <div className="flex items-center gap-3 mb-4">
                        <span className="text-2xl">{'\u{1F393}'}</span>
                        <h3 className="text-lg font-bold text-violet-800">{t('sa.title')}</h3>
                    </div>

                    <p className="text-sm text-gray-700 mb-3">{t('sa.intro')}</p>
                    <p className="text-sm text-gray-600 mb-5 italic">{t('sa.context')}</p>

                    <div className="grid md:grid-cols-2 gap-5 mb-5">
                        {/* Key elements */}
                        <div className="bg-white/70 rounded-xl p-4 border border-violet-100">
                            <h4 className="text-sm font-bold text-violet-700 mb-3">{t('sa.elements')}</h4>
                            <ul className="space-y-1.5">
                                {t('sa.elements.list').split(', ').map(function(item, i) {
                                    return (
                                        <li key={i} className="flex items-start gap-2 text-sm text-gray-700">
                                            <span className="w-1.5 h-1.5 rounded-full bg-violet-400 mt-1.5 flex-shrink-0"></span>
                                            {item}
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>

                        {/* Active methodologies */}
                        <div className="bg-white/70 rounded-xl p-4 border border-violet-100">
                            <h4 className="text-sm font-bold text-violet-700 mb-3">{t('sa.metodologies')}</h4>
                            <ul className="space-y-1.5">
                                <li className="flex items-start gap-2 text-sm text-gray-700">
                                    <span className="text-violet-500">{'\u{1F4CB}'}</span> {t('sa.abp')}
                                </li>
                                <li className="flex items-start gap-2 text-sm text-gray-700">
                                    <span className="text-violet-500">{'\u{1F504}'}</span> {t('sa.flipped')}
                                </li>
                                <li className="flex items-start gap-2 text-sm text-gray-700">
                                    <span className="text-violet-500">{'\u{1F3AE}'}</span> {t('sa.gamificacio')}
                                </li>
                                <li className="flex items-start gap-2 text-sm text-gray-700">
                                    <span className="text-violet-500">{'\u{1F91D}'}</span> {t('sa.cooperatiu')}
                                </li>
                                <li className="flex items-start gap-2 text-sm text-gray-700">
                                    <span className="text-violet-500">{'\u{1F4A1}'}</span> {t('sa.design')}
                                </li>
                            </ul>
                        </div>
                    </div>

                    {/* Attention to diversity */}
                    <div className="bg-white/70 rounded-xl p-4 border border-violet-100 mb-4">
                        <h4 className="text-sm font-bold text-violet-700 mb-3">{t('sa.diversitat')}</h4>
                        <ul className="space-y-2">
                            <li className="flex items-start gap-2 text-sm text-gray-700">
                                <span className="w-1.5 h-1.5 rounded-full bg-violet-400 mt-1.5 flex-shrink-0"></span>
                                {t('sa.dua')}
                            </li>
                            <li className="flex items-start gap-2 text-sm text-gray-700">

                                {t('sa.adaptacions')}

                        </span>

                    </div>
                </div>
            </div>
        );
    }

    // ─── Programacions component ───────────────────────────────────
    function Programacions() {
        const [expanded, setExpanded] = useState(null);

        var toggleExpand = function(id) {
            setExpanded(expanded === id ? null : id);
        };

        var featured = ccaaList.find(function(c) { return c.featured; });
        var others = ccaaList.filter(function(c) { return !c.featured; });

        var renderDetail = function(detail) {
            if (!detail) return null;
            return (
                <div className="mt-4 pt-4 border-t border-gray-200/60 space-y-4 animate-fade">
                    <div className="grid sm:grid-cols-2 gap-4">
                        <div>
                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">{t('prog.normativa')}</p>
                            <ul className="space-y-1.5">
                                {detail.decrees.map(function(d, i) {
                                    return (
                                        <li key={i} className="text-sm text-gray-700 flex items-center gap-2">
                                            <span className="text-purple-400">{'\u{1F4CB}'}</span> {d}
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>
                        <div>
                            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">{t('prog.assignatures')}</p>
                            <div className="flex flex-wrap gap-1.5">
                                {detail.subjects.map(function(s, i) {
                                    return (
                                        <span key={i} className="text-xs px-2 py-1 rounded-lg bg-purple-50 text-purple-700 font-medium">{s}</span>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                    <div>
                        <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">{t('prog.particularitat')}</p>
                        <p className="text-sm text-gray-600 leading-relaxed">{detail.info[idioma] || detail.info.val}</p>
                    </div>
                </div>
            );
        };

        var cvDetail = ccaaDetails[featured.id];

        return (
            <div className="animate-fade">
                <div className="text-center mb-8">
                    <h2 className="text-2xl font-bold text-gray-800">{t('prog.title')}</h2>
                    <p className="text-gray-500 mt-1">{t('prog.subtitle')}</p>
                </div>

                {/* Featured: Comunitat Valenciana */}
                <div className="bg-gradient-to-br from-yellow-50 via-amber-50 to-orange-50 rounded-2xl border-2 border-yellow-300 p-6 mb-6 shadow-lg shadow-yellow-100/50">
                    <div className="flex items-center gap-3 mb-1">
                        <span className={'w-4 h-4 rounded-full ' + featured.dot}></span>
                        <h3 className="text-xl font-bold text-gray-800">{featured.name[idioma] || featured.name.val}</h3>
                        <span className="text-xs px-2 py-0.5 rounded-full bg-yellow-200 text-yellow-700 font-semibold">
                            {t('prog.lang.valencia')}
                        </span>
                    </div>
                    {renderDetail(cvDetail)}
                </div>

                {/* Info banner */}
                <div className="bg-purple-50 border border-purple-200 rounded-xl p-4 mb-6 flex items-start gap-3">
                    <span className="text-lg">{'\u{2139}\u{FE0F}'}</span>
                    <p className="text-sm text-purple-700">{t('prog.convocatoria')}</p>
                </div>

                {/* Other CCAA grid */}
                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {others.map(function(ccaa) {
                        var isExpanded = expanded === ccaa.id;
                        var detail = ccaaDetails[ccaa.id];
                        return (
                            <div
                                key={ccaa.id}
                                className={'bg-white rounded-xl border p-4 transition-all cursor-pointer ' +
                                    (isExpanded
                                        ? 'border-purple-300 shadow-lg shadow-purple-100/50 ring-1 ring-purple-200'
                                        : 'border-gray-100 hover:shadow-md hover:border-purple-200'
                                    )}
                                onClick={function() { toggleExpand(ccaa.id); }}
                            >
                                <div className="flex items-center gap-3">
                                    <span className={'w-3 h-3 rounded-full flex-shrink-0 ' + ccaa.dot}></span>
                                    <div className="flex-1 min-w-0">
                                        <p className="text-sm font-semibold text-gray-800">{ccaa.name[idioma] || ccaa.name.val}</p>
                                        {ccaa.lang && (
                                            <span className="text-xs text-purple-500 font-medium">{t('prog.lang.' + ccaa.lang)}</span>
                                        )}
                                    </div>
                                    <span className={'text-xs text-gray-400 transition-transform duration-200 inline-block ' + (isExpanded ? 'rotate-180' : '')}>{'\u25BC'}</span>
                                </div>
                                {isExpanded && renderDetail(detail)}
                            </div>
                        );
                    })}
                </div>
            </div>
        );
    }

    // ─── Tab buttons ───────────────────────────────────────────────
    const tabs = [
        { id: 'temes', label: '\u{1F4D6} 71 ' + t('tab.temes') },
        { id: 'suposits', label: '\u{1F4DD} ' + t('tab.suposits') },
        { id: 'programacions', label: '\u{1F5FA} ' + t('tab.programacions') },

    return (
        <div className="min-h-screen">
            <PdeHeader
                idioma={idioma}

                        <span className="mr-2">{'\u{1F3AF}'}</span>{t('hero.title')}
                    </h1>
                    <p className="text-lg text-gray-500 max-w-2xl mx-auto mb-6">
                        {t('hero.subtitle')}
                    </p>
                    <div className="flex flex-wrap justify-center gap-4">
                        <div className="flex items-center gap-2 px-4 py-2 bg-purple-100 rounded-xl">
                            <span className="text-purple-600 font-bold text-lg">{'\u{1F4D6}'}</span>
                            <span className="text-sm font-semibold text-purple-700">{t('hero.stat.temes')}</span>
                        </div>
                        <div className="flex items-center gap-2 px-4 py-2 bg-pink-100 rounded-xl">
                            <span className="text-pink-600 font-bold text-lg">{'\u{1F4DD}'}</span>
                            <span className="text-sm font-semibold text-pink-700">{t('hero.stat.suposits')}</span>
                        </div>
                        <div className="flex items-center gap-2 px-4 py-2 bg-violet-100 rounded-xl">
                            <span className="text-violet-600 font-bold text-lg">{'\u{1F5FA}'}</span>
                            <span className="text-sm font-semibold text-violet-700">{t('hero.stat.ccaa')}</span>
                        </div>
                    </div>
                </div>

                {/* Tab bar */}
                <div className="flex justify-center mb-8">
                    <div className="inline-flex bg-white rounded-2xl border border-gray-200 p-1.5 shadow-sm">
                        {tabs.map(function(tab) {
                            var isActive = section === tab.id;
                            return (
                                <button
                                    key={tab.id}
                                    onClick={function() { setSection(tab.id); pdeScrollToTop(); }}
                                    className={'px-5 py-2.5 rounded-xl text-sm font-semibold transition-all ' +
                                        (isActive
                                            ? 'bg-gradient-to-r from-purple-600 to-violet-600 text-white shadow-lg shadow-purple-500/30'
                                            : 'text-gray-500 hover:text-purple-600 hover:bg-purple-50'
                                        )}
                                >
                                    {tab.label}
                                </button>
                            );
                        })}
                    </div>
                </div>

                {/* Content per tab */}
                {section === 'temes' && <Temes />}
                {section === 'suposits' && <Suposits />}
                {section === 'programacions' && <Programacions />}
            </main>

            <PdeFooter appEmoji={'\u{1F3AF}'} appName={t('footer.appname')} idioma={idioma} />
            <PdeScrollToTop />
        </div>
    );
}

ReactDOM.render(<OposicionsApp />, document.getElementById('root'));
    </script>
