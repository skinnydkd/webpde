const { useState, useMemo } = React;

function RecercaApp() {
    const [idioma, setIdioma] = useState(PdeLanguageStore.get());
    const [seccio, setSeccio] = useState('papers');
    const [subSeccio, setSubSeccio] = useState(null);

    const pageTranslations = {
        // recercaapp
        'recercaapp.tots': { val: "Tots", es: "Todos", en: "All" },
        'recercaapp.ia_tecnologia': { val: "IA i Tecnologia", es: "IA y Tecnología", en: "AI & Technology" },
        'recercaapp.desigualtat': { val: "Desigualtat", es: "Desigualdad", en: "Inequality" },
        'recercaapp.institucions': { val: "Institucions", es: "Instituciones", en: "Institutions" },
        'recercaapp.ec_conductual': { val: "Ec. Conductual", es: "Ec. Conductual", en: "Behavioral" },
        'recercaapp.clima': { val: "Clima", es: "Clima", en: "Climate" },
        'recercaapp.finances': { val: "Finances", es: "Finanzas", en: "Finance" },
        'recercaapp.treball': { val: "Treball", es: "Trabajo", en: "Labor" },
        'recercaapp.desenvolupament': { val: "Desenvolupament", es: "Desarrollo", en: "Development" },
        'recercaapp.analitza_limpacte_macroeconòmic_ia': { val: "Analitza l'impacte macroeconòmic de la IA en els pròxims 10 anys. Prediu un augment modest del PIB (0.5-1.5%) però adverteix sobre els efectes en la desigualtat.", es: "Analiza el impacto macroeconómico de la IA en los próximos 10 años. Predice un aumento modesto del PIB (0.5-1.5%) pero advierte sobre efectos en la desigualdad.", en: "Analyzes AI's macroeconomic impact over 10 years. Predicts modest GDP increase (0.5-1.5%) but warns about inequality effects." },
        'recercaapp.què_timporta_quan_sents': { val: "🎓 PER QUÈ T'IMPORTA: Quan sents que la IA ho canviarà tot demà, aquest paper et dóna perspectiva. Acemoglu (Nobel 2024) demostra que l'impacte serà real però gradual. Si estàs decidint què estudiar o en què treballar, aquest paper t'ajuda a entendre que tens temps per adaptar-te, però que has de fer-ho.", es: "🎓 POR QUÉ TE IMPORTA: Cuando oyes que la IA lo cambiará todo mañana, este paper te da perspectiva. Acemoglu (Nobel 2024) demuestra que el impacto será real pero gradual. Si estás decidiendo qué estudiar o en qué trabajar, este paper te ayuda a entender que tienes tiempo para adaptarte, pero que debes hacerlo.", en: "🎓 WHY IT MATTERS: When you hear AI will change everything tomorrow, this paper gives perspective. Acemoglu (Nobel 2024) shows the impact will be real but gradual. If you're deciding what to study or work in, this helps you understand you have time to adapt, but you must." },
        'recercaapp.síntesi_20_anys_recerca': { val: "Síntesi de 20 anys de recerca sobre com les institucions polítiques i econòmiques determinen la prosperitat de les nacions a llarg termini.", es: "Síntesis de 20 años de investigación sobre cómo las instituciones políticas y económicas determinan la prosperidad de las naciones.", en: "Synthesis of 20 years of research on how political and economic institutions determine long-term prosperity." },
        'recercaapp.què_timporta_què_espanya': { val: "🎓 PER QUÈ T'IMPORTA: Per què Espanya és més rica que Marroc però més pobra que Alemanya? No és geografia ni cultura: són les INSTITUCIONS. Aquest treball explica per què la corrupció, la justícia lenta o la burocràcia afecten directament el teu futur econòmic. Entendre-ho t'ajuda a votar millor i a entendre el món.", es: "🎓 POR QUÉ TE IMPORTA: ¿Por qué España es más rica que Marruecos pero más pobre que Alemania? No es geografía ni cultura: son las INSTITUCIONES. Este trabajo explica por qué la corrupción, la justicia lenta o la burocracia afectan directamente tu futuro económico.", en: "🎓 WHY IT MATTERS: Why is Spain richer than Morocco but poorer than Germany? It's not geography or culture: it's INSTITUTIONS. This work explains why corruption, slow justice or bureaucracy directly affect your economic future." },
        'recercaapp.proposa_ia_generativa_podria': { val: "Proposa que la IA generativa podria democratitzar l'expertesa i ajudar a reconstruir la classe mitjana, revertint dècades de polarització laboral.", es: "Propone que la IA generativa podría democratizar la expertise y ayudar a reconstruir la clase media, revirtiendo décadas de polarización laboral.", en: "Proposes generative AI could democratize expertise and help rebuild middle class, reversing decades of labor polarization." },
        'recercaapp.què_timporta_visió_optimista': { val: "🎓 PER QUÈ T'IMPORTA: Visió optimista! Autor argumenta que la IA podria ser l'eina que et permeta fer feines que abans requerien anys de formació especialitzada. Un advocat junior amb IA pot produir com un sènior. Això podria ser una oportunitat enorme per a la teua generació.", es: "🎓 POR QUÉ TE IMPORTA: ¡Visión optimista! Autor argumenta que la IA podría ser la herramienta que te permita hacer trabajos que antes requerían años de formación especializada. Un abogado junior con IA puede producir como un senior. Esto podría ser una oportunidad enorme para tu generación.", en: "🎓 WHY IT MATTERS: Optimistic vision! Autor argues AI could be the tool that lets you do jobs that previously required years of specialized training. A junior lawyer with AI can produce like a senior. This could be a huge opportunity for your generation." },
        'recercaapp.estima_80_dels_treballadors': { val: "Estima que el 80% dels treballadors als EUA podrien veure almenys el 10% de les seves tasques afectades per GPT. El 19% podrien veure el 50%+ afectat.", es: "Estima que el 80% de trabajadores en EEUU podrían ver al menos el 10% de sus tareas afectadas por GPT. El 19% podrían ver el 50%+ afectado.", en: "Estimates 80% of US workers could see at least 10% of tasks affected by GPT. 19% could see 50%+ affected." },
        'recercaapp.què_timporta_primer_mapa': { val: "🎓 PER QUÈ T'IMPORTA: El primer mapa detallat de quines feines seran més afectades per ChatGPT i similars. Sorpresa: no són les feines manuals, sinó les cognitives rutinàries (comptabilitat, programació bàsica, redacció estàndard). Si estàs triant carrera, LLEGEIX AIXÒ.", es: "🎓 POR QUÉ TE IMPORTA: El primer mapa detallado de qué trabajos serán más afectados por ChatGPT y similares. Sorpresa: no son los trabajos manuales, sino los cognitivos rutinarios (contabilidad, programación básica, redacción estándar). Si estás eligiendo carrera, LEE ESTO.", en: "🎓 WHY IT MATTERS: The first detailed map of which jobs will be most affected by ChatGPT and similar. Surprise: it's not manual jobs, but routine cognitive ones (accounting, basic programming, standard writing). If you're choosing a career, READ THIS." },
        'recercaapp.actualització_dades_globals_desigualtat': { val: "Actualització de les dades globals de desigualtat: el 10% més ric posseeix el 76% de la riquesa mundial. La desigualtat entre països disminueix però dins dels països augmenta.", es: "Actualización de datos globales de desigualdad: el 10% más rico posee el 76% de la riqueza mundial. La desigualdad entre países disminuye pero dentro de los países aumenta.", en: "Global inequality data update: top 10% owns 76% of world wealth. Between-country inequality decreases but within-country increases." },
        'recercaapp.què_timporta_dades_objectives': { val: "🎓 PER QUÈ T'IMPORTA: Dades objectives sobre la desigualtat al món. Quan algú diu que 'abans estàvem pitjor' o 'la desigualtat és inevitable', aquest informe et dóna els fets reals per formar la teua pròpia opinió. Essential per a qualsevol debat informat.", es: "🎓 POR QUÉ TE IMPORTA: Datos objetivos sobre la desigualdad en el mundo. Cuando alguien dice que 'antes estábamos peor' o 'la desigualdad es inevitable', este informe te da los hechos reales para formar tu propia opinión.", en: "🎓 WHY IT MATTERS: Objective data on global inequality. When someone says 'we were worse off before' or 'inequality is inevitable', this report gives you real facts to form your own opinion." },
        'recercaapp.demostra_lautomatització_explica_5070': { val: "Demostra que l'automatització explica el 50-70% de l'augment de la desigualtat salarial als EUA des de 1980. Proposa el model de tasques.", es: "Demuestra que la automatización explica el 50-70% del aumento de la desigualdad salarial en EEUU desde 1980. Propone el modelo de tareas.", en: "Shows automation explains 50-70% of US wage inequality increase since 1980. Proposes task-based model." },
        'recercaapp.què_timporta_què_teu': { val: "🎓 PER QUÈ T'IMPORTA: Per què el teu avi podia comprar-se una casa amb un sou de fàbrica i tu potser no podràs? Aquest paper demostra que la tecnologia (robots, ordinadors) ha beneficiat més als altament qualificats. Entendre això t'ajuda a planificar la teua carrera.", es: "🎓 POR QUÉ TE IMPORTA: ¿Por qué tu abuelo podía comprarse una casa con un sueldo de fábrica y tú quizás no podrás? Este paper demuestra que la tecnología ha beneficiado más a los altamente cualificados. Entender esto te ayuda a planificar tu carrera.", en: "🎓 WHY IT MATTERS: Why could your grandfather buy a house on a factory salary and you might not? This paper shows technology has benefited highly qualified workers more. Understanding this helps you plan your career." },
        'recercaapp.metaanàlisi_126_experiments_aleatoris': { val: "Meta-anàlisi de 126 experiments aleatoris de les Nudge Units del govern. Els nudges funcionen però amb efectes més petits del que es pensava (1.4% de mitjana).", es: "Meta-análisis de 126 experimentos aleatorios de las Nudge Units del gobierno. Los nudges funcionan pero con efectos más pequeños de lo esperado (1.4% de media).", en: "Meta-analysis of 126 RCTs from government Nudge Units. Nudges work but with smaller effects than expected (1.4% average)." },
        'recercaapp.què_timporta_nudges_empentetes': { val: "🎓 PER QUÈ T'IMPORTA: Els 'nudges' (empentetes) són canvis subtils que et fan prendre millors decisions (com posar fruita a l'altura dels ulls). Aquest paper mostra que funcionen, però no són màgics. Important per no creure en solucions fàcils a problemes complexos.", es: "🎓 POR QUÉ TE IMPORTA: Los 'nudges' (empujoncitos) son cambios sutiles que te hacen tomar mejores decisiones (como poner fruta a la altura de los ojos). Este paper muestra que funcionan, pero no son mágicos. Importante para no creer en soluciones fáciles.", en: "🎓 WHY IT MATTERS: 'Nudges' are subtle changes that help you make better decisions (like putting fruit at eye level). This paper shows they work, but they're not magic. Important for not believing in easy solutions." },
        'recercaapp.utilitzar_experiments_aleatoris_descobrir': { val: "Com utilitzar experiments aleatoris per descobrir què funciona realment per reduir la pobresa. Van revolucionar l'economia del desenvolupament.", es: "Cómo utilizar experimentos aleatorios para descubrir qué funciona realmente para reducir la pobreza. Revolucionaron la economía del desarrollo.", en: "How to use randomized experiments to discover what really works to reduce poverty. They revolutionized development economics." },
        'recercaapp.què_timporta_abans_governs': { val: "🎓 PER QUÈ T'IMPORTA: Abans, els governs gastaven milions en programes contra la pobresa sense saber si funcionaven. Aquests economistes van aplicar el mètode científic: experiments com en medicina. Ara sabem què funciona i què no. Model de com l'economia pot millorar vides reals.", es: "🎓 POR QUÉ TE IMPORTA: Antes, los gobiernos gastaban millones en programas contra la pobreza sin saber si funcionaban. Estos economistas aplicaron el método científico: experimentos como en medicina. Ahora sabemos qué funciona y qué no.", en: "🎓 WHY IT MATTERS: Before, governments spent millions on poverty programs without knowing if they worked. These economists applied the scientific method: experiments like in medicine. Now we know what works and what doesn't." },
        'recercaapp.utilitzar_experiments_naturals_canvis': { val: "Com utilitzar 'experiments naturals' (canvis en lleis, fronteres, esdeveniments aleatoris) per establir relacions causals en economia.", es: "Cómo utilizar 'experimentos naturales' (cambios en leyes, fronteras, eventos aleatorios) para establecer relaciones causales en economía.", en: "How to use 'natural experiments' (changes in laws, borders, random events) to establish causal relationships in economics." },
        'recercaapp.què_timporta_pujar_salari': { val: "🎓 PER QUÈ T'IMPORTA: Pujar el salari mínim destrueix llocs de feina? Card va estudiar restaurants a la frontera de Nova Jersey i Pennsylvania quan un estat va pujar el salari i l'altre no. Resultat sorprenent: NO es van perdre llocs de feina. Això canvia el debat polític completament.", es: "🎓 POR QUÉ TE IMPORTA: ¿Subir el salario mínimo destruye empleos? Card estudió restaurantes en la frontera de Nueva Jersey y Pennsylvania cuando un estado subió el salario y el otro no. Resultado sorprendente: NO se perdieron empleos. Esto cambia el debate político completamente.", en: "🎓 WHY IT MATTERS: Does raising minimum wage destroy jobs? Card studied restaurants at the New Jersey/Pennsylvania border when one state raised wages and the other didn't. Surprising result: NO jobs were lost. This completely changes the political debate." },
        'recercaapp.psicologia_pot_millorar_models': { val: "Com la psicologia pot millorar els models econòmics. Els humans no som racionals: cometem errors predictibles que podem corregir.", es: "Cómo la psicología puede mejorar los modelos económicos. Los humanos no somos racionales: cometemos errores predecibles que podemos corregir.", en: "How psychology can improve economic models. Humans aren't rational: we make predictable mistakes we can correct." },
        'recercaapp.què_timporta_què_gastes': { val: "🎓 PER QUÈ T'IMPORTA: Per què gastes més amb targeta que amb efectiu? Per què no estalvies per a la jubilació encara que saps que ho hauries de fer? Thaler explica els biaixos mentals que et fan prendre males decisions financeres. Conèixer-los és el primer pas per evitar-los.", es: "🎓 POR QUÉ TE IMPORTA: ¿Por qué gastas más con tarjeta que con efectivo? ¿Por qué no ahorras para la jubilación aunque sabes que deberías? Thaler explica los sesgos mentales que te hacen tomar malas decisiones financieras. Conocerlos es el primer paso para evitarlos.", en: "🎓 WHY IT MATTERS: Why do you spend more with card than cash? Why don't you save for retirement even though you know you should? Thaler explains the mental biases that make you take bad financial decisions. Knowing them is the first step to avoiding them." },
        'recercaapp.sistema_ràpid_intuïtiu_sistema': { val: "El Sistema 1 (ràpid, intuïtiu) i Sistema 2 (lent, racional). Com el nostre cervell pren decisions i per què ens equivoquem sistemàticament.", es: "El Sistema 1 (rápido, intuitivo) y Sistema 2 (lento, racional). Cómo nuestro cerebro toma decisiones y por qué nos equivocamos sistemáticamente.", en: "System 1 (fast, intuitive) and System 2 (slow, rational). How our brain makes decisions and why we systematically err." },
        'recercaapp.què_timporta_teu_cervell': { val: "🎓 PER QUÈ T'IMPORTA: El teu cervell té dos modes: un de ràpid (intuïció) i un de lent (raonament). El problema és que el ràpid mana la major part del temps i comet errors previsibles. Entendre això millora TOTES les teues decisions: estudis, diners, relacions...", es: "🎓 POR QUÉ TE IMPORTA: Tu cerebro tiene dos modos: uno rápido (intuición) y uno lento (razonamiento). El problema es que el rápido manda la mayor parte del tiempo y comete errores previsibles. Entender esto mejora TODAS tus decisiones.", en: "🎓 WHY IT MATTERS: Your brain has two modes: fast (intuition) and slow (reasoning). The problem is the fast one rules most of the time and makes predictable errors. Understanding this improves ALL your decisions." },
        'recercaapp.revisió_leconomia_canvi_climàtic': { val: "Revisió de l'economia del canvi climàtic: models integrats, cost social del carboni, i polítiques d'adaptació.", es: "Revisión de la economía del cambio climático: modelos integrados, coste social del carbono, y políticas de adaptación.", en: "Review of climate economics: integrated models, social cost of carbon, and adaptation policies." },
        'recercaapp.què_timporta_quant_costa': { val: "🎓 PER QUÈ T'IMPORTA: Quant costa realment contaminar? Nordhaus va calcular el 'preu social del carboni': el dany que fa cada tona de CO2. Sense aquest número, no podem dissenyar impostos al carboni ni polítiques climàtiques efectives. Economia al servei del planeta.", es: "🎓 POR QUÉ TE IMPORTA: ¿Cuánto cuesta realmente contaminar? Nordhaus calculó el 'precio social del carbono': el daño que hace cada tonelada de CO2. Sin este número, no podemos diseñar impuestos al carbono ni políticas climáticas efectivas.", en: "🎓 WHY IT MATTERS: How much does polluting really cost? Nordhaus calculated the 'social cost of carbon': the damage each ton of CO2 causes. Without this number, we can't design carbon taxes or effective climate policies." },
        'recercaapp.anàlisi_monedes_digitals_dels': { val: "Anàlisi de les monedes digitals dels bancs centrals (CBDC) i les seves implicacions per al sistema financer i la política monetària.", es: "Análisis de las monedas digitales de los bancos centrales (CBDC) y sus implicaciones para el sistema financiero y la política monetaria.", en: "Analysis of central bank digital currencies (CBDC) and implications for financial system and monetary policy." },
        'recercaapp.què_timporta_leuro_digital': { val: "🎓 PER QUÈ T'IMPORTA: L'euro digital ve en camí. Què significa? Que el BCE podria donar-te diners directament, sense passar pels bancs. Podria canviar completament com funcionen els diners, els préstecs i la privacitat financera. Prepara't per entendre-ho.", es: "🎓 POR QUÉ TE IMPORTA: El euro digital viene en camino. ¿Qué significa? Que el BCE podría darte dinero directamente, sin pasar por los bancos. Podría cambiar completamente cómo funcionan el dinero, los préstamos y la privacidad financiera.", en: "🎓 WHY IT MATTERS: The digital euro is coming. What does it mean? The ECB could give you money directly, without going through banks. It could completely change how money, loans and financial privacy work." },
        'recercaapp.mapa_interactiu_mobilitat_social': { val: "Mapa interactiu de la mobilitat social als EUA per codi postal. On creixes determina les teues oportunitats més que el que fas.", es: "Mapa interactivo de la movilidad social en EEUU por código postal. Donde creces determina tus oportunidades más que lo que haces.", en: "Interactive map of US social mobility by zip code. Where you grow up determines your opportunities more than what you do." },
        'recercaapp.què_timporta_barri_creixes': { val: "🎓 PER QUÈ T'IMPORTA: El barri on creixes afecta quant guanyaràs de gran, independentment del teu talent. Chetty ho va demostrar amb dades de milions de persones. Implicació brutal: la igualtat d'oportunitats és un mite. El teu codi postal importa més que el teu esforç.", es: "🎓 POR QUÉ TE IMPORTA: El barrio donde creces afecta cuánto ganarás de mayor, independientemente de tu talento. Chetty lo demostró con datos de millones de personas. Implicación brutal: la igualdad de oportunidades es un mito.", en: "🎓 WHY IT MATTERS: The neighborhood you grow up in affects how much you'll earn, regardless of talent. Chetty proved this with data from millions of people. Brutal implication: equal opportunity is a myth." },
        'recercaapp.nou_mètode_mesurar_desigualtat': { val: "Nou mètode per mesurar la desigualtat combinant enquestes, declaracions fiscals i comptabilitat nacional. Dades molt més precises.", es: "Nuevo método para medir la desigualdad combinando encuestas, declaraciones fiscales y contabilidad nacional. Datos mucho más precisos.", en: "New method to measure inequality combining surveys, tax returns and national accounts. Much more precise data." },
        'recercaapp.què_timporta_abans_sabíem': { val: "🎓 PER QUÈ T'IMPORTA: Abans no sabíem realment quant guanyaven els més rics perquè les enquestes no els capturen bé. Aquests economistes van resoldre el problema. Resultat: la desigualtat és PITJOR del que pensàvem. Ara tenim les dades per debatre seriosament.", es: "🎓 POR QUÉ TE IMPORTA: Antes no sabíamos realmente cuánto ganaban los más ricos porque las encuestas no los capturan bien. Estos economistas resolvieron el problema. Resultado: la desigualdad es PEOR de lo que pensábamos.", en: "🎓 WHY IT MATTERS: Before, we didn't really know how much the richest earned because surveys don't capture them well. These economists solved the problem. Result: inequality is WORSE than we thought." },
        'recercaapp.milions_persones_han_escapat': { val: "Com milions de persones han escapat de la pobresa i la mort prematura. Però l'escapada crea noves desigualtats entre els que s'escapen i els que queden enrere.", es: "Cómo millones de personas han escapado de la pobreza y la muerte prematura. Pero la escapada crea nuevas desigualdades entre los que escapan y los que quedan atrás.", en: "How millions escaped poverty and early death. But the escape creates new inequalities between those who escape and those left behind." },
        'recercaapp.què_timporta_deaton_mostra': { val: "🎓 PER QUÈ T'IMPORTA: Deaton mostra que el món ha millorat enormement (menys pobresa, més salut), però que el progrés és desigual. Optimisme amb matisos: les coses milloren, però no per a tots igual. Perspectiva equilibrada entre catastrofisme i complaença.", es: "🎓 POR QUÉ TE IMPORTA: Deaton muestra que el mundo ha mejorado enormemente (menos pobreza, más salud), pero que el progreso es desigual. Optimismo con matices: las cosas mejoran, pero no para todos igual.", en: "🎓 WHY IT MATTERS: Deaton shows the world has improved enormously (less poverty, more health), but progress is unequal. Optimism with nuance: things improve, but not equally for all." },
        'recercaapp.debat_sobre_mercats_són': { val: "Debat sobre si els mercats són eficients. Fama diu que sí (no pots guanyar al mercat), Shiller diu que no (hi ha bombolles previsibles).", es: "Debate sobre si los mercados son eficientes. Fama dice que sí (no puedes ganar al mercado), Shiller dice que no (hay burbujas previsibles).", en: "Debate on whether markets are efficient. Fama says yes (you can't beat the market), Shiller says no (there are predictable bubbles)." },
        'recercaapp.què_timporta_pots_guanyar': { val: "🎓 PER QUÈ T'IMPORTA: Pots guanyar diners triant accions o és millor invertir en un fons indexat i oblidar-te? Fama diu que no pots guanyar al mercat (per això els fons indexats). Shiller diu que sí hi ha bombolles previsibles. El debat més important per als teus diners.", es: "🎓 POR QUÉ TE IMPORTA: ¿Puedes ganar dinero eligiendo acciones o es mejor invertir en un fondo indexado? Fama dice que no puedes ganar al mercado (por eso los fondos indexados). Shiller dice que sí hay burbujas previsibles. El debate más importante para tu dinero.", en: "🎓 WHY IT MATTERS: Can you make money picking stocks or is it better to invest in an index fund? Fama says you can't beat the market (hence index funds). Shiller says there are predictable bubbles. The most important debate for your money." },
        'recercaapp.lexperiment_marshmallow': { val: "L'experiment del Marshmallow", es: "El experimento del Marshmallow", en: "The Marshmallow Experiment" },
        'recercaapp.nens_anys_podien_menjar': { val: "Nens de 4 anys podien menjar un dolç immediatament o esperar 15 minuts per tenir-ne dos. Els que van esperar van tenir millors resultats acadèmics i vitals dècades després... o no?", es: "Niños de 4 años podían comer un dulce inmediatamente o esperar 15 minutos para tener dos. Los que esperaron tuvieron mejores resultados académicos y vitales décadas después... ¿o no?", en: "4-year-olds could eat a treat immediately or wait 15 minutes for two. Those who waited had better academic and life outcomes decades later... or did they?" },
        'recercaapp.giro_interessant_replicacions_recents': { val: "💡 GIRO INTERESSANT: Replicacions recents mostren que l'efecte és molt menor del que es pensava. La capacitat d'esperar no era força de voluntat, sinó que reflectia la situació econòmica de la família. Nens de famílies pobres havien après que les promeses no es compleixen. LLIÇÓ: Desconfia dels experiments virals fins que es repliquen.", es: "💡 GIRO INTERESANTE: Replicaciones recientes muestran que el efecto es mucho menor de lo que se pensaba. La capacidad de esperar no era fuerza de voluntad, sino que reflejaba la situación económica familiar. Niños de familias pobres habían aprendido que las promesas no se cumplen.", en: "💡 INTERESTING TWIST: Recent replications show the effect is much smaller than thought. The ability to wait wasn't willpower, but reflected family economic situation. Poor children had learned promises aren't kept." },
        'recercaapp.què_jugadors_futbol_nascuts': { val: "Per què els jugadors de futbol nascuts al gener són millors", es: "Por qué los futbolistas nacidos en enero son mejores", en: "Why January-born footballers are better" },
        'recercaapp.acadèmies_futbol_nens_nascuts': { val: "A les acadèmies de futbol, els nens nascuts al gener són molt més nombrosos que els nascuts al desembre. El mateix passa a l'hoquei, el beisbol i molts altres esports.", es: "En las academias de fútbol, los niños nacidos en enero son mucho más numerosos que los nacidos en diciembre. Lo mismo pasa en hockey, béisbol y muchos otros deportes.", en: "In football academies, January-born children are much more numerous than December-born. Same happens in hockey, baseball and many other sports." },
        'recercaapp.lefecte_ledat_relativa_talles': { val: "💡 L'EFECTE DE L'EDAT RELATIVA: Si talles el gener, un nen de gener pot tenir quasi un any més que un de desembre. Als 8 anys, és una diferència ENORME. El més gran sembla 'més bo', rep més atenció, entrena més, i la profecia s'autocompleix. El talent és context, no només genètica.", es: "💡 EL EFECTO DE LA EDAD RELATIVA: Si el corte es en enero, un niño de enero puede tener casi un año más que uno de diciembre. A los 8 años, es una diferencia ENORME. El mayor parece 'mejor', recibe más atención, entrena más, y la profecía se autocumple.", en: "💡 RELATIVE AGE EFFECT: If cutoff is January, a January child can be almost a year older than a December one. At 8 years old, it's a HUGE difference. The older one seems 'better', gets more attention, trains more, and the prophecy self-fulfills." },
        'recercaapp.lexperiment_dels_jutges_dinar': { val: "L'experiment dels jutges i el dinar", es: "El experimento de los jueces y el almuerzo", en: "The judges and lunch experiment" },
        'recercaapp.jutges_israelians_decidien_sobre': { val: "Jutges israelians que decidien sobre llibertat condicional. Just després de dinar aprovaven el 65% de sol·licituds. Just abans de dinar, quasi 0%. La gana afecta la justícia.", es: "Jueces israelíes que decidían sobre libertad condicional. Justo después de almorzar aprobaban el 65% de solicitudes. Justo antes de almorzar, casi 0%. El hambre afecta la justicia.", en: "Israeli judges deciding on parole. Right after lunch they approved 65% of requests. Right before lunch, almost 0%. Hunger affects justice." },
        'recercaapp.implicacions_brutals_teu_futur': { val: "💡 IMPLICACIONS BRUTALS: El teu futur pot dependre de si el jutge ha menjat. Estem dissenyant sistemes de justícia assumint que els humans som màquines racionals, però no ho som. Caldria programar les vistes després dels descans. La racionalitat humana és fràgil.", es: "💡 IMPLICACIONES BRUTALES: Tu futuro puede depender de si el juez ha comido. Estamos diseñando sistemas de justicia asumiendo que los humanos somos máquinas racionales, pero no lo somos. Habría que programar las vistas después de los descansos.", en: "💡 BRUTAL IMPLICATIONS: Your future can depend on whether the judge has eaten. We're designing justice systems assuming humans are rational machines, but we're not. Hearings should be scheduled after breaks." },
        'recercaapp.lexperiment_presó_stanford': { val: "L'experiment de la presó de Stanford", es: "El experimento de la cárcel de Stanford", en: "The Stanford Prison Experiment" },
        'recercaapp.estudiants_universitaris_assignats_aleatòriament': { val: "Estudiants universitaris assignats aleatòriament a ser 'guàrdies' o 'presoners'. En 6 dies, els guàrdies es van tornar sàdics i l'experiment es va haver de cancel·lar.", es: "Estudiantes universitarios asignados aleatoriamente a ser 'guardias' o 'prisioneros'. En 6 días, los guardias se volvieron sádicos y el experimento se tuvo que cancelar.", en: "College students randomly assigned as 'guards' or 'prisoners'. In 6 days, guards became sadistic and the experiment had to be cancelled." },
        'recercaapp.però_atenció_replicacions_investigacions': { val: "💡 PERÒ ATENCIÓ: Replicacions i investigacions recents suggereixen que Zimbardo va manipular els guàrdies perquè fossin cruels. No va ser 'natural'. LLIÇÓ DOBLE: 1) El poder corromp, però 2) desconfia dels experiments famosos que mai s'han replicat. La ciència requereix escepticisme.", es: "💡 PERO ATENCIÓN: Replicaciones e investigaciones recientes sugieren que Zimbardo manipuló a los guardias para que fueran crueles. No fue 'natural'. DOBLE LECCIÓN: 1) El poder corrompe, pero 2) desconfía de experimentos famosos que nunca se han replicado.", en: "💡 BUT BEWARE: Recent replications and investigations suggest Zimbardo manipulated guards to be cruel. It wasn't 'natural'. DOUBLE LESSON: 1) Power corrupts, but 2) distrust famous experiments that were never replicated." },
        'recercaapp.què_preu_cases_barcelona': { val: "Per què el preu de les cases a Barcelona explota", es: "Por qué el precio de las casas en Barcelona explota", en: "Why Barcelona house prices explode" },
        'recercaapp.cost_construir_pis_barcelona': { val: "El cost de construir un pis a Barcelona és ~1.500€/m². Es ven a 4.000-5.000€/m². D'on ve la diferència? De les restriccions a construir més alçada.", es: "El coste de construir un piso en Barcelona es ~1.500€/m². Se vende a 4.000-5.000€/m². ¿De dónde viene la diferencia? De las restricciones a construir más altura.", en: "The cost of building an apartment in Barcelona is ~€1,500/m². It sells for €4,000-5,000/m². Where's the difference from? Restrictions on building taller." },
        'recercaapp.economia_urbana_regulació_urbanística': { val: "💡 ECONOMIA URBANA: La regulació urbanística (no deixar construir més pisos) beneficia els propietaris actuals però perjudica els joves que volen comprar. Cada vegada que un veí bloqueja una construcció nova, està protegint el valor del seu pis a costa de la teua generació. Entén qui guanya i qui perd.", es: "💡 ECONOMÍA URBANA: La regulación urbanística (no dejar construir más pisos) beneficia a los propietarios actuales pero perjudica a los jóvenes que quieren comprar. Cada vez que un vecino bloquea una construcción nueva, está protegiendo el valor de su piso a costa de tu generación.", en: "💡 URBAN ECONOMICS: Urban regulation (not allowing more apartments) benefits current owners but hurts young people who want to buy. Every time a neighbor blocks new construction, they're protecting their property value at your generation's expense." },
        'recercaapp.lefecte_cobra_quan_solució': { val: "L'efecte cobra: quan la solució empitjora el problema", es: "El efecto cobra: cuando la solución empeora el problema", en: "The cobra effect: when the solution worsens the problem" },
        'recercaapp.líndia_colonial_govern_va': { val: "A l'Índia colonial, el govern va oferir recompenses per cobres morts. La gent va començar a criar cobres per matar-los i cobrar. Quan van cancel·lar el programa, van alliberar les cobres.", es: "En la India colonial, el gobierno ofreció recompensas por cobras muertas. La gente empezó a criar cobras para matarlas y cobrar. Cuando cancelaron el programa, liberaron las cobras.", en: "In colonial India, the government offered rewards for dead cobras. People started breeding cobras to kill them and collect. When they cancelled the program, they released the cobras." },
        'recercaapp.conseqüències_intencionades_cada_política': { val: "💡 CONSEQÜÈNCIES NO INTENCIONADES: Cada política crea incentius. La gent respon als incentius de maneres que no esperes. Exemples moderns: subvencions a coches elèctrics que fan pujar els preus, beques que fan pujar matrícules, etc. Pensa sempre en com la gent RESPONDRÀ a una nova norma.", es: "💡 CONSECUENCIAS NO INTENCIONADAS: Cada política crea incentivos. La gente responde a los incentivos de formas que no esperas. Ejemplos modernos: subvenciones a coches eléctricos que suben los precios, becas que suben matrículas, etc. Piensa siempre en cómo la gente RESPONDERÁ.", en: "💡 UNINTENDED CONSEQUENCES: Every policy creates incentives. People respond to incentives in ways you don't expect. Modern examples: EV subsidies that raise prices, scholarships that raise tuition, etc. Always think about how people will RESPOND." },
        'recercaapp.què_dones_guanyen_menys': { val: "Per què les dones guanyen menys (i no és només discriminació)", es: "Por qué las mujeres ganan menos (y no es solo discriminación)", en: "Why women earn less (and it's not just discrimination)" },
        'recercaapp.goldin_va_demostrar_major': { val: "Goldin va demostrar que la major part de la bretxa salarial apareix quan les dones tenen fills. No és discriminació directa: és que les feines 'flexibles' paguen menys.", es: "Goldin demostró que la mayor parte de la brecha salarial aparece cuando las mujeres tienen hijos. No es discriminación directa: es que los trabajos 'flexibles' pagan menos.", en: "Goldin showed most of the wage gap appears when women have children. It's not direct discrimination: it's that 'flexible' jobs pay less." },
        'recercaapp.matís_important_feines_paguen': { val: "💡 MATÍS IMPORTANT: Les feines que paguen més (advocat, consultor, financer) recompensen les hores extres i la disponibilitat 24/7. Quan una parella té fills, algú ha de reduir hores. Quasi sempre ho fa la dona. La solució no és només 'no discriminar', sinó canviar com valorem la flexibilitat.", es: "💡 MATIZ IMPORTANTE: Los trabajos que pagan más (abogado, consultor, financiero) recompensan las horas extras y la disponibilidad 24/7. Cuando una pareja tiene hijos, alguien tiene que reducir horas. Casi siempre lo hace la mujer. La solución no es solo 'no discriminar', sino cambiar cómo valoramos la flexibilidad.", en: "💡 IMPORTANT NUANCE: Highest-paying jobs (lawyer, consultant, banker) reward overtime and 24/7 availability. When a couple has kids, someone must reduce hours. Almost always the woman. The solution isn't just 'don't discriminate', but changing how we value flexibility." },
        'recercaapp.lexperiment_freakonomics_luchadors_sumo': { val: "L'experiment de Freakonomics: Com els luchadors de sumo fan trampes", es: "El experimento de Freakonomics: Cómo los luchadores de sumo hacen trampas", en: "The Freakonomics experiment: How sumo wrestlers cheat" },
        'recercaapp.analitzant_milers_combats_sumo': { val: "Analitzant milers de combats de sumo, van descobrir que els lluitadors amb 7-7 victòries guanyen sospitosament sovint contra els que ja tenen 8-6 (assegurada la plaça).", es: "Analizando miles de combates de sumo, descubrieron que los luchadores con 7-7 victorias ganan sospechosamente a menudo contra los que ya tienen 8-6 (plaza asegurada).", en: "Analyzing thousands of sumo matches, they found wrestlers with 7-7 records suspiciously often beat those with 8-6 (already qualified)." },
        'recercaapp.incentius_expliquen_tot_lluitador': { val: "💡 ELS INCENTIUS EXPLIQUEN TOT: Si un lluitador necessita UNA victòria per classificar-se i l'altre ja està classificat, què creus que passa? Les dades no menteixen. La corrupció apareix on els incentius la fan rendible. Aplicable a tot: esports, política, empresa.", es: "💡 LOS INCENTIVOS LO EXPLICAN TODO: Si un luchador necesita UNA victoria para clasificarse y el otro ya está clasificado, ¿qué crees que pasa? Los datos no mienten. La corrupción aparece donde los incentivos la hacen rentable.", en: "💡 INCENTIVES EXPLAIN EVERYTHING: If a wrestler needs ONE win to qualify and the other is already qualified, what do you think happens? Data doesn't lie. Corruption appears where incentives make it profitable." },
        'recercaapp.què_gasolineres_cobren_preus': { val: "Per què les gasolineres cobren preus iguals (i no és coincidència)", es: "Por qué las gasolineras cobran precios iguales (y no es coincidencia)", en: "Why gas stations charge same prices (and it's not coincidence)" },
        'recercaapp.alguna_vegada_has_notat': { val: "Alguna vegada has notat que totes les gasolineres d'una zona tenen preus quasi idèntics? No es parlen, però utilitzen estratègies per coordinar preus sense escriure res.", es: "¿Alguna vez has notado que todas las gasolineras de una zona tienen precios casi idénticos? No se hablan, pero usan estrategias para coordinar precios sin escribir nada.", en: "Ever noticed all gas stations in an area have almost identical prices? They don't talk, but they use strategies to coordinate prices without writing anything." },
        'recercaapp.collusió_tàcita_puges_preu': { val: "💡 COL·LUSIÓ TÀCITA: Si puges el preu i l'altre et segueix, bé. Si no et segueix, baixes de nou. Amb el temps, convergiu. No cal conspirar: els incentius us porten allà. Per això la competència perfecta és rara i els mercats necessiten reguladors atents.", es: "💡 COLUSIÓN TÁCITA: Si subes el precio y el otro te sigue, bien. Si no te sigue, bajas de nuevo. Con el tiempo, convergéis. No hace falta conspirar: los incentivos os llevan allí. Por eso la competencia perfecta es rara.", en: "💡 TACIT COLLUSION: If you raise price and the other follows, good. If not, you lower again. Over time, you converge. No conspiracy needed: incentives lead you there. That's why perfect competition is rare." },
        'recercaapp.lexperiment_dictador_som_naturalment': { val: "L'experiment del dictador: Som naturalment generosos?", es: "El experimento del dictador: ¿Somos naturalmente generosos?", en: "The dictator game: Are we naturally generous?" },
        'recercaapp.persona_rep_10_pot': { val: "Una persona rep 10€ i pot donar el que vulgui a un desconegut (que no pot rebutjar). La teoria econòmica diu que hauria de donar 0€. De mitjana, la gent dóna 2-3€.", es: "Una persona recibe 10€ y puede dar lo que quiera a un desconocido (que no puede rechazar). La teoría económica dice que debería dar 0€. De media, la gente da 2-3€.", en: "A person gets €10 and can give whatever they want to a stranger (who can't reject). Economic theory says they should give €0. On average, people give €2-3." },
        'recercaapp.lhomo_economicus_existeix_models': { val: "💡 L'HOMO ECONOMICUS NO EXISTEIX: Els models clàssics assumeixen egoisme total, però la gent té preferències socials (justícia, reciprocitat, culpa). L'economia conductual incorpora això. No som àngels ni dimonis: som humans complicats.", es: "💡 EL HOMO ECONOMICUS NO EXISTE: Los modelos clásicos asumen egoísmo total, pero la gente tiene preferencias sociales (justicia, reciprocidad, culpa). La economía conductual incorpora esto. No somos ángeles ni demonios: somos humanos complicados.", en: "💡 HOMO ECONOMICUS DOESN'T EXIST: Classic models assume total selfishness, but people have social preferences (fairness, reciprocity, guilt). Behavioral economics incorporates this. We're not angels or demons: we're complicated humans." },
        'recercaapp.introducció_perfecta_leconomia_principiants': { val: "Introducció perfecta a l'economia per a principiants. Chang desmunta mites i explica conceptes complexos amb humor.", es: "Introducción perfecta a la economía para principiantes. Chang desmonta mitos y explica conceptos complejos con humor.", en: "Perfect economics intro for beginners. Chang debunks myths and explains complex concepts with humor." },
        'recercaapp.comença_aquí_saps_res': { val: "📖 COMENÇA AQUÍ si no saps res d'economia. Llegible en un cap de setmana.", es: "📖 EMPIEZA AQUÍ si no sabes nada de economía.", en: "📖 START HERE if you know nothing about economics." },
        'recercaapp.economia_explicada_través_vida': { val: "Economia explicada a través de la vida quotidiana. Per què fem cua, per què el cinema és car, per què existeixen els bancs...", es: "Economía explicada a través de la vida cotidiana. Por qué hacemos cola, por qué el cine es caro, por qué existen los bancos...", en: "Economics through daily life. Why we queue, why cinema is expensive, why banks exist..." },
        'recercaapp.molt_entretingut_veuràs_economia': { val: "📖 Molt entretingut. Veuràs economia a tot arreu després de llegir-lo.", es: "📖 Muy entretenido. Verás economía en todas partes después de leerlo.", en: "📖 Very entertaining. You'll see economics everywhere after." },
        'recercaapp.esdeveniments_improbables_però_dimpacte': { val: "Esdeveniments improbables però d'impacte enorme (crisi 2008, COVID). Per què no podem predir-los i com preparar-nos.", es: "Eventos improbables pero de impacto enorme (crisis 2008, COVID). Por qué no podemos predecirlos y cómo prepararnos.", en: "Improbable but huge-impact events (2008 crisis, COVID). Why we can't predict them and how to prepare." },
        'recercaapp.et_canviarà_penses_sobre': { val: "📖 Et canviarà com penses sobre risc i incertesa. Lectura obligatòria post-COVID.", es: "📖 Te cambiará cómo piensas sobre riesgo e incertidumbre.", en: "📖 Will change how you think about risk and uncertainty." },
        'recercaapp.continuació_cisne_negro_només': { val: "Continuació del Cisne Negro. No només sobreviure als xocs, sinó beneficiar-se'n. Sistemes que milloren amb l'estrès.", es: "Continuación del Cisne Negro. No solo sobrevivir a los shocks, sino beneficiarse. Sistemas que mejoran con el estrés.", en: "Sequel to Black Swan. Not just surviving shocks, but benefiting. Systems that improve with stress." },
        'recercaapp.aplicable_inversions_carrera_professional': { val: "📖 Aplicable a inversions, carrera professional i vida. Concepte transformador.", es: "📖 Aplicable a inversiones, carrera y vida. Concepto transformador.", en: "📖 Applicable to investments, career and life. Transformative concept." },
        'recercaapp.clàssic_liberal_1946_leconomia': { val: "Clàssic liberal de 1946. L'economia és veure les conseqüències no òbvies de les polítiques per a TOTHOM, no només els beneficiaris directes.", es: "Clásico liberal de 1946. La economía es ver las consecuencias no obvias de las políticas para TODOS, no solo los beneficiarios directos.", en: "1946 liberal classic. Economics is seeing non-obvious consequences of policies for EVERYONE, not just direct beneficiaries." },
        'recercaapp.perspectiva_lliure_mercat_llegeixlo': { val: "📖 Perspectiva de lliure mercat. Llegeix-lo i després compara amb Piketty per equilibrar.", es: "📖 Perspectiva de libre mercado. Léelo y compara con Piketty para equilibrar.", en: "📖 Free market perspective. Read it then compare with Piketty to balance." },
        'recercaapp.economia_segle_xxi_cal': { val: "Economia per al segle XXI: cal créixer dins dels límits ecològics i per sobre del mínim social. El 'dònut' com a model.", es: "Economía para el siglo XXI: hay que crecer dentro de los límites ecológicos y por encima del mínimo social. El 'donut' como modelo.", en: "21st century economics: grow within ecological limits and above social minimum. The 'doughnut' as model." },
        'recercaapp.alternativa_model_creixement_infinit': { val: "📖 Alternativa al model de creixement infinit. Visualment poderós i ben argumentat.", es: "📖 Alternativa al modelo de crecimiento infinito. Visualmente poderoso.", en: "📖 Alternative to infinite growth model. Visually powerful." },
        'recercaapp.economia_aplicada_preguntes_estranyes': { val: "Economia aplicada a preguntes estranyes: per què baixen els delictes? (avortament). Per què fan trampa els luchadors de sumo? (incentius).", es: "Economía aplicada a preguntas extrañas: ¿por qué bajan los delitos? (aborto). ¿Por qué hacen trampa los luchadores de sumo? (incentivos).", en: "Economics applied to weird questions: why did crime drop? (abortion). Why do sumo wrestlers cheat? (incentives)." },
        'recercaapp.llibre_va_fer_leconomia': { val: "📖 El llibre que va fer l'economia 'cool'. Perfecte per començar a pensar com economista.", es: "📖 El libro que hizo la economía 'cool'. Perfecto para empezar a pensar como economista.", en: "📖 The book that made economics 'cool'. Perfect to start thinking like an economist." },
        'recercaapp.què_starbucks_cobra_tant': { val: "Per què Starbucks cobra tant pel cafè? Per què els pobres paguen més? Economia invisible de la vida diària.", es: "¿Por qué Starbucks cobra tanto por el café? ¿Por qué los pobres pagan más? Economía invisible de la vida diaria.", en: "Why does Starbucks charge so much for coffee? Why do poor people pay more? Invisible economics of daily life." },
        'recercaapp.descobriràs_tot_té_preu': { val: "📖 Descobriràs que tot té un preu i una lògica. Molt amè.", es: "📖 Descubrirás que todo tiene un precio y una lógica. Muy ameno.", en: "📖 You'll discover everything has a price and logic. Very enjoyable." },
        'recercaapp.què_pobres_prenen_decisions': { val: "Per què els pobres prenen decisions que semblen irracionals? Perquè responen als seus incentius reals, no als que nosaltres imaginem.", es: "¿Por qué los pobres toman decisiones que parecen irracionales? Porque responden a sus incentivos reales, no a los que nosotros imaginamos.", en: "Why do poor people make seemingly irrational decisions? Because they respond to their real incentives, not what we imagine." },
