// =====================================================================
// UTILITY FUNCTIONS
// =====================================================================

function rollDice() {
    return Math.floor(Math.random() * 6) + 1;
}

function getTerritoriesByFaction(territories, factionIdx) {
    var result = [];
    TERRITORY_KEYS.forEach(function(key) {
        if (territories[key] && territories[key].faction === factionIdx) {
            result.push(key);
        }
    });
    return result;
}

function countTerritories(territories, factionIdx) {
    return getTerritoriesByFaction(territories, factionIdx).length;
}

function totalUnits(territories, factionIdx) {
    var sum = 0;
    TERRITORY_KEYS.forEach(function(key) {
        if (territories[key] && territories[key].faction === factionIdx) {
            sum += territories[key].units;
        }
    });
    return sum;
}

function getContinentBonuses(territories, factionIdx) {
    var bonus = 0;
    Object.keys(CONTINENTS).forEach(function(cKey) {
        var cont = CONTINENTS[cKey];
        var ownsAll = cont.territories.every(function(tKey) {
            return territories[tKey] && territories[tKey].faction === factionIdx;
        });
        if (ownsAll) bonus += cont.bonus;
    });
    return bonus;
}

function getControlledContinents(territories, factionIdx) {
    var controlled = [];
    Object.keys(CONTINENTS).forEach(function(cKey) {
        var cont = CONTINENTS[cKey];
        var ownsAll = cont.territories.every(function(tKey) {
            return territories[tKey] && territories[tKey].faction === factionIdx;
        });
        if (ownsAll) controlled.push(cKey);
    });
    return controlled;
}

function calculateReinforcements(territories, factionIdx, noContBonus) {
    var tCount = countTerritories(territories, factionIdx);
    var base = Math.max(3, Math.floor(tCount / 3));
    var contBonus = noContBonus ? 0 : getContinentBonuses(territories, factionIdx);
    return base + contBonus;
}

function isAdjacent(t1, t2) {
    return TERRITORIES[t1] && TERRITORIES[t1].adjacent.indexOf(t2) !== -1;
}

function isFactionEliminated(territories, factionIdx) {
    return countTerritories(territories, factionIdx) === 0;
}

function checkVictory(territories) {
    for (var i = 0; i < 4; i++) {
        if (countTerritories(territories, i) >= 18) return i;
    }
    var alive = [];
    for (var j = 0; j < 4; j++) {
        if (countTerritories(territories, j) > 0) alive.push(j);
    }
    if (alive.length === 1) return alive[0];
    return -1;
}

function getWinnerByTerritories(territories) {
    var best = -1;
    var bestCount = 0;
    for (var i = 0; i < 4; i++) {
        var c = countTerritories(territories, i);
        if (c > bestCount) { bestCount = c; best = i; }
    }
    return best;
}

function createInitialTerritories() {
    var terrs = {};
    FACTIONS.forEach(function(faction, idx) {
        var dist = INITIAL_DISTRIBUTION[faction.id];
        dist.forEach(function(tKey) {
            terrs[tKey] = { faction: idx, units: 3 };
        });
    });
    return terrs;
}

function createInitialGameState() {
    return {
        round: 1,
        maxRounds: 15,
        phase: 'event',
        currentPlayer: 0,
        playerOrder: [0, 1, 2, 3],
        territories: createInitialTerritories(),
        reinforcements: { available: 0, placed: {} },
        currentEvent: null,
        combatLog: [],
        eliminated: [],
        factionPowerUsed: {},
        extraAttacks: 0,
        peaceEurope: false,
        noContBonus: false,
        nonAdjacentUsed: false,
        fortifyDone: false,
        finished: false,
        winner: -1,
        history: []
    };
}

// =====================================================================
// AI LOGIC (simple for unfilled factions)
// =====================================================================
function aiReinforce(territories, factionIdx, available) {
    var myTerrs = getTerritoriesByFaction(territories, factionIdx);
    if (myTerrs.length === 0) return territories;
    var newTerrs = JSON.parse(JSON.stringify(territories));
    // Find territories adjacent to enemies (frontline), reinforce those
    var frontline = myTerrs.filter(function(t) {
        return TERRITORIES[t].adjacent.some(function(adj) {
            return newTerrs[adj] && newTerrs[adj].faction !== factionIdx;
        });
    });
    var targets = frontline.length > 0 ? frontline : myTerrs;
    for (var i = 0; i < available; i++) {
        var t = targets[Math.floor(Math.random() * targets.length)];
        newTerrs[t].units += 1;
    }
    return newTerrs;
}

function aiAttack(territories, factionIdx) {
    var newTerrs = JSON.parse(JSON.stringify(territories));
    var log = [];
    var maxAttacks = 5;
    var attacks = 0;
    while (attacks < maxAttacks) {
        var myTerrs = getTerritoriesByFaction(newTerrs, factionIdx).filter(function(t) {
            return newTerrs[t].units >= 2;
        });
        if (myTerrs.length === 0) break;
        var validAttacks = [];
        myTerrs.forEach(function(t) {
            TERRITORIES[t].adjacent.forEach(function(adj) {
                if (newTerrs[adj] && newTerrs[adj].faction !== factionIdx) {
                    validAttacks.push({ from: t, to: adj });
                }
            });
        });
        // Prefer attacking weaker territories
        validAttacks.sort(function(a, b) { return newTerrs[a.to].units - newTerrs[b.to].units; });
        if (validAttacks.length === 0) break;
        var chosen = validAttacks[0];
        if (newTerrs[chosen.from].units <= newTerrs[chosen.to].units + 1 && Math.random() > 0.3) break;
        var result = resolveCombat(newTerrs[chosen.from].units, newTerrs[chosen.to].units, factionIdx, newTerrs[chosen.to].faction);
        newTerrs[chosen.from].units -= result.attackerLoss;
        newTerrs[chosen.to].units -= result.defenderLoss;
        if (newTerrs[chosen.to].units <= 0) {
            newTerrs[chosen.to].faction = factionIdx;
            var movedUnits = Math.min(newTerrs[chosen.from].units - 1, 2);
            newTerrs[chosen.to].units = Math.max(1, movedUnits);
            newTerrs[chosen.from].units -= (movedUnits > 0 ? movedUnits : 0);
            if (newTerrs[chosen.from].units < 1) newTerrs[chosen.from].units = 1;
        }
        log.push(FACTIONS[factionIdx].emoji + ' ' + FACTIONS[factionIdx].name + ' ataca ' + TERRITORIES[chosen.to].name + ' des de ' + TERRITORIES[chosen.from].name);
        attacks++;
    }
    return { territories: newTerrs, log: log };
}

function resolveCombat(attackerUnits, defenderUnits, attackerFaction, defenderFaction) {
    var numAttackDice = Math.min(3, attackerUnits - 1);
    var numDefendDice = Math.min(2, defenderUnits);
    if (numAttackDice <= 0) return { attackerLoss: 0, defenderLoss: 0, attackDice: [], defendDice: [] };
    var attackDice = [];
    for (var a = 0; a < numAttackDice; a++) attackDice.push(rollDice());
    var defendDice = [];
    for (var d = 0; d < numDefendDice; d++) defendDice.push(rollDice());
    // Austrian bonus: defender gets +1 to highest die
    if (defenderFaction !== undefined && FACTIONS[defenderFaction] && FACTIONS[defenderFaction].id === 'austrics') {
        defendDice.sort(function(x, y) { return y - x; });
        defendDice[0] = Math.min(6, defendDice[0] + 1);
    }
    attackDice.sort(function(x, y) { return y - x; });
    defendDice.sort(function(x, y) { return y - x; });
    var attackerLoss = 0;
    var defenderLoss = 0;
    var comparisons = Math.min(attackDice.length, defendDice.length);
    for (var c = 0; c < comparisons; c++) {
        if (attackDice[c] > defendDice[c]) {
            defenderLoss++;
        } else {
            attackerLoss++;
        }
    }
    return { attackerLoss: attackerLoss, defenderLoss: defenderLoss, attackDice: attackDice, defendDice: defendDice };
}

// =====================================================================
// APPLY EVENT
// =====================================================================
function applyEvent(event, territories, currentPlayer) {
    var newTerrs = JSON.parse(JSON.stringify(territories));
    var info = '';
    switch (event.effect) {
        case 'lose_units_max':
            for (var f = 0; f < 4; f++) {
                var maxT = null;
                var maxU = 0;
                TERRITORY_KEYS.forEach(function(k) {
                    if (newTerrs[k].faction === f && newTerrs[k].units > maxU) { maxU = newTerrs[k].units; maxT = k; }
                });
                if (maxT) newTerrs[maxT].units = Math.max(1, newTerrs[maxT].units - event.amount);
            }
            info = 'Tots perden unitats del seu territori mes fort.';
            break;
        case 'sanctions_leader':
            var leader = getWinnerByTerritories(newTerrs);
            var leaderTerrs = getTerritoriesByFaction(newTerrs, leader);
            var toRemove = event.amount;
            while (toRemove > 0 && leaderTerrs.length > 0) {
                var t = leaderTerrs[Math.floor(Math.random() * leaderTerrs.length)];
                if (newTerrs[t].units > 1) { newTerrs[t].units--; toRemove--; }
                else { leaderTerrs = leaderTerrs.filter(function(x) { return x !== t; }); }
            }
            info = FACTIONS[leader].name + ' reben sancions.';
            break;
        case 'continent_bonus':
            for (var fb = 0; fb < 4; fb++) {
                var controlled = getControlledContinents(newTerrs, fb);
                if (controlled.length > 0) {
                    var fTerrs = getTerritoriesByFaction(newTerrs, fb);
                    if (fTerrs.length > 0) {
                        var target = fTerrs[Math.floor(Math.random() * fTerrs.length)];
                        newTerrs[target].units += event.amount;
                        info += FACTIONS[fb].name + ' guanyen +' + event.amount + '. ';
                    }
                }
            }
            if (!info) info = 'Cap jugador controla un continent sencer.';
            break;
        case 'no_continent_bonus':
            info = 'Recessio: sense bonus de continent aquest torn.';
            break;
        case 'help_weakest':
            var weakest = 0;
            var weakCount = 999;
            for (var fw = 0; fw < 4; fw++) {
                var c = countTerritories(newTerrs, fw);
                if (c > 0 && c < weakCount) { weakCount = c; weakest = fw; }
            }
            var wTerrs = getTerritoriesByFaction(newTerrs, weakest);
            if (wTerrs.length > 0) {
                var wTarget = wTerrs[Math.floor(Math.random() * wTerrs.length)];
                newTerrs[wTarget].units += event.amount;
            }
            info = FACTIONS[weakest].name + ' reben ajuda tecnologica.';
            break;
        case 'help_two_weakest':
            var counts = [];
            for (var fh = 0; fh < 4; fh++) counts.push({ f: fh, c: countTerritories(newTerrs, fh) });
            counts.sort(function(a, b) { return a.c - b.c; });
            var helped = counts.filter(function(x) { return x.c > 0; }).slice(0, 2);
            helped.forEach(function(h) {
                var hTerrs = getTerritoriesByFaction(newTerrs, h.f);
                if (hTerrs.length > 0) {
                    var ht = hTerrs[Math.floor(Math.random() * hTerrs.length)];
                    newTerrs[ht].units += event.amount;
                }
            });
            info = 'Alianca temporal activa.';
            break;
        case 'inflation_penalty':
            TERRITORY_KEYS.forEach(function(k) {
                if (newTerrs[k].units >= 3) newTerrs[k].units -= 1;
            });
            info = 'Hiperinflacio redueix tropes!';
            break;
        case 'humanitarian_aid':
            TERRITORY_KEYS.forEach(function(k) {
                if (newTerrs[k].units === 1) newTerrs[k].units += 1;
            });
            info = 'Ajuda humanitaria: +1 als mes debils.';
            break;
        case 'extra_attacks':
            info = 'El jugador actual te 2 atacs extra.';
            break;
        case 'industrial_revolution':
            for (var fi = 0; fi < 4; fi++) {
                var tc = countTerritories(newTerrs, fi);
                var bonus = Math.floor(tc / 3);
                if (bonus > 0) {
                    var fiTerrs = getTerritoriesByFaction(newTerrs, fi);
                    if (fiTerrs.length > 0) {
                        var fiTarget = fiTerrs[Math.floor(Math.random() * fiTerrs.length)];
                        newTerrs[fiTarget].units += bonus;
                    }
                }
            }
            info = 'Revolucio industrial: mes unitats per territori.';
            break;
        case 'wealth_transfer':
            var richest = getWinnerByTerritories(newTerrs);
            var poorest = 0;
            var poorCount = 999;
            for (var fp = 0; fp < 4; fp++) {
                var pc = countTerritories(newTerrs, fp);
                if (pc > 0 && pc < poorCount) { poorCount = pc; poorest = fp; }
            }
            if (richest !== poorest) {
                var rTerrs = getTerritoriesByFaction(newTerrs, richest);
                var pTerrs = getTerritoriesByFaction(newTerrs, poorest);
                var transferred = 0;
                for (var ti = 0; ti < rTerrs.length && transferred < event.amount; ti++) {
                    if (newTerrs[rTerrs[ti]].units > 1) {
                        newTerrs[rTerrs[ti]].units--;
                        transferred++;
                    }
                }
                if (pTerrs.length > 0) {
                    var pTarget = pTerrs[Math.floor(Math.random() * pTerrs.length)];
                    newTerrs[pTarget].units += transferred;
                }
            }
            info = 'Transferencia de riquesa completada.';
            break;
        case 'peace_europe':
            info = 'Pacte de no agressio: Europa protegida.';
            break;
        case 'peace_continents':
            info = 'Acord comercial: dos continents protegits.';
            break;
        case 'spring_bonus':
            for (var fs = 0; fs < 4; fs++) {
                var sTerrs = getTerritoriesByFaction(newTerrs, fs);
                if (sTerrs.length > 0) {
                    var sTarget = sTerrs[Math.floor(Math.random() * sTerrs.length)];
                    newTerrs[sTarget].units += event.amount;
                }
            }
            info = 'Primavera economica: tots reben unitats!';
            break;
        case 'financial_crisis':
            var crisisContinents = ['northAmerica', 'europe'];
            crisisContinents.forEach(function(cc) {
                CONTINENTS[cc].territories.forEach(function(tKey) {
                    if (newTerrs[tKey].units > 1) newTerrs[tKey].units -= 1;
                });
            });
            info = 'Crisi financera afecta Europa i America del Nord.';
            break;
        default:
            info = 'Event aplicat.';
    }
    return { territories: newTerrs, info: info };
}

// =====================================================================
// DICE DISPLAY COMPONENT
// =====================================================================
function DiceFace({ value, color, size }) {
    var sz = size || 50;
    var bgColor = color || '#ffffff';
    var dotColor = color === '#ef4444' || color === '#3b82f6' ? '#ffffff' : '#1f2937';
    if (bgColor === '#ffffff') dotColor = '#1f2937';

    var dotPositions = {
        1: [[50,50]],
        2: [[25,25],[75,75]],
        3: [[25,25],[50,50],[75,75]],
        4: [[25,25],[75,25],[25,75],[75,75]],
        5: [[25,25],[75,25],[50,50],[25,75],[75,75]],
        6: [[25,25],[75,25],[25,50],[75,50],[25,75],[75,75]]
    };
    var dots = dotPositions[value] || dotPositions[1];

    return (
        <svg width={sz} height={sz} viewBox="0 0 100 100">
            <rect x="5" y="5" width="90" height="90" rx="15" fill={bgColor} stroke="#374151" strokeWidth="2" />
            {dots.map(function(pos, i) {
                return <circle key={i} cx={pos[0]} cy={pos[1]} r="8" fill={dotColor} />;
            })}
        </svg>
    );
}

// =====================================================================
// SVG MAP COMPONENT
// =====================================================================
function GameMap({ territories, selectedTerritory, validTargets, onTerritoryClick, phase, currentFaction }) {
    // Draw connection lines between adjacent territories
    var drawnLines = {};
    var connections = [];
    TERRITORY_KEYS.forEach(function(tKey) {
        var t = TERRITORIES[tKey];
        t.adjacent.forEach(function(adjKey) {
            var lineKey = [tKey, adjKey].sort().join('-');
            if (!drawnLines[lineKey]) {
                drawnLines[lineKey] = true;
                var adj = TERRITORIES[adjKey];
                // Skip very long lines (cross-ocean) for aesthetics, but still allow clicks
                var dist = Math.sqrt(Math.pow(t.cx - adj.cx, 2) + Math.pow(t.cy - adj.cy, 2));
                if (dist < 350) {
                    connections.push({ from: tKey, to: adjKey, x1: t.cx, y1: t.cy, x2: adj.cx, y2: adj.cy });
                }
            }
        });
    });

    return (
        <svg viewBox="0 0 800 470" className="w-full h-auto rounded-2xl" style={{ background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%)' }}>
            {/* Ocean background */}
            <defs>
                <radialGradient id="ocean" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" stopColor="#1e3a5f" stopOpacity="0.3" />
                    <stop offset="100%" stopColor="#0f172a" stopOpacity="0.1" />
                </radialGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
                <filter id="selectedGlow">
                    <feGaussianBlur stdDeviation="5" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
            </defs>
            <rect width="800" height="470" fill="url(#ocean)" />

            {/* Connection lines */}
            {connections.map(function(conn) {
                var isHighlighted = (selectedTerritory === conn.from || selectedTerritory === conn.to) &&
                    (validTargets && (validTargets.indexOf(conn.from) !== -1 || validTargets.indexOf(conn.to) !== -1));
                return (
                    <line key={conn.from + '-' + conn.to}
                        x1={conn.x1} y1={conn.y1} x2={conn.x2} y2={conn.y2}
                        stroke={isHighlighted ? '#fbbf24' : 'rgba(148,163,184,0.15)'}
                        strokeWidth={isHighlighted ? 2 : 1}
                        strokeDasharray={isHighlighted ? '' : '4,4'} />
                );
            })}

            {/* Territory shapes */}
            {TERRITORY_KEYS.map(function(tKey) {
                var t = TERRITORIES[tKey];
                var tState = territories[tKey];
                if (!tState) return null;
                var faction = FACTIONS[tState.faction];
                var isSelected = selectedTerritory === tKey;
                var isTarget = validTargets && validTargets.indexOf(tKey) !== -1;
                var isOwn = tState.faction === currentFaction;
                var path = TERRITORY_PATHS[tKey];
                var fillColor = faction.color;
                var fillOpacity = isSelected ? 0.9 : isTarget ? 0.7 : 0.5;
                var strokeColor = isSelected ? '#fbbf24' : isTarget ? '#ef4444' : faction.color;
                var strokeWidth = isSelected ? 3 : isTarget ? 2.5 : 1;

                return (
                    <g key={tKey}
                       className={isSelected ? 'territory-selected' : (isTarget || (phase === 'reinforce' && isOwn) || (phase === 'attack' && isOwn) || (phase === 'fortify' && isOwn)) ? 'territory-hover' : ''}
                       onClick={function() { if (onTerritoryClick) onTerritoryClick(tKey); }}
                       style={{ cursor: (onTerritoryClick && (isTarget || isOwn || phase === 'reinforce')) ? 'pointer' : 'default' }}>
                        <path d={path} fill={fillColor} fillOpacity={fillOpacity}
                            stroke={strokeColor} strokeWidth={strokeWidth}
                            filter={isSelected ? 'url(#selectedGlow)' : isTarget ? 'url(#glow)' : ''} />
                        {/* Unit count circle */}
                        <circle cx={t.cx} cy={t.cy} r="14" fill={faction.color} stroke="#ffffff" strokeWidth="2"
                            filter={isSelected ? 'url(#selectedGlow)' : ''} />
                        <text x={t.cx} y={t.cy + 1} textAnchor="middle" dominantBaseline="central"
                            fill="white" fontSize="11" fontWeight="900" fontFamily="Plus Jakarta Sans">
                            {tState.units}
                        </text>
                        {/* Territory name */}
                        <text x={t.cx} y={t.cy - 20} textAnchor="middle" dominantBaseline="central"
                            fill="rgba(255,255,255,0.85)" fontSize="7" fontWeight="600" fontFamily="Plus Jakarta Sans">
                            {t.name}
                        </text>
                    </g>
                );
            })}

            {/* Continent labels */}
            <text x="150" y="30" textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize="9" fontWeight="700">AM. NORD (+5)</text>
            <text x="195" y="275" textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize="9" fontWeight="700">AM. SUD (+3)</text>
            <text x="465" y="45" textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize="9" fontWeight="700">EUROPA (+5)</text>
            <text x="440" y="295" textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize="9" fontWeight="700">AFRICA (+3)</text>
            <text x="640" y="100" textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize="9" fontWeight="700">ASIA (+7)</text>
            <text x="720" y="380" textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize="9" fontWeight="700">OCEANIA (+2)</text>
        </svg>
    );
}

    return (
        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">

                        </p>

                        <div className="flex justify-center gap-1">
                            {combat.result.attackDice.map(function(d, i) {

                            })}
                        </div>

                    </div>
                    {/* VS */}
                    <div className="text-3xl font-black text-gray-500">VS</div>
                    {/* Defender */}
                    <div className="flex-1 space-y-2">
                        <p className="font-bold text-lg" style={{ color: defFaction.color }}>
                            {defFaction.emoji} {defFaction.name}
                        </p>
                        <p className="text-gray-500 text-sm">{TERRITORIES[combat.to].name}</p>
                        <div className="flex justify-center gap-1">
                            {combat.result.defendDice.map(function(d, i) {
                                return <DiceFace key={i} value={d} color={defFaction.color} size={45} />;

                        <p className="text-red-400 text-sm font-bold">-{combat.result.defenderLoss} unitat{combat.result.defenderLoss !== 1 ? 's' : ''}</p>

                </div>
                {combat.conquered && (
                    <div className="bg-green-900/50 rounded-xl p-3">
                        <p className="text-green-400 font-bold text-lg">Territori Conquistat!</p>
                    </div>
                )}
                <button onClick={onClose}
                    className="w-full py-3 rounded-xl bg-gray-700 text-white font-bold hover:bg-gray-600 btn-risk">
                    Continuar
                </button>
            </div>
        </div>
    );
}

// =====================================================================
// HOST GAME VIEW
// =====================================================================
function HostGameView({ roomCode, playerId, players, initialGameState }) {
    const [gameState, setGameState] = useState(function() {
        return initialGameState || createInitialGameState();
    });
    const [showEvent, setShowEvent] = useState(null);
    const [combatResult, setCombatResult] = useState(null);
    const [combatLog, setCombatLog] = useState([]);
    const [aiProcessing, setAiProcessing] = useState(false);

    // Determine which factions are human vs AI
    var playerIds = Object.keys(players).filter(function(id) { return players[id].connected !== false; });
    var factionAssignment = {};
    playerIds.forEach(function(pid, idx) {
        factionAssignment[pid] = idx % 4;
    });
    var humanFactions = {};
    Object.values(factionAssignment).forEach(function(f) { humanFactions[f] = true; });
    var isAI = function(fIdx) { return !humanFactions[fIdx]; };

    // Sync game state to Firebase
    useEffect(function() {
        if (roomCode) {
            PdeRoomManager.setGameState(roomCode, gameState);
        }
    }, [gameState]);

    // Listen to player actions
    useEffect(function() {
        if (!roomCode) return;
        var unsub = PdeRoomManager.onGameStateChange(roomCode, function(state) {
            if (state && state.playerAction) {
                handlePlayerAction(state.playerAction);
                // Clear the action
                PdeRoomManager.updateGameState(roomCode, { playerAction: null });
            }
        });
        return unsub;
    }, [roomCode]);

    var gs = gameState;
    var currentFactionIdx = gs.playerOrder[gs.currentPlayer];
    var currentFaction = FACTIONS[currentFactionIdx];

    function addLog(msg) {
        setCombatLog(function(prev) { return [msg].concat(prev).slice(0, 30); });
    }

    function handlePlayerAction(action) {
        if (!action || !action.type) return;
        switch (action.type) {
            case 'reinforce':
                if (gs.phase === 'reinforce' && action.territory && gs.territories[action.territory] &&
                    gs.territories[action.territory].faction === currentFactionIdx && gs.reinforcements.available > 0) {
                    setGameState(function(prev) {
                        var newTerrs = JSON.parse(JSON.stringify(prev.territories));
                        newTerrs[action.territory].units += 1;
                        var placed = JSON.parse(JSON.stringify(prev.reinforcements.placed || {}));
                        placed[action.territory] = (placed[action.territory] || 0) + 1;
                        return Object.assign({}, prev, {
                            territories: newTerrs,
                            reinforcements: { available: prev.reinforcements.available - 1, placed: placed }
                        });
                    });
                }
                break;
            case 'attack':
                performAttack(action.from, action.to);
                break;
            case 'end_attacks':
                advancePhase();
                break;
            case 'fortify':
                performFortify(action.from, action.to, action.amount);
                break;
            case 'end_fortify':
                advancePhase();
                break;
        }
    }

    function startTurn() {
        // Draw event
        var eventIdx = Math.floor(Math.random() * EVENT_CARDS.length);
        var event = EVENT_CARDS[eventIdx];
        setShowEvent(event);
        setGameState(function(prev) {
            return Object.assign({}, prev, {
                phase: 'event',
                currentEvent: event,
                factionPowerUsed: {},
                nonAdjacentUsed: false,
                fortifyDone: false,
                peaceEurope: event.effect === 'peace_europe',
                noContBonus: event.effect === 'no_continent_bonus',
                extraAttacks: event.effect === 'extra_attacks' ? event.amount : 0
            });
        });
    }

    function applyCurrentEvent() {
        var event = showEvent;
        setShowEvent(null);
        if (!event) return;
        var result = applyEvent(event, gs.territories, gs.currentPlayer);
        addLog('Event: ' + event.title + ' - ' + result.info);
        // Move to reinforce phase
        var reinforceCount = calculateReinforcements(result.territories, currentFactionIdx, gs.noContBonus);
        // Keynesian power: +2 every 3 rounds
        if (currentFaction.id === 'keynesians' && gs.round % 3 === 0) {
            reinforceCount += 2;
            addLog(currentFaction.emoji + ' Estimul Fiscal: +2 unitats extra!');
        }
        setGameState(function(prev) {
            return Object.assign({}, prev, {
                phase: 'reinforce',
                territories: result.territories,
                reinforcements: { available: reinforceCount, placed: {} },
                currentEvent: null
            });
        });
        // If AI, process automatically
        if (isAI(currentFactionIdx)) {
            setTimeout(function() { processAITurn(result.territories, reinforceCount); }, 1000);
        }
    }

    function processAITurn(territories, reinforceCount) {
        setAiProcessing(true);
        // 1. Reinforce
        var afterReinforce = aiReinforce(territories || gs.territories, currentFactionIdx, reinforceCount || 0);
        addLog(currentFaction.emoji + ' ' + currentFaction.name + ' (IA) desplega reforcos.');
        // 2. Attack
        setTimeout(function() {
            var attackResult = aiAttack(afterReinforce, currentFactionIdx);
            attackResult.log.forEach(function(l) { addLog(l); });
            setGameState(function(prev) {
                return Object.assign({}, prev, {
                    territories: attackResult.territories,
                    reinforcements: { available: 0, placed: {} },
                    phase: 'fortify'
                });
            });
            // 3. Skip fortify, advance
            setTimeout(function() {
                setAiProcessing(false);
                advanceToNextPlayer(attackResult.territories);
            }, 500);
        }, 800);
    }

    function finishReinforce() {
        if (gs.reinforcements.available > 0) return;
        setGameState(function(prev) {
            return Object.assign({}, prev, { phase: 'attack' });
        });
    }

    function performAttack(from, to) {
        if (!from || !to) return;
        var terrs = gs.territories;
        if (terrs[from].faction !== currentFactionIdx) return;
        if (terrs[to].faction === currentFactionIdx) return;
        if (terrs[from].units < 2) return;
        // Adjacency check (Neoclassics can attack non-adjacent once)
        if (!isAdjacent(from, to)) {
            if (currentFaction.id === 'neoclassics' && !gs.nonAdjacentUsed) {
                setGameState(function(prev) { return Object.assign({}, prev, { nonAdjacentUsed: true }); });
            } else {
                return;
            }
        }
        // Peace Europe check
        if (gs.peaceEurope && TERRITORIES[to].continent === 'europe') {
            addLog('Pacte de no agressio: no es pot atacar Europa!');
            return;
        }
        // Marxist power: auto-conquer with 1 unit
        if (currentFaction.id === 'marxistes' && terrs[to].units === 1) {
            addLog(currentFaction.emoji + ' Revolucio! Conquesta automatica de ' + TERRITORIES[to].name);
            setGameState(function(prev) {
                var newTerrs = JSON.parse(JSON.stringify(prev.territories));
                var moveUnits = Math.min(newTerrs[from].units - 1, 2);
                newTerrs[to] = { faction: currentFactionIdx, units: Math.max(1, moveUnits) };
                newTerrs[from].units -= moveUnits;
                if (newTerrs[from].units < 1) newTerrs[from].units = 1;
                return Object.assign({}, prev, { territories: newTerrs });
            });
            PdeGameSounds.play('win');
            return;
        }
        // Normal combat
        var result = resolveCombat(terrs[from].units, terrs[to].units, currentFactionIdx, terrs[to].faction);
        var conquered = false;
        setGameState(function(prev) {
            var newTerrs = JSON.parse(JSON.stringify(prev.territories));
            newTerrs[from].units -= result.attackerLoss;
            newTerrs[to].units -= result.defenderLoss;
            if (newTerrs[to].units <= 0) {
                conquered = true;
                var moveUnits = Math.min(newTerrs[from].units - 1, 3);
                newTerrs[to] = { faction: currentFactionIdx, units: Math.max(1, moveUnits) };
                newTerrs[from].units -= moveUnits;
                if (newTerrs[from].units < 1) newTerrs[from].units = 1;
            }
            return Object.assign({}, prev, { territories: newTerrs });
        });
        var defFaction = FACTIONS[terrs[to].faction];
        addLog(currentFaction.emoji + ' ' + currentFaction.name + ' ataca ' + TERRITORIES[to].name +
            ' (' + result.attackDice.join(',') + ' vs ' + result.defendDice.join(',') + ')' +
            (conquered ? ' - CONQUISTAT!' : ''));
        setCombatResult({
            from: from, to: to,
            attackerFaction: currentFactionIdx,
            defenderFaction: terrs[to].faction,
            result: result,
            conquered: conquered
        });
        if (conquered) PdeGameSounds.play('win');
        else PdeGameSounds.play('buzz');
    }

    function performFortify(from, to, amount) {
        if (gs.fortifyDone) return;
        if (!from || !to || !amount) return;
        var terrs = gs.territories;
        if (terrs[from].faction !== currentFactionIdx || terrs[to].faction !== currentFactionIdx) return;
        if (!isAdjacent(from, to)) return;
        var maxMove = terrs[from].units - 1;
        var moveAmount = Math.min(amount, maxMove);
        if (moveAmount <= 0) return;
        setGameState(function(prev) {
            var newTerrs = JSON.parse(JSON.stringify(prev.territories));
            newTerrs[from].units -= moveAmount;
            newTerrs[to].units += moveAmount;
            return Object.assign({}, prev, { territories: newTerrs, fortifyDone: true });
        });
        addLog(currentFaction.emoji + ' Fortifica: ' + moveAmount + ' unitats de ' + TERRITORIES[from].name + ' a ' + TERRITORIES[to].name);
    }

    function advancePhase() {
        if (gs.phase === 'attack') {
            setGameState(function(prev) { return Object.assign({}, prev, { phase: 'fortify' }); });
        } else if (gs.phase === 'fortify') {
            advanceToNextPlayer(gs.territories);
        }
    }

    function advanceToNextPlayer(terrs) {
        var territories = terrs || gs.territories;
        // Check victory
        var winner = checkVictory(territories);
        if (winner !== -1) {
            setGameState(function(prev) {
                return Object.assign({}, prev, { finished: true, winner: winner, territories: territories });
            });
            PdeGameSounds.play('win');
            return;
        }
        // Next player
        var nextPlayer = gs.currentPlayer + 1;
        var nextRound = gs.round;
        if (nextPlayer >= gs.playerOrder.length) {
            nextPlayer = 0;
            nextRound++;
        }
        // Check max rounds
        if (nextRound > gs.maxRounds) {
            var winByCount = getWinnerByTerritories(territories);
            setGameState(function(prev) {
                return Object.assign({}, prev, { finished: true, winner: winByCount, territories: territories });
            });
            PdeGameSounds.play('win');
            return;
        }
        // Skip eliminated factions
        var skips = 0;
        while (isFactionEliminated(territories, gs.playerOrder[nextPlayer]) && skips < 4) {
            nextPlayer++;
            if (nextPlayer >= gs.playerOrder.length) {
                nextPlayer = 0;
                nextRound++;
            }
            skips++;
        }
        if (nextRound > gs.maxRounds) {
            var winByCount2 = getWinnerByTerritories(territories);
            setGameState(function(prev) {
                return Object.assign({}, prev, { finished: true, winner: winByCount2, territories: territories });
            });
            return;
        }
        setGameState(function(prev) {
            return Object.assign({}, prev, {
                currentPlayer: nextPlayer,
                round: nextRound,
                phase: 'event',
                territories: territories,
                reinforcements: { available: 0, placed: {} },
                factionPowerUsed: {},
                nonAdjacentUsed: false,
                fortifyDone: false,
                peaceEurope: false,
                noContBonus: false,
                extraAttacks: 0
            });
        });
        // Auto-start next turn
        setTimeout(function() { startTurn(); }, 500);
    }

    // Start first turn on mount
    useEffect(function() {
        if (gs.phase === 'event' && !gs.currentEvent && !gs.finished) {
            startTurn();
        }
    }, []);

    // ── FINISHED VIEW ──
    if (gs.finished) {
        var winnerFaction = FACTIONS[gs.winner];
        var facts = FACTION_FACTS[winnerFaction.id];
        return (
            <div className="min-h-screen p-4 md:p-8 bg-gradient-to-br from-slate-900 via-gray-900 to-zinc-950">
                <PdeConfetti show={true} />
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="text-center space-y-3">
                        <div className="text-7xl">{winnerFaction.emoji}</div>
                        <h1 className="text-4xl md:text-6xl font-black text-white">
                            {winnerFaction.name} guanyen!
                        </h1>
                        <p className="text-xl text-gray-500">"{winnerFaction.motto}"</p>
                        <p className="text-gray-500">Ronda {gs.round} de {gs.maxRounds}</p>
                    </div>
                    <div className="rounded-2xl overflow-hidden border border-gray-700">
                        <GameMap territories={gs.territories} currentFaction={gs.winner} />
                    </div>
                    <GameStats gameState={gs} />
                    {/* Educational takeaway */}
                    <div className="bg-white/10 backdrop-blur rounded-2xl p-5 space-y-3">
                        <h3 className="text-xl font-black text-white">Sabies que...?</h3>
                        {facts && facts.map(function(fact, i) {
                            return <p key={i} className="text-gray-300 text-sm">{winnerFaction.emoji} {fact}</p>;
                        })}
                    </div>
                    {/* All schools teachings */}
                    <div className="bg-white/10 backdrop-blur rounded-2xl p-5 space-y-4">
                        <h3 className="text-xl font-black text-white">Les 4 Escoles Economiques</h3>
                        {FACTIONS.map(function(f) {
                            return (
                                <div key={f.id} className="space-y-1">
                                    <p className="font-bold" style={{ color: f.color }}>{f.emoji} {f.name}</p>
                                    <div className="flex flex-wrap gap-1">
                                        {f.teachings.map(function(t, ti) {
                                            return <span key={ti} className="text-xs bg-white/10 text-gray-300 px-2 py-1 rounded-full">{t}</span>;
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="text-center">
                        <button onClick={function() { window.location.reload(); }}
                            className="px-8 py-4 rounded-2xl bg-indigo-600 text-white font-black text-xl hover:bg-indigo-500 btn-risk">
                            Nova Partida
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // ── MAIN HOST VIEW ──
    var phaseNames = {
        event: 'Esdeveniment',
        reinforce: 'Reforcos',
        attack: 'Atac',
        fortify: 'Fortificar'
    };

    return (
        <div className="min-h-screen p-3 md:p-6 bg-gradient-to-br from-slate-900 via-gray-900 to-zinc-950">
            {showEvent && <EventCardOverlay event={showEvent} onApply={applyCurrentEvent} />}
            {combatResult && <CombatOverlay combat={combatResult} onClose={function() { setCombatResult(null); }} />}

            <div className="max-w-7xl mx-auto space-y-4">
                {/* Header bar */}
                <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="flex items-center gap-3">
                        <a href="./" className="text-gray-500 hover:text-white text-sm">&#x1F393; PDE</a>
                        <span className="text-gray-700">|</span>
                        <h1 className="text-xl md:text-2xl font-black text-white">Systemic Risk</h1>
                    </div>
                    <div className="flex items-center gap-3 text-sm text-gray-500">
                        <span>Ronda {gs.round}/{gs.maxRounds}</span>
                        <span className="text-gray-700">|</span>
                        <span>Sala: <span className="font-mono font-bold text-white">{roomCode}</span></span>
                    </div>
                </div>

                {/* Current player + phase */}
                <div className="flex flex-wrap items-center justify-between gap-3 bg-white/5 rounded-2xl p-3">
                    <div className="flex items-center gap-3">
                        <span className="text-3xl">{currentFaction.emoji}</span>
                        <div>
                            <p className="font-black text-lg" style={{ color: currentFaction.color }}>
                                {currentFaction.name} {isAI(currentFactionIdx) ? '(IA)' : ''}
                            </p>
                            <p className="text-gray-500 text-sm">{currentFaction.motto}</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        {['event', 'reinforce', 'attack', 'fortify'].map(function(p) {
                            var isActive = gs.phase === p;
                            return (
                                <div key={p} className={'px-3 py-1 rounded-full text-xs font-bold ' +
                                    (isActive ? 'bg-indigo-500 text-white' : 'bg-gray-800 text-gray-500')}>
                                    {phaseNames[p]}
                                </div>
                            );
                        })}
                    </div>
                </div>

                {/* Phase-specific info bar */}
                {gs.phase === 'reinforce' && !isAI(currentFactionIdx) && (
                    <div className="bg-indigo-900/50 rounded-xl p-3 flex items-center justify-between">
                        <span className="text-indigo-200">
                            Unitats per desplegar: <span className="font-black text-xl text-white">{gs.reinforcements.available}</span>
                        </span>
                        {gs.reinforcements.available === 0 && (
                            <button onClick={finishReinforce}
                                className="px-4 py-2 rounded-xl bg-indigo-500 text-white font-bold btn-risk hover:bg-indigo-400">
                                Continuar a Atac
                            </button>
                        )}
                    </div>
                )}
                {gs.phase === 'attack' && !isAI(currentFactionIdx) && (
                    <div className="bg-red-900/50 rounded-xl p-3 flex items-center justify-between">
                        <span className="text-red-200">Fase d'atac - Selecciona territori propi i objectiu enemic</span>
                        <button onClick={advancePhase}
                            className="px-4 py-2 rounded-xl bg-red-500 text-white font-bold btn-risk hover:bg-red-400">
                            Acabar Atacs
                        </button>
                    </div>
                )}
                {gs.phase === 'fortify' && !isAI(currentFactionIdx) && (
                    <div className="bg-green-900/50 rounded-xl p-3 flex items-center justify-between">
                        <span className="text-green-200">
                            {gs.fortifyDone ? 'Fortificacio completada' : 'Pots moure unitats entre territoris adjacents'}
                        </span>
                        <button onClick={function() { advanceToNextPlayer(); }}
                            className="px-4 py-2 rounded-xl bg-green-500 text-white font-bold btn-risk hover:bg-green-400">
                            Acabar Torn
                        </button>
                    </div>
                )}
                {aiProcessing && (
                    <div className="bg-yellow-900/50 rounded-xl p-3 text-center">
                        <span className="text-yellow-200 animate-pulse font-bold">
                            {currentFaction.emoji} {currentFaction.name} (IA) esta pensant...
                        </span>
                    </div>
                )}

                {/* Main layout: Map + Sidebar */}
                <div className="grid lg:grid-cols-4 gap-4">
                    {/* Map */}
                    <div className="lg:col-span-3">
                        <div className="rounded-2xl overflow-hidden border border-gray-700 shadow-2xl">
                            <GameMap
                                territories={gs.territories}
                                phase={gs.phase}
                                currentFaction={currentFactionIdx}
                                onTerritoryClick={function(tKey) {
                                    if (isAI(currentFactionIdx)) return;
                                    // For human: send action via firebase
                                    if (gs.phase === 'reinforce') {
                                        if (gs.territories[tKey].faction === currentFactionIdx && gs.reinforcements.available > 0) {
                                            handlePlayerAction({ type: 'reinforce', territory: tKey });
                                        }
                                    }
                                }}
                            />
                        </div>
                    </div>

                    {/* Sidebar */}
                    <div className="space-y-3">
                        {/* Factions overview */}
                        {FACTIONS.map(function(f, i) {
                            var isActive = i === currentFactionIdx;
                            return (
                                <div key={f.id} className={'rounded-xl p-2 border transition-all ' +
                                    (isActive ? 'border-white/30 bg-white/10 ring-1 ring-white/20' : 'border-gray-800 bg-gray-900/50')}>
                                    <FactionCard faction={f} territories={gs.territories} factionIdx={i} compact={true} />
                                </div>
                            );
                        })}

                        {/* Combat Log */}
                        <div className="bg-gray-900/80 rounded-xl p-3 max-h-64 overflow-y-auto border border-gray-800">
                            <h4 className="text-xs font-bold text-gray-500 mb-2 uppercase">Registre de combat</h4>
                            {combatLog.length === 0 && <p className="text-gray-600 text-xs">Cap accio encara...</p>}
                            {combatLog.map(function(log, i) {
                                return <p key={i} className="text-xs text-gray-500 py-0.5 border-b border-gray-800/50">{log}</p>;
                            })}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
}

            if (state) setGameState(state);
        });
        return unsub;
    }, [roomCode]);

    if (!gs.territories) {

            </div>
        );
