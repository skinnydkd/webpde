    var currentFactionIdx = gs.playerOrder ? gs.playerOrder[gs.currentPlayer] : 0;
    var isMyTurn = currentFactionIdx === factionIdx;
    var myTerritories = getTerritoriesByFaction(gs.territories, factionIdx);
    var myUnits = totalUnits(gs.territories, factionIdx);
    var myContinents = getControlledContinents(gs.territories, factionIdx);

    function sendAction(action) {
        PdeRoomManager.updateGameState(roomCode, { playerAction: action });
    }

    // ── FINISHED ──
    if (gs.finished) {
        var isWinner = gs.winner === factionIdx;
        var winFaction = FACTIONS[gs.winner];
        return (
            <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-gray-900 p-4">
                <div className="max-w-sm w-full space-y-4 text-center">
                    <div className="text-7xl">{isWinner ? '\u{1F3C6}' : '\u{1F614}'}</div>
                    <h2 className="text-3xl font-black text-white">
                        {isWinner ? 'Has guanyat!' : winFaction.name + ' guanyen!'}
                    </h2>
                    <div className={'rounded-2xl p-4 ' + myFaction.lightBg}>
                        <p className={'font-bold ' + myFaction.textClass}>{myFaction.emoji} {myFaction.name}</p>
                        <p className="text-sm text-gray-600">Territoris finals: {myTerritories.length}</p>
                    </div>
                    {/* Educational facts */}
                    <div className="bg-white/10 backdrop-blur rounded-xl p-4 text-left space-y-2">
                        <h4 className="text-white font-bold text-sm">Sabies que...?</h4>
                        {(FACTION_FACTS[myFaction.id] || []).slice(0, 2).map(function(fact, i) {
                            return <p key={i} className="text-gray-300 text-xs">{fact}</p>;
                        })}
                    </div>
                </div>
            </div>
        );
    }

    // ── WAITING FOR MY TURN ──
    if (!isMyTurn) {
        var curFaction = FACTIONS[currentFactionIdx];
        return (
            <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-gray-900 p-4">
                <div className="max-w-sm w-full space-y-4">
                    <div className="text-center space-y-2">
                        <span className="text-4xl">{myFaction.emoji}</span>
                        <h2 className="text-xl font-black text-white">{myFaction.name}</h2>
                    </div>
                    <div className="bg-white/10 backdrop-blur rounded-xl p-4 text-center">
                        <p className="text-gray-300 text-sm">Torn actual:</p>
                        <p className="font-black text-lg" style={{ color: curFaction.color }}>
                            {curFaction.emoji} {curFaction.name}
                        </p>
                        <p className="text-gray-500 text-xs mt-1">Ronda {gs.round}/{gs.maxRounds}</p>
                    </div>
                    {/* My stats */}
                    <div className={'rounded-xl p-3 ' + myFaction.lightBg}>
                        <p className={'font-bold text-sm ' + myFaction.textClass}>Els meus territoris ({myTerritories.length})</p>
                        <div className="mt-2 flex flex-wrap gap-1">
                            {myTerritories.map(function(tKey) {
                                return (
                                    <span key={tKey} className="text-xs bg-white/70 px-2 py-0.5 rounded-full">
                                        {TERRITORIES[tKey].name} ({gs.territories[tKey].units})
                                    </span>
                                );
                            })}
                        </div>
                        {myContinents.length > 0 && (
                            <p className="text-xs text-gray-600 mt-2">
                                Continents controlats: {myContinents.map(function(c) { return CONTINENTS[c].name; }).join(', ')}
                            </p>
                        )}
                    </div>
                    {/* Faction power */}
                    <div className="bg-white/5 rounded-xl p-3 text-center">
                        <p className="text-sm text-gray-500">{myFaction.power.icon} {myFaction.power.name}</p>
                        <p className="text-xs text-gray-500">{myFaction.power.description}</p>
                    </div>
                </div>
            </div>
        );
    }

    // ── MY TURN ──
    var phaseLabel = { event: 'Esdeveniment', reinforce: 'Reforcos', attack: 'Atac', fortify: 'Fortificar' };

    return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 to-gray-900 p-4">
            <div className="max-w-sm mx-auto space-y-4">
                {/* Header */}
                <div className="text-center space-y-1">
                    <span className="text-3xl">{myFaction.emoji}</span>
                    <h2 className="text-lg font-black text-white">{myFaction.name} - El teu torn!</h2>
                    <div className="flex justify-center gap-1">
                        {['event', 'reinforce', 'attack', 'fortify'].map(function(p) {
                            return (
                                <span key={p} className={'px-2 py-0.5 rounded-full text-xs font-bold ' +
                                    (gs.phase === p ? 'text-white' : 'bg-gray-800 text-gray-600')}
                                    style={gs.phase === p ? { backgroundColor: myFaction.color } : {}}>
                                    {phaseLabel[p]}
                                </span>
                            );
                        })}
                    </div>
                </div>

                {/* EVENT PHASE */}
                {gs.phase === 'event' && (
                    <div className="bg-amber-900/30 rounded-xl p-4 text-center">
                        <p className="text-amber-200">{t('waiting_host') || "Esperant que l'amfitrio aplique l'esdeveniment..."}</p>
                    </div>
                )}

                {/* REINFORCE PHASE */}
                {gs.phase === 'reinforce' && (
                    <div className="space-y-3">
                        <div className="bg-indigo-900/50 rounded-xl p-3 text-center">
                            <p className="text-indigo-200 text-sm">Unitats disponibles</p>
                            <p className="text-3xl font-black text-white">{gs.reinforcements.available}</p>
                        </div>
                        <div className="space-y-1">
                            <p className="text-gray-500 text-xs font-bold uppercase">Toca un territori per afegir unitat:</p>
                            {myTerritories.map(function(tKey) {
                                var placed = (gs.reinforcements.placed && gs.reinforcements.placed[tKey]) || 0;
                                return (
                                    <button key={tKey}
                                        onClick={function() {
                                            if (gs.reinforcements.available > 0) {
                                                sendAction({ type: 'reinforce', territory: tKey });
                                            }
                                        }}
                                        disabled={gs.reinforcements.available <= 0}
                                        className={'w-full flex items-center justify-between px-3 py-2 rounded-lg btn-risk ' +
                                            (gs.reinforcements.available > 0
                                                ? 'bg-white/10 hover:bg-white/20 text-white'
                                                : 'bg-gray-800 text-gray-600 cursor-not-allowed')}>
                                        <span className="font-bold text-sm">{TERRITORIES[tKey].name}</span>
                                        <span className="flex items-center gap-2">
                                            {placed > 0 && <span className="text-green-400 text-xs">+{placed}</span>}
                                            <span className="bg-white/20 rounded-full w-7 h-7 flex items-center justify-center font-black text-sm">
                                                {gs.territories[tKey].units}
                                            </span>
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                )}

                {/* ATTACK PHASE */}
                {gs.phase === 'attack' && (
                    <div className="space-y-3">
                        {/* Select source */}
                        <div>
                            <p className="text-gray-500 text-xs font-bold uppercase mb-1">1. Selecciona territori atacant:</p>
                            <div className="space-y-1 max-h-40 overflow-y-auto">
                                {myTerritories.filter(function(t) { return gs.territories[t].units >= 2; }).map(function(tKey) {
                                    var isSelected = selectedSource === tKey;
                                    return (
                                        <button key={tKey}
                                            onClick={function() { setSelectedSource(tKey); setSelectedTarget(null); }}
                                            className={'w-full flex items-center justify-between px-3 py-2 rounded-lg btn-risk text-sm ' +
                                                (isSelected ? 'ring-2 ring-yellow-400 bg-yellow-900/30 text-yellow-200' : 'bg-white/10 text-white hover:bg-white/20')}>
                                            <span className="font-bold">{TERRITORIES[tKey].name}</span>
                                            <span className="font-black">{gs.territories[tKey].units}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Select target */}
                        {selectedSource && (
                            <div>
                                <p className="text-gray-500 text-xs font-bold uppercase mb-1">2. Selecciona objectiu:</p>
                                <div className="space-y-1 max-h-40 overflow-y-auto">
                                    {(function() {
                                        var adjacentEnemies = TERRITORIES[selectedSource].adjacent.filter(function(adj) {
                                            return gs.territories[adj] && gs.territories[adj].faction !== factionIdx;
                                        });
                                        // Neoclassics: all enemy territories if non-adjacent not used
                                        if (myFaction.id === 'neoclassics' && !gs.nonAdjacentUsed) {
                                            TERRITORY_KEYS.forEach(function(k) {
                                                if (gs.territories[k].faction !== factionIdx && adjacentEnemies.indexOf(k) === -1) {
                                                    adjacentEnemies.push(k);
                                                }
                                            });
                                        }
                                        return adjacentEnemies;
                                    })().map(function(tKey) {
                                        var defFaction = FACTIONS[gs.territories[tKey].faction];
                                        var isSelected = selectedTarget === tKey;
                                        var isAdj = isAdjacent(selectedSource, tKey);
                                        return (
                                            <button key={tKey}
                                                onClick={function() { setSelectedTarget(tKey); }}
                                                className={'w-full flex items-center justify-between px-3 py-2 rounded-lg btn-risk text-sm ' +
                                                    (isSelected ? 'ring-2 ring-red-400 bg-red-900/30 text-red-200' : 'bg-white/10 text-white hover:bg-white/20')}>
                                                <span className="flex items-center gap-1">
                                                    <span>{defFaction.emoji}</span>
                                                    <span className="font-bold">{TERRITORIES[tKey].name}</span>
                                                    {!isAdj && <span className="text-xs text-yellow-400">(no adj.)</span>}
                                                </span>
                                                <span className="font-black" style={{ color: defFaction.color }}>{gs.territories[tKey].units}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Attack button */}
                        <div className="flex gap-2">
                            <button
                                onClick={function() {
                                    if (selectedSource && selectedTarget) {
                                        sendAction({ type: 'attack', from: selectedSource, to: selectedTarget });
                                        setSelectedTarget(null);
                                    }
                                }}
                                disabled={!selectedSource || !selectedTarget}
                                className={'flex-1 py-3 rounded-xl font-black text-lg btn-risk ' +
                                    (selectedSource && selectedTarget
                                        ? 'bg-red-600 text-white hover:bg-red-500'
                                        : 'bg-gray-800 text-gray-600 cursor-not-allowed')}>
                                Atacar!
                            </button>
                            <button
                                onClick={function() { sendAction({ type: 'end_attacks' }); setSelectedSource(null); setSelectedTarget(null); }}
                                className="px-4 py-3 rounded-xl bg-gray-700 text-white font-bold btn-risk hover:bg-gray-600">
                                Acabar
                            </button>
                        </div>

                        {/* Marxist power hint */}
                        {myFaction.id === 'marxistes' && (
                            <p className="text-xs text-red-300 text-center">
                                {myFaction.power.icon} Conquesta automatica contra territoris amb 1 unitat!
                            </p>
                        )}
                        {myFaction.id === 'neoclassics' && !gs.nonAdjacentUsed && (
                            <p className="text-xs text-green-300 text-center">
                                {myFaction.power.icon} Pots atacar 1 territori no-adjacent!
                            </p>
                        )}
                    </div>
                )}

                {/* FORTIFY PHASE */}
                {gs.phase === 'fortify' && (
                    <div className="space-y-3">
                        {gs.fortifyDone ? (
                            <div className="text-center space-y-3">
                                <p className="text-green-300">Fortificacio completada!</p>
                                <button
                                    onClick={function() { sendAction({ type: 'end_fortify' }); }}
                                    className="w-full py-3 rounded-xl bg-green-600 text-white font-black text-lg btn-risk hover:bg-green-500">
                                    Acabar Torn
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-2">
                                <p className="text-gray-500 text-xs font-bold uppercase">Mou unitats entre territoris adjacents (opcional):</p>
                                {/* Source */}
                                <div>
                                    <p className="text-gray-500 text-xs mb-1">Origen:</p>
                                    <div className="space-y-1 max-h-32 overflow-y-auto">
                                        {myTerritories.filter(function(t) { return gs.territories[t].units >= 2; }).map(function(tKey) {
                                            return (
                                                <button key={tKey}
                                                    onClick={function() { setSelectedSource(tKey); setSelectedTarget(null); }}
                                                    className={'w-full flex items-center justify-between px-3 py-1.5 rounded-lg btn-risk text-sm ' +
                                                        (selectedSource === tKey ? 'ring-2 ring-green-400 bg-green-900/30 text-green-200' : 'bg-white/10 text-white hover:bg-white/20')}>
                                                    <span>{TERRITORIES[tKey].name}</span>
                                                    <span className="font-black">{gs.territories[tKey].units}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                                {/* Destination */}
                                {selectedSource && (
                                    <div>
                                        <p className="text-gray-500 text-xs mb-1">Desti:</p>
                                        <div className="space-y-1 max-h-32 overflow-y-auto">
                                            {TERRITORIES[selectedSource].adjacent.filter(function(adj) {
                                                return gs.territories[adj] && gs.territories[adj].faction === factionIdx;
                                            }).map(function(tKey) {
                                                return (
                                                    <button key={tKey}
                                                        onClick={function() { setSelectedTarget(tKey); }}
                                                        className={'w-full flex items-center justify-between px-3 py-1.5 rounded-lg btn-risk text-sm ' +
                                                            (selectedTarget === tKey ? 'ring-2 ring-green-400 bg-green-900/30 text-green-200' : 'bg-white/10 text-white hover:bg-white/20')}>
                                                        <span>{TERRITORIES[tKey].name}</span>
                                                        <span className="font-black">{gs.territories[tKey].units}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                {/* Amount + Confirm */}
                                {selectedSource && selectedTarget && (
                                    <div className="space-y-2">
                                        <div className="flex items-center justify-between bg-white/10 rounded-lg p-2">
                                            <span className="text-gray-300 text-sm">Unitats:</span>
                                            <div className="flex items-center gap-2">
                                                <button onClick={function() { setFortifyAmount(Math.max(1, fortifyAmount - 1)); }}
                                                    className="w-8 h-8 rounded-full bg-gray-700 text-white font-bold btn-risk">-</button>
                                                <span className="text-white font-black text-xl w-8 text-center">{fortifyAmount}</span>
                                                <button onClick={function() {
                                                        var max = gs.territories[selectedSource].units - 1;
                                                        setFortifyAmount(Math.min(max, fortifyAmount + 1));
                                                    }}
                                                    className="w-8 h-8 rounded-full bg-gray-700 text-white font-bold btn-risk">+</button>
                                            </div>
                                        </div>
                                        <button
                                            onClick={function() {
                                                sendAction({ type: 'fortify', from: selectedSource, to: selectedTarget, amount: fortifyAmount });
                                                setSelectedSource(null);
                                                setSelectedTarget(null);
                                                setFortifyAmount(1);
                                            }}
                                            className="w-full py-3 rounded-xl bg-green-600 text-white font-black btn-risk hover:bg-green-500">
                                            Moure Unitats
                                        </button>
                                    </div>
                                )}
                                <button
                                    onClick={function() { sendAction({ type: 'end_fortify' }); }}
                                    className="w-full py-2 rounded-xl bg-gray-700 text-gray-300 font-bold text-sm btn-risk hover:bg-gray-600">
                                    Saltar Fortificacio
                                </button>
                            </div>
                        )}
                    </div>
                )}

                {/* My territories list */}
                <div className={'rounded-xl p-3 ' + myFaction.lightBg}>
                    <p className={'font-bold text-sm mb-1 ' + myFaction.textClass}>
                        {myFaction.emoji} Territoris ({myTerritories.length}) - {myUnits} unitats
                    </p>
                    <div className="flex flex-wrap gap-1">
                        {myTerritories.map(function(tKey) {
                            return (
                                <span key={tKey} className="text-xs bg-white/70 px-2 py-0.5 rounded-full">
                                    {TERRITORIES[tKey].name} ({gs.territories[tKey].units})
                                </span>
                            );
                        })}
                    </div>
                    {myContinents.length > 0 && (
                        <p className="text-xs mt-1" style={{ color: myFaction.color }}>
                            Continents: {myContinents.map(function(c) { return CONTINENTS[c].name + ' (+' + CONTINENTS[c].bonus + ')'; }).join(', ')}
                        </p>
                    )}
                </div>

                {/* Faction teachings */}
                <div className="bg-white/5 rounded-xl p-3">
                    <p className="text-xs text-gray-500 font-bold uppercase mb-1">Ensenyaments {myFaction.name}</p>
                    <div className="flex flex-wrap gap-1">
                        {myFaction.teachings.map(function(t, i) {
                            return <span key={i} className="text-xs px-2 py-0.5 rounded-full" style={{ backgroundColor: myFaction.color + '33', color: myFaction.color }}>{t}</span>;
                        })}
                    </div>
                </div>
            </div>
        </div>
    );
}

// =====================================================================
// MAIN APP
// =====================================================================
function SystemicRiskApp() {
    const [gameMode, setGameMode] = useState(null); // null, 'lobby', 'host', 'player', 'local'
    const [gameInfo, setGameInfo] = useState(null);
    const [localGameState, setLocalGameState] = useState(null);
    var [idioma, setIdioma] = useState(PdeLanguageStore.get());
    var t = function(key) { return ECONRISK_TRANSLATIONS[key]?.[idioma] || ECONRISK_TRANSLATIONS[key]?.val || key; };

    // Check for Firebase
    var firebaseReady = PdeFirebase.isConfigured();

    // Check URL for room param
    useEffect(function() {
        var roomCode = PdeRoomManager.getRoomFromURL();
        if (roomCode) {
            setGameMode('lobby');
        }
    }, []);

    // Start screen
    if (!gameMode) {
        return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-gray-900 to-zinc-950">
                <div style={{position:'fixed',top:12,right:12,zIndex:9999,display:'flex',gap:4}}>
                    {['val','es','en'].map(function(l) {
                        return <button key={l} onClick={function(){setIdioma(l);PdeLanguageStore.set(l);}}
                            style={{padding:'4px 10px',borderRadius:8,fontSize:13,fontWeight:idioma===l?800:500,
                                background:idioma===l?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.2)',
                                color:idioma===l?'#1a1a2e':'white',border:'none',cursor:'pointer'}}>
                            {l.toUpperCase()}
                        </button>;
                    })}
                </div>
                <div className="max-w-lg w-full space-y-6 text-center">
                    <div className="space-y-2">
                        <div className="text-7xl">&#x2694;&#xFE0F;</div>
                        <h1 className="text-5xl md:text-6xl font-black text-white tracking-tight">Systemic Risk</h1>
                        <p className="text-gray-500 text-lg">{t('the_risk_changes')}</p>
                    </div>

                    {/* Faction preview */}
                    <div className="grid grid-cols-2 gap-2">
                        {FACTIONS.map(function(f) {
                            return (
                                <div key={f.id} className={'rounded-xl p-3 border ' + f.borderClass + ' ' + f.lightBg + ' text-center'}>
                                    <span className="text-2xl">{f.emoji}</span>
                                    <p className={'font-bold text-sm ' + f.textClass}>{f.name}</p>
                                    <p className="text-xs text-gray-500 italic mt-0.5">"{f.motto}"</p>
                                    <p className="text-xs mt-1">{f.power.icon} {f.power.name}</p>
                                </div>
                            );
                        })}
                    </div>

                    {/* Game modes */}
                    <div className="space-y-3">
                        {firebaseReady && (
                            <button onClick={function() { setGameMode('lobby'); }}
                                className="w-full py-5 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black text-xl shadow-lg btn-risk hover:brightness-110">
                                &#x1F4FA; {t('multiplayer')}
                            </button>
                        )}
                        <button onClick={function() { setGameMode('local'); setLocalGameState(createInitialGameState()); }}
                            className="w-full py-5 rounded-2xl bg-white text-gray-800 font-black text-xl shadow-lg btn-risk hover:bg-gray-100">
                            &#x1F3AE; {t('local_game')}
                        </button>
                    </div>

                    {/* Rules */}
                    <div className="bg-white/5 rounded-2xl p-4 text-left space-y-2">
                        <h3 className="text-white font-bold">{t('how_to_play')}</h3>
                        <ul className="text-gray-500 text-sm space-y-1">
                            <li>&#x1F30D; {t('rule_1')}</li>
                            <li>&#x2694;&#xFE0F; {t('rule_2')}</li>
                            <li>&#x1F4B0; {t('rule_3')}</li>
                            <li>&#x1F3C6; {t('rule_4')}</li>
                            <li>&#x1F4DC; {t('rule_5')}</li>
                            <li>&#x2728; {t('rule_6')}</li>
                        </ul>
                    </div>

                    <a href="./" className="inline-block text-gray-500 hover:text-white transition-colors text-sm">&#x1F393; {t('back_pde')}</a>
                </div>
            </div>
        );
    }

    // ── ONLINE LOBBY ──
    if (gameMode === 'lobby') {
        if (!firebaseReady) {
            return <PdeFirebaseError />;
        }
        return (
            <PdeGameLobby
                gameType="econrisk"
                gameName="Systemic Risk"
                gameEmoji="&#x2694;&#xFE0F;"
                gameGradient="from-indigo-600 to-purple-600"
                minPlayers={2}
                maxPlayers={4}
                teamMode={false}
                onGameStart={function(info) {
                    // Assign factions to players
                    var playerIds = Object.keys(info.players).filter(function(id) {
                        return info.players[id].connected !== false;
                    });
                    var factionAssignment = {};
                    playerIds.forEach(function(pid, idx) {
                        factionAssignment[pid] = idx % 4;
                    });
                    // Set faction assignments in Firebase
                    PdeRoomManager.updateGameState(info.roomCode, { factionAssignment: factionAssignment });
                    // Update player teams
                    playerIds.forEach(function(pid, idx) {
                        PdeRoomManager.updatePlayer(info.roomCode, pid, { team: idx % 4 });
                    });

                    setGameInfo(Object.assign({}, info, { factionAssignment: factionAssignment }));
                    if (info.isHost) {
                        setGameMode('host');
                    } else {
                        setGameMode('player');
                    }
                }}
            />
        );
    }

    // ── HOST VIEW ──
    if (gameMode === 'host' && gameInfo) {
        return (
            <HostGameView
                roomCode={gameInfo.roomCode}
                playerId={gameInfo.playerId}
                players={gameInfo.players}
            />
        );
    }

    // ── PLAYER VIEW ──
    if (gameMode === 'player' && gameInfo) {
        var myFactionIdx = gameInfo.factionAssignment ? gameInfo.factionAssignment[gameInfo.playerId] : 0;
        return (
            <PlayerGameView
                roomCode={gameInfo.roomCode}
                playerId={gameInfo.playerId}
                factionIdx={myFactionIdx}
            />
        );
    }

    // ── LOCAL GAME (vs AI) ──
    if (gameMode === 'local' && localGameState) {
        return (
            <LocalGameView
                initialState={localGameState}
                onExit={function() { setGameMode(null); setLocalGameState(null); }}
            />
        );
    }

    return null;
}

// =====================================================================
// LOCAL GAME VIEW (Single player vs AI)
// =====================================================================
function LocalGameView({ initialState, onExit }) {
    const [idioma] = usePdeIdioma();
    var t = function(key) { return ECONRISK_TRANSLATIONS[key]?.[idioma] || ECONRISK_TRANSLATIONS[key]?.val || key; };
    const [gs, setGs] = useState(initialState);
    const [showEvent, setShowEvent] = useState(null);
    const [combatResult, setCombatResult] = useState(null);
    const [combatLog, setCombatLog] = useState([]);
    const [selectedSource, setSelectedSource] = useState(null);
    const [selectedTarget, setSelectedTarget] = useState(null);
    const [fortifyAmount, setFortifyAmount] = useState(1);
    const [aiProcessing, setAiProcessing] = useState(false);

    var humanFaction = 0; // Player is always Keynesians
    var currentFactionIdx = gs.playerOrder[gs.currentPlayer];
    var currentFaction = FACTIONS[currentFactionIdx];
    var isHumanTurn = currentFactionIdx === humanFaction;

    function addLog(msg) {
        setCombatLog(function(prev) { return [msg].concat(prev).slice(0, 50); });
    }

    function startTurn() {
        var eventIdx = Math.floor(Math.random() * EVENT_CARDS.length);
        var event = EVENT_CARDS[eventIdx];
        setShowEvent(event);
        setGs(function(prev) {
            return Object.assign({}, prev, {
                phase: 'event',
                currentEvent: event,
                factionPowerUsed: {},
                nonAdjacentUsed: false,
                fortifyDone: false,
                peaceEurope: event.effect === 'peace_europe',
                noContBonus: event.effect === 'no_continent_bonus',
                extraAttacks: event.effect === 'extra_attacks' ? event.amount : 0
            });
        });
    }

    function applyCurrentEvent() {
        var event = showEvent;
        setShowEvent(null);
        if (!event) return;
        var result = applyEvent(event, gs.territories, gs.currentPlayer);
        addLog('Event: ' + event.title + ' - ' + result.info);
        var reinforceCount = calculateReinforcements(result.territories, currentFactionIdx, event.effect === 'no_continent_bonus');
        if (currentFaction.id === 'keynesians' && gs.round % 3 === 0) {
            reinforceCount += 2;
            addLog(currentFaction.emoji + ' Estimul Fiscal: +2 unitats extra!');
        }
        setGs(function(prev) {
            return Object.assign({}, prev, {
                phase: 'reinforce',
                territories: result.territories,
                reinforcements: { available: reinforceCount, placed: {} },
                currentEvent: null
            });
        });
        // If AI turn, process automatically
        if (currentFactionIdx !== humanFaction) {
            setTimeout(function() { processAITurnLocal(result.territories, reinforceCount); }, 800);
        }
    }

    function processAITurnLocal(territories, reinforceCount) {
        setAiProcessing(true);
        var afterReinforce = aiReinforce(territories, currentFactionIdx, reinforceCount);
        addLog(currentFaction.emoji + ' ' + currentFaction.name + ' (IA) desplega reforcos.');
        setTimeout(function() {
            var attackResult = aiAttack(afterReinforce, currentFactionIdx);
            attackResult.log.forEach(function(l) { addLog(l); });
            setTimeout(function() {
                setAiProcessing(false);
                advanceToNextPlayerLocal(attackResult.territories);
            }, 500);
        }, 600);
    }

    function advanceToNextPlayerLocal(terrs) {
        var territories = terrs || gs.territories;
        var winner = checkVictory(territories);
        if (winner !== -1) {
            setGs(function(prev) { return Object.assign({}, prev, { finished: true, winner: winner, territories: territories }); });
            PdeGameSounds.play('win');
            return;
        }
        var nextPlayer = gs.currentPlayer + 1;
        var nextRound = gs.round;
        if (nextPlayer >= gs.playerOrder.length) { nextPlayer = 0; nextRound++; }
        if (nextRound > gs.maxRounds) {
            var w = getWinnerByTerritories(territories);
            setGs(function(prev) { return Object.assign({}, prev, { finished: true, winner: w, territories: territories }); });
            PdeGameSounds.play('win');
            return;
        }
        var skips = 0;
        while (isFactionEliminated(territories, gs.playerOrder[nextPlayer]) && skips < 4) {
            nextPlayer++;
            if (nextPlayer >= gs.playerOrder.length) { nextPlayer = 0; nextRound++; }
            skips++;
        }
        if (nextRound > gs.maxRounds) {
            var w2 = getWinnerByTerritories(territories);
            setGs(function(prev) { return Object.assign({}, prev, { finished: true, winner: w2, territories: territories }); });
            return;
        }
        setGs(function(prev) {
            return Object.assign({}, prev, {
                currentPlayer: nextPlayer, round: nextRound, phase: 'event',
                territories: territories,
                reinforcements: { available: 0, placed: {} },
                factionPowerUsed: {}, nonAdjacentUsed: false, fortifyDone: false,
                peaceEurope: false, noContBonus: false, extraAttacks: 0
            });
        });
        setTimeout(function() { startTurn(); }, 300);
    }

    useEffect(function() {
        if (gs.phase === 'event' && !gs.currentEvent && !gs.finished) {
            startTurn();
        }
    }, []);

    // ── FINISHED ──
    if (gs.finished) {
        var winnerFaction = FACTIONS[gs.winner];
        var facts = FACTION_FACTS[winnerFaction.id];
        var isHumanWin = gs.winner === humanFaction;
        return (
            <div className="min-h-screen p-4 md:p-8 bg-gradient-to-br from-slate-900 via-gray-900 to-zinc-950">
                <PdeConfetti show={isHumanWin} />
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="text-center space-y-3">
                        <div className="text-7xl">{isHumanWin ? '\u{1F3C6}' : winnerFaction.emoji}</div>
                        <h1 className="text-4xl md:text-6xl font-black text-white">
                            {isHumanWin ? 'Has guanyat!' : winnerFaction.name + ' guanyen!'}
                        </h1>
                        <p className="text-xl text-gray-500">"{winnerFaction.motto}"</p>
                    </div>
                    <div className="rounded-2xl overflow-hidden border border-gray-700">
                        <GameMap territories={gs.territories} currentFaction={gs.winner} />
                    </div>
                    <GameStats gameState={gs} />
                    <div className="bg-white/10 backdrop-blur rounded-2xl p-5 space-y-3">
                        <h3 className="text-xl font-black text-white">Sabies que...?</h3>
                        {facts && facts.map(function(fact, i) {
                            return <p key={i} className="text-gray-300 text-sm">{winnerFaction.emoji} {fact}</p>;
                        })}
                    </div>
                    <div className="bg-white/10 backdrop-blur rounded-2xl p-5 space-y-4">
                        <h3 className="text-xl font-black text-white">Les 4 Escoles Economiques</h3>
                        {FACTIONS.map(function(f) {
                            return (
                                <div key={f.id} className="space-y-1">
                                    <p className="font-bold" style={{ color: f.color }}>{f.emoji} {f.name}</p>
                                    <div className="flex flex-wrap gap-1">
                                        {f.teachings.map(function(t, ti) {
                                            return <span key={ti} className="text-xs bg-white/10 text-gray-300 px-2 py-1 rounded-full">{t}</span>;
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="flex gap-3 justify-center">
                        <button onClick={function() { window.location.reload(); }}
                            className="px-8 py-4 rounded-2xl bg-indigo-600 text-white font-black text-xl hover:bg-indigo-500 btn-risk">
                            Nova Partida
                        </button>
                        <button onClick={onExit}
                            className="px-8 py-4 rounded-2xl bg-gray-700 text-white font-bold text-xl hover:bg-gray-600 btn-risk">
                            {t('back') || 'Tornar'}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // ── MAIN LOCAL VIEW ──
    var phaseNames = { event: 'Esdeveniment', reinforce: 'Reforcos', attack: 'Atac', fortify: 'Fortificar' };
    var myTerritories = getTerritoriesByFaction(gs.territories, humanFaction);
    var myFaction = FACTIONS[humanFaction];

    // Valid targets for map highlighting
    var mapValidTargets = null;
    if (isHumanTurn && gs.phase === 'attack' && selectedSource) {
        mapValidTargets = TERRITORIES[selectedSource].adjacent.filter(function(adj) {
            return gs.territories[adj] && gs.territories[adj].faction !== humanFaction;
        });
        if (myFaction.id === 'neoclassics' && !gs.nonAdjacentUsed) {
            TERRITORY_KEYS.forEach(function(k) {
                if (gs.territories[k].faction !== humanFaction && mapValidTargets.indexOf(k) === -1) {
                    mapValidTargets.push(k);
                }
            });
        }
    }

    return (
        <div className="min-h-screen p-3 md:p-6 bg-gradient-to-br from-slate-900 via-gray-900 to-zinc-950">
            {showEvent && <EventCardOverlay event={showEvent} onApply={applyCurrentEvent} />}
            {combatResult && <CombatOverlay combat={combatResult} onClose={function() { setCombatResult(null); }} />}

            <div className="max-w-7xl mx-auto space-y-4">
                {/* Header */}
                <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="flex items-center gap-3">
                        <button onClick={onExit} className="text-gray-500 hover:text-white text-sm">&#x2190; {t('back') || 'Tornar'}</button>
                        <span className="text-gray-700">|</span>
                        <h1 className="text-xl md:text-2xl font-black text-white">&#x2694;&#xFE0F; Systemic Risk</h1>
                    </div>
                    <div className="text-sm text-gray-500">
                        {(t('round_x_of_y') || '').replace('{x}', gs.round).replace('{y}', gs.maxRounds) || ('Ronda ' + gs.round + '/' + gs.maxRounds)}
                    </div>
                </div>

                {/* Current player + phase */}
                <div className="flex flex-wrap items-center justify-between gap-3 bg-white/5 rounded-2xl p-3">
                    <div className="flex items-center gap-3">
                        <span className="text-3xl">{currentFaction.emoji}</span>
                        <div>
                            <p className="font-black text-lg" style={{ color: currentFaction.color }}>
                                {currentFaction.name} {!isHumanTurn ? '(IA)' : '(Tu)'}
                            </p>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        {['event', 'reinforce', 'attack', 'fortify'].map(function(p) {
                            return (
                                <div key={p} className={'px-3 py-1 rounded-full text-xs font-bold ' +
                                    (gs.phase === p ? 'bg-indigo-500 text-white' : 'bg-gray-800 text-gray-500')}>
                                    {phaseNames[p]}
                                </div>
                            );
                        })}
                    </div>
                </div>

                {/* AI processing */}
                {aiProcessing && (
                    <div className="bg-yellow-900/50 rounded-xl p-3 text-center">
                        <span className="text-yellow-200 animate-pulse font-bold">
                            {currentFaction.emoji} {currentFaction.name} (IA) esta pensant...
                        </span>
                    </div>
                )}

                {/* Phase controls for human */}
                {isHumanTurn && gs.phase === 'reinforce' && (
                    <div className="bg-indigo-900/50 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                        <span className="text-indigo-200">
                            Unitats per desplegar: <span className="font-black text-xl text-white">{gs.reinforcements.available}</span>
                        </span>
                        {gs.reinforcements.available === 0 && (
                            <button onClick={function() { setGs(function(prev) { return Object.assign({}, prev, { phase: 'attack' }); }); }}
                                className="px-4 py-2 rounded-xl bg-indigo-500 text-white font-bold btn-risk hover:bg-indigo-400">
                                Continuar a Atac
                            </button>
                        )}
                    </div>
                )}
                {isHumanTurn && gs.phase === 'attack' && (
                    <div className="bg-red-900/50 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                        <span className="text-red-200 text-sm">
                            Selecciona territori propi (2+ unitats) i objectiu enemic adjacent
                            {myFaction.id === 'marxistes' && <span className="text-red-300 ml-1">(auto-conquesta amb 1 unitat!)</span>}
                            {myFaction.id === 'neoclassics' && !gs.nonAdjacentUsed && <span className="text-green-300 ml-1">(1 atac no-adjacent disponible!)</span>}
                        </span>
                        <button onClick={function() { setSelectedSource(null); setSelectedTarget(null); setGs(function(prev) { return Object.assign({}, prev, { phase: 'fortify' }); }); }}
                            className="px-4 py-2 rounded-xl bg-red-500 text-white font-bold btn-risk hover:bg-red-400">
                            Acabar Atacs
                        </button>
                    </div>
                )}
                {isHumanTurn && gs.phase === 'fortify' && (
                    <div className="bg-green-900/50 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                        <span className="text-green-200 text-sm">{gs.fortifyDone ? 'Fortificacio completada' : 'Mou unitats entre territoris adjacents (opcional)'}</span>
                        <button onClick={function() { setSelectedSource(null); setSelectedTarget(null); advanceToNextPlayerLocal(); }}
                            className="px-4 py-2 rounded-xl bg-green-500 text-white font-bold btn-risk hover:bg-green-400">
                            Acabar Torn
                        </button>
                    </div>
                )}

                {/* Main layout */}
                <div className="grid lg:grid-cols-4 gap-4">
                    {/* Map */}
                    <div className="lg:col-span-3">
                        <div className="rounded-2xl overflow-hidden border border-gray-700 shadow-2xl">
                            <GameMap
                                territories={gs.territories}
                                phase={gs.phase}
                                currentFaction={isHumanTurn ? humanFaction : currentFactionIdx}
                                selectedTerritory={selectedSource}
                                validTargets={mapValidTargets}
                                onTerritoryClick={function(tKey) {
                                    if (!isHumanTurn || aiProcessing) return;
                                    if (gs.phase === 'reinforce') {
                                        if (gs.territories[tKey].faction === humanFaction && gs.reinforcements.available > 0) {
                                            setGs(function(prev) {
                                                var newTerrs = JSON.parse(JSON.stringify(prev.territories));
                                                newTerrs[tKey].units += 1;
                                                var placed = JSON.parse(JSON.stringify(prev.reinforcements.placed || {}));
                                                placed[tKey] = (placed[tKey] || 0) + 1;
                                                return Object.assign({}, prev, {
                                                    territories: newTerrs,
                                                    reinforcements: { available: prev.reinforcements.available - 1, placed: placed }
                                                });
                                            });
                                            PdeGameSounds.play('pop');
                                        }
                                    } else if (gs.phase === 'attack') {
                                        if (!selectedSource) {
                                            // Select source
                                            if (gs.territories[tKey].faction === humanFaction && gs.territories[tKey].units >= 2) {
                                                setSelectedSource(tKey);
                                                setSelectedTarget(null);
                                                PdeGameSounds.play('click');
                                            }
                                        } else if (selectedSource === tKey) {
                                            // Deselect
                                            setSelectedSource(null);
                                            setSelectedTarget(null);
                                        } else if (gs.territories[tKey].faction === humanFaction) {
                                            // Switch source
                                            if (gs.territories[tKey].units >= 2) {
                                                setSelectedSource(tKey);
                                                setSelectedTarget(null);
                                                PdeGameSounds.play('click');
                                            }
                                        } else {
                                            // Attack target
                                            var canAttack = isAdjacent(selectedSource, tKey);
                                            if (!canAttack && myFaction.id === 'neoclassics' && !gs.nonAdjacentUsed) {
                                                canAttack = true;
                                            }
                                            if (gs.peaceEurope && TERRITORIES[tKey].continent === 'europe') {
                                                addLog('No es pot atacar Europa (Pacte de No Agressio)!');
                                                return;
                                            }
                                            if (canAttack) {
                                                // Marxist auto-conquer
                                                if (myFaction.id === 'marxistes' && gs.territories[tKey].units === 1) {
                                                    addLog(myFaction.emoji + ' Revolucio! Conquesta automatica de ' + TERRITORIES[tKey].name + '!');
                                                    setGs(function(prev) {
                                                        var newTerrs = JSON.parse(JSON.stringify(prev.territories));
                                                        var moveUnits = Math.min(newTerrs[selectedSource].units - 1, 2);
                                                        newTerrs[tKey] = { faction: humanFaction, units: Math.max(1, moveUnits) };
                                                        newTerrs[selectedSource].units -= moveUnits;
                                                        if (newTerrs[selectedSource].units < 1) newTerrs[selectedSource].units = 1;
                                                        var nonAdj = !isAdjacent(selectedSource, tKey) ? true : prev.nonAdjacentUsed;
                                                        return Object.assign({}, prev, { territories: newTerrs, nonAdjacentUsed: nonAdj });
                                                    });
                                                    PdeGameSounds.play('win');
                                                    setSelectedSource(null);
                                                    setSelectedTarget(null);
                                                    return;
                                                }
                                                // Normal combat
                                                var result = resolveCombat(
                                                    gs.territories[selectedSource].units,
                                                    gs.territories[tKey].units,
                                                    humanFaction,
                                                    gs.territories[tKey].faction
                                                );
                                                var conquered = false;
                                                setGs(function(prev) {
                                                    var newTerrs = JSON.parse(JSON.stringify(prev.territories));
                                                    newTerrs[selectedSource].units -= result.attackerLoss;
                                                    newTerrs[tKey].units -= result.defenderLoss;
                                                    if (newTerrs[tKey].units <= 0) {
                                                        conquered = true;
                                                        var moveUnits = Math.min(newTerrs[selectedSource].units - 1, 3);
                                                        newTerrs[tKey] = { faction: humanFaction, units: Math.max(1, moveUnits) };
                                                        newTerrs[selectedSource].units -= moveUnits;
                                                        if (newTerrs[selectedSource].units < 1) newTerrs[selectedSource].units = 1;
                                                    }
                                                    var nonAdj = !isAdjacent(selectedSource, tKey) ? true : prev.nonAdjacentUsed;
                                                    return Object.assign({}, prev, { territories: newTerrs, nonAdjacentUsed: nonAdj });
                                                });
                                                var defFactionIdx = gs.territories[tKey].faction;
                                                addLog(myFaction.emoji + ' ' + myFaction.name + ' ataca ' + TERRITORIES[tKey].name +
                                                    ' (' + result.attackDice.join(',') + ' vs ' + result.defendDice.join(',') + ')' +
                                                    (conquered ? ' - CONQUISTAT!' : ''));
                                                setCombatResult({
                                                    from: selectedSource, to: tKey,
                                                    attackerFaction: humanFaction,
                                                    defenderFaction: defFactionIdx,
                                                    result: result,
                                                    conquered: conquered
                                                });
                                                if (conquered) { PdeGameSounds.play('win'); }
                                                else { PdeGameSounds.play('buzz'); }
                                                setSelectedSource(null);
                                                setSelectedTarget(null);
                                            }
                                        }
                                    } else if (gs.phase === 'fortify' && !gs.fortifyDone) {
                                        if (!selectedSource) {
                                            if (gs.territories[tKey].faction === humanFaction && gs.territories[tKey].units >= 2) {
                                                setSelectedSource(tKey);
                                                PdeGameSounds.play('click');
                                            }
                                        } else if (selectedSource === tKey) {
                                            setSelectedSource(null);
                                            setSelectedTarget(null);
                                        } else if (gs.territories[tKey].faction === humanFaction && isAdjacent(selectedSource, tKey)) {
                                            // Fortify
                                            var maxMove = gs.territories[selectedSource].units - 1;
                                            var moveAmt = Math.min(fortifyAmount, maxMove);
                                            if (moveAmt > 0) {
                                                setGs(function(prev) {
                                                    var newTerrs = JSON.parse(JSON.stringify(prev.territories));
                                                    newTerrs[selectedSource].units -= moveAmt;
                                                    newTerrs[tKey].units += moveAmt;
                                                    return Object.assign({}, prev, { territories: newTerrs, fortifyDone: true });
                                                });
                                                addLog(myFaction.emoji + ' Fortifica: ' + moveAmt + 'u de ' + TERRITORIES[selectedSource].name + ' a ' + TERRITORIES[tKey].name);
                                                PdeGameSounds.play('pop');
                                            }
                                            setSelectedSource(null);
                                            setSelectedTarget(null);
                                        }
                                    }
                                }}
                            />
                        </div>
                        {/* Fortify amount slider (when source selected in fortify) */}
                        {isHumanTurn && gs.phase === 'fortify' && !gs.fortifyDone && selectedSource && (
                            <div className="mt-2 flex items-center justify-center gap-3 bg-white/5 rounded-xl p-3">
                                <span className="text-gray-300 text-sm">Unitats a moure:</span>
                                <button onClick={function() { setFortifyAmount(Math.max(1, fortifyAmount - 1)); }}
                                    className="w-8 h-8 rounded-full bg-gray-700 text-white font-bold btn-risk">-</button>
                                <span className="text-white font-black text-xl w-8 text-center">{fortifyAmount}</span>
                                <button onClick={function() {
                                        var max = gs.territories[selectedSource].units - 1;
                                        setFortifyAmount(Math.min(max, fortifyAmount + 1));
                                    }}
                                    className="w-8 h-8 rounded-full bg-gray-700 text-white font-bold btn-risk">+</button>
                                <span className="text-gray-500 text-xs">(max: {gs.territories[selectedSource].units - 1})</span>
                            </div>
                        )}
                    </div>

                    {/* Sidebar */}
                    <div className="space-y-3">
                        {FACTIONS.map(function(f, i) {
                            var isActive = i === currentFactionIdx;
                            var isHuman = i === humanFaction;
                            return (
                                <div key={f.id} className={'rounded-xl p-2 border transition-all ' +
                                    (isActive ? 'border-white/30 bg-white/10 ring-1 ring-white/20' : 'border-gray-800 bg-gray-900/50')}>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">{f.emoji}</span>
                                        <span className={'font-bold text-sm ' + f.textClass}>{f.name}</span>
                                        {isHuman && <span className="text-xs text-yellow-400 ml-auto">(Tu)</span>}
                                        {!isHuman && <span className="text-xs text-gray-600 ml-auto">IA</span>}
                                    </div>
                                    <div className="flex gap-2 mt-1 text-xs text-gray-500">
                                        <span>{countTerritories(gs.territories, i)}T</span>
                                        <span>{totalUnits(gs.territories, i)}U</span>
                                        {getControlledContinents(gs.territories, i).length > 0 && (
                                            <span className="text-yellow-500">{getControlledContinents(gs.territories, i).length}C</span>
                                        )}
                                    </div>
                                </div>
                            );
                        })}

                        {/* Combat log */}
                        <div className="bg-gray-900/80 rounded-xl p-3 max-h-64 overflow-y-auto border border-gray-800">
                            <h4 className="text-xs font-bold text-gray-500 mb-2 uppercase">Registre</h4>
                            {combatLog.length === 0 && <p className="text-gray-600 text-xs">Cap accio encara...</p>}
                            {combatLog.map(function(log, i) {
                                return <p key={i} className="text-xs text-gray-500 py-0.5 border-b border-gray-800/50">{log}</p>;
                            })}
                        </div>

                        {/* Faction power reminder */}
                        <div className="bg-white/5 rounded-xl p-3">
                            <p className="text-xs text-gray-500 font-bold uppercase mb-1">El teu poder</p>
                            <p className="text-sm text-white">{myFaction.power.icon} {myFaction.power.name}</p>
                            <p className="text-xs text-gray-500">{myFaction.power.description}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
}

// =====================================================================
// RENDER
// =====================================================================
ReactDOM.render(<SystemicRiskApp />, document.getElementById('root'));
    </script>
</body>
</html>
