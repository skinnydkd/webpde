        function App() {

            const [searchTerm, setSearchTerm] = useState('');
            const [idioma, setIdioma] = useState(PdeLanguageStore.get());
            
            // Funció de traducció
            const t = (category, key) => {
                try {
                    if (key) return translations[category][key][idioma] || translations[category][key]['val'];
                    return translations[category][idioma] || translations[category]['val'];
                } catch { return key || category; }
            };
            
            // Simulador Nòmina
            const [salarioBrut, setSalarioBrut] = useState(2000);
            const [pagues, setPagues] = useState(14);
            const [categoriaIRPF, setCategoriaIRPF] = useState('solter');
            
            // Simulador Hipoteca
            const [hipCapital, setHipCapital] = useState(200000);
            const [hipInteres, setHipInteres] = useState(3);
            const [hipAnys, setHipAnys] = useState(25);
            
            // Simulador Estalvi
            const [estCapInicial, setEstCapInicial] = useState(1000);
            const [estAportacio, setEstAportacio] = useState(200);
            const [estInteres, setEstInteres] = useState(5);
            const [estAnys, setEstAnys] = useState(10);
            
            // Simulador Préstec
            const [prestCapital, setPrestCapital] = useState(10000);
            const [prestInteres, setPrestInteres] = useState(7);
            const [prestMesos, setPrestMesos] = useState(36);
            
            // Fons Emergència
            const [feDespesesMes, setFeDespesesMes] = useState(1500);
            const [feMesos, setFeMesos] = useState(6);

            // Pressupost Personal
            const [presIngressos, setPresIngressos] = useState(2000);
            const [presHabitatge, setPresHabitatge] = useState(600);
            const [presAlimentacio, setPresAlimentacio] = useState(300);
            const [presTransport, setPresTransport] = useState(150);
            const [presSubministres, setPresSubministres] = useState(100);
            const [presOci, setPresOci] = useState(150);
            const [presAltres, setPresAltres] = useState(100);
            const [presEstalvi, setPresEstalvi] = useState(200);

            // Càlcul Pressupost
            const calculPressupost = useMemo(() => {
                const totalDespeses = presHabitatge + presAlimentacio + presTransport + presSubministres + presOci + presAltres;
                const disponible = presIngressos - totalDespeses;
                const percentEstalvi = ((presEstalvi / presIngressos) * 100).toFixed(1);
                const percentHabitatge = ((presHabitatge / presIngressos) * 100).toFixed(1);
                const saludFinanciera = disponible >= presEstalvi ? (disponible >= presEstalvi * 1.5 ? 'excel·lent' : 'bona') : (disponible >= 0 ? 'ajustada' : 'crítica');
                return { totalDespeses, disponible, percentEstalvi, percentHabitatge, saludFinanciera };
            }, [presIngressos, presHabitatge, presAlimentacio, presTransport, presSubministres, presOci, presAltres, presEstalvi]);

            const dadesPressupost = [
                { nom: 'Habitatge', valor: presHabitatge, color: '#ec4899', emoji: '🏠' },
                { nom: 'Alimentació', valor: presAlimentacio, color: '#f97316', emoji: '🍽️' },
                { nom: 'Transport', valor: presTransport, color: '#eab308', emoji: '🚗' },
                { nom: 'Subministres', valor: presSubministres, color: '#22c55e', emoji: '💡' },
                { nom: 'Oci', valor: presOci, color: '#3b82f6', emoji: '🎬' },
                { nom: 'Altres', valor: presAltres, color: '#8b5cf6', emoji: '📦' },
                { nom: 'Estalvi', valor: presEstalvi, color: '#14b8a6', emoji: '🐷' },
            ];

            // Càlcul Nòmina
            const calculNomina = useMemo(() => {
                const brutAnual = salarioBrut * pagues;
                const ssPercent = 6.35;
                const ss = salarioBrut * (ssPercent / 100);
                let irpfPercent;
                if (brutAnual <= 12450) irpfPercent = 19;
                else if (brutAnual <= 20200) irpfPercent = 24;
                else if (brutAnual <= 35200) irpfPercent = 30;
                else if (brutAnual <= 60000) irpfPercent = 37;
                else irpfPercent = 45;
                if (categoriaIRPF === 'casat2fills') irpfPercent -= 5;
                else if (categoriaIRPF === 'casat') irpfPercent -= 2;
                irpfPercent = Math.max(irpfPercent, 0);
                const irpf = salarioBrut * (irpfPercent / 100);
                const net = salarioBrut - ss - irpf;
                return { brutAnual, ss, ssPercent, irpf, irpfPercent, net, netAnual: net * pagues };
            }, [salarioBrut, pagues, categoriaIRPF]);

            // Càlcul Hipoteca
            const calculHipoteca = useMemo(() => {
                const r = hipInteres / 100 / 12;
                const n = hipAnys * 12;
                const quota = hipCapital * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                const totalPagat = quota * n;
                const totalInteressos = totalPagat - hipCapital;
                return { quota, totalPagat, totalInteressos };
            }, [hipCapital, hipInteres, hipAnys]);

            // Càlcul Estalvi
            const calculEstalvi = useMemo(() => {
                const r = estInteres / 100;
                let total = estCapInicial;
                let totalAportat = estCapInicial;
                for (let any = 1; any <= estAnys; any++) {
                    total = total * (1 + r) + estAportacio * 12;
                    totalAportat += estAportacio * 12;
                }
                return { totalFinal: Math.round(total), totalAportat: Math.round(totalAportat), totalInteressos: Math.round(total - totalAportat) };
            }, [estCapInicial, estAportacio, estInteres, estAnys]);

            // Càlcul Préstec
            const calculPrestec = useMemo(() => {
                const r = prestInteres / 100 / 12;
                const quota = prestCapital * (r * Math.pow(1 + r, prestMesos)) / (Math.pow(1 + r, prestMesos) - 1);
                const totalPagat = quota * prestMesos;
                const totalInteressos = totalPagat - prestCapital;
                const tae = (Math.pow(1 + r, 12) - 1) * 100;
                return { quota, totalPagat, totalInteressos, tae };
            }, [prestCapital, prestInteres, prestMesos]);

            const fonEmergencia = feDespesesMes * feMesos;

            const Card = ({ children, className = '' }) => (

            );

                            { id: 'lloguer', emoji: '🏘️', title: t('nav', 'lloguer'), desc: t('cards', 'lloguer') },

            const Nomina = () => (
                <div className="space-y-6">
                    <h2 className="text-2xl font-black text-gray-800">💳 Entendre la Nòmina</h2>
                    
                    {/* Introducció teòrica */}
                    <Card className="bg-gradient-to-r from-violet-50 to-purple-50 border-violet-200">
                        <h3 className="font-bold text-gray-800 mb-3">📚 Què és una nòmina?</h3>
                        <p className="text-gray-600 text-sm mb-4">

                // Dades dels PGE 2023 (últims aprovats)
                const pressupostTotal = 450721; // milions €
                const pib = 1462000; // milions € aprox
                
                // Distribució de la despesa (en milions €)
                const despesaData = [
                    { nom: 'Pensions', valor: 190684, percent: 42.3, color: '#ec4899', emoji: '👴' },
                    { nom: 'Deute públic', valor: 31171, percent: 6.9, color: '#8b5cf6', emoji: '💳' },
                    { nom: 'Atur i SS', valor: 21282, percent: 4.7, color: '#f59e0b', emoji: '🏥' },
                    { nom: 'Defensa', valor: 12312, percent: 2.7, color: '#6b7280', emoji: '🛡️' },
                    { nom: 'Infraestructures', valor: 14580, percent: 3.2, color: '#10b981', emoji: '🚄' },
                    { nom: 'Seguretat', valor: 11340, percent: 2.5, color: '#3b82f6', emoji: '👮' },
                    { nom: 'Educació (estatal)', valor: 5890, percent: 1.3, color: '#14b8a6', emoji: '🎓' },
                    { nom: 'Altres', valor: 163462, percent: 36.3, color: '#d1d5db', emoji: '📦' },
                ];
                
                // Càlcul dels impostos d'un salari
                const calculImpostos = useMemo(() => {
                    // IRPF aproximat (sense deduccions)
                    let irpf = 0;
                    if (salariAnual > 0) irpf += Math.min(salariAnual, 12450) * 0.19;
                    if (salariAnual > 12450) irpf += Math.min(salariAnual - 12450, 7750) * 0.24;
                    if (salariAnual > 20200) irpf += Math.min(salariAnual - 20200, 15000) * 0.30;
                    if (salariAnual > 35200) irpf += Math.min(salariAnual - 35200, 24800) * 0.37;
                    if (salariAnual > 60000) irpf += (salariAnual - 60000) * 0.45;
                    
                    const ss = salariAnual * 0.0635; // Cotització treballador ~6.35%
                    const iva = (salariAnual - irpf - ss) * 0.15; // Estima ~15% del net en IVA (consum)
                    const total = irpf + ss + iva;
                    
                    // Com es distribueix el que pagues
                    const perPensions = total * 0.423;
                    const perDeute = total * 0.069;
                    const perDefensa = total * 0.027;
                    const perAltre = total - perPensions - perDeute - perDefensa;
                    
                    return { irpf, ss, iva, total, perPensions, perDeute, perDefensa, perAltre };
                }, [salariAnual]);

                            <div className="grid md:grid-cols-3 gap-4">
                                <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-xl">
                                    <p className="font-bold text-yellow-700 mb-2">💡 Llum</p>
                                    <ul className="text-sm text-gray-600 space-y-1">
                                        <li>• LED a tot arreu</li>
                                        <li>• Electrodomèstics A+++</li>
                                        <li>• Hores vall (nit, caps de setmana)</li>
                                        <li>• Revisa potència contractada</li>
                                    </ul>
                                </div>
                                <div className="p-4 bg-orange-50 border border-orange-200 rounded-xl">
                                    <p className="font-bold text-orange-700 mb-2">🔥 Gas</p>
                                    <ul className="text-sm text-gray-600 space-y-1">
                                        <li>• Termòstat a 20-21°C</li>
                                        <li>• Aïlla finestres i portes</li>
                                        <li>• Caldera eficient</li>
                                        <li>• Dutxes curtes</li>

                                <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl">
                                    <p className="font-bold text-blue-700 mb-2">💧 Aigua</p>

                                        <li>• Aixetes amb airejadors</li>
                                        <li>• Cisternes de doble descàrrega</li>
                                        <li>• Rentadora i rentavaixelles plens</li>
                                        <li>• Revisa fuites</li>
                                    </ul>
                                </div>
                            </div>
                        </Card>
                    </div>
                );
            };

            // ===== SECCIÓ LLOGUER =====
            const Lloguer = () => {
                const [lloguerMes, setLloguerMes] = useState(800);
                const [ingressosNets, setIngressosNets] = useState(1800);
                
                const calculLloguer = useMemo(() => {
                    const percentatge = (lloguerMes / ingressosNets) * 100;
                    const fianca = lloguerMes; // 1 mes mínim
                    const despesesEntrada = lloguerMes * 2 + 200; // fiança + 1r mes + gestió
                    const saludable = percentatge <= 30;
                    return { percentatge, fianca, despesesEntrada, saludable };
                }, [lloguerMes, ingressosNets]);
                
                return (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-black text-gray-800">🏘️ Tot sobre el Lloguer</h2>
                        
                        {/* Introducció */}
                        <Card className="bg-gradient-to-r from-rose-50 to-pink-50 border-rose-200">
                            <h3 className="font-bold text-gray-800 mb-3">📚 Llogar un pis</h3>
                            <p className="text-gray-600 text-sm">
                                El lloguer és sovint el primer pas cap a la independència. Entendre els teus <strong>drets</strong>, 
                                les <strong>obligacions</strong> i el <strong>contracte</strong> et protegeix de problemes i abusos.
                            </p>
                        </Card>
                        
                        {/* Calculadora */}
                        <div className="grid lg:grid-cols-2 gap-6">
                            <Card>
                                <h3 className="font-bold text-gray-800 mb-4">🧮 És assumible aquest lloguer?</h3>
                                <div className="space-y-4">
                                    <Slider label="Lloguer mensual" value={lloguerMes} onChange={setLloguerMes} min={300} max={2000} step={50} suffix="€" />
                                    <Slider label="Ingressos nets mensuals" value={ingressosNets} onChange={setIngressosNets} min={1000} max={5000} step={100} suffix="€" />
                                </div>
                            </Card>
                            <Card className={`border-0 text-white ${calculLloguer.saludable ? 'bg-gradient-to-br from-emerald-500 to-teal-500' : 'bg-gradient-to-br from-amber-500 to-orange-500'}`}>
                                <h3 className="font-bold mb-4">📊 Anàlisi</h3>
                                <div className="space-y-3">
                                    <div className="flex justify-between py-2 border-b border-white/20">
                                        <span>% dels ingressos</span>
                                        <span className="font-black text-2xl">{calculLloguer.percentatge.toFixed(0)}%</span>
                                    </div>
                                    <div className="p-3 bg-white/20 rounded-xl text-center">
                                        {calculLloguer.saludable ? (
                                            <p>✅ <strong>Saludable!</strong> Recomanat: màx 30-35%</p>
                                        ) : (
                                            <p>⚠️ <strong>Atenció!</strong> Superes el 30% recomanat</p>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 text-sm mt-2">
                                        <div className="p-2 bg-white/10 rounded-lg text-center">
                                            <p className="text-white/70">Fiança mínima</p>
                                            <p className="font-bold">{calculLloguer.fianca}€</p>
                                        </div>
                                        <div className="p-2 bg-white/10 rounded-lg text-center">
                                            <p className="text-white/70">Entrada estimada</p>
                                            <p className="font-bold">{calculLloguer.despesesEntrada}€</p>
                                        </div>
                                    </div>
                                </div>
                            </Card>
                        </div>
                        
                        {/* El contracte */}
                        <Card>
                            <h3 className="font-bold text-gray-800 mb-4">📝 El contracte de lloguer</h3>
                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="space-y-3">
                                    <div className="p-3 bg-violet-50 rounded-lg">
                                        <p className="font-bold text-violet-700">📅 Durada</p>
                                        <p className="text-sm text-gray-600">Mínim legal: 5 anys (7 si propietari és empresa). El propietari no pot fer-te fora abans.</p>
                                    </div>
                                    <div className="p-3 bg-violet-50 rounded-lg">
                                        <p className="font-bold text-violet-700">💰 Fiança</p>
                                        <p className="text-sm text-gray-600">Màxim legal: <strong>1 mes</strong> de lloguer (habitatge). Es diposita a l'organisme oficial.</p>
                                    </div>
                                    <div className="p-3 bg-violet-50 rounded-lg">
                                        <p className="font-bold text-violet-700">🔒 Garanties addicionals</p>
                                        <p className="text-sm text-gray-600">Màxim 2 mesos addicionals. Total: fins a 3 mesos entre tot.</p>
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    <div className="p-3 bg-amber-50 rounded-lg">
                                        <p className="font-bold text-amber-700">📈 Actualització renda</p>
                                        <p className="text-sm text-gray-600">Màxim IPC (o índex legal). No poden pujar el que vulguin.</p>
                                    </div>
                                    <div className="p-3 bg-amber-50 rounded-lg">
                                        <p className="font-bold text-amber-700">🚪 Desistiment inquilí</p>
                                        <p className="text-sm text-gray-600">Pots marxar als 6 mesos amb 30 dies d'avís. Pot haver penalització pactada.</p>
                                    </div>
                                    <div className="p-3 bg-amber-50 rounded-lg">
                                        <p className="font-bold text-amber-700">🔧 Reparacions</p>
                                        <p className="text-sm text-gray-600">Habitabilitat = propietari. Ús diari (&lt;150€) = inquilí.</p>
                                    </div>
                                </div>
                            </div>
                        </Card>
                        
                        {/* Drets inquilí */}
                        <Card>
                            <h3 className="font-bold text-gray-800 mb-4">⚖️ Drets de l'inquilí</h3>
                            <div className="grid md:grid-cols-2 gap-3">
                                {[
                                    { icon: '🏠', dret: 'Habitatge en condicions', desc: "L'habitatge ha de ser habitable i segur" },
                                    { icon: '🔒', dret: 'Estabilitat', desc: "No et poden fer fora sense causa justificada" },
                                    { icon: '📝', dret: 'Contracte per escrit', desc: "Sempre demana'l, és la teua protecció" },
                                    { icon: '🧾', dret: 'Rebuts de pagament', desc: "Guarda tots els rebuts del lloguer" },
                                    { icon: '🔧', dret: 'Reparacions necessàries', desc: "El propietari ha de mantenir l'habitatge" },
                                    { icon: '💰', dret: 'Recuperar fiança', desc: "Si deixes el pis bé, te la tornen (màx 30 dies)" },
                                ].map((d, i) => (
                                    <div key={i} className="flex items-start gap-3 p-3 bg-emerald-50 rounded-lg">
                                        <span className="text-xl">{d.icon}</span>
                                        <div>
                                            <p className="font-bold text-emerald-700">{d.dret}</p>
                                            <p className="text-sm text-gray-600">{d.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </Card>
                        
                        {/* Obligacions inquilí */}
                        <Card>
                            <h3 className="font-bold text-gray-800 mb-4">📋 Obligacions de l'inquilí</h3>
                            <div className="grid md:grid-cols-3 gap-3">
                                {[
                                    { icon: '💵', title: 'Pagar el lloguer', desc: 'Puntualment, en la forma acordada' },
                                    { icon: '🏠', title: 'Cuidar el pis', desc: "Mantenir-lo en bon estat, com si fos teu" },
                                    { icon: '🔔', title: 'Comunicar desperfectes', desc: 'Avisa el propietari de problemes greus' },
                                    { icon: '🙅', title: 'No fer obres', desc: 'Sense permís escrit del propietari' },
                                    { icon: '👥', title: 'No subarrendar', desc: 'Llevat que el contracte ho permeti' },
                                    { icon: '📅', title: 'Retornar al final', desc: 'En les mateixes condicions (ús normal)' },
                                ].map((o, i) => (
                                    <div key={i} className="p-3 bg-rose-50 rounded-lg text-center">
                                        <p className="text-xl mb-1">{o.icon}</p>
                                        <p className="font-bold text-rose-700 text-sm">{o.title}</p>
                                        <p className="text-xs text-gray-600">{o.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </Card>
                        
                        {/* Consells abans de firmar */}
                        <Card>
                            <h3 className="font-bold text-gray-800 mb-4">✅ Checklist abans de firmar</h3>
                            <div className="grid md:grid-cols-2 gap-3">
                                {[
                                    'Visita el pis de dia i comprova tot',
                                    'Demana nota simple del Registre (qui és el propietari)',
                                    'Verifica el certificat energètic',
                                    'Fes fotos de l\'estat actual',
                                    'Llegeix TOT el contracte abans de firmar',
                                    'Comprova que la fiança va al dipòsit oficial',
                                    'Acorda per escrit qui paga cada despesa',
                                    'Demana còpia firmada del contracte',
                                ].map((c, i) => (
                                    <div key={i} className="flex items-center gap-2 p-2 bg-violet-50 rounded-lg">
                                        <span className="text-violet-500 font-bold">☐</span>
                                        <span className="text-sm text-gray-700">{c}</span>
                                    </div>
                                ))}
                            </div>
                        </Card>
                        
                        {/* Despeses */}
                        <Card>
                            <h3 className="font-bold text-gray-800 mb-4">💸 Qui paga què?</h3>
                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="p-4 bg-rose-50 border border-rose-200 rounded-xl">
                                    <h4 className="font-bold text-rose-700 mb-2">👤 INQUILÍ paga</h4>
                                    <ul className="text-sm text-gray-600 space-y-1">
                                        <li>• Lloguer mensual</li>
                                        <li>• Subministraments (llum, gas, aigua)</li>
                                        <li>• Petites reparacions d'ús (&lt;150€)</li>
                                        <li>• Taxa d'escombraries (si s'acorda)</li>
                                    </ul>
                                </div>
                                <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl">
                                    <h4 className="font-bold text-blue-700 mb-2">🏠 PROPIETARI paga</h4>
                                    <ul className="text-sm text-gray-600 space-y-1">
                                        <li>• IBI (Impost de Béns Immobles)</li>
                                        <li>• Comunitat de veïns</li>
                                        <li>• Assegurança de l'edifici</li>
                                        <li>• Reparacions d'habitabilitat</li>
                                        <li>• Despeses de formalització contracte</li>
                                    </ul>
                                </div>
                            </div>
                        </Card>
                    </div>
                );
            };

            const Contractes = () => (
                <div className="space-y-6">
                    <h2 className="text-2xl font-black text-gray-800">📋 Tipus de Contractes</h2>
                    <div className="space-y-4">
                        {[
                            { nom: '🟢 Indefinit', desc: 'Sense data de fi. El més estable.', indem: '33 dies/any (màx 24 mensualitats)', pros: ['Estabilitat', 'Accés a hipoteca', 'Més protecció'] },
                            { nom: '🟡 Temporal', desc: 'Data de fi. Molt limitat des de reforma 2022.', indem: '12 dies/any', pros: ['Entrada ràpida', 'Pot ser indefinit'] },
                            { nom: '🔵 Pràctiques', desc: 'Per a titulats recents. Màx 1 any.', indem: 'Sense indemnització', pros: ['Primera experiència', 'Cotització SS'] },
                            { nom: '🟣 Formació', desc: 'Treball + formació. 16-30 anys.', indem: 'Sense indemnització', pros: ['Aprens mentre treballes', 'Pot ser indefinit'] },
                            { nom: '🟤 Fix-discontinu', desc: 'Treballs estacionals.', indem: '33 dies/any com indefinit', pros: ['Estabilitat estacional', 'Atur entre temporades'] }
                        ].map((c, i) => (
                            <Card key={i}>
                                <div className="flex flex-col md:flex-row md:items-center gap-4">
                                    <div className="flex-1">
                                        <h3 className="font-bold text-gray-800 text-lg">{c.nom}</h3>
                                        <p className="text-sm text-gray-500">{c.desc}</p>
                                    </div>
                                    <div className="flex gap-4">
                                        <div className="p-3 bg-violet-50 rounded-xl">
                                            <p className="text-xs text-gray-500">Indemnització</p>
                                            <p className="text-sm font-medium text-violet-700">{c.indem}</p>
                                        </div>
                                        <div className="p-3 bg-emerald-50 rounded-xl">
                                            <p className="text-xs text-gray-500">Avantatges</p>
                                            {c.pros.map((p, j) => <p key={j} className="text-xs text-emerald-600">✓ {p}</p>)}
                                        </div>
                                    </div>
                                </div>
                            </Card>
                        ))}
                    </div>
                    <Card className="bg-violet-50 border-violet-200">
                        <h3 className="font-bold text-gray-800 mb-3">🛡️ Drets bàsics</h3>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                            {['SMI: 1.134€/mes (14 pagues)', '30 dies vacances/any', '14 festius', 'Baixa per malaltia', 'Permís maternitat/paternitat: 16 setmanes', 'Finiquito en acabar'].map((d, i) => (
                                <div key={i} className="text-sm text-gray-600">✓ {d}</div>
                            ))}
                        </div>
                    </Card>
                </div>
            );

            const CV = () => (
                <div className="space-y-6">
                    <h2 className="text-2xl font-black text-gray-800">📄 Com fer un CV Professional</h2>
                    <div className="space-y-4">
                        {[
                            { num: '1', t: 'Dades personals', d: 'Nom, telèfon, email, LinkedIn. NO foto llevat que la demanen.', tips: ['Email professional', 'LinkedIn actualitzat'] },
                            { num: '2', t: 'Perfil', d: '2-3 línies resumint qui ets i què aportes.', tips: ['Adapta a cada oferta', 'Paraules clau'] },
                            { num: '3', t: 'Experiència', d: 'De recent a antic. Empresa, càrrec, èxits amb dades.', tips: ['Verbs d\'acció', 'Quantifica: "+25% vendes"'] },
                            { num: '4', t: 'Formació', d: 'Títols i cursos rellevants.', tips: ['No cal ESO', 'Certificacions reconegudes'] },
                            { num: '5', t: 'Habilitats', d: 'Idiomes (nivell real), programes, competències.', tips: ['Sigues honest', 'Prioritza segons oferta'] }
                        ].map((p, i) => (
                            <Card key={i}>
                                <div className="flex gap-4">
                                    <div className="w-10 h-10 bg-violet-500 text-white rounded-full flex items-center justify-center font-bold flex-shrink-0">{p.num}</div>
                                    <div className="flex-1">
                                        <h3 className="font-bold text-gray-800">{p.t}</h3>
                                        <p className="text-sm text-gray-500">{p.d}</p>
                                        <div className="flex flex-wrap gap-2 mt-2">
                                            {p.tips.map((tip, j) => <span key={j} className="text-xs px-2 py-1 bg-violet-100 text-violet-700 rounded-full">💡 {tip}</span>)}
                                        </div>
                                    </div>
                                </div>
                            </Card>
                        ))}
                    </div>
                    <div className="grid md:grid-cols-2 gap-4">
                        <Card className="bg-red-50 border-red-200">
                            <h3 className="font-bold text-red-700 mb-2">❌ Errors</h3>
                            {['Més de 2 pàgines', 'Faltes ortografia', 'Email sexy_boy@...', 'Mentir', 'Disseny recarregat'].map((e, i) => <p key={i} className="text-sm text-red-600">• {e}</p>)}
                        </Card>
                        <Card className="bg-emerald-50 border-emerald-200">
                            <h3 className="font-bold text-emerald-700 mb-2">✅ Consells</h3>
                            {['Guarda en PDF', 'Nom: CV_Nom_Cognom.pdf', 'Revisa diverses vegades', 'Adapta a cada oferta', 'Plantilla neta'].map((c, i) => <p key={i} className="text-sm text-emerald-600">• {c}</p>)}
                        </Card>
                    </div>
                </div>
            );

            const glossari = [
                { t: 'IRPF', d: "Impost sobre la Renda. L'impost pels teus ingressos." },
                { t: 'Salari brut', d: 'Total abans de deduccions.' },
                { t: 'Salari net', d: 'El que reps després de deduccions.' },
                { t: 'Seguretat Social', d: 'Sistema públic: sanitat, pensions, atur.' },
                { t: 'Euríbor', d: 'Índex per hipoteques variables.' },
                { t: 'TAE', d: "Cost real d'un préstec amb comissions." },
                { t: 'TIN', d: "Interès pur sense comissions." },
                { t: 'Amortització', d: 'Pagament del capital del préstec.' },
                { t: 'Finiquito', d: 'Liquidació quan acaba el contracte.' },
                { t: 'Indemnització', d: 'Compensació per acomiadament.' },
                { t: 'Conveni', d: 'Acord que regula condicions laborals del sector.' },
                { t: 'Base imposable', d: "Import sobre el qual es calcula l'impost." },
                { t: 'Retenció', d: "Quantitat descomptada a compte de l'IRPF." },
                { t: 'Hipoteca', d: "Préstec amb garantia d'un immoble." },
                { t: 'Diferencial', d: "Marge que el banc afegeix a l'Euríbor." },
                { t: 'Interès compost', d: 'Interessos que generen nous interessos.' }
            ];

            const Glossari = () => {
                const filtered = glossari.filter(g => g.t.toLowerCase().includes(searchTerm.toLowerCase()) || g.d.toLowerCase().includes(searchTerm.toLowerCase()));

                    <div className="space-y-6">

                        <div className="grid md:grid-cols-2 gap-4">

                                <Card key={i}>
                                    <h3 className="font-bold text-violet-600">{g.t}</h3>
                                    <p className="text-sm text-gray-600">{g.d}</p>

                <div className="min-h-screen">
                    <PdeHeader

                        setIdioma={(lang) => { setIdioma(lang); PdeLanguageStore.set(lang); }}

                        sections={[
                            { id: 'inicio', label: t('nav', 'inicio'), emoji: '🏠' },
                            { id: 'nomina', label: t('nav', 'nomina'), emoji: '💳' },
                            { id: 'hipoteca', label: t('nav', 'hipoteca'), emoji: '🏠' },
                            { id: 'estalvi', label: t('nav', 'estalvi'), emoji: '🐷' },
                            { id: 'pressupost', label: t('nav', 'pressupost'), emoji: '💰' },

                            { id: 'lloguer', label: t('nav', 'lloguer'), emoji: '🏘️' },
                            { id: 'contractes', label: t('nav', 'contractes'), emoji: '📋' },
                            { id: 'cv', label: t('nav', 'cv'), emoji: '📄' },
                            { id: 'glossari', label: t('nav', 'glossari'), emoji: '📖' },

                        {section === 'pressupost' && <Pressupost />}

                        {section === 'renda' && <Renda />}
                        {section === 'impostos' && <Impostos />}
