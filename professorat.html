                id: Date.now() + '_' + idx,

        // ============================================================
        // COMPONENT: Step Indicator
        // ============================================================
        function StepIndicator({ steps, currentStep, setStep, t }) {
            return (
                <div className="flex items-center justify-center gap-1 mb-8 flex-wrap">
                    {steps.map(function(step, idx) {
                        var isActive = idx === currentStep;
                        var isDone = idx < currentStep;
                        return (
                            <button
                                key={idx}
                                onClick={function() { if (isDone) setStep(idx); }}
                                className={'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
                                    (isActive ? 'bg-green-600 text-white shadow-lg' :
                                     isDone ? 'bg-green-100 text-green-700 cursor-pointer hover:bg-green-200' :
                                     'bg-gray-100 text-gray-400 cursor-default')}
                            >
                                <span className={'w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ' +
                                    (isActive ? 'bg-white text-green-600' :
                                     isDone ? 'bg-green-500 text-white' :
                                     'bg-gray-300 text-white')}>
                                    {isDone ? '✓' : idx + 1}
                                </span>
                                <span className="hidden md:inline">{step}</span>
                            </button>
                        );
                    })}
                </div>
            );
        }

        // ============================================================
        // STEP 1: Subject Selection
        // ============================================================
        function Step1Subject({ sa, setSA, t, idioma }) {
            var subjects = Object.keys(CURRICULUM);

            function selectSubject(subjectId) {
                setSA(function(prev) { return Object.assign({}, prev, { subject: subjectId, selectedCE: [], selectedCA: [], selectedSaberes: [], selectedCC: [] }); });
            }

            function loadTemplate(template) {
                var newSA = createEmptySA();
                newSA.subject = template.subject;
                newSA.title = template.name[idioma] || template.name.val;
                newSA.justification = template.justification[idioma] || template.justification.val;
                newSA.sessions = template.sessions;
                newSA.trimester = template.trimester;
                newSA.product = template.product[idioma] || template.product.val;
                newSA.selectedCE = template.selectedCE;
                newSA.methodology = template.methodology;
                // Auto-select CA from selected CE
                var curriculum = CURRICULUM[template.subject];
                var autoCA = [];
                curriculum.ce.forEach(function(ce) {
                    if (template.selectedCE.includes(ce.id)) {
                        ce.ca.forEach(function(ca) { autoCA.push(ce.id + '.' + ca.id); });
                    }
                });
                newSA.selectedCA = autoCA;
                newSA.selectedSaberes = template.selectedSaberes;
                // Auto-select CC from CE
                var autoCC = [];
                curriculum.ce.forEach(function(ce) {
                    if (template.selectedCE.includes(ce.id) && ce.ccClau) {
                        ce.ccClau.forEach(function(cc) { if (!autoCC.includes(cc)) autoCC.push(cc); });
                    }
                });
                newSA.selectedCC = autoCC;
                setSA(newSA);
            }

            return (
                <div className="fade-in">
                    <h3 className="text-xl font-bold text-gray-800 mb-6">{t('selectSubject')}</h3>
                    <div className="grid md:grid-cols-2 gap-4 mb-10">
                        {subjects.map(function(key) {
                            var subj = CURRICULUM[key];
                            var isSelected = sa.subject === key;
                            return (
                                <button key={key} onClick={function() { selectSubject(key); }}
                                    className={'p-6 rounded-2xl border-2 text-left transition-all duration-200 ' +
                                        (isSelected ? 'border-green-500 bg-green-50 shadow-lg scale-[1.02]' : 'border-gray-200 bg-white hover:border-green-300 hover:shadow-md')}>
                                    <div className="flex items-center gap-3 mb-2">
                                        <span className={'text-3xl w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-r ' + subj.gradient + ' text-white'}>{subj.emoji}</span>
                                        <div>
                                            <h4 className="font-bold text-gray-800">{subj.name[idioma] || subj.name.val}</h4>
                                            <p className="text-sm text-gray-500">{subj.nivel[idioma] || subj.nivel.val}</p>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-400 mt-2">{subj.normativa}</p>
                                    {isSelected && <div className="mt-3 text-green-600 text-sm font-semibold flex items-center gap-1">✓ Seleccionada</div>}
                                </button>
                            );
                        })}
                    </div>

                    {/* Templates */}
                    <h3 className="text-xl font-bold text-gray-800 mb-4">{t('orTemplate')}</h3>
                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {SA_TEMPLATES.map(function(tmpl) {
                            var subj = CURRICULUM[tmpl.subject];
                            return (
                                <button key={tmpl.id} onClick={function() { loadTemplate(tmpl); }}
                                    className="p-4 rounded-xl border border-gray-200 bg-white hover:border-green-300 hover:shadow-md text-left transition-all">
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="text-2xl">{tmpl.emoji}</span>
                                        <h4 className="font-semibold text-gray-800 text-sm leading-tight">{tmpl.name[idioma] || tmpl.name.val}</h4>
                                    </div>
                                    <div className="flex items-center gap-2 text-xs text-gray-400">
                                        <span>{subj.emoji} {subj.name[idioma] || subj.name.val}</span>
                                        <span>·</span>
                                        <span>{tmpl.sessions} {t('sessions')}</span>
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ============================================================
        // STEP 2: Basic Info

        // ============================================================
        // STEP 3: Curriculum Elements
        // ============================================================
        function Step3Curriculum({ sa, setSA, t, idioma }) {
            var curriculum = CURRICULUM[sa.subject];
            if (!curriculum) return <div className="text-center text-gray-400 py-10">Selecciona primer una assignatura</div>;

            function toggleArray(field, value) {
                setSA(function(prev) {
                    var arr = prev[field].slice();
                    var idx = arr.indexOf(value);
                    if (idx >= 0) arr.splice(idx, 1);
                    else arr.push(value);
                    var n = Object.assign({}, prev);
                    n[field] = arr;
                    return n;
                });
            }

            // Auto-select CC from selected CE
            useEffect(function() {
                var autoCC = [];
                curriculum.ce.forEach(function(ce) {
                    if (sa.selectedCE.includes(ce.id) && ce.ccClau) {
                        ce.ccClau.forEach(function(cc) { if (!autoCC.includes(cc)) autoCC.push(cc); });
                    }
                });
                setSA(function(prev) { return Object.assign({}, prev, { selectedCC: autoCC }); });
            }, [sa.selectedCE.join(',')]);

            return (
                <div className="fade-in">
                    <h3 className="text-xl font-bold text-gray-800 mb-6">{t('step3')}</h3>

                    {/* CE Selection */}
                    <div className="mb-8">
                        <h4 className="text-md font-bold text-gray-700 mb-3">{t('ceTitle')}</h4>
                        <p className="text-sm text-gray-400 mb-3">{t('selectCE')}</p>
                        <div className="space-y-3">
                            {curriculum.ce.map(function(ce) {
                                var isSelected = sa.selectedCE.includes(ce.id);
                                return (
                                    <button key={ce.id} onClick={function() { toggleArray('selectedCE', ce.id); }}
                                        className={'w-full text-left p-4 rounded-xl border-2 transition-all ' +
                                            (isSelected ? 'border-green-500 bg-green-50' : 'border-gray-200 bg-white hover:border-green-300')}>
                                        <div className="flex items-start gap-3">
                                            <span className={'w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5 ' +
                                                (isSelected ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-500')}>{isSelected ? '✓' : ce.id.replace('CE', '')}</span>
                                            <div>
                                                <span className="font-bold text-gray-800">{ce.id}: </span>
                                                <span className="text-sm text-gray-600">{ce.short[idioma] || ce.short.val}</span>
                                                {isSelected && <p className="text-xs text-gray-500 mt-1">{ce.desc[idioma] || ce.desc.val}</p>}
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* CA Selection (only for selected CE) */}
                    {sa.selectedCE.length > 0 && (
                        <div className="mb-8">
                            <h4 className="text-md font-bold text-gray-700 mb-3">{t('caTitle')}</h4>
                            <p className="text-sm text-gray-400 mb-3">{t('selectCA')}</p>
                            {curriculum.ce.filter(function(ce) { return sa.selectedCE.includes(ce.id); }).map(function(ce) {
                                return (
                                    <div key={ce.id} className="mb-4">
                                        <h5 className="text-sm font-bold text-green-700 mb-2">{ce.id}: {ce.short[idioma] || ce.short.val}</h5>
                                        <div className="space-y-2 pl-4">
                                            {ce.ca.map(function(ca) {
                                                var caKey = ce.id + '.' + ca.id;
                                                var isSelected = sa.selectedCA.includes(caKey);
                                                return (
                                                    <button key={caKey} onClick={function() { toggleArray('selectedCA', caKey); }}
                                                        className={'w-full text-left p-3 rounded-lg border transition-all text-sm ' +
                                                            (isSelected ? 'border-green-400 bg-green-50' : 'border-gray-200 bg-white hover:border-green-300')}>
                                                        <div className="flex items-start gap-2">
                                                            <span className={'w-5 h-5 rounded flex items-center justify-center text-xs flex-shrink-0 ' +
                                                                (isSelected ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-500')}>{isSelected ? '✓' : ''}</span>
                                                            <span><strong>{ca.id}:</strong> {ca.desc[idioma] || ca.desc.val}</span>
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* Saberes Básicos Selection */}
                    <div className="mb-8">
                        <h4 className="text-md font-bold text-gray-700 mb-3">{t('saberesTitle')}</h4>
                        <p className="text-sm text-gray-400 mb-3">{t('selectSaberes')}</p>
                        {curriculum.saberes.map(function(bloque) {
                            return (
                                <div key={bloque.bloque} className="mb-4">
                                    <h5 className="text-sm font-bold text-emerald-700 mb-2">
                                        {idioma === 'en' ? 'Block' : 'Bloc'} {bloque.bloque}: {bloque.name[idioma] || bloque.name.val}

                                        {bloque.items.map(function(item) {
                                            var isSelected = sa.selectedSaberes.includes(item.id);

                                                <button key={item.id} onClick={function() { toggleArray('selectedSaberes', item.id); }}

                                        {cc.emoji} {cc.id}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================
        // STEP 4: Activity Sequence Builder
        // ============================================================
        function Step4Activities({ sa, setSA, t, idioma }) {
            function addActivity() {
                setSA(function(prev) {
                    return Object.assign({}, prev, {
                        activities: prev.activities.concat([createDefaultActivity(prev.activities.length)])
                    });
                });
            }

            function updateActivity(idx, field, value) {
                setSA(function(prev) {
                    var acts = prev.activities.slice();
                    acts[idx] = Object.assign({}, acts[idx]);
                    acts[idx][field] = value;
                    return Object.assign({}, prev, { activities: acts });
                });
            }

            function removeActivity(idx) {
                setSA(function(prev) {
                    var acts = prev.activities.slice();
                    acts.splice(idx, 1);
                    return Object.assign({}, prev, { activities: acts });
                });
            }

            function suggestActivities() {
                var suggestions = [
                    { name: idioma === 'es' ? 'Activación de conocimientos previos' : idioma === 'en' ? 'Prior knowledge activation' : 'Activació de coneixements previs', type: 'motivacio', grouping: 'gran-grup', sessions: 1, description: '', resources: '' },
                    { name: idioma === 'es' ? 'Investigación por grupos' : idioma === 'en' ? 'Group research' : 'Investigació per grups', type: 'investigacio', grouping: 'petit-grup', sessions: 2, description: '', resources: '' },
                    { name: idioma === 'es' ? 'Puesta en común y debate' : idioma === 'en' ? 'Sharing and debate' : 'Posada en comú i debat', type: 'debat', grouping: 'gran-grup', sessions: 1, description: '', resources: '' },
                    { name: idioma === 'es' ? 'Elaboración del producto final' : idioma === 'en' ? 'Final product creation' : 'Elaboració del producte final', type: 'producte', grouping: 'petit-grup', sessions: Math.max(2, sa.sessions - 5), description: '', resources: '' },
                    { name: idioma === 'es' ? 'Presentación y evaluación' : idioma === 'en' ? 'Presentation and assessment' : 'Presentació i avaluació', type: 'exposicio', grouping: 'petit-grup', sessions: 1, description: '', resources: '' },
                    { name: idioma === 'es' ? 'Reflexión final' : idioma === 'en' ? 'Final reflection' : 'Reflexió final', type: 'reflexio', grouping: 'individual', sessions: 1, description: '', resources: '' },
                ];
                var newActs = suggestions.map(function(s, i) {
                    return Object.assign({ id: Date.now() + '_' + i }, s);
                });
                setSA(function(prev) { return Object.assign({}, prev, { activities: newActs }); });
            }

            var totalSessions = sa.activities.reduce(function(sum, a) { return sum + (a.sessions || 0); }, 0);

            return (
                <div className="fade-in">
                    <div className="flex items-center justify-between mb-6">
                        <h3 className="text-xl font-bold text-gray-800">{t('step4')}</h3>
                        <div className="flex items-center gap-3">
                            <span className={'text-sm font-medium px-3 py-1 rounded-full ' + (totalSessions === sa.sessions ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700')}>
                                {totalSessions} / {sa.sessions} {t('sessions')}
                            </span>
                            <button onClick={suggestActivities} className="text-sm px-4 py-2 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 transition-all font-medium">
                                {t('suggestActs')}
                            </button>
                        </div>
                    </div>

                    <div className="space-y-4">
                        {sa.activities.map(function(act, idx) {
                            var actType = ACTIVITY_TYPES.find(function(at) { return at.id === act.type; });
                            var phaseColor = actType && actType.phase === 'initial' ? 'border-l-blue-500' : actType && actType.phase === 'final' ? 'border-l-amber-500' : 'border-l-green-500';
                            return (
                                <div key={act.id} className={'bg-white rounded-xl border border-gray-200 p-4 border-l-4 ' + phaseColor}>
                                    <div className="flex items-center justify-between mb-3">
                                        <span className="text-sm font-bold text-gray-400">#{idx + 1}</span>
                                        <button onClick={function() { removeActivity(idx); }} className="text-xs text-red-400 hover:text-red-600 transition-colors">
                                            {t('removeAct')} ✕
                                        </button>
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-3">
                                        <div>

        // ============================================================
        // STEP 5: Assessment & DUA
        // ============================================================
        function Step5Assessment({ sa, setSA, t, idioma }) {
            function toggleArray(field, value) {
                setSA(function(prev) {
                    var arr = prev[field].slice();
                    var idx = arr.indexOf(value);
                    if (idx >= 0) arr.splice(idx, 1);
                    else arr.push(value);
                    var n = Object.assign({}, prev);
                    n[field] = arr;
                    return n;
                });
            }

            function toggleDUA(category, value) {
                setSA(function(prev) {
                    var dua = Object.assign({}, prev.dua);
                    var arr = dua[category].slice();
                    var idx = arr.indexOf(value);
                    if (idx >= 0) arr.splice(idx, 1);
                    else arr.push(value);
                    dua[category] = arr;
                    return Object.assign({}, prev, { dua: dua });
                });
            }

            return (
                <div className="fade-in">
                    <h3 className="text-xl font-bold text-gray-800 mb-6">{t('step5')}</h3>

                    {/* Methodology */}
                    <div className="mb-8">
                        <h4 className="text-md font-bold text-gray-700 mb-3">{t('methodology')}</h4>
                        <div className="flex flex-wrap gap-2">
                            {METHODOLOGIES.map(function(m) {
                                var isSelected = sa.methodology.includes(m.id);
                                return (
                                    <button key={m.id} onClick={function() { toggleArray('methodology', m.id); }}
                                        className={'px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
                                            (isSelected ? 'bg-green-100 text-green-700 ring-2 ring-green-400' : 'bg-gray-100 text-gray-500 hover:bg-gray-200')}>
                                        {m.emoji} {m.name[idioma] || m.name.val}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Assessment Instruments */}
                    <div className="mb-8">
                        <h4 className="text-md font-bold text-gray-700 mb-3">{t('instruments')}</h4>
                        <div className="flex flex-wrap gap-2">
                            {ASSESSMENT_INSTRUMENTS.map(function(inst) {
                                var isSelected = sa.instruments.includes(inst.id);
                                return (
                                    <button key={inst.id} onClick={function() { toggleArray('instruments', inst.id); }}
                                        className={'px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
                                            (isSelected ? 'bg-blue-100 text-blue-700 ring-2 ring-blue-400' : 'bg-gray-100 text-gray-500 hover:bg-gray-200')}>
                                        {inst.emoji} {inst.name[idioma] || inst.name.val}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Assessment Types */}
                    <div className="mb-8">
                        <h4 className="text-md font-bold text-gray-700 mb-3">{t('assessTypes')}</h4>
                        <div className="flex flex-wrap gap-2">
                            {ASSESSMENT_TYPES.map(function(at) {
                                var isSelected = sa.assessTypes.includes(at.id);
                                return (
                                    <button key={at.id} onClick={function() { toggleArray('assessTypes', at.id); }}
                                        className={'px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
                                            (isSelected ? 'bg-purple-100 text-purple-700 ring-2 ring-purple-400' : 'bg-gray-100 text-gray-500 hover:bg-gray-200')}>
                                        {at.emoji} {at.name[idioma] || at.name.val}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* DUA */}
                    <div>
                        <h4 className="text-md font-bold text-gray-700 mb-4">{t('duaTitle')}</h4>

                        {[
                            { key: 'representation', label: t('duaRepresentation'), items: DUA_MEASURES.representation, color: 'indigo' },
                            { key: 'engagement',     label: t('duaEngagement'),     items: DUA_MEASURES.engagement,     color: 'pink' },

        // ============================================================
        // SA GENERATOR — Main Wizard
        // ============================================================
        function SAGenerator({ idioma }) {
            const t = useMemo(function() { return createTranslator(translations, idioma); }, [idioma]);
            const [step, setStep] = useState(0);
            const [sa, setSA] = useState(function() {
                // Try to load draft
                try {
                    var draft = localStorage.getItem('pde_sa_draft');
                    if (draft) return JSON.parse(draft);
                } catch (e) {}
                return createEmptySA();
            });

            var steps = [t('step1'), t('step2'), t('step3'), t('step4'), t('step5'), t('step6')];

            function canProceed() {
                switch (step) {
                    case 0: return sa.subject !== '';
                    case 1: return sa.title.trim() !== '';
                    case 2: return sa.selectedCE.length > 0;
                    case 3: return true;
                    case 4: return true;
                    default: return true;
                }
            }

            function handleNewSA() {
                setSA(createEmptySA());
                setStep(0);
                try { localStorage.removeItem('pde_sa_draft'); } catch (e) {}
            }

            function handleLoadDraft() {
                try {
                    var draft = localStorage.getItem('pde_sa_draft');
                    if (draft) {
                        setSA(JSON.parse(draft));
                        alert(idioma === 'es' ? 'Borrador cargado' : idioma === 'en' ? 'Draft loaded' : 'Esborrany carregat');
                    }
                } catch (e) {}
            }

            return (
                <div>
                    <div className="flex items-center justify-between mb-6">
                        <div></div>
                        <div className="flex gap-2 no-print">
                            <button onClick={handleLoadDraft} className="text-xs px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-all">
                                📂 {t('loadDraft')}
                            </button>
                            <button onClick={handleNewSA} className="text-xs px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-all">
                                ✨ {t('newSA')}
                            </button>
                        </div>
                    </div>

                    <div className="no-print">
                        <StepIndicator steps={steps} currentStep={step} setStep={setStep} t={t} />
                    </div>

                    {/* Step content */}
                    <div className="mb-8">
                        {step === 0 && <Step1Subject sa={sa} setSA={setSA} t={t} idioma={idioma} />}
                        {step === 1 && <Step2BasicInfo sa={sa} setSA={setSA} t={t} idioma={idioma} />}
                        {step === 2 && <Step3Curriculum sa={sa} setSA={setSA} t={t} idioma={idioma} />}
                        {step === 3 && <Step4Activities sa={sa} setSA={setSA} t={t} idioma={idioma} />}
                        {step === 4 && <Step5Assessment sa={sa} setSA={setSA} t={t} idioma={idioma} />}
                        {step === 5 && <Step6Preview sa={sa} t={t} idioma={idioma} />}
                    </div>

                    {/* Navigation buttons */}
                    <div className="flex justify-between no-print">
                        <button onClick={function() { setStep(Math.max(0, step - 1)); }}
                            className={'px-6 py-3 rounded-xl font-medium transition-all ' + (step > 0 ? 'bg-gray-100 text-gray-700 hover:bg-gray-200' : 'invisible')}>
                            ← {t('prev')}
                        </button>

                        {step < steps.length - 1 ? (
                            <button onClick={function() { if (canProceed()) setStep(step + 1); }}
                                disabled={!canProceed()}
                                className={'px-6 py-3 rounded-xl font-medium transition-all ' +
                                    (canProceed() ? 'bg-green-600 text-white hover:bg-green-700 shadow-lg' : 'bg-gray-200 text-gray-400 cursor-not-allowed')}>
                                {t('next')} →
                            </button>
                        ) : (
                            <button onClick={function() { window.print(); }}
                                className="px-6 py-3 rounded-xl font-medium bg-green-600 text-white hover:bg-green-700 shadow-lg transition-all">
                                🖨️ {t('print')}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================================
        // TEST GENERATOR
        // ============================================================
        function TestGenerator({ idioma }) {
            const t = useMemo(function() { return createTranslator(translations, idioma); }, [idioma]);
            const [config, setConfig] = useState({
                subject: '',
                selectedSaberes: [],
                questionTypes: ['testMultiple', 'testTF', 'testOpen'],
                difficulty: 'testMedium',
                numQuestions: 10,
                duration: 60,
                instructions: '',
                weights: { testMultiple: 30, testTF: 20, testOpen: 50 },
            });
            const [generated, setGenerated] = useState(false);

            function updateConfig(field, value) {
                setConfig(function(prev) { var n = Object.assign({}, prev); n[field] = value; return n; });
            }

            function toggleQType(qtype) {
                setConfig(function(prev) {
                    var arr = prev.questionTypes.slice();
                    var idx = arr.indexOf(qtype);
                    if (idx >= 0) arr.splice(idx, 1);
                    else arr.push(qtype);
                    return Object.assign({}, prev, { questionTypes: arr });
                });
            }

            function toggleSaber(saberId) {
                setConfig(function(prev) {
                    var arr = prev.selectedSaberes.slice();
                    var idx = arr.indexOf(saberId);
                    if (idx >= 0) arr.splice(idx, 1);
                    else arr.push(saberId);
                    return Object.assign({}, prev, { selectedSaberes: arr });
                });
            }

            var curriculum = config.subject ? CURRICULUM[config.subject] : null;

            var QTYPES = [
                { id: 'testMultiple', label: t('testMultiple'), emoji: '🔘' },
                { id: 'testTF',      label: t('testTF'),       emoji: '✅' },
                { id: 'testOpen',    label: t('testOpen'),     emoji: '📝' },
                { id: 'testProblem', label: t('testProblem'),  emoji: '🧮' },
                { id: 'testCase',    label: t('testCase'),     emoji: '📋' },
            ];

            var DIFFICULTIES = [
                { id: 'testEasy',   label: t('testEasy'),   color: 'bg-green-100 text-green-700' },
                { id: 'testMedium', label: t('testMedium'), color: 'bg-amber-100 text-amber-700' },
                { id: 'testHard',   label: t('testHard'),   color: 'bg-red-100 text-red-700' },
            ];

            function generateTest() { setGenerated(true); }

            function renderTestPreview() {
                if (!curriculum) return null;
                var qPerType = {};
                var totalWeight = 0;
                config.questionTypes.forEach(function(qt) { totalWeight += (config.weights[qt] || 0); });
                config.questionTypes.forEach(function(qt) {
                    var w = config.weights[qt] || 0;
                    qPerType[qt] = Math.max(1, Math.round(config.numQuestions * w / (totalWeight || 1)));
                });

                // Gather selected topics
                var topics = [];
                if (curriculum) {
                    curriculum.saberes.forEach(function(bloque) {
                        bloque.items.forEach(function(item) {
                            if (config.selectedSaberes.length === 0 || config.selectedSaberes.includes(item.id)) {
                                topics.push(item.desc[idioma] || item.desc.val);
                            }
                        });
                    });
                }

                return (
                    <div className="sa-preview bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden mt-6">
                        <div className={'p-6 bg-gradient-to-r ' + curriculum.gradient + ' text-white'}>
                            <div className="flex items-center justify-between">
                                <div>
                                    <h2 className="text-xl font-black">{curriculum.name[idioma] || curriculum.name.val} — {idioma === 'es' ? 'Prueba' : idioma === 'en' ? 'Test' : 'Prova'}</h2>
                                    <p className="text-sm opacity-80">{curriculum.nivel[idioma] || curriculum.nivel.val}</p>
                                </div>
                                <div className="text-right text-sm">
                                    <p>{idioma === 'es' ? 'Nombre' : idioma === 'en' ? 'Name' : 'Nom'}: ___________________</p>
                                    <p>{idioma === 'es' ? 'Fecha' : idioma === 'en' ? 'Date' : 'Data'}: ___________</p>
                                    <p>{t('testDuration')}: {config.duration} min</p>
                                </div>
                            </div>
                        </div>
                        <div className="p-6">
                            {config.instructions && (
                                <div className="mb-4 p-3 bg-gray-50 rounded-lg text-sm text-gray-600 italic">{config.instructions}</div>
                            )}

                            {/* Generate question placeholders by type */}
                            {config.questionTypes.map(function(qt) {
                                var qtype = QTYPES.find(function(q) { return q.id === qt; });
                                var count = qPerType[qt] || 1;
                                var weight = config.weights[qt] || 0;
                                return (
                                    <div key={qt} className="mb-6">
                                        <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                            {qtype ? qtype.emoji : ''} {qtype ? qtype.label : qt}
                                            <span className="text-xs font-normal text-gray-400">({weight}% — {count} {count === 1 ? idioma === 'es' ? 'pregunta' : idioma === 'en' ? 'question' : 'pregunta' : idioma === 'es' ? 'preguntas' : idioma === 'en' ? 'questions' : 'preguntes'})</span>
                                        </h3>

                                        {Array.from({ length: count }, function(_, i) {
                                            if (qt === 'testMultiple') {
                                                return (
                                                    <div key={i} className="mb-4 pl-4 border-l-2 border-gray-200">
                                                        <p className="font-medium text-gray-700 mb-2">{i + 1}. ______________________________________</p>
                                                        <div className="grid grid-cols-2 gap-1 pl-4 text-sm text-gray-500">
                                                            <p>a) _______________</p>
                                                            <p>b) _______________</p>
                                                            <p>c) _______________</p>
                                                            <p>d) _______________</p>
                                                        </div>
                                                    </div>
                                                );
                                            } else if (qt === 'testTF') {
                                                return (
                                                    <div key={i} className="mb-3 pl-4 border-l-2 border-gray-200 flex items-center gap-3">
                                                        <span className="text-gray-700">{i + 1}.</span>
                                                        <span className="flex-1 text-gray-500">______________________________________</span>
                                                        <span className="text-xs text-gray-400">V / F</span>
                                                    </div>
                                                );
                                            } else if (qt === 'testProblem') {
                                                return (
                                                    <div key={i} className="mb-4 pl-4 border-l-2 border-gray-200">
                                                        <p className="font-medium text-gray-700 mb-1">{i + 1}. ______________________________________</p>
                                                        <div className="h-24 border border-dashed border-gray-300 rounded-lg flex items-center justify-center text-gray-300 text-sm">{idioma === 'es' ? 'Espacio para cálculos' : idioma === 'en' ? 'Space for calculations' : 'Espai per a càlculs'}</div>
                                                    </div>
                                                );
                                            } else {
                                                return (
                                                    <div key={i} className="mb-4 pl-4 border-l-2 border-gray-200">
                                                        <p className="font-medium text-gray-700 mb-1">{i + 1}. ______________________________________</p>
                                                        <div className="h-16 border border-dashed border-gray-300 rounded-lg"></div>
                                                    </div>
                                                );
                                            }
                                        })}
                                    </div>
                                );
                            })}

                            <div className="pt-4 border-t border-gray-100 text-xs text-gray-400">
                                <p>{curriculum.normativa} · {idioma === 'es' ? 'Generado con PDE' : idioma === 'en' ? 'Generated with PDE' : 'Generat amb PDE'} · {new Date().toLocaleDateString()}</p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {!generated ? (
                        <div className="fade-in max-w-3xl mx-auto">
                            {/* Subject */}
                            <div className="mb-6">
                                <label className="block text-sm font-bold text-gray-700 mb-2">{t('testSubject')}</label>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    {Object.keys(CURRICULUM).map(function(key) {
                                        var subj = CURRICULUM[key];
                                        var isSelected = config.subject === key;
                                        return (
                                            <button key={key} onClick={function() { updateConfig('subject', key); }}
                                                className={'p-3 rounded-xl border-2 text-center transition-all ' +
                                                    (isSelected ? 'border-green-500 bg-green-50' : 'border-gray-200 bg-white hover:border-green-300')}>
                                                <span className="text-2xl block mb-1">{subj.emoji}</span>
                                                <span className="text-xs font-semibold text-gray-700">{subj.name[idioma] || subj.name.val}</span>
                                                <span className="text-xs text-gray-400 block">{subj.nivel[idioma] || subj.nivel.val}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Topics (saberes) */}
                            {curriculum && (
                                <div className="mb-6">
                                    <label className="block text-sm font-bold text-gray-700 mb-2">{t('testTopics')}</label>
                                    <p className="text-xs text-gray-400 mb-2">{idioma === 'es' ? 'Selecciona los temas a evaluar (dejar vacío = todos)' : idioma === 'en' ? 'Select topics to assess (empty = all)' : 'Selecciona els temes a avaluar (buit = tots)'}</p>
                                    {curriculum.saberes.map(function(bloque) {
                                        return (
                                            <div key={bloque.bloque} className="mb-3">
                                                <h5 className="text-xs font-bold text-gray-500 mb-1">{idioma === 'en' ? 'Block' : 'Bloc'} {bloque.bloque}: {bloque.name[idioma] || bloque.name.val}</h5>
                                                <div className="flex flex-wrap gap-1">
                                                    {bloque.items.map(function(item) {
                                                        var isSelected = config.selectedSaberes.includes(item.id);
                                                        return (
                                                            <button key={item.id} onClick={function() { toggleSaber(item.id); }}
                                                                className={'px-2 py-1 rounded text-xs transition-all ' +
                                                                    (isSelected ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200')}
                                                                title={item.desc[idioma] || item.desc.val}>
                                                                {item.id}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {/* Question types */}
                            <div className="mb-6">
                                <label className="block text-sm font-bold text-gray-700 mb-2">{t('testQTypes')}</label>
                                <div className="flex flex-wrap gap-2">
                                    {QTYPES.map(function(qt) {
                                        var isSelected = config.questionTypes.includes(qt.id);
                                        return (
                                            <button key={qt.id} onClick={function() { toggleQType(qt.id); }}
                                                className={'px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
                                                    (isSelected ? 'bg-green-100 text-green-700 ring-2 ring-green-400' : 'bg-gray-100 text-gray-500 hover:bg-gray-200')}>
                                                {qt.emoji} {qt.label}
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Weights per type */}
                                {config.questionTypes.length > 0 && (
                                    <div className="mt-3 p-3 bg-gray-50 rounded-lg">
                                        <p className="text-xs font-semibold text-gray-500 mb-2">{t('testWeight')}</p>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                                            {config.questionTypes.map(function(qt) {
                                                var qtype = QTYPES.find(function(q) { return q.id === qt; });
                                                return (
                                                    <div key={qt} className="flex items-center gap-2">
                                                        <span className="text-xs text-gray-600 flex-1">{qtype ? qtype.emoji + ' ' + qtype.label : qt}</span>
                                                        <input type="number" min={0} max={100} value={config.weights[qt] || 0}
                                                            onChange={function(e) {
                                                                var w = Object.assign({}, config.weights);
                                                                w[qt] = parseInt(e.target.value) || 0;
                                                                updateConfig('weights', w);
                                                            }}
                                                            className="w-16 px-2 py-1 border border-gray-300 rounded text-xs text-center" />
                                                        <span className="text-xs text-gray-400">%</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Difficulty + Num questions + Duration */}
                            <div className="grid grid-cols-3 gap-4 mb-6">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">{t('testDifficulty')}</label>
                                    <div className="flex flex-col gap-1">
                                        {DIFFICULTIES.map(function(d) {
                                            return (
                                                <button key={d.id} onClick={function() { updateConfig('difficulty', d.id); }}
                                                    className={'px-3 py-2 rounded-lg text-sm font-medium transition-all ' +
                                                        (config.difficulty === d.id ? d.color + ' ring-2 ring-green-400' : 'bg-gray-100 text-gray-500 hover:bg-gray-200')}>
                                                    {d.label}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">{t('testNumQ')}</label>
                                    <input type="number" min={1} max={50} value={config.numQuestions}
                                        onChange={function(e) { updateConfig('numQuestions', parseInt(e.target.value) || 1); }}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">{t('testDuration')}</label>
                                    <input type="number" min={10} max={180} step={5} value={config.duration}
                                        onChange={function(e) { updateConfig('duration', parseInt(e.target.value) || 60); }}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none" />
                                </div>
                            </div>

                            {/* Instructions */}
                            <div className="mb-6">
                                <label className="block text-sm font-bold text-gray-700 mb-2">{t('testInstructions')}</label>
                                <textarea value={config.instructions} onChange={function(e) { updateConfig('instructions', e.target.value); }}
                                    rows={2} placeholder={idioma === 'es' ? 'Ej: Lee atentamente cada pregunta. No se permiten calculadoras.' : idioma === 'en' ? 'E.g.: Read each question carefully. No calculators allowed.' : 'Ex: Llig atentament cada pregunta. No es permeten calculadores.'}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none resize-y text-sm" />
                            </div>

                            <button onClick={generateTest} disabled={!config.subject}
                                className={'w-full py-4 rounded-xl font-bold text-lg transition-all ' +
                                    (config.subject ? 'bg-green-600 text-white hover:bg-green-700 shadow-lg' : 'bg-gray-200 text-gray-400 cursor-not-allowed')}>
                                {t('testGenerate')}
                            </button>
                        </div>
                    ) : (
                        <div className="fade-in">
                            <div className="flex items-center justify-between mb-4 no-print">
                                <button onClick={function() { setGenerated(false); }}
                                    className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm font-medium">
                                    ← {t('prev')}
                                </button>
                                <button onClick={function() { window.print(); }}
                                    className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium shadow-lg">
                                    🖨️ {t('print')}
                                </button>
                            </div>
                            {renderTestPreview()}
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================
        // MAIN APP
        // ============================================================
        function ProfessoratApp() {
            const [idioma, setIdioma] = useState(PdeLanguageStore.get());
            const [activeTab, setActiveTab] = useState('sa');

            const t = useMemo(function() { return createTranslator(translations, idioma); }, [idioma]);

            const sections = useMemo(function() { return [
                { id: 'sa',   label: t('tabSA'),   emoji: '📋' },
                { id: 'test', label: t('tabTest'),  emoji: '📝' },
            ]; }, [idioma]);

            // Deep link support
            usePdeDeepLink(activeTab, setActiveTab);

            return (
                <div className="min-h-screen">
                    <PdeHeader
                        idioma={idioma}
                        setIdioma={setIdioma}
                        currentApp="professorat"
                        sections={sections}
                        currentSection={activeTab}
                        setSection={setActiveTab}
                    />

                    {/* Hero */}
                    <div className="no-print bg-gradient-to-r from-green-600 to-emerald-700 text-white py-10 px-4">
                        <div className="max-w-4xl mx-auto text-center">
                            <h1 className="text-3xl md:text-4xl font-black mb-2">👩‍🏫 {t('pageTitle')}</h1>
                            <p className="text-green-100 text-lg">{t('pageSubtitle')}</p>
                        </div>
                    </div>

                    {/* Tab buttons (mobile) */}
                    <div className="no-print flex justify-center gap-2 py-4 bg-white border-b border-gray-100 xl:hidden">
                        {sections.map(function(sec) {
                            return (
                                <button key={sec.id}
                                    onClick={function() { setActiveTab(sec.id); pdeSetHashSection(sec.id); }}
                                    className={'px-5 py-2.5 rounded-xl text-sm font-bold transition-all ' +
                                        (activeTab === sec.id ? 'bg-green-600 text-white shadow-lg' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                    {sec.emoji} {sec.label}
                                </button>
                            );
                        })}
                    </div>

                    {/* Content */}
                    <main className="max-w-5xl mx-auto px-4 py-8">
                        {activeTab === 'sa' && <SAGenerator idioma={idioma} />}
                        {activeTab === 'test' && <TestGenerator idioma={idioma} />}
                    </main>

                    <PdeFooter appEmoji="👩‍🏫" appName={t('pageTitle')} idioma={idioma} />
                    <PdeScrollToTop />
                </div>
            );
        }

        ReactDOM.render(<ProfessoratApp />, document.getElementById('root'));
    </script>
</body>
</html>
