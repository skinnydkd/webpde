                                <tr><td className="border border-slate-300 p-2">Distribución</td><td className="border border-slate-300 p-2">Según capacidad de pago</td><td className="border border-slate-300 p-2">Según decisión central</td><td className="border border-slate-300 p-2">Mercado + redistribución</td></tr>
                                <tr><td className="border border-slate-300 p-2">Eficiencia</td><td className="border border-slate-300 p-2">Alta (con fallos)</td><td className="border border-slate-300 p-2">Baja (distorsiones)</td><td className="border border-slate-300 p-2">Variable</td></tr>
                                <tr><td className="border border-slate-300 p-2">Equidad</td><td className="border border-slate-300 p-2">Baja</td><td className="border border-slate-300 p-2">Teóricamente alta</td><td className="border border-slate-300 p-2">Moderada-alta</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <p>
                        Como nuevos paradigmas de asignación de recursos, cabe mencionar la <strong>economía circular</strong>, que propone superar el modelo lineal "extraer-producir-consumir-desechar" por un modelo circular en el que los residuos se reintegran como insumos productivos, reduciendo la presión sobre los recursos naturales. La economía circular conecta directamente con los ODS (especialmente el ODS 12: producción y consumo responsables) y con la <strong>economía ecológica</strong>, que cuestiona el crecimiento ilimitado en un planeta de recursos finitos (N. Georgescu-Roegen, H. Daly, K. Raworth y su modelo de la "economía del donut").
                    </p>
                    <p>
                        Estos temas se desarrollan con mayor profundidad en el Tema 4 (sistemas económicos) y en el Tema 10 (medio ambiente y desarrollo sostenible).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
            <Card title="Conclusión" icon="✅">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        A lo largo de este tema se ha profundizado en los tres conceptos vertebradores de la ciencia económica: la escasez, la elección y el coste de oportunidad. La escasez, entendida como un hecho relativo y universal, obliga a individuos, empresas y gobiernos a elegir entre alternativas, y toda elección genera un coste de oportunidad que constituye el verdadero coste de las decisiones.
                    </p>
                    <p>
                        La Frontera de Posibilidades de Producción se ha revelado como una herramienta didáctica extraordinariamente versátil, capaz de ilustrar de forma visual e intuitiva conceptos como eficiencia, ineficiencia, coste de oportunidad creciente, crecimiento económico y el dilema entre consumo e inversión. Sus desplazamientos reflejan las dinámicas del desarrollo económico y conectan con la importancia de la innovación, la educación y las instituciones.
                    </p>
                    <p>
                        El estudio de los sistemas de asignación de recursos —mercado, planificación y economía mixta— muestra que no existe un modelo puro ni perfecto: todas las economías modernas combinan mecanismos de mercado con intervención estatal en proporciones variables, y la búsqueda del equilibrio entre eficiencia y equidad sigue siendo el gran debate de la ciencia económica.
                    </p>
                    <p>
                        Desde la perspectiva docente, los conceptos desarrollados en este tema son esenciales para la formación económica del alumnado. El coste de oportunidad, en particular, es un concepto transversal que aparece en prácticamente todos los temas del programa: desde la teoría del consumidor hasta la política fiscal, pasando por la evaluación de inversiones y el comercio internacional. Acercar este concepto a la experiencia cotidiana del alumnado —¿cuál es el coste de oportunidad de pasar dos horas en redes sociales?— es una estrategia pedagógica eficaz para motivar el aprendizaje y desarrollar el pensamiento económico crítico.
                    </p>
                </div>
            </Card>

                    <p className="text-center text-sm text-purple-600 mt-1">

                <div className="space-y-4 text-sm text-slate-700">
                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">1. La escasez: concepto y naturaleza</h4>
                        <ul className="list-disc pl-5 space-y-1">
                            <li>Escasez relativa (no absoluta): recursos insuficientes respecto a las necesidades.</li>
                            <li>Escasez ≠ pobreza. Universal: afecta a todos los países y personas.</li>
                            <li>Perspectiva histórica: del neolítico a la era digital. Escasez de atención (Simon).</li>

                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">2. Necesidades y recursos</h4>
                        <ul className="list-disc pl-5 space-y-1">

                            <li>Factores de producción: tierra (renta), trabajo (salario), capital (interés), iniciativa empresarial (beneficio).</li>
                            <li>Capital humano: Becker (1964), Schultz (Nobel 1979). Tecnología como multiplicador (Solow, Romer).</li>
                        </ul>
                    </div>

                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">3. La elección económica</h4>
                        <ul className="list-disc pl-5 space-y-1">

                            <li>Costes explícitos (pagos) vs. implícitos (alternativas). Beneficio contable vs. económico.</li>
                            <li>Costes irrecuperables (sunk costs): no deben influir en decisiones futuras.</li>
                        </ul>
                    </div>

                    <div>

                            <li>Pendiente = RMT (Relación Marginal de Transformación) = coste de oportunidad.</li>
                            <li>Cóncava → costes crecientes (rendimientos decrecientes). Recta → costes constantes.</li>
                        </ul>
                    </div>

                    <div>

                            <li>Simétrico vs. asimétrico. Inversión hoy = más producción mañana.</li>
                            <li>Hacia dentro: guerras, catástrofes, pandemias (COVID-19).</li>
                        </ul>
                    </div>

                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">7. Sistemas de asignación</h4>

                            <li>Economía circular como nuevo paradigma sostenible (ODS 12).</li>
                        </ul>
                    </div>
