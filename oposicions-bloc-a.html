        const Tema8 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="🌐" title="Tema 8" subtitle={t('tema8.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema8Complet />}{vista === 'resum' && <Tema8Resum />}</div>; };

        // TEMA 9 — Divisió del treball i sectors
        const Tema9Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La <strong>divisió del treball</strong> és una de les grans idees d'Adam Smith (1776): multiplica la productivitat i genera <strong>interdependència</strong>. Els <strong>sectors econòmics</strong> (Fisher-Clark) són una manera sistemàtica d'organitzar aquesta divisió. La globalització ha portat aquesta interdependència al nivell planetari.</p></div></Card>
                <Card title="1. Divisió del treball i especialització" icon="🔧">
                    <TheoryBlock title="1.1. Smith (1776) i la fàbrica d'agulles" color="purple"><p>Al cap. I del llibre I de <em>The Wealth of Nations</em>, Smith descriu una fàbrica d'agulles on 10 obrers especialitzats produeixen 48.000 agulles al dia (4.800 c.u.), mentre que si cadascú les fes senceres no en produirien ni 200. La <strong>divisió del treball</strong> augmenta la productivitat per 3 raons:</p><p>1. <strong>Destresa</strong>: la repetició perfecciona.</p><p>2. <strong>Estalvi de temps</strong> entre tasques.</p><p>3. <strong>Invenció de màquines</strong>: l'especialització facilita innovacions.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Límits de la divisió" color="indigo"><p>Smith mateix notava que "la divisió del treball està limitada per la grandària del mercat". Un mercat petit no permet gran especialització. El <strong>comerç</strong> amplia el mercat efectiu → més especialització.</p></TheoryBlock>
                    <TheoryBlock title="1.3. Taylorisme i fordisme" color="amber"><p><strong>Frederick Taylor</strong> (1911): <em>Scientific Management</em>. Cronometratge, estandardització, salari per peça.</p><p><strong>Henry Ford</strong> (1913): cadena de muntatge. Producció en massa. Salari de 5$/dia (els propis obrers podien comprar el cotxe).</p><p>Crítiques: alienació (Marx, Chaplin <em>Temps moderns</em>), deshumanització.</p></TheoryBlock>
                    <TheoryBlock title="1.4. Post-fordisme i lean" color="emerald"><p><strong>Toyota Production System</strong> (Ohno, anys 1950): JIT, qualitat total, equips polivalents. <strong>Lean manufacturing</strong> (Womack-Jones 1990). Manufactura àgil.</p></TheoryBlock>
                </Card>
                <Card title="2. Interdependència econòmica" icon="🔗">
                    <TheoryBlock title="2.1. Xarxes d'intercanvi" color="blue"><p>L'especialització obliga a <strong>intercanviar</strong>. Cada persona depèn de moltes altres per obtenir el que consumeix. Llàpiç famós de <strong>Leonard Read</strong> (1958): "ningú sap fer un llàpiç" (fusta del Pacífic, grafit sud-americà, cautxú asiàtic, pintura europea).</p></TheoryBlock>
                    <TheoryBlock title="2.2. Input-Output (Leontief 1941)" color="violet"><p><strong>Wassily Leontief</strong> (Nobel 1973): matriu input-output. Model quantitatiu d'interdependència sectorial. Cada indústria usa outputs d'altres com a inputs.</p></TheoryBlock>
                    <TheoryBlock title="2.3. Vulnerabilitats" color="rose"><p>L'interdependència genera fragilitat. La pandèmia del COVID-19 (2020) i la guerra d'Ucraïna (2022) han mostrat com xocs locals es transmeten globalment: colls d'ampolla de xips, energia, components.</p><p>Respostes: <em>reshoring</em>, diversificació de proveïdors, reserves estratègiques.</p></TheoryBlock>
                </Card>
                <Card title="3. Sectors econòmics — Fisher-Clark" icon="📊">
                    <TheoryBlock title="3.1. Les 3 branques clàssiques" color="green"><p><strong>Allan Fisher</strong> (1935) i <strong>Colin Clark</strong> (1940): classificació tripartita:</p><p><strong>Primari</strong>: extracció de recursos naturals (agricultura, ramaderia, pesca, silvicultura, mineria).</p><p><strong>Secundari</strong>: transformació (indústria, construcció).</p><p><strong>Terciari</strong>: serveis (comerç, transport, finances, educació, sanitat, turisme).</p></TheoryBlock>
                    <TheoryBlock title="3.2. Sector quaternari i quinari" color="cyan"><p><strong>Jean Fourastié</strong> (1949): anticipa un <strong>quaternari</strong> basat en coneixement: R+D, TIC, educació superior, salut especialitzada. Alguns autors afegeixen <strong>quinari</strong>: gestió de coneixement d'alt nivell, decisió estratègica.</p></TheoryBlock>
                    <TheoryBlock title="3.3. Llei de Clark i terciarització" color="indigo"><p><strong>Llei de Clark</strong>: amb el desenvolupament, l'ocupació es mou: primari → secundari → terciari. Dades Espanya (INE 2024): primari 3 %, secundari 20 %, terciari 75 %, quaternari (transversal).</p></TheoryBlock>
                    <TheoryBlock title="3.4. Desindustrialització" color="amber"><p>Els països rics han perdut ocupació industrial (deslocalització cap a Xina, automatització). Debat: és un problema (Rodrik: "desindustrialització prematura"). Polítiques industrials recents (IRA 2022 EUA, EU Chips Act 2023).</p></TheoryBlock>
                </Card>
                <Card title="4. Globalització i cadenes globals de valor" icon="🌍">
                    <TheoryBlock title="Integració mundial" color="rose"><p>Les <strong>Global Value Chains</strong> (GVC) fragmenten la producció entre molts països. Un iPhone es dissenya a Cupertino, components vénen de Corea-Japó-Taiwan, s'assembla a Xina. <strong>World Bank</strong> (2020): 50 % del comerç mundial és en GVC.</p><p>Tendències 2024: <em>decoupling</em>, <em>friendshoring</em>, re-regionalització (USMCA, RCEP).</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La <strong>divisió del treball</strong> (Smith 1776) és el motor de la productivitat i crea <strong>interdependència</strong> creixent. Els <strong>sectors</strong> (Fisher-Clark 1935-40) permeten analitzar l'estructura productiva i la seua evolució (Llei de Clark). La globalització ha portat l'especialització al nivell planetari, amb beneficis (creixement) i riscos (vulnerabilitats). Espanya, com altres economies avançades, té una estructura eminentment terciaritzada (75 %).</p></div></Card>
                <BibliografiaBox items={['SMITH, A. (1776): The Wealth of Nations, llibre I, cap. 1-3.','TAYLOR, F. (1911): The Principles of Scientific Management.','FORD, H. (1922): My Life and Work.','OHNO, T. (1988): Toyota Production System.','WOMACK, J. i JONES, D. (1990): The Machine That Changed the World.','LEONTIEF, W. (1941): Structure of American Economy.','FISHER, A.G.B. (1935): The Clash of Progress and Security.','CLARK, C. (1940): The Conditions of Economic Progress, Macmillan.','FOURASTIÉ, J. (1949): Le grand espoir du XXe siècle.','RODRIK, D. (2016): "Premature Deindustrialization", JEG.','READ, L. (1958): "I, Pencil", FEE.']} />
            </div>
        );
        const Tema9Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 9: Divisió del treball i sectors</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Divisió treball</h4><ul className="list-disc pl-5 space-y-1"><li>Smith 1776 (fàbrica agulles): destresa, temps, invenció.</li><li>Limitada per grandària del mercat.</li><li>Taylorisme 1911, fordisme 1913, lean Ohno.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Interdependència</h4><ul className="list-disc pl-5 space-y-1"><li>Input-Output Leontief Nobel 1973.</li><li>Vulnerabilitats (COVID, Ucraïna).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Sectors</h4><ul className="list-disc pl-5 space-y-1"><li>Fisher-Clark (1935-40): primari, secundari, terciari.</li><li>Quaternari: Fourastié 1949.</li><li>Llei Clark: terciarització. Espanya 3-20-75 %.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Globalització</h4><ul className="list-disc pl-5 space-y-1"><li>GVC (50 % comerç).</li><li>Decoupling, friendshoring.</li></ul></div></div><ClauBox><p>- <strong>Smith (1776)</strong>: divisió del treball com a mecanisme fonamental.</p><p>- Domina la <strong>classificació sectorial</strong> amb dades espanyoles actuals.</p><p>- <strong>Llei de Clark</strong>: evolució primari → terciari amb desenvolupament.</p></ClauBox></Card></div>);
        const Tema9 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="🔗" title="Tema 9" subtitle={t('tema9.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema9Complet />}{vista === 'resum' && <Tema9Resum />}</div>; };

        // TEMA 10 — Del troc al mercat
        const Tema10Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El <strong>mercat</strong> és el mecanisme central de coordinació en les economies modernes. Aquest tema recorre l'evolució del <strong>troc al diner</strong> i al <strong>mercat</strong>, i introdueix les eines fonamentals de <strong>demanda, oferta i equilibri</strong> — base de tota la Microeconomia (Bloc B).</p></div></Card>
                <Card title="1. Del troc al diner" icon="💰">
                    <TheoryBlock title="1.1. El troc i els seus problemes" color="purple"><p>En una economia de <strong>troc</strong> (barter), els béns s'intercanvien directament. Problema fonamental: <strong>doble coincidència de necessitats</strong>. Si tinc sabates i vull pa, he de trobar algú que tingui pa i vulgui sabates. Costos de cerca elevats; mercat limitat.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Funcions del diner" color="indigo"><p>El diner resol aquestes dificultats. Les seues 3 funcions clàssiques:</p><p><strong>1. Mitjà de canvi</strong>: facilita transaccions (no cal doble coincidència).</p><p><strong>2. Unitat de compte</strong>: mesura homogènia de valors.</p><p><strong>3. Dipòsit de valor</strong>: permet estalviar.</p><p>Alguns autors afegeixen: <strong>4. Mitjà de pagament diferit</strong> (crèdit).</p></TheoryBlock>
                    <TheoryBlock title="1.3. Evolució del diner" color="amber"><p><strong>Diner mercaderia</strong>: sal, bestiar, gra, cotxilles.</p><p><strong>Diner metàl·lic</strong>: or, plata, coure (Lídia, s. VII aC).</p><p><strong>Diner fiduciari</strong>: paper sense valor intrínsec, recolzat per confiança en l'emissor (Banc Central).</p><p><strong>Diner bancari</strong>: dipòsits a la vista, xecs.</p><p><strong>Diner electrònic</strong>: targetes, transferències, Bizum.</p><p><strong>Criptomonedes</strong>: Bitcoin (2009), Ethereum. Descentralitzat, blockchain.</p><p><strong>CBDC</strong>: Central Bank Digital Currencies. Euro digital previst 2026-27.</p></TheoryBlock>
                </Card>
                <Card title="2. El mercat" icon="🛒">
                    <TheoryBlock title="2.1. Concepte" color="violet"><p>Un <strong>mercat</strong> és qualsevol institució que posa en contacte compradors i venedors d'un bé o servei per intercanviar-lo. No cal lloc físic (mercats online, financers, laborals).</p></TheoryBlock>
                    <TheoryBlock title="2.2. Tipus de mercat" color="blue"><p><strong>Segons competència</strong>: perfecta, monopolística, oligopoli, monopoli (vegeu Bloc B).</p><p><strong>Segons producte</strong>: béns, serveis, factors (treball, capital), divises.</p><p><strong>Segons abast</strong>: local, nacional, internacional.</p><p><strong>Segons regulació</strong>: lliures, regulats (medicaments, utilities), prohibits (drogues il·legals).</p></TheoryBlock>
                </Card>
                <Card title="3. La demanda" icon="📉">
                    <TheoryBlock title="3.1. Concepte i llei" color="rose"><p>La <strong>demanda</strong> és la quantitat d'un bé que els consumidors estan disposats i són capaços de comprar a cada preu, durant un període i <em>ceteris paribus</em>.</p><p><strong>Llei de la demanda</strong>: a més preu, menys quantitat demandada (relació inversa). Raó: efectes substitució i renda (Tema 11 Bloc B).</p></TheoryBlock>
                    <TheoryBlock title="3.2. Determinants" color="emerald"><p>Apart del preu propi, influeixen:</p><p>• <strong>Renda</strong> (+/−): normals, inferiors.</p><p>• <strong>Preus d'altres béns</strong>: substitutius (+), complementaris (−).</p><p>• <strong>Gustos i preferències</strong>.</p><p>• <strong>Expectatives</strong>.</p><p>• <strong>Nombre de consumidors</strong>.</p><p>Un canvi en aquests factors <strong>desplaça</strong> la corba; un canvi de preu <strong>mou al llarg</strong> de la corba.</p></TheoryBlock>
                </Card>
                <Card title="4. L'oferta" icon="📈">
                    <TheoryBlock title="4.1. Concepte i llei" color="indigo"><p>L'<strong>oferta</strong> és la quantitat d'un bé que els productors estan disposats a vendre a cada preu. <strong>Llei de l'oferta</strong>: a més preu, més quantitat oferta (relació directa). Raó: cobreix costos creixents.</p></TheoryBlock>
                    <TheoryBlock title="4.2. Determinants" color="cyan"><p>• <strong>Tecnologia</strong>.</p><p>• <strong>Costos dels factors productius</strong>.</p><p>• <strong>Preus d'altres béns</strong> que l'empresa pot produir.</p><p>• <strong>Nombre de productors</strong>.</p><p>• <strong>Expectatives</strong>.</p><p>• <strong>Impostos i subvencions</strong>.</p></TheoryBlock>
                </Card>
                <Card title="5. Equilibri de mercat" icon="⚖️">
                    <TheoryBlock title="5.1. Equilibri (Marshall 1890)" color="amber"><p>L'equilibri és on la quantitat demandada = quantitat oferta. El <strong>preu d'equilibri (P*)</strong> i la <strong>quantitat d'equilibri (Q*)</strong> resulten del creuament de les dues corbes (les "tisores de Marshall").</p><p>Si P &gt; P*: <strong>excés d'oferta</strong> → pressió a la baixa.</p><p>Si P &lt; P*: <strong>excés de demanda</strong> (escassetat) → pressió a l'alça.</p></TheoryBlock>
                    <TheoryBlock title="5.2. Canvis en l'equilibri" color="green"><p>Els desplaçaments de les corbes canvien l'equilibri:</p><p>• ↑ Demanda: P ↑, Q ↑.</p><p>• ↓ Demanda: P ↓, Q ↓.</p><p>• ↑ Oferta: P ↓, Q ↑.</p><p>• ↓ Oferta: P ↑, Q ↓.</p></TheoryBlock>
                    <TheoryBlock title="5.3. Equilibri general (Walras 1874)" color="violet"><p><strong>Léon Walras</strong>: no hi ha un únic mercat aïllat; tots els mercats estan interrelacionats i assoleixen un equilibri simultani. Formalitzat per <strong>Arrow-Debreu (1954)</strong>, base de la teoria econòmica moderna.</p></TheoryBlock>
                </Card>
                <Card title="6. Eficiència del mercat" icon="✨">
                    <TheoryBlock title="Mà invisible" color="rose"><p><strong>Smith (1776)</strong>: la recerca de l'interès propi, mitjançant el mercat, porta (com si fos guiada per una mà invisible) al bé comú. Formalitzat pels <strong>teoremes del benestar</strong>: l'equilibri competitiu és Pareto-òptim (1r teorema).</p><p>Limitacions (vegeu Tema 17 Bloc B): externalitats, béns públics, informació asimètrica, poder de mercat, distribució injusta. Justifiquen intervenció pública.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El <strong>mercat</strong> — des de les primeres formes de troc fins als complexos mercats digitals actuals — ha estat el gran mecanisme d'assignació en les societats modernes. La tríada <strong>demanda-oferta-equilibri</strong> (Marshall 1890) és l'eina analítica bàsica. Tot i la "mà invisible" (Smith 1776), els mercats reals presenten fallades que justifiquen la intervenció pública i que s'estudien al Bloc B (Microeconomia). Aquest tema tanca el Bloc A de fonaments i prepara el camí per a la microeconomia aprofundida.</p></div></Card>
                <BibliografiaBox items={['SMITH, A. (1776): The Wealth of Nations.','MARSHALL, A. (1890): Principles of Economics.','WALRAS, L. (1874): Éléments d\'économie politique pure.','ARROW, K. i DEBREU, G. (1954): "Existence of an Equilibrium for a Competitive Economy", Econometrica.','MANKIW, N.G. (2020): Principles of Economics, Cengage.','SAMUELSON, P. i NORDHAUS, W. (2019): Economics, 19a ed.','KRUGMAN, P. i WELLS, R. (2020): Economics, Worth.','FRIEDMAN, M. (1953): Essays in Positive Economics.','BANC D\'ESPANYA: glossari de diner i política monetària.','BCE: Euro digital roadmap (2023-2027).']} />
            </div>
        );
        const Tema10Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 10: Del troc al mercat</p><p className="text-center text-sm text-purple-600 mt-1">Equilibri: Q^d = Q^o → P*, Q* (Marshall 1890)</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Diner</h4><ul className="list-disc pl-5 space-y-1"><li>Troc: doble coincidència.</li><li>3 funcions: canvi, compte, dipòsit.</li><li>Evolució: mercaderia → metàl·lic → fiduciari → electrònic → cripto → CBDC.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Mercat</h4><ul className="list-disc pl-5 space-y-1"><li>Compradors + venedors.</li><li>Tipus: per competència, producte, abast, regulació.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3-4. Demanda i oferta</h4><ul className="list-disc pl-5 space-y-1"><li>Lleis (inversa vs. directa).</li><li>Determinants: preu, renda, preus altres, gustos, tecnologia, costos.</li><li>Moviments vs. desplaçaments.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">5. Equilibri</h4><ul className="list-disc pl-5 space-y-1"><li>Marshall 1890 (parcial).</li><li>Walras 1874 (general); Arrow-Debreu 1954.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">6. Eficiència</h4><ul className="list-disc pl-5 space-y-1"><li>Mà invisible (Smith).</li><li>1r teorema del benestar.</li><li>Fallades de mercat → Bloc B.</li></ul></div></div><ClauBox><p>- <strong>Marshall 1890</strong> (tisores) per equilibri parcial, <strong>Walras 1874</strong> per general.</p><p>- Les <strong>3 funcions del diner</strong> són pregunta recurrent.</p><p>- Prepara el Bloc B (Micro): aquest tema és el pont.</p></ClauBox></Card></div>);
        const Tema10 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="💱" title="Tema 10" subtitle={t('tema10.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema10Complet />}{vista === 'resum' && <Tema10Resum />}</div>; };

        // TEMES ARRAY
        const temes = [
            { id: 'tema1', num: 1, emoji: '📖', available: true },
            { id: 'tema2', num: 2, emoji: '🔬', available: true },
            { id: 'tema3', num: 3, emoji: '📊', available: true },
            { id: 'tema4', num: 4, emoji: '🏛️', available: true },
            { id: 'tema5', num: 5, emoji: '💭', available: true },
            { id: 'tema6', num: 6, emoji: '🧗', available: true },
            { id: 'tema7', num: 7, emoji: '⚙️', available: true },
            { id: 'tema8', num: 8, emoji: '🌐', available: true },
            { id: 'tema9', num: 9, emoji: '🔗', available: true },
            { id: 'tema10', num: 10, emoji: '💱', available: true },
        ];

        const Inicio = () => (<div className="animate-fade"><a href="./oposicions" className="inline-flex items-center gap-2 text-sm text-purple-600 hover:text-purple-800 mb-6 transition-colors">{t('inicio.backOpo')}</a><div className="text-center mb-10"><div className="inline-flex items-center gap-2 px-4 py-1.5 bg-purple-100 text-purple-700 rounded-full text-sm font-semibold mb-4"><span>📖</span> Bloc A · BOE 1-10</div><h1 className="text-4xl font-black text-slate-800 mb-3">{t('inicio.title')}</h1><p className="text-slate-500 text-lg max-w-3xl mx-auto">{t('inicio.subtitle')}</p></div><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">{temes.map(tema => (<button key={tema.id} onClick={() => { if (tema.available) { setSection(tema.id); pdeSetHashSection(tema.id); pdeScrollToTop(); } }} className="text-left p-5 rounded-2xl border bg-white border-purple-200 hover:shadow-lg hover:border-purple-400 cursor-pointer transition-all"><div className="flex items-start gap-3"><span className="inline-flex items-center justify-center w-11 h-11 rounded-xl text-sm font-black text-white bg-gradient-to-br from-purple-500 to-violet-600">T{tema.num}</span><div className="flex-1 min-w-0"><p className="font-semibold text-slate-800 text-sm leading-snug mb-2">{t(`tema${tema.num}.title`)}</p><span className="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">✓ {t('inicio.disponible')}</span></div></div></button>))}</div></div>);

        const headerSections = [
            { id: 'inicio', label: t('sec.inicio'), emoji: '🏠' },
            { id: 'tema1', label: 'T1', emoji: '📖' },
            { id: 'tema2', label: 'T2', emoji: '🔬' },
            { id: 'tema3', label: 'T3', emoji: '📊' },
            { id: 'tema4', label: 'T4', emoji: '🏛️' },
            { id: 'tema5', label: 'T5', emoji: '💭' },
            { id: 'tema6', label: 'T6', emoji: '🧗' },
            { id: 'tema7', label: 'T7', emoji: '⚙️' },
            { id: 'tema8', label: 'T8', emoji: '🌐' },
            { id: 'tema9', label: 'T9', emoji: '🔗' },
            { id: 'tema10', label: 'T10', emoji: '💱' },
        ];

        return (
            <div className="min-h-screen">
                <PdeHeader idioma={idioma} setIdioma={setIdioma} currentApp="oposicions-bloc-a" sections={headerSections} currentSection={section} setSection={setSection} />
                <main className="max-w-7xl mx-auto px-4 py-8">
                    {section === 'inicio' && <Inicio />}
                    {section === 'tema1' && <Tema1 />}
                    {section === 'tema2' && <Tema2 />}
                    {section === 'tema3' && <Tema3 />}
                    {section === 'tema4' && <Tema4 />}
                    {section === 'tema5' && <Tema5 />}
                    {section === 'tema6' && <Tema6 />}
                    {section === 'tema7' && <Tema7 />}
                    {section === 'tema8' && <Tema8 />}
                    {section === 'tema9' && <Tema9 />}
                    {section === 'tema10' && <Tema10 />}
                </main>
                <PdePrevNext sections={headerSections} currentSection={section} setSection={setSection} idioma={idioma} />
                <PdeFooter appEmoji="📖" appName={t('footer.appname')} idioma={idioma} />
                <PdeScrollToTop />
            </div>
        );
    }

    ReactDOM.render(<BlocAApp />, document.getElementById('root'));
    </script>
