                    </p>
                    <p>
                        Las competencias específicas más directamente relacionadas son: <strong>CE1</strong> (comprender el funcionamiento del sistema económico y sus implicaciones), <strong>CE2</strong> (analizar el papel de los agentes económicos y sus interrelaciones) y <strong>CE5</strong> (valorar la importancia del consumo responsable y el desarrollo sostenible). La enseñanza de los sistemas económicos contribuye también a la competencia ciudadana (CC), al fomentar la comprensión crítica de las instituciones que rigen la vida económica y política.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.2. Actividades didácticas" color="blue">
                    <p>
                        Algunas actividades didácticas especialmente adecuadas para el aula:
                    </p>
                    <p>
                        <strong>Debates estructurados:</strong> organizar un debate en el que los alumnos, divididos en grupos, defiendan las posiciones del mercado libre (Smith, Hayek), de la planificación central (Marx) y de la economía mixta (Keynes), utilizando argumentos económicos y datos reales. Este tipo de actividad desarrolla la competencia en comunicación lingüística, el pensamiento crítico y la capacidad de argumentación.
                    </p>
                    <p>
                        <strong>Análisis comparativo de noticias:</strong> seleccionar noticias económicas de diferentes países (un país nórdico, EE.UU., Cuba, China) y analizar cómo el sistema económico condiciona las políticas y los resultados. Por ejemplo: ¿por qué Suecia y EE.UU. responden de forma tan diferente a la misma crisis?
                    </p>
                    <p>
                        <strong>Simulación de un sistema económico:</strong> diseñar una actividad en la que los alumnos, organizados en un mercado ficticio, experimenten las diferencias entre asignar recursos mediante precios (mercado), mediante un planificador (autoridad) o mediante una combinación de ambos (mixta). Esta actividad vivencial permite comprender intuitivamente las ventajas e inconvenientes de cada sistema.
                    </p>
                    <p>
                        <strong>Conexión con los ODS:</strong> analizar cómo cada sistema económico contribuye (o dificulta) el logro de los ODS 8 (trabajo decente y crecimiento), ODS 10 (reducción de desigualdades) y ODS 12 (producción y consumo responsables). La reflexión sobre economía circular, decrecimiento y economía del bien común permite conectar los sistemas económicos con los retos del siglo XXI.
                    </p>
                </TheoryBlock>

            <Card title="Conclusión" icon="✅">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        A lo largo de este tema se han analizado los tres grandes sistemas económicos —economía de mercado, economía planificada y economía mixta— a partir de las tres preguntas fundamentales (qué, cómo y para quién producir) y de sus elementos constitutivos (propiedad, coordinación, incentivos). La economía de mercado, inspirada en Smith, Ricardo, Marshall, Hayek y Friedman, se basa en la propiedad privada, el sistema de precios y la competencia, pero genera desigualdades, externalidades e inestabilidad. La economía planificada, fundamentada en Marx y Engels e implementada en la URSS y otros países, persigue la igualdad y el pleno empleo, pero adolece de ineficiencia, falta de innovación y autoritarismo, como demostró su fracaso histórico.
                    </p>
                    <p>
                        La economía mixta, surgida de la síntesis keynesiana y del desarrollo del Estado del Bienestar, es el sistema predominante en el mundo contemporáneo. Sin embargo, no es un modelo único sino un espectro: desde el modelo nórdico (amplio Estado del Bienestar) hasta el anglosajón (menor intervención), cada sociedad encuentra su propio equilibrio entre mercado y Estado, entre eficiencia y equidad.
                    </p>
                    <p>
                        Las experiencias de transición (Rusia, China, Europa del Este) confirman que las instituciones, la velocidad de las reformas y las redes de protección social son determinantes del éxito o el fracaso. Los retos del siglo XXI —digitalización, crisis climática, desigualdad creciente, economía de plataformas— exigen una actualización permanente del debate sobre los sistemas económicos y abren la puerta a nuevos paradigmas: economía circular, economía del bien común, decrecimiento.
                    </p>
                    <p>
                        Desde la perspectiva docente, el estudio de los sistemas económicos es una oportunidad excepcional para desarrollar el pensamiento crítico, la capacidad de argumentación y la conciencia ciudadana del alumnado, conectando la historia del pensamiento económico con los retos contemporáneos y los Objetivos de Desarrollo Sostenible.
                    </p>

                    </p>
                    <p>
                        El mercantilismo también defendía una <strong>intervención activa del Estado</strong> en la economía, regulando precios, salarios, movimientos de metales y comercio exterior. Desde la perspectiva moderna, el mercantilismo adolecía de una confusión entre dinero y riqueza (la llamada <em>falacia mercantilista</em>, criticada posteriormente por Hume y Smith) y de una visión de la economía como juego de suma cero: lo que una nación ganaba, otra lo perdía. No obstante, algunos de sus instrumentos —protección de industrias nacientes, política industrial activa— han sido reivindicados por economistas como <strong>Friedrich List</strong> (siglo XIX) y, más recientemente, por <strong>Ha-Joon Chang</strong> y la escuela estructuralista latinoamericana.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. La fisiocracia (siglo XVIII)" color="green">
                    <p>
                        La <strong>fisiocracia</strong> (del griego <em>physis</em>, naturaleza, y <em>kratos</em>, gobierno: "gobierno de la naturaleza") es considerada la primera escuela propiamente económica. Surgió en Francia a mediados del siglo XVIII como reacción al mercantilismo y su máximo representante fue <strong>François Quesnay</strong> (1694-1774), médico de la corte de Luis XV, que publicó el célebre <strong><em>Tableau Économique</em></strong> (1758), considerado el primer modelo macroeconómico de la historia.
                    </p>
                    <p>
                        Los fisiócratas sostenían que la <strong>verdadera riqueza de una nación proviene de la tierra</strong> y de la agricultura, únicas actividades capaces de generar un <strong>"producto neto"</strong> (<em>produit net</em>) por encima del coste de producción. La industria y el comercio eran considerados actividades <strong>"estériles"</strong>, pues se limitaban a transformar o transportar lo que la tierra producía. Esta visión reflejaba la realidad de la Francia agrícola del siglo XVIII, donde la tierra era la fuente principal de sustento.
                    </p>
                    <p>
                        La aportación más trascendente de Quesnay fue el <em>Tableau Économique</em>, que representaba gráficamente los flujos de renta entre las tres clases sociales (clase productiva —agricultores—, clase propietaria —terratenientes— y clase estéril —artesanos y comerciantes—), prefigurando las tablas input-output de <strong>Leontief</strong> y los modelos de flujo circular de la renta. Además, los fisiócratas acuñaron la expresión <strong><em>"laissez-faire, laissez-passer"</em></strong>, defendiendo que la economía funcionaba mejor cuando el Estado no interfería, principio que sería desarrollado por Adam Smith y la escuela clásica.
                    </p>
                    <p>
                        Otros fisiócratas destacados fueron <strong>Anne-Robert-Jacques Turgot</strong> (que llegó a ser ministro de finanzas) y <strong>Pierre Samuel du Pont de Nemours</strong>. Aunque su influencia directa fue breve (apenas dos décadas), su legado intelectual fue enorme: sentaron las bases del análisis económico sistemático, del liberalismo económico y del concepto de orden natural.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. La escuela clásica (1776-1870)" icon="📗">
                <TheoryBlock title="2.1. Adam Smith y los orígenes de la economía política" color="blue">
                    <p>
                        <strong>Adam Smith</strong> (1723-1790) es considerado el padre de la Economía moderna. Su obra fundamental, <strong><em>Investigación sobre la naturaleza y causas de la riqueza de las naciones</em></strong> (1776), supuso una ruptura con el mercantilismo y la fisiocracia, al proponer que la riqueza de una nación no reside en los metales preciosos ni exclusivamente en la tierra, sino en el <strong>trabajo productivo</strong> de sus habitantes y en la <strong>acumulación de capital</strong>.
                    </p>
                    <p>
                        Smith formuló varios conceptos fundamentales que siguen vigentes hoy. La <strong>división del trabajo</strong>, ilustrada con el célebre ejemplo de la fábrica de alfileres, permite aumentar la productividad exponencialmente. La <strong>"mano invisible"</strong> (<em>invisible hand</em>) describe el mecanismo por el cual, al perseguir su propio interés, cada individuo contribuye, sin pretenderlo, al bienestar general: <em>"No es de la benevolencia del carnicero, del cervecero o del panadero de quienes esperamos nuestra cena, sino de su preocupación por su propio interés"</em>. Smith también analizó la <strong>acumulación de capital</strong>, el papel de los mercados, la determinación de los precios y la función limitada del Estado (defensa, justicia, obras públicas).
                    </p>
                    <p>
                        Es importante señalar que Smith no era un defensor dogmático del <em>laissez-faire</em>: en su primera obra, <em>La teoría de los sentimientos morales</em> (1759), subrayó la importancia de la empatía, la justicia y las instituciones morales para el buen funcionamiento de la sociedad. Su visión era la de una economía de mercado incrustada en un marco ético e institucional.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. David Ricardo, Malthus, Say y J.S. Mill" color="green">
                    <p>
                        <strong>David Ricardo</strong> (1772-1823) fue el economista más riguroso de la escuela clásica. Su obra principal, <em>Principios de economía política y tributación</em> (1817), introdujo la <strong>teoría de la ventaja comparativa</strong>, que demuestra que el comercio internacional beneficia a todos los países, incluso a aquellos que son menos eficientes en la producción de todos los bienes. También desarrolló la <strong>teoría de la renta diferencial</strong> de la tierra (la renta que perciben los propietarios de las tierras más fértiles) y la <strong>teoría del valor-trabajo</strong>, según la cual el valor de un bien depende de la cantidad de trabajo incorporada en su producción.
                    </p>
                    <p>
                        <strong>Thomas Robert Malthus</strong> (1766-1834) es conocido principalmente por su <em>Ensayo sobre el principio de la población</em> (1798), donde argumentó que la población crece en progresión geométrica mientras que la producción de alimentos lo hace en progresión aritmética, lo que conduce inevitablemente a hambrunas, epidemias y guerras (<em>"frenos positivos"</em>) o a la restricción voluntaria de la natalidad (<em>"frenos preventivos"</em>). Aunque su predicción no se cumplió gracias al progreso tecnológico, la preocupación malthusiana por los límites del crecimiento resurge periódicamente (Club de Roma, 1972; debate sobre sostenibilidad).
                    </p>
                    <p>
                        <strong>Jean-Baptiste Say</strong> (1767-1832) formuló la célebre <strong>Ley de Say</strong> (<em>"la oferta crea su propia demanda"</em>), según la cual toda producción genera rentas suficientes para adquirir lo producido, por lo que las crisis generales de sobreproducción serían imposibles. Esta tesis fue refutada por Keynes un siglo después. <strong>John Stuart Mill</strong> (1806-1873), último gran clásico, aportó una visión más matizada: defendió la intervención del Estado en casos de fallos del mercado, la redistribución de la riqueza y los derechos de los trabajadores. Su obra <em>Principios de economía política</em> (1848) fue el manual de referencia durante décadas. Mill también sentó las bases del <strong>utilitarismo</strong> como criterio ético para la política económica: "el mayor bienestar para el mayor número".
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. Karl Marx y la crítica al capitalismo" icon="📕">
                <TheoryBlock title="3.1. El materialismo histórico y la teoría del valor-trabajo" color="red">
                    <p>
                        <strong>Karl Marx</strong> (1818-1883), filósofo, economista y revolucionario alemán, desarrolló la crítica más radical y sistemática del capitalismo. Su obra magna, <strong><em>El Capital</em></strong> (cuyo primer volumen se publicó en 1867), construye sobre la teoría del valor-trabajo de Ricardo, pero la transforma en una herramienta de denuncia de la explotación. Para Marx, el valor de las mercancías se determina por el <strong>trabajo socialmente necesario</strong> para producirlas. Sin embargo, el trabajador recibe como salario solo una parte del valor que produce: la diferencia —el <strong>plusvalor</strong> o <em>plusvalía</em> (<em>Mehrwert</em>)— es apropiada por el capitalista, y constituye la fuente del beneficio.
                    </p>
                    <p>
                        El <strong>materialismo histórico</strong> es la filosofía de la historia que sustenta el análisis de Marx. Según esta concepción, la <strong>estructura económica</strong> (las relaciones de producción: quién posee los medios de producción y quién trabaja) determina la <strong>superestructura</strong> (las instituciones políticas, jurídicas, culturales e ideológicas). La historia avanza a través de la <strong>lucha de clases</strong>: esclavistas frente a esclavos, señores feudales frente a siervos, burgueses (capitalistas) frente a proletarios (trabajadores). Cada modo de producción contiene en su interior las <strong>contradicciones</strong> que conducen a su transformación.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Las predicciones de Marx y su legado" color="pink">
                    <p>
                        Marx predijo que el capitalismo se destruiría a sí mismo a través de una serie de <strong>crisis recurrentes</strong>, causadas por la <strong>tendencia decreciente de la tasa de ganancia</strong> (a medida que los capitalistas sustituyen trabajo por maquinaria, la fuente de plusvalía se reduce), la <strong>concentración del capital</strong> (los grandes capitales absorben a los pequeños) y la <strong>pauperización del proletariado</strong> (los salarios tienden a la mera subsistencia). La revolución proletaria daría paso al socialismo y, finalmente, al comunismo: una sociedad sin clases, sin Estado y sin propiedad privada de los medios de producción.
                    </p>
                    <p>
                        Las predicciones de Marx no se cumplieron de forma literal: el capitalismo demostró una capacidad de adaptación mucho mayor de la esperada (gracias al Estado del Bienestar, las reformas laborales, la expansión del consumo de masas y la innovación tecnológica). Sin embargo, su influencia intelectual ha sido inmensa. Conceptos como la explotación, la alienación, la concentración de la riqueza, la ideología como herramienta de dominación y las crisis sistémicas del capitalismo siguen siendo herramientas analíticas utilizadas por economistas, sociólogos e historiadores. La crisis financiera de 2008 y la creciente desigualdad documentada por <strong>Piketty</strong> (<em>El capital en el siglo XXI</em>, 2013) han renovado el interés por Marx.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. La revolución marginalista y la escuela neoclásica (1871-1936)" icon="📙">
                <TheoryBlock title="4.1. La revolución marginalista de 1871" color="violet">
                    <p>
                        En torno a 1871, tres economistas formularon, de forma independiente y casi simultánea, la teoría de la <strong>utilidad marginal</strong>: <strong>William Stanley Jevons</strong> (<em>The Theory of Political Economy</em>, 1871, Inglaterra), <strong>Carl Menger</strong> (<em>Grundsätze der Volkswirtschaftslehre</em>, 1871, Austria) y <strong>Léon Walras</strong> (<em>Éléments d'économie politique pure</em>, 1874, Suiza/Francia). Esta "triple revolución" desplazó la teoría del valor-trabajo (clásica y marxista) por una nueva explicación del valor basada en la <strong>utilidad marginal decreciente</strong>: el valor de un bien no depende del trabajo incorporado, sino de la satisfacción adicional que proporciona la última unidad consumida.
                    </p>
                    <p>
                        La revolución marginalista introdujo el <strong>análisis en el margen</strong> como método fundamental de la economía: las decisiones óptimas se toman comparando el beneficio marginal con el coste marginal. Además, Walras desarrolló el concepto de <strong>equilibrio general</strong>: un modelo en el que todos los mercados de bienes, servicios y factores alcanzan simultáneamente el equilibrio, demostrando la <strong>interdependencia</strong> de todos los sectores económicos. Este enfoque matemático y formalizado marcó la transición de la "economía política" a la "ciencia económica" (<em>economics</em>).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La síntesis neoclásica: Marshall, Pareto y la escuela austríaca" color="blue">
                    <p>
                        <strong>Alfred Marshall</strong> (1842-1924) es la figura central de la escuela neoclásica. En sus <em>Principios de Economía</em> (1890), sintetizó las aportaciones clásicas y marginalistas, creando el marco analítico que dominaría la economía durante medio siglo. Marshall introdujo el <strong>análisis de equilibrio parcial</strong> (estudio de un mercado aislado), las curvas de oferta y demanda con el famoso diagrama de la "tijera de Marshall" (el precio se determina simultáneamente por la oferta y la demanda, como las dos hojas de una tijera), los conceptos de <strong>elasticidad</strong>, <strong>excedente del consumidor</strong>, <strong>economías de escala</strong> y la distinción entre <strong>corto plazo y largo plazo</strong>.
                    </p>
                    <p>
                        <strong>Vilfredo Pareto</strong> (1848-1923) reformuló la teoría del bienestar, sustituyendo la utilidad cardinal (medible en unidades) por la utilidad ordinal (basada en preferencias) e introduciendo el concepto de <strong>óptimo de Pareto</strong>: una situación en la que no es posible mejorar la posición de un individuo sin empeorar la de otro. Los <strong>dos teoremas fundamentales del bienestar</strong>, demostrados posteriormente por Arrow y Debreu, establecen las condiciones bajo las cuales un equilibrio competitivo es Pareto-eficiente, y viceversa.
                    </p>
                    <p>
                        La <strong>escuela austríaca</strong>, fundada por Menger y continuada por <strong>Eugen von Böhm-Bawerk</strong>, <strong>Ludwig von Mises</strong> (<em>La acción humana</em>, 1949) y <strong>Friedrich Hayek</strong> (Premio Nobel 1974), desarrolló una tradición distintiva dentro del pensamiento neoclásico. La escuela austríaca enfatiza el <strong>individualismo metodológico</strong> (las explicaciones parten siempre del individuo), el <strong>subjetivismo del valor</strong>, el papel del <strong>emprendedor</strong> como motor de la innovación, la importancia de la <strong>información dispersa</strong> (el "problema del conocimiento" de Hayek, 1945) y una desconfianza radical hacia la intervención del Estado. Hayek fue el principal adversario intelectual de Keynes durante el siglo XX.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. La revolución keynesiana (1936-1970)" icon="📒">
                <TheoryBlock title="5.1. Keynes y la Teoría General" color="green">
                    <p>
                        <strong>John Maynard Keynes</strong> (1883-1946) es, junto con Smith y Marx, uno de los tres economistas más influyentes de la historia. Su obra fundamental, <strong><em>Teoría general de la ocupación, el interés y el dinero</em></strong> (1936), fue escrita en el contexto de la <strong>Gran Depresión</strong> (1929-1939), la mayor crisis económica del capitalismo, que dejó tasas de desempleo del 25% en Estados Unidos y demostró la incapacidad de los mecanismos de mercado para restaurar automáticamente el pleno empleo.
                    </p>
                    <p>
                        Keynes refutó la <strong>Ley de Say</strong> y la ortodoxia neoclásica que afirmaba que los mercados se autorregulan. Su argumento central era que la <strong>demanda agregada</strong> (el gasto total de familias, empresas, sector público y sector exterior) puede ser insuficiente para mantener el pleno empleo, generando un <strong>equilibrio con desempleo involuntario</strong>. La causa fundamental era la <strong>incertidumbre radical</strong> sobre el futuro, que lleva a los agentes a atesorar dinero (<em>preferencia por la liquidez</em>) en lugar de invertir o consumir, y que genera fluctuaciones violentas en la <strong>inversión</strong>, determinada por los <em>"animal spirits"</em> (espíritus animales) de los empresarios.
                    </p>
                    <p>
                        Keynes propuso la intervención del Estado mediante la <strong>política fiscal expansiva</strong>: aumento del gasto público y reducción de impuestos para compensar la insuficiencia de la demanda privada. Introdujo el concepto del <strong>multiplicador</strong> (un incremento del gasto público genera un aumento del PIB mayor que el gasto inicial, gracias a las sucesivas rondas de consumo) y argumentó que, en situaciones de <strong>trampa de la liquidez</strong> (cuando los tipos de interés están cerca de cero y la política monetaria es ineficaz), la política fiscal es el único instrumento efectivo.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. La síntesis neoclásica-keynesiana" color="cyan">
                    <p>
                        Tras la Segunda Guerra Mundial, las ideas de Keynes fueron formalizadas matemáticamente e integradas con la teoría neoclásica en lo que se conoce como la <strong>síntesis neoclásica-keynesiana</strong>. <strong>John Hicks</strong> (Premio Nobel 1972) propuso el modelo <strong>IS-LM</strong> (1937), que representa simultáneamente el equilibrio en el mercado de bienes (curva IS) y en el mercado de dinero (curva LM), permitiendo analizar los efectos de la política fiscal y monetaria. <strong>Paul Samuelson</strong> (Premio Nobel 1970) integró la macroeconomía keynesiana con la microeconomía neoclásica en su célebre manual <em>Economía</em> (1948), que se convirtió en el libro de texto más utilizado del mundo.
                    </p>
                    <p>
                        La síntesis neoclásica dominó la macroeconomía durante las décadas de 1950 y 1960, un período de crecimiento sostenido, pleno empleo y estabilidad de precios en los países occidentales (los "treinta gloriosos", <em>les trente glorieuses</em>). La <strong>curva de Phillips</strong> (1958), que mostraba una relación inversa estable entre inflación y desempleo, proporcionaba a los gobiernos un "menú" de combinaciones posibles: podían elegir entre más empleo con más inflación, o viceversa. Otros economistas clave de esta época fueron <strong>Franco Modigliani</strong> (teoría del ciclo vital del ahorro), <strong>James Tobin</strong> (elección de cartera) y <strong>Robert Solow</strong> (modelo de crecimiento neoclásico).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. Monetarismo y nueva macroeconomía clásica (1970-2000)" icon="📓">
                <TheoryBlock title="6.1. Milton Friedman y el monetarismo" color="amber">
                    <p>
                        La crisis de la <strong>estanflación</strong> de los años 1970 (combinación de estancamiento económico e inflación alta, provocada por las crisis del petróleo de 1973 y 1979) puso en cuestión el consenso keynesiano. El marco IS-LM y la curva de Phillips parecían incapaces de explicar una situación en la que coexistían alto desempleo y alta inflación. La respuesta vino de <strong>Milton Friedman</strong> (1912-2006, Premio Nobel 1976), líder de la escuela monetarista de Chicago.
                    </p>
                    <p>
                        Friedman formuló varias tesis que revolucionaron la macroeconomía. Primera: <strong>"la inflación es siempre y en todo lugar un fenómeno monetario"</strong>, es decir, se produce por un crecimiento excesivo de la oferta monetaria respecto a la producción. La solución no es la política fiscal sino una <strong>regla monetaria estable</strong>: crecer la oferta monetaria a una tasa constante, coherente con el crecimiento potencial de la economía. Segunda: la <strong>tasa natural de desempleo</strong> (o NAIRU) es aquella compatible con una inflación estable; intentar reducir el desempleo por debajo de esa tasa mediante política fiscal solo genera inflación a largo plazo. Tercera: la <strong>hipótesis de la renta permanente</strong> (1957) argumenta que el consumo no depende de la renta corriente (como sostenía Keynes) sino de la renta que los individuos esperan percibir a lo largo de su vida, lo que debilita el efecto del multiplicador keynesiano.
                    </p>
                    <p>
                        Las ideas de Friedman tuvieron una enorme influencia política: inspiraron las políticas económicas de <strong>Ronald Reagan</strong> en Estados Unidos y <strong>Margaret Thatcher</strong> en el Reino Unido durante los años 1980, basadas en la desregulación, la privatización, la reducción del Estado del Bienestar y el control de la inflación como prioridad absoluta.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.2. La nueva macroeconomía clásica" color="violet">
                    <p>
                        <strong>Robert Lucas</strong> (Premio Nobel 1995) radicalizó las ideas de Friedman con la teoría de las <strong>expectativas racionales</strong>: los agentes económicos no cometen errores sistemáticos; utilizan toda la información disponible para formar sus expectativas sobre el futuro, incluidas las políticas del gobierno. En consecuencia, cualquier política fiscal o monetaria <strong>anticipada</strong> será neutralizada por las reacciones de los agentes: si el gobierno anuncia un aumento del gasto, los agentes anticiparán la futura subida de impuestos y reducirán su consumo (<em>equivalencia ricardiana</em>, formalizada por Robert Barro). Solo las <strong>sorpresas</strong> de política tienen efectos reales, pero a costa de generar incertidumbre.
                    </p>
                    <p>
                        <strong>Finn Kydland y Edward Prescott</strong> (Premio Nobel 2004) desarrollaron la teoría del <strong>ciclo económico real</strong> (<em>Real Business Cycle</em>, RBC), según la cual las fluctuaciones económicas se explican por <strong>perturbaciones tecnológicas reales</strong> (shocks de productividad), no por fallos de la demanda (como sostenía Keynes) ni por errores monetarios (como sostenía Friedman). En este marco, los ciclos son respuestas eficientes de la economía a cambios en las condiciones fundamentales, y la intervención del gobierno es innecesaria o contraproducente. Kydland y Prescott también demostraron el <strong>problema de la inconsistencia temporal</strong>: la tentación de los gobiernos de cambiar de política una vez que los agentes han tomado sus decisiones, lo que justifica la independencia de los bancos centrales y las reglas de política frente a la discrecionalidad.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 7 */}
            <Card title="7. Nuevas corrientes del siglo XXI" icon="📔">
                <TheoryBlock title="7.1. La Nueva Economía Keynesiana" color="green">
                    <p>
                        La <strong>Nueva Economía Keynesiana</strong> (NEK) surgió como respuesta a la nueva macroeconomía clásica, aceptando las expectativas racionales pero recuperando la idea keynesiana de que los mercados pueden fallar. Sus principales representantes son <strong>N. Gregory Mankiw</strong> (costes de menú), <strong>Joseph Stiglitz</strong> (Premio Nobel 2001, asimetrías de información, selección adversa, riesgo moral), <strong>George Akerlof</strong> (Premio Nobel 2001, "el mercado de los limones"), <strong>Janet Yellen</strong>, <strong>Olivier Blanchard</strong> y <strong>Paul Krugman</strong> (Premio Nobel 2008, nueva geografía económica).
                    </p>
                    <p>
                        La NEK demuestra que <strong>rigideces nominales</strong> (precios y salarios que no se ajustan inmediatamente), <strong>competencia imperfecta</strong> (la mayoría de los mercados no son perfectamente competitivos), <strong>asimetrías de información</strong> (una parte de la transacción sabe más que la otra) y <strong>externalidades</strong> generan fallos del mercado que justifican la intervención del Estado. La crisis financiera de 2008 y la pandemia de COVID-19 reforzaron las posiciones neokeynesianas, al demostrar la necesidad de políticas fiscales y monetarias activas para estabilizar la economía.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.2. La economía institucional" color="blue">
                    <p>
                        La <strong>economía institucional</strong> estudia el papel de las instituciones —normas, leyes, costumbres, organizaciones— en el desempeño económico. <strong>Douglass North</strong> (1920-2015, Premio Nobel 1993) demostró que las instituciones son el factor clave que explica por qué unos países son ricos y otros pobres: las instituciones <strong>inclusivas</strong> (que protegen la propiedad, garantizan el imperio de la ley y fomentan la competencia) promueven el crecimiento, mientras que las instituciones <strong>extractivas</strong> (que concentran el poder y la riqueza en una élite) lo frenan.
                    </p>
                    <p>
                        <strong>Daron Acemoglu</strong> y <strong>James Robinson</strong> (<em>Por qué fracasan los países</em>, 2012) popularizaron esta tesis, argumentando que la clave del desarrollo no son los recursos naturales, la geografía ni la cultura, sino las instituciones políticas y económicas. <strong>Ronald Coase</strong> (Premio Nobel 1991) demostró la importancia de los <strong>costes de transacción</strong> y los <strong>derechos de propiedad</strong>, mientras que <strong>Oliver Williamson</strong> (Premio Nobel 2009) analizó las estructuras de gobernanza empresarial. <strong>Elinor Ostrom</strong> (Premio Nobel 2009) demostró que las comunidades pueden gestionar eficazmente los <strong>bienes comunes</strong> sin recurrir ni al mercado ni al Estado, a través de instituciones de autogobierno.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.3. La economía conductual (Behavioral Economics)" color="pink">
                    <p>
                        La <strong>economía conductual</strong> cuestiona el supuesto neoclásico del <em>homo economicus</em> racional. A partir de los trabajos de los psicólogos <strong>Daniel Kahneman</strong> y <strong>Amos Tversky</strong> (la <em>Teoría de las perspectivas</em>, 1979, Premio Nobel de Kahneman en 2002), se ha demostrado que los seres humanos tomamos decisiones de forma <strong>sistemáticamente sesgada</strong>: sobrevaloramos las pérdidas frente a las ganancias (<em>aversión a la pérdida</em>), nos dejamos influir por cómo se presenta la información (<em>efecto encuadre</em>), utilizamos atajos mentales (<em>heurísticas</em>) que conducen a errores predecibles y tenemos dificultades para planificar a largo plazo (<em>sesgo del presente</em>).
                    </p>
                    <p>
                        <strong>Richard Thaler</strong> (Premio Nobel 2017) aplicó estos hallazgos a la política económica, proponiendo el concepto de <strong><em>nudge</em></strong> ("empujón"): diseñar el entorno de elección de forma que las personas tomen mejores decisiones sin eliminar su libertad de elección. Ejemplos: inscripción automática (con opción de salida) en planes de pensiones, colocar la fruta en la cafetería a la altura de los ojos, o utilizar la comparación social para fomentar el ahorro energético. La economía conductual ha transformado la política pública, con la creación de <strong>"nudge units"</strong> en gobiernos de todo el mundo (Reino Unido, EE.UU., Australia, Unión Europea).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.4. Economía ecológica, feminista y nuevos paradigmas" color="emerald">
                    <p>
                        La <strong>economía ecológica</strong> cuestiona el supuesto del crecimiento económico indefinido en un planeta con recursos finitos. <strong>Herman Daly</strong> (economía del estado estacionario), <strong>Nicholas Georgescu-Roegen</strong> (termodinámica aplicada a la economía, la ley de la entropía) y <strong>Kate Raworth</strong> (<em>Economía rosquilla</em>, 2017) proponen un modelo que combine un <strong>"suelo social"</strong> (necesidades básicas cubiertas) con un <strong>"techo ecológico"</strong> (límites planetarios), superando la obsesión por el crecimiento del PIB. Esta corriente conecta directamente con los <strong>Objetivos de Desarrollo Sostenible</strong> y con el <em>Pacto Verde Europeo</em> (<em>European Green Deal</em>).
                    </p>
                    <p>
                        La <strong>economía feminista</strong> visibiliza el <strong>trabajo de cuidados no remunerado</strong> (mayoritariamente realizado por mujeres), que los modelos económicos convencionales ignoran a pesar de ser esencial para el funcionamiento de la economía. Autoras como <strong>Marilyn Waring</strong>, <strong>Nancy Folbre</strong> y <strong>Amaia Pérez Orozco</strong> proponen redefinir los indicadores económicos para incluir el valor de este trabajo.
                    </p>
                    <p>
                        <strong>Thomas Piketty</strong> (<em>El capital en el siglo XXI</em>, 2013) documentó empíricamente que la <strong>tasa de rendimiento del capital (r) tiende a superar la tasa de crecimiento económico (g)</strong> a largo plazo (<strong>r &gt; g</strong>), lo que genera una concentración creciente e inexorable de la riqueza. Piketty propone un <strong>impuesto global sobre el patrimonio</strong> y una mayor transparencia fiscal como remedios. Su obra, basada en un impresionante trabajo estadístico con datos fiscales de más de veinte países y doscientos años, ha reavivado el debate sobre la desigualdad y ha conectado la economía con la historia y la política de forma innovadora.
                    </p>
                </TheoryBlock>
            </Card>

                    </p>
                    <p>

                    </p>
                    <p>
                        <strong>Línea del tiempo interactiva:</strong> construir una línea del tiempo colaborativa (digital o física) en la que el alumnado sitúe a cada autor, su obra principal, su idea clave y el contexto histórico. Esto permite visualizar las conexiones y rupturas entre las escuelas.
                    </p>
                    <p>

                    </p>
                    <p>
                        <strong>Conexión con la actualidad:</strong> analizar una noticia económica reciente (por ejemplo: la subida de tipos de interés del BCE, la política fiscal tras la pandemia, el debate sobre la renta básica) y pedir a los alumnos que la interpreten desde al menos dos perspectivas teóricas diferentes (keynesiana vs. monetarista; neoclásica vs. conductual). Esto fomenta la comprensión de que no existe una única "verdad" en economía.
                    </p>

            <Card title="Conclusión" icon="✅">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        El pensamiento económico es un <strong>diálogo permanente</strong> entre ideas que se construyen, se critican, se refinan y, a veces, se abandonan para renacer décadas después. Desde el mercantilismo hasta la economía conductual, cada escuela ha aportado herramientas conceptuales que siguen siendo útiles para entender la realidad económica contemporánea. Los mercantilistas nos recuerdan la importancia de la industria nacional; los fisiócratas, el valor de los recursos naturales; los clásicos, los beneficios del libre comercio y la división del trabajo; Marx, la realidad de la explotación y la desigualdad; los neoclásicos, el poder del análisis marginal; Keynes, la necesidad de intervenir en las recesiones; Friedman, los peligros de la inflación; y las nuevas corrientes, la importancia de las instituciones, los sesgos cognitivos, los límites planetarios y la equidad de género.
                    </p>
                    <p>
                        Cada gran crisis ha generado nuevas ideas: la Gran Depresión engendró el keynesianismo, la estanflación revitalizó el monetarismo, la crisis de 2008 reforzó la economía conductual y la preocupación por la regulación financiera, y la pandemia de COVID-19 ha reavivado el debate sobre el papel del Estado y la resiliencia de las economías. El siglo XXI nos desafía con problemas que ninguna escuela del pasado previó en toda su magnitud: el cambio climático, la inteligencia artificial, la concentración de poder en las grandes plataformas digitales y la creciente desigualdad.
                    </p>
                    <p>
                        Para el docente de Economía, conocer la historia del pensamiento económico no es un ejercicio de erudición sino una <strong>herramienta pedagógica esencial</strong>: permite contextualizar cada concepto, fomentar el pensamiento crítico, enseñar al alumnado que las ideas económicas son productos históricos y no verdades reveladas, y conectar la disciplina con los retos del mundo en que vivimos. Como señaló Keynes: <em>"Las ideas de los economistas y los filósofos políticos, tanto cuando aciertan como cuando se equivocan, son más poderosas de lo que comúnmente se cree. En realidad, el mundo está gobernado por pocas cosas más"</em>.
                    </p>

                <TheoryBlock title="1.1. Definición y clasificación clásica" color="purple">
                    <p>
                        Los <strong>factores productivos</strong> (también denominados <em>recursos productivos</em> o <em>inputs</em>) son todos aquellos elementos —materiales, humanos e intangibles— que las empresas utilizan en el proceso de producción para obtener bienes y servicios (<em>outputs</em>). La clasificación clásica, heredada de Adam Smith y consolidada por la escuela clásica del siglo XIX, distingue tres factores fundamentales: la <strong>tierra</strong> (recursos naturales), el <strong>trabajo</strong> (actividad humana) y el <strong>capital</strong> (bienes producidos que se utilizan para producir otros bienes).
                    </p>
                    <p>
                        La ciencia económica moderna ha ampliado esta clasificación tripartita para incluir al menos dos factores adicionales: el <strong>capital humano</strong> (conocimientos, habilidades y competencias acumuladas por los trabajadores, concepto desarrollado por <strong>Gary Becker</strong> y <strong>Theodore Schultz</strong>) y la <strong>tecnología o innovación</strong> (la aplicación del conocimiento científico y técnico a la producción, factor enfatizado por <strong>Robert Solow</strong> y <strong>Joseph Schumpeter</strong>). Algunos autores añaden un sexto factor: la <strong>iniciativa empresarial</strong> o <em>entrepreneurship</em>, la capacidad de organizar los demás factores, asumir riesgos e innovar, función destacada por <strong>Schumpeter</strong> (<em>destrucción creativa</em>), <strong>Richard Cantillon</strong> (el empresario como tomador de riesgos) y <strong>Frank Knight</strong> (la distinción entre riesgo e incertidumbre).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Retribución de los factores" color="blue">
                    <p>
                        Cada factor productivo recibe una <strong>retribución</strong> por su participación en el proceso productivo, que constituye a la vez un coste para la empresa y una renta para el propietario del factor:
                    </p>
                    <p>
                        La <strong>tierra</strong> (recursos naturales) recibe una <strong>renta</strong> (renta de la tierra, en el sentido de Ricardo). El <strong>trabajo</strong> recibe un <strong>salario</strong> (incluidas todas las formas de remuneración: salario base, complementos, cotizaciones sociales). El <strong>capital</strong> recibe un <strong>interés</strong> (retribución por el uso del capital ajeno) o un <strong>beneficio</strong> (retribución del capital propio invertido). La <strong>iniciativa empresarial</strong> recibe el <strong>beneficio empresarial</strong> (residual, tras pagar a los demás factores), que puede interpretarse como la compensación por asumir el riesgo y la incertidumbre.
                    </p>
                    <p>
                        La <strong>distribución funcional de la renta</strong> estudia cómo se reparte la renta nacional entre los distintos factores productivos (participación de los salarios vs. participación de los beneficios en el PIB). Esta distribución tiene implicaciones fundamentales para la equidad social: en las últimas décadas, la participación de los salarios en la renta nacional ha disminuido en la mayoría de los países desarrollados, lo que se relaciona con la creciente desigualdad documentada por <strong>Piketty</strong> (2013) y con fenómenos como la globalización, la automatización y la debilitación del poder negociador de los sindicatos.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. La tierra (recursos naturales)" icon="🌍">
                <TheoryBlock title="2.1. Concepto y características" color="green">
                    <p>
                        En sentido económico, la <strong>tierra</strong> comprende todos los <strong>recursos naturales</strong> que pueden utilizarse en el proceso productivo: el suelo cultivable, los minerales, los combustibles fósiles, el agua, los bosques, la pesca, la biodiversidad, la energía solar y eólica, y el espacio físico para las actividades económicas. El concepto es, por tanto, mucho más amplio que el de "tierra agrícola" y abarca todo lo que la naturaleza proporciona como input para la producción.
                    </p>
                    <p>
                        Las características económicas de los recursos naturales son: su <strong>oferta fija</strong> (la cantidad total de tierra es limitada, aunque su uso puede intensificarse), su <strong>heterogeneidad</strong> (las tierras difieren en fertilidad, localización y recursos) y su <strong>inamovilidad</strong> (no se puede desplazar la tierra de un lugar a otro). <strong>David Ricardo</strong> desarrolló la <strong>teoría de la renta diferencial</strong>, según la cual las tierras más fértiles y mejor situadas generan una renta más alta: cuando la demanda de alimentos crece y se ponen en cultivo tierras cada vez menos fértiles, los propietarios de las tierras más productivas perciben una renta que refleja la diferencia de productividad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Recursos renovables, no renovables y límites del crecimiento" color="emerald">
                    <p>
                        Una distinción fundamental es la que separa los <strong>recursos renovables</strong> (que se regeneran naturalmente si se explotan por debajo de su tasa de renovación: bosques, pesca, energía solar) de los <strong>recursos no renovables</strong> (que se agotan con el uso: petróleo, gas natural, minerales). La <strong>regla de Hotelling</strong> (1931) establece que el precio de un recurso no renovable debe crecer a la tasa de interés para que su explotación sea óptima a lo largo del tiempo.
                    </p>
                    <p>
                        El informe <strong><em>Los límites del crecimiento</em></strong> del <strong>Club de Roma</strong> (1972), elaborado por Donella y Dennis Meadows, alertó sobre la imposibilidad del crecimiento exponencial indefinido en un planeta con recursos finitos. Aunque sus predicciones más catastrofistas no se han cumplido (gracias al progreso tecnológico y la eficiencia energética), su mensaje fundamental sigue vigente: la sostenibilidad exige que la explotación de recursos naturales respete los <strong>límites planetarios</strong> (concepto desarrollado por Johan Rockström, 2009). La <strong>huella ecológica</strong> mide la cantidad de tierra y agua biológicamente productivas que una población requiere para producir los recursos que consume y para absorber sus residuos, y permite comparar el impacto ambiental de distintos países y estilos de vida.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. El trabajo" icon="👷">
                <TheoryBlock title="3.1. Conceptos fundamentales del mercado de trabajo" color="amber">
                    <p>
                        El <strong>trabajo</strong> es la actividad humana, física e intelectual, aplicada al proceso productivo. En términos estadísticos, la <strong>población activa</strong> comprende todas las personas en edad de trabajar (16-64 años en España) que están ocupadas o buscan activamente empleo. La <strong>población ocupada</strong> incluye a quienes tienen un empleo (por cuenta ajena o propia), mientras que la <strong>población parada</strong> agrupa a quienes buscan empleo sin encontrarlo.
                    </p>
                    <p>
                        Las principales <strong>tasas</strong> del mercado laboral son: la <strong>tasa de actividad</strong> (población activa / población en edad de trabajar × 100), la <strong>tasa de empleo</strong> (población ocupada / población en edad de trabajar × 100) y la <strong>tasa de paro</strong> (población parada / población activa × 100). En España (datos INE, EPA), la tasa de paro ha sido históricamente más elevada que la media de la Unión Europea, con un componente estructural significativo y una especial incidencia en el desempleo juvenil (menores de 25 años).
                    </p>
                    <p>
                        Los <strong>determinantes de la oferta de trabajo</strong> incluyen el tamaño de la población, la tasa de participación (especialmente la incorporación de la mujer al mercado laboral), el nivel educativo, la inmigración y las preferencias entre trabajo y ocio. Los <strong>determinantes de la demanda de trabajo</strong> dependen de la productividad marginal del trabajo (las empresas contratan trabajadores hasta que el valor de su producto marginal iguala al salario), el nivel de actividad económica, la tecnología, la regulación laboral y los costes laborales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. El capital humano" color="blue">
                    <p>
                        <strong>Gary Becker</strong> (1930-2014, Premio Nobel 1992) revolucionó la economía del trabajo con su teoría del <strong>capital humano</strong>, desarrollada en <em>Human Capital</em> (1964). Becker demostró que la educación y la formación son <strong>inversiones</strong> —no meros gastos— que incrementan la productividad y los ingresos futuros del trabajador. La decisión de estudiar puede analizarse con las mismas herramientas de coste-beneficio que cualquier inversión: los costes (matrícula, libros, coste de oportunidad del tiempo) se comparan con los beneficios esperados (mayores salarios a lo largo de la vida laboral).
                    </p>
                    <p>
                        <strong>Theodore Schultz</strong> (Premio Nobel 1979) contribuyó a esta teoría demostrando que la inversión en capital humano (educación, salud, formación profesional) explica una parte fundamental del crecimiento económico, mayor incluso que la inversión en capital físico. La <strong>división del trabajo</strong> (Smith, 1776, ejemplo de la fábrica de alfileres) aumenta la productividad al permitir la especialización, pero exige coordinación y genera interdependencia. La <strong>paradoja de la formación específica vs. general</strong> (Becker) explica por qué las empresas financian la formación específica (que solo es útil en esa empresa) pero no la general (que aumenta la productividad del trabajador en cualquier empresa, por lo que el trabajador la financia con un menor salario inicial).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. El capital" icon="🏭">
                <TheoryBlock title="4.1. Tipología del capital" color="violet">
                    <p>
                        El <strong>capital</strong>, en sentido económico, comprende todos los <strong>bienes producidos que se utilizan para producir otros bienes</strong> (maquinaria, edificios, herramientas, infraestructuras, tecnología, software). No debe confundirse con el capital financiero (dinero, acciones, bonos), que es simplemente un derecho sobre el capital real. La distinción fundamental es entre <strong>capital fijo</strong> (bienes que se utilizan repetidamente durante varios ciclos productivos: maquinaria, edificios, vehículos) y <strong>capital circulante</strong> (bienes que se consumen o transforman en un único ciclo productivo: materias primas, energía, productos semielaborados).
                    </p>
                    <p>
                        Otra clasificación relevante distingue entre <strong>capital físico</strong> (tangible: maquinaria, infraestructuras) y <strong>capital intangible</strong> (patentes, software, bases de datos, reputación de marca). En la economía del conocimiento del siglo XXI, el capital intangible ha ganado una importancia creciente, hasta el punto de superar al capital físico en muchas de las empresas más valiosas del mundo (las grandes tecnológicas como Apple, Google, Microsoft).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Acumulación de capital, depreciación e I+D+i" color="green">
                    <p>
                        La <strong>acumulación de capital</strong> es el proceso mediante el cual una economía incrementa su stock de capital a lo largo del tiempo. La secuencia lógica es: <strong>ahorro → inversión → acumulación de capital → crecimiento</strong>. El ahorro (la renta no consumida) se canaliza, a través del sistema financiero, hacia la inversión productiva, que incrementa la capacidad productiva de la economía. Este mecanismo fue identificado por los clásicos (Smith, Ricardo) y formalizado en el <strong>modelo de crecimiento de Solow</strong> (1956).
                    </p>
                    <p>
                        Sin embargo, el capital se <strong>deprecia</strong> con el uso y el tiempo (desgaste físico, obsolescencia tecnológica). La <strong>inversión neta</strong> (inversión bruta menos depreciación) determina si el stock de capital de una economía crece, se mantiene o disminuye. La <strong>inversión en I+D+i</strong> (investigación, desarrollo e innovación) es especialmente relevante, pues genera progreso tecnológico, que es el motor fundamental del crecimiento a largo plazo según los modelos de <strong>crecimiento endógeno</strong> (Romer, 1990; Lucas, 1988). España destina en torno al 1,4% de su PIB a I+D, por debajo de la media de la UE (2,3%) y muy lejos de los líderes (Suecia: 3,4%, Alemania: 3,1%).
                    </p>
                    <p>
                        Junto al capital físico y tecnológico, el <strong>capital social</strong> (redes de confianza, normas de reciprocidad, instituciones cívicas) también influye en el desempeño económico. <strong>Robert Putnam</strong> (<em>Making Democracy Work</em>, 1993) demostró que las regiones con mayor capital social (norte de Italia) crecían más que las de menor capital social (sur de Italia). <strong>Douglass North</strong> enfatizó que las <strong>instituciones</strong> (reglas formales e informales) son la variable clave que explica las diferencias de desarrollo entre países.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. La función de producción" icon="📐">
                <TheoryBlock title="5.1. Concepto y expresión general" color="purple">
                    <p>
                        La <strong>función de producción</strong> es la relación técnica que expresa la cantidad máxima de output (producción) que una empresa puede obtener a partir de una determinada combinación de inputs (factores productivos), dado un estado de la tecnología. Su expresión general es:
                    </p>
                </TheoryBlock>

                <FormulaBox formula="Q = f(L, K, T, H)" desc="Donde: Q = cantidad producida, L = trabajo, K = capital, T = tierra/recursos naturales, H = capital humano/tecnología" />

                <TheoryBlock title="5.2. La función de producción a corto plazo" color="blue">
                    <p>
                        En el <strong>corto plazo</strong>, al menos un factor productivo está fijo (normalmente el capital, K). La empresa solo puede variar el factor variable (normalmente el trabajo, L). En este contexto se definen tres magnitudes fundamentales:
                    </p>
                    <p>
                        El <strong>Producto Total (PT)</strong> es la cantidad total producida para cada nivel del factor variable. El <strong>Producto Medio (PMe)</strong> es la producción por unidad de factor variable: <strong>PMe = PT / L</strong>. Representa la productividad media del trabajo. El <strong>Producto Marginal (PMg)</strong> es el incremento de la producción que se obtiene al añadir una unidad adicional del factor variable: <strong>PMg = ΔPT / ΔL</strong>. Representa la productividad marginal del trabajo.
                    </p>
                    <p>
                        La relación entre PT, PMe y PMg sigue un patrón característico que da lugar a las <strong>tres fases de la producción</strong>. En la <strong>Fase I</strong>, el PMg es creciente y superior al PMe; el PT crece a tasas crecientes. Esta fase refleja las ganancias de la especialización y la división del trabajo. En la <strong>Fase II</strong>, el PMg es decreciente pero todavía positivo; el PT sigue creciendo pero a tasas decrecientes. Es la zona de producción racional, donde la empresa opera normalmente. En la <strong>Fase III</strong>, el PMg se vuelve negativo; el PT empieza a disminuir. Añadir más trabajadores reduce la producción (exceso de factor variable respecto al factor fijo).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. La ley de rendimientos marginales decrecientes" color="amber">
                    <p>
                        La <strong>ley de los rendimientos marginales decrecientes</strong> (o ley de proporciones variables) establece que, <em>a partir de cierto punto</em>, si se aumenta sucesivamente la cantidad de un factor variable manteniendo fijos los demás factores, los incrementos de producción serán cada vez menores. Esta ley, formulada originalmente por <strong>Turgot</strong> y formalizada por los economistas clásicos (Ricardo la aplicó a la agricultura), es una de las regularidades empíricas más sólidas de la economía.
                    </p>
                    <p>
                        Es crucial entender que la ley no dice que la producción total disminuya (salvo en la Fase III), sino que los <strong>incrementos adicionales de producción</strong> son cada vez menores. La ley opera "a partir de cierto punto": inicialmente, añadir más trabajadores puede generar rendimientos crecientes (por la especialización), pero llegado un punto, el capital fijo se satura y cada trabajador adicional aporta menos producción.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="PMe = PT / L     |     PMg = ΔPT / ΔL" desc="PMe: Producto Medio (productividad media del trabajo) | PMg: Producto Marginal (productividad marginal del trabajo)" />

                <TheoryBlock title="5.4. La función de producción a largo plazo" color="green">
                    <p>
                        En el <strong>largo plazo</strong>, todos los factores son variables: la empresa puede modificar tanto la cantidad de trabajo como la de capital (y de cualquier otro factor). En este contexto, el concepto clave es el de <strong>rendimientos a escala</strong>, que mide cómo varía la producción cuando se incrementan todos los factores simultáneamente en la misma proporción.
                    </p>
                    <p>
                        Existen tres posibilidades: <strong>Rendimientos constantes a escala</strong> (si se duplican todos los inputs, la producción se duplica exactamente), <strong>rendimientos crecientes a escala</strong> (si se duplican todos los inputs, la producción más que se duplica) y <strong>rendimientos decrecientes a escala</strong> (si se duplican todos los inputs, la producción menos que se duplica). Los rendimientos crecientes a escala se relacionan con las <strong>economías de escala</strong> (reducción del coste medio al aumentar la producción), que se estudiarán en detalle en el Tema 7.
                    </p>
                    <p>
                        Gráficamente, la tecnología a largo plazo se representa mediante <strong>isocuantas</strong> (curvas que muestran todas las combinaciones de L y K que producen la misma cantidad de output) e <strong>isocostes</strong> (rectas que muestran todas las combinaciones de L y K que tienen el mismo coste total). La combinación óptima de factores se alcanza en el punto de tangencia entre la isocuanta y la isocoste, donde la <strong>Relación Marginal de Sustitución Técnica (RMST)</strong> iguala al cociente de precios de los factores (w/r).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.5. La función de producción Cobb-Douglas" color="violet">
                    <p>
                        La función de producción más utilizada en el análisis económico es la <strong>función Cobb-Douglas</strong>, formulada por <strong>Charles Cobb</strong> (matemático) y <strong>Paul Douglas</strong> (economista y senador) en 1928:
                    </p>
                </TheoryBlock>

                <FormulaBox formula="Q = A · L^α · K^β" desc="Donde: A = parámetro de eficiencia/tecnología, L = trabajo, K = capital, α = elasticidad del output respecto al trabajo, β = elasticidad del output respecto al capital" />

                <TheoryBlock color="violet">
                    <p>
                        Las propiedades fundamentales de la Cobb-Douglas son: si <strong>α + β = 1</strong>, hay rendimientos constantes a escala; si <strong>α + β &gt; 1</strong>, rendimientos crecientes; si <strong>α + β &lt; 1</strong>, rendimientos decrecientes. El parámetro <strong>α</strong> representa la participación del trabajo en la renta nacional y <strong>β</strong> la del capital (cuando hay rendimientos constantes). Empíricamente, en la mayoría de los países, α ≈ 0,7 y β ≈ 0,3, lo que significa que aproximadamente el 70% de la renta se destina a retribuir al trabajo y el 30% al capital. El parámetro <strong>A</strong> recoge la <strong>productividad total de los factores</strong> (PTF), es decir, todo aquello que incrementa la producción sin aumentar la cantidad de factores (tecnología, eficiencia organizativa, instituciones).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. La productividad" icon="📊">
                <TheoryBlock title="6.1. Concepto y medición" color="blue">
                    <p>
                        La <strong>productividad</strong> mide la eficiencia con la que una economía, un sector o una empresa transforma los inputs en outputs. Es uno de los indicadores más importantes del desempeño económico, pues determina el nivel de vida a largo plazo: como afirmó <strong>Paul Krugman</strong>, <em>"la productividad no lo es todo, pero a largo plazo es casi todo"</em>.
                    </p>
                    <p>
                        Las principales medidas de productividad son: la <strong>productividad del trabajo (PL)</strong> = Q / L (producción por trabajador o por hora trabajada); la <strong>productividad del capital (PK)</strong> = Q / K (producción por unidad de capital); y la <strong>productividad total de los factores (PTF)</strong>, que mide la parte del crecimiento de la producción que no se explica por el aumento de los factores, sino por mejoras en la eficiencia, la tecnología, las instituciones y la organización. La PTF se calcula como <strong>residuo</strong> en el modelo de <strong>Solow</strong> (1956): es la diferencia entre el crecimiento observado del output y la suma ponderada del crecimiento de los factores.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="PL = Q / L     |     PTF = ΔQ/Q − α·(ΔL/L) − β·(ΔK/K)" desc="PL: Productividad del trabajo | PTF: Productividad Total de los Factores (residuo de Solow)" />

                <TheoryBlock title="6.2. Determinantes de la productividad" color="green">
                    <p>
                        Los principales <strong>determinantes de la productividad</strong> son: el <strong>capital humano</strong> (nivel educativo y formación de los trabajadores, Becker/Schultz); la <strong>inversión en capital físico</strong> (maquinaria, infraestructuras, tecnología); la <strong>innovación tecnológica</strong> (I+D+i, patentes, digitalización); la <strong>calidad institucional</strong> (Estado de derecho, protección de la propiedad, regulación eficiente, North/Acemoglu); las <strong>economías de escala</strong> (reducción de costes al aumentar la producción); el <strong>comercio internacional</strong> (acceso a mercados, competencia, difusión tecnológica); y la <strong>eficiencia del mercado de trabajo</strong> (flexibilidad, movilidad, formación continua).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.3. El coste laboral unitario (CLU) y la productividad en España" color="amber">
                    <p>
                        El <strong>coste laboral unitario (CLU)</strong> mide el coste del trabajo por unidad de producción y es un indicador clave de la competitividad:
                    </p>
                </TheoryBlock>

                <FormulaBox formula="CLU = Coste laboral por trabajador / Productividad del trabajo = (W/L) / (Q/L) = W/Q" desc="Donde: W = coste laboral total, L = número de trabajadores, Q = producción" />

                <TheoryBlock color="amber">
                    <p>
                        Si los salarios crecen más rápido que la productividad, el CLU aumenta y la economía pierde competitividad. Si la productividad crece más que los salarios, el CLU disminuye y la competitividad mejora. La <strong>productividad del trabajo en España</strong> ha crecido de forma modesta en las últimas décadas, por debajo de la media de la UE y muy lejos de los países líderes (Alemania, Francia, Países Bajos). Las principales causas de este bajo crecimiento son: la elevada proporción de empresas pequeñas (menos productivas que las grandes), la temporalidad del empleo (que desincentiva la inversión en formación), la insuficiente inversión en I+D+i, el peso del sector de la construcción (baja productividad) y las debilidades del sistema educativo.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.4. El modelo de crecimiento de Solow" color="purple">
                    <p>
                        El <strong>modelo de Solow</strong> (<em>A Contribution to the Theory of Economic Growth</em>, 1956, Premio Nobel 1987) es el modelo de referencia para el análisis del crecimiento económico. Su ecuación fundamental es:
                    </p>
                </TheoryBlock>

                <FormulaBox formula="Y = A · f(K, L)" desc="Donde: Y = producción, A = productividad total de los factores (PTF), K = capital, L = trabajo" />

                <TheoryBlock color="purple">
                    <p>
                        Solow demostró que la acumulación de capital físico tiene <strong>rendimientos decrecientes</strong>: a medida que se acumula más capital por trabajador, cada unidad adicional de capital aporta menos producción. En consecuencia, la acumulación de capital no puede sostener el crecimiento indefinidamente; a largo plazo, la economía converge hacia un <strong>estado estacionario</strong> en el que el crecimiento per cápita depende exclusivamente del <strong>progreso tecnológico</strong> (la PTF, el parámetro A). Este resultado fundamental explica por qué la inversión en I+D+i y en capital humano es la clave del crecimiento sostenido.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 7 */}
            <Card title="7. Eficiencia técnica y eficiencia económica" icon="⚖️">
                <TheoryBlock title="7.1. Definiciones y distinción" color="cyan">
                    <p>
                        La <strong>eficiencia técnica</strong> se refiere a la capacidad de obtener la máxima producción posible a partir de una combinación dada de factores (o, equivalentemente, de utilizar la mínima cantidad de factores para alcanzar un nivel de producción dado). Una empresa es técnicamente eficiente si opera <strong>sobre</strong> la función de producción, es decir, si no desperdicia recursos. Una empresa que opera <strong>por debajo</strong> de la función de producción es técnicamente ineficiente.
                    </p>
                    <p>

                    <p>
                        <strong>Adam Smith</strong> (1723-1790) abre <em>La riqueza de las naciones</em> (1776) con el ejemplo más famoso de la historia de la Economía: la <strong>fábrica de alfileres</strong>. Smith observó que un trabajador aislado, realizando todas las operaciones necesarias para fabricar un alfiler (estirar el alambre, cortarlo, afilarlo, ponerle la cabeza, empaquetarlo), apenas podría producir uno o, como mucho, veinte alfileres al día. Sin embargo, cuando el proceso se dividía en dieciocho operaciones distintas, cada una asignada a un trabajador especializado, diez obreros podían fabricar conjuntamente 48.000 alfileres diarios, es decir, 4.800 por persona. La producción se multiplicaba por un factor de entre 240 y 4.800.
                    </p>
                    <p>
                        Este ejemplo ilustra el principio fundamental: la <strong>división del trabajo</strong> —la descomposición de un proceso productivo complejo en tareas simples y repetitivas, cada una asignada a un trabajador diferente— es la fuente principal del aumento de la productividad. Smith identificó tres razones que explican esta mejora espectacular:

                    </p>
                    <p>

                    </p>
                    <p>

                    </p>
                    <p>
                        La <strong>división social</strong> (o profesional) se produce <strong>entre sectores y profesiones</strong> dentro de una economía. La sociedad se organiza en múltiples ocupaciones especializadas —agricultores, médicos, ingenieros, programadores, profesores— que intercambian sus productos y servicios a través del mercado. <strong>Émile Durkheim</strong> (1893) analizó las implicaciones sociológicas de esta división, distinguiendo entre la <em>solidaridad mecánica</em> de las sociedades primitivas (basada en la similitud) y la <em>solidaridad orgánica</em> de las sociedades modernas (basada en la interdependencia derivada de la especialización).
                    </p>

                    </p>
                    <p>
