    const { useState, useMemo, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area, Legend, BarChart, Bar, PieChart, Pie, Cell, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar, ComposedChart, Scatter, ReferenceLine } = Recharts;

    function BlocAApp() {
        const [section, setSection] = useState('inicio');
        const [idioma, setIdioma] = useState(PdeLanguageStore.get());
        usePdeDeepLink(section, setSection);

        const pageTranslations = {
            'nav.oposicions-bloc-a': { val: "Bloc A: Fonaments d'Economia", es: 'Bloque A: Fundamentos de Economía', en: 'Block A: Economics Fundamentals' },
            'footer.appname': { val: "Bloc A — Oposicions d'Economia", es: "Bloque A — Oposiciones de Economía", en: 'Block A — Economics Exams' },
            'inicio.title': { val: "Bloc A: Fonaments d'Economia", es: 'Bloque A: Fundamentos de Economía', en: 'Block A: Economics Fundamentals' },
            'inicio.subtitle': { val: "Temes 1-10 de les oposicions d'Economia a Secundària. Objecte, mètode, pensament econòmic, factors productius, FPP, sistemes econòmics, mercat i equilibri.", es: 'Temas 1-10. Objeto, método, pensamiento, factores, FPP, sistemas, mercado.', en: 'Topics 1-10. Subject, method, thought, factors, PPF, systems, market.' },
            'inicio.backOpo': { val: "← Tornar a Oposicions", es: '← Volver a Oposiciones', en: '← Back to Exams' },
            'inicio.disponible': { val: "Disponible", es: 'Disponible', en: 'Available' },
            'sec.inicio': { val: 'Inici', es: 'Inicio', en: 'Home' },
            'tab.complet': { val: 'Tema complet', es: 'Tema completo', en: 'Full topic' },
            'tab.resum': { val: 'Resum / Esquema', es: 'Resumen / Esquema', en: 'Summary / Outline' },
            'tema1.title': { val: "L'objecte de l'Economia. Economia i Economia Política. Relacions amb altres CCSS.", es: 'Objeto de la Economía. Relaciones con otras CCSS.', en: 'Subject of Economics. Relations with other social sciences.' },
            'tema2.title': { val: "Mètodes en Economia. Positiva i normativa. Judicis de valor. Discrepàncies.", es: 'Métodos en Economía. Positiva y normativa.', en: 'Methods. Positive and normative.' },
            'tema3.title': { val: "Tècniques i procediments. Els models. Variables econòmiques. Números índex.", es: 'Técnicas y procedimientos. Modelos. Números índice.', en: 'Techniques. Models. Index numbers.' },
            'tema4.title': { val: "Evolució del pensament econòmic. Clàssics. Marx. Neoclàssics.", es: 'Evolución del pensamiento. Clásicos, marxismo, neoclásicos.', en: 'Evolution of economic thought.' },
            'tema5.title': { val: "Institucionalisme. Keynesianisme. Monetarisme. Tendències actuals.", es: 'Institucionalismo. Keynesianismo. Monetarismo.', en: 'Institutionalism. Keynesianism. Monetarism.' },
            'tema6.title': { val: "Base humana de l'activitat econòmica. Necessitats. Béns econòmics.", es: 'Base humana. Necesidades. Bienes económicos.', en: 'Human basis. Needs. Economic goods.' },
            'tema7.title': { val: "Els factors productius. La FPP. Cost d'oportunitat. Progrés tècnic.", es: 'Factores productivos. FPP. Coste de oportunidad.', en: 'Factors of production. PPF. Opportunity cost.' },
            'tema8.title': { val: "Problemes econòmics bàsics. Decisions: tradició, mercat, autoritat. Sistemes econòmics.", es: 'Problemas económicos. Sistemas económicos.', en: 'Basic economic problems. Economic systems.' },
            'tema9.title': { val: "Divisió del treball i especialització. Interdependència. Sectors econòmics.", es: 'División del trabajo. Sectores económicos.', en: 'Division of labour. Economic sectors.' },
            'tema10.title': { val: "Del troc al diner i al mercat. Demanda, oferta i equilibri.", es: 'Del trueque al mercado. Demanda, oferta y equilibrio.', en: 'From barter to market. Demand, supply, equilibrium.' },
        };

        const t = createTranslator(pageTranslations, idioma);
        const lang = idioma;

        const Card = ({ children, className = "", title, icon }) => (<div className={`bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 hover:shadow-md transition-shadow ${className} animate-fade`}>{title && <div className="flex items-center gap-3 mb-5 pb-4 border-b border-slate-100"><span className="text-2xl">{icon}</span><h3 className="font-bold text-slate-800 text-lg">{title}</h3></div>}{children}</div>);
        const Tabs = ({ tabs, active, onChange }) => (<div className="flex flex-wrap gap-1 p-1.5 bg-slate-100 rounded-xl">{tabs.map(tab => (<button key={tab.id} onClick={() => onChange(tab.id)} className={`flex-1 min-w-fit py-2.5 px-4 rounded-lg text-sm font-semibold transition-all ${active === tab.id ? 'bg-white shadow-sm text-purple-600' : 'text-slate-600 hover:text-slate-800 hover:bg-white/50'}`}>{tab.label}</button>))}</div>);
        const TheoryBlock = ({ title, children, color = "slate" }) => { const colors = { slate: "border-slate-300 bg-slate-50", blue: "border-blue-300 bg-blue-50", teal: "border-teal-300 bg-teal-50", cyan: "border-cyan-300 bg-cyan-50", indigo: "border-indigo-300 bg-indigo-50", violet: "border-violet-300 bg-violet-50", purple: "border-purple-300 bg-purple-50", green: "border-green-300 bg-green-50", emerald: "border-emerald-300 bg-emerald-50", amber: "border-amber-300 bg-amber-50", rose: "border-rose-300 bg-rose-50", pink: "border-pink-300 bg-pink-50", red: "border-red-300 bg-red-50", orange: "border-orange-300 bg-orange-50" }; return (<div className={`border-l-4 ${colors[color] || colors.slate} p-5 rounded-r-xl my-4`}>{title && <h4 className="font-bold text-slate-800 mb-3 text-base">{title}</h4>}<div className="text-slate-700 text-sm leading-relaxed space-y-2">{children}</div></div>); };
        const FormulaBox = ({ formula, desc }) => (<div className="my-4 p-5 bg-gradient-to-r from-purple-50 to-violet-50 rounded-xl border border-purple-100"><p className="text-center font-mono text-lg text-purple-800 font-semibold">{formula}</p>{desc && <p className="text-center text-sm text-purple-600 mt-2">{desc}</p>}</div>);
        const SectionTitle = ({ icon, title, subtitle }) => (<div className="mb-8"><div className="flex items-center gap-3 mb-2"><span className="text-3xl">{icon}</span><h1 className="text-3xl font-black text-slate-800">{title}</h1></div>{subtitle && <p className="text-slate-500 ml-12 text-sm">{subtitle}</p>}</div>);
        const BibliografiaBox = ({ items }) => (<div className="my-6 p-6 bg-gradient-to-r from-slate-50 to-gray-50 rounded-xl border border-slate-200"><h4 className="font-bold text-slate-800 mb-4 text-base flex items-center gap-2"><span>📚</span> Bibliografia</h4><ul className="space-y-2">{items.map((item, i) => <li key={i} className="text-sm text-slate-700 leading-relaxed pl-4 border-l-2 border-slate-200">{item}</li>)}</ul></div>);
        const ClauBox = ({ children }) => (<div className="my-4 p-5 bg-gradient-to-r from-amber-50 to-yellow-50 rounded-xl border border-amber-200"><div className="flex items-start gap-3"><span className="text-2xl">🔑</span><div><h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4><div className="text-sm text-amber-800 space-y-1">{children}</div></div></div></div>);

        // TEMA 1 — Objecte de l'Economia
        const Tema1Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>L'<strong>Economia</strong> és la ciència social que estudia com els individus i les societats assignen recursos escassos a fins alternatius. És una ciència jove (Smith 1776) però fonamental: explica el benestar material, la pobresa, el creixement, les crisis i la distribució. Aquest primer tema estableix què és l'Economia, d'on ve el terme "Economia Política" i les seues relacions amb altres ciències socials.</p></div></Card>
                <Card title="1. Concepte i definicions d'Economia" icon="🎯">
                    <TheoryBlock title="1.1. Etimologia i evolució" color="purple"><p><strong>Economia</strong> prové del grec <em>oikos</em> (casa) + <em>nomos</em> (norma) → "administració de la casa". Aristòtil (s. IV aC) va distingir <em>oikonomia</em> (gestió familiar) de <em>crematística</em> (art d'enriquir-se).</p><p>Al segle XVII-XVIII: <strong>Economia Política</strong> (política = polis, ciutat) → gestió de la riquesa pública. <strong>Adam Smith</strong> (1776, <em>Wealth of Nations</em>) funda l'Economia com a disciplina moderna.</p><p>Al segle XX, <strong>Alfred Marshall</strong> (1890) popularitza el terme "Economia" (sense "política") per accentuar-ne el caràcter científic.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Definicions clàssiques" color="indigo"><p><strong>Adam Smith (1776)</strong>: "ciència de la naturalesa i causes de la riquesa de les nacions".</p><p><strong>Alfred Marshall (1890)</strong>: "estudi dels afers ordinaris de la vida humana" (<em>Principles of Economics</em>).</p><p><strong>Lionel Robbins (1932)</strong>, definició canònica: "ciència que estudia la conducta humana com una relació entre fins i mitjans escassos susceptibles d'usos alternatius". Aquesta definició — basada en l'<strong>escassetat</strong> i l'<strong>elecció</strong> — és la més usada actualment.</p><p><strong>Paul Samuelson (1948)</strong>: "estudi de com les societats usen recursos escassos per a produir béns i distribuir-los entre persones diferents".</p><p><strong>Gregory Mankiw (1998)</strong>: "estudi de com la societat administra els seus recursos escassos".</p></TheoryBlock>
                    <TheoryBlock title="1.3. Elements essencials" color="violet"><p>De les definicions emergeixen 4 elements constitutius:</p><p><strong>• Escassetat</strong>: els recursos (temps, capital, treball, matèries) són finits davant necessitats il·limitades.</p><p><strong>• Elecció</strong>: l'escassetat obliga a decidir; no es pot tenir tot.</p><p><strong>• Cost d'oportunitat</strong>: cada elecció implica renunciar a alternatives.</p><p><strong>• Eficiència</strong>: obtenir el màxim benestar amb els recursos donats.</p></TheoryBlock>
                </Card>
                <Card title="2. Economia vs. Economia Política" icon="📜">
                    <TheoryBlock title="Distinció històrica" color="amber"><p><strong>Economia Política</strong> (mercantilistes, fisiòcrates, clàssics, marxistes): emfatitza les dimensions històriques, polítiques, ètiques i distributives. Enfocament normatiu i sistèmic.</p><p><strong>Economia</strong> (neoclàssics des de 1870, "revolució marginalista"): pretén ser ciència positiva, amb mètode matemàtic, inspirada en les ciències naturals. Enfocament descriptiu i analític.</p><p>Autors contemporanis (Piketty 2013, <em>Capital al segle XXI</em>) reivindiquen el retorn a l'Economia Política per abordar desigualtat i poder.</p></TheoryBlock>
                </Card>
                <Card title="3. Microeconomia i Macroeconomia" icon="🔍">
                    <TheoryBlock title="3.1. Microeconomia" color="blue"><p>Estudia les decisions individuals: consumidors, empreses, mercats específics. Pares: <strong>Marshall</strong> (equilibri parcial), <strong>Walras</strong> (equilibri general), <strong>Pareto</strong> (òptim). Temes centrals: preus, oferta, demanda, competència, externalitats.</p></TheoryBlock>
                    <TheoryBlock title="3.2. Macroeconomia" color="green"><p>Estudia variables agregades: PIB, inflació, atur, balança pagaments. Fundada per <strong>Keynes (1936)</strong> <em>Teoria General</em>. Autors posteriors: <strong>Friedman</strong> (monetarisme), <strong>Lucas</strong> (expectatives racionals), <strong>Blanchard</strong>. Temes: cicles, polítiques fiscal i monetària, creixement.</p></TheoryBlock>
                    <TheoryBlock title="3.3. Relació micro-macro" color="rose"><p>La macro descansa sobre fonaments micro (<em>microfoundations</em>): les decisions agregades són suma d'accions individuals. Però no sempre: <em>falàcia de composició</em> (Keynes: estalviar tots alhora és recessiu).</p></TheoryBlock>
                </Card>
                <Card title="4. Relacions amb altres ciències socials" icon="🌐">
                    <TheoryBlock title="Interdisciplinarietat" color="cyan"><p><strong>Sociologia</strong>: Weber, Durkheim. Estructures socials, classes, institucions. Economia del treball, família, educació.</p><p><strong>Política</strong>: teoria de l'elecció social (Arrow 1951 Nobel 1972), public choice (Buchanan-Tullock 1962 Nobel 1986).</p><p><strong>Història</strong>: història econòmica (Chandler, North Nobel 1993). Long durée de Braudel. Cliometria (Fogel Nobel 1993).</p><p><strong>Psicologia</strong>: economia conductual. <strong>Kahneman</strong> (Nobel 2002), <strong>Thaler</strong> (Nobel 2017). Biaixos cognitius, <em>nudges</em>.</p><p><strong>Dret</strong>: Law &amp; Economics (Posner, Coase Nobel 1991). Propietat, contractes, responsabilitat.</p><p><strong>Matemàtiques i estadística</strong>: economètria (Frisch Nobel 1969), teoria de jocs (Nash Nobel 1994).</p><p><strong>Geografia</strong>: Nova Geografia Econòmica (Krugman Nobel 2008).</p><p><strong>Filosofia</strong>: ètica econòmica (Sen Nobel 1998), justícia (Rawls 1971).</p></TheoryBlock>
                </Card>
                <Card title="5. Economia com a ciència" icon="🔬">
                    <TheoryBlock title="Estatus científic" color="emerald"><p>És l'Economia una ciència? Debat obert:</p><p><strong>A favor</strong>: mètode hipotètic-deductiu, models formals, contrastació empírica, premis Nobel (des 1969).</p><p><strong>Crítiques</strong>: dificultat d'experimentar (però: RCT de Banerjee-Duflo-Kremer Nobel 2019), dependència del context històric i cultural, supòsits poc realistes (homo economicus vs. homo reciprocans).</p><p><strong>Samuelson</strong> defensava la naturalesa científica; <strong>Keynes</strong> (<em>Essays in Persuasion</em>) la veia més com "art" + ciència.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>L'Economia és la ciència social que estudia l'assignació de recursos escassos. Des de <strong>Smith (1776)</strong> fins <strong>Robbins (1932)</strong> i més enllà, ha evolucionat mantenint l'escassetat com a problema central. Es divideix en Microeconomia i Macroeconomia i s'interrelaciona amb Sociologia, Política, Dret, Psicologia i altres ciències. El docent ha de transmetre que l'Economia és tant teoria com pràctica: explica i ajuda a decidir.</p></div></Card>
                <BibliografiaBox items={['SMITH, A. (1776): An Inquiry into the Nature and Causes of the Wealth of Nations.','MARSHALL, A. (1890): Principles of Economics, Macmillan.','ROBBINS, L. (1932): An Essay on the Nature and Significance of Economic Science.','SAMUELSON, P. (1948): Economics, McGraw-Hill.','KEYNES, J.M. (1936): The General Theory of Employment, Interest and Money.','MANKIW, N.G. (1998): Principles of Economics, Harcourt.','PIKETTY, T. (2013): Le Capital au XXIe siècle, Seuil.','SEN, A. (1987): On Ethics and Economics, Blackwell.','KAHNEMAN, D. (2011): Thinking, Fast and Slow, FSG.','COASE, R.H. (1937): "The Nature of the Firm", Economica, 4.']} />
            </div>
        );
        const Tema1Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 1: Objecte de l'Economia</p><p className="text-center text-sm text-purple-600 mt-1"><em>«Ciència de la conducta humana com a relació entre fins i mitjans escassos»</em> — Robbins (1932)</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Concepte</h4><ul className="list-disc pl-5 space-y-1"><li>Etimologia: oikos + nomos (Aristòtil).</li><li>Smith 1776 (riquesa), Marshall 1890 (afers ordinaris), Robbins 1932 (escassetat), Samuelson 1948.</li><li>4 elements: escassetat, elecció, cost oportunitat, eficiència.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Economia vs. Eco. Política</h4><ul className="list-disc pl-5 space-y-1"><li>Clàssics i marxistes: normativa, històrica.</li><li>Neoclàssics: positiva, matemàtica.</li><li>Retorn amb Piketty (2013).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Micro i Macro</h4><ul className="list-disc pl-5 space-y-1"><li>Micro: Marshall, Walras, Pareto.</li><li>Macro: Keynes 1936, Friedman, Lucas.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Altres ciències</h4><ul className="list-disc pl-5 space-y-1"><li>Sociologia (Weber), Política (Arrow), Història (North), Psicologia (Kahneman), Dret (Coase), Matemàtiques.</li></ul></div></div><ClauBox><p>- Cita <strong>Robbins (1932)</strong> com a definició canònica.</p><p>- Explica la distinció <strong>Economia / Economia Política</strong>.</p><p>- Menciona premis Nobel recents (Acemoglu-Robinson 2024).</p></ClauBox></Card></div>);
        const Tema1 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="📖" title="Tema 1" subtitle={t('tema1.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema1Complet />}{vista === 'resum' && <Tema1Resum />}</div>; };

        // TEMA 2 — Mètodes
        const Tema2Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Com produeix l'Economia coneixement vàlid sobre la realitat? Aquest tema examina els <strong>mètodes científics</strong> aplicats a l'Economia, la distinció fonamental entre <strong>economia positiva</strong> (què és) i <strong>normativa</strong> (què hauria de ser), el paper dels judicis de valor i per què els economistes discrepen.</p></div></Card>
                <Card title="1. El mètode científic" icon="🔬">
                    <TheoryBlock title="1.1. Fases del mètode" color="purple"><p>(1) <strong>Observació</strong> de la realitat i fets.</p><p>(2) <strong>Formulació d'hipòtesis</strong> explicatives.</p><p>(3) <strong>Deducció</strong> d'implicacions contrastables.</p><p>(4) <strong>Contrastació empírica</strong>.</p><p>(5) <strong>Acceptació provisional o refutació</strong>.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Popper (1934) i la falsabilitat" color="indigo"><p><strong>Karl Popper</strong>, a <em>La lògica de la investigació científica</em>, va proposar que una teoria és científica si és <strong>falsable</strong>: ha de fer prediccions que puguin ser refutades per l'evidència. Les teories mai es "verifiquen" definitivament, només resisteixen intents de falsació.</p></TheoryBlock>
                </Card>
                <Card title="2. Mètode inductiu vs. deductiu" icon="🧠">
                    <TheoryBlock title="2.1. Inducció" color="amber"><p>De casos particulars → llei general. Exemple: observar que el preu i la quantitat demandada es mouen en sentits oposats en molts mercats → llei de la demanda.</p><p>Crítica (Hume): la inducció no és lògicament vàlida (passat ≠ futur). Només probabilística.</p></TheoryBlock>
                    <TheoryBlock title="2.2. Deducció" color="violet"><p>D'axiomes o principis → conclusions particulars. Exemple: si el consumidor maximitza utilitat i el preu puja, consumirà menys.</p><p>Base de l'Economia neoclàssica. Risc: sortir de la realitat si els supòsits són falsos.</p></TheoryBlock>
                    <TheoryBlock title="2.3. Mètode hipotètic-deductiu" color="emerald"><p>Síntesi: formular hipòtesis deductivament, contrastar-les inductivament amb dades. Dominant en l'Economia empírica actual. Eines: economètria (regressió, variables instrumentals, dif-in-dif).</p></TheoryBlock>
                </Card>
                <Card title="3. Economia positiva vs. normativa" icon="⚖️">
                    <TheoryBlock title="3.1. Distinció conceptual" color="blue"><p><strong>Economia positiva</strong>: analitza com són les coses. Enunciats contrastables. Ex: "si puja el salari mínim un 10 %, l'atur augmenta un 2 %".</p><p><strong>Economia normativa</strong>: prescriu com haurien de ser. Implica judicis de valor. Ex: "cal pujar el salari mínim per reduir desigualtat".</p><p>Proposada per <strong>John Neville Keynes</strong> (1891) — pare de J.M. Keynes — al llibre <em>The Scope and Method of Political Economy</em>.</p></TheoryBlock>
                    <TheoryBlock title="3.2. Friedman (1953) i la metodologia positiva" color="rose"><p><strong>Milton Friedman</strong>, a <em>Essays in Positive Economics</em>, va defensar la superioritat de l'Economia positiva i va argumentar que <strong>el realisme dels supòsits no importa</strong>, només la capacitat predictiva del model. Posició controvertida (Samuelson criticà-la), però influent.</p></TheoryBlock>
                    <TheoryBlock title="3.3. Judicis de valor en la pràctica" color="amber"><p>Tot i la distinció, és difícil separar: la selecció de temes, de variables i la interpretació sempre involucren valors. <strong>Myrdal</strong> (1944, <em>An American Dilemma</em>) va destacar-ho. Bona pràctica: explicitar els judicis normatius.</p></TheoryBlock>
                </Card>
                <Card title="4. Experiments i nous mètodes" icon="🧪">
                    <TheoryBlock title="4.1. Economia experimental" color="cyan"><p><strong>Vernon Smith</strong> (Nobel 2002): laboratori d'economia. Jocs d'ultimàtum, subhastes. Paradoxa: els subjectes no actuen com a <em>homo economicus</em> pur → economia conductual (<strong>Kahneman-Tversky</strong>).</p></TheoryBlock>
                    <TheoryBlock title="4.2. RCT — Experiments aleatoris controlats" color="green"><p><strong>Banerjee, Duflo, Kremer</strong> (Nobel 2019): mètode mèdic aplicat a polítiques de desenvolupament. Assignar aleatòriament tractament i control. Ha revolucionat l'economia del desenvolupament.</p></TheoryBlock>
                    <TheoryBlock title="4.3. Experiments naturals i quasi-experiments" color="teal"><p><strong>Card, Angrist, Imbens</strong> (Nobel 2021): inferència causal a partir de situacions reals (p.ex. estudi Card-Krueger 1994 sobre salari mínim a Nova Jersey). Tècniques: dif-in-dif, RDD, IV.</p></TheoryBlock>
                </Card>
                <Card title="5. Discrepàncies entre economistes" icon="💭">
                    <TheoryBlock title="Per què discrepen?" color="rose"><p>Raons principals:</p><p>• <strong>Diferents valors</strong>: equitat vs. eficiència, llibertat vs. igualtat.</p><p>• <strong>Diferents teories positives</strong>: keynesians vs. monetaristes.</p><p>• <strong>Incertesa empírica</strong>: dades ambigües, causalitat difícil.</p><p>• <strong>Interessos</strong>: ideologia, captura de grups.</p><p><strong>Blinder (1987)</strong>: hi ha consens en el 70 % de qüestions; la discrepància pública està distorsionada pels mitjans.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El mètode científic en Economia combina inducció i deducció, i distingeix entre analitzar (positiva) i prescriure (normativa) — <strong>J.N. Keynes 1891</strong>, <strong>Friedman 1953</strong>. La falsabilitat de <strong>Popper (1934)</strong> és criteri de cientificitat. Els nous mètodes (experiments de V. Smith, RCT de Duflo) han reforçat l'estatus empíric de l'Economia. Tanmateix, els judicis de valor són inevitables i cal explicitar-los.</p></div></Card>
                <BibliografiaBox items={['POPPER, K. (1934): Logik der Forschung (La lógica de la investigación científica).','KEYNES, J.N. (1891): The Scope and Method of Political Economy.','FRIEDMAN, M. (1953): Essays in Positive Economics, University of Chicago Press.','SAMUELSON, P. (1963): "Problems of Methodology", AER.','MYRDAL, G. (1944): An American Dilemma, Harper.','SMITH, V. (1962): "An Experimental Study of Competitive Market Behavior", JPE.','KAHNEMAN, D. i TVERSKY, A. (1979): "Prospect Theory", Econometrica.','BANERJEE, A. i DUFLO, E. (2011): Poor Economics, PublicAffairs.','CARD, D. i KRUEGER, A. (1994): "Minimum Wages and Employment", AER.','BLINDER, A. (1987): Hard Heads, Soft Hearts, Addison-Wesley.']} />
            </div>
        );
        const Tema2Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 2: Mètodes en Economia</p><p className="text-center text-sm text-purple-600 mt-1">Positiva (què és) vs. Normativa (què hauria de ser) — J.N. Keynes (1891)</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Mètode científic</h4><ul className="list-disc pl-5 space-y-1"><li>5 fases: observació → hipòtesi → deducció → contrastació → acceptació/refutació.</li><li>Popper (1934): falsabilitat.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Inducció/Deducció</h4><ul className="list-disc pl-5 space-y-1"><li>Inducció (casos → llei), deducció (axiomes → casos).</li><li>Hipotètic-deductiu: síntesi actual.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Positiva vs. normativa</h4><ul className="list-disc pl-5 space-y-1"><li>J.N. Keynes (1891), Friedman (1953).</li><li>Myrdal (1944): judicis de valor inevitables.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Nous mètodes</h4><ul className="list-disc pl-5 space-y-1"><li>Experimental (V. Smith Nobel 2002).</li><li>RCT (Banerjee-Duflo-Kremer Nobel 2019).</li><li>Quasi-experimentals (Card-Angrist-Imbens Nobel 2021).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">5. Discrepàncies</h4><ul className="list-disc pl-5 space-y-1"><li>Valors, teories, dades, interessos.</li><li>Blinder (1987): consens 70 %.</li></ul></div></div><ClauBox><p>- Distingeix rigorosament <strong>positiva vs. normativa</strong>.</p><p>- Cita <strong>Popper (1934)</strong>, <strong>J.N. Keynes (1891)</strong>, <strong>Friedman (1953)</strong>.</p><p>- Menciona els <strong>premis Nobel</strong> recents de metodologia (2002, 2019, 2021).</p></ClauBox></Card></div>);
        const Tema2 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="🔬" title="Tema 2" subtitle={t('tema2.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema2Complet />}{vista === 'resum' && <Tema2Resum />}</div>; };

        // TEMA 3 — Tècniques, models, números índex
        const Tema3Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Com representa l'Economia la realitat complexa? Mitjançant <strong>models</strong> simplificats que relacionen <strong>variables</strong>. Entre els instruments quantitatius destaquen els <strong>números índex</strong>: eines essencials per a mesurar preus, producció, salaris al llarg del temps.</p></div></Card>
                <Card title="1. Els models econòmics" icon="🗺️">
                    <TheoryBlock title="1.1. Concepte" color="purple"><p>Un <strong>model</strong> és una representació simplificada de la realitat que captura els elements essencials i omet els secundaris. <strong>Samuelson</strong>: el model és com un mapa, no és el territori però l'explica. <strong>Joan Robinson</strong>: "un mapa a escala 1:1 seria tan inútil com la realitat mateixa".</p></TheoryBlock>
                    <TheoryBlock title="1.2. Tipus de models" color="indigo"><p><strong>• Verbals</strong>: descripcions lògiques.</p><p><strong>• Gràfics</strong>: FPP, IS-LM, oferta-demanda.</p><p><strong>• Matemàtics</strong>: equacions, funcions, sistemes.</p><p><strong>• Simulació</strong>: Monte Carlo, agent-based.</p></TheoryBlock>
                    <TheoryBlock title="1.3. Supòsit ceteris paribus" color="violet"><p>Locució llatina: "romanent les altres coses iguals". Permet aïllar l'efecte d'una variable sobre una altra. És un artefacte analític, no una descripció de la realitat (on tot canvia alhora).</p></TheoryBlock>
                </Card>
                <Card title="2. Variables econòmiques" icon="📊">
                    <TheoryBlock title="2.1. Per rol al model" color="blue"><p><strong>Endògenes</strong>: explicades pel model (preu d'equilibri).</p><p><strong>Exògenes</strong>: preses com a donades (política monetària en un model de consum).</p><p><strong>Instrumentals</strong>: manipulades pels policymakers.</p></TheoryBlock>
                    <TheoryBlock title="2.2. Per dimensió temporal" color="cyan"><p><strong>Stock</strong>: mesurades en un moment (riquesa, deute, població). No tenen unitat de temps.</p><p><strong>Flux</strong>: mesurades per unitat de temps (renda anual, inversió trimestral). Relació: stock = integral del flux.</p></TheoryBlock>
                    <TheoryBlock title="2.3. Per tractament de preus" color="emerald"><p><strong>Nominals</strong>: valorades a preus corrents del període.</p><p><strong>Reals</strong>: corregides per inflació (deflactades).</p><p>Ex.: salari real = salari nominal / IPC · 100.</p></TheoryBlock>
                </Card>
                <Card title="3. Números índex — el cor del tema" icon="📈">
                    <TheoryBlock title="3.1. Concepte" color="indigo"><p>Un <strong>número índex</strong> és un valor que expressa una magnitud (preu, quantitat, valor) com a quocient d'un període respecte a un període base, multiplicat per 100. Permet comparar, agregar i veure evolució temporal.</p></TheoryBlock>
                    <TheoryBlock title="3.2. Tipus d'índexs" color="violet"><p><strong>• Simples</strong>: una sola magnitud, p.ex. IPC d'un bé.</p><p><strong>• Complexos</strong>: agrupen diverses magnituds. Subtipus: ponderats o no ponderats.</p></TheoryBlock>
                    <TheoryBlock title="3.3. Laspeyres (1871)" color="amber"><p>Índex complex ponderat amb <strong>pesos del període base</strong>. Fórmula:</p></TheoryBlock>
                    <FormulaBox formula={"I_L = Σ(p₁·q₀) / Σ(p₀·q₀) · 100"} desc="Laspeyres: ponderació per quantitats del període base" />
                    <TheoryBlock title="3.4. Paasche (1874)" color="blue"><p>Índex complex ponderat amb <strong>pesos del període actual</strong>.</p></TheoryBlock>
                    <FormulaBox formula={"I_P = Σ(p₁·q₁) / Σ(p₀·q₁) · 100"} desc="Paasche: ponderació per quantitats actuals" />
                    <TheoryBlock title="3.5. Fisher (1922)" color="emerald"><p><strong>Mitjana geomètrica</strong> dels dos anteriors. Proposat per Irving Fisher; òptim teòricament (compleix tests de reversibilitat).</p></TheoryBlock>
                    <FormulaBox formula={"I_F = √(I_L · I_P)"} desc="Fisher: mitjana geomètrica de Laspeyres i Paasche" />
                    <TheoryBlock title="3.6. IPC, IPCA i deflactor" color="rose"><p><strong>IPC</strong> (Índex de Preus al Consum, INE): Laspeyres encadenat. Cistella ~479 articles. Base 2021=100. Mesura preus consum llars.</p><p><strong>IPCA</strong>: versió harmonitzada UE (Eurostat).</p><p><strong>Deflactor del PIB</strong>: és un Paasche. Mesura tots els béns de producció nacional.</p><p><strong>IPRI</strong>: preus industrials.</p></TheoryBlock>
                </Card>
                <Card title="4. Exemple numèric" icon="🧮">
                    <TheoryBlock title="Càlcul Laspeyres i Paasche" color="amber"><p>Cistella de 2 béns. Any 0: pa 1€ q=100; llet 2€ q=50. Any 1: pa 1,20€ q=90; llet 2,50€ q=55.</p><p><strong>Laspeyres (p.base)</strong>: numerador = 1,20·100 + 2,50·50 = 245; denominador = 1·100 + 2·50 = 200. I_L = 245/200·100 = <strong>122,5</strong> (inflació 22,5 %).</p><p><strong>Paasche (q.actual)</strong>: num = 1,20·90 + 2,50·55 = 245,5; denom = 1·90 + 2·55 = 200. I_P = 245,5/200·100 = <strong>122,75</strong>.</p><p><strong>Fisher</strong> = √(122,5 · 122,75) ≈ <strong>122,62</strong>.</p></TheoryBlock>
                </Card>
                <Card title="5. Anàlisi estadística i economètrica" icon="📉">
                    <TheoryBlock title="Eines" color="cyan"><p><strong>Descriptiva</strong>: mitjanes, dispersió, correlació.</p><p><strong>Inferencial</strong>: contrast d'hipòtesis, intervals de confiança.</p><p><strong>Economètrica</strong>: OLS (Gauss-Legendre), <strong>Frisch i Tinbergen</strong> (Nobel 1969). Regressió múltiple, sèries temporals (ARIMA, VAR), dades panel.</p><p>Software: R, Stata, EViews, Python.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Els <strong>models</strong>, les <strong>variables</strong> i els <strong>números índex</strong> són les eines quantitatives de l'Economia. <strong>Laspeyres (1871)</strong>, <strong>Paasche (1874)</strong> i <strong>Fisher (1922)</strong> van formalitzar els índexs, i avui l'INE i Eurostat els apliquen a l'IPC i deflactors. L'economètria moderna (des de <strong>Frisch i Tinbergen (Nobel 1969)</strong>) ha consolidat la contrastació empírica.</p></div></Card>
                <BibliografiaBox items={['LASPEYRES, E. (1871): "Die Berechnung einer mittleren Warenpreissteigerung", Jahrbücher für Nationalökonomie.','PAASCHE, H. (1874): "Über die Preisentwicklung der letzten Jahre", ibid.','FISHER, I. (1922): The Making of Index Numbers, Houghton Mifflin.','SAMUELSON, P. (1948): Economics.','TINBERGEN, J. (1939): Statistical Testing of Business-Cycle Theories, League of Nations.','FRISCH, R. (1933): "Propagation Problems and Impulse Problems", Essays in Honour of G. Cassel.','WOOLDRIDGE, J. (2010): Econometric Analysis of Cross Section and Panel Data, MIT.','INE: Metodología del IPC (base 2021).','EUROSTAT: HICP methodology.','GOLDBERGER, A. (1991): A Course in Econometrics, Harvard UP.']} />
            </div>
        );
        const Tema3Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 3: Models, variables, números índex</p><p className="text-center text-sm text-purple-600 mt-1">I_L, I_P, I_F — Laspeyres, Paasche, Fisher</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Models</h4><ul className="list-disc pl-5 space-y-1"><li>Simplificació de la realitat (Samuelson, Robinson).</li><li>Verbals, gràfics, matemàtics.</li><li>Ceteris paribus.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Variables</h4><ul className="list-disc pl-5 space-y-1"><li>Endògenes/exògenes/instrumentals.</li><li>Stock vs. flux.</li><li>Nominals vs. reals.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Números índex</h4><ul className="list-disc pl-5 space-y-1"><li>Laspeyres (1871): pesos base.</li><li>Paasche (1874): pesos actuals.</li><li>Fisher (1922): mitjana geomètrica.</li><li>IPC (Laspeyres encadenat), deflactor PIB (Paasche).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Economètria</h4><ul className="list-disc pl-5 space-y-1"><li>Frisch-Tinbergen (Nobel 1969).</li><li>OLS, ARIMA, panell.</li></ul></div></div><FormulaBox formula={"I_L = Σ(p₁q₀)/Σ(p₀q₀)·100 | I_P = Σ(p₁q₁)/Σ(p₀q₁)·100 | I_F = √(I_L·I_P)"} /><ClauBox><p>- Domina les <strong>3 fórmules d'índex</strong> (Laspeyres, Paasche, Fisher).</p><p>- Distingeix <strong>IPC (Laspeyres)</strong> del <strong>deflactor PIB (Paasche)</strong>.</p><p>- Cita <strong>Frisch-Tinbergen (Nobel 1969)</strong> com a pares de l'economètria.</p></ClauBox></Card></div>);
        const Tema3 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="📊" title="Tema 3" subtitle={t('tema3.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema3Complet />}{vista === 'resum' && <Tema3Resum />}</div>; };

        // TEMA 4 — Pensament econòmic clàssic/marxista/neoclàssic
        const Tema4Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La història del pensament econòmic il·lumina el present: cada crisi ens fa tornar a Smith, Marx, Marshall o Keynes. Aquest tema recorre les tres grans tradicions clàssica, marxista i neoclàssica fins la revolució marginalista de 1871-74.</p></div></Card>
                <Card title="1. Precursors" icon="🏛️">
                    <TheoryBlock title="1.1. Mercantilistes (s. XVI-XVIII)" color="amber"><p>Pensament pre-científic dominant a Europa. Riquesa = or i plata. Promoció d'exportacions, restriccions a importacions. Colbert a França, Thomas Mun a Anglaterra.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Fisiòcrates (s. XVIII)" color="green"><p>França, liderats per <strong>Quesnay</strong> (1758, <em>Tableau économique</em>): primer model circular. La terra és l'única font de riquesa; la indústria és "estèril". Introdueixen <em>laissez faire</em>.</p></TheoryBlock>
                </Card>
                <Card title="2. Economia clàssica" icon="📖">
                    <TheoryBlock title="2.1. Adam Smith (1723-1790)" color="purple"><p><em>La riquesa de les nacions</em> (1776): obra fundacional. Idees clau:</p><p>• <strong>Mà invisible</strong>: el mercat coordina interessos individuals cap al bé comú.</p><p>• <strong>Divisió del treball</strong>: font de la productivitat (fàbrica d'agulles).</p><p>• <strong>Teoria del valor-treball</strong>: el valor d'un bé depèn del treball que conté.</p><p>• <strong>Llibertat econòmica</strong> i paper limitat de l'Estat (justícia, defensa, béns públics).</p></TheoryBlock>
                    <TheoryBlock title="2.2. David Ricardo (1772-1823)" color="indigo"><p><em>On the Principles of Political Economy and Taxation</em> (1817):</p><p>• <strong>Avantatge comparatiu</strong>: base del comerç internacional modern.</p><p>• <strong>Renda de la terra</strong>: teoria de la renda diferencial.</p><p>• <strong>Llei ferriada dels salaris</strong>: salaris tendeixen a subsistència.</p></TheoryBlock>
                    <TheoryBlock title="2.3. Altres clàssics" color="blue"><p><strong>Malthus (1798)</strong>: <em>Assaig sobre la població</em>. Creixement geomètric vs. aritmètic → crisis de subsistència.</p><p><strong>Say (1803)</strong>: <em>Llei de Say</em>: l'oferta crea la seua pròpia demanda (sense sobreproducció duradora).</p><p><strong>J.S. Mill (1848)</strong>: <em>Principles of Political Economy</em>. Síntesi clàssica. Defensa reformes socials.</p></TheoryBlock>
                </Card>
                <Card title="3. Economia marxista" icon="🔴">
                    <TheoryBlock title="3.1. Karl Marx (1818-1883)" color="red"><p><em>El Capital</em> (vol. I 1867; II i III pòstums). Obra monumental que combina filosofia, història i economia:</p><p>• <strong>Materialisme històric</strong>: la base econòmica determina la superestructura política/ideològica.</p><p>• <strong>Valor-treball</strong>: el valor de les mercaderies = temps de treball socialment necessari.</p><p>• <strong>Plusvàlua</strong>: el treballador produeix més del que cobra; el capitalista s'apropia de la diferència.</p><p>• <strong>Crisis periòdiques</strong>: sobreproducció, caiguda tendencial de la taxa de benefici.</p><p>• <strong>Transició al socialisme</strong>: contradiccions internes del capitalisme portarien al seu final.</p></TheoryBlock>
                    <TheoryBlock title="3.2. Successors" color="rose"><p><strong>Engels</strong> (col·laborador Marx), <strong>Rosa Luxemburg</strong> (imperialisme), <strong>Lenin</strong> (<em>L'imperialisme, fase superior del capitalisme</em> 1916), <strong>Sraffa</strong> (1960, crítica neo-ricardiana).</p></TheoryBlock>
                </Card>
                <Card title="4. Revolució marginalista i neoclàssics" icon="⚖️">
                    <TheoryBlock title="4.1. 1871-74: tres pares simultanis" color="emerald"><p>La <strong>revolució marginalista</strong> capgira la teoria del valor (no ja el treball, sinó la utilitat marginal):</p><p>• <strong>William Stanley Jevons</strong> (UK, 1871, <em>Theory of Political Economy</em>).</p><p>• <strong>Carl Menger</strong> (Àustria, 1871, <em>Grundsätze</em>): escola austríaca.</p><p>• <strong>Léon Walras</strong> (Suïssa, 1874, <em>Éléments d'économie politique pure</em>): equilibri general.</p></TheoryBlock>
                    <TheoryBlock title="4.2. Alfred Marshall (1842-1924)" color="cyan"><p><em>Principles of Economics</em> (1890). Síntesi neoclàssica. Introdueix:</p><p>• <strong>Creu oferta-demanda</strong> (les "tisores de Marshall").</p><p>• <strong>Equilibri parcial</strong>.</p><p>• <strong>Elasticitat</strong>.</p><p>• <strong>Excedent del consumidor</strong>.</p><p>• <strong>Curt i llarg termini</strong>.</p></TheoryBlock>
                    <TheoryBlock title="4.3. Vilfredo Pareto (1848-1923)" color="violet"><p>Italià. <em>Manuale di Economia Politica</em> (1906). Aportacions:</p><p>• <strong>Òptim de Pareto</strong>: no es pot millorar ningú sense empitjorar un altre.</p><p>• <strong>Distribució de Pareto</strong>: 80/20.</p><p>• Fonamenta l'economia del benestar moderna.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La tríada <strong>clàssics → Marx → neoclàssics</strong> estructura la primera etapa del pensament econòmic modern. Smith, Ricardo i J.S. Mill van crear la Economia Política clàssica. Marx va formular una crítica radical. La revolució marginalista (<strong>Jevons-Menger-Walras 1871-74</strong>) i Marshall (1890) van fundar la Economia neoclàssica que encara domina. El Tema 5 seguirà amb institucionalisme, Keynes i tendències actuals.</p></div></Card>
                <BibliografiaBox items={['SMITH, A. (1776): The Wealth of Nations.','RICARDO, D. (1817): Principles of Political Economy and Taxation.','MALTHUS, T.R. (1798): An Essay on the Principle of Population.','MILL, J.S. (1848): Principles of Political Economy.','MARX, K. (1867): Das Kapital, vol. I.','JEVONS, W.S. (1871): The Theory of Political Economy.','MENGER, C. (1871): Grundsätze der Volkswirtschaftslehre.','WALRAS, L. (1874): Éléments d\'économie politique pure.','MARSHALL, A. (1890): Principles of Economics, Macmillan.','PARETO, V. (1906): Manuale di Economia Politica.','SCHUMPETER, J. (1954): History of Economic Analysis (pòstum).','BLAUG, M. (1985): Economic Theory in Retrospect, Cambridge UP.']} />
            </div>
        );
        const Tema4Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 4: Clàssics, Marx, Neoclàssics</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Precursors</h4><ul className="list-disc pl-5 space-y-1"><li>Mercantilistes (or=riquesa).</li><li>Fisiòcrates: Quesnay 1758 (Tableau).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Clàssics</h4><ul className="list-disc pl-5 space-y-1"><li>Smith 1776: mà invisible, divisió treball, valor-treball.</li><li>Ricardo 1817: avantatge comparatiu, renda.</li><li>Malthus 1798 (població), Say 1803 (llei), Mill 1848.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Marx</h4><ul className="list-disc pl-5 space-y-1"><li>El Capital 1867.</li><li>Valor-treball, plusvàlua, crisis.</li><li>Successors: Engels, Luxemburg, Lenin, Sraffa.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Marginalistes/Neoclàssics</h4><ul className="list-disc pl-5 space-y-1"><li>Jevons-Menger-Walras 1871-74: utilitat marginal.</li><li>Marshall 1890: síntesi neoclàssica, creu O/D.</li><li>Pareto 1906: òptim, 80/20.</li></ul></div></div><ClauBox><p>- Domina les <strong>dates i obres fundacionals</strong>.</p><p>- La <strong>revolució marginalista (1871-74)</strong> és una fita crucial.</p><p>- Marx no és oposat als neoclàssics per casualitat: ambdós són respostes a Ricardo.</p></ClauBox></Card></div>);
        const Tema4 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="🏛️" title="Tema 4" subtitle={t('tema4.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema4Complet />}{vista === 'resum' && <Tema4Resum />}</div>; };

        // TEMA 5 — Institucionalisme, Keynes, Monetarisme, Tendències actuals
        const Tema5Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Després del 1900, el pensament econòmic es diversifica. L'<strong>institucionalisme</strong> critica l'abstracció neoclàssica, <strong>Keynes</strong> (1936) revoluciona la macroeconomia, el <strong>monetarisme</strong> de Friedman respon als anys 70, i neixen l'economia conductual, experimental, ecològica i feminista.</p></div></Card>
                <Card title="1. L'institucionalisme" icon="🏛️">
                    <TheoryBlock title="1.1. Vell institucionalisme" color="purple"><p><strong>Thorstein Veblen</strong> (1857-1929): <em>The Theory of the Leisure Class</em> (1899). Crítica al consum ostentós, ironia sobre l'economia ortodoxa. <strong>Consum conspicu</strong> (Veblen goods).</p><p><strong>John R. Commons</strong>: focus en transaccions i dret. <strong>Wesley Mitchell</strong>: cicles econòmics (NBER).</p></TheoryBlock>
                    <TheoryBlock title="1.2. Nova Economia Institucional (NEI)" color="indigo"><p>Des de 1970s. Reconcilia neoclàssics i institucions:</p><p>• <strong>Ronald Coase</strong> (1937 <em>The Nature of the Firm</em>, 1960 <em>Problem of Social Cost</em>). Nobel 1991. Costos de transacció.</p><p>• <strong>Douglass North</strong> (Nobel 1993): institucions com a regles del joc. <em>Institutions, Institutional Change and Economic Performance</em> (1990).</p><p>• <strong>Oliver Williamson</strong> (Nobel 2009): governança d'empreses.</p><p>• <strong>Elinor Ostrom</strong> (Nobel 2009): béns comunals.</p><p>• <strong>Acemoglu-Robinson</strong> (2012, <em>Why Nations Fail</em>; Nobel 2024 amb Johnson): institucions inclusives vs. extractives.</p></TheoryBlock>
                </Card>
                <Card title="2. Keynes i la revolució keynesiana" icon="🌊">
                    <TheoryBlock title="2.1. Context — la Gran Depressió" color="red"><p>Crash de 1929 i atur massiu (25 % EUA). Els neoclàssics prediuen ajust automàtic via flexibilitat salarial. La realitat desmenteix-ho. Cal una nova teoria.</p></TheoryBlock>
                    <TheoryBlock title="2.2. John Maynard Keynes (1883-1946)" color="emerald"><p><em>The General Theory of Employment, Interest and Money</em> (1936). Idees clau:</p><p>• L'economia pot quedar atrapada en <strong>equilibri amb atur</strong>.</p><p>• La <strong>demanda agregada</strong> és el motor (no l'oferta, contra Say).</p><p>• <strong>Animal spirits</strong>: les expectatives i la incertesa radical mouen la inversió.</p><p>• <strong>Multiplicador</strong>: un augment de despesa pública genera un augment més gran de la renda.</p><p>• <strong>Política fiscal expansiva</strong> contra la recessió.</p><p>Impacte immediat: el <em>New Deal</em> de Roosevelt, reconstrucció europea, Estat del benestar.</p></TheoryBlock>
                    <TheoryBlock title="2.3. Síntesi neoclàssica-keynesiana" color="blue"><p><strong>Hicks (1937)</strong>: model <strong>IS-LM</strong>, formalització gràfica. Samuelson, Modigliani, Tobin. Dominant 1945-1970.</p></TheoryBlock>
                </Card>
                <Card title="3. El monetarisme" icon="💵">
                    <TheoryBlock title="Milton Friedman (1912-2006)" color="amber"><p>Nobel 1976. Líder de l'Escola de Chicago. Obres clau: <em>Studies in the Quantity Theory of Money</em> (1956), <em>A Monetary History of the United States</em> (amb A. Schwartz, 1963), <em>Capitalism and Freedom</em> (1962).</p><p>Tesis principals:</p><p>• "<strong>La inflació és sempre i a tot arreu un fenomen monetari</strong>."</p><p>• <strong>Regla monetària</strong>: la base monetària ha de créixer a un ritme estable (k %).</p><p>• La política fiscal activista és ineficaç (<em>crowding out</em>).</p><p>• Defensa del mercat lliure, escola, privatitzacions.</p><p>Renaixement anys 80: Thatcher, Reagan.</p></TheoryBlock>
                </Card>
                <Card title="4. Escoles posteriors" icon="📚">
                    <TheoryBlock title="4.1. Nova escola clàssica" color="violet"><p><strong>Robert Lucas</strong> (Nobel 1995): <strong>expectatives racionals</strong>. Els agents prediuen correctament, la política sistemàtica és ineficaç. <strong>Crítica de Lucas</strong> als models macroeconòmics convencionals. <strong>Kydland-Prescott</strong> (Nobel 2004): Real Business Cycles (RBC).</p></TheoryBlock>
                    <TheoryBlock title="4.2. Nova economia keynesiana" color="cyan"><p><strong>Mankiw, Romer, Stiglitz, Akerlof, Yellen, Blanchard</strong>. Rigidesa nominal, informació imperfecta, competència monopolística. Models <strong>DSGE</strong> actuals. <strong>Stiglitz</strong> (Nobel 2001), <strong>Akerlof</strong> (Nobel 2001), <strong>Krugman</strong> (Nobel 2008).</p></TheoryBlock>
                    <TheoryBlock title="4.3. Economia conductual" color="rose"><p><strong>Kahneman-Tversky</strong> (Kahneman Nobel 2002). <em>Prospect Theory</em> (1979). Biaixos cognitius: aversió a la pèrdua, ancoratge, efecte marc. <strong>Thaler</strong> (Nobel 2017): <em>Nudge</em> (2008), arquitectura d'elecció.</p></TheoryBlock>
                    <TheoryBlock title="4.4. Economia experimental i RCT" color="green"><p><strong>Vernon Smith</strong> (Nobel 2002): laboratoris. <strong>Banerjee-Duflo-Kremer</strong> (Nobel 2019): RCT en desenvolupament. <strong>Card-Angrist-Imbens</strong> (Nobel 2021): experiments naturals.</p></TheoryBlock>
                    <TheoryBlock title="4.5. Altres tendències" color="teal"><p><strong>Economia ecològica</strong>: Georgescu-Roegen, Daly. Planetary boundaries (Rockström 2009). <strong>Donut Economics</strong> (Raworth 2017).</p><p><strong>Economia feminista</strong>: Folbre, Nelson. Treball reproductiu, cura.</p><p><strong>Decreixement</strong> (Latouche): crítica al creixement com a objectiu.</p><p><strong>MMT</strong> (Modern Monetary Theory): Wray, Kelton. Governs sobirans amb moneda pròpia.</p><p><strong>Piketty (2013, 2020)</strong>: desigualtat, <em>r &gt; g</em>.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>De <strong>Veblen (1899)</strong> a <strong>Acemoglu-Robinson (2024)</strong>, de <strong>Keynes (1936)</strong> a <strong>Friedman (1956)</strong>, de la <strong>síntesi neoclàssica</strong> als <strong>DSGE moderns</strong>, el pensament econòmic contemporani és ric i plural. Les darreres dècades han vist l'emergència de l'economia conductual, experimental i ecològica. El docent ha de transmetre aquesta pluralitat.</p></div></Card>
                <BibliografiaBox items={['VEBLEN, T. (1899): The Theory of the Leisure Class.','KEYNES, J.M. (1936): The General Theory of Employment, Interest and Money.','HICKS, J. (1937): "Mr. Keynes and the Classics", Econometrica.','FRIEDMAN, M. (1956): Studies in the Quantity Theory of Money.','FRIEDMAN, M. i SCHWARTZ, A. (1963): A Monetary History of the United States.','LUCAS, R. (1976): "Econometric Policy Evaluation: A Critique".','COASE, R. (1937): "The Nature of the Firm", Economica.','NORTH, D. (1990): Institutions, Institutional Change and Economic Performance, CUP.','KAHNEMAN, D. i TVERSKY, A. (1979): "Prospect Theory", Econometrica.','THALER, R. i SUNSTEIN, C. (2008): Nudge, Yale UP.','ACEMOGLU, D. i ROBINSON, J. (2012): Why Nations Fail, Crown.','PIKETTY, T. (2013): Le Capital au XXIe siècle.','RAWORTH, K. (2017): Doughnut Economics.']} />
            </div>
        );
        const Tema5Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 5: Institucionalisme, Keynes, actuals</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Institucionalisme</h4><ul className="list-disc pl-5 space-y-1"><li>Vell: Veblen 1899, Commons, Mitchell.</li><li>NEI: Coase 1937/1960, North 1990, Ostrom, Williamson.</li><li>Acemoglu-Robinson-Johnson Nobel 2024.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Keynes</h4><ul className="list-disc pl-5 space-y-1"><li>General Theory 1936.</li><li>Demanda agregada, multiplicador, animal spirits.</li><li>IS-LM (Hicks 1937).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Monetarisme</h4><ul className="list-disc pl-5 space-y-1"><li>Friedman Nobel 1976.</li><li>Regla monetària, crítica a Keynes.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Actuals</h4><ul className="list-disc pl-5 space-y-1"><li>Nova clàssica (Lucas), nova keynesiana (Stiglitz, Krugman), DSGE.</li><li>Conductual (Kahneman 2002, Thaler 2017).</li><li>Experimental (V. Smith 2002), RCT (Duflo 2019).</li><li>Ecològica, feminista, MMT, Piketty.</li></ul></div></div><ClauBox><p>- <strong>Keynes 1936</strong> és la fita central del segle XX.</p><p>- Domina els <strong>premis Nobel</strong>: Friedman 1976, Kahneman 2002, Duflo 2019, Card-Angrist-Imbens 2021, Acemoglu-Robinson-Johnson 2024.</p></ClauBox></Card></div>);
        const Tema5 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="💭" title="Tema 5" subtitle={t('tema5.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema5Complet />}{vista === 'resum' && <Tema5Resum />}</div>; };

        // TEMA 6 — Necessitats i béns econòmics
        const Tema6Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La <strong>necessitat humana</strong> és l'origen de tota activitat econòmica. Les necessitats motiven la producció i el consum de <strong>béns econòmics</strong>. Aquest tema explora la naturalesa, classificació i context social de les necessitats i tipifica els béns.</p></div></Card>
                <Card title="1. Concepte de necessitat" icon="🧗">
                    <TheoryBlock title="1.1. Definició" color="purple"><p>Una <strong>necessitat</strong> és la sensació de mancança unida al desig de satisfer-la. Té un component fisiològic (fam, son) i un de cultural/social (estatus, pertinença).</p></TheoryBlock>
                    <TheoryBlock title="1.2. Característiques" color="indigo"><p><strong>• Il·limitades</strong>: sempre sorgeixen noves necessitats.</p><p><strong>• Jerarquitzables</strong>: algunes són més urgents que altres.</p><p><strong>• Recurrents</strong>: tornen periòdicament.</p><p><strong>• Complementàries o substitutives</strong>.</p><p><strong>• Contextuals</strong>: varien segons cultura, època, grup.</p><p><strong>• Saturables</strong> individualment: una segona hamburguesa satisfà menys que la primera (utilitat marginal decreixent).</p></TheoryBlock>
                </Card>
                <Card title="2. Classificació de necessitats" icon="📋">
                    <TheoryBlock title="2.1. Piràmide de Maslow (1943)" color="violet"><p><strong>Abraham Maslow</strong>, psicòleg humanista, va proposar 5 nivells jeràrquics:</p><p>1. <strong>Fisiològiques</strong>: menjar, beure, dormir, reproducció.</p><p>2. <strong>Seguretat</strong>: estabilitat, salut, treball.</p><p>3. <strong>Socials/Pertinença</strong>: família, amistat, grup.</p><p>4. <strong>Estima</strong>: reconeixement, estatus.</p><p>5. <strong>Autorealització</strong>: desenvolupament personal ple.</p><p>Crítiques: no universalisme, ordre no rígid, no empíricament robusta. Però molt usada pel seu valor explicatiu i didàctic.</p></TheoryBlock>
                    <TheoryBlock title="2.2. Altres enfocaments" color="emerald"><p><strong>Max-Neef (1986)</strong>: 9 necessitats fonamentals universals (subsistència, protecció, afecte, comprensió, participació, oci, creació, identitat, llibertat) × 4 categories existencials (ésser, tenir, fer, estar).</p><p><strong>Amartya Sen</strong> (1985, <em>Capabilities Approach</em>, Nobel 1998): no necessitats sinó <em>capabilities</em> (capacitats reals). Desenvolupat per <strong>Martha Nussbaum</strong>. Base de l'IDH.</p><p><strong>Manfred Max-Neef</strong>: satisfactors (com) ≠ necessitats (què).</p></TheoryBlock>
                    <TheoryBlock title="2.3. Galbraith i les necessitats creades" color="rose"><p><strong>John K. Galbraith</strong>, <em>The Affluent Society</em> (1958): en les economies riques, moltes necessitats són induïdes per la publicitat i el sistema productiu. Efecte dependència (<em>dependence effect</em>). Crítica al consumisme.</p></TheoryBlock>
                </Card>
                <Card title="3. Els béns econòmics" icon="🎁">
                    <TheoryBlock title="3.1. Definició i tipus" color="amber"><p>Un <strong>bé</strong> és qualsevol element (tangible o no) que satisfà una necessitat. Un <strong>bé econòmic</strong> és escàs i requereix esforç per obtenir-lo (distingit del <strong>bé lliure</strong>, com l'aire).</p></TheoryBlock>
                    <TheoryBlock title="3.2. Classificacions" color="blue"><p><strong>Segons materialitat</strong>: béns (tangibles) vs. serveis (intangibles).</p><p><strong>Segons funció</strong>: consum (satisfan directament) vs. capital/inversió (produeixen altres béns).</p><p><strong>Segons durada</strong>: duradors (cotxes) vs. no duradors (aliments).</p><p><strong>Segons elasticitat-renda</strong>: normals (+), inferiors (−, p.ex. pa), de luxe (elasticitat &gt; 1).</p><p><strong>Segons relació</strong>: substitutius (te/cafè), complementaris (cotxe/benzina), independents.</p><p><strong>Segons accessibilitat</strong>:</p><p>  — <strong>Privats</strong>: rivals + exclusius.</p><p>  — <strong>Públics purs</strong>: no rivals + no exclusius (defensa, fars).</p><p>  — <strong>Comunals</strong>: rivals + no exclusius (bancs de peixos, pastures). Ostrom.</p><p>  — <strong>Club</strong>: no rivals + exclusius (Netflix, autopista peatge).</p></TheoryBlock>
                </Card>
                <Card title="4. La paradoxa del valor" icon="💎">
                    <TheoryBlock title="De Smith a Jevons-Menger" color="violet"><p>Smith (1776) plantejà la paradoxa: l'<strong>aigua</strong> (vital) val poc; els <strong>diamants</strong> (frívols) valen molt. Smith no la resolgué. Els clàssics explicaven pel valor-treball.</p><p>Resolta per la <strong>revolució marginalista</strong> (Jevons-Menger-Walras 1871-74): el valor depèn de la <strong>utilitat marginal</strong>, no la total. L'aigua és abundant → utilitat marginal baixa. Els diamants escasos → utilitat marginal alta. El preu reflecteix la <em>utilitat de la unitat marginal</em>.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Les necessitats són l'origen de l'activitat econòmica. <strong>Maslow (1943)</strong>, <strong>Sen capabilities</strong>, <strong>Galbraith</strong> (necessitats creades) ofereixen lents complementàries. Els béns es classifiquen per múltiples criteris i la <strong>paradoxa del valor</strong>, resolta pels marginalistes (1871-74), mostra la importància de la utilitat marginal. Aquest marc conceptual és la base per als temes següents de factors productius (T7) i sistemes econòmics (T8).</p></div></Card>
                <BibliografiaBox items={['MASLOW, A. (1943): "A Theory of Human Motivation", Psychological Review.','MAX-NEEF, M. (1986): Desarrollo a escala humana, CEPAUR.','SEN, A. (1985): Commodities and Capabilities, Oxford UP.','NUSSBAUM, M. (2000): Women and Human Development, CUP.','GALBRAITH, J.K. (1958): The Affluent Society, Houghton Mifflin.','SMITH, A. (1776): The Wealth of Nations, llibre I, cap. 4.','JEVONS, W.S. (1871): Theory of Political Economy.','MENGER, C. (1871): Grundsätze der Volkswirtschaftslehre.','SAMUELSON, P. (1954): "The Pure Theory of Public Expenditure", REStat.','OSTROM, E. (1990): Governing the Commons, CUP.']} />
            </div>
        );
        const Tema6Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 6: Necessitats i béns econòmics</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Necessitats</h4><ul className="list-disc pl-5 space-y-1"><li>Il·limitades, jerarquitzables, recurrents, saturables.</li><li>Maslow 1943 (5 nivells).</li><li>Sen capabilities, Max-Neef 9+4.</li><li>Galbraith 1958: necessitats creades.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. Béns</h4><ul className="list-disc pl-5 space-y-1"><li>Econòmics vs. lliures.</li><li>Consum/capital, duradors/no.</li><li>Normals/inferiors/luxe.</li><li>Privats/públics/comunals/club (rivalitat + excloibilitat).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Paradoxa del valor</h4><ul className="list-disc pl-5 space-y-1"><li>Plantejada per Smith 1776.</li><li>Resolta pels marginalistes 1871-74: utilitat marginal.</li></ul></div></div><ClauBox><p>- <strong>Maslow (1943)</strong> és bàsic però cita també <strong>Sen capabilities (Nobel 1998)</strong>.</p><p>- Domina la <strong>matriu 2×2 de béns</strong> (rivalitat + excloibilitat).</p><p>- Paradoxa del valor: <strong>Smith vs. marginalistes</strong>.</p></ClauBox></Card></div>);
        const Tema6 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="🧗" title="Tema 6" subtitle={t('tema6.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema6Complet />}{vista === 'resum' && <Tema6Resum />}</div>; };

        // TEMA 7 — Factors productius, FPP, cost oportunitat
        const Tema7Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Per satisfer necessitats cal produir. La producció usa <strong>factors productius</strong>. La <strong>Frontera de Possibilitats de Producció (FPP)</strong> és el model gràfic fonamental per analitzar les alternatives productives i el <strong>cost d'oportunitat</strong>. El progrés tècnic i l'acumulació de capital desplacen la frontera.</p></div></Card>
                <Card title="1. Factors productius" icon="🏭">
                    <TheoryBlock title="1.1. Classificació clàssica" color="purple"><p><strong>Terra</strong> (T): recursos naturals. Retribució: renda. Fisiòcrates la consideraven l'única font de riquesa.</p><p><strong>Treball</strong> (L): aportació humana. Retribució: salari.</p><p><strong>Capital</strong> (K): béns produïts que serveixen per produir més. Físic (maquinària, infraestructures) vs. financer (diners). Retribució: interès.</p><p><strong>Iniciativa empresarial</strong>: organització, assumpció de riscos. Retribució: benefici. <strong>Schumpeter (1911)</strong>: empresari innovador.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Capital humà (Becker 1964)" color="emerald"><p><strong>Gary Becker</strong> (Nobel 1992). Educació, salut, experiència → productivitat. Inversió en persones. Explica diferències salarials, creixement a LP. Theodore Schultz (Nobel 1979).</p></TheoryBlock>
                    <TheoryBlock title="1.3. Capital social i institucional" color="cyan"><p>Xarxes de confiança (Putnam), institucions (North, Acemoglu). Determinants del desenvolupament.</p></TheoryBlock>
                </Card>
                <Card title="2. La Frontera de Possibilitats de Producció (FPP)" icon="📈">
                    <TheoryBlock title="2.1. Concepte" color="indigo"><p>La <strong>FPP</strong> representa totes les combinacions màximes de dos béns que una economia pot produir donats uns recursos i una tecnologia, amb <strong>plena ocupació</strong> i <strong>eficiència</strong>.</p></TheoryBlock>
                    <TheoryBlock title="2.2. Supòsits" color="violet"><p>• Només dos béns (simplificació).</p><p>• Recursos fixos en quantitat.</p><p>• Tecnologia donada.</p><p>• Plena utilització eficient.</p></TheoryBlock>
                    <TheoryBlock title="2.3. Forma còncava" color="amber"><p>La FPP és <strong>còncava respecte a l'origen</strong>. Per què? Perquè els factors no són perfectament adaptables a ambdós béns. Produir més d'un bé exigeix usar factors cada vegada menys adequats → <strong>llei de costos d'oportunitat creixents</strong>.</p><p>Cas especial: si els factors són perfectament substituibles, la FPP seria una línia recta (costos constants).</p></TheoryBlock>
                    <TheoryBlock title="2.4. Punts i interpretació" color="green"><p><strong>Sobre la FPP</strong>: punts eficients.</p><p><strong>Dins</strong>: ineficients (desocupació, subutilització).</p><p><strong>Fora</strong>: inassolibles amb recursos i tecnologia actuals.</p></TheoryBlock>
                </Card>
                <Card title="3. Cost d'oportunitat" icon="⚖️">
                    <TheoryBlock title="Concepte fonamental" color="rose"><p>El <strong>cost d'oportunitat</strong> d'una decisió és el valor de la millor alternativa a la qual es renuncia. És una idea central en Economia.</p><p>Exemples:</p><p>• Cost d'estudiar un màster = sou que deixes de cobrar treballant.</p><p>• Cost d'una hora de Netflix = una hora de gimnàs.</p><p>• Cost d'una carretera = els hospitals que no s'han construït.</p><p>A la FPP, el <strong>pendent</strong> en un punt dona el cost d'oportunitat de passar de produir un bé a l'altre.</p></TheoryBlock>
                </Card>
                <Card title="4. Progrés tècnic i acumulació de capital" icon="🚀">
                    <TheoryBlock title="4.1. Desplaçaments de la FPP" color="blue"><p>La FPP es desplaça cap a fora quan:</p><p>• <strong>Augmenta els recursos</strong>: més treballadors, nous jaciments.</p><p>• <strong>Millora el capital humà</strong>: educació.</p><p>• <strong>Progrés tècnic</strong>: innovacions, I+D.</p><p>• <strong>Acumulació de capital físic</strong>: més maquinària.</p><p>Pot desplaçar-se cap a dins: desastres naturals, guerres, pandèmies.</p></TheoryBlock>
                    <TheoryBlock title="4.2. Solow i el residual" color="emerald"><p><strong>Robert Solow</strong> (Nobel 1987, 1957): descomposició del creixement. El <em>residual de Solow</em> (Total Factor Productivity, TFP) mesura el progrés tècnic. Explica la major part del creixement a llarg termini als països desenvolupats.</p></TheoryBlock>
                    <TheoryBlock title="4.3. Creixement endogen (Romer 1986)" color="indigo"><p><strong>Paul Romer</strong> (Nobel 2018): endogeneïtza el progrés tècnic. La innovació sorgeix d'I+D, externalitats, capital humà. Política pública importa (finançament R+D, educació).</p></TheoryBlock>
                </Card>
                <Card title="5. Dilema consum-inversió" icon="💱">
                    <TheoryBlock title="Trade-off temporal" color="amber"><p>Una societat pot usar els seus recursos per a <strong>consum present</strong> (gaudi immediat) o <strong>inversió</strong> (consum futur via més FPP demà). La taxa d'estalvi determina el ritme de creixement (model Solow, regla d'or).</p><p>Àsia oriental (Corea, Xina): alta taxa d'estalvi i creixement accelerat.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Els <strong>factors productius</strong> (T, L, K, Empresa, H) generen béns i serveis. La <strong>FPP</strong> sintetitza les alternatives de producció, il·lustra el <strong>cost d'oportunitat</strong> i permet visualitzar el progrés econòmic com a desplaçament cap a l'exterior. <strong>Solow (1957)</strong> i <strong>Romer (1986)</strong> han explicat com el progrés tècnic és el motor fonamental del creixement a llarg termini.</p></div></Card>
                <BibliografiaBox items={['SMITH, A. (1776): Wealth of Nations, llibre II (capital).','RICARDO, D. (1817): cap. II sobre renda.','SCHUMPETER, J. (1911): Theorie der wirtschaftlichen Entwicklung.','BECKER, G. (1964): Human Capital, CUP.','SCHULTZ, T. (1971): Investment in Human Capital, Free Press.','SOLOW, R. (1957): "Technical Change and the Aggregate Production Function", REStat.','ROMER, P. (1986): "Increasing Returns and Long-Run Growth", JPE.','LUCAS, R. (1988): "On the Mechanics of Economic Development", JME.','MANKIW, G. (2020): Macroeconomics.','BLANCHARD, O. (2017): Macroeconomics, Pearson.']} />
            </div>
        );
        const Tema7Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-purple-50 rounded-xl border border-purple-200 mb-5"><p className="text-center font-bold text-purple-800 text-lg">Tema 7: Factors productius i FPP</p><p className="text-center text-sm text-purple-600 mt-1">Cost d'oportunitat = pendent de la FPP</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Factors</h4><ul className="list-disc pl-5 space-y-1"><li>Terra, Treball, Capital, Empresa.</li><li>Retribucions: renda, salari, interès, benefici.</li><li>Capital humà (Becker 1964), social, institucional.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. FPP</h4><ul className="list-disc pl-5 space-y-1"><li>Combinacions màximes de 2 béns.</li><li>Còncava: costos oportunitat creixents.</li><li>Punts dins (ineficients), sobre (eficients), fora (inassolibles).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Cost oportunitat</h4><ul className="list-disc pl-5 space-y-1"><li>Valor de la millor alternativa rebutjada.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Progrés tècnic</h4><ul className="list-disc pl-5 space-y-1"><li>Desplaça FPP enfora.</li><li>Solow residual (Nobel 1987).</li><li>Romer endogen (Nobel 2018).</li></ul></div></div><ClauBox><p>- Dibuixa la <strong>FPP còncava</strong> i explica-la amb exemples (armes/mantega clàssic).</p><p>- Cita <strong>Solow (1957)</strong> i <strong>Romer (1986)</strong>.</p><p>- Dilema <strong>consum-inversió</strong> com a cas d'aplicació.</p></ClauBox></Card></div>);
        const Tema7 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="⚙️" title="Tema 7" subtitle={t('tema7.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema7Complet />}{vista === 'resum' && <Tema7Resum />}</div>; };

        // TEMA 8 — Problemes econòmics i sistemes
        const Tema8Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Tota societat afronta tres <strong>problemes econòmics bàsics</strong>: què, com i per a qui produir. Les respostes defineixen el <strong>sistema econòmic</strong>. Al llarg de la història hi ha hagut tres maneres principals: tradició, mercat i autoritat. Aquest tema recorre els principals sistemes econòmics i les seues combinacions actuals.</p></div></Card>
                <Card title="1. Els tres problemes econòmics" icon="❓">
                    <TheoryBlock title="Samuelson (1948)" color="purple"><p><strong>Paul Samuelson</strong> va popularitzar la formulació dels 3 problemes bàsics:</p><p><strong>1. Què produir?</strong> Quines combinacions de béns/serveis. (FPP)</p><p><strong>2. Com produir-ho?</strong> Amb quina tecnologia i combinació de factors.</p><p><strong>3. Per a qui produir?</strong> Distribució entre individus i grups.</p><p>Cada societat respon aquestes preguntes, explícitament o implícita.</p></TheoryBlock>
                </Card>
                <Card title="2. Formes de decisió" icon="🤔">
                    <TheoryBlock title="2.1. Tradició" color="amber"><p>Les decisions es prenen com s'han pres sempre. Rols hereditaris, oficis de pare a fill. Típic de societats preindustrials, agrícoles, tribals. Estable però poc adaptable al canvi. Exemples residuals: comunitats tradicionals, artesania.</p></TheoryBlock>
                    <TheoryBlock title="2.2. Mercat" color="emerald"><p>Les decisions resulten de la interacció lliure entre compradors i venedors. Preus coordinen l'oferta i la demanda (<strong>Smith, mà invisible</strong>). Descentralitzat, flexible, innovador. Problemes: desigualtat, externalitats, béns públics.</p></TheoryBlock>
                    <TheoryBlock title="2.3. Autoritat" color="red"><p>Un planificador central decideix què, com i per a qui. Típic d'economies socialistes (URSS, Cuba abans, Corea N). Centralitzat, pot perseguir objectius socials. Problemes: informació (Hayek, 1945), incentius, innovació.</p></TheoryBlock>
                </Card>
                <Card title="3. Sistemes econòmics principals" icon="🌍">
                    <TheoryBlock title="3.1. Capitalisme / Economia de mercat" color="blue"><p>Propietat privada dels mitjans de producció. Mercats coordinen l'assignació. Ànim de lucre. Variants:</p><p>• <strong>Anglosaxó</strong> (EUA, UK): menys regulació.</p><p>• <strong>Renà</strong> (Alemanya, Japó): stakeholder, coordinació social.</p><p>• <strong>Nòrdic</strong>: fort Estat del benestar + economia oberta.</p><p>• <strong>Mediterrani</strong> (Espanya, Itàlia): intermedi.</p></TheoryBlock>
                    <TheoryBlock title="3.2. Socialisme / Economia planificada" color="rose"><p>Propietat col·lectiva o estatal. Planificació central. Experiment històric: URSS (1917-1991), RDA, Cuba, Xina pre-1978, Corea N.</p><p>Resultats: industrialització forçada, però estagnació i col·lapse (1989-91).</p></TheoryBlock>
                    <TheoryBlock title="3.3. Economies mixtes" color="violet"><p>Combinen mercat i Estat. Predominen actualment a Occident. <strong>Samuelson, Tinbergen</strong>: convergència.</p><p>Variants:</p><p>• Estat del benestar (nòrdic).</p><p>• Capitalisme regulat (europeu continental).</p><p>• Socialisme de mercat (Xina des 1978).</p></TheoryBlock>
                    <TheoryBlock title="3.4. Xina: socialisme de mercat" color="amber"><p>Reformes de <strong>Deng Xiaoping (1978)</strong>: "un país, dos sistemes". Propietat pública majoritària + sector privat creixent. Creixement del 8-10 % durant 30 anys. Transformació històrica.</p></TheoryBlock>
                </Card>
                <Card title="4. Debat sobre sistemes" icon="⚖️">
                    <TheoryBlock title="4.1. Hayek-Mises: càlcul econòmic" color="indigo"><p><strong>Ludwig von Mises</strong> (1920) i <strong>Friedrich Hayek</strong> (1945, <em>The Use of Knowledge in Society</em>): crítica al socialisme. Sense preus de mercat no es pot calcular; el planificador no té la informació dispersa. Hayek Nobel 1974.</p></TheoryBlock>
                    <TheoryBlock title="4.2. Polanyi (1944): The Great Transformation" color="cyan"><p><strong>Karl Polanyi</strong>: el mercat autoregulat és una utopia; tota economia està imbricada (<em>embedded</em>) en el social. Contramoviments: Estat del benestar.</p></TheoryBlock>
                </Card>
                <Card title="5. Sistemes a l'actualitat" icon="📊">
                    <TheoryBlock title="Tipologies contemporànies" color="green"><p><strong>Esping-Andersen (1990)</strong>: tipologia 3 mons del capitalisme: liberal, conservador, socialdemòcrata.</p><p><strong>Varieties of Capitalism</strong> (Hall-Soskice 2001): LME (Liberal Market Economies) vs. CME (Coordinated Market Economies).</p><p>Reptes actuals: populisme, crisi de legitimitat, desigualtat, emergència climàtica.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>Tota economia resol <strong>què, com i per a qui</strong> produir mitjançant una combinació de tradició, mercat i autoritat. Els sistemes purs (mercat lliure total, socialisme total) són ideal tipus; la realitat són <strong>economies mixtes</strong> amb diferents dosis. El debat entre <strong>Hayek</strong> i els planificadors es va resoldre el 1989; però el debat entre més o menys Estat continua obert i és el cor de la política democràtica.</p></div></Card>
                <BibliografiaBox items={['SAMUELSON, P. (1948): Economics.','HAYEK, F. (1945): "The Use of Knowledge in Society", AER.','VON MISES, L. (1920): Die Wirtschaftsrechnung im sozialistischen Gemeinwesen.','POLANYI, K. (1944): The Great Transformation, Beacon.','KORNAI, J. (1992): The Socialist System, Princeton UP.','ESPING-ANDERSEN, G. (1990): The Three Worlds of Welfare Capitalism, Polity.','HALL, P. i SOSKICE, D. (2001): Varieties of Capitalism, OUP.','DENG, X.: reformes de 1978 (anàlisi: NAUGHTON 2007).','ACEMOGLU, D. i ROBINSON, J. (2012): Why Nations Fail.','SEN, A. (1999): Development as Freedom, Knopf.']} />
            </div>
        );
