            {/* Epígrafe 1 */}
            <Card title="1. Economía y medio ambiente: una relación compleja" icon="📘">
                <TheoryBlock title="1.1. La economía como subsistema del ecosistema" color="purple">
                    <p>
                        La visión convencional de la economía representa el sistema económico como un flujo circular cerrado entre hogares y empresas: los hogares ofrecen factores productivos (trabajo, capital, tierra) a las empresas y reciben rentas a cambio; las empresas producen bienes y servicios que los hogares consumen. En este esquema, la <strong>naturaleza</strong> aparece, en el mejor de los casos, como un factor productivo más (la "tierra" de los clásicos), pero no como el sistema que contiene y sustenta toda la actividad económica.
                    </p>
                    <p>
                        <strong>Nicholas Georgescu-Roegen</strong> (1906-1994), considerado el padre de la <strong>bioeconomía</strong> o <strong>economía ecológica</strong>, revolucionó esta visión al aplicar las <strong>leyes de la termodinámica</strong> al análisis económico. La <strong>primera ley</strong> (conservación de la energía) establece que la energía ni se crea ni se destruye, solo se transforma. La <strong>segunda ley</strong> (entropía) establece que en todo proceso de transformación la energía se degrada irreversiblemente: pasa de formas concentradas y útiles (baja entropía: petróleo, minerales) a formas dispersas e inútiles (alta entropía: calor residual, residuos). Toda actividad económica, por tanto, <strong>transforma recursos de baja entropía en residuos de alta entropía</strong>: el crecimiento económico ilimitado en un planeta con recursos finitos y capacidad de absorción limitada es, desde la perspectiva termodinámica, una imposibilidad física.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. El modelo económico lineal" color="blue">
                    <p>
                        El modelo económico dominante desde la Revolución Industrial sigue un esquema <strong>lineal</strong>: <strong>extraer → producir → consumir → desechar</strong>. Este modelo trata los recursos naturales como insumos baratos e ilimitados y el medio ambiente como un sumidero gratuito de residuos. El resultado es un crecimiento económico que genera simultáneamente bienestar material (para una parte de la humanidad) y degradación ambiental acumulativa (para todos). La alternativa, la <strong>economía circular</strong>, propone cerrar los ciclos de materiales y energía: diseñar productos para la durabilidad, la reparabilidad, la reutilización y el reciclaje, minimizando la extracción de recursos vírgenes y la generación de residuos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Recursos naturales: clasificación" color="green">
                    <p>
                        Los recursos naturales se clasifican en tres categorías: <strong>Recursos renovables:</strong> aquellos que se regeneran a una tasa natural (bosques, pesquerías, agua dulce, energía solar, eólica). Pueden explotarse indefinidamente si la tasa de extracción no supera la tasa de regeneración. <strong>Recursos no renovables:</strong> aquellos cuya tasa de regeneración es nula o insignificante en escala humana (petróleo, gas natural, carbón, minerales metálicos). Su agotamiento es inevitable si se explotan; la cuestión es a qué ritmo. <strong>Recursos de flujo:</strong> energías que fluyen continuamente con independencia de la actividad humana (radiación solar, viento, mareas). Son inagotables pero requieren tecnología para su aprovechamiento.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. Funciones económicas del medio ambiente" color="amber">
                    <p>
                        El medio ambiente cumple tres funciones económicas fundamentales: (1) <strong>Proveedor de recursos:</strong> materias primas (minerales, madera, agua), alimentos (agricultura, pesca), energía (fósiles, renovables). (2) <strong>Receptor de residuos:</strong> absorción y procesamiento de los desechos de la actividad económica (emisiones atmosféricas, vertidos hídricos, residuos sólidos). La capacidad de absorción del medio ambiente es limitada: cuando se supera, se produce contaminación. (3) <strong>Proveedor de servicios ecosistémicos:</strong> regulación del clima, polinización, purificación del agua, recreo, paisaje, valores culturales y espirituales. Estos servicios son esenciales para la vida humana pero carecen de precio de mercado, lo que lleva a su sobreexplotación y degradación.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.5. Los bienes ambientales como bienes públicos" color="pink">
                    <p>
                        Muchos bienes ambientales presentan las características de los <strong>bienes públicos</strong>: <strong>no exclusión</strong> (no es posible o es muy costoso impedir que alguien disfrute de ellos: aire limpio, clima estable, capa de ozono) y <strong>no rivalidad</strong> (el uso por una persona no reduce la disponibilidad para otra, al menos hasta cierto umbral). Estas características generan el <strong>problema del polizón (free-rider)</strong>: los agentes económicos tienen incentivos para disfrutar del bien público sin contribuir a su provisión o conservación, confiando en que otros lo harán. El resultado es una <strong>provisión insuficiente</strong> de bienes ambientales y una <strong>degradación excesiva</strong> del medio ambiente: un fallo del mercado que justifica la intervención pública.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. Las externalidades ambientales" icon="🏭">
                <TheoryBlock title="2.1. Concepto de externalidad" color="purple">
                    <p>
                        Una <strong>externalidad</strong> se produce cuando la actividad de un agente económico (productor o consumidor) afecta al bienestar de otro agente <strong>sin que dicho efecto se refleje en el precio de mercado</strong>. El concepto fue formalizado por <strong>Arthur Cecil Pigou</strong> en <em>The Economics of Welfare</em> (1920), una obra fundacional de la economía del bienestar. Las externalidades representan un <strong>fallo del mercado</strong>: los precios no reflejan todos los costes (externalidades negativas) o todos los beneficios (externalidades positivas) de la actividad económica, lo que lleva a una asignación ineficiente de los recursos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Externalidades negativas ambientales" color="blue">
                    <p>
                        Las <strong>externalidades negativas ambientales</strong> son los costes que la actividad económica impone al medio ambiente y a la sociedad sin que se reflejen en el precio del producto. Los ejemplos más significativos incluyen: <strong>contaminación atmosférica</strong> (emisiones de CO₂, SO₂, NOₓ, partículas en suspensión) procedente de la industria, el transporte y la generación de energía, que causa problemas respiratorios, lluvia ácida y cambio climático; <strong>contaminación del agua</strong> (vertidos industriales, agrícolas y urbanos) que degrada ríos, acuíferos y mares; <strong>deforestación</strong> (destrucción de bosques para agricultura, ganadería, urbanización) que provoca pérdida de biodiversidad, erosión del suelo y liberación de CO₂; <strong>agotamiento de recursos no renovables</strong> (petróleo, minerales) cuyo coste para las generaciones futuras no se refleja en el precio actual; <strong>pérdida de biodiversidad</strong> (extinción de especies, destrucción de hábitats) con consecuencias irreversibles para los ecosistemas.
                    </p>
                    <p>
                        Cuando existe una externalidad negativa, el <strong>coste social</strong> (coste privado + coste externo) es superior al <strong>coste privado</strong> que soporta el productor. Como resultado, el mercado produce una cantidad <strong>superior al óptimo social</strong>: hay sobreproducción del bien contaminante.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Externalidades positivas ambientales" color="green">
                    <p>
                        Las <strong>externalidades positivas ambientales</strong> se producen cuando una actividad genera beneficios ambientales que no se reflejan en el precio de mercado. Ejemplos: la <strong>biodiversidad</strong> (los ecosistemas proporcionan servicios —polinización, regulación del clima, purificación del agua— cuyo valor no se refleja en los precios de mercado), la <strong>captura de carbono</strong> por los bosques (un bosque absorbe CO₂ de la atmósfera, beneficiando a toda la humanidad sin recibir compensación), la <strong>agricultura ecológica</strong> (que preserva la calidad del suelo y del agua). Cuando existe una externalidad positiva, el <strong>beneficio social</strong> es superior al <strong>beneficio privado</strong>, y el mercado produce una cantidad <strong>inferior al óptimo social</strong>: hay infraproducción del bien beneficioso.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. La tragedia de los comunes" color="amber">
                    <p>
                        <strong>Garrett Hardin</strong> publicó en 1968 su influyente artículo <em>"The Tragedy of the Commons"</em> en la revista <em>Science</em>. En él describe un escenario en el que un recurso compartido de acceso abierto (un pasto comunal, un banco de peces, la atmósfera) es sobreexplotado porque cada usuario individual tiene incentivos para maximizar su propio beneficio a corto plazo, sin internalizar el coste que impone a los demás usuarios. El resultado es la <strong>degradación o agotamiento del recurso</strong>: cada pastor añade una oveja más al pasto comunal (el beneficio es privado, el coste de la degradación se reparte entre todos), hasta que el pasto se destruye.
                    </p>
                    <p>
                        Las soluciones a la tragedia de los comunes incluyen: <strong>privatización</strong> (asignar derechos de propiedad para que el propietario internalice los costes), <strong>regulación estatal</strong> (cuotas, prohibiciones, estándares) y <strong>gestión comunitaria</strong>. <strong>Elinor Ostrom</strong> (Premio Nobel de Economía 2009) demostró que las comunidades locales pueden gestionar eficazmente los recursos comunes sin necesidad de privatización ni regulación estatal, a través de instituciones de gobernanza colectiva basadas en reglas claras, sanciones graduales y participación de los usuarios.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.5. Soluciones a las externalidades" color="pink">
                    <p>
                        <strong>Soluciones pigouvianas (Arthur Cecil Pigou):</strong> el gobierno interviene para <strong>internalizar la externalidad</strong> mediante instrumentos fiscales. Un <strong>impuesto pigouviano</strong> grava la actividad contaminante en una cantidad igual al coste marginal externo, de modo que el coste privado iguale al coste social. Ejemplo: un impuesto sobre las emisiones de CO₂ (impuesto al carbono). Una <strong>subvención pigouviana</strong> subsidia la actividad que genera externalidades positivas (subvenciones a las energías renovables, a la reforestación, a la agricultura ecológica).
                    </p>
                    <p>
                        <strong>Teorema de Coase (Ronald Coase, 1960):</strong> si los <strong>derechos de propiedad</strong> están bien definidos y los <strong>costes de transacción son suficientemente bajos</strong>, las partes afectadas por una externalidad pueden llegar a un <strong>acuerdo privado</strong> que resuelva la externalidad de forma eficiente, sin necesidad de intervención pública. El resultado será eficiente independientemente de a quién se asignen inicialmente los derechos de propiedad (aunque la distribución de la renta sí dependerá de ello). En la práctica, los costes de transacción suelen ser elevados (especialmente en problemas ambientales globales como el cambio climático, donde hay millones de afectados), por lo que el teorema de Coase tiene aplicabilidad limitada en el ámbito ambiental.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. El cambio climático como problema económico" icon="🌡️">
                <TheoryBlock title="3.1. Causas y evidencia científica" color="purple">
                    <p>
                        El <strong>cambio climático</strong> es el aumento de la temperatura media global causado por la acumulación de <strong>gases de efecto invernadero (GEI)</strong> en la atmósfera, principalmente <strong>CO₂</strong> (procedente de la quema de combustibles fósiles y la deforestación), <strong>metano (CH₄)</strong> (ganadería, vertederos, extracción de gas) y <strong>óxido nitroso (N₂O)</strong> (agricultura, industria). El <strong>Panel Intergubernamental de Expertos sobre el Cambio Climático (IPCC)</strong>, en su Sexto Informe de Evaluación (2021-2023), establece con un nivel de confianza muy alto que la influencia humana ha calentado el planeta aproximadamente 1,1°C respecto a los niveles preindustriales y que este calentamiento es "inequívocamente" causado por las actividades humanas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. El Informe Stern (2006)" color="blue">
                    <p>
                        El <strong>Informe Stern sobre la Economía del Cambio Climático</strong>, encargado por el gobierno británico al economista <strong>Nicholas Stern</strong>, fue un hito en la economía ambiental. Su conclusión principal fue contundente: <em>"el coste de no actuar contra el cambio climático será mucho mayor que el coste de actuar"</em>. Stern estimó que no actuar podría reducir el PIB mundial entre un 5% y un 20% de forma permanente, mientras que estabilizar las emisiones costaría alrededor del 1% del PIB mundial anual. El informe fue criticado por algunos economistas (como William Nordhaus) por utilizar una tasa de descuento muy baja, que daba un peso elevado al bienestar de las generaciones futuras, pero su impacto político fue enorme y contribuyó a situar el cambio climático en la agenda económica global.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. El Acuerdo de París (2015)" color="green">
                    <p>
                        El <strong>Acuerdo de París</strong>, adoptado en la COP21 (diciembre de 2015) por 196 países, es el tratado internacional más importante sobre cambio climático. Sus objetivos principales son: <strong>limitar el calentamiento global a bien por debajo de 2°C</strong> respecto a los niveles preindustriales, con esfuerzos para limitarlo a <strong>1,5°C</strong>; que cada país presente <strong>Contribuciones Determinadas a Nivel Nacional (NDC)</strong> con sus compromisos de reducción de emisiones, revisadas al alza cada cinco años; movilizar <strong>100.000 millones de dólares anuales</strong> de los países desarrollados para financiar la adaptación y mitigación en los países en desarrollo.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Mecanismos de mercado para combatir el cambio climático" color="amber">
                    <p>
                        Los dos principales instrumentos de mercado para reducir las emisiones de GEI son:
                    </p>
                    <p>
                        <strong>Comercio de derechos de emisión (cap-and-trade):</strong> el gobierno fija un tope (cap) máximo de emisiones y distribuye permisos de emisión entre las empresas (por subasta o asignación gratuita). Las empresas que emiten menos de lo permitido pueden vender sus excedentes a las que emiten más, creando un <strong>mercado de carbono</strong>. El sistema más importante del mundo es el <strong>EU ETS</strong> (European Union Emissions Trading System), que cubre unas 10.000 instalaciones industriales y de generación eléctrica en la UE. Este mecanismo combina la certidumbre ambiental (se fija la cantidad total de emisiones) con la eficiencia económica (las reducciones se realizan donde el coste es menor).
                    </p>
                    <p>
                        <strong>Impuesto al carbono (carbon tax):</strong> un impuesto que grava cada tonelada de CO₂ emitida a un precio fijo. Es un impuesto pigouviano que internaliza el coste de la externalidad climática. Sus ventajas son la simplicidad, la previsibilidad del coste para las empresas y la recaudación que genera (que puede usarse para reducir otros impuestos o financiar la transición energética). Su inconveniente principal es que no garantiza un nivel de emisiones determinado (depende de cómo respondan los agentes al precio). Países como Suecia, Canadá y varios estados de EE.UU. han implementado impuestos al carbono.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. El Pacto Verde Europeo y la justicia climática" color="pink">
                    <p>
                        El <strong>Pacto Verde Europeo</strong> (European Green Deal, 2019) es la estrategia de la Comisión Europea para convertir a la UE en el primer continente <strong>climáticamente neutro en 2050</strong>. Incluye: la Ley Europea del Clima, la revisión del EU ETS, el mecanismo de ajuste en frontera de carbono (CBAM, para evitar la "fuga de carbono"), la estrategia de biodiversidad, el plan de acción de economía circular y el Fondo de Transición Justa (para ayudar a las regiones más dependientes de los combustibles fósiles).
                    </p>
                    <p>
                        La <strong>justicia climática</strong> es un concepto fundamental: los países más pobres y vulnerables son los que menos han contribuido históricamente al cambio climático (las emisiones acumuladas proceden mayoritariamente de los países industrializados) pero son los que más sufren sus consecuencias (sequías, inundaciones, subida del nivel del mar, fenómenos meteorológicos extremos). La justicia climática exige que los países ricos asuman una mayor responsabilidad en la reducción de emisiones y en la financiación de la adaptación de los países en desarrollo.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. Instrumentos de política ambiental" icon="🏛️">
                <TheoryBlock title="4.1. Regulación directa (command and control)" color="purple">
                    <p>
                        La <strong>regulación directa</strong> o <strong>command and control</strong> consiste en la imposición de <strong>normas, prohibiciones y estándares</strong> obligatorios por parte del gobierno. Ejemplos: estándares de emisiones máximas para vehículos e industrias, prohibición de determinadas sustancias contaminantes (CFCs, amianto, plásticos de un solo uso), estándares de calidad ambiental (niveles máximos de contaminantes en el aire o el agua), normas de eficiencia energética en edificios y electrodomésticos. La regulación directa tiene la ventaja de la certidumbre (se sabe exactamente qué está prohibido o permitido), pero puede ser ineficiente (no tiene en cuenta que los costes de reducción varían entre empresas) y costosa de supervisar y hacer cumplir.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Instrumentos económicos" color="blue">
                    <p>
                        Los <strong>instrumentos económicos</strong> utilizan los incentivos del mercado para alcanzar objetivos ambientales. Además de los ya mencionados impuestos ambientales y permisos de emisión, incluyen: <strong>subvenciones a tecnologías limpias</strong> (energías renovables, vehículos eléctricos, eficiencia energética), <strong>depósitos reembolsables</strong> (el consumidor paga un depósito al comprar un envase que se devuelve al reciclarlo, incentivando la recogida selectiva) y <strong>tarifas por generación de residuos</strong> (pagar en proporción a la cantidad de residuos generados, incentivando la reducción y el reciclaje).
                    </p>
                    <p>
                        La ventaja de los instrumentos económicos es que logran el objetivo ambiental al <strong>menor coste posible</strong>: cada agente elige la forma más barata de reducir su contaminación. Su inconveniente es que el resultado ambiental puede ser incierto (depende de la respuesta de los agentes al incentivo) y que requieren un diseño cuidadoso para evitar efectos indeseados.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Principios y herramientas complementarias" color="green">
                    <p>
                        El principio <strong>"quien contamina paga"</strong> (Polluter Pays Principle, adoptado por la OCDE en 1972) establece que el contaminador debe asumir el coste de las medidas para prevenir y controlar la contaminación, en lugar de trasladarlo a la sociedad. Es el fundamento de los impuestos ambientales y de la responsabilidad por daños al medio ambiente.
                    </p>
                    <p>
                        La <strong>Evaluación de Impacto Ambiental (EIA)</strong> es un procedimiento administrativo que evalúa los efectos ambientales previsibles de un proyecto (construcción de una carretera, una fábrica, un embalse) antes de su autorización. Es obligatoria en la UE y en España para determinados proyectos. El <strong>etiquetado ecológico</strong> (ecolabel) y las <strong>certificaciones ambientales</strong> (ISO 14001, EMAS) informan a los consumidores y a las organizaciones sobre el desempeño ambiental de productos y empresas, facilitando decisiones de compra y gestión más sostenibles.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. El desarrollo sostenible" icon="♻️">
                <TheoryBlock title="5.1. El Informe Brundtland (1987)" color="purple">
                    <p>
                        El concepto de <strong>desarrollo sostenible</strong> fue popularizado por el <strong>Informe Brundtland</strong> (<em>"Nuestro futuro común"</em>), publicado en 1987 por la Comisión Mundial sobre el Medio Ambiente y el Desarrollo de las Naciones Unidas, presidida por Gro Harlem Brundtland. Su definición se ha convertido en la más citada de la literatura: <em>"El desarrollo sostenible es aquel que satisface las necesidades del presente sin comprometer la capacidad de las generaciones futuras para satisfacer sus propias necesidades"</em>. Esta definición contiene dos conceptos clave: el concepto de <strong>necesidades</strong> (en particular, las necesidades esenciales de los pobres del mundo, a las que debería otorgarse prioridad preponderante) y la idea de <strong>limitaciones</strong> impuestas por el estado de la tecnología y la organización social sobre la capacidad del medio ambiente para satisfacer las necesidades presentes y futuras.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Triple dimensión del desarrollo sostenible" color="blue">
                    <p>
                        El desarrollo sostenible se apoya en <strong>tres dimensiones interdependientes</strong> (los "tres pilares"): <strong>Dimensión económica:</strong> crecimiento que genera empleo, innovación y bienestar, con una distribución equitativa de la riqueza, sin agotar los recursos naturales ni degradar el medio ambiente. <strong>Dimensión social:</strong> equidad, inclusión, acceso universal a servicios básicos (salud, educación, vivienda, agua), reducción de la pobreza y la desigualdad, igualdad de género, participación ciudadana, respeto a los derechos humanos. <strong>Dimensión ambiental:</strong> conservación de los ecosistemas, uso racional de los recursos naturales, reducción de la contaminación, protección de la biodiversidad, lucha contra el cambio climático. La sostenibilidad exige equilibrar simultáneamente las tres dimensiones: un crecimiento económico que destruya el medio ambiente o aumente la desigualdad no es sostenible; una protección ambiental que condene a la pobreza a millones de personas tampoco lo es.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Indicadores de sostenibilidad" color="green">
                    <p>
                        Para medir el progreso hacia la sostenibilidad se han desarrollado diversos indicadores: <strong>Huella ecológica:</strong> mide la superficie de tierra y agua biológicamente productiva que necesita una persona, población o actividad para producir los recursos que consume y absorber los residuos que genera, expresada en hectáreas globales (hag). Si la huella ecológica de un país supera su biocapacidad, vive en <strong>déficit ecológico</strong> (la humanidad actualmente utiliza el equivalente a 1,7 planetas). <strong>Huella de carbono:</strong> mide las emisiones totales de GEI (en toneladas de CO₂ equivalente) asociadas a una persona, organización, producto o actividad. <strong>Huella hídrica:</strong> mide el volumen total de agua dulce utilizada directa e indirectamente para producir los bienes y servicios consumidos por una persona o país.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Agenda 2030 y los ODS" color="amber">
                    <p>
                        La <strong>Agenda 2030 para el Desarrollo Sostenible</strong>, aprobada por la Asamblea General de las Naciones Unidas en septiembre de 2015, establece <strong>17 Objetivos de Desarrollo Sostenible (ODS)</strong> y 169 metas que abarcan las dimensiones económica, social y ambiental del desarrollo. Los ODS más directamente relacionados con el contenido de este tema son: <strong>ODS 6</strong> (agua limpia y saneamiento), <strong>ODS 7</strong> (energía asequible y no contaminante), <strong>ODS 11</strong> (ciudades y comunidades sostenibles), <strong>ODS 12</strong> (producción y consumo responsables), <strong>ODS 13</strong> (acción por el clima), <strong>ODS 14</strong> (vida submarina), <strong>ODS 15</strong> (vida de ecosistemas terrestres).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.5. Economía circular" color="pink">
                    <p>
                        La <strong>economía circular</strong> propone sustituir el modelo lineal (extraer-producir-consumir-desechar) por un modelo cíclico que minimice la extracción de recursos y la generación de residuos. Se basa en las <strong>7R</strong>: <strong>Rediseñar</strong> (crear productos para la durabilidad, reparabilidad y reciclaje), <strong>Reducir</strong> (minimizar el uso de materiales y energía), <strong>Reutilizar</strong> (dar un segundo uso a los productos), <strong>Reparar</strong> (alargar la vida útil de los productos), <strong>Renovar</strong> (actualizar y mejorar los productos), <strong>Recuperar</strong> (recoger y revalorizar materiales al final de su vida útil), <strong>Reciclar</strong> (transformar residuos en nuevos recursos).
                    </p>
                    <p>
                        El concepto de <strong>Cradle to Cradle</strong> (de la cuna a la cuna), desarrollado por <strong>William McDonough y Michael Braungart</strong>, propone que todos los materiales sean diseñados como <strong>nutrientes biológicos</strong> (que se reintegran de forma segura en la biosfera) o como <strong>nutrientes técnicos</strong> (que se reciclan indefinidamente sin pérdida de calidad). La UE ha adoptado un <strong>Plan de Acción para la Economía Circular</strong> como parte del Pacto Verde Europeo.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. Nuevos paradigmas económicos" icon="🌱">
                <TheoryBlock title="6.1. Economía ecológica" color="purple">
                    <p>
                        La <strong>economía ecológica</strong>, cuyos principales representantes son <strong>Nicholas Georgescu-Roegen</strong> y <strong>Herman Daly</strong>, propone que la economía debe operar dentro de los <strong>límites biofísicos del planeta</strong>. Daly desarrolló el concepto de <strong>economía de estado estacionario</strong> (steady-state economy): una economía en la que el flujo de materia y energía (throughput) se mantiene constante en un nivel sostenible, compatible con la capacidad de regeneración de los ecosistemas. El crecimiento cuantitativo (más producción) se sustituye por el <strong>desarrollo cualitativo</strong> (mejor producción, más eficiente, más equitativa, más satisfactoria). La economía ecológica critica la <strong>obsesión por el PIB</strong> como medida de bienestar y propone indicadores alternativos que reflejen el capital natural, el bienestar social y los límites planetarios.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.2. Economía del decrecimiento" color="blue">
                    <p>
                        El movimiento del <strong>decrecimiento</strong> (décroissance), cuyo principal teórico es <strong>Serge Latouche</strong>, va más allá de la economía ecológica y propone una <strong>reducción voluntaria y planificada de la producción y el consumo</strong> en las sociedades ricas, para reducir la presión sobre los ecosistemas y permitir un mayor espacio ecológico para los países en desarrollo. El decrecimiento no es una recesión (caída involuntaria del PIB), sino una <strong>transformación consciente</strong> del modelo económico y social: menos producción material, menos consumismo, pero más tiempo libre, más relaciones sociales, más bienestar subjetivo, más equidad. Sus críticos señalan que el decrecimiento podría generar desempleo masivo, conflictos sociales y una reducción del bienestar material, especialmente para los más pobres.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.3. Economía rosquilla (Doughnut Economics)" color="green">
                    <p>
                        <strong>Kate Raworth</strong> propuso en 2017 el modelo de la <strong>economía rosquilla</strong> (Doughnut Economics), que ofrece una imagen visual poderosa del espacio seguro y justo para la humanidad. La rosquilla tiene dos fronteras: el <strong>suelo social</strong> (la rosquilla interior), que representa las necesidades básicas que deben satisfacerse para todos (alimentación, salud, educación, vivienda, igualdad, participación política, energía, agua, empleo, ingresos — basadas en los ODS), y el <strong>techo ecológico</strong> (la rosquilla exterior), que representa los <strong>nueve límites planetarios</strong> que no deben sobrepasarse (cambio climático, acidificación oceánica, contaminación química, carga de nitrógeno y fósforo, uso de agua dulce, cambio de uso del suelo, pérdida de biodiversidad, contaminación atmosférica, agotamiento de la capa de ozono — basados en el marco de <strong>Johan Rockström</strong>). El objetivo de la economía no es el crecimiento indefinido del PIB, sino <strong>operar dentro de la rosquilla</strong>: satisfacer las necesidades de todos sin sobrepasar los límites del planeta.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.4. Economía del bien común y economía azul" color="amber">
                    <p>
                        La <strong>Economía del Bien Común</strong>, propuesta por el economista austríaco <strong>Christian Felber</strong>, plantea reorientar la economía hacia el bien común en lugar de la maximización del beneficio privado. Propone un <strong>Balance del Bien Común</strong> (BBC) para las empresas, que mida su contribución a valores como la dignidad humana, la solidaridad, la sostenibilidad ecológica, la justicia social y la democracia. Las empresas con mejor BBC recibirían ventajas fiscales, acceso prioritario a la contratación pública y mejores condiciones de crédito. La <strong>Economía Azul</strong>, propuesta por el empresario belga <strong>Gunter Pauli</strong>, se inspira en los <strong>ecosistemas naturales</strong> para diseñar sistemas productivos en los que los residuos de un proceso se conviertan en insumos de otro, eliminando el concepto de residuo. Pauli identifica decenas de innovaciones inspiradas en la naturaleza (biomimética) que pueden generar empleo, reducir costes y eliminar residuos simultáneamente.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.5. Green New Deal" color="pink">
                    <p>
                        El concepto de <strong>Green New Deal</strong> (Nuevo Pacto Verde) propone una <strong>inversión pública masiva</strong> en la transición ecológica —energías renovables, eficiencia energética, transporte público, rehabilitación de edificios, infraestructuras verdes, investigación y desarrollo— como motor de creación de empleo, crecimiento económico y reducción de emisiones. Inspirado en el New Deal de Franklin D. Roosevelt (1933), el Green New Deal concibe la transición ecológica no como un coste sino como una <strong>oportunidad económica y social</strong>: la mayor fuente de inversión, innovación y empleo de las próximas décadas. El Pacto Verde Europeo se inspira en esta filosofía.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 7 */}
            <Card title="7. Relevancia curricular y aplicación docente" icon="🎓">
                <TheoryBlock title="7.1. El medio ambiente en la LOMLOE" color="purple">
                    <p>
                        La Ley Orgánica 3/2020 (LOMLOE) y los reales decretos que desarrollan el currículo otorgan al medio ambiente y al desarrollo sostenible un papel <strong>transversal</strong> en la enseñanza. La educación para el desarrollo sostenible (EDS) se integra como eje vertebrador, contribuyendo especialmente a la <strong>competencia ciudadana (CC)</strong> (participación responsable en la sociedad, compromiso con la justicia social y ambiental), la <strong>competencia en ciencia, tecnología e ingeniería (STEM)</strong> (comprensión de los procesos ambientales y sus interacciones con la actividad humana) y la <strong>competencia personal, social y de aprender a aprender (CPSAA)</strong> (desarrollo de valores, actitudes y hábitos sostenibles).
                    </p>
                    <p>
                        En las materias de Economía (1.º Bachillerato) y Economía de la Empresa (2.º Bachillerato), los <strong>saberes básicos</strong> incluyen expresamente: externalidades y fallos del mercado, bienes públicos, política ambiental, desarrollo sostenible, responsabilidad social corporativa y economía circular. Los ODS constituyen un marco de referencia explícito para el diseño de situaciones de aprendizaje.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.2. Actividades didácticas propuestas" color="blue">
                    <p>
                        <strong>Actividades propuestas:</strong> (1) <strong>Cálculo de la huella ecológica personal</strong> mediante calculadoras online (Global Footprint Network) y debate sobre los resultados. (2) <strong>Debate: crecimiento vs. decrecimiento</strong>. Dos grupos defienden posiciones opuestas con argumentos económicos y ambientales. (3) <strong>Análisis de noticias ambientales:</strong> identificar externalidades, bienes públicos, políticas ambientales y ODS en noticias de prensa. (4) <strong>Simulación de un mercado de carbono</strong> en el aula: asignar permisos de emisión a "empresas" y permitir su compraventa. (5) <strong>Proyecto interdisciplinar:</strong> economía + ciencias naturales + tecnología: diseñar un producto siguiendo los principios de la economía circular y el Cradle to Cradle. (6) <strong>Estudio de caso:</strong> el Pacto Verde Europeo y sus implicaciones para España. (7) <strong>Reflexión:</strong> ¿España está dentro de la "rosquilla" de Kate Raworth? Analizar indicadores de suelo social y techo ecológico.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
            <Card title="Conclusión" icon="✅">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La relación entre economía y medio ambiente ha pasado de ser una cuestión marginal a convertirse en el desafío central de la ciencia económica y de la política pública del siglo XXI. Durante demasiado tiempo, el modelo económico dominante trató la naturaleza como un mero proveedor de recursos baratos y un sumidero gratuito de residuos, ignorando los costes ambientales y sociales de la actividad económica. Las externalidades ambientales —contaminación, cambio climático, pérdida de biodiversidad, agotamiento de recursos— representan un fallo del mercado de proporciones globales que exige la intervención decidida de los poderes públicos y la transformación profunda del modelo productivo y de consumo.
                    </p>
                    <p>
                        La teoría económica ofrece instrumentos potentes para abordar estos problemas: los impuestos pigouvianos, los mercados de derechos de emisión, el teorema de Coase, la regulación directa y la evaluación de impacto ambiental constituyen un arsenal de herramientas que, bien diseñadas e implementadas, pueden alinear los incentivos económicos con los objetivos ambientales. El desafío no es técnico sino político: la transición ecológica exige voluntad política, cooperación internacional, inversión pública y privada a gran escala y una distribución justa de los costes y beneficios.
                    </p>
                    <p>
                        El desarrollo sostenible —en su triple dimensión económica, social y ambiental— se ha consolidado como el paradigma rector del siglo XXI. La Agenda 2030, con sus 17 ODS, proporciona un marco universal de referencia. Los nuevos paradigmas económicos —economía ecológica, decrecimiento, economía rosquilla, economía del bien común, economía circular— enriquecen el debate y ofrecen alternativas al crecimiento ilimitado del PIB como indicador de progreso.
                    </p>
                    <p>
                        El cambio climático, como la mayor amenaza global de nuestro tiempo, exige una respuesta urgente y coordinada. El Acuerdo de París, el Pacto Verde Europeo y los mecanismos de mercado para la reducción de emisiones representan avances significativos, pero insuficientes frente a la magnitud del desafío. La justicia climática —la idea de que los países ricos, principales responsables históricos del cambio climático, deben asumir una responsabilidad proporcional— es un imperativo ético y económico.
                    </p>
                    <p>
                        El futuro docente de Economía tiene la responsabilidad y el privilegio de formar a las nuevas generaciones en la comprensión de estos desafíos y en el compromiso con un modelo de desarrollo que sea simultáneamente próspero, justo y sostenible. La LOMLOE, con su énfasis en los ODS y la educación para el desarrollo sostenible, proporciona el marco normativo; la ciencia económica, las herramientas analíticas; y la vocación docente, la motivación para transformar el mundo desde las aulas.
                    </p>
                </div>
            </Card>
