                <TheoryBlock title="1.6. La demografía española" color="violet">
                    <p>
                        España se encuentra en una fase avanzada de la transición demográfica, con características estructurales preocupantes: <strong>baja natalidad</strong> (la tasa de fecundidad es de aproximadamente 1,16 hijos por mujer, muy por debajo del nivel de reemplazo de 2,1), <strong>envejecimiento acelerado</strong> (más del 20% de la población tiene más de 65 años), <strong>alta esperanza de vida</strong> (más de 83 años, una de las más altas del mundo), <strong>crecimiento vegetativo negativo</strong> (más defunciones que nacimientos desde 2015) y <strong>dependencia del saldo migratorio</strong> como única fuente de crecimiento demográfico. A estos factores se suma el fenómeno de la <strong>"España vacía"</strong> o <strong>"España vaciada"</strong>: la despoblación del interior rural (la llamada "Serranía Celtibérica" tiene una densidad de población inferior a la de Laponia), con enormes desafíos para la provisión de servicios públicos, el mantenimiento del territorio y la cohesión territorial.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. Población activa e inactiva" icon="👥">
                <TheoryBlock title="2.1. Clasificación de la población" color="purple">
                    <p>
                        La clasificación de la población en relación con el mercado de trabajo parte de la <strong>población en edad de trabajar (PET)</strong>, que en España comprende a todas las personas de <strong>16 años o más</strong> (la edad mínima legal para trabajar). La PET se divide en dos grandes grupos:
                    </p>
                    <p>
                        <strong>Población activa:</strong> todas las personas en edad de trabajar que o bien tienen un empleo (<strong>ocupados</strong>) o bien lo buscan activamente (<strong>parados</strong>). La población activa = ocupados + parados.
                    </p>
                    <p>
                        <strong>Población inactiva:</strong> todas las personas en edad de trabajar que ni tienen empleo ni lo buscan activamente. Incluye a <strong>estudiantes</strong> a tiempo completo, <strong>jubilados y pensionistas</strong>, personas dedicadas a <strong>labores del hogar</strong>, personas con <strong>incapacidad permanente</strong>, personas que han desistido de buscar empleo (<strong>desanimados</strong>) y otros colectivos (rentistas, voluntarios, etc.).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Tasas fundamentales" color="blue">
                    <p>
                        Las tres tasas fundamentales que describen la situación del mercado de trabajo son:
                    </p>
                    <p>
                        <strong>Tasa de actividad:</strong> mide la proporción de la PET que participa activamente en el mercado de trabajo (ya sea trabajando o buscando empleo). Tasa de actividad = (Población activa / PET) × 100.
                    </p>
                    <p>
                        <strong>Tasa de empleo:</strong> mide la proporción de la PET que efectivamente tiene un empleo. Tasa de empleo = (Población ocupada / PET) × 100.
                    </p>
                    <p>
                        <strong>Tasa de paro (o tasa de desempleo):</strong> mide la proporción de la población activa que, deseando trabajar y buscando activamente empleo, no lo encuentra. Tasa de paro = (Población parada / Población activa) × 100. Esta es la tasa más citada en los medios de comunicación y el indicador central del mercado de trabajo.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="Tasa de actividad = (Activa / PET) × 100" />
                <FormulaBox formula="Tasa de empleo = (Ocupada / PET) × 100" />
                <FormulaBox formula="Tasa de paro = (Parada / Activa) × 100" />

                <TheoryBlock title="2.3. EPA y SEPE: dos fuentes, dos mediciones" color="green">
                    <p>
                        En España, existen dos fuentes principales para medir el desempleo, que ofrecen datos diferentes:
                    </p>
                    <p>
                        La <strong>Encuesta de Población Activa (EPA)</strong>, elaborada trimestralmente por el <strong>Instituto Nacional de Estadística (INE)</strong>, es una encuesta muestral que entrevista a unas 65.000 familias (aproximadamente 160.000 personas). Sigue la metodología de la Organización Internacional del Trabajo (OIT) y es la fuente oficial comparable internacionalmente. Clasifica como parado a toda persona de 16 o más años que: (1) no tiene empleo, (2) busca activamente empleo y (3) está disponible para trabajar en las dos semanas siguientes.
                    </p>
                    <p>
                        El <strong>Servicio Público de Empleo Estatal (SEPE)</strong> publica mensualmente el <strong>paro registrado</strong>, que contabiliza a las personas inscritas como demandantes de empleo en las oficinas de empleo. Las cifras del SEPE suelen ser inferiores a las de la EPA, porque no todas las personas desempleadas se inscriben (especialmente los desanimados) y porque el SEPE excluye a determinados colectivos (estudiantes que buscan su primer empleo a tiempo parcial, mayores de 65 años, etc.).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. El mercado de trabajo" icon="⚙️">
                <TheoryBlock title="3.1. La oferta de trabajo" color="purple">
                    <p>
                        La <strong>oferta de trabajo</strong> representa la cantidad de horas de trabajo que las personas están dispuestas a ofrecer a cada nivel de salario. La decisión individual de cuánto trabajar depende de la elección entre <strong>ocio y trabajo</strong>: un salario más alto tiene dos efectos contrapuestos. El <strong>efecto sustitución</strong> incentiva trabajar más (el ocio se vuelve más caro en términos de ingreso renunciado). El <strong>efecto renta</strong> permite trabajar menos para mantener el mismo nivel de vida (se es más rico y se puede "comprar" más ocio).
                    </p>
                    <p>
                        A salarios bajos, domina el efecto sustitución y la curva de oferta tiene pendiente positiva (más salario → más horas ofrecidas). Pero a partir de cierto nivel de salario, puede dominar el efecto renta, generando una curva de oferta <strong>"doblada hacia atrás"</strong> (backward-bending): más salario → menos horas ofrecidas. La <strong>oferta agregada de trabajo</strong> de una economía depende del tamaño de la población activa, la tasa de actividad, las preferencias individuales ocio-trabajo, la estructura demográfica y las políticas fiscales y sociales (impuestos sobre el trabajo, prestaciones sociales).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. La demanda de trabajo" color="blue">
                    <p>
                        La <strong>demanda de trabajo</strong> proviene de las empresas y depende de la <strong>productividad marginal del trabajo (PMgL)</strong>: el aumento de la producción que genera contratar una unidad adicional de trabajo. Formalmente, PMgL = ΔIT / ΔL, donde ΔIT es el incremento del ingreso total y ΔL el incremento del factor trabajo.
                    </p>
                    <p>
                        En un mercado competitivo, las empresas maximizadoras de beneficios contratan trabajadores hasta el punto en que el <strong>valor de la productividad marginal</strong> (PMgL × P, donde P es el precio del producto) iguala al salario (W). Es decir, la condición de equilibrio es: <strong>W = PMgL × P</strong>. Si el salario es inferior al valor de la productividad marginal, la empresa obtiene beneficios contratando un trabajador adicional; si es superior, pierde dinero y reduce la plantilla. La curva de demanda de trabajo es la propia curva de productividad marginal del trabajo, que tiene <strong>pendiente negativa</strong> por la ley de rendimientos decrecientes: cada trabajador adicional aporta menos que el anterior (manteniendo los demás factores constantes).
                    </p>
                </TheoryBlock>

                <FormulaBox formula="W = PMgL × P" desc="En equilibrio competitivo, el salario iguala al valor de la productividad marginal del trabajo." />

                <TheoryBlock title="3.3. Salario de equilibrio" color="green">
                    <p>
                        En el <strong>modelo competitivo</strong>, el salario de equilibrio se determina por la intersección de la oferta y la demanda de trabajo. A ese salario, la cantidad de trabajo ofrecida iguala la cantidad demandada y no existe desempleo involuntario (salvo el friccional). Si el salario está por encima del equilibrio, hay exceso de oferta de trabajo (desempleo); si está por debajo, hay exceso de demanda (escasez de trabajadores).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Mercados de trabajo no competitivos" color="amber">
                    <p>
                        En la práctica, los mercados de trabajo rara vez se ajustan al modelo perfectamente competitivo. Los principales elementos de imperfección son:
                    </p>
                    <p>
                        <strong>Sindicatos (poder de negociación de los trabajadores):</strong> los sindicatos negocian colectivamente salarios y condiciones laborales, pudiendo fijar salarios por encima del nivel competitivo. Esto puede aumentar la renta de los trabajadores sindicados pero generar desempleo entre los no sindicados (modelo de insiders-outsiders de Lindbeck y Snower, 1988).
                    </p>
                    <p>
                        <strong>Monopsonio (un solo demandante de trabajo):</strong> cuando una empresa es el único o principal empleador de una zona (ej.: una gran fábrica en un pueblo), tiene poder de mercado para fijar salarios por debajo del nivel competitivo. El monopsonista maximiza beneficios contratando menos trabajadores a un salario menor que el competitivo.
                    </p>
                    <p>
                        <strong>Salario mínimo:</strong> el establecimiento de un salario mínimo interprofesional (SMI) por encima del salario de equilibrio genera un debate central en economía laboral. La teoría neoclásica predice que genera desempleo (exceso de oferta). Sin embargo, estudios empíricos como el de <strong>Card y Krueger (1994)</strong> —que analizaron el efecto del aumento del salario mínimo en restaurantes de comida rápida en Nueva Jersey— encontraron que un aumento moderado del salario mínimo no necesariamente reduce el empleo, especialmente en mercados con poder de monopsonio. Este debate sigue abierto y es uno de los más activos de la economía laboral contemporánea.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. El desempleo: tipos y causas" icon="📊">
                <TheoryBlock title="4.1. Desempleo friccional" color="purple">
                    <p>
                        El <strong>desempleo friccional</strong> es el que se produce durante el proceso de búsqueda de empleo entre un trabajo y otro. Es inevitable en cualquier economía dinámica: siempre hay personas que dejan un empleo voluntariamente para buscar otro mejor, jóvenes que acceden por primera vez al mercado de trabajo, personas que se reincorporan tras un período de inactividad, etc. El desempleo friccional es generalmente de <strong>corta duración</strong> y refleja el tiempo necesario para que trabajadores y empleadores se encuentren (problemas de información, movilidad geográfica, proceso de selección). Es compatible con una economía saludable y eficiente.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Desempleo estructural" color="blue">
                    <p>
                        El <strong>desempleo estructural</strong> surge cuando existe un <strong>desajuste</strong> entre las cualificaciones que poseen los trabajadores y las que demandan las empresas (mismatch de habilidades), entre la localización geográfica de los trabajadores y la de los puestos vacantes, o cuando el cambio tecnológico destruye empleos más rápido de lo que los crea en otros sectores. El desempleo estructural es de <strong>larga duración</strong> y más difícil de resolver: requiere políticas de formación, reciclaje profesional, movilidad geográfica e inversión en nuevos sectores. Ejemplos: mineros desplazados por la transición energética, trabajadores de la industria textil desplazados por la deslocalización, empleados de banca desplazados por la digitalización.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Desempleo cíclico" color="green">
                    <p>
                        El <strong>desempleo cíclico</strong> (o keynesiano) es el que se produce como consecuencia de las recesiones económicas: cuando la demanda agregada cae, las empresas reducen la producción y despiden trabajadores. Es el componente más volátil del desempleo y el que justifica las políticas macroeconómicas anticíclicas (fiscal y monetaria expansiva en recesión). En España, el desempleo cíclico fue especialmente severo durante la Gran Recesión de 2008-2013, cuando la tasa de paro pasó del 8% al 27%.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. Desempleo estacional" color="amber">
                    <p>
                        El <strong>desempleo estacional</strong> se produce por las fluctuaciones regulares de la actividad económica ligadas a las estaciones del año o a períodos específicos. Es especialmente relevante en sectores como el <strong>turismo</strong> (verano y festivos), la <strong>agricultura</strong> (siembra y cosecha), el <strong>comercio</strong> (rebajas, Navidad) y la <strong>construcción</strong> (clima). Para eliminar este componente del análisis, las estadísticas oficiales publican datos <strong>desestacionalizados</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. Tasa natural de desempleo y NAIRU" color="pink">
                    <p>
                        <strong>Milton Friedman</strong> (1968) introdujo el concepto de <strong>tasa natural de desempleo</strong>: el nivel de desempleo que existe cuando la economía está en su nivel de producción potencial, es decir, cuando solo existe desempleo friccional y estructural (no hay desempleo cíclico). La tasa natural no es "natural" en el sentido de inmutable: depende de las instituciones del mercado de trabajo (regulación, prestaciones, formación), la eficiencia del emparejamiento entre trabajadores y empleos, y la estructura productiva de la economía.
                    </p>
                    <p>
                        Un concepto relacionado es la <strong>NAIRU</strong> (Non-Accelerating Inflation Rate of Unemployment): la tasa de desempleo por debajo de la cual la inflación tiende a acelerarse. Si el desempleo cae por debajo de la NAIRU, los trabajadores ganan poder de negociación, los salarios suben por encima de la productividad, los costes se trasladan a precios y la inflación se acelera. Este concepto es central para la política monetaria de los bancos centrales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.6. La curva de Phillips" color="violet">
                    <p>
                        En 1958, <strong>A.W. Phillips</strong> publicó un estudio empírico que mostraba una <strong>relación inversa entre la tasa de desempleo y la tasa de variación de los salarios nominales</strong> en el Reino Unido (1861-1957). Posteriormente, <strong>Samuelson y Solow (1960)</strong> reformularon esta relación como un trade-off entre desempleo e inflación: <em>menos desempleo → más inflación, y viceversa</em>.
                    </p>
                    <p>
                        Esta relación fue cuestionada en los años 70 por la <strong>estanflación</strong> (alta inflación + alto desempleo simultáneamente). <strong>Friedman</strong> y <strong>Phelps</strong> argumentaron que la curva de Phillips solo funciona a <strong>corto plazo</strong> (cuando las expectativas de inflación no se han ajustado). A <strong>largo plazo</strong>, la curva de Phillips es vertical en la tasa natural de desempleo: no hay trade-off permanente entre desempleo e inflación. Los <strong>nuevos keynesianos</strong> han desarrollado versiones más sofisticadas de la curva de Phillips que incorporan expectativas, rigideces nominales y costes de ajuste.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. Políticas de empleo" icon="🏛️">
                <TheoryBlock title="5.1. Políticas activas de empleo" color="purple">
                    <p>
                        Las <strong>políticas activas de empleo</strong> son aquellas que buscan mejorar el funcionamiento del mercado de trabajo, facilitar la inserción laboral y reducir el desempleo estructural. Incluyen:
                    </p>
                    <p>
                        <strong>Formación profesional y reciclaje:</strong> programas de capacitación para actualizar las competencias de los trabajadores desempleados o en riesgo de exclusión (formación profesional para el empleo, programas de recualificación digital, certificados de profesionalidad). <strong>Programas de empleo:</strong> planes de empleo público temporal, programas de empleo juvenil (como el Sistema Nacional de Garantía Juvenil en España), incentivos a la contratación de colectivos vulnerables (jóvenes, mayores de 45 años, personas con discapacidad, parados de larga duración). <strong>Incentivos al emprendimiento:</strong> subvenciones a la creación de empresas, tarifa plana de autónomos, viveros de empresas, asesoramiento empresarial. <strong>Servicios públicos de empleo:</strong> intermediación laboral, orientación profesional, bolsas de empleo, portales de empleo (SEPE, servicios autonómicos).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Políticas pasivas de empleo" color="blue">
                    <p>
                        Las <strong>políticas pasivas de empleo</strong> proporcionan protección económica a las personas desempleadas mientras buscan un nuevo empleo. Las principales son:
                    </p>
                    <p>
                        <strong>Prestaciones por desempleo (contributivas):</strong> el trabajador que ha cotizado un período mínimo tiene derecho a una prestación proporcional a su salario anterior durante un tiempo limitado (en España, entre 4 y 24 meses según la cotización acumulada). <strong>Subsidios por desempleo (asistenciales):</strong> ayudas para personas que han agotado la prestación contributiva o no tienen derecho a ella. <strong>Rentas mínimas de inserción:</strong> prestaciones de carácter asistencial para personas en situación de pobreza y exclusión social. En España, el <strong>Ingreso Mínimo Vital (IMV)</strong>, creado en 2020, garantiza un nivel mínimo de renta a los hogares en situación de vulnerabilidad.
                    </p>
                    <p>
                        El diseño de las políticas pasivas plantea un dilema: prestaciones demasiado generosas o prolongadas pueden crear <strong>desincentivos a la búsqueda de empleo</strong> (trampa de la pobreza, moral hazard), mientras que prestaciones insuficientes pueden provocar <strong>pobreza, exclusión social y deterioro del capital humano</strong> de los desempleados.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Flexibilidad vs. seguridad: el debate de la flexiseguridad" color="green">
                    <p>
                        El concepto de <strong>flexiseguridad</strong> (flexicurity), inspirado en el <strong>modelo danés</strong>, propone combinar tres elementos: <strong>flexibilidad</strong> en el mercado de trabajo (facilidad de contratación y despido, adaptabilidad de las condiciones laborales), <strong>generosas prestaciones por desempleo</strong> (protección durante las transiciones) y <strong>políticas activas de empleo intensivas</strong> (formación, reciclaje, intermediación). La idea es que la seguridad no se proporciona protegiendo el puesto de trabajo concreto (como en el modelo mediterráneo), sino protegiendo al <strong>trabajador</strong> en sus transiciones entre empleos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Reformas laborales en España" color="amber">
                    <p>
                        España ha experimentado múltiples reformas laborales en las últimas décadas. La <strong>reforma de 2012</strong> (Real Decreto-ley 3/2012) introdujo: abaratamiento del despido improcedente (de 45 a 33 días por año), prioridad del convenio de empresa sobre el sectorial, facilitación de la flexibilidad interna (modificación de condiciones de trabajo), ampliación del período de prueba. La <strong>reforma de 2021</strong> (Real Decreto-ley 32/2021) introdujo cambios en sentido contrario: restricción de la contratación temporal (el contrato indefinido pasa a ser la norma), recuperación de la ultraactividad de los convenios colectivos, limitación de la subcontratación y regulación del contrato fijo-discontinuo. El impacto de esta reforma ha sido una notable caída de la tasa de temporalidad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.5. Tipos de contrato y negociación colectiva" color="pink">
                    <p>
                        Los principales tipos de contrato de trabajo en España son: <strong>contrato indefinido</strong> (ordinario, fijo-discontinuo), <strong>contrato temporal</strong> (por circunstancias de la producción, por sustitución) y <strong>contrato formativo</strong> (en alternancia, para la obtención de la práctica profesional). Tras la reforma de 2021, se eliminaron la mayoría de modalidades de contrato temporal y se impulsó la contratación indefinida.
                    </p>
                    <p>
                        La <strong>negociación colectiva</strong> es el proceso mediante el cual sindicatos y patronal acuerdan las condiciones laborales (salarios, jornada, vacaciones, clasificación profesional) a través de <strong>convenios colectivos</strong>. En España, la negociación colectiva tiene una cobertura amplia (más del 80% de los asalariados están cubiertos por un convenio) y se articula en varios niveles: convenio de empresa, convenio sectorial provincial, convenio sectorial estatal.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. El mercado de trabajo en España" icon="🇪🇸">
                <TheoryBlock title="6.1. Características estructurales" color="purple">
                    <p>
                        El mercado de trabajo español presenta una serie de <strong>características estructurales</strong> que lo diferencian de otros mercados europeos: <strong>Alta tasa de desempleo estructural:</strong> históricamente, España ha tenido una tasa de paro sistemáticamente superior a la media de la UE, incluso en períodos de crecimiento económico. Las causas son múltiples: rigidez del mercado, desajuste formativo, modelo productivo intensivo en empleo poco cualificado (construcción, turismo, hostelería). <strong>Elevada temporalidad:</strong> hasta la reforma de 2021, más del 25% de los asalariados tenían contrato temporal (frente al 14% de media en la UE), generando precariedad, rotación, baja productividad y escasa inversión en formación por parte de las empresas.
                    </p>
                    <p>
                        <strong>Dualidad del mercado (insiders/outsiders):</strong> el mercado de trabajo español ha estado marcado por una fuerte dualidad entre trabajadores con contrato indefinido y alta protección (insiders) y trabajadores temporales con escasa protección y alta rotación (outsiders). Esta dualidad tiene efectos negativos sobre la productividad, la formación y la desigualdad. <strong>Desempleo juvenil:</strong> la tasa de paro juvenil (16-24 años) en España es estructuralmente muy elevada, habiendo superado el 55% durante la crisis de 2012-2013. <strong>Brecha de género:</strong> aunque la participación femenina ha crecido notablemente, persisten diferencias significativas en tasas de actividad, empleo, temporalidad, parcialidad involuntaria y salarios entre hombres y mujeres.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.2. Evolución reciente" color="blue">
                    <p>
                        La evolución del mercado de trabajo español en las últimas décadas puede resumirse en varias fases: <strong>2000-2007 (expansión):</strong> fuerte creación de empleo, impulsada por la burbuja inmobiliaria y el sector de la construcción. La tasa de paro bajó hasta el 8% en 2007. <strong>2008-2013 (Gran Recesión):</strong> destrucción masiva de empleo, especialmente en construcción. La tasa de paro alcanzó el 26,9% en el primer trimestre de 2013 (más de 6 millones de parados). <strong>2014-2019 (recuperación):</strong> lenta recuperación del empleo, con alta temporalidad y precariedad. <strong>2020 (COVID-19):</strong> caída abrupta del empleo, amortiguada por los ERTEs (Expedientes de Regulación Temporal de Empleo). <strong>2021-presente:</strong> recuperación del empleo, reforma laboral de 2021, caída de la temporalidad, debate sobre la calidad del empleo.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.3. Salario Mínimo Interprofesional (SMI)" color="green">
                    <p>
                        El <strong>Salario Mínimo Interprofesional (SMI)</strong> es la retribución mínima que debe percibir un trabajador por una jornada legal completa. En España, el SMI ha experimentado subidas significativas en los últimos años: de 735,90 €/mes en 2018 a 1.134 €/mes en 14 pagas en 2024, un aumento superior al 50% en seis años. El debate sobre el SMI enfrenta dos posiciones: quienes argumentan que reduce la pobreza laboral, la desigualdad salarial y estimula el consumo, y quienes advierten que un SMI excesivamente alto puede destruir empleo, especialmente entre los colectivos más vulnerables (jóvenes, poco cualificados, zonas de bajo coste de vida). La evidencia empírica sugiere que subidas moderadas del SMI tienen efectos limitados sobre el empleo pero significativos sobre la reducción de la desigualdad salarial.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.4. Brecha salarial de género" color="amber">
                    <p>
                        La <strong>brecha salarial de género</strong> —la diferencia entre el salario medio de hombres y mujeres— es un fenómeno persistente en España y en la mayoría de países del mundo. Según datos de Eurostat, la brecha salarial en España se sitúa en torno al 9-12% (brecha ajustada) y es mayor si se consideran las diferencias en jornada, sectores y ocupaciones (brecha no ajustada, superior al 20%). Las causas son múltiples: <strong>segregación horizontal</strong> (las mujeres se concentran en sectores peor remunerados: sanidad, educación, cuidados), <strong>segregación vertical</strong> (techo de cristal: menor presencia femenina en puestos directivos), <strong>parcialidad involuntaria</strong> (las mujeres trabajan a tiempo parcial en mayor proporción, a menudo por responsabilidades de cuidado), <strong>penalización por maternidad</strong> y <strong>discriminación directa</strong>. Las medidas para reducir la brecha incluyen: planes de igualdad en empresas, transparencia salarial, permisos de paternidad igualitarios (como los 16 semanas establecidos en España desde 2021), políticas de conciliación y corresponsabilidad.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 7 */}
            <Card title="7. Desafíos futuros del mercado laboral" icon="🔮">
                <TheoryBlock title="7.1. Automatización e inteligencia artificial" color="purple">
                    <p>
                        El avance de la <strong>automatización</strong>, la <strong>robótica</strong> y la <strong>inteligencia artificial (IA)</strong> está transformando profundamente el mercado de trabajo. El estudio de <strong>Frey y Osborne (2013)</strong>, de la Universidad de Oxford, estimó que el <strong>47% de los empleos</strong> en Estados Unidos estaban en alto riesgo de ser automatizados en las próximas dos décadas. Estudios posteriores (OCDE, McKinsey Global Institute) han matizado esta cifra, señalando que lo que se automatiza son <strong>tareas</strong>, no empleos completos, y que la automatización también <strong>crea</strong> nuevos empleos (en diseño, mantenimiento, supervisión, programación, análisis de datos, etc.) y <strong>transforma</strong> los existentes.
                    </p>
                    <p>
                        La IA generativa (como los modelos de lenguaje de gran escala) representa un salto cualitativo: por primera vez, la automatización afecta no solo a tareas rutinarias y manuales, sino también a tareas cognitivas complejas (redacción, análisis, programación, diseño, atención al cliente). Esto genera incertidumbre sobre el futuro de profesiones tradicionalmente consideradas "seguras" frente a la automatización (abogados, contables, periodistas, traductores, programadores).
                    </p>
                    <p>
                        El impacto neto sobre el empleo dependerá de la velocidad de la innovación tecnológica, de la capacidad de adaptación de los trabajadores (formación continua, reciclaje), de las políticas públicas (regulación, fiscalidad de los robots, inversión en educación) y de la creación de nuevos sectores y ocupaciones que hoy no existen.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.2. Economía de plataformas (gig economy)" color="blue">
                    <p>
                        La <strong>economía de plataformas</strong> o <strong>gig economy</strong> se refiere al modelo de trabajo intermediado por plataformas digitales (Uber, Deliveroo, Glovo, Amazon Mechanical Turk, Upwork, etc.), en el que los trabajadores realizan tareas puntuales o "gigs" a demanda, generalmente como trabajadores autónomos. Este modelo plantea desafíos regulatorios fundamentales: ¿son estos trabajadores <strong>autónomos</strong> (con libertad y flexibilidad pero sin protección social) o <strong>asalariados encubiertos</strong> (falsos autónomos)?
                    </p>
                    <p>
                        En España, la <strong>Ley Rider</strong> (Real Decreto-ley 9/2021) estableció la presunción de laboralidad para los repartidores de plataformas digitales, convirtiéndolos en asalariados con derechos laborales plenos. A nivel europeo, la propuesta de Directiva sobre trabajo en plataformas digitales busca establecer criterios comunes para la clasificación de estos trabajadores.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.3. Teletrabajo post-COVID" color="green">
                    <p>
                        La pandemia de COVID-19 aceleró drásticamente la adopción del <strong>teletrabajo</strong>: millones de trabajadores pasaron del trabajo presencial al remoto de forma abrupta. Esta experiencia ha transformado las expectativas de trabajadores y empresas. En España, la <strong>Ley 10/2021 de trabajo a distancia</strong> regula el teletrabajo, estableciendo el derecho a la compensación de gastos, la voluntariedad, la reversibilidad, la desconexión digital y la igualdad de derechos entre trabajadores presenciales y remotos.
                    </p>
                    <p>
                        El teletrabajo presenta ventajas (flexibilidad, conciliación, reducción de desplazamientos, acceso a talento global) e inconvenientes (aislamiento social, dificultad de desconexión, desigualdad entre trabajadores que pueden y no pueden teletrabajar, riesgo de presentismo digital, efectos sobre el desarrollo profesional). El modelo <strong>híbrido</strong> (combinación de presencial y remoto) se ha consolidado como la opción predominante en muchas empresas y sectores.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.4. Renta básica universal" color="amber">
                    <p>
                        La <strong>renta básica universal (RBU)</strong> es una propuesta que plantea garantizar a todo ciudadano una renta periódica suficiente para cubrir las necesidades básicas, de forma <strong>incondicional</strong> (sin requisitos de renta, situación laboral o disposición a trabajar), <strong>universal</strong> (para todos los ciudadanos) e <strong>individual</strong> (no basada en el hogar). Sus defensores (<strong>Philippe Van Parijs</strong>, <strong>Guy Standing</strong>, <strong>Thomas Piketty</strong>) argumentan que: (1) simplifica el sistema de protección social (eliminando la burocracia y el estigma de las prestaciones condicionadas), (2) elimina la trampa de la pobreza (no desincentiva el trabajo, ya que no se pierde al encontrar empleo), (3) proporciona seguridad económica frente a la automatización y la inestabilidad laboral, (4) empodera a los trabajadores (pueden rechazar empleos precarios), (5) reconoce el trabajo no remunerado (doméstico, voluntario, de cuidados).
                    </p>
                    <p>
                        Sus detractores argumentan que: (1) el coste fiscal es enorme (multiplicar una renta básica por toda la población adulta arroja cifras de decenas o centenares de miles de millones), (2) puede desincentivas el trabajo (aunque la evidencia de los experimentos piloto —Finlandia, Kenia, Stockton en EE.UU.— no confirma este temor), (3) es políticamente difícil de implementar. El debate sobre la RBU ha cobrado fuerza con la pandemia de COVID-19 y el avance de la IA.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.5. Formación continua y reciclaje profesional" color="pink">
                    <p>
                        En un mercado laboral en transformación acelerada, la <strong>formación continua</strong> (lifelong learning) se convierte en una necesidad estructural. La OCDE estima que el 14% de los empleos actuales son altamente automatizables y otro 32% sufrirá cambios significativos, lo que exigirá <strong>reciclaje profesional (reskilling)</strong> y <strong>mejora de competencias (upskilling)</strong> a escala masiva. Las competencias más demandadas combinan habilidades técnicas (digitales, STEM, programación, análisis de datos) con habilidades transversales (creatividad, pensamiento crítico, resolución de problemas complejos, inteligencia emocional, comunicación, trabajo en equipo).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.6. ODS 8 y conexión curricular" color="violet">
                    <p>
                        El <strong>ODS 8</strong> (Trabajo decente y crecimiento económico) establece como meta promover el crecimiento económico sostenido, inclusivo y sostenible, el empleo pleno y productivo y el trabajo decente para todos. El concepto de <strong>"trabajo decente"</strong> (decent work), acuñado por la <strong>OIT</strong>, incluye cuatro pilares: empleo productivo y libremente elegido, derechos laborales (libertad sindical, negociación colectiva, eliminación del trabajo forzoso e infantil, no discriminación), protección social y diálogo social.
                    </p>
                    <p>
                        <strong>Aplicación docente:</strong> (1) Analizar la pirámide de población de España (datos del INE) y compararla con la de un país en desarrollo. (2) Calcular las tasas de actividad, empleo y paro con datos reales de la EPA. (3) Debate: ¿es el salario mínimo una herramienta eficaz contra la pobreza? Argumentos a favor y en contra. (4) Estudio de caso: la Ley Rider y la regulación de las plataformas digitales. (5) Simulación de negociación colectiva entre "sindicato" y "patronal". (6) Reflexión sobre el futuro del trabajo: ¿qué empleos existirán en 2040? (7) Análisis de la brecha salarial de género con datos de Eurostat.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── CONCLUSIÓN ──────────────────────────────────────── */}
            <Card title="Conclusión" icon="✅">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La población y el mercado de trabajo constituyen dos dimensiones fundamentales e interrelacionadas de la realidad económica. La dinámica demográfica —con fenómenos como el envejecimiento, la caída de la fecundidad, las migraciones y la despoblación rural— condiciona de forma decisiva la oferta de trabajo, las necesidades de gasto público, el sistema de pensiones y la capacidad de crecimiento de las economías. España, con una pirámide de población cada vez más regresiva y una dependencia creciente de la inmigración como fuente de crecimiento demográfico, enfrenta desafíos estructurales de primer orden.
                    </p>
                    <p>
                        El mercado de trabajo, por su parte, se ha revelado como uno de los ámbitos más complejos y controvertidos de la política económica. La teoría económica ofrece marcos analíticos potentes —desde el modelo competitivo de oferta y demanda de trabajo hasta los modelos de salarios de eficiencia, insiders-outsiders y negociación—, pero la realidad del mercado laboral está profundamente condicionada por las instituciones, la regulación, la negociación colectiva, la cultura empresarial y las políticas públicas. El desempleo, en sus diferentes variantes (friccional, estructural, cíclico), sigue siendo el gran problema irresuelto de muchas economías, con consecuencias devastadoras sobre el bienestar individual y la cohesión social.
                    </p>
                    <p>
                        El mercado de trabajo español presenta características estructurales preocupantes —alta tasa de paro, dualidad, temporalidad, desempleo juvenil, brecha de género— que las sucesivas reformas laborales han intentado abordar con resultados desiguales. La reforma de 2021 ha logrado una reducción notable de la temporalidad, pero quedan pendientes desafíos de fondo: la mejora de la productividad, la reducción del desempleo estructural, la integración de los jóvenes, la adaptación a la revolución tecnológica y la transición hacia un modelo productivo más sostenible y basado en el conocimiento.
                    </p>
                    <p>
                        El futuro del trabajo está marcado por la incertidumbre: la automatización, la inteligencia artificial, la economía de plataformas, el teletrabajo y los cambios demográficos están transformando radicalmente el panorama laboral. La formación continua, la flexiseguridad, la negociación colectiva adaptativa y el debate sobre la renta básica universal serán elementos centrales del mercado de trabajo del siglo XXI. El futuro docente de Economía tiene la responsabilidad de transmitir estos contenidos con rigor analítico, sensibilidad social y espíritu crítico, preparando al alumnado para comprender y navegar un mundo laboral en constante transformación.
                    </p>
                </div>
            </Card>

                    </p>
                    <p>
                        El presente tema aborda, en primer lugar, la relación entre economía y medio ambiente; en segundo lugar, las externalidades ambientales y los fallos del mercado; en tercer lugar, el cambio climático como problema económico; en cuarto lugar, los instrumentos de política ambiental; en quinto lugar, el concepto de desarrollo sostenible; en sexto lugar, los nuevos paradigmas económicos alternativos; y, finalmente, la relevancia curricular y la aplicación docente. Todo ello con el rigor analítico y la sensibilidad ambiental que exige la formación de las nuevas generaciones.
                    </p>
                </div>
            </Card>
