                <TheoryBlock title="2.2. Ventaja absoluta y ventaja comparativa" color="blue">
                    <p>
                        <strong>Adam Smith</strong> formuló la teoría de la <strong>ventaja absoluta</strong>: un país debe especializarse en la producción de aquellos bienes que puede producir con menor coste absoluto que los demás. Si España produce vino más barato que Inglaterra, y esta produce tela más barata que España, ambos países se benefician si España se especializa en vino e Inglaterra en tela, e intercambian.
                    </p>
                    <p>
                        Sin embargo, <strong>David Ricardo</strong> (1817) dio un paso crucial al formular la teoría de la <strong>ventaja comparativa</strong>: incluso si un país es más eficiente en la producción de <em>todos</em> los bienes (ventaja absoluta en todo), el comercio sigue siendo beneficioso si cada país se especializa en aquel bien en el que tiene un <strong>menor coste de oportunidad relativo</strong>. Este principio, considerado una de las ideas más contraintuitivas y poderosas de la Economía, demuestra que el comercio internacional beneficia a todos los países participantes, independientemente de su nivel de desarrollo.
                    </p>
                    <p>
                        <strong>Ejemplo numérico:</strong> Supongamos que Portugal necesita 80 horas para producir una unidad de vino y 90 horas para una de tela, mientras que Inglaterra necesita 120 horas para vino y 100 para tela. Portugal tiene ventaja absoluta en ambos productos. Sin embargo, el coste de oportunidad de producir vino en Portugal es 80/90 = 0,89 unidades de tela, mientras que en Inglaterra es 120/100 = 1,2 unidades de tela. Portugal tiene ventaja comparativa en vino (menor coste de oportunidad: 0,89 &lt; 1,2), e Inglaterra tiene ventaja comparativa en tela (su coste de oportunidad de producir tela es 100/120 = 0,83, frente a 90/80 = 1,125 en Portugal). Ambos países se benefician si se especializan según su ventaja comparativa e intercambian.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. El teorema de Heckscher-Ohlin" color="green">
                    <p>
                        El modelo de <strong>Heckscher-Ohlin</strong> (desarrollado por Eli Heckscher en 1919 y formalizado por Bertil Ohlin en 1933, quien recibió el Premio Nobel de Economía en 1977) amplía la teoría ricardiana al explicar <strong>por qué</strong> los países tienen ventajas comparativas diferentes. Según este teorema, cada país tenderá a exportar los bienes cuya producción utiliza intensivamente el <strong>factor productivo del que está relativamente más dotado</strong>, e importará los bienes que utilizan intensivamente los factores de los que está relativamente escaso.
                    </p>
                    <p>
                        Así, los países con abundancia de <strong>trabajo</strong> (como China, India o Bangladesh) tenderán a especializarse y exportar productos intensivos en mano de obra (textil, manufacturas básicas), mientras que los países con abundancia de <strong>capital</strong> (como Alemania, Japón o Estados Unidos) se especializarán en productos intensivos en capital y tecnología (maquinaria, automóviles, productos farmacéuticos, software).
                    </p>
                    <p>
                        El teorema de Heckscher-Ohlin, junto con el <strong>teorema de Stolper-Samuelson</strong> (el libre comercio beneficia al factor abundante y perjudica al escaso) y el <strong>teorema de la igualación del precio de los factores</strong> (el libre comercio tiende a igualar los salarios entre países), forma el núcleo de la <strong>teoría neoclásica del comercio internacional</strong>, que se conecta directamente con el Tema 31 del programa de oposiciones.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. La productividad: concepto y medición" icon="📊">
                <TheoryBlock title="3.1. Productividad parcial" color="purple">
                    <p>
                        La <strong>productividad</strong> mide la relación entre la <strong>producción obtenida</strong> y los <strong>factores empleados</strong> para obtenerla. Es, en esencia, un indicador de <strong>eficiencia</strong>: cuánto output se obtiene por unidad de input.
                    </p>
                    <p>
                        Las medidas más habituales de productividad <strong>parcial</strong> son:
                    </p>
                    <p>
                        <strong>Productividad del trabajo (PL):</strong> relaciona la producción con el factor trabajo. Se calcula como PL = Q / L, donde Q es la producción total y L es la cantidad de trabajo empleada (habitualmente medida en horas trabajadas o número de trabajadores). Es la medida más utilizada por su facilidad de cálculo y disponibilidad de datos.
                    </p>
                    <p>
                        <strong>Productividad del capital (PK):</strong> relaciona la producción con el factor capital. Se calcula como PK = Q / K, donde K es el stock de capital utilizado. Es menos habitual porque la medición del stock de capital plantea dificultades teóricas y estadísticas (heterogeneidad del capital, depreciación, valoración).
                    </p>
                </TheoryBlock>

                <FormulaBox formula="PL = Q / L    (Productividad del trabajo)" desc="Producción por unidad de trabajo empleada" />
                <FormulaBox formula="PK = Q / K    (Productividad del capital)" desc="Producción por unidad de capital empleado" />

                <TheoryBlock title="3.2. Productividad total de los factores (PTF)" color="blue">
                    <p>
                        La <strong>Productividad Total de los Factores (PTF)</strong>, también conocida como el <strong>residuo de Solow</strong>, mide la parte del crecimiento de la producción que <strong>no se explica</strong> por el aumento de los factores productivos (trabajo y capital). Recoge, por tanto, la contribución de la <strong>tecnología</strong>, la <strong>innovación</strong>, la <strong>eficiencia organizativa</strong>, la <strong>calidad institucional</strong> y otros factores intangibles al crecimiento económico.
                    </p>
                    <p>
                        La PTF se calcula como un residuo en la contabilidad del crecimiento: si la producción crece un 3 %, el trabajo un 1 % y el capital un 1 %, y las participaciones respectivas en la renta son α = 0,7 y β = 0,3, entonces el crecimiento explicado por los factores es 0,7 × 1 % + 0,3 × 1 % = 1 %, y el residuo (PTF) es 3 % − 1 % = 2 %. Este 2 % recoge el progreso tecnológico y la mejora de la eficiencia.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="PTF = ΔQ/Q − α·(ΔL/L) − β·(ΔK/K)" desc="Residuo de Solow: crecimiento no explicado por la acumulación de factores" />

                <TheoryBlock title="3.3. Índice de productividad global (IPG) y tasa de variación" color="green">
                    <p>
                        El <strong>Índice de Productividad Global (IPG)</strong> permite medir la productividad considerando todos los factores simultáneamente, ponderados por su participación en el coste total. Se calcula como la relación entre un índice de producción y un índice ponderado de factores empleados:
                    </p>
                    <p>
                        IPG = Índice de producción / Índice ponderado de factores
                    </p>
                    <p>
                        La <strong>tasa de variación de la productividad</strong> mide el cambio porcentual de la productividad entre dos períodos: ΔPL/PL = (PL₁ − PL₀) / PL₀ × 100. Esta tasa es un indicador fundamental para evaluar la evolución de la competitividad de una economía.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Productividad y nivel de vida" color="amber">
                    <p>
                        Existe una <strong>relación directa y robusta</strong> entre la productividad de un país y su <strong>renta per cápita</strong>. Los países con mayor productividad del trabajo (PIB por hora trabajada) son sistemáticamente los que tienen mayores niveles de renta per cápita y de bienestar material. Esta correlación no es casual: la productividad determina cuánto valor puede generar cada trabajador, lo que a su vez determina los salarios reales, los beneficios empresariales, la recaudación fiscal y la capacidad de financiar servicios públicos.
                    </p>
                    <p>
                        En la <strong>comparativa internacional</strong>, España presenta una productividad del trabajo inferior a la media de la UE-27 y significativamente inferior a la de los países líderes (Alemania, Francia, Países Bajos, Irlanda). Según datos de la OCDE y Eurostat, el PIB por hora trabajada de España se sitúa en torno al 85-90 % de la media de la UE y al 75-80 % del nivel de Estados Unidos. Esta brecha de productividad es una de las causas principales de que la renta per cápita española sea inferior a la media europea, a pesar de que los españoles trabajan más horas que los alemanes o los franceses.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. Determinantes de la productividad" icon="⚙️">
                <TheoryBlock title="4.1. Capital físico por trabajador (K/L)" color="purple">
                    <p>
                        La <strong>dotación de capital físico por trabajador</strong> (ratio K/L) es uno de los determinantes más directos de la productividad del trabajo. Un trabajador equipado con maquinaria moderna, ordenadores potentes y herramientas especializadas producirá más que otro que trabaje con herramientas rudimentarias. La <strong>inversión</strong> en capital físico (formación bruta de capital fijo) es, por tanto, una condición necesaria para el crecimiento de la productividad.
                    </p>
                    <p>
                        Sin embargo, el modelo de Solow demuestra que la acumulación de capital físico tiene <strong>rendimientos decrecientes</strong>: cada unidad adicional de capital, manteniendo constante el trabajo, genera incrementos de producción cada vez menores. Esto implica que, a largo plazo, el crecimiento sostenido no puede basarse exclusivamente en la acumulación de capital, sino que requiere progreso tecnológico.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Capital humano" color="blue">
                    <p>
                        El <strong>capital humano</strong> —los conocimientos, habilidades, competencias y capacidades adquiridos por los trabajadores a través de la educación, la formación profesional y la experiencia laboral— es uno de los determinantes más importantes de la productividad. <strong>Gary Becker</strong> (1964) y <strong>Theodore Schultz</strong> (1961) demostraron que la inversión en educación y formación genera rendimientos económicos equiparables a la inversión en capital físico.
                    </p>
                    <p>
                        <strong>Robert Lucas</strong> (1988) incorporó el capital humano como motor del crecimiento endógeno: las externalidades positivas del conocimiento (un trabajador más formado no solo es más productivo él mismo, sino que también eleva la productividad de quienes trabajan con él) generan rendimientos crecientes a escala que permiten un crecimiento sostenido sin necesidad de progreso tecnológico exógeno.
                    </p>
                    <p>
                        España ha experimentado un avance notable en capital humano en las últimas décadas (la población con estudios superiores ha pasado del 10 % en 1980 a más del 40 % en 2023), pero persisten problemas de <strong>desajuste educativo</strong> (sobrecualificación en unos sectores y déficit en otros), <strong>abandono escolar temprano</strong> (aunque se ha reducido significativamente) y una insuficiente conexión entre el sistema educativo y las necesidades del mercado laboral.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Progreso tecnológico (I+D+i)" color="green">
                    <p>
                        El <strong>progreso tecnológico</strong> —la aplicación del conocimiento científico y técnico a la producción— es el determinante fundamental de la productividad a largo plazo. En el <strong>modelo de Solow</strong> (1956), el progreso tecnológico es la <strong>única fuente de crecimiento sostenido</strong> en el estado estacionario, una vez agotados los rendimientos de la acumulación de capital.
                    </p>
                    <p>
                        El gasto en <strong>I+D+i</strong> (investigación, desarrollo e innovación) es el indicador más utilizado para medir el esfuerzo tecnológico de un país. España dedica aproximadamente un 1,4 % de su PIB a I+D, frente al 2,3 % de la media de la UE, el 3,1 % de Alemania, el 3,4 % de Japón y el 3,5 % de Estados Unidos (datos OCDE, 2023). Esta brecha en inversión tecnológica es una de las causas principales de la menor productividad española.
                    </p>
                    <p>
                        La importancia de la <strong>PTF</strong> (Productividad Total de los Factores) o <strong>residuo de Solow</strong> no puede subestimarse: en los países desarrollados, el progreso tecnológico explica entre el 50 % y el 70 % del crecimiento económico a largo plazo. El residuo de Solow recoge no solo la tecnología en sentido estricto, sino también la mejora de la eficiencia organizativa, la calidad de la gestión, la difusión del conocimiento y la innovación de procesos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. Calidad institucional e infraestructuras" color="amber">
                    <p>
                        <strong>Douglass North</strong> (Premio Nobel 1993) demostró que las <strong>instituciones</strong> —las reglas del juego formales (leyes, regulaciones, derechos de propiedad) e informales (normas sociales, cultura, confianza)— son un determinante fundamental de la productividad y del crecimiento económico. Los países con instituciones sólidas (estado de derecho, protección de la propiedad intelectual, regulación eficiente, baja corrupción, estabilidad política) generan un entorno favorable para la inversión, la innovación y el emprendimiento.
                    </p>
                    <p>
                        Las <strong>infraestructuras</strong> —redes de transporte, telecomunicaciones, energía, agua— constituyen otro determinante clave. Las infraestructuras reducen los costes de transacción, amplían los mercados y facilitan la especialización y el intercambio. España cuenta con una red de infraestructuras de transporte competitiva (alta velocidad ferroviaria, autopistas, puertos), pero presenta déficits en infraestructuras digitales y en la integración de las redes europeas de energía.
                    </p>
                    <p>
                        La <strong>organización empresarial</strong> también importa: las prácticas de gestión avanzadas, la gobernanza corporativa, la formación continua de los empleados y la adopción temprana de tecnologías digitales son factores que diferencian la productividad entre empresas dentro de un mismo sector y país.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.5. El modelo de Solow y el residuo" color="violet">
                    <p>
                        El <strong>modelo de Solow</strong> (1956) formaliza la relación entre los determinantes de la productividad y el crecimiento económico. La función de producción agregada es Y = A · f(K, L), donde Y es la producción, K el capital, L el trabajo y A un parámetro que recoge la tecnología y la eficiencia (la PTF). El modelo demuestra que:
                    </p>
                    <p>
                        (1) La acumulación de capital tiene <strong>rendimientos decrecientes</strong>: cada unidad adicional de capital genera incrementos de producción cada vez menores. (2) La economía converge hacia un <strong>estado estacionario</strong> en el que el capital por trabajador y la producción por trabajador son constantes (sin progreso tecnológico). (3) El <strong>crecimiento sostenido a largo plazo solo es posible gracias al progreso tecnológico</strong> (aumento de A).
                    </p>
                    <p>
                        El <strong>residuo de Solow</strong> —la parte del crecimiento que no se explica por la acumulación de capital y trabajo— fue empíricamente muy grande en los estudios originales de Solow: aproximadamente el 87,5 % del crecimiento de la producción por hora en Estados Unidos (1909-1949) se debía al progreso técnico, y solo el 12,5 % a la acumulación de capital. Aunque estudios posteriores han refinado estas cifras, el mensaje central permanece: la tecnología es el motor del crecimiento.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. Economías de escala" icon="📈">
                <TheoryBlock title="5.1. Definición" color="purple">
                    <p>
                        Las <strong>economías de escala</strong> se producen cuando el <strong>coste medio</strong> (coste total dividido entre el número de unidades producidas) <strong>disminuye</strong> a medida que <strong>aumenta el volumen de producción</strong>. Es decir, producir más resulta más barato por unidad. Este fenómeno está directamente relacionado con el largo plazo, período en el que todos los factores productivos son variables y la empresa puede modificar su dimensión.
                    </p>
                </TheoryBlock>

                <FormulaBox formula="CMe = CT / Q" desc="Coste medio: si CMe ↓ cuando Q ↑ → economías de escala" />

                <TheoryBlock title="5.2. Economías de escala internas" color="blue">
                    <p>
                        Las economías de escala <strong>internas</strong> son aquellas que dependen del <strong>tamaño de la propia empresa</strong>. Se clasifican en varios tipos:
                    </p>
                    <p>
                        <strong>Técnicas:</strong> las empresas grandes pueden utilizar maquinaria más eficiente, costosa e indivisible (una cadena de montaje robotizada solo es rentable con un volumen de producción elevado). La relación entre capacidad y coste no es lineal: duplicar la capacidad de un tanque de almacenamiento, por ejemplo, no requiere duplicar la cantidad de acero (regla de los dos tercios en ingeniería).
                    </p>
                    <p>
                        <strong>Financieras:</strong> las grandes empresas obtienen <strong>mejores condiciones de financiación</strong> (tipos de interés más bajos, mayor acceso a los mercados de capitales, mejor calificación crediticia) porque representan un menor riesgo relativo para los prestamistas y tienen mayor capacidad de negociación.
                    </p>
                    <p>
                        <strong>Comerciales:</strong> las empresas grandes obtienen <strong>descuentos por volumen</strong> en la compra de materias primas y suministros (poder de negociación con proveedores), y pueden distribuir los costes fijos de marketing y publicidad entre un mayor número de unidades vendidas.
                    </p>
                    <p>
                        <strong>Administrativas:</strong> la <strong>división del trabajo gerencial</strong> permite que los directivos se especialicen en áreas funcionales (finanzas, marketing, producción, recursos humanos), lo que aumenta la eficiencia de la gestión. Las empresas pequeñas, en cambio, suelen concentrar múltiples funciones en unas pocas personas.
                    </p>
                    <p>
                        <strong>De riesgo:</strong> las grandes empresas pueden <strong>diversificar</strong> sus actividades (productos, mercados, áreas geográficas), lo que reduce el impacto de una caída en un mercado específico. La diversificación permite compensar pérdidas en unas áreas con beneficios en otras.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Economías de escala externas" color="green">
                    <p>
                        Las economías de escala <strong>externas</strong> son aquellas que benefician a las empresas como consecuencia del <strong>crecimiento del sector o de la zona geográfica</strong> en la que operan, y no del tamaño individual de cada empresa.
                    </p>
                    <p>
                        <strong>Alfred Marshall</strong> (1890) identificó tres fuentes principales de economías externas en los <strong>distritos industriales</strong>:
                    </p>
                    <p>
                        <strong>Aglomeración:</strong> la concentración de empresas del mismo sector en una zona geográfica genera una <strong>bolsa de trabajadores especializados</strong> que beneficia a todas las empresas (facilidad de contratación, menores costes de búsqueda, mayor movilidad laboral).
                    </p>
                    <p>
                        <strong>Proveedores especializados:</strong> la concentración de empresas atrae a <strong>proveedores especializados</strong> de inputs, componentes, servicios auxiliares (mantenimiento, logística, consultoría) y equipamiento, lo que reduce costes y mejora la calidad para todas las empresas del distrito.
                    </p>
                    <p>
                        <strong>Difusión del conocimiento (<em>knowledge spillovers</em>):</strong> la proximidad geográfica facilita la <strong>transmisión informal de ideas</strong>, conocimientos técnicos e innovaciones entre empresas, trabajadores e investigadores. Como escribió Marshall: <em>"Los misterios del oficio dejan de ser misterios; están, por así decirlo, en el aire"</em>.
                    </p>
                    <p>
                        Ejemplos actuales de distritos industriales con economías externas son <strong>Silicon Valley</strong> (tecnología), la <strong>City de Londres</strong> (finanzas), la <strong>comarca del Vinalopó</strong> (calzado en Alicante), <strong>Igualada</strong> (curtidos en Barcelona) y la <strong>Foia de Castalla</strong> (juguete en Alicante).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. Deseconomías de escala y dimensión óptima" icon="📉">
                <TheoryBlock title="6.1. Deseconomías de escala" color="red">
                    <p>
                        Las <strong>deseconomías de escala</strong> se producen cuando el coste medio <strong>aumenta</strong> a medida que la empresa crece más allá de cierto tamaño. A partir de un determinado volumen de producción, los costes de coordinación, comunicación y gestión superan las ventajas de la mayor dimensión:
                    </p>
                    <p>
                        <strong>Burocracia:</strong> las organizaciones muy grandes desarrollan estructuras jerárquicas complejas, con múltiples niveles de dirección, que ralentizan la toma de decisiones, generan ineficiencias y aumentan los costes administrativos.
                    </p>
                    <p>
                        <strong>Problemas de coordinación:</strong> a medida que la empresa crece, resulta más difícil coordinar las actividades de miles de trabajadores, departamentos y filiales. Los costes de comunicación interna, supervisión y control de calidad aumentan de forma más que proporcional.
                    </p>
                    <p>
                        <strong>Desmotivación:</strong> en las grandes organizaciones, los trabajadores pueden sentirse como <em>piezas anónimas</em> de un engranaje, lo que reduce su implicación, su iniciativa y su productividad. Los problemas de <strong>agencia</strong> (divergencia de intereses entre propietarios y gestores, o entre directivos y empleados) se agravan con el tamaño.
                    </p>
                    <p>
                        <strong>Rigidez:</strong> las grandes empresas tienden a ser menos ágiles para adaptarse a los cambios del mercado, a las nuevas tecnologías o a las preferencias cambiantes de los consumidores.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.2. La curva de coste medio a largo plazo y la dimensión mínima eficiente" color="blue">
                    <p>
                        La <strong>curva de coste medio a largo plazo (CMeLP)</strong> tiene forma de <strong>U</strong>: desciende mientras actúan las economías de escala, alcanza un mínimo y asciende cuando predominan las deseconomías. El punto mínimo de la curva CMeLP corresponde a la <strong>dimensión mínima eficiente (DME)</strong>: el nivel de producción a partir del cual la empresa ha agotado las economías de escala y opera al menor coste medio posible.
                    </p>
                    <p>
                        La <strong>DME</strong> tiene implicaciones fundamentales para la <strong>estructura de mercado</strong>:
                    </p>
                    <p>
                        Si la DME es <strong>grande</strong> en relación con el tamaño del mercado, solo caben pocas empresas eficientes → tendencia al <strong>oligopolio</strong> o incluso al <strong>monopolio natural</strong> (distribución de agua, red eléctrica, ferrocarril). En estos casos, es más eficiente que una sola empresa sirva a todo el mercado que tener varias compitiendo.
                    </p>
                    <p>
                        Si la DME es <strong>pequeña</strong> en relación con el tamaño del mercado, caben muchas empresas eficientes → tendencia a la <strong>competencia</strong> (restaurantes, peluquerías, comercio minorista).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.3. PYMES vs. grandes empresas" color="green">
                    <p>
                        El debate entre las ventajas de las <strong>PYMES</strong> (pequeñas y medianas empresas) y las <strong>grandes empresas</strong> es recurrente en la economía española, donde las PYMES representan más del 99 % del tejido empresarial y generan aproximadamente el 65 % del empleo.
                    </p>
                    <p>
                        Las <strong>grandes empresas</strong> disfrutan de economías de escala (menores costes unitarios), mayor capacidad de I+D+i, acceso a mercados internacionales, poder de negociación con proveedores y financiadores, y capacidad de atraer talento. Las <strong>PYMES</strong>, por su parte, son más <strong>flexibles</strong>, más <strong>ágiles</strong> para adaptarse a los cambios, generan mayor <strong>proximidad</strong> con el cliente, tienen menores problemas burocráticos y de coordinación, y suelen ser el caldo de cultivo de la <strong>innovación disruptiva</strong>.
                    </p>
                    <p>
                        En la práctica, la dimensión óptima depende del <strong>sector</strong>: en la industria del automóvil, la siderurgia o las telecomunicaciones, las economías de escala son enormes y la DME exige grandes corporaciones. En la hostelería, la artesanía, el comercio de proximidad o los servicios profesionales, la DME es pequeña y las PYMES son perfectamente competitivas. La política económica debe, por tanto, evitar un enfoque único y adaptar los instrumentos de apoyo a las características de cada sector.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 7 */}
            <Card title="7. Relevancia actual y aplicación docente" icon="🎓">
                <TheoryBlock title="7.1. La productividad como reto de la economía española" color="purple">
                    <p>
                        La <strong>productividad</strong> es, sin duda, el <strong>principal reto</strong> de la economía española. Mientras que la economía española ha demostrado capacidad para crear empleo en las fases expansivas del ciclo, la productividad por hora trabajada ha crecido a un ritmo inferior al de los principales socios europeos. Esta brecha se explica por una combinación de factores: insuficiente inversión en I+D+i, peso excesivo de sectores de baja productividad (construcción, hostelería), reducido tamaño medio de las empresas (predominio de microempresas con baja productividad), déficits de capital humano (desajuste entre formación y necesidades del mercado) y margen de mejora en la calidad institucional.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.2. Industria 4.0, automatización y teletrabajo" color="blue">
                    <p>
                        La <strong>Industria 4.0</strong> —la cuarta revolución industrial, basada en la digitalización, la inteligencia artificial, la robótica, el Internet de las Cosas (IoT) y el análisis de big data— está transformando radicalmente los procesos productivos y la productividad. La automatización de tareas rutinarias (tanto manuales como cognitivas) permite enormes ganancias de eficiencia, pero plantea desafíos para el empleo: las tareas más susceptibles de automatización son las repetitivas y codificables, mientras que las tareas creativas, de interacción social compleja y de resolución de problemas ambiguos son más difíciles de automatizar (<strong>David Autor</strong>, 2015).
                    </p>
                    <p>
                        El <strong>teletrabajo</strong>, acelerado por la pandemia de COVID-19, ha demostrado que, en muchos sectores de servicios, es posible mantener o incluso aumentar la productividad sin la presencia física en la oficina. Sin embargo, los efectos son heterogéneos: el teletrabajo puede mejorar la conciliación y reducir los desplazamientos, pero también puede generar aislamiento, dificultades de coordinación y dilución de la cultura organizativa.
                    </p>
                </TheoryBlock>

                        La <strong>economía digital</strong> presenta <strong>economías de escala extremas</strong>: los costes fijos de desarrollo de un software, una plataforma o un contenido digital son elevados, pero los <strong>costes marginales de reproducción y distribución son cercanos a cero</strong>. <strong>Jeremy Rifkin</strong> (<em>La sociedad de coste marginal cero</em>, 2014) argumenta que esta dinámica está transformando la estructura de la economía: las plataformas digitales (Google, Amazon, Netflix, Spotify) pueden servir a miles de millones de usuarios sin costes adicionales significativos, lo que genera tendencias naturales al monopolio o al oligopolio.
                    </p>
                    <p>
                        Las <strong>economías de red</strong> (también llamadas <strong>externalidades de red</strong>) refuerzan estas economías de escala: el valor de una plataforma para cada usuario aumenta con el número total de usuarios (WhatsApp, Facebook, LinkedIn). Estas dinámicas plantean desafíos regulatorios importantes relacionados con la competencia, la privacidad y la concentración del poder de mercado.

                    </p>
                    <p>
                        <strong>Progreso tecnológico:</strong> en el modelo de <strong>Solow</strong>, el progreso tecnológico (medido como la PTF o residuo de Solow) es la única fuente de crecimiento sostenido a largo plazo, una vez alcanzado el estado estacionario. <strong>Paul Romer</strong> (1986, 1990) desarrolló los modelos de <strong>crecimiento endógeno</strong>, en los que la I+D, la innovación y la acumulación de conocimiento generan rendimientos crecientes que permiten un crecimiento sostenido.
                    </p>
                    <p>
                        <strong>Recursos naturales:</strong> la dotación de recursos naturales (tierras fértiles, minerales, energía) puede facilitar el crecimiento, pero no es condición suficiente ni necesaria. Países como Japón o Suiza, con escasos recursos naturales, son muy prósperos, mientras que otros ricos en recursos (la <em>maldición de los recursos</em> o <em>enfermedad holandesa</em>) no han logrado un desarrollo sostenido.
                    </p>
                    <p>
                        <strong>Marco institucional:</strong> <strong>Douglass North</strong> (1990) y <strong>Daron Acemoglu</strong> (junto con James Robinson, <em>Por qué fracasan los países</em>, 2012) han demostrado que las instituciones —el estado de derecho, la protección de la propiedad, la estabilidad política, la calidad regulatoria, el control de la corrupción— son un determinante fundamental del crecimiento. Las instituciones <strong>inclusivas</strong> (que incentivan la participación, la innovación y la competencia) generan prosperidad; las instituciones <strong>extractivas</strong> (que concentran el poder y la riqueza en una élite) perpetúan el subdesarrollo.
                    </p>
                    <p>
                        <strong>Apertura comercial:</strong> el comercio internacional permite la especialización según la ventaja comparativa, amplía los mercados y favorece la transferencia de tecnología. <strong>Estabilidad macroeconómica:</strong> la inflación controlada, la disciplina fiscal y la estabilidad del tipo de cambio generan un entorno favorable para la inversión y el crecimiento.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. Teorías del crecimiento" icon="📚">
                <TheoryBlock title="3.1. Modelo clásico (Smith, Ricardo)" color="purple">
                    <p>
                        Los economistas clásicos concebían el crecimiento como un proceso de <strong>acumulación de capital</strong> impulsado por el ahorro y la inversión. <strong>Adam Smith</strong> (1776) identificó la <strong>división del trabajo</strong> (Tema 7) como la fuente principal de la riqueza de las naciones, y la <strong>acumulación de capital</strong> como el motor del proceso productivo. <strong>David Ricardo</strong> (1817), influido por Malthus, añadió un elemento pesimista: la <strong>ley de rendimientos decrecientes</strong> aplicada a la tierra conduciría inevitablemente a un <strong>estado estacionario</strong> en el que los beneficios se reducirían a cero y el crecimiento se detendría, porque los rendimientos decrecientes de la tierra limitarían la capacidad de alimentar a una población creciente.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Modelo de Harrod-Domar" color="blue">
                    <p>
                        El modelo de <strong>Harrod-Domar</strong> (Roy Harrod, 1939; Evsey Domar, 1946) fue el primer modelo formal de crecimiento económico del siglo XX. Su ecuación fundamental es:
                    </p>
                    <p>
                        <strong>g = s / v</strong>, donde g es la tasa de crecimiento del PIB, s es la tasa de ahorro (proporción de la renta dedicada al ahorro) y v es la <strong>relación capital-producto</strong> (ICOR: <em>Incremental Capital-Output Ratio</em>), es decir, cuántas unidades de capital se necesitan para producir una unidad adicional de output.
                    </p>
                    <p>
                        El modelo predice que <strong>los países que más ahorran e invierten crecerán más rápido</strong>. Aunque su simplicidad es atractiva, presenta limitaciones: supone proporciones fijas de factores (no hay sustitución entre capital y trabajo), no incorpora el progreso tecnológico y predice inestabilidad (el "filo de la navaja": cualquier desviación del equilibrio se amplifica en lugar de corregirse).
                    </p>
                </TheoryBlock>

                <FormulaBox formula="g = s / v" desc="Harrod-Domar: tasa de crecimiento = tasa de ahorro / relación capital-producto" />

                <TheoryBlock title="3.3. Modelo de Solow (1956)" color="green">
                    <p>
                        El modelo de <strong>Robert Solow</strong> (1956), también conocido como modelo neoclásico de crecimiento, supuso una revolución en la teoría del crecimiento. Su <strong>función de producción neoclásica</strong> presenta las siguientes características: rendimientos constantes a escala, rendimientos decrecientes de cada factor, sustituibilidad entre capital y trabajo, y progreso tecnológico exógeno.
                    </p>
                    <p>
                        El modelo predice la existencia de un <strong>estado estacionario</strong> (o de crecimiento equilibrado): la economía converge hacia un nivel de capital por trabajador en el que la inversión bruta es igual a la depreciación más el crecimiento de la población. En el estado estacionario, el PIB per cápita crece <strong>solo</strong> si hay progreso tecnológico. Sin progreso tecnológico, la acumulación de capital no puede sostener el crecimiento a largo plazo (rendimientos decrecientes).
                    </p>
                    <p>
                        Una implicación fundamental del modelo es la <strong>convergencia condicional</strong>: los países más pobres (con menor capital por trabajador) deberían crecer más rápido que los ricos, convergiendo hacia el mismo nivel de PIB per cápita, <em>siempre que</em> compartan las mismas características estructurales (tasa de ahorro, crecimiento demográfico, tecnología, instituciones). La evidencia empírica apoya la convergencia entre países con características similares (los países de la OCDE) pero no entre todos los países del mundo (los más pobres no convergen con los más ricos), lo que refleja diferencias institucionales y tecnológicas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Crecimiento endógeno (Romer, Lucas)" color="amber">
                    <p>
                        Los modelos de <strong>crecimiento endógeno</strong>, desarrollados a partir de los trabajos de <strong>Paul Romer</strong> (1986, 1990) y <strong>Robert Lucas</strong> (1988), superan la principal limitación del modelo de Solow: el progreso tecnológico ya no es exógeno (un "maná caído del cielo"), sino que es <strong>endógeno</strong>, es decir, el resultado de decisiones deliberadas de inversión en I+D, capital humano y acumulación de conocimiento.
                    </p>
                    <p>
                        Romer argumentó que el <strong>conocimiento</strong> es un bien parcialmente no rival y no excluible: cuando una empresa invierte en I+D, genera innovaciones que, a través de <strong>externalidades positivas</strong> (<em>knowledge spillovers</em>), benefician también a otras empresas y a la sociedad en su conjunto. Estas externalidades generan <strong>rendimientos crecientes a escala</strong> a nivel agregado, lo que permite un crecimiento sostenido sin necesidad de un progreso tecnológico exógeno.
                    </p>
                    <p>
                        Lucas (1988) enfatizó el papel del <strong>capital humano</strong>: la acumulación de conocimientos y habilidades por parte de los trabajadores genera externalidades positivas (un trabajador más formado eleva la productividad de todos los que trabajan con él), lo que también produce rendimientos crecientes a nivel agregado.
                    </p>
                    <p>
                        La principal implicación de política económica de estos modelos es que la <strong>inversión pública en I+D, educación e infraestructuras del conocimiento</strong> puede elevar la tasa de crecimiento de forma permanente, no solo de forma transitoria como en el modelo de Solow. Esto justifica las políticas activas de innovación, los incentivos fiscales a la I+D, la financiación pública de la ciencia y la protección (temporal) de la propiedad intelectual mediante patentes.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. Desarrollo vs. subdesarrollo" icon="🌍">
                <TheoryBlock title="4.1. El desarrollo como proceso multidimensional" color="purple">
                    <p>
                        El <strong>desarrollo</strong> es un concepto más amplio que el crecimiento económico. Mientras que el crecimiento se refiere al aumento cuantitativo de la producción (más PIB), el desarrollo es un <strong>proceso multidimensional</strong> que incluye mejoras cualitativas en las condiciones de vida: reducción de la pobreza, mejora de la salud y la esperanza de vida, acceso a la educación, igualdad de género, participación política, libertades civiles, sostenibilidad ambiental y bienestar social.
                    </p>
                    <p>
                        <strong>Amartya Sen</strong> (Premio Nobel 1998), en su obra <em>Desarrollo como libertad</em> (1999), define el desarrollo como el <strong>proceso de ampliación de las libertades reales</strong> que disfrutan las personas. Según Sen, la pobreza no es solo falta de renta, sino falta de <strong>capacidades</strong>: la capacidad de estar sano, de estar educado, de participar en la vida comunitaria, de expresarse libremente. El desarrollo consiste en eliminar las <strong>fuentes de privación de libertad</strong>: la pobreza, la tiranía, la falta de oportunidades económicas, la privación social, la negligencia de los servicios públicos y la intolerancia.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Características del subdesarrollo" color="red">
                    <p>
                        Los países subdesarrollados —o en vías de desarrollo, según la terminología más reciente— comparten una serie de <strong>características estructurales</strong>, aunque con gran heterogeneidad entre ellos:
                    </p>
                    <p>
                        <strong>Baja renta per cápita:</strong> el PIB per cápita de los países de ingreso bajo (según la clasificación del Banco Mundial) es inferior a 1.135 dólares anuales, frente a más de 50.000 en los países de ingreso alto.
                    </p>
                    <p>
                        <strong>Pobreza extendida:</strong> aunque la pobreza extrema (menos de 2,15 dólares diarios, umbral del Banco Mundial actualizado en 2022) se ha reducido drásticamente en las últimas décadas (del 36 % de la población mundial en 1990 al 9 % en 2019), todavía afecta a más de 700 millones de personas, concentradas principalmente en el África subsahariana y el sur de Asia.
                    </p>
                    <p>
                        <strong>Desigualdad:</strong> los países subdesarrollados suelen presentar una distribución de la renta más desigual que los desarrollados (coeficientes de Gini más elevados). <strong>Déficits educativos y sanitarios:</strong> menor esperanza de vida, mayor mortalidad infantil, menor escolarización, menor acceso a servicios sanitarios. <strong>Dependencia económica:</strong> estructura productiva concentrada en materias primas o productos de bajo valor añadido, dependencia de las exportaciones de pocos productos y de los flujos de capital exterior. <strong>Inestabilidad política:</strong> conflictos, corrupción, debilidad institucional. <strong>Deuda externa:</strong> endeudamiento que limita la capacidad de inversión en desarrollo.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Clasificación internacional" color="blue">
                    <p>
                        El <strong>Banco Mundial</strong> clasifica los países según su <strong>renta nacional bruta (RNB) per cápita</strong> en cuatro categorías (umbrales actualizados anualmente): <strong>ingreso bajo</strong> (≤ 1.135 $), <strong>ingreso medio-bajo</strong> (1.136-4.465 $), <strong>ingreso medio-alto</strong> (4.466-13.845 $) e <strong>ingreso alto</strong> (≥ 13.846 $). Esta clasificación, aunque útil, no captura las dimensiones no económicas del desarrollo.
                    </p>
                    <p>
                        El <strong>PNUD</strong> clasifica los países según el <strong>IDH</strong>: desarrollo humano muy alto (≥ 0,800), alto (0,700-0,799), medio (0,550-0,699) y bajo (&lt; 0,550). En el informe de 2023-2024, los primeros puestos corresponden a Suiza, Noruega, Islandia, Hong Kong y Dinamarca; España ocupa aproximadamente el puesto 27. Los últimos puestos son ocupados por países del África subsahariana como Somalia, Chad, Níger y República Centroafricana.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. Causas del subdesarrollo" icon="🔗">
                <TheoryBlock title="5.1. Factores históricos y dependencia" color="purple">
                    <p>
                        El <strong>colonialismo</strong> es una causa histórica fundamental del subdesarrollo. Las potencias coloniales europeas (España, Portugal, Reino Unido, Francia, Países Bajos, Bélgica) explotaron los recursos naturales y la mano de obra de sus colonias durante siglos, estableciendo estructuras económicas y sociales orientadas a la extracción y la exportación de materias primas, no al desarrollo interno. La <strong>teoría de la dependencia</strong> (Raúl Prebisch, André Gunder Frank, Samir Amin) argumenta que el subdesarrollo no es un estado inicial del que los países evolucionan naturalmente, sino el resultado de una <strong>relación desigual</strong> entre el "centro" (países desarrollados) y la "periferia" (países subdesarrollados).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. La trampa de la pobreza y el círculo vicioso" color="red">
                    <p>
                        <strong>Jeffrey Sachs</strong> (<em>El fin de la pobreza</em>, 2005) desarrolló el concepto de <strong>trampa de la pobreza</strong>: los países más pobres carecen de los recursos mínimos necesarios para iniciar el proceso de desarrollo. Sin ahorro no hay inversión; sin inversión no hay crecimiento; sin crecimiento no hay ahorro. Esta dinámica se autorrefuerza en un ciclo que solo puede romperse con una inyección masiva de ayuda externa.
                    </p>
                    <p>
                        <strong>Ragnar Nurkse</strong> (1953) formalizó el <strong>círculo vicioso de la pobreza</strong>: baja renta → bajo ahorro → baja inversión → baja productividad → baja renta. Este círculo opera tanto por el lado de la oferta (baja capacidad productiva) como por el de la demanda (bajo poder adquisitivo → mercados reducidos → falta de incentivos para invertir).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Factores geográficos e institucionales" color="blue">
                    <p>
                        <strong>Jared Diamond</strong> (<em>Armas, gérmenes y acero</em>, 1997) argumentó que las diferencias geográficas (clima, acceso al mar, diversidad de especies domesticables) influyeron decisivamente en la trayectoria histórica de las civilizaciones. <strong>Jeffrey Sachs</strong> también ha enfatizado los factores geográficos: los países tropicales enfrentan mayores dificultades agrícolas (suelos menos fértiles), sanitarias (malaria, enfermedades tropicales) y logísticas (falta de ríos navegables, aislamiento).
                    </p>
                    <p>
                        Sin embargo, <strong>Daron Acemoglu</strong> y <strong>James Robinson</strong> (<em>Por qué fracasan los países</em>, 2012) argumentan que los factores <strong>institucionales</strong> son más determinantes que los geográficos. Su tesis central distingue entre <strong>instituciones inclusivas</strong> (que protegen la propiedad, garantizan contratos, permiten la participación política y económica amplia, incentivan la innovación) e <strong>instituciones extractivas</strong> (que concentran el poder en una élite, extraen recursos de la mayoría, desincentivan la inversión y la innovación). Los países con instituciones inclusivas prosperan; los que tienen instituciones extractivas se estancan o retroceden.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Corrupción y deterioro de los términos de intercambio" color="amber">
                    <p>
                        La <strong>corrupción</strong> y la <strong>mala gobernanza</strong> son obstáculos centrales al desarrollo: desvían recursos públicos de la inversión productiva, desincentivan la inversión privada (especialmente la extranjera), distorsionan la asignación de recursos y erosionan la confianza de los ciudadanos en las instituciones.
                    </p>
                    <p>
                        La <strong>tesis de Prebisch-Singer</strong> (formulada independientemente por Raúl Prebisch y Hans Singer en 1950) sostiene que existe una tendencia secular al <strong>deterioro de los términos de intercambio</strong> de los países exportadores de materias primas: los precios de las materias primas tienden a caer en relación con los precios de los productos manufacturados a largo plazo. Si un país exporta café y importa maquinaria, necesitará exportar cada vez más café para importar la misma cantidad de maquinaria. Esta dinámica perpetúa la dependencia y la desigualdad entre países productores de materias primas y países industrializados.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. Estrategias de desarrollo" icon="🗺️">
                <TheoryBlock title="6.1. Industrialización por sustitución de importaciones (ISI)" color="purple">
                    <p>
                        La <strong>industrialización por sustitución de importaciones (ISI)</strong> fue la estrategia de desarrollo dominante en América Latina y otros países en desarrollo entre las décadas de 1950 y 1980. Promovida por <strong>Raúl Prebisch</strong> y la <strong>CEPAL</strong> (Comisión Económica para América Latina y el Caribe), la ISI consistía en proteger la industria nacional mediante aranceles elevados, cuotas a la importación y subsidios, con el objetivo de sustituir las importaciones de productos manufacturados por producción nacional.
                    </p>
                    <p>
                        La ISI logró algunos éxitos iniciales (desarrollo de una base industrial en Brasil, México, Argentina), pero a largo plazo generó ineficiencias: industrias protegidas de la competencia que no mejoraban su productividad, precios altos para los consumidores, déficits comerciales crónicos y búsqueda de rentas (<em>rent-seeking</em>). La mayoría de los países abandonaron esta estrategia en los años 80 y 90.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.2. Promoción de exportaciones y los tigres asiáticos" color="blue">
                    <p>
                        La estrategia alternativa —la <strong>promoción de exportaciones</strong>— fue adoptada con enorme éxito por los <strong>tigres asiáticos</strong> (Corea del Sur, Taiwán, Singapur, Hong Kong) a partir de los años 60, y posteriormente por China. Esta estrategia consiste en orientar la producción hacia los mercados internacionales, aprovechando la ventaja comparativa (inicialmente en productos intensivos en mano de obra barata) e invirtiendo masivamente en educación, infraestructuras y tecnología para ascender en la cadena de valor.
                    </p>
                    <p>
                        Corea del Sur es el ejemplo más espectacular: en 1960 tenía un PIB per cápita similar al de Ghana; en 2024, es miembro de la OCDE, una potencia tecnológica mundial y tiene un PIB per cápita superior al de España. Este <em>milagro</em> se explica por una combinación de inversión masiva en educación, política industrial estratégica, apertura gradual al comercio, estabilidad macroeconómica y un Estado desarrollista fuerte.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.3. Ayuda oficial al desarrollo (AOD)" color="green">
                    <p>
                        La <strong>Ayuda Oficial al Desarrollo (AOD)</strong> comprende los flujos financieros de los gobiernos de los países desarrollados hacia los países en desarrollo, con el objetivo de promover el desarrollo económico y social. La ONU fijó como objetivo que los países desarrollados destinaran el <strong>0,7 % de su RNB</strong> a AOD, pero solo unos pocos (Suecia, Noruega, Luxemburgo, Dinamarca, Alemania) alcanzan esta cifra; España se sitúa en torno al 0,2-0,3 %.
                    </p>
                    <p>
                        La eficacia de la ayuda es objeto de un intenso debate. <strong>Jeffrey Sachs</strong> defiende que una ayuda masiva y bien dirigida puede romper la trampa de la pobreza (el "Big Push"). <strong>William Easterly</strong> (<em>The White Man's Burden</em>, 2006) argumenta que la ayuda suele ser ineficaz porque no tiene en cuenta las realidades locales, genera dependencia, alimenta la corrupción y sustituye la iniciativa local. <strong>Dambisa Moyo</strong> (<em>Dead Aid</em>, 2009) va más lejos al afirmar que la ayuda ha sido contraproducente para África.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.4. Microcréditos y los ODS" color="amber">
                    <p>
                        Los <strong>microcréditos</strong> —pequeños préstamos concedidos a personas pobres que no tienen acceso al sistema bancario convencional— fueron popularizados por <strong>Muhammad Yunus</strong> y el <strong>Grameen Bank</strong> (Bangladesh), fundado en 1983. Yunus recibió el Premio Nobel de la Paz en 2006. Los microcréditos permiten a los más pobres iniciar pequeñas actividades económicas (un puesto de venta, una máquina de coser, ganado), generar ingresos y mejorar sus condiciones de vida. Sin embargo, su impacto a gran escala ha sido cuestionado por algunos estudios que señalan tasas de interés elevadas y un impacto limitado en la reducción de la pobreza agregada.
                    </p>
                    <p>
                        Los <strong>Objetivos de Desarrollo Sostenible (ODS)</strong>, adoptados por la Asamblea General de la ONU en 2015 como parte de la <strong>Agenda 2030</strong>, constituyen el marco de referencia actual para las políticas de desarrollo. Los 17 ODS abordan los principales desafíos globales: <strong>ODS 1</strong> (fin de la pobreza), <strong>ODS 2</strong> (hambre cero), <strong>ODS 3</strong> (salud y bienestar), <strong>ODS 4</strong> (educación de calidad), <strong>ODS 8</strong> (trabajo decente y crecimiento económico), <strong>ODS 10</strong> (reducción de las desigualdades), entre otros.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.5. Consenso de Washington vs. Post-Consenso" color="violet">
                    <p>
                        El <strong>Consenso de Washington</strong> (término acuñado por John Williamson en 1989) designa el conjunto de políticas económicas recomendadas por el FMI y el Banco Mundial a los países en desarrollo en los años 80 y 90: disciplina fiscal, liberalización comercial, privatización de empresas públicas, desregulación, apertura a la inversión extranjera y protección de la propiedad privada. Estas políticas, de orientación neoliberal, fueron criticadas por <strong>Joseph Stiglitz</strong> (Premio Nobel 2001) y otros economistas por su rigidez, su insensibilidad a las condiciones locales y sus efectos negativos sobre la desigualdad y los servicios públicos.
                    </p>
                    <p>
                        El <strong>Post-Consenso de Washington</strong> (Stiglitz, 1998) y los enfoques más recientes enfatizan la importancia de las <strong>instituciones</strong>, la <strong>inversión en capital humano</strong>, la <strong>protección social</strong>, la <strong>lucha contra la desigualdad</strong> y la <strong>sostenibilidad ambiental</strong> como complementos necesarios de la estabilidad macroeconómica y la apertura comercial.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 7 */}
            <Card title="7. El debate crecimiento vs. sostenibilidad" icon="🌿">
                <TheoryBlock title="7.1. Los límites del crecimiento" color="green">
                    <p>
                        El informe <em>Los límites del crecimiento</em> (<strong>Club de Roma</strong>, 1972), elaborado por <strong>Donella y Dennis Meadows</strong> y un equipo del MIT, utilizó modelos informáticos para simular la interacción entre crecimiento económico, crecimiento demográfico, producción de alimentos, industrialización y contaminación. Su conclusión fue alarmante: si las tendencias de crecimiento exponencial continuaban sin cambios, los límites del planeta se alcanzarían en algún momento del siglo XXI, provocando un colapso económico y demográfico.
                    </p>
                    <p>
                        Aunque las predicciones más catastrofistas no se han cumplido (el progreso tecnológico, la eficiencia energética y la transición demográfica han atenuado los escenarios más pesimistas), el mensaje fundamental del informe conserva plena vigencia: un crecimiento material exponencial e ilimitado es <strong>físicamente imposible</strong> en un planeta con recursos finitos y capacidad limitada de absorción de residuos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.2. Decrecimiento y economía ecológica" color="emerald">
                    <p>
                        El movimiento del <strong>decrecimiento</strong> (décroissance), liderado por pensadores como <strong>Serge Latouche</strong> y con raíces en la obra de <strong>Nicholas Georgescu-Roegen</strong> (<em>The Entropy Law and the Economic Process</em>, 1971), propone una reducción planificada y democrática de la producción y el consumo material en los países ricos, para reducir la huella ecológica a niveles compatibles con los límites planetarios. El decrecimiento no significa recesión (una contracción involuntaria y desordenada), sino una <strong>reorganización consciente</strong> de la economía hacia la suficiencia, la calidad de vida, la equidad y la sostenibilidad.
                    </p>
                    <p>
                        <strong>Herman Daly</strong>, uno de los fundadores de la <strong>economía ecológica</strong>, propone el concepto de <strong>economía de estado estacionario</strong> (<em>steady-state economy</em>): una economía que mantiene un nivel de producción y consumo constante (compatible con la capacidad de regeneración de los ecosistemas) pero que sigue mejorando cualitativamente (mejor tecnología, mejor distribución, mayor bienestar). La clave no es <em>más</em>, sino <em>mejor</em>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.3. La economía rosquilla y el crecimiento verde" color="amber">
                    <p>
                        <strong>Kate Raworth</strong> (<em>Economía rosquilla</em>, 2017) propone un modelo visual poderoso: la humanidad debe operar dentro de un espacio seguro y justo delimitado por dos fronteras. El <strong>suelo social</strong> (la rosquilla interior) representa las necesidades básicas que deben satisfacerse para todos (alimentación, salud, educación, vivienda, igualdad, participación política, etc., basadas en los ODS). El <strong>techo ecológico</strong> (la rosquilla exterior) representa los límites planetarios que no deben sobrepasarse (cambio climático, acidificación oceánica, pérdida de biodiversidad, uso del suelo, etc., basados en el marco de Johan Rockström). El objetivo del desarrollo no es el crecimiento indefinido del PIB, sino <strong>operar dentro de la rosquilla</strong>: satisfacer las necesidades de todos sin sobrepasar los límites del planeta.
                    </p>
                    <p>
                        El concepto de <strong>crecimiento verde</strong> y de <strong>economía circular</strong> busca compatibilizar el crecimiento económico con la sostenibilidad ambiental: producir más con menos recursos, reducir residuos, reciclar, reutilizar y diseñar productos para la durabilidad y la reparabilidad. La UE ha adoptado el <strong>Pacto Verde Europeo</strong> (2019) con el objetivo de alcanzar la neutralidad climática en 2050.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.4. Aplicación docente y curricular" color="blue">
                    <p>
                        Los contenidos de este tema se conectan directamente con los <strong>ODS</strong>, especialmente: <strong>ODS 1</strong> (fin de la pobreza), <strong>ODS 8</strong> (trabajo decente y crecimiento económico), <strong>ODS 10</strong> (reducción de las desigualdades), <strong>ODS 12</strong> (producción y consumo responsables) y <strong>ODS 13</strong> (acción por el clima). La LOMLOE incluye explícitamente el desarrollo sostenible como eje transversal del currículo.
                    </p>
                    <p>
                        <strong>Actividades propuestas:</strong> (1) Comparar el PIB per cápita y el IDH de varios países (datos del Banco Mundial y PNUD) y analizar las discrepancias. (2) Calcular la tasa de crecimiento del PIB real de España en los últimos 20 años e identificar las fases del ciclo económico. (3) Debate: ¿es posible un crecimiento económico ilimitado en un planeta finito? Argumentos del crecimiento verde vs. decrecimiento. (4) Estudio de caso: los "tigres asiáticos" como modelo de desarrollo. (5) Análisis del círculo vicioso de la pobreza de Nurkse con un diagrama. (6) Reflexión sobre la economía rosquilla de Raworth: ¿España está dentro de la rosquilla?
                    </p>

            <Card title="Conclusión" icon="✅">

                    <p>
                        El crecimiento económico ha sido el motor de la transformación más profunda de la historia de la humanidad: en apenas dos siglos, la producción mundial se ha multiplicado exponencialmente, la esperanza de vida se ha más que duplicado, la pobreza extrema se ha reducido drásticamente y el acceso a la educación, la salud y la tecnología se ha extendido a una proporción sin precedentes de la población mundial.
                    </p>
                    <p>
                        Sin embargo, este crecimiento ha sido profundamente desigual. La distinción entre crecimiento (cuantitativo) y desarrollo (cualitativo, multidimensional) es esencial para comprender por qué algunos países han logrado traducir el crecimiento en bienestar generalizado y otros no. Las causas del subdesarrollo son complejas y multicausales: factores históricos (colonialismo, dependencia), económicos (trampa de la pobreza, deterioro de los términos de intercambio), geográficos (clima, recursos), institucionales (extractividad, corrupción) y de gobernanza se combinan para perpetuar la pobreza en muchas regiones del mundo.
                    </p>
                    <p>
                        Las teorías del crecimiento —desde el modelo clásico de Smith y Ricardo, pasando por Harrod-Domar y Solow, hasta el crecimiento endógeno de Romer y Lucas— proporcionan un marco analítico cada vez más sofisticado para entender las fuentes del crecimiento y diseñar políticas eficaces. Las estrategias de desarrollo han evolucionado desde la ISI hasta la promoción de exportaciones, pasando por el Consenso de Washington y llegando a los enfoques actuales que enfatizan las instituciones, el capital humano, la sostenibilidad y los ODS.
                    </p>
                    <p>
                        El gran desafío del siglo XXI es compatibilizar el crecimiento económico necesario para erradicar la pobreza y mejorar la vida de miles de millones de personas con los <strong>límites ecológicos del planeta</strong>. La economía rosquilla de Kate Raworth ofrece una metáfora poderosa: el objetivo no es crecer sin límite, sino operar dentro del espacio seguro y justo entre el suelo social y el techo ecológico. El futuro docente de Economía tiene la responsabilidad de transmitir estos conceptos con rigor, espíritu crítico y compromiso con la justicia y la sostenibilidad.
                    </p>
                </div>

            <Card title="1. Demografía y economía" icon="📘">

                    <p>
                        La <strong>demografía</strong> es la ciencia que estudia las poblaciones humanas en su dimensión cuantitativa: tamaño, estructura, distribución y dinámica. Para el análisis económico, los indicadores demográficos fundamentales son los siguientes:
                    </p>
                    <p>
                        <strong>Tasa bruta de natalidad (TBN):</strong> número de nacimientos por cada 1.000 habitantes en un año. Refleja la capacidad reproductiva de una sociedad y está influida por factores culturales, económicos (coste de crianza), institucionales (políticas de conciliación) y biológicos. <strong>Tasa bruta de mortalidad (TBM):</strong> número de defunciones por cada 1.000 habitantes en un año. <strong>Tasa de fecundidad:</strong> número medio de hijos por mujer en edad fértil (15-49 años). La tasa de reemplazo generacional se sitúa en torno a 2,1 hijos por mujer. <strong>Esperanza de vida al nacer:</strong> número medio de años que viviría un recién nacido si se mantuvieran las tasas de mortalidad actuales. <strong>Saldo migratorio:</strong> diferencia entre inmigrantes y emigrantes en un período determinado.
                    </p>
                    <p>
                        El <strong>crecimiento natural o vegetativo</strong> de la población se calcula como la diferencia entre nacimientos y defunciones (TBN − TBM), mientras que el <strong>crecimiento total</strong> añade el saldo migratorio.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. La transición demográfica" color="blue">
                    <p>
                        La <strong>teoría de la transición demográfica</strong>, formulada originalmente por Warren Thompson (1929) y Frank Notestein (1945), describe el proceso histórico por el que las sociedades pasan de un régimen demográfico antiguo (alta natalidad y alta mortalidad) a uno moderno (baja natalidad y baja mortalidad). Este proceso se divide en cuatro fases:
                    </p>
                    <p>
                        <strong>Fase 1 (régimen demográfico antiguo):</strong> alta natalidad y alta mortalidad, crecimiento vegetativo bajo o nulo. Corresponde a las sociedades preindustriales. <strong>Fase 2 (primera transición):</strong> la mortalidad desciende drásticamente (mejoras sanitarias, alimentarias, higiénicas) mientras la natalidad permanece alta → fuerte crecimiento demográfico (explosión demográfica). <strong>Fase 3 (segunda transición):</strong> la natalidad desciende gradualmente (urbanización, educación femenina, acceso a métodos anticonceptivos, incorporación de la mujer al mercado laboral) → el crecimiento se desacelera. <strong>Fase 4 (régimen demográfico moderno):</strong> baja natalidad y baja mortalidad → crecimiento vegetativo bajo o incluso negativo. Es la situación actual de los países desarrollados.
                    </p>
                    <p>
                        Algunos demógrafos añaden una <strong>quinta fase</strong> (segunda transición demográfica), caracterizada por tasas de fecundidad muy por debajo del nivel de reemplazo, retraso en la edad del matrimonio y la maternidad, diversificación de las formas familiares y envejecimiento acelerado de la población.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. La pirámide de población" color="green">

                        La <strong>pirámide de población</strong> es una representación gráfica de la estructura de una población por edad y sexo. Existen tres tipos principales: <strong>Pirámide expansiva</strong> (o pagoda): base ancha y cúspide estrecha, típica de países en fase 2 de la transición demográfica, con alta natalidad y población joven (ej.: Níger, Mali). <strong>Pirámide estacionaria</strong> (o campana): forma relativamente uniforme, típica de países en fase 3, con natalidad y mortalidad moderadas (ej.: algunos países de Latinoamérica). <strong>Pirámide regresiva</strong> (o urna invertida): base estrecha y parte central y superior abultada, típica de países en fase 4-5, con baja natalidad y envejecimiento (ej.: Japón, Alemania, España).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. El envejecimiento de la población" color="amber">
                    <p>
                        El <strong>envejecimiento de la población</strong> es uno de los fenómenos demográficos más relevantes del siglo XXI. Sus causas principales son la caída de la fecundidad (menos jóvenes) y el aumento de la esperanza de vida (más mayores). Las consecuencias económicas son profundas: aumento del <strong>gasto en pensiones</strong> (más pensionistas, menos cotizantes), incremento del <strong>gasto sanitario y en dependencia</strong>, reducción de la <strong>población activa</strong> (menor oferta de trabajo), posible caída del <strong>ahorro agregado</strong> (hipótesis del ciclo vital de Modigliani) y presión sobre las <strong>finanzas públicas</strong>.
                    </p>
                    <p>
                        La <strong>tasa de dependencia</strong> (población menor de 16 + mayor de 65 / población en edad de trabajar) es un indicador clave: cuanto mayor sea, más personas dependientes debe sostener cada trabajador. En España, esta ratio se ha deteriorado notablemente y seguirá haciéndolo según las proyecciones del INE.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.5. Inmigración, emigración e impacto económico" color="pink">
                    <p>
                        Las <strong>migraciones</strong> —movimientos de población entre territorios— tienen un impacto económico significativo tanto en los países de origen como en los de destino. Para los <strong>países receptores</strong>: aumento de la oferta de trabajo (especialmente en sectores con escasez de mano de obra), contribución al crecimiento del PIB, aporte a la Seguridad Social, rejuvenecimiento de la pirámide de población, diversidad cultural e innovación. Para los <strong>países de origen</strong>: pérdida de capital humano (fuga de cerebros), pero también remesas (transferencias de dinero de los emigrantes a sus familias, que representan más del 5% del PIB en muchos países en desarrollo) y transferencia de conocimiento en caso de retorno.
                    </p>
