            {/* Epígrafe 1 */}
            <Card title="1. Concepto de agente económico" icon="📘">
                <TheoryBlock title="1.1. Definición y clasificación" color="purple">
                    <p>
                        Un <strong>agente económico</strong> puede definirse como toda <strong>unidad de decisión que participa en la actividad económica</strong>, ya sea produciendo, consumiendo, ahorrando, invirtiendo, regulando o intercambiando bienes, servicios y factores productivos. Los agentes económicos son los protagonistas de la vida económica: sus decisiones individuales, agregadas e interrelacionadas, determinan las variables macroeconómicas fundamentales (PIB, empleo, inflación, tipo de interés).
                    </p>
                    <p>
                        La clasificación más habitual en la teoría económica distingue <strong>cuatro grandes grupos</strong> de agentes:
                    </p>
                    <p>
                        <strong>1. Las economías domésticas (familias u hogares):</strong> son las unidades básicas de consumo. Ofrecen factores productivos (trabajo, capital, tierra) y demandan bienes y servicios para satisfacer sus necesidades.
                    </p>
                    <p>
                        <strong>2. Las empresas:</strong> son las unidades de producción. Demandan factores productivos y ofrecen bienes y servicios en los mercados.
                    </p>
                    <p>
                        <strong>3. El sector público (Estado):</strong> actúa simultáneamente como productor, regulador y redistribuidor. Recauda impuestos, provee bienes y servicios públicos y ejecuta políticas de estabilización.
                    </p>
                    <p>
                        <strong>4. El sector exterior (resto del mundo):</strong> incluye a todos los agentes económicos que operan fuera de las fronteras nacionales y con los que se mantienen relaciones comerciales y financieras.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Comportamiento racional y sus limitaciones" color="blue">
                    <p>
                        El modelo económico estándar asume que los agentes actúan con <strong>racionalidad económica</strong>: las familias buscan maximizar su utilidad o bienestar, las empresas buscan maximizar su beneficio, y el sector público persigue (teóricamente) el bienestar social. Este supuesto de racionalidad, heredado de la tradición neoclásica, permite construir modelos formales de comportamiento y derivar predicciones contrastables.
                    </p>
                    <p>
                        Sin embargo, como ya se señaló en los Temas 1 y 2, la racionalidad perfecta ha sido cuestionada por diversas corrientes. <strong>Herbert Simon</strong> (Premio Nobel 1978) introdujo el concepto de <strong>racionalidad limitada</strong>: los agentes no optimizan de forma perfecta, sino que buscan soluciones "suficientemente buenas" (<em>satisficing</em>), condicionados por limitaciones cognitivas, de información y de tiempo. <strong>Daniel Kahneman</strong> (Premio Nobel 2002) y <strong>Amos Tversky</strong> demostraron la existencia de sesgos cognitivos sistemáticos que alejan las decisiones reales de las predicciones del modelo racional.
                    </p>
                    <p>
                        En la Economía institucional, <strong>Douglass North</strong> (Premio Nobel 1993) subrayó que el comportamiento de los agentes no puede entenderse al margen del <strong>marco institucional</strong> (reglas formales e informales, normas sociales, cultura) en el que operan. Las instituciones condicionan los incentivos, las expectativas y las posibilidades de acción de todos los agentes económicos.
                    </p>
                </TheoryBlock>

            {/* Epígrafe 2 */}
            <Card title="2. Las economías domésticas (familias)" icon="🏠">
                <TheoryBlock title="2.1. Doble papel en la economía" color="purple">
                    <p>
                        Las <strong>economías domésticas</strong> (también denominadas hogares o familias en sentido económico) desempeñan un <strong>doble papel</strong> fundamental en el sistema económico:
                    </p>
                    <p>
                        <strong>Como oferentes de factores productivos:</strong> las familias ofrecen su trabajo (fuerza laboral), su capital (ahorros canalizados a través del sistema financiero), su tierra (propiedades inmobiliarias, terrenos) y su capacidad empresarial al mercado de factores productivos. A cambio, reciben rentas: salarios por el trabajo, intereses por el capital prestado, alquileres por la tierra y beneficios por la actividad empresarial.
                    </p>
                    <p>
                        <strong>Como demandantes de bienes y servicios:</strong> con las rentas obtenidas, las familias adquieren bienes y servicios en el mercado de bienes para satisfacer sus necesidades. El <strong>consumo privado</strong> es, de hecho, el componente más importante de la demanda agregada en la mayoría de las economías: en España, representa aproximadamente el 55-60 % del PIB; en Estados Unidos, supera el 68 %.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Objetivo: maximizar la utilidad" color="blue">
                    <p>
                        Según la teoría microeconómica neoclásica, el objetivo de las familias es <strong>maximizar su utilidad</strong> (bienestar o satisfacción) sujeta a su <strong>restricción presupuestaria</strong>. La restricción presupuestaria establece que el gasto total de una familia no puede superar sus ingresos totales (más la capacidad de endeudamiento y los ahorros previos).
                    </p>
                    <p>
                        Las familias toman dos tipos de decisiones económicas fundamentales: (1) decisiones de <strong>consumo</strong>: cómo distribuir su renta disponible entre los distintos bienes y servicios que desean; y (2) decisiones de <strong>ahorro</strong>: qué proporción de su renta destinan al consumo presente y qué proporción reservan para el consumo futuro (ahorro). Esta última decisión está estrechamente ligada al tipo de interés: un tipo de interés más alto incentiva el ahorro (el consumo futuro se "abarata" respecto al presente).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Fuentes de renta y función de consumo" color="green">
                    <p>
                        Las principales <strong>fuentes de renta</strong> de las familias son: (a) <strong>rentas del trabajo</strong> (salarios y sueldos), que constituyen la fuente más importante para la mayoría de los hogares; (b) <strong>rentas del capital</strong> (intereses de depósitos, dividendos de acciones, plusvalías); (c) <strong>rentas de la propiedad</strong> (alquileres de inmuebles, arrendamientos de tierras); (d) <strong>transferencias del sector público</strong> (pensiones, prestaciones por desempleo, becas, subsidios); y (e) <strong>otras rentas</strong> (remesas de emigrantes, herencias, premios).
                    </p>
                    <p>
                        La <strong>renta disponible</strong> (Yd) es la renta total menos los impuestos directos más las transferencias recibidas: Yd = Y - T + TR. Las familias distribuyen su renta disponible entre consumo (C) y ahorro (S): Yd = C + S.
                    </p>
                    <p>
                        <strong>John Maynard Keynes</strong> (1936) formuló la <strong>función de consumo keynesiana</strong>, según la cual el consumo depende positivamente de la renta disponible:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="C = C₀ + c · Yd"
                    desc="C₀ = consumo autónomo (independiente de la renta) | c = propensión marginal al consumo (0 < c < 1) | Yd = renta disponible"
                />

                <TheoryBlock title="2.4. Propensión marginal al consumo y al ahorro" color="amber">
                    <p>
                        La <strong>propensión marginal al consumo (PMC o c)</strong> mide la fracción de cada euro adicional de renta que se destina al consumo. Si c = 0,8, de cada euro adicional de renta, 80 céntimos se consumen y 20 se ahorran. La <strong>propensión marginal al ahorro (PMS o s)</strong> es el complementario: s = 1 - c. En nuestro ejemplo, s = 0,2.
                    </p>
                    <p>
                        Keynes estableció la <strong>"ley psicológica fundamental"</strong>: a medida que la renta aumenta, el consumo también aumenta, pero en menor proporción. Esto implica que 0 &lt; c &lt; 1 y que la propensión media al consumo (C/Yd) disminuye con la renta. Esta relación tiene implicaciones macroeconómicas importantes: las familias de rentas altas ahorran una proporción mayor de su renta que las de rentas bajas, lo que es relevante para la política fiscal y la redistribución.
                    </p>
                    <p>
                        Posteriormente, <strong>Franco Modigliani</strong> (Premio Nobel 1985) propuso la <strong>hipótesis del ciclo vital</strong>: las familias planifican su consumo a lo largo de toda su vida, ahorrando durante la etapa activa y desahorrando durante la jubilación. <strong>Milton Friedman</strong> (Premio Nobel 1976) formuló la <strong>hipótesis de la renta permanente</strong>: el consumo depende no de la renta corriente, sino de la renta permanente (la renta media esperada a lo largo de la vida). Ambas teorías ampliaron y matizaron la función de consumo keynesiana.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. Las empresas" icon="🏭">
                <TheoryBlock title="3.1. Definición y papel económico" color="purple">
                    <p>
                        Las <strong>empresas</strong> son las unidades de producción del sistema económico. Su función fundamental es <strong>transformar factores productivos (inputs) en bienes y servicios (outputs)</strong> destinados a satisfacer necesidades humanas. Las empresas constituyen el núcleo del aparato productivo de cualquier economía y son el principal vehículo de creación de empleo, innovación y generación de riqueza.
                    </p>
                    <p>
                        En el sistema económico, las empresas desempeñan un <strong>doble papel</strong> simétrico al de las familias: (a) son <strong>demandantes de factores productivos</strong> en el mercado de factores (contratan trabajadores, alquilan locales, adquieren materias primas, solicitan financiación), y (b) son <strong>oferentes de bienes y servicios</strong> en el mercado de bienes (venden productos finales a las familias, a otras empresas o al sector público).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Objetivo: maximizar el beneficio" color="blue">

                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="B = IT - CT"
                    desc="IT = Ingresos totales (P × Q) | CT = Costes totales (fijos + variables)"
                />

                <TheoryBlock title="3.3. Decisiones fundamentales y función de producción" color="green">
                    <p>
                        Las empresas deben responder a tres grandes preguntas: <strong>¿qué producir?</strong> (qué bienes o servicios ofrecer al mercado), <strong>¿cómo producir?</strong> (con qué combinación de factores y qué tecnología) y <strong>¿cuánto producir?</strong> (qué volumen de producción maximiza el beneficio). La regla de decisión óptima establece que la empresa debe producir hasta el punto en que el <strong>ingreso marginal iguala al coste marginal</strong> (IMg = CMg).
                    </p>
                    <p>
                        La relación técnica entre los factores productivos y la producción obtenida se formaliza mediante la <strong>función de producción</strong>:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Q = f(L, K, T, H)"
                    desc="Q = cantidad producida | L = trabajo | K = capital | T = tierra/recursos naturales | H = capital humano/tecnología"
                />

                <TheoryBlock title="3.4. Clasificación de las empresas" color="amber">
                    <p>
                        Las empresas pueden clasificarse según múltiples criterios:
                    </p>
                    <p>
                        <strong>Según su tamaño:</strong> microempresas (menos de 10 trabajadores), pequeñas (10-49), medianas (50-249) y grandes (250 o más). En España, el 99,8 % de las empresas son pymes (INE, 2024), lo que evidencia la importancia del tejido empresarial de pequeña y mediana dimensión.
                    </p>
                    <p>
                        <strong>Según el sector de actividad:</strong> primario (agricultura, ganadería, pesca, minería), secundario (industria, construcción) y terciario (servicios). La economía española se ha terciarizado progresivamente: el sector servicios representa más del 70 % del PIB y del empleo.
                    </p>
                    <p>
                        <strong>Según la forma jurídica:</strong> empresario individual (autónomo), sociedad limitada (SL), sociedad anónima (SA), cooperativa, sociedad laboral, entre otras. Cada forma jurídica tiene implicaciones diferentes en cuanto a responsabilidad, capital mínimo, fiscalidad y gobierno corporativo (estos aspectos se desarrollan con mayor profundidad en el Tema 19).
                    </p>
                    <p>
                        <strong>Según la propiedad del capital:</strong> empresas privadas, públicas y mixtas. <strong>Según su ámbito geográfico:</strong> locales, regionales, nacionales y multinacionales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. El papel del empresario" color="pink">
                    <p>
                        La figura del empresario ha evolucionado en la teoría económica. <strong>Richard Cantillon</strong> (c. 1680-1734) fue el primero en identificar al empresario como un agente que asume riesgos. <strong>Jean-Baptiste Say</strong> (1767-1832) lo definió como el coordinador de los factores de producción. <strong>Alfred Marshall</strong> (1890) incorporó la función empresarial como cuarto factor de producción. <strong>Joseph Schumpeter</strong> (1883-1950), en su obra <em>Capitalismo, socialismo y democracia</em> (1942), desarrolló la figura del empresario <strong>innovador</strong>, motor de la <strong>"destrucción creativa"</strong>: el proceso por el que las innovaciones desplazan a los productos, empresas y tecnologías obsoletas, generando un dinamismo continuo en el sistema económico. <strong>Frank Knight</strong> (1885-1972) distinguió entre riesgo (cuantificable) e incertidumbre (no cuantificable), y definió al empresario como aquel que asume la incertidumbre genuina a cambio de un beneficio potencial.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. El sector público" icon="🏛️">
                <TheoryBlock title="4.1. Triple papel: productor, regulador, redistribuidor" color="purple">
                    <p>
                        El <strong>sector público</strong> (o Estado, en sentido amplio) es un agente económico singular que desempeña simultáneamente tres funciones esenciales en la economía moderna: <strong>productor</strong> de bienes y servicios públicos (educación, sanidad, defensa, justicia, infraestructuras), <strong>regulador</strong> de la actividad económica (normativa laboral, medioambiental, de competencia, financiera) y <strong>redistribuidor</strong> de la renta (mediante impuestos progresivos, transferencias sociales y servicios públicos universales).
                    </p>
                    <p>
                        El economista estadounidense <strong>Richard Musgrave</strong> (1910-2007), en su obra clásica <em>The Theory of Public Finance</em> (1959), sistematizó las <strong>tres funciones económicas del sector público</strong>:
                    </p>
                    <p>
                        <strong>1. Función de asignación:</strong> corregir los fallos del mercado para lograr una asignación eficiente de los recursos. Los fallos del mercado incluyen: externalidades (positivas y negativas), bienes públicos (no excluibles y no rivales), monopolios y poder de mercado, información asimétrica y mercados incompletos.
                    </p>
                    <p>
                        <strong>2. Función de redistribución:</strong> modificar la distribución de la renta y la riqueza que genera el mercado para hacerla más equitativa. Instrumentos: impuestos progresivos (IRPF), transferencias (pensiones, prestaciones por desempleo, rentas mínimas) y servicios públicos universales (educación, sanidad).
                    </p>
                    <p>
                        <strong>3. Función de estabilización:</strong> suavizar las fluctuaciones del ciclo económico (recesiones y expansiones) para mantener un crecimiento estable, pleno empleo y estabilidad de precios. <strong>John Maynard Keynes</strong> (1936) fue el principal defensor de esta función: en una recesión, el Estado debe aumentar el gasto público y/o reducir los impuestos (política fiscal expansiva) para compensar la caída de la demanda privada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Ingresos públicos" color="blue">
                    <p>
                        Los <strong>ingresos públicos</strong> proceden fundamentalmente de los <strong>impuestos</strong>, que se clasifican en:
                    </p>
                    <p>
                        <strong>Impuestos directos:</strong> gravan la renta o la riqueza del contribuyente. Los principales son el <strong>IRPF</strong> (Impuesto sobre la Renta de las Personas Físicas), de carácter progresivo (quien más gana, más paga proporcionalmente), y el <strong>IS</strong> (Impuesto sobre Sociedades), que grava los beneficios empresariales.
                    </p>
                    <p>
                        <strong>Impuestos indirectos:</strong> gravan el consumo o las transacciones. El principal es el <strong>IVA</strong> (Impuesto sobre el Valor Añadido), que se aplica al valor añadido en cada fase de producción y distribución. En España, el tipo general del IVA es del 21 %, con tipos reducidos del 10 % y del 4 % para determinados bienes y servicios. También se incluyen los <strong>Impuestos Especiales</strong> (alcohol, tabaco, hidrocarburos).
                    </p>
                    <p>
                        Además de los impuestos, el sector público obtiene ingresos por <strong>cotizaciones sociales</strong> (financiación de la Seguridad Social), <strong>tasas y precios públicos</strong> (por la prestación de servicios concretos), <strong>ingresos patrimoniales</strong> (rendimientos de bienes públicos), <strong>transferencias de la UE</strong> (fondos estructurales, Next Generation EU) y <strong>emisión de deuda pública</strong> (bonos, obligaciones, letras del Tesoro).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Gastos públicos y presupuestos" color="green">
                    <p>
                        Los <strong>gastos públicos</strong> se clasifican en:
                    </p>
                    <p>
                        <strong>Gastos corrientes:</strong> necesarios para el funcionamiento ordinario del sector público. Incluyen los salarios de los funcionarios y empleados públicos, las compras de bienes y servicios, y las <strong>transferencias corrientes</strong> (pensiones, prestaciones por desempleo, becas, subsidios).
                    </p>
                    <p>
                        <strong>Gastos de capital (inversión pública):</strong> destinados a la creación o mejora de infraestructuras (carreteras, hospitales, centros educativos, redes de telecomunicaciones) y a la adquisición de bienes de equipo. La inversión pública es un componente clave del crecimiento económico a largo plazo, ya que amplía la capacidad productiva de la economía (desplazamiento de la FPP hacia fuera).
                    </p>
                    <p>
                        Los <strong>Presupuestos Generales del Estado (PGE)</strong> son el documento que recoge anualmente la previsión de ingresos y gastos del sector público. Constituyen la expresión cuantitativa de las prioridades del gobierno y son aprobados por el Parlamento. Si los ingresos superan a los gastos, se produce un <strong>superávit</strong>; si los gastos superan a los ingresos, un <strong>déficit</strong>, que debe financiarse con emisión de deuda pública.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. El debate sobre el tamaño del sector público" color="amber">
                    <p>
                        Uno de los debates más persistentes de la ciencia económica y de la política económica es el relativo al <strong>tamaño óptimo del sector público</strong>. La <strong>presión fiscal</strong> (impuestos como porcentaje del PIB) varía enormemente entre países: supera el 42 % en los países nórdicos (Suecia, Dinamarca), ronda el 37 % en España y se sitúa en torno al 25 % en Estados Unidos.
                    </p>
                    <p>
                        Los defensores de un <strong>sector público amplio</strong> (tradición keynesiana, socialdemócrata) argumentan que el Estado debe proveer bienes públicos, corregir las desigualdades del mercado, garantizar servicios esenciales (educación, sanidad, pensiones) y estabilizar la economía ante las crisis. El <strong>Estado del Bienestar</strong>, desarrollado en Europa tras la Segunda Guerra Mundial, es la expresión institucional de esta visión.
                    </p>
                    <p>
                        Los defensores de un <strong>sector público reducido</strong> (tradición liberal, escuela austríaca, monetarismo) sostienen que un Estado excesivamente grande genera ineficiencias burocráticas, desincentiva la iniciativa privada, distorsiona los mercados y puede conducir al déficit y al endeudamiento crónicos. <strong>Friedrich Hayek</strong> (1944) advirtió de los riesgos del intervencionismo estatal para la libertad individual. <strong>Milton Friedman</strong> (1962), en <em>Capitalismo y libertad</em>, defendió que el gobierno debía limitarse a las funciones que el mercado no puede realizar eficientemente.
                    </p>
                    <p>
                        En la práctica, la mayor parte de las economías desarrolladas se sitúan en un punto intermedio, combinando un sector privado dinámico con un sector público que provee servicios esenciales y actúa como estabilizador automático en las recesiones.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. El sector exterior" icon="🌍">
                <TheoryBlock title="5.1. Relaciones económicas internacionales" color="purple">
                    <p>
                        El <strong>sector exterior</strong> (o resto del mundo) engloba al conjunto de agentes económicos —familias, empresas, gobiernos e instituciones— que operan fuera de las fronteras nacionales y con los que una economía mantiene relaciones de intercambio. En un mundo globalizado, ninguna economía es completamente autárquica: todas dependen, en mayor o menor medida, del comercio internacional, los flujos de capital, las transferencias de tecnología y los movimientos migratorios.
                    </p>
                    <p>
                        Las principales formas de relación con el sector exterior son:
                    </p>
                    <p>
                        <strong>Exportaciones (X):</strong> bienes y servicios producidos en el país que se venden al exterior. Representan una inyección de renta al flujo circular, ya que suponen ingresos procedentes de otros países. España, por ejemplo, exporta automóviles, productos agroalimentarios, servicios turísticos y bienes de equipo.
                    </p>
                    <p>
                        <strong>Importaciones (M):</strong> bienes y servicios producidos en el exterior que se compran en el país. Representan una filtración del flujo circular, ya que suponen pagos al exterior. España importa energía (petróleo, gas), componentes tecnológicos, maquinaria y productos químicos.
                    </p>
                    <p>
                        <strong>Movimientos de capital:</strong> inversiones directas exteriores (IDE), inversiones en cartera (acciones, bonos), préstamos internacionales y remesas de emigrantes. Estos flujos financieros complementan los flujos comerciales y determinan la posición exterior de un país.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. La balanza de pagos" color="blue">
                    <p>
                        La <strong>balanza de pagos</strong> es el documento contable que registra sistemáticamente todas las transacciones económicas de un país con el resto del mundo durante un período determinado (normalmente un año o un trimestre). Se estructura en tres grandes cuentas:
                    </p>
                    <p>
                        <strong>1. Cuenta corriente:</strong> registra los flujos de bienes (balanza comercial), servicios (turismo, transporte, tecnología), rentas primarias (rendimientos de inversiones) y rentas secundarias (transferencias corrientes, remesas). Un saldo negativo en la cuenta corriente indica que el país gasta más de lo que ingresa por operaciones corrientes.
                    </p>
                    <p>
                        <strong>2. Cuenta de capital:</strong> registra las transferencias de capital (fondos europeos para inversión, condonación de deuda) y las adquisiciones y disposiciones de activos no financieros no producidos (patentes, derechos de emisión).
                    </p>
                    <p>
                        <strong>3. Cuenta financiera:</strong> registra los movimientos de inversión directa, inversión en cartera, derivados financieros, otra inversión y variaciones de reservas internacionales. El estudio detallado de la balanza de pagos se remite al Tema 33.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Globalización e interdependencia" color="green">
                    <p>
                        La <strong>globalización</strong> es el proceso de creciente integración e interdependencia de las economías mundiales a través del comercio, la inversión, las finanzas, la migración y la difusión tecnológica. Aunque la globalización tiene raíces históricas profundas (las rutas comerciales antiguas, el colonialismo, la revolución industrial), se ha acelerado extraordinariamente desde los años 1980 gracias a la liberalización comercial, la desregulación financiera y la revolución de las tecnologías de la información y las comunicaciones.
                    </p>
                    <p>
                        Los principales <strong>organismos internacionales</strong> que regulan las relaciones económicas globales son: el <strong>Fondo Monetario Internacional (FMI)</strong>, creado en 1944 (Bretton Woods), que supervisa la estabilidad del sistema monetario internacional y presta asistencia financiera a países en dificultades; el <strong>Banco Mundial</strong>, que financia proyectos de desarrollo en países de rentas bajas y medias; la <strong>Organización Mundial del Comercio (OMC)</strong>, sucesora del GATT (1947), que establece las reglas del comercio internacional y arbitra las disputas comerciales; y la <strong>Unión Europea (UE)</strong>, que representa la experiencia de integración económica más avanzada del mundo, con un mercado único, una unión aduanera y una moneda común (el euro) compartida por 20 Estados miembros.
                    </p>
                    <p>
                        La interdependencia económica global implica que las crisis se transmiten rápidamente entre países: la crisis financiera de 2008 (originada en el mercado hipotecario de EE.UU.) se propagó a toda la economía mundial; la pandemia de COVID-19 (2020) provocó una recesión global simultánea; y las tensiones geopolíticas (guerra en Ucrania, rivalidad EE.UU.-China) generan disrupciones en las cadenas de suministro globales, inflación energética e incertidumbre.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. El flujo circular de la renta" icon="🔄">
                <TheoryBlock title="6.1. Modelo simplificado: dos agentes, dos mercados" color="purple">
                    <p>
                        El <strong>flujo circular de la renta</strong> es un modelo macroeconómico que representa de forma esquemática las interdependencias entre los agentes económicos. En su versión más simple, el modelo incluye únicamente <strong>dos agentes</strong> (familias y empresas) y <strong>dos mercados</strong> (el mercado de bienes y servicios y el mercado de factores productivos).
                    </p>
                    <p>
                        En este modelo simplificado, se producen simultáneamente dos tipos de flujos:
                    </p>
                    <p>
                        <strong>Flujo real (o físico):</strong> las familias ofrecen factores productivos (trabajo, capital, tierra) a las empresas a través del mercado de factores; las empresas, a su vez, ofrecen bienes y servicios a las familias a través del mercado de bienes. Este flujo circula en sentido contrario a las agujas del reloj.
                    </p>
                    <p>
                        <strong>Flujo monetario (o nominal):</strong> las empresas pagan rentas a las familias por los factores productivos (salarios, intereses, alquileres, beneficios); las familias, a su vez, pagan precios a las empresas por los bienes y servicios adquiridos. Este flujo circula en el sentido de las agujas del reloj, en dirección opuesta al flujo real.
                    </p>
                    <p>
                        En este modelo simplificado (sin sector público, sin sector exterior y sin sistema financiero), <strong>todo lo que las familias ganan como renta lo gastan en consumo</strong>, y todo lo que las empresas reciben como ingresos lo destinan a pagar factores productivos. No hay filtraciones ni inyecciones: el sistema es cerrado y estático.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.2. La identidad renta-gasto-producción" color="blue">
                    <p>
                        Una de las identidades más importantes de la macroeconomía es la <strong>equivalencia entre renta, gasto y producción</strong>. En una economía cerrada sin sector público:
                    </p>
                    <p>
                        <strong>Producción (Y) ≡ Renta (Y) ≡ Gasto (Y)</strong>
                    </p>
                    <p>
                        Todo lo que se produce (medido por el PIB) genera rentas equivalentes (salarios, intereses, alquileres, beneficios) que, a su vez, se destinan íntegramente al gasto (consumo). Esta triple identidad es el fundamento de la contabilidad nacional y permite medir el PIB por tres vías: la vía de la producción (suma del valor añadido), la vía de la renta (suma de las rentas generadas) y la vía del gasto (suma de los componentes de la demanda).
                    </p>
                    <p>
                        Cuando se incorporan todos los agentes, la identidad macroeconómica fundamental se expande:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Y ≡ C + I + G + (X - M)"
                    desc="Y = PIB | C = Consumo privado | I = Inversión | G = Gasto público | X = Exportaciones | M = Importaciones"
                />

                <TheoryBlock title="6.3. Incorporación del sistema financiero" color="green">
                    <p>
                        Una primera ampliación del modelo simplificado consiste en <strong>incorporar el sistema financiero</strong> (bancos, mercados de capitales, fondos de inversión). Las familias no gastan toda su renta en consumo: una parte la <strong>ahorran (S)</strong>. El ahorro constituye una <strong>filtración</strong> del flujo circular: renta que sale del circuito de gasto en consumo.
                    </p>
                    <p>
                        Sin embargo, el ahorro no se pierde: se canaliza a través del sistema financiero hacia las empresas en forma de <strong>inversión (I)</strong>. La inversión constituye una <strong>inyección</strong> al flujo circular: gasto adicional que las empresas realizan en bienes de capital (maquinaria, instalaciones, I+D) para ampliar o mantener su capacidad productiva.
                    </p>
                    <p>
                        Para que el flujo circular se mantenga en equilibrio en esta versión ampliada, la filtración por ahorro debe compensarse con una inyección equivalente por inversión: <strong>S = I</strong>. Si el ahorro supera a la inversión (S &gt; I), la demanda agregada será insuficiente y la producción tenderá a contraerse. Si la inversión supera al ahorro (I &gt; S), la demanda será excesiva, generando presiones inflacionistas. La función del sistema financiero es, precisamente, <strong>intermediar</strong> entre ahorradores e inversores, canalizando los fondos de quienes tienen exceso de renta (ahorradores netos) hacia quienes necesitan financiación (inversores netos).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.4. Incorporación del sector público" color="amber">
                    <p>
                        La segunda ampliación incorpora al <strong>sector público</strong>. Este agente interactúa con el flujo circular de dos formas:
                    </p>
                    <p>
                        <strong>Filtraciones — Impuestos (T):</strong> el sector público detrae una parte de la renta de familias y empresas mediante impuestos directos e indirectos. Los impuestos reducen la renta disponible de las familias y, por tanto, su capacidad de consumo. Constituyen una filtración del flujo circular.
                    </p>
                    <p>
                        <strong>Inyecciones — Gasto público (G) y transferencias (TR):</strong> el sector público inyecta recursos al flujo circular mediante el gasto público (compras de bienes y servicios, salarios de funcionarios, inversión pública) y las transferencias (pensiones, prestaciones por desempleo, becas). Estas inyecciones aumentan la demanda agregada.
                    </p>
                    <p>
                        El <strong>presupuesto público equilibrado</strong> se da cuando T = G + TR. Si G + TR &gt; T, hay <strong>déficit público</strong> (que debe financiarse con deuda); si T &gt; G + TR, hay <strong>superávit</strong>. La política fiscal consiste, precisamente, en manipular los niveles de impuestos y gasto público para influir sobre la demanda agregada y estabilizar la economía.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.5. Incorporación del sector exterior" color="pink">
                    <p>
                        La tercera ampliación incorpora el <strong>sector exterior</strong>. Las relaciones con el resto del mundo generan:
                    </p>
                    <p>
                        <strong>Filtraciones — Importaciones (M):</strong> cuando las familias o las empresas adquieren bienes y servicios producidos en el extranjero, la renta sale del circuito nacional. Las importaciones constituyen una filtración del flujo circular doméstico.
                    </p>
                    <p>
                        <strong>Inyecciones — Exportaciones (X):</strong> cuando las empresas venden bienes y servicios al exterior, entran ingresos procedentes de otros países. Las exportaciones constituyen una inyección al flujo circular.
                    </p>
                    <p>
                        El <strong>saldo exterior</strong> (X - M) determina si el sector exterior es, en términos netos, una inyección (si X &gt; M, superávit comercial) o una filtración (si M &gt; X, déficit comercial).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.6. El equilibrio macroeconómico: filtraciones = inyecciones" color="violet">
                    <p>
                        En el modelo completo con los cuatro agentes, el <strong>equilibrio macroeconómico</strong> se alcanza cuando la suma de todas las filtraciones iguala a la suma de todas las inyecciones:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="S + T + M = I + G + X"
                    desc="Filtraciones (ahorro + impuestos + importaciones) = Inyecciones (inversión + gasto público + exportaciones)"
                />

                <TheoryBlock title="6.7. Modelo completo: síntesis" color="cyan">
                    <p>
                        El modelo completo del flujo circular de la renta integra los <strong>cuatro agentes</strong> (familias, empresas, sector público y sector exterior) y los <strong>tres mercados fundamentales</strong> (mercado de bienes, mercado de factores y mercado financiero). En este modelo:
                    </p>
                    <p>
                        Las familias reciben rentas del mercado de factores, pagan impuestos al sector público, reciben transferencias, consumen bienes nacionales e importados, y ahorran a través del sistema financiero.
                    </p>
                    <p>
                        Las empresas producen bienes y servicios, pagan rentas a los factores productivos, pagan impuestos, reciben subvenciones, invierten (financiándose a través del sistema financiero), y exportan e importan.
                    </p>
                    <p>
                        El sector público recauda impuestos, gasta en bienes y servicios, realiza transferencias, invierte en infraestructuras y puede endeudarse en los mercados financieros nacionales e internacionales.
                    </p>
                    <p>
                        El sector exterior compra las exportaciones del país, vende las importaciones y participa en los flujos de capital.
                    </p>
                    <p>
                        Este modelo, aunque simplificado, constituye el <strong>esquema básico de la macroeconomía</strong> y es el punto de partida para modelos más complejos como el modelo IS-LM (Hicks, 1937), el modelo de oferta y demanda agregada (OA-DA) y los modelos macroeconómicos dinámicos contemporáneos.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 7 */}
            <Card title="7. Relevancia actual y aplicación docente" icon="🎓">
                <TheoryBlock title="7.1. Interdependencia de los agentes en la economía contemporánea" color="purple">
                    <p>
                        La economía contemporánea se caracteriza por una <strong>interdependencia creciente</strong> entre los agentes económicos. Las cadenas de valor globales vinculan a empresas de decenas de países; los mercados financieros transmiten las decisiones de los ahorradores de un continente a los inversores de otro; y las políticas fiscales y monetarias de las grandes economías (EE.UU., UE, China) tienen repercusiones planetarias.
                    </p>
                    <p>
                        Las <strong>crisis económicas</strong> son manifestaciones dramáticas de los desequilibrios en el flujo circular. La <strong>crisis financiera de 2008</strong> ilustra cómo un exceso de ahorro global (sobre todo de China y los países petroleros), canalizado hacia inversiones de alto riesgo en EE.UU. (hipotecas subprime), desencadenó una reacción en cadena que colapsó el sistema financiero, redujo drásticamente la inversión y el consumo, y provocó una recesión mundial. La <strong>crisis del COVID-19</strong> (2020) mostró cómo un shock exógeno (pandemia) puede interrumpir simultáneamente los flujos reales (confinamientos, cierre de empresas) y los flujos monetarios (caída de ingresos, impagos), requiriendo una intervención masiva del sector público (ERTE, líneas ICO, fondos Next Generation EU) para sostener el flujo circular.
                    </p>
                </TheoryBlock>

                    </p>
                    <p>
                        El concepto de <strong>prosumidor</strong> (combinación de "productor" y "consumidor", acuñado por <strong>Alvin Toffler</strong> en <em>La tercera ola</em>, 1980) se ha materializado en la era digital: los usuarios de YouTube, Instagram, TikTok o Wikipedia son simultáneamente productores y consumidores de contenido. La <strong>economía de plataformas</strong> difumina las fronteras entre familias y empresas, y plantea desafíos regulatorios (fiscalidad digital, derechos laborales de los "riders", protección de datos) que los modelos tradicionales no capturaban.
                    </p>
                    <p>
                        La <strong>economía colaborativa</strong> (compartir alojamiento, transporte, herramientas) y la <strong>economía circular</strong> (reutilización, reciclaje, simbiosis industrial) añaden flujos adicionales al modelo circular y conectan directamente con los Objetivos de Desarrollo Sostenible (ODS 12: producción y consumo responsables).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="7.3. Aplicación en el aula" color="green">

                    </p>
                    <p>
                        <strong>Simulación del flujo circular:</strong> los alumnos, organizados en grupos, representan los diferentes agentes (familias, empresas, banco, gobierno, sector exterior) e intercambian tarjetas que representan bienes, servicios, dinero, impuestos y transferencias. Esta actividad vivencial permite comprender las interrelaciones de forma intuitiva.
                    </p>
                    <p>
                        <strong>Juegos de roles:</strong> debates en los que cada grupo defiende la perspectiva de un agente económico ante una medida de política económica (por ejemplo: ¿cómo afecta una subida del IVA a las familias, a las empresas, al sector público y al sector exterior?).
                    </p>
                    <p>
                        <strong>Análisis de datos reales:</strong> utilizar datos del INE, Eurostat y el Banco de España para identificar los componentes del PIB por la vía del gasto, calcular la presión fiscal, analizar la balanza comercial y observar las tendencias del ahorro y la inversión.
                    </p>
                    <p>
                        Estas actividades contribuyen al desarrollo de las competencias clave previstas en la LOMLOE: competencia ciudadana (CC), competencia emprendedora (CE), competencia STEM (uso de datos y gráficos) y competencia digital (búsqueda y tratamiento de información económica).
                    </p>
                    <p>
                        La conexión con los <strong>ODS</strong> es directa: el ODS 8 (trabajo decente y crecimiento económico) se vincula con el papel de las familias y las empresas; el ODS 10 (reducción de las desigualdades) con la función redistributiva del sector público; y el ODS 17 (alianzas para lograr los objetivos) con el papel del sector exterior y los organismos internacionales.
                    </p>
                </TheoryBlock>

            <Card title="Conclusión" icon="✅">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        A lo largo de este tema se han analizado los cuatro grandes agentes económicos —familias, empresas, sector público y sector exterior— y sus funciones dentro del sistema económico. Las familias, como oferentes de factores productivos y demandantes de bienes, constituyen el pilar del consumo. Las empresas, como unidades de producción que transforman inputs en outputs, son el motor de la generación de riqueza y empleo. El sector público, en su triple función de asignación, redistribución y estabilización (Musgrave, 1959), corrige los fallos del mercado y promueve la equidad. El sector exterior conecta la economía nacional con el resto del mundo a través del comercio, la inversión y los flujos financieros.
                    </p>
                    <p>
                        El flujo circular de la renta, desde su versión simplificada (dos agentes, dos mercados) hasta el modelo completo (cuatro agentes, sistema financiero), constituye el esquema básico de la macroeconomía. La identidad renta-gasto-producción (Y ≡ C + I + G + X - M) y la condición de equilibrio (S + T + M = I + G + X) resumen la interdependencia entre todos los agentes y mercados. Las filtraciones (ahorro, impuestos, importaciones) y las inyecciones (inversión, gasto público, exportaciones) determinan la dinámica del sistema.
                    </p>
                    <p>
                        En el siglo XXI, la revolución digital, la globalización y los retos de la sostenibilidad han enriquecido y complejizado el modelo del flujo circular, con la aparición de nuevos agentes (plataformas digitales, prosumidores) y nuevos flujos (economía colaborativa, economía circular). Desde la perspectiva docente, el flujo circular es una herramienta pedagógica de primer orden para hacer comprensible la macroeconomía, conectar la teoría con la realidad cotidiana del alumnado y desarrollar las competencias clave previstas en la LOMLOE.
                    </p>

                        <strong>Ventajas:</strong> (a) <strong>eficiencia asignativa</strong>: los recursos tienden a dirigirse hacia las actividades más valoradas por los consumidores; (b) <strong>innovación</strong>: la competencia incentiva la búsqueda permanente de mejoras en productos y procesos (Schumpeter, "destrucción creativa"); (c) <strong>variedad y libertad de elección</strong>: los consumidores disponen de una amplia gama de bienes y servicios; (d) <strong>adaptabilidad</strong>: el sistema de precios se ajusta rápidamente a los cambios en la oferta y la demanda; (e) <strong>libertad económica</strong>: los individuos deciden libremente su trabajo, consumo y ahorro.
                    </p>
                    <p>
                        <strong>Inconvenientes:</strong> (a) <strong>desigualdad en la distribución de la renta y la riqueza</strong>: el mercado recompensa según la productividad y la dotación de recursos, generando disparidades que pueden ser socialmente inaceptables; (b) <strong>externalidades negativas</strong>: contaminación, degradación medioambiental, sobreexplotación de recursos comunes (Hardin, "tragedia de los comunes", 1968); (c) <strong>provisión insuficiente de bienes públicos</strong>: el mercado no produce bienes no excluibles y no rivales (defensa, alumbrado, investigación básica) porque nadie puede apropiarse de sus beneficios; (d) <strong>inestabilidad cíclica</strong>: tendencia a alternar fases de expansión (burbujas) y recesión (crisis); (e) <strong>poder de mercado</strong>: la competencia perfecta es un ideal teórico; en la práctica, tienden a surgir monopolios y oligopolios que distorsionan los precios y reducen la eficiencia.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. La economía planificada (socialismo)" icon="🏗️">
                <TheoryBlock title="3.1. Fundamentos teóricos" color="purple">
                    <p>
                        La <strong>economía planificada</strong> (o economía de dirección central) tiene su fundamento teórico en la obra de <strong>Karl Marx</strong> (1818-1883) y <strong>Friedrich Engels</strong> (1820-1895). Marx, en su obra monumental <em>El Capital</em> (cuyo primer volumen se publicó en 1867), analizó críticamente el modo de producción capitalista, identificando sus contradicciones internas: la explotación del trabajador (plusvalía), la alienación del trabajo, la tendencia a la concentración del capital, la caída tendencial de la tasa de beneficio y las crisis cíclicas de sobreproducción.
                    </p>
                    <p>
                        Para Marx, el capitalismo era una etapa históricamente necesaria pero transitoria del desarrollo económico, destinada a ser superada por el <strong>socialismo</strong> (propiedad colectiva de los medios de producción, planificación centralizada, distribución según el trabajo) y, en última instancia, por el <strong>comunismo</strong> (sociedad sin clases, sin Estado, distribución "según las necesidades"). La revolución proletaria, según Marx, sería el vehículo de esta transición.
                    </p>
                    <p>
                        Otros autores relevantes de la tradición socialista son: <strong>Vladimir Lenin</strong> (1870-1924), que lideró la Revolución Rusa de 1917 y puso en práctica la planificación central; <strong>Rosa Luxemburgo</strong> (1871-1919), defensora de un socialismo democrático; y <strong>Oskar Lange</strong> (1904-1965), economista polaco que, en el célebre <strong>debate sobre el cálculo socialista</strong> (años 1930), intentó demostrar que una economía socialista podía utilizar un sistema de precios de referencia (precios sombra) para asignar eficientemente los recursos, en respuesta a las críticas de <strong>Ludwig von Mises</strong> (1920) y de Hayek.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Características" color="blue">
                    <p>
                        Las características definitorias de la economía planificada son:
                    </p>
                    <p>
                        <strong>1. Propiedad estatal o colectiva de los medios de producción:</strong> las fábricas, la tierra, las minas y las infraestructuras pertenecen al Estado (o a cooperativas controladas por el Estado). No existe la propiedad privada de los medios de producción (aunque puede existir propiedad personal de bienes de consumo).
                    </p>
                    <p>
                        <strong>2. Planificación central:</strong> un organismo planificador (como el <strong>Gosplan</strong> soviético, creado en 1921) decide qué producir, en qué cantidades, a qué precios, con qué tecnología y cómo distribuir la producción. Los planes económicos se fijan típicamente a <strong>cinco años</strong> (planes quinquenales), con objetivos de producción detallados para cada sector y cada empresa.
                    </p>
                    <p>
                        <strong>3. Precios fijados administrativamente:</strong> los precios no se determinan por la oferta y la demanda, sino que son establecidos por la autoridad planificadora. Esto incluye los precios de los bienes de consumo, los salarios, los tipos de interés y los tipos de cambio.
                    </p>
                    <p>
                        <strong>4. Ausencia de competencia:</strong> al no existir empresas privadas competidoras, no hay incentivo de mercado para innovar, reducir costes o mejorar la calidad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. El Gosplan soviético como ejemplo histórico" color="green">
                    <p>
                        El <strong>Gosplan</strong> (Comité Estatal de Planificación de la URSS) fue el órgano encargado de elaborar y supervisar los planes quinquenales soviéticos desde 1928 hasta la disolución de la URSS en 1991. El primer plan quinquenal (1928-1932), impulsado por <strong>Iósif Stalin</strong>, priorizó la industrialización pesada (acero, energía, maquinaria) y la colectivización agrícola forzosa, con resultados espectaculares en términos de producción industrial pero catastróficos en términos humanos (hambrunas, deportaciones, represión).
                    </p>
                    <p>
                        Los planes quinquenales posteriores consolidaron una economía que, aunque logró avances significativos en industrialización, educación, ciencia (programa espacial) y defensa, se caracterizó por la <strong>ineficiencia productiva</strong> (exceso de producción de bienes no demandados y escasez crónica de bienes de consumo), la <strong>baja calidad</strong> de los productos, la <strong>ausencia de innovación</strong> (al no existir competencia) y una creciente <strong>brecha tecnológica</strong> respecto a las economías de mercado.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Ventajas e inconvenientes" color="amber">
                    <p>
                        <strong>Ventajas teóricas:</strong> (a) <strong>igualdad</strong>: reducción de las desigualdades de renta y riqueza; (b) <strong>pleno empleo</strong>: el Estado garantiza un puesto de trabajo a cada ciudadano; (c) <strong>provisión de bienes públicos</strong>: educación, sanidad, vivienda y cultura universales y gratuitas; (d) <strong>estabilidad</strong>: ausencia de ciclos económicos y crisis financieras; (e) <strong>movilización de recursos</strong>: capacidad de concentrar recursos masivos en objetivos estratégicos (industrialización, defensa, investigación espacial).
                    </p>
                    <p>
                        <strong>Inconvenientes:</strong> (a) <strong>ineficiencia asignativa</strong>: sin precios libres, el planificador no dispone de la información necesaria para asignar eficientemente los recursos. <strong>Friedrich Hayek</strong> (1945), en su artículo <em>"The Use of Knowledge in Society"</em>, formuló la crítica más influyente: el "problema del conocimiento". El conocimiento relevante para las decisiones económicas está disperso entre millones de agentes individuales; ningún planificador central puede recopilar, procesar y utilizar eficientemente toda esa información. El sistema de precios de mercado, en cambio, es un mecanismo de transmisión de información extraordinariamente eficiente.
                    </p>
                    <p>
                        (b) <strong>Falta de incentivos:</strong> sin propiedad privada ni beneficio, los trabajadores y las empresas carecen de motivación para esforzarse, innovar o mejorar la calidad. (c) <strong>Ausencia de innovación:</strong> sin competencia no hay presión para innovar. (d) <strong>Autoritarismo:</strong> la planificación central requiere un poder político fuerte para imponer las decisiones, lo que históricamente ha conducido a regímenes autoritarios. (e) <strong>Problemas de información:</strong> la producción se ajusta al plan, no a las necesidades reales, generando excedentes de bienes no deseados y escasez de bienes demandados.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. Experiencias históricas" color="red">
                    <p>
                        Las principales experiencias históricas de economía planificada son: la <strong>Unión Soviética</strong> (1917-1991), que durante décadas fue la segunda potencia económica mundial pero acabó colapsando por la ineficiencia, la rigidez y la represión; <strong>Cuba</strong> (desde 1959), que mantiene un modelo de planificación central con reformas graduales desde 2011; <strong>Corea del Norte</strong>, que conserva una de las economías más cerradas y planificadas del mundo; y <strong>China</strong> (1949-1978), que bajo Mao Zedong implementó la colectivización agrícola y los planes quinquenales, con consecuencias desastrosas durante el "Gran Salto Adelante" (1958-1962, hambruna que causó entre 15 y 45 millones de muertes).
                    </p>
                    <p>
                        La <strong>caída del Muro de Berlín</strong> (9 de noviembre de 1989) y la <strong>disolución de la URSS</strong> (25 de diciembre de 1991) marcaron el fin de la economía planificada como alternativa global al capitalismo. Como escribió <strong>Francis Fukuyama</strong> en <em>El fin de la historia y el último hombre</em> (1992), estos acontecimientos parecían confirmar la superioridad de la democracia liberal y la economía de mercado. No obstante, el debate sobre el papel del Estado en la economía sigue plenamente vigente.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. La economía mixta" icon="⚖️">
                <TheoryBlock title="4.1. Concepto y justificación teórica" color="purple">
                    <p>
                        La <strong>economía mixta</strong> es el sistema económico que combina el <strong>mecanismo de mercado</strong> como principal instrumento de asignación de recursos con la <strong>intervención correctora del Estado</strong> para corregir los fallos del mercado, redistribuir la renta y estabilizar la economía. Es, con diferencia, el sistema predominante en el mundo contemporáneo: prácticamente todas las economías actuales son mixtas en diferentes grados.
                    </p>
                    <p>
                        La justificación teórica de la economía mixta se basa en la constatación de que <strong>el mercado, por sí solo, no garantiza resultados socialmente óptimos</strong>. Los <strong>fallos del mercado</strong> (tema que se desarrolla en profundidad en el Tema 17) incluyen: externalidades (positivas y negativas), bienes públicos (no provisión por el mercado), monopolios y poder de mercado (precios superiores a los competitivos), información asimétrica (selección adversa, riesgo moral), mercados incompletos y distribución desigual de la renta.
                    </p>
                    <p>
                        <strong>John Maynard Keynes</strong> (1883-1946) proporcionó el fundamento teórico más influyente para la intervención estatal con su <em>Teoría general de la ocupación, el interés y el dinero</em> (1936). En plena Gran Depresión, Keynes demostró que los mercados no se ajustan automáticamente al pleno empleo (como sostenían los economistas clásicos siguiendo la Ley de Say) y que el Estado debe intervenir activamente mediante la política fiscal (aumento del gasto público, reducción de impuestos) para compensar la insuficiencia de la demanda privada y sacar a la economía de la recesión.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. El Estado del Bienestar" color="blue">
                    <p>
                        El <strong>Estado del Bienestar</strong> (<em>Welfare State</em>) es la expresión institucional de la economía mixta en su vertiente redistributiva. Se desarrolló en Europa Occidental tras la Segunda Guerra Mundial, con el objetivo de garantizar a todos los ciudadanos un nivel mínimo de bienestar material: educación pública universal, sanidad pública universal, sistema de pensiones contributivas, protección por desempleo, servicios sociales y vivienda pública.
                    </p>
                    <p>
                        El informe <strong>Beveridge</strong> (1942), encargado por el gobierno británico durante la guerra, es considerado el documento fundacional del Estado del Bienestar moderno. William Beveridge propuso un sistema integral de seguridad social "de la cuna a la tumba" que combatiera los "cinco gigantes" del malestar social: necesidad, enfermedad, ignorancia, miseria y ociosidad.
                    </p>
                    <p>
                        Los pilares del Estado del Bienestar son: (a) <strong>sanidad pública</strong> universal (en España, el Sistema Nacional de Salud, financiado con impuestos generales); (b) <strong>educación pública</strong> obligatoria y gratuita (en España, hasta los 16 años, con acceso amplio a la universidad pública); (c) <strong>sistema de pensiones</strong> contributivas (en España, sistema de reparto gestionado por la Seguridad Social); (d) <strong>prestaciones por desempleo</strong> (contributivas y asistenciales); y (e) <strong>servicios sociales</strong> (atención a la dependencia, rentas mínimas, ayudas a familias).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Modelos de economía mixta" color="green">
                    <p>
                        Dentro de la categoría general de "economía mixta", existen diferentes <strong>modelos</strong> que varían en el grado de intervención estatal, la generosidad del Estado del Bienestar y la regulación del mercado laboral. La clasificación más conocida es la de <strong>Gøsta Esping-Andersen</strong> (<em>The Three Worlds of Welfare Capitalism</em>, 1990):
                    </p>
                    <p>
                        <strong>1. Modelo nórdico (socialdemócrata):</strong> Suecia, Dinamarca, Noruega, Finlandia. Se caracteriza por un Estado del Bienestar amplio y universal, alta presión fiscal (40-45 % del PIB), mercado laboral flexible con fuertes protecciones sociales ("flexiguridad"), negociación colectiva centralizada y baja desigualdad. Es el modelo que mejor combina eficiencia económica y equidad social.
                    </p>
                    <p>
                        <strong>2. Modelo continental (conservador-corporatista):</strong> Alemania, Francia, Austria, Bélgica. Estado del Bienestar contributivo (las prestaciones dependen de las cotizaciones), regulación laboral estricta, peso del diálogo social entre sindicatos y patronal. La economía social de mercado alemana (<em>Soziale Marktwirtschaft</em>), diseñada por <strong>Ludwig Erhard</strong> y la escuela ordoliberal de Friburgo, es el referente de este modelo.
                    </p>
                    <p>
                        <strong>3. Modelo anglosajón (liberal):</strong> Estados Unidos, Reino Unido, Irlanda, Australia. Menor intervención estatal, presión fiscal más baja (25-30 %), Estado del Bienestar residual (focalizado en los más necesitados), mercado laboral flexible y desregulado, mayor desigualdad.
                    </p>
                    <p>
                        <strong>4. Modelo mediterráneo:</strong> España, Italia, Grecia, Portugal. Estado del Bienestar desarrollado pero con menor cobertura que los nórdicos, peso de la familia como red de protección social, mercado laboral dual (fijos vs. temporales), economía sumergida significativa.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. El debate permanente: ¿cuánta intervención?" color="amber">
                    <p>
                        La economía mixta se encuentra permanentemente en el centro de un <strong>debate sobre el grado óptimo de intervención estatal</strong>. Este debate atraviesa toda la historia del pensamiento económico:
                    </p>
                    <p>
                        Los <strong>keynesianos</strong> (y los neokeynesianos como <strong>Paul Krugman</strong>, <strong>Joseph Stiglitz</strong> o <strong>Thomas Piketty</strong>) defienden una intervención activa del Estado para corregir los fallos del mercado, reducir las desigualdades (Piketty, <em>El capital en el siglo XXI</em>, 2013) y estabilizar la economía ante las crisis.
                    </p>
                    <p>
                        Los <strong>liberales</strong> (Hayek, Friedman, escuela austríaca, escuela de Chicago) argumentan que la intervención estatal suele generar más problemas de los que resuelve: ineficiencia burocrática, captura regulatoria, riesgo moral, desincentivos al trabajo y a la inversión, y pérdida de libertad individual. Friedman (1962) sostenía que el gobierno debía limitarse a las funciones que el mercado no puede realizar eficientemente: defensa, justicia, protección de la propiedad y reglas de competencia.
                    </p>
                    <p>
                        En la práctica, el péndulo oscila: tras la Gran Depresión (1929) y la Segunda Guerra Mundial, predominó el <strong>consenso keynesiano</strong> (Estado intervencionista). Tras la estanflación de los años 1970, se impuso la <strong>revolución neoliberal</strong> (Reagan en EE.UU., Thatcher en UK, Consenso de Washington). Tras la crisis financiera de 2008 y la pandemia de COVID-19, ha resurgido la demanda de <strong>mayor intervención estatal</strong> (políticas fiscales expansivas, regulación financiera, inversión pública verde).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. La transición entre sistemas" icon="🔄">
                <TheoryBlock title="5.1. Las transiciones post-soviéticas" color="purple">
                    <p>
                        Tras la caída del Muro de Berlín (1989) y la disolución de la URSS (1991), los países del antiguo bloque soviético emprendieron un proceso de <strong>transición desde la economía planificada hacia la economía de mercado</strong>. Este proceso, sin precedentes en la historia económica, implicó la privatización masiva de empresas estatales, la liberalización de precios, la apertura comercial, la creación de instituciones de mercado (bolsas de valores, sistemas bancarios, marcos regulatorios) y, en muchos casos, la democratización política.
                    </p>
                    <p>
                        Se distinguieron dos estrategias principales:
                    </p>
                    <p>
                        <strong>Terapia de choque (<em>shock therapy</em>):</strong> defendida por <strong>Jeffrey Sachs</strong> y aplicada en Polonia ("Plan Balcerowicz", 1990) y en Rusia (bajo Yeltsin, 1992). Consistía en liberalizar rápidamente precios y comercio, privatizar masivamente y estabilizar la moneda de forma simultánea. La lógica era que las reformas parciales generaban más distorsiones que las reformas completas.
                    </p>
                    <p>
                        <strong>Gradualismo:</strong> defendido por <strong>Joseph Stiglitz</strong> (Premio Nobel 2001) y aplicado parcialmente en Hungría, República Checa y Eslovenia. Proponía reformas secuenciales y progresivas, con redes de protección social para amortiguar los costes del ajuste.
                    </p>
                    <p>
                        Los resultados fueron muy dispares. Polonia logró una transición relativamente exitosa (crecimiento sostenido, integración en la UE). Rusia, en cambio, sufrió una caída dramática del PIB (más del 40 % entre 1990 y 1998), hiperinflación, privatizaciones fraudulentas que concentraron la riqueza en manos de los "oligarcas", aumento de la pobreza y reducción de la esperanza de vida. Stiglitz (<em>El malestar en la globalización</em>, 2002) criticó duramente la terapia de choque y la actuación del FMI en estos procesos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. El caso de China: socialismo de mercado" color="blue">
                    <p>
                        <strong>China</strong> representa la experiencia de transición más exitosa en términos de crecimiento económico, aunque también la más peculiar en términos político-institucionales. A partir de 1978, bajo el liderazgo de <strong>Deng Xiaoping</strong>, China emprendió un proceso gradual de reformas económicas ("reforma y apertura") que combinó la liberalización de la agricultura (descolectivización, sistema de responsabilidad familiar), la creación de <strong>Zonas Económicas Especiales</strong> (Shenzhen, Zhuhai, Shantou, Xiamen) abiertas a la inversión extranjera, la liberalización progresiva de precios y la promoción de la empresa privada, todo ello manteniendo el monopolio político del Partido Comunista.
                    </p>
                    <p>
                        El resultado ha sido espectacular: entre 1978 y 2024, el PIB de China se ha multiplicado por más de 30, sacando de la pobreza extrema a más de 800 millones de personas (Banco Mundial). China ha pasado de ser una economía agraria y cerrada a ser la <strong>segunda economía del mundo</strong> (primera en paridad de poder adquisitivo), el mayor exportador mundial y una potencia tecnológica emergente.
                    </p>
                    <p>
                        No obstante, el modelo chino también presenta sombras: creciente <strong>desigualdad</strong> (coeficiente de Gini superior a 0,45), <strong>degradación medioambiental</strong> severa (China es el mayor emisor de CO₂ del mundo), <strong>represión política</strong> y de libertades civiles, <strong>deuda corporativa</strong> elevada y riesgos de burbuja inmobiliaria. El "socialismo de mercado con características chinas" sigue siendo un modelo difícilmente replicable por su singularidad político-institucional.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Lecciones para la política económica" color="green">
                    <p>
                        Las experiencias de transición permiten extraer varias <strong>lecciones</strong> para la política económica:
                    </p>
                    <p>
                        (a) Las <strong>instituciones importan</strong>: sin un marco jurídico sólido (derechos de propiedad, estado de derecho, regulación financiera), la liberalización puede generar caos, corrupción y concentración de riqueza. <strong>Daron Acemoglu</strong> y <strong>James Robinson</strong> (Premio Nobel 2024) han demostrado que las instituciones inclusivas son el factor clave del desarrollo a largo plazo.
                    </p>
                    <p>
                        (b) La <strong>velocidad de las reformas</strong> debe adaptarse al contexto: no existe una receta universal. La terapia de choque funcionó en Polonia (que contaba con tradición empresarial y proximidad a la UE) pero fracasó en Rusia (sin instituciones de mercado ni cultura empresarial).
                    </p>
                    <p>
                        (c) Las <strong>redes de protección social</strong> son indispensables para sostener el apoyo político a las reformas y evitar que los costes del ajuste recaigan desproporcionadamente sobre los más vulnerables.
                    </p>
                    <p>
                        (d) El <strong>crecimiento económico no es sinónimo de desarrollo</strong>: sin redistribución, libertades civiles y sostenibilidad ambiental, el crecimiento puede ser insostenible e inequitativo.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 6 */}
            <Card title="6. Los sistemas económicos en el siglo XXI" icon="🔮">
                <TheoryBlock title="6.1. Economía de plataformas y economía colaborativa" color="purple">
                    <p>
                        El siglo XXI ha traído transformaciones que desafían las categorías tradicionales de los sistemas económicos. La <strong>economía de plataformas</strong> (Amazon, Uber, Airbnb, Google, Meta) representa un nuevo modelo de organización económica en el que las <strong>plataformas digitales</strong> actúan como intermediarios que conectan directamente a oferentes y demandantes, reduciendo los costes de transacción (Coase, 1937) y creando mercados globales que antes no existían.
                    </p>
                    <p>
                        La <strong>economía colaborativa</strong> (<em>sharing economy</em>) permite compartir activos infrautilizados (viviendas, coches, herramientas, tiempo) a través de plataformas digitales, maximizando la eficiencia en el uso de los recursos. Sin embargo, también plantea problemas: competencia desleal con sectores regulados (taxis vs. Uber, hoteles vs. Airbnb), precariedad laboral de los trabajadores de plataformas (los "riders" o "gig workers"), concentración de poder en pocas empresas tecnológicas, y desafíos fiscales (las plataformas operan globalmente pero tributan en jurisdicciones de baja fiscalidad).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.2. La economía circular" color="blue">
                    <p>
                        La <strong>economía circular</strong> propone superar el modelo lineal tradicional ("extraer-producir-consumir-desechar") por un modelo en el que los residuos de un proceso se convierten en insumos de otro, minimizando la extracción de recursos naturales y la generación de residuos. Los principios clave son: diseñar para la durabilidad y la reparabilidad, reutilizar, reciclar y regenerar.
                    </p>
                    <p>
                        La Unión Europea ha adoptado la economía circular como eje estratégico de su política industrial y ambiental (<em>Plan de Acción para la Economía Circular</em>, 2020). La economía circular conecta directamente con el <strong>ODS 12</strong> (producción y consumo responsables) y con la necesidad de <strong>desacoplar el crecimiento económico del consumo de recursos naturales</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.3. El debate sobre el decrecimiento" color="green">
                    <p>
                        El <strong>decrecimiento</strong> es una corriente de pensamiento que cuestiona el paradigma del crecimiento económico ilimitado en un planeta de recursos finitos. Su principal representante es <strong>Serge Latouche</strong> (profesor emérito de la Universidad de París-Sud), que en obras como <em>Pequeño tratado del decrecimiento sereno</em> (2009) propone una reducción planificada y democrática de la producción y el consumo en las sociedades ricas, para liberar espacio ecológico para los países en desarrollo y para mejorar la calidad de vida (menos consumo material, más tiempo libre, más relaciones sociales, más cultura).
                    </p>
                    <p>
                        La economista <strong>Kate Raworth</strong>, en su influyente obra <em>Economía rosquilla</em> (<em>Doughnut Economics</em>, 2017), propone un modelo visual de "economía del donut": la actividad económica debe situarse entre un <strong>suelo social mínimo</strong> (que garantice las necesidades básicas de toda la humanidad: alimentación, salud, educación, vivienda, participación política) y un <strong>techo ecológico máximo</strong> (que no sobrepase los límites planetarios: cambio climático, pérdida de biodiversidad, contaminación, agotamiento de recursos). La zona segura y justa para la humanidad es el "donut" entre ambos límites.
                    </p>
                    <p>
                        Estas corrientes, aunque minoritarias en la profesión económica, han ganado influencia en el debate público y conectan directamente con los ODS y con la preocupación creciente por la crisis climática.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.4. Economía social y solidaria" color="amber">
                    <p>
                        La <strong>economía social y solidaria</strong> engloba formas de organización económica que priorizan las personas y el bien común sobre la maximización del beneficio: <strong>cooperativas</strong> (propiedad y gestión democrática de los trabajadores), <strong>sociedades laborales</strong>, <strong>mutualidades</strong>, <strong>fundaciones</strong>, <strong>empresas de inserción</strong> y <strong>empresas sociales</strong>.
                    </p>
                    <p>
                        La <strong>Economía del Bien Común</strong>, propuesta por el economista austríaco <strong>Christian Felber</strong> (2010), plantea un modelo en el que el éxito empresarial se mide no por el beneficio financiero, sino por su contribución al bien común (dignidad humana, solidaridad, sostenibilidad ecológica, justicia social, democracia). Las empresas elaboran un "Balance del Bien Común" que mide su impacto social y ambiental, y son incentivadas por el Estado en función de dicho balance.
                    </p>
                    <p>
                        En España, el sector de la economía social representa aproximadamente el 10 % del PIB y emplea a más de 2,2 millones de personas. La Ley 5/2011, de 29 de marzo, de Economía Social, reconoce y regula estas entidades. A nivel europeo, el <em>Plan de Acción para la Economía Social</em> (2021) de la Comisión Europea impulsa el desarrollo de este sector.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="6.5. Impacto de la digitalización" color="pink">
                    <p>
                        La <strong>revolución digital</strong> está transformando profundamente los sistemas económicos. La <strong>inteligencia artificial</strong>, la <strong>automatización</strong>, el <strong>big data</strong>, el <strong>blockchain</strong> y el <strong>Internet de las Cosas</strong> están modificando las relaciones entre los agentes económicos, los modos de producción, la organización del trabajo y los mecanismos de distribución.
                    </p>
                    <p>
                        La digitalización plantea desafíos transversales a todos los sistemas económicos: la <strong>destrucción de empleo</strong> en sectores automatizables (que convive con la creación de empleo en nuevos sectores), la <strong>concentración del poder económico</strong> en manos de las grandes tecnológicas (los "GAFAM": Google, Apple, Meta, Amazon, Microsoft), la <strong>fiscalidad digital</strong> (cómo gravar a empresas que operan globalmente sin presencia física), la <strong>protección de datos</strong> personales y la <strong>brecha digital</strong> entre países y entre generaciones.
                    </p>
                    <p>
                        Estos retos exigen una <strong>reformulación</strong> del papel del Estado y de las reglas del juego económico, lo que actualiza permanentemente el debate sobre los sistemas económicos.
                    </p>
                </TheoryBlock>
            </Card>
