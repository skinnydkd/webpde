                    </p>
                    <p>
                        El presente tema se estructura en cinco epígrafes: en primer lugar, se define y contextualiza la globalización; en segundo lugar, se analizan sus factores impulsores; en tercer lugar, se presentan sus dimensiones; en cuarto lugar, se examinan sus efectos positivos y negativos; y en quinto lugar, se abordan los retos y la gobernanza de la globalización.
                    </p>
                </div>
            </Card>

            <Card title="1. Concepto y etapas de la globalización" icon="📘">
                <TheoryBlock title="1.1. Definición" color="green">
                    <p>
                        El FMI (1997) define la globalización como «la creciente interdependencia económica del conjunto de países del mundo, provocada por el aumento del volumen y la variedad de las transacciones transfronterizas de bienes y servicios, así como de los flujos internacionales de capitales, al tiempo que por la difusión acelerada de la tecnología». El concepto abarca no solo la dimensión económica sino también la política, cultural, tecnológica y social.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Etapas históricas" color="emerald">
                    <p>
                        <strong>Primera globalización (1870-1914):</strong> impulsada por el patrón oro, el ferrocarril, el barco de vapor y el telégrafo. Libre movilidad de capital y trabajo (migraciones masivas a América). Interrumpida por la Primera Guerra Mundial y el proteccionismo de entreguerras.<br/>
                    </p>
                    <p>
                        <strong>Desglobalización (1914-1945):</strong> guerras mundiales, proteccionismo (Smoot-Hawley 1930), controles de capital, autarquía.<br/>
                    </p>
                    <p>
                        <strong>Segunda globalización — fase institucional (1945-1980):</strong> Bretton Woods, GATT, reconstrucción europea, liberalización comercial gradual entre países desarrollados. Flujos de capital aún regulados.<br/>
                    </p>
                    <p>
                        <strong>Segunda globalización — fase de hiperglobalización (1980-2008):</strong> liberalización financiera, caída del Muro de Berlín, apertura de China e India, revolución TIC, internet, contenedores. El comercio mundial como porcentaje del PIB pasó del 25 % al 60 %.<br/>
                    </p>
                    <p>
                        <strong>¿Desglobalización? (post-2008):</strong> crisis financiera, auge del populismo y nacionalismo económico, guerra comercial EE. UU.-China, Brexit, pandemia COVID-19, guerra en Ucrania, relocalizaciones (<em>nearshoring, friendshoring</em>). Algunos autores hablan de «<strong>slowbalization</strong>» (Economist, 2019) o fragmentación geoestratégica del comercio.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Factores impulsores de la globalización" icon="📘">
                <TheoryBlock title="2.1. Avances tecnológicos" color="green">
                    <p>
                        <strong>Transporte:</strong> el contenedor (Malcolm McLean, 1956) redujo drásticamente los costes de transporte marítimo. La aviación comercial abarató el transporte de personas y mercancías de alto valor.<br/>
                        <strong>Comunicaciones:</strong> el teléfono, el fax, internet y la telefonía móvil han reducido los costes de comunicación a prácticamente cero. Internet permite coordinar cadenas de producción globales en tiempo real.<br/>
                        <strong>Digitalización:</strong> la revolución digital ha permitido el comercio electrónico, los servicios digitales transfronterizos, la deslocalización de servicios (offshoring de call centers, programación, contabilidad) y el trabajo remoto global.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Liberalización económica" color="emerald">
                    <p>
                        <strong>Comercial:</strong> las rondas del GATT/OMC redujeron los aranceles medios del 40 % al 5 %. Los acuerdos de libre comercio regionales (UE, TLCAN/T-MEC, ASEAN) han profundizado la integración.<br/>
                        <strong>Financiera:</strong> la desregulación de los mercados de capitales (años 80-90) facilitó los flujos de inversión directa y en cartera. La libre movilidad de capitales permite financiar el desarrollo pero también genera inestabilidad (crisis financieras).<br/>
                        <strong>Consenso de Washington (1989):</strong> decálogo de políticas promovidas por el FMI, BM y Tesoro de EE. UU. para los países en desarrollo: liberalización comercial y financiera, privatización, disciplina fiscal, desregulación. Aplicado con resultados mixtos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Factores geopolíticos" color="teal">
                    <p>
                        <strong>Caída del Muro de Berlín (1989):</strong> integración de los países del antiguo bloque soviético en la economía de mercado global.<br/>
                        <strong>Apertura de China:</strong> las reformas de Deng Xiaoping (1978) y la entrada de China en la OMC (2001) incorporaron 1.400 millones de personas a la economía mundial, transformando las cadenas de producción globales.<br/>
                        <strong>India y otras economías emergentes:</strong> las reformas liberalizadoras de 1991 en India y el crecimiento de Brasil, México, Turquía y el Sudeste Asiático ampliaron la globalización.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Dimensiones de la globalización" icon="📘">
                <TheoryBlock title="3.1. Globalización comercial" color="green">
                    <p>
                        El comercio mundial de bienes y servicios como porcentaje del PIB mundial pasó del 25 % en 1970 al 60 % en 2008 (aunque retrocedió tras la crisis financiera). Las <strong>cadenas globales de valor</strong> (CGV) fragmentan la producción: un iPhone se diseña en California, sus componentes se fabrican en Japón, Corea, China y Taiwán, y se ensambla en China. Más del 70 % del comercio mundial consiste en bienes intermedios que circulan entre eslabones de las CGV.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Globalización financiera" color="emerald">
                    <p>
                        Los flujos financieros internacionales (inversión directa, en cartera, préstamos, remesas) han crecido aún más que los flujos comerciales. Los mercados de capitales están interconectados: una crisis financiera en un país se transmite rápidamente a otros (<strong>contagio</strong>). La inversión extranjera directa (IED) mundial alcanzó 1,3 billones de dólares anuales pre-COVID.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Globalización de la producción y el trabajo" color="teal">
                    <p>
                        Las <strong>empresas multinacionales</strong> (EMN) son los principales agentes de la globalización productiva. Las 100 mayores EMN controlan activos por más de 10 billones de dólares fuera de sus países de origen. La deslocalización (<em>offshoring</em>) y la subcontratación internacional (<em>outsourcing</em>) han reconfigurado el mapa productivo mundial. Las migraciones internacionales y las remesas (más de 650.000 millones de dólares anuales) son otra dimensión clave.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Efectos de la globalización" icon="📘">
                <TheoryBlock title="4.1. Efectos positivos" color="green">
                    <p>
                        <strong>Crecimiento económico:</strong> la apertura comercial y la inversión extranjera han impulsado el crecimiento de muchas economías, especialmente en Asia Oriental (China, Vietnam, Corea del Sur, Taiwán).<br/>
                        <strong>Reducción de la pobreza:</strong> más de 1.000 millones de personas han salido de la pobreza extrema desde 1990, en gran parte gracias a la integración de China e India en la economía global (Banco Mundial).<br/>
                        <strong>Difusión tecnológica:</strong> la globalización acelera la transferencia de tecnología, conocimientos y mejores prácticas entre países.<br/>
                        <strong>Beneficios para los consumidores:</strong> mayor variedad de productos a precios más bajos.<br/>
                        <strong>Convergencia:</strong> algunas economías emergentes han convergido con los países desarrollados en términos de renta per cápita (China, Polonia, Chile).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Efectos negativos y críticas" color="amber">
                    <p>
                        <strong>Desigualdad:</strong> aunque la desigualdad entre países se ha reducido (convergencia Asia), la desigualdad <strong>dentro</strong> de los países desarrollados ha aumentado. Los trabajadores poco cualificados de los países ricos han visto estancarse sus salarios frente a la competencia de los trabajadores de países con bajos costes laborales (Branko Milanovic, «curva del elefante»).<br/>
                        <strong>Inestabilidad financiera:</strong> la libre movilidad de capitales ha generado burbujas especulativas, crisis financieras recurrentes (Asia 1997, subprimes 2008) y contagio internacional.<br/>
                        <strong>Pérdida de soberanía:</strong> los gobiernos nacionales ven reducida su capacidad para aplicar políticas autónomas (impositiva, reguladora, medioambiental) ante la movilidad del capital y la competencia fiscal entre países.<br/>
                        <strong>Degradación medioambiental:</strong> la deslocalización hacia países con regulación ambiental laxa (pollution havens) y el aumento del transporte internacional generan externalidades ambientales. El «dumping ecológico» perjudica a los países con estándares más exigentes.<br/>
                        <strong>Homogeneización cultural:</strong> la difusión de patrones de consumo occidentales puede erosionar las culturas locales.<br/>
                        <strong>Concentración del poder corporativo:</strong> las grandes EMN adquieren poder de mercado y capacidad de presión política que puede debilitar la competencia y la democracia.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Gobernanza de la globalización y retos" icon="📘">
                <TheoryBlock title="5.1. Instituciones de gobernanza global" color="green">
                    <p>
                        <strong>FMI:</strong> vigilancia macroeconómica, asistencia financiera a países en crisis, asesoramiento en política económica. 190 miembros.<br/>
                        <strong>Banco Mundial:</strong> financiación del desarrollo, reducción de la pobreza, asistencia técnica.<br/>
                        <strong>OMC:</strong> regulación del comercio multilateral, resolución de disputas.<br/>
                        <strong>Naciones Unidas (UNCTAD, PNUD):</strong> desarrollo, cooperación internacional, Objetivos de Desarrollo Sostenible (ODS/Agenda 2030).<br/>
                        <strong>G7/G20:</strong> coordinación macroeconómica entre las principales economías.<br/>
                        <strong>OCDE:</strong> coordinación de políticas, intercambio de mejores prácticas, lucha contra la evasión fiscal (BEPS).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. El trilema de la globalización (Rodrik)" color="emerald">
                    <p>
                        <strong>Dani Rodrik</strong> (2011) formula un «trilema político de la globalización»: no es posible tener simultáneamente (1) hiperglobalización, (2) democracia plena y (3) soberanía nacional. Los países pueden lograr solo <strong>dos de tres</strong>:
                    </p>
                    <p>
                        Hiperglobalización + soberanía → sacrificio de la democracia (tecnócratas imponen ajustes).<br/>
                        Hiperglobalización + democracia → sacrificio de la soberanía (gobernanza global federalista).<br/>
                        Democracia + soberanía → globalización moderada (con espacio para políticas nacionales).
                    </p>
                    <p>
                        Rodrik aboga por una «<strong>globalización inteligente</strong>» que permita a los países mantener suficiente espacio de política económica (policy space) para atender las demandas democráticas internas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Retos actuales" color="teal">
                    <p>
                        <strong>Fragmentación geoeconómica:</strong> la rivalidad EE. UU.-China, las sanciones económicas y los controles tecnológicos amenazan con dividir la economía mundial en bloques rivales.<br/>
                        <strong>Transición energética:</strong> la descarbonización requiere cooperación global pero genera tensiones comerciales (CBAM europeo, disputas sobre subvenciones a renovables).<br/>
                        <strong>Desigualdad y polarización:</strong> los perdedores de la globalización alimentan movimientos populistas y proteccionistas que cuestionan el orden liberal internacional.<br/>
                        <strong>Regulación digital:</strong> las grandes plataformas tecnológicas operan globalmente pero se regulan nacionalmente, generando conflictos jurisdiccionales (fiscalidad digital, privacidad de datos, inteligencia artificial).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        La globalización es un tema transversal que conecta con múltiples saberes del currículo de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), especialmente CE4 y CE5. Contribuye a las competencias <strong>CC</strong> (ciudadanía global, sostenibilidad, desigualdad), <strong>CPSAA</strong> (pensamiento crítico sobre los efectos de la globalización), <strong>STEM</strong> (análisis de datos de comercio, inversión y desarrollo), <strong>CE</strong> (emprendimiento en contextos globales) y <strong>CCL</strong> (lectura e interpretación de informes de organismos internacionales).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        La globalización económica es el proceso de creciente integración e interdependencia de las economías nacionales, impulsado por los avances tecnológicos, la liberalización comercial y financiera y los cambios geopolíticos. Ha pasado por varias etapas históricas y se manifiesta en las dimensiones comercial, financiera y productiva. Sus efectos son ambivalentes: ha impulsado el crecimiento, reducido la pobreza global y difundido la tecnología, pero también ha aumentado la desigualdad interna en los países desarrollados, generado inestabilidad financiera y amenazado la soberanía y el medio ambiente. La gobernanza de la globalización requiere instituciones multilaterales eficaces y el equilibrio que Rodrik formula como trilema: hiperglobalización, democracia y soberanía no pueden coexistir plenamente. Los retos actuales —fragmentación geoeconómica, transición energética, desigualdad y regulación digital— configuran un futuro de globalización más selectiva y geopolíticamente condicionada.
                    </p>
                </TheoryBlock>
            </Card>

    const Tema36Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La <strong>integración económica</strong> es el proceso por el cual dos o más países acuerdan eliminar o reducir las barreras económicas entre sí, creando un espacio económico común. Representa una excepción pactada al principio de nación más favorecida de la OMC (art. XXIV del GATT) y ha sido una de las tendencias más destacadas de la economía internacional desde la Segunda Guerra Mundial. La <strong>Unión Europea (UE)</strong> constituye el proceso de integración económica más avanzado de la historia, habiendo alcanzado no solo un mercado único sino también una unión monetaria con moneda común (el euro).
                    </p>
                    <p>
                        La teoría de la integración económica, desarrollada por <strong>Jacob Viner</strong> (1950), <strong>Bela Balassa</strong> (1961) y otros, identifica distintos grados de integración —desde la simple zona de libre comercio hasta la unión económica plena— y analiza sus efectos estáticos (creación y desviación de comercio) y dinámicos (economías de escala, competencia, inversión).
                    </p>
                    <p>
                        Desde la perspectiva curricular, este tema se enmarca en los saberes del bloque «La economía internacional» de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), con especial conexión con las competencias CE4 y CE5. La LOMLOE destaca la importancia de que el alumnado conozca el proceso de construcción europea y su impacto en la economía española.
                    </p>
                    <p>
                        El presente tema se estructura en cinco epígrafes: los grados de integración económica; los efectos de la integración; los orígenes y evolución de la UE; las instituciones europeas; y las políticas económicas de la UE.
                    </p>
                </div>
            </Card>

            <Card title="1. Grados de integración económica (Balassa, 1961)" icon="📘">
                <TheoryBlock title="1.1. Clasificación" color="green">
                    <p>
                        <strong>Bela Balassa</strong> (1961) identificó cinco grados sucesivos de integración, cada uno de los cuales incorpora las características del anterior:
                    </p>
                    <p>
                        <strong>1. Zona de libre comercio (ZLC):</strong> los países miembros eliminan los aranceles y restricciones cuantitativas al comercio <strong>entre sí</strong>, pero cada país mantiene sus propios aranceles frente a terceros países. Ejemplo: EFTA (Asociación Europea de Libre Comercio), T-MEC (Tratado entre México, Estados Unidos y Canadá). Problema: desviación de comercio vía el país con arancel más bajo (necesidad de reglas de origen).<br/>
                    </p>
                    <p>
                        <strong>2. Unión aduanera (UA):</strong> además de la libre circulación interna, los miembros adoptan un <strong>arancel exterior común</strong> (AEC) frente a terceros países. Ejemplo: el Mercosur tiene elementos de UA. Elimina el problema de las reglas de origen.<br/>
                    </p>
                    <p>
                        <strong>3. Mercado común:</strong> a la UA se añade la <strong>libre circulación de factores productivos</strong> (trabajo y capital) entre los países miembros. Ejemplo: la CEE a partir del Acta Única Europea (1986).<br/>
                    </p>
                    <p>
                        <strong>4. Unión económica:</strong> al mercado común se añade la <strong>coordinación y armonización de políticas económicas</strong> (fiscal, monetaria, laboral, social). Es la fase en la que se encuentra la UE actual, con distintos niveles de armonización según el ámbito.<br/>
                    </p>
                    <p>
                        <strong>5. Unión económica plena (o política):</strong> implica la <strong>unificación total de las políticas económicas</strong>, con un gobierno supranacional que administra la política fiscal, monetaria y exterior común. Equivale a la creación de un Estado federal. Ningún proceso de integración ha alcanzado plenamente esta fase.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Efectos de la integración económica" icon="📘">
                <TheoryBlock title="2.1. Efectos estáticos (Viner, 1950)" color="green">
                    <p>
                        <strong>Jacob Viner</strong> demostró que una unión aduanera no es necesariamente beneficiosa; su efecto neto depende del balance entre:
                    </p>
                    <p>
                        <strong>Creación de comercio:</strong> la eliminación de aranceles entre miembros permite sustituir producción nacional ineficiente por importaciones más baratas del socio. Efecto positivo: mejora la eficiencia y el bienestar.<br/>
                        <strong>Desviación de comercio:</strong> el arancel exterior común puede hacer que se sustituyan importaciones baratas de terceros países (no miembros) por importaciones más caras del socio (que ya no paga arancel). Efecto negativo: empeora la eficiencia.
                    </p>
                    <p>
                        La integración será <strong>beneficiosa</strong> si la creación de comercio supera a la desviación. Esto es más probable cuanto más altos eran los aranceles previos entre los miembros, cuanto más bajos sean los aranceles externos, cuanto más similares y competitivas sean las economías de los miembros, y cuanto mayor sea el tamaño del bloque.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Efectos dinámicos" color="emerald">
                    <p>
                        Los efectos dinámicos son generalmente más importantes que los estáticos:
                    </p>
                    <p>
                        <strong>Economías de escala:</strong> el mercado ampliado permite a las empresas alcanzar la escala eficiente de producción, reduciendo costes unitarios.<br/>
                        <strong>Mayor competencia:</strong> la eliminación de barreras expone a las empresas nacionales a la competencia de los socios, estimulando la eficiencia y la innovación.<br/>
                        <strong>Atracción de inversión extranjera:</strong> un mercado integrado de gran tamaño atrae más IED que cada mercado nacional por separado (efecto plataforma).<br/>
                        <strong>Difusión tecnológica:</strong> la libre circulación facilita la transferencia de conocimientos y mejores prácticas.<br/>
                        <strong>Estabilidad:</strong> la integración económica tiende a reforzar la estabilidad política entre los miembros (la UE nació como proyecto de paz).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Orígenes y evolución de la Unión Europea" icon="📘">
                <TheoryBlock title="3.1. Los orígenes (1950-1957)" color="green">
                    <p>
                        Tras la devastación de dos guerras mundiales, líderes europeos como <strong>Jean Monnet, Robert Schuman, Konrad Adenauer</strong> y <strong>Alcide De Gasperi</strong> impulsaron la integración como medio para garantizar la paz y la prosperidad en Europa.
                    </p>
                    <p>
                        <strong>Declaración Schuman (9 mayo 1950):</strong> propuesta de poner en común la producción francoalemana de carbón y acero bajo una Alta Autoridad supranacional. «Europa no se hará de una vez ni en una obra de conjunto: se hará mediante realizaciones concretas».<br/>
                        <strong>CECA (1951):</strong> Comunidad Europea del Carbón y del Acero. 6 miembros fundadores: Francia, Alemania, Italia, Bélgica, Países Bajos, Luxemburgo.<br/>
                        <strong>Tratados de Roma (1957):</strong> creación de la <strong>CEE</strong> (Comunidad Económica Europea) y la EURATOM.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Ampliaciones y profundización" color="emerald">
                    <p>
                        <strong>1973:</strong> primera ampliación (Reino Unido, Irlanda, Dinamarca). <strong>1981:</strong> Grecia. <strong>1986:</strong> España y Portugal. <strong>1995:</strong> Austria, Finlandia, Suecia. <strong>2004:</strong> gran ampliación al Este (10 países). <strong>2007:</strong> Rumanía, Bulgaria. <strong>2013:</strong> Croacia. <strong>2020:</strong> salida del Reino Unido (Brexit). De 6 a 27 miembros.
                    </p>
                    <p>
                        <strong>Acta Única Europea (1986):</strong> programa para completar el mercado interior (libre circulación de bienes, servicios, personas y capitales — «las cuatro libertades»). Objetivo: 1 de enero de 1993.<br/>
                        <strong>Tratado de Maastricht (1992):</strong> crea la Unión Europea, establece los criterios de convergencia para la unión monetaria y los tres pilares (económico, PESC, justicia e interior).<br/>
                        <strong>Tratado de Ámsterdam (1997):</strong> refuerza los derechos de ciudadanía y la política social.<br/>
                        <strong>Tratado de Niza (2001):</strong> reforma institucional para la ampliación al Este.<br/>
                        <strong>Tratado de Lisboa (2007/2009):</strong> reforma institucional, crea la figura del Presidente del Consejo Europeo y el Alto Representante para Asuntos Exteriores.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. España en la UE" color="teal">
                    <p>
                        España se adhirió a la CEE el <strong>1 de enero de 1986</strong>, junto con Portugal. La integración supuso una profunda transformación de la economía española: apertura comercial, modernización industrial, entrada masiva de inversión extranjera, acceso a los fondos estructurales y de cohesión, convergencia en renta per cápita con la media europea y consolidación democrática. España adoptó el euro en 1999 y ha sido uno de los principales beneficiarios de la política de cohesión europea.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Instituciones de la Unión Europea" icon="📘">
                <TheoryBlock title="4.1. Principales instituciones" color="green">
                    <p>
                        <strong>Consejo Europeo:</strong> define las orientaciones políticas generales. Lo integran los jefes de Estado o de Gobierno de los 27 miembros y el presidente de la Comisión. Presidente permanente (actualmente elegido por 2,5 años).<br/>
                    </p>
                    <p>
                        <strong>Consejo de la UE (Consejo de Ministros):</strong> colegislador junto con el Parlamento. Representa a los gobiernos nacionales. Vota por mayoría cualificada (55 % de Estados que representen al 65 % de la población) o unanimidad según la materia.<br/>
                    </p>
                    <p>
                        <strong>Parlamento Europeo:</strong> colegislador y aprueba el presupuesto. 705 eurodiputados elegidos por sufragio universal directo cada 5 años. Sede en Estrasburgo.<br/>
                    </p>
                    <p>
                        <strong>Comisión Europea:</strong> órgano ejecutivo. Propone legislación, ejecuta políticas, vigila el cumplimiento de los Tratados. Un comisario por Estado miembro. Presidenta elegida por el Consejo Europeo y confirmada por el Parlamento.<br/>
                    </p>
                    <p>
                        <strong>Tribunal de Justicia de la UE (TJUE):</strong> interpreta el Derecho de la UE y garantiza su aplicación uniforme. Sede en Luxemburgo.<br/>
                    </p>
                    <p>
                        <strong>Banco Central Europeo (BCE):</strong> dirige la política monetaria de la eurozona. Sede en Fráncfort. Independencia garantizada por los Tratados.<br/>
                    </p>
                    <p>
                        <strong>Tribunal de Cuentas:</strong> fiscaliza la ejecución del presupuesto de la UE.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Políticas económicas de la UE" icon="📘">
                <TheoryBlock title="5.1. El mercado interior" color="green">
                    <p>
                        El <strong>mercado interior</strong> (o mercado único) garantiza las cuatro libertades: libre circulación de <strong>bienes</strong> (eliminación de fronteras interiores, reconocimiento mutuo), <strong>servicios</strong> (directiva de servicios), <strong>personas</strong> (espacio Schengen, libertad de establecimiento y trabajo) y <strong>capitales</strong> (libre movimiento de inversiones y ahorro). Es el logro más tangible de la integración europea y ha generado importantes ganancias de eficiencia, comercio y crecimiento.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Política comercial común" color="emerald">
                    <p>
                        La UE es una unión aduanera con arancel exterior común y política comercial común negociada por la Comisión Europea en nombre de los 27 miembros. Es el mayor bloque comercial del mundo. Ha firmado acuerdos de libre comercio con numerosos países y bloques (Canadá-CETA, Japón, Mercosur, Corea del Sur).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Política de cohesión y fondos estructurales" color="teal">
                    <p>
                        La <strong>política de cohesión</strong> busca reducir las disparidades económicas y sociales entre regiones. Se financia con los fondos estructurales: <strong>FEDER</strong> (Fondo Europeo de Desarrollo Regional), <strong>FSE+</strong> (Fondo Social Europeo Plus), <strong>Fondo de Cohesión</strong> (para países con PIBpc &lt; 90 % media UE). España ha sido históricamente uno de los mayores beneficiarios (más de 150.000 millones de euros recibidos desde 1986).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.4. Política Agraria Común (PAC)" color="amber">
                    <p>
                        La PAC es la política más antigua y durante décadas la de mayor presupuesto (hoy alrededor del 33 % del presupuesto UE). Objetivos: garantizar la seguridad alimentaria, estabilizar los mercados agrarios, asegurar un nivel de vida equitativo a los agricultores y contribuir a la sostenibilidad ambiental. Ha evolucionado de un sistema de precios garantizados y excedentes a un modelo basado en pagos directos desacoplados y desarrollo rural.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.5. Presupuesto de la UE y NextGenerationEU" color="violet">
                    <p>
                        El presupuesto de la UE (Marco Financiero Plurianual, MFP) se financia con recursos propios: derechos de aduana, contribuciones basadas en el IVA y en la RNB de los Estados miembros. El MFP 2021-2027 asciende a unos 1,1 billones de euros.
                    </p>
                    <p>
                        <strong>NextGenerationEU</strong> (2020) fue la respuesta a la pandemia: un plan de recuperación de 750.000 millones de euros financiado con <strong>deuda común europea</strong> (emisión conjunta de bonos por primera vez en la historia de la UE). España es el segundo mayor beneficiario con 140.000 millones de euros (subvenciones + préstamos). Marca un precedente de solidaridad fiscal europea.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        La integración económica y la UE son temas nucleares del currículo de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), con conexión directa con CE4 y CE5. Contribuyen a las competencias <strong>CC</strong> (ciudadanía europea, valores democráticos, solidaridad), <strong>CPSAA</strong> (juicio informado sobre las políticas europeas), <strong>CE</strong> (mercado interior como espacio de oportunidades empresariales) y <strong>STEM</strong> (análisis de indicadores de convergencia).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        La integración económica avanza por cinco grados (Balassa): zona de libre comercio, unión aduanera, mercado común, unión económica y unión plena. Sus efectos pueden ser positivos (creación de comercio, economías de escala, competencia, inversión) o negativos (desviación de comercio). La UE es el proceso de integración más avanzado del mundo: desde la CECA (1951) hasta los 27 miembros actuales, ha construido un mercado interior con cuatro libertades, una política comercial común, fondos de cohesión y, con el euro, una unión monetaria. España se benefició enormemente de su adhesión (1986), convergiendo con la media europea. Los retos actuales incluyen la profundización de la integración fiscal (deuda común con NGEU como precedente), la gestión de la ampliación (Ucrania, Balcanes), la autonomía estratégica y la transición digital y ecológica.
                    </p>
                </TheoryBlock>
            </Card>

            <BibliografiaBox items={[
