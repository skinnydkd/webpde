    // ════════════════════════════════════════════════════════════════
    // TEMA 31 — El comercio internacional. Ventaja absoluta y comparativa.
    // ════════════════════════════════════════════════════════════════
    const Tema31Complet = () => (
        <div className="space-y-6 animate-fade">
            {/* ── INTRODUCCIÓN ────────────────────────────────────── */}
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La <strong>economía internacional</strong> es la rama de la ciencia económica que estudia las relaciones económicas entre países: los flujos de bienes, servicios, capitales y factores productivos a través de las fronteras nacionales. El <strong>comercio internacional</strong> —el intercambio de bienes y servicios entre residentes de distintos países— constituye uno de los fenómenos económicos más antiguos y relevantes de la historia de la humanidad. Desde las rutas comerciales fenicias y la Ruta de la Seda hasta las cadenas globales de valor del siglo XXI, el comercio ha sido motor de crecimiento, especialización y difusión tecnológica.
                    </p>
                    <p>
                        La pregunta fundamental de la teoría del comercio internacional es: <strong>¿por qué comercian los países?</strong> La respuesta clásica, articulada por <strong>Adam Smith</strong> (1776) y perfeccionada por <strong>David Ricardo</strong> (1817), se basa en las diferencias de costes de producción entre países: el comercio permite que cada nación se especialice en aquello que produce con mayor eficiencia (ventaja absoluta) o con menor coste relativo (ventaja comparativa), generando ganancias mutuas del comercio.
                    </p>
                    <p>
                        Desde la perspectiva curricular, este tema se enmarca en los saberes básicos del bloque «La economía internacional» de la materia de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022) y en las competencias específicas CE4 (análisis del funcionamiento del comercio internacional) y CE5 (comprensión del contexto económico internacional). La LOMLOE (Ley Orgánica 3/2020) subraya la importancia de que el alumnado comprenda la interdependencia económica global, contribuyendo a las competencias CC (ciudadanía activa en un mundo globalizado), STEM (análisis cuantitativo de flujos comerciales) y CE (comprensión de la iniciativa económica internacional).
                    </p>
                    <p>
                        El presente tema se estructura en cinco epígrafes: en primer lugar, se aborda el concepto y las causas del comercio internacional; en segundo lugar, se desarrolla la teoría de la ventaja absoluta de Smith; en tercer lugar, se presenta la ventaja comparativa de Ricardo; en cuarto lugar, se expone el modelo de Heckscher-Ohlin y las nuevas teorías del comercio; y en quinto lugar, se analizan los términos de intercambio y las ganancias del comercio.
                    </p>
                </div>
            </Card>

            {/* ── DESARROLLO ──────────────────────────────────────── */}

            {/* Epígrafe 1 */}
            <Card title="1. El comercio internacional: concepto y causas" icon="📘">
                <TheoryBlock title="1.1. Concepto de comercio internacional" color="green">
                    <p>
                        El <strong>comercio internacional</strong> es el intercambio de bienes y servicios entre residentes de distintos países a través de las fronteras nacionales. Comprende tanto las <strong>exportaciones</strong> (ventas de bienes y servicios nacionales al exterior) como las <strong>importaciones</strong> (compras de bienes y servicios extranjeros). El volumen del comercio mundial ha crecido exponencialmente: según la OMC, el comercio de mercancías se multiplicó por más de 30 entre 1950 y 2020, creciendo a un ritmo medio superior al del PIB mundial.
                    </p>
                    <p>
                        A diferencia del comercio interior, el comercio internacional presenta características específicas: la existencia de <strong>fronteras políticas</strong> (regulación aduanera, aranceles, barreras no arancelarias), diferentes <strong>monedas</strong> (necesidad de tipos de cambio), distintos <strong>marcos legales y fiscales</strong>, diferencias en <strong>costes de transporte</strong> y comunicación, y barreras <strong>culturales y lingüísticas</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Causas del comercio internacional" color="emerald">
                    <p>
                        Los países comercian entre sí por múltiples razones que la teoría económica ha ido identificando:
                    </p>
                    <p>
                        <strong>1. Diferencias en los recursos naturales y dotación de factores:</strong> los países poseen distintas dotaciones de tierra, clima, materias primas, trabajo y capital. Arabia Saudí exporta petróleo; Brasil, café; Australia, minerales. El modelo de Heckscher-Ohlin formaliza esta idea.
                    </p>
                    <p>
                        <strong>2. Diferencias en la productividad y tecnología:</strong> los países difieren en su capacidad para producir bienes con mayor o menor eficiencia. Esta es la base de las teorías de la ventaja absoluta (Smith) y comparativa (Ricardo).
                    </p>
                    <p>
                        <strong>3. Economías de escala:</strong> la producción a gran escala reduce los costes unitarios. El comercio internacional permite a las empresas ampliar su mercado y aprovechar rendimientos crecientes a escala, como destaca la <strong>nueva teoría del comercio</strong> (Krugman, 1979).
                    </p>
                    <p>
                        <strong>4. Diferenciación del producto:</strong> los consumidores valoran la variedad. El comercio intraindustrial (intercambio de productos similares entre países de desarrollo comparable) se explica por la <strong>competencia monopolística</strong> y la preferencia por la variedad.
                    </p>
                    <p>
                        <strong>5. Diferencias en gustos y preferencias:</strong> incluso países con dotaciones similares pueden comerciar si sus consumidores tienen preferencias distintas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Comercio interindustrial e intraindustrial" color="teal">
                    <p>
                        El <strong>comercio interindustrial</strong> consiste en el intercambio de productos de distintos sectores (por ejemplo, España exporta aceite de oliva e importa petróleo). Se explica bien por las teorías clásicas basadas en ventajas comparativas y diferencias en dotación de factores.
                    </p>
                    <p>
                        El <strong>comercio intraindustrial</strong> consiste en el intercambio simultáneo de productos del mismo sector entre países con nivel de desarrollo similar (por ejemplo, Alemania exporta automóviles BMW a Francia e importa automóviles Renault). Este tipo de comercio, que representa más del 60 % del comercio entre países desarrollados, se explica por las economías de escala, la diferenciación del producto y la competencia monopolística. El <strong>índice de Grubel-Lloyd</strong> mide la intensidad del comercio intraindustrial.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. La ventaja absoluta de Adam Smith" icon="📘">
                <TheoryBlock title="2.1. La teoría de Adam Smith (1776)" color="green">
                    <p>
                        En <em>La riqueza de las naciones</em> (1776), <strong>Adam Smith</strong> planteó el principio de la <strong>ventaja absoluta</strong>: un país tiene ventaja absoluta en la producción de un bien cuando puede producirlo con <strong>menos recursos</strong> (menos horas de trabajo, menos coste) que otro país. Según Smith, cada país debería especializarse en la producción de aquellos bienes en los que posee ventaja absoluta y adquirir mediante el comercio aquellos en los que tiene desventaja.
                    </p>
                    <p>
                        Smith utilizó esta idea para criticar el <strong>mercantilismo</strong>, que veía el comercio como un juego de suma cero (lo que un país gana, otro lo pierde). Smith demostró que el comercio basado en la especialización es un <strong>juego de suma positiva</strong>: ambos países se benefician al disponer de más bienes de los que podrían producir en autarquía.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Ejemplo numérico" color="emerald">
                    <p>
                        Supongamos dos países (España e Inglaterra) y dos bienes (vino y tela), utilizando el <strong>trabajo</strong> como único factor productivo (modelo ricardiano simplificado).
                    </p>
                    <p>
                        <strong>Horas de trabajo necesarias por unidad:</strong>
                    </p>
                    <p>
                        España: 1 hora/vino, 4 horas/tela<br/>
                        Inglaterra: 3 horas/vino, 2 horas/tela
                    </p>
                    <p>
                        España tiene <strong>ventaja absoluta en vino</strong> (1 &lt; 3 horas) e Inglaterra tiene <strong>ventaja absoluta en tela</strong> (2 &lt; 4 horas). Si cada país se especializa en el bien en el que es más eficiente y comercia, ambos obtienen más producción total con los mismos recursos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Limitaciones de la ventaja absoluta" color="amber">
                    <p>
                        La teoría de Smith no explica qué sucede cuando un país es <strong>más eficiente en todos los bienes</strong>. Si Inglaterra produjera tanto el vino como la tela con menos recursos que España, ¿habría base para el comercio? Smith no ofreció respuesta. Fue <strong>David Ricardo</strong> quien resolvió este problema con la teoría de la ventaja comparativa.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. La ventaja comparativa de David Ricardo" icon="📘">
                <TheoryBlock title="3.1. El principio de la ventaja comparativa (1817)" color="green">
                    <p>
                        En <em>Principios de economía política y tributación</em> (1817), <strong>David Ricardo</strong> demostró que el comercio es mutuamente beneficioso incluso cuando un país es <strong>más eficiente que otro en la producción de todos los bienes</strong>. Lo relevante no es la eficiencia absoluta, sino la eficiencia <strong>relativa</strong>: el <strong>coste de oportunidad</strong>.
                    </p>
                    <p>
                        Un país tiene <strong>ventaja comparativa</strong> en la producción de un bien cuando puede producirlo con un <strong>menor coste de oportunidad</strong> que el otro país. El coste de oportunidad de producir un bien es la cantidad del otro bien que se deja de producir.
                    </p>
                    <p>
                        La ley de la ventaja comparativa establece que cada país se beneficiará del comercio si se especializa en la producción de aquellos bienes en los que posee ventaja comparativa (menor coste de oportunidad) e importa aquellos en los que tiene desventaja comparativa.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Ejemplo numérico clásico" color="emerald">
                    <p>
                        <strong>Horas de trabajo necesarias por unidad:</strong>
                    </p>
                    <p>
                        Portugal: 80 horas/vino, 90 horas/tela<br/>
                        Inglaterra: 120 horas/vino, 100 horas/tela
                    </p>
                    <p>
                        Portugal es más eficiente en ambos bienes (ventaja absoluta en ambos). Sin embargo:
                    </p>
                    <p>
                        <strong>Coste de oportunidad del vino:</strong><br/>
                        Portugal: 80/90 = 0,89 unidades de tela<br/>
                        Inglaterra: 120/100 = 1,2 unidades de tela
                    </p>
                    <p>
                        <strong>Coste de oportunidad de la tela:</strong><br/>
                        Portugal: 90/80 = 1,125 unidades de vino<br/>
                        Inglaterra: 100/120 = 0,83 unidades de vino
                    </p>
                    <p>
                        Portugal tiene <strong>ventaja comparativa en vino</strong> (0,89 &lt; 1,2) e Inglaterra tiene <strong>ventaja comparativa en tela</strong> (0,83 &lt; 1,125). Ambos ganan si Portugal se especializa en vino e Inglaterra en tela, intercambiando a una relación de precios comprendida entre los costes de oportunidad de ambos países.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Ventaja comparativa → CO(bien A)_país1 < CO(bien A)_país2"
                    desc="CO = Coste d'oportunitat = Unitats del bé B que es deixen de produir per produir una unitat del bé A"
                />

                <TheoryBlock title="3.3. Supuestos del modelo ricardiano" color="teal">
                    <p>
                        El modelo de Ricardo se basa en <strong>supuestos simplificadores</strong>:
                    </p>
                    <p>
                        <strong>1.</strong> Dos países, dos bienes, un factor productivo (trabajo).<br/>
                        <strong>2.</strong> La <strong>teoría del valor-trabajo</strong>: el valor de los bienes depende exclusivamente de la cantidad de trabajo incorporado.<br/>
                        <strong>3.</strong> Rendimientos constantes a escala (la FPP es una línea recta).<br/>
                        <strong>4.</strong> Competencia perfecta en los mercados de bienes y factores.<br/>
                        <strong>5.</strong> El trabajo es <strong>perfectamente móvil</strong> dentro de cada país pero <strong>completamente inmóvil</strong> entre países.<br/>
                        <strong>6.</strong> No existen costes de transporte ni barreras comerciales.<br/>
                        <strong>7.</strong> Pleno empleo de los factores productivos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. La Frontera de Posibilidades de Producción (FPP) y las ganancias del comercio" color="green">
                    <p>
                        En el modelo ricardiano, la <strong>FPP de cada país es una línea recta</strong> (pendiente constante = coste de oportunidad constante). En autarquía, cada país produce y consume sobre su FPP. Con comercio, cada país se especializa según su ventaja comparativa y puede consumir combinaciones de bienes que se encuentran <strong>fuera de su FPP</strong>, es decir, más allá de lo que podría producir por sí mismo. Esta es la <strong>ganancia del comercio</strong>.
                    </p>
                    <p>
                        Las <strong>ganancias se reparten entre ambos países</strong> siempre que la relación real de intercambio (RRI) se sitúe entre los costes de oportunidad internos de cada país. Si la RRI coincide con el coste de oportunidad de uno de los países, ese país no obtiene ganancia (toda la ganancia la obtiene el otro).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. Importancia y vigencia de la ventaja comparativa" color="amber">
                    <p>
                        El principio de la ventaja comparativa es considerado uno de los resultados más potentes y contraintuitivos de la ciencia económica. <strong>Paul Samuelson</strong> lo calificó como «la proposición más hermosa de la economía». Su mensaje fundamental es que <strong>el comercio beneficia incluso al país menos eficiente</strong>, ya que le permite especializarse en lo que hace «relativamente mejor» y acceder a bienes más baratos mediante el intercambio.
                    </p>
                    <p>
                        No obstante, la teoría presenta <strong>limitaciones</strong>: supone pleno empleo, ignora los costes de ajuste de la especialización (desempleo sectorial durante la transición), no considera los efectos distributivos (dentro de cada país, los sectores que compiten con las importaciones se perjudican — teorema de Stolper-Samuelson) y asume rendimientos constantes a escala.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. Heckscher-Ohlin y nuevas teorías del comercio" icon="📘">
                <TheoryBlock title="4.1. El modelo de Heckscher-Ohlin (H-O)" color="green">
                    <p>
                        El modelo de <strong>Heckscher (1919) y Ohlin (1933)</strong> —ampliado formalmente por <strong>Samuelson</strong>— supera la limitación del modelo ricardiano (un solo factor) e introduce <strong>dos factores productivos</strong>: trabajo (L) y capital (K). La fuente de la ventaja comparativa no son las diferencias tecnológicas (como en Ricardo) sino las <strong>diferencias en la dotación relativa de factores</strong>.
                    </p>
                    <p>
                        <strong>Teorema H-O:</strong> cada país exportará el bien cuya producción utiliza intensivamente el factor del que está <strong>relativamente bien dotado</strong> (abundante) e importará el bien que utiliza intensivamente el factor relativamente escaso. Por ejemplo, un país abundante en trabajo (como China) exportará bienes intensivos en trabajo (textiles, manufactura ligera), mientras que un país abundante en capital (como Alemania) exportará bienes intensivos en capital (maquinaria, automóviles).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Teoremas asociados al modelo H-O" color="emerald">
                    <p>
                        <strong>Teorema de Stolper-Samuelson (1941):</strong> el libre comercio beneficia al factor relativamente abundante y perjudica al factor relativamente escaso en cada país. Esto explica por qué en los países desarrollados (abundantes en capital) los trabajadores poco cualificados pueden verse perjudicados por la apertura comercial con países en desarrollo (abundantes en trabajo barato).
                    </p>
                    <p>
                        <strong>Teorema de Rybczynski (1955):</strong> si aumenta la dotación de un factor, la producción del bien que utiliza ese factor intensivamente aumenta y la producción del otro bien disminuye (a precios constantes).
                    </p>
                    <p>
                        <strong>Teorema de igualación de los precios de los factores (Samuelson):</strong> bajo los supuestos del modelo H-O, el comercio libre tiende a igualar los precios de los factores (salarios y rentabilidad del capital) entre países. En la práctica, esta igualación es incompleta debido a barreras comerciales, costes de transporte y diferencias tecnológicas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. La paradoja de Leontief (1953)" color="amber">
                    <p>
                        <strong>Wassily Leontief</strong> (Premio Nobel 1973) contrastó empíricamente el modelo H-O utilizando datos de EE. UU. y encontró un resultado sorprendente: Estados Unidos, el país más abundante en capital del mundo, exportaba bienes relativamente <strong>intensivos en trabajo</strong> e importaba bienes intensivos en capital. Este resultado, conocido como la <strong>paradoja de Leontief</strong>, desafió el modelo H-O.
                    </p>
                    <p>
                        Las explicaciones propuestas incluyen: la necesidad de distinguir entre <strong>trabajo cualificado y no cualificado</strong> (el «capital humano» estadounidense es superior), la existencia de <strong>barreras comerciales</strong> que distorsionan los patrones de comercio, y la no homogeneidad del factor trabajo (Leontief, Kenen, Keesing).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. Nuevas teorías del comercio internacional" color="teal">
                    <p>
                        Desde finales de la década de 1970, las <strong>nuevas teorías del comercio internacional</strong> han complementado los enfoques clásicos:
                    </p>
                    <p>
                        <strong>Paul Krugman (1979, Premio Nobel 2008):</strong> demostró que el comercio puede surgir de las <strong>economías de escala</strong> y la <strong>competencia imperfecta</strong>, sin necesidad de diferencias en dotación de factores ni tecnología. Las empresas que operan en mercados con rendimientos crecientes pueden reducir costes ampliando su mercado mediante el comercio, generando comercio intraindustrial. Este modelo explica el intenso comercio entre países similares (EE. UU. y UE, por ejemplo).
                    </p>
                    <p>
                        <strong>Michael Porter (1990) — Ventaja competitiva de las naciones:</strong> el «diamante de Porter» identifica cuatro determinantes de la competitividad internacional: condiciones de los factores, condiciones de la demanda, industrias de apoyo relacionadas, y estrategia/estructura/rivalidad empresarial. La ventaja competitiva se crea y se sostiene a través de procesos altamente localizados (clusters).
                    </p>
                    <p>
                        <strong>Marc Melitz (2003) — Heterogeneidad empresarial:</strong> las empresas dentro de un mismo sector difieren en productividad. El comercio provoca una <strong>reasignación</strong>: las empresas más productivas se expanden (exportan), las menos productivas salen del mercado. El resultado es un aumento de la productividad media del sector.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. Términos de intercambio y ganancias del comercio" icon="📘">
                <TheoryBlock title="5.1. La relación real de intercambio (RRI)" color="green">
                    <p>
                        La <strong>relación real de intercambio</strong> (RRI), o <em>terms of trade</em>, mide la relación entre los precios de exportación y los precios de importación de un país:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="RRI = (Índice de precios de exportación / Índice de precios de importación) × 100"
                    desc="RRI > 100 → millora (el país pot importar més amb les mateixes exportacions) | RRI < 100 → deteriorament"
                />

                <TheoryBlock color="green">
                    <p>
                        Una <strong>mejora</strong> de la RRI (aumento) significa que el país puede obtener más importaciones por cada unidad exportada: sus exportaciones se encarecen relativamente respecto a sus importaciones. Un <strong>deterioro</strong> (disminución) significa que necesita exportar más para obtener la misma cantidad de importaciones.
                    </p>
                    <p>
                        La tesis <strong>Prebisch-Singer</strong> (1950) sostiene que los países en desarrollo, exportadores de materias primas, sufren un <strong>deterioro secular de su RRI</strong> frente a los países industrializados, exportadores de manufacturas. Esto se debe a la menor elasticidad-renta de la demanda de materias primas (ley de Engel aplicada al comercio internacional) y a la mayor capacidad de las industrias manufactureras para apropiarse de las ganancias de productividad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Ganancias estáticas y dinámicas del comercio" color="emerald">
                    <p>
                        <strong>Ganancias estáticas:</strong> las derivadas de la especialización según la ventaja comparativa, que permiten consumir fuera de la FPP. Incluyen la mejora de la eficiencia asignativa (los recursos se destinan a sus usos más productivos) y el acceso a mayor variedad de bienes a precios más bajos.
                    </p>
                    <p>
                        <strong>Ganancias dinámicas:</strong> las derivadas de los efectos del comercio a largo plazo. Incluyen la transferencia de tecnología, la presión competitiva que estimula la innovación, las economías de escala derivadas de un mercado más amplio, la mayor acumulación de capital (al acceder a bienes de inversión más baratos) y el aprendizaje que resulta de la exposición a mejores prácticas internacionales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Límites y costes del comercio" color="amber">
                    <p>
                        A pesar de sus beneficios, el comercio internacional genera <strong>costes de ajuste</strong>: sectores y trabajadores que compiten con importaciones pueden sufrir pérdidas de empleo y renta durante la transición. El <strong>teorema de Stolper-Samuelson</strong> formaliza esta idea: aunque el comercio aumenta la renta total del país, su distribución no es neutral —los factores escasos se perjudican—.
                    </p>
                    <p>
                        Estos efectos distributivos justifican políticas de <strong>compensación y reciclaje profesional</strong> (como el Trade Adjustment Assistance en EE. UU.) para que las ganancias del comercio se repartan de forma más equitativa.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── RELEVANCIA CURRICULAR ──────────────────────────────── */}
            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Este tema se vincula directamente con los saberes básicos del bloque «La economía internacional» de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), que incluye el análisis del comercio internacional, las teorías explicativas y sus implicaciones para la riqueza de las naciones. Se relaciona con las competencias específicas <strong>CE4</strong> (análisis del funcionamiento del comercio y las relaciones económicas internacionales) y <strong>CE5</strong> (comprensión del contexto económico nacional e internacional).
                    </p>
                    <p>
                        El tratamiento de la ventaja comparativa y los modelos de comercio contribuye especialmente a las competencias clave <strong>STEM</strong> (razonamiento cuantitativo con costes de oportunidad y ejemplos numéricos), <strong>CC</strong> (reflexión sobre la interdependencia global y sus efectos distributivos), <strong>CPSAA</strong> (juicio crítico sobre las posiciones proteccionistas y librecambistas) y <strong>CE</strong> (comprensión del espíritu emprendedor en contextos internacionales).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── SÍNTESIS ──────────────────────────────────────────── */}
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        El comercio internacional permite a los países especializarse según sus ventajas y acceder a una mayor cantidad y variedad de bienes. La <strong>ventaja absoluta</strong> de Smith explica el comercio cuando cada país es más eficiente en un bien distinto, pero es la <strong>ventaja comparativa</strong> de Ricardo la que demuestra que el comercio beneficia a ambos países incluso cuando uno es más eficiente en todo, siempre que los costes de oportunidad difieran. El modelo <strong>Heckscher-Ohlin</strong> añade las diferencias en dotación de factores como fuente de ventaja comparativa, mientras que las <strong>nuevas teorías</strong> (Krugman, Porter, Melitz) incorporan economías de escala, competencia imperfecta y heterogeneidad empresarial. La <strong>relación real de intercambio</strong> determina cómo se reparten las ganancias del comercio entre países. El comercio genera ganancias netas para las naciones, pero también costes de ajuste distributivos que requieren políticas compensatorias.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── BIBLIOGRAFÍA ──────────────────────────────────────── */}

            ]} />
        </div>

                <TheoryBlock title="1.1. Barreras arancelarias" color="green">
                    <p>
                        Un <strong>arancel</strong> es un impuesto que grava las mercancías importadas en el momento de cruzar la frontera. Es el instrumento proteccionista más transparente y cuantificable. Existen varios tipos:
                    </p>
                    <p>
                        <strong>Arancel ad valorem:</strong> se expresa como un porcentaje del valor del bien importado (por ejemplo, un 10 % sobre el precio CIF). Es el tipo más habitual.<br/>
                        <strong>Arancel específico:</strong> se fija una cantidad monetaria por unidad importada (por ejemplo, 5 € por kilogramo).<br/>
                        <strong>Arancel mixto:</strong> combina un componente ad valorem y un componente específico.<br/>
                        <strong>Arancel compuesto:</strong> se aplica un tipo u otro en función de determinadas condiciones.
                    </p>
                    <p>
                        Los aranceles generan <strong>ingresos fiscales</strong> para el Estado, <strong>encarecen las importaciones</strong> y, por tanto, <strong>protegen a los productores nacionales</strong> de la competencia extranjera. Sin embargo, como se verá en el epígrafe 2, generan una <strong>pérdida neta de bienestar</strong> para la sociedad en su conjunto.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Barreras no arancelarias (BNA)" color="emerald">
                    <p>
                        Las barreras no arancelarias incluyen todas las restricciones al comercio distintas de los aranceles. Su uso ha crecido significativamente a medida que los aranceles se han ido reduciendo en las sucesivas rondas de negociación del GATT/OMC. Son más difíciles de detectar y cuantificar, lo que las convierte en un instrumento de <strong>proteccionismo encubierto</strong>.
                    </p>
                    <p>
                        <strong>Contingentes o cuotas de importación:</strong> límites cuantitativos a la cantidad máxima de un bien que puede importarse en un período. A diferencia del arancel, no generan ingresos fiscales (salvo que las licencias de importación se subasten). Las rentas generadas por la cuota (la diferencia entre el precio interior elevado y el precio mundial) se las apropian los importadores que poseen las licencias.<br/>
                    </p>
                    <p>
                        <strong>Restricciones voluntarias a la exportación (RVE):</strong> acuerdos por los que el país exportador limita «voluntariamente» sus exportaciones (en realidad, bajo presión del país importador). Ejemplo clásico: la limitación de exportaciones de automóviles japoneses a EE. UU. en los años 80.<br/>
                    </p>
                    <p>
                        <strong>Barreras técnicas:</strong> normativas sanitarias, fitosanitarias, medioambientales, de calidad o de etiquetado que, si bien pueden tener justificación legítima, se utilizan a veces como instrumento proteccionista (por ejemplo, exigir estándares técnicos que solo los productos nacionales cumplen).<br/>
                    </p>
                    <p>
                        <strong>Barreras administrativas:</strong> procedimientos aduaneros complejos, licencias previas de importación, trámites burocráticos que retrasan y encarecen las importaciones.<br/>
                    </p>
                    <p>
                        <strong>Subvenciones a la producción nacional:</strong> ayudas directas o indirectas a los productores nacionales que les permiten competir en condiciones ventajosas frente a las importaciones. Cuando las subvenciones permiten exportar a precios inferiores al coste de producción, se habla de <strong>dumping</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Otras medidas de política comercial" color="teal">
                    <p>
                        <strong>Derechos antidumping:</strong> aranceles especiales impuestos sobre importaciones que se venden a precios considerados injustamente bajos (por debajo del coste de producción o del precio en el mercado de origen). Regulados por la OMC.<br/>
                    </p>
                    <p>
                        <strong>Derechos compensatorios:</strong> aranceles impuestos para contrarrestar el efecto de las subvenciones concedidas por el gobierno del país exportador.<br/>
                    </p>
                    <p>
                        <strong>Compras públicas:</strong> los gobiernos pueden favorecer a los proveedores nacionales en sus licitaciones públicas, excluyendo o desfavoreciendo a los proveedores extranjeros.<br/>
                    </p>
                    <p>
                        <strong>Manipulación del tipo de cambio:</strong> mantener una moneda artificialmente depreciada para abaratar las exportaciones y encarecer las importaciones.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 2 */}
            <Card title="2. Análisis económico del arancel" icon="📘">
                <TheoryBlock title="2.1. Efectos del arancel en equilibrio parcial" color="green">
                    <p>
                        El análisis del arancel en un mercado competitivo con un país «pequeño» (precio-aceptante en el mercado mundial) muestra los siguientes efectos:
                    </p>
                    <p>
                        <strong>Efecto sobre el precio:</strong> el precio interior sube del precio mundial (Pm) al precio mundial más el arancel (Pm + t). Los consumidores pagan más.<br/>
                    </p>
                    <p>
                        <strong>Efecto producción:</strong> la producción nacional aumenta, ya que el precio más alto permite a productores nacionales menos eficientes entrar en el mercado o ampliar su producción. Los productores nacionales se benefician.<br/>
                    </p>
                    <p>
                        <strong>Efecto consumo:</strong> la cantidad demandada disminuye, ya que los consumidores reducen su consumo ante el precio más alto.<br/>
                    </p>
                    <p>
                        <strong>Efecto sobre las importaciones:</strong> las importaciones se reducen (el arancel cumple su objetivo proteccionista).<br/>
                    </p>
                    <p>
                        <strong>Efecto fiscal (ingreso del Estado):</strong> el gobierno recauda aranceles sobre las importaciones restantes: Recaudación = t × M (M = importaciones post-arancel).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Análisis del bienestar: pérdida irrecuperable de eficiencia" color="emerald">
                    <p>
                        El arancel genera una <strong>redistribución</strong> del excedente: los productores nacionales ganan (excedente del productor aumenta), el Estado recauda (ingresos arancelarios), pero los consumidores pierden (excedente del consumidor disminuye). El balance neto es <strong>negativo</strong>: la pérdida de los consumidores supera la suma de las ganancias de productores y Estado.
                    </p>
                    <p>
                        La diferencia es la <strong>pérdida irrecuperable de eficiencia</strong> (deadweight loss), que se descompone en dos triángulos de pérdida:
                    </p>
                    <p>
                        <strong>Triángulo de ineficiencia productiva:</strong> recursos que se desvían hacia la producción nacional ineficiente (coste de producir nacionalmente lo que se importaría más barato).<br/>
                        <strong>Triángulo de ineficiencia del consumo:</strong> consumo que se pierde porque el precio más alto expulsa a consumidores cuya disposición a pagar estaba entre Pm y Pm + t.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Pérdida neta = ΔEC − (ΔEP + Ingresos arancelarios) > 0"
                    desc="ΔEC = Pérdida excedente consumidor | ΔEP = Ganancia excedente productor"
                />

                <TheoryBlock title="2.3. El arancel en un país «grande»" color="amber">
                    <p>
                        Si el país importador es lo suficientemente grande como para influir en el precio mundial (país «grande»), la imposición de un arancel puede reducir la demanda mundial del bien importado, deprimiendo su precio internacional. En este caso, parte del coste del arancel recae sobre los exportadores extranjeros. El <strong>arancel óptimo</strong> es aquel que maximiza la ganancia neta del país grande a costa de los exportadores extranjeros, pero su aplicación invita a <strong>represalias comerciales</strong>, desencadenando guerras arancelarias que perjudican a todos (dilema del prisionero).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 3 */}
            <Card title="3. Argumentos a favor del proteccionismo" icon="📘">
                <TheoryBlock title="3.1. Argumento de la industria naciente (List, 1841)" color="green">
                    <p>
                        <strong>Friedrich List</strong>, en <em>El sistema nacional de economía política</em> (1841), argumentó que las industrias jóvenes de un país en desarrollo necesitan <strong>protección temporal</strong> (aranceles) hasta que alcancen la escala y la experiencia suficientes para competir con las industrias establecidas de los países avanzados. Una vez maduras, la protección debería retirarse.
                    </p>
                    <p>
                        <strong>Críticas:</strong> es difícil identificar a priori qué industrias merecen protección; la protección tiende a perpetuarse (presión de los lobbies); los costes para los consumidores durante el período de protección pueden ser elevados; la falta de competencia reduce los incentivos para mejorar la eficiencia.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Protección del empleo nacional" color="emerald">
                    <p>
                        La apertura comercial puede provocar la <strong>destrucción de empleo</strong> en los sectores que compiten con importaciones más baratas. Los defensores del proteccionismo argumentan que los aranceles protegen los puestos de trabajo nacionales.
                    </p>
                    <p>
                        <strong>Críticas:</strong> la protección de empleos en un sector ineficiente se hace a costa de los consumidores (que pagan precios más altos) y de los sectores exportadores (que sufren represalias o apreciación del tipo de cambio). El empleo total no necesariamente aumenta: se desvían recursos hacia sectores menos productivos. Es más eficiente compensar a los trabajadores desplazados mediante políticas de formación y reciclaje que proteger sectores ineficientes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Otros argumentos proteccionistas" color="teal">
                    <p>
                        <strong>Seguridad nacional y autosuficiencia estratégica:</strong> ciertos sectores (defensa, energía, alimentación) deben mantenerse operativos por razones de seguridad, independientemente de las ventajas comparativas.
                    </p>
                    <p>
                        <strong>Defensa frente a prácticas desleales (dumping):</strong> si un país exporta a precios inferiores al coste para eliminar la competencia, es legítimo imponer aranceles antidumping para restablecer la competencia leal.
                    </p>
                    <p>
                        <strong>Política comercial estratégica (Brander y Spencer, 1985):</strong> en sectores oligopolísticos con rendimientos crecientes a escala y beneficios extraordinarios (como la industria aeronáutica), las subvenciones estratégicas pueden desplazar beneficios del extranjero hacia la industria nacional. Este argumento justificó las subvenciones a Airbus frente a Boeing, aunque también generó disputas comerciales prolongadas en la OMC.
                    </p>
                    <p>
                        <strong>Recaudación fiscal:</strong> en países en desarrollo con baja capacidad administrativa para cobrar impuestos directos, los aranceles pueden ser una fuente importante de ingresos públicos.
                    </p>
                    <p>
                        <strong>Defensa del medio ambiente y estándares sociales:</strong> restricciones a importaciones de países con estándares medioambientales o laborales bajos para evitar el «dumping social y ecológico» (race to the bottom).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 4 */}
            <Card title="4. Argumentos a favor del librecambio" icon="📘">
                <TheoryBlock title="4.1. La eficiencia del libre comercio" color="green">
                    <p>
                        El argumento central a favor del librecambio es la <strong>eficiencia</strong>: el libre comercio permite la asignación óptima de recursos según la ventaja comparativa, maximizando la producción mundial y el bienestar de los consumidores. Cualquier barrera comercial genera una <strong>pérdida irrecuperable de eficiencia</strong> (deadweight loss) que reduce el bienestar agregado.
                    </p>
                    <p>
                        <strong>Precios más bajos para los consumidores:</strong> la competencia de las importaciones disciplina los precios interiores y amplía la variedad de productos disponibles.<br/>
                        <strong>Estímulo a la innovación:</strong> la competencia internacional obliga a las empresas nacionales a mejorar su productividad, innovar y reducir costes.<br/>
                        <strong>Economías de escala:</strong> el acceso a un mercado más amplio permite a las empresas alcanzar la escala eficiente de producción.<br/>
                        <strong>Transferencia tecnológica:</strong> el comercio facilita la difusión de conocimientos, tecnologías y mejores prácticas entre países.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Costes del proteccionismo" color="emerald">
                    <p>
                        <strong>Coste para los consumidores:</strong> los aranceles funcionan como un impuesto regresivo que encarece los bienes básicos, perjudicando especialmente a los hogares de renta baja.<br/>
                        <strong>Ineficiencia productiva:</strong> la protección permite que empresas nacionales ineficientes sobrevivan, desviando recursos de usos más productivos.<br/>
                        <strong>Búsqueda de rentas (rent-seeking):</strong> las empresas protegidas destinan recursos a actividades de lobby para mantener o ampliar la protección, en lugar de invertir en productividad e innovación (Krueger, 1974).<br/>
                        <strong>Represalias y guerras comerciales:</strong> la imposición unilateral de aranceles invita a represalias del país afectado, desencadenando espirales proteccionistas que reducen el volumen de comercio y el bienestar mundial. La guerra comercial Smoot-Hawley (1930) agravó la Gran Depresión.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. El consenso económico" color="amber">
                    <p>
                        Existe un amplio <strong>consenso entre los economistas</strong> a favor del libre comercio como política general, aunque con matices importantes: la necesidad de <strong>políticas de compensación</strong> para los perdedores del comercio (formación, redes de protección social), la legitimidad de la <strong>regulación</strong> para corregir externalidades (medio ambiente, estándares laborales) y la aceptación de <strong>excepciones limitadas</strong> (seguridad nacional, antidumping). La cuestión no es si el libre comercio es beneficioso en general —lo es—, sino cómo gestionar los costes de ajuste y la distribución de las ganancias.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígrafe 5 */}
            <Card title="5. El marco institucional: GATT y OMC" icon="📘">
                <TheoryBlock title="5.1. Del GATT a la OMC" color="green">
                    <p>
                        Tras la Segunda Guerra Mundial, la comunidad internacional creó un marco institucional para promover la liberalización comercial y evitar las guerras arancelarias que habían agravado la Gran Depresión.
                    </p>
                    <p>
                        El <strong>GATT</strong> (Acuerdo General sobre Aranceles Aduaneros y Comercio, 1947) fue un acuerdo provisional que reguló el comercio internacional durante casi 50 años. Organizó ocho <strong>rondas de negociación</strong> multilateral que redujeron progresivamente los aranceles medios de más del 40 % (1947) a menos del 5 % (1994). Las rondas más importantes fueron la <strong>Ronda Kennedy</strong> (1964-67), la <strong>Ronda Tokio</strong> (1973-79) y la <strong>Ronda Uruguay</strong> (1986-94).
                    </p>
                    <p>
                        La <strong>OMC</strong> (Organización Mundial del Comercio) fue creada en 1995 como resultado de la Ronda Uruguay, sustituyendo al GATT. A diferencia del GATT (simple acuerdo), la OMC es una <strong>organización internacional</strong> con personalidad jurídica, con sede en Ginebra y 164 países miembros (2024). Tiene tres funciones principales: administrar los acuerdos comerciales, servir de foro de negociación y resolver disputas comerciales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Principios fundamentales del GATT/OMC" color="emerald">
                    <p>
                        <strong>1. Cláusula de nación más favorecida (NMF):</strong> toda ventaja comercial concedida a un país miembro debe extenderse automáticamente a todos los demás miembros. Excepción: los acuerdos regionales de integración (uniones aduaneras y zonas de libre comercio, art. XXIV) y el trato preferencial a países en desarrollo (cláusula de habilitación).
                    </p>
                    <p>
                        <strong>2. Trato nacional:</strong> una vez que un producto extranjero ha entrado en el mercado nacional (y pagado los aranceles correspondientes), debe recibir el mismo trato que los productos nacionales (no discriminación).
                    </p>
                    <p>
                        <strong>3. Reciprocidad:</strong> las concesiones arancelarias se negocian sobre una base de reciprocidad mutua.<br/>
                    </p>
                    <p>
                        <strong>4. Transparencia:</strong> las políticas comerciales deben ser públicas y predecibles (consolidación arancelaria: los países se comprometen a no subir los aranceles por encima de los niveles negociados).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. La Ronda de Doha y los retos actuales" color="teal">
                    <p>
                        La <strong>Ronda de Doha</strong> (2001-presente), llamada «Ronda del Desarrollo», se propuso abordar las preocupaciones de los países en desarrollo (acceso a mercados agrícolas del Norte, subvenciones agrícolas, ADPIC y salud pública). Las negociaciones se estancaron por desacuerdos sobre la liberalización agrícola (EE. UU. y UE resisten la eliminación de subvenciones) y el acceso a mercados industriales.
                    </p>
                    <p>
                        Los <strong>retos actuales</strong> del sistema comercial multilateral incluyen: el auge del <strong>proteccionismo y el nacionalismo económico</strong> (guerra comercial EE. UU.-China desde 2018, Brexit), la proliferación de <strong>acuerdos comerciales regionales</strong> (que debilitan el multilateralismo), la regulación del <strong>comercio digital y de servicios</strong>, las preocupaciones sobre <strong>sostenibilidad ambiental</strong> (ajuste en frontera por carbono, CBAM de la UE) y las tensiones entre libre comercio y <strong>seguridad nacional</strong> (controles de exportación de semiconductores).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── RELEVANCIA CURRICULAR ──────────────────────────────── */}
            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        El análisis de las barreras comerciales y el debate proteccionismo vs. librecambio se enmarca en los saberes básicos del bloque «La economía internacional» de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), conectando con las competencias específicas <strong>CE4</strong> (análisis del comercio internacional) y <strong>CE5</strong> (comprensión del contexto económico). El estudio de las instituciones comerciales internacionales (OMC) contribuye a la competencia <strong>CC</strong> (comprensión de la gobernanza global) y a la competencia <strong>CPSAA</strong> (juicio crítico sobre las políticas comerciales y sus efectos distributivos).
                    </p>
                    <p>
                        El análisis gráfico del arancel (excedentes, triángulos de pérdida) conecta con la competencia <strong>STEM</strong> (representación e interpretación de modelos económicos) y permite integrar los conocimientos de microeconomía del Bloque B (excedentes del consumidor y del productor, análisis de bienestar).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── SÍNTESIS ──────────────────────────────────────────── */}
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        Los gobiernos disponen de múltiples instrumentos para restringir el comercio: aranceles (ad valorem, específicos, mixtos), cuotas, RVE, barreras técnicas y administrativas, subvenciones y derechos antidumping. El análisis del arancel muestra que, aunque beneficia a los productores nacionales y genera ingresos fiscales, supone una pérdida neta de bienestar (triángulos de ineficiencia productiva y de consumo). Los argumentos proteccionistas —industria naciente, empleo, seguridad, dumping, política estratégica— tienen validez en contextos específicos, pero el consenso económico favorece el libre comercio como política general, acompañada de mecanismos de compensación. El GATT/OMC ha sido el marco institucional que ha impulsado la reducción arancelaria multilateral, aunque enfrenta retos significativos en el siglo XXI: proteccionismo resurgente, comercio digital, sostenibilidad y tensiones geopolíticas.
                    </p>
                </TheoryBlock>
            </Card>

                    <p>
                        La balanza de pagos se rige por el principio de <strong>partida doble</strong>: cada transacción se registra dos veces, una como crédito (ingreso) y otra como débito (pago), de modo que la balanza de pagos <strong>siempre está en equilibrio contable</strong>. Esto no significa que cada una de sus subbalanzas esté equilibrada individualmente, sino que la suma total de créditos y débitos es igual.
                    </p>
                    <p>
                        Se anotan como <strong>ingresos (crédito, signo +)</strong>: las exportaciones de bienes y servicios, las rentas recibidas del exterior, las transferencias recibidas, las ventas de activos nacionales a extranjeros (entradas de capital). Se anotan como <strong>pagos (débito, signo −)</strong>: las importaciones, las rentas pagadas al exterior, las transferencias enviadas, las compras de activos extranjeros (salidas de capital).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Estructura de la balanza de pagos (MBP6, FMI)" color="emerald">
                    <p>
                        La balanza de pagos se divide en tres grandes cuentas:
                    </p>
                    <p>

                        <strong>2. Cuenta de capital:</strong> registra las transferencias de capital (condonación de deuda, fondos estructurales UE, compra/venta de activos no producidos como patentes).<br/>
                        <strong>3. Cuenta financiera:</strong> registra las variaciones de activos y pasivos financieros frente al exterior (inversiones directas, en cartera, otras inversiones y variación de reservas del banco central).
                    </p>

                    </p>
                    <p>
                        España ha sido tradicionalmente un país con <strong>déficit comercial</strong> (importa más bienes de los que exporta), debido especialmente a la dependencia energética (importaciones de petróleo y gas). Sin embargo, este déficit se ha reducido significativamente desde 2012 gracias a la mejora de la competitividad exportadora y la moderación salarial.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Balanza de servicios" color="emerald">
                    <p>
                        Registra las <strong>exportaciones e importaciones de servicios</strong>: turismo, transporte, servicios empresariales, financieros, tecnológicos, royalties, etc. España es una potencia turística mundial y presenta un <strong>superávit estructural</strong> en la balanza de servicios, especialmente por turismo, que compensa parcialmente el déficit comercial.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Rentas primarias" color="teal">
                    <p>
                        Registra las <strong>rentas de los factores productivos</strong> (trabajo y capital) entre residentes y no residentes: salarios de trabajadores transfronterizos, beneficios y dividendos de inversiones directas y en cartera, intereses de la deuda exterior, rentas de la tierra. España presenta habitualmente <strong>déficit</strong> en esta subbalanza, ya que paga más rentas al capital extranjero invertido en España que las que recibe de las inversiones españolas en el exterior.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Rentas secundarias (transferencias corrientes)" color="amber">

                    </p>

            <Card title="4. La cuenta financiera" icon="📘">

                        La cuenta financiera registra las variaciones de <strong>activos y pasivos financieros</strong> del país frente al exterior. Se desglosa en:
                    </p>

                        <strong>Derivados financieros:</strong> operaciones con futuros, opciones, swaps y otros instrumentos derivados.<br/>
                        <strong>Variación de reservas:</strong> cambios en las reservas internacionales (divisas, oro, DEG) del banco central. Un aumento de reservas es una salida de capital (el banco central compra activos exteriores).

                    </p>
                </TheoryBlock>

                    </p>

                <TheoryBlock title="5.2. Mecanismos de ajuste" color="emerald">
                    <p>
                        <strong>Ajuste automático vía precios (tipo de cambio):</strong> en un sistema de tipos de cambio flexibles, un déficit corriente tiende a depreciar la moneda, abaratando las exportaciones y encareciendo las importaciones, lo que tiende a corregir el déficit. En un sistema de tipos fijos (o unión monetaria como la eurozona), este mecanismo no opera.<br/>
                    </p>
                    <p>
                        <strong>Ajuste automático vía renta:</strong> un déficit reduce la demanda agregada y la renta nacional, lo que reduce las importaciones (que dependen de la renta) y tiende a corregir el déficit.<br/>
                    </p>
                    <p>
                        <strong>Ajuste vía política económica:</strong> política fiscal restrictiva (reduce demanda interna e importaciones), política monetaria restrictiva (atrae capital extranjero), devaluación interna (moderación salarial para ganar competitividad — estrategia seguida por España 2012-2019), reformas estructurales (mejorar productividad y competitividad).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. La condición Marshall-Lerner y la curva J" color="amber">
                    <p>
                        La <strong>condición de Marshall-Lerner</strong> establece que una depreciación (o devaluación) mejora la balanza comercial solo si la suma de las elasticidades-precio de la demanda de exportaciones e importaciones es mayor que la unidad en valor absoluto: |ε_X| + |ε_M| &gt; 1.
                    </p>
                    <p>
                        La <strong>curva J</strong> describe el efecto temporal de una depreciación: a corto plazo, la balanza comercial <strong>empeora</strong> (los precios de importación suben inmediatamente, pero los volúmenes de exportación tardan en reaccionar); a medio plazo, los volúmenes se ajustan y la balanza <strong>mejora</strong>, describiendo la forma de una «J». El ajuste completo puede tardar de 12 a 18 meses.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">

                    </p>
                </TheoryBlock>

    const Tema34Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        El <strong>mercado de divisas</strong> (también conocido como <em>Forex</em> o <em>FX</em>) es el mercado en el que se intercambian las monedas de los distintos países. Es el <strong>mercado financiero más grande del mundo</strong>: según el Banco de Pagos Internacionales (BIS), su volumen diario de operaciones supera los <strong>7,5 billones de dólares</strong> (2022), más que la capitalización de muchas bolsas de valores. El dólar estadounidense participa en el 88 % de las transacciones, seguido del euro (31 %), el yen (17 %) y la libra esterlina (13 %).
                    </p>
                    <p>
                        El <strong>tipo de cambio</strong> —el precio de una moneda expresado en términos de otra— es una de las variables macroeconómicas más importantes, ya que determina la competitividad internacional de un país, influye en los flujos comerciales y de capital, condiciona la política monetaria y afecta al nivel de precios internos. El sistema de tipos de cambio (fijo, flexible o intermedio) que adopta un país tiene profundas implicaciones para su política económica.
                    </p>
                    <p>
                        El presente tema se estructura en cinco epígrafes: en primer lugar, se describe el mercado de divisas; en segundo lugar, se define y analiza el tipo de cambio; en tercer lugar, se estudia la determinación del tipo de cambio en un sistema flexible; en cuarto lugar, se comparan los sistemas de tipos de cambio; y en quinto lugar, se revisa la evolución histórica del sistema monetario internacional.
                    </p>
                </div>
            </Card>

            <Card title="1. El mercado de divisas" icon="📘">
                <TheoryBlock title="1.1. Concepto y características" color="green">
                    <p>
                        El mercado de divisas es un mercado <strong>descentralizado</strong> (OTC, Over-the-Counter): no tiene sede física ni horario fijo. Funciona <strong>24 horas al día</strong>, siguiendo los husos horarios de los principales centros financieros (Sídney → Tokio → Singapur → Londres → Nueva York). Sus principales características son:
                    </p>
                    <p>
                        <strong>Enorme liquidez:</strong> el elevado volumen de transacciones asegura que siempre hay compradores y vendedores, con diferenciales compra-venta (spreads) muy estrechos para las divisas principales.<br/>
                        <strong>Participantes diversos:</strong> bancos comerciales y de inversión (el núcleo del mercado), bancos centrales (intervenciones), fondos de inversión y hedge funds, empresas multinacionales (cobertura de riesgo cambiario), y particulares (trading minorista).<br/>
                        <strong>Instrumentos:</strong> operaciones al contado (spot, liquidación en T+2), operaciones a plazo (forward), swaps de divisas, futuros y opciones sobre divisas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Funciones del mercado de divisas" color="emerald">
                    <p>
                        <strong>1. Transferencia de poder adquisitivo:</strong> permite convertir monedas para realizar pagos internacionales (comercio, inversión, turismo).<br/>
                        <strong>2. Financiación del comercio internacional:</strong> proporciona crédito a importadores y exportadores.<br/>
                        <strong>3. Cobertura de riesgo cambiario:</strong> permite a empresas e inversores protegerse frente a fluctuaciones imprevistas del tipo de cambio mediante instrumentos derivados (forwards, opciones).<br/>
                        <strong>4. Especulación:</strong> los operadores asumen posiciones abiertas esperando beneficiarse de las variaciones del tipo de cambio. La especulación aporta liquidez pero puede generar volatilidad excesiva.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. El tipo de cambio: concepto y modalidades" icon="📘">
                <TheoryBlock title="2.1. Definición y notaciones" color="green">
                    <p>
                        El <strong>tipo de cambio</strong> es el precio de una moneda expresado en unidades de otra moneda. Puede expresarse de dos formas:
                    </p>
                    <p>
                        <strong>Cotización directa (al incierto):</strong> unidades de moneda nacional por unidad de moneda extranjera. Ejemplo: 1 USD = 0,92 EUR. Una subida del tipo indica <strong>depreciación</strong> de la moneda nacional (se necesitan más euros por dólar).<br/>
                        <strong>Cotización indirecta (al cierto):</strong> unidades de moneda extranjera por unidad de moneda nacional. Ejemplo: 1 EUR = 1,09 USD. Una subida del tipo indica <strong>apreciación</strong> del euro.
                    </p>
                    <p>
                        El euro se cotiza habitualmente de forma <strong>indirecta</strong> (1 EUR = x USD). La mayoría de las demás monedas se cotizan de forma directa frente al dólar.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Tipo de cambio nominal vs. real" color="emerald">
                    <p>
                        El <strong>tipo de cambio nominal</strong> (e) es el precio relativo de dos monedas. El <strong>tipo de cambio real</strong> (TCR) ajusta el tipo nominal por los diferenciales de precios entre países y mide la <strong>competitividad-precio</strong>:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="TCR = e × (P* / P)"
                    desc="e = TC nominal (cotització directa) | P* = Nivell de preus exterior | P = Nivell de preus nacional"
                />

                <TheoryBlock color="emerald">
                    <p>
                        Un aumento del TCR (depreciación real) significa que los bienes nacionales se abaratan en relación con los extranjeros, mejorando la <strong>competitividad exportadora</strong>. Una disminución (apreciación real) encarece los bienes nacionales, reduciendo la competitividad. Un país puede perder competitividad (apreciación real) incluso con tipo de cambio nominal fijo si su inflación es superior a la del exterior.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Apreciación y depreciación vs. revaluación y devaluación" color="teal">
                    <p>
                        <strong>Apreciación / Depreciación:</strong> variaciones del tipo de cambio determinadas por el mercado (oferta y demanda) en un <strong>sistema de tipos flexibles</strong>.<br/>
                        <strong>Revaluación / Devaluación:</strong> variaciones del tipo de cambio decididas por la <strong>autoridad monetaria</strong> en un <strong>sistema de tipos fijos</strong>.<br/>
                        La terminología es importante: hablar de «devaluación del euro» es incorrecto (el euro flota libremente); lo correcto es «depreciación del euro».
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Determinación del tipo de cambio flexible" icon="📘">
                <TheoryBlock title="3.1. Oferta y demanda de divisas" color="green">
                    <p>
                        En un sistema de <strong>tipos de cambio flexibles</strong>, el tipo de cambio se determina por la interacción de la <strong>oferta y la demanda</strong> de divisas en el mercado:
                    </p>
                    <p>
                        <strong>Demanda de divisas extranjeras</strong> (euros → dólares): proviene de los importadores (que necesitan dólares para pagar sus compras), los inversores que envían capital al exterior, los turistas nacionales que viajan al extranjero y los especuladores que apuestan por la apreciación del dólar.<br/>
                        <strong>Oferta de divisas extranjeras</strong> (dólares → euros): proviene de los exportadores (que reciben dólares y los convierten en euros), los inversores extranjeros que traen capital al país, los turistas extranjeros y los especuladores que apuestan por la depreciación del dólar.
                    </p>
                    <p>
                        El tipo de cambio de equilibrio es aquel en el que la cantidad demandada de divisas iguala a la cantidad ofrecida.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Factores que afectan al tipo de cambio" color="emerald">
                    <p>
                        <strong>1. Diferencial de inflación:</strong> si la inflación nacional es superior a la extranjera, los productos nacionales se encarecen → ↑importaciones, ↓exportaciones → ↑demanda de divisas → <strong>depreciación</strong> de la moneda nacional. Este es el fundamento de la <strong>paridad del poder adquisitivo (PPA)</strong>.<br/>
                    </p>
                    <p>
                        <strong>2. Diferencial de tipos de interés:</strong> tipos de interés nacionales más altos atraen capital extranjero → ↑oferta de divisas → <strong>apreciación</strong>. Este es el fundamento de la <strong>paridad de tipos de interés (PTI)</strong>.<br/>
                    </p>
                    <p>
                        <strong>3. Balanza por cuenta corriente:</strong> un superávit genera entradas netas de divisas → apreciación. Un déficit genera salidas → depreciación.<br/>
                    </p>
                    <p>
                        <strong>4. Crecimiento económico:</strong> un mayor crecimiento atrae inversión extranjera (apreciación), pero también aumenta las importaciones (depreciación). El efecto neto depende de la composición del crecimiento.<br/>
                    </p>
                    <p>
                        <strong>5. Expectativas y especulación:</strong> las expectativas sobre la evolución futura de las variables anteriores pueden generar movimientos anticipados y amplificados del tipo de cambio. Los mercados de divisas son muy sensibles a las noticias (datos macro, declaraciones de bancos centrales, eventos geopolíticos).<br/>
                    </p>
                    <p>
                        <strong>6. Intervención del banco central:</strong> compra o venta de divisas para influir en el tipo de cambio (intervención esterilizada si se neutraliza el efecto monetario).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Paridad del poder adquisitivo (PPA)" color="teal">
                    <p>
                        La <strong>PPA absoluta</strong> (Cassel, 1918) sostiene que el tipo de cambio entre dos monedas debe igualar los niveles de precios: un bien idéntico debe costar lo mismo en todos los países una vez convertido a la misma moneda (ley del precio único). El <strong>índice Big Mac</strong> de The Economist es una ilustración popular de la PPA.
                    </p>
                    <p>
                        La <strong>PPA relativa</strong> es más realista: la variación del tipo de cambio debe reflejar el diferencial de inflación entre países. Si la inflación española (3 %) supera la alemana (1 %), el euro español (si existiera) debería depreciarse un 2 % frente al euro alemán para mantener la competitividad.
                    </p>
                    <p>
                        En la práctica, la PPA se cumple razonablemente a <strong>largo plazo</strong> pero no a corto plazo, donde los movimientos de capital, las expectativas y la especulación dominan.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Sistemas de tipos de cambio" icon="📘">
                <TheoryBlock title="4.1. Tipos de cambio flexibles (flotantes)" color="green">
                    <p>
                        El tipo de cambio se determina libremente por la oferta y la demanda en el mercado de divisas, sin intervención del banco central. <strong>Ventajas:</strong> ajuste automático de los desequilibrios exteriores, autonomía de la política monetaria, no necesidad de mantener reservas de divisas. <strong>Inconvenientes:</strong> volatilidad e incertidumbre, que encarecen el comercio y la inversión internacional; posibilidad de <strong>overshooting</strong> (sobrerreacción del tipo de cambio, Dornbusch 1976); exposición a ataques especulativos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Tipos de cambio fijos" color="emerald">
                    <p>
                        El banco central fija el tipo de cambio a un valor determinado frente a otra moneda (o cesta de monedas) y se compromete a mantenerlo mediante <strong>intervenciones</strong> (compra/venta de divisas) y ajustes de política monetaria. <strong>Ventajas:</strong> estabilidad y certidumbre para el comercio, disciplina antiinflacionaria (credibilidad importada). <strong>Inconvenientes:</strong> pérdida de autonomía monetaria (la política monetaria se subordina al mantenimiento del tipo fijo), necesidad de mantener grandes reservas de divisas, vulnerabilidad a ataques especulativos si el tipo fijo no es creíble (crisis del SME 1992, crisis asiática 1997).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Sistemas intermedios" color="teal">
                    <p>
                        <strong>Flotación sucia (dirty float):</strong> tipo de cambio básicamente flexible, pero con intervenciones ocasionales del banco central para suavizar fluctuaciones excesivas. Es el sistema más común en la práctica.<br/>
                        <strong>Bandas de fluctuación:</strong> el tipo de cambio puede fluctuar dentro de un margen (banda) respecto a una paridad central. Ejemplo: el SME europeo permitía fluctuaciones de ±2,25 % (luego ±15 %).<br/>
                        <strong>Crawling peg:</strong> tipo fijo que se ajusta periódicamente (micro-devaluaciones) para compensar el diferencial de inflación.<br/>
                        <strong>Currency board (caja de conversión):</strong> tipo fijo con respaldo total de reservas (ejemplo: Argentina 1991-2001, Hong Kong).<br/>
                        <strong>Dolarización o unión monetaria:</strong> adopción de una moneda extranjera (dolarización: Ecuador, Panamá) o moneda común (euro).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. El trilema de la política económica (Mundell-Fleming)" color="amber">
                    <p>
                        El <strong>trilema de Mundell-Fleming</strong> (o «trinidad imposible») establece que un país puede lograr simultáneamente solo <strong>dos de tres objetivos</strong>:
                    </p>
                    <p>
                        <strong>1.</strong> Tipo de cambio fijo<br/>
                        <strong>2.</strong> Libre movilidad de capitales<br/>
                        <strong>3.</strong> Política monetaria autónoma
                    </p>
                    <p>
                        La eurozona elige (1) + (2) → renuncia a (3): los países miembros no tienen política monetaria propia. EE. UU. elige (2) + (3) → renuncia a (1): el dólar flota. China históricamente eligió (1) + (3) → restricciones a (2): controles de capital.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Evolución del sistema monetario internacional" icon="📘">
                <TheoryBlock title="5.1. El patrón oro (1870-1914)" color="green">
                    <p>
                        Cada moneda se definía en términos de una cantidad fija de oro. Los tipos de cambio eran fijos (determinados por el contenido en oro). El ajuste de los desequilibrios se producía mediante el <strong>mecanismo de flujo de especie-precio</strong> de Hume: un déficit comercial generaba salida de oro → ↓oferta monetaria → ↓precios → ↑competitividad → mejora del saldo comercial. El sistema proporcionaba estabilidad pero a costa de deflaciones y recesiones periódicas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Bretton Woods (1944-1971)" color="emerald">
                    <p>
                        Creado en la conferencia de Bretton Woods (1944), estableció un sistema de <strong>tipos de cambio fijos pero ajustables</strong>. El dólar era la moneda de referencia, convertible en oro a 35 $/onza. Las demás monedas fijaban su tipo frente al dólar (±1 %). Se crearon el <strong>FMI</strong> (vigilancia y asistencia financiera) y el <strong>Banco Mundial</strong> (reconstrucción y desarrollo). El sistema colapsó en 1971 cuando Nixon suspendió la convertibilidad del dólar en oro ante la pérdida masiva de reservas de oro estadounidenses (paradoja de Triffin).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. El sistema actual (post-1973)" color="teal">
                    <p>
                        Tras el colapso de Bretton Woods, se implantó un sistema de <strong>tipos de cambio flexibles</strong> entre las principales monedas (dólar, marco/euro, yen, libra), formalizado en los <strong>Acuerdos de Jamaica</strong> (1976). En la práctica, la mayoría de los países practican la <strong>flotación sucia</strong>. La creación del <strong>euro</strong> (1999/2002) supuso la mayor innovación monetaria desde Bretton Woods, al establecer una moneda común para un grupo de economías sin precedente en la historia.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        El estudio del mercado de divisas y los tipos de cambio se enmarca en los saberes del bloque «La economía internacional» de <strong>Economía de 1.º de Bachillerato</strong> (RD 243/2022), conectando con CE4 y CE5. Contribuye a las competencias <strong>STEM</strong> (cálculos con tipos de cambio, análisis gráfico oferta-demanda), <strong>CC</strong> (comprensión del sistema monetario internacional), <strong>CPSAA</strong> (juicio informado sobre la política cambiaria) y <strong>CE</strong> (riesgo cambiario en operaciones empresariales internacionales).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        El mercado de divisas, el mayor mercado financiero del mundo, determina los tipos de cambio que rigen el comercio y las finanzas internacionales. El tipo de cambio nominal refleja el precio relativo de dos monedas, mientras que el real incorpora los diferenciales de precios y mide la competitividad. En un sistema flexible, el tipo de cambio se determina por la oferta y la demanda, influido por diferenciales de inflación, tipos de interés, balanza por cuenta corriente, expectativas y especulación. La PPA explica el tipo de cambio a largo plazo, pero no a corto plazo. Los sistemas de tipos de cambio (fijo, flexible, intermedios) implican distintas combinaciones del trilema de Mundell-Fleming. El sistema monetario internacional ha evolucionado del patrón oro a Bretton Woods y de ahí al régimen actual de flotación gestionada, con el euro como la mayor innovación.
                    </p>
                </TheoryBlock>
            </Card>

                    <p>
