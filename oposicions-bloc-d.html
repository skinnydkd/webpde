    // ════════════════════════════════════════════════════════════════
    // TEMA 31 — El comerç internacional. Avantatge absolut i comparatiu.
    // ════════════════════════════════════════════════════════════════
    const Tema31Complet = () => (
        <div className="space-y-6 animate-fade">
            {/* ── INTRODUCCIÓ ────────────────────────────────────── */}
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        L'<strong>economia internacional</strong> és la branca de la ciència econòmica que estudia les relacions econòmiques entre països: els fluxos de béns, serveis, capitals i factors productius a través de les fronteres nacionals. El <strong>comerç internacional</strong> —l'intercanvi de béns i serveis entre residents de diferents països— constitueix un dels fenòmens econòmics més antics i rellevants de la història de la humanitat. Des de les rutes comercials fenícies i la Ruta de la Seda fins a les cadenes globals de valor del segle XXI, el comerç ha sigut motor de creixement, especialització i difusió tecnològica.
                    </p>
                    <p>
                        La pregunta fonamental de la teoria del comerç internacional és: <strong>per què comercien els països?</strong> La resposta clàssica, articulada per <strong>Adam Smith</strong> (1776) i perfeccionada per <strong>David Ricardo</strong> (1817), es basa en les diferències de costos de producció entre països: el comerç permet que cada nació s'especialitze en allò que produeix amb major eficiència (avantatge absolut) o amb menor cost relatiu (avantatge comparatiu), generant guanys mutus del comerç.
                    </p>
                    <p>
                        Des de la perspectiva curricular, aquest tema s'emmarca en els sabers bàsics del bloc «L'economia internacional» de la matèria d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022) i en les competències específiques CE4 (anàlisi del funcionament del comerç internacional) i CE5 (comprensió del context econòmic internacional). La LOMLOE (Llei Orgànica 3/2020) subratlla la importància que l'alumnat comprenga la interdependència econòmica global, contribuint a les competències CC (ciutadania activa en un món globalitzat), STEM (anàlisi quantitativa de fluxos comercials) i CE (comprensió de la iniciativa econòmica internacional).
                    </p>
                    <p>
                        El present tema s'estructura en cinc epígrafs: en primer lloc, s'aborda el concepte i les causes del comerç internacional; en segon lloc, es desenvolupa la teoria de l'avantatge absolut de Smith; en tercer lloc, es presenta l'avantatge comparatiu de Ricardo; en quart lloc, s'exposa el model de Heckscher-Ohlin i les noves teories del comerç; i en cinquè lloc, s'analitzen els termes d'intercanvi i els guanys del comerç.
                    </p>
                </div>
            </Card>

            {/* ── DESENVOLUPAMENT ──────────────────────────────────────── */}

            {/* Epígraf 1 */}
            <Card title="1. El comerç internacional: concepte i causes" icon="📘">
                <TheoryBlock title="1.1. Concepte de comerç internacional" color="green">
                    <p>
                        El <strong>comerç internacional</strong> és l'intercanvi de béns i serveis entre residents de diferents països a través de les fronteres nacionals. Comprén tant les <strong>exportacions</strong> (vendes de béns i serveis nacionals a l'exterior) com les <strong>importacions</strong> (compres de béns i serveis estrangers). El volum del comerç mundial ha crescut exponencialment: segons l'OMC, el comerç de mercaderies es va multiplicar per més de 30 entre 1950 i 2020, creixent a un ritme mitjà superior al del PIB mundial.
                    </p>
                    <p>
                        A diferència del comerç interior, el comerç internacional presenta característiques específiques: l'existència de <strong>fronteres polítiques</strong> (regulació duanera, aranzels, barreres no aranzelàries), diferents <strong>monedes</strong> (necessitat de tipus de canvi), distints <strong>marcs legals i fiscals</strong>, diferències en <strong>costos de transport</strong> i comunicació, i barreres <strong>culturals i lingüístiques</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Causes del comerç internacional" color="emerald">
                    <p>
                        Els països comercien entre si per múltiples raons que la teoria econòmica ha anat identificant:
                    </p>
                    <p>
                        <strong>1. Diferències en els recursos naturals i dotació de factors:</strong> els països posseeixen distintes dotacions de terra, clima, matèries primeres, treball i capital. Aràbia Saudita exporta petroli; Brasil, cafè; Austràlia, minerals. El model de Heckscher-Ohlin formalitza aquesta idea.
                    </p>
                    <p>
                        <strong>2. Diferències en la productivitat i tecnologia:</strong> els països difereixen en la seua capacitat per a produir béns amb major o menor eficiència. Aquesta és la base de les teories de l'avantatge absolut (Smith) i comparatiu (Ricardo).
                    </p>
                    <p>
                        <strong>3. Economies d'escala:</strong> la producció a gran escala redueix els costos unitaris. El comerç internacional permet a les empreses ampliar el seu mercat i aprofitar rendiments creixents a escala, com destaca la <strong>nova teoria del comerç</strong> (Krugman, 1979).
                    </p>
                    <p>
                        <strong>4. Diferenciació del producte:</strong> els consumidors valoren la varietat. El comerç intraindustrial (intercanvi de productes similars entre països de desenvolupament comparable) s'explica per la <strong>competència monopolística</strong> i la preferència per la varietat.
                    </p>
                    <p>
                        <strong>5. Diferències en gustos i preferències:</strong> fins i tot països amb dotacions similars poden comerciar si els seus consumidors tenen preferències distintes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Comerç interindustrial i intraindustrial" color="teal">
                    <p>
                        El <strong>comerç interindustrial</strong> consisteix en l'intercanvi de productes de distints sectors (per exemple, Espanya exporta oli d'oliva i importa petroli). S'explica bé per les teories clàssiques basades en avantatges comparatius i diferències en dotació de factors.
                    </p>
                    <p>
                        El <strong>comerç intraindustrial</strong> consisteix en l'intercanvi simultani de productes del mateix sector entre països amb nivell de desenvolupament similar (per exemple, Alemanya exporta automòbils BMW a França i importa automòbils Renault). Aquest tipus de comerç, que representa més del 60 % del comerç entre països desenvolupats, s'explica per les economies d'escala, la diferenciació del producte i la competència monopolística. L'<strong>índex de Grubel-Lloyd</strong> mesura la intensitat del comerç intraindustrial.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 2 */}
            <Card title="2. L'avantatge absolut d'Adam Smith" icon="📘">
                <TheoryBlock title="2.1. La teoria d'Adam Smith (1776)" color="green">
                    <p>
                        En <em>La riqueza de las naciones</em> (1776), <strong>Adam Smith</strong> va plantejar el principi de l'<strong>avantatge absolut</strong>: un país té avantatge absolut en la producció d'un bé quan pot produir-lo amb <strong>menys recursos</strong> (menys hores de treball, menys cost) que un altre país. Segons Smith, cada país hauria d'especialitzar-se en la producció d'aquells béns en els quals posseeix avantatge absolut i adquirir mitjançant el comerç aquells en què té desavantatge.
                    </p>
                    <p>
                        Smith va utilitzar aquesta idea per a criticar el <strong>mercantilisme</strong>, que veia el comerç com un joc de suma zero (el que un país guanya, un altre ho perd). Smith va demostrar que el comerç basat en l'especialització és un <strong>joc de suma positiva</strong>: ambdós països es beneficien en disposar de més béns dels que podrien produir en autarquia.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Exemple numèric" color="emerald">
                    <p>
                        Suposem dos països (Espanya i Anglaterra) i dos béns (vi i tela), utilitzant el <strong>treball</strong> com a únic factor productiu (model ricardià simplificat).
                    </p>
                    <p>
                        <strong>Hores de treball necessàries per unitat:</strong>
                    </p>
                    <p>
                        Espanya: 1 hora/vi, 4 hores/tela<br/>
                        Anglaterra: 3 hores/vi, 2 hores/tela
                    </p>
                    <p>
                        Espanya té <strong>avantatge absolut en vi</strong> (1 &lt; 3 hores) i Anglaterra té <strong>avantatge absolut en tela</strong> (2 &lt; 4 hores). Si cada país s'especialitza en el bé en què és més eficient i comercia, ambdós obtenen més producció total amb els mateixos recursos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Limitacions de l'avantatge absolut" color="amber">
                    <p>
                        La teoria de Smith no explica què succeeix quan un país és <strong>més eficient en tots els béns</strong>. Si Anglaterra produïra tant el vi com la tela amb menys recursos que Espanya, hi hauria base per al comerç? Smith no va oferir resposta. Va ser <strong>David Ricardo</strong> qui va resoldre aquest problema amb la teoria de l'avantatge comparatiu.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 3 */}
            <Card title="3. L'avantatge comparatiu de David Ricardo" icon="📘">
                <TheoryBlock title="3.1. El principi de l'avantatge comparatiu (1817)" color="green">
                    <p>
                        En <em>Principios de economía política y tributación</em> (1817), <strong>David Ricardo</strong> va demostrar que el comerç és mútuament beneficiós fins i tot quan un país és <strong>més eficient que un altre en la producció de tots els béns</strong>. El rellevant no és l'eficiència absoluta, sinó l'eficiència <strong>relativa</strong>: el <strong>cost d'oportunitat</strong>.
                    </p>
                    <p>
                        Un país té <strong>avantatge comparatiu</strong> en la producció d'un bé quan pot produir-lo amb un <strong>menor cost d'oportunitat</strong> que l'altre país. El cost d'oportunitat de produir un bé és la quantitat de l'altre bé que es deixa de produir.
                    </p>
                    <p>
                        La llei de l'avantatge comparatiu estableix que cada país es beneficiarà del comerç si s'especialitza en la producció d'aquells béns en els quals posseeix avantatge comparatiu (menor cost d'oportunitat) i importa aquells en què té desavantatge comparatiu.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Exemple numèric clàssic" color="emerald">
                    <p>
                        <strong>Hores de treball necessàries per unitat:</strong>
                    </p>
                    <p>
                        Portugal: 80 hores/vi, 90 hores/tela<br/>
                        Anglaterra: 120 hores/vi, 100 hores/tela
                    </p>
                    <p>
                        Portugal és més eficient en ambdós béns (avantatge absolut en ambdós). Tanmateix:
                    </p>
                    <p>
                        <strong>Cost d'oportunitat del vi:</strong><br/>
                        Portugal: 80/90 = 0,89 unitats de tela<br/>
                        Anglaterra: 120/100 = 1,2 unitats de tela
                    </p>
                    <p>
                        <strong>Cost d'oportunitat de la tela:</strong><br/>
                        Portugal: 90/80 = 1,125 unitats de vi<br/>
                        Anglaterra: 100/120 = 0,83 unitats de vi
                    </p>
                    <p>
                        Portugal té <strong>avantatge comparatiu en vi</strong> (0,89 &lt; 1,2) i Anglaterra té <strong>avantatge comparatiu en tela</strong> (0,83 &lt; 1,125). Ambdós guanyen si Portugal s'especialitza en vi i Anglaterra en tela, intercanviant a una relació de preus compresa entre els costos d'oportunitat d'ambdós països.
                    </p>
                </TheoryBlock>

                <FormulaBox

                <TheoryBlock title="3.3. Supòsits del model ricardià" color="teal">
                    <p>
                        El model de Ricardo es basa en <strong>supòsits simplificadors</strong>:
                    </p>
                    <p>
                        <strong>1.</strong> Dos països, dos béns, un factor productiu (treball).<br/>
                        <strong>2.</strong> La <strong>teoria del valor-treball</strong>: el valor dels béns depén exclusivament de la quantitat de treball incorporat.<br/>
                        <strong>3.</strong> Rendiments constants a escala (la FPP és una línia recta).<br/>
                        <strong>4.</strong> Competència perfecta en els mercats de béns i factors.<br/>
                        <strong>5.</strong> El treball és <strong>perfectament mòbil</strong> dins de cada país però <strong>completament immòbil</strong> entre països.<br/>
                        <strong>6.</strong> No existeixen costos de transport ni barreres comercials.<br/>
                        <strong>7.</strong> Plena ocupació dels factors productius.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. La Frontera de Possibilitats de Producció (FPP) i els guanys del comerç" color="green">
                    <p>
                        En el model ricardià, la <strong>FPP de cada país és una línia recta</strong> (pendent constant = cost d'oportunitat constant). En autarquia, cada país produeix i consumeix sobre la seua FPP. Amb comerç, cada país s'especialitza segons el seu avantatge comparatiu i pot consumir combinacions de béns que es troben <strong>fora de la seua FPP</strong>, és a dir, més enllà del que podria produir per si mateix. Aquest és el <strong>guany del comerç</strong>.
                    </p>
                    <p>
                        Els <strong>guanys es reparteixen entre ambdós països</strong> sempre que la relació real d'intercanvi (RRI) se situe entre els costos d'oportunitat interns de cada país. Si la RRI coincideix amb el cost d'oportunitat d'un dels països, eixe país no obté guany (tot el guany l'obté l'altre).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.5. Importància i vigència de l'avantatge comparatiu" color="amber">
                    <p>
                        El principi de l'avantatge comparatiu és considerat un dels resultats més potents i contraintuïtius de la ciència econòmica. <strong>Paul Samuelson</strong> el va qualificar com «la proposició més bonica de l'economia». El seu missatge fonamental és que <strong>el comerç beneficia fins i tot el país menys eficient</strong>, ja que li permet especialitzar-se en el que fa «relativament millor» i accedir a béns més barats mitjançant l'intercanvi.
                    </p>
                    <p>
                        No obstant això, la teoria presenta <strong>limitacions</strong>: suposa plena ocupació, ignora els costos d'ajust de l'especialització (desocupació sectorial durant la transició), no considera els efectes distributius (dins de cada país, els sectors que competeixen amb les importacions es perjudiquen — teorema de Stolper-Samuelson) i assumeix rendiments constants a escala.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 4 */}
            <Card title="4. Heckscher-Ohlin i noves teories del comerç" icon="📘">
                <TheoryBlock title="4.1. El model de Heckscher-Ohlin (H-O)" color="green">
                    <p>
                        El model de <strong>Heckscher (1919) i Ohlin (1933)</strong> —ampliat formalment per <strong>Samuelson</strong>— supera la limitació del model ricardià (un sol factor) i introdueix <strong>dos factors productius</strong>: treball (L) i capital (K). La font de l'avantatge comparatiu no són les diferències tecnològiques (com en Ricardo) sinó les <strong>diferències en la dotació relativa de factors</strong>.
                    </p>
                    <p>
                        <strong>Teorema H-O:</strong> cada país exportarà el bé la producció del qual utilitza intensivament el factor del qual està <strong>relativament ben dotat</strong> (abundant) i importarà el bé que utilitza intensivament el factor relativament escàs. Per exemple, un país abundant en treball (com la Xina) exportarà béns intensius en treball (tèxtils, manufactura lleugera), mentre que un país abundant en capital (com Alemanya) exportarà béns intensius en capital (maquinària, automòbils).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Teoremes associats al model H-O" color="emerald">
                    <p>
                        <strong>Teorema de Stolper-Samuelson (1941):</strong> el lliure comerç beneficia el factor relativament abundant i perjudica el factor relativament escàs en cada país. Això explica per què en els països desenvolupats (abundants en capital) els treballadors poc qualificats poden veure's perjudicats per l'obertura comercial amb països en desenvolupament (abundants en treball barat).
                    </p>
                    <p>
                        <strong>Teorema de Rybczynski (1955):</strong> si augmenta la dotació d'un factor, la producció del bé que utilitza eixe factor intensivament augmenta i la producció de l'altre bé disminueix (a preus constants).
                    </p>
                    <p>
                        <strong>Teorema d'igualació dels preus dels factors (Samuelson):</strong> sota els supòsits del model H-O, el comerç lliure tendeix a igualar els preus dels factors (salaris i rendibilitat del capital) entre països. En la pràctica, aquesta igualació és incompleta a causa de barreres comercials, costos de transport i diferències tecnològiques.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. La paradoxa de Leontief (1953)" color="amber">
                    <p>
                        <strong>Wassily Leontief</strong> (Premi Nobel 1973) va contrastar empíricament el model H-O utilitzant dades dels EUA i va trobar un resultat sorprenent: els Estats Units, el país més abundant en capital del món, exportava béns relativament <strong>intensius en treball</strong> i importava béns intensius en capital. Aquest resultat, conegut com la <strong>paradoxa de Leontief</strong>, va desafiar el model H-O.
                    </p>
                    <p>
                        Les explicacions proposades inclouen: la necessitat de distingir entre <strong>treball qualificat i no qualificat</strong> (el «capital humà» estatunidenc és superior), l'existència de <strong>barreres comercials</strong> que distorsionen els patrons de comerç, i la no homogeneïtat del factor treball (Leontief, Kenen, Keesing).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.4. Noves teories del comerç internacional" color="teal">
                    <p>
                        Des de finals de la dècada de 1970, les <strong>noves teories del comerç internacional</strong> han complementat els enfocaments clàssics:
                    </p>
                    <p>
                        <strong>Paul Krugman (1979, Premi Nobel 2008):</strong> va demostrar que el comerç pot sorgir de les <strong>economies d'escala</strong> i la <strong>competència imperfecta</strong>, sense necessitat de diferències en dotació de factors ni tecnologia. Les empreses que operen en mercats amb rendiments creixents poden reduir costos ampliant el seu mercat mitjançant el comerç, generant comerç intraindustrial. Aquest model explica l'intens comerç entre països similars (EUA i UE, per exemple).
                    </p>
                    <p>
                        <strong>Michael Porter (1990) — Avantatge competitiu de les nacions:</strong> el «diamant de Porter» identifica quatre determinants de la competitivitat internacional: condicions dels factors, condicions de la demanda, indústries de suport relacionades, i estratègia/estructura/rivalitat empresarial. L'avantatge competitiu es crea i es sosté a través de processos altament localitzats (clústers).
                    </p>
                    <p>
                        <strong>Marc Melitz (2003) — Heterogeneïtat empresarial:</strong> les empreses dins d'un mateix sector difereixen en productivitat. El comerç provoca una <strong>reassignació</strong>: les empreses més productives s'expandeixen (exporten), les menys productives ixen del mercat. El resultat és un augment de la productivitat mitjana del sector.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 5 */}
            <Card title="5. Termes d'intercanvi i guanys del comerç" icon="📘">
                <TheoryBlock title="5.1. La relació real d'intercanvi (RRI)" color="green">
                    <p>
                        La <strong>relació real d'intercanvi</strong> (RRI), o <em>terms of trade</em>, mesura la relació entre els preus d'exportació i els preus d'importació d'un país:
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="RRI = (Índex de preus d'exportació / Índex de preus d'importació) × 100"
                    desc="RRI > 100 → millora (el país pot importar més amb les mateixes exportacions) | RRI < 100 → deteriorament"
                />

                <TheoryBlock color="green">
                    <p>
                        Una <strong>millora</strong> de la RRI (augment) significa que el país pot obtindre més importacions per cada unitat exportada: les seues exportacions s'encareixen relativament respecte a les seues importacions. Un <strong>deteriorament</strong> (disminució) significa que necessita exportar més per a obtindre la mateixa quantitat d'importacions.
                    </p>
                    <p>
                        La tesi <strong>Prebisch-Singer</strong> (1950) sosté que els països en desenvolupament, exportadors de matèries primeres, pateixen un <strong>deteriorament secular de la seua RRI</strong> enfront dels països industrialitzats, exportadors de manufactures. Això es deu a la menor elasticitat-renda de la demanda de matèries primeres (llei d'Engel aplicada al comerç internacional) i a la major capacitat de les indústries manufactureres per a apropiar-se dels guanys de productivitat.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Guanys estàtics i dinàmics del comerç" color="emerald">
                    <p>
                        <strong>Guanys estàtics:</strong> els derivats de l'especialització segons l'avantatge comparatiu, que permeten consumir fora de la FPP. Inclouen la millora de l'eficiència assignativa (els recursos es destinen als seus usos més productius) i l'accés a major varietat de béns a preus més baixos.
                    </p>
                    <p>
                        <strong>Guanys dinàmics:</strong> els derivats dels efectes del comerç a llarg termini. Inclouen la transferència de tecnologia, la pressió competitiva que estimula la innovació, les economies d'escala derivades d'un mercat més ampli, la major acumulació de capital (en accedir a béns d'inversió més barats) i l'aprenentatge que resulta de l'exposició a millors pràctiques internacionals.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Límits i costos del comerç" color="amber">
                    <p>
                        Malgrat els seus beneficis, el comerç internacional genera <strong>costos d'ajust</strong>: sectors i treballadors que competeixen amb importacions poden patir pèrdues d'ocupació i renda durant la transició. El <strong>teorema de Stolper-Samuelson</strong> formalitza aquesta idea: encara que el comerç augmenta la renda total del país, la seua distribució no és neutral —els factors escassos es perjudiquen—.
                    </p>
                    <p>
                        Aquests efectes distributius justifiquen polítiques de <strong>compensació i reciclatge professional</strong> (com el Trade Adjustment Assistance als EUA) perquè els guanys del comerç es repartisquen de forma més equitativa.
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── RELEVANCIA CURRICULAR ──────────────────────────────── */}
            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Aquest tema es vincula directament amb els sabers bàsics del bloc «L'economia internacional» d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), que inclou l'anàlisi del comerç internacional, les teories explicatives i les seues implicacions per a la riquesa de les nacions. Es relaciona amb les competències específiques <strong>CE4</strong> (anàlisi del funcionament del comerç i les relacions econòmiques internacionals) i <strong>CE5</strong> (comprensió del context econòmic nacional i internacional).
                    </p>
                    <p>
                        El tractament de l'avantatge comparatiu i els models de comerç contribueix especialment a les competències clau <strong>STEM</strong> (raonament quantitatiu amb costos d'oportunitat i exemples numèrics), <strong>CC</strong> (reflexió sobre la interdependència global i els seus efectes distributius), <strong>CPSAA</strong> (judici crític sobre les posicions proteccionistes i lliurecanvistes) i <strong>CE</strong> (comprensió de l'esperit emprenedor en contextos internacionals).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── SÍNTESI ──────────────────────────────────────────── */}
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        El comerç internacional permet als països especialitzar-se segons els seus avantatges i accedir a una major quantitat i varietat de béns. L'<strong>avantatge absolut</strong> de Smith explica el comerç quan cada país és més eficient en un bé distint, però és l'<strong>avantatge comparatiu</strong> de Ricardo el que demostra que el comerç beneficia ambdós països fins i tot quan un és més eficient en tot, sempre que els costos d'oportunitat diferisquen. El model <strong>Heckscher-Ohlin</strong> afig les diferències en dotació de factors com a font d'avantatge comparatiu, mentre que les <strong>noves teories</strong> (Krugman, Porter, Melitz) incorporen economies d'escala, competència imperfecta i heterogeneïtat empresarial. La <strong>relació real d'intercanvi</strong> determina com es reparteixen els guanys del comerç entre països. El comerç genera guanys nets per a les nacions, però també costos d'ajust distributius que requereixen polítiques compensatòries.
                    </p>
                </TheoryBlock>
            </Card>

                    </p>

                        <strong>Aranzel mixt:</strong> combina un component ad valorem i un component específic.<br/>
                        <strong>Aranzel compost:</strong> s'aplica un tipus o un altre en funció de determinades condicions.

                    </p>

                    </p>
                    <p>

                    </p>
                    <p>
                        <strong>Crítiques:</strong> és difícil identificar a priori quines indústries mereixen protecció; la protecció tendeix a perpetuar-se (pressió dels lobbies); els costos per als consumidors durant el període de protecció poden ser elevats; la falta de competència redueix els incentius per a millorar l'eficiència.
                    </p>
                </TheoryBlock>

                    <p>

                    </p>
                    <p>
                        <strong>Crítiques:</strong> la protecció d'ocupació en un sector ineficient es fa a costa dels consumidors (que paguen preus més alts) i dels sectors exportadors (que pateixen represàlies o apreciació del tipus de canvi). L'ocupació total no necessàriament augmenta: es desvien recursos cap a sectors menys productius. És més eficient compensar els treballadors desplaçats mitjançant polítiques de formació i reciclatge que protegir sectors ineficients.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Altres arguments proteccionistes" color="teal">
                    <p>
                        <strong>Seguretat nacional i autosuficiència estratègica:</strong> certs sectors (defensa, energia, alimentació) han de mantindre's operatius per raons de seguretat, independentment dels avantatges comparatius.
                    </p>
                    <p>

                    </p>
                    <p>
                        <strong>Política comercial estratègica (Brander i Spencer, 1985):</strong> en sectors oligopolístics amb rendiments creixents a escala i beneficis extraordinaris (com la indústria aeronàutica), les subvencions estratègiques poden desplaçar beneficis de l'estranger cap a la indústria nacional. Aquest argument va justificar les subvencions a Airbus enfront de Boeing, encara que també va generar disputes comercials prolongades en l'OMC.
                    </p>
                    <p>
                        <strong>Recaptació fiscal:</strong> en països en desenvolupament amb baixa capacitat administrativa per a cobrar impostos directes, els aranzels poden ser una font important d'ingressos públics.
                    </p>
                    <p>
                        <strong>Defensa del medi ambient i estàndards socials:</strong> restriccions a importacions de països amb estàndards mediambientals o laborals baixos per a evitar el «dumping social i ecològic» (race to the bottom).
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 4 */}
            <Card title="4. Arguments a favor del lliurecanvi" icon="📘">
                <TheoryBlock title="4.1. L'eficiència del lliure comerç" color="green">
                    <p>
                        L'argument central a favor del lliurecanvi és l'<strong>eficiència</strong>: el lliure comerç permet l'assignació òptima de recursos segons l'avantatge comparatiu, maximitzant la producció mundial i el benestar dels consumidors. Qualsevol barrera comercial genera una <strong>pèrdua irrecuperable d'eficiència</strong> (deadweight loss) que redueix el benestar agregat.
                    </p>
                    <p>
                        <strong>Preus més baixos per als consumidors:</strong> la competència de les importacions disciplina els preus interiors i amplia la varietat de productes disponibles.<br/>
                        <strong>Estímul a la innovació:</strong> la competència internacional obliga les empreses nacionals a millorar la seua productivitat, innovar i reduir costos.<br/>
                        <strong>Economies d'escala:</strong> l'accés a un mercat més ampli permet a les empreses assolir l'escala eficient de producció.<br/>
                        <strong>Transferència tecnològica:</strong> el comerç facilita la difusió de coneixements, tecnologies i millors pràctiques entre països.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Costos del proteccionisme" color="emerald">
                    <p>
                        <strong>Cost per als consumidors:</strong> els aranzels funcionen com un impost regressiu que encareix els béns bàsics, perjudicant especialment les llars de renda baixa.<br/>
                        <strong>Ineficiència productiva:</strong> la protecció permet que empreses nacionals ineficients sobreviuen, desviant recursos d'usos més productius.<br/>
                        <strong>Cerca de rendes (rent-seeking):</strong> les empreses protegides destinen recursos a activitats de lobby per a mantindre o ampliar la protecció, en lloc d'invertir en productivitat i innovació (Krueger, 1974).<br/>
                        <strong>Represàlies i guerres comercials:</strong> la imposició unilateral d'aranzels convida a represàlies del país afectat, desencadenant espirals proteccionistes que redueixen el volum de comerç i el benestar mundial. La guerra comercial Smoot-Hawley (1930) va agreujar la Gran Depressió.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. El consens econòmic" color="amber">
                    <p>
                        Existeix un ampli <strong>consens entre els economistes</strong> a favor del lliure comerç com a política general, encara que amb matisos importants: la necessitat de <strong>polítiques de compensació</strong> per als perdedors del comerç (formació, xarxes de protecció social), la legitimitat de la <strong>regulació</strong> per a corregir externalitats (medi ambient, estàndards laborals) i l'acceptació d'<strong>excepcions limitades</strong> (seguretat nacional, antidumping). La qüestió no és si el lliure comerç és beneficiós en general —ho és—, sinó com gestionar els costos d'ajust i la distribució dels guanys.
                    </p>
                </TheoryBlock>
            </Card>

            {/* Epígraf 5 */}
            <Card title="5. El marc institucional: GATT i OMC" icon="📘">
                <TheoryBlock title="5.1. Del GATT a l'OMC" color="green">
                    <p>
                        Després de la Segona Guerra Mundial, la comunitat internacional va crear un marc institucional per a promoure la liberalització comercial i evitar les guerres aranzelàries que havien agreujat la Gran Depressió.
                    </p>
                    <p>
                        El <strong>GATT</strong> (Acord General sobre Aranzels Duaners i Comerç, 1947) va ser un acord provisional que va regular el comerç internacional durant quasi 50 anys. Va organitzar huit <strong>rondes de negociació</strong> multilateral que van reduir progressivament els aranzels mitjans de més del 40 % (1947) a menys del 5 % (1994). Les rondes més importants van ser la <strong>Ronda Kennedy</strong> (1964-67), la <strong>Ronda Tòquio</strong> (1973-79) i la <strong>Ronda Uruguai</strong> (1986-94).
                    </p>
                    <p>
                        L'<strong>OMC</strong> (Organització Mundial del Comerç) va ser creada en 1995 com a resultat de la Ronda Uruguai, substituint el GATT. A diferència del GATT (simple acord), l'OMC és una <strong>organització internacional</strong> amb personalitat jurídica, amb seu a Ginebra i 164 països membres (2024). Té tres funcions principals: administrar els acords comercials, servir de fòrum de negociació i resoldre disputes comercials.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Principis fonamentals del GATT/OMC" color="emerald">
                    <p>
                        <strong>1. Clàusula de nació més afavorida (NMF):</strong> tot avantatge comercial concedit a un país membre ha d'estendre's automàticament a tots els altres membres. Excepció: els acords regionals d'integració (unions duaneres i zones de lliure comerç, art. XXIV) i el tracte preferencial a països en desenvolupament (clàusula d'habilitació).
                    </p>
                    <p>
                        <strong>2. Tracte nacional:</strong> una vegada que un producte estranger ha entrat en el mercat nacional (i pagat els aranzels corresponents), ha de rebre el mateix tracte que els productes nacionals (no discriminació).
                    </p>
                    <p>
                        <strong>3. Reciprocitat:</strong> les concessions aranzelàries es negocien sobre una base de reciprocitat mútua.<br/>
                    </p>
                    <p>
                        <strong>4. Transparència:</strong> les polítiques comercials han de ser públiques i predictibles (consolidació aranzelària: els països es comprometen a no pujar els aranzels per damunt dels nivells negociats).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. La Ronda de Doha i els reptes actuals" color="teal">
                    <p>
                        La <strong>Ronda de Doha</strong> (2001-present), anomenada «Ronda del Desenvolupament», es va proposar abordar les preocupacions dels països en desenvolupament (accés a mercats agrícoles del Nord, subvencions agrícoles, ADPIC i salut pública). Les negociacions es van estancar per desacords sobre la liberalització agrícola (EUA i UE resisteixen l'eliminació de subvencions) i l'accés a mercats industrials.
                    </p>
                    <p>
                        Els <strong>reptes actuals</strong> del sistema comercial multilateral inclouen: l'auge del <strong>proteccionisme i el nacionalisme econòmic</strong> (guerra comercial EUA-Xina des de 2018, Brexit), la proliferació d'<strong>acords comercials regionals</strong> (que debiliten el multilateralisme), la regulació del <strong>comerç digital i de serveis</strong>, les preocupacions sobre <strong>sostenibilitat ambiental</strong> (ajust en frontera per carboni, CBAM de la UE) i les tensions entre lliure comerç i <strong>seguretat nacional</strong> (controls d'exportació de semiconductors).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── RELEVANCIA CURRICULAR ──────────────────────────────── */}
            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        L'anàlisi de les barreres comercials i el debat proteccionisme vs. lliurecanvi s'emmarca en els sabers bàsics del bloc «L'economia internacional» d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), connectant amb les competències específiques <strong>CE4</strong> (anàlisi del comerç internacional) i <strong>CE5</strong> (comprensió del context econòmic). L'estudi de les institucions comercials internacionals (OMC) contribueix a la competència <strong>CC</strong> (comprensió de la governança global) i a la competència <strong>CPSAA</strong> (judici crític sobre les polítiques comercials i els seus efectes distributius).
                    </p>
                    <p>
                        L'anàlisi gràfica de l'aranzel (excedents, triangles de pèrdua) connecta amb la competència <strong>STEM</strong> (representació i interpretació de models econòmics) i permet integrar els coneixements de microeconomia del Bloc B (excedents del consumidor i del productor, anàlisi de benestar).
                    </p>
                </TheoryBlock>
            </Card>

            {/* ── SÍNTESIS ──────────────────────────────────────────── */}
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        Els governs disposen de múltiples instruments per a restringir el comerç: aranzels (ad valorem, específics, mixtos), quotes, RVE, barreres tècniques i administratives, subvencions i drets antidumping. L'anàlisi de l'aranzel mostra que, encara que beneficia els productors nacionals i genera ingressos fiscals, suposa una pèrdua neta de benestar (triangles d'ineficiència productiva i de consum). Els arguments proteccionistes —indústria naixent, ocupació, seguretat, dumping, política estratègica— tenen validesa en contextos específics, però el consens econòmic afavoreix el lliure comerç com a política general, acompanyada de mecanismes de compensació. El GATT/OMC ha sigut el marc institucional que ha impulsat la reducció aranzelària multilateral, encara que s'enfronta a reptes significatius en el segle XXI: proteccionisme ressorgent, comerç digital, sostenibilitat i tensions geopolítiques.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. El compte corrent" icon="📘">
                <TheoryBlock title="2.1. Balança comercial (de béns)" color="green">
                    <p>
                        Registra les <strong>exportacions i importacions de mercaderies</strong> (béns tangibles). Les exportacions es valoren en termes <strong>FOB</strong> (Free on Board, sense incloure nòlit ni assegurança) i les importacions en termes <strong>CIF</strong> (Cost, Insurance and Freight, incloent-hi cost, assegurança i nòlit fins a la frontera de l'importador). La diferència entre exportacions i importacions de béns és el <strong>saldo comercial</strong>.
                    </p>
                    <p>
                        Espanya ha sigut tradicionalment un país amb <strong>dèficit comercial</strong> (importa més béns dels que exporta), a causa especialment de la dependència energètica (importacions de petroli i gas). Tanmateix, aquest dèficit s'ha reduït significativament des de 2012 gràcies a la millora de la competitivitat exportadora i la moderació salarial.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Balança de serveis" color="emerald">
                    <p>
                        Registra les <strong>exportacions i importacions de serveis</strong>: turisme, transport, serveis empresarials, financers, tecnològics, royalties, etc. Espanya és una potència turística mundial i presenta un <strong>superàvit estructural</strong> en la balança de serveis, especialment per turisme, que compensa parcialment el dèficit comercial.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.3. Rendes primàries" color="teal">
                    <p>
                        Registra les <strong>rendes dels factors productius</strong> (treball i capital) entre residents i no residents: salaris de treballadors transfronterers, beneficis i dividends d'inversions directes i en cartera, interessos del deute exterior, rendes de la terra. Espanya presenta habitualment <strong>dèficit</strong> en aquesta subbalança, ja que paga més rendes al capital estranger invertit a Espanya que les que rep de les inversions espanyoles a l'exterior.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.4. Rendes secundàries (transferències corrents)" color="amber">
                    <p>
                        Registra les <strong>transferències corrents</strong> sense contraprestació: remeses d'emigrants/immigrants, contribucions a organismes internacionals, ajuda al desenvolupament corrent, fons de cohesió de la UE (component corrent). Espanya ha passat de ser receptor net (emigració espanyola a Europa en els 60-70) a emissor net de remeses (immigració cap a Espanya des de 2000).
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Saldo compte corrent = Balança comercial + Balança de serveis + Rendes primàries + Rendes secundàries"
                    desc="Superàvit (+) → capacitat de finançament | Dèficit (−) → necessitat de finançament"
                />
            </Card>

            <Card title="3. El compte de capital" icon="📘">
                <TheoryBlock color="green">
                    <p>
                        El compte de capital registra dos tipus d'operacions:
                    </p>
                    <p>
                        <strong>1. Transferències de capital:</strong> transferències sense contraprestació vinculades a l'adquisició o disposició d'actius fixos: condonacions de deute, herències d'emigrants/immigrants, fons estructurals i de cohesió de la UE (component capital, com el FEDER i el Fons de Cohesió).<br/>
                        <strong>2. Adquisició/disposició d'actius no produïts, no financers:</strong> patents, drets d'autor, marques comercials, permisos d'emissió, drets d'explotació.
                    </p>
                    <p>
                        Aquest compte sol presentar un saldo reduït. Per a Espanya, els fons europeus han sigut històricament rellevants, encara que el seu pes ha disminuït a mesura que Espanya convergia amb la mitjana de la UE.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Capacidad/Necesidad de financiación = Saldo cuenta corriente + Saldo cuenta de capital"
                    desc="Si és positiu: el país presta al món (capacitat). Si és negatiu: el país s'endeuta (necessitat)."
                />
            </Card>

            <Card title="4. El compte financer" icon="📘">
                <TheoryBlock title="4.1. Components del compte financer" color="green">
                    <p>
                        El compte financer registra les variacions d'<strong>actius i passius financers</strong> del país enfront de l'exterior. Es desglossa en:
                    </p>
                    <p>
                        <strong>Inversió directa:</strong> adquisició de participacions significatives (≥ 10 % del capital) en empreses d'un altre país, amb vocació de permanència i control. Exemple: una empresa espanyola compra una fàbrica a Mèxic (eixida d'inversió directa).<br/>
                        <strong>Inversió en cartera:</strong> adquisició d'accions (&lt; 10 %), bons, obligacions i altres instruments financers sense vocació de control. Més volàtil que la inversió directa.<br/>
                        <strong>Altra inversió:</strong> préstecs, dipòsits bancaris, crèdits comercials i altres actius/passius financers.<br/>
                        <strong>Derivats financers:</strong> operacions amb futurs, opcions, swaps i altres instruments derivats.<br/>
                        <strong>Variació de reserves:</strong> canvis en les reserves internacionals (divises, or, DEG) del banc central. Un augment de reserves és una eixida de capital (el banc central compra actius exteriors).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Interpretació: qui finança a qui?" color="emerald">
                    <p>
                        Si un país té <strong>necessitat de finançament</strong> (dèficit corrent + capital), el compte financer mostrarà entrades netes de capital (més passius que actius): el país s'endeuta amb l'exterior o atrau inversió estrangera per a finançar el seu excés de despesa sobre la seua producció.
                    </p>
                    <p>
                        Si té <strong>capacitat de finançament</strong> (superàvit), el compte financer mostrarà eixides netes de capital: el país presta a l'exterior o inverteix fora els seus estalvis excedents (cas d'Alemanya, Japó, Xina).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Desequilibris i mecanismes d'ajust" icon="📘">
                <TheoryBlock title="5.1. Desequilibris per compte corrent" color="green">
                    <p>
                        Un <strong>dèficit per compte corrent persistent</strong> significa que el país consumeix i inverteix més del que produeix, finançant-se amb estalvi exterior (deute o inversió estrangera). És sostenible a curt termini si els fluxos de capital són estables, però problemàtic a llarg termini si genera un <strong>endeutament extern excessiu</strong> (crisi de balança de pagaments). Els desequilibris globals (superàvits crònics de Xina/Alemanya, dèficits d'EUA/Espanya) van ser un dels factors de la crisi financera de 2008.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Mecanismes d'ajust" color="emerald">
                    <p>
                        <strong>Ajust automàtic via preus (tipus de canvi):</strong> en un sistema de tipus de canvi flexibles, un dèficit corrent tendeix a depreciar la moneda, abaratint les exportacions i encarint les importacions, la qual cosa tendeix a corregir el dèficit. En un sistema de tipus fixos (o unió monetària com l'eurozona), aquest mecanisme no opera.<br/>
                    </p>
                    <p>
                        <strong>Ajust automàtic via renda:</strong> un dèficit redueix la demanda agregada i la renda nacional, la qual cosa redueix les importacions (que depenen de la renda) i tendeix a corregir el dèficit.<br/>
                    </p>
                    <p>
                        <strong>Ajust via política econòmica:</strong> política fiscal restrictiva (redueix demanda interna i importacions), política monetària restrictiva (atrau capital estranger), devaluació interna (moderació salarial per a guanyar competitivitat — estratègia seguida per Espanya 2012-2019), reformes estructurals (millorar productivitat i competitivitat).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. La condició Marshall-Lerner i la corba J" color="amber">
                    <p>
                        La <strong>condició de Marshall-Lerner</strong> estableix que una depreciació (o devaluació) millora la balança comercial només si la suma de les elasticitats-preu de la demanda d'exportacions i importacions és major que la unitat en valor absolut: |ε_X| + |ε_M| &gt; 1.
                    </p>
                    <p>
                        La <strong>corba J</strong> descriu l'efecte temporal d'una depreciació: a curt termini, la balança comercial <strong>empitjora</strong> (els preus d'importació pugen immediatament, però els volums d'exportació tarden a reaccionar); a mitjà termini, els volums s'ajusten i la balança <strong>millora</strong>, descrivint la forma d'una «J». L'ajust complet pot tardar de 12 a 18 mesos.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        La balança de pagaments s'emmarca en els sabers del bloc «L'economia internacional» d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), connectant amb CE4 i CE5. La seua anàlisi contribueix a la competència <strong>STEM</strong> (interpretació de dades estadístiques, comptabilitat de doble partida), <strong>CC</strong> (comprensió de la interdependència econòmica global), <strong>CPSAA</strong> (judici informat sobre la posició exterior del país) i <strong>CCL</strong> (lectura i interpretació de dades macroeconòmiques publicades pel Banc d'Espanya).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        La balança de pagaments registra totes les transaccions econòmiques entre residents d'un país i la resta del món. S'estructura en tres comptes: el <strong>compte corrent</strong> (béns, serveis, rendes primàries i secundàries), el <strong>compte de capital</strong> (transferències de capital i actius no produïts) i el <strong>compte financer</strong> (inversions directes, en cartera, altres inversions i reserves). La suma del compte corrent i el compte de capital determina la capacitat o necessitat de finançament. Els desequilibris per compte corrent s'ajusten mitjançant el tipus de canvi (condició Marshall-Lerner, corba J), la variació de la renda o la política econòmica. Espanya ha passat d'acumular grans dèficits per compte corrent (fins a 2008) a registrar superàvits o equilibris des de 2013.
                    </p>
                </TheoryBlock>
            </Card>

                <TheoryBlock title="4.2. Tipus de canvi fixos" color="emerald">

                        <strong>Dolarització o unió monetària:</strong> adopció d'una moneda estrangera (dolarització: Equador, Panamà) o moneda comuna (euro).

                    <p>
                        Cada moneda es definia en termes d'una quantitat fixa d'or. Els tipus de canvi eren fixos (determinats pel contingut en or). L'ajust dels desequilibris es produïa mitjançant el <strong>mecanisme de flux d'espècie-preu</strong> de Hume: un dèficit comercial generava eixida d'or → ↓oferta monetària → ↓preus → ↑competitivitat → millora del saldo comercial. El sistema proporcionava estabilitat però a costa de deflacions i recessions periòdiques.
                    </p>

                    </p>
                </TheoryBlock>

                    </p>
                </TheoryBlock>

                    </p>

                    <p>
                        El mercat de divises, el major mercat financer del món, determina els tipus de canvi que regeixen el comerç i les finances internacionals. El tipus de canvi nominal reflecteix el preu relatiu de dues monedes, mentre que el real incorpora els diferencials de preus i mesura la competitivitat. En un sistema flexible, el tipus de canvi es determina per l'oferta i la demanda, influït per diferencials d'inflació, tipus d'interés, balança per compte corrent, expectatives i especulació. La PPA explica el tipus de canvi a llarg termini, però no a curt termini. Els sistemes de tipus de canvi (fix, flexible, intermedis) impliquen distintes combinacions del trilema de Mundell-Fleming. El sistema monetari internacional ha evolucionat del patró or a Bretton Woods i d'ací al règim actual de flotació gestionada, amb l'euro com la major innovació.
                    </p>

                        <strong>Convergència:</strong> algunes economies emergents han convergit amb els països desenvolupats en termes de renda per capita (la Xina, Polònia, Xile).

                        <strong>Inestabilitat financera:</strong> la lliure mobilitat de capitals ha generat bombolles especulatives, crisis financeres recurrents (Àsia 1997, subprimes 2008) i contagi internacional.<br/>
                        <strong>Pèrdua de sobirania:</strong> els governs nacionals veuen reduïda la seua capacitat per a aplicar polítiques autònomes (impositiva, reguladora, mediambiental) davant la mobilitat del capital i la competència fiscal entre països.<br/>

                <TheoryBlock title="3.1. Mundell (1961) i els criteris d'AMO" color="green">
                    <p>
                        <strong>Robert Mundell</strong> (1961) es va preguntar: quan és beneficiós per a un grup de països compartir una moneda? La resposta depén de si els beneficis (eliminació de costos de transacció, transparència de preus, credibilitat) superen els costos (pèrdua de la política monetària i del tipus de canvi com a instrument d'ajust davant shocks asimètrics).
                    </p>
                    <p>
                        Un grup de països forma un <strong>AMO</strong> si disposa de mecanismes alternatius d'ajust davant shocks asimètrics (shocks que afecten un país però no els altres):
                    </p>
                    <p>
                        <strong>1. Mobilitat del factor treball</strong> (Mundell): si els treballadors poden desplaçar-se del país en recessió al país en expansió, l'ajust es produeix sense necessitat de tipus de canvi.<br/>
                        <strong>2. Flexibilitat de preus i salaris</strong> (Friedman): si els preus i salaris són flexibles a la baixa, una «devaluació interna» (reducció de salaris) pot substituir la devaluació del tipus de canvi.<br/>
                        <strong>3. Integració fiscal (transferències):</strong> un pressupost federal que transferisca recursos automàticament de les regions en expansió a les regions en recessió (estabilitzadors automàtics a nivell supranacional). Exemple: EUA.<br/>
                        <strong>4. Diversificació productiva</strong> (Kenen, 1969): economies diversificades pateixen menys els shocks sectorials.<br/>
                        <strong>5. Obertura comercial</strong> (McKinnon, 1963): economies molt obertes entre si es beneficien més d'eliminar la incertesa canviària.<br/>
                        <strong>6. Similitud de cicles econòmics:</strong> si els cicles són sincrònics, una política monetària comuna és adequada per a tots.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. És l'eurozona un AMO?" color="amber">
                    <p>
                        La majoria dels economistes coincideixen que l'eurozona <strong>no compleix plenament</strong> els criteris d'AMO: la mobilitat laboral és baixa (barreres lingüístiques i culturals), els salaris són relativament rígids a la baixa, no existeix un pressupost federal significatiu (el pressupost de la UE és sols l'~1 % del PIB, davant l'~25 % del pressupost federal dels EUA), i els cicles econòmics no sempre estan sincronitzats (Alemanya vs. Grècia durant la crisi).
                    </p>
                    <p>
                        Tanmateix, <strong>Frankel i Rose</strong> (1998) van argumentar que els criteris d'AMO poden ser <strong>endògens</strong>: el propi procés d'integració monetària pot generar major sincronització de cicles, major comerç intraindustrial i major mobilitat de factors. L'euro crearia les condicions del seu propi èxit a posteriori.
                    </p>
                </TheoryBlock>

            <Card title="4. La crisi de l'euro i les reformes" icon="📘">
                <TheoryBlock title="4.1. La crisi de deute sobirà (2010-2012)" color="green">

                        <strong>Ragnar Nurkse</strong> va descriure el <strong>cercle viciós de la pobresa</strong>: la baixa renda genera baix estalvi, que al seu torn genera baixa inversió, baixa productivitat i, de nou, baixa renda. Este cercle s'autoreforça i és difícil de trencar sense intervenció externa o un «gran impuls» (<em>big push</em>, Rosenstein-Rodan 1943).

                    <p>

                        <strong>Herència colonial:</strong> el colonialisme va deixar estructures extractives (monocultiu d'exportació, institucions febles) dissenyades per a beneficiar la metròpoli, no per al desenvolupament local (Acemoglu & Robinson, 2012).<br/>
                        <strong>Institucions febles:</strong> corrupció, inseguretat jurídica, drets de propietat difusos, burocràcia excessiva i falta d'Estat de Dret desincentiven la inversió i l'activitat empresarial. «Les institucions importen» (North, 1990; Acemoglu & Robinson, 2012).<br/>
                        <strong>Capital humà:</strong> baixos nivells d'educació i salut redueixen la productivitat i la capacitat d'absorbir tecnologia. La fuga de cervells (emigració dels més qualificats) agreuja el problema.<br/>
                        <strong>Explosió demogràfica:</strong> altes taxes de creixement de la població dilueixen els guanys del creixement econòmic en termes per capita i pressionen els serveis públics.
                    </p>

                <TheoryBlock title="2.3. Factors externs" color="teal">

                        <strong>Dependència i «centre-perifèria»</strong> (CEPAL, Prebisch): l'estructura del comerç internacional reprodueix i reforça la desigualtat entre països del «centre» (industrialitzats) i la «perifèria» (exportadors de matèries primeres).<br/>
                        <strong>Deute extern:</strong> l'endeutament excessiu drena recursos cap al pagament d'interessos en lloc de destinar-los a inversió productiva, salut o educació.<br/>
                        <strong>Termes d'intercanvi desfavorables, proteccionisme agrícola</strong> dels països desenvolupats (subsidis PAC, Farm Bill), accés restringit als mercats del Nord.

                <TheoryBlock title="3.1. Industrialització per substitució d'importacions (ISI)" color="green">
                    <p>
                        Promoguda per la <strong>CEPAL</strong> i <strong>Raúl Prebisch</strong> en els anys 50-70, va consistir a protegir la indústria nacional mitjançant aranzels elevats per a substituir importacions per producció local. Es va aplicar àmpliament a Amèrica Llatina (Argentina, Brasil, Mèxic).
                    </p>
                    <p>
                        <strong>Resultats mixtos:</strong> va generar industrialització inicial però també ineficiència (indústries protegides i no competitives), concentració de l'ingrés, desatenció de l'agricultura i dèficits comercials crònics. Va ser abandonada gradualment en els anys 80-90.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Industrialització orientada a l'exportació (IOE)" color="emerald">
                    <p>
                        Estratègia seguida pels <strong>«tigres asiàtics»</strong> (Corea del Sud, Taiwan, Singapur, Hong Kong) i posteriorment per la Xina. Consisteix a desenvolupar indústries orientades al mercat mundial, aprofitant l'avantatge comparatiu en costos laborals i ascendint progressivament cap a produccions de major valor afegit.
                    </p>
                    <p>
                        <strong>Claus de l'èxit:</strong> inversió massiva en educació i capital humà, estabilitat macroeconòmica, infraestructures, obertura comercial selectiva (protecció temporal d'indústries naixents combinada amb exportació agressiva), atracció d'IED i transferència tecnològica, Estat desenvolupista actiu (no laissez-faire).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Altres estratègies i enfocaments contemporanis" color="teal">
                    <p>
                        <strong>Consens de Washington (1989):</strong> liberalització, privatització, disciplina fiscal. Resultats mixtos: va créixer l'estabilitat macro però va augmentar la desigualtat i no sempre va generar creixement inclusiu.<br/>
                        <strong>Desenvolupament humà (Sen, PNUD):</strong> el desenvolupament no és sols creixement del PIB sinó ampliació de les capacitats i llibertats de les persones.<br/>
                        <strong>Institucionalisme (North, Acemoglu):</strong> les institucions inclusives (drets de propietat, Estat de Dret, participació política) són la causa profunda del desenvolupament.<br/>
                        <strong>Microfinances (Yunus):</strong> accés al crèdit per als més pobres com a ferramenta d'emprenedoria i desenvolupament local.<br/>
                        <strong>Desenvolupament sostenible:</strong> integrar creixement, equitat i sostenibilitat ambiental (ODS/Agenda 2030).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. L'ajuda al desenvolupament i el deute extern" icon="📘">
                <TheoryBlock title="4.1. L'ajuda oficial al desenvolupament (AOD)" color="green">
                    <p>
                        L'<strong>AOD</strong> són els fluxos financers concessionals (donacions i préstecs blans) que els països desenvolupats dirigeixen als PVD amb l'objectiu de promoure el seu desenvolupament econòmic i social. L'ONU va establir en 1970 la meta de destinar el <strong>0,7 % del PIB</strong> dels països donants a l'AOD. Només cinc països la compleixen sistemàticament: Noruega, Suècia, Dinamarca, Luxemburg i Alemanya. La mitjana del CAD (Comité d'Ajuda al Desenvolupament de l'OCDE) se situa al voltant del 0,3 %.
                    </p>
                    <p>
                        <strong>Debat sobre l'eficàcia de l'ajuda:</strong> els defensors (Sachs, 2005) argumenten que l'ajuda ben dirigida (salut, educació, infraestructures) pot trencar les trampes de pobresa. Els crítics (Easterly, 2006; Moyo, 2009) assenyalen que l'ajuda genera dependència, alimenta la corrupció, distorsiona els mercats i ha tingut resultats decebedors en molts països.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La crisi del deute extern" color="emerald">
                    <p>
                        La <strong>crisi del deute</strong> dels anys 80 (desencadenada per la declaració d'impagament de Mèxic en 1982) va sumir molts PVD (especialment d'Amèrica Llatina i Àfrica) en una «dècada perduda» d'estancament i ajust. Les causes van incloure l'endeutament excessiu durant els anys 70 (petrodòlars reciclats), la pujada dels tipus d'interés internacionals (Volcker) i el deteriorament de la RRI.
                    </p>
                    <p>
                        Les respostes van incloure els <strong>programes d'ajust estructural</strong> de l'FMI i el Banc Mundial (condicionalitat: austeritat + reformes liberalitzadores), la <strong>iniciativa HIPC</strong> (Heavily Indebted Poor Countries, 1996) de condonació de deute per als països més pobres i la <strong>iniciativa MDRI</strong> (Multilateral Debt Relief Initiative, 2005).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Els Objectius de Desenvolupament Sostenible (ODS)" icon="📘">
                <TheoryBlock title="5.1. Dels ODM als ODS" color="green">
                    <p>
                        Els <strong>Objectius de Desenvolupament del Mil·lenni (ODM)</strong> (2000-2015) van establir 8 metes (reducció de la pobresa extrema a la meitat, educació primària universal, igualtat de gènere, reducció de la mortalitat infantil, etc.) amb assoliments significatius però desiguals.
                    </p>
                    <p>
                        Els <strong>Objectius de Desenvolupament Sostenible (ODS)</strong>, aprovats per l'Assemblea General de l'ONU al setembre de 2015, constitueixen l'<strong>Agenda 2030</strong>: 17 objectius i 169 metes que integren les tres dimensions del desenvolupament sostenible (econòmica, social i ambiental). A diferència dels ODM, els ODS són <strong>universals</strong> (aplicables a tots els països, no sols als PVD) i <strong>integrats</strong> (reconeixen les interconnexions entre pobresa, desigualtat, canvi climàtic, educació, salut, aigua, pau i institucions).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Els 17 ODS" color="emerald">
                    <p>
                        1. Fi de la pobresa | 2. Fam zero | 3. Salut i benestar | 4. Educació de qualitat | 5. Igualtat de gènere | 6. Aigua neta | 7. Energia assequible | 8. Treball decent i creixement | 9. Indústria, innovació i infraestructura | 10. Reducció de les desigualtats | 11. Ciutats sostenibles | 12. Producció i consum responsables | 13. Acció pel clima | 14. Vida submarina | 15. Vida d'ecosistemes terrestres | 16. Pau, justícia i institucions | 17. Aliances per als objectius.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Avaluació i reptes" color="amber">
                    <p>
                        A mig camí (2023), el progrés cap als ODS és <strong>insuficient</strong> (ONU): la pandèmia COVID-19 va revertir avanços en pobresa i educació, el canvi climàtic s'accelera, la desigualtat persisteix i el finançament és inadequat. S'estima una bretxa de finançament de 4,2 bilions de dòlars anuals per a aconseguir els ODS en els PVD. La cooperació internacional, la mobilització de recursos domèstics i la participació del sector privat són essencials.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Este tema és central en el currículum d'<strong>Economia de 1r de Batxillerat</strong> (RD 243/2022), connectant amb CE1 (funcionament del sistema econòmic i els seus efectes sobre el benestar), CE5 (context econòmic internacional) i els continguts transversals de sostenibilitat i educació per a la ciutadania global. Contribueix de forma destacada a les competències <strong>CC</strong> (ciutadania activa, compromís amb la justícia global i els ODS), <strong>CPSAA</strong> (juí crític sobre les causes de la pobresa i les estratègies de desenvolupament), <strong>STEM</strong> (anàlisi d'indicadors de desenvolupament: IDH, Gini, dades del Banc Mundial) i <strong>CCL</strong> (lectura d'informes d'organismes internacionals).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="green">
                    <p>
                        L'economia del desenvolupament estudia com els països amb baixos nivells de renda i benestar poden transformar les seues estructures. El desenvolupament va més enllà del creixement del PIB: inclou salut, educació, igualtat, llibertats i sostenibilitat (Sen, IDH). Les causes del subdesenvolupament són múltiples: el cercle viciós de la pobresa (Nurkse), les institucions extractives (Acemoglu), l'herència colonial, la geografia, el baix capital humà i els factors externs (RRI, deute, proteccionisme del Nord). Les estratègies de desenvolupament han oscil·lat entre la ISI (CEPAL) i la IOE (tigres asiàtics), amb el consens actual apuntant cap a institucions inclusives, inversió en capital humà i obertura selectiva. L'ajuda al desenvolupament (0,7 % del PIB) i la gestió del deute extern continuen sent debats oberts. Els ODS (Agenda 2030) constitueixen el marc global per a un desenvolupament que integre creixement, equitat i sostenibilitat, encara que el progrés és insuficient.
                    </p>
                </TheoryBlock>
            </Card>
