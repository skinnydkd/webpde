            'tema37.title': { val: "Qualitat de vida i indicadors. Enfocament sistèmic. Requisits teòrics dels indicadors. Cap a un índex global.", es: 'Calidad de vida e indicadores. Enfoque sistémico. Hacia un índice global.', en: 'Quality of life and indicators. Systemic approach. Towards a global index.' },
        };

        const t = createTranslator(pageTranslations, idioma);

        const Card = ({ children, className = "", title, icon }) => (
            <div className={`bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 hover:shadow-md transition-shadow ${className} animate-fade`}>
                {title && <div className="flex items-center gap-3 mb-5 pb-4 border-b border-slate-100"><span className="text-2xl">{icon}</span><h3 className="font-bold text-slate-800 text-lg">{title}</h3></div>}
                {children}
            </div>
        );

        const Tabs = ({ tabs, active, onChange }) => (
            <div className="flex flex-wrap gap-1 p-1.5 bg-slate-100 rounded-xl">
                {tabs.map(tab => (
                    <button key={tab.id} onClick={() => onChange(tab.id)} className={`flex-1 min-w-fit py-2.5 px-4 rounded-lg text-sm font-semibold transition-all ${active === tab.id ? 'bg-white shadow-sm text-red-600' : 'text-slate-600 hover:text-slate-800 hover:bg-white/50'}`}>{tab.label}</button>
                ))}
            </div>
        );

        const TheoryBlock = ({ title, children, color = "slate" }) => {

            return (

        };

        const FormulaBox = ({ formula, desc }) => (

        const SectionTitle = ({ icon, title, subtitle }) => (

                {subtitle && <p className="text-slate-500 ml-12 text-sm">{subtitle}</p>}
            </div>
        );

        const BibliografiaBox = ({ items }) => (

                <ul className="space-y-2">{items.map((item, i) => <li key={i} className="text-sm text-slate-700 leading-relaxed pl-4 border-l-2 border-slate-200">{item}</li>)}</ul>
            </div>
        );

        const ClauBox = ({ children }) => (

        // TEMES 27-37 — Placeholders per començar
        const TemaPlaceholder = ({ num, title, icon }) => (

                <Card>

                        <p className="text-sm text-slate-500 max-w-md mx-auto">Aquest tema s'està actualitzant amb contingut rigorós, gràfics, exemples pràctics i referències acadèmiques actualitzades.</p>

        // ════════════════════════════════════════════════════════════════
        // TEMA 27 — Creixement i desenvolupament econòmic
        // ════════════════════════════════════════════════════════════════
        const Tema27Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>El <strong>creixement econòmic</strong> ha estat, històricament, l'indicador més utilitzat per mesurar el progrés material d'una societat. Tanmateix, el segle XXI ha vist ampliar-se el concepte cap al <strong>desenvolupament</strong>, que incorpora dimensions socials, ambientals i de qualitat de vida. Com va formular <strong>Amartya Sen</strong> (Nobel 1998), «el desenvolupament és l'expansió de les llibertats reals de les persones».</p>
                        <p>Les dades actuals mostren desigualtats dramàtiques: el PIB per càpita dels EUA (~80.000 $, 2024) multiplica per 15-20 el d'un país en desenvolupament. Espanya (~33.000 $) està a la zona alta-mitjana de l'OCDE. Entendre les causes, teories i mecanismes del creixement és essencial per a la política econòmica del segle XXI.</p>
                        <p>El tema s'estructura en 5 blocs: (1) conceptes i mesurament; (2) factors del creixement; (3) teories explicatives (clàssica, Solow, endògena); (4) subdesenvolupament; (5) polítiques de desenvolupament.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i mesurament" icon="📊">
                    <TheoryBlock title="1.1. Creixement vs. desenvolupament" color="red">
                        <p>• <strong>Creixement econòmic</strong>: augment sostingut de la producció de béns i serveis (PIB real per càpita).</p>
                        <p>• <strong>Desenvolupament econòmic</strong>: canvi estructural que incorpora millora de les condicions de vida, reducció de la pobresa, equitat, sostenibilitat (Sen, Stiglitz, Rodrik).</p>
                        <p>El creixement és <em>necessari</em> però <em>no suficient</em> per al desenvolupament.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Indicadors clàssics i alternatius" color="rose">
                        <p><strong>Clàssics</strong>: PIB, PIB per càpita, PNB, Renda Nacional Disponible.</p>
                        <p><strong>Alternatius</strong>: <strong>IDH</strong> (Nacions Unides, 1990, basat en Sen-Haq): esperança de vida + educació + ingrés; <strong>IDH-D</strong> (ajustat per desigualtat); <strong>IPM</strong> (Índex de Pobresa Multidimensional); <strong>GPI</strong> (Genuine Progress Indicator); <strong>índex de Felicitat</strong> (Bhutan, World Happiness Report ONU).</p>
                    </TheoryBlock>

                    <FormulaBox formula="Taxa de creixement = (PIB_t − PIB_{t−1}) / PIB_{t−1} · 100" desc="Taxa anual de creixement real (deflactat)" />
                </Card>

                <Card title="2. Factors del creixement" icon="⚙️">
                    <TheoryBlock title="2.1. Factors productius tradicionals" color="indigo">
                        <p>(1) <strong>Treball (L)</strong>: quantitat i qualitat (capital humà, Becker 1964).</p>
                        <p>(2) <strong>Capital físic (K)</strong>: maquinària, infraestructures.</p>
                        <p>(3) <strong>Recursos naturals</strong>: sòl, minerals, energia.</p>
                        <p>(4) <strong>Tecnologia (A)</strong>: progrés tècnic, innovació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Capital humà i institucional" color="violet">
                        <p><strong>Capital humà</strong> (Schultz 1961, Becker 1964): educació, salut, experiència.</p>
                        <p><strong>Institucions</strong> (North, Nobel 1993; Acemoglu-Robinson 2012, <em>Why Nations Fail</em>): regles que estructuren la cooperació. Institucions extractives vs. inclusives. <strong>Acemoglu-Robinson-Johnson</strong> van rebre el Nobel 2024 per aquesta línia.</p>
                        <p><strong>Capital social</strong> (Putnam 1993): xarxes de confiança cívica.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Teories explicatives" icon="🧠">
                    <TheoryBlock title="3.1. Model clàssic (Smith, Ricardo, Malthus)" color="amber">
                        <p><strong>Smith</strong> (1776): divisió del treball + acumulació de capital + comerç.</p>
                        <p><strong>Ricardo</strong> (1817): rendiments decreixents de la terra → estat estacionari.</p>
                        <p><strong>Malthus</strong> (1798): població creix geomètricament, aliment aritmèticament → trampa malthusiana.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Model neoclàssic de Solow (1956)" color="indigo">
                        <p><strong>Robert Solow</strong> (Nobel 1987), a «A Contribution to the Theory of Economic Growth» (<em>QJE</em>, 1956), va proposar:</p>
                        <p>Y = F(K, L·A), amb rendiments decreixents del capital. En estat estacionari, el creixement del PIB per càpita depèn només del progrés tècnic (A). L'acumulació de capital condueix a convergència.</p>
                        <p>El <strong>residual de Solow</strong> (progrés tècnic exògen) explica la major part del creixement. Crítica: la tecnologia és tractada com a «caixa negra».</p>
                    </TheoryBlock>

                    <FormulaBox formula="Y = K^α · (A·L)^(1−α)  |  Estat estacionari: g_y = g_A" desc="Model de Solow: el creixement per càpita a LP depèn del progrés tècnic" />

                    <TheoryBlock title="3.3. Creixement endogen (Romer 1986, Lucas 1988)" color="emerald">
                        <p><strong>Paul Romer</strong> (Nobel 2018) i <strong>Robert Lucas</strong> (Nobel 1995) van endogeneïtzar el progrés tècnic:</p>
                        <p>• <strong>Romer</strong>: R+D i externalitats de coneixement (<em>learning by doing</em>) generen rendiments creixents.</p>
                        <p>• <strong>Lucas</strong>: l'acumulació de capital humà és clau.</p>
                        <p>Implicacions polítiques: subvencionar R+D, educació, mercats protegits per la propietat intel·lectual.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.4. Altres enfocaments" color="cyan">
                        <p><strong>Harrod-Domar (1939, 1946)</strong>: model keynesià. g = s/v (estalvi/ratio capital-producte). «Knife-edge»: equilibri inestable.</p>
                        <p><strong>Kaldor (1961)</strong>: fets estilitzats del creixement.</p>
                        <p><strong>Rostow (1960)</strong>: 5 etapes del desenvolupament.</p>
                        <p><strong>Schumpeter (1911)</strong>: destrucció creativa i cicles d'innovació (base dels models evolutius).</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Subdesenvolupament" icon="🌍">
                    <TheoryBlock title="4.1. Característiques" color="rose">
                        <p>• PIB per càpita baix.</p>
                        <p>• Alta dependència del sector primari.</p>
                        <p>• Deficient capital humà.</p>
                        <p>• Feblesa institucional.</p>
                        <p>• Dependència externa (financera, tecnològica).</p>
                        <p>• Estructures socials duals (modern vs. tradicional).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Teories del subdesenvolupament" color="violet">
                        <p><strong>Teoria de la modernització</strong> (Rostow 1960): els països subdesenvolupats seguiran el camí dels desenvolupats.</p>
                        <p><strong>Teoria de la dependència</strong> (Prebisch 1950, Frank 1967): el centre explota la perifèria via termes d'intercanvi desfavorables i deute.</p>
                        <p><strong>Geografia i clima</strong> (Jeffrey Sachs): trampes de pobresa geogràfiques.</p>
                        <p><strong>Institucions extractives</strong> (Acemoglu-Robinson 2012).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Trampes de pobresa" color="amber">
                        <p>Cercles viciosos que perpetuen el subdesenvolupament: baixos ingressos → baixa inversió → baixa productivitat → baixos ingressos. Mecanismes: malnutrició, malaltia, analfabetisme, falta de crèdit. <strong>Banerjee-Duflo-Kremer</strong> (Nobel 2019) han promogut l'ús d'RCT per identificar intervencions efectives.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Polítiques de desenvolupament" icon="🎯">
                    <TheoryBlock title="5.1. Estratègies classiques" color="indigo">
                        <p>• <strong>Industrialització per substitució d'importacions (ISI)</strong>: Amèrica Llatina anys 50-70. Aranzels i subvencions per substituir importacions. Resultat: estancament després de dècades.</p>
                        <p>• <strong>Orientació exportadora</strong>: Corea del Sud, Taiwan, Singapur anys 60-90. Èxit espectacular.</p>
                        <p>• <strong>Consens de Washington</strong> (1989): liberalització, privatització, disciplina fiscal. Resultats mixtos.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Agenda 2030 i ODS" color="emerald">
                        <p>Els <strong>17 Objectius de Desenvolupament Sostenible</strong> (ODS) de l'Agenda 2030 de l'ONU (2015) integren dimensions econòmiques, socials i ambientals. Exemples: fi de la pobresa (ODS 1), educació de qualitat (4), igualtat de gènere (5), treball digne (8), reducció desigualtats (10), acció pel clima (13).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Ajuda al desenvolupament" color="cyan">
                        <p>L'objectiu ONU d'AOD del 0,7 % del PIB per als països desenvolupats es compleix només per uns pocs (Suècia, Noruega, Dinamarca, Luxemburg). Espanya ~0,24 % el 2023. Crítics (Easterly 2006) argumenten que l'ajuda mal dissenyada pot generar dependència i corrupció. Defensors (Sachs) creuen que és imprescindible.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>El creixement econòmic, concepte central de la teoria econòmica des d'<strong>Adam Smith (1776)</strong>, s'ha anat enriquint amb dimensions qualitatives i sostenibles. Els models de <strong>Solow (1956)</strong>, <strong>Romer (1986)</strong> i <strong>Lucas (1988)</strong> ofereixen marcs rigorosos per analitzar-ne les causes. La investigació empírica (<strong>Acemoglu-Robinson</strong>, Nobel 2024) ha destacat el paper crucial de les <strong>institucions</strong>.</p>
                        <p>El <strong>subdesenvolupament</strong> no és simplement manca de creixement, sinó una estructura complexa de trampes de pobresa, dependència i feblesa institucional. Les polítiques de desenvolupament modernes, emmarcades en l'Agenda 2030, busquen un creixement inclusiu, sostenible i equitatiu. El docent ha de transmetre que el creixement econòmic és un mitjà, no un fi, al servei del benestar humà (Sen).</p>
                    </div>
