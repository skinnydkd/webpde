// Check if a player has monopoly on a sector
function hasSectorMonopoly(playerId, sector, properties) {
    var sectorProps = SECTOR_PROPERTIES[sector];
    if (!sectorProps || sectorProps.length === 0) return false;
    return sectorProps.every(function(idx) {
        return properties[idx] && properties[idx].owner === playerId;
    });
}

// ═══════════════════════════════════════════════════════════════
// ECONOMIC INDICATORS — Track game economy health
// ═══════════════════════════════════════════════════════════════
function calculateEconomicIndicators(gameState) {
    var gs = gameState || {};
    var money = gs.money || {};
    var properties = gs.properties || {};
    var playerOrder = gs.playerOrder || [];

    // Total money in circulation
    var totalMoney = 0;
    playerOrder.forEach(function(pid) { totalMoney += money[pid] || 0; });

    // Properties owned vs total
    var totalProps = 0;
    var ownedProps = 0;
    Object.keys(properties).forEach(function(idx) {
        totalProps++;
        if (properties[idx] && properties[idx].owner) ownedProps++;
    });

    // Wealth inequality (Gini-like simplified)
    var netWorths = playerOrder.map(function(pid) {
        return calculateNetWorth(pid, money, properties, gs.cycle, gs.sectorModifiers);
    }).sort(function(a, b) { return a - b; });
    var avgWealth = netWorths.reduce(function(a, b) { return a + b; }, 0) / (netWorths.length || 1);
    var giniNum = 0;
    netWorths.forEach(function(w, i) {
        netWorths.forEach(function(w2) {
            giniNum += Math.abs(w - w2);
        });
    });
    var giniDen = 2 * netWorths.length * netWorths.length * (avgWealth || 1);
    var gini = Math.round((giniNum / giniDen) * 100);

    // Average R+D level
    var totalRd = 0;
    var rdCount = 0;
    Object.keys(properties).forEach(function(idx) {
        if (properties[idx] && properties[idx].owner) {
            totalRd += properties[idx].rdLevel || 0;
            rdCount++;
        }
    });
    var avgRd = rdCount > 0 ? (totalRd / rdCount).toFixed(1) : '0.0';

    return {
        totalMoney: totalMoney,
        ownedProps: ownedProps,
        totalProps: totalProps,
        ownershipRate: totalProps > 0 ? Math.round((ownedProps / totalProps) * 100) : 0,
        gini: Math.min(100, gini),
        avgRd: avgRd,
        publicFund: gs.publicFund || 0,
        avgWealth: Math.round(avgWealth)
    };
}

function DiceRollAnimation({ dice, rolling, onComplete }) {
    const [d1Display, setD1Display] = useState(dice ? dice[0] : 1);
    const [d2Display, setD2Display] = useState(dice ? dice[1] : 1);
    const [isAnimating, setIsAnimating] = useState(false);

    useEffect(function() {
        if (!rolling) return;
        setIsAnimating(true);
        var count = 0;
        var interval = setInterval(function() {
            setD1Display(Math.floor(Math.random() * 6) + 1);
            setD2Display(Math.floor(Math.random() * 6) + 1);
            count++;
            if (count >= 12) {
                clearInterval(interval);
                if (dice) {
                    setD1Display(dice[0]);
                    setD2Display(dice[1]);
                }
                setIsAnimating(false);
                PdeGameSounds.play('pop');
                if (onComplete) setTimeout(onComplete, 300);
            }
        }, 80);
        return function() { clearInterval(interval); };
    }, [rolling]);

    var diceFaces = { 1: '⚀', 2: '⚁', 3: '⚂', 4: '⚃', 5: '⚄', 6: '⚅' };

    return (
        <div className="flex gap-3 justify-center">
            <div className={'w-16 h-16 rounded-2xl bg-white shadow-lg flex items-center justify-center ' +
                (isAnimating ? 'animate-bounce' : '')}

            </div>
        </div>
    );
}

// ═══════════════════════════════════════════════════════════════
// R+D LEVELS — Upgrade multipliers and costs
// ═══════════════════════════════════════════════════════════════
var RD_LEVELS = [
    { level: 0, multiplier: 1.0, costFactor: 0, label: 'Base' },
    { level: 1, multiplier: 1.5, costFactor: 0.5, label: 'Nivell 1' },
    { level: 2, multiplier: 2.0, costFactor: 0.75, label: 'Nivell 2' },
    { level: 3, multiplier: 3.0, costFactor: 1.0, label: 'Nivell 3' }
];

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════

// Calculate rent for a property considering R+D, cycle, news modifiers, and monopoly bonus
function calculateRent(propertyIndex, properties, cycle, sectorModifiers) {
    var sq = BOARD[propertyIndex];
    if (!sq || sq.type !== 'property') return 0;
    var prop = properties[propertyIndex];
    if (!prop || !prop.owner) return 0;

    var baseRent = sq.rent;
    var rdLevel = prop.rdLevel || 0;
    var rdMult = RD_LEVELS[rdLevel] ? RD_LEVELS[rdLevel].multiplier : 1;
    var cycleMult = cycle === 'expansion' ? 1.3 : cycle === 'recession' ? 0.7 : 1;
    var sectorMod = (sectorModifiers && sectorModifiers[sq.sector]) ? sectorModifiers[sq.sector] : 1;

    // Monopoly bonus: if player owns all properties in the sector, rent is doubled
    var monopolyMult = 1;
    if (hasSectorMonopoly(prop.owner, sq.sector, properties)) {
        monopolyMult = 2;
    }

    return Math.round(baseRent * rdMult * cycleMult * sectorMod * monopolyMult);
}

// Calculate property value for net worth
function calculatePropertyValue(propertyIndex, properties, cycle, sectorModifiers) {
    var sq = BOARD[propertyIndex];
    if (!sq || sq.type !== 'property') return 0;
    var prop = properties[propertyIndex];
    if (!prop) return 0;

    var basePrice = sq.price;
    var cycleMult = cycle === 'expansion' ? 1.2 : cycle === 'recession' ? 0.8 : 1;
    var sectorMod = (sectorModifiers && sectorModifiers[sq.sector]) ? sectorModifiers[sq.sector] : 1;
    var rdInvestment = 0;
    for (var i = 1; i <= (prop.rdLevel || 0); i++) {
        rdInvestment += Math.round(sq.price * RD_LEVELS[i].costFactor);
    }

    return Math.round(basePrice * cycleMult * sectorMod) + rdInvestment;
}

// Calculate net worth for a player
function calculateNetWorth(playerId, money, properties, cycle, sectorModifiers) {
    var cash = (money && money[playerId]) ? money[playerId] : 0;
    var propValue = 0;
    if (properties) {
        Object.keys(properties).forEach(function(idx) {
            if (properties[idx] && properties[idx].owner === playerId) {
                propValue += calculatePropertyValue(parseInt(idx), properties, cycle, sectorModifiers);
            }
        });
    }
    return cash + propValue;
}

// Calculate progressive tax
function calculateTax(netWorth) {
    if (netWorth > 1000) return Math.round(netWorth * 0.15);
    if (netWorth > 500) return Math.round(netWorth * 0.10);
    return Math.round(netWorth * 0.05);
}

// Get R+D upgrade cost (with optional discount)
function getRdUpgradeCost(propertyIndex, currentLevel, discount) {
    var sq = BOARD[propertyIndex];
    if (!sq || sq.type !== 'property') return Infinity;
    var nextLevel = (currentLevel || 0) + 1;
    if (nextLevel > 3) return Infinity;
    var cost = Math.round(sq.price * RD_LEVELS[nextLevel].costFactor);
    if (discount) cost = Math.round(cost * (1 - discount));
    return cost;
}

// Get properties owned by a player
function getPlayerProperties(playerId, properties) {
    var result = [];
    if (!properties) return result;
    Object.keys(properties).forEach(function(idx) {
        if (properties[idx] && properties[idx].owner === playerId) {
            result.push(parseInt(idx));
        }
    });
    return result;
}

// Get player color index from player order
function getPlayerColorIndex(playerId, playerOrder) {
    if (!playerOrder) return 0;
    var idx = playerOrder.indexOf(playerId);
    return idx >= 0 ? idx : 0;
}

// Map board index to CSS grid position (9x9 grid)
// 28 squares on outer ring: 4 corners + 4 sides of 5 = 4 + 4*6 = 28 ✓
// Using 9x9 grid: bottom row cols 1-7, right col rows 7-1, top row cols 7-1, left col rows 2-8
// Corners at: (9,1), (9,7), (1,7), (1,1) — NOT used, we use connected path instead
//
// Actual layout: each side has 7 squares, corners connect the sides
// Bottom: row 9, col 1..7
// Right: row 8..2, col 9 — connects via (9,8→8,9 gap)
//
// Simplification: Use a 9-col x 9-row grid. Place squares on the outer edge.
// We have 28 squares. 9*4 - 4 = 32 for a full perimeter. So some cells are empty.
// Place 7 per side, leaving 1 empty cell at each "corner transition".
var GRID_POSITIONS = [
    // Bottom row, left to right (indices 0-6): row 9, cols 1-7
    { row: 9, col: 1 }, // 0: SORTIDA
    { row: 9, col: 2 }, // 1: Cooperativa
    { row: 9, col: 3 }, // 2: IMPOSTOS
    { row: 9, col: 4 }, // 3: Fabrica
    { row: 9, col: 5 }, // 4: NOTICIA
    { row: 9, col: 6 }, // 5: Startup
    { row: 9, col: 7 }, // 6: BCE (corner-ish)

    // Right column, bottom to top (indices 7-13): rows 8..2, col 9
    { row: 8, col: 9 }, // 7: Cadena Hotelera
    { row: 7, col: 9 }, // 8: NOTICIA
    { row: 6, col: 9 }, // 9: Planta Solar
    { row: 5, col: 9 }, // 10: Refineria
    { row: 4, col: 9 }, // 11: MERCAT LLIURE
    { row: 3, col: 9 }, // 12: Aerolinia
    { row: 2, col: 9 }, // 13: IMPOSTOS

    // Top row, right to left (indices 14-20): row 1, cols 9..3
    { row: 1, col: 9 }, // 14: BCE
    { row: 1, col: 8 }, // 15: Resort
    { row: 1, col: 7 }, // 16: NOTICIA
    { row: 1, col: 6 }, // 17: Promotora
    { row: 1, col: 5 }, // 18: R+D
    { row: 1, col: 4 }, // 19: Constructora
    { row: 1, col: 3 }, // 20: BCE

    // Left column, top to bottom (indices 21-27): rows 2..8, col 1
    { row: 2, col: 1 }, // 21: Banc Comercial
    { row: 3, col: 1 }, // 22: NOTICIA
    { row: 4, col: 1 }, // 23: Asseguradora
    { row: 5, col: 1 }, // 24: Exportadora
    { row: 6, col: 1 }, // 25: Hospital Privat
    { row: 7, col: 1 }, // 26: Big Tech
    { row: 8, col: 1 }  // 27: Plataforma Petroli
];


// ═══════════════════════════════════════════════════════════════
// BOARD SQUARE COMPONENT
// ═══════════════════════════════════════════════════════════════
function BoardSquare({ index, square, property, playerPositions, playerOrder, currentPlayerIdx, isAuctioning }) {
    var pos = GRID_POSITIONS[index];
    var isCorner = (index === 0 || index === 6 || index === 14 || index === 20);
    var isProperty = square.type === 'property';
    var sector = isProperty ? SECTORS[square.sector] : null;

    if (isProperty && property && property.owner) {
        var ownerIdx = getPlayerColorIndex(property.owner, playerOrder);
        ownerColor = PLAYER_COLORS[ownerIdx];
    }

    // Find players on this square
    var playersHere = [];
    if (playerPositions && playerOrder) {
        playerOrder.forEach(function(pid, pidx) {
            if (playerPositions[pid] === index) {
                playersHere.push({ id: pid, colorIdx: pidx });
            }
        });
    }

    var squareStyle = {
        gridRow: pos.row,
        gridColumn: pos.col,
        minWidth: 0,
        minHeight: 0
    };

    var sectorColor = sector ? sector.color : '#6b7280';
    var highlight = isAuctioning ? 'ring-4 ring-yellow-400 ring-offset-2 z-20' : '';

    return (
        <div className={'board-square relative flex flex-col rounded-lg overflow-hidden shadow-md border border-white/20 ' + highlight}
             style={squareStyle}
             title={square.name}>
            {/* Sector color bar for properties */}
            {isProperty && (
                <div className="h-2 w-full flex-shrink-0" style={{ backgroundColor: sectorColor }}></div>
            )}

            {/* Main content */}
            <div className={'flex-1 flex flex-col items-center justify-center p-0.5 text-center ' +
                (isProperty ? 'bg-white' : 'bg-gray-100')}
                 style={ownerColor ? { backgroundColor: ownerColor.hex + '22' } : {}}>

                {/* Emoji for non-property squares */}
                {!isProperty && (
                    <span className="text-xs md:text-sm leading-none">{square.emoji}</span>
                )}

                {/* Property emoji from sector */}
                {isProperty && (
                    <span className="text-xs leading-none">{sector.emoji}</span>
                )}

                {/* Name */}
                <span className="text-[7px] md:text-[8px] font-bold leading-tight truncate w-full px-0.5">
                    {square.shortName || square.name}
                </span>

                {/* Price for properties */}
                {isProperty && (
                    <span className="text-[6px] md:text-[7px] font-semibold text-gray-500">{square.price}€</span>
                )}

                {/* R+D dots */}
                {isProperty && property && property.rdLevel > 0 && (
                    <div className="flex gap-0.5 mt-0.5">
                        {Array.from({ length: property.rdLevel }).map(function(_, i) {
                            return <div key={i} className="w-1.5 h-1.5 rounded-full bg-blue-500"></div>;
                        })}
                    </div>
                )}

                {/* Owner indicator */}
                {ownerColor && (
                    <div className="w-3 h-3 rounded-full border border-white shadow-sm mt-0.5"
                         style={{ backgroundColor: ownerColor.hex }}></div>
                )}
            </div>

            {/* Player tokens */}
            {playersHere.length > 0 && (
                <div className="absolute bottom-0 right-0 flex flex-wrap gap-0.5 p-0.5">
                    {playersHere.map(function(p) {
                        var c = PLAYER_COLORS[p.colorIdx];
                        var isCurrent = p.colorIdx === currentPlayerIdx;
                        return (
                            <div key={p.id}
                                 className={'player-token rounded-full border border-white shadow ' +
                                     (isCurrent ? 'w-4 h-4 animate-pulse' : 'w-3 h-3')}
                                 style={{ backgroundColor: c.hex }}>
                            </div>
                        );
                    })}
                </div>
            )}
        </div>
    );
}

function PropertyCard({ propertyIndex, properties, cycle, sectorModifiers, playerOrder, large }) {

// ═══════════════════════════════════════════════════════════════
// HOST VIEW — Main game controller
// ═══════════════════════════════════════════════════════════════
function OligopolyHost({ roomCode, playerId, players, gameState, idioma }) {
    var t = createTranslator(ECONOPOLY_TRANSLATIONS, idioma);
    const [rolling, setRolling] = useState(false);
    const [showNews, setShowNews] = useState(false);
    const [actionLog, setActionLog] = useState([]);
    const [showCycleChange, setShowCycleChange] = useState(false);
    const [showFact, setShowFact] = useState(false);
    const [lastCycle, setLastCycle] = useState(null);
    const auctionTimerRef = useRef(null);

    var gs = gameState || {};
    var playerOrder = gs.playerOrder || [];
    var currentPlayerIdx = gs.currentPlayer || 0;
    var currentPid = playerOrder[currentPlayerIdx];
    var currentPlayerName = (players && currentPid && players[currentPid]) ? players[currentPid].name : '?';
    var phase = gs.phase || 'roll';
    var money = gs.money || {};
    var properties = gs.properties || {};
    var positions = gs.positions || {};
    var cycle = gs.cycle || 'expansion';
    var sectorModifiers = gs.sectorModifiers || {};
    var round = gs.round || 1;
    var maxRounds = gs.maxRounds || 20;

    // Add a log entry
    var addLog = function(msg) {
        setActionLog(function(prev) { return [msg].concat(prev).slice(0, 20); });
    };

    // Detect cycle changes and show overlay
    useEffect(function() {
        if (gs.cycle && lastCycle && gs.cycle !== lastCycle) {
            setShowCycleChange(true);
            setTimeout(function() { setShowCycleChange(false); }, 4000);
        }
        setLastCycle(gs.cycle || null);
    }, [gs.cycle]);

    // Show economic fact between turns
    useEffect(function() {
        if (phase === 'roll') {
            setShowFact(true);
            var timer = setTimeout(function() { setShowFact(false); }, 8000);
            return function() { clearTimeout(timer); };
        } else {
            setShowFact(false);
        }
    }, [phase, currentPlayerIdx]);

    // Auction timer management
    useEffect(function() {
        if (phase !== 'auction' || !gs.currentAuction) return;

        // The host manages the auction countdown locally and updates Firebase
        var auctionStart = gs.currentAuction.startedAt || Date.now();
        var duration = 30000; // 30 seconds

        auctionTimerRef.current = setInterval(function() {
            var elapsed = Date.now() - auctionStart;
            var remaining = Math.max(0, Math.ceil((duration - elapsed) / 1000));

            if (remaining <= 0) {
                clearInterval(auctionTimerRef.current);
                resolveAuction();
            }
        }, 1000);

        return function() {
            if (auctionTimerRef.current) clearInterval(auctionTimerRef.current);
        };
    }, [phase, gs.currentAuction?.propertyIndex]);

    // Listen for player bids during auction
    useEffect(function() {
        if (phase !== 'auction' || !gs.currentAuction) return;

        var ref = PdeFirebase.ref('rooms/' + roomCode + '/playerActions');
        ref.on('child_changed', function(snap) {
            var data = snap.val();
            if (data && data.type === 'bid' && data.amount) {
                handleBid(snap.key, data.amount);
            }
        });
        ref.on('child_added', function(snap) {
            var data = snap.val();
            if (data && data.type === 'bid' && data.amount) {
                handleBid(snap.key, data.amount);
            }
        });

        return function() { ref.off(); };
    }, [phase, gs.currentAuction?.propertyIndex]);

    // Listen for player R+D requests
    useEffect(function() {
        if (phase !== 'action') return;

        var ref = PdeFirebase.ref('rooms/' + roomCode + '/playerActions');
        ref.on('child_changed', function(snap) {
            var data = snap.val();
            if (data && data.type === 'rd_upgrade') {
                handleRdUpgrade(snap.key, data.propertyIndex);
            }
        });

        return function() { ref.off(); };
    }, [phase, currentPid]);

    // Handle a bid from a player
    var handleBid = function(bidderId, amount) {
        var auction = gs.currentAuction;
        if (!auction) return;
        var currentHigh = auction.highBid || 0;
        var playerMoney = money[bidderId] || 0;

        if (amount <= currentHigh || amount > playerMoney) return;

        var updates = {};
        updates['gameState/currentAuction/bids/' + bidderId] = amount;
        updates['gameState/currentAuction/highBid'] = amount;
        updates['gameState/currentAuction/highBidder'] = bidderId;
        PdeFirebase.ref('rooms/' + roomCode).update(updates);

        var bidderName = (players && players[bidderId]) ? players[bidderId].name : '?';
        addLog(bidderName + ' ofereix ' + amount + '€');
        PdeGameSounds.play('coin');
    };

    // Resolve auction (timer ended)
    var resolveAuction = function() {
        var auction = gs.currentAuction;
        if (!auction) return;

        var updates = {};
        if (auction.highBidder && auction.highBid) {
            // Winner pays and gets property
            var winnerMoney = (money[auction.highBidder] || 0) - auction.highBid;
            updates['gameState/money/' + auction.highBidder] = winnerMoney;
            updates['gameState/properties/' + auction.propertyIndex] = {
                owner: auction.highBidder,
                rdLevel: 0
            };
            var winnerName = (players && players[auction.highBidder]) ? players[auction.highBidder].name : '?';
            addLog('🔨 ' + winnerName + ' compra ' + BOARD[auction.propertyIndex].name + ' per ' + auction.highBid + '€');
            PdeGameSounds.play('win');
        } else {
            addLog('🔨 Cap oferta — propietat no venuda');
            PdeGameSounds.play('buzz');
        }

        updates['gameState/currentAuction'] = null;
        updates['gameState/phase'] = 'action';
        PdeFirebase.ref('rooms/' + roomCode).update(updates);
    };

    // Handle R+D upgrade request from player
    var handleRdUpgrade = function(pid, propIdx) {
        if (pid !== currentPid) return;
        var prop = properties[propIdx];
        if (!prop || prop.owner !== pid) return;
        var currentLevel = prop.rdLevel || 0;
        if (currentLevel >= 3) return;

        var discount = gs.freeRd ? 1 : (gs.rdDiscount || 0);
        var cost = getRdUpgradeCost(propIdx, currentLevel, discount);
        var playerMoney = money[pid] || 0;
        if (cost > playerMoney) return;

        var updates = {};
        updates['gameState/money/' + pid] = playerMoney - cost;
        updates['gameState/properties/' + propIdx + '/rdLevel'] = currentLevel + 1;
        if (gs.freeRd) {
            updates['gameState/freeRd'] = null;
        }
        PdeFirebase.ref('rooms/' + roomCode).update(updates);

        var pName = (players && players[pid]) ? players[pid].name : '?';
        addLog('🔬 ' + pName + ' millora R+D de ' + BOARD[propIdx].shortName + ' a nivell ' + (currentLevel + 1));
        PdeGameSounds.play('ding');

        // Clear the action so player can do another
        PdeFirebase.ref('rooms/' + roomCode + '/playerActions/' + pid).set(null);
    };

    // ── DICE ROLL ──
    var handleRollDice = function() {
        if (phase !== 'roll' || rolling) return;
        setRolling(true);

        var d1 = Math.floor(Math.random() * 6) + 1;
        var d2 = Math.floor(Math.random() * 6) + 1;
        var total = d1 + d2;

        PdeGameSounds.play('pop');

        setTimeout(function() {
            setRolling(false);

            // Move player
            var currentPos = positions[currentPid] || 0;
            var newPos = (currentPos + total) % BOARD_SIZE;
            var passedStart = (currentPos + total) >= BOARD_SIZE && currentPos !== 0;

            var updates = {};
            updates['gameState/diceValue'] = [d1, d2];
            updates['gameState/positions/' + currentPid] = newPos;

            // Collect 200€ when passing start
            if (passedStart) {
                var fundBonus = Math.min(gs.publicFund || 0, 50);
                var startBonus = 200 + fundBonus;
                updates['gameState/money/' + currentPid] = (money[currentPid] || 0) + startBonus;
                updates['gameState/publicFund'] = Math.max(0, (gs.publicFund || 0) - fundBonus);
                addLog('🏁 ' + currentPlayerName + ' passa per SORTIDA i cobra ' + startBonus + '€');
            }

            PdeFirebase.ref('rooms/' + roomCode).update(updates).then(function() {
                // Process the square landed on
                setTimeout(function() {
                    processSquare(newPos, passedStart);
                }, 500);
            });

            addLog('🎲 ' + currentPlayerName + ' tira ' + d1 + '+' + d2 + '=' + total);
        }, 1200);
    };

    // ── PROCESS SQUARE ──
    var processSquare = function(squareIndex, passedStart) {
        var sq = BOARD[squareIndex];
        var updates = {};

        switch (sq.type) {
            case 'property': {
                var prop = properties[squareIndex];
                if (!prop || !prop.owner) {
                    // Unowned → start auction
                    updates['gameState/phase'] = 'auction';
                    updates['gameState/currentAuction'] = {
                        propertyIndex: squareIndex,
                        bids: {},
                        highBid: 0,
                        highBidder: null,
                        startedAt: Date.now(),
                        timeLeft: 30
                    };
                    addLog('🔨 Subhasta de ' + sq.name + '!');
                    PdeGameSounds.play('ding');
                } else if (prop.owner === currentPid) {
                    // Own property → action phase (can upgrade R+D)
                    updates['gameState/phase'] = 'action';
                    addLog('🏠 ' + currentPlayerName + ' visita la seua propietat ' + sq.shortName);
                } else {
                    // Owned by other → pay rent
                    var rent = calculateRent(squareIndex, properties, cycle, sectorModifiers);
                    var payerMoney = (money[currentPid] || 0) - rent;
                    var ownerMoney = (money[prop.owner] || 0) + rent;
                    updates['gameState/money/' + currentPid] = Math.max(0, payerMoney);
                    updates['gameState/money/' + prop.owner] = ownerMoney;
                    updates['gameState/phase'] = 'action';

                    var ownerName = (players && players[prop.owner]) ? players[prop.owner].name : '?';
                    addLog('💸 ' + currentPlayerName + ' paga ' + rent + '€ de lloguer a ' + ownerName);
                    PdeGameSounds.play('coin');
                }
                break;
            }

            case 'tax': {
                if (gs.taxHoliday) {
                    updates['gameState/phase'] = 'action';
                    updates['gameState/taxHoliday'] = null;
                    addLog('🎉 Vacances fiscals! ' + currentPlayerName + ' no paga impostos');
                } else {
                    var nw = calculateNetWorth(currentPid, money, properties, cycle, sectorModifiers);
                    var tax = calculateTax(nw);
                    var afterTax = Math.max(0, (money[currentPid] || 0) - tax);
                    updates['gameState/money/' + currentPid] = afterTax;
                    updates['gameState/publicFund'] = (gs.publicFund || 0) + tax;
                    updates['gameState/phase'] = 'action';
                    addLog('💰 ' + currentPlayerName + ' paga ' + tax + '€ d\'impostos (patrimoni: ' + nw + '€)');
                    PdeGameSounds.play('buzz');
                }
                break;
            }

            case 'news': {
                var cardIdx = Math.floor(Math.random() * NEWS_CARDS.length);
                updates['gameState/currentNews'] = cardIdx;
                updates['gameState/phase'] = 'news';
                addLog('📰 ' + currentPlayerName + ' rep una notícia econòmica!');
                PdeGameSounds.play('pop');
                break;
            }

            case 'central': {
                var rates = [2, 5, 8, 12];
                var newRate = rates[Math.floor(Math.random() * rates.length)];
                updates['gameState/interestRate'] = newRate;
                updates['gameState/phase'] = 'action';
                addLog('🏛️ El Banc Central fixa els tipus al ' + newRate + '%');
                PdeGameSounds.play('ding');
                break;
            }

            case 'rd': {
                // Can upgrade any owned property at 50% discount
                updates['gameState/rdDiscount'] = 0.5;
                updates['gameState/phase'] = 'action';
                addLog('🔬 ' + currentPlayerName + ' pot millorar R+D amb 50% de descompte!');
                PdeGameSounds.play('ding');
                break;
            }

            case 'freemarket': {
                updates['gameState/phase'] = 'action';
                addLog('🆓 ' + currentPlayerName + ' descansa al Mercat Lliure');
                break;
            }

            case 'start': {
                updates['gameState/phase'] = 'action';
                addLog('🏁 ' + currentPlayerName + ' està a SORTIDA');
                break;
            }

            default: {
                updates['gameState/phase'] = 'action';
            }
        }

        PdeFirebase.ref('rooms/' + roomCode).update(updates);
    };

    // ── APPLY NEWS EFFECT ──
    var handleApplyNews = function() {
        var cardIdx = gs.currentNews;
        if (cardIdx === null || cardIdx === undefined) return;
        var card = NEWS_CARDS[cardIdx];
        if (!card) return;
        var effect = card.effect;
        var updates = {};

        switch (effect.type) {
            case 'sector_boost':
            case 'sector_bust': {
                var newMods = Object.assign({}, sectorModifiers);
                var currentMod = newMods[effect.sector] || 1;
                newMods[effect.sector] = Math.round(currentMod * effect.modifier * 100) / 100;
                updates['gameState/sectorModifiers'] = newMods;
                break;
            }
            case 'interest_rate': {
                updates['gameState/interestRate'] = effect.rate;
                break;
            }
            case 'subsidy': {
                // Pay bonus to players with properties in sector
                playerOrder.forEach(function(pid) {
                    var owned = getPlayerProperties(pid, properties);
                    var hasSector = owned.some(function(idx) {
                        return BOARD[idx].sector === effect.sector;
                    });
                    if (hasSector) {
                        updates['gameState/money/' + pid] = (money[pid] || 0) + effect.amount;
                    }
                });
                break;
            }
            case 'all_pay': {
                playerOrder.forEach(function(pid) {
                    updates['gameState/money/' + pid] = Math.max(0, (money[pid] || 0) - effect.amount);
                    updates['gameState/publicFund'] = (gs.publicFund || 0) + (effect.amount * playerOrder.length);
                });
                break;
            }
            case 'all_receive': {
                playerOrder.forEach(function(pid) {
                    updates['gameState/money/' + pid] = (money[pid] || 0) + effect.amount;
                });
                break;
            }
            case 'tax_holiday': {
                updates['gameState/taxHoliday'] = true;
                break;
            }
            case 'inflation': {
                // Increase all rents via sector modifiers
                var newMods2 = Object.assign({}, sectorModifiers);
                Object.keys(SECTORS).forEach(function(s) {
                    newMods2[s] = Math.round((newMods2[s] || 1) * effect.modifier * 100) / 100;
                });
                updates['gameState/sectorModifiers'] = newMods2;
                break;
            }
            case 'current_receive': {
                updates['gameState/money/' + currentPid] = (money[currentPid] || 0) + effect.amount;
                break;
            }
            case 'richest_pay': {
                var richest = null;
                var maxNW = -1;
                playerOrder.forEach(function(pid) {
                    var nw = calculateNetWorth(pid, money, properties, cycle, sectorModifiers);
                    if (nw > maxNW) { maxNW = nw; richest = pid; }
                });
                if (richest) {
                    updates['gameState/money/' + richest] = Math.max(0, (money[richest] || 0) - effect.amount);
                    updates['gameState/publicFund'] = (gs.publicFund || 0) + effect.amount;
                }
                break;
            }
            case 'free_rd': {
                updates['gameState/freeRd'] = true;
                break;
            }
        }

        updates['gameState/currentNews'] = null;
        updates['gameState/phase'] = 'action';
        PdeFirebase.ref('rooms/' + roomCode).update(updates);
        PdeGameSounds.play('pop');
    };

    // ── END TURN ──
    var handleEndTurn = function() {
        if (phase !== 'action') return;

        var nextPlayerIdx = (currentPlayerIdx + 1) % playerOrder.length;
        var newRound = round;
        var updates = {};

        // If we've gone around once, increment round
        if (nextPlayerIdx === 0) {
            newRound = round + 1;
            updates['gameState/round'] = newRound;

            // Check cycle change
            var cycleRound = (gs.cycleRound || 5) - 1;
            if (cycleRound <= 0) {
                var newCycle = cycle === 'expansion' ? 'recession' : 'expansion';
                updates['gameState/cycle'] = newCycle;
                updates['gameState/cycleRound'] = 5;
                addLog(newCycle === 'expansion' ? '📈 EXPANSIÓ ECONÒMICA!' : '📉 RECESSIÓ ECONÒMICA!');
                PdeGameSounds.play('ding');
            } else {
                updates['gameState/cycleRound'] = cycleRound;
            }

            // Check game end
            if (newRound > maxRounds) {
                updates['gameState/phase'] = 'finished';
                updates['gameState/finished'] = true;
                PdeFirebase.ref('rooms/' + roomCode).update(updates);
                addLog('🏁 FINAL DEL JOC!');
                return;
            }
        }

        updates['gameState/currentPlayer'] = nextPlayerIdx;
        updates['gameState/phase'] = 'roll';
        updates['gameState/diceValue'] = null;
        updates['gameState/rdDiscount'] = 0;
        updates['gameState/freeRd'] = null;

        // Clear player actions
        updates['playerActions'] = null;

        PdeFirebase.ref('rooms/' + roomCode).update(updates);

        var nextPid = playerOrder[nextPlayerIdx];
        var nextName = (players && players[nextPid]) ? players[nextPid].name : '?';
        addLog('➡️ Torn de ' + nextName);
    };

    // ── FINISHED ──
    if (gs.finished) {
        return (
            <EndGameScreen
                playerOrder={playerOrder}
                players={players}
                money={money}
                properties={properties}
                cycle={cycle}
                sectorModifiers={sectorModifiers}
            />
        );
    }

    return (
        <div className="min-h-screen bg-gradient-to-br from-emerald-900 via-gray-900 to-teal-950 p-2 md:p-4">
            <div className="max-w-7xl mx-auto">
                {/* Header */}
                <div className="text-center text-white mb-2">
                    <h1 className="text-xl md:text-3xl font-black">🏛️ OLIGOPOLY</h1>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-4 gap-3">
                    {/* Board — takes 3 columns on large screens */}
                    <div className="lg:col-span-3">
                        <OligopolyBoard
                            gameState={gs}
                            playerOrder={playerOrder}
                            players={players}
                        />
                    </div>

                    {/* Right panel */}
                    <div className="space-y-3">
                        {/* Current player & actions */}
                        <div className="bg-white/10 backdrop-blur rounded-2xl p-4">
                            <div className="flex items-center gap-2 mb-3">
                                <div className="w-5 h-5 rounded-full" style={{ backgroundColor: PLAYER_COLORS[currentPlayerIdx].hex }}></div>
                                <h3 className="text-white font-black">{currentPlayerName}</h3>
                                <span className="text-emerald-300 font-bold ml-auto">{money[currentPid] || 0}€</span>
                            </div>

                            {/* Phase-specific controls */}
                            {phase === 'roll' && (
                                <div className="space-y-3">
                                    {/* Dice animation display */}
                                    {(rolling || gs.diceValue) && (
                                        <DiceRollAnimation
                                            dice={gs.diceValue}
                                            rolling={rolling}
                                        />
                                    )}

                                    <button onClick={handleRollDice} disabled={rolling}
                                        className={'w-full py-4 rounded-2xl text-white font-black text-xl shadow-lg btn-eco ' +
                                            (rolling ? 'bg-gray-500 cursor-wait' : 'bg-gradient-to-r from-emerald-500 to-teal-600 hover:brightness-110')}>
                                        {rolling ? '🎲 ' + t('rolling') : '🎲 ' + t('roll_dice')}
                                    </button>

                                    {/* Show current square info */}
                                    {!rolling && positions[currentPid] !== undefined && (
                                        <div className="bg-white/5 rounded-xl p-2 text-center">
                                            <span className="text-white/50 text-xs">
                                                📍 {BOARD[positions[currentPid]].emoji || ''} {BOARD[positions[currentPid]].name}
                                            </span>
                                        </div>
                                    )}
                                </div>
                            )}

                            {phase === 'action' && (
                                <div className="space-y-2">
                                    {gs.rdDiscount > 0 && (
                                        <div className="bg-blue-500/20 rounded-xl px-3 py-2 text-blue-300 text-xs text-center">
                                            🔬 Descompte R+D: {Math.round(gs.rdDiscount * 100)}%
                                        </div>
                                    )}
                                    {gs.freeRd && (
                                        <div className="bg-purple-500/20 rounded-xl px-3 py-2 text-purple-300 text-xs text-center">
                                            🔬 Propera millora R+D gratis!
                                        </div>
                                    )}
                                    <button onClick={handleEndTurn}
                                        className="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-black text-lg shadow-lg btn-eco hover:brightness-110">
                                        ➡️ {t('end_turn')}
                                    </button>
                                </div>
                            )}

                            {phase === 'auction' && (
                                <div className="text-center">
                                    <div className="text-yellow-300 font-bold animate-pulse text-sm">
                                        🔨 {t('auction_ongoing')}
                                    </div>
                                    <button onClick={resolveAuction}
                                        className="mt-2 w-full py-2 rounded-xl bg-red-500 text-white font-bold text-sm btn-eco">
                                        ⏩ {t('close_auction')}
                                    </button>
                                </div>
                            )}

                            {phase === 'news' && (
                                <div className="text-yellow-300 font-bold animate-pulse text-sm text-center">
                                    📰 Llegint notícia...
                                </div>
                            )}
                        </div>

                        {/* Scoreboard */}
                        <PlayerScoreboard
                            playerOrder={playerOrder}
                            players={players}
                            money={money}
                            properties={properties}
                            cycle={cycle}
                            sectorModifiers={sectorModifiers}
                            currentPlayer={currentPlayerIdx}
                        />

                        {/* Economic indicators */}
                        <EconomicIndicatorsPanel gameState={gs} />

                        {/* Economic fact banner */}
                        <EconomicFactBanner visible={showFact && phase === 'roll'} />

                        {/* Action log */}
                        <div className="bg-white/5 rounded-2xl p-3 max-h-48 overflow-y-auto">
                            <h4 className="text-white/40 text-xs font-bold mb-1">📋 Registre</h4>
                            {actionLog.map(function(msg, i) {
                                return (
                                    <div key={i} className="text-white/60 text-xs py-0.5 border-b border-white/5">
                                        {msg}
                                    </div>
                                );
                            })}
                            {actionLog.length === 0 && (
                                <div className="text-white/20 text-xs">Cap activitat encara</div>
                            )}
                        </div>
                    </div>
                </div>
            </div>

            {/* Auction overlay */}
            {phase === 'auction' && gs.currentAuction && (
                <AuctionOverlay
                    auction={gs.currentAuction}
                    properties={properties}
                    playerOrder={playerOrder}
                    players={players}
                    cycle={cycle}
                    sectorModifiers={sectorModifiers}
                />
            )}

            {/* News overlay */}
            {phase === 'news' && gs.currentNews !== null && gs.currentNews !== undefined && (
                <NewsOverlay
                    cardIndex={gs.currentNews}
                    onDismiss={handleApplyNews}
                />
            )}

            {/* Cycle change overlay */}
            <CycleChangeOverlay
                cycle={gs.cycle}
                show={showCycleChange}
                onDismiss={function() { setShowCycleChange(false); }}
            />
        </div>
    );
}


// ═══════════════════════════════════════════════════════════════
// PLAYER VIEW — Mobile interface for each player
// ═══════════════════════════════════════════════════════════════
function OligopolyPlayer({ roomCode, playerId, players, gameState, idioma }) {
    var t = createTranslator(ECONOPOLY_TRANSLATIONS, idioma);
    const [bidAmount, setBidAmount] = useState('');
    const [lastBid, setLastBid] = useState(0);

    var gs = gameState || {};
    var playerOrder = gs.playerOrder || [];
    var currentPlayerIdx = gs.currentPlayer || 0;
    var currentPid = playerOrder[currentPlayerIdx];
    var isMyTurn = currentPid === playerId;
    var phase = gs.phase || 'roll';
    var money = gs.money || {};
    var properties = gs.properties || {};
    var positions = gs.positions || {};
    var cycle = gs.cycle || 'expansion';
    var sectorModifiers = gs.sectorModifiers || {};
    var round = gs.round || 1;
    var maxRounds = gs.maxRounds || 20;
    var myMoney = money[playerId] || 0;
    var myPos = positions[playerId] || 0;
    var myProperties = getPlayerProperties(playerId, properties);
    var myColorIdx = getPlayerColorIndex(playerId, playerOrder);
    var myColor = PLAYER_COLORS[myColorIdx];
    var myNetWorth = calculateNetWorth(playerId, money, properties, cycle, sectorModifiers);
    var myName = (players && players[playerId]) ? players[playerId].name : '?';
    var currentPlayerName = (players && currentPid && players[currentPid]) ? players[currentPid].name : '?';

    // Submit a bid
    var handleBid = function() {
        var amount = parseInt(bidAmount);
        if (!amount || amount <= 0) return;

        var currentHigh = (gs.currentAuction && gs.currentAuction.highBid) ? gs.currentAuction.highBid : 0;
        if (amount <= currentHigh) return;
        if (amount > myMoney) return;

        PdeFirebase.ref('rooms/' + roomCode + '/playerActions/' + playerId).set({
            type: 'bid',
            amount: amount,
            timestamp: Date.now()
        });

        setLastBid(amount);
        setBidAmount('');
        PdeGameSounds.play('coin');
    };

    // Request R+D upgrade
    var handleRequestRd = function(propIdx) {
        PdeFirebase.ref('rooms/' + roomCode + '/playerActions/' + playerId).set({
            type: 'rd_upgrade',
            propertyIndex: propIdx,
            timestamp: Date.now()
        });
        PdeGameSounds.play('pop');
    };

    // ── FINISHED ──
    if (gs.finished) {
        var rankings = (playerOrder || []).map(function(pid, idx) {
            var p = players ? players[pid] : null;
            if (!p) return null;
            var nw = calculateNetWorth(pid, money, properties, cycle, sectorModifiers);
            return { id: pid, name: p.name, netWorth: nw, colorIdx: idx };
        }).filter(Boolean).sort(function(a, b) { return b.netWorth - a.netWorth; });

        var myRank = rankings.findIndex(function(r) { return r.id === playerId; }) + 1;
        var medals = ['🥇', '🥈', '🥉'];

        return (
            <div className="min-h-screen bg-gradient-to-br from-emerald-900 via-gray-900 to-teal-950 p-4 flex items-center justify-center">
                <div className="max-w-sm w-full text-center space-y-4">
                    <div className="text-6xl">{medals[myRank - 1] || '🏁'}</div>
                    <h1 className="text-3xl font-black text-white">{t('game_over')}</h1>
                    <div className="bg-white/10 rounded-2xl p-4">
                        <div className="text-white/60 text-sm">#{myRank}</div>
                        <div className="text-4xl font-black text-emerald-300">#{myRank}</div>
                        <div className="text-white font-bold mt-1">{t('patrimony')}: {myNetWorth.toLocaleString()}€</div>
                    </div>
                    <div className="space-y-1">
                        {rankings.map(function(r, i) {
                            return (
                                <div key={r.id} className={'flex items-center gap-2 px-3 py-1.5 rounded-xl ' +
                                    (r.id === playerId ? 'bg-emerald-500/30' : 'bg-white/5')}>
                                    <span className="text-sm">{medals[i] || (i + 1)}</span>
                                    <div className="w-3 h-3 rounded-full" style={{ backgroundColor: PLAYER_COLORS[r.colorIdx].hex }}></div>
                                    <span className="text-white text-sm font-medium flex-1 text-left">{r.name}</span>
                                    <span className="text-emerald-300 text-sm font-bold">{r.netWorth}€</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-gradient-to-br from-emerald-900 via-gray-900 to-teal-950 p-3">
            <div className="max-w-md mx-auto space-y-3">
                {/* Header */}
                <div className="flex items-center gap-3 bg-white/10 rounded-2xl p-3">
                    <div className="w-10 h-10 rounded-full flex items-center justify-center text-lg"
                         style={{ backgroundColor: myColor.hex }}>
                        {myColor.emoji}
                    </div>
                    <div className="flex-1">
                        <div className="text-white font-bold">{myName}</div>
                        <div className="text-white/50 text-xs">Casella: {myPos} — {BOARD[myPos].shortName || BOARD[myPos].name}</div>
                    </div>
                    <div className="text-right">
                        <div className="text-emerald-300 font-black text-xl">{myMoney}€</div>
                        <div className="text-white/40 text-xs">Val: {myNetWorth}€</div>
                    </div>
                </div>

                {/* Turn indicator */}
                <div className={'rounded-2xl px-4 py-3 text-center font-bold ' +
                    (isMyTurn ? 'bg-emerald-500/30 text-emerald-300' : 'bg-white/5 text-white/40')}>
                    {isMyTurn ? '🎯 ES EL TEU TORN!' : '⏳ Torn de ' + currentPlayerName}
                </div>

                {/* Cycle indicator */}
                <div className={'rounded-xl px-3 py-2 text-center text-sm font-bold ' +
                    (cycle === 'expansion' ? 'bg-green-500/20 text-green-300' : 'bg-red-500/20 text-red-300')}>
                    {cycle === 'expansion' ? '📈 Expansió econòmica' : '📉 Recessió econòmica'}
                    <span className="text-white/30 ml-2">Interes: {gs.interestRate || 5}%</span>
                </div>

                {/* AUCTION BIDDING */}
                {phase === 'auction' && gs.currentAuction && (
                    <div className="bg-yellow-500/20 rounded-2xl p-4 space-y-3" style={{ animation: 'slide-up 0.3s ease-out' }}>
                        <div className="text-center">
                            <div className="text-sm text-yellow-300 font-bold">🔨 SUBHASTA</div>
                            <div className="text-2xl mt-1">{SECTORS[BOARD[gs.currentAuction.propertyIndex].sector].emoji}</div>
                            <div className="text-white font-black">{BOARD[gs.currentAuction.propertyIndex].name}</div>
                            <div className="text-white/60 text-sm">Preu base: {BOARD[gs.currentAuction.propertyIndex].price}€</div>
                        </div>

                        <div className="bg-white/10 rounded-xl p-3 text-center">
                            <div className="text-white/50 text-xs">Oferta actual</div>
                            <div className="text-3xl font-black text-yellow-300">{gs.currentAuction.highBid || 0}€</div>
                            {gs.currentAuction.highBidder === playerId && (
                                <div className="text-green-300 text-xs font-bold mt-1">✅ Tu lideres!</div>
                            )}
                        </div>

                        <div className="flex gap-2">
                            <input type="number" value={bidAmount}

                                   className="flex-1 px-4 py-3 rounded-xl bg-white/10 text-white font-bold text-lg text-center border border-white/20 focus:outline-none focus:border-yellow-400" />
                            <button onClick={handleBid}

                                    className="px-6 py-3 rounded-xl bg-yellow-500 text-white font-black text-lg btn-eco disabled:opacity-40">

                            </button>
                        </div>

                                return (
                                    <button key={increment}
                                            onClick={function() { setBidAmount(String(quickBid)); }}

                                        +{increment}€ = {quickBid}€
                                    </button>
                                );
                            })}
                        </div>

                        <div className="text-center text-white/30 text-xs">
                            El teu saldo: {myMoney}€
                        </div>
                    </div>
                )}

                {/* R+D UPGRADES (during own turn action phase) */}
                {isMyTurn && phase === 'action' && myProperties.length > 0 && (
                    <div className="bg-blue-500/20 rounded-2xl p-4">
                        <h4 className="text-white font-bold text-sm mb-2">🔬 Millorar R+D</h4>
                        <div className="space-y-2">

                                var sq = BOARD[propIdx];
                                var prop = properties[propIdx];
                                var rdLevel = prop ? (prop.rdLevel || 0) : 0;
                                var discount = gs.freeRd ? 1 : (gs.rdDiscount || 0);
                                var cost = getRdUpgradeCost(propIdx, rdLevel, discount);
                                var canUpgrade = rdLevel < 3 && cost <= myMoney;
                                var sector = SECTORS[sq.sector];

                                return (
                                    <div key={propIdx} className="flex items-center gap-2 bg-white/5 rounded-xl px-3 py-2">
                                        <span className="text-sm">{sector.emoji}</span>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-white text-xs font-bold truncate">{sq.shortName}</div>
                                            <div className="flex gap-0.5 mt-0.5">
                                                {[1, 2, 3].map(function(lvl) {
                                                    return (
                                                        <div key={lvl}
                                                             className={'w-2 h-2 rounded-full ' +
                                                                 (lvl <= rdLevel ? 'bg-blue-400' : 'bg-white/20')}>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                        {rdLevel < 3 ? (
                                            <button onClick={function() { handleRequestRd(propIdx); }}

                                                    className={'px-3 py-1.5 rounded-lg text-xs font-bold btn-eco ' +
                                                        (canUpgrade
                                                            ? 'bg-blue-500 text-white'
                                                            : 'bg-gray-600 text-gray-500 cursor-not-allowed')}>

                                            </button>
                                        ) : (
                                            <span className="text-xs text-blue-300 font-bold">MAX</span>

                                    </div>

                <div className="bg-white/10 rounded-2xl p-4">
                    <h4 className="text-white font-bold text-sm mb-2">🏢 Les meues propietats ({myProperties.length})</h4>

                    {myProperties.length > 0 && (
                        <div className="flex flex-wrap gap-1 mb-2">
                            {Object.entries(SECTORS).map(function(entry) {
                                var sectorKey = entry[0];
                                var sector = entry[1];
                                var sectorProps = SECTOR_PROPERTIES[sectorKey] || [];

                                var sq = BOARD[propIdx];
                                var prop = properties[propIdx];
                                var sector = SECTORS[sq.sector];
                                var rdLevel = prop ? (prop.rdLevel || 0) : 0;
                                var rent = calculateRent(propIdx, properties, cycle, sectorModifiers);

// SELL PROPERTY PANEL — Player can sell properties back to bank
// ═══════════════════════════════════════════════════════════════
function SellPropertyPanel({ playerId, properties, money, cycle, sectorModifiers, roomCode, myProperties }) {
    const [showSell, setShowSell] = useState(false);
    const [confirmSell, setConfirmSell] = useState(null);

    var handleSell = function(propIdx) {
        var sq = BOARD[propIdx];
        var salePrice = Math.round(calculatePropertyValue(propIdx, properties, cycle, sectorModifiers) * 0.5);
        var updates = {};
        updates['gameState/money/' + playerId] = (money[playerId] || 0) + salePrice;
        updates['gameState/properties/' + propIdx] = { owner: null, rdLevel: 0 };
        PdeFirebase.ref('rooms/' + roomCode).update(updates);
        setConfirmSell(null);
        setShowSell(false);
        PdeGameSounds.play('coin');
    };

    return (
        <div className="bg-red-500/10 rounded-2xl p-3">
            <button onClick={function() { setShowSell(!showSell); }}
                className="w-full text-center text-red-300 text-xs font-bold">
                {showSell ? '✕ Tancar' : '🏪 Vendre propietat al banc (50% del valor)'}
            </button>

            {showSell && (
                <div className="mt-2 space-y-1.5">
                    <div className="text-white/40 text-[10px] text-center mb-2">
                        El banc compra propietats al 50% del seu valor actual.
                        Util si necessites liquiditat urgent!
                    </div>
                    {myProperties.map(function(propIdx) {
                        var sq = BOARD[propIdx];
                        var sector = SECTORS[sq.sector];
                        var salePrice = Math.round(calculatePropertyValue(propIdx, properties, cycle, sectorModifiers) * 0.5);

                        if (confirmSell === propIdx) {
                            return (
                                <div key={propIdx} className="bg-red-500/20 rounded-xl p-2 text-center">
                                    <div className="text-white text-xs font-bold mb-1">
                                        Segur que vols vendre {sq.shortName} per {salePrice}€?
                                    </div>
                                    <div className="flex gap-2 justify-center">
                                        <button onClick={function() { handleSell(propIdx); }}
                                            className="px-4 py-1 rounded-lg bg-red-500 text-white text-xs font-bold btn-eco">
                                            Si, vendre!
                                        </button>
                                        <button onClick={function() { setConfirmSell(null); }}
                                            className="px-4 py-1 rounded-lg bg-white/10 text-white text-xs btn-eco">
                                            Cancel·lar
                                        </button>
                                    </div>
                                </div>
                            );
                        }

                        return (
                            <div key={propIdx} className="flex items-center gap-2 bg-white/5 rounded-xl px-2 py-1.5">
                                <span className="text-xs">{sector.emoji}</span>
                                <span className="text-white text-xs font-medium flex-1 truncate">{sq.shortName}</span>
                                <button onClick={function() { setConfirmSell(propIdx); }}
                                    className="px-3 py-1 rounded-lg bg-red-500/30 text-red-300 text-xs font-bold btn-eco">
                                    Vendre {salePrice}€
                                </button>
                            </div>
                        );
                    })}
                </div>
            )}
        </div>
    );
}

// STRATEGY TIP — Context-aware strategy suggestion for player
// ═══════════════════════════════════════════════════════════════
function StrategyTip({ myProperties, myMoney, cycle, properties, playerId, round, maxRounds }) {
    var tip = '';
    var emoji = '💡';

    // Generate context-aware tip
    var totalProps = myProperties.length;
    var roundsLeft = maxRounds - round;

    // Check sector distribution
    var sectors = {};
    myProperties.forEach(function(idx) {
        var s = BOARD[idx].sector;
        sectors[s] = (sectors[s] || 0) + 1;
    });
    var sectorCount = Object.keys(sectors).length;
    var hasMonopoly = Object.keys(sectors).some(function(s) {
        return hasSectorMonopoly(playerId, s, properties);
    });

    // Check R+D levels
    var totalRd = 0;
    var maxableRd = 0;
    myProperties.forEach(function(idx) {
        var prop = properties[idx];
        totalRd += prop ? (prop.rdLevel || 0) : 0;
        if (prop && (prop.rdLevel || 0) < 3) maxableRd++;
    });

    if (totalProps === 0) {
        tip = 'Encara no tens propietats. Estalvia per la propera subhasta i ofereix amb estratègia!';
        emoji = '🎯';
    } else if (myMoney < 50 && totalProps > 0) {
        tip = 'Alerta! Tens poca liquiditat. Considera vendre alguna propietat per evitar la bancarrota si caus en un lloguer alt.';
        emoji = '⚠️';
    } else if (!hasMonopoly && sectorCount > 1 && totalProps >= 2) {
        tip = 'Intenta completar un sector per aconseguir el bonus de monopoli (lloguers x2)! Puja fort en subhastes de sectors on ja tens propietats.';
        emoji = '🏗️';
    } else if (hasMonopoly && maxableRd > 0 && myMoney > 100) {
        tip = 'Tens un monopoli! Inverteix en R+D per maximitzar els lloguers. Amb R+D 3 + monopoli, els lloguers es multipliquen x6!';
        emoji = '🔬';
    } else if (cycle === 'recession' && myMoney > 200) {
        tip = 'Estem en recessió: bon moment per comprar propietats barates! Els valors són baixos però pujaran quan arribi l\'expansio.';
        emoji = '📉';
    } else if (cycle === 'expansion' && roundsLeft < 5) {
        tip = 'Últimes rondes en expansió! Maximitza el rendiment de les teues propietats amb R+D.';
        emoji = '📈';
    } else if (roundsLeft <= 3) {
        tip = 'Últimes rondes! El patrimoni net final determina el guanyador. Considera si val la pena invertir més o conservar efectiu.';
        emoji = '🏁';
    } else if (totalRd === 0 && totalProps >= 2) {
        tip = 'No has invertit en R+D! La innovació multiplica els teus lloguers. Inverteix en la propietat que més visiten.';
        emoji = '🔬';
    } else {
        tip = 'Bona posició! Equilibra compres noves amb millores R+D i manten prou efectiu per a impostos inesperats.';
        emoji = '✅';
    }

    return (
        <div className="bg-indigo-500/10 rounded-2xl p-3">
            <div className="flex gap-2">
                <span className="text-lg flex-shrink-0">{emoji}</span>
                <div>
                    <div className="text-indigo-300 font-bold text-[10px] mb-0.5">CONSELL ESTRATÈGIC</div>
                    <p className="text-white/50 text-xs leading-relaxed">{tip}</p>
                </div>
            </div>
        </div>
    );
}

// MAIN APP — Entry point with rules → lobby → game phases
// ═══════════════════════════════════════════════════════════════
function OligopolyApp() {
    var urlRoom = PdeRoomManager.getRoomFromURL();
    const [phase, setPhase] = useState(urlRoom ? 'lobby' : 'rules');
    const [gameInfo, setGameInfo] = useState(null);
    const [meta, setMeta] = useState({});
    const [players, setPlayers] = useState({});
    const [gameState, setGameState] = useState({});
    var [idioma, setIdioma] = useState(PdeLanguageStore.get());
    var t = createTranslator(ECONOPOLY_TRANSLATIONS, idioma);

    useEffect(function() { if (PdeFirebase.isConfigured()) PdeFirebase.init(); }, []);

    // Subscribe to room data
    useEffect(function() {
        if (!gameInfo) return;
        var unsub1 = PdeRoomManager.onPlayersChange(gameInfo.roomCode, setPlayers);
        var unsub2 = PdeRoomManager.onGameStateChange(gameInfo.roomCode, setGameState);
        var unsub3 = PdeRoomManager.onMetaChange(gameInfo.roomCode, setMeta);
        return function() { unsub1(); unsub2(); unsub3(); };
    }, [gameInfo && gameInfo.roomCode]);

    // Listen for game start (player side)
    useEffect(function() {
        if (meta.status === 'playing' && phase === 'lobby') {
            setPhase('playing');
        }
    }, [meta.status]);

    if (!PdeFirebase.isConfigured()) {
        return <PdeFirebaseError />;
    }

    var handleGameStart = function(info) {
        setGameInfo(info);
        setPhase('playing');

        if (info.isHost) {
            // Build player order from connected players (excluding host duplication)
            var connectedPlayers = Object.keys(info.players).filter(function(id) {
                return info.players[id].connected !== false;
            });

            // Shuffle player order
            var shuffled = connectedPlayers.sort(function() { return Math.random() - 0.5; });

            // Initialize game state
            var initialPositions = {};
            var initialMoney = {};
            var initialProperties = {};

            shuffled.forEach(function(pid) {
                initialPositions[pid] = 0;
                initialMoney[pid] = 1500;
            });

            // Initialize all property squares
            BOARD.forEach(function(sq, idx) {
                if (sq.type === 'property') {
                    initialProperties[idx] = { owner: null, rdLevel: 0 };
                }
            });

            PdeRoomManager.setGameState(info.roomCode, {
                round: 1,
                maxRounds: 20,
                phase: 'roll',
                currentPlayer: 0,
                playerOrder: shuffled,
                positions: initialPositions,
                money: initialMoney,
                properties: initialProperties,
                cycle: 'expansion',
                cycleRound: 5,
                interestRate: 5,
                publicFund: 0,
                currentAuction: null,
                currentNews: null,
                diceValue: null,
                sectorModifiers: {},
                taxHoliday: false,
                freeRd: false,
                rdDiscount: 0,
                finished: false
            });
        }
    };

    // ── Rules ──
    if (phase === 'rules') {
        return (
            <div>
                <div style={{position:'fixed',top:12,right:12,zIndex:9999,display:'flex',gap:4}}>
                    {['val','es','en'].map(function(l) {
                        return <button key={l} onClick={function(){setIdioma(l);PdeLanguageStore.set(l);}}
                            style={{padding:'4px 10px',borderRadius:8,fontSize:13,fontWeight:idioma===l?800:500,
                                background:idioma===l?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.2)',
                                color:idioma===l?'#1a1a2e':'white',border:'none',cursor:'pointer'}}>
                            {l.toUpperCase()}
                        </button>;
                    })}
                </div>
                <RulesScreen onContinue={function() { setPhase('lobby'); }} />
            </div>
        );
    }

    // ── Lobby ──
    if (phase === 'lobby') {
        return (
            <PdeGameLobby
                gameType="econopoly"
                gameName="Oligopoly"
                gameEmoji="🏛️"
                gameGradient="from-emerald-600 to-teal-700"
                minPlayers={2}
                maxPlayers={6}
                onGameStart={handleGameStart}
                teamMode={false}
            />
        );
    }

    // ── Game ──
    if (phase === 'playing' && gameInfo) {
        if (gameInfo.isHost) {
            return <OligopolyHost roomCode={gameInfo.roomCode} playerId={gameInfo.playerId}
                players={players} gameState={gameState} idioma={idioma} />;
        } else {
            return <OligopolyPlayer roomCode={gameInfo.roomCode} playerId={gameInfo.playerId}
                players={players} gameState={gameState} idioma={idioma} />;
        }
    }

    return null;
}

ReactDOM.render(<OligopolyApp />, document.getElementById('root'));
    </script>
</body>
</html>
