<body class="bg-gradient-to-br from-teal-50 via-white to-cyan-50 min-h-screen">

    <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area, ReferenceLine, Legend, BarChart, Bar, ComposedChart, Scatter, PieChart, Pie, Cell, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar } = Recharts;

    function BlocHApp() {
        const [section, setSection] = useState('inicio');
        const [idioma, setIdioma] = useState(PdeLanguageStore.get());
        usePdeDeepLink(section, setSection);

        const pageTranslations = {
            'nav.oposicions-bloc-h': { val: 'Bloc H: Comptabilitat i Didàctica', es: 'Bloque H: Contabilidad y Didáctica', en: 'Block H: Accounting & Teaching' },
            'footer.appname': { val: "Bloc H — Oposicions d'Economia", es: "Bloque H — Oposiciones de Economía", en: 'Block H — Economics Exams' },
            'inicio.title': { val: 'Bloc H: Comptabilitat i Didàctica', es: 'Bloque H: Contabilidad y Didáctica', en: 'Block H: Accounting & Teaching' },
            'inicio.subtitle': { val: "Temes 66-71 de les oposicions d'Economia. Comptabilitat, patrimoni, anàlisi d'estats financers, balanç social, didàctica de l'Economia i projecte empresarial com a metodologia.", es: 'Temas 66-71. Contabilidad, patrimonio, análisis de estados financieros, balance social, didáctica y proyecto empresarial.', en: 'Topics 66-71. Accounting, net worth, financial statement analysis, social balance, teaching, business project.' },
            'inicio.backOpo': { val: "← Tornar a Oposicions", es: '← Volver a Oposiciones', en: '← Back to Exams' },
            'inicio.disponible': { val: "Disponible", es: 'Disponible', en: 'Available' },
            'sec.inicio': { val: 'Inici', es: 'Inicio', en: 'Home' },
            'tab.complet': { val: 'Tema complet', es: 'Tema completo', en: 'Full topic' },
            'tab.resum': { val: 'Resum / Esquema', es: 'Resumen / Esquema', en: 'Summary / Outline' },
            'tema66.title': { val: "Anàlisi comptable. Estats comptables. PGC i comptes anuals.", es: 'Análisis contable. Estados contables. PGC y cuentas anuales.', en: 'Accounting analysis. Financial statements. Spanish GAAP (PGC) and annual accounts.' },
            'tema67.title': { val: "El patrimoni: components i valoració. Valoració econòmica d'actius i empreses.", es: 'El patrimonio: componentes y valoración. Valoración económica de activos y empresas.', en: 'Net worth: components and valuation. Economic valuation of assets and firms.' },
            'tema68.title': { val: "Anàlisi d'estats comptables: estructura, anàlisi econòmica i financera. Ràtios.", es: 'Análisis de estados contables: estructura, análisis económico y financiero. Ratios.', en: 'Financial statement analysis: structure, economic and financial analysis. Ratios.' },
            'tema69.title': { val: "Balanç Social de l'Empresa. Auditoria social. Instrument de gestió.", es: 'Balance Social. Auditoría social. Instrumento de gestión.', en: 'Social Balance Sheet. Social audit. Management tool.' },
            'tema70.title': { val: "Concepcions del curs d'Economia de Batxillerat. Metodologies: aproximació raonada, exposició i indagació.", es: 'Concepciones del curso de Economía de Bachillerato. Metodologías.', en: 'Approaches to Economics in Upper Secondary. Teaching methodologies.' },
            'tema71.title': { val: "Disseny i desenvolupament d'un projecte empresarial com a metodologia didàctica.", es: 'Diseño y desarrollo de un proyecto empresarial como metodología didáctica.', en: 'Design and development of a business project as teaching methodology.' },
        };

        const t = createTranslator(pageTranslations, idioma);
        const lang = idioma;

        const Card = ({ children, className = "", title, icon }) => (<div className={`bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 hover:shadow-md transition-shadow ${className} animate-fade`}>{title && <div className="flex items-center gap-3 mb-5 pb-4 border-b border-slate-100"><span className="text-2xl">{icon}</span><h3 className="font-bold text-slate-800 text-lg">{title}</h3></div>}{children}</div>);
        const Tabs = ({ tabs, active, onChange }) => (<div className="flex flex-wrap gap-1 p-1.5 bg-slate-100 rounded-xl">{tabs.map(tab => (<button key={tab.id} onClick={() => onChange(tab.id)} className={`flex-1 min-w-fit py-2.5 px-4 rounded-lg text-sm font-semibold transition-all ${active === tab.id ? 'bg-white shadow-sm text-teal-600' : 'text-slate-600 hover:text-slate-800 hover:bg-white/50'}`}>{tab.label}</button>))}</div>);
        const TheoryBlock = ({ title, children, color = "slate" }) => { const colors = { slate: "border-slate-300 bg-slate-50", blue: "border-blue-300 bg-blue-50", teal: "border-teal-300 bg-teal-50", cyan: "border-cyan-300 bg-cyan-50", indigo: "border-indigo-300 bg-indigo-50", violet: "border-violet-300 bg-violet-50", purple: "border-purple-300 bg-purple-50", green: "border-green-300 bg-green-50", emerald: "border-emerald-300 bg-emerald-50", amber: "border-amber-300 bg-amber-50", rose: "border-rose-300 bg-rose-50", pink: "border-pink-300 bg-pink-50", red: "border-red-300 bg-red-50", orange: "border-orange-300 bg-orange-50" }; return (<div className={`border-l-4 ${colors[color] || colors.slate} p-5 rounded-r-xl my-4`}>{title && <h4 className="font-bold text-slate-800 mb-3 text-base">{title}</h4>}<div className="text-slate-700 text-sm leading-relaxed space-y-2">{children}</div></div>); };
        const FormulaBox = ({ formula, desc }) => (<div className="my-4 p-5 bg-gradient-to-r from-teal-50 to-cyan-50 rounded-xl border border-teal-100"><p className="text-center font-mono text-lg text-teal-800 font-semibold">{formula}</p>{desc && <p className="text-center text-sm text-teal-600 mt-2">{desc}</p>}</div>);
        const SectionTitle = ({ icon, title, subtitle }) => (<div className="mb-8"><div className="flex items-center gap-3 mb-2"><span className="text-3xl">{icon}</span><h1 className="text-3xl font-black text-slate-800">{title}</h1></div>{subtitle && <p className="text-slate-500 ml-12 text-sm">{subtitle}</p>}</div>);
        const BibliografiaBox = ({ items }) => (<div className="my-6 p-6 bg-gradient-to-r from-slate-50 to-gray-50 rounded-xl border border-slate-200"><h4 className="font-bold text-slate-800 mb-4 text-base flex items-center gap-2"><span>📚</span> Bibliografia</h4><ul className="space-y-2">{items.map((item, i) => <li key={i} className="text-sm text-slate-700 leading-relaxed pl-4 border-l-2 border-slate-200">{item}</li>)}</ul></div>);
        const ClauBox = ({ children }) => (<div className="my-4 p-5 bg-gradient-to-r from-amber-50 to-yellow-50 rounded-xl border border-amber-200"><div className="flex items-start gap-3"><span className="text-2xl">🔑</span><div><h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4><div className="text-sm text-amber-800 space-y-1">{children}</div></div></div></div>);

        // TEMA 66 — Anàlisi comptable, PGC, comptes anuals
        const Tema66Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La <strong>comptabilitat</strong> és la llengua franca del món empresarial i el sistema d'informació econòmica més important. Registra, classifica i sintetitza els fets econòmics per oferir una imatge fidel del patrimoni, de la situació financera i dels resultats. La seua regulació a Espanya es fonamenta en el <strong>Codi de Comerç (1885)</strong>, el <strong>Text Refós de la Llei de Societats de Capital</strong> (RDL 1/2010) i el <strong>Pla General de Comptabilitat</strong> aprovat pel RD 1514/2007 i el RD 1515/2007 (PyMES), reformats per normativa posterior.</p></div></Card>
                <Card title="1. Concepte i marc legal" icon="📘">
                    <TheoryBlock title="1.1. Concepte de comptabilitat" color="teal"><p><strong>AECA</strong>: «sistema d'informació que identifica, mesura, registra i comunica informació econòmica sobre una entitat per facilitar la presa de decisions».</p><p>Tipus: <strong>financera</strong> (estats davant tercers), <strong>de gestió</strong> (interna, Tema 43), <strong>fiscal</strong>, <strong>social/sostenibilitat</strong> (Tema 69).</p></TheoryBlock>
                    <TheoryBlock title="1.2. Marc normatiu" color="indigo"><p>• <strong>Codi de Comerç (1885)</strong>: llibres, principis.</p><p>• <strong>LSC (RDL 1/2010)</strong>: comptes anuals.</p><p>• <strong>Llei 22/2015 Auditoria</strong>.</p><p>• <strong>PGC (RD 1514/2007)</strong> i <strong>PGC PyMES (RD 1515/2007)</strong>.</p><p>• <strong>Llei 11/2018</strong> informació no financera.</p><p>• <strong>NIIF/IFRS</strong> (grups cotitzats consolidats).</p><p>• <strong>CSRD (Dir. UE 2022/2464)</strong>: sostenibilitat.</p></TheoryBlock>
                </Card>
                <Card title="2. El Pla General de Comptabilitat" icon="📚">
                    <TheoryBlock title="2.1. Estructura del PGC 2007" color="emerald"><p>5 parts:</p><p>(1) <strong>Marc conceptual</strong>: imatge fidel, principis, criteris de valoració.</p><p>(2) <strong>Normes de registre i valoració</strong>.</p><p>(3) <strong>Comptes anuals</strong>: estructura i models.</p><p>(4) <strong>Quadre de comptes</strong>: pla en 7+2 grups (1 finançament, 2 actiu no corrent, 3 existències, 4 deutes/cobraments, 5 financers, 6 despeses, 7 ingressos, 8-9 analítics).</p><p>(5) <strong>Definicions i relacions comptables</strong>.</p></TheoryBlock>
                    <TheoryBlock title="2.2. Principis comptables" color="violet"><p><strong>6 principis</strong> (PGC art. 4): empresa en funcionament, meritament, uniformitat, prudència, no compensació, importància relativa.</p><p>Prioritat en cas de conflicte: <strong>imatge fidel</strong>.</p></TheoryBlock>
                    <TheoryBlock title="2.3. Criteris de valoració" color="amber"><p>• Cost històric (més habitual).</p><p>• Valor raonable (<em>fair value</em>).</p><p>• Valor net realitzable, valor actual, valor en ús, valor de mercat.</p></TheoryBlock>
                </Card>
                <Card title="3. Els comptes anuals" icon="📑">
                    <TheoryBlock title="3.1. Components obligatoris" color="indigo"><p>Segons LSC i PGC, els comptes anuals comprenen:</p><p>(1) <strong>Balanç</strong>: actiu = patrimoni net + passiu.</p><p>(2) <strong>Compte de Pèrdues i Guanys</strong>: ingressos − despeses.</p><p>(3) <strong>Estat de Canvis en el Patrimoni Net (ECPN)</strong>.</p><p>(4) <strong>Estat de Fluxos d'Efectiu (EFE)</strong>: només PGC normal.</p><p>(5) <strong>Memòria</strong>: informació addicional.</p></TheoryBlock>
                    <TheoryBlock title="3.2. Models (normal vs. abreujat)" color="cyan"><p>Depenen de 2 anys consecutius complint 2 dels 3 criteris (art. 257 LSC).</p><p>• <strong>Normal</strong>: grans.</p><p>• <strong>Abreujat</strong>: actiu &lt; 11,4 M€; xifra negocis &lt; 22,8 M€; ≤ 250 empleats.</p><p>• <strong>PyMES</strong>: actiu &lt; 4 M€; xifra negocis &lt; 8 M€; ≤ 50 empleats.</p></TheoryBlock>
                </Card>
                <Card title="4. Auditoria i informació no financera" icon="🔍">
                    <TheoryBlock title="Marc" color="rose"><p><strong>Llei 22/2015 d'Auditoria</strong>: obligatòria per a empreses que superen llindars (actiu 2,85 M€, xifra negocis 5,7 M€, 50 empleats en 2 anys). Auditors inscrits al ROAC (ICAC).</p><p><strong>Llei 11/2018</strong>: informació no financera obligatòria per a grans empreses (&gt; 500 empleats).</p><p><strong>CSRD (Dir. UE 2022/2464)</strong>: reporting sostenibilitat amb els estàndards ESRS, obligatori gradualment des 2024.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La comptabilitat és el sistema d'informació que fa possible la confiança en el món empresarial. El <strong>PGC 2007</strong> és la norma tècnica central a Espanya, complementada per les <strong>NIIF</strong> per a grups cotitzats i, cada cop més, pels estàndards de <strong>sostenibilitat (CSRD)</strong>. Els <strong>comptes anuals</strong> són la síntesi accessible als stakeholders, subjectes a principis de transparència i rigor.</p></div></Card>
                <BibliografiaBox items={['OMEÑACA, J. (2021): Contabilidad General, Deusto.', 'Codi de Comerç (1885).', 'RDL 1/2010 LSC.', 'Llei 22/2015 d\'Auditoria.', 'RD 1514/2007 PGC; RD 1515/2007 PGC PyMES.', 'Llei 11/2018 informació no financera.', 'Directiva UE 2022/2464 CSRD.', 'AECA: documents i marc conceptual.']} />
            </div>
        );
        const Tema66Resum = () => (<div className="space-y-5 animate-fade"><Card><div className="p-4 bg-teal-50 rounded-xl border border-teal-200 mb-5"><p className="text-center font-bold text-teal-800 text-lg">Tema 66: Comptabilitat i PGC</p></div><div className="space-y-4 text-sm text-slate-700"><div><h4 className="font-bold text-slate-800 mb-1">1. Concepte</h4><ul className="list-disc pl-5 space-y-1"><li>Financera, gestió, fiscal, social (AECA).</li><li>Codi Comerç 1885, LSC 2010, PGC 2007.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">2. PGC</h4><ul className="list-disc pl-5 space-y-1"><li>5 parts: marc conceptual, NRV, comptes anuals, quadre, definicions.</li><li>6 principis (imatge fidel prioritària).</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">3. Comptes anuals</h4><ul className="list-disc pl-5 space-y-1"><li>Balanç, PyG, ECPN, EFE, Memòria.</li><li>Normal / abreujat / PYMES.</li></ul></div><div><h4 className="font-bold text-slate-800 mb-1">4. Auditoria</h4><ul className="list-disc pl-5 space-y-1"><li>Llei 22/2015.</li><li>Llei 11/2018 INF; CSRD 2022/2464.</li></ul></div></div><ClauBox><p>- Cita <strong>PGC 2007</strong>, <strong>NIIF</strong>, <strong>CSRD 2022/2464</strong>.</p><p>- 6 principis comptables + prioritat imatge fidel.</p></ClauBox></Card></div>);
        const Tema66 = () => { const [vista, setVista] = useState('complet'); return <div className="space-y-6"><SectionTitle icon="📘" title="Tema 66" subtitle={t('tema66.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema66Complet />}{vista === 'resum' && <Tema66Resum />}</div>; };

        // TEMA 67 — Patrimoni i valoració
        const Tema67Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El <strong>patrimoni</strong> és el conjunt de béns, drets i obligacions que una entitat té en un moment determinat. Representa la posició econòmica-financera estàtica de l'empresa. La seua valoració comptable i econòmica són exercicis diferents però complementaris.</p></div></Card>
                <Card title="1. Concepte i elements" icon="⚖️">
                    <TheoryBlock title="1.1. Patrimoni comptable" color="teal"><p><strong>Equació fonamental</strong>: Actiu = Patrimoni Net + Passiu (A = PN + P).</p><p>• <strong>Actiu</strong>: béns i drets controlats que generen beneficis futurs.</p><p>• <strong>Passiu</strong>: obligacions actuals amb tercers.</p><p>• <strong>Patrimoni Net</strong>: diferència (propietat efectiva dels socis).</p></TheoryBlock>
                    <TheoryBlock title="1.2. Masses patrimonials" color="indigo"><p><strong>Actiu</strong>: no corrent (immobilitzat intangible, material, inversions financeres LT) + corrent (existències, realitzable, disponible).</p><p><strong>Patrimoni Net + Passiu</strong>: patrimoni net (capital, reserves, resultats), passiu no corrent (deutes LT), passiu corrent (deutes CT, proveïdors).</p></TheoryBlock>
                </Card>
                <Card title="2. Valoració econòmica d'actius" icon="💰">
                    <TheoryBlock title="Criteris PGC" color="violet"><p>• <strong>Cost històric / cost d'adquisició</strong>: preu de compra + costos directament atribuïbles. General per immobilitzat.</p><p>• <strong>Valor raonable</strong> (<em>fair value</em>): preu al qual podria intercanviar-se en mercat organitzat. Per a actius financers disponibles per a la venda.</p><p>• <strong>Valor net realitzable</strong>: quantitat que es podria obtenir per una venda, menys costos de venda.</p><p>• <strong>Valor en ús</strong>: VA fluxos futurs que generarà l'actiu.</p><p>• <strong>Valor residual</strong>: al final de la vida útil.</p></TheoryBlock>
                </Card>
                <Card title="3. Valoració d'empreses" icon="🏢">
                    <TheoryBlock title="3.1. Mètodes basats en balanç" color="amber"><p>• <strong>Valor comptable (VC)</strong>: patrimoni net/nombre accions.</p><p>• <strong>Valor substancial</strong>: actius operatius a valor de mercat.</p><p>• <strong>Valor de liquidació</strong>: venda d'actius + paga deutes.</p></TheoryBlock>
                    <TheoryBlock title="3.2. Mètodes basats en resultats" color="emerald"><p>• <strong>PER</strong>: Preu/Benefici per acció.</p><p>• <strong>EV/EBITDA</strong>.</p><p>• Múltiples de competidors.</p></TheoryBlock>
                    <TheoryBlock title="3.3. Mètodes basats en fluxos (DCF)" color="cyan"><p>• <strong>Descompte de fluxos de caixa</strong>: V = Σ FCL/(1+WACC)^t + VT/(1+WACC)^n. És el mètode dominant.</p><p>• <strong>Valor Terminal</strong> (TV): perpetuïtat Gordon-Shapiro.</p></TheoryBlock>
                    <TheoryBlock title="3.4. Mètodes mixtes (fons de comerç)" color="rose"><p><strong>Fons de comerç</strong> (<em>goodwill</em>) = Valor empresa − Valor substancial. Mètodes clàssics: alemany, indirecte, anglosaxó. Pablo Fernández (IESE) és referent en valoració d'empreses a Espanya.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>La valoració del patrimoni combina el rigor comptable (PGC, valors històrics o raonables) amb l'anàlisi econòmica (DCF, múltiples). El fons de comerç captura el valor intangible de l'empresa. El docent ha de transmetre que valorar és una tasca tècnica amb components subjectius (taxa de descompte, projeccions), on el rigor metodològic és imprescindible.</p></div></Card>
                <BibliografiaBox items={['FERNÁNDEZ, P. (2019): Valoración de Empresas, IESE.', 'DAMODARAN, A. (2012): Investment Valuation, Wiley.', 'COPELAND, T., KOLLER, T., MURRIN, J. (2000): Valuation, Wiley.', 'PGC 2007, Norma de Registre i Valoració.']} />
            </div>
        );

        const Tema68Complet = () => (

                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>L'<strong>anàlisi d'estats financers</strong> (<em>financial statement analysis</em>) interpreta la informació comptable per diagnosticar la situació econòmic-financera de l'empresa. Utilitza tècniques d'anàlisi <strong>horitzontal</strong> (evolució temporal), <strong>vertical</strong> (percentatges sobre total) i <strong>ràtios</strong> (quocients entre magnituds). És eina clau per a directius, inversors, bancs, auditors.</p></div></Card>

                    <TheoryBlock title="Ràtios clau" color="indigo"><p>• <strong>Liquiditat general</strong>: AC/PC (òptim ~1,5-2).</p><p>• <strong>Acid-test</strong>: (AC−existències)/PC.</p><p>• <strong>Tresoreria</strong>: disponible/PC.</p><p>• <strong>Solvència total</strong>: Actiu total/Passiu total.</p><p>• <strong>Garantia</strong>: (Actiu−Immobilitzat)/Passiu.</p><p>• <strong>Fons de Maniobra</strong>: AC−PC.</p></TheoryBlock>

                <Card title="3. Anàlisi econòmica (rendibilitat)" icon="💹">
                    <TheoryBlock title="Rendibilitat econòmica i financera" color="emerald"><p>• <strong>ROI / ROA (Return on Assets)</strong> = BAIT/Actiu total. Rendibilitat econòmica.</p><p>• <strong>ROE (Return on Equity)</strong> = BN/PN. Rendibilitat financera.</p><p>• <strong>ROS (margen sobre vendes)</strong> = BAIT/Vendes.</p><p>• <strong>Rotació actius</strong> = Vendes/Actiu.</p><p><strong>Identitat DuPont</strong>: ROE = Marge × Rotació × Palanquejament = (BN/Vendes)·(Vendes/Actiu)·(Actiu/PN).</p></TheoryBlock>
                    <FormulaBox formula="ROE = Marge × Rotació × Palanquejament (DuPont)" desc="ROA=BAIT/A; ROE=BN/PN" />

                <Card title="5. Altres indicadors" icon="📏">

                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>L'anàlisi d'estats financers requereix combinar múltiples ràtios (liquiditat, solvència, rendibilitat, eficiència) i interpretar-los contextualitzadament (sector, conjuntura, evolució). La <strong>identitat DuPont</strong> ofereix un marc elegant per descomposar el ROE. Juntament amb indicadors moderns (EBITDA, EVA, Altman Z-score), dibuixen una radiografia completa de la salut empresarial.</p></div></Card>
                <BibliografiaBox items={['ALTMAN, E. (1968): «Financial Ratios, Discriminant Analysis...», J. of Finance.', 'BERNSTEIN, L. i WILD, J. (1999): Analysis of Financial Statements, McGraw-Hill.', 'PALEPU, K., HEALY, P. i PEEK, E. (2019): Business Analysis and Valuation, Cengage.', 'AECA: Análisis de estados financieros.', 'OMEÑACA, J. (2021): Supuestos prácticos de contabilidad.']} />

                <Card title="Introducció" icon="📌"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El <strong>projecte empresarial</strong> és una de les metodologies didàctiques més potents per a l'ensenyament de l'Economia: integra coneixements teòrics, competències transversals (treball en equip, comunicació, creativitat) i aprenentatge significatiu. A més, fomenta l'<strong>esperit emprenedor</strong>, competència clau de la UE (Recomanació 2018).</p></div></Card>
                <Card title="1. Fonamentació" icon="🏗️">
                    <TheoryBlock title="1.1. ABP i Project-Based Learning" color="teal"><p><strong>Kilpatrick (1918)</strong>, deixeble de Dewey, va formular el <em>project method</em>. Modernament, Buck Institute for Education (BIE) sistematitza el <em>Gold Standard PBL</em>: projecte significatiu, autèntic, amb producte públic.</p></TheoryBlock>
                    <TheoryBlock title="1.2. Marc curricular" color="indigo"><p>LOMLOE i RD 243/2022 situen la «creació i gestió d'un projecte emprenedor» al cor de matèries com <strong>Empresa i Disseny de Models de Negoci</strong> (2n Batxillerat) i <strong>Economia i Emprenedoria</strong> (4t ESO). Competència emprenedora UE (2018).</p></TheoryBlock>
                </Card>
                <Card title="2. Estructura d'un pla empresa" icon="📋">
                    <TheoryBlock title="2.1. Parts clàssiques" color="violet"><p>(1) <strong>Resum executiu</strong>.</p><p>(2) <strong>Descripció del projecte i equip</strong>.</p><p>(3) <strong>Anàlisi del mercat</strong>: client objectiu, competència, DAFO, 5 forces Porter.</p><p>(4) <strong>Pla de màrqueting</strong>: 4P.</p><p>(5) <strong>Pla d'operacions</strong>: producció, logística, localització.</p><p>(6) <strong>Pla organitzatiu i RR.HH.</strong>: estructura, perfils.</p><p>(7) <strong>Pla jurídico-fiscal</strong>: forma jurídica, tràmits.</p><p>(8) <strong>Pla econòmic-financer</strong>: inversions, finançament, previsió vendes, P&G previsional, balanç previsional, tresoreria, VAN/TIR.</p><p>(9) <strong>Anàlisi de riscos</strong> i pla de contingència.</p><p>(10) <strong>Sostenibilitat i responsabilitat social</strong>.</p></TheoryBlock>
                </Card>
                <Card title="3. Business Model Canvas (Osterwalder 2010)" icon="🎨">
                    <TheoryBlock title="9 blocs" color="emerald"><p><strong>Alexander Osterwalder</strong>, a <em>Business Model Generation</em> (2010), va popularitzar el <strong>Canvas</strong>:</p><p>(1) <strong>Proposta de valor</strong>.</p><p>(2) <strong>Segments de clients</strong>.</p><p>(3) <strong>Canals</strong>.</p><p>(4) <strong>Relació amb els clients</strong>.</p><p>(5) <strong>Fonts d'ingressos</strong>.</p><p>(6) <strong>Recursos clau</strong>.</p><p>(7) <strong>Activitats clau</strong>.</p><p>(8) <strong>Aliances clau</strong>.</p><p>(9) <strong>Estructura de costos</strong>.</p><p>Eina visual, ideal per didàctica i iteració ràpida. Variants: Lean Canvas (Ash Maurya, per startups).</p></TheoryBlock>
                </Card>
                <Card title="4. Lean Startup (Ries 2011)" icon="🚀">
                    <TheoryBlock title="Metodologia iterativa" color="amber"><p><strong>Eric Ries</strong> (<em>The Lean Startup</em>, 2011): cicle <strong>Build-Measure-Learn</strong>. <strong>MVP</strong> (Minimum Viable Product) per validar hipòtesis amb mínim cost. <strong>Pivot</strong> si cal canvi. Aplicació didàctica: prototipatge ràpid, experiments, validació client.</p></TheoryBlock>
                </Card>
                <Card title="5. Aplicació a l'aula" icon="🏫">
                    <TheoryBlock title="5.1. Metodologia docent" color="rose"><p>Fases suggerides (trimestre):</p><p>• Setmana 1-2: ideació (brainstorming, Design Thinking, SCAMPER).</p><p>• Setmana 3-4: validació (enquestes, entrevistes, MVP).</p><p>• Setmana 5-7: Canvas + Pla d'empresa.</p><p>• Setmana 8-9: Pitch deck i defensa (10 min + preguntes).</p></TheoryBlock>
                    <TheoryBlock title="5.2. Rúbriques d'avaluació" color="cyan"><p>Dimensions típiques: viabilitat econòmica, originalitat, rigor analític, treball en equip, comunicació oral/escrita, sostenibilitat. Avaluació amb rúbriques analítiques.</p></TheoryBlock>
                    <TheoryBlock title="5.3. Programes i concursos" color="violet"><p>• <strong>Programa Emprendre</strong> (comunitats autònomes).</p><p>• <strong>Young Business Talents</strong>.</p><p>• <strong>Junior Achievement</strong>: mini-empreses a l'aula.</p><p>• <strong>ValenciaTech Girls, eWoman</strong>: foment emprenedoria femenina.</p><p>• <strong>Concursos d'idees universitaris</strong>.</p></TheoryBlock>
                </Card>
                <Card title="Conclusió" icon="✅"><div className="text-sm text-slate-700 leading-relaxed space-y-3"><p>El <strong>projecte empresarial</strong> és una metodologia que combina rigor (pla econòmic-financer) amb creativitat (Canvas, Lean Startup). Permet desenvolupar competències transversals de gran valor: treball en equip, anàlisi crítica, comunicació, resiliència. Els futurs docents han d'aprendre a facilitar aquests processos, no només a avaluar-los. El projecte empresarial és, en última instància, una simulació del món real que forma ciutadans i professionals més preparats.</p></div></Card>
                <BibliografiaBox items={['KILPATRICK, W.H. (1918): «The Project Method», Teachers College Record.', 'OSTERWALDER, A. i PIGNEUR, Y. (2010): Business Model Generation, Wiley.', 'RIES, E. (2011): The Lean Startup, Crown Business.', 'MAURYA, A. (2012): Running Lean, O\'Reilly.', 'DEWEY, J. (1916): Democracy and Education.', 'Junior Achievement Spain: materials pedagògics.', 'RD 243/2022 (currículum Batxillerat — EDMN).', 'LO 3/2020 LOMLOE; Recomanació UE 2018/C 189/01 competències.']} />
            </div>
