    // TEMA 54 — La dirección de la empresa. Planificación y control.
    // ════════════════════════════════════════════════════════════════
    const Tema54Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>dirección</strong> es la función que guía y coordina los recursos humanos y materiales de la empresa hacia la consecución de sus objetivos. Implica tomar decisiones, planificar, organizar, motivar al personal y controlar los resultados. Este tema se centra en las funciones directivas de <strong>planificación</strong> y <strong>control</strong>, así como en el proceso de toma de decisiones y los niveles de dirección.</p>
                    <p>Se enmarca en CE3 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022). Se estructura en cinco epígrafes: funciones directivas, niveles de dirección, planificación estratégica, toma de decisiones y control de gestión.</p>
                </div>
            </Card>
            <Card title="1. Funciones de la dirección" icon="📘">
                <TheoryBlock title="1.1. Las cuatro funciones directivas (Fayol)" color="rose">
                    <p><strong>Henri Fayol</strong> (1916) identificó las funciones básicas del proceso administrativo: <strong>planificación</strong> (fijar objetivos y trazar el camino), <strong>organización</strong> (diseñar la estructura y asignar recursos), <strong>dirección de personas</strong> (motivar, liderar, comunicar — desarrollada en el Tema 55) y <strong>control</strong> (verificar que los resultados se ajustan a lo planificado y corregir desviaciones).</p>
                </TheoryBlock>
                <TheoryBlock title="1.2. Niveles de dirección" color="red">
                    <p><strong>Alta dirección:</strong> consejo de administración, CEO/director general. Decisiones estratégicas (largo plazo, gran impacto, alta incertidumbre): fusiones, internacionalización, cambio de modelo de negocio.<br/><strong>Dirección intermedia (mandos intermedios):</strong> directores de departamento, de área, de fábrica. Decisiones tácticas (medio plazo): planes de producción, campañas de marketing, presupuestos departamentales.<br/><strong>Dirección operativa (primera línea):</strong> jefes de equipo, encargados, supervisores. Decisiones operativas (corto plazo, rutinarias): turnos de trabajo, pedidos de materiales, resolución de incidencias.</p>
                </TheoryBlock>
            </Card>
            <Card title="2. La planificación" icon="📘">
                <TheoryBlock title="2.1. Concepto y proceso" color="rose">
                    <p>La <strong>planificación</strong> consiste en definir los objetivos de la empresa y establecer las estrategias y acciones para alcanzarlos, anticipándose al futuro. El proceso: <strong>1)</strong> Análisis de la situación (DAFO). <strong>2)</strong> Fijación de objetivos (SMART: específicos, medibles, alcanzables, relevantes, temporalizados). <strong>3)</strong> Diseño de estrategias y alternativas. <strong>4)</strong> Evaluación y selección de la mejor alternativa. <strong>5)</strong> Implantación y seguimiento.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Tipos de planes" color="red">
                    <p><strong>Por horizonte temporal:</strong> planes estratégicos (largo plazo, 3-5 años: misión, visión, objetivos globales), planes tácticos (medio plazo, 1-3 años: planes funcionales), planes operativos (corto plazo, &lt;1 año: presupuestos, programas).<br/><strong>Por función:</strong> plan de producción, plan de marketing, plan financiero, plan de RRHH, plan de I+D.<br/><strong>Otros:</strong> políticas (directrices generales), procedimientos (secuencia de pasos), reglas (normas específicas), presupuestos (planes cuantificados en unidades monetarias).</p>
                </TheoryBlock>
                <TheoryBlock title="2.3. Dirección estratégica" color="rose">
                    <p>La <strong>dirección estratégica</strong> analiza el entorno y los recursos internos para formular, implementar y evaluar estrategias que generen ventaja competitiva:<br/><strong>Estrategias competitivas de Porter:</strong> liderazgo en costes (ser el productor más barato — Ryanair, Mercadona), diferenciación (ofrecer algo único que el cliente valore — Apple, BMW), enfoque o nicho (concentrarse en un segmento específico — Ferrari, Rolex).<br/><strong>Estrategias de crecimiento (Ansoff):</strong> penetración de mercado (más del mismo producto al mismo mercado), desarrollo de producto (nuevos productos al mismo mercado), desarrollo de mercado (mismo producto a nuevos mercados), diversificación (nuevos productos a nuevos mercados).</p>
                </TheoryBlock>
                <FormulaBox formula="Matriz Ansoff: Penetración | Desarr. Producto | Desarr. Mercat | Diversificació" desc="4 estratègies de creixement segons producte (actual/nou) × mercat (actual/nou)" />
            </Card>
            <Card title="3. La toma de decisiones" icon="📘">
                <TheoryBlock title="3.1. Tipos de decisiones" color="rose">
                    <p><strong>Programadas:</strong> rutinarias, repetitivas, con procedimientos establecidos (gestión de pedidos, nóminas). <strong>No programadas:</strong> nuevas, complejas, sin precedentes (entrar en un nuevo mercado, reaccionar a una crisis). La proporción de decisiones no programadas aumenta con el nivel directivo.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Ambientes de decisión" color="red">
                    <p><strong>Certeza:</strong> se conocen las consecuencias de cada alternativa (raro en la práctica).<br/><strong>Riesgo:</strong> se conocen las alternativas y sus probabilidades (decisión con esperanza matemática, árboles de decisión, criterio del valor esperado).<br/><strong>Incertidumbre:</strong> no se conocen las probabilidades. Criterios: <strong>Laplace</strong> (equiprobabilidad), <strong>optimista/maximax</strong> (mejor del mejor caso), <strong>pesimista/maximin</strong> (Wald: mejor del peor caso), <strong>Hurwicz</strong> (coeficiente de optimismo), <strong>Savage</strong> (mínimo arrepentimiento/minimax regret).</p>
                </TheoryBlock>
                <TheoryBlock title="3.3. Herramientas de decisión" color="rose">
                    <p><strong>Matriz de decisión (tabla de pagos):</strong> filas = alternativas, columnas = estados de la naturaleza, valores = resultados.<br/><strong>Árbol de decisión:</strong> representación gráfica de decisiones secuenciales con nodos de decisión (cuadrados), nodos de azar (círculos) y ramas con probabilidades y resultados. Se resuelve de derecha a izquierda calculando el valor esperado en cada nodo.</p>
                </TheoryBlock>
            </Card>
            <Card title="4. El control de gestión" icon="📘">
                <TheoryBlock title="4.1. Concepto y proceso" color="rose">
                    <p>El <strong>control</strong> es la función directiva que verifica que los resultados reales se ajustan a los planificados y, en caso de desviaciones, adopta medidas correctoras. Proceso: <strong>1)</strong> Fijar estándares (objetivos cuantificados). <strong>2)</strong> Medir los resultados reales. <strong>3)</strong> Comparar resultados con estándares (detectar desviaciones). <strong>4)</strong> Analizar las causas de las desviaciones. <strong>5)</strong> Adoptar medidas correctoras.</p>
                </TheoryBlock>
                <TheoryBlock title="4.2. Tipos de control" color="red">
                    <p><strong>Control preventivo (feedforward):</strong> antes de la acción. Anticipar problemas (control de calidad de materias primas, planificación de riesgos).<br/><strong>Control concurrente:</strong> durante la acción. Supervisión directa, cuadros de mando en tiempo real.<br/><strong>Control posterior (feedback):</strong> después de la acción. Análisis de resultados, auditorías, informes financieros. Es el más habitual pero el menos oportuno.</p>
                </TheoryBlock>
                <TheoryBlock title="4.3. Herramientas de control" color="rose">
                    <p><strong>Presupuestos:</strong> planes cuantificados que permiten comparar previsto vs. real.<br/><strong>Auditoría:</strong> interna (por la propia empresa) o externa (por auditores independientes). Financiera, operativa, de cumplimiento.<br/><strong>Cuadro de Mando Integral (Balanced Scorecard, Kaplan y Norton, 1992):</strong> sistema de indicadores que mide el desempeño desde cuatro perspectivas: financiera (rentabilidad, ingresos), clientes (satisfacción, retención), procesos internos (eficiencia, calidad), aprendizaje y crecimiento (formación, innovación).</p>
                </TheoryBlock>
            </Card>
            <Card title="5. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet"><p>Este tema conecta con CE3 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong>: funciones directivas, planificación, estrategia y control. Los criterios de decisión en incertidumbre (Laplace, Wald, Hurwicz, Savage) y los árboles de decisión son habituales en supuestos prácticos de oposiciones. Contribuye a STEM (cálculo de matrices y árboles), CE (planificación de un emprendimiento), CPSAA (toma de decisiones, juicio crítico) y CC (gobierno corporativo, ética directiva).</p></TheoryBlock>
            </Card>
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose"><p>La dirección comprende planificación, organización, dirección de personas y control (Fayol). Se ejerce a tres niveles: alta dirección (estratégico), mandos intermedios (táctico) y operativo. La planificación fija objetivos SMART y diseña estrategias: competitivas (Porter: costes, diferenciación, enfoque) y de crecimiento (Ansoff: penetración, desarrollo producto/mercado, diversificación). La toma de decisiones opera en certeza, riesgo (valor esperado, árboles) e incertidumbre (Laplace, Wald, Hurwicz, Savage). El control verifica resultados vs. estándares y corrige desviaciones, con herramientas como presupuestos, auditoría y Cuadro de Mando Integral (Kaplan-Norton: 4 perspectivas).</p></TheoryBlock>
            </Card>

    // TEMA 55 — La gestión de RRHH. Motivación y liderazgo.
    // ════════════════════════════════════════════════════════════════
    const Tema55Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>gestión de recursos humanos</strong> (GRH) comprende el conjunto de actividades dirigidas a atraer, desarrollar, motivar y retener a las personas que trabajan en la empresa. En una economía del conocimiento, el <strong>capital humano</strong> es el recurso más valioso y el principal factor de ventaja competitiva sostenible. La motivación y el liderazgo son las herramientas clave para convertir ese potencial en resultados.</p>
                    <p>Este tema se enmarca en CE3 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022). Se estructura en: funciones de RRHH, teorías de la motivación, estilos de liderazgo, comunicación interna y nuevas tendencias.</p>
                </div>
            </Card>
            <Card title="1. Funciones de la gestión de RRHH" icon="📘">
                <TheoryBlock title="1.1. Funciones principales" color="rose">
                    <p><strong>Planificación de plantilla:</strong> prever las necesidades de personal (número, cualificaciones, momento).<br/><strong>Reclutamiento y selección:</strong> atraer candidatos (reclutamiento interno/externo, portales de empleo, LinkedIn, headhunting) y elegir al más adecuado (entrevistas, pruebas, assessment center).<br/><strong>Formación y desarrollo:</strong> formación inicial (onboarding), formación continua (upskilling, reskilling), planes de carrera.<br/><strong>Evaluación del desempeño:</strong> medir el rendimiento mediante indicadores (KPIs), feedback 360°, entrevistas de evaluación.<br/><strong>Retribución:</strong> salario fijo + variable (bonus, comisiones, stock options), retribución flexible (seguro médico, cheque restaurante, guardería), retribución emocional (conciliación, teletrabajo, reconocimiento).<br/><strong>Relaciones laborales:</strong> negociación colectiva, convenios, comités de empresa, prevención de riesgos laborales.</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Teorías de la motivación" icon="📘">
                <TheoryBlock title="2.1. Teorías de contenido (qué motiva)" color="rose">
                    <p><strong>Maslow (1943):</strong> jerarquía de necesidades en cinco niveles piramidales: fisiológicas → seguridad → sociales/pertenencia → estima/reconocimiento → autorrealización. Solo las necesidades insatisfechas motivan; las satisfechas dejan de motivar.<br/><strong>Herzberg (1959):</strong> teoría bifactorial. <em>Factores higiénicos</em> (salario, condiciones laborales, seguridad, supervisión): su ausencia genera insatisfacción, pero su presencia no motiva. <em>Factores motivacionales</em> (logro, reconocimiento, responsabilidad, crecimiento, trabajo en sí mismo): generan satisfacción y motivación real.<br/><strong>McClelland (1961):</strong> tres necesidades adquiridas: <em>logro</em> (alcanzar metas), <em>poder</em> (influir sobre otros), <em>afiliación</em> (relaciones sociales). Cada persona tiene un perfil dominante.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Teorías de proceso (cómo se motiva)" color="red">
                    <p><strong>Vroom (1964):</strong> teoría de las expectativas. Motivación = <em>Expectativa</em> (esfuerzo → rendimiento) × <em>Instrumentalidad</em> (rendimiento → recompensa) × <em>Valencia</em> (valor subjetivo de la recompensa).<br/><strong>Adams (1963):</strong> teoría de la equidad. Las personas comparan su ratio esfuerzo/recompensa con el de otros; la percepción de inequidad genera desmotivación.<br/><strong>Locke (1968):</strong> teoría del establecimiento de metas. Las metas específicas y desafiantes (pero alcanzables) generan mayor motivación y rendimiento que las metas vagas.</p>
                </TheoryBlock>
                <FormulaBox formula="Herzberg: Higiènics (eviten insatisfacció) ≠ Motivacionals (generen motivació)" desc="La clau: el salari no motiva, però la seua absència desmotiva" />
            </Card>
            <Card title="3. El liderazgo" icon="📘">
                <TheoryBlock title="3.1. Concepto y estilos clásicos" color="rose">
                    <p>El <strong>liderazgo</strong> es la capacidad de influir en el comportamiento de un grupo para alcanzar objetivos comunes. Se distingue del poder formal (autoridad jerárquica).<br/><strong>Autocrático:</strong> el líder toma las decisiones sin consultar. Eficaz en situaciones de crisis o urgencia, pero genera dependencia y desmotivación.<br/><strong>Democrático (participativo):</strong> el líder consulta al equipo antes de decidir. Mayor motivación y creatividad, pero más lento.<br/><strong>Laissez-faire (liberal):</strong> el líder delega la toma de decisiones al equipo. Eficaz con equipos muy cualificados y autónomos; ineficaz si falta dirección.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Teorías situacionales y contemporáneas" color="red">
                    <p><strong>Hersey y Blanchard:</strong> liderazgo situacional. El estilo debe adaptarse a la <em>madurez</em> del subordinado (competencia + motivación): dirigir → persuadir → participar → delegar.<br/><strong>Liderazgo transformacional (Burns, Bass):</strong> el líder inspira, motiva intelectualmente, considera individualmente a cada miembro y genera un cambio profundo. Opuesto al <em>transaccional</em> (basado en recompensas y castigos).<br/><strong>Liderazgo servicial (servant leadership, Greenleaf):</strong> el líder sirve a su equipo, priorizando su desarrollo y bienestar.</p>
                </TheoryBlock>
            </Card>
            <Card title="4. Comunicación interna" icon="📘">
                <TheoryBlock color="rose"><p><strong>Descendente:</strong> de superiores a subordinados (instrucciones, información). <strong>Ascendente:</strong> de subordinados a superiores (informes, sugerencias, quejas). <strong>Horizontal:</strong> entre departamentos o colegas del mismo nivel (coordinación). <strong>Diagonal:</strong> entre niveles y departamentos diferentes. Las herramientas incluyen: reuniones, intranet, correo electrónico, chats corporativos (Slack, Teams), tablones, buzón de sugerencias.</p></TheoryBlock>
            </Card>
            <Card title="5. Nuevas tendencias en RRHH" icon="📘">
                <TheoryBlock color="red"><p><strong>Employer branding:</strong> la empresa como «marca empleadora» que atrae talento.<br/><strong>Gestión de la diversidad:</strong> igualdad de género, inclusión, interculturalidad.<br/><strong>Bienestar laboral (wellbeing):</strong> salud mental, desconexión digital, conciliación.<br/><strong>People analytics:</strong> uso de datos para la toma de decisiones en RRHH.<br/><strong>Trabajo remoto/híbrido:</strong> rediseño de la experiencia del empleado post-pandemia.</p></TheoryBlock>
            </Card>
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose"><p>La GRH abarca planificación, selección, formación, evaluación, retribución y relaciones laborales. La motivación se explica por teorías de contenido (Maslow: pirámide; Herzberg: higiénicos vs. motivacionales; McClelland: logro/poder/afiliación) y de proceso (Vroom: expectativas; Adams: equidad; Locke: metas). El liderazgo puede ser autocrático, democrático o liberal; las teorías situacionales (Hersey-Blanchard) y transformacionales (Burns-Bass) son las más influyentes. La comunicación interna fluye descendente, ascendente, horizontal y diagonal. Las tendencias incluyen employer branding, diversidad, bienestar, people analytics y trabajo híbrido.</p></TheoryBlock>
            </Card>
            <BibliografiaBox items={["Maslow, A. (1943). A Theory of Human Motivation. Psychological Review.","Herzberg, F. (1959). The Motivation to Work. Wiley.","Vroom, V. (1964). Work and Motivation. Wiley.","McGregor, D. (1960). The Human Side of Enterprise. McGraw-Hill.","Hersey, P. & Blanchard, K. (1969). Management of Organizational Behavior. Prentice-Hall.","Burns, J. M. (1978). Leadership. Harper & Row.","Bass, B. (1985). Leadership and Performance Beyond Expectations. Free Press.","Bueno Campos, E. (2022). Curso básico de Economía de la Empresa. Pirámide.","Robbins, S. & Judge, T. (2019). Organizational Behavior, 18.ª ed. Pearson.","Greenleaf, R. (1970). The Servant as Leader."]} />
        </div>
    );
    const Tema55Resum = () => (
        <div className="space-y-5 animate-fade"><Card>
            <div className="p-4 bg-rose-50 rounded-xl border border-rose-200 mb-5"><p className="text-center font-bold text-rose-800 text-lg">Tema 55: La gestió de recursos humans. Motivació i lideratge.</p><p className="text-center text-sm text-rose-600 mt-1"><em>"Maslow, Herzberg, Vroom: per què treballem i què ens motiva"</em></p></div>
            <div className="space-y-4 text-sm text-slate-700">
                <div><h4 className="font-bold text-slate-800 mb-1">1. Funcions RRHH</h4><ul className="list-disc pl-5 space-y-1"><li>Planificació, reclutament/selecció, formació, avaluació, retribució, relacions laborals.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">2. Teories motivació</h4><ul className="list-disc pl-5 space-y-1"><li>Maslow: piràmide 5 nivells (fisiològiques → autorealització). Necessitats insatisfetes motiven.</li><li>Herzberg: higiènics (salari, condicions — eviten insatisfacció) vs. motivacionals (reconeixement, creixement — generen motivació).</li><li>McClelland: assoliment, poder, afiliació. Vroom: expectativa × instrumentalitat × valència.</li><li>Adams: equitat (comparació ratio esforç/recompensa). Locke: metes específiques i desafiants.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">3. Lideratge</h4><ul className="list-disc pl-5 space-y-1"><li>Autocràtic, democràtic, laissez-faire. Situacional (Hersey-Blanchard): dirigir → delegar.</li><li>Transformacional (Burns, Bass): inspira i transforma. Servicial (Greenleaf): servir l'equip.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">4. Tendències</h4><ul className="list-disc pl-5 space-y-1"><li>Employer branding, diversitat, benestar, people analytics, treball híbrid.</li></ul></div>

            <ClauBox><p>- Domina <strong>Maslow vs. Herzberg</strong>: diferència clau entre necessitats i factors.</p><p>- Inclou teories de procés (<strong>Vroom, Adams, Locke</strong>) sovint ignorades.</p><p>- Compara <strong>3 estils clàssics</strong> + situacional + transformacional.</p></ClauBox>

    // TEMA 56 — La función comercial. El mix de marketing.
    // ════════════════════════════════════════════════════════════════
    const Tema56Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>función comercial</strong> (o de marketing) conecta la empresa con el mercado: identifica las necesidades del consumidor y desarrolla la estrategia para satisfacerlas de forma rentable. El <strong>marketing mix</strong> —las «4 P» de McCarthy (1960), ampliadas a 7 P— es el marco operativo fundamental: producto, precio, distribución (place) y comunicación (promotion).</p>
                    <p>Este tema se enmarca en CE5 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022). Se estructura en: concepto de marketing, investigación de mercados, segmentación, las 4 P del marketing mix y marketing digital.</p>
                </div>
            </Card>
            <Card title="1. Concepto y evolución del marketing" icon="📘">
                <TheoryBlock title="1.1. Definición" color="rose">
                    <p>Según la <strong>AMA</strong> (American Marketing Association, 2017): «el marketing es la actividad, el conjunto de instituciones y los procesos para crear, comunicar, entregar e intercambiar ofertas que tienen valor para los consumidores, clientes, socios y la sociedad en general». El marketing contemporáneo se orienta al <strong>cliente</strong> (customer-centric), no al producto.</p>
                </TheoryBlock>
                <TheoryBlock title="1.2. Evolución" color="red">
                    <p><strong>Orientación a la producción</strong> (hasta 1930): producir mucho y barato (la demanda supera la oferta). <strong>Orientación al producto</strong> (1930-1950): calidad técnica. <strong>Orientación a las ventas</strong> (1950-1970): vender lo producido (publicidad agresiva). <strong>Orientación al marketing</strong> (1970-2000): detectar necesidades y satisfacerlas (investigación de mercados, segmentación). <strong>Orientación al marketing relacional y digital</strong> (2000-presente): fidelización, CRM, experiencia del cliente, marketing de contenidos, redes sociales, big data.</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Investigación de mercados y segmentación" icon="📘">
                <TheoryBlock title="2.1. Investigación de mercados" color="rose">
                    <p>Proceso sistemático de recopilar, analizar e interpretar información sobre el mercado para tomar decisiones. <strong>Fases:</strong> definición del problema → diseño de la investigación → recogida de datos (primarios: encuestas, focus groups, observación, experimentación; secundarios: INE, Eurostat, informes sectoriales) → análisis → informe y recomendaciones.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Segmentación y posicionamiento" color="red">
                    <p><strong>Segmentación:</strong> dividir el mercado en grupos homogéneos (segmentos) según criterios: demográficos (edad, género, renta), geográficos, psicográficos (estilo de vida, personalidad), conductuales (frecuencia de compra, fidelidad, beneficio buscado).<br/><strong>Targeting:</strong> seleccionar los segmentos objetivo (indiferenciado, diferenciado, concentrado, personalizado/one-to-one).<br/><strong>Posicionamiento:</strong> la imagen que el producto ocupa en la mente del consumidor respecto a la competencia. Se define mediante atributos clave (precio, calidad, innovación, sostenibilidad). Ejemplo: Volvo = seguridad; Apple = innovación y diseño; Mercadona = calidad-precio.</p>
                </TheoryBlock>
            </Card>
            <Card title="3. El marketing mix: las 4 P" icon="📘">
                <TheoryBlock title="3.1. Producto (Product)" color="rose">
                    <p>El <strong>producto</strong> es cualquier bien, servicio, idea o experiencia que satisface una necesidad. Niveles: <em>producto básico</em> (beneficio esencial), <em>producto real</em> (características, diseño, marca, envase, calidad), <em>producto aumentado</em> (garantía, servicio posventa, financiación).<br/><strong>Ciclo de vida del producto:</strong> introducción (ventas bajas, inversión alta) → crecimiento (ventas aceleradas, competidores) → madurez (ventas estables, competencia intensa en precio) → declive (ventas caen, posible retirada).<br/><strong>Marca:</strong> nombre, logotipo, diseño que identifica y diferencia. Estrategias: marca única (Apple), marcas múltiples (P&G: Ariel, Fairy, Gillette), marca del distribuidor (Hacendado de Mercadona), marca paraguas, co-branding.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Precio (Price)" color="red">
                    <p>El <strong>precio</strong> es la cantidad de dinero que el consumidor paga por el producto. Es la única variable del mix que genera ingresos (las demás generan costes).<br/><strong>Métodos de fijación:</strong> basados en costes (coste + margen), basados en la demanda (precio que el mercado está dispuesto a pagar, elasticidad), basados en la competencia (precio similar, por encima o por debajo del líder).<br/><strong>Estrategias:</strong> descremación (precio alto inicial, bajada gradual — tecnología), penetración (precio bajo para ganar cuota — Ryanair), precios psicológicos (9,99 €), bundling (paquete), freemium, discriminación de precios (segmentos, zonas, momentos).</p>
                </TheoryBlock>
                <TheoryBlock title="3.3. Distribución (Place)" color="rose">
                    <p>La <strong>distribución</strong> es el conjunto de actividades que ponen el producto a disposición del consumidor en el lugar, momento y cantidad adecuados.<br/><strong>Canal de distribución:</strong> directo (fabricante → consumidor: venta online, tiendas propias) o indirecto (con intermediarios: mayoristas, minoristas). Niveles: corto (1 intermediario) o largo (2+).<br/><strong>Estrategias:</strong> distribución intensiva (máximos puntos de venta — Coca-Cola), selectiva (puntos seleccionados — electrodomésticos), exclusiva (un solo distribuidor por zona — Ferrari, Rolex).<br/><strong>E-commerce:</strong> comercio electrónico, marketplaces (Amazon), D2C (direct-to-consumer), omnicanalidad (integración tienda física + online).</p>
                </TheoryBlock>
                <TheoryBlock title="3.4. Comunicación (Promotion)" color="red">
                    <p>La <strong>comunicación comercial</strong> informa, persuade y recuerda al consumidor sobre el producto.<br/><strong>Publicidad:</strong> comunicación pagada, masiva, a través de medios (TV, radio, prensa, digital, exterior). Medición: CPM, CPC, CPA, ROI publicitario.<br/><strong>Promoción de ventas:</strong> incentivos a corto plazo (descuentos, 2×1, muestras gratuitas, concursos).<br/><strong>Relaciones públicas:</strong> imagen corporativa, patrocinio, eventos, notas de prensa, RSC.<br/><strong>Venta personal:</strong> contacto directo vendedor-cliente (B2B, productos complejos).<br/><strong>Marketing directo:</strong> comunicación individualizada (email marketing, SMS, catálogos).<br/><strong>Marketing digital:</strong> SEO/SEM, redes sociales (social media marketing), marketing de contenidos, influencer marketing, inbound marketing, marketing de afiliación, retargeting.</p>
                </TheoryBlock>
                <FormulaBox formula="Marketing Mix = Producto + Preu + Distribució (Place) + Comunicació (Promotion)" desc="Les 4 P de McCarthy (1960). Ampliades a 7P en serveis: +People, Process, Physical evidence" />
            </Card>
            <Card title="4. Marketing digital y nuevas tendencias" icon="📘">
                <TheoryBlock color="rose"><p><strong>Big data y analytics:</strong> análisis de datos masivos para personalizar la oferta y predecir el comportamiento del consumidor.<br/><strong>Inteligencia artificial:</strong> chatbots, recomendaciones personalizadas (Netflix, Amazon), segmentación predictiva.<br/><strong>Neuromarketing:</strong> aplicación de neurociencia al marketing (eye-tracking, EEG, respuesta galvánica) para entender la toma de decisiones del consumidor.<br/><strong>Marketing sostenible:</strong> comunicación de valores ESG, greenwashing vs. compromiso real, economía circular.<br/><strong>Customer Experience (CX):</strong> gestión integral de la experiencia del cliente en todos los puntos de contacto (customer journey mapping).</p></TheoryBlock>
            </Card>
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose"><p>El marketing conecta empresa y mercado. Ha evolucionado de la orientación a la producción a la orientación al cliente y al marketing digital. La investigación de mercados proporciona datos para segmentar (demográficos, psicográficos, conductuales), elegir target y posicionar. El marketing mix comprende: Producto (niveles, ciclo de vida, marca), Precio (costes, demanda, competencia; descremación vs. penetración), Distribución (canales directos/indirectos, intensiva/selectiva/exclusiva, e-commerce) y Comunicación (publicidad, promoción, RRPP, venta personal, marketing digital). Las tendencias incluyen big data, IA, neuromarketing, sostenibilidad y customer experience.</p></TheoryBlock>
            </Card>

    const Tema57Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>función financiera</strong> obtiene y gestiona los recursos económicos necesarios para que la empresa pueda funcionar: invertir en activos (maquinaria, existencias, I+D) y financiar sus operaciones (pagar salarios, proveedores, impuestos). La decisión de financiación —de dónde obtener los fondos— es complementaria a la decisión de inversión —en qué emplear los fondos (Tema 58).</p>
                    <p>Este tema se enmarca en CE6 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022). Se estructura en: concepto, clasificación de fuentes de financiación, autofinanciación, financiación ajena, coste de capital y nuevas formas de financiación.</p>
                </div>
            </Card>
            <Card title="1. Clasificación de las fuentes de financiación" icon="📘">
                <TheoryBlock title="1.1. Criterios de clasificación" color="rose">
                    <p><strong>Según la propiedad:</strong> financiación propia (no exigible: capital social, reservas, beneficios retenidos) y financiación ajena (exigible: deudas con terceros, préstamos, empréstitos, proveedores).<br/><strong>Según el plazo:</strong> a largo plazo o capitales permanentes (&gt;1 año: capital, reservas, préstamos a LP, empréstitos, leasing) y a corto plazo (&lt;1 año: crédito bancario, descuento de efectos, proveedores, factoring, póliza de crédito).<br/><strong>Según el origen:</strong> interna o autofinanciación (generada por la propia empresa: beneficios no distribuidos, amortizaciones, provisiones) y externa (aportada desde fuera: ampliaciones de capital, préstamos, subvenciones).</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Financiación propia" icon="📘">
                <TheoryBlock title="2.1. Capital social" color="rose">
                    <p>Aportaciones de los socios/accionistas al constituir la empresa o en <strong>ampliaciones de capital</strong>. En una SA, se materializa en acciones; en una SL, en participaciones sociales. Es la financiación más estable (no tiene vencimiento ni genera intereses obligatorios), pero diluye el control de los accionistas existentes.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Autofinanciación" color="red">
                    <p><strong>Autofinanciación de enriquecimiento (reservas):</strong> beneficios no distribuidos como dividendos. Tipos: reserva legal (obligatoria, 10 % del beneficio hasta el 20 % del capital social), reservas voluntarias, reservas estatutarias. Aumentan el patrimonio neto.<br/><strong>Autofinanciación de mantenimiento:</strong> fondos destinados a mantener el valor del patrimonio. <em>Amortizaciones:</em> reflejan la pérdida de valor (depreciación) del inmovilizado por uso, obsolescencia o paso del tiempo. Se imputan como coste y generan un fondo para reponer el activo al final de su vida útil. <em>Provisiones:</em> fondos para cubrir pérdidas futuras probables (impagos, garantías, litigios).<br/><strong>Ventajas:</strong> no genera coste financiero explícito, aumenta la autonomía, no requiere garantías. <strong>Inconvenientes:</strong> limita el reparto de dividendos (puede generar conflicto con los accionistas), es limitada (depende de los beneficios), puede generar ineficiencia (inversiones no rentables financiadas con fondos «gratuitos»).</p>
                </TheoryBlock>
            </Card>
            <Card title="3. Financiación ajena" icon="📘">
                <TheoryBlock title="3.1. A largo plazo" color="rose">
                    <p><strong>Préstamos bancarios a LP:</strong> la entidad financiera entrega una cantidad (principal) que la empresa devuelve con intereses en cuotas periódicas (sistema francés, cuotas constantes; sistema americano, intereses + devolución final).<br/><strong>Empréstitos (emisión de obligaciones):</strong> la empresa emite títulos de deuda (obligaciones, bonos) que los inversores compran. La empresa paga intereses periódicos (cupón) y devuelve el principal al vencimiento. Accesible principalmente para grandes empresas.<br/><strong>Leasing (arrendamiento financiero):</strong> la empresa de leasing adquiere el bien (maquinaria, vehículo, local) y lo alquila a la empresa usuaria por una cuota periódica, con opción de compra al final del contrato. Ventaja: no requiere desembolso inicial, cuotas deducibles. <strong>Renting:</strong> similar pero sin opción de compra y con mantenimiento incluido.<br/><strong>Subvenciones:</strong> transferencias no reembolsables de las AAPP o la UE. No son deuda, pero pueden estar condicionadas (inversión, empleo, I+D, transición ecológica).</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. A corto plazo" color="red">
                    <p><strong>Crédito comercial (proveedores):</strong> aplazamiento del pago a proveedores (30, 60, 90 días). Es la fuente de financiación a CP más utilizada y, aparentemente, gratuita (aunque pierde descuentos por pronto pago).<br/><strong>Préstamos bancarios a CP:</strong> cantidad fija, devolución en &lt;1 año.<br/><strong>Póliza de crédito (línea de crédito):</strong> el banco pone a disposición un límite; la empresa dispone de lo que necesita y paga intereses solo por lo utilizado (más una comisión de disponibilidad). Flexible.<br/><strong>Descuento de efectos comerciales:</strong> la empresa anticipa el cobro de letras de cambio, pagarés o facturas descontándolos en el banco (que cobra intereses y comisiones).<br/><strong>Factoring:</strong> cesión de las facturas pendientes de cobro a una entidad (factor) que adelanta el importe (menos comisión y intereses) y, opcionalmente, asume el riesgo de impago (factoring sin recurso).<br/><strong>Confirming:</strong> gestión del pago a proveedores a través de una entidad financiera que ofrece al proveedor cobro anticipado.</p>
                </TheoryBlock>
            </Card>
            <Card title="4. Coste de capital y estructura financiera" icon="📘">
                <TheoryBlock title="4.1. Coste de cada fuente" color="rose">
                    <p><strong>Coste de la deuda (ki):</strong> tipo de interés que paga la empresa, ajustado por el ahorro fiscal (los intereses son deducibles en el IS): ki* = ki × (1 − t), donde t = tipo impositivo.<br/><strong>Coste de los fondos propios (ke):</strong> la rentabilidad mínima exigida por los accionistas (coste de oportunidad). Es mayor que el coste de la deuda porque los accionistas asumen más riesgo (cobran después de los acreedores).<br/><strong>Coste medio ponderado del capital (WACC):</strong> media ponderada del coste de la deuda y de los fondos propios, según su proporción en la estructura financiera.</p>
                </TheoryBlock>
                <FormulaBox formula="WACC = ke × (E/(E+D)) + ki×(1−t) × (D/(E+D))" desc="E = fons propis, D = deute, ke = cost equity, ki = cost deute, t = tipus IS" />
            </Card>
            <Card title="5. Nuevas formas de financiación" icon="📘">
                <TheoryBlock color="rose"><p><strong>Business angels:</strong> inversors privats que aporten capital i experiència a startups en fases inicials.<br/><strong>Capital riesgo (venture capital):</strong> fons que invertixen en empreses amb alt potencial de creixement a canvi d'una participació.<br/><strong>Crowdfunding:</strong> finançament col·lectiu a través de plataformes (reward-based: Kickstarter; equity-based: Crowdcube; lending-based: October).<br/><strong>ICO/financiación pública:</strong> línies ICO (préstecs bonificats), ENISA (préstecs participatius per a emprenedors), CDTI (finançament I+D), fons Next Generation EU.<br/><strong>Emisión de acciones (Bolsa):</strong> OPV (Oferta Pública de Venta) per a empreses que volen cotitzar.</p></TheoryBlock>
            </Card>
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose"><p>La funció financera obté i gestiona recursos. Les fonts es classifiquen per propietat (pròpia/aliena), plaç (LP/CP) i origen (interna/externa). La financiació pròpia inclou capital social, reserves i autofinançament (amortitzacions, provisions). L'aliena a LP: préstecs, empréstits, leasing, subvencions. A CP: proveïdors, pòlissa de crèdit, descompte d'efectes, factoring. El WACC pondera el cost de cada font. Noves formes: business angels, VC, crowdfunding, ICO/ENISA, borsa.</p></TheoryBlock>
            </Card>
            <BibliografiaBox items={["Brealey, R., Myers, S. & Allen, F. (2020). Principios de Finanzas Corporativas, 13.ª ed. McGraw-Hill.","Bueno Campos, E. (2022). Curso básico de Economía de la Empresa. Pirámide.","Suárez, A. S. (2014). Decisiones óptimas de inversión y financiación en la empresa, 22.ª ed. Pirámide.","Ross, S., Westerfield, R. & Jordan, B. (2019). Fundamentals of Corporate Finance, 12.ª ed. McGraw-Hill.","Banco de España. Central de Información de Riesgos. www.bde.es","ICO. Líneas de financiación. www.ico.es","ENISA. Préstamos participativos. www.enisa.es","Ley 5/2015 de Fomento de la Financiación Empresarial.","CNMV. Plataformas de financiación participativa. www.cnmv.es","Modigliani, F. & Miller, M. (1958). The Cost of Capital. American Economic Review."]} />
        </div>
    );

    // ════════════════════════════════════════════════════════════════
    // TEMA 58 — La selección de inversiones. VAN, TIR, Payback.
    // ════════════════════════════════════════════════════════════════
    const Tema58Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>decisión de inversión</strong> —en qué activos emplear los recursos financieros— es, junto con la de financiación, la decisión más importante de la empresa. Una inversión compromete fondos a largo plazo con la expectativa de obtener rendimientos futuros superiores al coste del capital. Los métodos de selección de inversiones permiten evaluar y comparar proyectos para elegir los más rentables.</p>
                    <p>Este tema es <strong>esencial para los supuestos prácticos de oposiciones</strong> y se enmarca en CE6 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022). Se estructura en: concepto de inversión, métodos estáticos (Payback), métodos dinámicos (VAN, TIR) y comparación de criterios.</p>
                </div>
            </Card>
            <Card title="1. Concepto y variables de una inversión" icon="📘">
                <TheoryBlock title="1.1. Definición y tipos" color="rose">
                    <p>Una <strong>inversión</strong> es el acto de renunciar a una satisfacción presente (dinero) para obtener un beneficio futuro. En sentido empresarial: desembolso de fondos para adquirir activos (maquinaria, tecnología, stocks, I+D) que generarán flujos de caja futuros.<br/><strong>Tipos:</strong> inversiones productivas (ampliar capacidad), inversiones de reemplazo (sustituir equipos obsoletos), inversiones en I+D, inversiones financieras (acciones, bonos).</p>
                </TheoryBlock>
                <TheoryBlock title="1.2. Variables de un proyecto de inversión" color="red">
                    <p><strong>Desembolso inicial (A o D₀):</strong> cantidad invertida en el momento 0.<br/><strong>Flujos netos de caja (Qᵢ):</strong> cobros − pagos generados por la inversión en cada periodo i. Q₁, Q₂, ..., Qₙ.<br/><strong>Duración (n):</strong> número de periodos (años) de vida útil del proyecto.<br/><strong>Tasa de descuento (k):</strong> coste del capital o rentabilidad mínima exigida (WACC).<br/><strong>Valor residual (VR):</strong> valor del activo al final de su vida útil (se suma al último flujo de caja).</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Métodos estáticos" icon="📘">
                <TheoryBlock title="2.1. Payback (plazo de recuperación)" color="rose">
                    <p>El <strong>Payback</strong> es el tiempo que tarda la inversión en recuperar el desembolso inicial con los flujos de caja generados.</p>
                    <p><strong>Con flujos constantes:</strong> Payback = A / Q<br/><strong>Con flujos variables:</strong> se acumulan los flujos hasta igualar A.<br/><strong>Criterio:</strong> se elige la inversión con menor Payback (recupera antes). Se acepta si el Payback &lt; plazo máximo establecido por la empresa.</p>
                    <p><strong>Ventajas:</strong> simplicidad, liquidez (favorece proyectos que recuperan rápido).<br/><strong>Inconvenientes:</strong> <em>no tiene en cuenta el valor temporal del dinero</em> (un euro hoy vale más que un euro mañana), <em>ignora los flujos posteriores a la recuperación</em> (un proyecto que genera grandes flujos después del Payback es desechado), no mide la rentabilidad real.</p>
                </TheoryBlock>
                <FormulaBox formula="Payback = A / Q (flujos constants) | Acumular Qᵢ fins ΣQᵢ ≥ A (variables)" desc="Temps de recuperació. No considera el valor temporal del diner." />
            </Card>
            <Card title="3. Métodos dinámicos" icon="📘">
                <TheoryBlock title="3.1. Valor Actual Neto (VAN)" color="rose">
                    <p>El <strong>VAN</strong> (Valor Actual Neto, NPV en inglés) es la diferencia entre el valor actual de los flujos de caja futuros y el desembolso inicial. Actualiza todos los flujos al momento presente utilizando la tasa de descuento k:</p>
                    <p><strong>VAN = −A + Q₁/(1+k)¹ + Q₂/(1+k)² + ... + Qₙ/(1+k)ⁿ</strong></p>
                    <p><strong>Criterio:</strong> VAN &gt; 0 → la inversión genera valor (se acepta). VAN = 0 → indiferente. VAN &lt; 0 → destruye valor (se rechaza). Entre varios proyectos, se elige el de <strong>mayor VAN</strong>.</p>
                    <p><strong>Ventajas:</strong> tiene en cuenta el valor temporal del dinero, considera todos los flujos de caja, mide la creación de valor en términos absolutos (euros), es el método teóricamente más correcto.<br/><strong>Inconvenientes:</strong> requiere estimar flujos futuros (incertidumbre), la elección de la tasa de descuento k es crítica y subjetiva.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Tasa Interna de Rentabilidad (TIR)" color="red">
                    <p>La <strong>TIR</strong> (Tasa Interna de Rentabilidad, IRR en inglés) es la tasa de descuento que hace el VAN = 0. Es la rentabilidad del proyecto:</p>
                    <p><strong>0 = −A + Q₁/(1+r)¹ + Q₂/(1+r)² + ... + Qₙ/(1+r)ⁿ</strong></p>
                    <p>Donde <strong>r = TIR</strong>. Se resuelve por interpolación o con calculadora/hoja de cálculo.</p>
                    <p><strong>Criterio:</strong> TIR &gt; k → la inversión rinde más que el coste de capital (se acepta). TIR = k → indiferente. TIR &lt; k → rinde menos que el coste de capital (se rechaza). Entre varios proyectos, se elige el de <strong>mayor TIR</strong>.</p>
                    <p><strong>Ventajas:</strong> tiene en cuenta el valor temporal del dinero, proporciona una medida relativa de rentabilidad (porcentaje), intuitiva para comunicar.<br/><strong>Inconvenientes:</strong> puede dar resultados ambiguos con flujos no convencionales (múltiples TIR), supone reinversión de los flujos intermedios a la propia TIR (supuesto discutible), puede contradecir al VAN en proyectos mutuamente excluyentes de distinta escala o duración.</p>
                </TheoryBlock>
                <FormulaBox formula="VAN = −A + Σ Qᵢ/(1+k)ⁱ | TIR: VAN = 0 → r" desc="VAN > 0 → acceptar. TIR > k → acceptar. En cas de conflicte, prioritzar VAN." />
            </Card>
            <Card title="4. Comparación de criterios y ejemplo" icon="📘">
                <TheoryBlock title="4.1. VAN vs. TIR: ¿cuándo discrepan?" color="rose">
                    <p>Para proyectos <strong>independientes</strong> (aceptar/rechazar), VAN y TIR dan el mismo resultado. Para proyectos <strong>mutuamente excluyentes</strong> (elegir uno), pueden discrepar cuando difieren en tamaño (inversión inicial) o en el perfil temporal de los flujos. En caso de conflicto, <strong>se prioriza el VAN</strong> (mide la creación de valor absoluta).</p>
                </TheoryBlock>
                <TheoryBlock title="4.2. Ejemplo numérico" color="red">
                    <p><strong>Proyecto X:</strong> A = 10.000 €. Flujos: Q₁ = 4.000, Q₂ = 5.000, Q₃ = 4.000. k = 8 %.<br/>VAN = −10.000 + 4.000/1,08 + 5.000/1,08² + 4.000/1,08³ = −10.000 + 3.703,70 + 4.286,69 + 3.175,33 = <strong>1.165,72 €</strong>. VAN &gt; 0 → se acepta.<br/>TIR: por interpolación, <strong>r ≈ 14,5 %</strong> &gt; 8 % → se acepta.<br/>Payback: 4.000 + 5.000 = 9.000 (año 2) + 1.000/4.000 del año 3 = <strong>2 años y 3 meses</strong>.</p>
                </TheoryBlock>
            </Card>
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose"><p>La selecció d'inversions avalua projectes amb 3 mètodes: Payback (temps de recuperació — simple però no considera valor temporal), VAN (valor actual net dels fluxos descomptats − desemborsament — el més correcte, en €) i TIR (taxa que fa VAN=0 — rentabilitat en %). Criteris: Payback mínim, VAN&gt;0 (i màxim), TIR&gt;k. En conflicte VAN vs. TIR, prioritzar VAN. Variables clau: desemborsament A, fluxos Qᵢ, durada n, taxa k, valor residual. Tema essencial per als supòsits pràctics.</p></TheoryBlock>
            </Card>
            <BibliografiaBox items={["Suárez, A. S. (2014). Decisiones óptimas de inversión y financiación en la empresa, 22.ª ed. Pirámide.","Brealey, R., Myers, S. & Allen, F. (2020). Principios de Finanzas Corporativas, 13.ª ed. McGraw-Hill.","Bueno Campos, E. (2022). Curso básico de Economía de la Empresa. Pirámide.","Ross, S., Westerfield, R. & Jordan, B. (2019). Fundamentals of Corporate Finance. McGraw-Hill.","Fernández, P. (2019). Valoración de Empresas, 7.ª ed. Gestión 2000.","Mankiw, N. G. (2021). Principios de Economía, 9.ª ed. Cengage."]} />
        </div>
    );
    const Tema58Resum = () => (
        <div className="space-y-5 animate-fade"><Card>
            <div className="p-4 bg-rose-50 rounded-xl border border-rose-200 mb-5"><p className="text-center font-bold text-rose-800 text-lg">Tema 58: La selecció d'inversions. VAN, TIR, Payback.</p><p className="text-center text-sm text-rose-600 mt-1"><em>"VAN > 0 → acceptar. TIR > k → acceptar. Payback = rapidesa de recuperació."</em></p></div>
            <div className="space-y-4 text-sm text-slate-700">
                <div><h4 className="font-bold text-slate-800 mb-1">1. Variables</h4><ul className="list-disc pl-5 space-y-1"><li>Desemborsament A, fluxos Qᵢ, durada n, taxa k (WACC), valor residual VR.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">2. Payback</h4><ul className="list-disc pl-5 space-y-1"><li>Payback = A/Q (constants) o acumular fins ΣQᵢ ≥ A. Criteri: mínim.</li><li>Limitació: no considera valor temporal ni fluxos posteriors a la recuperació.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">3. VAN</h4><ul className="list-disc pl-5 space-y-1"><li>VAN = −A + ΣQᵢ/(1+k)ⁱ. VAN&gt;0 → acceptar, màxim VAN.</li><li>Avantatge: valor temporal, tots els fluxos, creació valor absoluta (€). El més correcte.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">4. TIR</h4><ul className="list-disc pl-5 space-y-1"><li>TIR = taxa r on VAN=0. TIR&gt;k → acceptar. Rentabilitat relativa (%).</li><li>Limitació: múltiples TIR, reinversió a r, conflicte amb VAN en excloents.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">5. Exemple</h4><ul className="list-disc pl-5 space-y-1"><li>A=10.000, Q=(4.000, 5.000, 4.000), k=8%. VAN=1.165,72€. TIR≈14,5%. Payback=2a 3m.</li></ul></div>
            </div>
            <FormulaBox formula="VAN = −A + Σ Qᵢ/(1+k)ⁱ | TIR: VAN=0 | Payback = A/Q" desc="3 mètodes. En conflicte VAN vs. TIR → prioritzar VAN" />
            <ClauBox><p>- Domina les <strong>3 fórmules</strong> i sap calcular-les (supòsits pràctics!).</p><p>- Explica <strong>avantatges i inconvenients</strong> de cada mètode.</p><p>- En conflicte VAN vs. TIR → <strong>prioritzar VAN</strong>.</p><p>- Inclou <strong>exemple numèric complet</strong> amb els 3 mètodes.</p></ClauBox>
        </Card></div>
    );
    const Tema58 = () => { const [vista, setVista] = useState('complet'); return (<div className="space-y-6"><SectionTitle icon="📊" title="Tema 58" subtitle={t('tema58.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema58Complet />}{vista === 'resum' && <Tema58Resum />}</div>); };

    // ════════════════════════════════════════════════════════════════
    // PLACEHOLDER — Temes 59-60

    // ════════════════════════════════════════════════════════════════

    // ════════════════════════════════════════════════════════════════
    const headerSections = [
        { id: 'inicio', label: t('sec.inicio'), emoji: '🏠' },
        { id: 'tema49', label: 'T49', emoji: '🏢' },
        { id: 'tema50', label: 'T50', emoji: '🔍' },
        { id: 'tema51', label: 'T51', emoji: '📍' },
        { id: 'tema52', label: 'T52', emoji: '⚙️' },
        { id: 'tema53', label: 'T53', emoji: '🏗️' },
        { id: 'tema54', label: 'T54', emoji: '🎯' },
        { id: 'tema55', label: 'T55', emoji: '👥' },
        { id: 'tema56', label: 'T56', emoji: '📢' },
        { id: 'tema57', label: 'T57', emoji: '💰' },
        { id: 'tema58', label: 'T58', emoji: '📊' },
        { id: 'tema59', label: 'T59', emoji: '🏢' },
        { id: 'tema60', label: 'T60', emoji: '🏢' },
    ];

    return (
        <div className="min-h-screen">
            <PdeHeader idioma={idioma} setIdioma={(lang) => { setIdioma(lang); PdeLanguageStore.set(lang); }} currentApp="oposicions-bloc-f" sections={headerSections} currentSection={section} setSection={setSection} />
            <main className="max-w-7xl mx-auto px-4 py-8">
                {section === 'inicio' && <Inicio />}

                {section === 'tema51' && <Tema51 />}

                {section === 'tema54' && <Tema54 />}

}
