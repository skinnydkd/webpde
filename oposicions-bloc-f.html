        const Card = ({ children, className = "", title, icon }) => (

        const TheoryBlock = ({ title, children, color = "slate" }) => {

        const FormulaBox = ({ formula, desc }) => (

        );

        const SectionTitle = ({ icon, title, subtitle }) => (

        );

        const BibliografiaBox = ({ items }) => (

            </div>

        const ClauBox = ({ children }) => (

                <div className="flex items-start gap-3">

                        <h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4>

            </div>
        );

        // ════════════════════════════════════════════════════════════════
        // TEMA 49 — Concepte i classes d'inversió. VAN, TIR, Payback.
        // ════════════════════════════════════════════════════════════════
        const Tema49Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La <strong>inversió</strong> és la porta d'entrada a la dimensió financera de l'empresa. Decidir on, quant i quan invertir determina la trajectòria competitiva a llarg termini. Les decisions d'inversió comprometen recursos escassos en projectes els rendiments dels quals es materialitzaran al futur, en un entorn d'incertesa. L'<strong>anàlisi d'inversions</strong> (<em>capital budgeting</em>) proporciona les eines quantitatives per avaluar-les amb rigor.</p>
                        <p>A Espanya, la formació bruta de capital fix (FBKF) representa el <strong>19-20 % del PIB</strong> (INE 2024). Els fons <em>Next Generation EU</em> (160.000 M€ per a Espanya, 2021-2026) estan dinamitzant la inversió empresarial en transició digital, eficiència energètica, automoció i semiconductors. Entendre la lògica d'aquestes decisions —VAN, TIR, payback, ràtio de rendibilitat— és essencial per a la pràctica empresarial i per a l'alumnat de Batxillerat.</p>
                        <p>Aquest tema obri el Bloc F i connecta amb el Tema 57 (presa de decisions), els Temes 53-54 (cost del capital i estructura financera) i el Tema 58 (planificació). S'estructura en 5 blocs: (1) concepte i tipus d'inversió; (2) elements i dimensions; (3) criteris estàtics (payback, tant mitjà); (4) criteris dinàmics (VAN, TIR, IR); (5) selecció d'inversions i casos pràctics.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i classes d'inversió" icon="💼">
                    <TheoryBlock title="1.1. Definició d'inversió" color="emerald">
                        <p>La <strong>inversió</strong> és el <strong>desembolsament actual de recursos (capital) amb l'expectativa d'obtenir ingressos futurs superiors</strong>. <strong>Pierre Massé</strong>, a <em>Le choix des investissements</em> (1959), la va definir com «l'intercanvi d'una satisfacció immediata i certa a la qual es renuncia, contra una esperança que s'adquireix i de la qual el bé invertit és el suport». Tres elements essencials: (a) <em>desembolsament present</em>; (b) <em>fluxos futurs esperats</em>; (c) <em>incertesa</em> sobre els fluxos futurs.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Classificació segons la finalitat" color="indigo">
                        <p><strong>a) Inversió en actius fixos</strong> (<em>capital expenditure</em>, CAPEX): maquinària, plantes, equips, immobles, vehicles.</p>
                        <p><strong>b) Inversió en circulant</strong>: existències, clients, tresoreria operativa. Finança el fons de maniobra (Tema 51).</p>
                        <p><strong>c) Inversió financera</strong>: accions, bons, imposicions, participacions estratègiques.</p>
                        <p><strong>d) Inversió intangible</strong>: R+D, marques, patents, formació, software, capital humà.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Classificació segons objectiu (Joel Dean, 1951)" color="violet">
                        <p><strong>Joel Dean</strong>, a <em>Capital Budgeting</em> (1951), pioner de la disciplina, va classificar les inversions segons la motivació:</p>
                        <p><strong>• Reposició</strong>: reemplaçar actius obsolets o deteriorats.</p>
                        <p><strong>• Expansió</strong>: ampliar capacitat per mercats existents.</p>
                        <p><strong>• Modernització / Racionalització</strong>: reduir costos amb tecnologia més eficient.</p>
                        <p><strong>• Estratègica</strong>: nous productes, nous mercats, R+D, diversificació.</p>
                        <p><strong>• Obligada</strong>: compliment legal (medi ambient, seguretat).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.4. Inversions relacionades" color="cyan">
                        <p>Segons la relació entre alternatives:</p>
                        <p><strong>• Independents</strong>: la selecció d'una no afecta les altres.</p>
                        <p><strong>• Complementàries</strong>: una reforça l'altra.</p>
                        <p><strong>• Substitutives / mútuament excloents</strong>: triar una exclou l'altra.</p>
                        <p><strong>• Restrictives</strong>: subjectes a límit pressupostari.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Elements i dimensions d'una inversió" icon="🎯">
                    <TheoryBlock title="2.1. Elements fonamentals" color="indigo">
                        <p>Tota inversió es caracteritza per:</p>
                        <p>(1) <strong>Desembolsament inicial (A o D₀)</strong>: capital invertit al moment t=0. Amb signe negatiu per convenció.</p>
                        <p>(2) <strong>Fluxos de caixa (FCⱼ)</strong>: ingressos menys despeses operatives generats pel projecte durant la seua vida útil. Són fluxos nets, <strong>després d'impostos</strong>.</p>
                        <p>(3) <strong>Vida útil o horitzó (n)</strong>: nombre de períodes que durarà el projecte.</p>
                        <p>(4) <strong>Valor residual (VR)</strong>: valor de liquidació al final, si escau.</p>
                        <p>(5) <strong>Taxa de descompte (k)</strong>: rendibilitat mínima exigida, cost d'oportunitat, WACC (Tema 53).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Dimensions (Massé, Albi)" color="violet">
                        <p>Massé i autors espanyols (Albi, Suárez Suárez) distingeixen tres dimensions:</p>
                        <p><strong>• Tecnològica</strong>: què permet produir la inversió (capacitat, qualitat, flexibilitat).</p>
                        <p><strong>• Econòmica</strong>: els fluxos de caixa reals (ingressos, despeses d'operació, impostos).</p>
                        <p><strong>• Financera</strong>: com es finança (estructura capital, préstecs, subvencions).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Fluxos rellevants" color="emerald">
                        <p>Per al càlcul del VAN/TIR s'han d'utilitzar <strong>fluxos incrementals</strong> (només aquells causats pel projecte) i <strong>després d'impostos</strong>. Principis:</p>
                        <p>• Ignorar els <em>sunk costs</em> (ja incorreguts, irrecuperables).</p>
                        <p>• Incloure els <em>costos d'oportunitat</em> (per exemple, terreny ja propietat de l'empresa té cost d'oportunitat).</p>
                        <p>• Considerar <em>efectes col·laterals</em> sobre altres productes (canibalització, sinergies).</p>
                        <p>• Separar <em>decisió d'inversió</em> de <em>decisió de finançament</em> (principi de Miller-Modigliani, Tema 54).</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Criteris estàtics de selecció" icon="⏱️">
                    <TheoryBlock title="3.1. Característiques dels criteris estàtics" color="amber">
                        <p>Els <strong>criteris estàtics</strong> no tenen en compte el valor temporal del diner (ignoren la cronologia dels fluxos). Són simples, intuïtius, però metodològicament imprecisos. Útils com a primera aproximació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Termini de recuperació (Payback)" color="blue">
                        <p>El <strong>payback</strong> (termini de recuperació) és el temps necessari per recuperar el desembolsament inicial amb els fluxos de caixa del projecte. Criteri: triar el projecte amb <strong>payback menor</strong>; rebutjar si supera un màxim predefinit.</p>
                        <p><strong>Avantatges</strong>: simple, intuïtiu, prioritza liquiditat, adequat en entorns d'alta incertesa.</p>
                        <p><strong>Inconvenients</strong>: ignora el valor temporal del diner; ignora fluxos posteriors al payback; prioritza curt termini.</p>
                        <p><strong>Exemple</strong>: Projecte amb A=10.000 € i FC anuals de 3.000 € → Payback = 10.000 / 3.000 = 3,33 anys. Si els fluxos no són uniformes: acumular fins a igualar A.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Rendibilitat mitjana" color="violet">
                        <p>La <strong>rendibilitat mitjana simple</strong> o <strong>tant mitjà</strong>: TM = Flux mitjà anual / Desembolsament inicial = (Σ FCⱼ / n) / A. Expressa la rendibilitat anual mitjana. Comparteix els inconvenients dels criteris estàtics.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Criteris dinàmics de selecció" icon="📈">
                    <TheoryBlock title="4.1. El valor temporal del diner (Fisher, 1930)" color="emerald">
                        <p>El principi fundacional de les finances, formalitzat per <strong>Irving Fisher</strong> a <em>The Theory of Interest</em> (1930): <strong>un euro avui val més que un euro demà</strong>. Tres raons: (a) <em>preferència temporal</em>; (b) <em>risc</em>; (c) <em>inflació</em>. La taxa de descompte captura aquestes preferències.</p>
                        <p>El <strong>valor actual (VA)</strong> d'un import futur F al període j, descomptat a una taxa k: VA = F / (1+k)ʲ.</p>
                    </TheoryBlock>

                    <FormulaBox formula="VA = F / (1+k)ʲ" desc="Valor actual d'un flux futur F al període j, descomptat a taxa k" />

                    <TheoryBlock title="4.2. Valor Actual Net (VAN / NPV)" color="indigo">
                        <p>El <strong>Valor Actual Net</strong> (VAN; <em>Net Present Value</em>, NPV) és la suma de tots els fluxos de caixa del projecte descomptats al moment actual, menys el desembolsament inicial.</p>
                    </TheoryBlock>

                    <FormulaBox formula="VAN = −A + Σⱼ₌₁ⁿ FCⱼ / (1+k)ʲ" desc="Valor Actual Net: criteri fonamental de selecció d'inversions" />

                    <TheoryBlock title="4.3. Regla del VAN" color="violet">
                        <p>Regla de decisió:</p>
                        <p>• Si <strong>VAN &gt; 0</strong>: el projecte genera valor. <strong>Accepta'l</strong>.</p>
                        <p>• Si <strong>VAN &lt; 0</strong>: destrueix valor. <strong>Rebutja'l</strong>.</p>
                        <p>• Si <strong>VAN = 0</strong>: indiferent (just cobreix el cost d'oportunitat).</p>
                        <p>En projectes <em>mútuament excloents</em>: triar el de VAN més alt. En cartera amb pressupost limitat: maximitzar VAN conjunt.</p>
                        <p><strong>Avantatges</strong>: incorpora el valor temporal, és additiu (VAN(A+B)=VAN(A)+VAN(B)), coherent amb maximització del valor per l'accionista.</p>
                        <p><strong>Inconvenients</strong>: sensibilitat a l'elecció de k; no capta valor d'opcions reals.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.4. Taxa Interna de Retorn (TIR / IRR)" color="rose">
                        <p>La <strong>TIR</strong> (<em>Internal Rate of Return</em>, IRR) és la taxa de descompte que fa el VAN igual a zero.</p>
                    </TheoryBlock>

                    <FormulaBox formula="VAN(TIR) = 0 ⇒  −A + Σⱼ FCⱼ / (1+TIR)ʲ = 0" desc="TIR: rendibilitat intrínseca del projecte" />

                    <TheoryBlock title="4.5. Regla de la TIR i limitacions" color="amber">
                        <p>Regla:</p>
                        <p>• Si <strong>TIR &gt; k</strong>: accepta el projecte.</p>
                        <p>• Si <strong>TIR &lt; k</strong>: rebutja'l.</p>
                        <p>• Entre alternatives excloents: <em>no sempre coincideix amb VAN</em>. Si hi ha conflicte, el VAN és més fiable.</p>
                        <p><strong>Limitacions de la TIR</strong>: (a) TIR múltiples si fluxos canvien de signe més d'una vegada; (b) hipòtesi de reinversió a la pròpia TIR (irreal); (c) no additiva; (d) pot entrar en conflicte amb VAN en projectes a escala diferent.</p>
                        <p>La <strong>TIRM</strong> (Modified IRR) corregeix aquests problemes assumint reinversió a una taxa exògena realista.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.6. Índex de rendibilitat (IR / PI)" color="cyan">
                        <p>L'<strong>Índex de Rendibilitat</strong> (<em>Profitability Index</em>) és el quocient entre el valor actual dels fluxos i el desembolsament inicial:</p>
                        <p>IR = (Σ FCⱼ / (1+k)ʲ) / A.</p>
                        <p>Regla: acceptar si IR &gt; 1 (equivalent a VAN &gt; 0). Molt útil en <strong>selecció de cartera amb pressupost limitat</strong>: ordenar projectes per IR.</p>
                    </TheoryBlock>

                    <FormulaBox formula="IR = (Σ FCⱼ/(1+k)ʲ) / A    |    Acceptar si IR > 1" desc="Índex de rendibilitat: útil en cartera amb restriccions" />
                </Card>

                <Card title="5. Cas pràctic complet" icon="🧮">
                    <TheoryBlock title="5.1. Exemple numèric" color="emerald">
                        <p>Projecte: A = 100.000 € ; vida = 4 anys ; FCs = [30.000, 40.000, 50.000, 30.000] ; k = 10 %.</p>
                        <p><strong>Payback</strong>: Any 1 acum. 30.000; Any 2 acum. 70.000; Any 3 acum. 120.000. Recuperat en any 3 (fracció: 30.000/50.000 = 0,6). Payback ≈ <strong>2,6 anys</strong>.</p>
                        <p><strong>VAN</strong>: − 100.000 + 30.000/1,1 + 40.000/1,21 + 50.000/1,331 + 30.000/1,4641 = −100.000 + 27.273 + 33.058 + 37.566 + 20.490 = <strong>+18.387 €</strong>. Projecte acceptable.</p>
                        <p><strong>TIR</strong>: resoldre VAN(TIR)=0 per aproximació iterativa → TIR ≈ <strong>17,3 %</strong>. Com 17,3 % &gt; 10 %, acceptable.</p>
                        <p><strong>IR</strong> = 118.387 / 100.000 = <strong>1,18</strong>. Com &gt; 1, acceptable.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Extensions modernes" color="violet">
                        <p><strong>Real options</strong> (Myers 1977, Dixit-Pindyck 1994): valoren la flexibilitat gerencial (opció d'expandir, d'ajornar, d'abandonar).</p>
                        <p><strong>Anàlisi de sensibilitat</strong>, <strong>escenaris</strong> i <strong>Simulació Monte Carlo</strong>.</p>
                        <p>La literatura financera recomana el <strong>VAN</strong> com a criteri decisiu per la seua coherència teòrica.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Les decisions d'inversió constitueixen el nucli de la direcció financera. Els <strong>criteris dinàmics</strong> (VAN, TIR, IR), basats en el principi del valor temporal del diner (<strong>Fisher, 1930</strong>), ofereixen un marc conceptualment sòlid. <strong>Joel Dean (1951)</strong> i <strong>Pierre Massé (1959)</strong> van sentar les bases de l'anàlisi d'inversions moderna.</p>
                        <p>En la pràctica empresarial espanyola, la gestió professional d'inversions és clau per aprofitar l'onada d'oportunitats dels fons Next Gen EU, la transició digital i la descarbonització. El docent ha de transmetre que, darrere de cada fórmula (VAN, TIR), hi ha conceptes econòmics profunds (cost d'oportunitat, incertesa, preferència temporal).</p>
                    </div>
                </Card>
