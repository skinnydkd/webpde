                        <text x="515" y="338" textAnchor="middle" fontSize="12" fill="#4a2040" fontWeight="600">Nacional</text>
                        <text x="515" y="361" textAnchor="middle" fontSize="12" fill="#4a2040" fontWeight="600">Multinacional / Transnacional</text>
                    </svg>
                </div>
            </Card>

            <Card title="1. Concepte d'empresa i evolució del pensament" icon="📘">
                <TheoryBlock title="1.1. Concepte d'empresa" color="rose">
                    <p>
                        L'empresa pot definir-se des de múltiples perspectives: <strong>econòmica</strong> (unitat de producció que combina factors per a obtindre béns i serveis), <strong>jurídica</strong> (persona física o jurídica que exerceix una activitat econòmica organitzada), <strong>sociològica</strong> (organització social amb relacions de poder, cultura i interessos diversos) i <strong>sistèmica</strong> (sistema obert que interactua amb el seu entorn, format per subsistemes interrelacionats).
                    </p>
                    <p>
                        Una definició integradora: l'empresa és una <strong>organització de recursos humans, materials, financers i tecnològics</strong>, coordinats sota una direcció, que realitza activitats de producció i/o distribució de béns o serveis amb la finalitat de satisfer necessitats del mercat i obtindre un benefici, assumint risc.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Evolució del pensament sobre l'empresa" color="red">
                    <p>
                        <strong>Adam Smith (1776):</strong> l'empresa com a unitat de producció que es beneficia de la divisió del treball i l'especialització.<br/>
                        <strong>Economia neoclàssica (Marshall, Walras):</strong> l'empresa com a «caixa negra» que maximitza el benefici en competència perfecta. Funció de producció i costos.<br/>
                        <strong>Knight (1921):</strong> l'empresari com a agent que assumeix <strong>incertesa</strong> (risc no assegurable) i obté el benefici com a recompensa.<br/>
                        <strong>Schumpeter (1912, 1942):</strong> l'empresari <strong>innovador</strong> com a motor de la «destrucció creativa» — introdueix nous productes, processos, mercats, fonts d'aprovisionament o organitzacions que transformen l'economia.<br/>
                        <strong>Coase (1937):</strong> l'empresa com a alternativa al mercat — existeix perquè els <strong>costos de transacció</strong> (buscar informació, negociar, vigilar contractes) fan més eficient coordinar internament que contractar al mercat.<br/>
                        <strong>Simon (1947):</strong> racionalitat limitada — els directius no maximitzen sinó que busquen solucions <strong>satisfactòries</strong> (satisficing).<br/>
                        <strong>Teoria de l'agència (Jensen i Meckling, 1976):</strong> conflictes d'interessos entre <strong>principal</strong> (propietaris/accionistes) i <strong>agent</strong> (directius). Costos d'agència, govern corporatiu.<br/>
                        <strong>Enfocament de recursos i capacitats (Penrose, 1959; Barney, 1991):</strong> l'empresa com a conjunt únic de recursos i capacitats que generen <strong>avantatge competitiu sostenible</strong>.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Elements de l'empresa" icon="📘">
                <TheoryBlock title="2.1. Elements tangibles i intangibles" color="rose">
                    <p>
                        <strong>Factors humans:</strong> treballadors (operaris, tècnics, administratius), directius (alta direcció, comandaments intermedis) i l'empresari/emprenedor. El <strong>capital humà</strong> (coneixements, habilitats, experiència, creativitat) és el factor més determinant de la competitivitat.<br/>
                        <strong>Factors materials:</strong> capital fix (terrenys, edificis, maquinària, equips informàtics, vehicles) i capital circulant (matèries primeres, productes en curs, productes acabats, existències).<br/>
                        <strong>Factors financers:</strong> recursos financers propis (capital social, reserves, beneficis retinguts) i aliens (préstecs bancaris, emissió d'obligacions, proveïdors, leasing).<br/>
                        <strong>Factors intangibles:</strong> tecnologia (patents, know-how, programari), marca i imatge (reputació, fidelitat de clients), organització (rutines, processos, cultura corporativa), relacions (amb clients, proveïdors, institucions). Els <strong>actius intangibles</strong> representen una proporció creixent del valor de les empreses (a les empreses de l'S&P 500, més del 90 % del valor de mercat és intangible).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. L'empresa com a sistema" color="red">
                    <p>
                        La teoria general de sistemes (Bertalanffy) aplicada a l'empresa (Kast i Rosenzweig) la concep com un <strong>sistema obert</strong>: rep inputs de l'entorn (matèries primeres, treball, capital, informació), els transforma mitjançant un procés de producció i genera outputs (béns, serveis, salaris, dividends, impostos, externalitats). El <strong>feedback</strong> (informació de retorn del mercat: vendes, queixes, competència) permet l'adaptació contínua.
                    </p>
                    <p>
                        Els <strong>subsistemes</strong> funcionals de l'empresa són: producció/operacions, comercial/màrqueting, financer, recursos humans, I+D/innovació, i direcció/administració. La <strong>sinergia</strong> (el tot és més que la suma de les parts) és la característica fonamental del sistema empresa.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Funcions de l'empresa" icon="📘">
                <TheoryBlock title="3.1. Funcions econòmiques" color="rose">
                    <p>
                        <strong>1. Funció de producció:</strong> transformar inputs en outputs amb la major eficiència possible (minimitzar costos per a un nivell de producció donat, o maximitzar la producció per a un nivell de costos donat).<br/>
                        <strong>2. Funció de creació de valor:</strong> l'empresa crea valor quan el preu que els consumidors estan disposats a pagar pels seus productes supera el cost dels recursos utilitzats. El <strong>valor afegit</strong> = Producció − Consums intermedis.<br/>
                        <strong>3. Funció de coordinació de factors:</strong> l'empresa organitza i coordina treball, capital i tecnologia de manera més eficient que el mercat (Coase).<br/>
                        <strong>4. Funció d'assumpció de risc:</strong> l'empresari avança els factors productius (paga salaris, compra matèries primeres, inverteix en maquinària) abans de conéixer si el producte es vendrà i a quin preu. Assumeix el risc de pèrdua (Knight).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Funcions socials" color="red">
                    <p>
                        <strong>1. Creació d'ocupació:</strong> les empreses són la principal font d'ocupació a les economies de mercat.<br/>
                        <strong>2. Generació i distribució de renda:</strong> l'empresa distribueix la renda generada entre els factors: salaris (treballadors), interessos (prestadors), beneficis (propietaris/accionistes), impostos (Estat), amortitzacions (reposició de capital).<br/>
                        <strong>3. Motor d'innovació:</strong> l'empresa és el principal agent d'innovació (Schumpeter): introdueix nous productes, processos i models de negoci que transformen l'economia.<br/>
                        <strong>4. Desenvolupament del territori:</strong> les empreses fixen població, generen infraestructures i dinamitzen l'entorn local.<br/>
                        <strong>5. Responsabilitat social corporativa (RSC):</strong> l'empresa contemporània assumeix compromisos amb els seus <strong>stakeholders</strong> (grups d'interés: treballadors, clients, proveïdors, comunitat, medi ambient) més enllà de la maximització del benefici.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Classificació de les empreses" icon="📘">
                <TheoryBlock title="4.1. Segons la forma jurídica" color="rose">
                    <p>
                        <strong>Empresari individual (autònom):</strong> persona física que exerceix l'activitat en nom propi, amb responsabilitat il·limitada.<br/>
                        <strong>Societat Limitada (SL/SRL):</strong> capital mínim 1 € (després de la Llei Crea y Crece, 2022), responsabilitat limitada al capital aportat, mínim 1 soci. La forma més comuna a Espanya (més d'1,2 milions de SL).<br/>
                        <strong>Societat Anònima (SA):</strong> capital mínim 60.000 €, dividit en accions. Pot cotitzar en Borsa. Adequada per a grans empreses.<br/>
                        <strong>Societat Cooperativa:</strong> propietat col·lectiva, gestió democràtica (un soci = un vot), repartiment d'excedents segons l'activitat cooperativitzada. Exemple: Mondragón (major grup cooperatiu del món).<br/>
                        <strong>Altres:</strong> Societat Laboral (majoria del capital en mans dels treballadors), Societat Comanditària, Comunitat de Béns, Emprenedor de Responsabilitat Limitada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Segons la mida" color="red">
                    <p>
                        La classificació de la UE (Recomanació 2003/361/CE) segons nombre de treballadors, volum de negoci i balanç total:
                    </p>
                    <p>
                        <strong>Microempresa:</strong> &lt;10 treballadors i facturació ≤2 M€. El 93 % de les empreses espanyoles.<br/>
                        <strong>Petita empresa:</strong> &lt;50 treballadors i facturació ≤10 M€.<br/>
                        <strong>Mitjana empresa:</strong> &lt;250 treballadors i facturació ≤50 M€.<br/>
                        <strong>Gran empresa:</strong> ≥250 treballadors o facturació &gt;50 M€.
                    </p>
                    <p>
                        A Espanya, les <strong>pimes</strong> (micro + petites + mitjanes) representen el 99,8 % del teixit empresarial i generen el 62 % de l'ocupació. Tanmateix, les grans empreses (0,2 %) generen el 38 % de l'ocupació i concentren la major part de les exportacions, la inversió en I+D i la productivitat.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Segons altres criteris" color="rose">
                    <p>
                        <strong>Segons la propietat del capital:</strong> privades, públiques (Estat com a accionista majoritari: Correos, Paradores, AENA parcialment), mixtes.<br/>
                        <strong>Segons el sector d'activitat:</strong> primari (agricultura, pesca), secundari (indústria, construcció), terciari (serveis), quaternari (I+D, TIC, consultoria).<br/>
                        <strong>Segons l'àmbit geogràfic:</strong> locals, regionals, nacionals, multinacionals/transnacionals.<br/>
                        <strong>Segons el grau d'integració:</strong> empresa individual, grup empresarial (holding), clúster, xarxa empresarial, franquícia.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. L'empresari i l'emprenedoria" icon="📘">
                <TheoryBlock title="5.1. Evolució del concepte d'empresari" color="rose">
                    <p>
                        <strong>Cantillon (1755):</strong> primer teòric de l'empresari — el que compra a preus certs i ven a preus incerts (assumpció de risc).<br/>
                        <strong>Say (1803):</strong> l'empresari com a coordinador dels factors de producció.<br/>
                        <strong>Knight (1921):</strong> empresari = prenedor de decisions sota incertesa; el benefici és la recompensa per assumir risc no assegurable.<br/>
                        <strong>Schumpeter (1912):</strong> empresari innovador. Motor de la destrucció creativa.<br/>
                        <strong>Kirzner (1973):</strong> empresari com a descobridor d'oportunitats de benefici no explotades (alertness).<br/>
                        <strong>Empresari actual:</strong> líder, estrateg, innovador, gestor d'equips, comunicador. Separació propietat-control (Berle i Means, 1932): a les grans empreses, els propietaris (accionistes) deleguen la gestió en directius professionals.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Emprenedoria i ecosistema emprenedor" color="red">
                    <p>
                        L'<strong>emprenedoria</strong> és el procés de crear, desenvolupar i gestionar una nova empresa o projecte. L'ecosistema emprenedor inclou: accés a finançament (business angels, capital risc, crowdfunding, préstecs ICO), formació (universitats, escoles de negocis, FP), marcs regulatoris (Llei de Startups 2022: incentius fiscals, visat de nòmada digital, stock options), incubadores i acceleradores, cultura emprenedora i xarxes de suport.
                    </p>
                    <p>
                        Espanya ha millorat el seu ecosistema emprenedor: Barcelona i Madrid són hubs de startups reconeguts a Europa (Glovo, Cabify, Wallbox, Typeform, Factorial). Tanmateix, la taxa d'activitat emprenedora primerenca (TEA) a Espanya (~6 %, segons GEM) continua per davall de la mitjana de les economies avançades (~10 %).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Este tema és el punt de partida d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022), connectant amb CE1 (l'empresa com a sistema), CE2 (anàlisi de l'entorn) i els continguts transversals d'emprenedoria i educació financera. Contribueix a les competències <strong>CE</strong> (comprensió de la iniciativa empresarial, emprenedoria), <strong>CC</strong> (responsabilitat social, stakeholders), <strong>STEM</strong> (anàlisi quantitativa de dades empresarials) i <strong>CPSAA</strong> (lideratge, treball en equip, presa de decisions). La Llei de Startups (2022) i l'ecosistema emprenedor espanyol ofereixen connexions amb l'actualitat.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="rose">
                    <p>
                        L'empresa és la unitat econòmica que combina factors productius per a crear béns i serveis amb ànim de benefici. La teoria ha evolucionat des de la «caixa negra» neoclàssica fins als enfocaments de costos de transacció (Coase), innovació (Schumpeter), agència (Jensen-Meckling) i recursos i capacitats (Penrose-Barney). Els seus elements són humans, materials, financers i intangibles, i funciona com a sistema obert amb subsistemes interrelacionats. Les seues funcions són econòmiques (producció, valor afegit, coordinació, risc) i socials (ocupació, renda, innovació, RSC). Es classifica per forma jurídica (SL, SA, cooperativa), mida (micro/pime/gran empresa — 99,8 % són pimes), propietat, sector i àmbit. El concepte d'empresari ha evolucionat des de Cantillon (risc) i Schumpeter (innovació) fins a l'empresari contemporani i l'ecosistema emprenedor (Llei de Startups 2022).
                    </p>
                </TheoryBlock>

                    </p>
                    <p>
                        <strong>Entorn general (macroentorn):</strong> factors que afecten totes les empreses d'una economia, independentment del sector. Són poc controlables per l'empresa individual.<br/>
                        <strong>Entorn específic (microentorn o entorn competitiu):</strong> factors que afecten específicament les empreses d'un sector o indústria concret. L'empresa pot influir-hi parcialment.
                    </p>

                <TheoryBlock title="1.2. Característiques de l'entorn actual" color="red">
                    <p>
                        L'entorn contemporani es caracteritza per: <strong>complexitat</strong> (múltiples variables interrelacionades), <strong>dinamisme</strong> (canvis ràpids i imprevisibles), <strong>incertesa</strong> (dificultat per a preveure el futur), <strong>globalització</strong> (interdependència de mercats) i <strong>disrupció tecnològica</strong> (intel·ligència artificial, digitalització, plataformes). L'acrònim <strong>VUCA</strong> (Volatilitat, Incertesa, Complexitat, Ambigüitat) descriu este entorn.

            <Card title="2. Anàlisi de l'entorn general: PESTEL" icon="📘">

                    </p>
                    <p>
                        <strong>P — Polític:</strong> estabilitat política, política fiscal, regulació laboral, política comercial, subvencions, política industrial, legislació de competència, protecció al consumidor.<br/>
                        <strong>E — Econòmic:</strong> cicle econòmic (expansió/recessió), tipus d'interés, inflació, tipus de canvi, PIB, nivell d'ocupació/desocupació, renda disponible, distribució de la renda, política monetària del BCE.<br/>
                        <strong>S — Social/Sociocultural:</strong> demografia (envelliment, migració, urbanització), valors i actituds (sostenibilitat, igualtat, conciliació), estils de vida, nivell educatiu, distribució de la renda, moviments socials.<br/>
                        <strong>T — Tecnològic:</strong> innovació tecnològica, I+D, digitalització, intel·ligència artificial, automatització, comerç electrònic, ciberseguretat, protecció de dades, tecnologies disruptives.<br/>
                        <strong>E — Ecològic/Mediambiental:</strong> canvi climàtic, regulació ambiental (emissions, residus), economia circular, energies renovables, escassetat de recursos, consciència ecològica del consumidor, taxonomia verda de la UE.<br/>
                        <strong>L — Legal:</strong> legislació mercantil, protecció de dades (RGPD), propietat intel·lectual, normativa de seguretat i higiene, legislació fiscal, normativa sectorial (alimentària, farmacèutica, financera).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Aplicació del PESTEL" color="red">
                    <p>
                        L'anàlisi PESTEL no és una llista exhaustiva sinó una <strong>ferramenta de reflexió estratègica</strong>: es tracta d'identificar els factors del macroentorn que són <strong>més rellevants</strong> per a l'empresa o sector concret, valorar si representen <strong>oportunitats o amenaces</strong>, i anticipar la seua evolució probable. Exemple: per a una empresa d'energies renovables, els factors ecològics (regulació verda), tecnològics (eficiència de panells solars) i polítics (subvencions) seran més determinants que per a una empresa tèxtil.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Anàlisi de l'entorn específic: les cinc forces de Porter" icon="📘">
                <TheoryBlock title="3.1. El model de les cinc forces (1980)" color="rose">
                    <p>
                        <strong>Michael Porter</strong> va proposar a <em>Competitive Strategy</em> (1980) un model per a analitzar l'<strong>estructura competitiva d'un sector</strong> i determinar el seu atractiu (rendibilitat potencial). Les cinc forces són:
                    </p>
                    <p>
                        <strong>1. Rivalitat entre competidors existents:</strong> intensitat de la competència entre les empreses que ja operen al sector. Depén de: nombre i equilibri de competidors, creixement del sector (en sectors madurs o en declivi, la rivalitat és major), diferenciació del producte, costos fixos (sectors amb alts costos fixos tendeixen a guerres de preus), barreres d'eixida.
                    </p>
                    <p>
                        <strong>2. Amenaça de nous entrants:</strong> risc que noves empreses s'incorporen al sector, atretes per la seua rendibilitat. Depén de les <strong>barreres d'entrada</strong>: economies d'escala, inversió inicial, accés a canals de distribució, diferenciació de marca, regulació, patents, costos de canvi per al client.
                    </p>
                    <p>
                        <strong>3. Amenaça de productes substitutius:</strong> béns o serveis d'altres sectors que satisfan la mateixa necessitat (p. ex.: el tren substitueix l'avió en distàncies mitjanes; l'streaming substitueix el cinema). Com més substituts i millor la seua relació qualitat-preu, menor la rendibilitat del sector.
                    </p>
                    <p>
                        <strong>4. Poder de negociació dels proveïdors:</strong> capacitat dels proveïdors per a imposar condicions (preus, qualitat, terminis). Major poder quan: pocs proveïdors, inputs diferenciats o sense substituts, alt cost de canvi de proveïdor, amenaça d'integració vertical cap endavant.
                    </p>
                    <p>
                        <strong>5. Poder de negociació dels clients:</strong> capacitat dels clients per a pressionar a la baixa els preus o exigir major qualitat. Major poder quan: pocs clients grans, productes estandarditzats, baix cost de canvi, alta informació del client, amenaça d'integració vertical cap enrere.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Sexta força: complementadors" color="red">
                    <p>
                        Brandenburger i Nalebuff (1996) van afegir una sexta força: els <strong>complementadors</strong> — empreses els productes o serveis de les quals augmenten el valor del producte de l'empresa analitzada (p. ex.: les apps complementen els smartphones; els videojocs complementen les consoles). Un sector amb forts complementadors pot ser més atractiu.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Anàlisi intern: recursos, capacitats i cadena de valor" icon="📘">
                <TheoryBlock title="4.1. L'anàlisi VRIO" color="rose">
                    <p>
                        El model <strong>VRIO</strong> (Barney, 1991) avalua els recursos i capacitats interns de l'empresa per a determinar si generen avantatge competitiu sostenible. Un recurs o capacitat ha de complir quatre condicions:
                    </p>
                    <p>
                        <strong>V — Valuós:</strong> permet explotar oportunitats o neutralitzar amenaces?<br/>
                        <strong>R — Rar:</strong> el posseeixen pocs competidors?<br/>
                        <strong>I — Inimitable:</strong> és difícil o costós de copiar? (per història única, complexitat social, ambigüitat causal, patents).<br/>
                        <strong>O — Organitzat:</strong> l'empresa està organitzada per a explotar el recurs? (estructura, processos, incentius).
                    </p>
                    <p>
                        Si les quatre condicions es compleixen → <strong>avantatge competitiu sostenible</strong>. Si en falla alguna → avantatge temporal, paritat o desavantatge.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La cadena de valor (Porter, 1985)" color="red">
                    <p>
                        La <strong>cadena de valor</strong> descompon les activitats de l'empresa en activitats <strong>primàries</strong> i de <strong>suport</strong> per a identificar on es crea (o destrueix) valor:
                    </p>
                    <p>
                        <strong>Activitats primàries:</strong> logística interna (recepció, emmagatzematge), operacions (fabricació, muntatge), logística externa (distribució), màrqueting i vendes, servei postvenda.<br/>
                        <strong>Activitats de suport:</strong> infraestructura de l'empresa (direcció, finances, planificació), gestió de recursos humans, desenvolupament tecnològic (I+D), aprovisionament (compres).
                    </p>
                    <p>
                        El <strong>marge</strong> és la diferència entre el valor total generat i el cost total de les activitats. L'avantatge competitiu sorgeix quan l'empresa realitza les activitats estratègicament rellevants de manera més eficient (lideratge en costos) o diferenciada (diferenciació) que els seus competidors.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Ferramentes integradores: DAFO i estratègies" icon="📘">
                <TheoryBlock title="5.1. L'anàlisi DAFO (SWOT)" color="rose">
                    <p>
                        L'anàlisi <strong>DAFO</strong> (Debilitats, Amenaces, Fortaleses, Oportunitats) integra l'anàlisi extern (oportunitats i amenaces de l'entorn general i específic) amb l'anàlisi intern (fortaleses i debilitats dels recursos i capacitats):
                    </p>
                    <p>
                        <strong>Fortaleses (intern +):</strong> avantatges competitius, recursos valuosos, marca reconeguda, tecnologia pròpia, equip talentós.<br/>
                        <strong>Debilitats (intern −):</strong> carències de recursos, falta de finançament, tecnologia obsoleta, baixa productivitat, marca feble.<br/>
                        <strong>Oportunitats (extern +):</strong> creixement del mercat, canvi regulatori favorable, nova tecnologia aprofitable, tendència social afí.<br/>
                        <strong>Amenaces (extern −):</strong> nova competència, recessió econòmica, regulació adversa, canvi tecnològic disruptiu, pujada de costos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Del DAFO a estratègies" color="red">
                    <p>
                        La matriu DAFO no és sols un diagnòstic, sinó una ferramenta per a formular <strong>estratègies</strong>:
                    </p>
                    <p>
                        <strong>FO (maxi-maxi):</strong> usar fortaleses per a aprofitar oportunitats (estratègies ofensives).<br/>
                        <strong>FA (maxi-mini):</strong> usar fortaleses per a contrarestar amenaces (estratègies defensives).<br/>
                        <strong>DO (mini-maxi):</strong> superar debilitats per a aprofitar oportunitats (estratègies de reorientació).<br/>
                        <strong>DA (mini-mini):</strong> minimitzar debilitats i evitar amenaces (estratègies de supervivència).
                    </p>
                </TheoryBlock>
            </Card>

                <TheoryBlock title="1.2. Factors de localització industrial" color="red">
                    <p>
                        La teoria clàssica de localització industrial (<strong>Alfred Weber</strong>, 1909) buscava minimitzar els costos de transport (de matèries primeres i del producte acabat) i de mà d'obra. Els factors contemporanis amplien esta perspectiva:
                    </p>
                    <p>
                        <strong>Proximitat a matèries primeres:</strong> rellevant per a indústries extractives, agroalimentària, cimentera.<br/>
                        <strong>Proximitat al mercat:</strong> redueix costos de transport del producte final i facilita el contacte amb clients (especialment en serveis).<br/>
                        <strong>Disponibilitat i cost de mà d'obra:</strong> mà d'obra qualificada (alta tecnologia), abundant i de baix cost (indústria tèxtil, assemblatge).<br/>
                        <strong>Infraestructures de transport i comunicacions:</strong> autopistes, ports, aeroports, AVE, fibra òptica, connectivitat digital.<br/>
                        <strong>Cost i disponibilitat de sòl industrial:</strong> polígons industrials, parcs tecnològics, preus del sòl.<br/>
                        <strong>Marc legal i fiscal:</strong> incentius fiscals (zones franques, ZEC de Canàries), regulació ambiental, agilitat administrativa, seguretat jurídica.<br/>
                        <strong>Economies d'aglomeració:</strong> beneficis d'ubicar-se al costat d'empreses complementàries (clústers), proveïdors especialitzats, centres d'I+D i universitats (Silicon Valley, clúster ceràmic de Castelló, clúster automoció de Catalunya).<br/>
                        <strong>Qualitat de vida:</strong> factor creixent per a atraure talent qualificat: clima, serveis públics, cultura, oci, seguretat.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Factors de localització comercial i de serveis" color="rose">
                    <p>
                        Per a empreses comercials i de serveis, els factors clau són:
                    </p>
                    <p>
                        <strong>Proximitat al client:</strong> el factor principal. Visibilitat, accessibilitat, flux de vianants/vehicles.<br/>
                        <strong>Costos del local:</strong> lloguer o compra del local. Hi ha una relació directa entre ubicació premium i cost.<br/>
                        <strong>Complementarietat:</strong> benefici d'ubicar-se al costat de negocis complementaris (centres comercials, zones de restauració).<br/>
                        <strong>Competència:</strong> la proximitat a competidors pot ser positiva (atreu clients que comparen) o negativa (saturació).<br/>
                        <strong>Regulació urbanística:</strong> usos del sòl, llicències, horaris comercials.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. Mètodes de decisió de localització" color="red">
                    <p>
                        <strong>Mètode dels factors ponderats:</strong> s'identifiquen els factors rellevants, s'assigna un pes a cadascun (segons la seua importància) i es puntua cada alternativa de localització. L'alternativa amb major puntuació ponderada és l'elegida.<br/>
                        <strong>Mètode del punt mort de localització:</strong> compara els costos fixos i variables de cada alternativa per a diferents nivells de producció. La localització òptima depén del volum previst.<br/>
                        <strong>Mètode del centre de gravetat:</strong> minimitza els costos de transport considerant la ubicació de proveïdors i clients, ponderats pel volum de mercaderia.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. La dimensió empresarial" icon="📘">
                <TheoryBlock title="2.1. Concepte i mesura" color="rose">
                    <p>
                        La <strong>dimensió</strong> (o mida) de l'empresa es refereix a la seua capacitat productiva i a la seua escala d'operacions. No existeix un indicador únic per a mesurar-la; s'utilitzen diversos criteris:
                    </p>
                    <p>
                        <strong>Nombre de treballadors:</strong> el criteri més comú (classificació UE: micro, petita, mitjana, gran).<br/>
                        <strong>Volum de vendes/facturació:</strong> reflecteix la presència al mercat.<br/>
                        <strong>Actiu total (balanç):</strong> reflecteix el patrimoni invertit.<br/>
                        <strong>Capitalització borsària:</strong> per a empreses cotitzades, reflecteix el valor de mercat.<br/>
                        <strong>Volum de producció:</strong> especialment en indústria (tones, unitats).<br/>
                        <strong>Benefici net, recursos propis, quota de mercat:</strong> indicadors complementaris.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. La dimensió òptima i les economies d'escala" color="red">
                    <p>
                        La <strong>dimensió òptima</strong> és aquella que minimitza els costos mitjans a llarg termini (CMLP). Les <strong>economies d'escala</strong> són les reduccions del cost mitjà que s'obtenen en augmentar la producció:
                    </p>
                    <p>
                        <strong>Economies d'escala tècniques:</strong> indivisibilitats (una màquina produeix 1.000 o 10.000 unitats amb costos fixos similars), principi de les dimensions (duplicar la capacitat d'un contenidor no duplica els materials), especialització del treball.<br/>
                        <strong>Economies d'escala comercials:</strong> major poder de negociació amb proveïdors, accés a publicitat massiva, distribució més eficient.<br/>
                        <strong>Economies d'escala financeres:</strong> accés a finançament més barat (major capacitat d'endeutament, accés a mercats de capitals).<br/>
                        <strong>Economies d'escala de gestió:</strong> especialització directiva, sistemes d'informació avançats.
                    </p>
                    <p>
                        Les <strong>deseconomies d'escala</strong> apareixen quan el creixement excessiu genera: burocratització, problemes de coordinació i comunicació, desmotivació, lentitud en la presa de decisions, pèrdua de flexibilitat.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="CMeLP = CT / Q → mínim en la dimensió òptima"
                    desc="Economies d'escala: CMeLP ↓ quan Q ↑. Deseconomies: CMeLP ↑ quan Q ↑↑"
                />
            </Card>

            <Card title="3. El creixement empresarial" icon="📘">
                <TheoryBlock title="3.1. Creixement intern (orgànic)" color="rose">
                    <p>
                        El <strong>creixement intern</strong> consisteix a augmentar la capacitat productiva mitjançant la inversió en nous actius: ampliació d'instal·lacions, compra de maquinària, obertura de nous establiments, contractació de personal, desenvolupament de nous productes. És un creixement gradual, controlable i que preserva la cultura empresarial, però més lent.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Creixement extern (inorgànic)" color="red">
                    <p>
                        El <strong>creixement extern</strong> consisteix a incrementar la dimensió mitjançant la unió amb altres empreses:
                    </p>
                    <p>
                        <strong>Fusió:</strong> dues o més empreses s'uneixen per a formar-ne una de nova (fusió pura: A + B = C) o una absorbeix l'altra (fusió per absorció: A + B = A').<br/>
                        <strong>Adquisició:</strong> compra d'una participació de control en una altra empresa (OPA — Oferta Pública d'Adquisició — en empreses cotitzades).<br/>
                        <strong>Joint venture (empresa conjunta):</strong> dues empreses creen una tercera per a un projecte específic, compartint riscos i recursos.<br/>
                        <strong>Aliances estratègiques:</strong> acords de cooperació sense crear una nova entitat (acords de distribució, llicències, I+D conjunt).<br/>
                        <strong>Franquícia:</strong> el franquiciador cedeix al franquiciat el dret a explotar la seua marca, know-how i model de negoci a canvi d'un cànon i royalties. Exemple: McDonald's, Zara Home, MRW.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Tipus d'integració" color="rose">
                    <p>
                        <strong>Integració horitzontal:</strong> unió d'empreses del mateix sector i fase productiva (p. ex.: fusió CaixaBank-Bankia). Busca: economies d'escala, major poder de mercat, eliminació de competidors.<br/>
                        <strong>Integració vertical:</strong> unió d'empreses de distintes fases de la cadena de valor. <em>Cap enrere</em> (amb proveïdors: una cadena de supermercats compra granges). <em>Cap endavant</em> (amb distribuïdors: un fabricant obri botigues pròpies — Inditex).<br/>
                        <strong>Diversificació (conglomerat):</strong> creixement cap a sectors no relacionats (p. ex.: Samsung: electrònica, assegurances, construcció naval). Diversifica riscos però dificulta la gestió.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Internacionalització" color="red">
                    <p>
                        La <strong>internacionalització</strong> és una forma de creixement cada vegada més rellevant. Les modalitats, de menor a major compromís, són:
                    </p>
                    <p>
                        <strong>Exportació:</strong> venda de productes en mercats exteriors (directa o a través d'intermediaris).<br/>
                        <strong>Llicències i franquícies internacionals:</strong> cessió de drets d'explotació a empreses locals.<br/>
                        <strong>Joint ventures internacionals:</strong> aliances amb socis locals.<br/>
                        <strong>Inversió directa (filials):</strong> creació o adquisició d'empreses en altres països. Màxim compromís i control. Exemple: Santander al Regne Unit, BBVA a Mèxic, Inditex amb botigues en 90+ països.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Les pimes a l'economia espanyola" icon="📘">
                <TheoryBlock title="4.1. Estructura empresarial espanyola" color="rose">
                    <p>
                        El teixit empresarial espanyol està dominat per <strong>microempreses i pimes</strong>: dels 3,3 milions d'empreses registrades al DIRCE (INE, 2024), el 55 % són empresaris individuals sense assalariats, el 38 % té entre 1 i 9 treballadors, i només el 0,13 % té més de 250 treballadors. El <strong>99,8 % són pimes</strong> (&lt;250 treballadors), que generen el 62 % de l'ocupació i el 53 % del valor afegit.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Avantatges i inconvenients de les pimes" color="red">
                    <p>
                        <strong>Avantatges:</strong> flexibilitat i rapidesa d'adaptació, proximitat al client, relacions laborals més directes, capacitat d'especialització en nínxols, menor burocràcia interna, arrelament local.<br/>
                        <strong>Inconvenients:</strong> menor poder de negociació (amb proveïdors, bancs, grans clients), dificultat d'accés a finançament (major dependència bancària), menor inversió en I+D i internacionalització, menor capacitat d'atraure talent qualificat, economies d'escala limitades, menor productivitat mitjana.
                    </p>
                    <p>
                        Les polítiques de suport a les pimes inclouen: línies de finançament (ICO, ENISA), incentius fiscals (tipus reduït d'IS per a pimes), programes de digitalització (Kit Digital), internacionalització (ICEX), simplificació administrativa (Llei Crea y Crece 2022, que va reduir el capital mínim de la SL a 1 €) i formació empresarial.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. L'empresa multinacional i la globalització" icon="📘">
                <TheoryBlock title="5.1. L'empresa multinacional" color="rose">
                    <p>
                        Una <strong>empresa multinacional</strong> (o transnacional) és aquella que realitza activitats productives o comercials en dos o més països, controlant filials o subsidiàries des d'una seu central. Les multinacionals dominen el comerç mundial (representen més del 60 % del comerç internacional i empren més de 80 milions de persones). Espanya compta amb multinacionals de referència: Santander, BBVA, Telefónica, Iberdrola, Inditex, Ferrovial, Repsol, Grifols.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Avantatges i inconvenients de les multinacionals" color="red">
                    <p>
                        <strong>Avantatges:</strong> economies d'escala globals, diversificació geogràfica de riscos, accés a recursos i mercats mundials, transferència interna de coneixement i tecnologia, poder de negociació.<br/>
                        <strong>Inconvenients/crítiques:</strong> deslocalització (trasllat de producció a països amb menors costos, amb pèrdua d'ocupació al país d'origen), elusió fiscal (ús de jurisdiccions de baixa tributació), impacte ambiental, influència política excessiva, homogeneïtzació cultural. La <strong>responsabilitat fiscal i social de les multinacionals</strong> és un debat central (acord OCDE de tributació mínima del 15 %, Pilar 2, 2024).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Este tema connecta amb CE1, CE4 i CE6 d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022): localització, dimensió, creixement i estructura del teixit empresarial espanyol. Contribueix a les competències <strong>CE</strong> (emprenedoria: on ubicar un negoci, com créixer), <strong>STEM</strong> (mètodes quantitatius de localització: factors ponderats, punt mort), <strong>CC</strong> (debats sobre multinacionals, deslocalització, pimes i ocupació) i <strong>CPSAA</strong> (presa de decisions estratègiques sota incertesa).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="rose">
                    <p>
                        La localització empresarial depén de factors clàssics (Weber: costos de transport) i contemporanis (infraestructures, fiscalitat, clústers, talent, qualitat de vida). Els mètodes de decisió inclouen factors ponderats, punt mort i centre de gravetat. La dimensió es mesura per treballadors, vendes, actius o capitalització; la dimensió òptima minimitza el CMeLP gràcies a les economies d'escala (tècniques, comercials, financeres, de gestió), limitades per les deseconomies (burocràcia, rigidesa). El creixement pot ser intern (orgànic) o extern (fusions, adquisicions, joint ventures, franquícies), horitzontal, vertical o diversificat. La internacionalització avança des de l'exportació fins a la inversió directa. Les pimes (99,8 % del teixit espanyol) aporten flexibilitat però afronten limitacions d'escala, finançament i innovació. Les multinacionals dominen el comerç mundial però generen debats sobre deslocalització, fiscalitat i responsabilitat social.
                    </p>
                </TheoryBlock>
            </Card>

    const Tema52Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La <strong>funció de producció</strong> i l'<strong>anàlisi de costos</strong> constitueixen el nucli de l'economia de la producció empresarial: determinen quant produir, com produir (amb quina combinació de factors) i a quin preu mínim pot oferir-se el producte. El <strong>punt mort</strong> (o llindar de rendibilitat) és la ferramenta que vincula costos, preus i volum de producció per a determinar a partir de quin nivell l'empresa obté beneficis.

                    <p>
                        Este tema és central en <strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022), CE4 (funció productiva i anàlisi de costos), i és un dels més freqüents en els <strong>supòsits pràctics d'oposicions</strong>. El present tema s'estructura en cinc epígrafs: la funció de producció, productivitat, tipus de costos, el punt mort i decisions de producció.
                    </p>

            <Card title="1. La funció de producció" icon="📘">
                <TheoryBlock title="1.1. Concepte" color="rose">
                    <p>
                        La <strong>funció de producció</strong> expressa la relació tècnica entre la quantitat de factors productius utilitzats (inputs: treball L, capital K, matèries primeres, tecnologia) i la quantitat màxima de producte obtingut (output Q):
                    </p>
                    <p>
                        <strong>Q = f(L, K, T, ...)</strong>
                    </p>
                    <p>
                        La funció de producció reflecteix la <strong>tecnologia</strong> disponible: per a una tecnologia donada, indica la producció màxima assolible amb cada combinació de factors. Un avanç tecnològic desplaça la funció de producció cap amunt (més producció amb els mateixos inputs).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Curt termini: producte total, mitjà i marginal" color="red">
                    <p>
                        A <strong>curt termini</strong>, almenys un factor és fix (generalment el capital: maquinària, instal·lacions) i un altre és variable (treball). En augmentar el factor variable:
                    </p>
                    <p>
                        <strong>Producte Total (PT):</strong> quantitat total produïda.<br/>
                        <strong>Producte Mitjà (PMe = PT / L):</strong> producció per unitat de factor variable (productivitat mitjana del treball).<br/>
                        <strong>Producte Marginal (PMg = ΔPT / ΔL):</strong> increment de producció en afegir una unitat addicional de factor variable.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Llei de rendiments marginals decreixents" color="rose">
                    <p>
                        A curt termini, en afegir unitats successives d'un factor variable (treball) mantenint fix l'altre (capital), arriba un punt a partir del qual el <strong>producte marginal</strong> del factor variable comença a <strong>disminuir</strong>. Aquesta és la <strong>llei de rendiments marginals decreixents</strong> (David Ricardo): cada treballador addicional aporta menys producció addicional perquè el capital fix es comparteix entre més treballadors.
                    </p>
                    <p>
                        <strong>Fases:</strong> 1) Rendiments marginals creixents (PMg ↑): el factor variable es combina eficientment amb el fix. 2) Rendiments marginals decreixents (PMg ↓ però PMg &gt; 0): la producció creix però a ritme decreixent. 3) Rendiments negatius (PMg &lt; 0): la producció total disminueix (congestió). L'empresa opera en la fase 2.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Q = f(L, K) | PMe = PT / L | PMg = ΔPT / ΔL"

            <Card title="2. La productivitat" icon="📘">

                    </p>
                    <p>
                        <strong>Productivitat del treball:</strong> PT / L (unitats produïdes per treballador o per hora de treball). És l'indicador més utilitzat.<br/>
                        <strong>Productivitat del capital:</strong> PT / K.<br/>
                        <strong>Productivitat total dels factors (PTF):</strong> producció / combinació ponderada de tots els inputs. Mesura l'eficiència global del sistema productiu i s'associa al <strong>progrés tecnològic i organitzatiu</strong> (residu de Solow).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Factors determinants de la productivitat" color="red">
                    <p>
                        <strong>Inversió en capital físic:</strong> maquinària més avançada, automatització.<br/>
                        <strong>Capital humà:</strong> formació, experiència, habilitats dels treballadors.<br/>
                        <strong>Tecnologia i innovació:</strong> I+D, digitalització, nous processos productius.<br/>
                        <strong>Organització i gestió:</strong> mètodes de producció eficients (lean manufacturing, just-in-time, kaizen), lideratge, motivació.<br/>
                        <strong>Infraestructures:</strong> transport, telecomunicacions, energia.<br/>
                        <strong>Marc institucional:</strong> seguretat jurídica, regulació eficient, competència.
                    </p>
                    <p>
                        La <strong>productivitat és el determinant principal del nivell de vida</strong> a llarg termini (Krugman: «la productivitat no ho és tot, però a llarg termini ho és quasi tot»). Espanya té un problema de productivitat: la PTF ha crescut menys que la mitjana de la UE des dels anys 90.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Tipus de costos" icon="📘">
                <TheoryBlock title="3.1. Costos fixos, variables i totals" color="rose">
                    <p>
                        <strong>Costos fixos (CF):</strong> no varien amb el volum de producció a curt termini. Exemples: lloguer del local, amortització de maquinària, assegurances, salaris de personal fix, interessos de préstecs. <em>Existeixen encara que la producció siga zero.</em><br/>
                        <strong>Costos variables (CV):</strong> varien proporcionalment (o no) amb el volum de producció. Exemples: matèries primeres, energia consumida en la fabricació, mà d'obra directa (si es contracta per producció), comissions de venda.<br/>
                        <strong>Cost total (CT):</strong> CT = CF + CV
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Costos mitjans i cost marginal" color="red">
                    <p>
                        <strong>Cost fix mitjà (CFMe):</strong> CF / Q. Disminueix contínuament en augmentar Q (el cost fix es reparteix entre més unitats).<br/>
                        <strong>Cost variable mitjà (CVMe):</strong> CV / Q. Sol tindre forma d'U (primer disminueix per l'especialització, després augmenta pels rendiments decreixents).<br/>
                        <strong>Cost total mitjà (CTMe):</strong> CT / Q = CFMe + CVMe. Forma d'U.<br/>
                        <strong>Cost marginal (CMg):</strong> ΔCT / ΔQ = ΔCV / ΔQ. És el cost addicional de produir una unitat més. Forma d'U. <em>El CMg talla el CTMe i el CVMe en els seus punts mínims.</em>
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Costos directes i indirectes" color="rose">
                    <p>
                        <strong>Costos directes:</strong> imputables directament a un producte o servei (matèria primera, mà d'obra directa).<br/>
                        <strong>Costos indirectes:</strong> compartits entre diversos productes o serveis (lloguer de la fàbrica, direcció general, neteja). Requereixen criteris de repartiment (imputació).
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="CT = CF + CV | CTMe = CT/Q | CMg = ΔCT/ΔQ"
                    desc="El CMg talla el CTMe i el CVMe en els seus mínims"
                />
            </Card>

            <Card title="4. El punt mort (llindar de rendibilitat)" icon="📘">
                <TheoryBlock title="4.1. Concepte" color="rose">
                    <p>
                        El <strong>punt mort</strong> (break-even point), també anomenat <strong>llindar de rendibilitat</strong> o <strong>punt d'equilibri</strong>, és el nivell de producció i vendes en què els <strong>ingressos totals igualen els costos totals</strong>: IT = CT. A partir d'eixe punt, l'empresa obté beneficis; per davall, incorre en pèrdues.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Càlcul" color="red">
                    <p>
                        Supòsits simplificadors: preu de venda unitari (p) constant, cost variable unitari (cv) constant, costos fixos (CF) donats.
                    </p>
                    <p>
                        <strong>IT = CT</strong><br/>
                        p × Q = CF + cv × Q<br/>
                        p × Q − cv × Q = CF<br/>
                        Q × (p − cv) = CF<br/>
                        <strong>Q* = CF / (p − cv)</strong>
                    </p>
                    <p>
                        On <strong>(p − cv)</strong> és el <strong>marge de contribució unitari</strong>: la part del preu de cada unitat venuda que contribueix a cobrir els costos fixos i, una vegada coberts, a generar benefici.
                    </p>
                    <p>
                        <strong>Exemple:</strong> CF = 100.000 €, p = 50 €/ud, cv = 30 €/ud.<br/>
                        Q* = 100.000 / (50 − 30) = 100.000 / 20 = <strong>5.000 unitats</strong>.<br/>
                        Ingressos en el punt mort: 5.000 × 50 = 250.000 €.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Representació gràfica i interpretació" color="rose">
                    <p>
                        Al gràfic: l'eix horitzontal representa les unitats produïdes i venudes (Q), i l'eix vertical els euros (€). La línia d'<strong>ingressos totals</strong> (IT = p × Q) parteix de l'origen amb pendent p. La línia de <strong>costos totals</strong> (CT = CF + cv × Q) parteix de CF amb pendent cv. Es creuen en Q*: a l'esquerra hi ha pèrdues, a la dreta beneficis.
                    </p>
                    <p>
                        <strong>Utilitat del punt mort:</strong> determinar el volum mínim de vendes per a no perdre diners, avaluar la viabilitat d'un projecte, analitzar l'impacte de canvis en preus, costos fixos o costos variables, comparar alternatives productives.
                    </p>
                    <p>
                        <strong>Limitacions:</strong> suposa preu i cost variable constants (en la realitat poden variar amb el volum), no considera la variació d'estocs, assumeix un sol producte (o un mix constant), és un model estàtic (no considera el factor temps ni la incertesa).
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Q* = CF / (p − cv)"
                    desc="Punt mort: volum on IT = CT. Marge contribució = p − cv"
                />
            </Card>

            <Card title="5. Decisions de producció i eficiència" icon="📘">
                <TheoryBlock title="5.1. Eficiència tècnica i econòmica" color="rose">
                    <p>
                        <strong>Eficiència tècnica:</strong> un procés és tècnicament eficient si no existeix un altre que produïsca la mateixa quantitat amb menys d'algun factor sense utilitzar més d'un altre. Dels mètodes tècnicament eficients, l'empresa tria el que és <strong>econòmicament eficient</strong>: el que minimitza el cost total donats els preus dels factors.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Produir o comprar (make or buy)" color="red">
                    <p>
                        L'empresa decideix si fabricar un component internament o comprar-lo a un proveïdor comparant: cost de fabricació interna vs. preu de compra externa, qualitat i control, dependència del proveïdor, flexibilitat, costos de transacció (Coase). Aquesta decisió es vincula amb el concepte d'<strong>integració vertical</strong> i l'<strong>externalització (outsourcing)</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Sistemes de producció" color="rose">
                    <p>
                        <strong>Producció per encàrrec (sota comanda):</strong> es fabrica segons les especificacions del client (construcció, alta costura, maquinària industrial). Alta personalització, costos elevats.<br/>
                        <strong>Producció per lots:</strong> es fabriquen quantitats limitades de productes diferents (fleca, tèxtil, electrònica). Flexibilitat mitjana.<br/>
                        <strong>Producció en massa (cadena de muntatge):</strong> grans volums de productes estandarditzats (automoció, electrodomèstics). Economies d'escala, menor cost unitari.<br/>
                        <strong>Producció contínua (procés):</strong> producció ininterrompuda de productes homogenis (refinament de petroli, siderúrgia, ciment, indústria química). Màximes economies d'escala.<br/>
                        <strong>Producció just-in-time (JIT):</strong> sistema de Toyota. Produir només el necessari, en el moment necessari, en la quantitat necessària. Minimitza inventaris, redueix malbarataments (lean manufacturing).
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet">
                    <p>
                        Aquest tema és el més quantitatiu d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022), directament vinculat a CE4 (funció productiva, anàlisi de costos, punt mort). És fonamental per als <strong>supòsits pràctics</strong> d'oposicions (càlculs de costos, productivitat, punt mort). Contribueix a les competències <strong>STEM</strong> (càlcul, representació gràfica, anàlisi quantitativa), <strong>CE</strong> (anàlisi de viabilitat econòmica d'un projecte), <strong>CPSAA</strong> (presa de decisions basades en dades) i <strong>CCL</strong> (interpretació de comptes de costos i informes de producció).
                    </p>
                </TheoryBlock>

            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="rose">
                    <p>
                        La funció de producció Q = f(L, K) expressa la relació tècnica entre inputs i output. A curt termini regeix la llei de rendiments marginals decreixents (PMg ↓). La productivitat (PT/L, PTF) és el determinant clau del nivell de vida. Els costos es classifiquen en fixos (CF, no varien amb Q) i variables (CV), amb derivats: CTMe, CVMe, CFMe i CMg (el CMg talla els mitjans en el seu mínim). El punt mort Q* = CF / (p − cv) indica el volum on IT = CT: per davall, pèrdues; per damunt, beneficis. El marge de contribució (p − cv) és la clau. L'eficiència és tècnica (mínim de factors) i econòmica (mínim cost). Els sistemes de producció van de l'encàrrec a la producció contínua, amb el JIT (Toyota) com a model d'eficiència. Aquest tema és essencial per als supòsits pràctics d'oposicions.
                    </p>
                </TheoryBlock>

            <Card title="1. Principis d'organització" icon="📘">

                </TheoryBlock>
                <TheoryBlock title="1.2. Autoritat, responsabilitat i delegació" color="red">
                    <p><strong>Autoritat:</strong> dret legítim a prendre decisions i donar instruccions. Pot ser <em>lineal</em> (jeràrquica, sobre subordinats directes) o d'<em>staff</em> (assessora, sense autoritat directa sobre la línia).<br/><strong>Responsabilitat:</strong> obligació de respondre per les decisions i resultats.<br/><strong>Delegació:</strong> transferència d'autoritat d'un superior a un subordinat per a realitzar tasques específiques. La delegació <em>no transfereix</em> la responsabilitat última.<br/><strong>Centralització vs. descentralització:</strong> una organització centralitzada concentra la presa de decisions en la cúpula; una descentralitzada delega decisions a nivells inferiors. La tendència actual afavoreix la descentralització (agilitat, motivació, adaptació local).</p>
                </TheoryBlock>
                <TheoryBlock title="1.3. Altres principis" color="rose">
                    <p><strong>Unitat de comandament</strong> (Fayol): cada empleat ha de rebre ordres d'un sol cap.<br/><strong>Àmbit de control (span of control):</strong> nombre de subordinats que un cap pot supervisar eficaçment. Depén de la complexitat de les tasques, la qualificació del personal i els sistemes d'informació. Àmbits amplis → estructures planes; àmbits estrets → estructures altes.<br/><strong>Coordinació:</strong> mecanismes per a integrar les activitats dels diferents departaments (supervisió directa, normes, ajust mutu, comités).</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Organització formal i informal" icon="📘">
                <TheoryBlock title="2.1. Organització formal" color="rose">
                    <p>L'<strong>organització formal</strong> és l'estructura oficialment definida per la direcció: organigrama, manuals de funcions, descripcions de llocs, procediments, normes internes. Defineix «qui fa què, qui mana a qui i com es coordinen».</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Organització informal" color="red">
                    <p>L'<strong>organització informal</strong> sorgeix espontàniament de les relacions socials entre els membres: grups d'amistat, líders naturals (no necessàriament els caps formals), xarxes de comunicació no oficials (rumors, xats), normes de grup no escrites. Els <strong>experiments de Hawthorne</strong> (Elton Mayo, 1927-1932) van demostrar que l'organització informal influeix decisivament en la productivitat i la motivació. La direcció eficaç ha de conéixer i gestionar l'organització informal (no ignorar-la ni reprimir-la).</p>
                </TheoryBlock>
            </Card>
            <Card title="3. Models d'estructura organitzativa" icon="📘">
                <TheoryBlock title="3.1. Estructura lineal (jeràrquica)" color="rose">
                    <p>Basada en el <strong>principi d'unitat de comandament</strong>: cada empleat depén d'un sol cap, formant una cadena jeràrquica clara (militar). <strong>Avantatges:</strong> simplicitat, claredat d'autoritat, disciplina. <strong>Inconvenients:</strong> rigidesa, sobrecàrrega dels directius (que han de dominar totes les funcions), lentitud en la comunicació vertical, falta d'especialització directiva. Adequada per a pimes.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Estructura funcional" color="red">
                    <p>Proposada per <strong>Taylor</strong>: els empleats reben instruccions de diversos caps especialitzats en funcions diferents (producció, comercial, finances, RRHH). <strong>Avantatges:</strong> especialització directiva, accés a experts. <strong>Inconvenients:</strong> viola la unitat de comandament (conflictes entre caps funcionals), dificultat de coordinació. Poc usada en estat pur.</p>
                </TheoryBlock>
                <TheoryBlock title="3.3. Estructura línia-staff" color="rose">
                    <p>Combina l'estructura lineal (autoritat jeràrquica) amb departaments d'<strong>staff</strong> (assessorament sense autoritat directa: gabinet jurídic, consultoria estratègica, I+D, control de qualitat). <strong>Avantatges:</strong> manté la unitat de comandament i afig assessorament especialitzat. <strong>Inconvenients:</strong> possible confusió entre línia i staff, costos addicionals de l'staff. És la més habitual en mitjanes i grans empreses.</p>
                </TheoryBlock>
                <TheoryBlock title="3.4. Estructura divisional" color="red">
                    <p>L'empresa es divideix en <strong>divisions</strong> autònomes (per producte, mercat geogràfic o tipus de client), cadascuna amb les seues funcions pròpies (producció, màrqueting, finances). La direcció central coordina i controla les divisions. <strong>Avantatges:</strong> adaptació al mercat, autonomia, facilitat d'avaluació de resultats per divisió. <strong>Inconvenients:</strong> duplicitat de funcions, costos més alts, possible competència interna. Adequada per a grans empreses diversificades (Inditex: divisions per marca — Zara, Massimo Dutti, Pull&Bear).</p>
                </TheoryBlock>
                <TheoryBlock title="3.5. Estructura matricial" color="rose">
                    <p>Combina la departamentalització funcional amb la divisional (per projecte o producte): cada empleat té <strong>dos caps</strong> (el funcional i el de projecte). <strong>Avantatges:</strong> flexibilitat, ús eficient d'especialistes compartits, orientació a projectes. <strong>Inconvenients:</strong> viola la unitat de comandament, complexitat, possibles conflictes. Habitual en consultoria, enginyeria, I+D i empreses tecnològiques.</p>
                </TheoryBlock>
            </Card>
            <Card title="4. L'organigrama" icon="📘">
                <TheoryBlock title="4.1. Concepte i tipus" color="rose">
                    <p>L'<strong>organigrama</strong> és la representació gràfica de l'estructura organitzativa: mostra els llocs, departaments, relacions d'autoritat i nivells jeràrquics. Tipus: <strong>vertical</strong> (piràmide de dalt a baix, el més habitual), <strong>horitzontal</strong> (d'esquerra a dreta), <strong>circular</strong> (la direcció al centre), <strong>mixt</strong>.</p>
                </TheoryBlock>
            </Card>
            <Card title="5. Noves formes organitzatives" icon="📘">
                <TheoryBlock title="5.1. Tendències actuals" color="rose">
                    <p><strong>Estructures planes (flat):</strong> reducció de nivells jeràrquics, ampliació de l'àmbit de control, major autonomia dels equips. Afavorides per la digitalització (sistemes d'informació que substitueixen la supervisió directa).<br/><strong>Organització en xarxa:</strong> l'empresa central externalitza la majoria de les funcions i coordina una xarxa de proveïdors, subcontractistes i aliats especialitzats (exemple: Apple dissenya però externalitza la fabricació a Foxconn).<br/><strong>Organització per equips (team-based):</strong> equips multifuncionals i autogestionats com a unitat bàsica (Spotify: squads, tribes, chapters, guilds).<br/><strong>Organització àgil:</strong> inspirada en Agile/Scrum (originari del programari): cicles curts, iteratius, amb equips autònoms i retroalimentació contínua.<br/><strong>Teletreball i treball híbrid:</strong> accelerat per la pandèmia COVID-19. Implica noves formes de coordinació, comunicació i control basades en resultats més que en presència.</p>
                </TheoryBlock>
            </Card>
            <Card title="6. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet"><p>Aquest tema connecta amb CE3 d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong>: organització, direcció, organigrames. Contribueix a STEM (disseny d'organigrames), CE (organització d'un projecte emprenedor), CC (relacions laborals, treball en equip) i CPSAA (lideratge, coordinació).</p></TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="rose"><p>L'organització empresarial dissenya l'estructura interna: divisió del treball, autoritat/delegació, coordinació. Es distingeix organització formal (oficial) i informal (Hawthorne). Els models principals són: lineal (unitat de comandament, pimes), funcional (Taylor, especialització), línia-staff (la més habitual), divisional (grans empreses diversificades) i matricial (doble dependència, projectes). L'organigrama representa gràficament l'estructura. Les tendències actuals són: estructures planes, organització en xarxa (Apple-Foxconn), equips autogestionats (Spotify), agilisme i treball híbrid.</p></TheoryBlock>
            </Card>
            <BibliografiaBox items={["Mintzberg, H. (1979). The Structuring of Organizations. Prentice-Hall.","Fayol, H. (1916). Administration industrielle et générale.","Taylor, F. W. (1911). The Principles of Scientific Management.","Mayo, E. (1933). The Human Problems of an Industrial Civilization.","Bueno Campos, E. (2022). Curso básico de Economía de la Empresa, 6.ª ed. Pirámide.","Robbins, S. & Coulter, M. (2020). Management, 15.ª ed. Pearson.","Kniberg, H. & Ivarsson, A. (2012). Scaling Agile @ Spotify. Spotify Labs.","Galbraith, J. R. (2014). Designing Organizations. Jossey-Bass.","Daft, R. L. (2021). Organization Theory and Design, 13.ª ed. Cengage.","Grant, R. M. (2021). Contemporary Strategy Analysis. Wiley."]} />
        </div>

    // TEMA 54 — La direcció de l'empresa. Planificació i control.

    const Tema54Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>direcció</strong> és la funció que guia i coordina els recursos humans i materials de l'empresa cap a la consecució dels seus objectius. Implica prendre decisions, planificar, organitzar, motivar el personal i controlar els resultats. Aquest tema se centra en les funcions directives de <strong>planificació</strong> i <strong>control</strong>, així com en el procés de presa de decisions i els nivells de direcció.</p>
                    <p>S'emmarca en CE3 d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022). S'estructura en cinc epígrafs: funcions directives, nivells de direcció, planificació estratègica, presa de decisions i control de gestió.</p>
                </div>
            </Card>
            <Card title="1. Funcions de la direcció" icon="📘">
                <TheoryBlock title="1.1. Les quatre funcions directives (Fayol)" color="rose">
                    <p><strong>Henri Fayol</strong> (1916) va identificar les funcions bàsiques del procés administratiu: <strong>planificació</strong> (fixar objectius i traçar el camí), <strong>organització</strong> (dissenyar l'estructura i assignar recursos), <strong>direcció de persones</strong> (motivar, liderar, comunicar — desenvolupada en el Tema 55) i <strong>control</strong> (verificar que els resultats s'ajusten al planificat i corregir desviacions).</p>
                </TheoryBlock>
                <TheoryBlock title="1.2. Nivells de direcció" color="red">
                    <p><strong>Alta direcció:</strong> consell d'administració, CEO/director general. Decisions estratègiques (llarg termini, gran impacte, alta incertesa): fusions, internacionalització, canvi de model de negoci.<br/><strong>Direcció intermèdia (comandaments intermedis):</strong> directors de departament, d'àrea, de fàbrica. Decisions tàctiques (mitjà termini): plans de producció, campanyes de màrqueting, pressupostos departamentals.<br/><strong>Direcció operativa (primera línia):</strong> caps d'equip, encarregats, supervisors. Decisions operatives (curt termini, rutinàries): torns de treball, comandes de materials, resolució d'incidències.</p>
                </TheoryBlock>
            </Card>
            <Card title="2. La planificació" icon="📘">
                <TheoryBlock title="2.1. Concepte i procés" color="rose">
                    <p>La <strong>planificació</strong> consisteix a definir els objectius de l'empresa i establir les estratègies i accions per a aconseguir-los, anticipant-se al futur. El procés: <strong>1)</strong> Anàlisi de la situació (DAFO). <strong>2)</strong> Fixació d'objectius (SMART: específics, mesurables, assolibles, rellevants, temporalitzats). <strong>3)</strong> Disseny d'estratègies i alternatives. <strong>4)</strong> Avaluació i selecció de la millor alternativa. <strong>5)</strong> Implantació i seguiment.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Tipus de plans" color="red">
                    <p><strong>Per horitzó temporal:</strong> plans estratègics (llarg termini, 3-5 anys: missió, visió, objectius globals), plans tàctics (mitjà termini, 1-3 anys: plans funcionals), plans operatius (curt termini, &lt;1 any: pressupostos, programes).<br/><strong>Per funció:</strong> pla de producció, pla de màrqueting, pla financer, pla de RRHH, pla d'I+D.<br/><strong>Altres:</strong> polítiques (directrius generals), procediments (seqüència de passos), regles (normes específiques), pressupostos (plans quantificats en unitats monetàries).</p>
                </TheoryBlock>
                <TheoryBlock title="2.3. Direcció estratègica" color="rose">
                    <p>La <strong>direcció estratègica</strong> analitza l'entorn i els recursos interns per a formular, implementar i avaluar estratègies que generen avantatge competitiu:<br/><strong>Estratègies competitives de Porter:</strong> lideratge en costos (ser el productor més barat — Ryanair, Mercadona), diferenciació (oferir quelcom únic que el client valore — Apple, BMW), enfocament o nínxol (concentrar-se en un segment específic — Ferrari, Rolex).<br/><strong>Estratègies de creixement (Ansoff):</strong> penetració de mercat (més del mateix producte al mateix mercat), desenvolupament de producte (nous productes al mateix mercat), desenvolupament de mercat (mateix producte a nous mercats), diversificació (nous productes a nous mercats).</p>
                </TheoryBlock>
                <FormulaBox formula="Matriu Ansoff: Penetració | Desenv. Producte | Desenv. Mercat | Diversificació" desc="4 estratègies de creixement segons producte (actual/nou) × mercat (actual/nou)" />
            </Card>
            <Card title="3. La presa de decisions" icon="📘">
                <TheoryBlock title="3.1. Tipus de decisions" color="rose">
                    <p><strong>Programades:</strong> rutinàries, repetitives, amb procediments establits (gestió de comandes, nòmines). <strong>No programades:</strong> noves, complexes, sense precedents (entrar en un nou mercat, reaccionar a una crisi). La proporció de decisions no programades augmenta amb el nivell directiu.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Ambients de decisió" color="red">
                    <p><strong>Certesa:</strong> es coneixen les conseqüències de cada alternativa (rar en la pràctica).<br/><strong>Risc:</strong> es coneixen les alternatives i les seues probabilitats (decisió amb esperança matemàtica, arbres de decisió, criteri del valor esperat).<br/><strong>Incertesa:</strong> no es coneixen les probabilitats. Criteris: <strong>Laplace</strong> (equiprobabilitat), <strong>optimista/maximax</strong> (millor del millor cas), <strong>pessimista/maximin</strong> (Wald: millor del pitjor cas), <strong>Hurwicz</strong> (coeficient d'optimisme), <strong>Savage</strong> (mínim penediment/minimax regret).</p>
                </TheoryBlock>
                <TheoryBlock title="3.3. Ferramentes de decisió" color="rose">
                    <p><strong>Matriu de decisió (taula de pagaments):</strong> files = alternatives, columnes = estats de la naturalesa, valors = resultats.<br/><strong>Arbre de decisió:</strong> representació gràfica de decisions seqüencials amb nodes de decisió (quadrats), nodes d'atzar (cercles) i branques amb probabilitats i resultats. Es resol de dreta a esquerra calculant el valor esperat en cada node.</p>
                </TheoryBlock>
            </Card>
            <Card title="4. El control de gestió" icon="📘">
                <TheoryBlock title="4.1. Concepte i procés" color="rose">
                    <p>El <strong>control</strong> és la funció directiva que verifica que els resultats reals s'ajusten als planificats i, en cas de desviacions, adopta mesures correctores. Procés: <strong>1)</strong> Fixar estàndards (objectius quantificats). <strong>2)</strong> Mesurar els resultats reals. <strong>3)</strong> Comparar resultats amb estàndards (detectar desviacions). <strong>4)</strong> Analitzar les causes de les desviacions. <strong>5)</strong> Adoptar mesures correctores.</p>
                </TheoryBlock>
                <TheoryBlock title="4.2. Tipus de control" color="red">
                    <p><strong>Control preventiu (feedforward):</strong> abans de l'acció. Anticipar problemes (control de qualitat de matèries primeres, planificació de riscos).<br/><strong>Control concurrent:</strong> durant l'acció. Supervisió directa, quadres de comandament en temps real.<br/><strong>Control posterior (feedback):</strong> després de l'acció. Anàlisi de resultats, auditories, informes financers. És el més habitual però el menys oportú.</p>
                </TheoryBlock>
                <TheoryBlock title="4.3. Ferramentes de control" color="rose">
                    <p><strong>Pressupostos:</strong> plans quantificats que permeten comparar previst vs. real.<br/><strong>Auditoria:</strong> interna (per la pròpia empresa) o externa (per auditors independents). Financera, operativa, de compliment.<br/><strong>Quadre de Comandament Integral (Balanced Scorecard, Kaplan i Norton, 1992):</strong> sistema d'indicadors que mesura l'acompliment des de quatre perspectives: financera (rendibilitat, ingressos), clients (satisfacció, retenció), processos interns (eficiència, qualitat), aprenentatge i creixement (formació, innovació).</p>
                </TheoryBlock>
            </Card>
            <Card title="5. Rellevància curricular" icon="🎓">
                <TheoryBlock color="violet"><p>Aquest tema connecta amb CE3 d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong>: funcions directives, planificació, estratègia i control. Els criteris de decisió en incertesa (Laplace, Wald, Hurwicz, Savage) i els arbres de decisió són habituals en supòsits pràctics d'oposicions. Contribueix a STEM (càlcul de matrius i arbres), CE (planificació d'un empreniment), CPSAA (presa de decisions, judici crític) i CC (govern corporatiu, ètica directiva).</p></TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="rose"><p>La direcció comprén planificació, organització, direcció de persones i control (Fayol). S'exerceix a tres nivells: alta direcció (estratègic), comandaments intermedis (tàctic) i operatiu. La planificació fixa objectius SMART i dissenya estratègies: competitives (Porter: costos, diferenciació, enfocament) i de creixement (Ansoff: penetració, desenvolupament producte/mercat, diversificació). La presa de decisions opera en certesa, risc (valor esperat, arbres) i incertesa (Laplace, Wald, Hurwicz, Savage). El control verifica resultats vs. estàndards i corregeix desviacions, amb ferramentes com pressupostos, auditoria i Quadre de Comandament Integral (Kaplan-Norton: 4 perspectives).</p></TheoryBlock>
            </Card>

        </div>
