    // ════════════════════════════════════════════════════════════════
    // TEMA 49 — La empresa: concepto, elementos y funciones.
    // ════════════════════════════════════════════════════════════════
    const Tema49Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La <strong>empresa</strong> es la unidad económica fundamental de las economías de mercado: es la institución que organiza los factores productivos (trabajo, capital, recursos naturales, tecnología, conocimiento) para producir bienes y servicios destinados al mercado con el objetivo de obtener un beneficio. La empresa es, simultáneamente, una unidad de producción, una unidad financiera, una unidad de decisión y una organización social.
                    </p>
                    <p>
                        El estudio de la empresa es el eje vertebrador de la materia de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022) y está presente en múltiples competencias específicas: CE1 (la empresa como sistema y sus funciones), CE2 (análisis del entorno), CE3 (organización y dirección), CE4 (función productiva), CE5 (función comercial) y CE6 (función financiera y contable). La LOMLOE subraya la importancia de formar al alumnado en la comprensión de la iniciativa empresarial, el emprendimiento y la responsabilidad social.
                    </p>
                    <p>
                        El presente tema se estructura en cinco epígrafes: concepto de empresa y evolución del pensamiento empresarial, elementos de la empresa, funciones, clasificación de las empresas y el empresario y el emprendimiento.
                    </p>
                </div>
            </Card>

            <Card title="1. Concepto de empresa y evolución del pensamiento" icon="📘">
                <TheoryBlock title="1.1. Concepto de empresa" color="rose">
                    <p>
                        La empresa puede definirse desde múltiples perspectivas: <strong>económica</strong> (unidad de producción que combina factores para obtener bienes y servicios), <strong>jurídica</strong> (persona física o jurídica que ejerce una actividad económica organizada), <strong>sociológica</strong> (organización social con relaciones de poder, cultura e intereses diversos) y <strong>sistémica</strong> (sistema abierto que interactúa con su entorno, formado por subsistemas interrelacionados).
                    </p>
                    <p>
                        Una definición integradora: la empresa es una <strong>organización de recursos humanos, materiales, financieros y tecnológicos</strong>, coordinados bajo una dirección, que realiza actividades de producción y/o distribución de bienes o servicios con el fin de satisfacer necesidades del mercado y obtener un beneficio, asumiendo riesgo.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Evolución del pensamiento sobre la empresa" color="red">
                    <p>
                        <strong>Adam Smith (1776):</strong> la empresa como unidad de producción que se beneficia de la división del trabajo y la especialización.<br/>
                        <strong>Economía neoclásica (Marshall, Walras):</strong> la empresa como «caja negra» que maximiza el beneficio en competencia perfecta. Función de producción y costes.<br/>
                        <strong>Knight (1921):</strong> el empresario como agente que asume <strong>incertidumbre</strong> (riesgo no asegurable) y obtiene el beneficio como recompensa.<br/>
                        <strong>Schumpeter (1912, 1942):</strong> el empresario <strong>innovador</strong> como motor de la «destrucción creativa» — introduce nuevos productos, procesos, mercados, fuentes de aprovisionamiento u organizaciones que transforman la economía.<br/>
                        <strong>Coase (1937):</strong> la empresa como alternativa al mercado — existe porque los <strong>costes de transacción</strong> (buscar información, negociar, vigilar contratos) hacen más eficiente coordinar internamente que contratar en el mercado.<br/>
                        <strong>Simon (1947):</strong> racionalidad limitada — los directivos no maximizan sino que buscan soluciones <strong>satisfactorias</strong> (satisficing).<br/>
                        <strong>Teoría de la agencia (Jensen y Meckling, 1976):</strong> conflictos de intereses entre <strong>principal</strong> (propietarios/accionistas) y <strong>agente</strong> (directivos). Costes de agencia, gobierno corporativo.<br/>
                        <strong>Enfoque de recursos y capacidades (Penrose, 1959; Barney, 1991):</strong> la empresa como conjunto único de recursos y capacidades que generan <strong>ventaja competitiva sostenible</strong>.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Elementos de la empresa" icon="📘">
                <TheoryBlock title="2.1. Elementos tangibles e intangibles" color="rose">
                    <p>
                        <strong>Factores humanos:</strong> trabajadores (operarios, técnicos, administrativos), directivos (alta dirección, mandos intermedios) y el empresario/emprendedor. El <strong>capital humano</strong> (conocimientos, habilidades, experiencia, creatividad) es el factor más determinante de la competitividad.<br/>
                        <strong>Factores materiales:</strong> capital fijo (terrenos, edificios, maquinaria, equipos informáticos, vehículos) y capital circulante (materias primas, productos en curso, productos terminados, existencias).<br/>
                        <strong>Factores financieros:</strong> recursos financieros propios (capital social, reservas, beneficios retenidos) y ajenos (préstamos bancarios, emisión de obligaciones, proveedores, leasing).<br/>
                        <strong>Factores intangibles:</strong> tecnología (patentes, know-how, software), marca e imagen (reputación, fidelidad de clientes), organización (rutinas, procesos, cultura corporativa), relaciones (con clientes, proveedores, instituciones). Los <strong>activos intangibles</strong> representan una proporción creciente del valor de las empresas (en las empresas del S&P 500, más del 90 % del valor de mercado es intangible).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. La empresa como sistema" color="red">
                    <p>
                        La teoría general de sistemas (Bertalanffy) aplicada a la empresa (Kast y Rosenzweig) la concibe como un <strong>sistema abierto</strong>: recibe inputs del entorno (materias primas, trabajo, capital, información), los transforma mediante un proceso de producción y genera outputs (bienes, servicios, salarios, dividendos, impuestos, externalidades). El <strong>feedback</strong> (información de retorno del mercado: ventas, quejas, competencia) permite la adaptación continua.
                    </p>
                    <p>
                        Los <strong>subsistemas</strong> funcionales de la empresa son: producción/operaciones, comercial/marketing, financiero, recursos humanos, I+D/innovación, y dirección/administración. La <strong>sinergia</strong> (el todo es más que la suma de las partes) es la característica fundamental del sistema empresa.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Funciones de la empresa" icon="📘">
                <TheoryBlock title="3.1. Funciones económicas" color="rose">
                    <p>
                        <strong>1. Función de producción:</strong> transformar inputs en outputs con la mayor eficiencia posible (minimizar costes para un nivel de producción dado, o maximizar la producción para un nivel de costes dado).<br/>
                        <strong>2. Función de creación de valor:</strong> la empresa crea valor cuando el precio que los consumidores están dispuestos a pagar por sus productos supera el coste de los recursos utilizados. El <strong>valor añadido</strong> = Producción − Consumos intermedios.<br/>
                        <strong>3. Función de coordinación de factores:</strong> la empresa organiza y coordina trabajo, capital y tecnología de forma más eficiente que el mercado (Coase).<br/>
                        <strong>4. Función de asunción de riesgo:</strong> el empresario adelanta los factores productivos (paga salarios, compra materias primas, invierte en maquinaria) antes de conocer si el producto se venderá y a qué precio. Asume el riesgo de pérdida (Knight).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Funciones sociales" color="red">
                    <p>
                        <strong>1. Creación de empleo:</strong> las empresas son la principal fuente de empleo en las economías de mercado.<br/>
                        <strong>2. Generación y distribución de renta:</strong> la empresa distribuye la renta generada entre los factores: salarios (trabajadores), intereses (prestamistas), beneficios (propietarios/accionistas), impuestos (Estado), amortizaciones (reposición de capital).<br/>
                        <strong>3. Motor de innovación:</strong> la empresa es el principal agente de innovación (Schumpeter): introduce nuevos productos, procesos y modelos de negocio que transforman la economía.<br/>
                        <strong>4. Desarrollo del territorio:</strong> las empresas fijan población, generan infraestructuras y dinamizan el entorno local.<br/>
                        <strong>5. Responsabilidad social corporativa (RSC):</strong> la empresa contemporánea asume compromisos con sus <strong>stakeholders</strong> (grupos de interés: trabajadores, clientes, proveedores, comunidad, medio ambiente) más allá de la maximización del beneficio.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Clasificación de las empresas" icon="📘">
                <TheoryBlock title="4.1. Según la forma jurídica" color="rose">
                    <p>
                        <strong>Empresario individual (autónomo):</strong> persona física que ejerce la actividad en nombre propio, con responsabilidad ilimitada.<br/>
                        <strong>Sociedad Limitada (SL/SRL):</strong> capital mínimo 1 € (tras Ley Crea y Crece, 2022), responsabilidad limitada al capital aportado, mínimo 1 socio. La forma más común en España (más de 1,2 millones de SL).<br/>
                        <strong>Sociedad Anónima (SA):</strong> capital mínimo 60.000 €, dividido en acciones. Puede cotizar en Bolsa. Adecuada para grandes empresas.<br/>
                        <strong>Sociedad Cooperativa:</strong> propiedad colectiva, gestión democrática (un socio = un voto), reparto de excedentes según la actividad cooperativizada. Ejemplo: Mondragón (mayor grupo cooperativo del mundo).<br/>
                        <strong>Otras:</strong> Sociedad Laboral (mayoría del capital en manos de los trabajadores), Sociedad Comanditaria, Comunidad de Bienes, Emprendedor de Responsabilidad Limitada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Según el tamaño" color="red">
                    <p>
                        La clasificación de la UE (Recomendación 2003/361/CE) según número de trabajadores, volumen de negocio y balance total:
                    </p>
                    <p>
                        <strong>Microempresa:</strong> &lt;10 trabajadores y facturación ≤2 M€. El 93 % de las empresas españolas.<br/>
                        <strong>Pequeña empresa:</strong> &lt;50 trabajadores y facturación ≤10 M€.<br/>
                        <strong>Mediana empresa:</strong> &lt;250 trabajadores y facturación ≤50 M€.<br/>
                        <strong>Gran empresa:</strong> ≥250 trabajadores o facturación &gt;50 M€.
                    </p>
                    <p>
                        En España, las <strong>pymes</strong> (micro + pequeñas + medianas) representan el 99,8 % del tejido empresarial y generan el 62 % del empleo. Sin embargo, las grandes empresas (0,2 %) generan el 38 % del empleo y concentran la mayor parte de las exportaciones, la inversión en I+D y la productividad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Según otros criterios" color="rose">
                    <p>
                        <strong>Según la propiedad del capital:</strong> privadas, públicas (Estado como accionista mayoritario: Correos, Paradores, AENA parcialmente), mixtas.<br/>
                        <strong>Según el sector de actividad:</strong> primario (agricultura, pesca), secundario (industria, construcción), terciario (servicios), cuaternario (I+D, TIC, consultoría).<br/>
                        <strong>Según el ámbito geográfico:</strong> locales, regionales, nacionales, multinacionales/transnacionales.<br/>
                        <strong>Según el grado de integración:</strong> empresa individual, grupo empresarial (holding), clúster, red empresarial, franquicia.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. El empresario y el emprendimiento" icon="📘">
                <TheoryBlock title="5.1. Evolución del concepto de empresario" color="rose">
                    <p>
                        <strong>Cantillon (1755):</strong> primer teórico del empresario — el que compra a precios ciertos y vende a precios inciertos (asunción de riesgo).<br/>
                        <strong>Say (1803):</strong> el empresario como coordinador de los factores de producción.<br/>
                        <strong>Knight (1921):</strong> empresario = tomador de decisiones bajo incertidumbre; el beneficio es la recompensa por asumir riesgo no asegurable.<br/>
                        <strong>Schumpeter (1912):</strong> empresario innovador. Motor de la destrucción creativa.<br/>
                        <strong>Kirzner (1973):</strong> empresario como descubridor de oportunidades de beneficio no explotadas (alertness).<br/>
                        <strong>Empresario actual:</strong> líder, estratega, innovador, gestor de equipos, comunicador. Separación propiedad-control (Berle y Means, 1932): en las grandes empresas, los propietarios (accionistas) delegan la gestión en directivos profesionales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Emprendimiento y ecosistema emprendedor" color="red">
                    <p>
                        El <strong>emprendimiento</strong> es el proceso de crear, desarrollar y gestionar una nueva empresa o proyecto. El ecosistema emprendedor incluye: acceso a financiación (business angels, capital riesgo, crowdfunding, préstamos ICO), formación (universidades, escuelas de negocios, FP), marcos regulatorios (Ley de Startups 2022: incentivos fiscales, visa de nómada digital, stock options), incubadoras y aceleradoras, cultura emprendedora y redes de apoyo.
                    </p>
                    <p>
                        España ha mejorado su ecosistema emprendedor: Barcelona y Madrid son hubs de startups reconocidos en Europa (Glovo, Cabify, Wallbox, Typeform, Factorial). Sin embargo, la tasa de actividad emprendedora temprana (TEA) en España (~6 %, según GEM) sigue por debajo de la media de las economías avanzadas (~10 %).
                    </p>
                </TheoryBlock>
            </Card>

                <TheoryBlock color="violet">

                        Este tema es el punto de partida de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022), conectando con CE1 (la empresa como sistema), CE2 (análisis del entorno) y los contenidos transversales de emprendimiento y educación financiera. Contribuye a las competencias <strong>CE</strong> (comprensión de la iniciativa empresarial, emprendimiento), <strong>CC</strong> (responsabilidad social, stakeholders), <strong>STEM</strong> (análisis cuantitativo de datos empresariales) y <strong>CPSAA</strong> (liderazgo, trabajo en equipo, toma de decisiones). La Ley de Startups (2022) y el ecosistema emprendedor español ofrecen conexiones con la actualidad.
                    </p>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose">
                    <p>

                    </p>

            <Card title="1. Concepto y tipos de entorno empresarial" icon="📘">
                <TheoryBlock title="1.1. El entorno empresarial" color="rose">
                    <p>
                        El <strong>entorno empresarial</strong> es el conjunto de factores externos a la empresa que influyen en su actividad y resultados. Se distinguen dos niveles:
                    </p>
                    <p>
                        <strong>Entorno general (macroentorno):</strong> factores que afectan a todas las empresas de una economía, independientemente del sector. Son poco controlables por la empresa individual.<br/>
                        <strong>Entorno específico (microentorno o entorno competitivo):</strong> factores que afectan específicamente a las empresas de un sector o industria concreto. La empresa puede influir parcialmente en ellos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Características del entorno actual" color="red">
                    <p>
                        El entorno contemporáneo se caracteriza por: <strong>complejidad</strong> (múltiples variables interrelacionadas), <strong>dinamismo</strong> (cambios rápidos e impredecibles), <strong>incertidumbre</strong> (dificultad para prever el futuro), <strong>globalización</strong> (interdependencia de mercados) y <strong>disrupción tecnológica</strong> (inteligencia artificial, digitalización, plataformas). El acrónimo <strong>VUCA</strong> (Volatilidad, Incertidumbre, Complejidad, Ambigüedad) describe este entorno.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Análisis del entorno general: PESTEL" icon="📘">
                <TheoryBlock title="2.1. El modelo PESTEL" color="rose">
                    <p>
                        El análisis <strong>PESTEL</strong> es la herramienta más utilizada para sistematizar el estudio del macroentorno. Identifica seis dimensiones:
                    </p>
                    <p>
                        <strong>P — Político:</strong> estabilidad política, política fiscal, regulación laboral, política comercial, subvenciones, política industrial, legislación de competencia, protección al consumidor.<br/>
                        <strong>E — Económico:</strong> ciclo económico (expansión/recesión), tipos de interés, inflación, tipo de cambio, PIB, nivel de empleo/desempleo, renta disponible, distribución de la renta, política monetaria del BCE.<br/>
                        <strong>S — Social/Sociocultural:</strong> demografía (envejecimiento, migración, urbanización), valores y actitudes (sostenibilidad, igualdad, conciliación), estilos de vida, nivel educativo, distribución de la renta, movimientos sociales.<br/>
                        <strong>T — Tecnológico:</strong> innovación tecnológica, I+D, digitalización, inteligencia artificial, automatización, comercio electrónico, ciberseguridad, protección de datos, tecnologías disruptivas.<br/>
                        <strong>E — Ecológico/Medioambiental:</strong> cambio climático, regulación ambiental (emisiones, residuos), economía circular, energías renovables, escasez de recursos, conciencia ecológica del consumidor, taxonomía verde de la UE.<br/>
                        <strong>L — Legal:</strong> legislación mercantil, protección de datos (RGPD), propiedad intelectual, normativa de seguridad e higiene, legislación fiscal, normativa sectorial (alimentaria, farmacéutica, financiera).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Aplicación del PESTEL" color="red">
                    <p>
                        El análisis PESTEL no es una lista exhaustiva sino una <strong>herramienta de reflexión estratégica</strong>: se trata de identificar los factores del macroentorno que son <strong>más relevantes</strong> para la empresa o sector concreto, valorar si representan <strong>oportunidades o amenazas</strong>, y anticipar su evolución probable. Ejemplo: para una empresa de energías renovables, los factores ecológicos (regulación verde), tecnológicos (eficiencia de paneles solares) y políticos (subvenciones) serán más determinantes que para una empresa textil.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Análisis del entorno específico: las cinco fuerzas de Porter" icon="📘">
                <TheoryBlock title="3.1. El modelo de las cinco fuerzas (1980)" color="rose">
                    <p>
                        <strong>Michael Porter</strong> propuso en <em>Competitive Strategy</em> (1980) un modelo para analizar la <strong>estructura competitiva de un sector</strong> y determinar su atractivo (rentabilidad potencial). Las cinco fuerzas son:
                    </p>
                    <p>
                        <strong>1. Rivalidad entre competidores existentes:</strong> intensidad de la competencia entre las empresas que ya operan en el sector. Depende de: número y equilibrio de competidores, crecimiento del sector (en sectores maduros o en declive, la rivalidad es mayor), diferenciación del producto, costes fijos (sectores con altos costes fijos tienden a guerras de precios), barreras de salida.
                    </p>
                    <p>
                        <strong>2. Amenaza de nuevos entrantes:</strong> riesgo de que nuevas empresas se incorporen al sector, atraídas por su rentabilidad. Depende de las <strong>barreras de entrada</strong>: economías de escala, inversión inicial, acceso a canales de distribución, diferenciación de marca, regulación, patentes, costes de cambio para el cliente.
                    </p>
                    <p>
                        <strong>3. Amenaza de productos sustitutivos:</strong> bienes o servicios de otros sectores que satisfacen la misma necesidad (ej.: el tren sustituye al avión en distancias medias; el streaming sustituye al cine). Cuanto más sustitutos y mejor su relación calidad-precio, menor la rentabilidad del sector.
                    </p>
                    <p>
                        <strong>4. Poder de negociación de los proveedores:</strong> capacidad de los proveedores para imponer condiciones (precios, calidad, plazos). Mayor poder cuando: pocos proveedores, inputs diferenciados o sin sustitutos, alto coste de cambio de proveedor, amenaza de integración vertical hacia adelante.
                    </p>
                    <p>
                        <strong>5. Poder de negociación de los clientes:</strong> capacidad de los clientes para presionar a la baja los precios o exigir mayor calidad. Mayor poder cuando: pocos clientes grandes, productos estandarizados, bajo coste de cambio, alta información del cliente, amenaza de integración vertical hacia atrás.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Sexta fuerza: complementadores" color="red">
                    <p>
                        Brandenburger y Nalebuff (1996) añadieron una sexta fuerza: los <strong>complementadores</strong> — empresas cuyos productos o servicios aumentan el valor del producto de la empresa analizada (ej.: las apps complementan los smartphones; los videojuegos complementan las consolas). Un sector con fuertes complementadores puede ser más atractivo.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Análisis interno: recursos, capacidades y cadena de valor" icon="📘">
                <TheoryBlock title="4.1. El análisis VRIO" color="rose">
                    <p>
                        El modelo <strong>VRIO</strong> (Barney, 1991) evalúa los recursos y capacidades internos de la empresa para determinar si generan ventaja competitiva sostenible. Un recurso o capacidad debe cumplir cuatro condiciones:
                    </p>
                    <p>
                        <strong>V — Valioso:</strong> ¿permite explotar oportunidades o neutralizar amenazas?<br/>
                        <strong>R — Raro:</strong> ¿lo poseen pocos competidores?<br/>
                        <strong>I — Inimitable:</strong> ¿es difícil o costoso de copiar? (por historia única, complejidad social, ambigüedad causal, patentes).<br/>
                        <strong>O — Organizado:</strong> ¿la empresa está organizada para explotar el recurso? (estructura, procesos, incentivos).
                    </p>
                    <p>
                        Si las cuatro condiciones se cumplen → <strong>ventaja competitiva sostenible</strong>. Si falla alguna → ventaja temporal, paridad o desventaja.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La cadena de valor (Porter, 1985)" color="red">
                    <p>
                        La <strong>cadena de valor</strong> descompone las actividades de la empresa en actividades <strong>primarias</strong> y de <strong>apoyo</strong> para identificar dónde se crea (o destruye) valor:
                    </p>
                    <p>
                        <strong>Actividades primarias:</strong> logística interna (recepción, almacenamiento), operaciones (fabricación, montaje), logística externa (distribución), marketing y ventas, servicio posventa.<br/>
                        <strong>Actividades de apoyo:</strong> infraestructura de la empresa (dirección, finanzas, planificación), gestión de recursos humanos, desarrollo tecnológico (I+D), aprovisionamiento (compras).
                    </p>
                    <p>
                        El <strong>margen</strong> es la diferencia entre el valor total generado y el coste total de las actividades. La ventaja competitiva surge cuando la empresa realiza las actividades estratégicamente relevantes de forma más eficiente (liderazgo en costes) o diferenciada (diferenciación) que sus competidores.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Herramientas integradoras: DAFO y estrategias" icon="📘">
                <TheoryBlock title="5.1. El análisis DAFO (SWOT)" color="rose">
                    <p>
                        El análisis <strong>DAFO</strong> (Debilidades, Amenazas, Fortalezas, Oportunidades) integra el análisis externo (oportunidades y amenazas del entorno general y específico) con el análisis interno (fortalezas y debilidades de los recursos y capacidades):
                    </p>
                    <p>
                        <strong>Fortalezas (interno +):</strong> ventajas competitivas, recursos valiosos, marca reconocida, tecnología propia, equipo talentoso.<br/>
                        <strong>Debilidades (interno −):</strong> carencias de recursos, falta de financiación, tecnología obsoleta, baja productividad, marca débil.<br/>
                        <strong>Oportunidades (externo +):</strong> crecimiento del mercado, cambio regulatorio favorable, nueva tecnología aprovechable, tendencia social afín.<br/>
                        <strong>Amenazas (externo −):</strong> nueva competencia, recesión económica, regulación adversa, cambio tecnológico disruptivo, subida de costes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. De DAFO a estrategias" color="red">
                    <p>
                        La matriz DAFO no es solo un diagnóstico, sino una herramienta para formular <strong>estrategias</strong>:
                    </p>
                    <p>
                        <strong>FO (maxi-maxi):</strong> usar fortalezas para aprovechar oportunidades (estrategias ofensivas).<br/>
                        <strong>FA (maxi-mini):</strong> usar fortalezas para contrarrestar amenazas (estrategias defensivas).<br/>
                        <strong>DO (mini-maxi):</strong> superar debilidades para aprovechar oportunidades (estrategias de reorientación).<br/>
                        <strong>DA (mini-mini):</strong> minimizar debilidades y evitar amenazas (estrategias de supervivencia).
                    </p>
                </TheoryBlock>
            </Card>

                <TheoryBlock color="violet">

                        Este tema conecta directamente con CE2 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022): análisis del entorno general y específico, identificación de oportunidades y amenazas, análisis DAFO. También con CE1 (empresa como sistema abierto) y con la competencia STEM (análisis estructurado de datos), CE (emprendimiento: evaluar un mercado), CPSAA (juicio crítico, toma de decisiones bajo incertidumbre) y CCL (lectura de informes sectoriales y planes estratégicos). La aplicación de herramientas como PESTEL, cinco fuerzas y DAFO a casos reales es un recurso pedagógico muy eficaz.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose">
                    <p>
                        El entorno empresarial se analiza a dos niveles: el macroentorno (PESTEL: político, económico, social, tecnológico, ecológico, legal) y el microentorno o entorno competitivo (cinco fuerzas de Porter: rivalidad, entrantes, sustitutos, proveedores, clientes). El análisis interno evalúa los recursos y capacidades (VRIO: valioso, raro, inimitable, organizado) y descompone las actividades en la cadena de valor (Porter: primarias + apoyo → margen). El análisis DAFO integra ambos: fortalezas y debilidades internas con oportunidades y amenazas externas, generando cuatro tipos de estrategias (FO, FA, DO, DA). El entorno VUCA actual (volátil, incierto, complejo, ambiguo) exige un análisis continuo y una capacidad de adaptación rápida.
                    </p>
                </TheoryBlock>
            </Card>

            ]} />

                            <li><strong>P</strong>olític: estabilitat, regulació, subvencions, política comercial.</li>
                            <li><strong>E</strong>conòmic: cicle, tipus interès, inflació, PIB, ocupació, tipus canvi.</li>
                            <li><strong>S</strong>ocial: demografia, valors, estils de vida, educació, migració.</li>
                            <li><strong>T</strong>ecnològic: innovació, IA, digitalització, e-commerce, ciberseguretat.</li>
                            <li><strong>E</strong>cològic: canvi climàtic, regulació ambiental, economia circular, renovables.</li>

                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold text-slate-800 mb-1">3. Cinc forces de Porter (microentorn)</h4>
                        <ul className="list-disc pl-5 space-y-1">
                            <li>1. Rivalitat entre competidors: nombre, creixement sector, diferenciació, costos fixos.</li>

                            <li>3. Amenaça substitutius: productes d'altres sectors que satisfan la mateixa necessitat.</li>
                            <li>4. Poder proveïdors: pocs, inputs diferenciats, cost canvi alt, integració vertical.</li>
                            <li>5. Poder clients: pocs, producte estandarditzat, informació alta, cost canvi baix.</li>

                    </div>

                </ClauBox>
            </Card>
