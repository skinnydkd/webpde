    const Tema55Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>gestió de recursos humans</strong> (GRH) comprén el conjunt d'activitats dirigides a atraure, desenvolupar, motivar i retindre les persones que treballen a l'empresa. En una economia del coneixement, el <strong>capital humà</strong> és el recurs més valuós i el principal factor d'avantatge competitiu sostenible. La motivació i el lideratge són les ferramentes clau per a convertir eixe potencial en resultats.</p>
                    <p>Aquest tema s'emmarca en CE3 d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022). S'estructura en: funcions de RRHH, teories de la motivació, estils de lideratge, comunicació interna i noves tendències.</p>
                </div>
            </Card>
            <Card title="1. Funcions de la gestió de RRHH" icon="📘">
                <TheoryBlock title="1.1. Funcions principals" color="rose">
                    <p><strong>Planificació de plantilla:</strong> preveure les necessitats de personal (nombre, qualificacions, moment).<br/><strong>Reclutament i selecció:</strong> atraure candidats (reclutament intern/extern, portals d'ocupació, LinkedIn, headhunting) i triar el més adequat (entrevistes, proves, assessment center).<br/><strong>Formació i desenvolupament:</strong> formació inicial (onboarding), formació contínua (upskilling, reskilling), plans de carrera.<br/><strong>Avaluació de l'acompliment:</strong> mesurar el rendiment mitjançant indicadors (KPIs), feedback 360°, entrevistes d'avaluació.<br/><strong>Retribució:</strong> salari fix + variable (bonus, comissions, stock options), retribució flexible (assegurança mèdica, xec restaurant, guarderia), retribució emocional (conciliació, teletreball, reconeixement).<br/><strong>Relacions laborals:</strong> negociació col·lectiva, convenis, comités d'empresa, prevenció de riscos laborals.</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Teories de la motivació" icon="📘">
                <TheoryBlock title="2.1. Teories de contingut (què motiva)" color="rose">
                    <p><strong>Maslow (1943):</strong> jerarquia de necessitats en cinc nivells piramidals: fisiològiques → seguretat → socials/pertinença → estima/reconeixement → autorealització. Només les necessitats insatisfetes motiven; les satisfetes deixen de motivar.<br/><strong>Herzberg (1959):</strong> teoria bifactorial. <em>Factors higiènics</em> (salari, condicions laborals, seguretat, supervisió): la seua absència genera insatisfacció, però la seua presència no motiva. <em>Factors motivacionals</em> (assoliment, reconeixement, responsabilitat, creixement, treball en si mateix): generen satisfacció i motivació real.<br/><strong>McClelland (1961):</strong> tres necessitats adquirides: <em>assoliment</em> (aconseguir metes), <em>poder</em> (influir sobre els altres), <em>afiliació</em> (relacions socials). Cada persona té un perfil dominant.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Teories de procés (com es motiva)" color="red">
                    <p><strong>Vroom (1964):</strong> teoria de les expectatives. Motivació = <em>Expectativa</em> (esforç → rendiment) × <em>Instrumentalitat</em> (rendiment → recompensa) × <em>València</em> (valor subjectiu de la recompensa).<br/><strong>Adams (1963):</strong> teoria de l'equitat. Les persones comparen la seua ràtio esforç/recompensa amb la dels altres; la percepció d'inequitat genera desmotivació.<br/><strong>Locke (1968):</strong> teoria de l'establiment de metes. Les metes específiques i desafiants (però assolibles) generen major motivació i rendiment que les metes vagues.</p>
                </TheoryBlock>
                <FormulaBox formula="Herzberg: Higiènics (eviten insatisfacció) ≠ Motivacionals (generen motivació)" desc="La clau: el salari no motiva, però la seua absència desmotiva" />
            </Card>
            <Card title="3. El lideratge" icon="📘">
                <TheoryBlock title="3.1. Concepte i estils clàssics" color="rose">
                    <p>El <strong>lideratge</strong> és la capacitat d'influir en el comportament d'un grup per a aconseguir objectius comuns. Es distingeix del poder formal (autoritat jeràrquica).<br/><strong>Autocràtic:</strong> el líder pren les decisions sense consultar. Eficaç en situacions de crisi o urgència, però genera dependència i desmotivació.<br/><strong>Democràtic (participatiu):</strong> el líder consulta l'equip abans de decidir. Major motivació i creativitat, però més lent.<br/><strong>Laissez-faire (liberal):</strong> el líder delega la presa de decisions a l'equip. Eficaç amb equips molt qualificats i autònoms; ineficaç si falta direcció.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Teories situacionals i contemporànies" color="red">
                    <p><strong>Hersey i Blanchard:</strong> lideratge situacional. L'estil ha d'adaptar-se a la <em>maduresa</em> del subordinat (competència + motivació): dirigir → persuadir → participar → delegar.<br/><strong>Lideratge transformacional (Burns, Bass):</strong> el líder inspira, motiva intel·lectualment, considera individualment cada membre i genera un canvi profund. Oposat al <em>transaccional</em> (basat en recompenses i càstigs).<br/><strong>Lideratge servicial (servant leadership, Greenleaf):</strong> el líder serveix el seu equip, prioritzant el seu desenvolupament i benestar.</p>
                </TheoryBlock>
            </Card>
            <Card title="4. Comunicació interna" icon="📘">
                <TheoryBlock color="rose"><p><strong>Descendent:</strong> de superiors a subordinats (instruccions, informació). <strong>Ascendent:</strong> de subordinats a superiors (informes, suggeriments, queixes). <strong>Horitzontal:</strong> entre departaments o col·legues del mateix nivell (coordinació). <strong>Diagonal:</strong> entre nivells i departaments diferents. Les ferramentes inclouen: reunions, intranet, correu electrònic, xats corporatius (Slack, Teams), taulers, bústia de suggeriments.</p></TheoryBlock>
            </Card>
            <Card title="5. Noves tendències en RRHH" icon="📘">
                <TheoryBlock color="red"><p><strong>Employer branding:</strong> l'empresa com a «marca ocupadora» que atrau talent.<br/><strong>Gestió de la diversitat:</strong> igualtat de gènere, inclusió, interculturalitat.<br/><strong>Benestar laboral (wellbeing):</strong> salut mental, desconnexió digital, conciliació.<br/><strong>People analytics:</strong> ús de dades per a la presa de decisions en RRHH.<br/><strong>Treball remot/híbrid:</strong> redisseny de l'experiència de l'empleat postpandèmia.</p></TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="rose"><p>La GRH abasta planificació, selecció, formació, avaluació, retribució i relacions laborals. La motivació s'explica per teories de contingut (Maslow: piràmide; Herzberg: higiènics vs. motivacionals; McClelland: assoliment/poder/afiliació) i de procés (Vroom: expectatives; Adams: equitat; Locke: metes). El lideratge pot ser autocràtic, democràtic o liberal; les teories situacionals (Hersey-Blanchard) i transformacionals (Burns-Bass) són les més influents. La comunicació interna flueix descendent, ascendent, horitzontal i diagonal. Les tendències inclouen employer branding, diversitat, benestar, people analytics i treball híbrid.</p></TheoryBlock>
            </Card>

        </div>

    // TEMA 56 — La funció comercial. El mix de màrqueting.

    const Tema56Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>funció comercial</strong> (o de màrqueting) connecta l'empresa amb el mercat: identifica les necessitats del consumidor i desenvolupa l'estratègia per a satisfer-les de forma rendible. El <strong>marketing mix</strong> —les «4 P» de McCarthy (1960), ampliades a 7 P— és el marc operatiu fonamental: producte, preu, distribució (place) i comunicació (promotion).</p>
                    <p>Aquest tema s'emmarca en CE5 d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022). S'estructura en: concepte de màrqueting, investigació de mercats, segmentació, les 4 P del marketing mix i màrqueting digital.</p>
                </div>
            </Card>
            <Card title="1. Concepte i evolució del màrqueting" icon="📘">
                <TheoryBlock title="1.1. Definició" color="rose">
                    <p>Segons l'<strong>AMA</strong> (American Marketing Association, 2017): «el màrqueting és l'activitat, el conjunt d'institucions i els processos per a crear, comunicar, lliurar i intercanviar ofertes que tenen valor per als consumidors, clients, socis i la societat en general». El màrqueting contemporani s'orienta al <strong>client</strong> (customer-centric), no al producte.</p>

                <TheoryBlock title="1.2. Evolució" color="red">
                    <p><strong>Orientació a la producció</strong> (fins 1930): produir molt i barat (la demanda supera l'oferta). <strong>Orientació al producte</strong> (1930-1950): qualitat tècnica. <strong>Orientació a les vendes</strong> (1950-1970): vendre el produït (publicitat agressiva). <strong>Orientació al màrqueting</strong> (1970-2000): detectar necessitats i satisfer-les (investigació de mercats, segmentació). <strong>Orientació al màrqueting relacional i digital</strong> (2000-present): fidelització, CRM, experiència del client, màrqueting de continguts, xarxes socials, big data.</p>

            <Card title="2. Investigació de mercats i segmentació" icon="📘">
                <TheoryBlock title="2.1. Investigació de mercats" color="rose">
                    <p>Procés sistemàtic de recopilar, analitzar i interpretar informació sobre el mercat per a prendre decisions. <strong>Fases:</strong> definició del problema → disseny de la investigació → recollida de dades (primàries: enquestes, focus groups, observació, experimentació; secundàries: INE, Eurostat, informes sectorials) → anàlisi → informe i recomanacions.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Segmentació i posicionament" color="red">
                    <p><strong>Segmentació:</strong> dividir el mercat en grups homogenis (segments) segons criteris: demogràfics (edat, gènere, renda), geogràfics, psicogràfics (estil de vida, personalitat), conductuals (freqüència de compra, fidelitat, benefici buscat).<br/><strong>Targeting:</strong> seleccionar els segments objectiu (indiferenciat, diferenciat, concentrat, personalitzat/one-to-one).<br/><strong>Posicionament:</strong> la imatge que el producte ocupa en la ment del consumidor respecte a la competència. Es defineix mitjançant atributs clau (preu, qualitat, innovació, sostenibilitat). Exemple: Volvo = seguretat; Apple = innovació i disseny; Mercadona = qualitat-preu.</p>
                </TheoryBlock>
            </Card>
            <Card title="3. El marketing mix: les 4 P" icon="📘">
                <TheoryBlock title="3.1. Producte (Product)" color="rose">
                    <p>El <strong>producte</strong> és qualsevol bé, servei, idea o experiència que satisfà una necessitat. Nivells: <em>producte bàsic</em> (benefici essencial), <em>producte real</em> (característiques, disseny, marca, envàs, qualitat), <em>producte augmentat</em> (garantia, servei postvenda, finançament).<br/><strong>Cicle de vida del producte:</strong> introducció (vendes baixes, inversió alta) → creixement (vendes accelerades, competidors) → maduresa (vendes estables, competència intensa en preu) → declivi (vendes cauen, possible retirada).<br/><strong>Marca:</strong> nom, logotip, disseny que identifica i diferencia. Estratègies: marca única (Apple), marques múltiples (P&G: Ariel, Fairy, Gillette), marca del distribuïdor (Hacendado de Mercadona), marca paraigua, co-branding.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Preu (Price)" color="red">
                    <p>El <strong>preu</strong> és la quantitat de diners que el consumidor paga pel producte. És l'única variable del mix que genera ingressos (les altres generen costos).<br/><strong>Mètodes de fixació:</strong> basats en costos (cost + marge), basats en la demanda (preu que el mercat està disposat a pagar, elasticitat), basats en la competència (preu similar, per damunt o per davall del líder).<br/><strong>Estratègies:</strong> descremació (preu alt inicial, baixada gradual — tecnologia), penetració (preu baix per a guanyar quota — Ryanair), preus psicològics (9,99 €), bundling (paquet), freemium, discriminació de preus (segments, zones, moments).</p>
                </TheoryBlock>
                <TheoryBlock title="3.3. Distribució (Place)" color="rose">
                    <p>La <strong>distribució</strong> és el conjunt d'activitats que posen el producte a disposició del consumidor en el lloc, moment i quantitat adequats.<br/><strong>Canal de distribució:</strong> directe (fabricant → consumidor: venda online, botigues pròpies) o indirecte (amb intermediaris: majoristes, minoristes). Nivells: curt (1 intermediari) o llarg (2+).<br/><strong>Estratègies:</strong> distribució intensiva (màxims punts de venda — Coca-Cola), selectiva (punts seleccionats — electrodomèstics), exclusiva (un sol distribuïdor per zona — Ferrari, Rolex).<br/><strong>E-commerce:</strong> comerç electrònic, marketplaces (Amazon), D2C (direct-to-consumer), omnicanalitat (integració botiga física + online).</p>
                </TheoryBlock>
                <TheoryBlock title="3.4. Comunicació (Promotion)" color="red">
                    <p>La <strong>comunicació comercial</strong> informa, persuadeix i recorda al consumidor sobre el producte.<br/><strong>Publicitat:</strong> comunicació pagada, massiva, a través de mitjans (TV, ràdio, premsa, digital, exterior). Mesurament: CPM, CPC, CPA, ROI publicitari.<br/><strong>Promoció de vendes:</strong> incentius a curt termini (descomptes, 2×1, mostres gratuïtes, concursos).<br/><strong>Relacions públiques:</strong> imatge corporativa, patrocini, esdeveniments, notes de premsa, RSC.<br/><strong>Venda personal:</strong> contacte directe venedor-client (B2B, productes complexos).<br/><strong>Màrqueting directe:</strong> comunicació individualitzada (email marketing, SMS, catàlegs).<br/><strong>Màrqueting digital:</strong> SEO/SEM, xarxes socials (social media marketing), màrqueting de continguts, influencer marketing, inbound marketing, màrqueting d'afiliació, retargeting.</p>
                </TheoryBlock>
                <FormulaBox formula="Marketing Mix = Producte + Preu + Distribució (Place) + Comunicació (Promotion)" desc="Les 4 P de McCarthy (1960). Ampliades a 7P en serveis: +People, Process, Physical evidence" />

    // TEMA 57 — La funció financera. Fonts de finançament.

    const Tema57Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>funció financera</strong> obté i gestiona els recursos econòmics necessaris perquè l'empresa puga funcionar: invertir en actius (maquinària, existències, I+D) i finançar les seues operacions (pagar salaris, proveïdors, impostos). La decisió de finançament —d'on obtindre els fons— és complementària a la decisió d'inversió —en què emprar els fons (Tema 58).</p>
                    <p>Aquest tema s'emmarca en CE6 d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022). S'estructura en: concepte, classificació de fonts de finançament, autofinançament, finançament alié, cost de capital i noves formes de finançament.</p>
                </div>
            </Card>
            <Card title="1. Classificació de les fonts de finançament" icon="📘">
                <TheoryBlock title="1.1. Criteris de classificació" color="rose">
                    <p><strong>Segons la propietat:</strong> finançament propi (no exigible: capital social, reserves, beneficis retinguts) i finançament alié (exigible: deutes amb tercers, préstecs, empréstits, proveïdors).<br/><strong>Segons el termini:</strong> a llarg termini o capitals permanents (&gt;1 any: capital, reserves, préstecs a LP, empréstits, leasing) i a curt termini (&lt;1 any: crèdit bancari, descompte d'efectes, proveïdors, factoring, pòlissa de crèdit).<br/><strong>Segons l'origen:</strong> interna o autofinançament (generada per la pròpia empresa: beneficis no distribuïts, amortitzacions, provisions) i externa (aportada des de fora: ampliacions de capital, préstecs, subvencions).</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Finançament propi" icon="📘">
                <TheoryBlock title="2.1. Capital social" color="rose">
                    <p>Aportacions dels socis/accionistes en constituir l'empresa o en <strong>ampliacions de capital</strong>. En una SA, es materialitza en accions; en una SL, en participacions socials. És el finançament més estable (no té venciment ni genera interessos obligatoris), però dilueix el control dels accionistes existents.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Autofinançament" color="red">
                    <p><strong>Autofinançament d'enriquiment (reserves):</strong> beneficis no distribuïts com a dividends. Tipus: reserva legal (obligatòria, 10 % del benefici fins al 20 % del capital social), reserves voluntàries, reserves estatutàries. Augmenten el patrimoni net.<br/><strong>Autofinançament de manteniment:</strong> fons destinats a mantindre el valor del patrimoni. <em>Amortitzacions:</em> reflecteixen la pèrdua de valor (depreciació) de l'immobilitzat per ús, obsolescència o pas del temps. S'imputen com a cost i generen un fons per a reposar l'actiu al final de la seua vida útil. <em>Provisions:</em> fons per a cobrir pèrdues futures probables (impagaments, garanties, litigis).<br/><strong>Avantatges:</strong> no genera cost financer explícit, augmenta l'autonomia, no requereix garanties. <strong>Inconvenients:</strong> limita el repartiment de dividends (pot generar conflicte amb els accionistes), és limitada (depén dels beneficis), pot generar ineficiència (inversions no rendibles finançades amb fons «gratuïts»).</p>
                </TheoryBlock>
            </Card>
            <Card title="3. Finançament alié" icon="📘">
                <TheoryBlock title="3.1. A llarg termini" color="rose">
                    <p><strong>Préstecs bancaris a LP:</strong> l'entitat financera lliura una quantitat (principal) que l'empresa torna amb interessos en quotes periòdiques (sistema francés, quotes constants; sistema americà, interessos + devolució final).<br/><strong>Empréstits (emissió d'obligacions):</strong> l'empresa emet títols de deute (obligacions, bons) que els inversors compren. L'empresa paga interessos periòdics (cupó) i torna el principal al venciment. Accessible principalment per a grans empreses.<br/><strong>Leasing (arrendament financer):</strong> l'empresa de leasing adquireix el bé (maquinària, vehicle, local) i el lloga a l'empresa usuària per una quota periòdica, amb opció de compra al final del contracte. Avantatge: no requereix desemborsament inicial, quotes deduïbles. <strong>Renting:</strong> similar però sense opció de compra i amb manteniment inclòs.<br/><strong>Subvencions:</strong> transferències no reemborsables de les AAPP o la UE. No són deute, però poden estar condicionades (inversió, ocupació, I+D, transició ecològica).</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. A curt termini" color="red">
                    <p><strong>Crèdit comercial (proveïdors):</strong> ajornament del pagament a proveïdors (30, 60, 90 dies). És la font de finançament a CP més utilitzada i, aparentment, gratuïta (encara que perd descomptes per pagament anticipat).<br/><strong>Préstecs bancaris a CP:</strong> quantitat fixa, devolució en &lt;1 any.<br/><strong>Pòlissa de crèdit (línia de crèdit):</strong> el banc posa a disposició un límit; l'empresa disposa del que necessita i paga interessos només per l'utilitzat (més una comissió de disponibilitat). Flexible.<br/><strong>Descompte d'efectes comercials:</strong> l'empresa anticipa el cobrament de lletres de canvi, pagarés o factures descomptant-los al banc (que cobra interessos i comissions).<br/><strong>Factoring:</strong> cessió de les factures pendents de cobrament a una entitat (factor) que avança l'import (menys comissió i interessos) i, opcionalment, assumeix el risc d'impagament (factoring sense recurs).<br/><strong>Confirming:</strong> gestió del pagament a proveïdors a través d'una entitat financera que ofereix al proveïdor cobrament anticipat.</p>
                </TheoryBlock>
            </Card>
            <Card title="4. Cost de capital i estructura financera" icon="📘">
                <TheoryBlock title="4.1. Cost de cada font" color="rose">
                    <p><strong>Cost del deute (ki):</strong> tipus d'interés que paga l'empresa, ajustat per l'estalvi fiscal (els interessos són deduïbles en l'IS): ki* = ki × (1 − t), on t = tipus impositiu.<br/><strong>Cost dels fons propis (ke):</strong> la rendibilitat mínima exigida pels accionistes (cost d'oportunitat). És major que el cost del deute perquè els accionistes assumeixen més risc (cobren després dels creditors).<br/><strong>Cost mitjà ponderat del capital (WACC):</strong> mitjana ponderada del cost del deute i dels fons propis, segons la seua proporció en l'estructura financera.</p>
                </TheoryBlock>
                <FormulaBox formula="WACC = ke × (E/(E+D)) + ki×(1−t) × (D/(E+D))" desc="E = fons propis, D = deute, ke = cost equity, ki = cost deute, t = tipus IS" />
            </Card>
            <Card title="5. Noves formes de finançament" icon="📘">
                <TheoryBlock color="rose"><p><strong>Business angels:</strong> inversors privats que aporten capital i experiència a startups en fases inicials.<br/><strong>Capital risc (venture capital):</strong> fons que invertixen en empreses amb alt potencial de creixement a canvi d'una participació.<br/><strong>Crowdfunding:</strong> finançament col·lectiu a través de plataformes (reward-based: Kickstarter; equity-based: Crowdcube; lending-based: October).<br/><strong>ICO/finançament públic:</strong> línies ICO (préstecs bonificats), ENISA (préstecs participatius per a emprenedors), CDTI (finançament I+D), fons Next Generation EU.<br/><strong>Emissió d'accions (Borsa):</strong> OPV (Oferta Pública de Venta) per a empreses que volen cotitzar.</p></TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="rose"><p>La funció financera obté i gestiona recursos. Les fonts es classifiquen per propietat (pròpia/aliena), plaç (LP/CP) i origen (interna/externa). La financiació pròpia inclou capital social, reserves i autofinançament (amortitzacions, provisions). L'aliena a LP: préstecs, empréstits, leasing, subvencions. A CP: proveïdors, pòlissa de crèdit, descompte d'efectes, factoring. El WACC pondera el cost de cada font. Noves formes: business angels, VC, crowdfunding, ICO/ENISA, borsa.</p></TheoryBlock>
            </Card>
            <BibliografiaBox items={["Brealey, R., Myers, S. & Allen, F. (2020). Principios de Finanzas Corporativas, 13.ª ed. McGraw-Hill.","Bueno Campos, E. (2022). Curso básico de Economía de la Empresa. Pirámide.","Suárez, A. S. (2014). Decisiones óptimas de inversión y financiación en la empresa, 22.ª ed. Pirámide.","Ross, S., Westerfield, R. & Jordan, B. (2019). Fundamentals of Corporate Finance, 12.ª ed. McGraw-Hill.","Banco de España. Central de Información de Riesgos. www.bde.es","ICO. Líneas de financiación. www.ico.es","ENISA. Préstamos participativos. www.enisa.es","Ley 5/2015 de Fomento de la Financiación Empresarial.","CNMV. Plataformas de financiación participativa. www.cnmv.es","Modigliani, F. & Miller, M. (1958). The Cost of Capital. American Economic Review."]} />
        </div>
    );

    // ════════════════════════════════════════════════════════════════
    // TEMA 58 — La selecció d'inversions. VAN, TIR, Payback.
    // ════════════════════════════════════════════════════════════════
    const Tema58Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducció" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>decisió d'inversió</strong> —en quins actius emprar els recursos financers— és, juntament amb la de finançament, la decisió més important de l'empresa. Una inversió compromet fons a llarg termini amb l'expectativa d'obtindre rendiments futurs superiors al cost del capital. Els mètodes de selecció d'inversions permeten avaluar i comparar projectes per a triar els més rendibles.</p>
                    <p>Aquest tema és <strong>essencial per als supòsits pràctics d'oposicions</strong> i s'emmarca en CE6 d'<strong>Economia de l'Empresa de 2n de Batxillerat</strong> (RD 243/2022). S'estructura en: concepte d'inversió, mètodes estàtics (Payback), mètodes dinàmics (VAN, TIR) i comparació de criteris.</p>
                </div>
            </Card>
            <Card title="1. Concepte i variables d'una inversió" icon="📘">
                <TheoryBlock title="1.1. Definició i tipus" color="rose">
                    <p>Una <strong>inversió</strong> és l'acte de renunciar a una satisfacció present (diners) per a obtindre un benefici futur. En sentit empresarial: desemborsament de fons per a adquirir actius (maquinària, tecnologia, stocks, I+D) que generaran fluxos de caixa futurs.<br/><strong>Tipus:</strong> inversions productives (ampliar capacitat), inversions de reemplaçament (substituir equips obsolets), inversions en I+D, inversions financeres (accions, bons).</p>
                </TheoryBlock>
                <TheoryBlock title="1.2. Variables d'un projecte d'inversió" color="red">
                    <p><strong>Desemborsament inicial (A o D₀):</strong> quantitat invertida en el moment 0.<br/><strong>Fluxos nets de caixa (Qᵢ):</strong> cobraments − pagaments generats per la inversió en cada període i. Q₁, Q₂, ..., Qₙ.<br/><strong>Durada (n):</strong> nombre de períodes (anys) de vida útil del projecte.<br/><strong>Taxa de descompte (k):</strong> cost del capital o rendibilitat mínima exigida (WACC).<br/><strong>Valor residual (VR):</strong> valor de l'actiu al final de la seua vida útil (se suma a l'últim flux de caixa).</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Mètodes estàtics" icon="📘">
                <TheoryBlock title="2.1. Payback (termini de recuperació)" color="rose">
                    <p>El <strong>Payback</strong> és el temps que tarda la inversió a recuperar el desemborsament inicial amb els fluxos de caixa generats.</p>
                    <p><strong>Amb fluxos constants:</strong> Payback = A / Q<br/><strong>Amb fluxos variables:</strong> s'acumulen els fluxos fins a igualar A.<br/><strong>Criteri:</strong> es tria la inversió amb menor Payback (recupera abans). S'accepta si el Payback &lt; termini màxim establit per l'empresa.</p>
                    <p><strong>Avantatges:</strong> simplicitat, liquiditat (afavoreix projectes que recuperen ràpid).<br/><strong>Inconvenients:</strong> <em>no té en compte el valor temporal del diner</em> (un euro hui val més que un euro demà), <em>ignora els fluxos posteriors a la recuperació</em> (un projecte que genera grans fluxos després del Payback és rebutjat), no mesura la rendibilitat real.</p>
                </TheoryBlock>
                <FormulaBox formula="Payback = A / Q (fluxos constants) | Acumular Qᵢ fins ΣQᵢ ≥ A (variables)" desc="Temps de recuperació. No considera el valor temporal del diner." />
            </Card>
            <Card title="3. Mètodes dinàmics" icon="📘">
                <TheoryBlock title="3.1. Valor Actual Net (VAN)" color="rose">
                    <p>El <strong>VAN</strong> (Valor Actual Net, NPV en anglés) és la diferència entre el valor actual dels fluxos de caixa futurs i el desemborsament inicial. Actualitza tots els fluxos al moment present utilitzant la taxa de descompte k:</p>
                    <p><strong>VAN = −A + Q₁/(1+k)¹ + Q₂/(1+k)² + ... + Qₙ/(1+k)ⁿ</strong></p>
                    <p><strong>Criteri:</strong> VAN &gt; 0 → la inversió genera valor (s'accepta). VAN = 0 → indiferent. VAN &lt; 0 → destrueix valor (es rebutja). Entre diversos projectes, es tria el de <strong>major VAN</strong>.</p>
                    <p><strong>Avantatges:</strong> té en compte el valor temporal del diner, considera tots els fluxos de caixa, mesura la creació de valor en termes absoluts (euros), és el mètode teòricament més correcte.<br/><strong>Inconvenients:</strong> requereix estimar fluxos futurs (incertesa), l'elecció de la taxa de descompte k és crítica i subjectiva.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Taxa Interna de Rendibilitat (TIR)" color="red">
                    <p>La <strong>TIR</strong> (Taxa Interna de Rendibilitat, IRR en anglés) és la taxa de descompte que fa el VAN = 0. És la rendibilitat del projecte:</p>
                    <p><strong>0 = −A + Q₁/(1+r)¹ + Q₂/(1+r)² + ... + Qₙ/(1+r)ⁿ</strong></p>
                    <p>On <strong>r = TIR</strong>. Es resol per interpolació o amb calculadora/full de càlcul.</p>
                    <p><strong>Criteri:</strong> TIR &gt; k → la inversió rendeix més que el cost de capital (s'accepta). TIR = k → indiferent. TIR &lt; k → rendeix menys que el cost de capital (es rebutja). Entre diversos projectes, es tria el de <strong>major TIR</strong>.</p>

            <Card title="1. El compte de resultats" icon="📘">
                <TheoryBlock title="1.1. Estructura" color="rose">
                    <p>El compte de resultats (PGC) es desglossa en:<br/><strong>1. Resultat d'explotació (BAII/EBIT):</strong><br/>Ingressos d'explotació (vendes netes, prestació de serveis, subvencions d'explotació)<br/>− Despeses d'explotació (aprovisionaments, despeses de personal, amortitzacions, serveis exteriors, tributs)<br/>= <strong>BAII (Benefici Abans d'Interessos i Impostos)</strong></p>
                    <p><strong>2. Resultat financer:</strong><br/>Ingressos financers (interessos de dipòsits, dividends cobrats)<br/>− Despeses financeres (interessos de préstecs, comissions bancàries)<br/>= Resultat financer (normalment negatiu)</p>
                    <p><strong>3. Resultat abans d'impostos (BAI):</strong> BAII + Resultat financer<br/><strong>4. Impost sobre Societats:</strong> BAI × tipus impositiu (25 % general)<br/><strong>5. Resultat de l'exercici (BDI — Benefici Després d'Impostos):</strong> BAI − IS</p>
                </TheoryBlock>
                <FormulaBox formula="Vendes − Despeses explotació = BAII ± Resultat financer = BAI − IS = BDI" desc="Estructura escalonada: identifica on es genera (o es perd) valor" />
            </Card>
            <Card title="2. Anàlisi financera (liquiditat i solvència)" icon="📘">
                <TheoryBlock title="2.1. Ràtios de liquiditat" color="rose">
                    <p><strong>Ràtio de liquiditat (o corrent):</strong> AC / PC. Ideal: 1,5 − 2. Mesura la capacitat de pagar deutes a CP.<br/><strong>Ràtio de tresoreria (acid test):</strong> (AC − Existències) / PC. Ideal: ~1. Més estricte: exclou les existències (menys líquides).<br/><strong>Ràtio de disponibilitat:</strong> Disponible / PC. Ideal: 0,2 − 0,3. Mesura la liquiditat immediata.</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Ràtios de solvència i endeutament" color="red">
                    <p><strong>Ràtio de solvència (garantia):</strong> Actiu Total / Passiu Total. Ideal: &gt; 1,5. Mesura la capacitat de pagar tots els deutes liquidant l'actiu.<br/><strong>Ràtio d'endeutament:</strong> Passiu Total / (PN + Passiu). Ideal: 0,4 − 0,6. Proporció de finançament alié.<br/><strong>Ràtio d'autonomia financera:</strong> PN / Passiu Total. Ideal: &gt; 1. Independència respecte als creditors.<br/><strong>Ràtio de qualitat del deute:</strong> PC / Passiu Total. Com menor, millor (deute a LP és menys pressió).</p>
                </TheoryBlock>
            </Card>
            <Card title="3. Anàlisi econòmica (rendibilitat)" icon="📘">
                <TheoryBlock title="3.1. Rendibilitat econòmica (ROA/ROI)" color="rose">
                    <p><strong>RE = BAII / Actiu Total × 100</strong><br/>Mesura la rendibilitat dels actius independentment de com es financen. Indica l'eficiència de l'empresa en l'ús dels seus recursos. Com major, millor.</p>
                    <p>Es pot descompondre: <strong>RE = Marge × Rotació</strong> = (BAII/Vendes) × (Vendes/Actiu). L'empresa pot millorar la RE augmentant el marge (pujant preus o reduint costos) o augmentant la rotació (venent més amb el mateix actiu).</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Rendibilitat financera (ROE)" color="red">
                    <p><strong>RF = BDI / Patrimoni Net × 100</strong><br/>Mesura la rendibilitat per als accionistes/propietaris. Com major, millor. Depén de la RE, de l'endeutament i del cost del deute (efecte palanquejament).</p>
                    <p><strong>Efecte palanquejament (apalancament financer):</strong> si la RE &gt; cost del deute (ki), endeutar-se augmenta la RF (palanquejament positiu). Si la RE &lt; ki, endeutar-se redueix la RF (palanquejament negatiu). Fórmula simplificada: <strong>RF = RE + (RE − ki) × (D/PN) × (1−t)</strong>.</p>
                </TheoryBlock>
                <FormulaBox formula="RE = BAII/Actiu | RF = BDI/PN | Palanquejament: RF = RE + (RE−ki)×D/PN×(1−t)" desc="Si RE > ki → endeutar-se millora RF (palanquejament positiu)" />
            </Card>
            <Card title="4. Període mitjà de maduració" icon="📘">
                <TheoryBlock color="rose">
                    <p>El <strong>període mitjà de maduració (PMM)</strong> és el temps que tarda l'empresa a recuperar cada euro invertit en el cicle d'explotació:<br/><strong>PMM = PM d'aprovisionament + PM de fabricació + PM de venda + PM de cobrament − PM de pagament</strong><br/>On PM = 365 / Rotació de cada subperíode. El <strong>PMM financer</strong> (descomptant el PM de pagament a proveïdors) indica les necessitats reals de finançament del cicle d'explotació. Un PMM menor és millor (es recupera el diner més ràpid).</p>
                </TheoryBlock>
            </Card>
            <Card title="Síntesi" icon="📝">
                <TheoryBlock color="rose"><p>El compte de resultats mostra Vendes → BAII → BAI → BDI (estructura escalonada). L'anàlisi financera utilitza ràtios de liquiditat (corrent ~1,5-2, acid test ~1, disponibilitat ~0,2-0,3), solvència (garantia &gt;1,5, endeutament 0,4-0,6). L'anàlisi econòmica calcula la RE (BAII/Actiu = Marge × Rotació) i la RF (BDI/PN), relacionades per l'efecte palanquejament: si RE&gt;ki, endeutar-se millora la RF. El PMM mesura la durada del cicle d'explotació. Tema essencial per als supòsits pràctics d'oposicions.</p></TheoryBlock>
            </Card>
            <BibliografiaBox items={["Plan General de Contabilidad (RD 1514/2007, actualizado).","Archel, P. et al. (2018). Estados contables, 6.ª ed. Pirámide.","Bueno Campos, E. (2022). Curso básico de Economía de la Empresa. Pirámide.","Rivero Torre, P. (2012). Análisis de balances y estados complementarios. Pirámide.","Amat, O. (2018). Análisis de estados financieros, 12.ª ed. Gestión 2000.","Muñoz Merchante, A. (2021). Introducción a la Contabilidad. Ediciones Académicas.","Garrido, P. & Íñiguez, R. (2017). Análisis de estados contables. Pirámide.","González Pascual, J. (2016). Análisis de la empresa a través de su información económico-financiera. Pirámide."]} />
        </div>
    );
    const Tema60Resum = () => (
        <div className="space-y-5 animate-fade"><Card>
            <div className="p-4 bg-rose-50 rounded-xl border border-rose-200 mb-5"><p className="text-center font-bold text-rose-800 text-lg">Tema 60: Compte de resultats. Anàlisi economicofinancera.</p><p className="text-center text-sm text-rose-600 mt-1"><em>"RE, RF, ràtios i palanquejament: el diagnòstic complet de l'empresa"</em></p></div>
            <div className="space-y-4 text-sm text-slate-700">
                <div><h4 className="font-bold text-slate-800 mb-1">1. Compte de resultats</h4><ul className="list-disc pl-5 space-y-1"><li>Vendes − despeses explotació = BAII. ± Resultat financer = BAI. − IS (25%) = BDI.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">2. Ràtios financeres</h4><ul className="list-disc pl-5 space-y-1"><li>Liquiditat: AC/PC (~1,5-2). Acid test: (AC−Exist)/PC (~1). Disponibilitat: Disp/PC (~0,2-0,3).</li><li>Solvència: AT/PT (&gt;1,5). Endeutament: PT/(PN+PT) (0,4-0,6). Autonomia: PN/PT (&gt;1).</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">3. Rendibilitat</h4><ul className="list-disc pl-5 space-y-1"><li>RE (ROA) = BAII/Actiu = Marge × Rotació. Eficiència actius.</li><li>RF (ROE) = BDI/PN. Rendibilitat per als propietaris.</li><li>Palanquejament: si RE&gt;ki → endeutar-se millora RF (positiu). Si RE&lt;ki → negatiu.</li></ul></div>
                <div><h4 className="font-bold text-slate-800 mb-1">4. PMM</h4><ul className="list-disc pl-5 space-y-1"><li>PMM = PM aprovisionament + fabricació + venda + cobrament − pagament.</li><li>PMM financer = necessitats finançament cicle explotació. Menor = millor.</li></ul></div>
            </div>
            <FormulaBox formula="RE = BAII/Actiu | RF = BDI/PN | Si RE > ki → palanquejament positiu" desc="Diagnòstic complet: liquiditat + solvència + rendibilitat" />
            <ClauBox><p>- Domina l'<strong>estructura escalonada</strong> del compte de resultats (BAII → BAI → BDI).</p><p>- Calcula i interpreta els <strong>ràtios</strong> amb valors ideals.</p><p>- Explica <strong>RE (marge × rotació)</strong> i l'<strong>efecte palanquejament</strong>.</p><p>- Inclou el <strong>PMM</strong> com a ferramenta complementària.</p></ClauBox>
        </Card></div>
    );
    const Tema60 = () => { const [vista, setVista] = useState('complet'); return (<div className="space-y-6"><SectionTitle icon="📈" title="Tema 60" subtitle={t('tema60.title')} /><Tabs tabs={[{ id: 'complet', label: '📝 ' + t('tab.complet') }, { id: 'resum', label: '📋 ' + t('tab.resum') }]} active={vista} onChange={setVista} />{vista === 'complet' && <Tema60Complet />}{vista === 'resum' && <Tema60Resum />}</div>); };

    // ════════════════════════════════════════════════════════════════

        { id: 'inicio', label: t('sec.inicio'), emoji: '🏠' },

        { id: 'tema57', label: 'T57', emoji: '💰' },
