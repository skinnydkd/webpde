    // ════════════════════════════════════════════════════════════════
    // TEMA 49 — La empresa: concepto, elementos y funciones.
    // ════════════════════════════════════════════════════════════════
    const Tema49Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La <strong>empresa</strong> es la unidad económica fundamental de las economías de mercado: es la institución que organiza los factores productivos (trabajo, capital, recursos naturales, tecnología, conocimiento) para producir bienes y servicios destinados al mercado con el objetivo de obtener un beneficio. La empresa es, simultáneamente, una unidad de producción, una unidad financiera, una unidad de decisión y una organización social.
                    </p>
                    <p>
                        El estudio de la empresa es el eje vertebrador de la materia de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022) y está presente en múltiples competencias específicas: CE1 (la empresa como sistema y sus funciones), CE2 (análisis del entorno), CE3 (organización y dirección), CE4 (función productiva), CE5 (función comercial) y CE6 (función financiera y contable). La LOMLOE subraya la importancia de formar al alumnado en la comprensión de la iniciativa empresarial, el emprendimiento y la responsabilidad social.
                    </p>
                    <p>
                        El presente tema se estructura en cinco epígrafes: concepto de empresa y evolución del pensamiento empresarial, elementos de la empresa, funciones, clasificación de las empresas y el empresario y el emprendimiento.
                    </p>
                </div>
            </Card>

            <Card title="1. Concepto de empresa y evolución del pensamiento" icon="📘">
                <TheoryBlock title="1.1. Concepto de empresa" color="rose">
                    <p>
                        La empresa puede definirse desde múltiples perspectivas: <strong>económica</strong> (unidad de producción que combina factores para obtener bienes y servicios), <strong>jurídica</strong> (persona física o jurídica que ejerce una actividad económica organizada), <strong>sociológica</strong> (organización social con relaciones de poder, cultura e intereses diversos) y <strong>sistémica</strong> (sistema abierto que interactúa con su entorno, formado por subsistemas interrelacionados).
                    </p>
                    <p>
                        Una definición integradora: la empresa es una <strong>organización de recursos humanos, materiales, financieros y tecnológicos</strong>, coordinados bajo una dirección, que realiza actividades de producción y/o distribución de bienes o servicios con el fin de satisfacer necesidades del mercado y obtener un beneficio, asumiendo riesgo.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Evolución del pensamiento sobre la empresa" color="red">
                    <p>
                        <strong>Adam Smith (1776):</strong> la empresa como unidad de producción que se beneficia de la división del trabajo y la especialización.<br/>
                        <strong>Economía neoclásica (Marshall, Walras):</strong> la empresa como «caja negra» que maximiza el beneficio en competencia perfecta. Función de producción y costes.<br/>
                        <strong>Knight (1921):</strong> el empresario como agente que asume <strong>incertidumbre</strong> (riesgo no asegurable) y obtiene el beneficio como recompensa.<br/>
                        <strong>Schumpeter (1912, 1942):</strong> el empresario <strong>innovador</strong> como motor de la «destrucción creativa» — introduce nuevos productos, procesos, mercados, fuentes de aprovisionamiento u organizaciones que transforman la economía.<br/>
                        <strong>Coase (1937):</strong> la empresa como alternativa al mercado — existe porque los <strong>costes de transacción</strong> (buscar información, negociar, vigilar contratos) hacen más eficiente coordinar internamente que contratar en el mercado.<br/>
                        <strong>Simon (1947):</strong> racionalidad limitada — los directivos no maximizan sino que buscan soluciones <strong>satisfactorias</strong> (satisficing).<br/>
                        <strong>Teoría de la agencia (Jensen y Meckling, 1976):</strong> conflictos de intereses entre <strong>principal</strong> (propietarios/accionistas) y <strong>agente</strong> (directivos). Costes de agencia, gobierno corporativo.<br/>
                        <strong>Enfoque de recursos y capacidades (Penrose, 1959; Barney, 1991):</strong> la empresa como conjunto único de recursos y capacidades que generan <strong>ventaja competitiva sostenible</strong>.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Elementos de la empresa" icon="📘">
                <TheoryBlock title="2.1. Elementos tangibles e intangibles" color="rose">
                    <p>
                        <strong>Factores humanos:</strong> trabajadores (operarios, técnicos, administrativos), directivos (alta dirección, mandos intermedios) y el empresario/emprendedor. El <strong>capital humano</strong> (conocimientos, habilidades, experiencia, creatividad) es el factor más determinante de la competitividad.<br/>
                        <strong>Factores materiales:</strong> capital fijo (terrenos, edificios, maquinaria, equipos informáticos, vehículos) y capital circulante (materias primas, productos en curso, productos terminados, existencias).<br/>
                        <strong>Factores financieros:</strong> recursos financieros propios (capital social, reservas, beneficios retenidos) y ajenos (préstamos bancarios, emisión de obligaciones, proveedores, leasing).<br/>
                        <strong>Factores intangibles:</strong> tecnología (patentes, know-how, software), marca e imagen (reputación, fidelidad de clientes), organización (rutinas, procesos, cultura corporativa), relaciones (con clientes, proveedores, instituciones). Los <strong>activos intangibles</strong> representan una proporción creciente del valor de las empresas (en las empresas del S&P 500, más del 90 % del valor de mercado es intangible).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. La empresa como sistema" color="red">
                    <p>
                        La teoría general de sistemas (Bertalanffy) aplicada a la empresa (Kast y Rosenzweig) la concibe como un <strong>sistema abierto</strong>: recibe inputs del entorno (materias primas, trabajo, capital, información), los transforma mediante un proceso de producción y genera outputs (bienes, servicios, salarios, dividendos, impuestos, externalidades). El <strong>feedback</strong> (información de retorno del mercado: ventas, quejas, competencia) permite la adaptación continua.
                    </p>
                    <p>
                        Los <strong>subsistemas</strong> funcionales de la empresa son: producción/operaciones, comercial/marketing, financiero, recursos humanos, I+D/innovación, y dirección/administración. La <strong>sinergia</strong> (el todo es más que la suma de las partes) es la característica fundamental del sistema empresa.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Funciones de la empresa" icon="📘">
                <TheoryBlock title="3.1. Funciones económicas" color="rose">
                    <p>
                        <strong>1. Función de producción:</strong> transformar inputs en outputs con la mayor eficiencia posible (minimizar costes para un nivel de producción dado, o maximizar la producción para un nivel de costes dado).<br/>
                        <strong>2. Función de creación de valor:</strong> la empresa crea valor cuando el precio que los consumidores están dispuestos a pagar por sus productos supera el coste de los recursos utilizados. El <strong>valor añadido</strong> = Producción − Consumos intermedios.<br/>
                        <strong>3. Función de coordinación de factores:</strong> la empresa organiza y coordina trabajo, capital y tecnología de forma más eficiente que el mercado (Coase).<br/>
                        <strong>4. Función de asunción de riesgo:</strong> el empresario adelanta los factores productivos (paga salarios, compra materias primas, invierte en maquinaria) antes de conocer si el producto se venderá y a qué precio. Asume el riesgo de pérdida (Knight).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Funciones sociales" color="red">
                    <p>
                        <strong>1. Creación de empleo:</strong> las empresas son la principal fuente de empleo en las economías de mercado.<br/>
                        <strong>2. Generación y distribución de renta:</strong> la empresa distribuye la renta generada entre los factores: salarios (trabajadores), intereses (prestamistas), beneficios (propietarios/accionistas), impuestos (Estado), amortizaciones (reposición de capital).<br/>
                        <strong>3. Motor de innovación:</strong> la empresa es el principal agente de innovación (Schumpeter): introduce nuevos productos, procesos y modelos de negocio que transforman la economía.<br/>
                        <strong>4. Desarrollo del territorio:</strong> las empresas fijan población, generan infraestructuras y dinamizan el entorno local.<br/>
                        <strong>5. Responsabilidad social corporativa (RSC):</strong> la empresa contemporánea asume compromisos con sus <strong>stakeholders</strong> (grupos de interés: trabajadores, clientes, proveedores, comunidad, medio ambiente) más allá de la maximización del beneficio.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Clasificación de las empresas" icon="📘">
                <TheoryBlock title="4.1. Según la forma jurídica" color="rose">
                    <p>
                        <strong>Empresario individual (autónomo):</strong> persona física que ejerce la actividad en nombre propio, con responsabilidad ilimitada.<br/>
                        <strong>Sociedad Limitada (SL/SRL):</strong> capital mínimo 1 € (tras Ley Crea y Crece, 2022), responsabilidad limitada al capital aportado, mínimo 1 socio. La forma más común en España (más de 1,2 millones de SL).<br/>
                        <strong>Sociedad Anónima (SA):</strong> capital mínimo 60.000 €, dividido en acciones. Puede cotizar en Bolsa. Adecuada para grandes empresas.<br/>
                        <strong>Sociedad Cooperativa:</strong> propiedad colectiva, gestión democrática (un socio = un voto), reparto de excedentes según la actividad cooperativizada. Ejemplo: Mondragón (mayor grupo cooperativo del mundo).<br/>
                        <strong>Otras:</strong> Sociedad Laboral (mayoría del capital en manos de los trabajadores), Sociedad Comanditaria, Comunidad de Bienes, Emprendedor de Responsabilidad Limitada.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Según el tamaño" color="red">
                    <p>
                        La clasificación de la UE (Recomendación 2003/361/CE) según número de trabajadores, volumen de negocio y balance total:
                    </p>
                    <p>
                        <strong>Microempresa:</strong> &lt;10 trabajadores y facturación ≤2 M€. El 93 % de las empresas españolas.<br/>
                        <strong>Pequeña empresa:</strong> &lt;50 trabajadores y facturación ≤10 M€.<br/>
                        <strong>Mediana empresa:</strong> &lt;250 trabajadores y facturación ≤50 M€.<br/>
                        <strong>Gran empresa:</strong> ≥250 trabajadores o facturación &gt;50 M€.
                    </p>
                    <p>
                        En España, las <strong>pymes</strong> (micro + pequeñas + medianas) representan el 99,8 % del tejido empresarial y generan el 62 % del empleo. Sin embargo, las grandes empresas (0,2 %) generan el 38 % del empleo y concentran la mayor parte de las exportaciones, la inversión en I+D y la productividad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Según otros criterios" color="rose">
                    <p>
                        <strong>Según la propiedad del capital:</strong> privadas, públicas (Estado como accionista mayoritario: Correos, Paradores, AENA parcialmente), mixtas.<br/>
                        <strong>Según el sector de actividad:</strong> primario (agricultura, pesca), secundario (industria, construcción), terciario (servicios), cuaternario (I+D, TIC, consultoría).<br/>
                        <strong>Según el ámbito geográfico:</strong> locales, regionales, nacionales, multinacionales/transnacionales.<br/>
                        <strong>Según el grado de integración:</strong> empresa individual, grupo empresarial (holding), clúster, red empresarial, franquicia.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. El empresario y el emprendimiento" icon="📘">
                <TheoryBlock title="5.1. Evolución del concepto de empresario" color="rose">
                    <p>
                        <strong>Cantillon (1755):</strong> primer teórico del empresario — el que compra a precios ciertos y vende a precios inciertos (asunción de riesgo).<br/>
                        <strong>Say (1803):</strong> el empresario como coordinador de los factores de producción.<br/>
                        <strong>Knight (1921):</strong> empresario = tomador de decisiones bajo incertidumbre; el beneficio es la recompensa por asumir riesgo no asegurable.<br/>
                        <strong>Schumpeter (1912):</strong> empresario innovador. Motor de la destrucción creativa.<br/>
                        <strong>Kirzner (1973):</strong> empresario como descubridor de oportunidades de beneficio no explotadas (alertness).<br/>
                        <strong>Empresario actual:</strong> líder, estratega, innovador, gestor de equipos, comunicador. Separación propiedad-control (Berle y Means, 1932): en las grandes empresas, los propietarios (accionistas) delegan la gestión en directivos profesionales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Emprendimiento y ecosistema emprendedor" color="red">
                    <p>
                        El <strong>emprendimiento</strong> es el proceso de crear, desarrollar y gestionar una nueva empresa o proyecto. El ecosistema emprendedor incluye: acceso a financiación (business angels, capital riesgo, crowdfunding, préstamos ICO), formación (universidades, escuelas de negocios, FP), marcos regulatorios (Ley de Startups 2022: incentivos fiscales, visa de nómada digital, stock options), incubadoras y aceleradoras, cultura emprendedora y redes de apoyo.
                    </p>
                    <p>
                        España ha mejorado su ecosistema emprendedor: Barcelona y Madrid son hubs de startups reconocidos en Europa (Glovo, Cabify, Wallbox, Typeform, Factorial). Sin embargo, la tasa de actividad emprendedora temprana (TEA) en España (~6 %, según GEM) sigue por debajo de la media de las economías avanzadas (~10 %).
                    </p>
                </TheoryBlock>
            </Card>

                <TheoryBlock color="violet">

                        Este tema es el punto de partida de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022), conectando con CE1 (la empresa como sistema), CE2 (análisis del entorno) y los contenidos transversales de emprendimiento y educación financiera. Contribuye a las competencias <strong>CE</strong> (comprensión de la iniciativa empresarial, emprendimiento), <strong>CC</strong> (responsabilidad social, stakeholders), <strong>STEM</strong> (análisis cuantitativo de datos empresariales) y <strong>CPSAA</strong> (liderazgo, trabajo en equipo, toma de decisiones). La Ley de Startups (2022) y el ecosistema emprendedor español ofrecen conexiones con la actualidad.
                    </p>

            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose">
                    <p>

                    </p>

            <Card title="1. Concepto y tipos de entorno empresarial" icon="📘">
                <TheoryBlock title="1.1. El entorno empresarial" color="rose">
                    <p>
                        El <strong>entorno empresarial</strong> es el conjunto de factores externos a la empresa que influyen en su actividad y resultados. Se distinguen dos niveles:
                    </p>
                    <p>
                        <strong>Entorno general (macroentorno):</strong> factores que afectan a todas las empresas de una economía, independientemente del sector. Son poco controlables por la empresa individual.<br/>
                        <strong>Entorno específico (microentorno o entorno competitivo):</strong> factores que afectan específicamente a las empresas de un sector o industria concreto. La empresa puede influir parcialmente en ellos.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Características del entorno actual" color="red">
                    <p>
                        El entorno contemporáneo se caracteriza por: <strong>complejidad</strong> (múltiples variables interrelacionadas), <strong>dinamismo</strong> (cambios rápidos e impredecibles), <strong>incertidumbre</strong> (dificultad para prever el futuro), <strong>globalización</strong> (interdependencia de mercados) y <strong>disrupción tecnológica</strong> (inteligencia artificial, digitalización, plataformas). El acrónimo <strong>VUCA</strong> (Volatilidad, Incertidumbre, Complejidad, Ambigüedad) describe este entorno.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. Análisis del entorno general: PESTEL" icon="📘">
                <TheoryBlock title="2.1. El modelo PESTEL" color="rose">
                    <p>
                        El análisis <strong>PESTEL</strong> es la herramienta más utilizada para sistematizar el estudio del macroentorno. Identifica seis dimensiones:
                    </p>
                    <p>
                        <strong>P — Político:</strong> estabilidad política, política fiscal, regulación laboral, política comercial, subvenciones, política industrial, legislación de competencia, protección al consumidor.<br/>
                        <strong>E — Económico:</strong> ciclo económico (expansión/recesión), tipos de interés, inflación, tipo de cambio, PIB, nivel de empleo/desempleo, renta disponible, distribución de la renta, política monetaria del BCE.<br/>
                        <strong>S — Social/Sociocultural:</strong> demografía (envejecimiento, migración, urbanización), valores y actitudes (sostenibilidad, igualdad, conciliación), estilos de vida, nivel educativo, distribución de la renta, movimientos sociales.<br/>
                        <strong>T — Tecnológico:</strong> innovación tecnológica, I+D, digitalización, inteligencia artificial, automatización, comercio electrónico, ciberseguridad, protección de datos, tecnologías disruptivas.<br/>
                        <strong>E — Ecológico/Medioambiental:</strong> cambio climático, regulación ambiental (emisiones, residuos), economía circular, energías renovables, escasez de recursos, conciencia ecológica del consumidor, taxonomía verde de la UE.<br/>
                        <strong>L — Legal:</strong> legislación mercantil, protección de datos (RGPD), propiedad intelectual, normativa de seguridad e higiene, legislación fiscal, normativa sectorial (alimentaria, farmacéutica, financiera).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Aplicación del PESTEL" color="red">
                    <p>
                        El análisis PESTEL no es una lista exhaustiva sino una <strong>herramienta de reflexión estratégica</strong>: se trata de identificar los factores del macroentorno que son <strong>más relevantes</strong> para la empresa o sector concreto, valorar si representan <strong>oportunidades o amenazas</strong>, y anticipar su evolución probable. Ejemplo: para una empresa de energías renovables, los factores ecológicos (regulación verde), tecnológicos (eficiencia de paneles solares) y políticos (subvenciones) serán más determinantes que para una empresa textil.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Análisis del entorno específico: las cinco fuerzas de Porter" icon="📘">
                <TheoryBlock title="3.1. El modelo de las cinco fuerzas (1980)" color="rose">
                    <p>
                        <strong>Michael Porter</strong> propuso en <em>Competitive Strategy</em> (1980) un modelo para analizar la <strong>estructura competitiva de un sector</strong> y determinar su atractivo (rentabilidad potencial). Las cinco fuerzas son:
                    </p>
                    <p>
                        <strong>1. Rivalidad entre competidores existentes:</strong> intensidad de la competencia entre las empresas que ya operan en el sector. Depende de: número y equilibrio de competidores, crecimiento del sector (en sectores maduros o en declive, la rivalidad es mayor), diferenciación del producto, costes fijos (sectores con altos costes fijos tienden a guerras de precios), barreras de salida.
                    </p>
                    <p>
                        <strong>2. Amenaza de nuevos entrantes:</strong> riesgo de que nuevas empresas se incorporen al sector, atraídas por su rentabilidad. Depende de las <strong>barreras de entrada</strong>: economías de escala, inversión inicial, acceso a canales de distribución, diferenciación de marca, regulación, patentes, costes de cambio para el cliente.
                    </p>
                    <p>
                        <strong>3. Amenaza de productos sustitutivos:</strong> bienes o servicios de otros sectores que satisfacen la misma necesidad (ej.: el tren sustituye al avión en distancias medias; el streaming sustituye al cine). Cuanto más sustitutos y mejor su relación calidad-precio, menor la rentabilidad del sector.
                    </p>
                    <p>
                        <strong>4. Poder de negociación de los proveedores:</strong> capacidad de los proveedores para imponer condiciones (precios, calidad, plazos). Mayor poder cuando: pocos proveedores, inputs diferenciados o sin sustitutos, alto coste de cambio de proveedor, amenaza de integración vertical hacia adelante.
                    </p>
                    <p>
                        <strong>5. Poder de negociación de los clientes:</strong> capacidad de los clientes para presionar a la baja los precios o exigir mayor calidad. Mayor poder cuando: pocos clientes grandes, productos estandarizados, bajo coste de cambio, alta información del cliente, amenaza de integración vertical hacia atrás.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Sexta fuerza: complementadores" color="red">
                    <p>
                        Brandenburger y Nalebuff (1996) añadieron una sexta fuerza: los <strong>complementadores</strong> — empresas cuyos productos o servicios aumentan el valor del producto de la empresa analizada (ej.: las apps complementan los smartphones; los videojuegos complementan las consolas). Un sector con fuertes complementadores puede ser más atractivo.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Análisis interno: recursos, capacidades y cadena de valor" icon="📘">
                <TheoryBlock title="4.1. El análisis VRIO" color="rose">
                    <p>
                        El modelo <strong>VRIO</strong> (Barney, 1991) evalúa los recursos y capacidades internos de la empresa para determinar si generan ventaja competitiva sostenible. Un recurso o capacidad debe cumplir cuatro condiciones:
                    </p>
                    <p>
                        <strong>V — Valioso:</strong> ¿permite explotar oportunidades o neutralizar amenazas?<br/>
                        <strong>R — Raro:</strong> ¿lo poseen pocos competidores?<br/>
                        <strong>I — Inimitable:</strong> ¿es difícil o costoso de copiar? (por historia única, complejidad social, ambigüedad causal, patentes).<br/>
                        <strong>O — Organizado:</strong> ¿la empresa está organizada para explotar el recurso? (estructura, procesos, incentivos).
                    </p>
                    <p>
                        Si las cuatro condiciones se cumplen → <strong>ventaja competitiva sostenible</strong>. Si falla alguna → ventaja temporal, paridad o desventaja.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. La cadena de valor (Porter, 1985)" color="red">
                    <p>
                        La <strong>cadena de valor</strong> descompone las actividades de la empresa en actividades <strong>primarias</strong> y de <strong>apoyo</strong> para identificar dónde se crea (o destruye) valor:
                    </p>
                    <p>
                        <strong>Actividades primarias:</strong> logística interna (recepción, almacenamiento), operaciones (fabricación, montaje), logística externa (distribución), marketing y ventas, servicio posventa.<br/>
                        <strong>Actividades de apoyo:</strong> infraestructura de la empresa (dirección, finanzas, planificación), gestión de recursos humanos, desarrollo tecnológico (I+D), aprovisionamiento (compras).
                    </p>
                    <p>
                        El <strong>margen</strong> es la diferencia entre el valor total generado y el coste total de las actividades. La ventaja competitiva surge cuando la empresa realiza las actividades estratégicamente relevantes de forma más eficiente (liderazgo en costes) o diferenciada (diferenciación) que sus competidores.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="5. Herramientas integradoras: DAFO y estrategias" icon="📘">
                <TheoryBlock title="5.1. El análisis DAFO (SWOT)" color="rose">
                    <p>
                        El análisis <strong>DAFO</strong> (Debilidades, Amenazas, Fortalezas, Oportunidades) integra el análisis externo (oportunidades y amenazas del entorno general y específico) con el análisis interno (fortalezas y debilidades de los recursos y capacidades):
                    </p>
                    <p>
                        <strong>Fortalezas (interno +):</strong> ventajas competitivas, recursos valiosos, marca reconocida, tecnología propia, equipo talentoso.<br/>
                        <strong>Debilidades (interno −):</strong> carencias de recursos, falta de financiación, tecnología obsoleta, baja productividad, marca débil.<br/>
                        <strong>Oportunidades (externo +):</strong> crecimiento del mercado, cambio regulatorio favorable, nueva tecnología aprovechable, tendencia social afín.<br/>
                        <strong>Amenazas (externo −):</strong> nueva competencia, recesión económica, regulación adversa, cambio tecnológico disruptivo, subida de costes.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. De DAFO a estrategias" color="red">
                    <p>
                        La matriz DAFO no es solo un diagnóstico, sino una herramienta para formular <strong>estrategias</strong>:
                    </p>
                    <p>
                        <strong>FO (maxi-maxi):</strong> usar fortalezas para aprovechar oportunidades (estrategias ofensivas).<br/>
                        <strong>FA (maxi-mini):</strong> usar fortalezas para contrarrestar amenazas (estrategias defensivas).<br/>
                        <strong>DO (mini-maxi):</strong> superar debilidades para aprovechar oportunidades (estrategias de reorientación).<br/>
                        <strong>DA (mini-mini):</strong> minimizar debilidades y evitar amenazas (estrategias de supervivencia).
                    </p>
                </TheoryBlock>
            </Card>

    const Tema51Complet = () => (

            <Card title="Introducción" icon="📌">

                    <p>

                    <p>
                        Este tema se enmarca en <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022), CE1 (la empresa y su entorno) y CE4 (función productiva). El presente tema se estructura en cinco epígrafes: factores de localización, localización industrial y comercial, concepto y medida de la dimensión empresarial, crecimiento empresarial y las pymes en la economía española.

            <Card title="1. La localización empresarial" icon="📘">
                <TheoryBlock title="1.1. Concepto y relevancia" color="rose">
                    <p>
                        La <strong>localización empresarial</strong> es la elección del lugar geográfico donde la empresa establece sus instalaciones (fábricas, oficinas, almacenes, puntos de venta). Es una decisión estratégica porque: condiciona los <strong>costes</strong> (transporte, mano de obra, suelo, fiscalidad), determina el <strong>acceso a mercados y recursos</strong>, afecta a la <strong>imagen</strong> de la empresa y genera <strong>externalidades</strong> de aglomeración (positivas o negativas).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Factores de localización industrial" color="red">
                    <p>
                        La teoría clásica de localización industrial (<strong>Alfred Weber</strong>, 1909) buscaba minimizar los costes de transporte (de materias primas y del producto terminado) y de mano de obra. Los factores contemporáneos amplían esta perspectiva:
                    </p>
                    <p>
                        <strong>Proximidad a materias primas:</strong> relevante para industrias extractivas, agroalimentaria, cementera.<br/>
                        <strong>Proximidad al mercado:</strong> reduce costes de transporte del producto final y facilita el contacto con clientes (especialmente en servicios).<br/>
                        <strong>Disponibilidad y coste de mano de obra:</strong> mano de obra cualificada (alta tecnología), abundante y de bajo coste (industria textil, ensamblaje).<br/>
                        <strong>Infraestructuras de transporte y comunicaciones:</strong> autopistas, puertos, aeropuertos, AVE, fibra óptica, conectividad digital.<br/>
                        <strong>Coste y disponibilidad de suelo industrial:</strong> polígonos industriales, parques tecnológicos, precios del suelo.<br/>
                        <strong>Marco legal y fiscal:</strong> incentivos fiscales (zonas francas, ZEC de Canarias), regulación ambiental, agilidad administrativa, seguridad jurídica.<br/>
                        <strong>Economías de aglomeración:</strong> beneficios de ubicarse junto a empresas complementarias (clústeres), proveedores especializados, centros de I+D y universidades (Silicon Valley, clúster cerámico de Castellón, clúster automoción de Cataluña).<br/>
                        <strong>Calidad de vida:</strong> factor creciente para atraer talento cualificado: clima, servicios públicos, cultura, ocio, seguridad.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Factores de localización comercial y de servicios" color="rose">
                    <p>
                        Para empresas comerciales y de servicios, los factores clave son:
                    </p>
                    <p>
                        <strong>Proximidad al cliente:</strong> el factor principal. Visibilidad, accesibilidad, flujo de peatones/vehículos.<br/>
                        <strong>Costes del local:</strong> alquiler o compra del local. Existe una relación directa entre ubicación premium y coste.<br/>
                        <strong>Complementariedad:</strong> beneficio de ubicarse junto a negocios complementarios (centros comerciales, zonas de restauración).<br/>
                        <strong>Competencia:</strong> la proximidad a competidores puede ser positiva (atrae clientes que comparan) o negativa (saturación).<br/>
                        <strong>Regulación urbanística:</strong> usos del suelo, licencias, horarios comerciales.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.4. Métodos de decisión de localización" color="red">
                    <p>
                        <strong>Método de los factores ponderados:</strong> se identifican los factores relevantes, se asigna un peso a cada uno (según su importancia) y se puntúa cada alternativa de localización. La alternativa con mayor puntuación ponderada es la elegida.<br/>
                        <strong>Método del punto muerto de localización:</strong> compara los costes fijos y variables de cada alternativa para diferentes niveles de producción. La localización óptima depende del volumen previsto.<br/>
                        <strong>Método del centro de gravedad:</strong> minimiza los costes de transporte considerando la ubicación de proveedores y clientes, ponderados por el volumen de mercancía.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="2. La dimensión empresarial" icon="📘">
                <TheoryBlock title="2.1. Concepto y medida" color="rose">
                    <p>
                        La <strong>dimensión</strong> (o tamaño) de la empresa se refiere a su capacidad productiva y a su escala de operaciones. No existe un indicador único para medirla; se utilizan varios criterios:
                    </p>
                    <p>
                        <strong>Número de trabajadores:</strong> el criterio más común (clasificación UE: micro, pequeña, mediana, grande).<br/>
                        <strong>Volumen de ventas/facturación:</strong> refleja la presencia en el mercado.<br/>
                        <strong>Activo total (balance):</strong> refleja el patrimonio invertido.<br/>
                        <strong>Capitalización bursátil:</strong> para empresas cotizadas, refleja el valor de mercado.<br/>
                        <strong>Volumen de producción:</strong> especialmente en industria (toneladas, unidades).<br/>
                        <strong>Beneficio neto, recursos propios, cuota de mercado:</strong> indicadores complementarios.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. La dimensión óptima y las economías de escala" color="red">
                    <p>
                        La <strong>dimensión óptima</strong> es aquella que minimiza los costes medios a largo plazo (CMLP). Las <strong>economías de escala</strong> son las reducciones del coste medio que se obtienen al aumentar la producción:
                    </p>
                    <p>
                        <strong>Economías de escala técnicas:</strong> indivisibilidades (una máquina produce 1.000 o 10.000 unidades con costes fijos similares), principio de las dimensiones (duplicar la capacidad de un contenedor no duplica los materiales), especialización del trabajo.<br/>
                        <strong>Economías de escala comerciales:</strong> mayor poder de negociación con proveedores, acceso a publicidad masiva, distribución más eficiente.<br/>
                        <strong>Economías de escala financieras:</strong> acceso a financiación más barata (mayor capacidad de endeudamiento, acceso a mercados de capitales).<br/>
                        <strong>Economías de escala de gestión:</strong> especialización directiva, sistemas de información avanzados.
                    </p>
                    <p>
                        Las <strong>deseconomías de escala</strong> aparecen cuando el crecimiento excesivo genera: burocratización, problemas de coordinación y comunicación, desmotivación, lentitud en la toma de decisiones, pérdida de flexibilidad.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="CMeLP = CT / Q → mínimo en la dimensión óptima"

            </Card>

            <Card title="3. El crecimiento empresarial" icon="📘">
                <TheoryBlock title="3.1. Crecimiento interno (orgánico)" color="rose">
                    <p>
                        El <strong>crecimiento interno</strong> consiste en aumentar la capacidad productiva mediante la inversión en nuevos activos: ampliación de instalaciones, compra de maquinaria, apertura de nuevos establecimientos, contratación de personal, desarrollo de nuevos productos. Es un crecimiento gradual, controlable y que preserva la cultura empresarial, pero más lento.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Crecimiento externo (inorgánico)" color="red">
                    <p>
                        El <strong>crecimiento externo</strong> consiste en incrementar la dimensión mediante la unión con otras empresas:
                    </p>
                    <p>
                        <strong>Fusión:</strong> dos o más empresas se unen para formar una nueva (fusión pura: A + B = C) o una absorbe a la otra (fusión por absorción: A + B = A').<br/>
                        <strong>Adquisición:</strong> compra de una participación de control en otra empresa (OPA — Oferta Pública de Adquisición— en empresas cotizadas).<br/>
                        <strong>Joint venture (empresa conjunta):</strong> dos empresas crean una tercera para un proyecto específico, compartiendo riesgos y recursos.<br/>
                        <strong>Alianzas estratégicas:</strong> acuerdos de cooperación sin crear una nueva entidad (acuerdos de distribución, licencias, I+D conjunto).<br/>
                        <strong>Franquicia:</strong> el franquiciador cede al franquiciado el derecho a explotar su marca, know-how y modelo de negocio a cambio de un canon y royalties. Ejemplo: McDonald's, Zara Home, MRW.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Tipos de integración" color="rose">
                    <p>
                        <strong>Integración horizontal:</strong> unión de empresas del mismo sector y fase productiva (ej.: fusión CaixaBank-Bankia). Busca: economías de escala, mayor poder de mercado, eliminación de competidores.<br/>
                        <strong>Integración vertical:</strong> unión de empresas de distintas fases de la cadena de valor. <em>Hacia atrás</em> (con proveedores: una cadena de supermercados compra granjas). <em>Hacia adelante</em> (con distribuidores: un fabricante abre tiendas propias — Inditex).<br/>
                        <strong>Diversificación (conglomerado):</strong> crecimiento hacia sectores no relacionados (ej.: Samsung: electrónica, seguros, construcción naval). Diversifica riesgos pero dificulta la gestión.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.4. Internacionalización" color="red">
                    <p>
                        La <strong>internacionalización</strong> es una forma de crecimiento cada vez más relevante. Las modalidades, de menor a mayor compromiso, son:
                    </p>
                    <p>
                        <strong>Exportación:</strong> venta de productos en mercados exteriores (directa o a través de intermediarios).<br/>
                        <strong>Licencias y franquicias internacionales:</strong> cesión de derechos de explotación a empresas locales.<br/>
                        <strong>Joint ventures internacionales:</strong> alianzas con socios locales.<br/>
                        <strong>Inversión directa (filiales):</strong> creación o adquisición de empresas en otros países. Máximo compromiso y control. Ejemplo: Santander en Reino Unido, BBVA en México, Inditex con tiendas en 90+ países.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="4. Las pymes en la economía española" icon="📘">
                <TheoryBlock title="4.1. Estructura empresarial española" color="rose">
                    <p>
                        El tejido empresarial español está dominado por <strong>microempresas y pymes</strong>: de los 3,3 millones de empresas registradas en el DIRCE (INE, 2024), el 55 % son empresarios individuales sin asalariados, el 38 % tiene entre 1 y 9 trabajadores, y solo el 0,13 % tiene más de 250 trabajadores. El <strong>99,8 % son pymes</strong> (&lt;250 trabajadores), que generan el 62 % del empleo y el 53 % del valor añadido.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Ventajas e inconvenientes de las pymes" color="red">
                    <p>
                        <strong>Ventajas:</strong> flexibilidad y rapidez de adaptación, cercanía al cliente, relaciones laborales más directas, capacidad de especialización en nichos, menor burocracia interna, arraigo local.<br/>
                        <strong>Inconvenientes:</strong> menor poder de negociación (con proveedores, bancos, grandes clientes), dificultad de acceso a financiación (mayor dependencia bancaria), menor inversión en I+D e internacionalización, menor capacidad de atraer talento cualificado, economías de escala limitadas, menor productividad media.
                    </p>
                    <p>
                        Las políticas de apoyo a las pymes incluyen: líneas de financiación (ICO, ENISA), incentivos fiscales (tipo reducido de IS para pymes), programas de digitalización (Kit Digital), internacionalización (ICEX), simplificación administrativa (Ley Crea y Crece 2022, que redujo el capital mínimo de la SL a 1 €) y formación empresarial.
                    </p>
                </TheoryBlock>

                    <p>

                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Ventajas e inconvenientes de las multinacionales" color="red">
                    <p>
                        <strong>Ventajas:</strong> economías de escala globales, diversificación geográfica de riesgos, acceso a recursos y mercados mundiales, transferencia interna de conocimiento y tecnología, poder de negociación.<br/>
                        <strong>Inconvenientes/críticas:</strong> deslocalización (traslado de producción a países con menores costes, con pérdida de empleo en el país de origen), elusión fiscal (uso de jurisdicciones de baja tributación), impacto ambiental, influencia política excesiva, homogeneización cultural. La <strong>responsabilidad fiscal y social de las multinacionales</strong> es un debate central (acuerdo OCDE de tributación mínima del 15 %, Pilar 2, 2024).
                    </p>
                </TheoryBlock>

            <Card title="Síntesis" icon="📝">

                    </p>

    const Tema52Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>
                        La <strong>función de producción</strong> y el <strong>análisis de costes</strong> constituyen el núcleo de la economía de la producción empresarial: determinan cuánto producir, cómo producir (con qué combinación de factores) y a qué precio mínimo puede ofrecerse el producto. El <strong>punto muerto</strong> (o umbral de rentabilidad) es la herramienta que vincula costes, precios y volumen de producción para determinar a partir de qué nivel la empresa obtiene beneficios.
                    </p>
                    <p>
                        Este tema es central en <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022), CE4 (función productiva y análisis de costes), y es uno de los más frecuentes en los <strong>supuestos prácticos de oposiciones</strong>. El presente tema se estructura en cinco epígrafes: la función de producción, productividad, tipos de costes, el punto muerto y decisiones de producción.
                    </p>
                </div>
            </Card>

            <Card title="1. La función de producción" icon="📘">
                <TheoryBlock title="1.1. Concepto" color="rose">
                    <p>
                        La <strong>función de producción</strong> expresa la relación técnica entre la cantidad de factores productivos utilizados (inputs: trabajo L, capital K, materias primas, tecnología) y la cantidad máxima de producto obtenido (output Q):
                    </p>
                    <p>
                        <strong>Q = f(L, K, T, ...)</strong>
                    </p>
                    <p>
                        La función de producción refleja la <strong>tecnología</strong> disponible: para una tecnología dada, indica la producción máxima alcanzable con cada combinación de factores. Un avance tecnológico desplaza la función de producción hacia arriba (más producción con los mismos inputs).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.2. Corto plazo: producto total, medio y marginal" color="red">
                    <p>
                        A <strong>corto plazo</strong>, al menos un factor es fijo (generalmente el capital: maquinaria, instalaciones) y otro es variable (trabajo). Al aumentar el factor variable:
                    </p>
                    <p>
                        <strong>Producto Total (PT):</strong> cantidad total producida.<br/>
                        <strong>Producto Medio (PMe = PT / L):</strong> producción por unidad de factor variable (productividad media del trabajo).<br/>
                        <strong>Producto Marginal (PMg = ΔPT / ΔL):</strong> incremento de producción al añadir una unidad adicional de factor variable.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="1.3. Ley de rendimientos marginales decrecientes" color="rose">
                    <p>
                        A corto plazo, al añadir unidades sucesivas de un factor variable (trabajo) manteniendo fijo el otro (capital), llega un punto a partir del cual el <strong>producto marginal</strong> del factor variable comienza a <strong>disminuir</strong>. Esto es la <strong>ley de rendimientos marginales decrecientes</strong> (David Ricardo): cada trabajador adicional aporta menos producción adicional porque el capital fijo se comparte entre más trabajadores.
                    </p>
                    <p>
                        <strong>Fases:</strong> 1) Rendimientos marginales crecientes (PMg ↑): el factor variable se combina eficientemente con el fijo. 2) Rendimientos marginales decrecientes (PMg ↓ pero PMg &gt; 0): producción crece pero a ritmo decreciente. 3) Rendimientos negativos (PMg &lt; 0): producción total disminuye (congestión). La empresa opera en la fase 2.
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Q = f(L, K) | PMe = PT / L | PMg = ΔPT / ΔL"
                    desc="Rendiments marginals decreixents: PMg ↓ quan L ↑ amb K fix"
                />
            </Card>

            <Card title="2. La productividad" icon="📘">
                <TheoryBlock title="2.1. Concepto y tipos" color="rose">
                    <p>
                        La <strong>productividad</strong> mide la eficiencia con la que se utilizan los factores productivos:
                    </p>
                    <p>
                        <strong>Productividad del trabajo:</strong> PT / L (unidades producidas por trabajador o por hora de trabajo). Es el indicador más utilizado.<br/>
                        <strong>Productividad del capital:</strong> PT / K.<br/>
                        <strong>Productividad total de los factores (PTF):</strong> producción / combinación ponderada de todos los inputs. Mide la eficiencia global del sistema productivo y se asocia al <strong>progreso tecnológico y organizativo</strong> (residuo de Solow).
                    </p>
                </TheoryBlock>

                <TheoryBlock title="2.2. Factores determinantes de la productividad" color="red">
                    <p>
                        <strong>Inversión en capital físico:</strong> maquinaria más avanzada, automatización.<br/>
                        <strong>Capital humano:</strong> formación, experiencia, habilidades de los trabajadores.<br/>
                        <strong>Tecnología e innovación:</strong> I+D, digitalización, nuevos procesos productivos.<br/>
                        <strong>Organización y gestión:</strong> métodos de producción eficientes (lean manufacturing, just-in-time, kaizen), liderazgo, motivación.<br/>
                        <strong>Infraestructuras:</strong> transporte, telecomunicaciones, energía.<br/>
                        <strong>Marco institucional:</strong> seguridad jurídica, regulación eficiente, competencia.
                    </p>
                    <p>
                        La <strong>productividad es el determinante principal del nivel de vida</strong> a largo plazo (Krugman: «la productividad no lo es todo, pero a largo plazo lo es casi todo»). España tiene un problema de productividad: la PTF ha crecido menos que la media de la UE desde los años 90.
                    </p>
                </TheoryBlock>
            </Card>

            <Card title="3. Tipos de costes" icon="📘">
                <TheoryBlock title="3.1. Costes fijos, variables y totales" color="rose">
                    <p>
                        <strong>Costes fijos (CF):</strong> no varían con el volumen de producción a corto plazo. Ejemplos: alquiler del local, amortización de maquinaria, seguros, salarios de personal fijo, intereses de préstamos. <em>Existen aunque la producción sea cero.</em><br/>
                        <strong>Costes variables (CV):</strong> varían proporcionalmente (o no) con el volumen de producción. Ejemplos: materias primas, energía consumida en la fabricación, mano de obra directa (si se contrata por producción), comisiones de venta.<br/>
                        <strong>Coste total (CT):</strong> CT = CF + CV
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.2. Costes medios y coste marginal" color="red">
                    <p>
                        <strong>Coste fijo medio (CFMe):</strong> CF / Q. Disminuye continuamente al aumentar Q (el coste fijo se reparte entre más unidades).<br/>
                        <strong>Coste variable medio (CVMe):</strong> CV / Q. Suele tener forma de U (primero disminuye por la especialización, luego aumenta por los rendimientos decrecientes).<br/>
                        <strong>Coste total medio (CTMe):</strong> CT / Q = CFMe + CVMe. Forma de U.<br/>
                        <strong>Coste marginal (CMg):</strong> ΔCT / ΔQ = ΔCV / ΔQ. Es el coste adicional de producir una unidad más. Forma de U. <em>El CMg corta al CTMe y al CVMe en sus puntos mínimos.</em>
                    </p>
                </TheoryBlock>

                <TheoryBlock title="3.3. Costes directos e indirectos" color="rose">
                    <p>
                        <strong>Costes directos:</strong> imputables directamente a un producto o servicio (materia prima, mano de obra directa).<br/>
                        <strong>Costes indirectos:</strong> compartidos entre varios productos o servicios (alquiler de la fábrica, dirección general, limpieza). Requieren criterios de reparto (imputación).
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="CT = CF + CV | CTMe = CT/Q | CMg = ΔCT/ΔQ"
                    desc="El CMg talla el CTMe i el CVMe en els seus mínims"
                />
            </Card>

            <Card title="4. El punto muerto (umbral de rentabilidad)" icon="📘">
                <TheoryBlock title="4.1. Concepto" color="rose">
                    <p>
                        El <strong>punto muerto</strong> (break-even point), también llamado <strong>umbral de rentabilidad</strong> o <strong>punto de equilibrio</strong>, es el nivel de producción y ventas en el que los <strong>ingresos totales igualan a los costes totales</strong>: IT = CT. A partir de ese punto, la empresa obtiene beneficios; por debajo, incurre en pérdidas.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.2. Cálculo" color="red">
                    <p>
                        Supuestos simplificadores: precio de venta unitario (p) constante, coste variable unitario (cv) constante, costes fijos (CF) dados.
                    </p>
                    <p>
                        <strong>IT = CT</strong><br/>
                        p × Q = CF + cv × Q<br/>
                        p × Q − cv × Q = CF<br/>
                        Q × (p − cv) = CF<br/>
                        <strong>Q* = CF / (p − cv)</strong>
                    </p>
                    <p>
                        Donde <strong>(p − cv)</strong> es el <strong>margen de contribución unitario</strong>: la parte del precio de cada unidad vendida que contribuye a cubrir los costes fijos y, una vez cubiertos, a generar beneficio.
                    </p>
                    <p>
                        <strong>Ejemplo:</strong> CF = 100.000 €, p = 50 €/ud, cv = 30 €/ud.<br/>
                        Q* = 100.000 / (50 − 30) = 100.000 / 20 = <strong>5.000 unidades</strong>.<br/>
                        Ingresos en el punto muerto: 5.000 × 50 = 250.000 €.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="4.3. Representación gráfica e interpretación" color="rose">
                    <p>
                        En el gráfico: el eje horizontal representa las unidades producidas y vendidas (Q), y el eje vertical los euros (€). La línea de <strong>ingresos totales</strong> (IT = p × Q) parte del origen con pendiente p. La línea de <strong>costes totales</strong> (CT = CF + cv × Q) parte de CF con pendiente cv. Se cruzan en Q*: a la izquierda hay pérdidas, a la derecha beneficios.
                    </p>
                    <p>
                        <strong>Utilidad del punto muerto:</strong> determinar el volumen mínimo de ventas para no perder dinero, evaluar la viabilidad de un proyecto, analizar el impacto de cambios en precios, costes fijos o costes variables, comparar alternativas productivas.
                    </p>
                    <p>
                        <strong>Limitaciones:</strong> supone precio y coste variable constantes (en la realidad pueden variar con el volumen), no considera la variación de stocks, asume un solo producto (o un mix constante), es un modelo estático (no considera el factor tiempo ni la incertidumbre).
                    </p>
                </TheoryBlock>

                <FormulaBox
                    formula="Q* = CF / (p − cv)"
                    desc="Punt mort: volum on IT = CT. Marge contribució = p − cv"
                />
            </Card>

            <Card title="5. Decisiones de producción y eficiencia" icon="📘">
                <TheoryBlock title="5.1. Eficiencia técnica y económica" color="rose">
                    <p>
                        <strong>Eficiencia técnica:</strong> un proceso es técnicamente eficiente si no existe otro que produzca la misma cantidad con menos de algún factor sin utilizar más de otro. De los métodos técnicamente eficientes, la empresa elige el que es <strong>económicamente eficiente</strong>: el que minimiza el coste total dados los precios de los factores.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.2. Producir o comprar (make or buy)" color="red">
                    <p>
                        La empresa decide si fabricar un componente internamente o comprarlo a un proveedor comparando: coste de fabricación interna vs. precio de compra externa, calidad y control, dependencia del proveedor, flexibilidad, costes de transacción (Coase). Esta decisión se vincula con el concepto de <strong>integración vertical</strong> y la <strong>externalización (outsourcing)</strong>.
                    </p>
                </TheoryBlock>

                <TheoryBlock title="5.3. Sistemas de producción" color="rose">
                    <p>
                        <strong>Producción por encargo (bajo pedido):</strong> se fabrica según las especificaciones del cliente (construcción, alta costura, maquinaria industrial). Alta personalización, costes elevados.<br/>
                        <strong>Producción por lotes:</strong> se fabrican cantidades limitadas de productos diferentes (panadería, textil, electrónica). Flexibilidad media.<br/>
                        <strong>Producción en masa (cadena de montaje):</strong> grandes volúmenes de productos estandarizados (automoción, electrodomésticos). Economías de escala, menor coste unitario.<br/>
                        <strong>Producción continua (proceso):</strong> producción ininterrumpida de productos homogéneos (refino de petróleo, siderurgia, cemento, industria química). Máximas economías de escala.<br/>
                        <strong>Producción just-in-time (JIT):</strong> sistema de Toyota. Producir solo lo necesario, en el momento necesario, en la cantidad necesaria. Minimiza inventarios, reduce desperdicios (lean manufacturing).
                    </p>
                </TheoryBlock>
            </Card>

                <TheoryBlock color="violet">
                    <p>
                        Este tema es el más cuantitativo de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022), directamente vinculado a CE4 (función productiva, análisis de costes, punto muerto). Es fundamental para los <strong>supuestos prácticos</strong> de oposiciones (cálculos de costes, productividad, punto muerto). Contribuye a las competencias <strong>STEM</strong> (cálculo, representación gráfica, análisis cuantitativo), <strong>CE</strong> (análisis de viabilidad económica de un proyecto), <strong>CPSAA</strong> (toma de decisiones basadas en datos) y <strong>CCL</strong> (interpretación de cuentas de costes e informes de producción).

    // TEMA 53 — La organización empresarial. Estructura.
    // ════════════════════════════════════════════════════════════════
    const Tema53Complet = () => (
        <div className="space-y-6 animate-fade">
            <Card title="Introducción" icon="📌">
                <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                    <p>La <strong>organización empresarial</strong> es el proceso de diseñar la estructura interna de la empresa: dividir el trabajo, agrupar las actividades en departamentos, establecer relaciones de autoridad y coordinación, y definir los flujos de comunicación. Una estructura organizativa adecuada permite a la empresa alcanzar sus objetivos de forma eficiente; una inadecuada genera duplicidades, conflictos, lentitud y desmotivación.</p>
                    <p>Este tema se enmarca en CE3 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong> (RD 243/2022): organización y gestión de la empresa. Se estructura en cinco epígrafes: principios organizativos, organización formal e informal, modelos de estructura organizativa, el organigrama y nuevas formas organizativas.</p>
                </div>
            </Card>
            <Card title="1. Principios de organización" icon="📘">
                <TheoryBlock title="1.1. División del trabajo y especialización" color="rose">
                    <p><strong>Adam Smith</strong> (1776) demostró que la <strong>división del trabajo</strong> —descomponer una tarea compleja en operaciones simples asignadas a trabajadores especializados— multiplica la productividad (ejemplo de la fábrica de alfileres). La <strong>especialización</strong> permite desarrollar habilidades, reducir tiempos muertos y facilitar la mecanización. Sin embargo, una especialización excesiva genera monotonía, desmotivación y rigidez.</p>
                </TheoryBlock>
                <TheoryBlock title="1.2. Autoridad, responsabilidad y delegación" color="red">
                    <p><strong>Autoridad:</strong> derecho legítimo a tomar decisiones y dar instrucciones. Puede ser <em>lineal</em> (jerárquica, sobre subordinados directos) o de <em>staff</em> (asesora, sin autoridad directa sobre la línea).<br/><strong>Responsabilidad:</strong> obligación de responder por las decisiones y resultados.<br/><strong>Delegación:</strong> transferencia de autoridad de un superior a un subordinado para realizar tareas específicas. La delegación <em>no transfiere</em> la responsabilidad última.<br/><strong>Centralización vs. descentralización:</strong> una organización centralizada concentra la toma de decisiones en la cúpula; una descentralizada delega decisiones a niveles inferiores. La tendencia actual favorece la descentralización (agilidad, motivación, adaptación local).</p>
                </TheoryBlock>
                <TheoryBlock title="1.3. Otros principios" color="rose">
                    <p><strong>Unidad de mando</strong> (Fayol): cada empleado debe recibir órdenes de un solo jefe.<br/><strong>Ámbito de control (span of control):</strong> número de subordinados que un jefe puede supervisar eficazmente. Depende de la complejidad de las tareas, la cualificación del personal y los sistemas de información. Ámbitos amplios → estructuras planas; ámbitos estrechos → estructuras altas.<br/><strong>Coordinación:</strong> mecanismos para integrar las actividades de los diferentes departamentos (supervisión directa, normas, ajuste mutuo, comités).</p>
                </TheoryBlock>
            </Card>
            <Card title="2. Organización formal e informal" icon="📘">
                <TheoryBlock title="2.1. Organización formal" color="rose">
                    <p>La <strong>organización formal</strong> es la estructura oficialmente definida por la dirección: organigrama, manuales de funciones, descripciones de puestos, procedimientos, normas internas. Define «quién hace qué, quién manda a quién y cómo se coordinan».</p>
                </TheoryBlock>
                <TheoryBlock title="2.2. Organización informal" color="red">
                    <p>La <strong>organización informal</strong> surge espontáneamente de las relaciones sociales entre los miembros: grupos de amistad, líderes naturales (no necesariamente los jefes formales), redes de comunicación no oficiales (rumores, chats), normas de grupo no escritas. Los <strong>experimentos de Hawthorne</strong> (Elton Mayo, 1927-1932) demostraron que la organización informal influye decisivamente en la productividad y la motivación. La dirección eficaz debe conocer y gestionar la organización informal (no ignorarla ni reprimirla).</p>
                </TheoryBlock>
            </Card>
            <Card title="3. Modelos de estructura organizativa" icon="📘">
                <TheoryBlock title="3.1. Estructura lineal (jerárquica)" color="rose">
                    <p>Basada en el <strong>principio de unidad de mando</strong>: cada empleado depende de un solo jefe, formando una cadena jerárquica clara (militar). <strong>Ventajas:</strong> simplicidad, claridad de autoridad, disciplina. <strong>Inconvenientes:</strong> rigidez, sobrecarga de los directivos (que deben dominar todas las funciones), lentitud en la comunicación vertical, falta de especialización directiva. Adecuada para pymes.</p>
                </TheoryBlock>
                <TheoryBlock title="3.2. Estructura funcional" color="red">
                    <p>Propuesta por <strong>Taylor</strong>: los empleados reciben instrucciones de varios jefes especializados en diferentes funciones (producción, comercial, finanzas, RRHH). <strong>Ventajas:</strong> especialización directiva, acceso a expertos. <strong>Inconvenientes:</strong> viola la unidad de mando (conflictos entre jefes funcionales), dificultad de coordinación. Poco usada en estado puro.</p>
                </TheoryBlock>
                <TheoryBlock title="3.3. Estructura línea-staff" color="rose">
                    <p>Combina la estructura lineal (autoridad jerárquica) con departamentos de <strong>staff</strong> (asesoría sin autoridad directa: gabinete jurídico, consultoría estratégica, I+D, control de calidad). <strong>Ventajas:</strong> mantiene la unidad de mando y añade asesoramiento especializado. <strong>Inconvenientes:</strong> posible confusión entre línea y staff, costes adicionales del staff. Es la más habitual en medianas y grandes empresas.</p>
                </TheoryBlock>
                <TheoryBlock title="3.4. Estructura divisional" color="red">
                    <p>La empresa se divide en <strong>divisiones</strong> autónomas (por producto, mercado geográfico o tipo de cliente), cada una con sus funciones propias (producción, marketing, finanzas). La dirección central coordina y controla las divisiones. <strong>Ventajas:</strong> adaptación al mercado, autonomía, facilidad de evaluación de resultados por división. <strong>Inconvenientes:</strong> duplicidad de funciones, costes más altos, posible competencia interna. Adecuada para grandes empresas diversificadas (Inditex: divisiones por marca — Zara, Massimo Dutti, Pull&Bear).</p>
                </TheoryBlock>
                <TheoryBlock title="3.5. Estructura matricial" color="rose">
                    <p>Combina la departamentalización funcional con la divisional (por proyecto o producto): cada empleado tiene <strong>dos jefes</strong> (el funcional y el de proyecto). <strong>Ventajas:</strong> flexibilidad, uso eficiente de especialistas compartidos, orientación a proyectos. <strong>Inconvenientes:</strong> viola la unidad de mando, complejidad, posibles conflictos. Habitual en consultoría, ingeniería, I+D y empresas tecnológicas.</p>
                </TheoryBlock>
            </Card>
            <Card title="4. El organigrama" icon="📘">
                <TheoryBlock title="4.1. Concepto y tipos" color="rose">
                    <p>El <strong>organigrama</strong> es la representación gráfica de la estructura organizativa: muestra los puestos, departamentos, relaciones de autoridad y niveles jerárquicos. Tipos: <strong>vertical</strong> (pirámide de arriba abajo, el más habitual), <strong>horizontal</strong> (de izquierda a derecha), <strong>circular</strong> (la dirección en el centro), <strong>mixto</strong>.</p>
                </TheoryBlock>
            </Card>
            <Card title="5. Nuevas formas organizativas" icon="📘">
                <TheoryBlock title="5.1. Tendencias actuales" color="rose">
                    <p><strong>Estructuras planas (flat):</strong> reducción de niveles jerárquicos, ampliación del ámbito de control, mayor autonomía de los equipos. Favorecidas por la digitalización (sistemas de información que sustituyen la supervisión directa).<br/><strong>Organización en red:</strong> la empresa central externaliza la mayoría de las funciones y coordina una red de proveedores, subcontratistas y aliados especializados (ejemplo: Apple diseña pero externaliza la fabricación a Foxconn).<br/><strong>Organización por equipos (team-based):</strong> equipos multifuncionales y autogestionados como unidad básica (Spotify: squads, tribes, chapters, guilds).<br/><strong>Organización ágil:</strong> inspirada en Agile/Scrum (originario del software): ciclos cortos, iterativos, con equipos autónomos y retroalimentación continua.<br/><strong>Teletrabajo y trabajo híbrido:</strong> acelerado por la pandemia COVID-19. Implica nuevas formas de coordinación, comunicación y control basadas en resultados más que en presencia.</p>
                </TheoryBlock>
            </Card>
            <Card title="6. Relevancia curricular" icon="🎓">
                <TheoryBlock color="violet"><p>Este tema conecta con CE3 de <strong>Economía de la Empresa de 2.º de Bachillerato</strong>: organización, dirección, organigramas. Contribuye a STEM (diseño de organigramas), CE (organización de un proyecto emprendedor), CC (relaciones laborales, trabajo en equipo) y CPSAA (liderazgo, coordinación).</p></TheoryBlock>
            </Card>
            <Card title="Síntesis" icon="📝">
                <TheoryBlock color="rose"><p>La organización empresarial diseña la estructura interna: división del trabajo, autoridad/delegación, coordinación. Se distingue organización formal (oficial) e informal (Hawthorne). Los modelos principales son: lineal (unidad de mando, pymes), funcional (Taylor, especialización), línea-staff (la más habitual), divisional (grandes empresas diversificadas) y matricial (doble dependencia, proyectos). El organigrama representa gráficamente la estructura. Las tendencias actuales son: estructuras planas, organización en red (Apple-Foxconn), equipos autogestionados (Spotify), agilismo y trabajo híbrido.</p></TheoryBlock>
            </Card>

        </div>
    );
