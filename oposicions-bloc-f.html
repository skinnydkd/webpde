                <Card title="1. Sistemes de capitalització" icon="💹">
                    <TheoryBlock title="1.1. Capitalització simple" color="indigo">
                        <p>La <strong>capitalització simple</strong> genera interessos únicament sobre el capital inicial (C₀); els interessos no capitalitzen. Fórmula:</p>
                    </TheoryBlock>

                    <FormulaBox formula="Cₙ = C₀ · (1 + i · n)" desc="Capitalització simple: interessos proporcionals al temps i al capital" />

                    <TheoryBlock title="1.2. Capitalització composta" color="violet">
                        <p>A la <strong>capitalització composta</strong>, els interessos s'afegeixen al capital i generen nous interessos («interès sobre interès»). És la base de les operacions financeres a llarg termini:</p>
                    </TheoryBlock>

                    <FormulaBox formula="Cₙ = C₀ · (1 + i)ⁿ" desc="Capitalització composta: creixement exponencial" />

                    <TheoryBlock title="1.3. Comparativa simple vs. composta" color="emerald">
                        <p>Per a períodes curts (&lt; 1 any) sovint s'utilitza simple per conveniència; a llarg termini, composta. A igual <em>i</em> i <em>n</em>, la composta sempre és major si n &gt; 1.</p>
                        <p><strong>Exemple</strong>: C₀ = 10.000 €, i = 5 %, n = 10 anys.</p>
                        <p>• Simple: 10.000 · (1 + 0,05 · 10) = 15.000 €.</p>
                        <p>• Composta: 10.000 · (1,05)¹⁰ = 10.000 · 1,6289 = 16.289 €.</p>
                        <p>Diferència: 1.289 € (l'«efecte bola de neu»).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.4. Capitalització contínua" color="cyan">
                        <p>Quan la capitalització es realitza «en tot moment», s'obté el límit continu:</p>
                        <p>Cₙ = C₀ · e^(i·n), on e ≈ 2,71828.</p>
                        <p>Aquesta fórmula s'usa en models teòrics avançats (Black-Scholes, per exemple).</p>
                    </TheoryBlock>

                    <FormulaBox formula="Cₙ = C₀ · e^(i·n)" desc="Capitalització contínua: base de les finances modernes teòriques" />
                </Card>

                <Card title="2. Equivalència financera, TIN i TAE" icon="⚖️">
                    <TheoryBlock title="2.1. Principi d'equivalència financera" color="indigo">
                        <p>Dos imports en diferents moments del temps són <strong>financerament equivalents</strong> si, descomptats a una taxa donada, tenen el mateix valor actual. És el principi fonamental de la matemàtica financera.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Tipus d'Interès Nominal (TIN)" color="violet">
                        <p>El <strong>TIN</strong> (Tipus d'Interès Nominal) és el tipus anunciat contractualment, sense considerar la freqüència de capitalització ni les comissions. Si la freqüència de liquidació és <em>m</em> vegades l'any, el tipus efectiu per període és i_m = TIN/m.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Taxa Anual Equivalent (TAE)" color="emerald">
                        <p>La <strong>TAE</strong> (Taxa Anual Equivalent), regulada per la Circular 5/2012 del Banc d'Espanya i les lleis 16/2011 i 5/2019, és l'<strong>indicador de transparència</strong> que homogeneïtza el cost real de productes financers. Incorpora:</p>
                        <p>• Freqüència de capitalització.</p>
                        <p>• Comissions i despeses financeres.</p>
                        <p>Fórmula bàsica (només freqüència de capitalització):</p>
                    </TheoryBlock>

                    <FormulaBox formula="TAE = (1 + TIN/m)^m - 1" desc="Taxa Anual Equivalent simple (sense comissions). m = freqüència de liquidació" />

                    <TheoryBlock title="2.4. Exemple numèric de TAE" color="amber">
                        <p>Préstec amb TIN = 6 % liquidat mensualment (m = 12): TAE = (1 + 0,06/12)¹² - 1 = 1,005¹² - 1 = 0,0617 = <strong>6,17 %</strong>.</p>
                        <p>Amb comissió d'obertura del 1 %, el càlcul exacte s'obté resolent l'equació d'equivalència financera que iguala cobraments i pagaments actualitzats.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Rendes: concepte i classificació" icon="🔄">
                    <TheoryBlock title="3.1. Concepte de renda" color="indigo">
                        <p>Una <strong>renda financera</strong> és un conjunt de capitals (termes) que venceixen en moments diferents del temps. Exemples: les quotes d'un préstec hipotecari, les aportacions a un pla de pensions, el cobrament d'una pensió, el lloguer mensual.</p>
                        <p>Elements: <strong>terme</strong> (import de cada capital), <strong>període</strong> (interval entre termes), <strong>durada</strong> (total), <strong>origen</strong> i <strong>venciment</strong> de la renda, <strong>valoració</strong> (moment en què es calcula el valor).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Classificació" color="violet">
                        <p><strong>Segons la quantia dels termes</strong>:</p>
                        <p>• <strong>Constant</strong>: tots els termes iguals.</p>
                        <p>• <strong>Variable</strong>: termes diferents, possiblement amb llei (aritmètica, geomètrica).</p>
                        <p><strong>Segons la durada</strong>:</p>
                        <p>• <strong>Temporal</strong>: durada finita.</p>
                        <p>• <strong>Perpètua</strong>: indefinida.</p>
                        <p><strong>Segons el moment del pagament</strong>:</p>
                        <p>• <strong>Prepagable</strong>: al principi del període (com el lloguer).</p>
                        <p>• <strong>Postpagable</strong>: al final del període (com la majoria de préstecs).</p>
                        <p><strong>Segons l'inici</strong>:</p>
                        <p>• <strong>Immediata</strong>: l'origen coincideix amb la valoració.</p>
                        <p>• <strong>Diferida / Anticipada</strong>: l'origen és posterior / anterior.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Valor actual i final de rendes" icon="🧮">
                    <TheoryBlock title="4.1. Renda constant postpagable immediata (a vençut)" color="emerald">
                        <p>Sigui una renda de n termes iguals a c, amb interès i, postpagable. El valor actual a l'origen:</p>
                    </TheoryBlock>

                    <FormulaBox formula="Vₐ = c · aₙ₎ᵢ = c · [1 - (1+i)⁻ⁿ] / i" desc="Valor actual d'una renda constant postpagable immediata" />

                    <FormulaBox formula="V_f = c · sₙ₎ᵢ = c · [(1+i)ⁿ - 1] / i" desc="Valor final d'una renda constant postpagable immediata" />

                    <TheoryBlock title="4.2. Renda constant prepagable" color="violet">
                        <p>Per una renda prepagable, els imports es capitalitzen un període més. Relació amb postpagable:</p>
                        <p>V_a^pre = V_a^post · (1+i) ; V_f^pre = V_f^post · (1+i).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Renda perpètua" color="indigo">
                        <p>Per a una renda constant postpagable perpètua (n → ∞) amb i &gt; 0:</p>
                        <p>V_a = c / i (fórmula molt utilitzada per valorar empreses, bons perpetus, consols britànics del XIX).</p>
                        <p>Si creixement g, taxa k (k &gt; g): V_a = c / (k - g) (Gordon-Shapiro, Tema 53).</p>
                    </TheoryBlock>

                    <FormulaBox formula="V_a (perpètua) = c / i    |    V_a (perpètua creixent) = c / (i - g)" desc="Renda perpètua constant i creixent (Gordon-Shapiro)" />

                    <TheoryBlock title="4.4. Rendes variables" color="amber">
                        <p><strong>• Variació aritmètica</strong>: termes c, c+d, c+2d, ... c+(n-1)d. Es resol descomponent en una constant + una aritmètica pura.</p>
                        <p><strong>• Variació geomètrica</strong>: termes c, c·q, c·q², ... c·q^(n-1). Fórmula:</p>
                        <p>V_a = c · [1 - (q/(1+i))ⁿ] / (i - g), on g = q - 1.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Aplicacions pràctiques" icon="🧾">
                    <TheoryBlock title="5.1. Càlcul de la quota d'un préstec (sistema francès)" color="emerald">
                        <p>En un préstec de capital C a n períodes amb tipus i, pel sistema francès (quotes constants postpagables), la quota fixa és:</p>
                    </TheoryBlock>

                    <FormulaBox formula="c = C · i / [1 - (1+i)⁻ⁿ]" desc="Quota fixa del sistema francès (detallat al Tema 56)" />

                    <TheoryBlock title="5.2. Plans de pensions" color="violet">
                        <p>Aportació mensual a un pla de pensions durant els anys laborals per obtenir un capital final. Ex.: aportació mensual de 100 € durant 30 anys a un 4 % anual (0,33 %/mes). Capital final = 100 · [(1,0033)³⁶⁰ - 1] / 0,0033 ≈ 69.600 €.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Valoració d'empreses amb rendes" color="rose">
                        <p>El mètode <strong>DCF</strong> (Discounted Cash Flow) valora l'empresa com el valor actual dels fluxos de caixa futurs. Pot combinar una fase explícita (5-10 anys, fluxos projectats) i un valor terminal (perpetuïtat amb Gordon-Shapiro). És el mètode dominant a la valoració corporativa.</p>
                    </TheoryBlock>

                        <p>Hipoteca de 200.000 € a 30 anys, tipus 3,5 % anual nominal (TIN), quotes mensuals, comissió obertura 1.000 €.</p>
                        <p>Tipus mensual i = 0,035/12 = 0,002917.</p>
                        <p>Quota = 200.000 · 0,002917 / (1 - 1,002917⁻³⁶⁰) = 200.000 · 0,002917 / 0,6497 ≈ <strong>898 €/mes</strong>.</p>
                        <p>TAE (amb comissió): requereix iterar l'equació d'equivalència. Aproximadament TAE ≈ 3,61 %.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La matemàtica financera és la disciplina que ha transformat les finances en una ciència rigorosa. Des dels sistemes de <strong>capitalització</strong> (simple, composta, contínua) fins al càlcul de rendes, tots els conceptes descansen en un principi central: el <strong>valor temporal del diner</strong> (<strong>Fisher, 1930</strong>). La <strong>TAE</strong>, regulada per lleis de transparència financera, és una aplicació pràctica essencial per a la protecció del consumidor.</p>
                        <p>Les <strong>rendes financeres</strong> —constants, variables, perpètues, prepagables, diferides— permeten modelar pràcticament qualsevol situació: hipoteques, pensions, valoracions empresarials, loteries, assegurances. El domini d'aquests càlculs és indispensable per a l'alumnat que aspira a carreres en finances, economia, gestió o actuariat. El docent ha de combinar el rigor matemàtic amb exemples pràctics significatius per al dia a dia dels estudiants.</p>

                <Card title="1. Préstecs: concepte i classificacions" icon="🧾">
                    <TheoryBlock title="1.1. Definició jurídica i financera" color="indigo">
                        <p>El <strong>préstec</strong> és el contracte pel qual una part (prestador) entrega a l'altra (prestatari) una quantitat de diners, comprometent-se aquesta a retornar-la en un termini, juntament amb els interessos pactats. Regulat pel Codi Civil (art. 1753-1757) i, en el cas del crèdit al consum o hipotecari, per lleis específiques: Llei 16/2011 i Llei 5/2019.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Classificacions" color="violet">
                        <p><strong>Per les garanties</strong>: personal (aval), hipotecari (finca), pignoraticia (béns mobles).</p>
                        <p><strong>Per termini</strong>: curt (&lt;1 any), mitjà (1-5 anys), llarg (&gt;5 anys).</p>
                        <p><strong>Per destinació</strong>: consum, habitatge, empresa, vehicle, estudis.</p>
                        <p><strong>Per tipus d'interès</strong>: fix, variable (Euribor + diferencial), mixt.</p>
                        <p><strong>Per moneda</strong>: en euros o en divisa (amb risc de tipus de canvi).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Elements del préstec" color="emerald">
                        <p>• <strong>Capital (C)</strong>: import prestat.</p>
                        <p>• <strong>Tipus d'interès (i)</strong>: nominal o efectiu periòdic.</p>
                        <p>• <strong>Termini (n)</strong>: nombre de períodes.</p>
                        <p>• <strong>Quota (c)</strong>: pagament periòdic. Composada per dos parts: interès del període (I_k = i·C_pendent) i amortització del principal (A_k = c - I_k).</p>
                        <p>• <strong>Quadre d'amortització</strong>: taula que mostra, per a cada període: quota, interès, amortització i capital pendent.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Sistema francès (quotes constants)" icon="🇫🇷">
                    <TheoryBlock title="2.1. Característiques" color="indigo">
                        <p>El <strong>sistema francès</strong> (també dit <em>progressiu</em> o de <em>termes amortitzats constants</em>) és el més utilitzat a Espanya. Característica: <strong>les quotes periòdiques són constants</strong>. Com el capital pendent va disminuint, la part d'interessos cau cada període i la d'amortització creix.</p>
                    </TheoryBlock>

                    <FormulaBox formula="c = C · i / [1 - (1+i)⁻ⁿ]" desc="Quota constant del sistema francès" />

                    <TheoryBlock title="2.2. Exemple numèric" color="amber">
                        <p>Préstec de 10.000 € a 3 anys, i = 5 % anual, quotes anuals postpagables.</p>
                        <p>c = 10.000 · 0,05 / [1 - 1,05⁻³] = 500 / 0,13616 = <strong>3.672,09 €</strong>.</p>
                        <p>Quadre d'amortització:</p>
                        <p>Any 1: I₁ = 10.000·0,05 = 500 € ; A₁ = 3.672,09 - 500 = 3.172,09 € ; Pendent = 6.827,91 €.</p>
                        <p>Any 2: I₂ = 6.827,91·0,05 = 341,40 € ; A₂ = 3.330,69 € ; Pendent = 3.497,22 €.</p>
                        <p>Any 3: I₃ = 3.497,22·0,05 = 174,86 € ; A₃ = 3.497,22 € ; Pendent = 0 €. ✓</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Fórmules per calcular l'amortització" color="cyan">
                        <p>Per al període k:</p>
                        <p>A_k = A_1 · (1+i)^(k-1) (progressió geomètrica).</p>
                        <p>A_1 = c · (1+i)⁻ⁿ (primera quota d'amortització).</p>
                        <p>Capital pendent al període k: C_k = c · [1 - (1+i)^(k-n)] / i.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Sistema americà i italià" icon="🌐">
                    <TheoryBlock title="3.1. Sistema americà" color="violet">
                        <p>El <strong>sistema americà</strong> (o <em>de quota d'interès constant</em>) es caracteritza perquè durant tota la vida del préstec es paguen <strong>només interessos</strong> i, al venciment, s'amortitza el capital íntegrament. Paral·lelament, el prestatari constitueix un <strong>fons de reintegració</strong> o <em>sinking fund</em> amb aportacions periòdiques que, capitalitzades, reuneixen el capital al venciment.</p>
                        <p>És poc habitual a Espanya per a préstecs al particular, però existeix en algunes emissions d'obligacions i en finançament estructurat.</p>
                        <p>Quota d'interessos anual: I = C · i.</p>
                        <p>Aportació al sinking fund (a interès i'): a = C · i' / [(1+i')ⁿ - 1].</p>
                        <p>Cost total anual: I + a.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Sistema italià" color="emerald">
                        <p>El <strong>sistema italià</strong> (o <em>lineal</em>, o <em>d'amortització constant</em>) es caracteritza perquè <strong>la quota d'amortització és fixa</strong>. Com els interessos baixen amb el capital pendent, les quotes totals són <strong>decreixents</strong>.</p>
                        <p>Amortització constant: A = C / n.</p>
                        <p>Quota del període k: c_k = A + i · C_{k-1} = A + i · [C - (k-1)·A].</p>
                        <p>Avantatge: es paga més al principi, menys al final. Total d'interessos inferior al sistema francès.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Comparativa" color="rose">
                        <p>Exemple: préstec 10.000 € a 3 anys al 5 %.</p>
                        <p>• <strong>Francès</strong>: quotes constants 3.672 €. Total interessos: 1.016 €.</p>
                        <p>• <strong>Italià</strong>: quotes 3.833, 3.667, 3.500. Total interessos: 1.000 €.</p>
                        <p>• <strong>Americà</strong> (només interessos): 500, 500, 10.500. Total interessos si no hi ha sinking fund: 1.500 €.</p>
                        <p>Si es constitueix sinking fund al 4 %, el cost total efectiu puja. Els sistemes amb amortització ràpida (italià) paguen menys interessos totals.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Emprèstits (bons i obligacions)" icon="📜">
                    <TheoryBlock title="4.1. Concepte" color="indigo">
                        <p>L'<strong>emprèstit</strong> és un préstec de gran quantia fragmentat en parts iguals anomenades <strong>obligacions</strong> o <strong>bons</strong>, que l'empresa o l'Estat emet al mercat de capitals. Cada obligació representa una fracció del deute. Regulats per RDL 1/2010 (LSC, art. 401-410) i, en el cas públic, pel Tresor Públic.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Elements" color="violet">
                        <p>• <strong>Valor nominal (VN)</strong>: base del càlcul d'interessos.</p>
                        <p>• <strong>Valor d'emissió (VE)</strong>: pot ser a la par (=VN), sota la par (prima d'emissió, VE &lt; VN) o damunt la par (agio).</p>
                        <p>• <strong>Valor de reemborsament (VR)</strong>: el que paga l'emissor al venciment. Pot ser a la par o amb prima.</p>
                        <p>• <strong>Cupó</strong>: interès periòdic explícit. Pot ser fix, variable, zero (s'emet a descompte).</p>
                        <p>• <strong>Termini</strong>: curt (&lt; 2 anys), mitjà (2-7), llarg (&gt; 7).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Rendibilitat al venciment (YTM)" color="emerald">
                        <p>La <strong>rendibilitat al venciment</strong> (<em>Yield To Maturity</em>) és la TIR de l'obligació, la taxa que iguala VA fluxos (cupons + reemborsament) amb el preu pagat:</p>
                        <p>P₀ = Σ_k [Cupó / (1+YTM)^k] + VR / (1+YTM)ⁿ.</p>
                    </TheoryBlock>

                    <FormulaBox formula="P₀ = Σ Cupó_k/(1+YTM)^k + VR/(1+YTM)ⁿ" desc="Preu d'una obligació = VA dels fluxos descomptats a la YTM" />

                    <TheoryBlock title="4.4. Tipus d'obligacions" color="amber">
                        <p>• <strong>Bons sobirans</strong>: emesos per l'Estat (Bonos, Obligaciones del Tesoro, BOE 10 anys tradicional).</p>
                        <p>• <strong>Corporate bonds</strong>: d'empreses. Amb rating (AAA, AA, A, BBB, <em>junk</em>).</p>
                        <p>• <strong>Convertibles</strong>: poden transformar-se en accions.</p>
                        <p>• <strong>Bons zero-cupó</strong>: emesos a descompte, sense cupons intermedis.</p>
                        <p>• <strong>Green bonds</strong>: finançament de projectes ambientals (Iberdrola n'ha emés per &gt; 20.000 M€).</p>
                        <p>• <strong>CoCos</strong> (Contingent Convertibles): usats per bancs com a capital addicional de nivell 1 (AT1).</p>
                        <p>• <strong>Covered bonds</strong> (cèdules hipotecàries): amb garantia hipotecària.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.5. Mercats espanyols i europeus" color="cyan">
                        <p>• <strong>Mercat AIAF</strong>: mercat secundari de renda fixa espanyol.</p>
                        <p>• <strong>MARF</strong> (Mercado Alternativo de Renta Fija): per a mitjanes empreses.</p>
                        <p>• <strong>SEND</strong>: plataforma electrònica de negociació.</p>
                        <p>• <strong>Eurobond market</strong>: mercat europeu de renda fixa internacional.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Usdefruit i nua propietat" icon="🏠">
                    <TheoryBlock title="5.1. Concepte" color="indigo">
                        <p>En algunes operacions financeres o immobiliàries, la titularitat es pot desdoblar en:</p>
                        <p>• <strong>Usdefruit (usufructo)</strong>: dret a percebre els rendiments o usar el bé.</p>
                        <p>• <strong>Nua propietat (nuda propiedad)</strong>: propietat sense dret d'ús ni gaudiment.</p>
                        <p>Regulats pel Codi Civil (arts. 467-522 per a l'usdefruit; 534-614 per a la nua propietat).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Valoració de l'usdefruit" color="violet">
                        <p>El Codi Civil i la normativa tributària (RDL 1/1993 i Reglament ITP AJD) estableixen regles de valoració:</p>
                        <p>• <strong>Usdefruit temporal</strong>: 2 % per cada any, amb màxim del 70 %.</p>
                        <p>• <strong>Usdefruit vitalici</strong>: 70 % si &lt; 20 anys; reduint-se 1 punt per cada any addicional, mínim 10 %.</p>
                        <p>• <strong>Nua propietat</strong>: valor total del bé menys el de l'usdefruit.</p>
                        <p>Des de la perspectiva financera: V_usdefruit = Σ renda anual / (1+i)^k; V_nua propietat = VR / (1+i)ⁿ.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Aplicacions" color="emerald">
                        <p>• <strong>Planificació successòria</strong>: cedir nua propietat en vida per reduir herència.</p>
                        <p>• <strong>Venda d'usdefruit</strong>: per a majors amb habitatge en propietat (productes com «nua propietat» comercialitzats per asseguradores).</p>
                        <p>• <strong>Bons amb cupó</strong>: l'usdefruit és equivalent als cupons; la nua propietat al reemborsament.</p>
                        <p>• <strong>Stripped bonds</strong>: bons els cupons i el principal dels quals es venen per separat (mercat nord-americà STRIPS).</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Els <strong>préstecs</strong> i <strong>emprèstits</strong>, amb els seus diferents sistemes d'amortització (francès, americà, italià), constitueixen la columna vertebral del finançament a mitjà i llarg termini. El sistema francès, quasi ubic a la hipoteca espanyola, combina senzillesa amb càrrega total d'interessos relativament alta. Els sistemes alternatius (italià, americà) tenen aplicacions específiques.</p>
                        <p>Els <strong>emprèstits</strong> amplien la capacitat de finançament a través del mercat de capitals, permetent a les empreses i Estats mobilitzar volums massius. Les seues característiques (cupó, venciment, garanties, convertibilitat) s'han diversificat amb l'auge del deute sostenible (<strong>green bonds</strong>, <strong>social bonds</strong>). Els conceptes d'<strong>usdefruit</strong> i <strong>nua propietat</strong> connecten la matemàtica financera amb el dret civil i la planificació patrimonial.</p>
                        <p>Aquest tema tanca el Bloc F. El futur docent ha de transmetre que la matemàtica financera, lluny de ser un càlcul abstracte, és un llenguatge universal per a comprendre i comunicar decisions econòmiques amb rigor i transparència.</p>
                    </div>
                </Card>

                <BibliografiaBox items={[
                    'MURIOLA, J. i LAMOTHE, P. (2007): Manual de matemáticas financieras, Pirámide.',
                    'NAVARRO, E. i MARTÍN, J.L. (2012): Manual de matemáticas financieras, McGraw-Hill.',

            </div>
