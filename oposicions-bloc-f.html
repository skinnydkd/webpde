        const Card = ({ children, className = "", title, icon }) => (

        const TheoryBlock = ({ title, children, color = "slate" }) => {

        const FormulaBox = ({ formula, desc }) => (

        );

        const SectionTitle = ({ icon, title, subtitle }) => (

        );

        const BibliografiaBox = ({ items }) => (

            </div>

        const ClauBox = ({ children }) => (

                <div className="flex items-start gap-3">

                        <h4 className="font-bold text-amber-700 mb-2">{lang === 'es' ? 'Clave para el 10' : lang === 'en' ? 'Key for top marks' : 'Clau per al 10'}</h4>

            </div>
        );

        // ════════════════════════════════════════════════════════════════
        // TEMA 49 — Concepte i classes d'inversió. VAN, TIR, Payback.
        // ════════════════════════════════════════════════════════════════
        const Tema49Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La <strong>inversió</strong> és la porta d'entrada a la dimensió financera de l'empresa. Decidir on, quant i quan invertir determina la trajectòria competitiva a llarg termini. Les decisions d'inversió comprometen recursos escassos en projectes els rendiments dels quals es materialitzaran al futur, en un entorn d'incertesa. L'<strong>anàlisi d'inversions</strong> (<em>capital budgeting</em>) proporciona les eines quantitatives per avaluar-les amb rigor.</p>
                        <p>A Espanya, la formació bruta de capital fix (FBKF) representa el <strong>19-20 % del PIB</strong> (INE 2024). Els fons <em>Next Generation EU</em> (160.000 M€ per a Espanya, 2021-2026) estan dinamitzant la inversió empresarial en transició digital, eficiència energètica, automoció i semiconductors. Entendre la lògica d'aquestes decisions —VAN, TIR, payback, ràtio de rendibilitat— és essencial per a la pràctica empresarial i per a l'alumnat de Batxillerat.</p>
                        <p>Aquest tema obri el Bloc F i connecta amb el Tema 57 (presa de decisions), els Temes 53-54 (cost del capital i estructura financera) i el Tema 58 (planificació). S'estructura en 5 blocs: (1) concepte i tipus d'inversió; (2) elements i dimensions; (3) criteris estàtics (payback, tant mitjà); (4) criteris dinàmics (VAN, TIR, IR); (5) selecció d'inversions i casos pràctics.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i classes d'inversió" icon="💼">
                    <TheoryBlock title="1.1. Definició d'inversió" color="emerald">
                        <p>La <strong>inversió</strong> és el <strong>desembolsament actual de recursos (capital) amb l'expectativa d'obtenir ingressos futurs superiors</strong>. <strong>Pierre Massé</strong>, a <em>Le choix des investissements</em> (1959), la va definir com «l'intercanvi d'una satisfacció immediata i certa a la qual es renuncia, contra una esperança que s'adquireix i de la qual el bé invertit és el suport». Tres elements essencials: (a) <em>desembolsament present</em>; (b) <em>fluxos futurs esperats</em>; (c) <em>incertesa</em> sobre els fluxos futurs.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Classificació segons la finalitat" color="indigo">
                        <p><strong>a) Inversió en actius fixos</strong> (<em>capital expenditure</em>, CAPEX): maquinària, plantes, equips, immobles, vehicles.</p>
                        <p><strong>b) Inversió en circulant</strong>: existències, clients, tresoreria operativa. Finança el fons de maniobra (Tema 51).</p>
                        <p><strong>c) Inversió financera</strong>: accions, bons, imposicions, participacions estratègiques.</p>
                        <p><strong>d) Inversió intangible</strong>: R+D, marques, patents, formació, software, capital humà.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Classificació segons objectiu (Joel Dean, 1951)" color="violet">
                        <p><strong>Joel Dean</strong>, a <em>Capital Budgeting</em> (1951), pioner de la disciplina, va classificar les inversions segons la motivació:</p>
                        <p><strong>• Reposició</strong>: reemplaçar actius obsolets o deteriorats.</p>
                        <p><strong>• Expansió</strong>: ampliar capacitat per mercats existents.</p>
                        <p><strong>• Modernització / Racionalització</strong>: reduir costos amb tecnologia més eficient.</p>
                        <p><strong>• Estratègica</strong>: nous productes, nous mercats, R+D, diversificació.</p>
                        <p><strong>• Obligada</strong>: compliment legal (medi ambient, seguretat).</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.4. Inversions relacionades" color="cyan">
                        <p>Segons la relació entre alternatives:</p>
                        <p><strong>• Independents</strong>: la selecció d'una no afecta les altres.</p>
                        <p><strong>• Complementàries</strong>: una reforça l'altra.</p>
                        <p><strong>• Substitutives / mútuament excloents</strong>: triar una exclou l'altra.</p>
                        <p><strong>• Restrictives</strong>: subjectes a límit pressupostari.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Elements i dimensions d'una inversió" icon="🎯">
                    <TheoryBlock title="2.1. Elements fonamentals" color="indigo">
                        <p>Tota inversió es caracteritza per:</p>
                        <p>(1) <strong>Desembolsament inicial (A o D₀)</strong>: capital invertit al moment t=0. Amb signe negatiu per convenció.</p>
                        <p>(2) <strong>Fluxos de caixa (FCⱼ)</strong>: ingressos menys despeses operatives generats pel projecte durant la seua vida útil. Són fluxos nets, <strong>després d'impostos</strong>.</p>
                        <p>(3) <strong>Vida útil o horitzó (n)</strong>: nombre de períodes que durarà el projecte.</p>
                        <p>(4) <strong>Valor residual (VR)</strong>: valor de liquidació al final, si escau.</p>
                        <p>(5) <strong>Taxa de descompte (k)</strong>: rendibilitat mínima exigida, cost d'oportunitat, WACC (Tema 53).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Dimensions (Massé, Albi)" color="violet">
                        <p>Massé i autors espanyols (Albi, Suárez Suárez) distingeixen tres dimensions:</p>
                        <p><strong>• Tecnològica</strong>: què permet produir la inversió (capacitat, qualitat, flexibilitat).</p>
                        <p><strong>• Econòmica</strong>: els fluxos de caixa reals (ingressos, despeses d'operació, impostos).</p>
                        <p><strong>• Financera</strong>: com es finança (estructura capital, préstecs, subvencions).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Fluxos rellevants" color="emerald">
                        <p>Per al càlcul del VAN/TIR s'han d'utilitzar <strong>fluxos incrementals</strong> (només aquells causats pel projecte) i <strong>després d'impostos</strong>. Principis:</p>
                        <p>• Ignorar els <em>sunk costs</em> (ja incorreguts, irrecuperables).</p>
                        <p>• Incloure els <em>costos d'oportunitat</em> (per exemple, terreny ja propietat de l'empresa té cost d'oportunitat).</p>
                        <p>• Considerar <em>efectes col·laterals</em> sobre altres productes (canibalització, sinergies).</p>
                        <p>• Separar <em>decisió d'inversió</em> de <em>decisió de finançament</em> (principi de Miller-Modigliani, Tema 54).</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Criteris estàtics de selecció" icon="⏱️">
                    <TheoryBlock title="3.1. Característiques dels criteris estàtics" color="amber">
                        <p>Els <strong>criteris estàtics</strong> no tenen en compte el valor temporal del diner (ignoren la cronologia dels fluxos). Són simples, intuïtius, però metodològicament imprecisos. Útils com a primera aproximació.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Termini de recuperació (Payback)" color="blue">
                        <p>El <strong>payback</strong> (termini de recuperació) és el temps necessari per recuperar el desembolsament inicial amb els fluxos de caixa del projecte. Criteri: triar el projecte amb <strong>payback menor</strong>; rebutjar si supera un màxim predefinit.</p>
                        <p><strong>Avantatges</strong>: simple, intuïtiu, prioritza liquiditat, adequat en entorns d'alta incertesa.</p>
                        <p><strong>Inconvenients</strong>: ignora el valor temporal del diner; ignora fluxos posteriors al payback; prioritza curt termini.</p>
                        <p><strong>Exemple</strong>: Projecte amb A=10.000 € i FC anuals de 3.000 € → Payback = 10.000 / 3.000 = 3,33 anys. Si els fluxos no són uniformes: acumular fins a igualar A.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Rendibilitat mitjana" color="violet">
                        <p>La <strong>rendibilitat mitjana simple</strong> o <strong>tant mitjà</strong>: TM = Flux mitjà anual / Desembolsament inicial = (Σ FCⱼ / n) / A. Expressa la rendibilitat anual mitjana. Comparteix els inconvenients dels criteris estàtics.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Criteris dinàmics de selecció" icon="📈">
                    <TheoryBlock title="4.1. El valor temporal del diner (Fisher, 1930)" color="emerald">
                        <p>El principi fundacional de les finances, formalitzat per <strong>Irving Fisher</strong> a <em>The Theory of Interest</em> (1930): <strong>un euro avui val més que un euro demà</strong>. Tres raons: (a) <em>preferència temporal</em>; (b) <em>risc</em>; (c) <em>inflació</em>. La taxa de descompte captura aquestes preferències.</p>
                        <p>El <strong>valor actual (VA)</strong> d'un import futur F al període j, descomptat a una taxa k: VA = F / (1+k)ʲ.</p>
                    </TheoryBlock>

                    <FormulaBox formula="VA = F / (1+k)ʲ" desc="Valor actual d'un flux futur F al període j, descomptat a taxa k" />

                    <TheoryBlock title="4.2. Valor Actual Net (VAN / NPV)" color="indigo">
                        <p>El <strong>Valor Actual Net</strong> (VAN; <em>Net Present Value</em>, NPV) és la suma de tots els fluxos de caixa del projecte descomptats al moment actual, menys el desembolsament inicial.</p>
                    </TheoryBlock>

                    <FormulaBox formula="VAN = -A + Σⱼ₌₁ⁿ FCⱼ / (1+k)ʲ" desc="Valor Actual Net: criteri fonamental de selecció d'inversions" />

                    <TheoryBlock title="4.3. Regla del VAN" color="violet">
                        <p>Regla de decisió:</p>
                        <p>• Si <strong>VAN &gt; 0</strong>: el projecte genera valor. <strong>Accepta'l</strong>.</p>
                        <p>• Si <strong>VAN &lt; 0</strong>: destrueix valor. <strong>Rebutja'l</strong>.</p>
                        <p>• Si <strong>VAN = 0</strong>: indiferent (just cobreix el cost d'oportunitat).</p>
                        <p>En projectes <em>mútuament excloents</em>: triar el de VAN més alt. En cartera amb pressupost limitat: maximitzar VAN conjunt.</p>
                        <p><strong>Avantatges</strong>: incorpora el valor temporal, és additiu (VAN(A+B)=VAN(A)+VAN(B)), coherent amb maximització del valor per l'accionista.</p>
                        <p><strong>Inconvenients</strong>: sensibilitat a l'elecció de k; no capta valor d'opcions reals.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.4. Taxa Interna de Retorn (TIR / IRR)" color="rose">
                        <p>La <strong>TIR</strong> (<em>Internal Rate of Return</em>, IRR) és la taxa de descompte que fa el VAN igual a zero.</p>
                    </TheoryBlock>

                    <FormulaBox formula="VAN(TIR) = 0 ⇒  -A + Σⱼ FCⱼ / (1+TIR)ʲ = 0" desc="TIR: rendibilitat intrínseca del projecte" />

                    <TheoryBlock title="4.5. Regla de la TIR i limitacions" color="amber">
                        <p>Regla:</p>
                        <p>• Si <strong>TIR &gt; k</strong>: accepta el projecte.</p>
                        <p>• Si <strong>TIR &lt; k</strong>: rebutja'l.</p>
                        <p>• Entre alternatives excloents: <em>no sempre coincideix amb VAN</em>. Si hi ha conflicte, el VAN és més fiable.</p>
                        <p><strong>Limitacions de la TIR</strong>: (a) TIR múltiples si fluxos canvien de signe més d'una vegada; (b) hipòtesi de reinversió a la pròpia TIR (irreal); (c) no additiva; (d) pot entrar en conflicte amb VAN en projectes a escala diferent.</p>
                        <p>La <strong>TIRM</strong> (Modified IRR) corregeix aquests problemes assumint reinversió a una taxa exògena realista.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.6. Índex de rendibilitat (IR / PI)" color="cyan">
                        <p>L'<strong>Índex de Rendibilitat</strong> (<em>Profitability Index</em>) és el quocient entre el valor actual dels fluxos i el desembolsament inicial:</p>
                        <p>IR = (Σ FCⱼ / (1+k)ʲ) / A.</p>
                        <p>Regla: acceptar si IR &gt; 1 (equivalent a VAN &gt; 0). Molt útil en <strong>selecció de cartera amb pressupost limitat</strong>: ordenar projectes per IR.</p>
                    </TheoryBlock>

                    <FormulaBox formula="IR = (Σ FCⱼ/(1+k)ʲ) / A    |    Acceptar si IR > 1" desc="Índex de rendibilitat: útil en cartera amb restriccions" />
                </Card>

                        <p><strong>TIR</strong>: resoldre VAN(TIR)=0 per aproximació iterativa → TIR ≈ <strong>17,3 %</strong>. Com 17,3 % &gt; 10 %, acceptable.</p>
                        <p><strong>IR</strong> = 118.387 / 100.000 = <strong>1,18</strong>. Com &gt; 1, acceptable.</p>
                    </TheoryBlock>

                        <p>La literatura financera recomana el <strong>VAN</strong> com a criteri decisiu per la seua coherència teòrica.</p>
                    </TheoryBlock>

                        <p>L'anàlisi d'inversions presentat al Tema 49 assumeix escenaris idealitzats: fluxos certs, absència d'inflació, neutralitat fiscal. La realitat contrasta: les variables són <strong>incertes</strong>, els preus <strong>canvien</strong> i els impostos <strong>erosionen</strong> els rendiments. Incorporar rigorosament risc, inflació i fiscalitat és indispensable per a qualsevol avaluació professional.</p>

                <Card title="1. Incertesa i risc en l'anàlisi d'inversions" icon="⚠️">
                    <TheoryBlock title="1.1. Knight (1921): risc vs. incertesa" color="amber">
                        <p>Com ja es va exposar al Tema 57, <strong>Frank Knight</strong> (<em>Risk, Uncertainty and Profit</em>, 1921) va distingir:</p>
                        <p>• <strong>Risc</strong>: probabilitats conegudes dels estats de la naturalesa (lanzar un dau).</p>
                        <p>• <strong>Incertesa</strong>: probabilitats desconegudes (xoc geopolític).</p>
                        <p>En la pràctica empresarial, la majoria de decisions es mouen en una zona intermèdia on s'estimen probabilitats subjectives.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Enfocaments per abordar el risc" color="indigo">
                        <p><strong>a) Ajust dels fluxos de caixa</strong>: calcular fluxos <em>equivalents certs</em> (Hirshleifer 1964) aplicant un coeficient de certesa α ∈ [0,1].</p>
                        <p><strong>b) Ajust de la taxa de descompte</strong>: afegir una <em>prima de risc</em> a la taxa lliure de risc. És el més utilitzat.</p>
                        <p><strong>c) Mètodes probabilístics</strong>: arbre de decisió (Tema 57), simulació Monte Carlo.</p>
                        <p><strong>d) Anàlisi de sensibilitat</strong>: variar un paràmetre i mesurar l'impacte sobre VAN.</p>
                        <p><strong>e) Anàlisi d'escenaris</strong>: optimista / realista / pessimista.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.3. Mesures de risc" color="rose">
                        <p>Mesures estadístiques habituals:</p>
                        <p>• <strong>Variància</strong>: σ² = E[(X - μ)²].</p>
                        <p>• <strong>Desviació típica</strong>: σ, risc absolut.</p>
                        <p>• <strong>Coeficient de variació</strong>: CV = σ/μ, risc per unitat de rendiment. Comparable entre projectes d'escala diferent.</p>
                        <p>• <strong>VaR</strong> (Value at Risk): màxima pèrdua amb un nivell de confiança.</p>
                        <p>• <strong>CVaR</strong> o <strong>Expected Shortfall</strong>: pèrdua esperada a la cua distribucional.</p>
                        <p>• <strong>Beta (β)</strong>: risc sistemàtic del CAPM.</p>
                    </TheoryBlock>

                    <FormulaBox formula="CV = σ/μ   |   VaR = inf{x : P(X ≤ x) ≥ α}" desc="Mesures de risc relatives i de cua" />

                <Card title="2. Prima de risc i CAPM" icon="📈">
                    <TheoryBlock title="2.1. La prima de risc" color="violet">
                        <p>La <strong>prima de risc</strong> (<em>risk premium</em>) és la rendibilitat extra que l'inversor exigeix per assumir risc respecte al d'un actiu lliure de risc. La taxa de descompte ajustada al risc:</p>
                        <p>k = r_f + prima = rendiment lliure de risc + compensació del risc assumit.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Model CAPM (Sharpe 1964, Lintner 1965, Mossin 1966)" color="indigo">
                        <p>El <strong>Capital Asset Pricing Model</strong>, un dels pilars de les finances modernes, formalitza la relació entre risc i rendiment esperat:</p>
                    </TheoryBlock>

                    <FormulaBox formula="E(Rᵢ) = r_f + βᵢ · (E(R_m) - r_f)" desc="CAPM (Sharpe 1964, Nobel 1990). Rendiment esperat = risc lliure + prima sistemàtica" />

                    <TheoryBlock title="2.3. Interpretació del beta (β)" color="emerald">
                        <p>El <strong>beta (β)</strong> mesura la sensibilitat del rendiment de l'actiu i respecte al del mercat:</p>
                        <p>β = Cov(Rᵢ, R_m) / Var(R_m).</p>
                        <p>• β = 1: l'actiu es mou com el mercat.</p>
                        <p>• β &gt; 1: més volàtil que el mercat (<em>aggressive stock</em>).</p>
                        <p>• β &lt; 1: menys volàtil (defensiu; utilitats, consum bàsic).</p>
                        <p>• β &lt; 0: covariança negativa (rar, or com a valor refugi).</p>
                        <p>Per a Espanya, el <em>risk-free rate</em> s'aproxima al bon del Tresor a 10 anys (~3,3 % el 2024); la prima de risc històrica del IBEX-35 se situa al 5-7 %.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.4. Crítiques i extensions" color="amber">
                        <p>El CAPM ha rebut crítiques per les seues hipòtesis restrictives (mercats eficients, expectatives homogènies, un sol període, prima constant). Extensions:</p>
                        <p>• <strong>APT</strong> (Ross, 1976): múltiples factors, no només de mercat.</p>
                        <p>• <strong>Fama-French 3-factor</strong> (1992): mida, B/M, mercat.</p>
                        <p>• <strong>Fama-French 5-factor</strong> (2015): afegeix rendibilitat i inversió.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Inflació en les decisions d'inversió" icon="📉">

                        <p>• <strong>Fluxos nominals</strong>: expressats en euros corrents.</p>
                        <p>• <strong>Fluxos reals</strong>: expressats en euros de poder adquisitiu constant.</p>
                        <p>• <strong>Taxa nominal</strong>: mesurada sobre fluxos nominals.</p>
                        <p>• <strong>Taxa real</strong>: corregida per inflació.</p>
                        <p>Relació fonamental (equació de Fisher, 1930):</p>
                    </TheoryBlock>

                    <FormulaBox formula="(1 + k_nom) = (1 + k_real) · (1 + π)" desc="Equació de Fisher. Aproximada: k_nom ≈ k_real + π" />

                    <TheoryBlock title="3.2. VAN en un context inflacionari" color="indigo">
                        <p>Dues aproximacions coherents (no mesclar-les):</p>
                        <p><strong>a) Mètode nominal</strong>: projectar fluxos nominals (incorporant inflació) i descomptar amb k_nom.</p>

                        <p>Errors comuns: (i) projectar fluxos nominals i descomptar amb k_real, (ii) no tenir en compte que la inflació pot afectar diferentment costos i preus.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Casos especials: la inflació no uniforme" color="rose">
                        <p>A la pràctica, els costos (p. ex., energia, salaris) i els preus (sortida) poden seguir diferents ritmes d'inflació. Cal projectar-los independentment. Exemple: pla energètic empresarial en un entorn amb gas +20 %/any i electricitat +8 %/any (cas típic 2022).</p>

                    <TheoryBlock title="4.2. Fluxos de caixa després d'impostos" color="emerald">

                    </TheoryBlock>

                    <FormulaBox formula="FC_net = (I - D - Am) · (1 - t) + Am" desc="Flux de caixa després d'impostos amb escut de l'amortització" />

                        <p>Els interessos dels préstecs són deduïbles de l'IS, creant un <strong>escut fiscal</strong>: el cost efectiu del deute és r·(1-t), no r. Aquesta asimetria favorable al deute serà clau per entendre l'estructura òptima de capital (Tema 54). Valor present de l'escut fiscal: VP_escut = t · D (deute).</p>

                    </TheoryBlock>
                </Card>

                <Card title="5. Models de programació d'inversions" icon="🧮">
                    <TheoryBlock title="5.1. Selecció amb restriccions pressupostàries" color="indigo">
                        <p>En la realitat, l'empresa no pot acceptar tots els projectes amb VAN &gt; 0: està subjecta a <strong>restriccions</strong> (capital disponible, capacitat directiva, riscos agregats). La selecció òptima exigeix programació matemàtica.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Programació lineal" color="violet">
                        <p>Formulació típica: maximitzar Σ VANᵢ · xᵢ, subjecte a Σ Aᵢ · xᵢ ≤ Pressupost, amb xᵢ ∈ [0,1] (fracció del projecte) o xᵢ ∈ {0,1} (binari, programació entera).</p>
                        <p>L'<strong>algorisme simplex</strong> (Dantzig, 1947) resol aquest tipus de problemes. Software comercial: Excel Solver, Gurobi, CPLEX, Python (PuLP, SciPy).</p>

                    <TheoryBlock title="5.3. Altres mètodes d'optimització" color="emerald">

                        <p><strong>• Simulació Monte Carlo</strong>: milers d'iteracions aleatòries.</p>
                        <p><strong>• Rationing amb IR</strong>: ordenar projectes per Índex de Rendibilitat i acceptar els de major IR fins esgotar el pressupost (aproximació simple).</p>
                    </TheoryBlock>

        // ════════════════════════════════════════════════════════════════

        const Tema51Complet = () => (

                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Tot projecte empresarial necessita <strong>recursos financers</strong> per adquirir actius i mantenir l'operació diària. La <strong>finançament</strong> és la funció que capta aquests recursos, determina la seua estructura i en gestiona el cost. Al costat del subsistema real (producció), el financer és la columna vertebral de qualsevol empresa.</p>
                        <p>A Espanya, l'estructura financera de les PyMES s'ha caracteritzat històricament per l'alta dependència del crèdit bancari (BCE 2023: ~75 %), en contrast amb el model anglosaxó on el mercat de capitals té més pes. La crisi financera de 2008, la crisi sobirana 2011-2013 i les recents pujades de tipus d'interès (BCE: 0 % → 4,5 % entre 2022-2023, i estabilització a 3,25 % el 2024) han posat a prova la resiliència financera empresarial.</p>
                        <p>Aquest tema aborda: (1) concepte i funció financera; (2) període mitjà de maduració; (3) fons de maniobra (FM) i necessitats operatives (NOF); (4) finançament extern a curt termini; (5) finançament extern a mitjà i llarg termini.</p>

                <Card title="1. Concepte i funció financera" icon="💳">
                    <TheoryBlock title="1.1. La funció financera" color="emerald">
                        <p>La <strong>funció financera</strong> s'articula al voltant de tres decisions fonamentals (Pike-Neale, 2012):</p>
                        <p><strong>(1) Decisió d'inversió</strong> (Tema 49-50): en què invertir?</p>
                        <p><strong>(2) Decisió de finançament</strong> (Temes 51-54): com finançar-ho?</p>
                        <p><strong>(3) Decisió de dividends</strong> (Tema 54): com distribuir el resultat?</p>
                        <p>El principi general: maximitzar el valor de l'empresa, que equival a maximitzar el patrimoni dels accionistes, subjecte a restriccions d'ètica, llei i <em>stakeholders</em>.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Fonts de finançament: classificacions" color="indigo">
                        <p><strong>Segons l'origen</strong>: pròpies (capital, reserves, autofinançament) vs. alienes (préstecs, proveïdors, emprèstits).</p>
                        <p><strong>Segons la titularitat</strong>: internes (generades per la mateixa empresa) vs. externes (captades de tercers).</p>
                        <p><strong>Segons el termini</strong>: curt (&lt; 1 any), mitjà (1-5 anys), llarg (&gt; 5 anys).</p>
                        <p><strong>Segons l'exigibilitat</strong>: exigibles (préstecs, proveïdors) vs. no exigibles (capital, reserves).</p>
                        <p>La finançament interna es desenvolupa al Tema 52; aquest tema se centra sobretot en la externa.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Període mitjà de maduració (PMM)" icon="⏳">
                    <TheoryBlock title="2.1. Concepte" color="violet">
                        <p>El <strong>període mitjà de maduració</strong> (PMM o <em>operating cycle</em>) és el temps mitjà que transcorre des que l'empresa paga la compra de matèries primeres fins que cobra la venda del producte acabat. Expressa la intensitat de capital circulant necessari.</p>
                        <p>Diferenciem:</p>
                        <p><strong>• PMM econòmic</strong>: des de l'entrada de les matèries primeres fins al cobrament.</p>
                        <p><strong>• PMM financer (cash conversion cycle)</strong>: resta del PMM econòmic el període de pagament a proveïdors; representa els dies de finançament propi requerit.</p>
                    </TheoryBlock>

                    <FormulaBox formula="PMM_ec = PMa + PMf + PMv + PMc" desc="PMa = dies aprovisionament; PMf = fabricació; PMv = vendes; PMc = cobrament" />
                    <FormulaBox formula="PMM_fin = PMM_ec - PMp" desc="PMp = dies de pagament a proveïdors (cash conversion cycle)" />

                    <TheoryBlock title="2.2. Càlcul dels subperíodes" color="blue">
                        <p>Cada subperíode es calcula com dies = Stock mitjà × 365 / Flux anual:</p>
                        <p>• <strong>PMa</strong> = Existències MP × 365 / Consum MP.</p>
                        <p>• <strong>PMf</strong> = Existències en curs × 365 / Cost de producció.</p>
                        <p>• <strong>PMv</strong> = Existències PT × 365 / Cost vendes.</p>
                        <p>• <strong>PMc</strong> = Clients × 365 / Vendes.</p>
                        <p>• <strong>PMp</strong> = Proveïdors × 365 / Compres.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Implicacions estratègiques" color="rose">
                        <p>Un PMM curt és favorable: menys capital circulant, millor liquiditat. Estratègies per reduir-lo: just-in-time (menys existències), digitalització del cobrament, incentius al cobrament (descomptes per pagament ràpid), allargar el pagament a proveïdors (amb límits ètics).</p>
                        <p>La <strong>Llei 18/2022 contra la morositat</strong> estableix límits al termini de pagament a proveïdors (30-60 dies) a Espanya.</p>
                        <p>Exemples: <em>Mercadona</em> i <em>Inditex</em> tenen PMM negatius (cobren abans de pagar proveïdors), finançant-se «gratuïtament» amb els seus proveïdors.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Fons de Maniobra (FM) i Necessitats Operatives (NOF)" icon="⚖️">
                    <TheoryBlock title="3.1. Fons de Maniobra" color="indigo">
                        <p>El <strong>Fons de Maniobra</strong> (FM, <em>working capital</em>) és la part de l'actiu circulant finançada amb recursos permanents. Expressa el marge de seguretat financera:</p>
                    </TheoryBlock>

                    <FormulaBox formula="FM = Actiu Circulant - Passiu Circulant = Recursos Permanents - Actiu No Circulant" desc="Dues formulacions equivalents del Fons de Maniobra" />

                    <TheoryBlock title="3.2. Anàlisi del FM" color="emerald">
                        <p>• <strong>FM &gt; 0</strong>: part del circulant es finança amb recursos permanents. Situació saludable.</p>
                        <p>• <strong>FM = 0</strong>: l'actiu circulant just cobreix les obligacions a CT. Situació de risc.</p>
                        <p>• <strong>FM &lt; 0</strong>: part de l'actiu fix es finança amb deute a CT. Situació problemàtica (excepte a hipermercats amb cobrament instantani i pagament diferit).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Necessitats Operatives de Fons (NOF)" color="violet">
                        <p>Les <strong>NOF</strong> (Necessitats Operatives de Fons, <em>operating working capital requirement</em>) mesuren la inversió necessària en circulant operatiu:</p>
                        <p>NOF = Existències + Clients - Proveïdors.</p>
                        <p>La diferència FM - NOF és la <strong>tresoreria</strong> (positiva si el FM cobreix les NOF).</p>
                    </TheoryBlock>

                    <FormulaBox formula="NOF = Existències + Clients - Proveïdors   |   Tresoreria = FM - NOF" desc="Gestió del circulant: FM vs. NOF" />
                </Card>

                <Card title="4. Finançament extern a curt termini" icon="📅">
                    <TheoryBlock title="4.1. Crèdit comercial de proveïdors" color="cyan">
                        <p>El <strong>crèdit comercial</strong> (ajornament del pagament a proveïdors) és la forma més natural i sovint més barata de finançament a CT. Instruments: lletres, <em>confirming</em> (anticipació del pagament al proveïdor per un tercer). Limitat per la Llei 18/2022.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Crèdits i préstecs bancaris a curt termini" color="indigo">
                        <p><strong>• Pòlissa de crèdit</strong>: límit màxim disponible. Flexible: només es paguen interessos pel que s'usa. Ideal per a desfasaments de tresoreria.</p>

                    </TheoryBlock>

                    <TheoryBlock title="4.4. Factoring i confirming" color="rose">
                        <p><strong>Factoring</strong> (cessió de crèdits a un <em>factor</em>): amb recurs o sense (aquest últim assumeix el risc d'insolvència). Operació típica: el factor paga el 80-90 % immediat i la resta al cobrament.</p>
                        <p><strong>Confirming</strong>: l'empresa gestiona amb el banc els seus pagaments a proveïdors. Els proveïdors poden anticipar el cobrament (al banc) amb descompte. Popularitzat per <em>Santander</em> als anys 90.</p>
                    </TheoryBlock>
                </Card>

                        <p>El <strong>tipus d'interès</strong> pot ser fix o variable (Euribor + diferencial). Des de 2022, les pujades del BCE han encarit els tipus variables.</p>
                    </TheoryBlock>

                    </TheoryBlock>

                    </TheoryBlock>

                    <TheoryBlock title="5.5. Subvencions i fons europeus" color="green">

                        <p>• <strong>Enisa</strong>: préstecs participatius per emprenedors.</p>
                        <p>• <strong>CDTI</strong>: préstecs parcialment reemborsables per R+D+i.</p>
                        <p>• <strong>Next Gen EU / PRTR</strong>: 160.000 M€ 2021-2026, mix subvencions i préstecs.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La gestió del finançament empresarial integra una combinació de fonts pròpies (Tema 52) i alienes, a CT i LT, cadascuna amb costos, flexibilitat i implicacions estratègiques diferents. L'anàlisi del <strong>període mitjà de maduració</strong> i del <strong>fons de maniobra/NOF</strong> és imprescindible per evitar situacions de tensió financera —una causa freqüent de concurs de creditors, fins i tot en empreses rendibles.</p>
                        <p>En el context espanyol, dominat per PyMES i dependent del crèdit bancari, la diversificació de fonts (MARF, crowdfunding, venture capital, leasing) i l'aprofitament dels fons europeus (Next Gen, ICO, Enisa) són palanques clau per al creixement. Els futurs docents han de transmetre a l'alumnat que una bona gestió financera no només finança: <strong>crea valor</strong> optimitzant el cost del capital i el risc.</p>

        const Tema52Complet = () => (

                        <p>Al costat de les fonts externes (Tema 51), l'empresa genera <strong>recursos financers interns</strong> a partir del seu propi funcionament: beneficis no distribuïts, amortitzacions, provisions. Aquesta <strong>finançament interna</strong> o <strong>autofinançament</strong> és, en moltes empreses madures, la principal font de fons. En el cas d'<em>Inditex</em>, per exemple, més del 90 % de la inversió anual es finança amb recursos generats internament.</p>

                <Card title="1. Concepte i classes de finançament interna" icon="🏛️">
                    <TheoryBlock title="1.1. Concepte" color="emerald">
                        <p>La <strong>finançament interna</strong> (o <em>autofinançament</em>) és «el conjunt de recursos generats per la pròpia activitat empresarial que, en lloc de distribuir-se, es retenen dins de l'empresa per finançar el seu creixement o reposició». A diferència de la finançament externa, no genera obligacions amb tercers i no suposa un cost exigible.</p>
                        <p>Les <strong>aportacions d'autofinançament</strong> es poden agrupar en dues grans categories:</p>
                        <p><strong>• Autofinançament de manteniment</strong>: amortitzacions i provisions. No augmenta els fons propis, només preserva la capacitat productiva.</p>
                        <p><strong>• Autofinançament d'enriquiment</strong>: reserves generades a partir de beneficis retinguts. Incrementa el patrimoni net.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Avantatges i inconvenients" color="violet">
                        <p><strong>Avantatges</strong>: (a) independència de tercers; (b) absència d'interessos explícits; (c) flexibilitat; (d) evita dilució; (e) assenyala solvència als mercats.</p>
                        <p><strong>Inconvenients</strong>: (a) cost d'oportunitat (els accionistes podrien rebre dividends); (b) poden desincentivar la disciplina financera; (c) limita ritme de creixement en sectors dinàmics; (d) pot generar «sobrepoderiu» directiu (Jensen, 1986: teoria del <em>free cash flow</em>).</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Autofinançament de manteniment i enriquiment" icon="📐">
                    <TheoryBlock title="2.1. De manteniment" color="indigo">
                        <p>Les <strong>amortitzacions</strong> i <strong>provisions</strong> són les principals partides. Permeten reposar actius desgastats i cobrir contingències previsibles. No suposen un increment patrimonial, sinó un manteniment del valor real del capital econòmic.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. D'enriquiment: les reserves" color="amber">
                        <p>Les <strong>reserves</strong> són beneficis retinguts, que incrementen el patrimoni net. Formes clàssiques: legal (mínim 20 % del capital segons art. 274 LSC), voluntàries, estatutàries, especials (per a primes d'emissió, acciones pròpies, etc.).</p>
                        <p>L'enriquiment genuïnament permet finançar noves inversions: reinversió vs. distribució (Tema 54).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.3. Política òptima de retenció" color="rose">
                        <p>La decisió entre <strong>distribuir dividends</strong> i <strong>retenir beneficis</strong> depèn de: (a) les oportunitats d'inversió disponibles amb rendibilitat esperada &gt; k; (b) les preferències dels accionistes (estabilitat del dividend); (c) la fiscalitat (Espanya: 19-28 % IRPF sobre dividends, 25 % IS sobre plusvàlues); (d) la senyalització als mercats (una retallada de dividends pot interpretar-se com un senyal negatiu).</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. L'amortització: concepte i funció" icon="📉">
                    <TheoryBlock title="3.1. Concepte" color="indigo">
                        <p>L'<strong>amortització</strong> és l'expressió comptable de la <strong>depreciació sistemàtica i racional d'un actiu no corrent</strong> al llarg de la seua vida útil. Reflecteix tres components:</p>
                        <p>• <strong>Depreciació física</strong>: desgast pel ús.</p>
                        <p>• <strong>Depreciació tècnica</strong>: obsolescència (un ordinador de 10 anys).</p>
                        <p>• <strong>Depreciació econòmica</strong>: canvis de mercat (una planta especialitzada en un producte extingit).</p>
                        <p>L'amortització compleix tres <strong>funcions</strong>: (1) <em>econòmica</em> (reflecteix el veritable cost del capital consumit en la producció); (2) <em>comptable</em> (racionalitat de l'impute del cost als exercicis); (3) <em>financera</em> (genera fons per substituir l'actiu al final de la seua vida útil).</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Mètodes d'amortització" color="violet">
                        <p><strong>a) Lineal o constant</strong>: quota anual constant = (Valor inicial - Valor residual) / n. És el més simple i habitual.</p>
                        <p><strong>b) Degressiva (decreixents)</strong>: més amortització els primers anys. Variants:</p>
                        <p>&nbsp;&nbsp;— Percentatge constant sobre valor pendent.</p>
                        <p>&nbsp;&nbsp;— Suma dels dígits (anuals / acumulats): quota_j = (n-j+1)·(V₀-VR) / Σ(1...n).</p>
                        <p><strong>c) Progressiva</strong>: més amortització els últims anys. Rara.</p>
                        <p><strong>d) Per unitats produïdes</strong>: variable segons l'ús real.</p>
                        <p><strong>e) Financera</strong>: per quotes equivalents a una anualitat financera.</p>
                    </TheoryBlock>

                    <FormulaBox formula="Quota lineal = (V₀ - VR) / n" desc="Mètode més simple d'amortització" />

                    <TheoryBlock title="3.3. Efecte Lohmann-Ruchti (1953-56)" color="emerald">
                        <p>L'efecte <strong>Lohmann-Ruchti</strong>, descobert independentment per Robert Lohmann (1949) i Hans Ruchti (1953), mostra que les amortitzacions, en ser reinvertides abans que l'actiu antic acabe la seua vida útil, permeten un <strong>creixement intern gratuït</strong> de la capacitat productiva.</p>
                        <p>Exemple: una empresa amb 10 màquines (vida útil 10 anys, costos 10.000 € cadascuna). Amortització anual = 10.000 €. Aquesta quantitat serveix per comprar una nova màquina cada any. Amb fluxos constants, al cap de n anys l'empresa té gairebé el doble de capacitat productiva sense haver afegit capital extern.</p>
                        <p>Condicions per al fenomen: estabilitat dels preus, activitats amb alta taxa d'amortització, disciplina en la reinversió.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.4. Aspectes fiscals i legals" color="cyan">
                        <p>La LIS (Llei 27/2014) regula els coeficients màxims d'amortització fiscal:</p>
                        <p>• Edificis: 2-3 % (50-33 anys).</p>
                        <p>• Maquinària: 12 % (8 anys).</p>
                        <p>• Vehicles: 16 % (6 anys).</p>
                        <p>• Equips informàtics: 25 % (4 anys).</p>
                        <p><strong>Llibertat d'amortització</strong> (art. 12.3 LIS) per a:</p>
                        <p>• R+D+i.</p>
                        <p>• Inversions de PyMES que creïn ocupació.</p>
                        <p>• Inversions en instal·lacions d'autoconsum elèctric.</p>
                        <p>• Inversions en noves infraestructures energètiques (RDL 4/2023).</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Provisions" icon="🛡️">
                    <TheoryBlock title="4.1. Concepte i diferència amb amortitzacions" color="indigo">
                        <p>Les <strong>provisions</strong> són passius d'import o venciment incert. Cobrixen obligacions presents probables per esdeveniments passats: garanties de reparació, litigis, reestructuracions, compromisos ambientals.</p>
                        <p>A diferència de les amortitzacions (que cobreixen pèrdues <em>certes</em> i <em>sistemàtiques</em>), les provisions cobreixen <em>contingències</em> (probables però incertes).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Classes de provisions" color="violet">
                        <p>Segons el PGC (Grup 14 i 15):</p>
                        <p>• <strong>Provisió per a impostos</strong>.</p>
                        <p>• <strong>Provisió per responsabilitats</strong> (litigis).</p>
                        <p>• <strong>Provisió per a reestructuracions</strong>.</p>
                        <p>• <strong>Provisió per a transaccions amb pagaments basats en instruments de patrimoni</strong> (<em>stock options</em>).</p>
                        <p>• <strong>Provisió per a actuacions mediambientals</strong>.</p>
                        <p>• <strong>Provisió per a garanties postvenda</strong>.</p>
                        <p>La NIC 37 regula comptablement les provisions: s'han de reconèixer quan (a) hi ha obligació present; (b) és probable una sortida de recursos; (c) l'import pot estimar-se.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Reserves" icon="🏦">
                    <TheoryBlock title="5.1. Concepte" color="indigo">
                        <p>Les <strong>reserves</strong> són beneficis retinguts per la societat, que incrementen el patrimoni net. Són la principal partida d'autofinançament d'enriquiment.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Tipus de reserves (LSC, PGC)" color="violet">
                        <p><strong>a) Reserva legal</strong> (art. 274 LSC): obligatòria fins al 20 % del capital social. Es dota amb el 10 % del benefici net anual.</p>
                        <p><strong>b) Reserves estatutàries</strong>: establertes als estatuts socials.</p>
                        <p><strong>c) Reserves voluntàries</strong>: decidides per la Junta General.</p>
                        <p><strong>d) Reserves especials</strong>:</p>
                        <p>&nbsp;&nbsp;— Per a accions pròpies.</p>
                        <p>&nbsp;&nbsp;— Per a capital amortitzat (art. 335 LSC).</p>
                        <p>&nbsp;&nbsp;— Reserva de capitalització (art. 25 LIS): deducció fiscal del 10 % per retenció de beneficis.</p>
                        <p>&nbsp;&nbsp;— Reserva d'anivellament (art. 105 LIS): per a PyMES.</p>
                        <p><strong>e) Primes d'emissió / assumpció</strong>: agio generat en ampliacions de capital per damunt del valor nominal.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Distribució i capitalització" color="emerald">
                        <p>Les reserves poden destinar-se a:</p>
                        <p>• <strong>Compensar pèrdues</strong> d'exercicis anteriors.</p>
                        <p>• <strong>Distribuir-se com a dividend extraordinari</strong> (si són lliures).</p>
                        <p>• <strong>Capitalitzar-se</strong> (ampliació de capital lliure): només genera efecte comptable, no econòmic.</p>
                        <p>Les reserves legals i estatutàries tenen restriccions especials.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>L'autofinançament —amb les seues modalitats de manteniment (amortitzacions, provisions) i d'enriquiment (reserves)— constitueix la principal font de recursos financers en empreses madures. L'<strong>efecte Lohmann-Ruchti (1953)</strong> mostra la potència d'aquesta via per al creixement intern gratuït. L'amortització té una triple dimensió (econòmica, comptable, financera) i s'articula amb la fiscalitat mitjançant el seu caràcter deduïble.</p>
                        <p>Les <strong>reserves</strong> i la <strong>política de dividends</strong> reflecteixen la tensió permanent entre distribució i retenció; aquesta tensió s'aborda amb major profunditat al Tema 54. El docent ha de transmetre que un ús prudent i productiu de l'autofinançament és signe d'una empresa sana i ambiciosa, però que l'excés pot esdevenir problema (<em>free cash flow</em> problem de Jensen, 1986), ja que els fons no reinvertits amb rendibilitat &gt; k destrueixen valor.</p>
                    </div>
                </Card>

        const Tema53Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>Invertir no surt gratis: tota unitat de capital té un <strong>cost d'oportunitat</strong>. El <strong>cost del capital</strong> és la rendibilitat mínima que l'empresa ha d'aconseguir perquè la inversió <em>no destruïsca valor</em>. Serveix de taxa de descompte per al VAN (Temes 49-50) i és determinant per a la valoració d'empreses (DCF, EVA).</p>
                        <p>El concepte fonamental és el <strong>WACC</strong> (<em>Weighted Average Cost of Capital</em>), cost mig ponderat que combina les fonts de finançament. La pujada de tipus del BCE 2022-2024 ha elevat el WACC de moltes empreses, exigint a projectes rendibilitats més altes per a ser viables. Saber calcular-lo i interpretar-lo és una competència bàsica per al graduat en economia i empresa.</p>
                        <p>Aquest tema s'estructura en 5 blocs: (1) concepte i rellevància del cost del capital; (2) cost del deute (Kd); (3) cost dels recursos propis (Ke); (4) WACC; (5) palanquejament financer i aplicacions.</p>
                    </div>
                </Card>

                <Card title="1. Concepte i rellevància" icon="⚖️">
                    <TheoryBlock title="1.1. Cost del capital com a llindar mínim" color="emerald">
                        <p>El <strong>cost del capital</strong> (k) és la rendibilitat mínima exigida a qualsevol inversió perquè cobreisca el cost d'oportunitat dels recursos financers. Dos enfocaments clàssics:</p>
                        <p><strong>a) Enfocament del mercat</strong>: el cost del capital és el rendiment que els inversors exigeixen per finançar l'empresa.</p>
                        <p><strong>b) Enfocament del projecte</strong>: és la taxa de tall (<em>hurdle rate</em>) per decidir si un projecte es porta a terme.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Utilitats" color="violet">
                        <p>(1) <strong>Avaluació d'inversions</strong>: taxa de descompte en VAN.</p>
                        <p>(2) <strong>Valoració d'empreses</strong>: DCF (Discounted Cash Flow).</p>
                        <p>(3) <strong>Estructura òptima de capital</strong> (Tema 54).</p>
                        <p>(4) <strong>Creació de valor</strong>: EVA = (ROIC - WACC) × Capital invertit. Una empresa crea valor si ROIC &gt; WACC.</p>
                        <p>(5) <strong>Objectius de rendibilitat</strong> per unitats de negoci.</p>
                    </TheoryBlock>

                    <FormulaBox formula="EVA = (ROIC - WACC) × Capital invertit" desc="Economic Value Added (Stern-Stewart): creació de valor si ROIC > WACC" />
                </Card>

                <Card title="2. Cost del deute (Kd)" icon="💳">
                    <TheoryBlock title="2.1. Definició i càlcul" color="indigo">
                        <p>El <strong>cost del deute</strong> (Kd) és el tipus d'interès efectiu que paga l'empresa pels seus préstecs, obligacions i altres deutes financers. Tres enfocaments:</p>
                        <p><strong>a) Tipus contractual</strong>: TIN o TAE del préstec. Inclou comissions per la TAE.</p>
                        <p><strong>b) Rendibilitat al venciment (YTM)</strong>: en el cas d'obligacions cotitzades. Reflecteix el cost actual.</p>
                        <p><strong>c) Promig ponderat dels deutes</strong>: quan hi ha múltiples fonts.</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.2. Cost efectiu després d'impostos" color="emerald">
                        <p>Com ja es va exposar al Tema 50, els interessos són <strong>deduïbles</strong> de l'Impost de Societats. Per tant, el cost efectiu del deute és:</p>
                    </TheoryBlock>

                    <FormulaBox formula="Kd efectiu = Kd bruto · (1 - t)" desc="Escut fiscal del deute. T = tipus impositiu (25 % general a Espanya)" />

                    <TheoryBlock title="2.3. Exemple numèric" color="amber">
                        <p>Empresa amb préstec de 1.000.000 € al 5 % TIN. Tipus impositiu 25 %.</p>
                        <p>Cost brut: 5 %. Cost efectiu: 5 % × (1 - 0,25) = <strong>3,75 %</strong>. L'escut fiscal estalvia 12.500 € anuals (25 % de 50.000 € d'interessos).</p>
                    </TheoryBlock>

                    <TheoryBlock title="2.4. Factors que afecten Kd" color="rose">
                        <p>(1) <strong>Tipus d'interès lliure de risc</strong>: bons del Tresor.</p>
                        <p>(2) <strong>Spread creditici</strong>: segons rating (Moody's, S&P, Fitch).</p>
                        <p>(3) <strong>Garanties</strong>: hipotecàries redueixen cost.</p>
                        <p>(4) <strong>Termini</strong>: LT normalment més car que CT.</p>
                        <p>(5) <strong>Relació bancària</strong> i volum.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Cost dels recursos propis (Ke)" icon="💼">
                    <TheoryBlock title="3.1. Concepte" color="violet">
                        <p>El <strong>cost dels recursos propis</strong> (Ke) és la rendibilitat mínima exigida pels accionistes. Té una dimensió explícita difícil —no hi ha un contracte amb un tipus d'interès escrit— però és perfectament determinable amb models financers.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Model CAPM (Sharpe 1964)" color="indigo">
                        <p>El <strong>CAPM</strong>, ja presentat al Tema 50, és l'eina més usada per estimar Ke:</p>
                    </TheoryBlock>

                    <FormulaBox formula="Ke = r_f + β · (R_m - r_f)" desc="CAPM. β mesura risc sistemàtic; R_m - r_f és la prima de mercat" />

                    <TheoryBlock title="3.3. Model de Gordon-Shapiro (1959)" color="emerald">
                        <p>Basat en la valoració d'una acció com a suma actualitzada de dividends perpetus amb creixement g:</p>
                        <p>P₀ = D₁ / (Ke - g). Aïllant: <strong>Ke = D₁/P₀ + g</strong>.</p>
                        <p>On D₁ és el dividend esperat al període 1, P₀ el preu actual i g la taxa de creixement sostenible.</p>
                    </TheoryBlock>

                    <FormulaBox formula="Ke = D₁/P₀ + g" desc="Gordon-Shapiro (1959). Model de creixement constant dels dividends" />

                    <TheoryBlock title="3.4. Models alternatius" color="amber">
                        <p><strong>APT</strong> (Ross 1976): múltiples factors de risc.</p>
                        <p><strong>Fama-French 3-factor</strong> (1992): mercat + mida + B/M.</p>
                        <p><strong>Fama-French 5-factor</strong> (2015): + rendibilitat + inversió.</p>
                        <p><strong>Build-up method</strong>: per a empreses no cotitzades. Partir de r_f i afegir primes successives (mercat, mida, sector, empresa específica).</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. El WACC (Weighted Average Cost of Capital)" icon="🧮">
                    <TheoryBlock title="4.1. Fórmula bàsica" color="emerald">
                        <p>El <strong>WACC</strong> és la mitjana ponderada del cost del deute i del cost dels recursos propis, segons les respectives proporcions en l'estructura de capital:</p>
                    </TheoryBlock>

                    <FormulaBox formula="WACC = (E/V) · Ke + (D/V) · Kd · (1-t)" desc="E = equity, D = deute, V = E+D. Hamada / Miller-Modigliani amb impostos" />

                    <TheoryBlock title="4.2. Exemple numèric" color="indigo">
                        <p>Empresa amb estructura: Equity 6 M€, Deute 4 M€. Ke = 10 %, Kd = 4 %, t = 25 %.</p>
                        <p>V = 10 M€. E/V = 0,6. D/V = 0,4.</p>
                        <p>WACC = 0,6 × 10 % + 0,4 × 4 % × 0,75 = 6 % + 1,2 % = <strong>7,2 %</strong>.</p>
                        <p>Interpretació: qualsevol projecte amb rendibilitat esperada &lt; 7,2 % destruirà valor per a l'empresa.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Valors de mercat vs. comptables" color="rose">
                        <p>Principi fonamental: les ponderacions E/V i D/V s'han d'usar a <strong>valors de mercat</strong>, no comptables. El valor comptable de l'equity pot diferir significativament del de mercat (especialment en empreses cotitzades o amb intangibles).</p>
                        <p>Aproximacions: capitalització borsària per a equity; valor de mercat dels bons per al deute (o valor nominal si no cotitzen).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.4. Extensions" color="cyan">
                        <p>• <strong>WACC per divisions</strong>: cada unitat de negoci pot tenir WACC diferent segons risc.</p>
                        <p>• <strong>WACC nominal vs. real</strong>: ajust per inflació (Tema 50).</p>
                        <p>• <strong>WACC marginal</strong>: per a ampliacions de capital.</p>
                        <p>• <strong>WACC internacional</strong>: incorporar risc país.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Palanquejament financer" icon="📈">
                    <TheoryBlock title="5.1. Concepte" color="indigo">
                        <p>El <strong>palanquejament financer</strong> (<em>financial leverage</em>) és l'ús de deute per finançar l'empresa i les seues inversions. Amplifica el rendiment sobre els fons propis (ROE) quan la rendibilitat econòmica (ROI) supera el cost del deute, però també amplifica les pèrdues en cas contrari.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Efecte del palanquejament sobre la rendibilitat financera" color="violet">
                        <p>La relació entre rendibilitat econòmica (ROI) i financera (ROE) ve donada per:</p>
                    </TheoryBlock>

                    <FormulaBox formula="ROE = ROI + (ROI - Kd) · D/E · (1 - t)" desc="Palanquejament financer: amplifica el ROE si ROI > Kd" />

                    <TheoryBlock title="5.3. Interpretació" color="emerald">
                        <p>• Si <strong>ROI &gt; Kd</strong>: el palanquejament amplifica el ROE positivament. «Palanca positiva».</p>
                        <p>• Si <strong>ROI &lt; Kd</strong>: el palanquejament erosiona el ROE. «Palanca negativa».</p>
                        <p>• Si <strong>ROI = Kd</strong>: el palanquejament és neutre.</p>
                        <p><strong>Exemple</strong>: ROI = 10 %, Kd = 4 %, D/E = 1 (50 % deute), t = 25 %. ROE = 10 % + (10 % - 4 %) × 1 × 0,75 = 10 % + 4,5 % = <strong>14,5 %</strong>. El palanquejament puja el ROE de 10 % a 14,5 %.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.4. Grau de palanquejament" color="amber">
                        <p><strong>GAF</strong> (Grau d'Apalancament Financer) = Δ %ROE / Δ %BAII. Mesura la sensibilitat del ROE davant variacions del benefici operatiu. Un GAF alt indica alta sensibilitat i risc.</p>
                        <p>Una empresa amb GAF = 2 veurà el seu ROE pujar un 20 % si el BAII puja un 10 %... o caure un 20 % si el BAII cau un 10 %.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.5. Límits del palanquejament" color="rose">
                        <p>Un excés de deute genera:</p>
                        <p>• <strong>Costos de fallida</strong>: probabilitat d'insolvència i costos associats (legals, operatius, de reputació).</p>
                        <p>• <strong>Restriccions de covenants</strong>: els bancs imposen condicions.</p>
                        <p>• <strong>Pèrdua de flexibilitat</strong>: incapacitat d'aprofitar oportunitats.</p>
                        <p>Aquest equilibri entre escut fiscal i costos de fallida és el fonament de la <strong>teoria del trade-off</strong> desenvolupada al Tema 54.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>El <strong>cost del capital</strong> és la vara de mesurar de qualsevol decisió d'inversió i valoració empresarial. El càlcul del <strong>WACC</strong> integra el cost del deute (amb escut fiscal, <strong>Modigliani-Miller 1963</strong>) i el cost dels recursos propis (estimat via <strong>CAPM de Sharpe 1964</strong> o <strong>Gordon-Shapiro 1959</strong>), ponderats per l'estructura de capital.</p>
                        <p>El <strong>palanquejament financer</strong> amplifica el ROE quan ROI &gt; Kd, però també els riscos. Un ús intel·ligent del deute, aprofitant l'escut fiscal sense comprometre la solvència, és una de les palanques de creació de valor més estudiades en les finances modernes. El concepte de <strong>EVA</strong> (Stern-Stewart) captura de forma elegant aquesta idea: només les inversions amb rendibilitat superior al WACC creen valor. El docent ha de transmetre que els números (Kd, Ke, WACC, ROE) encapsulen decisions estratègiques amb conseqüències profundes sobre la salut i la sostenibilitat empresarial.</p>
                    </div>
                </Card>

        // TEMA 54 — Estructura financera òptima i Modigliani-Miller
        // ════════════════════════════════════════════════════════════════
        const Tema54Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>¿Existeix una estructura financera <strong>òptima</strong> (ratio deute/equity) que maximitzi el valor de l'empresa? Aquesta pregunta ha generat una de les tradicions més fecundes de les finances corporatives, amb dues aportacions seminals: la <strong>tesi tradicional</strong> (en forma de U) i el <strong>teorema de Modigliani-Miller</strong> (1958), que va valdre el Nobel d'Economia als seus autors (M-M, 1985 i 1990).</p>
                        <p>Vinculat a aquesta qüestió, la <strong>política de dividends</strong> —distribuir beneficis o retenir-los— també ha generat un rica literatura. Els casos d'<em>Apple</em> (que durant anys va evitar repartir dividends i els va reprendre el 2012), <em>Microsoft</em> (divisor estable), <em>Inditex</em> (dividend creixent), <em>Telefónica</em> (retallades per desapalancament) il·lustren estratègies diverses.</p>
                        <p>El tema s'estructura en 5 blocs: (1) tesi tradicional; (2) teorema de Modigliani-Miller; (3) teories posteriors (trade-off, pecking order, signaling); (4) política de dividends; (5) aplicacions pràctiques.</p>
                    </div>
                </Card>

                <Card title="1. Tesi tradicional" icon="📊">
                    <TheoryBlock title="1.1. Plantejament" color="amber">
                        <p>La <strong>tesi tradicional</strong> (Durand, 1952; Solomon, 1963) sostenia intuïtivament que:</p>
                        <p>• A mesura que l'empresa incorpora deute (més barat que el capital), el WACC baixa.</p>
                        <p>• A partir d'un determinat nivell, el risc financer percebut eleva Ke i Kd.</p>
                        <p>• Existeix un <strong>nivell òptim</strong> on el WACC és mínim i, per tant, el valor de l'empresa màxim.</p>
                        <p>Gràficament, el WACC té forma de U (o més precisament, J invertida a l'inici). L'estructura òptima és la que minimitza el WACC.</p>
                    </TheoryBlock>

                    <TheoryBlock title="1.2. Crítica" color="red">
                        <p>La tesi tradicional té intuïció però careix de fonamentació rigorosa. Manca justificar per què els inversors no haurien d'exigir, des del primer euro de deute, primes de risc que compensin exactament l'avantatge del cost menor del deute. Aquesta crítica va donar lloc a Modigliani-Miller.</p>
                    </TheoryBlock>
                </Card>

                <Card title="2. Teorema de Modigliani-Miller" icon="🏆">
                    <TheoryBlock title="2.1. MM sense impostos (1958)" color="indigo">
                        <p><strong>Franco Modigliani i Merton Miller</strong>, a «The Cost of Capital, Corporation Finance and the Theory of Investment» (<em>AER</em>, 1958), van demostrar una proposició revolucionària:</p>
                        <p><strong>Proposició I</strong>: En un mercat perfecte i sense impostos, el valor d'una empresa és <strong>independent</strong> de la seua estructura de capital. V_U = V_L.</p>
                        <p><strong>Proposició II</strong>: El cost dels recursos propis (Ke) creix linealment amb el ratio D/E, compensant exactament l'ús de deute més barat. Per tant, el WACC és constant.</p>
                        <p>Ke_L = Ke_U + (Ke_U - Kd) · D/E.</p>
                        <p>Demostració: per arbitratge. Si dues empreses idèntiques tinguessen diferents valors per estructura, un arbitrageur podria comprar la infravalorada, vendre la sobrevalorada i obtenir un benefici sense risc.</p>
                    </TheoryBlock>

                    <FormulaBox formula="V_U = V_L    |    Ke_L = Ke_U + (Ke_U - Kd) · D/E" desc="Modigliani-Miller 1958 sense impostos: irrellevància" />

                    <TheoryBlock title="2.2. MM amb impostos (1963)" color="violet">
                        <p>L'any 1963, Modigliani i Miller van publicar una correcció important incorporant l'impost de societats. Com els interessos són deduïbles, el deute crea valor per l'escut fiscal:</p>
                        <p><strong>V_L = V_U + t · D</strong> (escut fiscal = tipus impositiu × deute).</p>
                        <p>Conclusió extrema: <em>maximitzar el deute</em> (100 %) maximitza el valor. Però aquesta conclusió xoca amb la realitat empírica. Evidentment, altres forces compensen.</p>
                    </TheoryBlock>

                    <FormulaBox formula="V_L = V_U + t · D" desc="Modigliani-Miller 1963 amb impostos: escut fiscal del deute" />

                    <TheoryBlock title="2.3. Supòsits (i crítica)" color="rose">
                        <p>Els supòsits originals de MM: (1) mercats perfectes (sense costos de transacció); (2) informació simètrica; (3) absència de costos de fallida; (4) política de dividends irrellevant; (5) individus i empreses poden prestar/agafar prestat a la mateixa taxa. Cap d'aquests supòsits es compleix a la realitat. El seu valor està en oferir un punt de referència teòric rigorós.</p>
                    </TheoryBlock>
                </Card>

                <Card title="3. Teories posteriors" icon="🔄">
                    <TheoryBlock title="3.1. Trade-off theory (Kraus-Litzenberger 1973)" color="emerald">
                        <p>La <strong>teoria del trade-off</strong> proposa que l'empresa equilibra:</p>
                        <p>• <strong>Beneficis</strong>: escut fiscal del deute (t·D).</p>
                        <p>• <strong>Costos</strong>: costos de fallida esperats, que creixen exponencialment amb el ratio D/E.</p>
                        <p>L'òptim és al punt on el benefici marginal de més deute iguala el cost marginal. V_L = V_U + VP_escut - VP_costos_fallida.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.2. Pecking order theory (Myers-Majluf 1984)" color="indigo">
                        <p><strong>Stewart Myers i Nicholas Majluf</strong> van proposar una teoria alternativa basada en asimetries d'informació: els directius tenen millor informació sobre el valor real de l'empresa que els inversors externs. Això crea una jerarquia de preferències:</p>
                        <p><strong>1. Autofinançament</strong> (finançament interna) — preferit.</p>
                        <p><strong>2. Deute</strong> (cost baix, poca senyalització).</p>
                        <p><strong>3. Accions noves</strong> (el mercat les interpreta com a senyal negatiu de valoració).</p>
                        <p>La jerarquia (<em>pecking order</em>) explica per què empreses rendibles tendeixen a tenir poc deute (es financen amb retencions) i empreses amb poc cash flow s'endeuten més.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.3. Signaling theory (Ross 1977)" color="cyan">
                        <p><strong>Stephen Ross</strong> va formular que l'estructura de capital envia <em>senyals</em> al mercat:</p>
                        <p>• Un alt deute senyalitza confiança dels directius en la capacitat de l'empresa per generar cash flow suficient.</p>
                        <p>• Una ampliació de capital senyalitza que els directius creuen l'acció sobrevalorada.</p>
                        <p>Aquesta teoria explica reaccions empíriques (pujar deute puja preu de l'acció; ampliar capital el baixa) que contradiuen MM pur.</p>
                    </TheoryBlock>

                    <TheoryBlock title="3.4. Teoria de l'agència aplicada a l'estructura (Jensen-Meckling 1976, Jensen 1986)" color="amber">
                        <p>Com es va exposar als Temes 59 i 65, el deute pot <strong>disciplinar</strong> els directius forçant-los a ser eficients (el deute els obliga a pagar interessos regularment, reduint el <em>free cash flow</em> disponible per a projectes subòptims). Alhora, massa deute pot induir comportaments arriscats (<em>risk shifting</em>) a costa dels creditors.</p>
                    </TheoryBlock>
                </Card>

                <Card title="4. Política de dividends" icon="💰">
                    <TheoryBlock title="4.1. Gordon-Shapiro (1959) i la vida eterna" color="emerald">
                        <p>El <strong>model de Gordon-Shapiro</strong>, ja presentat al Tema 53 per calcular Ke, també és el model canònic de valoració d'accions basat en dividends:</p>
                        <p>P₀ = D₁ / (Ke - g), on g és la taxa de creixement sostenible dels dividends.</p>
                        <p>Una política estable de dividends creixents és, en aquest model, l'ideal per maximitzar el preu.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.2. Miller-Modigliani (1961): irrellevància" color="indigo">
                        <p>Modigliani i Miller van estendre la seua teoria a la política de dividends a «Dividend Policy, Growth, and the Valuation of Shares» (<em>J. of Business</em>, 1961). En mercats perfectes, la política de dividends és <strong>irrellevant</strong> per al valor de l'empresa. Si cal diners, l'accionista pot vendre accions («<em>homemade dividends</em>»).</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.3. Lintner (1956): dividends estables" color="violet">
                        <p><strong>John Lintner</strong>, mitjançant entrevistes amb directius, va documentar que les empreses mantenen dividends estables i els ajusten lentament als canvis de beneficis. Model: ΔD_t = a + b · (D_objectiu - D_{t-1}). El ratio de pagament objectiu i la velocitat d'ajust són claus.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.4. Teories modernes de dividends" color="rose">
                        <p><strong>• Bird-in-the-hand</strong> (Gordon 1963, Lintner 1962): els inversors prefereixen dividends certs al creixement incert. Justifica política generosa de dividends.</p>
                        <p><strong>• Efecte clientela</strong>: diferents inversors tenen diferents preferències fiscals per dividends vs. plusvàlues. Empreses atrauen «clientela» consistent amb la seua política.</p>
                        <p><strong>• Senyalització de dividends</strong>: els canvis en dividends transmeten informació. Una pujada és positiva, una retallada negativa (excepte excepcions com Telefónica 2019).</p>
                        <p><strong>• Recompra d'accions (buybacks)</strong>: alternativa flexible al dividend tradicional, amb avantatges fiscals per als accionistes. Molt utilitzada a EUA; més regulada a Europa.</p>
                    </TheoryBlock>

                    <TheoryBlock title="4.5. Fiscalitat dels dividends a Espanya" color="cyan">
                        <p>A Espanya, els dividends tributen com a <strong>renda de l'estalvi</strong> a l'IRPF:</p>
                        <p>• 19 % (fins a 6.000 €).</p>
                        <p>• 21 % (6.000-50.000 €).</p>
                        <p>• 23 % (50.000-200.000 €).</p>
                        <p>• 27 % (200.000-300.000 €).</p>
                        <p>• 28 % (&gt;300.000 €).</p>
                        <p>Existeix la possibilitat d'exempció per a dividends intragrup (amb &gt; 5 % participació, 1 any de tinença), deducció per doble imposició i deducció de 1.500 € en alguns casos (vigent fins 2014). Les empreses tendeixen a preferir la recompra d'accions quan la fiscalitat sobre dividends és alta.</p>
                    </TheoryBlock>
                </Card>

                <Card title="5. Aplicacions pràctiques" icon="🧮">
                    <TheoryBlock title="5.1. Determinants empírics de l'estructura" color="violet">
                        <p>La investigació empírica (Rajan-Zingales 1995, Graham-Harvey 2001) identifica com a determinants significatius:</p>
                        <p>• <strong>Tangibilitat dels actius</strong>: més actius tangibles (garantia) → més deute.</p>
                        <p>• <strong>Rendibilitat</strong>: empreses més rendibles tenen menys deute (pecking order).</p>
                        <p>• <strong>Mida</strong>: empreses grans tenen més accés a mercats de deute.</p>
                        <p>• <strong>Creixement</strong>: més creixement → més intangibles → menys deute.</p>
                        <p>• <strong>Taxa impositiva</strong>: més impostos → més deute (escut fiscal).</p>
                        <p>• <strong>Volatilitat</strong>: més risc operatiu → menys deute (costos fallida).</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.2. Cas espanyol i casos rellevants" color="emerald">
                        <p>Mitjana d'endeutament de les empreses cotitzades espanyoles (IBEX-35): D/E ≈ 0,8-1,2. Les elèctriques (Iberdrola, Endesa) tenen ratios més alts (intensitat de capital i regulació estable); les tecnològiques (IAG, Amadeus) menors.</p>
                        <p><strong>Casos d'estudi</strong>:</p>
                        <p>• <em>Telefónica</em>: desapalancament progressiu 2012-2024 (de &gt; 60.000 M€ a &lt; 30.000 M€).</p>
                        <p>• <em>Abengoa</em>: excessiu palanquejament, concurs 2015, liquidació 2022.</p>
                        <p>• <em>Ferrovial</em>: finançament de projectes d'infraestructures via deute específic de projecte.</p>
                    </TheoryBlock>

                    <TheoryBlock title="5.3. Reptes 2020-2025" color="amber">
                        <p>• <strong>Tipus elevats</strong>: el deute és més car post-2022.</p>
                        <p>• <strong>ESG i deute sostenible</strong>: <em>green bonds</em>, <em>sustainability-linked loans</em>.</p>
                        <p>• <strong>Regulació prudencial</strong>: Basilea III/IV afecta cost del deute bancari.</p>
                        <p>• <strong>Tokenització i DeFi</strong>: noves vies de finançament encara en desenvolupament.</p>
                    </TheoryBlock>
                </Card>

                <Card title="Conclusió" icon="✅">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La qüestió de l'estructura òptima de capital, des de la <strong>tesi tradicional</strong> fins a les reformulacions modernes (<strong>trade-off, pecking order, signaling</strong>), és una de les més fecundes de les finances corporatives. <strong>Modigliani-Miller (1958, 1963)</strong> van oferir el marc teòric de referència que, tot i les seues limitacions, continua sent el punt de partida imprescindible.</p>
                        <p>La política de dividends presenta paral·lelismes: des de la irrellevància teòrica (MM 1961) fins a la rellevància empírica (Lintner 1956, models de senyalització, efecte clientela). La pràctica empresarial és complexa i contextual: no hi ha una resposta universal, però sí criteris rigorosos per decidir. El docent ha de transmetre aquesta doble dimensió: el rigor teòric com a eina d'anàlisi i la capacitat d'interpretar amb sensibilitat el context específic de cada empresa.</p>
                    </div>
                </Card>

        const Tema55Complet = () => (
            <div className="space-y-6 animate-fade">
                <Card title="Introducció" icon="📌">
                    <div className="text-sm text-slate-700 leading-relaxed space-y-3">
                        <p>La <strong>matemàtica financera</strong> proporciona les eines quantitatives per a valorar, comparar i operar amb imports monetaris situats en diferents moments del temps. Amortitzar un préstec, valorar una hipoteca, calcular la pensió futura d'un pla, comparar ofertes financeres: totes aquestes tasques requereixen dominar els sistemes de capitalització i el concepte de <strong>renda financera</strong>.</p>
                        <p>A Espanya, la <strong>Llei 16/2011 de Contractes de Crèdit al Consumidor</strong>, el <strong>RD 84/2015</strong> i la <strong>Llei 5/2019 reguladora dels contractes de crèdit immobiliari</strong> han normativitzat el càlcul de la TAE i la transparència financera, exigint als docents i professionals un domini sòlid d'aquests conceptes.</p>
                        <p>El tema, més tècnic que els anteriors, s'estructura en 5 blocs: (1) sistemes de capitalització; (2) equivalència financera i TAE; (3) rendes: concepte i classificació; (4) valor actual i final de rendes; (5) aplicacions i casos pràctics.</p>
